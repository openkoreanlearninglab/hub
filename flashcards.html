  var GROUPS = {

    beginner:    { ko:'초급',   levels:['A1','A1+','A2'] },
    lowint:      { ko:'초중급', levels:['A2+','B1'] },
    intermediate:{ ko:'중급',   levels:['B1+','B2'] },
    upint:       { ko:'중고급', levels:['B2+','C1'] },
    advanced:    { ko:'고급',   levels:['C1+','C2'] }
  };
  var GROUP_ORDER = ['all','beginner','lowint','intermediate','upint','advanced'];
  var DETAIL = {
    beginner:{ ko:'텍스트북이나 수업에서 기초 문법하고 표현들을 배웠어요. 짧은 동영상을 보면서 기초 문법하고 표현들을 다시 공부해 봐요. 그리고 쉬운 질문에 자기 생각을 한국어로 말해 봐요.' },
    lowint:{ ko:'일상생활 주제의 동영상을 보면서 한국어를 공부해 봐요. 자료에서 배운 표현을 수업에서 바로 써 보고, 번역하지 않고 한국어로 바로 생각해서 말하는 연습을 해 봐요.' },
    intermediate:{ ko:'실제 한국인들이 즐겨 보는 동영상이나 글을 활용해서 한국어를 공부해 봐요. 콘텐츠의 내용을 정확히 이해하는 연습도 하고, 이를 바탕으로 자신의 경험이나 생각을 자연스럽게 한국어로 말하는 연습을 해 봐요.' },
    upint:{ ko:'일상생활 수준의 대화를 넘어 한국어로도 비판적으로 생각하고 말하고 싶어요? 그렇다면 더 깊이 다루며 원어민 콘텐츠를 자신의 생각을 논리적으로 정리해 표현하는 연습을 해 봐요.' },
    advanced:{ ko:'단순히 한국어 자체를 배우는 단계를 넘어, 한국어로 다양한 주제에 대한 글이나 동영상을 비판적으로 분석하고, 자신의 의견을 논리적으로 정리해 말하는 연습을 해 봐요.' }
  };
  var SERIES = { '이 주제로 이야기해 봐요':true, '쉬운 한국어로 이야기해 봐요':true };
  var ITALKI = 'https://www.italki.com/ko/teacher/3553151';
  var ARROW = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>';

  var state = { view:'app', group:'all', level:'all', entryBand:'beginner', page:1, lang:'auto', langOpen:false, q:'', tag:'최신', itemsToShow:12 };
  var app = document.getElementById('app');

  // 게이트 선택 기억: 카드를 고르면 localStorage에 저장하고, 재방문 시 게이트를 건너뛰고 해당 페이지로 바로 진입.
  // 브라우저의 사이트 데이터(쿠키·로컬 저장소)를 삭제하면 다시 게이트가 나타남. 시크릿 모드 등 저장 불가 환경은 try/catch로 무시.
  var CHOICE_KEY = 'okll.gateChoice';
  function saveChoice(v){ try{ localStorage.setItem(CHOICE_KEY, v); }catch(_e){} }
  function loadChoice(){ try{ return localStorage.getItem(CHOICE_KEY); }catch(_e){ return null; } }

  // 보조 언어 결정: null=한국어만, 그 외=언어코드. 'auto'는 브라우저 언어를 따름
  function sec(){
    if(state.lang==='ko') return null;
    if(state.lang!=='auto') return I18N[state.lang] ? state.lang : 'en';
    var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || navigator.userLanguage || ''];
    for(var i=0;i<prefs.length;i++){
      var p = (prefs[i]||'').toLowerCase(); if(!p) continue;
      if(p.indexOf('ko')===0) return null;                 // 한국어 브라우저 → 한국어만
      if(p.indexOf('zh')===0){ if(I18N['zh-Hant'] && /^zh-(tw|hk|mo|hant)/.test(p)) return 'zh-Hant'; if(I18N['zh-Hans']) return 'zh-Hans'; }
      var base = p.split('-')[0];
      if(I18N[base]) return base;
    }
    return I18N['en'] ? 'en' : null;                       // 비한국어 폴백 → 영어
  }
  function tr(key){ var s=sec(); if(!s) return ''; var d=I18N[s]; if(d && d[key]!=null) return d[key]; var e=I18N.en; return (e && e[key]!=null) ? e[key] : ''; }
  function bilingual(){ return sec()!==null; }

  function scopeItems(){
    var g = GROUPS[state.group];
    return MATERIALS.filter(function(m){
      if(g.levels.indexOf(m.level)<0) return false;
      if(state.level!=='all' && m.level!==state.level) return false;
      return true;
    });
  }
  function seriesBadge(m, bi){
    if(!m.series) return '';
    var se = bi ? tr('ser_'+m.series) : '';
    return '<div class="series-badge">'+esc(m.series)+(se ? ' <em>'+esc(se)+'</em>' : '')+'</div>';
  }
  function computeTags(){
    var set = [], ser = [];
    scopeItems().forEach(function(m){ (m.tags||[]).forEach(function(t){ if(set.indexOf(t)<0) set.push(t); }); if(m.series && ser.indexOf(m.series)<0) ser.push(m.series); });
    return ['전체','최신'].concat(ser).concat(set);
  }
  function byDateDesc(a,b){ var da=a.date||'', db=b.date||''; return da===db?0:(da<db?1:-1); }
  function finalItems(){
    var q = state.q.trim().toLowerCase();
    return scopeItems().filter(function(m){
      if(state.tag!=='전체' && state.tag!=='최신'){ if(SERIES[state.tag]){ if(m.series!==state.tag) return false; } else if((m.tags||[]).indexOf(state.tag)<0) return false; }
      if(q){ if((m.title+' '+(m.en||'')+' '+m.tags.join(' ')).toLowerCase().indexOf(q)<0) return false; }
      return true;
    });
  }
  function recentItems(){
    var q = state.q.trim().toLowerCase();
    var pool = scopeItems().filter(function(m){
      if(q && (m.title+' '+(m.en||'')+' '+m.tags.join(' ')).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    pool = pool.slice().sort(byDateDesc);
    return pool.slice(0, state.level === 'all' ? 10 : 5);
  }
  function detailHTML(key, bi){
    var dd = DETAIL[key]; if(!dd) return '';
    return '<div class="detail"><p class="d-ko">'+esc(dd.ko)+'</p>'+(bi?'<p class="d-en">'+esc(tr('d_'+key))+'</p>':'')+'</div>';
  }
  function thumbHTML(m){
    var play = m.type==='video' ? '<span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>' : '';
    var fb = '<div class="thumb-fallback"><span class="fb-lv">'+esc(m.level)+'</span></div>';
    var img = m.thumb ? '<img class="thumb-img" src="'+esc(m.thumb)+'" loading="lazy" referrerpolicy="no-referrer" alt="">' : '';
    return '<div class="thumb'+(m.thumb?'':' noimg')+'">'+img+fb+play+'</div>';
  }
  function moreHTML(total){
    if(total <= state.itemsToShow) return '';
    var label = bilingual() ? '더보기 / '+tr('more') : '더보기';
    return '<div class="more-wrap"><button type="button" id="load-more" class="more-btn">'+label+' <span>('+(total-state.itemsToShow)+')</span></button></div>';
  }
  function cardOf(m, bi){
    var tags = m.tags.map(function(x){ var tt = bi ? tr('tag_'+x) : ''; return '<span class="ctag">'+esc(x)+(tt?' <em>'+esc(tt)+'</em>':'')+'</span>'; }).join('');
    var props = m.link.indexOf('http')===0 ? ' target="_blank" rel="noreferrer"' : '';
    return '<a class="card" href="'+esc(m.link)+'"'+props+'>'
      + thumbHTML(m)
      + '<div class="cbody"><div class="meta"><span class="lv">'+esc(m.level)+'</span>'+seriesBadge(m, bi)+tags+'</div>'
      + '<h3>'+esc(m.title)+'</h3>'+(m.en?'<div class="en">'+esc(m.en)+'</div>':'')+'</div></a>';
  }
  function levelOrder(){
    if(state.group!=='all') return GROUPS[state.group].levels;
    var lead = (GROUPS[state.entryBand]||{}).levels || [];
    var rest = LEVELS.filter(function(l){ return lead.indexOf(l)<0; });
    return lead.concat(rest);
  }
  var PER_PAGE = 10;
  function pagerHTML(pages, cur){
    if(pages<=1) return '';
    var set={}; [1,pages,cur,cur-1,cur+1].forEach(function(n){ if(n>=1&&n<=pages) set[n]=1; });
    var keys=Object.keys(set).map(Number).sort(function(a,b){ return a-b; });
    var h='<button type="button" class="pg-arrow" data-page="'+(cur>1?cur-1:1)+'"'+(cur===1?' disabled':'')+'>‹</button>';
    var prev=0;
    keys.forEach(function(n){ if(prev && n-prev>1) h+='<span class="pg-gap">…</span>'; h+='<button type="button" class="pg-num'+(n===cur?' on':'')+'" data-page="'+n+'">'+n+'</button>'; prev=n; });
    h+='<button type="button" class="pg-arrow" data-page="'+(cur<pages?cur+1:pages)+'"'+(cur===pages?' disabled':'')+'>›</button>';
    return '<div class="pager">'+h+'</div>';
  }
  function listHTML(){
    var bi = bilingual();
    if(state.tag === '최신'){
      var recent = recentItems();
      if(!recent.length) return '<div class="empty">검색 결과가 없습니다.'+(bi?' / '+tr('noresult'):'')+'</div>';
      return '<div class="cards">'+recent.map(function(m){ return cardOf(m, bi); }).join('')+'</div>';
    }
    var order = levelOrder();
    var items = finalItems();
    if(!items.length) return '<div class="empty">검색 결과가 없습니다.'+(bi?' / '+tr('noresult'):'')+'</div>';
    if(state.level!=='all'){
      var sorted = items.slice().sort(byDateDesc);
      var pages = Math.ceil(sorted.length/PER_PAGE);
      if(state.page>pages) state.page = pages||1;
      var start=(state.page-1)*PER_PAGE;
      var pcards = sorted.slice(start, start+PER_PAGE).map(function(m){ return cardOf(m, bi); }).join('');
      return '<div class="cards">'+pcards+'</div>'+pagerHTML(pages, state.page);
    }
    var ordered = items.slice().sort(function(a,b){ return order.indexOf(a.level)-order.indexOf(b.level); });
    var shown = ordered.slice(0, state.itemsToShow);
    var out = order.map(function(lv){
      var rows = shown.filter(function(m){ return m.level===lv; }).sort(byDateDesc);
      if(!rows.length) return '';
      var cards = rows.map(function(m){ return cardOf(m, bi); }).join('');
      return '<div class="divider"><span class="lvcode">'+esc(lv)+'</span>'
        + '<span class="lvname">'+esc(LV_NAME[lv])+'</span><span class="ln"></span></div>'
        + '<div class="cards">'+cards+'</div>';
    }).join('');
    return out + moreHTML(items.length);
  }
  function langMenuHTML(){
    var opts = [{v:'auto',l:'자동 · Auto'},{v:'ko',l:'한국어'}].concat(Object.keys(I18N).map(function(k){ return {v:k, l:(LANG_NAMES[k]||k)}; }));
    var menu = state.langOpen ? '<div class="lang-menu" id="lang-menu">'
      + opts.map(function(o){ return '<button type="button" data-setlang="'+esc(o.v)+'" class="'+(state.lang===o.v?'on':'')+'">'+esc(o.l)+'</button>'; }).join('')
      + '</div>' : '';
    return '<div class="lang" id="lang"><button type="button" class="lang-btn" id="lang-btn" aria-haspopup="true" title="언어 / Language">Language <span class="chev">▾</span></button>'+menu+'</div>';
  }

  var GATE_BANDS = {
    beginner:    { ko:'초급',   en:'Beginner',           code:'A1 – A2' },
    lowint:      { ko:'초중급', en:'Lower-Intermediate', code:'A2+ – B1' },
    intermediate:{ ko:'중급',   en:'Intermediate',       code:'B1+ – B2' },
    upint:       { ko:'중고급', en:'Upper-Intermediate', code:'B2+ – C1' },
    advanced:    { ko:'고급',   en:'Advanced',           code:'C1+ – C2' }
  };
  var italkiBtn = '<a class="italki" href="'+ITALKI+'" target="_blank" rel="noopener noreferrer">Visit Sangbin\'s italki profile '+ARROW+'</a>';
  function gateHTML(){
    var cards = Object.keys(GATE_BANDS).map(function(key){
      var b = GATE_BANDS[key];
      return '<div class="band" data-band="'+esc(key)+'">'
        + '<div class="code">'+esc(b.code)+'</div>'
        + '<div class="ko">'+esc(b.ko)+'</div>'
        + '<div class="en">'+esc(b.en)+'</div>'
        + '<div class="go">자료 보기<br><span class="go-en">Explore materials →</span></div></div>';
    }).join('');
    return '<div class="gate"><div class="wrap">'
      + '<div class="gate-header">'
      + '<div class="gate-brand" data-enter="all">OpenKoreanLearningLab</div>'
      + '<h1 data-enter="all">한국어 학습 자료</h1>'
      + '<div class="sub-en">Korean Learning Materials</div>'
      + '<div class="sub-instruction">레벨을 선택하세요<br>Choose your level</div>'
      + '</div>'
      + '<div class="bands">'+cards+'</div>'
      + '<div class="gate-cta">'+italkiBtn+'</div>'
      + '<div class="gate-foot">© 2025–2026 Sangbin Lee (OpenKoreanLearningLab)</div>'
      + '</div></div>';
  }
  function groupSelectHTML(){
    var bi=bilingual();
    return '<select class="nav-select" data-navsel="group" aria-label="레벨대">'
      + GROUP_ORDER.map(function(key){ var lab=GROUPS[key].ko+(bi?' / '+tr('g_'+key):''); return '<option value="'+esc(key)+'"'+(state.group===key?' selected':'')+'>'+esc(lab)+'</option>'; }).join('')
      + '</select>';
  }
  function levelSelectHTML(){
    var bi=bilingual(), g=GROUPS[state.group];
    return '<select class="nav-select" data-navsel="level" aria-label="레벨">'
      + ['all'].concat(g.levels).map(function(lv){ var lab=lv==='all'?(bi?'전체 / All':'전체'):lv; return '<option value="'+esc(lv)+'"'+(state.level===lv?' selected':'')+'>'+esc(lab)+'</option>'; }).join('')
      + '</select>';
  }
  function tagSelectHTML(){
    var bi=bilingual();
    return '<select class="nav-select" data-navsel="tag" aria-label="주제">'
      + computeTags().map(function(tag){ var tt=tr('tag_'+tag); var lab=(bi&&tt)?(tag+' / '+tt):tag; return '<option value="'+esc(tag)+'"'+(state.tag===tag?' selected':'')+'>'+esc(lab)+'</option>'; }).join('')
      + '</select>';
  }
  function render(){

    if(state.view==='gate'){ app.innerHTML = gateHTML(); return; }
    var g = GROUPS[state.group], bi = bilingual();
    var groupTabs = GROUP_ORDER.map(function(key){
      var gg = GROUPS[key], on = state.group===key?' on':'';
      return '<button class="'+on.trim()+'" data-group="'+esc(key)+'">'+esc(gg.ko)+(bi?'<span class="en">'+esc(tr('g_'+key))+'</span>':'')+'</button>';
    }).join('');
    var chips = ['all'].concat(g.levels).map(function(lv){
      var on = state.level===lv?' on':'';
      var label = lv==='all' ? (bi?('전체 '+tr('all')):'전체') : lv;
      return '<button class="chip'+on+'" data-level="'+esc(lv)+'">'+esc(label)+'</button>';
    }).join('');
    var tagBtns = computeTags().map(function(tag){
      var on = state.tag===tag?' on':'';
      var tt = tr('tag_'+tag);
      var label = (bi && tt) ? '<span class="tko">'+esc(tag)+'</span><span class="ten">'+esc(tt)+'</span>' : esc(tag);
      return '<button class="tag-btn'+(bi?' bi':'')+on+'" data-tag="'+esc(tag)+'">'+label+'</button>';
    }).join('');
    var heroKo = g.ko==='전체' ? '한국어 학습 자료' : (g.ko+' 학습 자료');
    var ph = bi ? ('제목·태그 검색 / '+tr('search')) : '제목·태그 검색…';

    app.innerHTML =
      '<div class="topbar"><div class="wrap"><div class="row">'
      + '<a href="#" class="brand" data-home="1">OpenKoreanLearningLab</a>'
      + langMenuHTML()
      + '</div></div></div>'
      + '<div class="wrap">'
      + '<div class="hero"><span class="badge">'+esc(g.ko)+(bi?' · '+esc(tr('g_'+state.group)):'')+'</span>'
      + '<h1>'+esc(heroKo)+'</h1>'+(bi?'<div class="sub">'+esc(tr('t_'+state.group))+'</div>':'')
      + (state.group==='all' ? '<div class="hero-desc">'+esc(g.desc)+(bi?'<em>'+esc(tr('d_all'))+'</em>':'')+'</div>' : detailHTML(state.group, bi))
      + '<div class="groups">'+groupTabs+'</div><div class="nav-sel nav-sel-group">'+groupSelectHTML()+'</div></div>'
      + '<div class="controls">'
      + '<div class="search"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>'
      + '<input id="search" type="text" placeholder="'+esc(ph)+'" value="'+esc(state.q)+'" /></div>'
      + '<div class="chips">'+chips+'</div></div><div class="nav-sel nav-sel-level">'+levelSelectHTML()+'</div>'
      + '<div class="tags">'+tagBtns+'</div><div class="nav-sel nav-sel-tag">'+tagSelectHTML()+'</div>'
      + '<div class="pad" id="list">'+listHTML()+'</div>'
      + '</div>'
      + '<footer><a class="italki" href="'+ITALKI+'" target="_blank" rel="noopener noreferrer">Visit Sangbin\'s italki profile '+ARROW+'</a>'
      + '<div class="copy">© 2025–2026 Sangbin Lee (OpenKoreanLearningLab)</div></footer>';

    var inp = document.getElementById('search');
    if(inp && state.q){ inp.focus(); inp.setSelectionRange(state.q.length, state.q.length); }
  }

  app.addEventListener('click', function(e){
    var band = e.target.closest('[data-band]');
    if(band){ var bd=band.getAttribute('data-band'); saveChoice(bd); state.entryBand=bd; state.group=bd; state.view='app'; state.level='all'; state.tag='전체'; state.q=''; state.page=1; state.itemsToShow=12; window.scrollTo(0,0); render(); return; }
    var home = e.target.closest('[data-home]');
    if(home){ window.location.href='index-flashcard-gate.html'; return; }
    var ent = e.target.closest('[data-enter]');
    if(ent){ saveChoice('all'); state.view='app'; state.group='all'; state.level='all'; state.tag='최신'; state.page=1; state.itemsToShow=12; window.scrollTo(0,0); render(); return; }
    var setlang = e.target.closest('[data-setlang]');
    if(setlang){ state.lang = setlang.getAttribute('data-setlang'); state.langOpen=false; render(); return; }
    var langbtn = e.target.closest('#lang-btn');
    if(langbtn){ state.langOpen = !state.langOpen; render(); return; }
    var wasOpen = state.langOpen; state.langOpen = false;
    var grp = e.target.closest('[data-group]');
    if(grp){ state.group = grp.getAttribute('data-group'); state.level='all'; state.tag='전체'; state.page=1; state.itemsToShow=12; render(); return; }
    var lv = e.target.closest('[data-level]');
    if(lv){ state.level = lv.getAttribute('data-level'); state.tag='전체'; state.page=1; state.itemsToShow=12; render(); return; }
    var tg = e.target.closest('[data-tag]');
    if(tg){ state.tag = tg.getAttribute('data-tag'); state.page=1; state.itemsToShow=12; render(); return; }
    var more = e.target.closest('#load-more');
    if(more){ state.itemsToShow+=12; var le=document.getElementById('list'); if(le) le.innerHTML=listHTML(); return; }
    var pg = e.target.closest('[data-page]');
    if(pg){ var pn=parseInt(pg.getAttribute('data-page'),10); if(pn){ state.page=pn; var pe=document.getElementById('list'); if(pe){ pe.innerHTML=listHTML(); try{ pe.scrollIntoView(); }catch(_e){} } } return; }
    if(wasOpen) render();
  });
  app.addEventListener('input', function(e){
    if(e.target.id==='search'){
      state.q = e.target.value; state.page=1; state.itemsToShow=12;
      var listEl = document.getElementById('list');
      if(listEl) listEl.innerHTML = listHTML();
    }
  });
  app.addEventListener('change', function(e){
    var ns = e.target.getAttribute && e.target.getAttribute('data-navsel');
    if(!ns) return;
    var v = e.target.value;
    if(ns==='group'){ state.group=v; state.level='all'; state.tag='전체'; }
    else if(ns==='level'){ state.level=v; state.tag='전체'; }
    else if(ns==='tag'){ state.tag=v; }
    state.page=1; state.itemsToShow=12; render();
  });
  app.addEventListener('error', function(e){
    var t = e.target;
    if(t && t.classList && t.classList.contains('thumb-img')){ var p=t.parentNode; if(p) p.classList.add('noimg'); }
  }, true);

  // 첫 진입: 저장된 게이트 선택이 있으면 게이트를 건너뛰고 해당 화면으로 (카드 클릭과 동일한 상태로 진입)
  (function(){
    var saved = loadChoice();
    if(saved==='all'){ state.view='app'; state.group='all'; state.level='all'; state.tag='최신'; }
    else if(saved && GATE_BANDS[saved]){ state.view='app'; state.entryBand=saved; state.group=saved; state.level='all'; state.tag='전체'; }
  })();
