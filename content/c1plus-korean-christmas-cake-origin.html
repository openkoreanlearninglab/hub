    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            { id: 's61', speaker: '민호', kor: '전통적인 것과 서구적인 것의 결합.', time: [267.601, 270.233], eng: 'The combination of the traditional and the Western.' },
            { id: 's62', speaker: '민호', kor: '그런데 여전히 궁금한 점이 있어요.', time: [270.468, 272.468], eng: 'But I still have a question.' },
            { id: 's63', speaker: '민호', kor: '크리스마스는 한겨울인데 1920년대에 어떻게 딸기를 구했을까요?', time: [272.868, 277.834], eng: 'Christmas is in midwinter, how did they get strawberries in the 1920s?' },
            { id: 's64', speaker: '민호', kor: '지금도 겨울 딸기는 비싸잖아요.', time: [277.968, 280.434], eng: 'Even now, winter strawberries are expensive.' },
            { id: 's65', speaker: '유나', kor: '바로 그게 핵심이에요.', time: [280.600, 282.000], eng: 'That is exactly the point.' },
            { id: 's66', speaker: '유나', kor: '당시로써는 최첨단 기술인 온실 재배가 있어야만 겨울에 딸기를 생산할 수 있었죠.', time: [282.067, 287.700], eng: 'At the time, winter strawberries could only be produced with greenhouse cultivation, which was cutting-edge technology.' },
            { id: 's67', speaker: '민호', kor: '아~!', time: [287.801, 288.501], eng: 'Ah~!' },
            { id: 's68', speaker: '유나', kor: '즉, 이 케이크 위에 올라간 겨울 딸기는 단순한 과일이 아니라, 우리는 서양처럼 이런 것도 할 수 있다는 기술적 근대성을 과시하는 상징이었던 거예요.', time: [288.700, 299.256], eng: 'In other words, the winter strawberries on this cake were not just fruit, but a symbol showing off technological modernity, saying "we can do this like the West".' },
            { id: 's69', speaker: '민호', kor: '부와 기술의 징표였던 셈이네요.', time: [299.334, 301.601], eng: 'It was a mark of wealth and technology.' },
            { id: 's70', speaker: '민호', kor: '아무나 흉내 낼 수 없는.', time: [301.634, 303.267], eng: 'Something no one could imitate.' },
            { id: 's71', speaker: '유나', kor: '맞아요. 먹음직스러운 케이크가 실은 당시 일본 사회의 욕망과 기술력을 집약해서 보여주는 상징물이었던 셈이죠.', time: [303.334, 311.134], eng: 'That\'s right. The delicious cake was actually a symbol that concentrated the desires and technological power of Japanese society at the time.' },
            { id: 's72', speaker: '유나', kor: '긴자의 부유층만이 누릴 수 있는 아주 특별한 경험이었겠어요.', time: [311.147, 315.701], eng: 'It must have been a very special experience that only the wealthy in Ginza could enjoy.' },
            { id: 's73', speaker: '민호', kor: '그렇죠. 그런데 이 특별한 경험이 어떻게 일본 전역의 평범한 사람들이 공유하는 보편적인 문화가 될 수 있었을까요?', time: [315.734, 323.056], eng: 'Right. But how did this special experience become a universal culture shared by ordinary people all over Japan?' },
            { id: 's74', speaker: '유나', kor: '아무래도 기술의 발전과 경제 성장이 뒷받침되어야 했겠죠.', time: [323.134, 327.101], eng: 'Technological development and economic growth must have supported it.' },
            { id: 's75', speaker: '민호', kor: '네, 욕망은 이미 만들어졌으니 그걸 실현할 수단이 필요했을 테니까요.', time: [327.134, 331.541], eng: 'Yes, since the desire was already created, means to realize it were needed.' },
            { id: 's76', speaker: '유나', kor: '정확해요. 두 가지 결정적인 조건이 충족되어야 했어요.', time: [331.701, 335.460], eng: 'Exactly. Two decisive conditions had to be met.' },
            { id: 's77', speaker: '유나', kor: '첫 번째는 기술의 발전, 바로 냉장 쇼케이스의 등장이었습니다.', time: [335.734, 340.303], eng: 'The first was technological development, the emergence of the refrigerated showcase.' },
            { id: 's78', speaker: '민호', kor: '아 냉장 기술이요.', time: [340.334, 342.000], eng: 'Ah, refrigeration technology.' },
            { id: 's79', speaker: '유나', kor: '네, 1950년대에 이게 발명되면서 신선도가 생명인 생크림 케이크를 상할 걱정 없이 대량으로 진열하고 판매할 수 있게 된 거죠.', time: [342.034, 352.413], eng: 'Yes, with its invention in the 1950s, whipped cream cakes, where freshness is vital, could be displayed and sold in large quantities without worrying about spoiling.' },
            { id: 's80', speaker: '민호', kor: '생각해보니 정말 결정적이네요.', time: [352.734, 355.067], eng: 'Thinking about it, it\'s really decisive.' },
            { id: 's81', speaker: '민호', kor: '그게 없으면, 생크림 케이크는 동네 빵집에서 주문 제작하는 것 외에는 방법이 없었을 테니까요.', time: [355.167, 360.986], eng: 'Without it, there would have been no way other than ordering custom-made whipped cream cakes at local bakeries.' },
            { id: 's82', speaker: '민호', kor: '대량 생산과 유통의 전제 조건이 마련된 거군요.', time: [361.334, 364.089], eng: 'The prerequisites for mass production and distribution were established.' },
            { id: 's83', speaker: '유나', kor: '그렇죠. 그리고 두 번째는 경제적 조건입니다.', time: [364.122, 367.768], eng: 'Right. And the second is economic conditions.' },
            { id: 's84', speaker: '유나', kor: '1960년대 일본이 전후 경제 호황기를 맞으면서 탄탄한 중산층이 형성되고 사람들의 소비력이 폭발적으로 커졌어요.', time: [367.901, 377.132], eng: 'As Japan entered the post-war economic boom in the 1960s, a solid middle class was formed and people\'s purchasing power exploded.' },
            { id: 's85', speaker: '민호', kor: '아, 살 수 있는 사람들이 많아졌다는 거군요.', time: [377.301, 379.634], eng: 'Ah, so more people could buy it.' },
            { id: 's86', speaker: '유나', kor: '네, 덕분에 크리스마스 케이크는 더 이상 소수의 사치품이 아니라, 우리 집도 이 정도는 즐길 수 있다는 중산층의 상징적인 소비재로 자리 잡게 됩니다.', time: [379.668, 389.501], eng: 'Yes, thanks to that, Christmas cake was no longer a luxury for the few, but established itself as a symbolic consumer good of the middle class, saying "our family can enjoy this much".' },
            { id: 's87', speaker: '민호', kor: '욕망의 탄생, 기술의 보급, 그리고 경제력의 확대.', time: [389.601, 393.868], eng: 'Birth of desire, spread of technology, and expansion of economic power.' },
            { id: 's88', speaker: '민호', kor: '이 세 박자가 완벽하게 맞아떨어진 결과군요.', time: [394.134, 396.468], eng: 'It\'s the result of these three factors fitting together perfectly.' },
            { id: 's89', speaker: '유나', kor: '맞습니다. 일본이라는 나라 안에서 하나의 문화가 탄생하고 정착하는 과정이 명확하게 보이네요.', time: [396.500, 403.367], eng: 'Correct. The process of a culture being born and settled within the country of Japan is clearly visible.' },
            { id: 's90', speaker: '민호', kor: '자, 이렇게 일본에서 하나의 전통이 완성되었어요.', time: [403.568, 406.568], eng: 'So, a tradition was completed in Japan like this.' },
            { id: 's91', speaker: '민호', kor: '그럼 이제 이 문화가 어떻게 바다를 건너 한국으로 넘어왔을까요?', time: [406.868, 410.526], eng: 'Then how did this culture cross the sea to Korea?' },
            { id: 's92', speaker: '유나', kor: '여기서부터는 정말 흩어진 퍼즐 조각들을 세심하게 맞춰야 합니다.', time: [410.634, 414.468], eng: 'From here on, we really have to carefully piece together scattered puzzle pieces.' },
            { id: 's93', speaker: '유나', kor: '명확한 기록이 없기 때문에 각 사료는 그 시점에 이런 현상이 존재했다는 \'존재 증거\'로만 봐주시면 좋겠어요.', time: [414.634, 422.301], eng: 'Since there are no clear records, please look at each historical material only as \'evidence of existence\' that such a phenomenon existed at that time.' },
            { id: 's94', speaker: '민호', kor: '좋습니다. 가장 오래던 증거는 언제 발견되나요?', time: [422.367, 425.901], eng: 'Good. When is the oldest evidence found?' },
            { id: 's95', speaker: '유나', kor: '가장 오래된 조각은 1897년으로 거슬러 올라가요.', time: [425.968, 429.834], eng: 'The oldest piece goes back to 1897.' },
            { id: 's96', speaker: '유나', kor: '유진 벨(Eugene Bell)이라는 미국인 선교사가 고향에 보낸 편지인데요.', time: [429.901, 434.134], eng: 'It\'s a letter sent by an American missionary named Eugene Bell to his hometown.' },
            { id: 's97', speaker: '민호', kor: '1900세기 말이네요.', time: [434.234, 435.701], eng: 'It\'s the end of the 19th century.' },
            { id: 's98', speaker: '유나', kor: '네, 크리스마스 저녁 식사 메뉴를 아주 상세히 적어놨어요.', time: [435.734, 439.834], eng: 'Yes, he wrote down the Christmas dinner menu in great detail.' },
            { id: 's99', speaker: '유나', kor: '거위 요리, 샐러드와 함께 초코 케이크와 과일 케이크, 그리고 일본산 오렌지를 먹었다는 기록이 있어요.', time: [439.901, 447.567], eng: 'There is a record that they ate goose, salad, chocolate cake, fruit cake, and Japanese oranges.' },
            { id: 's100', speaker: '민호', kor: '와, 19세기 말에 이미 한반도에서 크리스마스에 케이크를 먹고 있었군요.', time: [447.668, 453.226], eng: 'Wow, they were already eating cake on Christmas on the Korean peninsula in the late 19th century.' },
            { id: 's101', speaker: '민호', kor: '물론 우리가 아는 그 케이크는 아니지만, 크리스마스에는 케이크라는 공식의 씨앗은 이미 뿌려져 있었다고 볼 수 있겠네요.', time: [453.367, 461.601], eng: 'Of course, it\'s not the cake we know, but we can see that the seeds of the formula "Christmas means cake" were already sown.' },
            { id: 's102', speaker: '유나', kor: '그렇죠. 하지만 이건 선교사라는 특정 집단 내부의 문화였겠죠.', time: [461.801, 466.768], eng: 'Right. But this was likely a culture within the specific group of missionaries.' },
            { id: 's103', speaker: '민호', kor: '맞아요. 그럼 이게 어떻게 한국 사회로 퍼져나갔을까요?', time: [466.935, 470.434], eng: 'Right. Then how did this spread to Korean society?' },
            { id: 's104', speaker: '유나', kor: '그 단서를 1930년대의 여러 목소리들에서 찾을 수 있어요.', time: [470.534, 474.934], eng: 'We can find clues in various voices from the 1930s.' },
            { id: 's105', speaker: '유나', kor: '이 시기가 되면 크리스마스가 더 이상 종교 영역에만 머물지 않고, 하나의 사회 현상이 되었음을 보여주는 증거들이 나타나기 시작합니다.', time: [475.101, 483.868], eng: 'By this time, evidence begins to appear showing that Christmas no longer stayed in the religious realm but became a social phenomenon.' },
            { id: 's106', speaker: '민호', kor: '1930년대면 일제강점기인데 어떤 목소리들이 있었죠?', time: [483.958, 488.768], eng: 'The 1930s was the Japanese colonial period, what kind of voices were there?' },
            { id: 's107', speaker: '유나', kor: '첫 번째 증거는 1930년 불교계에 우려 섞인 목소리예요.', time: [488.834, 493.134], eng: 'The first evidence is a concerned voice from the Buddhist community in 1930.' },
            { id: 's108', speaker: '유나', kor: '신문에 크리스마스가 부처님 오신 날보다 인기가 많다는 불평이 실릴 정도였죠.', time: [493.167, 498.834], eng: 'There were even complaints in newspapers that Christmas was more popular than Buddha\'s Birthday.' },
            { id: 's109', speaker: '민호', kor: '와! 불교계에서 공식적으로 반응할 정도였다면, 크리스마스가 이미 기독교인들만의 행사가 아니라 대중적으로 상당히 확산되고 있었다는 강력한 방증이 되겠네요.', time: [498.901, 509.167], eng: 'Wow! If the Buddhist community officially responded, it would be strong corroboration that Christmas was already spreading widely to the public, not just as an event for Christians.' },
            { id: 's110', speaker: '유나', kor: '바로 그거죠.', time: [509.201, 510.000], eng: 'Exactly.' },
            { id: 's111', speaker: '유나', kor: '두 번째 증거는 1933년 지식인 윤치호의 일기입니다.', time: [510.201, 514.601], eng: 'The second evidence is the diary of intellectual Yun Chi-ho from 1933.' },
            { id: 's112', speaker: '유나', kor: '그는 여성들이 크리스마스를 쇼핑의 핑계로 삼는다고 비판적인 시각으로 기록했어요.', time: [514.834, 520.267], eng: 'He recorded with a critical view that women use Christmas as an excuse for shopping.' },
            { id: 's113', speaker: '민호', kor: '상업화가 진행되고 있었다는 뜻이군요.', time: [520.367, 522.501], eng: 'It means commercialization was progressing.' },
            { id: 's114', speaker: '유나', kor: '네, 그리고 1936년 매일신보 기사에서는 아예 크리스마스가 기독교인에게서 상인에게로 넘어갔다고 풍자하기도 합니다.', time: [522.534, 531.234], eng: 'Yes, and a 1936 article in Maeil Sinbo even satirized that Christmas had passed from Christians to merchants.' },
            { id: 's115', speaker: '민호', kor: '다들 상당히 비판적인 목소리들이네요.', time: [531.300, 533.768], eng: 'They are all quite critical voices.' },
            { id: 's116', speaker: '유나', kor: '그렇죠? 그런데 이 비판들이 역설적으로 무엇을 증명하는 걸까요?', time: [533.868, 538.560], eng: 'Right? But what do these criticisms paradoxically prove?' },
            { id: 's117', speaker: '민호', kor: '음...비판의 대상이 될 만큼 이미 크리스마스라는 문화가 사회에 깊숙이 퍼져 있었다는 뜻이 아닐까요?', time: [538.634, 545.801], eng: 'Hmm... Doesn\'t it mean that the culture of Christmas was already deeply spread in society enough to be a target of criticism?' },
            { id: 's118', speaker: '유나', kor: '정확해요.', time: [545.868, 546.601], eng: 'Exactly.' },
            { id: 's119', speaker: '유나', kor: '비판은 그 현상의 확산을 가장 확실하게 증명하는 증거가 되기도 하죠.', time: [546.801, 551.668], eng: 'Criticism can be the surest evidence proving the spread of the phenomenon.' },
            { id: 's120', speaker: '유나', kor: '여기서 역사학자 에릭 홉스봄(Eric Hobsbawm)이 말한 ‘만들어진 전통’이라는 개념을 떠올려 보면 아주 흥미로워요.', time: [551.868, 558.543], eng: 'Here, it\'s very interesting to recall the concept of \'invented tradition\' by historian Eric Hobsbawm.' },
            { id: 's121', speaker: '민호', kor: '우리가 아주 오래되었다고 믿는 전통 중 상당수가 사실은 비교적 최근에 특정 목적을 위해 만들어진 것이라고 주장하는 그 개념이요?', time: [558.576, 568.067], eng: 'The concept that claims many of the traditions we believe to be very old were actually created relatively recently for specific purposes?' },
            { id: 's122', speaker: '유나', kor: '맞습니다.', time: [568.134, 568.935], eng: 'That\'s correct.' },
            { id: 's123', speaker: '유나', kor: '크리스마스 문화의 확산도 그와 비슷한 맥락으로 볼 수 있어요.', time: [569.167, 573.000], eng: 'The spread of Christmas culture can be seen in a similar context.' },
            { id: 's124', speaker: '유나', kor: '종교적 의미로 시작된 의례가 제조업자나 상인들의 상업적 이해관계와 맞물리면서 훨씬 더 빠르고 넓게 그리고 세속적인 형태로 확산되는 과정을 보여주는 거죠.', time: [573.334, 583.901], eng: 'It shows the process where a ritual started with religious meaning interlocks with the commercial interests of manufacturers or merchants, spreading much faster, wider, and in a secular form.' },
            { id: 's125', speaker: '민호', kor: '1930년대의 비판들이 바로 그 과정을 생생하게 증언하고 있는 셈이군요.', time: [584.034, 588.834], eng: 'The criticisms of the 1930s are vividly testifying to that process.' },
            { id: 's126', speaker: '유나', kor: '그렇죠. 그렇다면 우리가 찾는 딸기 생크림 케이크, 즉 크리스마스 케이크라는 구체적인 단어는 대체 언제 처음으로 등장할까요?', time: [588.935, 598.801], eng: 'Right. Then when does the specific word strawberry whipped cream cake, or Christmas cake, first appear?' },
            { id: 's127', speaker: '민호', kor: '드디어 그 단어가 나오는군요.', time: [598.868, 600.634], eng: 'Finally that word comes out.' },
            { id: 's128', speaker: '유나', kor: '네, 현재까지 확인된 바로는 1952년 12월 21일자, 동아일보 기사에서 처음 등장해요.', time: [600.701, 608.101], eng: 'Yes, as far as confirmed, it first appears in a Dong-A Ilbo article on December 21, 1952.' },
            { id: 's129', speaker: '유나', kor: '그런데 그 내용이 정말 드라마틱합니다.', time: [608.534, 611.134], eng: 'But the content is really dramatic.' },
            { id: 's130', speaker: '민호', kor: '1952년이면 한국전쟁이 한창일 때잖아요.', time: [611.201, 615.034], eng: '1952 was when the Korean War was in full swing.' },
            { id: 's131', speaker: '민호', kor: '그런 상황에서 케이크라니 상상이 잘 안 되는데요.', time: [615.201, 618.367], eng: 'I can\'t really imagine cake in such a situation.' },
            { id: 's132', speaker: '유나', kor: '바로 그 점이 이 증거를 결정적으로 만들어요.', time: [618.617, 621.784], eng: 'That very point makes this evidence decisive.' },
            { id: 's133', speaker: '유나', kor: '기사의 논조는 당연히 비판적입니다.', time: [621.784, 624.701], eng: 'The tone of the article is naturally critical.' },

        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 이벤트 위임 (#app 1회) ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const tab = app.activeTab;

            if (tab === 'video') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = VIDEO_SCRIPT_DATA.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans = learn.sbTrans || {}; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }
                    else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); }
                    else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); }
                }
                return;
            }
            if (tab === 'vocab') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, !cur); }
                return;
            }
            if (tab === 'quiz') {
                const tb = e.target.closest('[data-action="q-trans"]'); if (tb) { const qEl = tb.closest('.quiz-q'); const qid = +qEl.dataset.qid; const st = quizState.q[qid]; st.trans = !st.trans; rerenderQuizQ(qid); return; }
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const ok = st.input.trim() === (quiz.answer||quiz.correct_word); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = (quiz.answer||quiz.correct_word); st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        // video: 어휘 호버 팝업
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        // keyboard (video)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < VIDEO_SCRIPT_DATA.length && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[ni].time[0], true); learn.player.playVideo(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.error = null; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id);
            const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다. 학습자 답변을 분석하고 JSON으로만 답하세요. 순수 JSON만 반환하세요.\n[질문]: ${item.questionKor}\n[학습자 답변]: ${st.text}\n[포맷]: {"overallPraise":"","overallPraiseTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const data = await callGeminiWithBackoff(payload); let txt = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text; if (!txt) throw new Error('응답이 비어있습니다.'); txt = txt.replace(/^```json\n?/, '').replace(/\n?```$/, ''); st.feedback = JSON.parse(txt); }
            catch (err) { st.error = err.message; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 시작 ----------
        buildApp();
    })();
    </script>
</body>
