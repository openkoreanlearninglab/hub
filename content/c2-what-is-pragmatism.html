    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}

    <script>
    (function () {

        var fontCss = document.getElementById('font-css');
        if (fontCss) fontCss.media = 'all';

        /* =====================================================================
           </> TEMPLATE — C — reading   (배포용 아님 / NOT for deployment)
           순수 바닐라 JS 학습자료 베이스. 새 자료는 아래 데이터 배열만 교체:
           READING_DATA · VOCAB_READING_DATA · QUIZ_LIST · DISCUSS_DATA
           + 홈/차트의 [대괄호] 플레이스홀더 문구.
           ===================================================================== */

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };
        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["시사", "정치"];
        const HOME_SERIES_BADGE = "";
        const READING_DATA = [{"id": 1, "title": "제대로 된 실용주의를 바라며", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c2-what-is-pragmatism.webp", "subtitle": "[오피니언] 김태일 · 고려대 행정학과 교수", "source": "https://www.khan.co.kr/article/202507032112005", "content": [{"text": "2025년 6월 4일 취임한 이재명 대통령은 취임식에서 \"실용적 시장주의 정부\"와 \"국익 중심의 실용외교\"를 정책의 방향으로 제시했는데, 이때 \"실용\"은 무엇을 말하는 것일까요? 다음 두 텍스트를 통해 \"실용\"의 의미를 살펴보세요."}, {"text": "이재명 정부가 출범하고 한 달이 지난 지금, 국민의 평가는 대체로 긍정적이다. 대선에서 이재명 대통령을 찍었던 사람뿐만 아니라 다른 후보를 찍었던 사람 중에도 상당수가 호의적이다. 가장 큰 이유는 대선 때 내세운 실용주의에 부합하는 행보를 보이고 있다는 판단 때문일 것이다. 취임 후 첫 외교·안보 대응에서 보수층이 안심할 만한 입장을 취한 것, 대통령실과 내각 인선에서 경험과 능력을 중시한 것 등이 그렇다. 물론 취임 이후 코스피 지수가 크게 상승한 것도 실용주의 이미지를 더 강하게 했을 것이다."}, {"text": "하지만 본격적인 평가는 이제부터다. 상법 및 양곡관리법 개정, 노란봉투법, 정년 연장, 주 4.5일제 등 기업 또는 시장이 반기지 않을 정책들이 잔뜩 대기하고 있다. 이 정책들을 여하히 만들고 실행하느냐에 따라 이재명 정부의 실용주의가 판가름 날 것이다. 이와 관련해서 일부 언론은 실용주의와 반기업 정책은 양립할 수 없다면서 이들 정책의 대폭 수정을 주문하고 있다."}, {"text": "이쯤에서 분명히 짚고 넘어가야 할 것이 있다. 과연 행정, 즉 정책을 만들고 집행하는 데 있어서 실용주의란 무엇을 의미하는가이다. 이를 나타내는 말로는 검은 고양이든 흰 고양이든 쥐만 잘 잡으면 된다는 ‘흑묘백묘론’이 대표적이다. 그러나 이는 실용주의 정책의 한 측면만을 묘사한 것이다. 그보다는 김대중 전 대통령이 강조했던 ‘서생의 문제의식과 상인의 현실감각’이 실용주의 정책의 본질을 온전히 보여준다."}, {"isHeading": true, "text": "실용주의는 정책 부작용 줄일 해법도 고민"}, {"text": "자기 이익만 챙기는 시정의 잡배라면 예리한 현실감각만으로 충분하겠다. 그러나 공익을 추구하는 정치·행정가는 다르다. 먼저 사회현상에 관한 치열한 문제의식을 지니고, 이를 푸는 과정에서 단단한 현실감각을 견지해야 한다. 같은 현상에 대한 문제의식은 보수와 진보가 다를 수 있다. 아니, 다른 게 당연하다. 철수가 보수를 지지하고 영희가 진보를 지지하는 까닭은, 동일한 사회문제라도 양쪽의 문제의식이 다르고 그래서 해법(정책)도 다르기 때문이다. 단, 어떤 해법이라도 실용주의를 따른다면 현실을 확고하게 담아야 한다."}, {"text": "이게 무슨 의미인지 예를 들어보자. 문재인 정부 때의 급격한 최저임금 인상은 실용주의와는 딴판이다. 시장에서 결정되는 임금 수준을 인위적으로 높이려 해서가 아니다. 시장 임금이 너무 낮으니, 강제로라도 높여야 한다는 문제의식 자체는 진보 정부라면 당연히 가질 수 있다. 실용주의에서 벗어난 것은, 이를 구현하는 과정에서 현실감각이 결여됐기 때문이다. 급격한 임금 인상이 고용주에게 부담되고, 그러면 고용이 줄어든다는 것은 지극히 상식이다. 그런데 이를 외면한 채, 최저임금 인상이 오히려 고용을 늘릴 수 있다고 강변하면서 밀어붙였다. 윤석열 정부 때의 법인세 감면도 실용주의와는 거리가 멀다. 친기업 성향의 보수 정부에서 법인세를 감면하는 것은 능히 예상할 수 있다. 또 법인세 감면은 기업 경쟁력 제고에 얼마라도 도움이 되기는 할 것이다. 그러나 가뜩이나 적자재정으로 걱정인데, 덜컥 세금만 줄이고는 그로 인한 재정 악화 문제는 도외시했기에 전혀 실용주의가 아니다."}, {"text": "실용주의에 기반한 정책이란 현실을 직시해서 해당 정책이 가져올 긍정적인 효과뿐만 아니라 부정적인 영향도 가감 없이 파악하는 것, 부정적인 면에도 불구하고 채택해야 한다면 이를 최소화하기 위한 대책을 마련하는 것, 실행 과정에서 예상치 못한 부작용이 발생한다면 정책 수정을 주저하지 않는 것이다."}, {"text": "실용주의에 입각했다면 최저임금 인상에 따른 고용주 부담과 이로 인한 고용 감소를 당연히 예측했어야 한다. 그럼에도 불구하고 (긍정적인 효과가 더 커서) 실행하기로 했다면, 부정적인 영향을 완화하는 대책을 병행했어야 한다. 실용주의를 따랐다면 법인세 감면에 따른 세수 감소의 보완 대책을 제시했어야 한다. 이들은 단점은 외면하고 장점만 보려 했기에, 부작용이 명백함에도 무시했기에 실용주의로는 실격이다."}, {"text": "정책에는 두 유형이 있다. 하나는 재정을 사용하는 것이고, 또 하나는 민간의 행위를 규제하는 것이다. 최저임금 인상, 노란봉투법, 주 4.5일제 등은 규제 정책이다. 규제 정책은 정부가 직접 돈을 쓰지는 않는다. 하지만 민간의 행위를 제약함으로써 이익을 보는 집단과 손해를 보는 집단이 생긴다. 실용주의에 입각한 규제 정책이라면, 해당 규제에 따른 민간의 이익과 손해를 균형 있게 고려하고, 부정적인 영향을 최소화하는 대책을 마련하며, 이해관계 집단과 충분히 소통하며 부작용이 생기면 즉각 대응하는 유연성을 지녀야 한다."}, {"isHeading": true, "text": "이 정부, 재정 확보 대책 마련이 성패 좌우"}, {"text": "실용주의적 규제 정책이 갖춰야 할 조건은 재정 사용 정책에도 적용된다. 단, 여기에는 한 가지 조건이 추가된다. 재정건전성에 대한 고려이다. 이재명 정부는 2차 추경을 편성해 민생회복지원금 지급을 결정했다. 이는 실용주의인가, 아닌가. 침체한 내수를 끌어올리는 대책이 필요하기는 하다. 다양한 내수 진작 방안 중 전 국민 대상 민생회복지원금 지급을 선택한 것 자체만으로는 실용주의 여부를 판단할 수 없다. 이 정책의 실용주의 여부는 그로 인한 재정 부담을 어찌하는가에 달려 있다."}, {"text": "이 대통령은 후보 시절 “나라가 빚을 지면 안 된다는 것은 무식한 소리”라고 했다. 맞는 측면이 있다. 국가는 개인과는 반대로, 경제가 어려우면 돈을 풀고 호황이면 돈줄을 조여야 한다. 그러나 국가든 개인이든 공통된 것도 있다. 너무 많은 빚은 살림살이를 휘청이게 한다는 점이다. 국내총생산(GDP) 대비 100%가 넘는 국가채무를 지니고도 끄떡없는 나라들이 제법 된다. 우리의 국가채무는 이제 50% 수준이니 한참 동안 더 많은 빚을 져도 괜찮을까. 그렇지 않다. 우리는 개방경제 체제이며 기축통화국이 아니다. 이로 인해 우리의 경제는 국가채무에 민감하다. 아직은 괜찮다지만 여력이 크지 않다. 게다가 급속한 고용화로 인해 신규 재정사업을 벌이지 않아도 재정지출은 빠르게 증가할 것으로 전망된다. 강건한 재정 확보 대책이 없다면, 머지않은 장래에 나라 살림이 크게 힘들어진다는 것은 명약관화하다. 그렇다면 실용주의 정부가 해야 할 일도 명명백백하다. 재정학자 시각으로 보자면, 뭐니 뭐니 해도 이재명 정부 실용주의의 성패는 재정 확보 대책 마련에 달려 있다."}]}, {"id": 2, "title": "실용외교의 성공 요건", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c2-what-is-pragmatism.webp", "subtitle": "[오피니언] 황재호 · 한국외대 국제학부 교수", "source": "https://www.khan.co.kr/article/202507092053015", "content": [{"text": "트럼프 대통령의 미국 우선주의는 국제질서의 성격과 각국 외교 방식에 충격적이고도 노골적인 변화를 주고 있다. 대다수 약소국은 국익을 극대화하는 외교를 선호해왔지만, 더 강력해진 각자도생 환경에서는 강대국이 아닌 이상 실용(實用)외교가 최선의 외교일 수 있다. 한국의 이재명 정부도 국익 중심 실용외교를 전면에 내세우고 이를 헤쳐나가려 한다. 이 대통령은 강대국 스트롱맨들에 밀리지도 않겠지만 국익을 위해서라면 가랑이 밑도 기겠다고 했다."}, {"text": "냉전 시기 공산권 국가들과의 최전선 지정학적 위치와 미국과의 군사동맹은 한국의 실용외교를 위축시켰으나, 건국 이후 대부분 정부는 이념과 진영에 상관없이 실용외교를 해왔다. 이념을 넘어 외부 변화에 유연하거나 실리와 명분이 일치될 경우 실용외교는 성공했다. 노태우 정부의 북방정책이나 노무현 정부의 이라크 파병과 한·미 자유무역협정(FTA) 체결이 이에 해당한다. 전략적으로 오판하거나 양다리로 보일 경우, 과도하게 이념적이거나 실리만 추구할 경우엔 실패했다. 박근혜 대통령은 톈안먼 망루까지 올랐으나 사드 눈치 보기로 최악의 한·중관계를 만들었다. 윤석열 정부 시기 ‘이념’외교는 국격과 국익을 모두 잃은 실용(失用)외교였다."}, {"text": "실용주의 외교와 실용외교는 차이가 있는데, 한국 외교는 19세기 후반 미국에서 시작된 철학 사조인 실용주의를 바탕으로 하는 외교는 아니다. 정확하게는 국익을 달성하기 위한 유연한 수단이나 방법론 차원에서의 외교였다. 어쩌면 실용외교는 우리의 당연한 현실적 선택이다. 그러나 비록 강대국은 아닐지라도 만약 한국 같은 중견 강국이 실용만을 내세운다면 득보다 실이 많다. 우리의 위상과 국제사회의 기대를 스스로 부정하게 되고 강대국을 의식하는 소극적 외교에 머물 수 있다. 이 때문에 신정부의 외교는 몇가지 추가적 노력이 있어야 한다."}, {"text": "첫째, 국익 중심이면서도 한국적 가치와 적절히 배합한다. 한국 외교는 역량이 부족했다기보다 한국만의 정체성과 국격에 부합하는 가치와 전략이 부재했다. 신정부 외교는 실리, 실익을 추구하면서도 외교 철학과 비전을 결합한 국격을 갖추어야 한다. 둘째, 국제사회에서 한국 외교의 자체 공간과 역할을 찾는다. 한국의 국제적 위상과 영향력이 점증하는 상황에서 신정부 외교는 블루오션 이슈와 영역을 찾아야 한다. 민주화, 산업화에 성공한 모델로서 한국의 국위와 국력에 부합하는 글로벌 공공재 제공과 역할을 찾아야 한다. 셋째, 한국적 실용외교의 체계를 이론화한다. 안보 환경 변화로 정책의 변경이 필요할 경우 그 이유를 충분히 설명할 수 있는 논리와 근거를 마련해야 한다. 그래야 외교적 리스크를 최소화할 수 있다. 그렇지 않으면 눈치 보기로, 타산적으로, 기회주의로 비칠 수 있다."}, {"text": "국내적 컨센서스는 실용외교의 정통성과 정당성과도 직결된다. 실용외교는 이념과 진영에 구애받지 않는 중도 외교이기 때문에 모두의 지지를 받을 수도 있지만 모두의 비판을 받기도 쉽다. 초당적으로 국익을 정의하고 상대를 설득하는 정치적 노력이 지속돼야 한다. 설득 과정은 실용외교의 중요한 부분이다."}, {"text": "신정부가 출범한 지 몇주 만에 한국 사회 전반이 분위기를 일신하고 국제사회에 새로운 이미지 변화를 가져오고 있는 만큼 역동성의 신동력, 실천하는 행동력, 마음을 움직이는 심동력의 외교 가능성을 본다. 이번 정부에서 한국형 외교를 정립했으면 한다. 즉 명확성, 유연성, 모호성, 자율성이 아닌 전략적 안정성 외교다. 물 흐르듯 막힘없는 상선약수(上善若水)의 전술적 유연성 외교이다. 매번 기계적으로 5 대 5 균형을 맞추는 것이 아니라 사안과 상황에 따라 최종적으로 균형을 맞추는 중장기 평형성 외교다. 강약을 잘 조율하고, 눈앞의 이익이 아니라 국익을 길게 멀리 보는 천리안의 한국형 실용외교가 국제사회 외교 신모델로 거듭났으면 한다."}, {"text": "다소 아쉬운 부분은 작명이다. 국익 중심 실용외교라 부르면 이해하기도 기억하기도 쉽다. 실용이 정답이지만, 굳이 드러낼 필요까지는 없다. 국제사회의 많은 나라도 실용외교를 하고 있어 한국만의 외교는 아니다. 고유명사라기보다는 보통명사다. 대통령 일).", "variants": ["노무현"], "subDefs": [], "examples": [], "translations": {}}, {"term": "이라크 파병", "mainDef": "2004년에 노무현 정부가 한국 군대를 미국이 주도한 이라크 전쟁에 보낸 사건으로, 당시 한국 내에서 강력한 반대에도 불구하고, 미국과의 동맹 관계를 유지하고 북한 핵 문제의 평화적 해결하기 위해 내려진 결정.", "variants": ["이라크 파병"], "subDefs": [], "examples": [], "translations": {}}, {"term": "한·미 자유무역협정(FTA) 체결", "mainDef": "2007년 한국과 미국이 수입품에 붙는 세금을 없애거나 낮추는 방법으로 상품과 서비스의 수출입을 더 자유롭게 하기 위해 맺은 경제적인 계약.\n당시 한국 내에서는 진보 정당을 중심으로 미국과의 FTA에 대해 반대했지만, 노무현 대통령은 진보 정당 출신임에도 불구하고 미국과의 무역을 활성화하는 것이 한국 경제 전체에 더 큰 이익이 된다고 판단하여 내린 한·미 FTA를 찬성함.", "variants": ["한·미 자유무역협정(FTA) 체결"], "subDefs": [{"subTerm": "체결", "subDef": "계약이나 나라 사이의 약속 등을 공식적으로 맺는 것."}], "examples": [], "translations": {}}, {"term": "오판하다", "mainDef": "잘못된 판단을 하다", "variants": ["오판하다", "오판하"], "subDefs": [], "examples": [], "translations": {}}, {"term": "박근혜", "mainDef": "대한민국의 제18대 대통령 (2013년 2월 25일–2017년 3월 10일).", "variants": ["박근혜"], "subDefs": [], "examples": [], "translations": {}}, {"term": "톈안먼 망루", "mainDef": "1949년 톈안먼 망루 위에서 마오쩌둥이 중화인민공화국(공산주의 정부)의 시작을 알린 상징적인 공간으로, 다른 나라의 지도자가 이곳에 함께 서는 것은 중국이 그 나라와 매우 친밀하다는 것을 전 세계에 보여준다.\n2015년 박근혜 당시 대통령이 중국의 전승절 기념 군사 퍼레이드에 참석하여 시진핑 국가 주석과 함께 톈안먼 망루에 올랐다.", "variants": ["톈안먼 망루"], "subDefs": [], "examples": [], "translations": {}}, {"term": "사드 눈치 보기", "mainDef": "2016년 한국 정부는 미국 정부의 요청에 따라 북한의 미사일 위협에 대응하기 위해 한국에 사드(THAAD)를 배치하기로 결정했다.그런데  중국이 사드(THAAD)의 레이더가 중국의 땅까지 감시할 수 있다며 한국 정부에 사드(THAAD) 배치 결정을 취소하기를 요청했다. 이 상황에서 박근혜 정부는 바로 결정하지 못하고 시간을 끌다가 결국 사드를 배치하기로 결정했는데, 결과적으로 미국과의 신뢰도 잃어버리고 중국과의 무역 마찰도 생겼다.", "variants": ["사드 눈치 보기"], "subDefs": [{"subTerm": "사드(THAAD, Terminal High Altitude Area Defense)", "subDef": "고고도 미사일 방어 시스템"}], "examples": [], "translations": {}}, {"term": "한·중관계", "mainDef": "한국과 중국 사이의 관계.", "variants": ["한·중관계"], "subDefs": [], "examples": [], "translations": {}}, {"term": "국격", "mainDef": "나라의 품격이나 위신.", "variants": ["국격"], "subDefs": [], "examples": [], "translations": {}}, {"term": "철학 사조", "mainDef": "특정한 시기에 유         }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-6 pb-6 text-center"><h2 class="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2">생각해 보기</h2><p class="text-sm font-sans text-gray-500">학습 자료에 대해 심층적으로 생각해 보세요.</p></div><div class="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3"><div class="shrink-0 mt-0.5">${svgIcon('sparkles', 'w-4 h-4 text-gray-400', { fill: 'currentColor' })}</div><p class="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com/share/d2347dbc1c24" target="_blank" rel="noreferrer" class="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 ${svgIcon('externalLink', 'w-3 h-3')}</a></p></div><div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;
        }
        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);
            if (out.length) return out;
            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            const hasVideos = (typeof VIDEOS !== 'undefined' && VIDEOS.length && VIDEOS[0].script && VIDEOS[0].script.length);
            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);
            if (typeof READING_DATA !== 'undefined' && Array.isArray(READING_DATA) && READING_DATA.length) s.push(['reading', '읽기 자료']);
            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);
            if (typeof QUIZ_LIST !== 'undefined' && Array.isArray(QUIZ_LIST) && QUIZ_LIST.length) s.push(['quiz', '내용 확인 퀴즈']);
            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;
        }
        function pwScriptHTML() {
            const vids = (typeof VIDEOS !== 'undefined' && VIDEOS.length) ? VIDEOS : [{ title: '', script: (typeof VIDEO_SCRIPT_DATA !== 'undefined' ? VIDEO_SCRIPT_DATA : []) }];
            return vids.map(v => `${(vids.length > 1 && v.title) ? `<div class="pw-part-title">${esc(v.title)}${v.subTitle ? ' · ' + esc(v.subTitle) : ''}</div>` : ''}${(v.script || []).map(l => `<div class="pw-line"><div class="pw-kor"><span class="pw-spk">${esc(l.speaker || '')}</span>${esc(l.kor || '')}</div>${l.eng ? `<div class="pw-eng">${esc(l.eng)}</div>` : ''}</div>`).join('')}`).join('');
        }
        function pwReadingHTML() {
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')}</div>${r.subtitle ? `<div class="pw-read-sub">${esc(r.subtitle)}</div>` : ''}${(r.content || []).filter(p => !p.isChart).map(p => p.isHeading ? `<div class="pw-read-h">${esc(p.text || '')}</div>` : `<div class="pw-read-p">${esc(p.text || '')}</div>`).join('')}`).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const rdo = e.target.closest('[data-reading-open]'); if (rdo) { reading.activeId = +rdo.dataset.readingOpen; setTab('reading'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const a = e.target.closest('[data-action]');
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const i = +a.dataset.idx; reading.trans[i] = !reading.trans[i]; rerenderReadingBlocks(); }
                    return;
                }
            } else if (tab === 'vocab') {
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            } else if (tab === 'quiz') {
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => q.id === qid); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const t = st.input.trim(); const ok = t === quiz.answer || (quiz.altAnswer && t === quiz.altAnswer); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = quiz.answer; st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'trans') { st.trans = !st.trans; rerenderQuizQ(qid); }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) {
                const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id];
                const wasDisabled = !st.text.trim(); st.text = e.target.value;
                if (wasDisabled !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } }
            }
        });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            reading.dictLoading = true; reading.dictResult = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm, currentReading().content); }
            catch (err) { reading.dictResult = { term: reading.dictTerm, definition: '검색 중 오류가 발생했습니다. (API 키 없음/요청 오류)', example: '' }; }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
