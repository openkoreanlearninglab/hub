        const READING_DATA = [
            { id: 1, title: "[기사] 누구에게나 천원어치의 재능은 있다", subtitle: "", source: "https://www.ibrandnews.com/news/articleView.html?idxno=10897", content: [
                { id: 'p1', text: '당신에게 재능이 있다면 그것을 얼마에 팔겠는가. 천원으로 물건이 아닌 재능을 사고판다는 ‘천원의 재능마켓’은 바로 그 질문에서 출발했다. 투데이신문은 3일 오후, 서울 마포구에서 열린 현장을 직접 찾았다.', trans: "If you had a talent, how much would you sell it for? The '1,000 Won Talent Market', where people buy and sell talent rather than goods for a thousand won, started with this very question. Today News visited the scene held in Mapo-gu, Seoul, on the afternoon of the 3rd." },
                { id: 'p2', text: '비가 내리는 연휴임에도 행사가 열리는 넓은 공간 안에는 사람들의 열기로 가득했다. 입구에서 천원짜리 티켓 세 장을 구매해 들어서자 작은 박람회처럼 판매자와 구매자가 작은 책상을 사이에 두고 마주 앉아 이야기를 나누는 모습이 한눈에 들어왔다.', trans: "Despite the rain during the holiday, the spacious venue was filled with the heat of people. Upon purchasing three 1,000-won tickets at the entrance and stepping inside, the sight of sellers and buyers sitting face-to-face across small desks, engaging in conversation like a miniature expo, came into view at a glance." },
                { id: 'p3', text: '어떤 재능이 판매되고 있나 둘러보던 중 모든 판매자의 책상 위에는 타이머가 놓여있다는 것을 알게 됐다. 운영팀들은 ‘시간 엄수’라는 메모를 들고 테이블과 테이블 사이를 누비며 판매자와 구매자를 살폈다. 재능을 사고파는 곳에서 ‘시간’이 중요한 이유를 물어보니 “각 재능이 10분 단위로 운영되기 때문에 한 타임의 시간이 길어지면 다음 구매자들이 오래 기다리게 될 수 있다”며 “단 몇 분의 지연도 전체 흐름에 영향을 주기 때문에 운영에 있어 시간 관리를 가장 중요하게 생각하고 있다”고 설명했다.', trans: "While looking around to see what talents were on sale, I noticed timers placed on every seller's desk. The operation team roamed between tables holding notes that read 'Punctuality,' checking on sellers and buyers. When asked why 'time' is important in a place where talent is traded, they explained, 'Since each talent operates in 10-minute units, if one session runs long, subsequent buyers might have to wait a long time. Even a few minutes of delay affects the entire flow, so we prioritize time management in our operations.'" },
                { id: 'p4', text: '시범 운영을 거쳐 2회차를 맞이한 ‘천원의 재능마켓’은 지난번보다 규모가 한층 더 커졌다. 12개의 재능과 100명의 방문객이 참여한 1회차 마켓에 이어, 이번에는 18개의 재능이 모였고 사전 신청자만 300명에 달했다. 재능 종류도 더욱 다양해져 상담·예술·심리·체험 등 각자의 개성을 살린 프로그램들이 공간 곳곳을 채웠다.', trans: "The '1,000 Won Talent Market,' now in its second run after a pilot operation, has grown significantly in scale. Following the first market with 12 talents and 100 visitors, this time 18 talents gathered, and pre-applicants alone reached 300. The types of talents also became more diverse, filling the space with programs reflecting individual personalities such as counseling, art, psychology, and hands-on experiences." },
                { id: 'p5', text: '다양하게 판매되고 있는 재능 중에서도 투명한 창문을 닦기 위한 도구와 각도, 세정법을 모두 알려준다는 ‘투명한 창문닦기 원포인트 레슨’, 머리를 땋아준다는 ‘꼼지락 미용실’, 나를 위한 칭찬과 책을 추천해준다는 ‘칭찬 책방’ 등 유쾌하고도 기발한 재능들이 눈길을 끌었다.', trans: "Among the diverse talents on sale, playful and inventive ones caught the eye, such as 'One-Point Lesson on Transparent Window Cleaning' which teaches tools, angles, and cleaning methods for wiping windows; 'Fidget Hair Salon' which braids hair; and 'Praise Bookstore' which offers praise and book recommendations just for you." },
                { id: 'p6', text: '‘천원의 재능마켓’은 판매자가 티켓 금액의 전체를 정산받는 구조로 운영된다. 이를 통해 판매자는 단순히 수익을 얻는 데서 그치지 않고 자신의 재능 가치와 적정 가격, 판매 기준을 가늠해볼 수 있게 된다. 판매자는 운영팀의 직접 섭외 방식으로 이뤄졌다. 무형의 재능을 다루는 만큼 불편한 상황이 없도록 인성과 안정성 확보를 최우선 과제로 삼았다는 기획자의 설명이다.', trans: "The '1,000 Won Talent Market' operates on a structure where the seller receives the entire ticket amount. Through this, sellers don't just earn revenue but can also gauge the value of their talent, appropriate pricing, and sales standards. Sellers were recruited directly by the operation team. The planner explained that since they deal with intangible talents, securing character and stability was the top priority to prevent any uncomfortable situations." },
                { id: 'p7', text: '다만 참여자와 방문객이 늘어남에 따라 향후에는 공개 모집 방식을 도입할 예정이라고 전했다. 단순 지원이 아닌 간단한 온라인 미팅 심사를 통해 소통 태도와 재능의 성격을 확인하는 절차를 마련해 운영 안정성을 유지하겠다는 계획이다.', trans: "However, they mentioned plans to introduce an open recruitment method in the future as the number of participants and visitors increases. They plan to maintain operational stability by establishing a procedure to verify communication attitudes and the nature of talents through simple online meeting screenings, rather than just simple applications." },
                { id: 'p8', text: '‘졸음 유발 낭독소’를 운영하는 이연재 판매자는 과거 시각장애인 낭독 봉사 오디션에서 ‘목소리가 너무 졸려 낭독에 어울리지 않는다’는 평가를 받았던 경험을 떠올려 재능을 판매하게 됐다고 전했다. 이 판매자는 “마켓을 시작하기 전까지는 내 재능이 팔릴 수 있을까 걱정을 많이 했는데 다행히 재능을 궁금해해 주시는 분들이 많았다. 적은 돈이지만 이곳의 취지를 이해해주시고 와주셔서 오히려 응원과 용기를 얻게 됐다”고 덧붙였다.', trans: "Seller Lee Yeon-jae, who runs the 'Sleep-Inducing Reading Post,' shared that she decided to sell her talent recalling an experience where she was evaluated as 'not suitable for reading because her voice is too sleepy' at a past audition for reading volunteering for the visually impaired. This seller added, 'Before starting the market, I worried a lot about whether my talent would sell, but fortunately, many people were curious about it. Although it's a small amount of money, I gained support and courage from those who understood the purpose of this place and came to visit.'" },
                { id: 'p9', text: 'SNS에서 ‘천원의 재능마켓’을 보고 왔다는 방문자 최씨는 “이런 형식의 마켓은 처음 봤다. 재능을 구매할 수 있다는 것이 신기해서 와보게 됐다”며 “크든 작든 누구나 재능을 가지고 있다는 메시지가 좋았다. 큰 기대 없이 왔는데 생각보다 진지하게 마음을 돌아보고 이야기할 수 있게 돼 신기했다”고 전했다. 최씨와 함께 온 김씨는 “천원이라는 금액이 너무 가볍게 느껴졌는데 막상 체험해보니 훨씬 큰 걸 얻고 가는 기분이다. 다음에는 구매자가 아닌 판매자로 나와보고 싶다고 생각했다”고 말했다.', trans: "Visitor Choi, who came after seeing the '1,000 Won Talent Market' on social media, said, 'I've never seen a market like this before. I came because it was fascinating that you could purchase talent,' adding, 'I liked the message that everyone has talent, whether big or small. I came without big expectations, but it was amazing to be able to look back on my mind and talk more seriously than I thought.' Kim, who came with Choi, said, 'The amount of 1,000 won felt too light, but after actually experiencing it, I feel like I'm taking away something much bigger. I thought I'd like to come out as a seller, not a buyer, next time.'" },
                { id: 'p10', text: '‘천원의 재능마켓’은 ‘의미 있는 시도를 해보자’는 공감대 속에서 별도의 급여 없이 기획을 이어가고 있다. 운영비는 신청비 등 소액의 경비로 충당하고 부족한 부분은 직접 제작한 굿즈 판매나 협력 지원을 통해 메워왔다고 전했다. 프로젝트가 열리는 공간 섭외부터 홍보까지 모두 직접 해결해왔으며 장기적으로 지속 가능한 운영 구조를 마련하기 위해 다양한 방안을 고민 중이라고 밝혔다.', trans: "The '1,000 Won Talent Market' continues its planning without separate pay under the consensus of 'let's try something meaningful.' Operating costs are covered by small expenses such as application fees, and shortages have been filled through sales of self-produced goods or cooperative support. They revealed that they have handled everything directly, from renting the space where the project takes place to promotion, and are considering various ways to establish a sustainable operating structure in the long term." },
                { id: 'p11', text: '10분 동안 천원으로 재능을 사고파는 이곳은 단순한 마켓이 아닌 ‘사람의 마음’을 거래하는 장이었다. 천원이라는 부담 없는 금액으로 사람들은 오히려 마음을 열고 재능을 나눴다.', trans: "This place, where talent is bought and sold for 1,000 won for 10 minutes, was not just a market but a venue for trading 'people's hearts.' With the burden-free amount of 1,000 won, people rather opened their hearts and shared their talents." }
            ] },
            { id: 2, title: "[인터뷰] ‘천원의 재능마켓’ 기획자 안다비", subtitle: "", source: "https://www.ibrandnews.com/news/articleView.html?idxno=10897", content: [
                { id: 'i1', text: 'Q. ‘천원의 재능마켓’을 시작하게 된 계기가 무엇인가요?', trans: "Q. What triggered the start of the '1,000 Won Talent Market'?" },
                { id: 'i2', text: '이 기획은 프리랜서로 일하면서 느낀 어려움에서 시작됐었어요. 아이디어처럼 형태가 없는 재능은 얼마에 팔아야 할지 기준이 없어 고민이 많았는데 생각해보니 어릴 때부터 무언가를 직접 팔아본 경험이 한 번도 없었던 거예요. 미국 만화에서 아이들이 집 앞에서 레모네이드를 파는 모습을 떠올리며, 한국 사회를 살아가는 우리에겐 그런 경험이 부족하다는 것을 깨달았어요. 그래서 성인이라도 부담 없이 자신의 재능을 사고팔아볼 수 있는 공간이 필요하다고 생각하며 이 기획을 준비하게 됐어요.', trans: "This project started from the difficulties I felt while working as a freelancer. Like ideas, intangible talents have no standard for how much they should be sold for, so I worried a lot. Then I realized I had never personally sold anything since I was young. Thinking of scenes in American cartoons where children sell lemonade in front of their houses, I realized that we living in Korean society lack such experiences. So I prepared this project thinking that a space is needed where even adults can buy and sell their talents without burden." },
                { id: 'i3', text: 'Q. 오천원, 만원도 아닌 ‘천원’에 파는 이유가 있나요?', trans: "Q. Is there a reason for selling at '1,000 won', not 5,000 or 10,000 won?" },
                { id: 'i4', text: '처음엔 ‘재능마켓’이라 이름 붙였지만 ‘재능’이라는 단어가 사람들을 주눅 들게 한다는 걸 알게 됐어요. 누구나 작게나마 잘하는 게 있어요. 근데 대부분 ‘이게 팔릴까?’라고 생각하죠. 그래서 문턱을 아예 낮췄어요. ‘천 원이면 어때?’ 그 순간 이 아이디어가 시작됐어요. 누구나 용기 낼 수 있도록 가장 낮은 화폐 단위인 천원을 붙였고 ‘천원어치 재능은 누구에게나 있다’는 슬로건을 만들었어요. 천 원이면, 뭐라도 한번 해보고 싶잖아요.', trans: "At first, I named it 'Talent Market,' but I realized the word 'talent' intimidates people. Everyone has something they are good at, however small. But most think, 'Will this sell?' So I lowered the threshold completely. 'How about 1,000 won?' That's when this idea started. I attached 1,000 won, the lowest currency unit, so anyone could muster the courage, and created the slogan 'Everyone has 1,000 won worth of talent.' If it's 1,000 won, you want to try just about anything." },
                { id: 'i5', text: '이 마켓에서 천 원은 단순한 가격이 아니에요. ‘값’이 아니라 ‘가치’의 단위를 새로 정하는 실험이에요. 재능을 돈으로 환산하면 끝이 없잖아요. 천 원이라는 상징적인 금액은 ‘돈보다 중요한 건 나누는 경험’이라는 메시지를 담고 있어요. 가치의 무게 중심을 돈에서 사람으로 옮기고 싶었어요. 참가자들은  고객의 피드백을 통해 자신의 재능 가치를 직접 확인해 볼 수 있어요. ', trans: "In this market, 1,000 won is not a simple price. It's an experiment to redefine the unit of 'value', not 'cost'. If you convert talent into money, there's no end to it. The symbolic amount of 1,000 won contains the message that 'what is more important than money is the experience of sharing.' I wanted to shift the center of gravity of value from money to people. Participants can directly check the value of their talent through customer feedback." },
                { id: 'i6', text: 'Q. 기획자가 생각하는 재능의 정의는 무엇인가요?', trans: "Q. What is the planner's definition of talent?" },
                { id: 'i7', text: '제 생각에 재능은 ‘완성된 능력이 아니라, 나누는 순간 비로소 빛나는 가능성’이에요. 많은 사람들이 자기 재능을 너무 작게 여겨요. 그런데 그걸 꺼내놓고 나눠보면, 누군가에게는 큰 위로가 되기도 하고, 또 다른 누군가에겐 새로운 시작이 되기도 해요. 그게 바로 재능이죠. 천원의 재능마켓은 이름 그대로 누구나 자신의 작은 재능을 1,000원에 나누는 시장이에요. 거창한 능력, 전문가 수준의 스킬이 아니어도 돼요. ', trans: "In my opinion, talent is 'not a completed ability, but a possibility that shines only when shared.' Many people consider their talents too small. But if you take it out and share it, it becomes a great comfort to someone, and a new beginning for another. That is exactly what talent is. The 1,000 Won Talent Market is, as the name suggests, a market where anyone shares their small talent for 1,000 won. It doesn't have to be a grandiose ability or expert-level skill." },
                { id: 'i8', text: 'Q. 주로 어떤 사람이 재능을 팔거나 사기 위해 오나요?', trans: "Q. What kind of people mainly come to sell or buy talent?" },
                { id: 'i9', text: '처음 기획할 때는 ‘언젠가 나도 내 재능을 팔아보고 싶다’는 잠재 판매자들이 주로 올 거라고 생각했어요. 그러나 실제로는 이 기획을 통해 무언가를 배우거나 변화를 기대하는 분들도 많이 찾아와주셨어요. ‘천원의 재능마켓’에는 작다고 여겨질 수 있는 재능을 통해 새로운 가능성을 경험하러 오는 사람들이 모이는 것 같아요.', trans: "When first planning, I thought potential sellers who thought 'someday I want to sell my talent too' would mainly come. However, in reality, many people who expected to learn something or change through this project also visited. It seems that people who come to experience new possibilities through talents that might be considered small gather at the '1,000 Won Talent Market'." },
                { id: 'i10', text: '이전에 한번 참여해보고, 이 일이 꼭 필요하다고 느껴 운영까지 돕겠다고 자청한 분들이 있었어요. 마켓이 그 사람들의 삶에도 변화를 준 거죠. 마켓의 경험을 바탕으로 공방을 열거나 새로운 프로젝트를 시작하시는 분들도 있었어요. 이 작은 시장이 누군가에게는 커다란 전환점이 된 것이죠.', trans: "There were people who participated once before, felt this work was essential, and volunteered to help with operations. The market brought change to their lives as well. There were also people who opened workshops or started new projects based on their market experience. This small market became a significant turning point for some." },
                { id: 'i11', text: 'Q. 앞으로의 계획이나 꿈이 있다면?', trans: "Q. Do you have any future plans or dreams?" },
                { id: 'i12', text: '사실 이번 프로젝트는 내가 필요해서 만든 기획이라 언젠가는 직접 판매자로 앉아 ‘첫인상 말해주기’ 같은 재능을 팔아보고 싶어요. 지금은 운영을 맡고 있어서 직접 참여하지 못하고 있지만 시스템이 안정되고 자리를 잡으면 판매자로 참여해서 내 재능이 통할 수 있을지 시험해보고 싶어요. ', trans: "Actually, since this project was a plan I made because I needed it, someday I want to sit as a seller myself and sell a talent like 'Telling First Impressions.' I can't participate directly right now because I'm in charge of operations, but once the system stabilizes and settles down, I want to participate as a seller and test if my talent can work." },
                { id: 'i13', text: '그리고 이 ‘천원의 재능마켓’이 이벤트성 행사로 남지 않았으면 해요. ‘천원의 재능마켓’이 앞으로 더 많은 사람들에게 닿고자 해요. 서울뿐 아니라 부산, 제주 같은 지역에서도 열어보고 싶어요. 나아가 온라인에서도 재능을 사고파는 운영안도 그리고 있어요. 어디에 살든, 어떤 상황이든 자신의 재능을 가볍게 시험해볼 수 있는 환경이 마련됐으면 해요. 궁극적으로는 누군가 진로를 고민할 때 집 앞 편의점에 들르듯 ‘재능 한 번 팔아볼까?’하며 자연스럽게 찾을 수 있는 상시적인 공간으로 자리 잡는 게 꿈이에요. 물론, 규모의 확장도 중요하지만 ‘첫 경험의 설렘’을 잃지 않는 것이 더 중요하다고 생각해요.', trans: "And I hope this '1,000 Won Talent Market' doesn't remain as a one-time event. The '1,000 Won Talent Market' wants to reach more people in the future. I want to open it not only in Seoul but also in regions like Busan and Jeju. Furthermore, I am drawing up an operation plan to buy and sell talents online. I hope an environment is created where anyone can lightly test their talent regardless of where they live or what situation they are in. Ultimately, my dream is for it to settle as a permanent space where someone worrying about their career can naturally find it, asking 'Shall I try selling my talent once?' just like stopping by a convenience store in front of their house. Of course, expanding the scale is important, but I think not losing the 'excitement of the first experience' is more important." }
            ] }

        // ---------- 7. 어휘 팝업 ----------

        // ---------- 8. READING ----------
        function currentReading() { return READING_DATA.find(r => r.id === reading.activeId); }
        function buildVocabRanges(text) {
            const allTerms = VOCAB_READING_DATA.flatMap(v => { const terms = [v.term]; if (v.variants) terms.push(...v.variants); return terms.map(term => ({ term, vocab: v })); }).sort((a, b) => b.term.length - a.term.length);
            const ranges = [];
            allTerms.forEach(({ term, vocab }) => { let i = 0; while ((i = text.indexOf(term, i)) !== -1) { const end = i + term.length; const overlaps = ranges.some(m => (i >= m.start && i < m.end) || (end > m.start && end <= m.end)); if (!overlaps) ranges.push({ start: i, end, term, vocab }); i = end; } });
            return ranges;
        }
        function renderTextSegments(text, blockIndex, isHeading) {
            if (!text) return '';
            const blockId = `${reading.activeId}-${blockIndex}`;
            const blockHi = reading.highlights[blockId] || [];
            const vocabRanges = buildVocabRanges(text);
            const points = new Set([0, text.length]);
            blockHi.forEach(h => { points.add(h.start); points.add(h.end); });
            vocabRanges.forEach(v => { points.add(v.start); points.add(v.end); });
            const sorted = Array.from(points).sort((a, b) => a - b);
            let out = '';
            for (let i = 0; i < sorted.length - 1; i++) {
                const s = sorted[i], e = sorted[i + 1], mid = (s + e) / 2;
                let hiColor = null;
                for (let j = blockHi.length - 1; j >= 0; j--) { const h = blockHi[j]; if (h.start <= mid && h.end >= mid) { hiColor = h.color; break; } }
                const av = vocabRanges.find(v => v.start <= mid && v.end >= mid);
                let cls = 'transition-colors duration-200 decoration-clone ';
                if (hiColor === 'yellow') cls += 'bg-yellow-200 '; else if (hiColor === 'red') cls += 'bg-red-200 '; else if (hiColor === 'green') cls += 'bg-green-200 ';
                let attrs = '';
                if (av) { cls += `cursor-pointer ${isHeading ? 'font-extrabold' : 'font-semibold'} text-gray-900 hover:text-black hover:bg-gray-100 rounded px-0.5 `; attrs = ` data-vocab-idx="${VOCAB_READING_DATA.indexOf(av.vocab)}"`; }
                else if (!hiColor) cls += 'text-gray-800 ';
                out += `<span class="${cls}"${attrs}>${esc(text.slice(s, e))}</span>`;

        }

        // ---------- 10. QUIZ ----------
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function shuffleChoices() { const a = quizState.shuffled.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } quizState.shuffled = a; }
        function quizSentenceHTML(quiz) {

            const len = Math.max(st.input.length, quiz.answer ? quiz.answer.length : 0);
            const w = Math.max(120, len * 25);
            const inpCls = st.result === 'correct' ? 'border-green-500 text-green-700' : st.result === 'incorrect' ? 'border-red-500 text-red-700' : 'border-gray-300 text-black focus:border-black';
            return `<div class="quiz-q mb-10 pb-10 border-b border-gray-200 last:border-0" data-qid="${quiz.id}"><div class="flex items-baseline gap-4 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span></div><div class="text-xl font-serif text-gray-900 leading-loose mb-6"><span>${esc((quiz.textParts||quiz.parts)[0])}</span><input type="text" class="quiz-input mx-2 px-2 py-0 border-b-2 font-bold text-center outline-none bg-transparent transition-colors font-serif ${inpCls}" style="width:${w}px" value="${esc(st.input)}" /><span>${esc((quiz.textParts||quiz.parts)[1])}</span></div><div class="flex flex-wrap gap-3 items-center print:hidden"><button type="button" data-q="check" class="px-4 py-2 bg-black text-white text-xs font-bold font-sans hover:bg-gray-800 transition-colors">정답 확인</button><button type="button" data-q="show" class="px-4 py-2 bg-white border border-gray-300 text-gray-600 text-xs font-bold font-sans hover:border-black hover:text-black transition-colors">정답 보기</button><button type="button" data-q="hint" class="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">힌트</button><button type="button" data-q="trans" class="inline-flex items-center gap-1 text-[8px] font-bold font-sans uppercase tracking-widest text-gray-500 opacity-40 hover:opacity-100 cursor-pointer bg-transparent border-none p-0">${svgIcon('externalLink', 'w-2.5 h-2.5')}${st.trans ? 'Hide Eng' : 'Eng'}</button></div>${st.trans ? `<p class="mt-4 text-sm font-sans text-gray-500 bg-gray-50 p-3">${esc(quiz.textParts_eng[0])}<span class="font-bold text-gray-700">${esc(quiz.answer_eng)}</span>${esc(quiz.textParts_eng[1])}</p>` : ''}${st.hint ? `<p class="mt-4 text-sm font-sans text-gray-500 italic">💡 Hint: ${esc(quiz.hint)}</p>` : ''}${quiz.explanation && st.result === 'correct' ? `<p class="mt-4 text-sm font-sans text-green-700 font-medium">✓ Correct. ${esc(quiz.explanation)}</p>` : ''}${quiz.explanation && st.result === 'incorrect' ? '<p class="mt-4 text-sm font-sans text-red-600 font-medium">✕ Try again.</p>' : ''}</div>`;
        }
        function quizChoicesHTML() { return quizState.shuffled.map(c => `<span class="text-xs font-serif text-gray-600 bg-white border border-gray-200 px-2 py-1 select-all">${esc(c)}</span>`).join(''); }
        function quizHTML() {
            return `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 flex flex-col md:flex-row gap-12 animate-fade-in"><div class="w-full md:w-64 shrink-0"><div class="sticky top-24"><div class="md:sticky md:top-24"><h2 class="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2">내용 확인 퀴즈</h2><p class="text-sm font-sans text-gray-500 mb-6">학습 자료에 대한 이해도를 확인해 보세요.</p><div class="border-t border-gray-200 pt-4 mb-8"><span class="text-xs font-bold font-sans text-black uppercase block mb-2">정답률</span><span class="text-4xl font-serif font-bold text-gray-900" id="quiz-score">${quizScore()}%</span></div><div class="bg-gray-50 p-4 border border-gray-100"><h4 class="text-xs font-bold font-sans text-gray-500 uppercase mb-3 border-b border-gray-200 pb-2">정답 목록</h4><div class="flex flex-wrap gap-2" id="quiz-choices">${quizChoicesHTML()}</div></div></div></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizSentenceHTML).join('')}</div></div>`;
        }
        function refreshQuizSidebar() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; const ch = qs('#quiz-choices', viewRoot()); if (ch) ch.innerHTML = quizChoicesHTML(); }
        function rerenderQuizQ(qid) { const el = qs(`.quiz-q[data-qid="${qid}"]`, viewRoot()); if (el) el.outerHTML = quizSentenceHTML(QUIZ_LIST.find(q => q.id === qid)); }

        // ---------- 11. DISCUSS ----------
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, feedback: null, loading: false, fbTrans: false });
            const vocab = item.vocab.map(v => `<div><p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>${st.showTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-1 animate-fade-in"><span class="font-bold mr-2">${esc(v.termEng)}</span>${esc(v.defEng)}</p>` : ''}</div>`).join('');
            let fb = '';
            if (st.feedback) {
                const corr = (st.feedback.corrections || []).map(c => `<div class="border border-gray-100 p-5 bg-white"><div class="flex items-start gap-4 mb-3"><span class="shrink-0 text-[11px] font-bold px-2 py-0.5 bg-gray-100 text-gray-400 mt-0.5">수정 전</span><p class="text-[15px] font-serif text-gray-400 line-through leading-relaxed">${esc(c.original)}</p></div><div class="flex items-start gap-4 mb-5"><span class="shrink-0 text-[11px] font-bold px-2 py-0.5 bg-blue-50 text-blue-600 mt-0.5">수정 후</span><p class="text-[15px] font-serif text-gray-900 font-bold leading-relaxed">${esc(c.corrected)}</p></div><div class="pt-4 border-t border-gray-100 border-dashed"><span class="font-bold text-gray-400 text-[11px] mr-2 font-sans">💡 설명</span><span class="text-[14px] font-serif text-gray-700 leading-relaxed">${esc(c.explanation)}</span>${st.fbTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-2 ml-6 animate-fade-in">${esc(c.explanationTrans)}</p>` : ''}</div></div>`).join('');
                fb = `<div class="mt-8 border border-gray-100 rounded-sm p-6 bg-white animate-fade-in shadow-sm"><h4 class="text-lg font-bold font-serif flex items-center gap-2 mb-6 text-gray-900">${svgIcon('sparkles', 'w-5 h-5 text-gray-700', { fill: 'currentColor' })} AI 한국어 도우미</h4><div class="bg-gray-50 px-5 py-4 mb-8 border-l-[3px] border-gray-800"><span class="text-xs font-bold text-gray-500 mb-2 block font-sans">총평 및 잘한 점</span><p class="text-[15px] font-serif text-gray-800 leading-relaxed">${esc(st.feedback.overallComment)}</p>${st.fbTrans && st.feedback.overallCommentTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-2 pt-2 border-t border-gray-200 animate-fade-in">${esc(st.feedback.overallCommentTrans)}</p>` : ''}</div>${corr ? `<h5 class="text-xs font-bold text-gray-500 mb-4 font-sans">문장별 교정 및 설명</h5><div class="space-y-6">${corr}</div>` : ''}<div class="flex justify-end mt-4">${transBtn('discuss-fbtrans', st.fbTrans)}</div></div>`;
            }
            const disabled = (!st.text.trim() || st.loading);
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14"><div class="flex gap-2 mb-4">${transBtn('discuss-qtrans', st.showTrans)}${st.showTrans ? `<p class="text-sm font-sans text-gray-500 animate-fade-in">${esc(item.questionEng)}</p>` : ''}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-3 block">핵심 어휘${st.showTrans ? ' <span class="font-normal normal-case ml-1">(Key Vocabulary)</span>' : ''}</span><div class="space-y-4">${vocab}</div></div><textarea data-action="discuss-text" placeholder="여기에 생각을 적어보세요..." class="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300">${esc(st.text)}</textarea><div class="flex justify-end"><button type="button" data-action="discuss-feedback" ${disabled ? 'disabled' : ''} class="px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${disabled ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}">${st.loading ? '<div class="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></div>' : ''}AI 피드백 받기</button></div>${fb}</div></div>`;
        }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-6 pb-6 text-center"><h2 class="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2">생각해 보기</h2><p class="text-sm font-sans text-gray-500">학습 자료에 대해 심층적으로 생각해 보세요.</p></div><div class="bg-gray-50 border border-gray-200 p-4 mb-10 flex items-start gap-3"><div class="shrink-0 mt-0.5">${svgIcon('sparkles', 'w-4 h-4 text-gray-400', { fill: 'currentColor' })}</div><p class="text-xs font-sans text-gray-600 leading-relaxed">AI 피드백은 현재 Gemini 웹에서만 가능합니다. <a href="https://gemini.google.com/share/0df0e744a920" target="_blank" rel="noreferrer" class="underline decoration-gray-400 underline-offset-2 hover:text-black inline-flex items-center gap-1">Gemini에서 열기 ${svgIcon('externalLink', 'w-3 h-3')}</a></p></div><div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;
        }
        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }

        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            const a = e.target.closest('[data-action]');
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const i = +a.dataset.idx; reading.trans[i] = !reading.trans[i]; rerenderReadingBlocks(); }
                    return;
                }
            } else if (tab === 'vocab') {
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            } else if (tab === 'quiz') {
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => q.id === qid); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const t = st.input.trim(); const ok = t === quiz.answer || (quiz.altAnswer && t === quiz.altAnswer); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = quiz.answer; st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'trans') { st.trans = !st.trans; rerenderQuizQ(qid); }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) {
                const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id];
                const wasDisabled = !st.text.trim(); st.text = e.target.value;
                if (wasDisabled !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } }
            }
        });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            reading.dictLoading = true; reading.dictResult = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm, currentReading().content); }
            catch (err) { reading.dictResult = { term: reading.dictTerm, definition: '검색 중 오류가 발생했습니다. (API 키 없음/요청 오류)', example: '' }; }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
</body>

</html>
