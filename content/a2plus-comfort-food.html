#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}

#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}

#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}

.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            height: 16px;
            width: 16px;
            border-radius: 50%;

            margin-top: -7px;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #e5e7eb;

<body>
    <noscript><div style="max-width:720px;margin:24px auto;padding:16px;border:1px solid #ddd;border-radius:8px;font-family:sans-serif;font-size:14px;color:#374151">이 학습 자료를 보려면 자바스크립트를 켜 주세요.</div></noscript>
    <div id="app"></div>
    <script>
    (function () {
        'use strict';

        /* 폰트 CSS 비차단 적용: head에서 media=print로 받아 둔 스타일을 여기서 활성화 */
        var fontCss = document.getElementById('font-css');
        if (fontCss) fontCss.media = 'all';

        /* =====================================================================
           </> TEMPLATE — C — reading   (배포용 아님 / NOT for deployment)
           순수 바닐라 JS 학습자료 베이스. 새 자료는 아래 데이터 배열만 교체:
           READING_DATA · VOCAB_READING_DATA · QUIZ_LIST · DISCUSS_DATA
           + 홈/차트의 [대괄호] 플레이스홀더 문구.
           ===================================================================== */

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };
        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["문화", "음식"];
        const HOME_SERIES_BADGE = "";
        // 낭독 오디오: assets/audio/a2plus-comfort-food.m4a 를 올린 뒤 아래 "audio" 를 true 로 바꾸면 playbar가 나온다.
        const READING_DATA = [{"id": 1, "title": "컴포트 푸드 ⸺ 마음을 편하게 해 주는 음식", "subtitle": "Comfort Food ⸺ Food That Puts Your Mind at Ease", "source": "https://cda.or.kr/CDAPost/9/read/1210", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-comfort-food.webp", "content": [{"isHeading": true, "text": "힘들 때 생각나는 음식", "trans": "Food You Think of When Things Are Hard"}, {"text": "어른이 되어도 힘든 날이 있어요. 그때, 어떤 음식이 생각나요. 학교 앞에서 파는 매운 떡볶이 같은 음식이에요. 어렸을 때 그런 음식을 먹었어요. 힘든 날에 그런 음식이 우리를 위로해요.", "trans": "Even when you are an adult, there are hard days. At those times, a certain food comes to mind. Food like the spicy tteokbokki they sell outside the school gates. You ate food like that when you were young. On a hard day, food like that comforts us."}, {"text": "이것저것 먹어도 뭔가 부족해요. 그때는 어머니 생각이 나요. 어머니가 따뜻한 된장찌개를 만들어 주셨어요. 그 찌개를 한 숟가락 먹어요. 그러면 마음이 따뜻해져요.", "trans": "You eat this and that, and something is still missing. At those times you think of your mother. Your mother used to make you warm doenjang stew. You take a spoonful of that stew. Then your heart grows warm."}, {"text": "회사 일이 힘든 날에는 어때요? 삼겹살과 소주 한 잔으로 스트레스를 풀어요. 우리는 힘들 때 '음식'을 먹지 않아요. '위로'를 먹어요.", "trans": "And on days when work is hard? You work off the stress with samgyeopsal and a glass of soju. When things are hard, we do not eat 'food'. We eat 'comfort'."}, {"isHeading": true, "text": "중요한 것은 맛이 아니라 기억이에요", "trans": "What Matters Is Not the Taste but the Memory"}, {"text": "어떤 음식은 먹을 때 기분이 좋아요. 이런 음식을 '컴포트 푸드'라고 해요. 컴포트 푸드는 어릴 때 기억과 아주 가까워요.", "trans": "Some food makes you feel good when you eat it. Food like this is called 'comfort food'. Comfort food is very close to childhood memories."}, {"text": "어른이 된 후에도 그 음식을 먹어요. 그러면 옛날 생각이 나요. 그래서 '메모리 음식'이라고도 해요. 컴포트 푸드에서 중요한 것은 재료가 아니에요. 그 음식 안에 '기억과 이야기'가 있어요.", "trans": "Even after you grow up, you eat that food. Then old memories come back. That is why it is also called 'memory food'. What matters in comfort food is not the ingredients. Inside that food there are 'memories and stories'."}, {"isHeading": true, "text": "컴포트 푸드도 바뀌어요", "trans": "Comfort Food Changes Too"}, {"text": "예전에는 컴포트 푸드가 몇 가지 음식뿐이었어요. 그런데 요즘은 그 뜻이 점점 넓어져요. 이유가 세 가지 있어요.", "trans": "In the past, comfort food meant only a few dishes. But these days its meaning keeps getting wider. There are three reasons."}, {"text": "첫 번째는 '브랜드'예요. 어릴 때부터 그 브랜드를 먹었어요. 컴포트 푸드는 맛보다 이야기가 더 중요해요. 그래서 오래된 브랜드가 다시 인기가 많아요. 사람들은 그 음식에서 어릴 때를 느껴요.", "trans": "The first is 'brands'. You have eaten that brand since you were young. In comfort food, the story matters more than the taste. So old brands are popular again. People feel their childhood in that food."}, {"text": "두 번째는 '건강'이에요. 한국 사람들은 아주 빠르게 살았어요. 그런데 요즘 젊은 사람들은 천천히 살아요. 예전에는 술이나 매운 음식으로 스트레스를 풀었어요. 지금은 건강한 음식을 먹어요. 그리고 일이 끝난 후에 집밥을 먹으면서 쉬어요.", "trans": "The second is 'health'. Koreans used to live very fast. But young people these days live slowly. In the past, people worked off stress with alcohol or spicy food. Now they eat healthy food. And after work they rest while eating a home-cooked meal."}, {"text": "세 번째는 'MZ세대의 새로운 생각'이에요. 예전 세대는 집밥에서 힘을 얻었어요. 그런데 MZ세대는 새로운 맛을 찾아요. 그리고 그 맛을 SNS에 올려요. 다른 사람은 그 맛을 몰라요. 그 맛을 먼저 먹으면 기분이 좋아요.", "trans": "The third is 'the new thinking of the MZ generation'. Older generations drew strength from home cooking. But the MZ generation looks for new tastes. And they post those tastes on social media. Other people do not know that taste. It feels good to try it first."}, {"text": "예전 세대는 컴포트 푸드를 과거에서 찾았어요. MZ세대는 지금과 미래에서 찾아요. 배달 음식은 손가락으로 주문해요. 그것도 MZ세대에게는 컴포트 푸드예요.", "trans": "Older generations looked for comfort food in the past. The MZ generation looks for it in the present and the future. Delivery food is ordered with a finger. For them, that is comfort food too."}, {"isHeading": true, "text": "혼자 먹을 때는 먹방을 봐요", "trans": "When Eating Alone, People Watch Mukbang"}, {"text": "요즘은 혼자 사는 사람이 많아요. 그 사람들은 혼자 밥을 먹어요. 자유롭지만 외로워요.", "trans": "These days many people live alone. Those people eat alone. It is free, but lonely."}, {"text": "혼자 먹는 밥이 외로워요. 그때 사람들은 '먹방'을 봐요. 화면 속 사람과 같이 먹어요. 그런 느낌이 들어서 좋아요. 이제는 먹는 것도 위로가 되고, 보는 것도 위로가 돼요.", "trans": "Eating alone is lonely. At those times, people watch 'mukbang'. You eat together with the person on the screen. It feels that way, and that feels good. Now eating is a comfort, and watching is a comfort too."}, {"isHeading": true, "text": "요즘은 순한 맛이 인기예요", "trans": "Mild Flavours Are Popular These Days"}, {"text": "얼마 전까지 매운맛이 아주 인기였어요. 방송도 음식도 점점 더 매웠어요. 그런데 이제 사람들은 그런 것이 피곤해요. 그래서 순한 맛이 다시 인기가 많아요. 이것을 '힐링'이라고 해요.", "trans": "Until recently, spicy flavours were very popular. Both shows and food grew spicier and spicier. But now people find that tiring. So mild flavours are popular again. This is called 'healing'."}, {"text": "예쁜 음식만 좋지 않아요. 집밥은 조금 심심해요. 그렇지만 그 안에 마음이 들어 있어요. 그래서 사람들이 좋아해요. 비싼 음식만 좋아하지 않아요. 매일 먹는 음식도 소중해요.", "trans": "It is not only pretty food that is good. Home cooking tastes a little plain. But there is heart in it. That is why people like it. They do not like only expensive food. The food you eat every day is precious too."}, {"isHeading": true, "text": "나의 컴포트 푸드는 무엇일까요?", "trans": "What Is My Comfort Food?"}, {"text": "편한 음식은 사람마다 달라요. 매운 음식도 좋고 순한 음식도 좋아요. 다섯 시간 끓인 음식도 좋고 3분 데운 음식도 좋아요. 힘든 하루 후에 그 음식이 마음을 채워 줘요. 그게 바로 컴포트 푸드예요.", "trans": "The food that puts you at ease differs from person to person. Spicy food is fine and mild food is fine. Food simmered for five hours is fine, and food heated for three minutes is fine too. After a hard day, that food fills your heart. That is exactly what comfort food is."}]}];
        const VOCAB_READING_DATA = [{"term": "힘들 때", "mainDef": "\"when things are hard.\"", "variants": ["힘들 때"], "subDefs": [{"subTerm": "힘들다", "subDef": "to be hard, to be tough. Used both for work that is hard and for a day that wears you out."}, {"subTerm": "-ㄹ/을 때", "subDef": "\"when ~.\" Marks the moment something happens: 갈 때, 먹을 때, 힘들 때."}], "examples": [{"kor": "힘들 때 친구한테 전화해요.", "eng": "When things are hard, I call a friend."}]}, {"term": "생각나는 음식", "mainDef": "the food that comes to mind.", "variants": ["생각나는 음식"], "subDefs": [{"subTerm": "-는 as in 생각나는", "subDef": "turns a verb into a form that describes the noun after it. 생각나는 음식 = \"food that comes to mind.\""}], "examples": [{"kor": "이건 어머니가 생각나는 음식이에요.", "eng": "This is a food that makes me think of my mother."}]}, {"term": "생각나다", "mainDef": "to come to mind ⸺ not the same as 생각하다. 생각하다 is you doing the thinking; 생각나다 is the thought arriving on its own, without you trying.", "variants": ["생각나요"], "subDefs": [], "examples": [{"kor": "그 노래를 들으면 고향이 생각나요.", "eng": "When I hear that song, my hometown comes to mind."}]}, {"term": "어른이 되어도", "mainDef": "\"even after you become an adult.\"", "variants": ["어른이 되어도"], "subDefs": [{"subTerm": "어른이 되다", "subDef": "to become an adult; to grow up."}, {"subTerm": "-아/어도", "subDef": "\"even if ~, even though ~.\" The second half stays true anyway."}], "examples": [{"kor": "비가 와도 갈 거예요.", "eng": "Even if it rains, I'm going."}]}, {"term": "어른", "mainDef": "an adult, a grown-up.", "variants": ["어른"], "subDefs": [], "examples": [{"kor": "어른은 여기에 앉으세요.", "eng": "Adults, please sit here."}]}, {"term": "힘든 날", "mainDef": "a hard day.", "variants": ["힘든 날"], "subDefs": [{"subTerm": "-ㄴ/은 as in 힘든", "subDef": "turns a describing word into a form that describes the noun after it. 힘들다 becomes 힘든 날."}], "examples": [{"kor": "힘든 날에는 일찍 자요.", "eng": "On a hard day I go to bed early."}]}, {"term": "그때", "mainDef": "\"at that time, right then.\" Points back to the moment just described.", "variants": ["그때"], "subDefs": [], "examples": [{"kor": "어제 여섯 시에 만났어요. 그때 비가 왔어요.", "eng": "We met at six yesterday. It was raining then."}]}, {"term": "어떤 음식", "mainDef": "a certain food.", "variants": ["어떤 음식"], "subDefs": [{"subTerm": "어떤", "subDef": "which ~?, what kind of ~? ⸺ here it is not a question at all. 어떤 음식 = \"some food, a certain food\" the writer has in mind."}], "examples": [{"kor": "어떤 사람이 문 앞에 있었어요.", "eng": "A certain person was standing at the door."}]}, {"term": "학교 앞", "mainDef": "just outside the school.", "variants": ["학교 앞"], "subDefs": [{"subTerm": "앞", "subDef": "the front ⸺ with a building it means the street right outside it, not the front wall."}], "examples": [{"kor": "학교 앞에 작은 가게가 있어요.", "eng": "There is a small shop just outside the school."}]}, {"term": "파는 매운 떡볶이", "mainDef": "the spicy tteokbokki they sell there.", "variants": ["파는 매운 떡볶이"], "subDefs": [{"subTerm": "팔다", "subDef": "to sell."}, {"subTerm": "-는 as in 파는", "subDef": "turns a verb into a form that describes the noun after it. 파는 떡볶이 = \"tteokbokki that they sell.\""}, {"subTerm": "떡볶이", "subDef": "tteokbokki, rice cakes cooked in a sweet and spicy red sauce. The classic snack sold outside Korean schools."}], "examples": [{"kor": "여기에서 파는 빵이 맛있어요.", "eng": "The bread they sell here is good."}]}, {"term": "맵다", "mainDef": "to be spicy, to be hot.", "variants": ["매웠어요", "매운 음식도"], "subDefs": [], "examples": [{"kor": "이 김치는 너무 매워요.", "eng": "This kimchi is too spicy."}]}, {"term": "같은 음식", "mainDef": "\"food like that.\"", "variants": ["같은 음식"], "subDefs": [{"subTerm": "같은", "subDef": "like ~. Put it after a noun to give that noun as an example: 사과 같은 과일 = \"fruit like apples.\""}], "examples": [{"kor": "저는 사과 같은 과일을 좋아해요.", "eng": "I like fruit like apples."}]}, {"term": "어렸을 때", "mainDef": "\"when you were little.\"", "variants": ["어렸을 때"], "subDefs": [{"subTerm": "어리다", "subDef": "to be young, to be little. Used for children."}, {"subTerm": "-았을/었을 때", "subDef": "\"back when ~.\" The past form of -ㄹ/을 때: it points at a time that is finished and gone."}], "examples": [{"kor": "어렸을 때 그 공원에서 놀았어요.", "eng": "When I was little I played in that park."}]}, {"term": "그런 음식", "mainDef": "that kind of food.", "variants": ["그런 음식"], "subDefs": [{"subTerm": "그런", "subDef": "\"that kind of ~.\" Points back to the kind of thing just mentioned, not to one particular item."}], "examples": [{"kor": "저는 그런 영화를 안 좋아해요.", "eng": "I don't like that kind of movie."}]}, {"term": "위로하다", "mainDef": "to comfort someone; to make someone feel better when they are having a hard time.", "variants": ["위로해요"], "subDefs": [], "examples": [{"kor": "친구가 저를 위로해 줬어요.", "eng": "My friend comforted me."}]}, {"term": "이것저것", "mainDef": "\"this and that.\" A bit of everything, with nothing chosen on purpose.", "variants": ["이것저것"], "subDefs": [], "examples": [{"kor": "이것저것 사서 가방이 무거워요.", "eng": "I bought this and that, so my bag is heavy."}]}, {"term": "먹어도", "mainDef": "\"even though you eat.\"", "variants": ["먹어도"], "subDefs": [{"subTerm": "-아/어도 as in 먹어도", "subDef": "second time in this text. Here it sets up a let-down: you do the thing, and still the result does not come ⸺ \"you eat, and it still is not enough.\""}], "examples": [{"kor": "많이 자도 피곤해요.", "eng": "Even though I sleep a lot, I'm tired."}]}, {"term": "뭔가", "mainDef": "something ⸺ used when you cannot name it. Short for 무언가. \"Something is missing, but I don't know what.\"", "variants": ["뭔가"], "subDefs": [], "examples": [{"kor": "뭔가 이상해요.", "eng": "Something is strange."}]}, {"term": "부족하다", "mainDef": "to be not enough; to be short of something.", "variants": ["부족해요"], "subDefs": [], "examples": [{"kor": "시간이 부족해요.", "eng": "There isn't enough time."}]}, {"term": "어머니", "mainDef": "mother ⸺ the polite word. 엄마 is the warm, everyday one you use at home.", "variants": ["어머니"], "subDefs": [], "examples": [{"kor": "어머니께 전화를 드렸어요.", "eng": "I called my mother."}]}, {"term": "생각이 나다", "mainDef": "for a thought of someone to come to you. The spaced form of 생각나다: put a person in front of it and 어머니 생각이 나요 = \"my mother comes to mind.\"", "variants": ["생각이 나요"], "subDefs": [], "examples": [{"kor": "이 사진을 보면 친구 생각이 나요.", "eng": "When I look at this photo, my friend comes to mind."}]}, {"term": "따뜻한 된장찌개", "mainDef": "warm doenjang stew.", "variants": ["따뜻한 된장찌개"], "subDefs": [{"subTerm": "따뜻하다", "subDef": "to be warm."}, {"subTerm": "-ㄴ/은 as in 따뜻한", "subDef": "turns a describing word into a form that describes the noun after it."}, {"subTerm": "된장찌개", "subDef": "doenjang-jjigae, a stew made with fermented soybean paste. The most ordinary home dish there is in Korea."}], "examples": [{"kor": "따뜻한 물을 주세요.", "eng": "Please give me some warm water."}]}, {"term": "만들어 주셨어요", "mainDef": "\"she made it for me.\" Not just 만들었어요 ⸺ 주다 says it was done FOR someone, and -시- says that someone is older than the speaker, so the whole sentence is respectful.", "variants": ["만들어 주셨어요"], "subDefs": [{"subTerm": "-아/어 주다", "subDef": "\"to do ~ for someone.\" The action is a favour, not just an action."}, {"subTerm": "-시- as in 주셨어요", "subDef": "the respect marker. Slot it into the verb when the person doing the action is older or higher than you."}], "examples": [{"kor": "친구가 사진을 찍어 줬어요.", "eng": "My friend took the photo for me."}]}, {"term": "한 숟가락", "mainDef": "one spoonful.", "variants": ["한 숟가락"], "subDefs": [{"subTerm": "숟가락", "subDef": "a spoon ⸺ put a number in front and it counts spoonfuls: 한 숟가락, 두 숟가락."}], "examples": [{"kor": "약을 한 숟가락 먹었어요.", "eng": "I took one spoonful of medicine."}]}, {"term": "그러면", "mainDef": "\"then, and then.\" Links a result to what was just said. 그럼 is the short spoken form.", "variants": ["그러면"], "subDefs": [], "examples": [{"kor": "여기를 누르세요. 그러면 문이 열려요.", "eng": "Press here. Then the door opens."}]}, {"term": "마음", "mainDef": "the heart ⸺ not the organ, but where your feelings sit. Korean puts almost every feeling in 마음: 마음이 따뜻해요, 마음이 편해요, 마음이 아파요.", "variants": ["마음"], "subDefs": [], "examples": [{"kor": "그 말을 듣고 마음이 아팠어요.", "eng": "I heard that and my heart hurt."}]}, {"term": "따뜻해지다", "mainDef": "to grow warm; to get warmer than it was.", "variants": ["따뜻해져요"], "subDefs": [{"subTerm": "-아/어지다", "subDef": "\"to become ~.\" Attach it to a describing word and the state changes by itself: 따뜻하다 → 따뜻해지다."}], "examples": [{"kor": "봄이 오면 날씨가 따뜻해져요.", "eng": "When spring comes, the weather grows warm."}]}, {"term": "회사 일", "mainDef": "work at the office; your job.", "variants": ["회사 일"], "subDefs": [{"subTerm": "회사", "subDef": "a company, an office."}, {"subTerm": "일", "subDef": "work, a job ⸺ it also means \"a thing that happens,\" so context decides which one you are hearing."}], "examples": [{"kor": "요즘 회사 일이 많아요.", "eng": "I have a lot of work these days."}]}, {"term": "삼겹살", "mainDef": "samgyeopsal, thick slices of pork belly grilled at the table. The standard after-work meal with colleagues.", "variants": ["삼겹살"], "subDefs": [], "examples": [{"kor": "금요일에 삼겹살을 먹으러 가요.", "eng": "On Friday we're going out for samgyeopsal."}]}, {"term": "소주 한 잔으로", "mainDef": "\"with a glass of soju.\"", "variants": ["소주 한 잔으로"], "subDefs": [{"subTerm": "소주", "subDef": "soju, the clear Korean spirit drunk in small glasses."}, {"subTerm": "잔", "subDef": "a glass, a cup ⸺ as a counter it counts drinks: 한 잔, 두 잔."}, {"subTerm": "-로/으로 as in 한 잔으로", "subDef": "\"with ~, using ~.\" Marks the thing you use to get something done."}], "examples": [{"kor": "이 문제는 돈으로 못 풀어요.", "eng": "You can't solve this problem with money."}]}, {"term": "스트레스를 풀다", "mainDef": "to work off stress. 풀다 on its own means to untie something ⸺ with 스트레스 it is the knot inside you that gets untied.", "variants": ["스트레스를 풀어요", "스트레스를 풀었어요"], "subDefs": [{"subTerm": "스트레스", "subDef": "stress."}, {"subTerm": "풀다", "subDef": "to untie, to undo ⸺ also used for solving a problem (문제를 풀다) and for working off stress."}], "examples": [{"kor": "저는 운동으로 스트레스를 풀어요.", "eng": "I work off stress with exercise."}]}, {"term": "먹지 않아요", "mainDef": "\"we do not eat.\"", "variants": ["먹지 않아요"], "subDefs": [{"subTerm": "-지 않다", "subDef": "the long way to say \"not ~.\" 안 먹어요 and 먹지 않아요 mean the same thing, but the long form is calmer and is what writing uses."}], "examples": [{"kor": "저는 커피를 마시지 않아요.", "eng": "I don't drink coffee."}]}, {"term": "위로", "mainDef": "comfort; the warm feeling someone or something gives you when you are down. 위로가 되다 = to be a comfort.", "variants": ["'위로'"], "subDefs": [], "examples": [{"kor": "친구의 말이 큰 위로가 됐어요.", "eng": "My friend's words were a great comfort."}]}, {"term": "중요한 것", "mainDef": "\"the thing that matters.\"", "variants": ["중요한 것"], "subDefs": [{"subTerm": "중요하다", "subDef": "to be important, to matter."}, {"subTerm": "-ㄴ/은 것", "subDef": "\"the thing that is ~.\" Turns a describing word into a noun-like chunk."}], "examples": [{"kor": "중요한 것을 먼저 하세요.", "eng": "Do the important thing first."}]}, {"term": "맛이 아니라", "mainDef": "\"not the taste, but…\" The sentence is not finished ⸺ something else is coming right after it.", "variants": ["맛이 아니라"], "subDefs": [{"subTerm": "맛", "subDef": "taste, flavour."}, {"subTerm": "-이/가 아니라", "subDef": "\"not A, but B.\" It always leads on to the real answer. Compare -이/가 아니에요, which just ends the sentence with \"it is not.\""}], "examples": [{"kor": "저는 학생이 아니라 선생님이에요.", "eng": "I'm not a student, I'm a teacher."}]}, {"term": "기억", "mainDef": "a memory; what stays in your head from before. 기억이 나다 = to remember, 기억하다 = to keep it in mind.", "variants": ["기억"], "subDefs": [], "examples": [{"kor": "그날 일이 아직 기억에 있어요.", "eng": "What happened that day is still in my memory."}]}, {"term": "먹을 때", "mainDef": "\"when you eat it.\"", "variants": ["먹을 때"], "subDefs": [{"subTerm": "-ㄹ/을 때 as in 먹을 때", "subDef": "second time in this text. Here it is not one moment but every moment ⸺ \"any time you eat it, this happens.\""}], "examples": [{"kor": "밥을 먹을 때 물을 많이 마셔요.", "eng": "When I eat, I drink a lot of water."}]}, {"term": "기분이 좋다", "mainDef": "to feel good; to be in a good mood.", "variants": ["기분이 좋아요"], "subDefs": [{"subTerm": "기분", "subDef": "mood, how you feel right now ⸺ it is the weather inside you today, not your character."}], "examples": [{"kor": "날씨가 좋아서 기분이 좋아요.", "eng": "The weather is nice, so I feel good."}]}, {"term": "이런 음식", "mainDef": "this kind of food.", "variants": ["이런 음식"], "subDefs": [{"subTerm": "이런", "subDef": "\"this kind of ~.\" 이런 points at what is right here or just said; 그런 points back at what the other person knows."}], "examples": [{"kor": "이런 옷을 찾고 있었어요.", "eng": "I was looking for this kind of clothing."}]}, {"term": "컴포트 푸드", "mainDef": "comfort food ⸺ from English, and Korean took the English words straight rather than translating them. It means food that settles you, not food that tastes best.", "variants": ["컴포트 푸드"], "subDefs": [], "examples": [{"kor": "제 컴포트 푸드는 라면이에요.", "eng": "My comfort food is ramyeon."}]}, {"term": "-라고 해요", "mainDef": "\"we call it ~.\" The standard frame for naming something: put the name in quotes, add 라고 해요, and you have said what people call it.", "variants": ["라고 해요"], "subDefs": [{"subTerm": "-라고/이라고", "subDef": "attaches to the name. -라고 after a vowel, -이라고 after a consonant."}], "examples": [{"kor": "이 꽃을 한국에서 '진달래'라고 해요.", "eng": "In Korea we call this flower 'jindallae.'"}]}, {"term": "어릴 때", "mainDef": "\"when you are young\" ⸺ compare 어렸을 때 earlier in this text. 어렸을 때 puts it firmly in a finished past; 어릴 때 leaves it open as a general time of life.", "variants": ["어릴 때"], "subDefs": [], "examples": [{"kor": "어릴 때 꿈이 뭐였어요?", "eng": "What was your dream when you were young?"}]}, {"term": "기억과 가깝다", "mainDef": "to sit close to a memory ⸺ 가깝다 is normally about distance, but here nothing is near anything physically. It means the two are tightly tied together.", "variants": ["가까워요"], "subDefs": [{"subTerm": "-과/와 as in 기억과", "subDef": "\"with ~, to ~.\" Joins two things. -과 after a consonant, -와 after a vowel."}, {"subTerm": "가깝다", "subDef": "to be close, to be near."}], "examples": [{"kor": "우리 집은 학교와 가까워요.", "eng": "My house is close to the school."}]}, {"term": "어른이 된 후에도", "mainDef": "\"even after you have grown up.\"", "variants": ["어른이 된 후에도"], "subDefs": [{"subTerm": "-ㄴ/은 후에", "subDef": "\"after ~ing.\" The verb takes the past form first: 먹은 후에, 끝난 후에, 된 후에."}, {"subTerm": "-도 as in 후에도", "subDef": "\"even, too.\" Added here it means the thing keeps being true after that point."}], "examples": [{"kor": "숙제를 한 후에 놀아요.", "eng": "I play after I do my homework."}]}, {"term": "옛날", "mainDef": "the old days ⸺ further back than 예전. 옛날 has the feel of \"long, long ago\"; 예전 is just \"some time back.\"", "variants": ["옛날"], "subDefs": [], "examples": [{"kor": "옛날에 여기에 큰 나무가 있었어요.", "eng": "Long ago there was a big tree here."}]}, {"term": "-이라고도 해요", "mainDef": "\"it is also called ~.\" Same naming frame as -라고 해요, with 도 slipped in to add a second name on top of the first.", "variants": ["이라고도 해요"], "subDefs": [{"subTerm": "-도 as in 이라고도", "subDef": "\"also, as well.\" It marks the name as an extra one, not a replacement."}], "examples": [{"kor": "이 빵을 '단팥빵'이라고도 해요.", "eng": "This bread is also called 'danpatbbang.'"}]}, {"term": "재료가 아니에요", "mainDef": "\"it is not the ingredients.\"", "variants": ["재료가 아니에요"], "subDefs": [{"subTerm": "재료", "subDef": "ingredients; the things a dish is made of."}, {"subTerm": "-이/가 아니다", "subDef": "\"it is not ~.\" This one closes the sentence. -이/가 아니라, earlier in this text, does not ⸺ it hands over to what the thing really is."}], "examples": [{"kor": "이건 제 가방이 아니에요.", "eng": "This is not my bag."}]}, {"term": "그 음식 안에", "mainDef": "\"inside that food.\"", "variants": ["음식 안에"], "subDefs": [{"subTerm": "안", "subDef": "the inside ⸺ with 음식, 이야기 or 마음 it is not a physical inside. It means what the thing holds."}, {"subTerm": "-에 as in 안에", "subDef": "marks the place where something is."}], "examples": [{"kor": "가방 안에 책이 있어요.", "eng": "There is a book inside the bag."}]}, {"term": "이야기", "mainDef": "a story; what happened, told to someone.", "variants": ["이야기"], "subDefs": [], "examples": [{"kor": "할머니가 옛날 이야기를 해 주셨어요.", "eng": "Grandmother told me an old story."}]}, {"term": "바뀌다", "mainDef": "to change, to turn into something else ⸺ it happens on its own, with nobody making it happen.", "variants": ["바뀌어요"], "subDefs": [{"subTerm": "바뀌다 vs 바꾸다", "subDef": "바뀌다 changes by itself and takes no object: 뜻이 바뀌어요. 바꾸다 is someone doing the changing and needs an object: 뜻을 바꿔요."}], "examples": [{"kor": "신호등이 초록색으로 바뀌었어요.", "eng": "The traffic light changed to green."}]}, {"term": "예전에는", "mainDef": "\"in the past, back then.\"", "variants": ["예전에는"], "subDefs": [{"subTerm": "예전", "subDef": "some time ago, back then ⸺ nearer than 옛날. 예전 is within living memory; 옛날 is the far past."}, {"subTerm": "-에는", "subDef": "marks a time, with 는 added to set it against now."}], "examples": [{"kor": "예전에는 여기가 시장이었어요.", "eng": "Back then this place was a market."}]}, {"term": "몇 가지", "mainDef": "a few kinds.", "variants": ["몇 가지"], "subDefs": [{"subTerm": "몇", "subDef": "how many? ⸺ here it is not a question. In a statement 몇 means \"a few, some.\""}, {"subTerm": "가지", "subDef": "a kind, a sort. The counter for types of things: 한 가지, 세 가지."}], "examples": [{"kor": "몇 가지 질문이 있어요.", "eng": "I have a few questions."}]}, {"term": "음식뿐이었어요", "mainDef": "\"it was nothing but those dishes.\"", "variants": ["음식뿐이었어요"], "subDefs": [{"subTerm": "-뿐이다", "subDef": "\"only ~, nothing more than ~.\" It shuts the door on anything else."}], "examples": [{"kor": "제 친구는 두 명뿐이에요.", "eng": "I have only two friends."}]}, {"term": "그런데", "mainDef": "\"but, however.\" Turns the sentence against what came before it. 근데 is the short spoken form.", "variants": ["그런데"], "subDefs": [], "examples": [{"kor": "비가 왔어요. 그런데 우산이 없었어요.", "eng": "It rained. But I didn't have an umbrella."}]}, {"term": "요즘", "mainDef": "these days, lately.", "variants": ["요즘"], "subDefs": [], "examples": [{"kor": "요즘 한국어를 공부해요.", "eng": "I've been studying Korean these days."}]}, {"term": "뜻", "mainDef": "a meaning; what a word stands for.", "variants": ["그 뜻"], "subDefs": [], "examples": [{"kor": "이 단어의 뜻을 몰라요.", "eng": "I don't know the meaning of this word."}]}, {"term": "점점", "mainDef": "\"little by little, more and more.\" The change keeps going in one direction.", "variants": ["점점"], "subDefs": [], "examples": [{"kor": "날씨가 점점 추워져요.", "eng": "The weather is getting colder and colder."}]}, {"term": "넓어지다", "mainDef": "to grow wider; to spread out.", "variants": ["넓어져요"], "subDefs": [{"subTerm": "넓다", "subDef": "to be wide, to be broad."}, {"subTerm": "-아/어지다 as in 넓어져요", "subDef": "second time in this text. Same job as in 따뜻해지다: a state turning into another one by itself."}], "examples": [{"kor": "길이 넓어져서 편해요.", "eng": "The road got wider, so it's easier now."}]}, {"term": "이유", "mainDef": "a reason; why something is the way it is.", "variants": ["이유"], "subDefs": [], "examples": [{"kor": "늦은 이유를 말해 주세요.", "eng": "Please tell me the reason you were late."}]}, {"term": "세 가지", "mainDef": "three kinds.", "variants": ["세 가지"], "subDefs": [{"subTerm": "세", "subDef": "three, in the native numbers. Before a counter 셋 becomes 세: 세 가지, 세 잔, 세 명."}], "examples": [{"kor": "세 가지 색이 있어요.", "eng": "There are three colours."}]}, {"term": "첫 번째", "mainDef": "the first one.", "variants": ["첫 번째"], "subDefs": [{"subTerm": "번째", "subDef": "the counter for order. 첫 번째, 두 번째, 세 번째 ⸺ note that 하나 turns into 첫, not 한, in this one."}], "examples": [{"kor": "첫 번째 문제가 제일 어려워요.", "eng": "The first question is the hardest."}]}, {"term": "브랜드", "mainDef": "a brand.", "variants": ["브랜드"], "subDefs": [], "examples": [{"kor": "이 브랜드를 좋아해요.", "eng": "I like this brand."}]}, {"term": "어릴 때부터", "mainDef": "\"ever since you were young.\"", "variants": ["어릴 때부터"], "subDefs": [{"subTerm": "-부터", "subDef": "\"from ~ on.\" Marks where something starts, in time or in order."}], "examples": [{"kor": "아침부터 비가 왔어요.", "eng": "It rained from the morning on."}]}, {"term": "맛보다", "mainDef": "\"than the taste.\"", "variants": ["맛보다"], "subDefs": [{"subTerm": "-보다", "subDef": "\"than ~.\" Sticks straight onto the noun you are comparing against: 맛보다 이야기가 중요해요 = \"the story matters more than the taste.\""}], "examples": [{"kor": "이 가방은 생각보다 비싸요.", "eng": "This bag is more expensive than I thought."}]}, {"term": "중요하다", "mainDef": "to be important, to matter.", "variants": ["중요해요"], "subDefs": [], "examples": [{"kor": "건강이 제일 중요해요.", "eng": "Health matters most."}]}, {"term": "오래된 브랜드", "mainDef": "an old brand; one that has been around a long time.", "variants": ["오래된 브랜드"], "subDefs": [{"subTerm": "오래되다", "subDef": "to be old ⸺ for things, not people. A person who is old is 나이가 많다, never 오래되다."}, {"subTerm": "-ㄴ/은 as in 오래된", "subDef": "the past form that describes the noun after it."}], "examples": [{"kor": "이 가게는 아주 오래됐어요.", "eng": "This shop is very old."}]}, {"term": "인기", "mainDef": "popularity. 인기가 많다 = to be popular; 인기가 있다 says the same a little more quietly.", "variants": ["인기"], "subDefs": [], "examples": [{"kor": "그 가수는 지금 인기가 많아요.", "eng": "That singer is very popular now."}]}, {"term": "많다", "mainDef": "to be many, to be a lot.", "variants": ["많아요"], "subDefs": [], "examples": [{"kor": "오늘은 일이 많아요.", "eng": "There's a lot of work today."}]}, {"term": "어릴 때를 느끼다", "mainDef": "to feel your childhood in something.", "variants": ["어릴 때를 느껴요"], "subDefs": [{"subTerm": "느끼다", "subDef": "to feel something."}, {"subTerm": "-에서 as in 음식에서", "subDef": "\"from ~, in ~.\" Marks the place a feeling or an action comes out of."}], "examples": [{"kor": "이 노래에서 옛날을 느껴요.", "eng": "I feel the old days in this song."}]}, {"term": "건강", "mainDef": "health.", "variants": ["건강"], "subDefs": [], "examples": [{"kor": "건강이 제일 중요해요.", "eng": "Health matters most."}]}, {"term": "빠르게", "mainDef": "fast, quickly.", "variants": ["빠르게"], "subDefs": [{"subTerm": "빠르다", "subDef": "to be fast."}, {"subTerm": "-게 as in 빠르게", "subDef": "turns a describing word into \"in a ~ way.\" 빠르다 becomes 빠르게, \"fast.\""}], "examples": [{"kor": "천천히 말해 주세요. 너무 빠르게 말했어요.", "eng": "Please speak slowly. You spoke too fast."}]}, {"term": "살다", "mainDef": "to live ⸺ here it is not \"to be alive\" but \"to live your life a certain way\": fast, slowly, alone.", "variants": ["살았어요", "살아요"], "subDefs": [], "examples": [{"kor": "저는 서울에서 살아요.", "eng": "I live in Seoul."}]}, {"term": "젊은 사람들", "mainDef": "young people; people in their twenties and thirties.", "variants": ["젊은 사람들"], "subDefs": [{"subTerm": "젊다", "subDef": "to be young ⸺ for adults. A child is 어리다, never 젊다."}, {"subTerm": "-ㄴ/은 as in 젊은", "subDef": "turns a describing word into a form that describes the noun after it."}], "examples": [{"kor": "젊은 사람들이 이 동네에 많이 살아요.", "eng": "A lot of young people live in this neighbourhood."}]}, {"term": "천천히", "mainDef": "slowly.", "variants": ["천천히"], "subDefs": [], "examples": [{"kor": "천천히 드세요.", "eng": "Please eat slowly."}]}, {"term": "술이나 매운 음식", "mainDef": "\"alcohol or spicy food.\"", "variants": ["술이나 매운 음식"], "subDefs": [{"subTerm": "술", "subDef": "alcohol; a drink with alcohol in it."}, {"subTerm": "-이나/나 as in 술이나", "subDef": "\"or.\" Offers two things and lets you take either. -이나 after a consonant, -나 after a vowel."}], "examples": [{"kor": "커피나 차를 드세요.", "eng": "Have coffee or tea."}]}, {"term": "건강한 음식", "mainDef": "healthy food.", "variants": ["건강한 음식"], "subDefs": [{"subTerm": "건강하다", "subDef": "to be healthy."}, {"subTerm": "-ㄴ/은 as in 건강한", "subDef": "turns a describing word into a form that describes the noun after it."}], "examples": [{"kor": "건강한 음식을 먹으려고 해요.", "eng": "I'm trying to eat healthy food."}]}, {"term": "일이 끝난 후에", "mainDef": "\"after work is over.\"", "variants": ["일이 끝난 후에"], "subDefs": [{"subTerm": "일이 끝나다", "subDef": "for work to be over, to finish."}, {"subTerm": "-ㄴ/은 후에 as in 끝난 후에", "subDef": "second time in this text. Same pattern as 어른이 된 후에도, without the 도."}], "examples": [{"kor": "수업이 끝난 후에 만나요.", "eng": "Let's meet after class is over."}]}, {"term": "집밥", "mainDef": "home cooking ⸺ 집(home) + 밥(rice, a meal), squeezed into one word. Not a dish but a whole category: whatever gets cooked at home, as opposed to bought outside.", "variants": ["집밥"], "subDefs": [], "examples": [{"kor": "오랜만에 집밥을 먹었어요.", "eng": "I ate home cooking for the first time in a while."}]}, {"term": "먹으면서 쉬어요", "mainDef": "\"they rest while eating.\"", "variants": ["먹으면서 쉬어요"], "subDefs": [{"subTerm": "-면서/으면서 as in 먹으면서", "subDef": "\"while ~ing.\" Two things done by the same person at the same time."}, {"subTerm": "쉬다", "subDef": "to rest, to take a break."}], "examples": [{"kor": "음악을 들으면서 공부해요.", "eng": "I study while listening to music."}]}, {"term": "MZ세대", "mainDef": "the MZ generation ⸺ Korea folds M(millennials) and Z(Gen Z) into one label for people roughly in their twenties and thirties. You will meet it constantly in Korean news and ads.", "variants": ["MZ세대"], "subDefs": [{"subTerm": "세대", "subDef": "a generation; the people born around the same time."}], "examples": [{"kor": "MZ세대는 사진을 많이 찍어요.", "eng": "The MZ generation takes a lot of photos."}]}, {"term": "새로운 생각", "mainDef": "a new way of thinking.", "variants": ["새로운 생각"], "subDefs": [{"subTerm": "새롭다", "subDef": "to be new."}, {"subTerm": "새 vs 새로운", "subDef": "새 goes straight in front of a noun and never changes: 새 옷, 새 집. 새로운 is the describing form of 새롭다 and carries more feeling: 새로운 생각, \"a way of thinking that is genuinely new.\""}], "examples": [{"kor": "새로운 방법을 찾았어요.", "eng": "I found a new way."}]}, {"term": "예전 세대", "mainDef": "the older generation; the people who came before.", "variants": ["예전 세대"], "subDefs": [], "examples": [{"kor": "예전 세대는 편지를 많이 썼어요.", "eng": "The older generation wrote a lot of letters."}]}, {"term": "힘을 얻다", "mainDef": "to draw strength from something.", "variants": ["힘을 얻었어요"], "subDefs": [{"subTerm": "힘", "subDef": "strength, energy."}, {"subTerm": "얻다", "subDef": "to get, to gain ⸺ something comes to you, rather than you buying or making it."}], "examples": [{"kor": "친구의 말에서 힘을 얻었어요.", "eng": "I drew strength from my friend's words."}]}, {"term": "찾다", "mainDef": "to look for ⸺ and also to find. Korean uses one verb for both, so 찾아요 can be \"I'm looking for it\" or \"I found it,\" depending on the sentence.", "variants": ["찾아요", "찾았어요"], "subDefs": [], "examples": [{"kor": "열쇠를 찾고 있어요.", "eng": "I'm looking for my keys."}]}, {"term": "SNS에 올리다", "mainDef": "to post it on social media.", "variants": ["SNS에 올려요"], "subDefs": [{"subTerm": "SNS", "subDef": "\"social networking service.\" Korean says SNS where English says \"social media.\""}, {"subTerm": "올리다", "subDef": "to put something up ⸺ online it means to post: 사진을 올리다, 글을 올리다."}], "examples": [{"kor": "여행 사진을 SNS에 올렸어요.", "eng": "I posted my travel photos on social media."}]}, {"term": "다른 사람", "mainDef": "other people; someone else.", "variants": ["다른 사람"], "subDefs": [{"subTerm": "다른", "subDef": "other, different ⸺ from 다르다. Do not mix it with 틀리다, which means \"wrong.\" 생각이 달라요 = we think differently; 답이 틀려요 = the answer is wrong."}], "examples": [{"kor": "다른 사람에게 물어보세요.", "eng": "Please ask someone else."}]}, {"term": "모르다", "mainDef": "to not know.", "variants": ["몰라요"], "subDefs": [{"subTerm": "모르다 → 몰라요", "subDef": "a 르 verb: the 르 drops and an extra ㄹ appears. 모르다 → 몰라요, 다르다 → 달라요, 부르다 → 불러요."}], "examples": [{"kor": "그 사람 이름을 몰라요.", "eng": "I don't know that person's name."}]}, {"term": "먼저 먹으면", "mainDef": "\"if you eat it first.\"", "variants": ["먼저 먹으면"], "subDefs": [{"subTerm": "먼저", "subDef": "first; before anyone else."}, {"subTerm": "-면/으면", "subDef": "\"if ~, when ~.\" Sets up the condition, and the result comes after it."}], "examples": [{"kor": "이 약을 먹으면 좋아져요.", "eng": "If you take this medicine, you get better."}]}, {"term": "과거", "mainDef": "the past.", "variants": ["과거"], "subDefs": [], "examples": [{"kor": "과거는 바꿀 수 없어요.", "eng": "You can't change the past."}]}, {"term": "미래", "mainDef": "the future.", "variants": ["미래"], "subDefs": [], "examples": [{"kor": "미래를 준비해요.", "eng": "I'm getting ready for the future."}]}, {"term": "배달 음식", "mainDef": "delivery food; food ordered in.", "variants": ["배달 음식"], "subDefs": [{"subTerm": "배달", "subDef": "delivery. 배달하다 = to deliver, 배달이 오다 = for a delivery to arrive."}], "examples": [{"kor": "주말에는 배달 음식을 자주 먹어요.", "eng": "I often eat delivery food on weekends."}]}, {"term": "손가락으로", "mainDef": "\"with a finger.\"", "variants": ["손가락으로"], "subDefs": [{"subTerm": "손가락", "subDef": "a finger. 손(hand) + 가락(a thin stick-shaped thing), the same 가락 as in 젓가락, chopsticks."}, {"subTerm": "-로/으로 as in 손가락으로", "subDef": "second time in this text. Same job as in 소주 한 잔으로: it marks the tool."}], "examples": [{"kor": "핸드폰은 손가락으로 써요.", "eng": "You use a phone with your fingers."}]}, {"term": "주문하다", "mainDef": "to order something.", "variants": ["주문해요"], "subDefs": [], "examples": [{"kor": "커피 두 잔을 주문했어요.", "eng": "I ordered two coffees."}]}, {"term": "혼자", "mainDef": "alone, by yourself.", "variants": ["혼자"], "subDefs": [], "examples": [{"kor": "저는 혼자 여행을 자주 해요.", "eng": "I often travel alone."}]}, {"term": "먹방", "mainDef": "mukbang ⸺ 먹다(to eat) + 방송(broadcast), cut down to two syllables. A video of someone eating, which other people watch while they eat. The word started in Korea and English borrowed it back.", "variants": ["먹방"], "subDefs": [], "examples": [{"kor": "저녁에 먹방을 봐요.", "eng": "I watch mukbang in the evening."}]}, {"term": "혼자 사는 사람", "mainDef": "a person who lives alone.", "variants": ["혼자 사는 사람"], "subDefs": [{"subTerm": "혼자 살다", "subDef": "to live alone; to live by yourself."}, {"subTerm": "-는 as in 사는", "subDef": "turns a verb into a form that describes the noun after it. 사는 사람 = \"a person who lives.\""}], "examples": [{"kor": "혼자 사는 사람이 점점 많아져요.", "eng": "There are more and more people living alone."}]}, {"term": "밥", "mainDef": "cooked rice ⸺ and also a meal, any meal. 밥 먹었어요? is the everyday way of asking \"have you eaten?\", whether or not rice was involved.", "variants": ["밥을 먹어요"], "subDefs": [], "examples": [{"kor": "아침에 밥을 안 먹었어요.", "eng": "I didn't eat this morning."}]}, {"term": "자유롭지만", "mainDef": "\"it is free, but…\"", "variants": ["자유롭지만"], "subDefs": [{"subTerm": "자유롭다", "subDef": "to be free; to be able to do as you like."}, {"subTerm": "-지만", "subDef": "\"but ~.\" Joins two halves that pull against each other, inside one sentence."}], "examples": [{"kor": "이 옷은 예쁘지만 비싸요.", "eng": "These clothes are pretty, but expensive."}]}, {"term": "외롭다", "mainDef": "to be lonely.", "variants": ["외로워요"], "subDefs": [{"subTerm": "외롭다 → 외로워요", "subDef": "a ㅂ adjective: the ㅂ turns into 워. 외롭다 → 외로워요, 춥다 → 추워요, 어렵다 → 어려워요."}], "examples": [{"kor": "비 오는 날에는 조금 외로워요.", "eng": "On rainy days I feel a little lonely."}]}, {"term": "혼자 먹는 밥", "mainDef": "a meal eaten alone.", "variants": ["혼자 먹는 밥"], "subDefs": [{"subTerm": "-는 as in 먹는", "subDef": "turns a verb into a form that describes the noun after it, for something that happens now or always."}], "examples": [{"kor": "혼자 먹는 밥은 빨리 끝나요.", "eng": "A meal eaten alone is over fast."}]}, {"term": "화면 속 사람", "mainDef": "the person on the screen.", "variants": ["화면 속 사람"], "subDefs": [{"subTerm": "화면", "subDef": "a screen; the screen of a phone, a TV or a computer."}, {"subTerm": "속", "subDef": "the inside ⸺ with 화면, 책 or 이야기 it means the world shown in there, not a physical inside."}], "examples": [{"kor": "영화 속 도시가 예뻐요.", "eng": "The city in the movie is pretty."}]}, {"term": "느낌이 들다", "mainDef": "for a feeling to come over you. 들다 by itself is \"to go in\" ⸺ Korean has the feeling walk into you, rather than you having it.", "variants": ["느낌이 들어서"], "subDefs": [{"subTerm": "느낌", "subDef": "a feeling; a sense of something."}, {"subTerm": "-아서/어서 as in 들어서", "subDef": "\"because ~, so ...\" The first half is the reason for the second."}], "examples": [{"kor": "누가 부른 느낌이 들었어요.", "eng": "I had the feeling someone called me."}]}, {"term": "이제", "mainDef": "now ⸺ but not the same \"now\" as 지금. 지금 is this very moment; 이제 is \"from this point on, unlike before.\"", "variants": ["이제"], "subDefs": [], "examples": [{"kor": "이제 괜찮아요.", "eng": "I'm fine now."}]}, {"term": "먹는 것", "mainDef": "\"eating\"; the act of eating.", "variants": ["먹는 것"], "subDefs": [{"subTerm": "-는 것", "subDef": "\"the act of ~ing.\" Turns a verb into a noun-like chunk, so you can put it where a noun goes. The same sentence does it twice: 먹는 것도, 보는 것도."}], "examples": [{"kor": "운동하는 것이 건강에 좋아요.", "eng": "Exercising is good for your health."}]}, {"term": "위로가 되다", "mainDef": "to be a comfort; to end up comforting someone.", "variants": ["위로가 되고", "위로가 돼요"], "subDefs": [{"subTerm": "-이/가 되다", "subDef": "\"to become ~, to turn into ~.\" The noun in front is what it turns into."}, {"subTerm": "-고 as in 되고", "subDef": "\"and.\" Lines up two things that are both true."}], "examples": [{"kor": "따뜻한 말이 큰 위로가 돼요.", "eng": "Warm words are a great comfort."}]}, {"term": "순한 맛", "mainDef": "a mild flavour.", "variants": ["순한 맛"], "subDefs": [{"subTerm": "순하다", "subDef": "to be mild, to be gentle ⸺ used for food that is not spicy, and also for a person who is easy-going."}, {"subTerm": "-ㄴ/은 as in 순한", "subDef": "turns a describing word into a form that describes the noun after it."}], "examples": [{"kor": "아이들은 순한 맛을 좋아해요.", "eng": "Children like mild flavours."}]}, {"term": "얼마 전까지", "mainDef": "\"until a little while ago.\"", "variants": ["얼마 전까지"], "subDefs": [{"subTerm": "얼마 전", "subDef": "a little while ago. 얼마 on its own asks \"how much?\", but 얼마 전 is a statement: \"not long ago.\""}, {"subTerm": "-까지", "subDef": "\"up until ~.\" Marks where something stops. Its partner is -부터, \"from.\""}], "examples": [{"kor": "지난주까지 아주 바빴어요.", "eng": "I was very busy until last week."}]}, {"term": "매운맛", "mainDef": "spicy flavour. Written as one word ⸺ 맵다 becomes 매운, and it fuses onto 맛. Same shape as 단맛(sweet), 짠맛(salty).", "variants": ["매운맛"], "subDefs": [], "examples": [{"kor": "저는 매운맛을 잘 못 먹어요.", "eng": "I can't handle spicy flavours well."}]}, {"term": "방송", "mainDef": "a broadcast; a TV or internet show.", "variants": ["방송"], "subDefs": [], "examples": [{"kor": "그 방송을 매주 봐요.", "eng": "I watch that show every week."}]}, {"term": "피곤하다", "mainDef": "to be tired ⸺ here it is not the body that is tired. 그런 것이 피곤해요 means people are tired OF it, worn out by the whole thing.", "variants": ["피곤해요"], "subDefs": [], "examples": [{"kor": "어제 늦게 자서 피곤해요.", "eng": "I went to bed late yesterday, so I'm tired."}]}, {"term": "힐링", "mainDef": "healing ⸺ taken from English, but Korean uses it far more widely. Anything that settles you is 힐링: a quiet café, a walk, a mild bowl of soup. Not about medicine at all.", "variants": ["힐링"], "subDefs": [], "examples": [{"kor": "주말에 바다에 가면 힐링이 돼요.", "eng": "Going to the sea on the weekend is healing."}]}, {"term": "예쁜 음식만", "mainDef": "\"only pretty food.\"", "variants": ["예쁜 음식만"], "subDefs": [{"subTerm": "예쁘다", "subDef": "to be pretty."}, {"subTerm": "-만", "subDef": "\"only ~, nothing but ~.\" It goes straight onto the noun and pushes everything else out."}], "examples": [{"kor": "물만 마셨어요.", "eng": "I only drank water."}]}, {"term": "좋지 않아요", "mainDef": "\"it is not (only that) which is good.\" Read it with 예쁜 음식만 in front: the writer is not saying pretty food is bad ⸺ he is saying it is not the only good kind.", "variants": ["좋지 않아요"], "subDefs": [{"subTerm": "-지 않다 as in 좋지 않아요", "subDef": "second time in this text. When a -만 sits in front of it, the \"not\" lands on the 만, not on the verb."}], "examples": [{"kor": "이 책만 좋지 않아요. 저 책도 좋아요.", "eng": "It's not only this book that's good. That one is good too."}]}, {"term": "심심하다", "mainDef": "to be bored ⸺ but with food it is the food that is plain. 집밥은 조금 심심해요 means the taste is mild and under-seasoned, not that the meal is boring you.", "variants": ["심심해요"], "subDefs": [], "examples": [{"kor": "국이 조금 심심해요. 소금을 넣을까요?", "eng": "The soup is a bit plain. Shall I add salt?"}]}, {"term": "그렇지만", "mainDef": "\"but even so.\" Softer than 그런데: it admits what was just said and then pushes back against it anyway.", "variants": ["그렇지만"], "subDefs": [], "examples": [{"kor": "돈이 없어요. 그렇지만 행복해요.", "eng": "I have no money. But even so, I'm happy."}]}, {"term": "마음이 들어 있어요", "mainDef": "\"there is heart in it.\"", "variants": ["마음이 들어 있어요"], "subDefs": [{"subTerm": "들다", "subDef": "to go in, to be contained in something."}, {"subTerm": "-아/어 있다", "subDef": "marks the state left behind after the action. 들어 있다 = it went in, and it is still in there."}], "examples": [{"kor": "이 상자 안에 편지가 들어 있어요.", "eng": "There is a letter in this box."}]}, {"term": "소중하다", "mainDef": "to be precious; to be worth taking care of. Used for people and everyday things, not for expensive ones ⸺ that is 비싸다.", "variants": ["소중해요"], "subDefs": [], "examples": [{"kor": "가족이 제일 소중해요.", "eng": "Family is the most precious thing."}]}, {"term": "나의", "mainDef": "my ⸺ the written form. In speech you would say 제 (polite) or 내 (casual); 나의 shows up in titles, songs and writing.", "variants": ["나의"], "subDefs": [], "examples": [{"kor": "이건 나의 이야기예요.", "eng": "This is my story."}]}, {"term": "무엇일까요?", "mainDef": "\"I wonder what it is.\" A question the writer asks you, not one he expects an answer to right now.", "variants": ["무엇일까요"], "subDefs": [{"subTerm": "무엇", "subDef": "what ⸺ the full form. 뭐 is the short spoken one: 뭐예요? / 무엇입니까?"}, {"subTerm": "-ㄹ까요?/을까요?", "subDef": "used to wonder aloud or to suggest something together: 갈까요? = \"shall we go?\", 무엇일까요? = \"what could it be?\""}], "examples": [{"kor": "내일 날씨가 어떨까요?", "eng": "I wonder what the weather will be like tomorrow."}]}, {"term": "편한 음식", "mainDef": "food that puts you at ease.", "variants": ["편한 음식"], "subDefs": [{"subTerm": "편하다", "subDef": "to be comfortable, to be at ease. 마음이 편하다 = to have nothing weighing on you."}, {"subTerm": "-ㄴ/은 as in 편한", "subDef": "turns a describing word into a form that describes the noun after it."}], "examples": [{"kor": "편한 신발을 신으세요.", "eng": "Wear comfortable shoes."}]}, {"term": "사람마다", "mainDef": "\"person by person\"; each person differently.", "variants": ["사람마다"], "subDefs": [{"subTerm": "-마다", "subDef": "\"each and every ~.\" 날마다 = every day, 사람마다 = every person."}], "examples": [{"kor": "나라마다 인사가 달라요.", "eng": "Greetings are different in every country."}]}, {"term": "다르다", "mainDef": "to be different ⸺ not 틀리다. 틀리다 means \"wrong,\" and Koreans themselves mix the two up, so getting it right is noticed.", "variants": ["달라요"], "subDefs": [], "examples": [{"kor": "제 생각은 조금 달라요.", "eng": "My opinion is a little different."}]}, {"term": "끓인 음식", "mainDef": "food that was simmered.", "variants": ["끓인 음식"], "subDefs": [{"subTerm": "끓이다", "subDef": "to boil something, to simmer it. 물이 끓다 = the water boils by itself; 물을 끓이다 = you boil it."}, {"subTerm": "-ㄴ/은 as in 끓인", "subDef": "the past form that describes the noun after it."}], "examples": [{"kor": "어머니가 끓인 국이 제일 맛있어요.", "eng": "The soup my mother made is the best."}]}, {"term": "데운 음식", "mainDef": "food that was heated up.", "variants": ["데운 음식"], "subDefs": [{"subTerm": "데우다", "subDef": "to heat something up ⸺ something already cooked, made warm again. Not the same as 끓이다, which cooks it from the start."}, {"subTerm": "-ㄴ/은 as in 데운", "subDef": "the past form that describes the noun after it."}], "examples": [{"kor": "찬밥을 데워서 먹었어요.", "eng": "I heated up the cold rice and ate it."}]}, {"term": "힘든 하루 후에", "mainDef": "\"after a hard day.\"", "variants": ["힘든 하루 후에"], "subDefs": [{"subTerm": "하루", "subDef": "one day; a day from morning to night."}, {"subTerm": "-ㄴ/은 후에 as in 하루 후에", "subDef": "third time in this text ⸺ and the only one that follows a noun instead of a verb. After a noun it is just 후에: 수업 후에, 하루 후에."}], "examples": [{"kor": "시험 후에 친구를 만났어요.", "eng": "I met a friend after the exam."}]}, {"term": "마음을 채워 주다", "mainDef": "to fill your heart for you.", "variants": ["마음을 채워 줘요"], "subDefs": [{"subTerm": "채우다", "subDef": "to fill something up. 빈 곳을 채워요 = you fill the empty place."}, {"subTerm": "-아/어 주다 as in 채워 줘요", "subDef": "second time in this text. Same job as in 만들어 주셨어요: the action is done for someone."}], "examples": [{"kor": "따뜻한 국이 배를 채워 줘요.", "eng": "Warm soup fills you up."}]}, {"term": "그게 바로", "mainDef": "\"that, exactly, is…\" The closing move: everything before it was building to this.", "variants": ["그게 바로"], "subDefs": [{"subTerm": "그게", "subDef": "short for 그것이, \"that thing.\""}, {"subTerm": "바로", "subDef": "exactly, none other than ⸺ it points hard at the word right after it."}], "examples": [{"kor": "그게 바로 제가 찾는 거예요.", "eng": "That is exactly the one I'm looking for."}]}];
        const ANSWER_CHOICES = [];
        const QUIZ_LIST = [{"id": 1, "questionKor": "힘든 날에 무슨 음식이 생각나요?", "questionEng": "What kind of food comes to mind on a hard day?", "sentence_pre": "어렸을 때 ", "sentence_post": " 음식을 먹었어요.", "correct_word": "그런", "translation": "You ate food like that when you were young.", "hint": "Points back to the food just described, so you don't have to name it again.", "options": [{"text": "그런", "isCorrect": true, "feedback": "맞아요. 바로 앞 문장의 '매운 떡볶이 같은 음식'을 가리켜요. 같은 말을 다시 쓰지 않으려고 '그런'을 써요."}, {"text": "어떤", "isCorrect": false, "feedback": "아니에요. '어떤'은 아직 무엇인지 모를 때 써요. 여기는 이미 앞에서 말했어요."}, {"text": "이런", "isCorrect": false, "feedback": "가까워요. 하지만 '이런'은 지금 눈앞에 있는 것이에요. 앞 문장을 가리킬 때는 '그런'이에요."}, {"text": "무슨", "isCorrect": false, "feedback": "달라요. '무슨'은 물어볼 때 써요."}]}, {"id": 2, "questionKor": "빈칸에 알맞은 연결어미를 고르세요.", "questionEng": "Choose the connective ending that fits the blank.", "sentence_pre": "", "sentence_post": " 힘든 날이 있어요.", "correct_word": "어른이 되어도", "translation": "Even after you grow up, there are hard days.", "hint": "Verb 어른이 되다 ('to grow up'). Which ending says that growing up does NOT make the hard days go away?", "options": [{"text": "어른이 되어도", "isCorrect": true, "feedback": "Correct! -아도/어도 means 'even if / even though'. Growing up would normally be the end of childhood troubles — but the second half stays true anyway: hard days still come."}, {"text": "어른이 되니까", "isCorrect": false, "feedback": "Nope! -니까 means 'because / since', so this would say hard days exist BECAUSE you grew up. The writer's point is the opposite: growing up does not protect you."}, {"text": "어른이 되려고", "isCorrect": false, "feedback": "Not this one! -려고/으려고 means 'in order to'. 'In order to become an adult, there are hard days' — the logic falls apart. Nobody has hard days on purpose."}, {"text": "어른이 되면서", "isCorrect": false, "feedback": "Wrong angle! -면서/으면서 means 'while ~ing', two things at the same time. Growing up takes years; it is not something happening at the same moment as one hard day."}]}, {"id": 3, "questionKor": "이것저것 먹어도 어때요?", "questionEng": "Even after eating this and that, how is it?", "sentence_pre": "이것저것 먹어도 뭔가 ", "sentence_post": ".", "correct_word": "부족해요", "translation": "You eat this and that, and something is still missing.", "hint": "Adjective. Your stomach is full, but something is still missing.", "options": [{"text": "부족해요", "isCorrect": true, "feedback": "맞아요. 배는 불러도 무언가 모자란 느낌이에요. 그래서 다음 문장에서 어머니 생각이 나는 거예요."}, {"text": "편해요", "isCorrect": false, "feedback": "반대예요. 편하면 다른 음식을 찾지 않아요."}, {"text": "배불러요", "isCorrect": false, "feedback": "달라요. 배는 이미 불러요. 문제는 배가 아니라 마음이에요."}, {"text": "맛있어요", "isCorrect": false, "feedback": "아니에요. 맛 이야기가 아니라 무언가 모자란 느낌 이야기예요."}]}, {"id": 4, "questionKor": "어머니가 무엇을 만들어 주셨어요?", "questionEng": "What did your mother make for you?", "sentence_pre": "어머니가 ", "sentence_post": " 된장찌개를 만들어 주셨어요.", "correct_word": "따뜻한", "translation": "Your mother used to make you warm doenjang stew.", "hint": "Adjective + -ㄴ. Not hot like fire — the gentle warmth of food and of a person.", "options": [{"text": "따뜻한", "isCorrect": true, "feedback": "맞아요. 뜨거운 것과 달라요. 음식의 온도이면서 마음의 온도이기도 해요. 그래서 다음 문장이 '마음이 따뜻해져요'로 이어져요."}, {"text": "차가운", "isCorrect": false, "feedback": "반대예요. 찬 찌개는 위로가 되지 않아요."}, {"text": "비싼", "isCorrect": false, "feedback": "달라요. 값 이야기는 여기에 없어요."}, {"text": "매운", "isCorrect": false, "feedback": "아니에요. 매운 음식은 뒤에 다른 곳에서 나와요."}]}, {"id": 5, "questionKor": "우리는 힘들 때 무엇을 먹는 거예요?", "questionEng": "When life is hard, what is it that we are really eating?", "sentence_pre": "우리는 힘들 때 '음식'을 먹지 않아요. '", "sentence_post": "'를 먹어요.", "correct_word": "위로", "translation": "When things are hard, we do not eat 'food'. We eat 'comfort'.", "hint": "Noun. What a tired heart gets from a warm bowl.", "options": [{"text": "위로", "isCorrect": true, "feedback": "Exactly! 위로 is comfort — the thing that makes a tired heart feel better. That one word is the whole point of the article."}, {"text": "재료", "isCorrect": false, "feedback": "Nope! 재료 is 'ingredients' — the things that go into the food. But what we really eat on a hard day is something you cannot put in a pot."}, {"text": "양념", "isCorrect": false, "feedback": "Not quite! 양념 is 'seasoning'. The article says plainly that what matters is not the seasoning but the memory."}, {"text": "인기", "isCorrect": false, "feedback": "Off track! 인기 is 'popularity'. Nobody eats samgyeopsal after work to become popular."}]}, {"id": 6, "questionKor": "컴포트 푸드는 어릴 때의 무엇과 가까워요?", "questionEng": "Comfort food is close to what, from childhood?", "sentence_pre": "컴포트 푸드는 어릴 때 ", "sentence_post": "과 아주 가까워요.", "correct_word": "기억", "translation": "Comfort food is very close to childhood memories.", "hint": "Noun. The plain fact of being able to bring the past back.", "options": [{"text": "기억", "isCorrect": true, "feedback": "Correct! 기억 is memory. That is why the article says comfort food is also called '메모리 음식' — memory food."}, {"text": "재료", "isCorrect": false, "feedback": "Nope! 재료 is 'ingredients'. The text says straight out that what matters is not the ingredients — so this is the very thing it rules out."}, {"text": "방송", "isCorrect": false, "feedback": "Not even close! 방송 is 'a broadcast'. Mukbang shows up much later in the article, and it is not what childhood comfort food is built on."}, {"text": "인기", "isCorrect": false, "feedback": "Wrong one! 인기 is 'popularity'. Old brands regain popularity BECAUSE of memory — memory comes first."}]}, {"id": 7, "questionKor": "지금 사람들은 어떤 음식을 먹어요?", "questionEng": "What kind of food do people eat now?", "sentence_pre": "지금은 ", "sentence_post": " 음식을 먹어요.", "correct_word": "건강한", "translation": "Now they eat healthy food.", "hint": "Adjective + -ㄴ. The opposite of alcohol and spicy food, in the sentence before.", "options": [{"text": "건강한", "isCorrect": true, "feedback": "맞아요. 앞 문장의 '술이나 매운 음식'과 반대예요. 스트레스를 푸는 방법이 바뀌었다는 뜻이에요."}, {"text": "비싼", "isCorrect": false, "feedback": "아니에요. 값 이야기는 여기에 없어요."}, {"text": hink about everyday food?", "sentence_pre": "매일 먹는 음식도 ", "sentence_post": ".", "correct_word": "소중해요", "translation": "The food you eat every day is precious too.", "hint": "Adjective. Something you would not want to lose, even if it is not expensive.", "options": [{"text": "소중해요", "isCorrect": true, "feedback": "맞아요. 비싼 음식만 좋아하지 않는다는 앞 문장과 이어져요. 값이 아니라 마음이 기준이라는 뜻이에요."}, {"text": "심심해요", "isCorrect": false, "feedback": "달라요. 맛이 약하다는 뜻이에요. 여기는 맛 이야기가 아니에요."}, {"text": "비싸요", "isCorrect": false, "feedback": "반대예요. 앞 문장이 바로 '비싼 음식만 좋아하지 않아요'예요."}, {"text": "피곤해요", "isCorrect": false, "feedback": "아니에요. 피곤한 것은 너무 매운 방송과 음식이에요."}]}];

ck inline-flex items-center gap-1">Gemini에서 열기 ${svgIcon('externalLink', 'w-3 h-3')}</a></p>`}</div>` : '';
            return `<div class="flex items-center gap-4"><div class="flex items-center gap-2"><button type="button" data-action="toggle-highlight" class="p-1 ${reading.highlightMode ? 'text-black' : 'text-gray-300 hover:text-gray-500'}">${svgIcon('highlighter', 'w-5 h-5', { style: `color:${hex}` })}</button>${colorBtns}</div><div class="w-px h-3 bg-gray-200"></div><div class="relative"><button type="button" data-action="toggle-dict" class="flex items-center gap-2 text-xs font-bold font-sans uppercase tracking-wider transition-colors ${reading.showDict ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}">${svgIcon('search', 'w-4 h-4')}<span>사전<span class="lk-en"> · Dictionary</span></span></button>${dictPanel}</div><div class="w-px h-3 bg-gray-200"></div><button type="button" data-action="toggle-vocab" class="flex items-center gap-2 text-xs font-bold font-sans uppercase ${app.showVocab ? 'text-black' : 'text-gray-400 hover:text-gray-600'}">${svgIcon('openbook', 'w-4 h-4')} <span>어휘 목록<span class="lk-en"> · Word List</span></span></button></div>`;
        }
        function readingHTML() {

            try {
                const ctx = qs('#survey-chart', viewRoot()).getContext('2d');
                const unit = C.unit || '';
                new window.Chart(ctx, {
                    type: C.type || 'bar',

                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.label || ''}: ${(c.parsed && c.parsed.y != null) ? c.parsed.y : c.parsed}${unit}` } } },
                        scales: isPie ? {} : { y: { beginAtZero: true, ticks: { callback: (v) => v + unit, font: { size: 11 } }, grid: { color: '#f3f4f6' } }, x: { grid: { display: false }, ticks: { font: { size: 11 } } } }
                    }

            } catch (e) {}
        }
        function rerenderReadingBlocks() { const w = qs('#reading-blocks', viewRoot()); if (w) { w.innerHTML = readingBlocksHTML(); mountChart(); } }
        // ---------- 8a. 낭독 오디오 · playbar (자체 호스팅) ----------
        // 사용법
        //   1) 오디오 파일을 hub/assets/audio/ 에 올린다.  예) hub/assets/audio/a2plus-michelin-stars.m4a
        //   2) AUDIO_CFG.src 에 그 파일 URL을 적는다. 기존 자료와 같은 절대 URL 권장:
        //      'https://openkoreanlearninglab.github.io/hub/assets/audio/<파일명>'  (content/ 안이라면 '../assets/audio/<파일명>' 도 동작)
        //   3) 오디오를 붙일 읽기 자료의 READING_DATA 항목에 audio:true, audioLabel:"..." 를 넣는다.
        // 규칙
        //   · audio:true 인 읽기 자료에만 플레이어가 렌더된다(읽기 1↔2 전환 시 자동 마운트).
        //   · 라벨은 코드에 하드코딩하지 말고 READING_DATA[].audioLabel 로 넣는다(기본값 '오디오').
        //   · 재생 위치·배속은 탭을 옮겼다 돌아와도 유지된다(자동 재생은 하지 않는다).
        //   · playbar는 직접 그린다(브라우저 기본 컨트롤 미사용) — 크롬·사파리·모바일에서 모양이 같다.
        //   · 저작권이 있는 남의 음원은 자체 호스팅하지 않는다. 직접 만든 낭독·팟캐스트에만 쓴다.
        const AUDIO_CFG = { src: 'https://openkoreanlearninglab.github.io/hub/assets/audio/a2plus-comfort-food.m4a', rates: [0.75, 1, 1.25, 1.5], skip: 15 };
        const audioState = { rate: 1, time: 0, playing: false, seeking: false, bound: false };
        let audioEl = null;

        function fmtTime(s) {
            if (!isFinite(s) || s < 0) return '--:--';
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
            const mm = h ? String(m).padStart(2, '0') : String(m);
            return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
        }
        function audioRateBtnsHTML() {
            return AUDIO_CFG.rates.map(function (r) {
                const on = Math.abs(audioState.rate - r) < 0.001 ? ' on' : '';
                return '<button type="button" data-action="audio-rate" data-rate="' + r + '" class="lk-ap-btn' + on + '">' + r + '×</button>';
            }).join('');
        }
        function audioRefreshRates() {
            const w = qs('#lk-ap-rates', viewRoot()); if (w) w.innerHTML = audioRateBtnsHTML();
        }
        function audioSetRate(rate) {
            const r = parseFloat(rate); if (!r) return;
            audioState.rate = r;
            if (audioEl) { try { audioEl.playbackRate = r; } catch (_) {} }
            audioRefreshRates();
        }
        function audioRefreshPlayBtn() {
            const b = qs('#lk-ap-play', viewRoot()); if (!b) return;
            b.innerHTML = svgIcon(audioState.playing ? 'pause' : 'play', '', { fill: 'currentColor' });
            b.setAttribute('aria-label', audioState.playing ? '일시정지' : '재생');
        }
        function audioRefreshProgress() {
            if (!audioEl) return;
            const root = viewRoot(); if (!root) return;
            const dur = audioEl.duration, cur = audioEl.currentTime;
            const pct = (isFinite(dur) && dur > 0) ? Math.min(100, Math.max(0, (cur / dur) * 100)) : 0;
            const fill = qs('#lk-ap-fill', root); if (fill) fill.style.width = pct + '%';
            const knob = qs('#lk-ap-knob', root); if (knob) knob.style.left = pct + '%';
            const c = qs('#lk-ap-cur', root); if (c) c.textContent = fmtTime(cur);
            const d = qs('#lk-ap-dur', root); if (d) d.textContent = fmtTime(dur);
            const bar = qs('#lk-ap-bar', root);
            if (bar && isFinite(dur) && dur > 0) {
                bar.setAttribute('aria-valuemax', Math.floor(dur));
                bar.setAttribute('aria-valuenow', Math.floor(cur));
                bar.setAttribute('aria-valuetext', fmtTime(cur) + ' / ' + fmtTime(dur));
            }
            try {
                const buf = qs('#lk-ap-buf', root);
                if (buf && audioEl.buffered.length && isFinite(dur) && dur > 0) {
                    buf.style.width = Math.min(100, (audioEl.buffered.end(audioEl.buffered.length - 1) / dur) * 100) + '%';
                }
            } catch (_) {}
        }
        function audioToggle() {
            if (!audioEl) return;
            if (audioEl.paused) { const p = audioEl.play(); if (p && p.catch) p.catch(function () {}); }
            else audioEl.pause();
        }
        function audioSkip(sec) {
            if (!audioEl || !isFinite(audioEl.duration)) return;
            audioEl.currentTime = Math.min(audioEl.duration, Math.max(0, audioEl.currentTime + sec));
            audioRefreshProgress();
        }
        function audioSeekToEvent(e) {
            const bar = qs('#lk-ap-bar', viewRoot());
            if (!bar || !audioEl || !isFinite(audioEl.duration) || audioEl.duration <= 0) return;
            const r = bar.getBoundingClientRect();
            const x = (e.clientX != null ? e.clientX : 0) - r.left;
            const ratio = Math.min(1, Math.max(0, x / (r.width || 1)));
            audioEl.currentTime = ratio * audioEl.duration;
            audioState.time = audioEl.currentTime;
            audioRefreshProgress();
        }
        function audioBindDrag() {
            if (audioState.bound) return;
            audioState.bound = true;
            const move = function (e) { if (audioState.seeking) { e.preventDefault(); audioSeekToEvent(e); } };
            const up = function () {
                if (!audioState.seeking) return;
                audioState.seeking = false;
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                document.removeEventListener('pointercancel', up);
            };
            document.addEventListener('pointerdown', function (e) {
                const bar = e.target.closest ? e.target.closest('#lk-ap-bar') : null;
                if (!bar || !audioEl) return;
                audioState.seeking = true;
                audioSeekToEvent(e);
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', up);
                document.addEventListener('pointercancel', up);
            });
        }
        function audioPlayerHTML(src) {
            const skip = AUDIO_CFG.skip;
            return '<div class="lk-ap">'
                + '<audio id="lk-ap-el" preload="metadata" src="' + src + '"></audio>'
                + '<div class="lk-ap-main">'
                +   '<button type="button" id="lk-ap-play" data-action="audio-toggle" class="lk-ap-play" aria-label="재생">' + svgIcon('play', '', { fill: 'currentColor' }) + '</button>'
                +   '<div class="lk-ap-mid">'
                +     '<div id="lk-ap-bar" class="lk-ap-bar" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">'
                +       '<div class="lk-ap-track"><div id="lk-ap-buf" class="lk-ap-buf"></div><div id="lk-ap-fill" class="lk-ap-fill"></div><div id="lk-ap-knob" class="lk-ap-knob"></div></div>'
                +     '</div>'
                +     '<div class="lk-ap-times"><span id="lk-ap-cur">0:00</span><span id="lk-ap-dur">--:--</span></div>'
                +   '</div>'
                + '</div>'
                + '<div class="lk-ap-foot">'
                +   '<div class="lk-ap-seg">'
                +     '<button type="button" data-action="audio-skip" data-sec="-' + skip + '" class="lk-ap-btn">&#8722;' + skip + '초</button>'
                +     '<button type="button" data-action="audio-skip" data-sec="' + skip + '" class="lk-ap-btn">+' + skip + '초</button>'
                +   '</div>'
                +   '<div class="lk-ap-seg"><span class="lk-ap-lab">속도<span class="lk-en"> · Speed</span></span><span id="lk-ap-rates" class="lk-ap-seg">' + audioRateBtnsHTML() + '</span></div>'
                +   '<a href="' + src + '" download class="lk-ap-dl">내려받기<span class="lk-en"> · Download</span></a>'
                + '</div>'
                + '</div>';
        }
        function mountAudio() {
            const cr = currentReading();
            const mount = qs('#lk-audio-mount', viewRoot());
            if (!cr || !cr.audio || !mount || mount.dataset.mounted) { if (!mount) audioEl = null; return; }
            mount.dataset.mounted = '1';
            const src = esc(AUDIO_CFG.src);
            mount.innerHTML =
                '<div class="mb-2 flex items-center gap-2 text-xs font-bold font-sans uppercase tracking-widest text-gray-400">'
                + svgIcon('audio', 'w-4 h-4') + '<span>' + esc(cr.audioLabel || '오디오') + '</span></div>'
                + audioPlayerHTML(src)
                + '<p class="lk-ap-fb">재생이 안 되면 <a href="' + src + '" target="_blank" rel="noreferrer">오디오 파일 직접 열기</a> · 그래도 안 되면 다른 웹브라우저(Chrome)로 열어 보세요.</p>';

            audioEl = qs('#lk-ap-el', mount);
            if (!audioEl) return;
            audioBindDrag();
            try { audioEl.playbackRate = audioState.rate; } catch (_) {}
            const restore = function () {
                if (audioState.time > 0 && isFinite(audioEl.duration)) {
                    try { audioEl.currentTime = Math.min(audioState.time, audioEl.duration); } catch (_) {}
                }
                audioRefreshProgress();
            };
            if (audioEl.readyState >= 1) restore();
            else audioEl.addEventListener('loadedmetadata', restore, { once: true });
            audioEl.addEventListener('timeupdate', function () { if (!audioState.seeking) audioState.time = audioEl.currentTime; audioRefreshProgress(); });
            audioEl.addEventListener('progress', audioRefreshProgress);
            audioEl.addEventListener('durationchange', audioRefreshProgress);
            audioEl.addEventListener('play', function () { audioState.playing = true; audioRefreshPlayBtn(); });
            audioEl.addEventListener('pause', function () { audioState.playing = false; audioRefreshPlayBtn(); });
            audioEl.addEventListener('ended', function () { audioState.playing = false; audioState.time = 0; audioRefreshPlayBtn(); });
            audioEl.addEventListener('ratechange', function () {
                if (Math.abs(audioEl.playbackRate - audioState.rate) < 0.001) return;
                audioState.rate = audioEl.playbackRate; audioRefreshRates();
            });
            const bar = qs('#lk-ap-bar', mount);
            if (bar) bar.addEventListener('keydown', function (e) {
                const k = e.key;
                if (k === 'ArrowRight') { e.preventDefault(); audioSkip(5); }
                else if (k === 'ArrowLeft') { e.preventDefault(); audioSkip(-5); }
                else if (k === ' ' || k === 'Enter') { e.preventDefault(); audioToggle(); }
            });
            audioRefreshPlayBtn();
            audioRefreshProgress();
        }

        // ---------- 9. VOCAB ----------
        function vocabFiltered() {
            const q = vocabState.query.toLowerCase().trim();
            if (!q) return VOCAB_READING_DATA.map((w, i) => ({ w, i }));
            return VOCAB_READING_DATA.map((w, i) => ({ w, i })).filter(({ w }) => {
                const t = (w.translations && w.translations.en) || {};
                return w.term.toLowerCase().includes(q) || w.mainDef.toLowerCase().includes(q) || (w.variants && w.variants.some(v => v.toLowerCase().includes(q))) || (t.term && t.term.toLowerCase().includes(q)) || (t.mainDef && t.mainDef.toLowerCase().includes(q));
            });
        }
        function vocabGridHTML() {
            const list = vocabFiltered();
            if (list.length === 0) return '<div class="text-center py-20 text-gray-400 font-serif">검색 결과에 맞는 어휘가 없습니다.</div>';
            return `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${list.map(({ w, i }) => vocabItemHTML(w, i, vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans)).join('')}</div>`;
        }
        /* ===== Flash Card 모듈 (어휘 탭) — 20개 큐레이션 카드 + 미디어 ===== */
        /* 미디어: GitHub raw에서 로드. 로컬 미디어 옆이면 FC_BASE=''로. */
        const FC_BASE = 'https://github.com/openkoreanlearninglab/hub/raw/refs/heads/main/flashcards/DECK-FOLDER/';
        const FC_IMG = FC_BASE+'images/', FC_VID = FC_BASE+'videos/', FC_AUD = FC_BASE+'audio/';
        const FC_CARDS = [
            /* ▣ 여기에 카드를 채우면 어휘 탭에 '플래시 카드' 토글이 자동으로 나타납니다.
                  비워 두면(=지금) 토글이 안 뜨고, 어휘 탭은 원본과 100% 동일합니다.
               필드: vocab(어휘), ko(한국어문장), hl(강조부분), en(영어), 
                     media:{type:'image'|'video', src, sound?}, back:{img}, audio  */

            // 예시) 이미지 앞면 + 음성  (개수 자유)
            // { vocab:'어휘1', ko:'문장이에요.', hl:'문장', en:'A sentence.', media:{type:'image',src:FC_IMG+'01.jpeg'}, audio:FC_AUD+'01.wav' },
        ];
        const fc = { mode:'list', queue:[], pos:0, flipped:false, showTrans:false, status:{}, done:false, shuffled:false };
        let fcAudio = null;
        function fcPlay(src){ try{ if(!fcAudio)fcAudio=new Audio(); if(fcAudio.src!==src)fcAudio.src=src; fcAudio.currentTime=0; const p=fcAudio.play(); if(p&&p.catch)p.catch(function(){}); }catch(_){} }
        function fcStop(){ try{ if(fcAudio)fcAudio.pause(); }catch(_){} }
        function fcBold(ko,hl){ let s=esc(ko); if(!hl)return s; const h=esc(hl),i=s.indexOf(h); if(i<0)return s; return s.slice(0,i)+'<strong class="hl">'+h+'</strong>'+s.slice(i+h.length); }
        function fcStart(list){ const base=(list&&list.length?list:FC_CARDS.map(function(_,i){return i;})).slice(); fc.queue=fc.shuffled?shuffleArr(base):base; fc.pos=0; fc.flipped=false; fc.showTrans=false; fc.done=false; fc.status={}; }

        function fcUnknown(){ return Object.keys(fc.status).filter(function(x){return fc.status[x]==='unknown';}).map(Number); }
        /* 이미지 프리로드: 다음·이전 카드 이미지를 미리 받아 전환 시 검정 화면 제거 */
        const fcPre = {};

        function fcPreloadIdx(qp){ if(qp<0||qp>=fc.queue.length)return; const c=FC_CARDS[fc.queue[qp]]; if(!c)return; if(c.media&&c.media.type==='image')fcPreloadOne(c.media.src); if(c.back&&c.back.img)fcPreloadOne(c.back.img); }
        function fcPreloadAround(){ const c=fcCur(); if(c&&c.back&&c.back.img)fcPreloadOne(c.back.img); fcPreloadIdx(fc.pos+1); fcPreloadIdx(fc.pos+2); fcPreloadIdx(fc.pos-1); }
        const FC_ICON = {

            eye:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg>'

        function fcFrontHTML(c){ const total=fc.queue.length||FC_CARDS.length; const pct=((fc.pos+1)/total)*100;
            return '<div class="fc-row"><span class="fc-tag">그림<span class="lk-en"> · Picture</span></span><span class="fc-count">'+(fc.pos+1)+' / '+total+'</span></div>'
