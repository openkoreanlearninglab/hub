    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

    <div id="app"></div>
    <script>
    (function () {
        'use strict';

        /* 폰트 CSS 비차단 적용: head에서 media=print로 받아 둔 스타일을 여기서 활성화 */
        var fontCss = document.getElementById('font-css');
        if (fontCss) fontCss.media = 'all';

        /* =====================================================================
           </> TEMPLATE — C — reading   (배포용 아님 / NOT for deployment)
           순수 바닐라 JS 학습자료 베이스. 새 자료는 아래 데이터 배열만 교체:
           READING_DATA · VOCAB_READING_DATA · QUIZ_LIST · DISCUSS_DATA
           + 홈/차트의 [대괄호] 플레이스홀더 문구.
           ===================================================================== */

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };
        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["사회","문화"];
        const HOME_SERIES_BADGE = "";
        const READING_DATA = [ { id:1, thumb:"https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c1-france-nokidszone-parenting-debate.webp", title:"프랑스의 '노키즈존' 논쟁<br>'긍정 양육 vs 거리두기 양육'", subtitle:"한국 부모에게도 질문 던지다", source:"https://www.huffingtonpost.kr/article/258342", cardTitle:"프랑스의 '노키즈존' 논쟁", cardDesc:"긍정 양육과 거리두기 양육을 둘러싼 프랑스의 논쟁이 한국 부모에게 던지는 질문을 살펴본다", content:[
            { text:"식당과 카페에는 노키즈존이 늘고, 공공장소에서는 아이 울음소리를 둘러싼 논쟁이 반복된다. 아이를 배제하는 사회가 문제일까, 아니면 아이를 그렇게 키운 어른들이 문제일까. 프랑스에서는 그 이유를 '긍정 양육'에서 찾기 시작했다.", trans:"No-kids zones are spreading in restaurants and cafés, and public spaces keep seeing the same argument over the sound of children crying. Is the problem a society that excludes children, or the adults who raised them that way? In France, people have started looking for the answer in 'gentle parenting.'" },
            { text:"6월 29일 뉴욕타임스는 '미국식 긍정 양육은 프랑스 아이들을 버릇없게 만들었나?(Did American-Style 'Gentle Parenting' Spoil French Children?)'라는 제목의 기사를 통해 프랑스 사회에서 뜨겁게 벌어지고 있는 양육 논쟁을 조명했다.", trans:"On June 29th, the New York Times spotlighted the heated parenting debate raging in French society in an article titled 'Did American-Style Gentle Parenting Spoil French Children?'" },
            { text:"논쟁의 중심에는 프랑스 심리학자 캐롤라인 골드만이 있다. 그는 최근 프랑스 곳곳에서 확산되는 '노키즈존' 현상을 달라진 양육 방식이 낳은 사회적 결과라고 진단했다.", trans:"At the center of the debate is French psychologist Caroline Goldman. She has diagnosed the 'no-kids zone' phenomenon spreading across France as a social consequence of a changed style of parenting." },
            { text:"올해 프랑스 국영철도(SNCF)가 비즈니스 클래스에 '아동 없는 구역'을 도입하며 \"최고의 편안함을 보장하기 위한 조치\"라고 설명한 것도 같은 맥락에서 바라본다.", trans:"This is also how people view the French national railway SNCF's decision this year to introduce a 'child-free zone' in business class, explaining it as \"a measure to guarantee the ultimate comfort.\"" },
            { text:"국내 KTX도 영유아를 동반한 승객을 위한 '유아동반석'을 운영하고 있지만, 장거리 이동 중 아기가 울거나 아이가 소란을 피우면 부모가 주변의 시선을 의식하는 일이 적지 않다.", trans:"Korea's KTX also runs seats reserved for passengers traveling with infants and toddlers, but on long journeys, when a baby cries or a child makes a fuss, parents are often keenly aware of the stares around them." },
            { text:"노키즈존 논란 역시 같은 맥락이다. 아이를 배려해야 한다는 목소리와 다른 승객의 권리도 존중해야 한다는 주장이 맞서면서, 결국 논쟁은 공공장소에서 아이에게 무엇을 가르쳐야 하는가라는 부모의 양육 문제로 이어진다.", trans:"The no-kids zone controversy follows the same logic. As voices insisting that children must be accommodated clash with arguments that other passengers' rights must also be respected, the debate ultimately leads back to a question of parenting: what should children be taught to do in public?" },
            { isHeading:true, text:"프랑스 교육 논쟁 : 긍정 양육 VS 거리두기 양육", trans:"France's Education Debate: Gentle Parenting vs. Distance Parenting" },
            { text:"심리학자 골드만은 지나치게 관대한 양육이 결국 타인을 배려하지 못하는 아이들을 만들고, 그 결과 아이를 배제하는 공간과 서비스가 늘어나는 악순환을 낳고 있다고 주장했다. 그는 뉴욕타임스에 \"우리는 다른 사람들에게 참기 힘든 아이들을 만들어 놓고, 이제 그런 아이들을 배제하는 경제가 생겨나는 것을 놀라워하고 있다\"고 말했다.", trans:"Psychologist Goldman argues that overly permissive parenting ultimately produces children who cannot consider others, fueling a vicious cycle in which more and more spaces and services exclude children. She told the New York Times, \"We've created children other people find unbearable, and now we're surprised that an economy has emerged that excludes those very children.\"" },
            { text:"프랑스는 오랫동안 생후 3개월부터 어린이집에 보내고 식사 예절과 생활 규칙을 어른처럼 익히게 하는, 이른바 '거리두기 양육' 문화로 널리 알려져 왔다. 아이의 감정보다 공동체의 규칙을 먼저 배우는 사회였고, 이러한 방식은 프랑스식 사회화의 강점으로 평가받아 왔다.", trans:"France has long been known for a culture of so-called 'distance parenting,' sending children to daycare from three months old and having them learn table manners and everyday rules the way adults do. It was a society that taught community rules before a child's feelings, and this approach has long been praised as a strength of French socialization." },
            { text:"하지만 지난 10여 년 사이 분위기는 크게 달라졌다. 골드만은 그 변화의 배경으로 미국에서 유입된 '긍정 양육(Gentle Parenting)'을 지목했다. 아이의 감정을 존중하고 대화와 공동 의사결정을 중시하는 방식이지만, 그는 이러한 접근이 부모의 권위를 약화시키고 경계를 흐리면서 아이들이 사회적 규범을 배우는 기회를 빼앗고 있다고 주장한다.", trans:"But the mood has changed dramatically over the past decade or so. Goldman points to the 'gentle parenting' imported from the United States as the background behind this shift. It respects a child's emotions and values conversation and shared decision-making, but she argues that this approach weakens parental authority and blurs boundaries, robbing children of the chance to learn social norms." },
            { text:"이 논쟁은 학계로도 번졌다. 2022년 골드만을 비롯한 전문가 355명은 공개서한을 통해 긍정 양육의 부작용을 경고했고, 이에 맞서 다른 전문가 280명은 그의 주장을 \"억압적이고 해로운 관점\"이라고 반박했다.", trans:"The debate has spread into academia as well. In 2022, 355 experts including Goldman warned of the side effects of gentle parenting in an open letter, and in response, another 280 experts pushed back, calling her argument \"an oppressive and harmful view.\"" },
            { isHeading:true, text:"타임아웃, \"진실의 방으로 가자\"", trans:"Time-Out: \"Let's Go to the Room of Truth\"" },
            { text:"가장 첨예하게 맞서는 지점은 바로 '타임아웃(Time-out)'이다. 이는 아이가 규칙을 어기거나 감정 조절에 어려움을 보일 때 잠시 자리를 떼어 진정을 유도하는 훈육 방식을 일컫는다. 한국에서는 흔히 '진실의 방'이나 '진실의 의자'라는 표현이 쓰인다.", trans:"The point where the two sides clash most sharply is 'time-out.' This refers to a discipline method in which a child who has broken a rule or is struggling to manage their emotions is briefly separated from the situation to help them calm down. In Korea, it is often called the 'room of truth' or the 'chair of truth.'" },
            { text:"찬성 측은 이를 아이가 흥분을 가라앉히고 행동의 경계를 배우는 효과적인 훈육 방법이라고 본다. 반면 반대 측은 아이를 분리된 공간에 두는 행위 자체가 정서적 단절을 만들고, 심리적 폭력으로 작용할 수 있다고 지적하며 날 선 시선을 보내고 있다.", trans:"Supporters see it as an effective discipline method that helps a child settle their excitement and learn the boundaries of behavior. Critics, on the other hand, take a sharply skeptical view, pointing out that the very act of placing a child in a separate space creates emotional disconnection and can function as psychological violence." },
            { text:"골드만은 부모가 아이를 끊임없이 설득하는 방식만으로는 결국 양육의 주도권을 잃게 된다고 말했다. 아이가 좌절을 경험하지 못하면 타인과 함께 살아가는 법도 배우기 어렵고, 부모 역시 끝없는 협상 속에서 지쳐 결국 더 큰 갈등이나 극단적 통제로 이어질 수 있다는 것이다.", trans:"Goldman says that if parents rely only on endlessly persuading their child, they eventually lose the initiative in parenting. If a child never experiences frustration, it becomes harder for them to learn how to live alongside others — and parents, too, wear themselves out in endless negotiation, which can eventually lead to bigger conflicts or to extreme control." },
            { text:"반면 연구 결과는 조금 달랐다. 예일대학교의 앨런 카진 교수는 타임아웃이 매우 짧은 시간 동안에는 행동 교정 효과를 보일 수 있지만, 처벌 수단으로 장시간 사용할 경우 효과가 거의 없다고 설명한다. 즉, 타임아웃 자체보다 어떻게 사용하는지가 중요하다는 것이다.", trans:"Research findings, however, tell a slightly different story. Professor Alan Kazdin of Yale University explains that time-outs can be effective at correcting behavior when used for a very short period, but have little effect when used as a means of punishment over a long stretch of time. In other words, what matters is not time-out itself but how it is used." },
            { isHeading:true, text:"한국 부모 사이에서 인기를 끌었던 '마음읽기 교육'", trans:"'Mind-Reading Education,' Once Popular Among Korean Parents" },
            { text:"국내에서도 한때 부모가 아이의 감정을 먼저 이해하고 말로 풀어주는 이른바 '마음읽기 교육'과 감정 코칭이 큰 관심을 받았다. 아이의 자존감과 정서 발달을 중시하는 새로운 양육 방식으로 자리 잡았지만, 한편에서는 아이의 감정을 존중하는 데 치우친 나머지 규칙과 한계를 가르치는 일이 부족해졌다는 지적도 나온다. 부모가 아이를 실망시키지 않으려는 문화가 확산되면서 좌절을 경험할 기회가 줄고, 공공장소에서 타인을 배려하거나 스스로 감정을 조절하는 힘을 기르기 어려워졌다는 우려도 이어지고 있다.", trans:"In Korea too, so-called 'mind-reading education' — in which parents try to understand a child's feelings first and put them into words — along with emotional coaching, once drew a great deal of attention. It took hold as a new parenting approach valuing children's self-esteem and emotional development, but some point out that, by leaning too far toward respecting a child's feelings, it left too little room to teach rules and limits. There are also continuing concerns that as a culture of not wanting to disappoint children has spread, opportunities to experience frustration have shrunk, making it harder for children to consider others in public or to regulate their own emotions." },
            { text:"아동발달 전문가인 조선미 아주대학교병원 정신건강의학과 교수는 부모의 양육 태도가 아이가 고통을 견디고 회복하는 능력에 직접적인 차이를 만든다고 강조한다. 조 교수는 저서 <영혼이 강한 아이로 키워라>에서 자녀를 행복한 아이로 키우는 핵심은 불편함을 없애주는 데 있는 것이 아니라 이를 견디고 통과하는 힘을 길러주는 데 있다고 짚는다.", trans:"Cho Sun-mi, a professor of psychiatry at Ajou University Hospital and a child-development expert, stresses that a parent's attitude makes a direct difference to a child's ability to endure hardship and recover from it. In her book <Raise a Child with a Strong Soul>, she points out that the key to raising a happy child lies not in removing discomfort, but in building the strength to endure it and get through it." },
            { text:"특히 그는 \"세상에는 싫어도 해야 할 일이 있고, 하고 싶어도 참아야 할 일이 있다\"는 사실을 아이에게 분명히 가르쳐야 한다고 말했다. 그리고 부모가 아이의 모든 문제를 대신 해결하거나 감정과 선택을 과잉 개입하는 태도를 경계한다.", trans:"In particular, she says parents must clearly teach children that \"there are things in the world you have to do even if you don't want to, and things you have to hold back from even if you want to do them.\" She also cautions against parents solving all of a child's problems for them or overintervening in their emotions and choices." },
            { text:"또한 조 교수는 \"아이의 머리와 손발이 되어주지 말라\", \"실수로 인한 고통을 겪게 하라\"는 조언을 통해, 실패와 좌절의 경험이야말로 아이가 스스로 판단하고 책임지는 힘을 키우는 과정임을 강조한다.", trans:"She also advises, \"Don't be your child's head, hands and feet,\" and \"Let them go through the pain their own mistakes cause,\" stressing that experiences of failure and frustration are precisely the process by which a child builds the strength to judge and take responsibility for themselves." },
            { isHeading:true, text:"\"아이를 손님처럼 대하라\"", trans:"\"Treat Your Child Like a Guest\"" },
            { text:"흔히 \"아이를 손님처럼 대하라\"는 말을 한다. 그러나 아이를 손님처럼 존중하는 것과, 손님처럼 떠받드는 것은 분명 다르다. 교육의 목적은 아이를 부모의 품 안에 오래 머물게 하는 데 있지 않다. 언젠가는 부모의 손을 놓고서도 자신의 감정을 다스리고, 타인과 더불어 살아가며, 스스로 선택한 삶에 책임질 수 있는 어른으로 성장하도록 돕는 데 있다. 그런 의미에서 아이의 감정을 존중하는 것과 규칙을 가르치는 일은 결코 상반되는 가치가 아니다.", trans:"People often say, \"treat your child like a guest.\" But respecting a child as you would a guest and putting a child on a pedestal like a guest are clearly not the same thing. The purpose of education is not to keep a child in their parents' arms for as long as possible. It is to help them grow into an adult who can govern their own emotions, live alongside others, and take responsibility for a life of their own choosing — even after letting go of their parents' hand. In that sense, respecting a child's feelings and teaching them rules are by no means opposing values." },
            { text:"프랑스에서 시작된 '긍정 양육' 논쟁은 결국 한국 사회에도 같은 질문을 던진다. 좋은 부모란 아이의 마음을 대신 읽어주는 사람일까, 아니면 언젠가 부모의 손을 놓고도 스스로 살아갈 수 있도록 돕는 사람일까.", trans:"The 'gentle parenting' debate that began in France ultimately poses the same question to Korean society. Is a good parent someone who reads a child's mind for them — or someone who helps them learn to live on their own, even after letting go of their parents' hand?" }
        ] } ];
        const VOCAB_READING_DATA = [
            { term:"노키즈존", mainDef:"노키즈존은 아이를 데리고는 들어갈 수 없게 정해 놓은 식당이나 카페 같은 곳이에요.", contextDef:"프랑스와 한국에서 함께 늘고 있는, 아이 손님을 받지 않는 가게를 가리켜요.", variants:["노키즈존"], subDefs:[{subTerm:"• 노키즈존 ← no kids zone", subDef:"영어 'no kids zone'을 소리 나는 대로 한글로 적은 말이에요"}], examples:[{kor:"그 카페는 노키즈존이라서 다섯 살 아이를 데려갈 수 없었어요.", eng:"That café is a no-kids zone, so I couldn't bring my five-year-old."}], translations:{ en:{ term:"no-kids zone", mainDef:"a restaurant, café or similar place that does not let customers bring children in.", contextDef:"Used here for the shops turning away customers with children that are multiplying in both France and Korea." } } },
            { term:"공공장소", mainDef:"공공장소는 여러 사람이 함께 쓰는, 누구에게나 열려 있는 곳이에요.", hanja:"공(公 여럿의) + 공(共 함께) + 장(場 자리) + 소(所 곳)", contextDef:"식당, 카페, 기차처럼 아이의 울음소리가 다른 사람에게 들리는 열린 공간을 가리켜요.", variants:["공공장소"], subDefs:[], examples:[{kor:"공공장소에서는 통화를 조금 작게 하는 게 좋아요.", eng:"It's better to keep phone calls quiet in public places."}], translations:{ en:{ term:"public place", mainDef:"a place that many people share and that is open to anyone.", contextDef:"Used here for open spaces like restaurants, cafés and trains where a child's crying reaches other people." } } },
            { term:"둘러싸다", mainDef:"어떤 문제를 둘러싸고 말이 오가면, 그 문제를 가운데 놓고 사람들이 서로 다투게 된다는 뜻이에요.", contextDef:"'아이 울음소리'라는 문제를 가운데 두고 사람들의 의견이 갈린다는 뜻으로 쓰였어요.", variants:["둘러싼"], subDefs:[], examples:[{kor:"새 정책을 둘러싼 논쟁이 몇 달째 이어지고 있어요.", eng:"The debate surrounding the new policy has gone on for months."}], translations:{ en:{ term:"to surround, to center on", mainDef:"if a debate takes place surrounding an issue, people argue with that issue at the center.", contextDef:"Used here for opinions dividing with the issue of children crying at the center." } } },
            { term:"논쟁", mainDef:"논쟁은 서로 생각이 다른 사람들이 각자 옳다고 주장하며 다투는 일이에요.", hanja:"논(論 말하다) + 쟁(爭 다투다)", contextDef:"프랑스와 한국에서 '아이를 어떻게 키워야 하는가'를 두고 벌어지는 사회적 다툼을 가리켜요.", variants:["논쟁"], subDefs:[], examples:[{kor:"두 학자 사이에 오랜 논쟁이 있었어요.", eng:"There was a long-running debate between the two scholars."}], translations:{ en:{ term:"debate, dispute", mainDef:"an argument in which people with different views each insist that they are right.", contextDef:"Used here for the social dispute in France and Korea over how children should be raised." } } },
            { term:"배제하다", mainDef:"어떤 대상을 배제하면, 그 대상을 어떤 자리나 범위에서 빼고 들어오지 못하게 한다는 뜻이에요.", hanja:"배(排 밀어내다) + 제(除 없애다)", contextDef:"아이를 사회의 여러 공간과 서비스에서 빼고 들어오지 못하게 하는 것을 가리켜요.", variants:["배제하는"], subDefs:[], examples:[{kor:"회의에서 중요한 안건을 배제하면 나중에 문제가 될 수 있어요.", eng:"If you exclude an important agenda item from the meeting, it can cause problems later."}], translations:{ en:{ term:"to exclude", mainDef:"if you exclude someone, you leave them out of a place or scope and keep them from entering.", contextDef:"Used here for shutting children out of various spaces and services in society." } } },
            { term:"양육", mainDef:"양육은 아이를 먹이고 돌보며 사람답게 자라도록 가르치는 일이에요.", hanja:"양(養 기르다) + 육(育 키우다)", contextDef:"이 글 전체의 중심 주제로, 부모가 아이를 기르고 가르치는 방식 전반을 가리켜요.", variants:["양육"], subDefs:[], examples:[{kor:"양육에 정답이 있다고 믿는 부모는 오히려 더 불안해져요.", eng:"Parents who believe there is one right answer to child-rearing tend to grow more anxious."}], translations:{ en:{ term:"child-rearing, parenting", mainDef:"the work of feeding and caring for a child and teaching them to grow into a decent person.", contextDef:"The central theme of this article — the whole way parents raise and teach their children." } } },
            { term:"버릇없다", mainDef:"누군가가 버릇없으면, 어른이나 다른 사람에게 지켜야 할 예의를 지키지 않는다는 뜻이에요.", contextDef:"미국식 양육 방식이 프랑스 아이들의 예의를 망가뜨렸느냐고 묻는 기사 제목에서 쓰였어요.", variants:["버릇없게"], subDefs:[], examples:[{kor:"아이가 버릇없게 굴어서 부모가 바로 주의를 줬어요.", eng:"The child behaved rudely, so the parents corrected them right away."}], translations:{ en:{ term:"to be spoiled, to be ill-mannered", mainDef:"if someone is ill-mannered, they fail to show the courtesy they owe adults or other people.", contextDef:"Used in the article headline asking whether American-style parenting ruined French children's manners." } } },
            { term:"조명하다", mainDef:"어떤 주제를 조명하면, 그 주제에 관심을 모아 자세히 다루고 널리 알린다는 뜻이에요.", hanja:"조(照 비추다) + 명(明 밝히다)", contextDef:"뉴욕타임스가 프랑스의 양육 논쟁을 기사로 자세히 다루고 세상에 알렸다는 뜻으로 쓰였어요.", variants:["조명했다"], subDefs:[], examples:[{kor:"이 다큐멘터리는 청소년 우울증 문제를 조명해요.", eng:"This documentary sheds light on the issue of teen depression."}], translations:{ en:{ term:"to shed light on, to spotlight", mainDef:"if you shed light on a subject, you draw attention to it, cover it in detail and make it widely known.", contextDef:"Used here for the New York Times covering France's parenting debate in depth and bringing it to public attention." } } },
            { term:"심리학자", mainDef:"심리학자는 사람의 마음이 어떻게 움직이는지를 알아보고 공부하는 사람이에요.", hanja:"심(心 마음) + 리(理 이치) + 학자(學者 연구하는 사람)", contextDef:"이 논쟁의 중심에 선 캐롤라인 골드만의 직업을 가리켜요.", variants:["심리학자"], subDefs:[], examples:[{kor:"심리학자들은 스트레스가 기억력에 미치는 영향을 연구해요.", eng:"Psychologists study how stress affects memory."}], translations:{ en:{ term:"psychologist", mainDef:"someone who studies and learns about how the human mind works.", contextDef:"Used here for the profession of Caroline Goldman, who stands at the center of this debate." } } },
            { term:"확산되다", mainDef:"어떤 것이 확산되면, 그것이 점점 넓은 곳으로 퍼져 나간다는 뜻이에요.", hanja:"확(擴 넓히다) + 산(散 흩어지다)", contextDef:"노키즈존이 프랑스 곳곳으로 퍼져 나가는 모습을 가리켜요.", variants:["확산되는","확산되면서"], subDefs:[], examples:[{kor:"짧은 영상으로 소문이 빠르게 확산됐어요.", eng:"The rumor spread quickly through short videos."}], translations:{ en:{ term:"to spread", mainDef:"if something spreads, it gradually reaches wider and wider areas.", contextDef:"Used here for no-kids zones spreading throughout France." } } },
            { term:"현상", mainDef:"현상은 눈으로 보거나 살펴볼 수 있게 겉으로 드러난 어떤 일의 모습이에요.", hanja:"현(現 나타나다) + 상(象 모습)", contextDef:"노키즈존이 늘어나는 일을 하나의 사회적 흐름으로 보고 부르는 말이에요.", variants:["현상"], subDefs:[], examples:[{kor:"청년들이 지방을 떠나는 현상이 계속되고 있어요.", eng:"The phenomenon of young people leaving the provinces continues."}], translations:{ en:{ term:"phenomenon", mainDef:"the visible form of something that can be observed or examined.", contextDef:"Used here to name the rise of no-kids zones as a single social trend." } } },
            { term:"진단하다", mainDef:"어떤 상황을 진단하면, 왜 그렇게 되었는지 자세히 살펴보고 어떤 상태인지 밝힌다는 뜻이에요.", hanja:"진(診 살피다) + 단(斷 판단하다)", contextDef:"노키즈존이 늘어나는 원인을 살펴보고 판단을 내렸다는 뜻으로 쓰였어요.", variants:["진단했다"], subDefs:[], examples:[{kor:"의사는 검사 결과를 보고 병의 원인을 진단했어요.", eng:"The doctor examined the test results and diagnosed the cause of the illness."}], translations:{ en:{ term:"to diagnose", mainDef:"if you diagnose a situation, you examine its cause or state and reach a judgment about it.", contextDef:"Used here for examining the cause behind the spread of no-kids zones and reaching a conclusion." } } },
            { term:"국영철도", mainDef:"국영철도는 개인 회사가 아니라 나라가 직접 만들고 맡아서 굴리는 기차 회사예요.", hanja:"국(國 나라) + 영(營 경영하다) + 철(鐵 쇠) + 도(道 길)", contextDef:"프랑스의 국영철도 회사 SNCF를 가리켜요. 한국의 코레일(KORAIL)과 비슷한 곳이에요.", variants:["국영철도"], subDefs:[{subTerm:"• 국영", subDef:"나라가 직접 맡아서 하는 것"},{subTerm:"• 철도", subDef:"기차가 다니는 길, 또는 기차 사업 전체"}], examples:[{kor:"그 나라는 국영철도로 전국이 이어져 있어요.", eng:"That country is connected end to end by its state-run railway."}], translations:{ en:{ term:"state-run railway", mainDef:"a railway company built and run by the state itself rather than by a private firm.", contextDef:"Refers to France's SNCF — roughly the French counterpart of Korea's KORAIL." } } },
            { term:"도입하다", mainDef:"어떤 제도나 방법을 도입하면, 밖에 있던 것을 안으로 들여와 새로 쓰기 시작한다는 뜻이에요.", hanja:"도(導 이끌다) + 입(入 들이다)", contextDef:"프랑스 국영철도가 '아동 없는 구역'이라는 제도를 새로 만들어 쓰기 시작했다는 뜻이에요.", variants:["도입하며"], subDefs:[], examples:[{kor:"회사가 재택근무 제도를 도입했어요.", eng:"The company introduced a work-from-home system."}], translations:{ en:{ term:"to introduce, to adopt", mainDef:"if you introduce a system or method, you bring in something from outside and begin using it.", contextDef:"Used here for the French railway newly creating and adopting a 'child-free zone' policy." } } },
            { term:"구역", mainDef:"구역은 어떤 기준에 따라 나누어 놓은 하나의 공간이에요.", hanja:"구(區 나누다) + 역(域 지역)", contextDef:"기차 안에서 아이를 데리고 탈 수 없도록 따로 나누어 놓은 자리를 가리켜요.", variants:["구역"], subDefs:[], examples:[{kor:"이 건물은 흡연 구역이 따로 있어요.", eng:"This building has a separate smoking area."}], translations:{ en:{ term:"zone, section", mainDef:"a space marked off according to some standard.", contextDef:"Used here for the section of the train set aside where children may not travel." } } },
            { term:"보장하다", mainDef:"무언가를 보장하면, 그것이 확실히 지켜지도록 책임지고 약속한다는 뜻이에요.", hanja:"보(保 지키다) + 장(障 막아 주다)", contextDef:"철도 회사가 승객에게 최고의 편안함을 확실히 지켜 주겠다고 약속한 대목에서 쓰였어요.", variants:["보장하기"], subDefs:[], examples:[{kor:"이 제품은 2년간 무상 수리를 보장해요.", eng:"This product guarantees two years of free repairs."}], translations:{ en:{ term:"to guarantee", mainDef:"if you guarantee something, you take responsibility for making sure it is upheld.", contextDef:"Used where the railway promises passengers it will secure the utmost comfort." } } },
            { term:"조치", mainDef:"조치는 어떤 문제를 풀려고 실제로 하는 일이나 방법이에요.", hanja:"조(措 두다) + 치(置 놓다)", contextDef:"'아동 없는 구역'을 만든 일을 회사가 스스로 부르는 표현으로 쓰였어요.", variants:["조치"], subDefs:[], examples:[{kor:"사고가 나자 회사는 즉시 안전 조치를 취했어요.", eng:"When the accident happened, the company immediately took safety measures."}], translations:{ en:{ term:"measure, step", mainDef:"an action actually taken in order to solve a problem.", contextDef:"Used as the company's own word for creating the 'child-free zone.'" } } },
            { term:"맥락", mainDef:"맥락은 어떤 일이 다른 일들과 이어지면서 만들어지는 전체적인 흐름이나 배경이에요.", hanja:"맥(脈 줄기) + 락(絡 잇다)", contextDef:"기차의 아동 없는 구역과 식당의 노키즈존이 결국 같은 흐름 안에 있다는 뜻으로 쓰였어요.", variants:["맥락"], subDefs:[], examples:[{kor:"그 말은 앞뒤 맥락을 알아야 이해할 수 있어요.", eng:"You can only understand that remark if you know the surrounding context."}], translations:{ en:{ term:"context", mainDef:"the overall flow or background formed as one thing connects with others.", contextDef:"Used here to say the train's child-free zone and restaurant no-kids zones belong to the same trend." } } },
            { term:"KTX", mainDef:"KTX는 한국에서 도시와 도시 사이를 아주 빠르게 오가는 기차예요.", contextDef:"프랑스 국영철도의 '아동 없는 구역'과 견주기 위해 든 한국의 예예요.", variants:["KTX"], subDefs:[{subTerm:"• KTX", subDef:"영어 'Korea Train eXpress'를 줄인 말이에요"}], examples:[{kor:"서울에서 부산까지 KTX로 두 시간 반쯤 걸려요.", eng:"It takes about two and a half hours from Seoul to Busan by KTX."}], translations:{ en:{ term:"KTX (Korea Train eXpress)", mainDef:"South Korea's high-speed train, running between cities across the country.", contextDef:"Cited here as the Korean counterpart to the French railway's 'child-free zone.'" } } },
            { term:"영유아", mainDef:"영유아는 갓 태어난 아기부터 학교에 들어가기 전의 어린아이까지를 함께 부르는 말이에요.", hanja:"영(嬰 갓난아이) + 유(幼 어리다) + 아(兒 아이)", contextDef:"KTX가 따로 자리를 마련해 주는 대상, 즉 아직 아주 어린 아이들을 가리켜요.", variants:["영유아"], subDefs:[], examples:[{kor:"이 병원은 영유아 검진을 무료로 해 줘요.", eng:"This hospital provides free checkups for infants and young children."}], translations:{ en:{ term:"infants and toddlers", mainDef:"a term covering children from newborns up to those not yet in school.", contextDef:"Used here for the very young children KTX sets aside special seating for." } } },
            { term:"동반하다", mainDef:"누군가를 동반하면, 그 사람과 함께 간다는 뜻이에요.", hanja:"동(同 함께) + 반(伴 짝하다)", contextDef:"아이를 데리고 기차를 타는 승객을 가리킬 때 쓰였어요.", variants:["동반한"], subDefs:[], examples:[{kor:"보호자를 동반해야 입장할 수 있어요.", eng:"You may enter only if accompanied by a guardian."}], translations:{ en:{ term:"to accompany, to bring along", mainDef:"if you accompany someone, you go together with them.", contextDef:"Used here for passengers traveling with a child on the train." } } },
            { term:"승객", mainDef:"승객은 버스나 기차, 비행기 같은 것을 타고 가는 손님이에요.", hanja:"승(乘 타다) + 객(客 손님)", contextDef:"아이를 데리고 탄 사람과 그렇지 않은 사람 모두를 함께 가리켜요.", variants:["승객"], subDefs:[], examples:[{kor:"사고로 승객 전원이 다른 열차로 옮겨 탔어요.", eng:"Because of the accident, all the passengers transferred to another train."}], translations:{ en:{ term:"passenger", mainDef:"a customer who travels on a bus, train, plane or similar vehicle.", contextDef:"Used here for both those traveling with children and those without." } } },
            { term:"유아동반석", mainDef:"유아동반석은 어린아이와 함께 타는 손님을 위해 기차에 따로 마련해 둔 자리예요.", hanja:"유(幼 어리다) + 아(兒 아이) + 동(同 함께) + 반(伴 짝하다) + 석(席 자리)", contextDef:"KTX가 아이와 함께 탄 승객을 위해 따로 운영하고 있는 좌석을 가리켜요.", variants:["유아동반석"], subDefs:[{subTerm:"• 유아", subDef:"아직 학교에 들어가지 않은 어린아이"},{subTerm:"• 동반석", subDef:"누군가와 함께 앉도록 마련해 둔 자리"}], examples:[{kor:"아기랑 같이 갈 때는 유아동반석을 예매하는 게 편해요.", eng:"When traveling with a baby, it's easier to book the infant-companion seats."}], translations:{ en:{ term:"infant-companion seat", mainDef:"a train seat set aside for passengers traveling with a young child.", contextDef:"Used here for the seating KTX runs separately for passengers riding with a child." } } },
            { term:"소란을 피우다", mainDef:"누군가가 소란을 피우면, 시끄럽게 굴어서 주변을 어수선하게 만든다는 뜻이에요.", hanja:"소(騷 시끄럽다) + 란(亂 어지럽다)", contextDef:"기차 안에서 아이가 크게 떠들거나 뛰어다니는 상황을 가리켜요.", variants:["소란을 피우면"], subDefs:[], examples:[{kor:"늦은 밤에 소란을 피우면 이웃에게 피해를 줘요.", eng:"Making a racket late at night bothers the neighbors."}], translations:{ en:{ term:"to make a fuss / a racket", mainDef:"if you make a fuss, you behave noisily and throw your surroundings into disorder.", contextDef:"Used here for a child shouting or running around inside the train." } } },
            { term:"시선을 의식하다", mainDef:"누군가가 시선을 의식하면, 다른 사람이 자기를 어떻게 볼지 계속 신경 쓴다는 뜻이에요.", hanja:"시선(視線 보는 눈길) + 의식(意識 알아차림)", contextDef:"아이가 울 때 주변 사람들의 눈치를 보게 되는 부모의 마음을 가리켜요.", variants:["시선을 의식하는"], subDefs:[{subTerm:"• 시선", subDef:"사람이 무언가를 바라보는 눈길"}], examples:[{kor:"저는 남의 시선을 의식해서 옷을 고르는 편이에요.", eng:"I tend to pick my clothes with other people's eyes in mind."}], translations:{ en:{ term:"to be conscious of others' eyes", mainDef:"if you are conscious of others' eyes, you keep worrying about how they see you.", contextDef:"Used here for how parents feel watched when their child cries." } } },
            { term:"논란", mainDef:"논란은 어떤 일을 두고 사람들의 의견이 갈려 시끄럽게 다투는 상태예요.", hanja:"논(論 논하다) + 란(難 따지다)", contextDef:"노키즈존을 두고 찬성과 반대가 부딪히며 시끄러워진 상황을 가리켜요.", variants:["논란"], subDefs:[], examples:[{kor:"그 광고는 표현 방식 때문에 논란이 됐어요.", eng:"That advertisement became controversial because of the way it was worded."}], translations:{ en:{ term:"controversy", mainDef:"a noisy state in which people's opinions divide and clash over something.", contextDef:"Used here for the clash between supporters and opponents of no-kids zones." } } },
            { term:"배려하다", mainDef:"누군가를 배려하면, 그 사람의 형편을 먼저 생각해서 마음을 써 준다는 뜻이에요.", hanja:"배(配 나누다) + 려(慮 생각하다)", contextDef:"아이의 사정을 헤아려 자리를 내주고 참아 주어야 한다는 주장에서 쓰였어요.", variants:["배려해야","배려하거나","배려하지"], subDefs:[], examples:[{kor:"임산부를 배려해서 자리를 비워 뒀어요.", eng:"We left the seat empty out of consideration for pregnant passengers."}], translations:{ en:{ term:"to be considerate of", mainDef:"if you are considerate of someone, you take their situation into account and act with care.", contextDef:"Used in the argument that people should make room for children and be patient with them." } } },
            { term:"권리", mainDef:"권리는 어떤 사람이 마땅히 누리거나 요구할 수 있는 몫이에요.", hanja:"권(權 권세) + 리(利 이롭다)", contextDef:"조용히 이동하고 싶은 다른 승객의 몫을 가리키며, 아이를 배려하자는 주장과 맞서요.", variants:["권리"], subDefs:[], examples:[{kor:"모든 노동자는 쉴 권리가 있어요.", eng:"Every worker has the right to rest."}], translations:{ en:{ term:"right", mainDef:"what a person is properly entitled to enjoy or demand.", contextDef:"Used here for other passengers' claim to a quiet journey, set against the call to accommodate children." } } },
            { term:"존중하다", mainDef:"누군가를 존중하면, 그 사람을 소중히 여겨 함부로 대하지 않는다는 뜻이에요.", hanja:"존(尊 높이다) + 중(重 무겁게 여기다)", contextDef:"다른 승객의 권리도, 아이의 감정도 함부로 넘기지 말아야 한다는 맥락에서 반복해 쓰여요.", variants:["존중해야","존중하고","존중하는"], subDefs:[], examples:[{kor:"의견이 달라도 서로를 존중해야 대화가 돼요.", eng:"Even when opinions differ, conversation only works if people respect each other."}], translations:{ en:{ term:"to respect", mainDef:"if you respect someone, you value them and do not treat them carelessly.", contextDef:"Repeated here for both other passengers' rights and a child's feelings." } } },
            { term:"맞서다", mainDef:"두 주장이 맞서면, 서로 물러서지 않고 정면으로 부딪힌다는 뜻이에요.", contextDef:"아이를 배려하자는 목소리와 다른 승객의 권리를 지키자는 목소리가 정면으로 부딪힌다는 뜻이에요.", variants:["맞서면서","맞서는","맞서"], subDefs:[], examples:[{kor:"찬성 의견과 반대 의견이 팽팽하게 맞섰어요.", eng:"The views for and against stood firmly opposed."}], translations:{ en:{ term:"to stand opposed, to clash", mainDef:"if two claims stand opposed, neither backs down and they collide head-on.", contextDef:"Used here for the head-on clash between accommodating children and protecting other passengers' rights." } } },
            { term:"지나치게", mainDef:"어떤 일이 지나치게 이루어지면, 알맞은 정도를 넘어 너무 심하게 이루어진다는 뜻이에요.", contextDef:"아이에게 너그러운 태도가 알맞은 선을 넘었다는 판단을 담아 쓰였어요.", variants:["지나치게"], subDefs:[], examples:[{kor:"지나치게 걱정하면 오히려 일을 그르쳐요.", eng:"Worrying excessively can actually ruin things."}], translations:{ en:{ term:"excessively, too much", mainDef:"if something is done excessively, it goes beyond the proper degree.", contextDef:"Used here to judge that leniency toward children has crossed the proper line." } } },
            { term:"관대하다", mainDef:"누군가가 관대하면, 잘못이나 부족함을 크게 따지지 않고 너그럽게 넘어간다는 뜻이에요.", hanja:"관(寬 너그럽다) + 대(大 크다)", contextDef:"아이의 잘못을 좀처럼 지적하지 않고 넘어가는 부모의 태도를 가리켜요.", variants:["관대한"], subDefs:[], examples:[{kor:"그 선생님은 실수에 관대하지만 거짓말에는 엄격해요.", eng:"That teacher is lenient about mistakes but strict about lies."}], translations:{ en:{ term:"to be lenient, to be permissive", mainDef:"if someone is lenient, they let faults pass without making much of them.", contextDef:"Used here for parents who rarely call out a child's misbehavior." } } },
            { term:"타인", mainDef:"타인은 나와 가족이 아닌, 나 밖의 다른 사람이에요.", hanja:"타(他 다르다) + 인(人 사람)", contextDef:"아이가 배려하는 법을 배워야 할 상대, 즉 가족 바깥의 사람들을 가리켜요.", variants:["타인"], subDefs:[], examples:[{kor:"타인의 입장에서 생각해 보면 답이 달라져요.", eng:"The answer changes when you think from another person's position."}], translations:{ en:{ term:"another person, others", mainDef:"someone other than oneself and one's family.", contextDef:"Used here for the people outside the family that a child must learn to consider." } } },
            { term:"악순환", mainDef:"악순환은 나쁜 일이 다른 나쁜 일을 낳으면서 계속 되풀이되는 상태예요.", hanja:"악(惡 나쁘다) + 순(循 돌다) + 환(環 고리)", contextDef:"너그러운 양육이 무례한 아이를 만들고, 그 아이를 배제하는 공간이 다시 늘어나는 흐름을 가리켜요.", variants:["악순환"], subDefs:[], examples:[{kor:"빚을 갚으려고 또 빚을 내는 악순환에 빠졌어요.", eng:"I fell into a vicious cycle of taking on more debt just to pay off old debt."}], translations:{ en:{ term:"vicious cycle", mainDef:"a state in which one bad thing keeps giving rise to another, over and over.", contextDef:"Used here for the loop in which permissive parenting produces inconsiderate children, which in turn multiplies child-excluding spaces." } } },
            { term:"생후", mainDef:"생후는 아이가 태어난 뒤부터 지난 시간을 가리키는 말이에요.", hanja:"생(生 태어나다) + 후(後 뒤)", contextDef:"프랑스에서 아이를 어린이집에 보내기 시작하는 시점이 태어난 지 3개월이라는 뜻으로 쓰였어요.", variants:["생후"], subDefs:[], examples:[{kor:"생후 6개월부터 이유식을 시작했어요.", eng:"We started solid food from six months after birth."}], translations:{ en:{ term:"after birth", mainDef:"a word marking the time elapsed since a child was born.", contextDef:"Used here to say French children enter daycare from three months of age." } } },
            { term:"예절", mainDef:"예절은 사람들과 어울릴 때 지켜야 할 바르고 공손한 행동 방식이에요.", hanja:"예(禮 예의) + 절(節 절도)", contextDef:"프랑스 아이들이 아주 어릴 때부터 어른처럼 익힌다는 식사 규칙을 가리켜요.", variants:["예절"], subDefs:[], examples:[{kor:"식사 예절은 어릴 때 몸에 배는 것 같아요.", eng:"Table manners seem to sink in when you're young."}], translations:{ en:{ term:"manners, etiquette", mainDef:"the proper and courteous way of behaving when among other people.", contextDef:"Used here for the table rules French children learn like adults from a very young age." } } },
            { term:"공동체", mainDef:"공동체는 같은 곳에서 함께 살아가며 서로 영향을 주고받는 사람들의 무리예요.", hanja:"공(共 함께) + 동(同 같다) + 체(體 몸)", contextDef:"아이의 개인적 감정보다 먼저 배워야 한다고 여겨지는, 함께 사는 사람들의 규칙을 가리켜요.", variants:["공동체"], subDefs:[], examples:[{kor:"작은 마을일수록 공동체의 규칙이 강하게 남아 있어요.", eng:"The smaller the village, the more strongly community rules survive."}], translations:{ en:{ term:"community", mainDef:"a group of people who live together in one place and influence one another.", contextDef:"Used here for the shared rules a child is expected to learn before their own feelings." } } },
            { term:"사회화", mainDef:"사회화는 사람이 자라면서 다른 사람들과 함께 사는 데 필요한 규칙과 행동 방식을 배워 가는 과정이에요.", hanja:"사회(社會 사람들의 모임) + 화(化 되어 감)", contextDef:"프랑스식 양육이 오래 칭찬받아 온 지점, 즉 아이를 사회의 일원으로 길러 내는 능력을 가리켜요.", variants:["사회화"], subDefs:[], examples:[{kor:"학교는 아이의 사회화가 이루어지는 첫 무대예요.", eng:"School is the first stage where a child's socialization takes place."}], translations:{ en:{ term:"socialization", mainDef:"the process by which a person grows up learning the rules and behaviors of their society.", contextDef:"Used here for what French parenting has long been praised for — turning children into members of society." } } },
            { term:"강점", mainDef:"강점은 다른 것에 비해 특히 뛰어난 점이에요.", hanja:"강(強 강하다) + 점(點 점)", contextDef:"규칙을 먼저 가르치는 프랑스식 방식이 오랫동안 좋은 점으로 평가받아 왔다는 뜻이에요.", variants:["강점"], subDefs:[], examples:[{kor:"이 팀의 강점은 빠른 의사 결정이에요.", eng:"This team's strength is quick decision-making."}], translations:{ en:{ term:"strength, strong point", mainDef:"a point at which something is especially superior to others.", contextDef:"Used here for how the rules-first French approach has long been rated as a virtue." } } },
            { term:"평가받다", mainDef:"어떤 것이 평가받으면, 다른 사람들이 그것을 좋다거나 나쁘다고 말해 준다는 뜻이에요.", hanja:"평(評 평하다) + 가(價 값)", contextDef:"프랑스식 양육이 오랫동안 사람들에게 좋은 평을 들어 왔다는 뜻으로 쓰였어요.", variants:["평가받아"], subDefs:[], examples:[{kor:"그 영화는 개봉 당시보다 지금 더 높게 평가받아요.", eng:"That film is rated more highly now than when it was released."}], translations:{ en:{ term:"to be rated, to be evaluated", mainDef:"if something is rated, other people judge it as good or bad.", contextDef:"Used here for the long-standing positive judgment of French parenting." } } },
            { term:"유입되다", mainDef:"어떤 것이 유입되면, 밖에서 안으로 흘러 들어온다는 뜻이에요.", hanja:"유(流 흐르다) + 입(入 들어오다)", contextDef:"미국에서 만들어진 양육 방식이 프랑스 안으로 흘러 들어왔다는 뜻으로 쓰였어요.", variants:["유입된"], subDefs:[], examples:[{kor:"외국에서 유입된 문화가 빠르게 자리 잡았어요.", eng:"Culture that flowed in from abroad took root quickly."}], translations:{ en:{ term:"to flow in, to be imported", mainDef:"if something flows in, it comes in from the outside.", contextDef:"Used here for an American parenting style flowing into France." } } },
            { term:"지목하다", mainDef:"어떤 대상을 지목하면, 여럿 가운데서 그것을 콕 집어 가리킨다는 뜻이에요.", hanja:"지(指 가리키다) + 목(目 지목하다)", contextDef:"변화의 원인으로 여러 요인이 아니라 미국식 양육 하나를 콕 집어 가리켰다는 뜻이에요.", variants:["지목했다"], subDefs:[], examples:[{kor:"목격자는 사진 속 한 사람을 지목했어요.", eng:"The witness singled out one person in the photograph."}], translations:{ en:{ term:"to single out, to point to", mainDef:"if you single something out, you pick it out specifically from among several things.", contextDef:"Used here for naming American-style parenting alone as the cause of the shift." } } },
            { term:"의사결정", mainDef:"의사결정은 여러 가능성 가운데 무엇을 할지 정하는 일이에요.", hanja:"의(意 뜻) + 사(思 생각) + 결(決 정하다) + 정(定 정하다)", contextDef:"부모가 혼자 정하지 않고 아이와 함께 정하는 방식을 가리켜요.", variants:["의사결정"], subDefs:[], examples:[{kor:"이 회사는 의사결정이 빠른 편이에요.", eng:"This company tends to make decisions quickly."}], translations:{ en:{ term:"decision-making", mainDef:"the act of choosing what to do among several possibilities.", contextDef:"Used here for parents deciding together with the child rather than alone." } } },
            { term:"중시하다", mainDef:"무언가를 중시하면, 그것을 특별히 중요하게 여긴다는 뜻이에요.", hanja:"중(重 무겁다) + 시(視 보다)", contextDef:"대화와 공동 결정, 그리고 자존감과 정서 발달을 특별히 중요하게 여기는 태도를 가리켜요.", variants:["중시하는"], subDefs:[], examples:[{kor:"그 학교는 성적보다 태도를 중시해요.", eng:"That school values attitude over grades."}], translations:{ en:{ term:"to place importance on", mainDef:"if you place importance on something, you regard it as especially important.", contextDef:"Used for valuing dialogue and shared decisions, and later self-esteem and emotional growth." } } },
            { term:"권위", mainDef:"권위는 남이 시키지 않아도 스스로 따르게 만드는 힘이에요.", hanja:"권(權 권세) + 위(威 위엄)", contextDef:"아이가 부모의 말을 따르게 만드는 힘을 가리키며, 이것이 약해졌다는 주장에서 쓰였어요.", variants:["권위"], subDefs:[], examples:[{kor:"억지로 세운 권위는 오래 가지 않아요.", eng:"Authority forced into place does not last long."}], translations:{ en:{ term:"authority", mainDef:"the force or weight that makes others willingly follow.", contextDef:"Used here for the force that makes a child follow a parent, said to have weakened." } } },
            { term:"약화시키다", mainDef:"무언가를 약화시키면, 원래 있던 힘을 더 약하게 만든다는 뜻이에요.", hanja:"약(弱 약하다) + 화(化 되게 하다)", contextDef:"긍정 양육이 부모의 권위를 전보다 약하게 만들었다는 주장에서 쓰였어요.", variants:["약화시키고"], subDefs:[], examples:[{kor:"잦은 야근이 면역력을 약화시킬 수 있어요.", eng:"Frequent overtime can weaken your immune system."}], translations:{ en:{ term:"to weaken", mainDef:"if you weaken something, you make its existing force smaller.", contextDef:"Used in the claim that gentle parenting weakened parental authority." } } },
            { term:"경계를 흐리다", mainDef:"경계를 흐리면, 여기까지는 되고 여기부터는 안 된다는 선을 뚜렷하지 않게 만든다는 뜻이에요.", hanja:"경(境 지경) + 계(界 경계)", contextDef:"아이에게 허용되는 행동과 안 되는 행동의 선이 분명하지 않게 되었다는 뜻이에요.", variants:["경계를 흐리면서"], subDefs:[{subTerm:"• 흐리다", subDef:"뚜렷하던 것을 분명하지 않게 만들어요"}], examples:[{kor:"농담과 무례함의 경계를 흐리면 관계가 나빠져요.", eng:"Blurring the line between a joke and rudeness damages relationships."}], translations:{ en:{ term:"to blur the boundary", mainDef:"if you blur a boundary, you make the line between what is allowed and what is not unclear.", contextDef:"Used here for the line between permitted and forbidden behavior becoming indistinct." } } },
            { term:"규범", mainDef:"규범은 어떤 사회에서 사람들이 마땅히 지켜야 한다고 여기는 행동의 기준이에요.", hanja:"규(規 법) + 범(範 본보기)", contextDef:"아이가 자라면서 배워야 하는, 함께 사는 사회의 행동 기준을 가리켜요.", variants:["규범"], subDefs:[], examples:[{kor:"나라마다 인사에 관한 규범이 조금씩 달라요.", eng:"Norms about greetings differ a little from country to country."}], translations:{ en:{ term:"norm", mainDef:"the standard of behavior a society holds that people ought to follow.", contextDef:"Used here for the shared standards a child must learn while growing up." } } },
            { term:"학계", mainDef:"학계는 대학이나 연구소에서 깊이 공부하는 사람들이 이루는 세계예요.", hanja:"학(學 배우다) + 계(界 분야)", contextDef:"양육을 둘러싼 찬반 논쟁이 대학과 연구자들 사이로 퍼졌다는 뜻으로 쓰였어요.", variants:["학계"], subDefs:[], examples:[{kor:"그의 새 이론은 학계에서 큰 관심을 받고 있어요.", eng:"His new theory is drawing a lot of attention in academia."}], translations:{ en:{ term:"academia", mainDef:"the world formed by people who study a subject deeply at universities and research institutes.", contextDef:"Used here for the parenting debate spreading among researchers and experts." } } },
            { term:"번지다", mainDef:"어떤 일이 번지면, 처음 자리를 넘어 주변으로 넓게 퍼진다는 뜻이에요.", contextDef:"일반 시민들 사이의 논쟁이 전문가 집단으로까지 퍼졌다는 뜻으로 쓰였어요.", variants:["번졌다"], subDefs:[], examples:[{kor:"작은 소문이 학교 전체로 번졌어요.", eng:"A small rumor spread through the whole school."}], translations:{ en:{ term:"to spread", mainDef:"if something spreads, it reaches beyond where it started into the surrounding area.", contextDef:"Used here for the public debate spreading into expert circles." } } },
            { term:"~을 비롯하다", mainDef:"'A를 비롯한 B'라고 하면, A가 B 가운데 가장 앞에 놓이는 대표적인 예라는 뜻이에요.", hanja:"비롯(순우리말 '비롯하다')", contextDef:"공개서한에 이름을 올린 355명 가운데 골드만이 대표적인 인물이라는 뜻으로 쓰였어요.", variants:["비롯한"], subDefs:[], examples:[{kor:"교사를 비롯한 많은 사람들이 서명에 참여했어요.", eng:"Many people, teachers included, took part in the signing."}], translations:{ en:{ term:"including, headed by", mainDef:"'B including A' presents A as the leading, representative example among B.", contextDef:"Used here to present Goldman as the leading figure among the 355 signatories." } } },
            { term:"공개서한", mainDef:"공개서한은 개인이나 단체가 자기 생각을 밝히려고 모두에게 열어 놓고 쓰는 편지예요.", hanja:"공(公 여럿의) + 개(開 열다) + 서(書 글) + 한(翰 편지)", contextDef:"전문가 355명이 긍정 양육의 문제점을 세상에 알리려고 함께 쓴 편지를 가리켜요.", variants:["공개서한"], subDefs:[], examples:[{kor:"환경 단체는 정부에 공개서한을 보내 정책 변경을 요구했어요.", eng:"The environmental group sent an open letter demanding a policy change."}], translations:{ en:{ term:"open letter", mainDef:"a letter an individual or group writes openly to the public to state their views.", contextDef:"Used here for the letter 355 experts co-wrote to publicize the problems of gentle parenting." } } },
            { term:"부작용", mainDef:"부작용은 어떤 일을 할 때 바라던 좋은 결과 말고 함께 따라오는 나쁜 결과예요.", hanja:"부(副 곁딸리다) + 작(作 짓다) + 용(用 쓰다)", contextDef:"아이를 존중하려던 양육 방식이 뜻하지 않게 만들어 낸 나쁜 결과를 가리켜요.", variants:["부작용"], subDefs:[], examples:[{kor:"약을 바꾼 뒤에 가벼운 부작용이 있었어요.", eng:"I had mild side effects after switching medications."}], translations:{ en:{ term:"side effect", mainDef:"a bad result that comes along with something, besides the good result it aimed at.", contextDef:"Used here for the unintended harm produced by a parenting style meant to respect children." } } },
            { term:"억압적", mainDef:"어떤 방식이 억압적이면, 상대를 힘으로 눌러서 자유롭게 하지 못하게 막는다는 뜻이에요.", hanja:"억(抑 누르다) + 압(壓 누르다) + 적(的 ~한 성격의)", contextDef:"타임아웃을 권하는 주장을 비판하는 쪽이 그 주장에 붙인 표현이에요.", variants:["억압적이고"], subDefs:[], examples:[{kor:"억압적인 분위기에서는 좋은 아이디어가 나오지 않아요.", eng:"Good ideas don't come out of an oppressive atmosphere."}], translations:{ en:{ term:"oppressive", mainDef:"if an approach is oppressive, it holds others down by force and blocks their freedom.", contextDef:"The word critics attached to the argument in favor of time-outs." } } },
            { term:"반박하다", mainDef:"어떤 주장을 반박하면, 그 주장이 틀렸다고 근거를 들어 되받아 말한다는 뜻이에요.", hanja:"반(反 되받다) + 박(駁 따지다)", contextDef:"280명의 전문가가 골드만 쪽 주장을 정면으로 되받아 비판했다는 뜻이에요.", variants:["반박했다"], subDefs:[], examples:[{kor:"그는 자료를 들어 상대의 주장을 반박했어요.", eng:"He refuted the other side's claim with data."}], translations:{ en:{ term:"to refute, to rebut", mainDef:"if you refute a claim, you answer back with grounds for saying it is wrong.", contextDef:"Used here for 280 experts pushing back directly against Goldman's side." } } },
            { term:"첨예하다", mainDef:"의견이나 대립이 첨예하면, 서로 다른 입장이 아주 강하고 날카롭게 부딪힌다는 뜻이에요.", hanja:"첨(尖 뾰족하다) + 예(銳 날카롭다)", contextDef:"타임아웃을 둘러싼 찬반 입장이 이 논쟁에서 가장 날카롭게 맞선다는 뜻으로 쓰였어요.", variants:["첨예하게"], subDefs:[], examples:[{kor:"두 나라는 국경 문제로 첨예하게 대립하고 있어요.", eng:"The two countries are in sharp conflict over the border issue."}], translations:{ en:{ term:"to be sharp, to be acute", mainDef:"if opinions or a conflict are sharp, opposing sides clash very strongly and intensely.", contextDef:"Used here for the pro/con positions on time-out clashing more sharply than on any other point." } } },
            { term:"지점", mainDef:"지점은 어떤 흐름 안에서 특별히 문제가 되는 한 부분이에요.", hanja:"지(地 땅) + 점(點 점)", contextDef:"지도 위의 위치가 아니라, 논쟁에서 의견이 가장 크게 갈리는 대목을 비유적으로 가리켜요.", variants:["지점"], subDefs:[], examples:[{kor:"두 사람의 의견이 갈리는 지점은 비용 문제였어요.", eng:"The point where the two disagreed was the cost."}], translations:{ en:{ term:"point (of an issue)", mainDef:"a particular part or moment within a flow where something becomes an issue.", contextDef:"Used figuratively for the place in the debate where opinions divide most, not a spot on a map." } } },
            { term:"어기다", mainDef:"규칙이나 약속을 어기면, 정해진 대로 하지 않고 그것을 깨뜨린다는 뜻이에요.", contextDef:"타임아웃이 쓰이는 상황, 즉 아이가 정해진 규칙을 지키지 않은 경우를 가리켜요.", variants:["어기거나"], subDefs:[], examples:[{kor:"약속을 어기면 신뢰를 잃게 돼요.", eng:"If you break a promise, you lose trust."}], translations:{ en:{ term:"to break (a rule or promise)", mainDef:"if you break a rule or promise, you fail to keep it and violate it.", contextDef:"Used here for the situation that triggers a time-out — a child not keeping a set rule." } } },
            { term:"감정을 조절하다", mainDef:"감정을 조절하면, 화나 슬픔 같은 마음을 스스로 알맞게 다룬다는 뜻이에요.", hanja:"조(調 고르다) + 절(節 알맞게 하다)", contextDef:"아이가 스스로 마음을 가라앉히는 능력을 가리키며, 이 글에서 두 번 반복돼요.", variants:["감정 조절","감정을 조절하는"], subDefs:[{subTerm:"• 조절하다", subDef:"많고 적음이나 세기를 알맞게 맞춰요"}], examples:[{kor:"화가 날 때 감정을 조절하는 방법을 배우고 있어요.", eng:"I'm learning ways to regulate my emotions when I get angry."}], translations:{ en:{ term:"to regulate one's emotions", mainDef:"if you regulate your emotions, you handle feelings like anger or sadness at a suitable level yourself.", contextDef:"Used here for a child's own ability to settle down, and repeated later in the article." } } },
            { term:"유도하다", mainDef:"어떤 행동을 유도하면, 상대가 스스로 그렇게 하도록 이끈다는 뜻이에요.", hanja:"유(誘 꾀다) + 도(導 이끌다)", contextDef:"아이를 억지로 진정시키는 것이 아니라 스스로 가라앉도록 이끈다는 뜻으로 쓰였어요.", variants:["유도하는"], subDefs:[], examples:[{kor:"질문을 던져 학생들의 참여를 유도했어요.", eng:"I drew the students into participating by asking questions."}], translations:{ en:{ term:"to induce, to lead (someone) to", mainDef:"if you induce a behavior, you lead the other person to do it of their own accord.", contextDef:"Used here for leading a child to calm down rather than forcing them to." } } },
            { term:"훈육", mainDef:"훈육은 아이에게 옳고 그름을 가르쳐 바른 행동을 배우게 하는 일이에요.", hanja:"훈(訓 가르치다) + 육(育 기르다)", contextDef:"타임아웃을 비롯해 이 글에서 다루는 여러 가르침의 방식을 묶어 부르는 말이에요.", variants:["훈육"], subDefs:[], examples:[{kor:"훈육과 화풀이는 완전히 다른 일이에요.", eng:"Discipline and venting anger are completely different things."}], translations:{ en:{ term:"discipline (child-rearing)", mainDef:"the work of teaching a child right from wrong so they learn to behave properly.", contextDef:"The umbrella word for the teaching methods discussed here, time-out included." } } },
            { term:"일컫다", mainDef:"무언가를 일컫는다고 하면, 그것을 어떤 이름으로 부른다는 뜻이에요.", contextDef:"타임아웃이라는 말이 가리키는 대상을 풀어 설명하며 쓰였어요.", variants:["일컫는다"], subDefs:[], examples:[{kor:"이 지역에서는 그 음식을 다른 이름으로 일컬어요.", eng:"In this region they call that dish by a different name."}], translations:{ en:{ term:"to refer to, to call", mainDef:"if you refer to something by a name, you call it by that name.", contextDef:"Used while spelling out what the word 'time-out' denotes." } } },
            { term:"흥분을 가라앉히다", mainDef:"흥분을 가라앉히면, 들뜨거나 화가 난 마음을 차분하게 만든다는 뜻이에요.", hanja:"흥(興 일다) + 분(奮 떨치다)", contextDef:"타임아웃이 노리는 효과, 즉 아이의 들뜬 마음을 차분하게 만드는 일을 가리켜요.", variants:["흥분을 가라앉히고"], subDefs:[{subTerm:"• 가라앉히다", subDef:"들뜨거나 거센 것을 잠잠하게 만들어요"}], examples:[{kor:"잠깐 밖에 나가 흥분을 가라앉히고 다시 이야기했어요.", eng:"I stepped outside briefly to calm down, then we talked again."}], translations:{ en:{ term:"to calm down one's excitement", mainDef:"if you calm your excitement, you settle a worked-up or angry state of mind.", contextDef:"Used here for what time-out aims to achieve — settling a child's worked-up state." } } },
            { term:"분리되다", mainDef:"어떤 것이 분리되면, 붙어 있던 것에서 떨어져 따로 놓인다는 뜻이에요.", hanja:"분(分 나누다) + 리(離 떼다)", contextDef:"아이를 가족이 있는 자리에서 떼어 다른 공간에 두는 것을 가리켜요.", variants:["분리된"], subDefs:[], examples:[{kor:"쓰레기는 종류별로 분리된 통에 넣어 주세요.", eng:"Please put the trash in the bins separated by type."}], translations:{ en:{ term:"to be separated", mainDef:"if something is separated, it is taken apart from what it was joined to and set aside.", contextDef:"Used here for taking a child away from where the family is and placing them elsewhere." } } },
            { term:"행위", mainDef:"행위는 사람이 뜻을 가지고 하는 하나의 행동이에요.", hanja:"행(行 행하다) + 위(爲 하다)", contextDef:"아이를 따로 두는 일 그 자체를 하나의 행동으로 떼어 놓고 평가할 때 쓰였어요.", variants:["행위"], subDefs:[], examples:[{kor:"말보다 행위가 그 사람을 더 잘 보여 줘요.", eng:"Actions show a person better than words do."}], translations:{ en:{ term:"act, conduct", mainDef:"a single action a person performs with intention.", contextDef:"Used to isolate and judge the act of placing a child apart, in itself." } } },
            { term:"정서적", mainDef:"어떤 것이 정서적이면, 사람의 감정이나 마음과 관련되어 있다는 뜻이에요.", hanja:"정(情 마음) + 서(緖 실마리) + 적(的 ~에 관한)", contextDef:"몸이 아니라 마음에서 일어나는 문제라는 점을 가리키며 쓰였어요.", variants:["정서적"], subDefs:[], examples:[{kor:"이사는 아이에게 정서적 부담이 될 수 있어요.", eng:"Moving house can be an emotional burden for a child."}], translations:{ en:{ term:"emotional", mainDef:"if something is emotional, it has to do with a person's feelings or inner life.", contextDef:"Used to mark this as a problem of the heart rather than of the body." } } },
            { term:"단절", mainDef:"단절은 이어져 있던 관계나 흐름이 끊어지는 거예요.", hanja:"단(斷 끊다) + 절(絕 끊어지다)", contextDef:"아이를 혼자 두었을 때 부모와의 마음의 연결이 끊긴다는 비판에서 쓰였어요.", variants:["단절"], subDefs:[], examples:[{kor:"오랜 단절 끝에 두 사람은 다시 연락을 시작했어요.", eng:"After a long break, the two started talking again."}], translations:{ en:{ term:"severance, disconnection", mainDef:"the breaking off of a relationship or flow that had been connected.", contextDef:"Used in the criticism that leaving a child alone cuts their emotional connection to the parent." } } },
            { term:"심리적", mainDef:"어떤 것이 심리적이면, 사람의 마음속에서 일어나는 것과 관련되어 있다는 뜻이에요.", hanja:"심(心 마음) + 리(理 이치) + 적(的 ~에 관한)", contextDef:"몸에 가하는 폭력이 아니라 마음에 가해지는 폭력이라는 뜻으로 쓰였어요.", variants:["심리적"], subDefs:[], examples:[{kor:"시험 기간에는 심리적 압박이 커져요.", eng:"Psychological pressure builds during exam season."}], translations:{ en:{ term:"psychological", mainDef:"if something is psychological, it relates to what happens inside a person's mind.", contextDef:"Used here to mean violence done to the mind rather than the body." } } },
            { term:"폭력", mainDef:"폭력은 남에게 함부로 힘을 써서 몸이나 마음을 다치게 하는 일이에요.", hanja:"폭(暴 사납다) + 력(力 힘)", contextDef:"타임아웃을 비판하는 쪽이 이 훈육법에 붙인 가장 강한 표현이에요.", variants:["폭력"], subDefs:[], examples:[{kor:"어떤 이유로도 폭력은 정당화될 수 없어요.", eng:"Violence cannot be justified for any reason."}], translations:{ en:{ term:"violence", mainDef:"the act of using force recklessly on someone so as to hurt their body or mind.", contextDef:"The strongest word critics attach to this discipline method." } } },
            { term:"작용하다", mainDef:"무언가가 어떤 것으로 작용하면, 실제로 그런 힘이나 효과를 낸다는 뜻이에요.", hanja:"작(作 짓다) + 용(用 쓰다)", contextDef:"타임아웃이 의도와 상관없이 아이에게 폭력과 같은 효과를 낸다는 뜻으로 쓰였어요.", variants:["작용할"], subDefs:[], examples:[{kor:"작은 칭찬이 큰 동기로 작용했어요.", eng:"A small compliment worked as a big motivation."}], translations:{ en:{ term:"to act as, to function as", mainDef:"if something acts as a certain thing, it actually produces that force or effect.", contextDef:"Used here for time-out functioning as violence on the child regardless of intent." } } },
            { term:"지적하다", mainDef:"어떤 문제를 지적하면, 그것이 잘못되었다고 콕 집어 말한다는 뜻이에요.", hanja:"지(指 가리키다) + 적(摘 집다)", contextDef:"반대 측과 여러 전문가가 문제점을 짚어 말하는 대목에서 반복해 쓰여요.", variants:["지적하며","지적"], subDefs:[], examples:[{kor:"교수는 논문의 약점을 정확히 지적했어요.", eng:"The professor pinpointed the weaknesses of the paper."}], translations:{ en:{ term:"to point out", mainDef:"if you point out a problem, you name it specifically as being wrong.", contextDef:"Repeated where critics and experts name what they see as flaws." } } },
            { term:"날 선 시선을 보내다", mainDef:"누군가에게 날 선 시선을 보내면, 마음에 들지 않는다는 눈빛으로 날카롭게 바라본다는 뜻이에요.", contextDef:"타임아웃을 반대하는 쪽의 매우 비판적인 태도를 그림처럼 표현한 말이에요.", variants:["날 선 시선을 보내고"], subDefs:[{subTerm:"• 날이 서다", subDef:"칼날처럼 날카로워져요"}], examples:[{kor:"새 정책에 시민들이 날 선 시선을 보내고 있어요.", eng:"Citizens are casting a sharp, critical eye on the new policy."}], translations:{ en:{ term:"to cast a sharp, critical eye", mainDef:"if you cast a sharp eye at something, you look at it critically and with disapproval.", contextDef:"A vivid way of describing the strongly critical stance of time-out's opponents." } } },
            { term:"설득하다", mainDef:"누군가를 설득하면, 이유를 들어 말해서 상대가 내 생각을 받아들이게 만든다는 뜻이에요.", hanja:"설(說 말하다) + 득(得 얻다)", contextDef:"부모가 명령 대신 말로 이해시키려 하는 양육 방식을 가리켜요.", variants:["설득하는"], subDefs:[], examples:[{kor:"자료를 보여 주며 상사를 설득했어요.", eng:"I persuaded my boss by showing him the data."}], translations:{ en:{ term:"to persuade", mainDef:"if you persuade someone, you give reasons until they accept your view.", contextDef:"Used for the parenting style of talking a child around instead of commanding." } } },
            { term:"주도권", mainDef:"주도권은 어떤 일을 자기가 원하는 방향으로 이끌어 갈 수 있는 힘이에요.", hanja:"주(主 주인) + 도(導 이끌다) + 권(權 권리)", contextDef:"부모가 계속 설득만 하다가 결국 양육을 이끌어 가는 힘을 잃게 된다는 뜻으로 쓰였어요.", variants:["주도권"], subDefs:[], examples:[{kor:"회의에서 그가 주도권을 잡고 이야기를 이끌었어요.", eng:"He took the initiative in the meeting and led the discussion."}], translations:{ en:{ term:"initiative, the upper hand", mainDef:"the power to lead something in the direction one wants.", contextDef:"Used here for parents losing their hold on the direction of their own parenting." } } },
            { term:"좌절", mainDef:"좌절은 바라던 일이 뜻대로 되지 않아 마음이 꺾이는 거예요.", hanja:"좌(挫 꺾이다) + 절(折 꺾다)", contextDef:"아이가 반드시 겪어야 한다고 이 글이 강조하는 경험을 가리켜요.", variants:["좌절"], subDefs:[], examples:[{kor:"작은 좌절을 겪어 본 사람이 더 잘 버텨요.", eng:"People who have known small setbacks hold up better."}], translations:{ en:{ term:"frustration, setback", mainDef:"the breaking of one's spirit when something hoped for does not go as wished.", contextDef:"The experience this article insists a child must go through." } } },
            { term:"협상", mainDef:"협상은 서로 원하는 것이 다를 때 이야기를 주고받으며 양쪽이 받아들일 수 있는 선을 찾는 일이에요.", hanja:"협(協 화합하다) + 상(商 헤아리다)", contextDef:"부모와 아이가 끝없이 조건을 주고받는 상황을 비유적으로 가리켜요.", variants:["협상"], subDefs:[], examples:[{kor:"긴 협상 끝에 양쪽이 조금씩 양보했어요.", eng:"After long negotiations, both sides gave a little ground."}], translations:{ en:{ term:"negotiation", mainDef:"the work of talking back and forth to find a line both sides can accept when they want different things.", contextDef:"Used figuratively for the endless bargaining between parent and child." } } },
            { term:"극단적", mainDef:"어떤 방법이 극단적이면, 중간이 없이 한쪽 끝까지 밀어붙인다는 뜻이에요.", hanja:"극(極 끝) + 단(端 끝) + 적(的 ~한 성격의)", contextDef:"설득에 지친 부모가 갑자기 강압적인 방식으로 돌아서는 것을 가리켜요.", variants:["극단적"], subDefs:[], examples:[{kor:"극단적인 다이어트는 건강을 해쳐요.", eng:"Extreme dieting harms your health."}], translations:{ en:{ term:"extreme", mainDef:"if a method is extreme, it pushes all the way to one end with no middle ground.", contextDef:"Used for a worn-out parent suddenly swinging to forceful methods." } } },
            { term:"통제", mainDef:"통제는 남의 행동을 제 뜻대로 묶어 두고 마음대로 하지 못하게 하는 거예요.", hanja:"통(統 거느리다) + 제(制 억누르다)", contextDef:"설득이 실패한 뒤 부모가 택하게 되는 강한 방식을 가리켜요.", variants:["통제"], subDefs:[], examples:[{kor:"지나친 통제는 오히려 반발을 불러와요.", eng:"Excessive control only invites pushback."}], translations:{ en:{ term:"control", mainDef:"holding another person's behavior in check so they cannot act as they please.", contextDef:"Used for the forceful approach a parent falls back on once persuasion fails." } } },
            { term:"교정", mainDef:"교정은 잘못되거나 비뚤어진 것을 바르게 고치는 일이에요.", hanja:"교(矯 바로잡다) + 정(正 바르다)", contextDef:"타임아웃이 아이의 행동을 실제로 바르게 고치는 효과가 있는지를 다루는 대목에서 쓰였어요.", variants:["교정"], subDefs:[], examples:[{kor:"자세 교정을 위해 매일 스트레칭을 해요.", eng:"I stretch every day to correct my posture."}], translations:{ en:{ term:"correction", mainDef:"the work of setting right something that is wrong or crooked.", contextDef:"Used where the article asks whether time-out actually corrects a child's behavior." } } },
            { term:"처벌", mainDef:"처벌은 잘못한 사람에게 일부러 괴로움을 주는 일이에요.", hanja:"처(處 처리하다) + 벌(罰 벌하다)", contextDef:"타임아웃을 가르침이 아니라 벌로 쓸 때를 가리키며, 그때는 효과가 없다고 설명해요.", variants:["처벌"], subDefs:[], examples:[{kor:"처벌보다 예방이 더 효과적일 때가 많아요.", eng:"Prevention is often more effective than punishment."}], translations:{ en:{ term:"punishment", mainDef:"the act of penalizing a wrongdoer by inflicting hardship.", contextDef:"Used for time-out employed as punishment rather than teaching — where it is said to fail." } } },
            { term:"수단", mainDef:"수단은 어떤 목적을 이루기 위해 쓰는 방법이나 도구예요.", hanja:"수(手 손) + 단(段 방법)", contextDef:"타임아웃이 훈육이 아니라 벌을 주기 위한 도구로 쓰이는 경우를 가리켜요.", variants:["수단"], subDefs:[], examples:[{kor:"목적이 좋아도 수단까지 옳은 건 아니에요.", eng:"A good end does not make the means right."}], translations:{ en:{ term:"means, instrument", mainDef:"a method or tool used to achieve some purpose.", contextDef:"Used for time-out being used as a tool of punishment rather than of teaching." } } },
            { term:"풀어주다", mainDef:"어떤 마음을 말로 풀어주면, 상대가 느끼는 감정을 대신 말로 표현해 준다는 뜻이에요.", contextDef:"부모가 아이의 감정을 알아채서 말로 대신 표현해 주는 방식을 가리켜요.", variants:["풀어주는"], subDefs:[], examples:[{kor:"아이의 속마음을 말로 풀어주니 울음이 그쳤어요.", eng:"Putting the child's feelings into words for them stopped the crying."}], translations:{ en:{ term:"to put (feelings) into words for someone", mainDef:"if you put someone's feelings into words for them, you express on their behalf what they are feeling.", contextDef:"Used for parents naming a child's emotions out loud for them." } } },
            { term:"자존감", mainDef:"자존감은 자기 자신을 소중하고 괜찮은 사람이라고 느끼는 마음이에요.", hanja:"자(自 스스로) + 존(尊 높이다) + 감(感 느낌)", contextDef:"마음읽기 교육이 무엇보다 지키려고 했던 아이의 마음 상태를 가리켜요.", variants:["자존감"], subDefs:[], examples:[{kor:"작은 성공 경험이 자존감을 키워 줘요.", eng:"Small experiences of success build self-esteem."}], translations:{ en:{ term:"self-esteem", mainDef:"the feeling that one is a worthwhile and acceptable person.", contextDef:"The inner state 'mind-reading education' set out above all to protect." } } },
            { term:"자리 잡다", mainDef:"어떤 것이 자리 잡으면, 잠깐 유행하다 사라지지 않고 그대로 남아 굳어진다는 뜻이에요.", contextDef:"마음읽기 교육이 잠깐의 유행을 넘어 하나의 양육 방식으로 굳어졌다는 뜻이에요.", variants:["자리 잡았지만"], subDefs:[], examples:[{kor:"재택근무가 이제 하나의 방식으로 자리 잡았어요.", eng:"Working from home has now settled in as one accepted way of working."}], translations:{ en:{ term:"to take hold, to become established", mainDef:"if something takes hold, it stops being a passing fad and settles firmly into place.", contextDef:"Used for mind-reading education hardening into an accepted parenting style." } } },
            { term:"치우치다", mainDef:"어떤 태도가 한쪽으로 치우치면, 균형을 잃고 그쪽으로만 기운다는 뜻이에요.", contextDef:"아이의 감정을 존중하는 쪽으로만 기울어 규칙을 가르치지 못했다는 비판에서 쓰였어요.", variants:["치우친"], subDefs:[{subTerm:"• -ㄴ 나머지", subDef:"앞의 상태가 너무 심해서 그 결과 좋지 않은 일이 생겼다고 말할 때 써요"}], examples:[{kor:"한쪽 의견에만 치우친 기사는 신뢰를 잃어요.", eng:"An article leaning to only one side loses trust."}], translations:{ en:{ term:"to lean, to be one-sided", mainDef:"if an attitude leans one way, it loses balance and tilts only in that direction.", contextDef:"Used in the criticism that tilting toward a child's feelings crowded out teaching rules." } } },
            { term:"한계", mainDef:"한계는 여기까지는 되고 그 너머는 안 된다고 정해진 선이에요.", hanja:"한(限 한하다) + 계(界 경계)", contextDef:"아이에게 가르쳐야 할 행동의 선을 가리키며, 앞의 '경계'와 짝을 이뤄요.", variants:["한계"], subDefs:[], examples:[{kor:"자기 한계를 아는 것도 하나의 능력이에요.", eng:"Knowing your own limits is a kind of ability too."}], translations:{ en:{ term:"limit, boundary", mainDef:"the line marking how far something may go and no further.", contextDef:"Used for the line of behavior a child must be taught, paired with 'boundary' earlier." } } },
            { term:"우려", mainDef:"우려는 나쁜 일이 생길까 봐 미리 걱정하는 마음이에요.", hanja:"우(憂 근심하다) + 려(慮 염려하다)", contextDef:"아이가 좌절을 겪을 기회를 잃는 것에 대한 사회적 걱정을 가리켜요.", variants:["우려"], subDefs:[], examples:[{kor:"물가가 계속 오를 거라는 우려가 커지고 있어요.", eng:"Concern is growing that prices will keep rising."}], translations:{ en:{ term:"concern, apprehension", mainDef:"a worried feeling in advance that something bad may happen.", contextDef:"Used for social worry that children are losing chances to face frustration." } } },
            { term:"아동", mainDef:"아동은 아직 어른이 되지 않은 나이의 아이를 가리키는 말이에요.", hanja:"아(兒 아이) + 동(童 아이)", contextDef:"'아동발달'처럼 학문이나 제도에서 아이를 부를 때 쓰는 격식 있는 표현이에요.", variants:["아동발달"], subDefs:[], examples:[{kor:"이 정책은 아동 안전을 최우선으로 해요.", eng:"This policy puts child safety first."}], translations:{ en:{ term:"child (formal)", mainDef:"a word for a young person who has not yet become an adult.", contextDef:"The formal term used in academic or institutional contexts, as in 'child development.'" } } },
            { term:"회복하다", mainDef:"누군가가 회복하면, 나빠졌던 상태에서 원래대로 다시 좋아진다는 뜻이에요.", hanja:"회(回 돌아오다) + 복(復 회복하다)", contextDef:"아이가 힘든 일을 겪은 뒤 다시 제자리로 돌아오는 힘을 가리켜요.", variants:["회복하는"], subDefs:[], examples:[{kor:"푹 자고 나니 컨디션이 회복됐어요.", eng:"After a good sleep I recovered my condition."}], translations:{ en:{ term:"to recover", mainDef:"if you recover, you return from a worsened state to how you were.", contextDef:"Used for a child's power to come back after a hard experience." } } },
            { term:"저서", mainDef:"저서는 어떤 사람이 직접 쓴 책이에요.", hanja:"저(著 짓다) + 서(書 책)", contextDef:"전문가의 주장이 어디에 실려 있는지를 밝힐 때 쓰였어요.", variants:["저서"], subDefs:[], examples:[{kor:"그 학자의 저서는 여러 나라 말로 번역됐어요.", eng:"That scholar's book has been translated into several languages."}], translations:{ en:{ term:"a book one has written", mainDef:"a book written by a particular person.", contextDef:"Used to say where the expert's argument is set out." } } },
            { term:"통과하다", mainDef:"어떤 일을 통과하면, 힘든 과정을 거쳐 그 끝까지 지나간다는 뜻이에요.", hanja:"통(通 통하다) + 과(過 지나다)", contextDef:"불편함을 없애 주는 대신 아이가 그것을 끝까지 지나가게 해야 한다는 뜻으로 쓰였어요.", variants:["통과하는"], subDefs:[], examples:[{kor:"긴 터널을 통과하니 바다가 보였어요.", eng:"After passing through the long tunnel, the sea came into view."}], translations:{ en:{ term:"to pass through, to get through", mainDef:"if you get through something, you go all the way past a hard process.", contextDef:"Used for letting a child go all the way through discomfort instead of removing it." } } },
            { term:"짚다", mainDef:"어떤 점을 짚으면, 그것을 콕 집어 분명하게 말한다는 뜻이에요.", contextDef:"전문가가 책에서 핵심을 정확히 집어 말한다는 뜻으로 쓰였어요.", variants:["짚는다"], subDefs:[], examples:[{kor:"그는 문제의 원인을 정확히 짚었어요.", eng:"He put his finger precisely on the cause of the problem."}], translations:{ en:{ term:"to put one's finger on, to point out", mainDef:"if you put your finger on a point, you name it clearly and precisely.", contextDef:"Used for the expert naming the core point exactly in her book." } } },
            { term:"과잉 개입", mainDef:"과잉 개입은 도와야 할 선을 넘어 남의 일에 너무 깊이 끼어드는 거예요.", hanja:"과(過 지나치다) + 잉(剩 남다) + 개(介 끼다) + 입(入 들다)", contextDef:"부모가 아이의 감정과 선택에까지 필요 이상으로 끼어드는 태도를 가리켜요.", variants:["과잉 개입하는","과잉 개입"], subDefs:[{subTerm:"• 개입하다", subDef:"남의 일 사이에 끼어들어 관여해요"}], examples:[{kor:"부모의 과잉 개입은 아이의 판단력을 약하게 만들어요.", eng:"Parental over-involvement weakens a child's judgment."}], translations:{ en:{ term:"over-involvement, overintervention", mainDef:"stepping into someone else's affairs far beyond the line of helping.", contextDef:"Used for parents meddling even in a child's feelings and choices." } } },
            { term:"경계하다", mainDef:"어떤 태도를 경계하면, 그것이 나쁜 결과를 낳을까 봐 조심하고 멀리한다는 뜻이에요.", hanja:"경(警 조심하다) + 계(戒 삼가다)", contextDef:"앞에 나온 '경계(境界)'와 한자가 다르며, 여기서는 '조심하다'라는 뜻이에요.", variants:["경계한다"], subDefs:[], examples:[{kor:"성급한 결론을 경계해야 해요.", eng:"We should be wary of hasty conclusions."}], translations:{ en:{ term:"to be wary of, to guard against", mainDef:"if you are wary of an attitude, you keep your distance for fear it will bring bad results.", contextDef:"A different Sino-Korean word from the earlier 'boundary' — here it means 'to be on guard.'" } } },
            { term:"머리와 손발이 되어주다", mainDef:"누군가의 머리와 손발이 되어주면, 그 사람이 할 생각과 행동을 대신 다 해 준다는 뜻이에요.", contextDef:"부모가 아이 대신 판단하고 움직여 주는 태도를 그림처럼 표현한 조언이에요.", variants:["머리와 손발이 되어주지"], subDefs:[], examples:[{kor:"후배의 머리와 손발이 되어주면 후배는 배울 기회를 잃어요.", eng:"If you do all the thinking and doing for a junior colleague, they lose the chance to learn."}], translations:{ en:{ term:"to be someone's head, hands and feet", mainDef:"if you are someone's head, hands and feet, you do all their thinking and acting for them.", contextDef:"A vivid image for parents judging and moving on a child's behalf." } } },
            { term:"~(으)로 인하다", mainDef:"'A로 인한 B'라고 하면, A가 원인이 되어 B가 생겼다는 뜻이에요. 주로 글에서 써요.", hanja:"인(因 말미암다)", contextDef:"아이 자신의 실수가 원인이 되어 생기는 고통이라는 뜻으로 쓰였어요.", variants:["실수로 인한"], subDefs:[], examples:[{kor:"폭우로 인한 피해가 컸어요.", eng:"The damage caused by the heavy rain was severe."}], translations:{ en:{ term:"due to, caused by", mainDef:"'B due to A' means A is the cause from which B arose. Mainly used in writing.", contextDef:"Used here for the pain caused by a child's own mistakes." } } },
            { term:"겪다", mainDef:"어떤 일을 겪으면, 그 일을 실제로 몸으로 지나며 경험한다는 뜻이에요.", contextDef:"고통을 말로만 아는 것이 아니라 직접 지나가게 해야 한다는 뜻으로 쓰였어요.", variants:["겪게"], subDefs:[], examples:[{kor:"어려운 시기를 겪고 나서 생각이 많이 달라졌어요.", eng:"After going through a hard time, my thinking changed a lot."}], translations:{ en:{ term:"to go through, to undergo", mainDef:"if you go through something, you actually live through it yourself.", contextDef:"Used to say a child must live through pain, not merely hear about it." } } },
            { term:"조언", mainDef:"조언은 남에게 도움이 되라고 해 주는 말이에요.", hanja:"조(助 돕다) + 언(言 말)", contextDef:"전문가가 부모들에게 건네는 짧고 분명한 권고를 가리켜요.", variants:["조언"], subDefs:[], examples:[{kor:"선배의 조언 덕분에 방향을 잡았어요.", eng:"Thanks to my senior's advice, I found my direction."}], translations:{ en:{ term:"advice", mainDef:"words offered to another person in order to help them.", contextDef:"Used for the short, clear recommendations the expert gives parents." } } },
            { term:"판단하다", mainDef:"무언가를 판단하면, 무엇이 옳고 그른지 스스로 따져서 정한다는 뜻이에요.", hanja:"판(判 판가름하다) + 단(斷 끊다)", contextDef:"아이가 어른의 지시 없이 스스로 옳고 그름을 정하는 힘을 가리켜요.", variants:["판단하고"], subDefs:[], examples:[{kor:"정보가 부족하면 정확히 판단하기 어려워요.", eng:"It's hard to judge accurately when information is lacking."}], translations:{ en:{ term:"to judge, to decide", mainDef:"if you judge something, you weigh for yourself what is right and wrong and decide.", contextDef:"Used for a child deciding right and wrong without an adult's instruction." } } },
            { term:"책임지다", mainDef:"어떤 일을 책임지면, 그 일의 결과를 자기가 맡는다는 뜻이에요.", hanja:"책(責 맡다) + 임(任 맡기다)", contextDef:"아이가 자기 선택의 결과를 스스로 떠맡는 힘을 가리키며 두 번 쓰여요.", variants:["책임지는","책임질"], subDefs:[], examples:[{kor:"자기 말에 책임지는 사람이 믿음을 얻어요.", eng:"People who stand behind their words earn trust."}], translations:{ en:{ term:"to take responsibility", mainDef:"if you take responsibility for something, you bear its consequences yourself.", contextDef:"Used twice for a child bearing the results of their own choices." } } },
            { term:"떠받들다", mainDef:"누군가를 떠받들면, 그 사람을 너무 높이 모시며 무엇이든 맞춰 준다는 뜻이에요.", contextDef:"아이를 '존중하는 것'과 구별되는, 아이를 지나치게 위하는 태도를 가리켜요.", variants:["떠받드는"], subDefs:[], examples:[{kor:"손님을 떠받들기만 하면 오히려 불편해할 수도 있어요.", eng:"Waiting on a guest hand and foot can actually make them uncomfortable."}], translations:{ en:{ term:"to put on a pedestal, to wait on hand and foot", mainDef:"if you put someone on a pedestal, you exalt them and give in to whatever they want.", contextDef:"Set here against merely 'respecting' a child — an excess of deference." } } },
            { term:"품", mainDef:"품은 두 팔을 벌려 안았을 때 생기는 가슴 안쪽 자리예요.", contextDef:"부모의 보호 아래 있는 상태를 비유적으로 가리켜요.", variants:["품"], subDefs:[], examples:[{kor:"아이가 엄마 품에서 잠이 들었어요.", eng:"The child fell asleep in his mother's arms."}], translations:{ en:{ term:"one's arms, one's bosom", mainDef:"the space against the chest formed when one opens both arms to hold someone.", contextDef:"Used figuratively for being under a parent's protection." } } },
            { term:"다스리다", mainDef:"자기 감정을 다스리면, 마음이 흔들릴 때 스스로 가라앉히고 다룬다는 뜻이에요.", contextDef:"어른이 된 아이가 갖추어야 할 능력의 하나로, 앞의 '감정을 조절하다'와 짝을 이뤄요.", variants:["다스리고"], subDefs:[], examples:[{kor:"화를 다스리는 데는 시간이 좀 필요해요.", eng:"It takes some time to master your anger."}], translations:{ en:{ term:"to govern, to master (one's emotions)", mainDef:"if you govern your emotions, you settle and handle them yourself when they are shaken.", contextDef:"One of the capacities the grown child should have — paired with 'regulate one's emotions' earlier." } } },
            { term:"더불어 살다", mainDef:"더불어 살면, 다른 사람들과 어울려 함께 지낸다는 뜻이에요.", contextDef:"혼자가 아니라 남과 어울려 살아가는 어른의 모습을 가리켜요.", variants:["더불어 살아가며"], subDefs:[], examples:[{kor:"이웃과 더불어 사는 법을 배우는 게 중요해요.", eng:"Learning to live alongside your neighbors matters."}], translations:{ en:{ term:"to live alongside others", mainDef:"if you live alongside others, you get along and live together with other people.", contextDef:"Used for an adult who lives with others rather than alone." } } },
            { term:"상반되다", mainDef:"두 가지가 상반되면, 서로 반대여서 함께 갈 수 없다는 뜻이에요.", hanja:"상(相 서로) + 반(反 반대)", contextDef:"감정 존중과 규칙 교육이 사실은 서로 반대되는 것이 아니라는 결론에서 쓰였어요.", variants:["상반되는"], subDefs:[], examples:[{kor:"두 증언이 서로 상반돼서 판단이 어려웠어요.", eng:"The two testimonies contradicted each other, making judgment hard."}], translations:{ en:{ term:"to be opposed, to be contradictory", mainDef:"if two things are opposed, they run counter to each other and cannot go together.", contextDef:"Used in the conclusion that respecting feelings and teaching rules are not in fact opposites." } } }
