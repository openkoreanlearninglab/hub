    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Range Input */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 0%;
            background: #1a1a1a;
            cursor: pointer;
            margin-top: -5px;
            border: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #e5e7eb;
        }

        ::selection {
            background-color: #f3f4f6;
            color: #000;
        }

        /* Print Specific Adjustments */
        @media print {
            @page {
                margin: 12mm;
            }

            body {
                background-color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            ::-webkit-scrollbar {
                display: none !important;
            }
        }
    </style>
    <style>
@media (pointer: coarse) {
            /* 300ms 탭 지연·더블탭 확대 제거 */
            button, [role="button"], input[type=range], a { touch-action: manipulation; }

            /* 재생 버튼 44x44 확보 — 시각적 크기는 유지하고 히트영역만 확장 */
            #play-btn, #clip-play { position: relative; }
            #play-btn::after, #clip-play::after { content: ''; position: absolute; top: 50%; left: 50%;
                transform: translate(-50%, -50%); width: 44px; height: 44px; }
            #clip-track { height: 34px; }

            /* 되감기·빨리감기 아이콘 버튼 히트영역 확장 */
            [data-action="rewind"], [data-action="forward"] { position: relative; }
            [data-action="rewind"]::after, [data-action="forward"]::after { content: '';
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                width: 44px; height: 44px; }

            /* 배속 버튼 */
            [data-action="speed-menu"] { padding: 12px 10px; margin: -12px -10px; }
            [data-rate] { padding-top: 12px !important; padding-bottom: 12px !important; }

            /* 시크바: 8px → 44px 히트영역, 썸 12px → 20px */
            .seek-wrap { height: 44px !important; margin-top: -18px; margin-bottom: -18px; }
            input[type=range]::-webkit-slider-thumb { height: 20px; width: 20px; margin-top: -9px; }
            input[type=range]::-moz-range-thumb { height: 20px; width: 20px; }

    </style>

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };

        // 동영상 목록 — 항목을 추가하면 Part 선택 버튼이 자동 표시됩니다 (1개면 버튼 없음)
        // REPLACE: title/subTitle/videoId를 실제 값으로. script는 각 동영상의 대본 배열
        // provider: 'youtube'(기본값, 생략 가능) | 'instagram' | 'embed'(범용 임베드)
        //  - 인스타그램: igReel(릴 shortcode, instagram.com/reel/<igReel>/)과 thumb(홈 썸네일 URL, 지정 권장)를 설정. script[].time은 [0,0]으로
        //  - 범용 embed: embedUrl(임베드 전용 URL 전체, 예: https://player.vimeo.com/video/123)을 설정. 세로 영상이면 aspect:'9/16'. thumb 지정 권장, script[].time은 [0,0]
        //  - 재생제어·배속·시크바·시간동기(줄 하이라이트)는 유튜브만 지원. 인스타/embed는 정적 임베드
        //  - thumb(선택): 모든 provider에서 홈 썸네일을 명시 지정 가능. 미지정 시 유튜브는 img.youtube.com 자동, 인스타는 그라데이션 폴백
        // 예: { title:'Part 1', subTitle:'', provider:'instagram', igReel:'DQ4UIBHEqwE', thumb:'https://raw.githubusercontent.com/.../thumbnails/xxx.jpeg', script:[...] }
        const VIDEOS = [
            { title: 'Part 1 · 힐링소설 읽는 이유 vs 안 읽는 이유', subTitle: '북튜버 해죽이', videoId: '76NKLMEvjnU', clip: [0, 285], script: [
            { id: "s1", speaker: "해죽이", kor: "안녕하세요. 오늘은 K-힐링소설 얘기입니다.", time: [0.0, 3.16], eng: "Hello. Today's topic is K-healing novels." },
            { id: "s2", speaker: "해죽이", kor: "<달러구트 꿈 백화점>과 <불편한 편의점>으로 대표되는 한국식 힐링소설.", time: [3.19, 9.08], eng: "Korean-style healing novels, best represented by <Dallergut Dream Department Store> and <The Uncomfortable Convenience Store>." },
            { id: "s3", speaker: "해죽이", kor: "제 마음대로 K-힐링소설이라고 이름을 붙여봤는데요.", time: [9.12, 12.47], eng: "I've taken the liberty of calling them 'K-healing novels.'" },
            { id: "s4", speaker: "해죽이", kor: "처음에는 반짝 인기인가 싶었는데, 어느새 스테디셀러가 되고 비슷한 책들이 많이 나오고 있죠.", time: [12.51, 18.55], eng: "At first I thought it might just be a flash-in-the-pan trend, but before I knew it, they'd become steady bestsellers, and lots of similar books keep coming out." },
            { id: "s5", speaker: "해죽이", kor: "특별한 상점을 배경으로 해서", time: [18.58, 20.57], eng: "They're set against the backdrop of a special shop," },
            { id: "s6", speaker: "해죽이", kor: "그곳을 찾는 다양한 사람들의 고민을 들어주고", time: [20.6, 24.53], eng: "listening to the worries of the various people who visit," },
            { id: "s7", speaker: "해죽이", kor: "현명한 지혜를 찾아준다거나", time: [24.57, 26.69], eng: "helping them find some wise insight," },
            { id: "s8", speaker: "해죽이", kor: "가족 간의 사랑이나 뭔가를 해 나갈 용기를 북돋워주는 내용입니다.", time: [26.72, 31.47], eng: "or encouraging family love and the courage to pursue something." },
            { id: "s9", speaker: "해죽이", kor: "첫 번째는 생각 없이 봐도 되는 책이라서 그런 것 같아요.", time: [31.51, 37.31], eng: "The first reason, I think, is that it's a book you can read without thinking too hard." },
            { id: "s10", speaker: "해죽이", kor: "1년의 시간을 내서 딱 한 권의 책을 읽는 직장인 친구가 있다면", time: [37.34, 41.63], eng: "If I had a friend who only takes a year's time to read just one book," },
            { id: "s11", speaker: "해죽이", kor: "별 생각 없이 즐겁게 볼 수 있는 책으로 이 책을 추천을 하게 될 것 같아요.", time: [41.66, 46.1], eng: "I'd probably recommend this kind of book — something they can enjoy without much thought." },
            { id: "s12", speaker: "해죽이", kor: "책을 추천하는 콘텐츠를 보다 보면 고전을 읽으라는 말도 하잖아요.", time: [46.14, 49.56], eng: "If you watch book-recommendation content, they often tell you to read the classics, right?" },
            { id: "s13", speaker: "해죽이", kor: "그런데 고전을 읽으려고 하면은", time: [49.59, 51.6], eng: "But when you try to read a classic," },
            { id: "s14", speaker: "해죽이", kor: "이해를 해야 되니까 뭔가 조금 더 공부하는 자세로 읽어야 될 것 같고,", time: [51.64, 55.93], eng: "you feel like you have to understand it, so you end up reading it almost like studying," },
            { id: "s15", speaker: "해죽이", kor: "진지하게 인간의 무엇에 대해서 성찰해야 될 것 같은 그런 좀 부담되는 것이 있는데,", time: [55.96, 61.14], eng: "like you're supposed to seriously reflect on something about human nature — and that feels like a bit of a burden," },
            { id: "s16", speaker: "해죽이", kor: "힐링 소설은 별 생각 없이 부담감을 내려놓고 가볍게 소설에 몰입할 수 있기 때문에", time: [61.17, 67.1], eng: "whereas healing novels let you set that burden aside without much thought and get absorbed in the story lightly," },
            { id: "s17", speaker: "해죽이", kor: "읽게 되는 것 같습니다.", time: [67.14, 68.62], eng: "so I think that's why people read them." },
            { id: "s18", speaker: "해죽이", kor: "소설 속에 나쁜 사람이 등장하기는 하는데요.", time: [68.65, 71.61], eng: "Bad people do show up in these novels," },
            { id: "s19", speaker: "해죽이", kor: "그렇게까지 나쁜 사람이 없어요.", time: [71.64, 73.31], eng: "but none of them are truly that bad." },
            { id: "s20", speaker: "해죽이", kor: "내 현실 속에서 매일같이 마주하는 김 부장, 이 매니저, 최 인턴보다는 나은 사람들이 등장을 하기 때문에", time: [73.34, 81.13], eng: "Because the characters are better people than the Manager Kim, the supervisor Lee, or the intern Choi you run into every day in real life," },
            { id: "s21", speaker: "해죽이", kor: "“어차피 현실에서는 속 터지고 답답할 거 소설 속에서라도 좀 좋은 사람들만 가득 만났으면 좋겠다”싶은", time: [81.17, 88.24], eng: "there's a feeling of \"reality is frustrating enough, so at least in the novel I want to meet only good people,\"" },
            { id: "s22", speaker: "해죽이", kor: "그러한 일종의 판타지가 느껴지는 게 이 힐링 소설들의 특징이죠.", time: [88.27, 93.05], eng: "and that kind of fantasy is a defining feature of these healing novels." },
            { id: "s23", speaker: "해죽이", kor: "워낙 다양한 사람들이 나오다 보니까", time: [93.08, 95.89], eng: "Since such a wide variety of people appear," },
            { id: "s24", speaker: "해죽이", kor: "나랑 같은 고민을 하는 사람들이 한 명은 걸리게 돼 있거든요.", time: [95.92, 99.8], eng: "there's bound to be at least one character who shares the same worries as you." },
            { id: "s25", speaker: "해죽이", kor: "그래서 그 사람들의 이야기를 보면 좀 공감받는 느낌을 받기도 하고", time: [99.83, 104.58], eng: "So when you read their stories, you feel understood," },
            { id: "s26", speaker: "해죽이", kor: "이 사람이 갖고 있던 고민을 해결해 주는 혹은 아주 깊은 공감을 하는 문장을 만나게 되니까", time: [104.62, 110.6], eng: "and you come across lines that either resolve that character's worry or express deep empathy with it," },
            { id: "s27", speaker: "해죽이", kor: "“힐링 받았다”, “감동했다”라고 하시는 분들이 많은 것 같더라고요.", time: [110.63, 114.23], eng: "which is why, it seems, a lot of readers say things like \"I felt healed\" or \"I was moved.\"" },
            { id: "s28", speaker: "해죽이", kor: "내가 원했던 하지만 몰랐던 그 한마디를 만날 수 있어서", time: [114.27, 118.79], eng: "Because you get to encounter that one line you wanted but didn't even know you needed," },
            { id: "s29", speaker: "해죽이", kor: "이런 힐링 소설이 인기가 있고 찾게 되는 것 같습니다.", time: [118.82, 122.8], eng: "I think that's why these healing novels are popular and why people keep seeking them out." },
            { id: "s30", speaker: "해죽이", kor: "어디까지 나오나 보자.", time: [122.83, 126.2], eng: "Let's see how far this goes." },
            { id: "s31", speaker: "해죽이", kor: "편의점, 서점, 식당, 세탁소, 슈퍼… 뭐 어디까지 나올지 모르겠는 거예요.", time: [126.23, 132.04], eng: "Convenience store, bookstore, restaurant, laundromat, supermarket… I honestly don't know where it'll stop." },
            { id: "s32", speaker: "해죽이", kor: "“처음에 초밥으로 시작한 오마카세가 디저트 커피에 어디까지 나올지 모르겠다”라는 반응이 지금 나오고 있는데,", time: [132.07, 139.29], eng: "There's a similar reaction going around about omakase — \"it started with sushi, and now who knows how far it'll go with dessert and coffee too\" —" },
            { id: "s33", speaker: "해죽이", kor: "딱 그런 심정으로 “어느 상점까지 나올 것인가”하는 심정으로 보게 되는 것도 있습니다.", time: [139.33, 144.52], eng: "and I find myself watching these novels with that same feeling: \"which shop will they cover next?\"" },
            { id: "s34", speaker: "해죽이", kor: "이 소설들이 힐링이 되기는 하는데요.", time: [144.55, 146.94], eng: "These novels are healing, sure," },
            { id: "s35", speaker: "해죽이", kor: "그냥 소설로서 봤을 때는 진부하게 느껴지기도 해요.", time: [146.97, 150.2], eng: "but purely as novels, they can also feel clichéd." },
            { id: "s36", speaker: "해죽이", kor: "취준생이 나오네?", time: [150.24, 151.14], eng: "Oh, a job-seeker shows up?" },
            { id: "s37", speaker: "해죽이", kor: "혼란스러워하다가 결국 자기 꿈을 찾아가겠네.", time: [151.17, 153.85], eng: "They'll struggle for a while and end up finding their dream." },
            { id: "s38", speaker: "해죽이", kor: "실연을 당했어?", time: [153.88, 154.79], eng: "Got their heart broken?" },
            { id: "s39", speaker: "해죽이", kor: "다시 한번 사랑할 용기를 얻겠네.", time: [154.83, 156.97], eng: "They'll find the courage to love again." },
            { id: "s40", speaker: "해죽이", kor: "부모님이랑 사이가 안 좋아?", time: [157.0, 158.45], eng: "Not on good terms with their parents?" },
            { id: "s41", speaker: "해죽이", kor: "나중에 화해하겠네.", time: [158.48, 159.7], eng: "They'll reconcile eventually." },
            { id: "s42", speaker: "해죽이", kor: "너무 뻔하게 흘러가는 이야기들이 있는 거죠.", time: [159.74, 162.49], eng: "Some of these stories are just painfully predictable." },
            { id: "s43", speaker: "해죽이", kor: "이게 저한테는 어떻게 느껴지냐면,", time: [162.52, 164.59], eng: "How this feels to me is," },
            { id: "s44", speaker: "해죽이", kor: "잡지 중에 <좋은생각>이라는 거 있잖아요.", time: [164.62, 167.27], eng: "you know the magazine <Good Thoughts>?" },
            { id: "s45", speaker: "해죽이", kor: "딱, 그렇게 느껴지는 거예요.", time: [167.3, 168.85], eng: "It feels exactly like that." },
            { id: "s46", speaker: "해죽이", kor: "새로운 것, 참신한 것을 기대하는 게 아니라", time: [168.89, 171.48], eng: "You're not reading it expecting something new or fresh —" },
            { id: "s47", speaker: "해죽이", kor: "어느 정도의 가벼운 힐링을 원하는 딱 그런 마음으로 보게 되는 거죠.", time: [171.52, 175.99], eng: "you pick it up wanting a bit of light healing, and that's exactly the mindset you read it with." },
            { id: "s48", speaker: "해죽이", kor: "딱 그 지점에서 호불호가 갈리는 것 같습니다.", time: [176.02, 179.2], eng: "That's exactly the point where opinions split, I think." },
            { id: "s49", speaker: "해죽이", kor: "이 장르 안에서 새로운 변주와 개성들이 생겨나서", time: [179.23, 183.27], eng: "New variations and distinct voices don't really develop within this genre," },
            { id: "s50", speaker: "해죽이", kor: "이 안에서 마니아가 생겨날 정도가 아닌 것 같은 거예요.", time: [183.31, 186.4], eng: "so it doesn't feel like enough to produce genuine devoted fans." },
            { id: "s51", speaker: "해죽이", kor: "예를 들어서 현재의 장르 소설로 구분되는 SF, 호러 이런 소설들을 보면은", time: [186.43, 192.05], eng: "For example, if you look at genre fiction like sci-fi or horror," },
            { id: "s52", speaker: "해죽이", kor: "뭐 사회의 변화든 기술의 발전이든 되게 현실적인 요소들이 시대에 맞게 반영이 되고", time: [192.09, 198.0], eng: "realistic elements — whether social change or technological progress — get reflected in step with the times," },
            { id: "s53", speaker: "해죽이", kor: "뭐 나라별로든지 작가별로든지 굉장히 다양한 개성이 있다 보니까", time: [198.03, 202.24], eng: "and there's huge variety by country and by author," },
            { id: "s54", speaker: "해죽이", kor: "이 장르에 한번 입덕을 시작을 하면은", time: [202.27, 204.9], eng: "so once you get hooked on the genre," },
            { id: "s55", speaker: "해죽이", kor: "내 취향에 맞는 작가를 계속 새로 만나는 즐거움이라는 게 있거든요.", time: [204.93, 208.78], eng: "there's the pleasure of continually discovering new authors who suit your taste." },
            { id: "s56", speaker: "해죽이", kor: "그런데 이 힐링 소설들은 그냥 <좋은생각> 6월호에서 7월호로 넘어간 딱 그 정도의 느낌이라서", time: [208.81, 215.54], eng: "But these healing novels feel like nothing more than going from the June issue to the July issue of <Good Thoughts>," },
            { id: "s57", speaker: "해죽이", kor: "저에게는 참신함을 기대할 수 없어서 좀 아쉬운 면도 있습니다.", time: [215.58, 219.83], eng: "so for me there's no novelty to expect, which is a bit disappointing." },
            { id: "s58", speaker: "해죽이", kor: "진상 없는 판타지가 몰입을 깨는 요소입니다.", time: [219.86, 222.96], eng: "A fantasy with no difficult customers is exactly what breaks my immersion." },
            { id: "s59", speaker: "해죽이", kor: "대부분의 소설이 특정한 상점을 배경으로 하고 있는데요.", time: [222.99, 226.28], eng: "Most of these novels are set in a particular shop," },
            { id: "s60", speaker: "해죽이", kor: "여기에 그래서 저에게는 개연성이 많이 떨어진다 싶은 부분들이 생겨요.", time: [226.32, 230.6], eng: "and that's where I run into parts that feel, to me, seriously lacking in plausibility." },
            { id: "s61", speaker: "해죽이", kor: "“그렇게 착한 손님만 오고 큰 사고도 안 나고 매출 걱정도 없는 가게가 과연 가능한가?”라는 점에서", time: [230.63, 237.78], eng: "On the point of \"can a shop really exist where only kind customers come in, nothing bad ever happens, and there's never any worry about sales?\" —" },
            { id: "s62", speaker: "해죽이", kor: "와장창 깨져버리는 거죠.", time: [237.81, 239.48], eng: "the illusion just shatters." },
            { id: "s63", speaker: "해죽이", kor: "마치 직장인 여러분들이 드라마를 보실 때,", time: [239.51, 242.16], eng: "It's like when office workers watch a drama," },
            { id: "s64", speaker: "해죽이", kor: "“뭐야? 작년에 유행하기 시작했던 걸 가지고 되게 지금도 시작한 것 마냥 대박 나는 마케터가 있다고?”", time: [242.2, 248.63], eng: "and think, \"Wait, there's a marketer who blows up as if something that trended last year is brand new?\"" },
            { id: "s65", speaker: "해죽이", kor: "헛웃음 나는데", time: [248.66, 249.55], eng: "You can't help but scoff," },
            { id: "s66", speaker: "해죽이", kor: "“와 저렇게 풀메이크업하고 두 시간 만에 코딩을 완성해서 칭찬을 받는다고?”", time: [249.58, 254.21], eng: "or \"Wow, she's got a full face of makeup on and finishes coding a project in two hours and gets praised for it?\"" },
            { id: "s67", speaker: "해죽이", kor: "어이가 없지 않나?", time: [254.24, 255.78], eng: "Isn't that just absurd?" },
            { id: "s68", speaker: "해죽이", kor: "이런 생각을 하면서 드라마를 보실 수 있잖아요.", time: [255.82, 258.72], eng: "You can watch a drama with thoughts like that running through your head." },
            { id: "s69", speaker: "해죽이", kor: "좀 그런 거랑 비슷하지 않을까? 생각을 합니다.", time: [258.75, 260.9], eng: "I think it's something similar to that." },
            { id: "s70", speaker: "해죽이", kor: "경험도 경력도 전무한 상황에서 새롭게 가게를 오픈을 하고", time: [260.93, 265.51], eng: "Opening a brand-new shop with zero experience or career background," },
            { id: "s71", speaker: "해죽이", kor: "그렇게 깔끔하게 운영이 잘되면서 되게 좋은 손님들만 온다는 게 그냥 몰입이 안 되는 거죠.", time: [265.55, 271.93], eng: "and having it run flawlessly with only wonderful customers walking in — it just doesn't let me stay immersed." },
            { id: "s72", speaker: "해죽이", kor: "사실 반대이기 때문에 그러한 상황 오히려 문학 속에서 하시면서 힐링을 바랄 수도 있겠지만,", time: [271.96, 278.19], eng: "Since reality is actually the opposite, some readers might prefer to seek that healing precisely within fiction," },
            { id: "s73", speaker: "해죽이", kor: "현실적으로 느껴지지 않아서 좀 그런 지점이 아쉽기도 할 것 같다는 저의 생각입니다.", time: [278.22, 284.82], eng: "but personally, I feel it's a bit of a shame that it doesn't feel realistic." }
        ] },
            { title: 'Part 2 · 독서가 취미라고요? 반드시 일이어야 합니다', subTitle: '이대호 (진행자) · 최재천 (생물학 교수)', videoId: 'roHegMmUIQs', clip: [9, 182], script: [
            { id: "s1", speaker: "이대호", kor: "\"독서는 일이어야만 한다.\"", time: [9.99, 12.08], eng: "\"Reading has to be work.\"" },
            { id: "s2", speaker: "이대호", kor: "\"독서는 이제 취미나 즐기고 아니면 교양을 쌓는 수단이 아니라 일이어야만 한다.\"", time: [12.13, 17.37], eng: "\"Reading can no longer be a hobby, something to enjoy, or a means of building culture — it has to be work.\"" },
            { id: "s3", speaker: "이대호", kor: "이거는 어떤 의미에서 그렇게 강조를 하신 건가요?", time: [17.41, 19.78], eng: "In what sense are you emphasizing that?" },
            { id: "s4", speaker: "최재천", kor: "글쎄요. 이게 저도 뭐 이런저런 생각하다가 마치 결론처럼 다다른 건데요.", time: [19.82, 26.29], eng: "Well… this is something I arrived at almost like a conclusion after mulling it over in various ways." },
            { id: "s5", speaker: "최재천", kor: "제가 어쩌다가 책을 제법 많이 썼잖아요.", time: [26.34, 29.37], eng: "I happen to have written quite a few books." },
            { id: "s6", speaker: "최재천", kor: "근데 책을 쓰다 보면 이제 출판사 분들하고 시간을 많이 보내는데,", time: [29.41, 34.41], eng: "And when you write books, you end up spending a lot of time with publishers," },
            { id: "s7", speaker: "최재천", kor: "대한민국 출판계는 그냥 해마다 단군 이래 최대 불황이래요.", time: [34.46, 40.21], eng: "and Korea's publishing industry apparently has 'the worst slump since Dangun' every single year." },
            { id: "s8", speaker: "최재천", kor: "그 얘기를 안 한 해가 없어요.", time: [40.25, 42.66], eng: "There's never been a year they haven't said that." },
            { id: "s9", speaker: "최재천", kor: "벌써 멸종했어야 되는데,", time: [42.7, 45.33], eng: "They should've gone extinct by now," },
            { id: "s10", speaker: "최재천", kor: "그래도 여전히 책 팔고 있는 거 보면 신기한데,", time: [45.37, 48.59], eng: "but it's amazing they're still selling books," },
            { id: "s11", speaker: "최재천", kor: "그게 무슨 소리냐?", time: [48.63, 50.3], eng: "What does that even mean?" },
            { id: "s12", speaker: "최재천", kor: "독서를 안 한다는 거잖아요. 우리나라 사람들이.", time: [50.35, 53.34], eng: "It means Korean people just aren't reading." },
            { id: "s13", speaker: "최재천", kor: "그 뭐 통계마다 다 다르던데, 뭐 \"1년에 몇 권 읽는다\" 그거 믿을 수 없을 정도로", time: [53.39, 60.49], eng: "The statistics vary, but claims like 'people read X books a year' are almost unbelievable —" },
            { id: "s14", speaker: "최재천", kor: "거의 아마 1년에 1권도 안 읽는 사람이 태반일 텐데.", time: [60.54, 65.3], eng: "probably most people don't even read one book a year." },
            { id: "s15", speaker: "최재천", kor: "그런 사람들에게 그래도 책을 팔아보겠다고 제가 보기에는 출판사들이 너무 비굴하게 가는 것 같아요.", time: [65.32, 75.86], eng: "And to sell books to people like that, it seems to me publishers end up acting way too servile." },
            { id: "s16", speaker: "최재천", kor: "내용도 별로 없는, 근데 이렇게 읽으면 괜히 기분 이렇게 조금 다독이는 뭐 이런 류의 책들이 너무 많이 나오잖아요.", time: [75.9, 87.15], eng: "Books with barely any real content, but that soothe your feelings a little when you read them — way too many of that kind keep coming out." },
            { id: "s17", speaker: "최재천", kor: "그래서 제가 그건 아닌 것 같다.", time: [87.2, 90.5], eng: "So I thought, that's not it." },
            { id: "s18", speaker: "최재천", kor: "책이라는 건 원래 지식을 전달하려고 인간이 발명한 건데,", time: [90.55, 96.4], eng: "A book is something humans invented originally to pass on knowledge," },
            { id: "s19", speaker: "최재천", kor: "그게 왜 마음을 다독이고 뭐 이런 저 매체로 전락이 전락하냐?", time: [96.45, 104.36], eng: "so why has it degenerated into some medium for soothing feelings?" },
            { id: "s20", speaker: "최재천", kor: "그래서 저는 그냥 좀 질러대기로 했어요.", time: [104.5, 107.9], eng: "So I decided to just go all in and say it." },
            { id: "s21", speaker: "최재천", kor: "그런 책 읽는 거 뭐 마다하지는 않겠는데,", time: [107.95, 111.58], eng: "I'm not saying don't read that kind of book, but," },
            { id: "s22", speaker: "최재천", kor: "기껏 읽어야 1년에 1~2권 읽는 사람이", time: [111.63, 114.78], eng: "if someone who reads at most one or two books a year" },
            { id: "s23", speaker: "최재천", kor: "기껏 읽는 게 그런 것만 읽으면", time: [114.82, 117.38], eng: "only ever reads that kind," },
            { id: "s24", speaker: "최재천", kor: "그건 차라리 눈 나빠지고 건강 해치는 거지.", time: [117.42, 121.64], eng: "they'd honestly be better off not straining their eyes and health for it." },
            { id: "s25", speaker: "최재천", kor: "저, 아주 치명적인 연구 결과 있거든요.", time: [121.68, 124.96], eng: "There's a truly damning research finding, you see." },
            { id: "s26", speaker: "최재천", kor: "앉아있는 시간에 비례해서 수명이 줄어든다.", time: [125.0, 128.35], eng: "Your lifespan shortens in proportion to how much time you spend sitting." },
            { id: "s27", speaker: "최재천", kor: "그 연구에 정말 치명적인 부분은 뭐냐?", time: [128.4, 133.56], eng: "And the truly damning part of that research?" },
            { id: "s28", speaker: "최재천", kor: "\"내가 좀 앉아 있었으니까 운동을 해서 복구를 해야 되겠다.\"", time: [133.6, 138.09], eng: "Thinking, 'well, I sat a lot, so I should exercise to make up for it' —" },
            { id: "s29", speaker: "최재천", kor: "쓸데없다는 거예요.", time: [138.13, 139.23], eng: "that's pointless." },
            { id: "s30", speaker: "최재천", kor: "운동을 한들 아무 소용이 없대요.", time: [139.28, 141.44], eng: "Exercising doesn't help at all, apparently." },
            { id: "s31", speaker: "최재천", kor: "앉아 있었던 시간만큼 수명은 확실하게 줄어든대요.", time: [141.48, 145.91], eng: "Your lifespan shortens exactly in proportion to the time you spent sitting, apparently." },
            { id: "s32", speaker: "이대호", kor: "저 일어나서 이야기 좀 하겠...", time: [145.95, 148.19], eng: "Let me stand up and talk for a bit…" },
            { id: "s33", speaker: "최재천", kor: "그래서 저는 어느 책에 제가 그렇게도 썼어요.", time: [148.24, 151.33], eng: "So I actually wrote this in one of my books." },
            { id: "s34", speaker: "최재천", kor: "\"수명을 줄이면서 쓴 책이다.\"", time: [151.37, 153.89], eng: "\"This is a book written while shortening my lifespan.\"" },
            { id: "s35", speaker: "최재천", kor: "제가 앉아서 썼으니까.", time: [153.93, 157.71], eng: "Because I wrote it sitting down." },
            { id: "s36", speaker: "최재천", kor: "그렇게 앉아서 책 읽는데 기껏 읽는 게 그런 책 읽냐?", time: [157.75, 163.47], eng: "So if you're going to sit down and read anyway, why read only that kind of book?" },
            { id: "s37", speaker: "최재천", kor: "그래서 제가 그걸 그러지 말자.", time: [163.51, 165.14], eng: "So I thought, let's not do that." },
            { id: "s38", speaker: "최재천", kor: "뭐 어차피 수명 줄어들면서 하는 일이면 제대로 된 독서하자.", time: [165.19, 171.33], eng: "If it's shortening our lifespan either way, let's do real reading." },
            { id: "s39", speaker: "최재천", kor: "그래서 그냥 좀 질러댄 거죠.", time: [171.38, 173.68], eng: "So I just decided to say it outright." },
            { id: "s40", speaker: "이대호", kor: "정말로 그 시간 아까운 짓을 해서는 안 된다.", time: [173.73, 177.6], eng: "We really shouldn't waste that time." },
            { id: "s41", speaker: "이대호", kor: "정말로 그 지식을 쌓는 수단으로 활용을 해야 된다.", time: [177.65, 181.6], eng: "We really need to use it as a means of building knowledge." }
        ] },
            { title: 'Part 3 · 책을 제대로 읽으려면 이렇게 해야 합니다', subTitle: '최성운 (진행자) · 최나야 (아동가족학과 교수)', videoId: 'DFO4S14aTs4', clip: [436, 883], script: [
            { id: "s1", speaker: "최성운", kor: "그러면 우리가 누군가에게는 그 어려운 독서라는 과정을 좀 더 쉽게 다가갈 수 있는 방식도 있을까요?", time: [436.3, 443.5], eng: "So is there perhaps an easier way for some people to approach the difficult process of reading?" },
            { id: "s2", speaker: "최나야", kor: "그러니까 저는 어린이들에 대해서 이야기를 할 때는 어려운 책, 두꺼운 책 찾으려고 하지 말라고 해요.", time: [443.53, 451.5], eng: "Well, when I talk about children, I tell people not to go looking for difficult, thick books." },
            { id: "s3", speaker: "최나야", kor: "그리고 이 어린이가 당시에 갖고 있는 흥미나 어떤 주제를 반영해서", time: [451.53, 457.3], eng: "And reflecting whatever interest or topic the child has at that moment," },
            { id: "s4", speaker: "최나야", kor: "\"무조건 재미있는 책으로 한 권 골라라\" 이렇게 이야기를 하거든요.", time: [457.34, 462.02], eng: "I tell them: 'Just pick one book that's fun, no matter what.'" },
            { id: "s5", speaker: "최나야", kor: "특히 아직 경험이 없는 어린 친구들의 경우에", time: [462.05, 464.69], eng: "Especially for young kids who don't have much experience yet," },
            { id: "s6", speaker: "최나야", kor: "\"독서가 할 만하네\", \"심지어 좀 재미있네?\" 이런 생각을 하게 돼요.", time: [464.72, 470.09], eng: "that's when they start thinking, 'Reading is actually doable,' or even 'Hey, this is kind of fun.'" },
            { id: "s7", speaker: "최나야", kor: "왜, 저도 어릴 때 그랬는데요.", time: [470.13, 472.19], eng: "Because — I was the same way as a kid." },
            { id: "s8", speaker: "최나야", kor: "어떤 책은 그 처음 경험을 하게 해주거든요.", time: [472.23, 475.74], eng: "Certain books give you that very first experience." },
            { id: "s9", speaker: "최나야", kor: "엄마가 밥 먹으라고 불러도 \"나 이거 끝까지 읽고 가고 싶어\"라는 거.", time: [475.78, 478.72], eng: "Like when your mom calls you to eat, and you say, 'I want to finish reading this first.'" },
            { id: "s10", speaker: "최성운", kor: "맞아요.", time: [478.75, 479.53], eng: "Right." },
            { id: "s11", speaker: "최나야", kor: "\"이거 나 다 끝까지 읽고 잠들고 싶어\" 같은 그런 느낌.", time: [479.56, 482.23], eng: "That feeling of 'I want to finish this and then go to sleep.'" },
            { id: "s12", speaker: "최나야", kor: "그 부분을 요새 아이들이 잘 못 가져요.", time: [482.26, 485.48], eng: "Kids these days don't really get to have that." },
            { id: "s13", speaker: "최나야", kor: "그러니까 내 인생의 책이 안 나타나는 거예요. 처음에.", time: [485.51, 488.17], eng: "So the book of your life never shows up. Not at first, anyway." },
            { id: "s14", speaker: "최나야", kor: "그런데 그런 경험을 어릴 때 풍부하게 해봐야", time: [488.2, 490.99], eng: "But if you get to have that experience richly as a child," },
            { id: "s15", speaker: "최나야", kor: "나중에 정말 할 일이 많고 시간이 없고 정보를 사실 빨리빨리 접할 수 있고 하는 상황에도", time: [491.03, 497.47], eng: "later on — even when you're busy and have no time and can access information instantly —" },
            { id: "s16", speaker: "최나야", kor: "책을 찾을 수 있는 사람이 돼요.", time: [497.51, 499.46], eng: "you become someone who's still able to seek out books." },
            { id: "s17", speaker: "최나야", kor: "그러니까 우리가 요새 너무 말하자면, 학습 독서만 하고요.", time: [499.49, 502.39], eng: "These days we tend to only do 'study reading,' as it were." },
            { id: "s18", speaker: "최나야", kor: "또는 자기계발서 같은 걸로 조금이라도 내 승진이라든지 업무라든지 도움되고", time: [502.42, 507.58], eng: "Or we only try to read self-help type books that might help even a little with a promotion or with work," },
            { id: "s19", speaker: "최나야", kor: "\"내가 좀 막 이런 거 읽었어\"라고 할 수 있는 그런 책만 읽으려고 하고,", time: [507.62, 511.41], eng: "books you can say 'I've read something like this' about, and we only try to read those," },
            { id: "s20", speaker: "최나야", kor: "반대로 여가 독서를 하지 않아요.", time: [511.44, 513.5], eng: "and on the other hand, we don't do leisure reading." },
            { id: "s21", speaker: "최나야", kor: "내가 정말 쉬고 싶을 때, 놀고 싶을 때, 그럴 때,", time: [513.53, 516.68], eng: "When you really want to rest or play, at those times," },
            { id: "s22", speaker: "최나야", kor: "\"이 책 나 읽고 싶은데?\"라고 해서 선택해서 펼치게 되는 그 부분이 지금 빠져 있거든요.", time: [516.72, 521.43], eng: "the part where you think 'I want to read this book,' choose it, and open it up — that part is missing right now." },
            { id: "s23", speaker: "최나야", kor: "이 여가 독서를 할 수 있게 되려면,", time: [521.47, 523.59], eng: "To be able to do leisure reading," },
            { id: "s24", speaker: "최나야", kor: "\"어떤 책을 읽었을 때 나는 좋더라\" 이 경험이 있어야 됩니다.", time: [523.63, 527.04], eng: "you need the experience of 'when I read this book, I genuinely liked it.'" },
            { id: "s25", speaker: "최나야", kor: "어린이나 어른이나 남들 눈치 보지 말고,", time: [527.07, 529.82], eng: "Kids and adults alike shouldn't worry about what others think, and should think:" },
            { id: "s26", speaker: "최나야", kor: "\"아 요 책만큼은 내가 좀 읽을 수 있겠는데?\",", time: [529.85, 531.77], eng: "'Oh, this book I could actually read,'" },
            { id: "s27", speaker: "최나야", kor: "\"심지어 나 이거 알아보고 싶은데?\",", time: [531.8, 533.39], eng: "'I actually want to find out about this,'" },
            { id: "s28", speaker: "최나야", kor: "\"이 사람의 문체 보고 좀 마음 좀 놓고 싶은데?\"", time: [533.42, 535.87], eng: "or 'I want to feel at ease reading this person's writing style.'" },
            { id: "s29", speaker: "최나야", kor: "이런 경험을 할 수 있는 독서, 그쪽을 시작해야 합니다.", time: [535.91, 539.19], eng: "That's the kind of reading — reading that can give you that experience — that we need to start with." },
            { id: "s30", speaker: "최성운", kor: "말씀하신 그 첫 번째 매혹의 순간, 첫 번째 어떤 몰입 그 경험이 진짜 기억이 났어요.", time: [539.22, 545.32], eng: "What you just said really brought back that first moment of fascination, that first sense of being absorbed." },
            { id: "s31", speaker: "최성운", kor: "분명히 당연히 그거는 유익하다기보다는 그냥 재밌는 소설이었고,", time: [545.36, 548.9], eng: "It clearly wasn't so much beneficial as it was just a fun novel," },
            { id: "s32", speaker: "최성운", kor: "영양가 뭐 학습 이런 거엔 도움이 없었지만,", time: [548.94, 551.06], eng: "it didn't help with any 'nutritious' stuff like studying, but" },
            { id: "s33", speaker: "최성운", kor: "제가 \"책이라는 것을 그래도 재밌는 것이구나\"라고 인식하는 데는 도움을 줬던 것 같고.", time: [551.09, 554.98], eng: "I think it helped me realize, 'oh, books are actually fun.'" },
            { id: "s34", speaker: "최성운", kor: "예전에 어딘가에서 정세랑 작가님 그 소설가님이랑 인터뷰를 한 적이 있는데,", time: [555.02, 559.53], eng: "I once did an interview somewhere with the novelist Jeong Se-rang," },
            { id: "s35", speaker: "최성운", kor: "그분께서는 '쾌락독서'라는 그 단어를 사용하시더라고요.", time: [559.57, 562.43], eng: "and she used the term 'pleasure reading.'" },
            { id: "s36", speaker: "최성운", kor: "본인도 '쾌락독서주의자'라고.", time: [562.46, 564.62], eng: "She called herself a 'pleasure-reading-ist.'" },
            { id: "s37", speaker: "최나야", kor: "강력하게 옵니다. 느낌이.", time: [564.66, 567.03], eng: "That hits hard. That feeling." },
            { id: "s38", speaker: "최성운", kor: "책을 일단 그냥 많이 읽으면 그대로 좋을까요?", time: [567.06, 570.75], eng: "If you just read a lot of books, is that automatically good?" },
            { id: "s39", speaker: "최나야", kor: "요즘 세상에 사실 그렇게 많이 읽기 어렵습니다.", time: [570.78, 573.19], eng: "Honestly, in today's world it's hard to read that much." },
            { id: "s40", speaker: "최나야", kor: "우리 참 바쁘구요, 세상에 책도 너무 많아요.", time: [573.19, 576.32], eng: "We're really busy, and there are just too many books in the world." },
            { id: "s41", speaker: "최나야", kor: "그래서 내가 재미있는 책, 나에게 도움이 되는 책 중심으로 골라서 읽되,", time: [576.35, 581.34], eng: "So I choose to read books centered on ones that are fun for me and helpful to me, but" },
            { id: "s42", speaker: "최나야", kor: "저는 책에 있는 문장을 그냥 읽는 것 자체보다는", time: [581.37, 585.43], eng: "I think, rather than just reading the sentences in the book themselves," },
            { id: "s43", speaker: "최나야", kor: "멈춰서 읽은 것에 대해서 생각하는 시간이 훨씬 더 중요하다고 생각을 합니다.", time: [585.46, 590.29], eng: "the time spent stopping and thinking about what you read matters far more." },
            { id: "s44", speaker: "최나야", kor: "연구결과들도 그걸 뒷받침해요.", time: [590.33, 592.19], eng: "Research backs that up too." },
            { id: "s45", speaker: "최나야", kor: "그래서 결국 좋은 독서란 문장을 읽는 것이 아닌 그걸 뛰어넘어서 문장을 읽고 멈추어서 생각하는 것.", time: [592.23, 599.5], eng: "So ultimately, good reading isn't just reading sentences — it goes beyond that, to reading a sentence, stopping, and thinking." },
            { id: "s46", speaker: "최나야", kor: "이제 그 부분을 우리가 요새 잘 못하죠.", time: [599.54, 602.97], eng: "These days we're really bad at that part." },
            { id: "s47", speaker: "최나야", kor: "왜냐하면, 빨리빨리 읽고 무슨 내용인지 내가 읽었다고 남들한테 막 자랑하고 싶고,", time: [603.0, 607.71], eng: "Because we want to read quickly, brag to others about what we read," },
            { id: "s48", speaker: "최나야", kor: "다음 책으로 넘어가고 싶어요.", time: [607.75, 609.32], eng: "and move on to the next book." },
            { id: "s49", speaker: "최나야", kor: "그러다 보면 생각할 시간이 없는 거죠.", time: [609.36, 610.94], eng: "When you do that, there's no time to think." },
            { id: "s50", speaker: "최나야", kor: "하지만 그러면 너무 큰 거를 놓치는 거고요.", time: [610.97, 613.95], eng: "But that way, you miss out on something huge." },
            { id: "s51", speaker: "최나야", kor: "진짜 너무 아까운 행위가 되는 거거든요.", time: [613.98, 617.35], eng: "It truly becomes a wasted act." },
            { id: "s52", speaker: "최나야", kor: "독서에 있어서 양이냐 질이냐?", time: [617.39, 620.64], eng: "Is reading about quantity or quality?" },
            { id: "s53", speaker: "최나야", kor: "저는 절대적으로 질이라고 생각을 합니다.", time: [620.68, 623.13], eng: "I think it's absolutely quality." },
            { id: "s54", speaker: "최나야", kor: "특히나 이렇게 바쁜 세상에서는.", time: [623.17, 624.82], eng: "Especially in a world this busy." },
            { id: "s55", speaker: "최나야", kor: "그리고 문해력 또 책을 그냥 읽을 때 길러지는 게 아니라 책과 씨름할 때 길러지거든요.", time: [624.86, 631.72], eng: "And literacy isn't built just by reading a book — it's built by wrestling with the book." },
            { id: "s56", speaker: "최나야", kor: "그러려면 우리는 무조건 많이 읽기보다는", time: [631.75, 634.5], eng: "To do that, instead of just reading as much as possible," },
            { id: "s57", speaker: "최나야", kor: "상대를 잘 골라서 어떤 씨름을 할 것인가,", time: [634.53, 637.48], eng: "we need to choose our opponent well and decide what kind of wrestling match to have," },
            { id: "s58", speaker: "최나야", kor: "즉 내가 어떤 생각을 할 것인가에 더 초점을 두어야 합니다.", time: [637.52, 641.61], eng: "meaning we need to focus more on what we're going to think about." },
            { id: "s59", speaker: "최성운", kor: "소위 ‘텍스트 힙’이라는 단어로 부르는 사람들도 있습니다만,", time: [641.65, 645.05], eng: "There's a mood some people call 'text-hip,'" },
            { id: "s60", speaker: "최성운", kor: "\"다시 이 책을 읽어야 되지 않을까? 우리가?\"", time: [645.05, 647.17], eng: "saying things like, 'shouldn't we start reading again?'" },
            { id: "s61", speaker: "최성운", kor: "\"책을 읽는 게 조금 더 멋지고 좋은 일이 아닐까\"라는 분위기가 또 젊은 분들 사이에서 좀 일어나고 있는 것 같아요.", time: [647.21, 653.67], eng: "or 'isn't reading kind of cool and good?' — that mood seems to be rising among young people." },
            { id: "s62", speaker: "최성운", kor: "이것은 그래도 없는 것보다는 반가운 현상이겠으나", time: [653.7, 656.54], eng: "That's a welcome phenomenon compared to nothing at all, but" },
            { id: "s63", speaker: "최성운", kor: "근데 꼭 그것이 또 문해력 상승과 직접적으로 결부되는 건 아닐 수도 있을 것 같아서", time: [656.58, 661.58], eng: "I'm not sure it's directly tied to a rise in literacy, so" },
            { id: "s64", speaker: "최성운", kor: "교수님 입장에서는 요즘에 이런 분위기에 대해서는 어떻게 생각하시는지 궁금합니다.", time: [661.61, 664.84], eng: "I'm curious how you, as a professor, feel about this mood these days." },
            { id: "s65", speaker: "최나야", kor: "책을 읽지 않는 거에 비해서는 정말 반가운 유행이에요.", time: [664.88, 668.79], eng: "Compared to not reading at all, it's a genuinely welcome trend." },
            { id: "s66", speaker: "최나야", kor: "특히 이것은 혼자만 그냥 읽는다가 아니라 어떤 관계를 가지고 있는 거기 때문에", time: [668.82, 674.36], eng: "Especially since it isn't just reading alone — it involves some kind of relationship," },
            { id: "s67", speaker: "최나야", kor: "어떤 사회적으로도 더 좋은 흐름이 될 수 있거든요.", time: [674.39, 677.38], eng: "so it can lead to a better flow socially too." },
            { id: "s68", speaker: "최나야", kor: "또 그러다 보니 서로 주고받는 게 생겨서 사실 문해력에도 도움이 됩니다.", time: [677.41, 682.1], eng: "And because of that, an exchange happens between people, which does actually help literacy." },
            { id: "s69", speaker: "최나야", kor: "그런데 \"왜 그 진짜로 그렇게 문해력 높아지는 것은 빨리 보이지 않느냐?\"", time: [682.14, 687.22], eng: "But you're asking, 'why doesn't that rise in literacy show up quickly?'" },
            { id: "s70", speaker: "최나야", kor: "이런 질문을 하신 것 같은데,", time: [687.25, 689.48], eng: "I think that's the question you're asking, but" },
            { id: "s71", speaker: "최나야", kor: "사실은 뭐 문해력이 좋아지려면 시간이 많이 듭니다.", time: [689.51, 693.12], eng: "honestly, it takes a lot of time for literacy to improve." },
            { id: "s72", speaker: "최나야", kor: "그게 일단 하나의 이유일 거고.", time: [693.15, 694.56], eng: "That's one reason." },
            { id: "s73", speaker: "최나야", kor: "또 하나 제가 약간 우려하는 측면은 이게 진정 독서를 깊이 있게 하는 그 행위보다는", time: [694.6, 702.5], eng: "Another thing I'm a bit concerned about is that this can lean more toward," },
            { id: "s74", speaker: "최나야", kor: "\"나 이런 책도 읽는 사람이야\"라는 어떤 과시나 증명 이런 쪽으로 좀 치우치는 면도 있기 때문이에요.", time: [702.53, 710.57], eng: "showing off or proving 'I read books like this too,' rather than truly engaging with reading in depth." },
            { id: "s75", speaker: "최나야", kor: "그렇게 되면 제가 아까 강조했던 책을 읽고 멈추어서 생각하는 시간은 늘지 않거든요.", time: [710.6, 716.39], eng: "If that happens, the time I emphasized earlier — reading, then stopping to think — doesn't increase." },
            { id: "s76", speaker: "최나야", kor: "그런데 문해력은 바로 그때 느는 거고.", time: [716.42, 718.8], eng: "But that's exactly when literacy grows." },
            { id: "s77", speaker: "최나야", kor: "그래서 이제 아주 바람직한 현상이지만,", time: [718.84, 721.6], eng: "So it's a very desirable phenomenon, but" },
            { id: "s78", speaker: "최나야", kor: "이게 나 자신의 정체성을 보여주는 수단이나 과시에만 머물지 않고,", time: [721.63, 726.92], eng: "it shouldn't stop at being just a means of showing your identity or showing off," },
            { id: "s79", speaker: "최나야", kor: "나와 정말 잘 통할 수 있는 사람들과 그 책을 중심으로 해서 깊이 있는 이야기를 나눔으로써", time: [726.95, 732.74], eng: "and instead, by having deep conversations centered on that book with people you truly connect with," },
            { id: "s80", speaker: "최나야", kor: "진짜 독서가 완성될 수 있게 문해력이 좋아질 수 있게 그렇게 되는 흐름이라면", time: [732.77, 738.66], eng: "if it flows in a way where real reading is completed and literacy actually improves," },
            { id: "s81", speaker: "최나야", kor: "아주 기쁘게 응원할 수 있을 것 같습니다.", time: [738.69, 741.33], eng: "then I'd be very happy to cheer it on." },
            { id: "s82", speaker: "최성운", kor: "그런데 어쨌든 이 트렌드 자체가 혼자 읽기 위해서 그걸 하는 게 아니라", time: [741.36, 745.03], eng: "Still, the fact that this trend itself isn't done just to read alone," },
            { id: "s83", speaker: "최성운", kor: "어쨌든 사회적인 용도에서 그걸 읽는다는 것도", time: [745.06, 748.05], eng: "but has some social use to it," },
            { id: "s84", speaker: "최성운", kor: "그것이 더 깊은 감상을 나누는 데로 이어질 수 있는 최소한 그 단초가 있다는 점에서는 분명히 긍정적인 측면이고", time: [748.08, 755.62], eng: "is definitely a positive in the sense that it at least has the seed that could lead to sharing deeper appreciation," },
            { id: "s85", speaker: "최성운", kor: "그렇게 잘 활용을 하면 좋겠네요.", time: [755.65, 757.03], eng: "and I hope it gets used well like that." },
            { id: "s86", speaker: "최나야", kor: "그럼요, 자기 말로 바꿔볼 수 있는 아주 좋은 기회가 되는 거죠.", time: [757.06, 761.0], eng: "Exactly, it's a great chance to put it into your own words." },
            { id: "s87", speaker: "최성운", kor: "우리가 어떻게 하면 나에게 좀 적합한 아니면 나에게 조금 더 이렇게 나를 고양시킬 좋게 만들어줄 그 독서 선정은 좀 어떻게 하면 좋을까요?", time: [761.04, 770.65], eng: "So how should we go about selecting reading that's a good fit for us, or that could elevate us even further?" },
            { id: "s88", speaker: "최나야", kor: "저는 연습을 좀 많이 해봐야 한다고 생각해요.", time: [770.68, 773.76], eng: "I think you have to practice a lot." },
            { id: "s89", speaker: "최나야", kor: "처음에는 실패할 확률도 높습니다.", time: [773.79, 776.14], eng: "At first the chance of failing is high." },
            { id: "s90", speaker: "최나야", kor: "근데 실패하면 어때요?", time: [776.17, 777.25], eng: "But so what if you fail?" },
            { id: "s91", speaker: "최나야", kor: "다음 책 잘 고르면 되니까", time: [777.29, 779.45], eng: "You just pick the next book well, so" },
            { id: "s92", speaker: "최나야", kor: "시행착오가 좀 필요할 수도 있습니다.", time: [779.48, 781.23], eng: "some trial and error may be needed." },
            { id: "s93", speaker: "최나야", kor: "그래서 일단은 여러 책을 좀 열어서 어느 정도 보세요.", time: [781.26, 786.41], eng: "So first, open up several books and take a look at some." },
            { id: "s94", speaker: "최나야", kor: "그러다 보면 더 읽고 싶은 책이 있을 거고,", time: [786.44, 788.0], eng: "Then you'll find some you want to keep reading," },
            { id: "s95", speaker: "최나야", kor: "\"아, 이거는 별로 만족스럽지 않은데\"하는 책도 있을 거예요.", time: [788.03, 792.03], eng: "and some where you think, 'hm, this isn't really satisfying.'" },
            { id: "s96", speaker: "최나야", kor: "그렇게 부정적인 반응이 든다고 해서 전혀 잘못된 게 아닙니다.", time: [792.06, 796.1], eng: "Having that negative reaction isn't wrong at all —" },
            { id: "s97", speaker: "최나야", kor: "나와 잘 맞지 않고 지금 나에게 도움이 덜 되는 책일 수 있거든요.", time: [796.13, 800.72], eng: "it might just be a book that doesn't suit you or isn't helpful to you right now." },
            { id: "s98", speaker: "최나야", kor: "그럴 때는 사실 꼭 끝까지 읽으려고 애쓰지 않아도 괜찮아요.", time: [800.76, 804.44], eng: "In that case, you really don't have to force yourself to finish it." },
            { id: "s99", speaker: "최나야", kor: "왜냐하면, 더 좋은 책이 나하고 지금 만나려고 기다리고 있을 수 있는데,", time: [804.47, 808.35], eng: "Because a better book might be out there waiting to meet you," },
            { id: "s100", speaker: "최나야", kor: "그거를 꾸역꾸역 끝까지 읽다가 독서가 싫어질 수 있잖아요.", time: [808.38, 812.1], eng: "and forcing yourself through the other one might make you start to dislike reading." },
            { id: "s101", speaker: "최성운", kor: "그렇죠, 세상에 책은 너무 많으니까요.", time: [812.13, 813.4], eng: "Right, because there are just so many books in the world." },
            { id: "s102", speaker: "최나야", kor: "맞아요.", time: [813.43, 814.11], eng: "That's right." },
            { id: "s103", speaker: "최성운", kor: "나랑 더 잘 맞는 책도 어딘가에 분명히 있겠죠.", time: [814.15, 816.7], eng: "There's definitely a book out there somewhere that fits me better." },
            { id: "s104", speaker: "최나야", kor: "그래서 도서관이나 서점 나들이가 그런 점에서 참 좋아요.", time: [816.73, 819.78], eng: "That's why visiting a library or bookstore is so nice for that." },
            { id: "s105", speaker: "최나야", kor: "거기에서 일단 \"이 책이 나하고 맞을까? 아닐까?\" 좀 이렇게 볼 수 있는 그런 시간이 될 거고요.", time: [819.82, 826.1], eng: "It gives you time to check there, 'does this book fit me or not?'" },

            { id: "s108", speaker: "최나야", kor: "아주 제가 아주 불만이 많습니다.", time: [832.13, 834.11], eng: "I actually have a lot of complaints about that." },

            { id: "s111", speaker: "최성운", kor: "솔직히 거기 책들은 진짜 어려운 책이죠.", time: [840.7, 843.63], eng: "Honestly, those are genuinely difficult books." },
            { id: "s112", speaker: "최나야", kor: "저희도 뭐 19살 때 20살 때 읽으라고 그런 거 있었는데요.", time: [843.66, 847.83], eng: "We had the same thing — told to read them at 19 or 20." },
            { id: "s113", speaker: "최나야", kor: "제가 한 마흔 되니까 그게 이해가 되더라고요.", time: [847.86, 850.83], eng: "Once I turned about forty, it started to make sense." },
            { id: "s114", speaker: "최나야", kor: "그러니까 너무 앞서 보거나 너무 어려운 책인데", time: [850.86, 854.02], eng: "So diving into a book that's too advanced or too difficult, just because" },
            { id: "s115", speaker: "최나야", kor: "\"뭐 고전이라고\", 또는 \"누가 추천했다고\", \"너무너무 대단한 책이라고\" 무조건 도전하는 것은 그렇게 좋지 않을 수 있습니다.", time: [854.05, 861.25], eng: "'it's a classic,' or 'someone recommended it,' or 'it's supposedly an amazing book' — that might not be such a good idea." },
            { id: "s116", speaker: "최나야", kor: "그리고 사람마다 취향이 다 달라요.", time: [861.29, 863.11], eng: "And everyone's taste is different." },
            { id: "s117", speaker: "최나야", kor: "자기 취향에 맞아야 되는 거지, 엄청 저명한 분이 추천했다고 해서 다 좋은 건 아니거든요.", time: [863.14, 868.12], eng: "It has to fit your own taste — it's not automatically good just because some hugely renowned person recommended it." },
            { id: "s118", speaker: "최나야", kor: "오히려 나를 잘 아는 사람, 내 주변에 있는 누군가가", time: [868.15, 871.11], eng: "It's better to be drawn in by someone who actually knows you, someone close to you," },

            { id: "s120", speaker: "최나야", kor: "이렇게 하는 거에는 좀 솔깃해도 될 것 같아요.", time: [874.49, 877.12], eng: "it's fine to be drawn in by that kind of thing." },
            { id: "s121", speaker: "최나야", kor: "그럴 때 좋으면 진짜 아주 귀중한 경험이 될 거예요.", time: [877.15, 881.05], eng: "If it turns out to be good, that becomes a truly precious experience." },
