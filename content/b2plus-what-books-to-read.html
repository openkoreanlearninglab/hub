        const VOCAB_DATA = [
            { term: "힐링소설", mainDef: "힐링소설은 마음을 편하게 해 주는 이야기를 담은, 요즘 한국에서 인기가 많은 소설 종류이다.", subDefs: [{ subTerm: "• 힐링", subDef: "healing, 몸과 마음을 편안하게 함" }], contextDef: "해죽이가 영상을 시작하며 \"오늘은 K-힐링소설 얘기입니다\"라고 말할 때 언급한 바로 그 장르를 가리킨다.", variants: ["힐링소설", "힐링 소설", "K-힐링소설"], examples: [{ kor: "요즘 서점에는 힐링소설 코너가 따로 있을 정도로 인기가 많아요.", eng: "Healing novels are so popular these days that bookstores even have a dedicated section for them." }], translations: { en: { term: "a 'healing novel'", mainDef: "a currently popular genre of Korean fiction whose content is meant to comfort and soothe the reader's heart.", subDefs: [{ term: "힐링 (healing)", def: "a loanword meaning to make the body and mind feel at ease." }], contextDef: "This is the very genre Haejuki refers to when he opens the video by saying, \"Today's topic is K-healing novels.\"" } } },
            { term: "대표되다", mainDef: "어떤 것이 다른 것으로 대표되면, 그 다른 것은 원래 것을 가장 잘 보여주는 예로 널리 알려져 있다는 뜻이다.", hanja: "대(代 대신하다) + 표(表 나타내다)", contextDef: "이 문장에서는 <달러구트 꿈 백화점>과 <불편한 편의점>이라는 두 작품이 한국식 힐링소설을 가장 잘 보여주는 예로 언급되고 있다.", variants: ["대표되는", "대표하다"], examples: [{ kor: "이 카페는 우리 동네를 대표되는 장소예요.", eng: "This café is a place that represents our neighborhood." }], translations: { en: { term: "to be represented by", mainDef: "to be widely known as the example that best shows a certain quality.", contextDef: "Here, the two novels <Dallergut Dream Department Store> and <The Uncomfortable Convenience Store> are cited as the works that best exemplify the Korean healing-novel genre." } } },
            { term: "이름을 붙이다", mainDef: "누군가가 어떤 것에 이름을 붙이면, 그것에 새로운 이름을 지어서 부른다는 뜻이다.", contextDef: "해죽이가 이 장르에 'K-힐링소설'이라는 이름을 직접 지어 붙였다고 말하는 장면이다.", variants: ["이름을 붙여봤는데요", "이름을 붙이다"], examples: [{ kor: "저는 제 강아지에게 '콩이'라는 이름을 붙였어요.", eng: "I gave my puppy the name 'Kong-i.'" }], translations: { en: { term: "to give (something) a name", mainDef: "to coin and use a particular name or label for something.", contextDef: "This is the moment Haejuki explains that he coined the term 'K-healing novel' himself for this genre." } } },
            { term: "반짝 인기", mainDef: "반짝 인기는 아주 짧은 시간 동안만 확 뜨거워졌다가 금방 식어 버리는 인기이다.", subDefs: [{ subTerm: "• 반짝", subDef: "잠깐 빛나다" }], contextDef: "해죽이는 힐링소설이 처음에는 '반짝 인기'로 그칠 줄 알았지만, 예상과 달리 꾸준히 팔리는 스테디셀러가 됐다고 말한다.", variants: ["반짝 인기"], examples: [{ kor: "그 아이돌 그룹은 반짝 인기로 끝나지 않고 계속 사랑받고 있어요.", eng: "That idol group didn't end as a flash-in-the-pan and keeps being loved." }], translations: { en: { term: "flash-in-the-pan popularity", mainDef: "popularity that suddenly flares up but only lasts a short time.", subDefs: [{ term: "반짝 (banjjak)", def: "to flash or shine briefly." }], contextDef: "Haejuki says he initially expected healing novels to be just a flash-in-the-pan trend, but they unexpectedly became steady bestsellers instead." } } },
            { term: "스테디셀러", mainDef: "스테디셀러는 오랫동안 계속 잘 팔리는 물건이나 책이다. (외래어)", contextDef: "바로 앞에서 언급된 '반짝 인기'와 대조되는 개념으로, 힐링소설이 실제로는 오래 꾸준히 팔리고 있다는 뜻으로 쓰였다.", variants: ["스테디셀러"], examples: [{ kor: "그 소설은 10년 넘게 팔리는 스테디셀러예요.", eng: "That novel is a steady-seller that has sold for over ten years." }], translations: { en: { term: "a steady-seller", mainDef: "a book or product that keeps selling well consistently over a long time (loanword).", contextDef: "Used here in contrast with the 'flash-in-the-pan' idea just mentioned, to say that healing novels have in fact kept selling steadily over time." } } },
            { term: "현명하다", mainDef: "누군가가 현명하면, 그 사람은 무엇이 옳은지 잘 알고 좋은 선택을 한다는 뜻이다.", hanja: "현(賢 어질다) + 명(明 밝다)", contextDef: "힐링소설이 독자에게 '현명한 지혜'를 찾아준다고 말하는 대목에서 쓰였다.", variants: ["현명한", "현명하다"], examples: [{ kor: "그는 어려운 상황에서도 항상 현명한 선택을 해요.", eng: "He always makes wise choices even in difficult situations." }], translations: { en: { term: "to be wise", mainDef: "to be intelligent and sound in judgment, able to assess situations and act rightly.", contextDef: "Used here to describe how healing novels are said to offer readers 'wise insight.'" } } },
            { term: "해 나가다", mainDef: "누군가가 어떤 일을 해 나가면, 그 일을 시작해서 멈추지 않고 계속한다는 뜻이다.", contextDef: "힐링소설이 독자에게 '무언가를 계속 해 나갈 용기'를 준다고 설명하는 부분에 쓰였다.", variants: ["해 나갈", "해 나가다"], examples: [{ kor: "저는 이 프로젝트를 끝까지 해 나갈 자신이 있어요.", eng: "I'm confident I can carry this project through to the end." }], translations: { en: { term: "to carry (something) forward", mainDef: "to start something and keep progressing with it going forward.", contextDef: "Used here to describe how healing novels give readers the courage to keep carrying something forward." } } },
            { term: "북돋우다", mainDef: "누군가가 다른 사람을 북돋우면, 그 사람이 힘이나 용기를 더 낼 수 있게 도와준다는 뜻이다.", contextDef: "힐링소설이 사랑이나 용기 같은 감정을 '북돋워주는' 내용을 담고 있다고 설명하는 부분이다.", variants: ["북돋워주는", "북돋우다"], examples: [{ kor: "선생님의 칭찬이 학생의 자신감을 북돋워 줬어요.", eng: "The teacher's praise boosted the student's confidence." }], translations: { en: { term: "to encourage / to boost", mainDef: "to help someone's strength, motivation, or courage grow bigger.", contextDef: "This is the part explaining that healing novels contain content that boosts feelings like love or courage." } } },
            { term: "고전", mainDef: "고전은 아주 오랫동안 많은 사람들에게 사랑받아 온 훌륭한 책이나 이야기이다.", hanja: "고(古 옛) + 전(典 책)", contextDef: "책 추천 콘텐츠에서 흔히 '고전을 읽으라'고 권할 때의 그 '고전'을 가리킨다.", variants: ["고전"], examples: [{ kor: "세계 문학 고전을 읽으면 생각하는 힘이 길러져요.", eng: "Reading world literary classics helps build your capacity to think." }], translations: { en: { term: "a classic (work of literature)", mainDef: "a celebrated literary work that has been loved by many people for a long time.", contextDef: "This refers to the same 'classics' that book-recommendation content commonly urges people to read." } } },
            { term: "성찰하다", mainDef: "누군가가 성찰하면, 자기 마음이나 행동을 다시 깊이 생각해 본다는 뜻이다.", hanja: "성(省 살피다) + 찰(察 살피다)", contextDef: "고전을 읽으면 인간에 대해 진지하게 '성찰해야' 할 것 같은 부담이 느껴진다고 말하는 부분이다.", variants: ["성찰하다", "성찰해야"], examples: [{ kor: "매일 저녁 하루를 성찰하는 시간을 가져요.", eng: "I take time every evening to reflect on my day." }], translations: { en: { term: "to reflect (on oneself)", mainDef: "to look deeply back on one's own mind or actions.", contextDef: "Used here to describe the pressure of feeling like you must seriously reflect on human nature when reading a classic." } } },
            { term: "부담되다", mainDef: "무언가가 부담되면, 그 일이 힘들게 느껴지고 마음이 무겁다는 뜻이다.", hanja: "부(負 지다) + 담(擔 메다)", contextDef: "고전을 읽어야 한다는 생각이 마음에 짐처럼 '부담되게' 느껴진다고 말하는 부분이다.", variants: ["부담되는", "부담감"], examples: [{ kor: "매일 운동하는 게 요즘 좀 부담돼요.", eng: "Exercising every day feels like a bit of a burden these days." }], translations: { en: { term: "to feel burdened", mainDef: "for something to feel like a weight on one's mind.", contextDef: "Used here to describe how the idea of having to read a classic feels like a burden." } } },
            { term: "몰입하다", mainDef: "누군가가 무언가에 몰입하면, 다른 생각이 안 들 만큼 그 일에 푹 빠진다는 뜻이다.", hanja: "몰(沒 빠지다) + 입(入 들다)", contextDef: "힐링소설은 부담 없이 가볍게 이야기에 '몰입할' 수 있다고 설명하는 부분이다.", variants: ["몰입", "몰입할", "몰입하다", "몰입이", "몰입을"], examples: [{ kor: "영화가 너무 재미있어서 완전히 몰입했어요.", eng: "The movie was so fun that I got completely absorbed in it." }], translations: { en: { term: "to become absorbed / immersed", mainDef: "to get so deeply into something that you can't think of anything else.", contextDef: "Used here to explain that healing novels let you become absorbed in the story easily, without pressure." } } },
            { term: "부담감을 내려놓다", mainDef: "누군가가 부담감을 내려놓으면, 마음이 무겁고 힘든 느낌을 스스로 없앤다는 뜻이다.", subDefs: [{ subTerm: "• 부담", subDef: "負擔, 짐처럼 느껴지는 마음의 무게" }], contextDef: "힐링소설을 읽을 때는 마음의 부담을 '내려놓고' 편하게 즐길 수 있다는 뜻으로 쓰였다.", variants: ["부담감을 내려놓고", "부담감을 내려놓다"], examples: [{ kor: "이제 시험이 끝났으니까 부담감을 내려놓고 좀 쉬세요.", eng: "The exam is over now, so let go of the pressure and get some rest." }], translations: { en: { term: "to set down/let go of the burden", mainDef: "to consciously release a feeling of mental pressure or weight, as if setting down a heavy load.", subDefs: [{ term: "부담 (budam)", def: "a mental weight that feels like a burden." }], contextDef: "Used here to say that with healing novels, readers can set aside their mental burden and enjoy the story comfortably." } } },
            { term: "속이 터지다", mainDef: "누군가는 속이 터지면, 너무 답답하거나 화가 나서 마음이 몹시 힘들다는 뜻이다.", contextDef: "현실은 답답해서 '속이 터지지만', 소설 속에서는 좋은 사람만 만나고 싶다는 독자의 심정을 표현한 말이다.", variants: ["속 터지고"], examples: [{ kor: "버스가 계속 안 와서 속이 터질 것 같았어요.", eng: "The bus wouldn't come, and I felt like I was about to burst with frustration." }], translations: { en: { term: "to feel one's chest tighten with frustration", mainDef: "an idiom meaning to feel so frustrated or angry that it's painful.", contextDef: "Used here to voice the reader's feeling that real life is so frustrating it makes your chest want to burst, so at least in fiction they want to meet only good people." } } },
            { term: "나오다 보니까", mainDef: "이 표현은 어떤 일이 계속 일어나는 것을 겪다 보니 자연스럽게 어떤 결과가 생겼다고 말할 때 쓴다.", subDefs: [{ subTerm: "• -다 보니까", subDef: "어떤 행동이나 상태를 계속하다가 그 결과로 새로운 사실을 알게 되거나 어떤 결과가 생길 때 쓰는 표현" }], contextDef: "힐링소설에 워낙 다양한 인물이 등장하다 '보니까' 자연스럽게 생기는 결과를 설명하는 부분이다.", variants: ["나오다 보니까"], examples: [{ kor: "매일 이 카페에 오다 보니까 사장님이랑 친해졌어요.", eng: "As I kept coming to this café every day, I became close with the owner." }], translations: { en: { term: "as (various people) keep appearing", mainDef: "as a situation keeps repeating, a certain result naturally follows.", subDefs: [{ term: "-da bonikka", def: "used when a result occurs after continuing an action or state." }], contextDef: "Used here to explain a natural result of the fact that such a wide variety of characters appear in these novels." } } },
            { term: "한 명은 걸리다", mainDef: "이 표현은 여러 사람이나 것들 중에서 어떤 조건에 맞는 것이 적어도 하나는 나오게 되어 있다고 말할 때 쓴다.", contextDef: "다양한 인물들 중에 나와 같은 고민을 가진 사람이 적어도 한 명은 반드시 나온다는 뜻으로 쓰였다.", variants: ["한 명은 걸리게", "한 명은 걸리다"], examples: [{ kor: "사람이 이렇게 많으니까 나랑 취향이 비슷한 사람 한 명은 걸리겠죠.", eng: "With this many people around, there's bound to be at least one whose taste matches mine." }], translations: { en: { term: "there's bound to be at least one (who fits)", mainDef: "an idiom meaning that among many people or things, at least one matching a certain condition is bound to naturally turn up.", contextDef: "Used here to say that among the many characters, at least one is bound to share the same worries as the reader." } } },
            { term: "공감받다", mainDef: "누군가가 공감받으면, 다른 사람도 자기와 같은 마음이라는 것을 느낀다는 뜻이다.", hanja: "공(共 함께) + 감(感 느끼다)", contextDef: "등장인물의 사연을 보면서 독자가 '공감받는' 느낌을 받는다고 설명하는 부분이다.", variants: ["공감받는", "공감을 하는"], examples: [{ kor: "제 고민을 이야기했더니 친구한테 공감받아서 마음이 편해졌어요.", eng: "I talked about my worries and felt so much better because my friend understood me." }], translations: { en: { term: "to feel understood / to receive empathy", mainDef: "to sense that someone else shares the same feeling or thought as you.", contextDef: "Used here to describe the feeling readers get of being understood when they see these characters' stories." } } },
            { term: "감동하다", mainDef: "누군가가 감동하면, 마음이 깊이 움직여서 뭉클해진다는 뜻이다.", hanja: "감(感 느끼다) + 동(動 움직이다)", contextDef: "힐링소설을 읽고 '감동했다'고 말하는 독자들의 반응을 가리킨다.", variants: ["감동했다"], examples: [{ kor: "그 영화의 마지막 장면을 보고 정말 감동했어요.", eng: "I was really moved watching the movie's final scene." }], translations: { en: { term: "to be moved / touched", mainDef: "for one's heart to be deeply stirred.", contextDef: "Refers to readers' reaction of saying they were 'moved' after reading a healing novel." } } },
            { term: "많은 것 같더라고요", mainDef: "이 표현은 자기가 직접 겪거나 본 것을 나중에 떠올리며 말할 때 쓴다.", subDefs: [{ subTerm: "• -더라고요", subDef: "자기가 직접 경험하거나 관찰한 사실을 나중에 다른 사람에게 말할 때 쓰는 표현" }], contextDef: "해죽이가 실제로 접한 독자 반응(“힐링 받았다”, “감동했다”)을 떠올리며, 자신이 직접 느낀 인상을 '많은 것 같더라고요'라고 전달하는 부분이다.", variants: ["많은 것 같더라고요"], examples: [{ kor: "어제 그 식당에 가 봤는데 사람이 진짜 많더라고요.", eng: "I went to that restaurant yesterday, and there really were a lot of people, I noticed." }], translations: { en: { term: "it seemed like there were a lot (I noticed)", mainDef: "used when reporting something you personally experienced or observed.", subDefs: [{ term: "-deorago-yo", def: "used to report something you personally witnessed." }], contextDef: "Used here as Haejuki recalls real reader reactions he's encountered (\"I felt healed,\" \"I was moved\") and conveys his own direct impression with the ending '-더라고요.'" } } },
            { term: "처음에 초밥으로 시작한 오마카세가 디저트 커피에 어디까지 나올지 모르겠다", mainDef: "이 말은 원래 초밥 가게에서만 쓰이던 '오마카세'라는 말이, 최근에는 한우·파스타·커피·디저트 등 온갖 음식에도 다 붙게 된 것을 가리킨다. 원래 뜻에서 너무 멀리 퍼져 나가서 이해가 잘 안 될 정도라는, 놀라움과 부정적인 느낌이 함께 담긴 표현이다.", subDefs: [{ subTerm: "• 오마카세", subDef: "일본어 'お任せ(맡기다)'에서 온 말로, 원래는 손님이 셰프에게 그날의 메뉴 구성을 전부 맡기는 초밥집 코스 요리를 가리켰지만, 최근 한국에서 한우·파스타·커피·디저트 등 다른 음식에도 폭넓게 붙는 말로 의미가 확장됨" }], contextDef: "이 현상에 빗대어, 힐링소설의 배경이 되는 상점의 종류가 편의점·서점을 넘어 세탁소·슈퍼 등 안 어울리는 곳까지 지나치게 확장되고 있다는 비판적인 의견을 나타낸다.", variants: ["처음에 초밥으로 시작한 오마카세가 디저트 커피에 어디까지 나올지 모르겠다"], examples: [{ kor: "처음엔 카페 이름만 걸던 게 요즘은 옷 가게, 식당까지 다 콜라보를 하는 걸 보면 어디까지 갈지 모르겠어요.", eng: "It started with just café names, but now clothing shops and restaurants are all doing collabs too — who knows where it'll stop." }], translations: { en: { term: "\"an omakase that started with sushi — who knows how far it'll go with dessert and coffee\"", mainDef: "Omakase (お任せ, a Japanese-style course meal where the customer leaves the full menu up to the chef) originally referred only to sushi restaurants, but in the past few years in Korea the word has spread to all kinds of food — Korean beef, pasta, coffee, dessert. This line carries a surprised, slightly critical tone about how far the term has drifted from its original meaning. Here, the speaker uses this trend as an analogy: the shops used as settings for healing novels have similarly expanded past convenience stores and bookstores into mismatched places like laundromats and supermarkets.", subDefs: [{ term: "omakase", def: "from Japanese 'お任せ' (to leave it up to someone); originally a sushi-restaurant course where the chef chooses everything, now broadly attached to Korean beef, pasta, coffee, dessert, etc." }], contextDef: "Used here by analogy with that phenomenon, to express the critical view that the settings of healing novels have overexpanded beyond convenience stores and bookshops into oddly mismatched places like laundromats and supermarkets." } } },
            { term: "심정", mainDef: "심정은 마음속에 있는 감정이나 생각의 상태이다.", hanja: "심(心 마음) + 정(情 감정)", contextDef: "다음에는 또 어떤 상점이 나올지 지켜보게 되는 해죽이 자신의 마음 상태를 가리킨다.", variants: ["심정"], examples: [{ kor: "합격 소식을 들었을 때 정말 뭐라 표현할 수 없는 심정이었어요.", eng: "When I heard I passed, I felt a mix of emotions I really can't describe." }], translations: { en: { term: "one's frame of mind / feelings", mainDef: "the state of emotion or thought held in one's heart.", contextDef: "Refers to Haejuki's own state of mind as he watches to see which shop will show up next." } } },
            { term: "진부하다", mainDef: "무언가가 진부하면, 너무 흔하고 오래돼서 새로운 느낌이 전혀 없다는 뜻이다.", contextDef: "힐링소설을 순수하게 소설로만 놓고 보면 '진부하게' 느껴질 때가 있다는 뜻으로 쓰였다.", variants: ["진부하게", "진부한"], examples: [{ kor: "그 드라마 줄거리는 너무 진부해서 다음 내용이 다 예상돼요.", eng: "That drama's plot is so clichéd that I can predict everything that happens next." }], translations: { en: { term: "to be clichéd / trite", mainDef: "to be so common and old that it feels completely unoriginal.", contextDef: "Used here to say that, judged purely as fiction, healing novels can sometimes feel clichéd." } } },
            { term: "취준생", mainDef: "취준생은 '취업을 준비하는 학생'을 줄여서 부르는 말이다. (신조어)", hanja: "취(就 나아가다) + 준(準 준비하다) + 생(生 학생)", contextDef: "힐링소설에 자주 등장하는 인물 유형으로 '취준생'이 언급되는 부분이다.", variants: ["취준생"], examples: [{ kor: "요즘 취준생들은 이력서 쓰기가 제일 힘들다고 해요.", eng: "These days, job-seekers say writing résumés is the hardest part." }], translations: { en: { term: "job-seeker (abbreviation)", mainDef: "a shortened term for '(a) student preparing to get a job' (a neologism).", contextDef: "This is where 'job-seeker' is mentioned as one of the character types that often appear in healing novels." } } },
            { term: "실연", mainDef: "실연은 사랑하던 사람과 헤어져서 사랑을 잃은 것이다.", hanja: "실(失 잃다) + 연(戀 그리워하다/사랑하다)", contextDef: "힐링소설에 자주 나오는 또 다른 전형적 인물, 즉 사랑을 잃은 사람을 가리킬 때 쓰였다.", variants: ["실연"], examples: [{ kor: "그는 실연 후에 한동안 힘들어했어요.", eng: "He struggled for a while after going through a breakup." }], translations: { en: { term: "a heartbreak / failed romance", mainDef: "the loss of a romantic relationship, i.e. losing the person one loved.", contextDef: "Used here to point to another stock character type common in healing novels — someone who has just gone through a breakup." } } },
            { term: "뻔하게 흘러가다", mainDef: "이야기가 뻔하게 흘러가면, 누구나 쉽게 짐작할 수 있을 만큼 흔하고 정해진 방향으로 진행된다는 뜻이다.", contextDef: "취준생, 실연 등 정해진 인물들이 나오면서 이야기가 예상 가능하게 '흘러간다'고 비판하는 부분이다.", variants: ["뻔하게 흘러가는", "뻔하게 흘러가다"], examples: [{ kor: "그 드라마는 결말이 너무 뻔하게 흘러가서 재미가 없었어요.", eng: "That drama's ending played out so predictably that it wasn't fun to watch." }], translations: { en: { term: "to unfold predictably", mainDef: "for a story or situation to proceed in such a common, fixed direction that anyone could easily guess it.", contextDef: "Used here to criticize how, once these stock characters appear, the story predictably plays out in an expected way." } } },
            { term: "좋은생각", mainDef: "<좋은생각>은 오래전부터 한국에서 나온, 짧고 따뜻한 이야기와 좋은 말 위주의 잡지 이름이다. 새롭거나 자극적이지 않고 잔잔한 내용의 상징으로 자주 이야기된다.", contextDef: "해죽이가 힐링소설의 잔잔하고 무난한 느낌을 비유하기 위해 예로 든 잡지다.", variants: ["좋은생각"], examples: [{ kor: "할머니 댁 거실에는 항상 <좋은생각> 잡지가 쌓여 있었어요.", eng: "There was always a stack of <Good Thoughts> magazines in my grandmother's living room." }], translations: { en: { term: "<Good Thoughts> (a Korean monthly magazine)", mainDef: "a long-running, popular Korean monthly magazine of short, warm stories and quotes — often cited as a symbol of mild, unchanging, unremarkable content.", contextDef: "Haejuki brings up this magazine as an example to compare with the mild, unchallenging feel of healing novels." } } },
            { term: "참신하다", mainDef: "무언가가 참신하면, 지금까지와는 다르게 새롭고 산뜻하다는 뜻이다.", hanja: "참(斬 베다) + 신(新 새롭다)", contextDef: "힐링소설을 읽는 독자는 애초에 '참신한' 내용을 기대하고 읽는 게 아니라는 뜻으로 쓰였다.", variants: ["참신한", "참신함을"], examples: [{ kor: "이번 신입사원의 아이디어는 정말 참신했어요.", eng: "The new employee's idea was really fresh and original." }], translations: { en: { term: "to be fresh / original", mainDef: "to be new and refreshing, unlike anything before.", contextDef: "Used here to say that readers of healing novels aren't reading them expecting anything fresh or novel in the first place." } } },
            { term: "지점", mainDef: "지점은 원래 지도 위의 한 위치를 가리키는 말이다.", hanja: "지(地 땅) + 점(點 점)", contextDef: "지도 위의 실제 위치가 아니라, 힐링소설에 대한 평가가 갈리는 특정한 부분·순간을 비유적으로 가리킬 때 쓰였다. 바로 그 참신함이 없다는 점이 좋고 싫음이 갈리는 '지점'이라는 뜻이다.", variants: ["지점"], examples: [{ kor: "이야기가 산으로 가는 지점이 바로 여기예요.", eng: "This is exactly the point where the story goes off the rails." }], translations: { en: { term: "a point (figurative)", mainDef: "literally a spot on a map, but used here figuratively to point to a specific part or moment in a situation or discussion.", contextDef: "Used here not for an actual location on a map, but figuratively for the specific point where opinions on healing novels diverge — namely, the very lack of freshness." } } },
            { term: "호불호가 갈리다", mainDef: "호불호가 갈리면, 좋아하는 사람과 싫어하는 사람으로 의견이 뚜렷하게 나뉜다는 뜻이다.", subDefs: [{ subTerm: "• 호불호", subDef: "호(好 좋다) + 불호(不好 안 좋다)\n→ 좋아함과 좋아하지 않음, 즉 어떤 것에 대해 좋고 싫음이 나뉘는 것" }], contextDef: "힐링소설에 대한 평가가 사람마다 뚜렷하게 갈린다고 말하는 부분이다.", variants: ["호불호가 갈리는"], examples: [{ kor: "이 향수는 향이 강해서 호불호가 많이 갈려요.", eng: "This perfume's scent is strong, so it really splits people's opinions." }], translations: { en: { term: "opinions are split (love it or hate it)", mainDef: "for opinions to clearly split between people who like something and people who don't.", subDefs: [{ term: "호불호 (hobulho)", def: "ho (好, to like) + bulho (不好, to not like) → liking or not liking something; whether opinions on it split into for and against." }], contextDef: "Used here to say that opinions on healing novels are clearly split from person to person." } } },
            { term: "변주", mainDef: "변주는 원래 있던 것을 조금씩 다르게 바꾸어서 여러 가지 모습으로 만드는 것이다.", hanja: "변(變 변하다) + 주(奏 연주하다)", contextDef: "이 장르 안에서 새로운 '변주'가 잘 생겨나지 않는다고 지적하는 부분에서 쓰였다.", variants: ["변주"], examples: [{ kor: "같은 이야기라도 작가마다 다른 변주를 보여줘요.", eng: "Even the same story shows different variations depending on the author." }], translations: { en: { term: "variation", mainDef: "the act of slightly changing something original to create various new forms.", contextDef: "Used here in a comment noting that fresh variations don't really emerge within this genre." } } },
            { term: "마니아", mainDef: "마니아는 한 가지를 아주 깊이 좋아해서 열심히 즐기는 사람이다. (외래어)", contextDef: "힐링소설 장르 안에서는 열성적인 '마니아'가 생겨나기 어렵다고 말하는 부분이다.", variants: ["마니아"], examples: [{ kor: "제 친구는 커피 마니아라서 원두 종류를 다 알아요.", eng: "My friend is such a coffee maniac that he knows every type of bean." }], translations: { en: { term: "a maniac / enthusiast (loanword)", mainDef: "a person who loves and enjoys one particular field very deeply.", contextDef: "Used here to say it's hard for devoted fans to emerge within the healing-novel genre." } } },
            { term: "SF", mainDef: "SF는 Science Fiction(공상 과학)의 줄임말로, 과학 기술이나 미래 사회를 상상해서 그린 소설·영화 종류이다. (외래어)", contextDef: "힐링소설과 비교되는 다른 장르 소설의 예로 언급되었다.", variants: ["SF"], examples: [{ kor: "저는 우주를 배경으로 한 SF 영화를 좋아해요.", eng: "I like SF movies set in outer space." }], translations: { en: { term: "SF (science fiction)", mainDef: "an abbreviation for 'science fiction,' a genre of novels/films imagining science, technology, or future society (a loanword abbreviation).", contextDef: "Mentioned here as an example of another genre of fiction, used for comparison with healing novels." } } },
            { term: "입덕하다", mainDef: "누군가가 입덕하면, 어떤 사람이나 분야를 몹시 좋아하게 되어 팬이 된다는 뜻이다. (신조어)", hanja: "입(入 들다) + 덕('덕후'의 줄임말)", subDefs: [{ subTerm: "• 덕후", subDef: "일본어 '오타쿠(オタク)'에서 온 말로, 어떤 한 분야나 대상에 깊이 빠져서 몰두하는 사람을 가리키는 말 (속어)" }], contextDef: "한번 이 장르에 '입덕'하면 계속 빠져들게 된다는 맥락에서 쓰였다.", variants: ["입덕", "입덕하다"], examples: [{ kor: "저는 요즘 그 배우한테 입덕했어요.", eng: "I've recently become a huge fan of that actor." }], translations: { en: { term: "to become a fan / get hooked (neologism)", mainDef: "to become an enthusiastic fan of some person or field (a modern slang coinage).", subDefs: [{ term: "덕후 (deokhu)", def: "from Japanese 'otaku' (オタク); a slang term for someone deeply devoted to and absorbed in a particular field or interest." }], contextDef: "Used here in the context of how, once you get hooked on this genre, you keep getting drawn deeper in." } } },
            { term: "즐거움이라는 게 있거든요", mainDef: "이 표현은 상대방이 모를 만한 이유나 사실을 알려줄 때 쓴다.", subDefs: [{ subTerm: "• -거든요", subDef: "상대방이 모르는 이유나 사실을 알려주며 설명할 때 사용하는 표현" }], contextDef: "몰랐을 독자에게 새 작가를 계속 발견하는 즐거움이 있다는 사실을 알려주는 문장에서 쓰였다.", variants: ["즐거움이라는 게 있거든요"], examples: [{ kor: "이 동네에는 맛있는 빵집이 많이 있거든요.", eng: "You see, there are a lot of good bakeries in this neighborhood." }], translations: { en: { term: "there's a certain joy (you see)", mainDef: "used when explaining a reason or fact the listener might not know.", subDefs: [{ term: "-geodeun-yo", def: "used to explain a reason or fact the listener doesn't know yet." }], contextDef: "Used in the sentence that informs the listener of a fact they might not know — the pleasure of continually discovering new authors." } } },
            { term: "개연성", mainDef: "개연성은 이야기의 흐름이 실제로 있을 법하게 그럴듯하게 느껴지는 정도이다.", hanja: "개(蓋 대개) + 연(然 그러하다) + 성(性 성질)", contextDef: "힐링소설의 이야기 전개가 실제로 있을 법하지 않게, 즉 '개연성이 떨어진다'고 평가하는 부분이다.", variants: ["개연성"], examples: [{ kor: "그 영화는 결말의 개연성이 부족해서 아쉬웠어요.", eng: "That movie's ending lacked plausibility, which was disappointing." }], translations: { en: { term: "plausibility", mainDef: "the degree to which a story's flow feels realistic and believable.", contextDef: "Used here to criticize how the plot of healing novels can feel implausible — lacking in 'probability.'" } } },
            { term: "진상", mainDef: "진상은 원래 '진짜 상태'라는 뜻이었지만, 요즘은 다른 사람을 심하게 괴롭히거나 무리한 요구를 하는 손님을 가리키는 말이다. (신조어)", contextDef: "힐링소설 속에 '진상'이 없는 이상적인 설정이 오히려 몰입을 깬다고 말하는 부분이다.", variants: ["진상"], examples: [{ kor: "그 가게에는 가끔 진상 손님이 와서 직원들을 힘들게 해요.", eng: "Difficult customers sometimes come to that shop and give the staff a hard time." }], translations: { en: { term: "a difficult / obnoxious customer", mainDef: "originally meant 'true state,' but now refers to a customer who badly mistreats staff or makes unreasonable demands (a modern slang usage).", contextDef: "Used here to say that the absence of any 'difficult customer' in the fantasy setting is itself what breaks the reader's immersion." } } },
            { term: "와장창 깨지다", mainDef: "무언가가 와장창 깨지면, 어떤 믿음이나 상상이 순식간에 완전히 무너진다는 뜻이다.", subDefs: [{ subTerm: "• 와장창", subDef: "유리 같은 것이 한꺼번에 부서지는 소리나 모양" }], contextDef: "지나치게 이상적인 설정 때문에 몰입감이 순식간에 '와장창 깨진다'는 뜻으로 쓰였다.", variants: ["와장창 깨져버리는", "와장창 깨지다"], examples: [{ kor: "그 사람의 진짜 성격을 알고 나서 좋았던 첫인상이 와장창 깨졌어요.", eng: "After I found out his real personality, my good first impression shattered instantly." }], translations: { en: { term: "to shatter with a crash (figurative)", mainDef: "for a belief or illusion to completely collapse all at once, like glass smashing.", subDefs: [{ term: "와장창 (wajangchang)", def: "the sound or image of something like glass shattering all at once." }], contextDef: "Used here to say that the overly ideal setting makes the reader's immersion shatter instantly." } } },
            { term: "헛웃음이 나다", mainDef: "누군가에게 헛웃음이 나면, 너무 어이없거나 황당해서 웃음 아닌 웃음이 저절로 나온다는 뜻이다.", contextDef: "너무 비현실적인 설정에 어이없어 '헛웃음이 난다'는 반응을 나타낸다.", variants: ["헛웃음 나는데"], examples: [{ kor: "그 변명을 듣고 저도 모르게 헛웃음이 났어요.", eng: "I heard that excuse and couldn't help letting out a bitter laugh." }], translations: { en: { term: "to let out a hollow / bitter laugh", mainDef: "for an empty, disbelieving laugh to come out because something is so absurd.", contextDef: "Used here to express the reaction of scoffing in disbelief at how unrealistic the setting is." } } },
            { term: "어이가 없다", mainDef: "무언가가 어이가 없으면, 너무 뜻밖이거나 황당해서 말이 안 나온다는 뜻이다.", contextDef: "너무 이상적이기만 한 설정이 황당하다는 뜻으로, 청자에게 동의를 구하듯 쓰였다.", variants: ["어이가 없지"], examples: [{ kor: "약속을 세 번이나 어겨서 정말 어이가 없었어요.", eng: "They broke the promise three times, and I was just dumbfounded." }], translations: { en: { term: "to be dumbfounded / absurd", mainDef: "to be so stunned by something unexpected or ridiculous that you can hardly react.", contextDef: "Used here, in a tag-question form seeking agreement, to say how absurd an overly ideal setting is." } } },
            { term: "전무하다", mainDef: "무언가가 전무하면, 그것이 하나도 없다, 완전히 없다는 뜻이다.", hanja: "전(全 온전히) + 무(無 없다)", contextDef: "주인공이 경험도 경력도 '전무한' 상태로 가게를 새로 여는 설정을 설명하는 부분이다.", variants: ["전무한"], examples: [{ kor: "그 분야에는 경험이 전무해서 처음부터 배워야 해요.", eng: "I have zero experience in that field, so I have to learn from scratch." }], translations: { en: { term: "to be nonexistent", mainDef: "for something to be completely absent, with not even one bit of it.", contextDef: "Used here to describe a plot setup where the main character opens a new shop with absolutely zero experience or career." } } },
            { term: "보실 수 있잖아요", mainDef: "이 표현은 상대방도 이미 알고 있는 것을 다시 한번 확인시켜 줄 때 쓴다.", subDefs: [{ subTerm: "• -잖아요", subDef: "화자와 청자가 이미 함께 알고 있는 사실을 상대방에게 다시 상기시켜 줄 때 사용" }], contextDef: "청자도 이미 공감할 만한 사실, 즉 그런 생각을 하며 드라마를 볼 수 있다는 점을 다시 확인시켜 주는 문장에서 쓰였다.", variants: ["보실 수 있잖아요"], examples: [{ kor: "우리 어릴 때 같이 놀았잖아요.", eng: "We used to play together when we were kids, remember?" }], translations: { en: { term: "you can (do that), you know", mainDef: "used to remind the listener of something both people already know.", subDefs: [{ term: "-janha-yo", def: "used to remind the listener of a shared, already-known fact." }], contextDef: "Used in a sentence that reconfirms something the listener would already agree with — that you can watch a drama with exactly that thought in mind." } } },
            { term: "교양", mainDef: "교양은 책이나 예술, 문화 등을 배우고 익혀서 갖추는 넓은 지식과 품위이다.", hanja: "교(敎 가르치다) + 양(養 기르다)", contextDef: "최재천 교수가 독서는 이제 '교양을 쌓는' 취미 수준의 활동이 아니라 반드시 해야 하는 일이라고 강조하는 문장에서 쓰였다.", variants: ["교양"], examples: [{ kor: "그는 여러 분야의 책을 두루 읽어서 교양이 풍부해요.", eng: "He's well-read across many fields, so he has broad general knowledge." }], translations: { en: { term: "culture / general knowledge", mainDef: "the broad knowledge and refinement one gains by learning about books, the arts, and culture.", contextDef: "Used in Professor Choi Jae-cheon's statement that reading can no longer stay at the level of a hobby for 'building culture' — it must be treated as work." } } },
            { term: "다다르다", mainDef: "누군가가 어떤 결론에 다다르면, 여러 생각을 거쳐서 마침내 그곳에 이른다는 뜻이다.", contextDef: "최재천 교수가 여러 생각 끝에 '독서는 일이어야 한다'는 결론에 스스로 '다다랐다'고 말하는 부분이다.", variants: ["다다른", "다다르다"], examples: [{ kor: "오랜 토론 끝에 우리는 하나의 결론에 다다랐어요.", eng: "After a long discussion, we finally arrived at one conclusion." }], translations: { en: { term: "to arrive at / to reach", mainDef: "to finally reach a place, state, or conclusion after going through a process.", contextDef: "Used here as Professor Choi says he himself arrived at the conclusion that reading must be work, after much thought." } } },
            { term: "어쩌다가", mainDef: "어쩌다가는 특별한 뜻 없이 우연히, 뜻하지 않게라는 뜻이다.", contextDef: "화자가 책을 많이 쓴 것은 사실 스스로 이룬 성과인데, 그것을 마치 우연히 그렇게 된 일인 것처럼 낮추어 말함으로써 자랑처럼 들리지 않게 겸손하게 표현하는 방법으로 쓰였다.", variants: ["어쩌다가"], examples: [{ kor: "제가 어쩌다가 그 상을 받게 됐어요.", eng: "I somehow ended up winning that award. (said modestly, downplaying one's own achievement)" }], translations: { en: { term: "somehow / by chance (here: a modest downplay)", mainDef: "generally means 'by chance, without any particular intention.' Here, the speaker uses it to modestly downplay his own achievement (having written many books), speaking as if it just happened rather than boasting about it.", contextDef: "Used here as a modest way of talking down his own considerable achievement — writing many books — by phrasing it as if it just happened by chance, so it doesn't sound like boasting." } } },
            { term: "출판사", mainDef: "출판사는 책을 만들어서 세상에 내놓고 파는 회사이다.", hanja: "출(出 나가다) + 판(版 판/인쇄) + 사(社 회사)", contextDef: "책을 쓰는 과정에서 '출판사' 사람들과 많은 시간을 보낸다고 말하는 부분에서 쓰였다.", variants: ["출판사"], examples: [{ kor: "이 소설은 유명한 출판사에서 나온 책이에요.", eng: "This novel was published by a famous publisher." }], translations: { en: { term: "a publisher (company)", mainDef: "a company that produces and sells books.", contextDef: "Used here in a comment about spending a lot of time with people from 'publishers' while writing books." } } },
            { term: "출판계", mainDef: "출판계는 책을 만들고 파는 일을 하는 사람들과 회사들 전체를 가리킨다.", subDefs: [{ subTerm: "• 출판", subDef: "출(出 나가다) + 판(版 인쇄)\n→ 책이나 그림 등을 만들어 세상에 내놓음" }, { subTerm: "• 계", subDef: "계(界 경계)\n→ 같은 성격을 가진 사람이나 활동이 모인 세계, 분야" }], contextDef: "한국의 '출판계'가 해마다 최악의 불황이라고 말하는 부분에서 쓰였다.", variants: ["출판계"], examples: [{ kor: "요즘 출판계는 전자책 시장이 커지면서 많이 변화하고 있어요.", eng: "These days the publishing industry is changing a lot as the e-book market grows." }], translations: { en: { term: "the publishing industry", mainDef: "the entire industry made up of the people and companies involved in making and selling books.", subDefs: [{ term: "출판 (chulpan)", def: "chul (出, to go out) + pan (版, print) → to make and release books or prints into the world." }, { term: "계 (gye)", def: "gye (界, boundary) → a world or field made up of people or activities that share a certain nature." }], contextDef: "Used here in the remark that Korea's publishing industry supposedly hits 'the worst slump ever' every single year." } } },
            { term: "단군 이래", mainDef: "단군 이래는 우리 역사가 시작된 아주 오래전부터 지금까지, 즉 '역사상 처음'이라는 뜻으로 쓰는 표현이다.", subDefs: [{ subTerm: "• 단군", subDef: "단(檀 박달나무) + 군(君 임금)\n→ 한민족의 시조로 여겨지는 신화 속 인물" }, { subTerm: "• 이래", subDef: "이(以 부터) + 래(來 오다)\n→ 어떤 시점을 기준으로 그 뒤로 지금까지" }], contextDef: "출판계의 불황이 마치 한국 역사 전체를 통틀어 최악인 것처럼 과장해서 말할 때 쓰인 관용구다.", variants: ["단군 이래"], examples: [{ kor: "이번 폭염은 단군 이래 최고로 더운 여름이라고 해요.", eng: "They say this heat wave is making it the hottest summer in recorded history." }], translations: { en: { term: "\"since Dangun\" (i.e., in all of recorded history)", mainDef: "an idiom referring to Dangun, the legendary founder of the Korean people, used to mean 'since our history began' — i.e., 'the worst/best ever recorded.'", subDefs: [{ term: "단군 (Dangun)", def: "dan (檀, sandalwood tree) + gun (君, king) → the mythical figure regarded as the founding ancestor of the Korean people." }, { term: "이래 (irae)", def: "i (以, from) + rae (來, to come) → from a certain point in time up to now." }], contextDef: "This idiom is used to exaggerate the publishing slump as if it were the worst in all of Korean history." } } },
            { term: "불황", mainDef: "불황은 경제나 사업이 잘 안 되고 어려운 상태이다.", hanja: "불(不 아니다) + 황(況 상황)", contextDef: "'단군 이래 최대'라는 표현과 함께 쓰여, 출판계가 극심하게 어려운 상황임을 강조한다.", variants: ["불황"], examples: [{ kor: "요즘 경기 불황으로 문을 닫는 가게가 많아요.", eng: "These days, many shops are closing down because of the economic slump." }], translations: { en: { term: "a slump / recession", mainDef: "a state in which the economy or a business is doing poorly.", contextDef: "Paired with the phrase 'the worst since Dangun,' this emphasizes just how severe the publishing industry's downturn is." } } },
            { term: "멸종하다", mainDef: "어떤 생물이 멸종하면, 그 종류가 완전히 사라져서 하나도 남지 않게 된다는 뜻이다.", hanja: "멸(滅 사라지다) + 종(種 종류/생물의 종)", contextDef: "책이 그렇게 안 팔리는데도 출판사가 여전히 남아 있는 것을 보고, 진작 '멸종했어야' 할 업종이라며 반농담으로 말하는 부분이다.", variants: ["멸종했어야", "멸종하다"], examples: [{ kor: "많은 동물들이 환경 오염 때문에 멸종할 위기에 처해 있어요.", eng: "Many animals are on the verge of going extinct because of environmental pollution." }], translations: { en: { term: "to become extinct", mainDef: "for a species to completely disappear, with none left.", contextDef: "Used half-jokingly to say that, given how poorly books sell, publishers should have already 'gone extinct.'" } } },
            { term: "비굴하다", mainDef: "누군가가 비굴하면, 자존심을 버리고 너무 낮은 자세로 남에게 굽힌다는 뜻이다.", hanja: "비(卑 낮다/천하다) + 굴(屈 굽히다)", contextDef: "책이 안 팔리는데도 어떻게든 팔아보려는 출판사들의 태도가 지나치게 '비굴하다'고 비판하는 부분이다.", variants: ["비굴하고", "비굴하다"], examples: [{ kor: "그는 돈 때문에 사장 앞에서 비굴하게 굽실거렸어요.", eng: "He groveled servilely in front of his boss because of money." }], translations: { en: { term: "to be servile / to grovel", mainDef: "to give up one's pride and bow excessively low to someone else.", contextDef: "Used here to criticize how publishers, in their desperate attempts to sell books, come across as excessively 'servile.'" } } },
            { term: "태반이다", mainDef: "태반이다는 원래 '태반(胎盤)'이 아기가 뱃속에 있을 때 필요한 몸속 기관을 뜻하지만, 여기서는 '거의 대부분'이라는 뜻으로 쓰인다는 말이다.", contextDef: "1년에 책을 한 권도 안 읽는 사람이 '거의 대부분'이라는 뜻으로 쓰였다.", variants: ["태반일", "태반이다"], examples: [{ kor: "이 동네 식당은 저녁에 문을 닫는 곳이 태반이에요.", eng: "Most of the restaurants in this neighborhood are closed in the evening." }], translations: { en: { term: "to make up the vast majority", mainDef: "literally 'placenta,' but idiomatically used to mean 'the great majority / most of them.'", contextDef: "Used here to say that people who don't read even a single book a year make up 'the vast majority.'" } } },
            { term: "전락하다", mainDef: "무언가가 전락하면, 원래보다 훨씬 안 좋고 낮은 수준으로 완전히 떨어진다는 뜻이다.", hanja: "전(轉 구르다) + 락(落 떨어지다)", contextDef: "독서가 원래의 목적을 잃고 그저 마음을 달래주는 매체로 '전락했다'고 개탄하는 부분이다.", variants: ["전락하냐", "전락하다"], examples: [{ kor: "한때 최고였던 그 회사가 지금은 삼류 기업으로 전락했어요.", eng: "That company, once the best, has now degenerated into a third-rate business." }], translations: { en: { term: "to degenerate / to fall to a lower state", mainDef: "to completely drop from an original state to a much worse or lower one.", contextDef: "Used here to lament how reading has 'degenerated' from its original purpose into a mere feel-good medium." } } },
            { term: "질러대다", mainDef: "누군가가 질러대면, 앞뒤 재지 않고 거침없이 세게 말한다는 뜻이다.", subDefs: [{ subTerm: "• 지르다", subDef: "순간적으로 강하게 소리치거나 행동하다" }, { subTerm: "• -대다", subDef: "앞의 행동을 반복하거나 강조할 때 동사 뒤에 붙이는 표현" }], contextDef: "최재천 교수가 반발을 예상하면서도 자신의 생각을 거침없이 '질러대기로' 결심했다고 말하는 부분이다.", variants: ["질러대기로", "질러댄", "질러대다"], examples: [{ kor: "그는 화가 나서 하고 싶은 말을 다 질러댔어요.", eng: "He was so angry that he just blurted out everything he wanted to say." }], translations: { en: { term: "to blurt out boldly / to go all in on saying something", mainDef: "to speak strongly and bluntly without holding back.", subDefs: [{ term: "지르다 (jireuda)", def: "to shout or act suddenly and forcefully." }, { term: "-대다 (-daeda)", def: "an ending attached to a verb to show repetition or emphasis of the action." }], contextDef: "Used here as Professor Choi decides to just say his controversial opinion outright, despite expecting pushback." } } },
            { term: "~에 비례해서", mainDef: "이 표현은 한쪽이 커지거나 작아지는 만큼 다른 쪽도 똑같이 커지거나 작아진다고 말할 때 쓴다.", hanja: "비(比 견주다) + 례(例 본보기)", contextDef: "앉아 있는 시간이 늘어나는 만큼 수명이 줄어든다는, 두 값이 함께 변하는 관계를 나타낼 때 쓰였다.", variants: ["비례해서", "비례하다"], examples: [{ kor: "일하는 시간에 비례해서 월급이 올라요.", eng: "Your salary increases in proportion to how many hours you work." }], translations: { en: { term: "in proportion to", mainDef: "in a relationship where one thing grows or shrinks by the same amount that another does.", contextDef: "Used here to express that lifespan decreases in step with the amount of time spent sitting — two quantities changing together." } } },
            { term: "수명", mainDef: "수명은 살아 있는 것이 태어나서 죽을 때까지 살아 있는 기간이다.", hanja: "수(壽 목숨) + 명(命 목숨)", contextDef: "오래 앉아 있는 시간이 늘어날수록 줄어든다고 언급되는, 사람이 살아 있는 기간을 가리킨다.", variants: ["수명"], examples: [{ kor: "규칙적으로 운동하면 수명이 늘어난다고 해요.", eng: "They say exercising regularly extends your lifespan." }], translations: { en: { term: "lifespan", mainDef: "the length of time a living thing stays alive, from birth to death.", contextDef: "Refers to the length of time a person is alive — said here to shrink the more time one spends sitting." } } },
            { term: "치명적이다", mainDef: "무언가가 치명적이면, 목숨을 잃게 하거나 그만큼 심하게 나쁜 결과를 가져올 정도로 위험하다는 뜻이다.", hanja: "치(致 이르다) + 명(命 목숨)", contextDef: "앉아 있는 시간이 수명을 줄인다는 연구 결과가 매우 심각하다는 뜻으로 쓰였다.", variants: ["치명적인", "치명적이다"], examples: [{ kor: "그 실수는 회사 이미지에 치명적인 영향을 줬어요.", eng: "That mistake had a devastating impact on the company's image." }], translations: { en: { term: "to be fatal / critical", mainDef: "to be so serious or dangerous that it could bring life-threatening or severely damaging results.", contextDef: "Used here to say that the research finding — about sitting time shortening lifespan — is a genuinely damning one." } } },
            { term: "복구하다", mainDef: "누군가가 무언가를 복구하면, 나빠지거나 망가진 것을 원래 상태로 되돌린다는 뜻이다.", hanja: "복(復 회복하다) + 구(舊 예전)", contextDef: "오래 앉아 있어서 나빠진 몸 상태를 운동으로 '복구'하려는 생각을 가리킨다.", variants: ["복구를", "복구하다"], examples: [{ kor: "태풍으로 무너진 다리를 복구하는 데 몇 달이 걸렸어요.", eng: "It took several months to restore the bridge that collapsed in the typhoon." }], translations: { en: { term: "to restore / to recover", mainDef: "to bring something that has worsened or broken back to its original state.", contextDef: "Refers to the idea of trying to 'restore' one's body through exercise after sitting too long." } } },
            { term: "다독이다", mainDef: "누군가가 다른 사람을 다독이면, 그 사람의 힘든 마음을 부드럽게 위로해 준다는 뜻이다.", contextDef: "내용은 별로 없지만 읽으면 기분을 살짝 '다독여주는' 책들이 너무 많이 나온다고 비판하는 부분이다.", variants: ["다독이는", "다독이다"], examples: [{ kor: "엄마는 우는 아이를 다독이며 달래 줬어요.", eng: "The mom soothed and comforted the crying child." }], translations: { en: { term: "to soothe / to comfort gently", mainDef: "to comfort someone who is upset or struggling, as if gently patting their heart.", contextDef: "Used here to criticize the flood of books that have little real content but gently 'soothe' the reader's feelings." } } },
            { term: "이런 류", mainDef: "이런 류는 이것과 같은 종류를 가리키는 말이다.", hanja: "이런(이러하다, 이와 같은) + 류(類 종류)", contextDef: "내용 없이 기분만 달래주는 책들을 가리켜 '이런 류'의 책이라고 낮잡아 말하는 부분이다.", variants: ["이런 류"], examples: [{ kor: "저는 이런 류의 잔잔한 음악을 좋아해요.", eng: "I like this kind of mellow music." }], translations: { en: { term: "this kind/type of ~", mainDef: "'류' means 'kind, type, category'; '이런 류' means 'this kind of (thing).'", contextDef: "Used here somewhat dismissively to refer to that whole category of feel-good, content-light books." } } },
            { term: "마다하다", mainDef: "누군가가 무언가를 마다하면, 그것을 하기 싫어하거나 거절한다는 뜻이다.", contextDef: "그런 책을 읽는 것 자체를 완전히 '마다하지는' 않겠다며 한발 물러서는 부분이다.", variants: ["마다하지는", "마다하다"], examples: [{ kor: "그는 힘든 일도 마다하지 않고 열심히 해요.", eng: "He doesn't refuse even hard work and does it diligently." }], translations: { en: { term: "to refuse / to decline", mainDef: "to be unwilling to do or to turn down something offered or suggested.", contextDef: "Used here as the speaker concedes he won't outright 'refuse' reading that kind of book." } } },
            { term: "기껏", mainDef: "기껏은 아무리 노력하거나 많이 해도 별거 아니라는 뜻으로, '고작'과 같은 말이다.", contextDef: "일 년에 '기껏' 한두 권 읽는 사람도 마찬가지라고 말하는 부분에서 쓰였다.", variants: ["기껏"], examples: [{ kor: "기껏 준비했는데 결국 취소됐어요.", eng: "I went through all that trouble preparing, but in the end it got canceled." }], translations: { en: { term: "at most / for all that effort", mainDef: "used to say that no matter how much effort or amount is put in, it still only amounts to something small — 'at best, only.'", contextDef: "Used here to say that even someone who reads at most one or two books a year is no different." } } },
            { term: "쓸데없다", mainDef: "무언가가 쓸데없으면, 쓰일 곳이 없어서 애초에 필요하지 않거나 가치가 없다는 뜻이다.", subDefs: [{ subTerm: "• 소용없다와 비교", subDef: "'쓸데없다'는 그 일이나 생각 자체가 애초에 필요·가치가 없다는 뜻에 가깝고(예: 쓸데없는 걱정), '소용없다'는 이미 한 어떤 행동이 의도한 효과나 결과를 내지 못했다는 뜻에 가까움(예: 사과해도 소용없다). 본문에서는 '앉은 시간을 운동으로 보충하려는 발상 자체'를 평가하며 '쓸데없다'를 씀" }], contextDef: "겨우 한두 권 읽는 정도로는 아무 소용이 없다는, 즉 '쓸데없다'는 주장을 나타낸다.", variants: ["쓸데없다는", "쓸데없다"], examples: [{ kor: "쓸데없는 걱정은 그만하고 잠이나 자요.", eng: "Stop worrying over nothing and just go to sleep." }], translations: { en: { term: "to be pointless / useless (unnecessary from the start)", mainDef: "for something to have no purpose or value to begin with, because there's no use for it.", subDefs: [{ term: "vs. 소용없다", def: "'쓸데없다' means the thing/idea itself has no purpose or value to begin with (e.g., 'pointless worry'), while '소용없다' means an action already taken failed to produce its intended effect (e.g., 'apologizing won't help'). Here, '쓸데없다' judges the very idea of trying to make up for sitting with exercise." }], contextDef: "Used here to express the claim that reading just one or two books a year is 'pointless.'" } } },
            { term: "운동을 한들", mainDef: "이 표현은 운동을 아무리 열심히 해도 오래 앉아 있었던 시간의 나쁜 효과는 사라지지 않는다고 말할 때 쓴다.", subDefs: [{ subTerm: "• -ㄴ들/-은들", subDef: "'아무리 -아/어도', '설령 -라고 해도'와 비슷한 뜻으로, 앞의 행동이나 상태를 인정하더라도 그것이 뒤의 내용(주로 부정적이거나 소용없는 결과)을 바꾸지 못함을 강조하는 문법 표현. 예) 후회한들, 사과한들" }], contextDef: "아무리 운동을 '한들' 소용없다는 문장에 그대로 쓰였다.", variants: ["운동을 한들"], examples: [{ kor: "지금 아무리 후회한들 이미 지난 일이에요.", eng: "No matter how much you regret it now, it's already in the past." }], translations: { en: { term: "even if (you) exercise", mainDef: "'even if you exercise' — meaning that no matter how much exercise is done, it won't undo the negative effect already caused.", subDefs: [{ term: "-n deul / -eun deul", def: "similar to 'no matter how much you do X' or 'even if you do X.' Used to stress that even granting the preceding action or state, it doesn't change what follows (usually something negative or futile). E.g., 후회한들 ('even if you regret it'), 사과한들 ('even if you apologize')." }], contextDef: "Used directly in the line saying that no matter how much you exercise, it doesn't help." } } },
            { term: "소용없다", mainDef: "무언가가 소용없으면, 어떤 행동을 해도 원하는 효과나 결과가 나오지 않는다는 뜻이다.", hanja: "소(所 바/것) + 용(用 쓰다)", subDefs: [{ subTerm: "• 쓸데없다와 비교", subDef: "'소용없다'는 이미 한(또는 하려는) 구체적 행동이 실제 효과를 내지 못한다는 뜻에 가깝고(예: 운동을 해도 소용없다), '쓸데없다'는 그 일이나 생각 자체가 애초에 필요·가치가 없다는 뜻에 가까움(예: 쓸데없는 걱정). 본문에서는 앞에서 발상 전체를 '쓸데없다'로 평가한 뒤, '운동'이라는 구체적 행동의 효과 없음을 '소용없다'로 다시 표현함" }], contextDef: "운동을 해도 앉아 있었던 시간의 악영향이 사라지지 않는다는, 즉 효과가 '소용없다'는 뜻으로 쓰였다.", variants: ["소용이", "소용없다"], examples: [{ kor: "지금 아무리 사과해도 소용없어요.", eng: "It's no use apologizing now, no matter how much you do it." }], translations: { en: { term: "to be no use / to have no effect", mainDef: "for an action, however much it's done, to fail to bring about the intended effect or result.", subDefs: [{ term: "vs. 쓸데없다", def: "'소용없다' means a specific action already taken (or about to be taken) fails to produce a real effect (e.g., 'exercising won't help'), while '쓸데없다' means the very idea/thing has no purpose or value to begin with (e.g., 'pointless worry'). Here, after judging the whole idea as '쓸데없다,' the speaker restates the specific action of 'exercising' as having no effect with '소용없다.'" }], contextDef: "Used here to say that exercise is 'no use' — it doesn't undo the harm of prolonged sitting." } } },
            { term: "지식을 쌓다", mainDef: "누군가가 지식을 쌓으면, 지식을 조금씩 늘려 가며 많이 갖추게 된다는 뜻이다.", contextDef: "독서는 마음을 달래는 용도가 아니라 진짜 '지식을 쌓는' 수단으로 쓰여야 한다고 강조하는 결론 부분이다.", variants: ["지식을 쌓는", "지식을 쌓다"], examples: [{ kor: "여행을 다니면서 다양한 지식을 쌓았어요.", eng: "I built up a lot of knowledge by traveling to different places." }], translations: { en: { term: "to build up knowledge", mainDef: "to gradually accumulate a large amount of knowledge, little by little.", contextDef: "Used in the concluding point that reading should truly be used as a means of 'building knowledge,' not for comfort." } } },
            { term: "할 만하네", mainDef: "이 표현은 어떤 일을 시도해 볼 만한 가치나 재미가 있다고 느낄 때 쓴다.", subDefs: [{ subTerm: "• -ㄹ/을 만하다", subDef: "어떤 행동을 해 볼 가치가 있거나, 그 행동의 결과가 괜찮다고 평가할 때 쓰는 문법 표현. 동사 뒤에 붙어 '해 볼 가치가 있다'는 뜻을 만듦" }], contextDef: "재미있는 책으로 시작한 독자가 '독서가 할 만하네'라고 느끼게 되는 순간을 나타낸다.", variants: ["할 만하네"], examples: [{ kor: "이 식당 음식이 꽤 먹을 만하네요.", eng: "The food at this restaurant is actually pretty decent." }], translations: { en: { term: "it's worth doing", mainDef: "meaning it feels like reading is worth trying, or has some value/enjoyment to it.", subDefs: [{ term: "-l/eul manhada", def: "a grammar pattern meaning an action is worth doing, or that its result turns out to be decent/acceptable. Attaches to a verb to mean 'worth doing.'" }], contextDef: "Refers to the moment a reader who started with an enjoyable book realizes, 'reading is actually doable.'" } } },
            { term: "마음을 놓다", mainDef: "누군가가 마음을 놓으면, 걱정이나 긴장을 풀고 편안해진다는 뜻이다.", contextDef: "낯선 작가의 문체를 보고 편안하게 '마음을 놓고' 싶다는 독자의 바람을 나타낸다.", variants: ["마음 좀 놓고", "마음을 놓다"], examples: [{ kor: "시험이 끝나고 나니 이제야 마음을 놓을 수 있어요.", eng: "Now that the exam is over, I can finally relax." }], translations: { en: { term: "to feel at ease / to let one's guard down", mainDef: "to release worry or tension and feel comfortable.", contextDef: "Expresses a reader's wish to 'feel at ease' once they see a new author's writing style." } } },
            { term: "매혹의 순간", mainDef: "매혹의 순간은 어떤 것에 마음을 완전히 빼앗겨 버리는 짧은 시간이다.", subDefs: [{ subTerm: "• 매혹", subDef: "매(魅 홀리다) + 혹(惑 홀리다)\n→ 마음을 완전히 빼앗길 정도로 홀림" }], contextDef: "책에 처음으로 완전히 빠져들었던 그 순간을 가리키며, 대담자가 자신의 경험을 떠올리는 부분이다.", variants: ["매혹의 순간"], examples: [{ kor: "그 영화를 처음 본 순간이 제 인생의 매혹의 순간이었어요.", eng: "The moment I first watched that movie was a moment of pure fascination in my life." }], translations: { en: { term: "a moment of fascination", mainDef: "a brief moment when your heart is completely captivated by something.", subDefs: [{ term: "매혹 (maehok)", def: "mae (魅, to enchant) + hok (惑, to enchant) → to be so enchanted that your heart is completely captivated." }], contextDef: "Refers to the moment the speaker first became completely absorbed in a book, as they recall that experience." } } },
            { term: "유익하다", mainDef: "무언가가 유익하면, 배움이나 성장에 도움이 되고 이롭다는 뜻이다.", hanja: "유(有 있다) + 익(益 이롭다)", contextDef: "처음 몰입했던 그 책이 딱히 교육적으로 '유익하다'기보다는 그냥 재미있는 소설이었다고 말하는 부분이다.", variants: ["유익하다기보다는", "유익하다"], examples: [{ kor: "이 다큐멘터리는 아이들에게 아주 유익해요.", eng: "This documentary is very beneficial for kids." }], translations: { en: { term: "to be beneficial / useful", mainDef: "for something to be helpful and good for one's learning or growth.", contextDef: "Used here to say that the book which first captivated the speaker wasn't especially 'beneficial' — it was simply an enjoyable novel." } } },
            { term: "골라서 읽되", mainDef: "이 표현은 책을 골라서 읽는다는 것은 인정하지만, 그것과 다르거나 이어지는 다른 내용이 뒤에 나온다고 말할 때 쓴다.", subDefs: [{ subTerm: "• -되", subDef: "앞의 내용을 인정하거나 허용하면서도, 그것에 조건을 달거나 뒤에 대조되는 내용을 이어서 말할 때 쓰는 문법 표현. '-지만'과 비슷하지만 좀 더 격식 있는 느낌을 줌" }], contextDef: "재미있고 도움이 되는 책을 중심으로 '골라서 읽되', 그 뒤에 이어지는 조건(다른 관점의 책도 함께 읽어야 한다는 것)이 이어진다는 문맥에서 쓰였다.", variants: ["골라서 읽되"], examples: [{ kor: "여행은 가되, 계획은 미리 세우고 가세요.", eng: "Go on the trip, but make sure you plan ahead first." }], translations: { en: { term: "I choose to read, but...", mainDef: "acknowledges the preceding action (choosing and reading) while introducing a contrasting or following condition.", subDefs: [{ term: "-doe", def: "a somewhat formal grammar pattern that acknowledges or allows the preceding statement while attaching a condition or contrasting follow-up, similar to '-지만 (but).'" }], contextDef: "Used here to say the speaker does 'choose to read' books that are fun and helpful, while a further condition follows right after." } } },
            { term: "길러지다", mainDef: "능력이나 습관이 길러지면, 노력이나 경험을 통해 점점 자라서 갖추어진다는 뜻이다.", contextDef: "문해력은 그냥 읽기만 해서는 '길러지지' 않고, 책과 씨름해야 '길러진다'고 강조하는 부분이다.", variants: ["길러지는", "길러지거든요", "길러지다"], examples: [{ kor: "좋은 습관은 매일 조금씩 노력해야 길러져요.", eng: "Good habits are only built up if you make a little effort every day." }], translations: { en: { term: "to be cultivated / developed", mainDef: "for an ability or habit to gradually grow and take shape through effort or experience (passive of 기르다).", contextDef: "Used here to emphasize that literacy isn't 'developed' by mere reading, but by wrestling with the text." } } },
            { term: "소위", mainDef: "소위는 세상 사람들이 흔히 그렇게 부를 때 쓰는 말로, '이른바'와 같은 뜻이다.", contextDef: "일부 사람들이 이 흐름을 '텍스트 힙'이라는 말로 부른다고 소개할 때 쓰였다.", variants: ["소위"], examples: [{ kor: "소위 '명문대'라고 불리는 학교들이 꼭 좋은 것만은 아니에요.", eng: "So-called 'top universities' aren't necessarily always a good thing." }], translations: { en: { term: "so-called", mainDef: "used before a term that people commonly (though not always accurately) call something by.", contextDef: "Used here to introduce the fact that some people refer to this trend as 'text-hip.'" } } },
            { term: "현상", mainDef: "현상은 눈으로 보거나 살펴볼 수 있는 어떤 일이나 사건의 모습이다.", hanja: "현(現 나타나다) + 상(象 모양)", contextDef: "'텍스트 힙' 같은 흐름이 아예 없는 것보다는 반가운 '현상'이라고 평가하는 부분이다.", variants: ["현상"], examples: [{ kor: "최근 몇 년 사이 1인 가구가 늘어나는 현상이 뚜렷해요.", eng: "The trend of single-person households increasing has become clear in the past few years." }], translations: { en: { term: "a phenomenon / trend", mainDef: "an observable fact or event that can be seen or noticed.", contextDef: "Used here to evaluate a trend like 'text-hip' as a welcome 'phenomenon,' compared to there being no interest at all." } } },
            { term: "잘 통하다", mainDef: "누군가와 잘 통하면, 서로의 마음이나 생각이 잘 맞아서 이해가 잘 된다는 뜻이다.", contextDef: "나와 정말 마음이 '잘 통하는' 사람들과 책에 대해 깊이 있는 대화를 나눈다는 부분에서 쓰였다.", variants: ["잘 통할", "잘 통하다"], examples: [{ kor: "저는 취향이 잘 통하는 친구를 만나면 참 반가워요.", eng: "I'm always so glad when I meet a friend whose tastes really click with mine." }], translations: { en: { term: "to click well (with someone)", mainDef: "for two people's hearts or thoughts to align well so they understand each other easily.", contextDef: "Used here in the idea of having deep conversations about a book with people you truly 'connect with.'" } } },
            { term: "사회적인 용도", mainDef: "사회적인 용도는 다른 사람들과의 관계나 사회 안에서 쓰이기 위한 목적이다.", subDefs: [{ subTerm: "• 용도", subDef: "용(用 쓰다) + 도(途 길)\n→ 어떤 것이 쓰이는 목적이나 방법" }], contextDef: "겉으로 보여주기 위해서라도 책을 읽는 것이 '사회적인 용도'로는 의미가 있다고 인정하는 부분이다.", variants: ["사회적인 용도"], examples: [{ kor: "이 공원은 주민들이 모이는 사회적인 용도로도 쓰여요.", eng: "This park is also used for the social purpose of bringing residents together." }], translations: { en: { term: "a social use/purpose", mainDef: "a purpose that serves relationships with other people or a function within society.", subDefs: [{ term: "용도 (yongdo)", def: "yong (用, to use) + do (途, way) → the purpose or way something is used." }], contextDef: "Used here to concede that even reading for appearance's sake has some value as a 'social function.'" } } },
            { term: "적합하다", mainDef: "무언가가 적합하면, 어떤 조건이나 상황에 꼭 알맞다는 뜻이다.", hanja: "적(適 맞다) + 합(合 맞다)", contextDef: "나에게 '적합한' 책을 어떻게 고르면 좋을지 묻는 질문에서 쓰였다.", variants: ["적합한", "적합하다"], examples: [{ kor: "이 옷은 운동하기에 아주 적합해요.", eng: "These clothes are very suitable for exercising." }], translations: { en: { term: "to be suitable / fitting", mainDef: "to be exactly right for a certain condition or situation.", contextDef: "Used in the question about how to choose reading that's a good 'fit' for oneself." } } },
            { term: "고양시키다", mainDef: "누군가가 무언가를 고양시키면, 정신이나 수준, 기분 같은 것을 더 높은 상태로 끌어올린다는 뜻이다.", hanja: "고(高 높다) + 양(揚 드높이다)", contextDef: "책을 통해 자신을 한 단계 더 '고양시킬' 방법을 묻는 질문에서 쓰였다.", variants: ["고양시킬", "고양시키다"], examples: [{ kor: "좋은 음악은 사람의 기분을 고양시켜요.", eng: "Good music elevates a person's mood." }], translations: { en: { term: "to elevate / uplift", mainDef: "to raise one's spirit, level, or mood to a higher state.", contextDef: "Used in the question about how reading might further 'elevate' a person." } } },
            { term: "선정", mainDef: "선정은 여럿 가운데서 어떤 것을 골라서 정하는 것이다.", hanja: "선(選 가리다) + 정(定 정하다)", contextDef: "나에게 맞는 책의 '선정'을 어떻게 하면 좋을지 묻는 질문에서 쓰였다.", variants: ["선정"], examples: [{ kor: "이달의 도서 선정 기준이 뭐예요?", eng: "What are the criteria for selecting this month's book?" }], translations: { en: { term: "selection", mainDef: "the act of choosing and deciding on something from among several options.", contextDef: "Used in the question about how to go about the 'selection' of books that suit oneself." } } },
            { term: "거창한 기관", mainDef: "거창한 기관은 크기가 매우 크고 힘 있어 보이는 단체이다.", subDefs: [{ subTerm: "• 거창하다", subDef: "규모나 형태가 매우 크고 대단하다 (순우리말)" }, { subTerm: "• 기관", subDef: "기(機 틀) + 관(關 빗장)\n→ 어떤 목적을 위해 조직적으로 활동하는 단체" }], contextDef: "권위 있어 보이는 '거창한 기관'이 수십 권씩 권장도서를 제시하는 상황을 가리킨다.", variants: ["거창한 기관"], examples: [{ kor: "그런 거창한 기관에서 발표한 자료라고 다 믿을 수 있는 건 아니에요.", eng: "Just because some grand institution published the data doesn't mean it's all trustworthy." }], translations: { en: { term: "a grand/imposing institution", mainDef: "an organization that appears very large in scale and authoritative.", subDefs: [{ term: "거창하다 (geochanghada)", def: "to be very large in scale or grand (a native Korean word)." }, { term: "기관 (gigwan)", def: "gi (機, machine/framework) + gwan (關, bolt/gateway) → an organization that operates systematically for a certain purpose." }], contextDef: "Refers to the situation where some grand, authoritative-looking institution hands you dozens of recommended books." } } },
            { term: "쾌락독서", mainDef: "쾌락독서는 지식을 쌓기 위해서가 아니라 그저 재미와 즐거움을 위해 책을 읽는 것이다.", subDefs: [{ subTerm: "• 쾌락", subDef: "쾌(快 유쾌하다) + 락(樂 즐겁다)\n→ 유쾌하고 즐거운 느낌" }], contextDef: "한 연구자가 이런 순수한 재미 위주의 독서를 '쾌락독서'라는 말로 불렀다고 소개하는 부분이다.", variants: ["쾌락독서", "쾌락독서주의자"], examples: [{ kor: "저는 요즘 정보보다는 쾌락독서를 위해 소설을 읽어요.", eng: "These days I read novels for pleasure reading rather than for information." }], translations: { en: { term: "pleasure reading", mainDef: "reading purely for fun and enjoyment, not to gain knowledge.", subDefs: [{ term: "쾌락 (kwaerak)", def: "kwae (快, pleasant) + rak (樂, joyful) → a pleasant, joyful feeling." }], contextDef: "Used here to introduce how one researcher referred to this kind of purely enjoyment-driven reading as 'pleasure reading.'" } } },
            { term: "인식하다", mainDef: "누군가가 무언가를 인식하면, 그것을 보고 그게 무엇인지 깨달아 안다는 뜻이다.", hanja: "인(認 알다) + 식(識 알다)", contextDef: "책이 재미있는 것이라고 스스로 '인식하게' 되는 데 도움을 줬다고 말하는 부분이다.", variants: ["인식하는", "인식하다"], examples: [{ kor: "그 사건을 겪고 나서야 문제의 심각성을 인식했어요.", eng: "It was only after that incident that I realized how serious the problem was." }], translations: { en: { term: "to recognize / to perceive", mainDef: "to come to understand and know what something is.", contextDef: "Used here to describe how something helped the speaker come to 'recognize' that books could be fun." } } },
            { term: "강력하게 오다", mainDef: "어떤 느낌이 강력하게 오면, 아주 세고 뚜렷하게 마음에 와닿는다는 뜻이다.", contextDef: "그 깨달음의 인상이 아주 세게 '와닿았다'고 말하는 부분이다.", variants: ["강력하게 옵니다", "강력하게 오다"], examples: [{ kor: "그 노래의 첫 소절이 강력하게 와요.", eng: "That song's opening line really hits hard." }], translations: { en: { term: "to hit hard / to come through strongly", mainDef: "for a feeling or impression to strike one's heart very powerfully and clearly.", contextDef: "Used here to say that impression 'hit' very strongly." } } },
            { term: "자기계발서", mainDef: "자기계발서는 읽는 사람이 자기 능력이나 태도를 더 좋게 발전시키도록 도와주는 책이다.", subDefs: [{ subTerm: "• 자기", subDef: "자(自 스스로) + 기(己 몸)\n→ 자기 자신, 스스로" }, { subTerm: "• 계발", subDef: "계(啓 열다) + 발(發 피다)\n→ 능력이나 재능을 일깨워 발전시킴" }, { subTerm: "• 서", subDef: "서(書 책)\n→ 책" }], contextDef: "승진이나 업무에 도움이 될까 해서 읽는 '자기계발서' 위주의 독서 습관을 언급하는 부분이다.", variants: ["자기계발서"], examples: [{ kor: "요즘 서점에는 자기계발서 코너가 따로 있을 정도로 인기가 많아요.", eng: "Self-help books are so popular these days that bookstores even have a dedicated section for them." }], translations: { en: { term: "a self-help book", mainDef: "a book meant to help the reader improve their abilities or attitude.", subDefs: [{ term: "자기 (jagi)", def: "ja (自, self) + gi (己, oneself) → oneself, one's own self." }, { term: "계발 (gyebal)", def: "gye (啓, to open) + bal (發, to bloom) → to awaken and develop one's ability or talent." }, { term: "서 (seo)", def: "seo (書, book/writing) → a book." }], contextDef: "Used here in a comment about the habit of reading mainly 'self-help books' hoping they'll help with promotion or work." } } },
            { term: "뒷받침하다", mainDef: "무언가가 어떤 주장을 뒷받침하면, 그것이 사실이라는 것을 증명해 주는 근거나 힘이 되어 준다는 뜻이다.", contextDef: "책과 씨름해야 문해력이 길러진다는 주장을 연구 결과가 '뒷받침한다'고 말하는 부분이다.", variants: ["뒷받침해요", "뒷받침하다"], examples: [{ kor: "많은 연구 결과가 이 이론을 뒷받침해요.", eng: "Many research findings back up this theory." }], translations: { en: { term: "to support / to back up", mainDef: "to serve as evidence or a foundation that proves a claim or opinion is true.", contextDef: "Used here to say that research findings 'back up' the claim that literacy grows through wrestling with a text." } } },
            { term: "문해력", mainDef: "문해력은 글을 읽고 그 내용을 제대로 이해하는 능력이다.", hanja: "문(文 글) + 해(解 이해하다) + 력(力 능력)", contextDef: "책을 그냥 읽는 것만으로는 길러지지 않고, 책과 씨름해야 자란다고 말하는 바로 그 '문해력'을 가리킨다.", variants: ["문해력"], examples: [{ kor: "요즘 학생들의 문해력이 예전보다 떨어졌다는 말이 많아요.", eng: "People often say students' literacy skills have declined compared to before." }], translations: { en: { term: "literacy (reading comprehension ability)", mainDef: "the ability to read a text and properly understand its content.", contextDef: "Refers to the very 'literacy' that, the speaker says, doesn't grow from casual reading alone but from wrestling with a text." } } },
            { term: "씨름하다", mainDef: "씨름은 원래 두 사람이 힘을 겨루는 한국 전통 운동을 뜻한다.", contextDef: "실제 씨름 경기가 아니라, 책의 내용과 진지하게 힘겹게 맞붙어 애쓰는 것을 비유적으로 가리킨다. 문해력은 책과 이렇게 '씨름해야' 길러진다는 뜻으로 쓰였다.", variants: ["씨름할", "씨름을 할", "씨름하다"], examples: [{ kor: "저는 이 어려운 문제와 밤새 씨름했어요.", eng: "I wrestled with this difficult problem all night long." }], translations: { en: { term: "to wrestle / to grapple with", mainDef: "originally the traditional Korean sport of wrestling, used here figuratively to mean struggling earnestly with something.", contextDef: "Used here not for the actual wrestling match, but figuratively for grappling hard and seriously with a text — literacy, the speaker says, grows from 'wrestling' with a book this way." } } },
            { term: "텍스트 힙", mainDef: "텍스트 힙은 책을 읽거나 글을 쓰는 것이 멋있고 트렌디하다고 생각되는 요즘의 문화 흐름이다. (신조어)", hanja: "텍스트(text 글) + 힙(hip 멋있다)", contextDef: "일부 사람들이 요즘의 독서·글쓰기 유행을 부르는 이름으로 언급된다.", variants: ["텍스트 힙"], examples: [{ kor: "요즘 텍스트 힙 열풍으로 서점을 찾는 젊은 사람들이 늘었어요.", eng: "With the recent 'text-hip' trend, more young people have started visiting bookstores." }], translations: { en: { term: "\"text-hip\" (a trend of reading being seen as cool)", mainDef: "a recent cultural trend where reading and writing are seen as stylish and trendy (a neologism).", contextDef: "Mentioned here as the name some people use for this recent reading-and-writing trend." } } },
            { term: "과시하다", mainDef: "누군가가 무언가를 과시하면, 자기가 가진 것을 남에게 자랑하듯 드러내 보인다는 뜻이다.", hanja: "과(誇 자랑하다) + 시(示 보이다)", contextDef: "'나 이런 책도 읽는 사람이야'라는 식으로 자신을 '과시'하려는 경향을 우려하며 쓰였다.", variants: ["과시", "과시나", "과시하다"], examples: [{ kor: "그는 새로 산 차를 친구들에게 과시하고 싶어했어요.", eng: "He wanted to show off his newly bought car to his friends." }], translations: { en: { term: "to show off / to flaunt", mainDef: "to display what you have to others as if bragging about it.", contextDef: "Used here to voice concern over the tendency to 'show off' with an attitude of 'look, I read books like this too.'" } } },
            { term: "치우치다", mainDef: "생각이나 행동이 치우치면, 한쪽으로 너무 쏠려서 균형을 잃는다는 뜻이다.", contextDef: "독서가 깊이 있는 행위보다 과시 쪽으로 '치우치는' 면이 있다고 우려하는 부분이다.", variants: ["치우치는", "치우치다"], examples: [{ kor: "이 뉴스는 한쪽 의견에만 치우쳐서 보도했어요.", eng: "This news report was biased, leaning only toward one side's opinion." }], translations: { en: { term: "to lean / to be biased toward", mainDef: "for one's thoughts or actions to tip too far to one side, losing balance.", contextDef: "Used here to express concern that reading can 'lean' toward showing off rather than genuine depth." } } },
            { term: "우려하다", mainDef: "누군가가 무언가를 우려하면, 그 일이 나쁘게 될까 봐 걱정하고 신경 쓴다는 뜻이다.", hanja: "우(憂 걱정하다) + 려(慮 염려하다)", contextDef: "'텍스트 힙' 같은 흐름에 대해 화자가 조금 '우려하는' 부분을 밝히는 문장이다.", variants: ["우려하는", "우려하다"], examples: [{ kor: "전문가들은 이 정책이 부작용을 낳을까 봐 우려하고 있어요.", eng: "Experts are worried this policy might cause side effects." }], translations: { en: { term: "to be concerned about", mainDef: "to worry and be anxious that something might turn out badly.", contextDef: "This is the sentence where the speaker states the part of the 'text-hip' trend that they're somewhat 'concerned' about." } } },
            { term: "결부되다", mainDef: "서로 관련 없어 보이는 두 가지 일이 결부되면, 하나로 연결되어 묶인다는 뜻이다.", hanja: "결(結 맺다) + 부(付 붙이다)", contextDef: "책을 과시용으로 읽는 것이 문해력 향상과 반드시 직접 '결부되지는' 않을 수 있다고 지적하는 부분이다.", variants: ["결부되는", "결부되다"], examples: [{ kor: "이 문제는 경제 상황과도 밀접하게 결부되어 있어요.", eng: "This issue is also closely tied to the economic situation." }], translations: { en: { term: "to be tied / linked to", mainDef: "for two seemingly unrelated matters to become connected and bound together.", contextDef: "Used here to point out that this show-off style of reading may not necessarily be directly 'linked' to an actual rise in literacy." } } },
            { term: "단초", mainDef: "단초는 어떤 일이 풀리거나 시작될 수 있게 해 주는 작은 실마리이다.", hanja: "단(端 끝/실마리) + 초(初 처음)", contextDef: "가벼운 과시성 독서라도 더 깊은 감상으로 이어질 수 있는 최소한의 '단초'는 된다는 점에서 긍정적으로 평가되는 부분이다.", variants: ["단초"], examples: [{ kor: "그 작은 힌트가 사건 해결의 단초가 되었어요.", eng: "That small hint became the clue that led to solving the case." }], translations: { en: { term: "a clue / the initial thread", mainDef: "a small starting thread that allows something to be resolved or begun.", contextDef: "Used here to give even show-off-style reading some credit, as it can at least serve as a small 'starting thread' toward deeper appreciation later." } } },
            { term: "서울대학교 권장도서", mainDef: "서울대학교 권장도서는 서울대학교가 학생들에게 읽으라고 추천하는 책 목록이다. (한국 사회에서 '누구나 읽어야 할 어려운 고전'의 상징으로 자주 이야기된다.)", subDefs: [{ subTerm: "• 권장", subDef: "권(勸 권하다) + 장(奬 장려하다)\n→ 어떤 것을 하도록 권하고 북돋움" }], contextDef: "거창한 기관이 제시하는 부담스러운 권장도서 목록의 대표적인 예로 짧게 언급된다.", variants: ["서울대학교 권장도서"], examples: [{ kor: "제 책장에는 서울대학교 권장도서가 몇 권 꽂혀 있지만 아직 다 못 읽었어요.", eng: "I have a few of the SNU recommended-reading books on my shelf, but I still haven't finished them all." }], translations: { en: { term: "the Seoul National University recommended reading list", mainDef: "a list of books SNU recommends students read; in Korean culture it's often mentioned as a symbol of 'difficult classics everyone is supposed to read.'", subDefs: [{ term: "권장 (gwonjang)", def: "gwon (勸, to urge) + jang (奬, to encourage) → to urge and encourage someone to do something." }], contextDef: "Mentioned briefly here as a classic example of the kind of intimidating recommended-reading list handed down by a grand institution." } } },
            { term: "시행착오", mainDef: "시행착오는 여러 번 실패하고 잘못하는 과정을 거치면서 조금씩 배워 나가는 것이다.", hanja: "시(試 시험하다) + 행(行 행하다) + 착(錯 어긋나다) + 오(誤 그르치다)", contextDef: "나에게 맞는 책을 찾는 과정에는 몇 번의 실패, 즉 '시행착오'가 필요할 수 있다고 말하는 부분이다.", variants: ["시행착오"], examples: [{ kor: "새로운 요리를 배울 때는 시행착오를 몇 번 겪는 게 당연해요.", eng: "When learning a new recipe, it's natural to go through some trial and error." }], translations: { en: { term: "trial and error", mainDef: "the process of gradually learning by going through repeated failures and mistakes.", contextDef: "Used here to say that finding the right books for yourself may require some 'trial and error.'" } } },
            { term: "나들이", mainDef: "나들이는 가까운 곳으로 잠깐 놀러 가거나 구경하러 가는 일이다.", contextDef: "책을 직접 둘러보기 위해 도서관이나 서점으로 가벼이 다녀오는 것을 가리킨다.", variants: ["나들이"], examples: [{ kor: "주말에 가족과 함께 근처 공원으로 나들이를 갔어요.", eng: "I went on an outing to a nearby park with my family this weekend." }], translations: { en: { term: "an outing", mainDef: "a brief trip somewhere nearby to relax or look around.", contextDef: "Refers to taking a casual trip to a library or bookstore to browse books in person." } } },
            { term: "솔깃하다", mainDef: "누군가가 어떤 말에 솔깃하면, 그 말이 그럴듯하게 들려서 마음이 자연스럽게 그쪽으로 끌린다는 뜻이다.", contextDef: "저명한 사람의 추천이라는 말에 어느 정도는 마음이 '솔깃해도' 괜찮다고 말하는 부분이다.", variants: ["솔깃해도", "솔깃하다"], examples: [{ kor: "친구의 제안이 그럴듯해서 저도 모르게 솔깃했어요.", eng: "My friend's suggestion sounded so plausible that I found myself tempted." }], translations: { en: { term: "to be tempted / swayed", mainDef: "for someone's words to sound convincing enough that your heart is naturally drawn to them.", contextDef: "Used here to say it's fine to be a little 'drawn in' by a recommendation from someone renowned." } } },
            { term: "저명하다", mainDef: "누군가가 저명하면, 이름이 널리 알려질 만큼 훌륭하고 유명하다는 뜻이다.", hanja: "저(著 드러나다) + 명(名 이름)", contextDef: "아무리 '저명한' 사람이 추천했더라도 그것만으로 좋은 책이 되는 건 아니라고 말하는 부분이다.", variants: ["저명한", "저명하다"], examples: [{ kor: "그 대회에는 저명한 학자들이 심사위원으로 참여했어요.", eng: "Renowned scholars took part as judges at that competition." }], translations: { en: { term: "to be renowned / eminent", mainDef: "to be so distinguished that one's name is widely known.", contextDef: "Used here to say that a recommendation from someone 'renowned,' however famous, doesn't automatically make a book good for you." } } },
            { term: "꾸역꾸역", mainDef: "꾸역꾸역은 하기 싫거나 힘든 일을 억지로, 조금씩 참아 가며 계속하는 모습을 나타내는 말이다.", contextDef: "재미없는 책을 억지로 '꾸역꾸역' 끝까지 읽다가 오히려 독서 자체가 싫어질 수 있다고 경고하는 부분이다.", variants: ["꾸역꾸역"], examples: [{ kor: "배가 부른데도 남은 음식을 꾸역꾸역 다 먹었어요.", eng: "Even though I was full, I forced myself to eat all the leftover food." }], translations: { en: { term: "forcibly / reluctantly (doing something)", mainDef: "a mimetic word describing continuing to do something unwanted or difficult, little by little, while enduring it.", contextDef: "Used here as a warning that forcing yourself to 'trudge through' a boring book to the end can make you dislike reading altogether." } } },
            { term: "그러다 보면", mainDef: "이 표현은 어떤 행동이나 상태를 계속하다 보면 자연스럽게 뒤에 나오는 결과나 상황이 된다고 말할 때 쓴다.", subDefs: [{ subTerm: "• -다 보면", subDef: "어떤 행동을 반복하거나 계속하는 과정에서 자연스럽게 어떤 결과나 상태에 이르게 됨을 나타내는 문법 표현" }], contextDef: "책을 억지로 계속 읽다 '보면' 결국 생각할 시간조차 없어진다는 결과를 이어 말할 때 쓰였다.", variants: ["그러다 보면"], examples: [{ kor: "매일 조금씩 연습하다 보면 실력이 늘 거예요.", eng: "If you keep practicing a little every day, your skills will naturally improve." }], translations: { en: { term: "if you keep doing that", mainDef: "an expression showing that continuing an action or state will naturally lead to the result described next.", subDefs: [{ term: "-da bomyeon", def: "a grammar pattern showing that repeating or continuing an action naturally leads to a certain result." }], contextDef: "Used here to introduce the natural consequence — that forcing yourself to keep reading leaves no time left to actually think." } } },
            { term: "그러다 보니", mainDef: "이 표현은 어떤 행동을 계속하다가 그 결과로 새로운 것을 알게 되거나 그런 상태가 되었다고 말할 때 쓴다.", subDefs: [{ subTerm: "• -다 보니", subDef: "어떤 행동이나 상태를 계속하다가 그 결과로 새로운 사실을 알게 되거나 어떤 결과가 생겼을 때 쓰는 표현" }], contextDef: "책 이야기를 계속 나누다 '보니' 자연스럽게 서로 의견을 주고받게 되어 문해력에도 도움이 됐다는 결과를 말할 때 쓰였다.", variants: ["그러다 보니"], examples: [{ kor: "매일 이 카페에 오다 보니 사장님이랑 친해졌어요.", eng: "As I kept coming to this café every day, I ended up getting close with the owner." }], translations: { en: { term: "as it turned out (from continuing that)", mainDef: "an expression used when continuing an action leads to newly realizing something or arriving at a certain result.", subDefs: [{ term: "-da boni", def: "used when a new fact or result emerges from continuing an action or state." }], contextDef: "Used here to describe the result that naturally followed from continuing to discuss books — an exchange that ended up helping literacy too." } } },
            { term: "사용하시더라고요", mainDef: "이 표현은 직접 보거나 들어서 알게 된 것을 나중에 떠올리며 다른 사람에게 전달할 때 쓴다.", subDefs: [{ subTerm: "• -시더라고요", subDef: "상대방을 높이면서(-시-), 자신이 직접 경험하거나 관찰한 사실을 나중에 다른 사람에게 전할 때 쓰는 표현" }], contextDef: "화자가 인터뷰에서 어떤 연구자가 '쾌락독서'라는 단어를 직접 들었던 것을 떠올려 전달하는 부분이다.", variants: ["사용하시더라고요"], examples: [{ kor: "그 선생님은 항상 학생들 이름을 다 기억하시더라고요.", eng: "I noticed that teacher always remembers all the students' names." }], translations: { en: { term: "I noticed (she) uses it (honorific, reported)", mainDef: "used to relay something you personally saw or heard, honoring the subject; here the speaker relays what they heard directly in an interview.", subDefs: [{ term: "-sideorago-yo", def: "the honorific form of -더라고요, used to report something you personally witnessed about someone you're showing respect to." }], contextDef: "Used here as the speaker recalls and relays, with the ending '-더라고요,' a term she personally heard a researcher use in an interview." } } },
            { term: "양이냐 질이냐", mainDef: "이 표현은 '얼마나 많은가'와 '얼마나 좋은가' 중에서 무엇이 더 중요한지 물을 때 쓴다.", subDefs: [{ subTerm: "• 양", subDef: "양(量)\n→ 수나 분량의 많고 적음" }, { subTerm: "• 질", subDef: "질(質)\n→ 성질이나 수준의 좋고 나쁨" }], contextDef: "독서에서 많이 읽는 것과 제대로 읽는 것 중 무엇이 더 중요한지 던지는 질문에 그대로 쓰였다.", variants: ["양이냐 질이냐"], examples: [{ kor: "발표 자료를 만들 때는 양이냐 질이냐를 놓고 늘 고민하게 돼요.", eng: "When making presentation materials, I always end up debating quantity versus quality." }], translations: { en: { term: "quantity or quality?", mainDef: "a contrastive phrase asking whether 'how much' or 'how good' matters more when judging something.", subDefs: [{ term: "양 (yang)", def: "yang (量) → the amount or quantity of something." }, { term: "질 (jil)", def: "jil (質) → the quality or level of something." }], contextDef: "Used directly in the question of whether reading is more about quantity or quality." } } },
            { term: "영양가", mainDef: "영양가는 원래 음식이 몸에 주는 영양의 값어치를 뜻한다.", hanja: "영(營 경영하다) + 양(養 기르다) + 가(價 값)", contextDef: "실제 음식의 영양가가 아니라, 그 책이 공부나 학습에는 별 실질적 도움이 안 됐다는 뜻을 비유적으로 나타낸다.", variants: ["영양가"], examples: [{ kor: "그 회의는 세 시간이나 했는데 영양가가 하나도 없었어요.", eng: "That meeting lasted three whole hours but had zero real value." }], translations: { en: { term: "nutritional value (figurative: real substance/worth)", mainDef: "literally the nutritional value food gives the body, but used figuratively here for the real, practical benefit or worth something provides.", contextDef: "Used here not for actual nutritional value, but figuratively to say the book gave no real, practical help for things like studying." } } }
        ];

        // VOCAB_DATA의 각 어휘가 어느 동영상 자료(VIDEOS 인덱스)에서 나왔는지 자동 판별.
        // variants/term이 등장하는 첫 동영상 스크립트를 찾고, 못 찾으면 직전 어휘와 같은 동영상으로 간주(원본 배열이 동영상 순서대로 정렬돼 있음).
        const VOCAB_VIDEO_IDX = (() => {
            let last = 0;
            return VOCAB_DATA.map((w) => {
                const variants = (w.variants && w.variants.length) ? w.variants : [w.term];
                for (let vi = 0; vi < VIDEOS.length; vi++) {
                    if (VIDEOS[vi].script.some((l) => variants.some((v) => l.kor.includes(v)))) { last = vi; return vi; }
                }
                return last;
            });
        })();

        const ANSWER_CHOICES = ["고전", "성찰하다", "몰입하다", "진부하다", "참신하다", "호불호가 갈리다", "개연성", "전무하다", "헛웃음이 나다", "어이가 없다", "뻔하다", "여운", "몰입감"];
        const QUIZ_LIST = [
            { id: "1", textParts: ["이 소설은 몇백 년 전에 쓰였지만 지금도 많은 사람이 읽는 ", "(이)에요."], answer: "고전", hint: "오래전에 만들어졌지만 지금까지도 널리 읽히고 사랑받는 훌륭한 문학 작품.", explanation: "'고전'은 그 자체로 명사이므로 형태를 바꾸지 않고 그대로 사용합니다.", textParts_eng: ["This novel was written centuries ago, but it's still read by many people today — it's a ", "."], answer_eng: "classic" },
            { id: "2", textParts: ["여행을 다녀온 뒤에 저는 제 삶을 다시 ", " 시간을 가졌어요."], answer: "성찰하는", hint: "자기 마음이나 행동을 깊이 되돌아보다.", verbHint: "기본형 '성찰하다'를 뒤에 오는 명사를 꾸며주는 현재 관형형(-는)으로 바꾸세요.", explanation: "원형 '성찰하다'에 현재 진행 중인 동작을 나타내는 관형형 어미 '-는'이 붙어 '성찰하는'이 되었습니다.", textParts_eng: ["After coming back from my trip, I took time to ", " on my life again."], answer_eng: "reflect" },

                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const ok = st.input.trim() === (quiz.answer||quiz.correct_word); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = (quiz.answer||quiz.correct_word); st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'verbhint') { st.verbHint = !st.verbHint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'particlehint') { st.particleHint = !st.particleHint; rerenderQuizQ(qid); }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            if (e.target.id === 'seek') { const t = parseFloat(e.target.value) + clipBase(); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; if (!learn.isPlaying) learn.pendingSeek = t; updateSeekUI(); return; }
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        // video: 어휘 호버 팝업
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        // keyboard (video)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.error = null; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id);
            const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다. 학습자 답변을 분석하고 JSON으로만 답하세요. 순수 JSON만 반환하세요.\n[질문]: ${item.questionKor}\n[학습자 답변]: ${st.text}\n[포맷]: {"overallPraise":"","overallPraiseTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const data = await callGeminiWithBackoff(payload); let txt = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text; if (!txt) throw new Error('응답이 비어있습니다.'); txt = txt.replace(/^```json\n?/, '').replace(/\n?```$/, ''); st.feedback = JSON.parse(txt); }
            catch (err) { st.error = err.message; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 시작 ----------
        buildApp();
    })();
    </script>
</body>
