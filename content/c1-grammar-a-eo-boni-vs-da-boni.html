    <style id="grammar-practice-css">
        /* ===== 문법 연습 (읽기 자료 포맷 + 인라인 빈칸) ===== */
        .gx-note { border: 1px solid #111; padding: 22px 24px; margin-bottom: 56px; background: #fff; }
        .gx-note h3 { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: #111; margin: 0 0 6px; }
        .gx-note .gx-sub { font-size: 13px; color: #6b7280; line-height: 1.7; margin: 0 0 18px; }
        .gx-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 768px) { .gx-grid { grid-template-columns: 1fr 1fr; gap: 18px; } }
        .gx-cell { border-top: 3px solid #111; padding-top: 12px; }
        .gx-cell .gx-form { font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 700; color: #111; }
        .gx-cell .gx-core { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #111; color: #fff; padding: 2px 7px; vertical-align: middle; }
        .gx-cell .gx-desc { font-size: 14px; color: #374151; line-height: 1.8; margin: 8px 0 10px; }
        .gx-cell .gx-ex { font-family: 'Noto Serif KR', serif; font-size: 15px; color: #111; background: #f9fafb; border-left: 2px solid #111; padding: 8px 12px; }
        .gx-cell .gx-en { font-size: 12px; color: #9ca3af; margin-top: 6px; font-style: italic; }
        .gx-tips { margin: 20px 0 0; padding: 14px 16px 14px 32px; background: #f9fafb; font-size: 13px; color: #4b5563; line-height: 1.85; }
        .gx-tips li { margin-bottom: 4px; list-style: disc; }
        .gx-tips li:last-child { margin-bottom: 0; }

        .gx-item { margin-bottom: 64px; padding-bottom: 56px; border-bottom: 1px solid #e5e7eb; }
        .gx-item:last-child { border-bottom: 0; }
        .gx-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
        .gx-num { font-family: 'Noto Serif KR', serif; font-size: 34px; font-weight: 700; color: #e5e7eb; line-height: 1; }
        .gx-title { font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 700; color: #111; }
        .gx-src { margin-left: auto; font-size: 11px; color: #9ca3af; letter-spacing: .02em; }
        .gx-para { font-family: 'Noto Serif KR', serif; font-size: 17px; line-height: 2.0; letter-spacing: .01em; color: #222; text-align: justify; margin: 0 0 14px; }
        @media (min-width: 768px) { .gx-para { font-size: 18px; } }
        .gx-para:last-of-type { margin-bottom: 0; }

        .gx-blank { display: inline-block; vertical-align: baseline; width: 130px; margin: 0 4px; padding: 0 6px;
            border: 0; border-bottom: 2px solid #9ca3af; background: transparent; outline: none;
            font-family: 'Noto Serif KR', serif; font-size: inherit; font-weight: 700; text-align: center; color: #111;
            transition: border-color .15s ease, color .15s ease; }
        .gx-blank::placeholder { color: #d1d5db; font-weight: 400; }
        .gx-blank:focus { border-bottom-color: #111; }
        .gx-blank.gx-ok { border-bottom-color: #059669; color: #047857; }
        .gx-blank.gx-bad { border-bottom-color: #dc2626; color: #b91c1c; }
        .gx-blank.gx-shown { border-bottom-color: #6b7280; color: #374151; }

        .gx-bgroup { margin-top: 22px; }
        .gx-bgroup + .gx-bgroup { margin-top: 18px; padding-top: 18px; border-top: 1px dashed #e5e7eb; }
        .gx-blabel { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .08em;
            color: #6b7280; border: 1px solid #d1d5db; padding: 4px 9px; margin-right: 2px; }
        .gx-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 0; }
        .gx-btn { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; padding: 9px 16px;
            border: 1px solid #111; background: #111; color: #fff; cursor: pointer; transition: background .15s ease, color .15s ease; }
        .gx-btn:hover { background: #374151; border-color: #374151; }
        .gx-btn.gx-ghost { background: #fff; color: #4b5563; border-color: #d1d5db; }
        .gx-btn.gx-ghost:hover { background: #fff; color: #111; border-color: #111; }
        .gx-btn.gx-link { background: transparent; border: 0; color: #9ca3af; text-decoration: underline; text-underline-offset: 3px; padding: 9px 4px; }
        .gx-btn.gx-link:hover { color: #111; background: transparent; }

        .gx-fb { margin-top: 16px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; line-height: 1.8; }
        .gx-fb .gx-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
        .gx-fb .gx-row:last-child { margin-bottom: 0; }
        .gx-fb .gx-mark { flex: none; font-weight: 700; width: 16px; }
        .gx-fb .gx-ok-t { color: #047857; }
        .gx-fb .gx-bad-t { color: #b91c1c; }
        .gx-fb .gx-tag { display: inline-block; font-size: 11px; font-weight: 700; border: 1px solid currentColor; padding: 0 6px; margin-right: 8px; }
        .gx-fb .gx-alt { color: #6b7280; font-size: 12px; }
        .gx-hint { margin-top: 14px; padding: 10px 14px; background: #f9fafb; border-left: 2px solid #d1d5db;
            font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #4b5563; }
        .gx-hint b { color: #111; }
        .gx-progress { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; color: #9ca3af; }
        .gx-progress b { color: #111; font-size: 13px; }

        .gx-blank.gx-near { border-bottom-color: #d97706; color: #b45309; }
        .gx-fb .gx-near-t { color: #b45309; }
        .gx-fb .gx-neutral { color: #374151; }
        .gx-fb .gx-muted { color: #9ca3af; }
        .gx-btn:disabled { background: #fff; color: #d1d5db; border-color: #e5e7eb; cursor: not-allowed; }
        .gx-btn:disabled:hover { background: #fff; color: #d1d5db; border-color: #e5e7eb; }

        .gx-empty { padding: 56px 24px; text-align: center; font-family: 'Noto Serif KR', serif; font-size: 18px; color: #111; }
        .gx-empty span { display: block; margin-top: 8px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #9ca3af; }
        .gx-summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
            border-top: 3px solid #111; padding-top: 18px; margin-top: 8px; }
        .gx-sum-l { display: flex; align-items: baseline; gap: 12px; }
        .gx-sum-n { font-family: 'Noto Serif KR', serif; font-size: 32px; font-weight: 700; color: #111; line-height: 1; }
        .gx-sum-n span { font-size: 18px; color: #9ca3af; }
        .gx-sum-t { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #6b7280; }
        .gx-sum-r { display: flex; gap: 10px; flex-wrap: wrap; }

        .gx-prod { border: 1px solid #111; padding: 22px 24px; margin: 8px 0 40px; }
        .gx-prod h4 { font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700; margin: 0 0 6px; color: #111; }
        .gx-prod p { font-family: 'Noto Serif KR', serif; font-size: 15px; color: #374151; line-height: 1.8; margin: 0 0 14px; }
        .gx-prod textarea { width: 100%; min-height: 130px; padding: 14px; border: 1px solid #d1d5db; resize: vertical;
            font-family: 'Noto Serif KR', serif; font-size: 15px; line-height: 1.8; color: #111; outline: none; background: #fff; }
        .gx-prod textarea:focus { border-color: #111; }
        .gx-prod ul { margin: 14px 0 0; padding-left: 20px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #4b5563; line-height: 1.9; }
        .gx-prod li { list-style: disc; }

        @media print {
            .gx-blank { border-bottom: 1px solid #111; }
            .gx-btns, .gx-hint, .gx-fb, .gx-summary { display: none !important; }
        }
        /* 인쇄 학습지 — 문법 연습 */
        .pw-gx-title { font-size: 12pt; font-weight: 700; margin: 10px 0 4px; }
        .pw-gx-src { font-size: 9pt; color: #555; margin-bottom: 4px; }
        .pw-gx-p { font-size: 10.5pt; line-height: 1.9; text-align: justify; margin-bottom: 8px; }
        .pw-gx-blank { display: inline-block; min-width: 120px; border-bottom: 1px solid #111; }
        .pw-gx-hint { font-size: 9pt; color: #555; margin-bottom: 14px; }
        .pw-gx-item { break-inside: avoid; margin-bottom: 16px; }

        { term:"개존잼", mainDef:"‘엄청 재미있다’는 뜻의 비속어예요. 친한 사이에서만 쓰는 말이에요.", variants:["개존잼"], subDefs:[], examples:[{kor:"그 영화 개존잼이었어.", eng:"That movie was hilarious. (slang)"}], translations:{ en:{ term:"super fun (vulgar slang)", mainDef:"Slang for 'extremely fun'; used only among close friends." } } },
        { term:"쌉가능", mainDef:"‘완전히 가능하다’는 뜻의 은어예요.", variants:["쌉가능"], subDefs:[], examples:[{kor:"내일까지? 쌉가능이지.", eng:"By tomorrow? Totally doable. (slang)"}], translations:{ en:{ term:"totally possible (slang)", mainDef:"Slang for 'completely possible'." } } },
        { term:"개빡침", mainDef:"‘몹시 화가 남’이라는 뜻의 비속어예요.", variants:["개빡침"], subDefs:[], examples:[{kor:"그 말 듣고 개빡침이었어.", eng:"I was furious after hearing that. (slang)"}], translations:{ en:{ term:"being furious (vulgar slang)", mainDef:"Slang for being extremely angry." } } },
        { term:"일상어", mainDef:"일상생활에서 흔히 사용하는 말을 가리켜요.", variants:["일상어"], subDefs:[], examples:[{kor:"교과서에는 없는 일상어가 많아요.", eng:"There are many everyday words that textbooks don't cover."}], translations:{ en:{ term:"everyday language", mainDef:"Words commonly used in daily life." } } },
        { term:"비속어", mainDef:"저속하거나 상스러운 말을 말해요.", variants:["비속어"], subDefs:[], examples:[{kor:"공식적인 자리에서 비속어를 쓰면 안 돼요.", eng:"You shouldn't use vulgar language in a formal setting."}], translations:{ en:{ term:"vulgar language, profanity", mainDef:"Coarse or crude words." } } },
        { term:"뚝배기 깨다", mainDef:"머리를 세게 때리거나 해치겠다는 뜻의 폭력적인 속어예요.", variants:["뚝배기 깬다"], subDefs:[], examples:[{kor:"그런 표현은 너무 폭력적이에요.", eng:"That kind of expression is far too violent."}], translations:{ en:{ term:"to smash someone's head (violent slang)", mainDef:"Violent slang meaning to strike or harm someone's head." } } },
        { term:"죽빵 날리다", mainDef:"주먹으로 세게 때리겠다는 뜻의 폭력적인 속어예요.", variants:["죽빵 날린다"], subDefs:[], examples:[{kor:"싸움을 부추기는 말은 피하세요.", eng:"Avoid words that provoke a fight."}], translations:{ en:{ term:"to throw a punch (violent slang)", mainDef:"Violent slang meaning to hit someone hard with a fist." } } },
        { term:"폭력적", mainDef:"폭력을 담고 있거나 폭력을 떠올리게 하는 성질을 말해요.", variants:["폭력적"], subDefs:[], examples:[{kor:"그 장면은 지나치게 폭력적이었어요.", eng:"That scene was excessively violent."}], translations:{ en:{ term:"violent", mainDef:"Containing or evoking violence." } } },
        { term:"어감", mainDef:"단어나 문장에서 느껴지는 미묘한 느낌이나 뉘앙스를 말해요.", variants:["어감"], subDefs:[], examples:[{kor:"두 단어는 뜻은 같지만 어감이 달라요.", eng:"The two words mean the same thing but feel different."}], translations:{ en:{ term:"nuance, feel of a word", mainDef:"The subtle impression or nuance a word or sentence carries." } } },
        { term:"변형되다", mainDef:"원래의 모양이나 성질이 바뀌는 것을 말해요.", variants:["변형되어"], subDefs:[], examples:[{kor:"생각은 말이 되면서 변형돼요.", eng:"Thought is transformed as it becomes speech."}], translations:{ en:{ term:"to be transformed", mainDef:"For the original shape or nature of something to change." } } },
        { term:"재구성되다", mainDef:"이미 있던 것이 새롭게 짜이거나 조직되는 것을 말해요.", variants:["재구성된다"], subDefs:[], examples:[{kor:"기억은 말할 때마다 재구성돼요.", eng:"Memory is reconstructed each time it is told."}], translations:{ en:{ term:"to be reconstructed", mainDef:"For something existing to be newly organized or restructured." } } },
        { term:"낱말", mainDef:"하나의 뜻을 나타내는 말의 단위예요. ‘단어’와 같은 말이에요.", variants:["낱말"], subDefs:[], examples:[{kor:"낱말 하나가 문장 전체를 바꿔요.", eng:"A single word can change the whole sentence."}], translations:{ en:{ term:"word", mainDef:"A unit of language expressing a single meaning; the native-Korean term for 단어." } } },
        { term:"비로소", mainDef:"‘드디어, 마침내’라는 뜻으로, 어떤 일이 이루어지는 때를 강조할 때 써요.", variants:["비로소"], subDefs:[], examples:[{kor:"설명을 듣고 나서야 비로소 이해했어요.", eng:"Only after the explanation did I finally understand."}], translations:{ en:{ term:"only then, finally", mainDef:"'At last'; used to emphasize the moment something is realized or achieved." } } },
        { term:"개요", mainDef:"글의 중심 내용을 간략하게 정리한 것을 말해요.", variants:["개요"], subDefs:[], examples:[{kor:"글을 쓰기 전에 개요를 잡아요.", eng:"I draft an outline before writing."}], translations:{ en:{ term:"outline", mainDef:"A brief summary of the main content of a piece of writing." } } },
        { term:"풀어내다", mainDef:"복잡하거나 어려운 내용을 쉽게 설명하거나 표현하는 것을 말해요.", variants:["풀어내다"], subDefs:[], examples:[{kor:"어려운 이론을 쉽게 풀어냈어요.", eng:"He unpacked a difficult theory in simple terms."}], translations:{ en:{ term:"to unravel, to spell out", mainDef:"To explain or express complex or difficult content in an accessible way." } } },
        { term:"문득", mainDef:"‘갑자기, 불현듯’이라는 뜻으로, 예상치 못한 순간을 나타내요.", variants:["문득"], subDefs:[], examples:[{kor:"문득 옛날 생각이 났어요.", eng:"An old memory suddenly came to mind."}], translations:{ en:{ term:"suddenly, all at once", mainDef:"'Out of the blue'; marking an unexpected moment." } } },
        { term:"어렴풋이", mainDef:"뚜렷하지 않고 희미하게라는 뜻으로, 명확하지 않은 상태를 나타내요.", variants:["어렴풋이"], subDefs:[], examples:[{kor:"그 일이 어렴풋이 기억나요.", eng:"I vaguely remember that."}], translations:{ en:{ term:"vaguely, faintly", mainDef:"Not clearly; in an indistinct state." } } },
        { term:"한층", mainDef:"‘더욱, 한 단계 더’라는 뜻으로, 정도가 더해짐을 나타내요.", variants:["한층"], subDefs:[], examples:[{kor:"설명을 들으니 한층 이해가 됐어요.", eng:"After the explanation I understood even better."}], translations:{ en:{ term:"even more, a notch further", mainDef:"Indicates an increase by one more degree." } } },
        { term:"생각이 정리되다", mainDef:"복잡하거나 혼란스러웠던 생각들이 체계적으로 정돈되는 것을 말해요.", variants:["생각이 정리되는","생각이 한층 더 정리되었기"], subDefs:[], examples:[{kor:"글로 쓰니까 생각이 정리됐어요.", eng:"Writing it down helped me sort out my thoughts."}], translations:{ en:{ term:"for one's thoughts to fall into place", mainDef:"For confused or tangled thoughts to become systematically organized." } } },
        { term:"방문학생", mainDef:"다른 학교나 나라에 잠시 머물며 공부하는 학생을 말해요.", variants:["방문학생"], subDefs:[], examples:[{kor:"일 년 동안 방문학생으로 지냈어요.", eng:"I spent a year as a visiting student."}], translations:{ en:{ term:"visiting student", mainDef:"A student who studies temporarily at another school or in another country." } } },
        { term:"중화요리집", mainDef:"중국 음식을 파는 식당을 말해요.", variants:["중화요리집"], subDefs:[], examples:[{kor:"주말이면 중화요리집이 붐벼요.", eng:"The Chinese restaurant gets crowded on weekends."}], translations:{ en:{ term:"Chinese restaurant", mainDef:"A restaurant serving Chinese food." } } },
        { term:"수저를 멈추다", mainDef:"먹던 동작을 잠시 멈추는 것을 말해요. 보통 놀라거나 당황했을 때 써요.", variants:["수저를 멈췄다"], subDefs:[], examples:[{kor:"그 말에 모두 수저를 멈췄어요.", eng:"At those words everyone stopped eating."}], translations:{ en:{ term:"to freeze mid-bite", mainDef:"To pause while eating, usually out of surprise." } } },
        { term:"도대체", mainDef:"의문이나 어이없음을 강조할 때 쓰는 말이에요.", variants:["도대체"], subDefs:[], examples:[{kor:"도대체 그걸 어디서 배웠어요?", eng:"Where on earth did you learn that?"}], translations:{ en:{ term:"on earth, in the world", mainDef:"Used to emphasize a question or a sense of disbelief." } } },
        { term:"뜬금없다", mainDef:"상황에 전혀 맞지 않게 갑자기 나오는 것을 말해요.", variants:["뜬금없는"], subDefs:[], examples:[{kor:"뜬금없는 질문에 다들 웃었어요.", eng:"Everyone laughed at the out-of-nowhere question."}], translations:{ en:{ term:"out of nowhere, random", mainDef:"Appearing suddenly and completely out of context." } } },
        { term:"기껏해야", mainDef:"‘아무리 잘해도 고작 그 정도’라는 뜻이에요.", variants:["기껏해야"], subDefs:[], examples:[{kor:"기껏해야 두세 명 올 거예요.", eng:"At most, two or three people will come."}], translations:{ en:{ term:"at most, at best", mainDef:"'No more than that, however generously you count'." } } },
        { term:"땡땡땡", mainDef:"이름이나 내용을 구체적으로 말하지 않을 때 쓰는 표현이에요. 영어의 ‘so-and-so’와 비슷해요.", variants:["땡땡땡"], subDefs:[], examples:[{kor:"제 이름은 땡땡땡입니다.", eng:"My name is so-and-so."}], translations:{ en:{ term:"so-and-so, blank", mainDef:"A placeholder used when not specifying a name or detail." } } },
        { term:"말이 튀어나오다", mainDef:"예상치 못한 말이 갑자기 나오는 것을 말해요.", variants:["튀어나오기에는","튀어나올 거라고"], subDefs:[], examples:[{kor:"생각지도 못한 말이 튀어나왔어요.", eng:"Words I hadn't expected came blurting out."}], translations:{ en:{ term:"for words to blurt out", mainDef:"For unexpected words to come out suddenly." } } },
        { term:"자초지종", mainDef:"일의 처음부터 끝까지의 자세한 사정을 말해요.", variants:["자초지종"], subDefs:[], examples:[{kor:"자초지종을 들어 보니 오해였어요.", eng:"Once I heard the whole story, it turned out to be a misunderstanding."}], translations:{ en:{ term:"the whole story, the full circumstances", mainDef:"The detailed account of a matter from beginning to end." } } },
        { term:"통째로", mainDef:"나누지 않고 전체를 한꺼번에라는 뜻이에요.", variants:["통째로"], subDefs:[], examples:[{kor:"문장을 통째로 외웠어요.", eng:"I memorized the sentence whole."}], translations:{ en:{ term:"whole, in one piece", mainDef:"All at once, without dividing it up." } } },
        { term:"접속사", mainDef:"두 단어나 구, 절, 문장을 이어 주는 품사예요.", variants:["접속사"], subDefs:[], examples:[{kor:"접속사를 쓰면 문장이 자연스러워져요.", eng:"Conjunctions make sentences flow naturally."}], translations:{ en:{ term:"conjunction", mainDef:"A part of speech that links words, phrases, clauses, or sentences." } } },
        { term:"혼인 제도", mainDef:"결혼에 관한 사회적·법적 체계를 말해요.", variants:["혼인 제도"], subDefs:[], examples:[{kor:"나라마다 혼인 제도가 달라요.", eng:"Marriage systems differ from country to country."}], translations:{ en:{ term:"marriage system", mainDef:"The social and legal framework governing marriage." } } },
        { term:"중매결혼", mainDef:"제삼자의 소개로 이루어지는 결혼을 말해요.", variants:["중매결혼"], subDefs:[], examples:[{kor:"부모님은 중매결혼을 하셨어요.", eng:"My parents had an arranged marriage."}], translations:{ en:{ term:"arranged marriage", mainDef:"A marriage brought about through a third party's introduction." } } },
        { term:"얼굴을 드러내다", mainDef:"가리고 있던 얼굴을 보이는 것을 말해요.", variants:["얼굴을 드러내고"], subDefs:[], examples:[{kor:"그 자리에서는 얼굴을 드러내도 돼요.", eng:"In that setting you may show your face."}], translations:{ en:{ term:"to show one's face, to unveil", mainDef:"To reveal a face that had been covered." } } },
        { term:"여성상", mainDef:"이상적으로 생각하는 여성의 모습이나 특성을 말해요.", variants:["여성상"], subDefs:[], examples:[{kor:"시대마다 이상적인 여성상이 달라요.", eng:"The ideal image of a woman differs by era."}], translations:{ en:{ term:"image of womanhood", mainDef:"The idealized figure or traits attributed to women." } } },
        { term:"고분고분하다", mainDef:"순종적이고 말을 잘 듣는 태도를 나타내요.", variants:["고분고분하며"], subDefs:[], examples:[{kor:"아이가 뜻밖에 고분고분했어요.", eng:"The child was unexpectedly obedient."}], translations:{ en:{ term:"docile, compliant", mainDef:"Describing an obedient, submissive attitude." } } },
        { term:"상냥하다", mainDef:"태도가 부드럽고 친절한 것을 말해요.", variants:["상냥한"], subDefs:[], examples:[{kor:"목소리가 참 상냥해요.", eng:"She has a very gentle voice."}], translations:{ en:{ term:"gentle, sweet-natured", mainDef:"Soft and kind in manner." } } },
        /* ── 여행의 이유 (김영하, 2019) ── */
        { term:"질문을 던지다", mainDef:"의문을 제기하거나 물음을 내놓는 것을 말해요.", variants:["질문들을 스스로에게 던지고"], subDefs:[], examples:[{kor:"스스로에게 질문을 던져 봤어요.", eng:"I posed the question to myself."}], translations:{ en:{ term:"to pose a question", mainDef:"To raise a question or put forward an inquiry." } } },
        { term:"답을 구하다", mainDef:"어떤 문제나 의문에 대한 해답을 찾으려고 애쓰는 것을 말해요.", variants:["답을 구하고"], subDefs:[], examples:[{kor:"오래 답을 구했지만 찾지 못했어요.", eng:"I sought an answer for a long time but never found one."}], translations:{ en:{ term:"to seek an answer", mainDef:"To try to find the solution to a problem or question." } } },
        { term:"지나오다", mainDef:"과거의 시간이나 경험을 거쳐 온 것을 나타내요.", variants:["지나온"], subDefs:[], examples:[{kor:"지나온 십 년을 돌아봤어요.", eng:"I looked back on the past ten years."}], translations:{ en:{ term:"to have come through", mainDef:"To have passed through a period of time or experience." } } },
        { term:"여행자", mainDef:"여행을 하는 사람을 가리키는 말이에요.", variants:["여행자"], subDefs:[], examples:[{kor:"우리는 모두 여행자예요.", eng:"We are all travelers."}], translations:{ en:{ term:"traveler", mainDef:"A person who travels." } } },
        { term:"딸려 올라오다", mainDef:"하나를 끌어올릴 때 관련된 것들이 함께 따라 나오는 것을 말해요.", variants:["딸려 올라왔다"], subDefs:[], examples:[{kor:"기억 하나에 다른 기억들이 딸려 올라왔어요.", eng:"One memory dragged other memories up with it."}], translations:{ en:{ term:"to be dragged up along with", mainDef:"For related things to come up together when one thing is pulled up." } } },
        { term:"곧", mainDef:"여기서는 ‘바로, 다름 아닌’이라는 뜻으로 두 가지가 같음을 나타내요.", variants:["곧"], subDefs:[], examples:[{kor:"인생은 곧 여행이에요.", eng:"Life is nothing other than a journey."}], translations:{ en:{ term:"namely, none other than", mainDef:"Here it means 'is precisely', marking that two things are the same." } } },
        { term:"타인", mainDef:"자기 자신이 아닌 다른 사람을 가리키는 말이에요.", variants:["타인"], subDefs:[], examples:[{kor:"타인의 시선을 신경 쓰지 마세요.", eng:"Don't worry about how others see you."}], translations:{ en:{ term:"another person, others", mainDef:"Someone other than oneself." } } },
        { term:"신뢰", mainDef:"믿고 의지할 수 있다고 여기는 마음이에요.", variants:["신뢰"], subDefs:[], examples:[{kor:"신뢰는 쌓기 어렵고 잃기 쉬워요.", eng:"Trust is hard to build and easy to lose."}], translations:{ en:{ term:"trust", mainDef:"The feeling that someone can be believed and relied upon." } } },
        { term:"절실히", mainDef:"매우 간절하고 절박하게라는 뜻이에요.", variants:["절실히"], subDefs:[], examples:[{kor:"도움이 절실히 필요했어요.", eng:"I desperately needed help."}], translations:{ en:{ term:"desperately, urgently", mainDef:"In a deeply earnest, pressing manner." } } },
        { term:"삶이 굴러가다", mainDef:"일상적인 삶이 그럭저럭 이어져 나가는 것을 비유적으로 표현한 말이에요.", variants:["굴러간다"], subDefs:[], examples:[{kor:"주변의 도움으로 삶이 굴러가요.", eng:"Life keeps rolling along thanks to those around me."}], translations:{ en:{ term:"for life to keep rolling along", mainDef:"Figurative expression for daily life continuing to get by." } } },
        { term:"낯선", mainDef:"처음 보거나 경험하는 것이어서 익숙하지 않은 상태를 말해요.", variants:["낯선"], subDefs:[], examples:[{kor:"낯선 도시에 혼자 도착했어요.", eng:"I arrived alone in an unfamiliar city."}], translations:{ en:{ term:"unfamiliar, strange", mainDef:"Not familiar, because it is seen or experienced for the first time." } } },
        { term:"지내다 가다", mainDef:"어떤 곳에서 일정 기간 머물다가 떠나는 것을 말해요.", variants:["지내다 가도록"], subDefs:[], examples:[{kor:"편히 지내다 가세요.", eng:"Please stay comfortably before you go."}], translations:{ en:{ term:"to stay a while and then leave", mainDef:"To remain somewhere for a period and then depart." } } },
        { term:"생방송", mainDef:"녹화 없이 실시간으로 나가는 방송을 말해요.", variants:["생방송"], subDefs:[], examples:[{kor:"매일 생방송을 진행했어요.", eng:"I hosted a live broadcast every day."}], translations:{ en:{ term:"live broadcast", mainDef:"A program aired in real time rather than pre-recorded." } } },
        { term:"초청", mainDef:"어떤 사람이나 단체를 공식적으로 부르는 것을 말해요.", variants:["초청"], subDefs:[], examples:[{kor:"대학의 초청을 받았어요.", eng:"I received an invitation from the university."}], translations:{ en:{ term:"invitation", mainDef:"An official summons or invitation extended to a person or group." } } },
        { term:"아파트를 내놓다", mainDef:"아파트를 팔거나 세를 놓기 위해 시장에 내놓는 것을 말해요.", variants:["아파트를 내놓은","아파트가 내놓자마자"], subDefs:[], examples:[{kor:"이사를 앞두고 아파트를 내놓았어요.", eng:"We put the apartment on the market ahead of the move."}], translations:{ en:{ term:"to put an apartment on the market", mainDef:"To list an apartment for sale or rent." } } },

        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }

            const modeBar = hasFC ? `<div class="fc-modebar print:hidden"><button type="button" data-action="fc-mode" data-mode="list" class="fc-modebtn${fc.mode==='list'?' on':''}">어휘 카드<span class="lk-en"> · Vocab Cards</span></button><button type="button" data-action="fc-mode" data-mode="card" class="fc-modebtn${fc.mode==='card'?' on':''}">플래시 카드<span class="lk-en"> · Flash Cards</span></button></div>` : '';
            const header = `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-16 flex flex-col items-center text-center"><h2 class="text-[32px] md:text-[36px] font-bold text-[#1a1a1a] leading-tight font-serif mb-3 tracking-tight">핵심 어휘</h2><p class="text-[16px] text-[#444444] font-serif leading-relaxed mt-2 max-w-2xl">학습 자료에 등장하는 주요 어휘를 쉬운 한국어로 학습해 보세요.</p><div class="w-[1px] h-6 bg-gray-200 mt-8"></div></div>`;
            const listRest = `<div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100"><div class="relative w-full sm:max-w-xs"><input type="text" id="vocab-search" value="${esc(vocabState.query)}" placeholder="단어, 뜻, 영어 검색..." class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 transition-all" />${vocabState.query ? '<button type="button" data-action="vocab-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs font-bold">✕</button>' : ''}</div><div class="flex items-center gap-4 w-full sm:w-auto justify-end"><span class="text-xs text-gray-500 font-sans">검색 결과: <strong id="vocab-count">${vocabFiltered().length}</strong>개 / 전체 ${VOCAB_READING_DATA.length}개</span><button type="button" data-action="vocab-global" class="px-4 py-2 text-xs font-semibold rounded-lg border transition-all ${vocabState.globalTrans ? 'bg-gray-900 text-white border-gray-900 hover:bg-black' : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'}">${vocabState.globalTrans ? '영어 일괄 숨기기' : '영어 일괄 표시'}</button></div></div><div class="mb-16"><div class="flex items-center gap-3 mb-8"><h3 class="text-xl font-bold font-serif text-black">읽기 자료 어휘</h3><div class="h-px flex-1 bg-gray-200"></div><span class="text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Reading</span></div><div id="vocab-grid">${vocabGridHTML()}</div></div></div>`;
            const body = (hasFC && fc.mode==='card') ? fcDeckHTML() : listRest;
            return `${header}${modeBar}${body}`;
        }
        function refreshVocabGrid() { const g = qs('#vocab-grid', viewRoot()); if (g) g.innerHTML = vocabGridHTML(); const c = qs('#vocab-count', viewRoot()); if (c) c.textContent = vocabFiltered().length; }



        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);
            if (out.length) return out;
            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            if (typeof READING_DATA !== 'undefined' && Array.isArray(READING_DATA) && READING_DATA.length) s.push(['reading', '문법 연습']);
            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;
        }

        function pwReadingHTML() {
            let n = 0;
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')} · ${esc(r.author || '')} (${esc(r.year || '')})</div>` +
                (r.content || []).map(ex => {
                    n += 1;
                    const paras = String(ex.text).split('\n').map(para =>
                        `<div class="pw-gx-p">${para.split(/\{\{(\d+)\}\}/).map((chunk, i) => i % 2 === 1 ? '<span class="pw-gx-blank">&nbsp;</span>' : esc(chunk)).join('')}</div>`
                    ).join('');
                    const hints = ex.blanks.map((b, i) => (ex.blanks.length > 1 ? (i + 1) + ') ' : '') + b.hint).join('  /  ');
                    return `<div class="pw-gx-item"><div class="pw-gx-title">${n}. ${esc(ex.itemTitle)}</div>${paras}<div class="pw-gx-hint">힌트 · ${esc(hints)}</div></div>`;
                }).join('')
            ).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwAnswersHTML() {
            let n = 0; const lines = [];
            READING_DATA.forEach(r => r.content.forEach(ex => {
                n += 1;
                lines.push(`${n}. ${esc(ex.itemTitle)} — ` + ex.blanks.map((b, i) => (ex.blanks.length > 1 ? (i + 1) + ') ' : '') + esc(b.answers[0]) + ' <i>' + esc(b.form) + '</i>').join('  /  '));
            }));
            return `<div class="pw-answers"><b>정답</b><br>${lines.join('<br>')}</div>`;
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'reading');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { reading: pwReadingHTML, vocab: pwVocabHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('reading')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { reading: 'reading', vocab: 'vocab' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const rdo = e.target.closest('[data-reading-open]'); if (rdo) { reading.activeId = +rdo.dataset.readingOpen; setTab('reading'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const a = e.target.closest('[data-action]');
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                const gxs = e.target.closest('[data-gxs]');
                if (gxs) {
                    if (gxs.dataset.gxs === 'filter') { reading.filter = reading.filter === 'todo' ? 'all' : 'todo'; }
                    else if (gxs.dataset.gxs === 'resetall') {
                        currentReading().content.forEach((ex, i) => ex.blanks.forEach((b, j) => resetBlank(bState(i, j))));
                        reading.filter = 'all';
                    }
                    rerenderReadingBlocks(); refreshProgress();
                    const sc = qs('#reading-scroll', viewRoot()); if (sc) sc.scrollTop = 0;
                    return;
                }
                const gxBtn = e.target.closest('[data-gx]');
                if (gxBtn) {
                    const item = gxBtn.closest('.gx-item'); if (!item) return;
                    const exIdx = +item.dataset.exIdx, bIdx = +gxBtn.dataset.bi;
                    const ex = currentReading().content[exIdx], b = ex.blanks[bIdx];
                    // 재렌더 전에 화면의 입력값을 상태에 반영
                    qsa('.gx-blank', item).forEach(inp => { bState(exIdx, +inp.dataset.bi).v = inp.value; });
                    const bs = bState(exIdx, bIdx);
                    const act = gxBtn.dataset.gx;
                    if (act === 'check') {
                        bs.checked = true; bs.attempts += 1;
                        if (bs.result !== 'shown') {
                            const dg = diagnose(b, bs.v);
                            bs.result = dg.kind === 'empty' ? null : dg.kind === 'correct' ? 'correct' : dg.kind === 'near' ? 'near' : 'incorrect';
                            bs.msg = dg.msg || '';
                        }
                    }
                    else if (act === 'hint') { bs.hint = !bs.hint; }
                    else if (act === 'show') { bs.checked = true; if (bs.result !== 'correct') { bs.v = b.answers[0]; bs.result = 'shown'; } }
                    else if (act === 'reset') { resetBlank(bs); }
                    rerenderExercise(exIdx);
                    return;
                }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    return;
                }
            } else if (tab === 'vocab') {
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;
                    const fa = e.target.closest('[data-action^="fc-"]');
                    if (fa) { const act = fa.dataset.action;
                        if (act === 'fc-flip') fcSetFlip(!fc.flipped);
                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });
                        else if (act === 'fc-order') fcSetOrder(fa.dataset.sh==='1');
                        else if (act === 'fc-audio') fcPlay(fcCur().audio);
                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }
                        else if (act === 'fc-again-u') { fc.shuffled=true; fcStart(fcUnknown()); fcRefreshDeck(); }
                        else if (act === 'fc-again-all') { fc.shuffled=true; fcStart(null); fcRefreshDeck(); }
                    }
                    return;
                }
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            }
        });

        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'reading' && e.target.matches('[data-gx-prod]')) { reading.prod[reading.activeId] = e.target.value; }
            else if (tab === 'reading' && e.target.classList.contains('gx-blank')) {
                const item = e.target.closest('.gx-item'); if (!item) return;
                const exIdx = +item.dataset.exIdx, bIdx = +e.target.dataset.bi;
                const bs = bState(exIdx, bIdx); bs.v = e.target.value; bs.result = null;
                e.target.classList.remove('gx-ok', 'gx-bad', 'gx-near', 'gx-shown');
                e.target.style.width = blankWidth(currentReading().content[exIdx].blanks[bIdx], bs.v) + 'px';
            }
        });

        appEl.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'reading' || e.key !== 'Enter') return;
            const inp = e.target.closest && e.target.closest('.gx-blank'); if (!inp) return;
            e.preventDefault();
            const btn = qs(`[data-gx="check"][data-bi="${inp.dataset.bi}"]`, inp.closest('.gx-item')); if (btn) btn.click();
        });



        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.runId)) container = container.parentElement;
            if (!container) return;
            const blockId = container.dataset.runId;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            container.innerHTML = renderTextSegments(container.textContent, blockId);
        }



        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
</body>
