    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            { id: 's40', speaker: '우창윤', kor: '네, 막 그렇게 하시는 분도 많고.', time: [100.51, 102.31], eng: "Yeah, lots of people do that." },
            { id: 's41', speaker: '우창윤', kor: '막 변형을 주는 막 그런 분들도 생기고.', time: [102.35, 105.21], eng: "Some people even tweak the recipe." },
            { id: 's42', speaker: '항성', kor: '촬영하고 있는 장소가 이제 \'힉스커피\'라는 곳입니다.', time: [105.25, 107.62], eng: "We're filming at a place called 'Higgs Coffee'." },
            { id: 's43', speaker: '우창윤', kor: '아, 깜짝 놀랐어요.', time: [107.65, 108.87], eng: "Ah, I was surprised." },
            { id: 's44', speaker: '우창윤', kor: '이게 굉장히 잘해놓고, 인스타에서 보던 그곳이어가지고, 와 너무 반가운 마음에 사진 찍고 이랬어요.', time: [108.90, 115.49], eng: "It's set up so well, and it's the place I saw on Insta, so I was super happy and took photos." },
            { id: 's45', speaker: '항성', kor: '그러니까요? 오시자마자 사진 찍으시더라고요.', time: [115.53, 117.61], eng: "Right? You were snapping pics as soon as you walked in." },
            { id: 's46', speaker: '우창윤', kor: '어, 저 진짜 안 그러거든요.', time: [117.64, 119.20], eng: "Uh, I don't usually do that." },
            { id: 's47', speaker: '항성', kor: '교수님도 처음 와보셨죠?', time: [119.23, 120.38], eng: "Professor, it's your first time here too, right?" },
            { id: 's48', speaker: '김범준', kor: '예, 저는 얘기를 들었거든요.', time: [120.41, 121.83], eng: "Yeah, I'd heard about it." },
            { id: 's49', speaker: '김범준', kor: '그래서 너무 궁금했는데.', time: [121.87, 123.03], eng: "So I was super curious." },
            { id: 's50', speaker: '김범준', kor: '달 표면 그것도 인상적이었고.', time: [123.06, 124.96], eng: "The moon surface thing was impressive too." },
            { id: 's51', speaker: '김범준', kor: '여기는 화성인가요?', time: [124.99, 126.18], eng: "Is this Mars?" },
            { id: 's52', speaker: '항성', kor: '여기는 화성으로 꾸며놨습니다.', time: [126.21, 127.64], eng: "We decorated it to look like Mars." },
            { id: 's53', speaker: '항성', kor: '저희뿐만 아니라 요즘에 카페부터 시작해서, 그거 아세요?, 국밥집에서 팝니다.', time: [127.68, 132.66], eng: "It's not just us, starting from cafes these days... did you know? They sell it at soup rice places." },
            { id: 's54', speaker: '김범준', kor: '국밥집에서요? 디저트로 파는, 주는 건가요?', time: [132.70, 136.15], eng: "At a soup rice place? Do they sell it as dessert, or just give it to you?" },
            { id: 's55', speaker: '항성', kor: '매출이 엄청 올랐다고 그러더라고요.', time: [136.19, 138.23], eng: "I heard their sales skyrocketed." },
            { id: 's56', speaker: '항성', kor: '왜냐하면, 국밥을 먹어야만 살 수 있어요.', time: [138.26, 141.49], eng: "Because you can only buy it if you eat the soup rice." },
            { id: 's57', speaker: '김범준', kor: '\'두쫀쿠 주세요\' 하면 안 주고?', time: [141.51, 142.75], eng: "So if I say 'Give me a Dubai Cookie', they won't give it to me?" },
            { id: 's58', speaker: '항성', kor: '안 주고 ! 국밥을 먹어야지.', time: [142.78, 144.69], eng: "Nope! You gotta eat the soup." },
            { id: 's59', speaker: '우창윤', kor: '그래도 후식은 저는 그래도 과일이 나왔으면 좋겠어요. 사과.', time: [144.72, 148.18], eng: "Still, for dessert, I'd prefer fruit. Like an apple." },
            { id: 's60', speaker: '김범준', kor: '사과를 먹을 때도 우리가 아삭하는 그 청각이 굉장히 중요한 것 같긴 해요.', time: [148.21, 153.31], eng: "Even when eating an apple, that crunching sound seems really important." },
            { id: 's61', speaker: '우창윤', kor: '맞아요.', time: [153.34, 153.82], eng: "Exactly." },
            { id: 's62', speaker: '우창윤', kor: '왜 우리가 크리스피한 식감을 좋아하냐라고 했을 때 인류학자들이 하는 이야기가 있는데,', time: [153.85, 159.33], eng: "Anthropologists have a theory on why we love crispy textures," },
            { id: 's63', speaker: '우창윤', kor: '이게 \'아삭하다\'라는 소리가 나는 건요, 우리가 어떤 과일이나 어떤 채소를 먹었을 때 신선하다는 거.', time: [159.36, 166.50], eng: "That 'crunch' sound signals that the fruit or veggie is fresh." },
            { id: 's64', speaker: '우창윤', kor: '그럼 그게 안전하다는 뜻이고요.', time: [166.54, 167.78], eng: "And that means it's safe." },
            { id: 's65', speaker: '항성', kor: '오! 본능적인 거군요 약간.', time: [167.81, 170.02], eng: "Oh! So it's kinda instinctive." },
            { id: 's66', speaker: '우창윤', kor: '그런 것도 우리가 좋아하게 되어 있는데, 악용하는 거예요.', time: [170.05, 174.08], eng: "We're wired to like that, but this is exploiting it." },
            { id: 's67', speaker: '김범준', kor: '이건 신선하고는 상관없는데?', time: [175.74, 177.00], eng: "This has nothing to do with freshness though?" },
            { id: 's68', speaker: '우창윤', kor: '전혀 상관없어요.', time: [177.03, 178.37], eng: "Nothing at all." },
            { id: 's69', speaker: '우창윤', kor: '악용하는 거예요.', time: [179.01, 180.13], eng: "It's hacking the system." },
            { id: 's70', speaker: '우창윤', kor: '특히 한국인들이 굉장히 이런 식감이나 맛에 대해서 다양한 단어들도 있잖아요.', time: [180.16, 184.95], eng: "Especially Koreans, we have so many words for these textures and tastes." },
            { id: 's71', speaker: '김범준', kor: '우리 그 \'겉바속촉\', 이거는 뒤집힌 것 같아요.', time: [184.98, 189.30], eng: "Our 'Crispy outside, soft inside', this seems flipped." },
            { id: 's72', speaker: '항성', kor: '그렇죠. 그렇죠.', time: [189.31, 190.45], eng: "Right. Right." },
            { id: 's73', speaker: '김범준', kor: '겉촉속바.', time: [190.48, 192.92], eng: "Soft outside, crispy inside." },
            { id: 's74', speaker: '우창윤', kor: '그리고 그 바삭함이 소리도', time: [192.96, 194.69], eng: "And that crispiness, the sound too..." },
            { id: 's75', speaker: '김범준', kor: '네, 맞아요. 소리가 나요 소리가.', time: [194.70, 196.30], eng: "Yeah, exactly. It makes a sound." },
            { id: 's76', speaker: '우창윤', kor: '소리도 나게 되어 있고요.', time: [196.31, 197.46], eng: "It's designed to make a sound." },
            { id: 's77', speaker: '우창윤', kor: '그리고 단맛과 크리미한 맛이 같이 오죠.', time: [197.47, 199.90], eng: "Plus, the sweet and creamy flavors hit you together." },
            { id: 's78', speaker: '우창윤', kor: '소프트한 맛도 원래 굉장히 매력적으로 느끼는데 보통은 하나만 해야 돼요.', time: [199.91, 204.23], eng: "We find soft tastes attractive too, but usually you gotta pick one." },
            { id: 's79', speaker: '우창윤', kor: '과자나 이런 것들이 부드럽게 가는 쪽이라 바삭한 크리스피하게 가는 쪽이 있어요.', time: [204.24, 207.70], eng: "Snacks usually go either the soft route or the crispy route." },
            { id: 's80', speaker: '김범준', kor: '아, 그렇죠. 나뉘죠.', time: [207.71, 209.13], eng: "Ah, right. They're split." },
            { id: 's81', speaker: '우창윤', kor: '보통은 나뉘어요.', time: [209.14, 210.00], eng: "Usually they're split." },
            { id: 's82', speaker: '우창윤', kor: '그게 보통 국룰이었어요.', time: [210.01, 211.24], eng: "That was basically the unwritten rule." },
            { id: 's83', speaker: '항성', kor: '아 그쵸.', time: [211.25, 211.78], eng: "Ah, right." },
            { id: 's84', speaker: '김범준', kor: '근데 여기 이거는 이제 그거를...', time: [211.79, 213.07], eng: "But this, this one..." },
            { id: 's85', speaker: '우창윤', kor: '그거를 같이 넣은 거고,', time: [213.08, 214.11], eng: "It put them together." },
            { id: 's86', speaker: '우창윤', kor: '저는 별로 안 좋아하지만 이런 과자나 이런 쪽을 연구개발하는 쪽은 딱 씹었을 때 그 소리의 어떤 데시벨마저도 계속 연구하거든요.', time: [214.12, 221.59], eng: "I don't really like it, but R&D folks study the exact decibel of the crunch when you bite down." },
            { id: 's87', speaker: '항성', kor: '아, 그래요?', time: [221.60, 222.05], eng: "Oh, really?" },
            { id: 's88', speaker: '우창윤', kor: '어느 정도의 소리가 사람들이 가장 매력적으로 하게 하는지.', time: [222.06, 225.12], eng: "What sound level makes people find it most attractive." },
            { id: 's89', speaker: '우창윤', kor: '그런데 이제 점점 사람들이 너무나 다양한 식품 경험들을 하다 보니까 다감각적인 경험을 하게 해주는 게 좋다.', time: [225.13, 231.93], eng: "But since people are experiencing such diverse foods now, multi-sensory experiences are the way to go." },
            { id: 's90', speaker: '우창윤', kor: '그쪽으로 가고 있어요.', time: [232.00, 234.20], eng: "That's where the trend is heading." },
            { id: 's91', speaker: '우창윤', kor: '그게 어떻게 보면은 이제 \'두쫀쿠\'라는 걸로 우리나라에서 좀 이렇게 세상에 나와버린 거죠.', time: [234.21, 239.67], eng: "In a way, 'Dubai Chewy Cookie' is what brought this to light in Korea." },
            { id: 's92', speaker: '항성', kor: '이걸 만들고 하다 보니까 여기 들어가는 카다이프라든지 피스타치오 스프레드가 우리나라에서 주로 먹는 것들이 아니잖아요.', time: [239.68, 247.01], eng: "Making this, the Kataifi and pistachio spread aren't things we usually eat in Korea." },
            { id: 's93', speaker: '우창윤', kor: '아니죠.', time: [247.02, 247.61], eng: "No, they're not." },
            { id: 's94', speaker: '김범준', kor: '그럼 수입하는 거예요?', time: [247.62, 248.67], eng: "So, do you import them?" },
            { id: 's95', speaker: '항성', kor: '전부 수입하는 거예요.', time: [248.69, 249.97], eng: "We import everything." },
            { id: 's96', speaker: '항성', kor: '그러니까 비쌀 수밖에 없어', time: [249.98, 252.40], eng: "So it has to be expensive." },
            { id: 's97', speaker: '우창윤', kor: '원재료 자체가 비싸군요.', time: [252.51, 254.12], eng: "The raw ingredients themselves are pricey." },
            { id: 's98', speaker: '우창윤', kor: '그런데 사실 저는 이게 칼로리보다도 중요한 게 이 단맛과 기름맛이 섞여 있잖아요.', time: [254.13, 260.52], eng: "But actually, more important than calories, is that mix of sweet and oily tastes." },
            { id: 's99', speaker: '우창윤', kor: '이게 저는 진짜 위험하다고 항상 보거든요.', time: [261.13, 263.59], eng: "I honestly see this as really dangerous." },
            { id: 's100', speaker: '우창윤', kor: '단맛과 기름맛. 이게 결국 탄수화물이랑 지방인데,', time: [264.01, 267.86], eng: "Sweet and oily. That's carbs and fat," },
            { id: 's101', speaker: '우창윤', kor: '둘 다 인간 생존에 너무 필요한 두 가지 물질이어가지고.', time: [267.87, 271.96], eng: "Both are crucial for human survival." },
            { id: 's102', speaker: '항성', kor: '에너지원으로 좋은 거 아닌가요?', time: [271.97, 273.73], eng: "Aren't they good energy sources?" },
            { id: 's103', speaker: '우창윤', kor: '그러니까 당연히 원시에는 이런 탄수화물과 지방을 먹어야 이게 우리 생존 확률이 올라가니까', time: [273.74, 278.94], eng: "So naturally, back in primitive times, eating carbs and fats increased survival odds," },
            { id: 's104', speaker: '우창윤', kor: '뇌에서 먹었을 때 도파민과 엔돌핀이 나오도록 설계가 되어 있는데,', time: [278.95, 282.05], eng: "So our brains are designed to release dopamine and endorphins when we eat them." },
            { id: 's105', speaker: '우창윤', kor: '원래 있는 식품들에는 이 탄수화물이랑 지방이 이래서 반씩 섞여 있는 게 없어요.', time: [282.06, 287.19], eng: "But in natural foods, you don't find carbs and fats mixed half-and-half like this." },
            { id: 's106', speaker: '우창윤', kor: '사과 탄수화물 식이섬유 이쪽만 있고, 고기들은 대부분 다 단백질과 지방만 있고, 다 그래요.', time: [287.20, 294.02], eng: "Apples are carbs and fiber, meat is mostly protein and fat. It's usually like that." },
            { id: 's107', speaker: '우창윤', kor: '그런데 유일하게 2개 같이 있는 거는 견과류만 그래요.', time: [294.03, 296.73], eng: "The only thing that has both is nuts." },
            { id: 's108', speaker: '우창윤', kor: '그래서 이 두 개를 섞는 건 원래 반칙이에요.', time: [296.74, 298.92], eng: "So mixing these two is basically cheating." },
            { id: 's109', speaker: '우창윤', kor: '아까 말했던 미각 경험을 떠나서 우리의 뇌가 엄청난 보상 가중치를 줘요.', time: [298.94, 303.40], eng: "Beyond the taste experience, our brain gives it a huge reward weight." },
            { id: 's110', speaker: '우창윤', kor: '편의점 들어가서 초코바나 과자 보면은 탄수화물 지방이 반씩 들어있는 게 많아요.', time: [304.61, 308.90], eng: "If you look at chocolate bars or snacks in convenience stores, lots are half carbs, half fat." },
            { id: 's111', speaker: '항성', kor: '진짜 탄수화물 + 지방 이 조합은 맛이 없을 수 없는 조합이거든요.', time: [308.91, 314.11], eng: "Seriously, the carb + fat combo is a flavor you just can't hate." },
            { id: 's112', speaker: '김범준', kor: '아, 그렇구나', time: [314.12, 314.75], eng: "Ah, I see." },
            { id: 's113', speaker: '우창윤', kor: '그게 생존에 유리한 조합이었으니까요.', time: [314.76, 316.72], eng: "Because it was a survival-friendly combo." },
            { id: 's114', speaker: '우창윤', kor: '그래서 그 조합을 조금씩 뒤틀고 하는 게 나름의 레시피인 건데, 이거 보시면 딱 그 단맛과 기름 맛이 딱 섞여 있어요.', time: [316.73, 323.99], eng: "So tweaking that combo is a recipe in itself, and if you look at this, it's perfectly mixed sweet and oily." },
            { id: 's115', speaker: '우창윤', kor: '그래서 그 이야기 드려요. "배 부를 때 드시라, 차라리, 후식으로."', time: [324.00, 327.72], eng: "So I tell people, 'Eat it when you're full, like as dessert.'" },
            { id: 's116', speaker: '우창윤', kor: '왜냐하면, 배고픈 상태는 우리의 포만감의 호르몬이 낮아져 있는 상태예요.', time: [327.73, 331.73], eng: "Because when hungry, our satiety hormones are low." },
            { id: 's117', speaker: '우창윤', kor: '포만감의 호르몬이 낮아져 있다는 거는 사실 생존에 불리한 상황이죠.', time: [331.74, 335.47], eng: "Low satiety hormones actually mean a disadvantage for survival." },
            { id: 's118', speaker: '우창윤', kor: '이럴 때는 탄수화물과 지방에 대한 보상 가중치가 올라가요. 우리의 뇌가.', time: [335.48, 341.43], eng: "In that state, the brain increases the reward value for carbs and fats." },
            { id: 's119', speaker: '우창윤', kor: '그래서 그런데 포만 호르몬이 올라가져 있는 상태에서는 미각은 그대로여도 도파민의 분비가 좀 덜하게 되고, 나중에 생각이 덜 나는 거예요.', time: [341.44, 348.74], eng: "But if your satiety hormones are high, even if the taste is the same, dopamine release is lower, and you crave it less later." },
            { id: 's120', speaker: '우창윤', kor: '그래서 후식으로 먹었으면 좋겠다.', time: [349.89, 351.08], eng: "So I'd prefer you eat it as dessert." },
            { id: 's121', speaker: '김범준', kor: '그 얘기 들어보니까 맛있게 먹으려면 배고플 때 먹는 거네요.', time: [351.09, 354.65], eng: "Hearing that, to enjoy it most, I should eat it when hungry." },
            { id: 's122', speaker: '김범준', kor: '왜 저는 그거 반대로 이해하게 되지?', time: [354.66, 358.69], eng: "Why do I understand it the opposite way?" },
            { id: 's123', speaker: '항성', kor: '저는 어떻게 보이냐면은 이게 음식계의 BTS고요.', time: [358.70, 361.59], eng: "To me, this looks like the BTS of food." },
            { id: 's124', speaker: '항성', kor: '약간 케데헌(케이팝 데몬 헌터스)처럼 보이거든요.', time: [361.60, 364.19], eng: "Kind of like K-pop Demon Hunters (K-De-Heon)." },
            { id: 's125', speaker: '우창윤', kor: '잘 만들긴 했어요.', time: [364.20, 365.76], eng: "It is well-made." },
            { id: 's126', speaker: '항성', kor: '그런데 카다이프 자체는 어때요? 카다이프만으로는?', time: [365.77, 368.80], eng: "But what about the Kataifi itself? Just the Kataifi?" },
            { id: 's127', speaker: '항성', kor: '우리 소면하고 비교해보면 그렇게 다르지는 않지 않아요?', time: [368.81, 371.84], eng: "Compared to our somyeon (noodles), isn't it pretty similar?" },
            { id: 's128', speaker: '우창윤', kor: '원래 과거에는 밀가루로 만들었을 테니까.', time: [371.85, 375.47], eng: "Well, historically it would've been made with flour." },
            { id: 's129', speaker: '우창윤', kor: '밀가루는 오히려 과당이랑 다르게 분해되면 완전히 포도당이 돼 가지고 우리가 사용할 수 있는 에너지원이 온전히 돼요.', time: [375.48, 382.55], eng: "Unlike fructose, flour breaks down into pure glucose, becoming a complete energy source we can use." },
            { id: 's130', speaker: '우창윤', kor: '그래서 활동량이 많을 때는 사실 괜찮았죠.', time: [382.56, 385.35], eng: "So when activity levels were high, it was actually fine." },
            { id: 's131', speaker: '우창윤', kor: '카다이프가 가늘게 뽑아가지고, 이제 철판 같은 거에다가 가열해서 만들잖아요.', time: [385.36, 389.95], eng: "Kataifi is spun thin and cooked on a griddle, right?" },
            { id: 's132', speaker: '항성', kor: '그쵸 그쵸.', time: [389.96, 390.49], eng: "Right, right." },
            { id: 's133', speaker: '우창윤', kor: '그런데 여기도 이제는 밀가루랑 옥수수 전분 섞어요.', time: [390.50, 393.15], eng: "But now they mix flour and cornstarch." },
            { id: 's134', speaker: '우창윤', kor: '왜냐하면, 식감이 2개 다르거든요.', time: [393.16, 395.06], eng: "Because the textures are different." },
            { id: 's135', speaker: '우창윤', kor: '아밀로오스나 아밀로펙틴이랑 그 구조가 달라가지고, 옥수수 전분 들어가면은 이 튀겼을 때 바삭함이 더해져요.', time: [395.07, 401.36], eng: "Amylose and amylopectin structures differ, so adding cornstarch adds crispiness when fried." },
            { id: 's136', speaker: '우창윤', kor: '옛날엔 다 밀가루로만 했는데 이것마저도 이렇게 조절을 해요. 이제.', time: [401.37, 405.20], eng: "It used to be just flour, but even this is engineered now." },
            { id: 's137', speaker: '우창윤', kor: '그것도 버터에 튀겨요.', time: [405.21, 406.38], eng: "And they fry it in butter." },
            { id: 's138', speaker: '우창윤', kor: '이제는 그거를 막 버터에 튀기고, 막 추가하고 뭔가 더 하고 이래가지고, 정말 다른 목적으로 사용하니까 문제가 되는 거죠.', time: [408.04, 416.14], eng: "Now they fry it in butter, add stuff, do more to it... using it for a totally different purpose is where the problem lies." },
            { id: 's139', speaker: '우창윤', kor: '피스타치오. 피스타치오 되게 좋은 거죠.', time: [416.15, 418.31], eng: "Pistachio. Pistachios are great." },
            { id: 's140', speaker: '우창윤', kor: '피스타치오 저 엄청 좋아합니다.', time: [418.32, 420.08], eng: "I love pistachios." },
            { id: 's141', speaker: '항성', kor: '저 엄청 좋아해요.', time: [420.09, 421.20], eng: "I love them so much." },
            { id: 's142', speaker: '우창윤', kor: '비싸서 못 먹어요 피스타치오.', time: [421.20, 422.72], eng: "They're too expensive to eat." },
            { id: 's143', speaker: '우창윤', kor: '그런데 이제 그거를 갈아가지고, 땅에 발라먹기 쉬운 상태로 이제 스프레드로 만든 거예요.', time: [422.73, 427.89], eng: "But they ground it up and made it into a spread so it's easy to eat." },
            { id: 's144', speaker: '우창윤', kor: '끈적끈적한 느낌을 줘야 되잖아요.', time: [427.90, 429.95], eng: "You need that sticky feel." },
            { id: 's145', speaker: '우창윤', kor: '전분 같은 거 넣고 설탕이나 시럽 넣고, 그럼 이건 아예 다른 게 되는 거죠.', time: [429.96, 434.27], eng: "Add starch, sugar, or syrup, and it becomes something else entirely." },
            { id: 's146', speaker: '우창윤', kor: '피스타치오의 무엇이었던 걸 가지고, 아예 전혀 다른 무엇인가가 된 거예요.', time: [435.27, 439.77], eng: "It went from being pistachio to being something completely different." },
            { id: 's147', speaker: '우창윤', kor: '두 개를 섞어가지고 안을 만들고 그 다음에 마시멜로우 있잖아요.', time: [439.78, 446.01], eng: "Mix those two for the filling, and then there's the marshmallow." },
            { id: 's148', speaker: '우창윤', kor: '마시멜로우도 어떻게 만드냐면요.', time: [446.02, 447.71], eng: "You know how marshmallow is made?" },
            { id: 's149', speaker: '항성', kor: '어떻게 만들어요?', time: [447.72, 448.81], eng: "How is it made?" },
            { id: 's150', speaker: '우창윤', kor: '마시멜로우요?', time: [448.82, 449.78], eng: "Marshmallow?" },
            { id: 's151', speaker: '우창윤', kor: '포도당 시럽이나 설탕 시럽 같은 거 있죠.', time: [449.79, 452.85], eng: "You take glucose syrup or sugar syrup." },
            { id: 's152', speaker: '우창윤', kor: '여기에다가 젤라틴을 넣어요.', time: [452.86, 454.52], eng: "And add gelatin." },
            { id: 's153', speaker: '우창윤', kor: '젤라틴이 콜라겐 안에서 나온 단백질이잖아요.', time: [455.16, 457.72], eng: "Gelatin is protein from collagen." },
            { id: 's154', speaker: '우창윤', kor: '약간 용해시켜요.', time: [457.73, 458.82], eng: "Dissolve it a bit." },
            { id: 's155', speaker: '우창윤', kor: '그런 다음에 휘핑, 공기를 넣으면서 조리하는 거예요.', time: [458.83, 462.36], eng: "Then whip it, cooking it while adding air." },
            { id: 's156', speaker: '우창윤', kor: '휘핑돼서 이렇게 부풀면서 되게 부드러운 식감을 주는 거죠.', time: [462.37, 466.16], eng: "As it whips up, it expands and gives that soft texture." },
            { id: 's157', speaker: '우창윤', kor: '그러니까 식감과 혈당 반응으로 세팅된 거죠.', time: [466.17, 468.29], eng: "So it's set for texture and blood sugar response." },
            { id: 's158', speaker: '우창윤', kor: '그래서 뭐 마시멜로우라고 해서 다시 특별한 건 아니고 그냥 당덩어리.', time: [468.30, 473.00], eng: "So marshmallow isn't special, it's just a sugar lump." },
            { id: 's159', speaker: '김범준', kor: '우리나라 사람 좀 익숙해진 것도 있을 것 같아요.', time: [475.02, 477.27], eng: "I think Koreans have gotten used to it." },
            { id: 's160', speaker: '김범준', kor: '저도 처음에 두바이 초콜릿 먹었을 때는 그 식감이 너무 이상했어요.', time: [477.28, 480.97], eng: "When I first tried Dubai Chocolate, the texture was so weird." },
            { id: 's161', speaker: '김범준', kor: '\'모래 씹는 것 같은 걸 왜 사람들이 좋아하지? \'그랬는데,', time: [480.98, 483.98], eng: "I was like, 'Why do people like chewing sand?'" },
            { id: 's162', speaker: '김범준', kor: '이번에 이걸 다시 먹으니까 제가 이미 거기에 적응한 것 같아요.', time: [483.99, 487.78], eng: "But eating this again, I think I've adapted." },
            { id: 's163', speaker: '항성', kor: '그렇죠.', time: [487.79, 488.25], eng: "Right." },
            { id: 's164', speaker: '김범준', kor: '덜 불편해요. 씹히는 느낌이.', time: [488.26, 490.32], eng: "It's less uncomfortable. The chewing feeling." },
            { id: 's165', speaker: '항성', kor: '그리고 저는 이 사각사각거리는 게 골전도처럼 들리잖아요.', time: [490.33, 494.59], eng: "And this crunching sounds like bone conduction." },
            { id: 's166', speaker: '우창윤', kor: '맞아요. 맞아요.', time: [494.60, 495.32], eng: "Right, right." },
            { id: 's167', speaker: '항성', kor: '되게 괜찮아요. 진짜로.', time: [495.33, 497.53], eng: "It's pretty good. Seriously." },
            { id: 's168', speaker: '항성', kor: '그러니까 약간 맛도 맛인데 여러 가지 재미가 이렇게 다 섞여 있어요.', time: [497.54, 501.90], eng: "So besides the taste, there's a mix of different fun elements." },
            { id: 's169', speaker: '항성', kor: '저희는 같이 물리학회에 소속이 되어 있어요.', time: [501.91, 504.63], eng: "We're in the Physics Society together." },
            { id: 's170', speaker: '항성', kor: '거기서 아주 재미있는 재미있는 SNS 게시글을 올렸습니다.', time: [504.64, 508.87], eng: "There was a really fun post on SNS about it." },
            { id: 's171', speaker: '항성', kor: '두쫀쿠의 과학이라고 해가지고 하나하나 분석을 해놓은 게시글이 있었어요.', time: [508.88, 515.18], eng: "A post analyzing the science of Dubai Chewy Cookies point by point." },
            { id: 's172', speaker: '항성', kor: '일단 첫 번째가 점탄성입니다.', time: [515.19, 517.64], eng: "First up is viscoelasticity." },
            { id: 's173', speaker: '우창윤', kor: '점탄성이요?', time: [517.65, 518.34], eng: "Viscoelasticity?" },
            { id: 's174', speaker: '항성', kor: '네, 일단 점성은 아시겠죠? 끈끈함.', time: [518.35, 520.88], eng: "Yes, you know viscosity? Stickiness." },
            { id: 's175', speaker: '우창윤', kor: '아, 끈끈한 느낌.', time: [520.89, 521.59], eng: "Ah, that sticky feeling." },
            { id: 's176', speaker: '항성', kor: '이 안에 들어있는 게 스프레드가 다 점성이잖아요.', time: [521.60, 525.35], eng: "The spread inside is all viscous." },
            { id: 's177', speaker: '항성', kor: '근데 이 겉을 싸고 있는 이 마시멜로우가 고체도 아니고,', time: [526.00, 530.63], eng: "But the marshmallow wrapping it isn't solid," },
            { id: 's178', speaker: '항성', kor: '그렇다고 약간 이건 액체라고 하기도 그렇잖아요.', time: [530.64, 533.09], eng: "But calling it liquid is also weird." },
            { id: 's179', speaker: '김범준', kor: '이게 점성하고 탄성을 동시에 갖고 있는 물질인데,', time: [533.10, 536.97], eng: "It's a material with both viscosity and elasticity." },
            { id: 's180', speaker: '김범준', kor: '보통 액체는 점성은 있지만 탄성이 없고,', time: [536.98, 539.97], eng: "Usually liquids have viscosity but no elasticity," },
            { id: 's181', speaker: '김범준', kor: '보통 고체는 탄성은 있는데, 점성은 없잖아요.', time: [539.98, 542.71], eng: "And solids have elasticity but no viscosity." },
            { id: 's182', speaker: '김범준', kor: '점성과 탄성을 같이 갖고 있는 물질.', time: [542.72, 544.71], eng: "Material with both viscosity and elasticity." },
            { id: 's183', speaker: '우창윤', kor: '어쩌다가 이런 게.', time: [544.72, 546.14], eng: "How did this happen?" },
            { id: 's184', speaker: '항성', kor: '세상에 나오지 말아야 할 그런 녀석이 나와버렸고.', time: [546.15, 551.38], eng: "Something that shouldn't exist in this world just appeared." },
            { id: 's185', speaker: '항성', kor: '그리고 또 하나 이 안쪽에 고분자 네트워크라고 돼 있다라고 그러더라고요.', time: [551.39, 555.85], eng: "And they said inside is a polymer network." },
            { id: 's186', speaker: '항성', kor: '어? 안쪽이요?', time: [555.86, 556.58], eng: "Uh? Inside?" },
            { id: 's187', speaker: '항성', kor: '네, 왜냐하면 마시멜로우 젤라틴으로 만든다고 그랬잖아요.', time: [556.60, 559.15], eng: "Yeah, because marshmallow is made with gelatin." },
            { id: 's188', speaker: '항성', kor: '그 단백질이 가열되면은 사슬처럼 엉켜가지고 모양을 잡아준다고 그랬잖아요.', time: [559.16, 563.23], eng: "When that protein heats up, it tangles like chains to hold the shape." },
            { id: 's189', speaker: '항성', kor: '다 연결돼 있다가 식으면서', time: [563.24, 565.13], eng: "It's all connected, then as it cools..." },
            { id: 's190', speaker: '우창윤', kor: '그렇죠. 휘핑해가지고 공기 넣는 거죠.', time: [565.14, 566.99], eng: "Right. Whipping air into it." },
            { id: 's191', speaker: '항성', kor: '공기 넣고 식으면서 완전히 촘촘하게 엉겨 붙어서 마시멜로우 자체의 고분자 네트워크화가 되는 거예요.', time: [567.00, 573.60], eng: "Adding air and cooling makes it tangle tight, creating a polymer network within the marshmallow." },
            { id: 's192', speaker: '항성', kor: '그물망 구조 때문에 이 모양을 갖출 수가 있는 거예요.', time: [573.61, 576.87], eng: "That mesh structure lets it hold its shape." },
            { id: 's193', speaker: '항성', kor: '그래서 씹는 순간에는 고체처럼 버티다가', time: [576.88, 580.18], eng: "So when you bite, it resists like a solid," },
            { id: 's194', speaker: '항성', kor: '썰거나 먹기 시작하면 액체처럼 늘어나면서 점성과 탄성이 동시에 나타나는 거죠.', time: [580.19, 585.72], eng: "But as you cut or eat, it stretches like a liquid, showing both properties." },
            { id: 's195', speaker: '우창윤', kor: '쫄깃쫄깃하면서 뭔가 약간 다른 느낌들이 있긴 해요.', time: [585.73, 590.79], eng: "It's chewy but feels kinda different." },
            { id: 's196', speaker: '항성', kor: '좌굴 현상이라고 들어보셨습니까?', time: [590.80, 592.72], eng: "Have you heard of buckling?" },
            { id: 's197', speaker: '우창윤', kor: '전혀 모르겠어요.', time: [592.73, 593.76], eng: "No idea." },
            { id: 's198', speaker: '항성', kor: '우리 소면같이 이렇게 약간 휘다가 모양이 점점 더 휘는 게 아니라', time: [593.77, 600.09], eng: "Like somyeon noodles, they bend a bit, but instead of bending more..." },
            { id: 's199', speaker: '항성', kor: '어느 순간 일정 힘이 되면은 딱 부러지는 거잖아요.', time: [600.10, 603.00], eng: "At a certain force, they just snap." },
            { id: 's200', speaker: '항성', kor: '근데 그거가 나타나면서 이 카다이프가 바삭바삭.', time: [603.01, 607.06], eng: "When that happens, the Kataifi goes crunch." },
            { id: 's201', speaker: '김범준', kor: '근데 여러 개가 있으니까 우리가 누르면은 그게 하나가 부러지는 게 아니라', time: [607.07, 611.17], eng: "But since there are many, when we press, it's not just one breaking," },
            { id: 's202', speaker: '우창윤', kor: '엄청나게 많은 그 카다이프들이', time: [611.18, 612.38], eng: "A huge number of Kataifi strands..." },
            { id: 's203', speaker: '김범준', kor: '연속적으로 부러지면서', time: [612.39, 613.94], eng: "Breaking continuously," },
            { id: 's204', speaker: '우창윤', kor: '그러면서 소리가 파다닥 나는 거니까', time: [613.95, 615.96], eng: "Making that crackling sound." },
            { id: 's205', speaker: '김범준', kor: '소리, 그리고 바삭함 같은 거', time: [615.97, 618.25], eng: "The sound, and that crispiness." },
            { id: 's206', speaker: '항성', kor: '지금 우리가 과학이 아닌 얘기를 한 적이 없어요.', time: [618.26, 621.31], eng: "We haven't stopped talking science." },
            { id: 's207', speaker: '항성', kor: '\'생리학적으로 이게 얼마나 잘 만들어졌길래 위험한가\'에 대해서도 얘기를 했고,', time: [621.32, 627.32], eng: "We talked about 'physiologically, why is this well-made but dangerous'," },
            { id: 's208', speaker: '항성', kor: '과학적으로도 고분자 네트워크 들어왔고요.', time: [627.33, 630.89], eng: "And scientifically, polymer networks came up." },
            { id: 's209', speaker: '항성', kor: '점탄성 들어왔고, 좌굴 현상 들어왔어요.', time: [630.90, 633.49], eng: "Viscoelasticity came up, buckling came up." },
            { id: 's210', speaker: '항성', kor: '엄청나게 과학적인...', time: [633.50, 635.06], eng: "Super scientific..." },
            { id: 's211', speaker: '김범준', kor: '그래서 먹어야 되겠어요? 안 먹어야 되겠어요?', time: [635.07, 636.64], eng: "So, should we eat it? Or not?" },
            { id: 's212', speaker: '우창윤', kor: '식후에 드시면 좋겠다.', time: [638.11, 639.36], eng: "I'd recommend it after a meal." },
            { id: 's213', speaker: '항성', kor: '그리고 맛이 있으세요? 없으세요?', time: [639.37, 640.93], eng: "And is it tasty? Or not?" },
            { id: 's214', speaker: '김범준', kor: '맛도 있고', time: [640.94, 641.94], eng: "It's tasty." },
            { id: 's215', speaker: '우창윤', kor: '재밌어요.', time: [641.95, 642.80], eng: "It's fun." },
            { id: 's216', speaker: '우창윤', kor: '이게 감각을 되게 여러 개를 자극하기 때문에 궁금하신 분들은 친구들하고 같이 한번 경험해 보시고,', time: [642.81, 650.68], eng: "It stimulates so many senses, so if you're curious, try it with friends," },

            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 이벤트 위임 (#app 1회) ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const tab = app.activeTab;

            if (tab === 'video') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = VIDEO_SCRIPT_DATA.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans = learn.sbTrans || {}; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }
                    else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); }
                    else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); }
                }
                return;
            }
            if (tab === 'vocab') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, !cur); }
                return;
            }
            if (tab === 'quiz') {
                const tb = e.target.closest('[data-action="q-trans"]'); if (tb) { const qEl = tb.closest('.quiz-q'); const qid = +qEl.dataset.qid; const st = quizState.q[qid]; st.trans = !st.trans; rerenderQuizQ(qid); return; }
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const ok = st.input.trim() === (quiz.answer||quiz.correct_word); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = (quiz.answer||quiz.correct_word); st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        // video: 어휘 호버 팝업
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        // keyboard (video)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < VIDEO_SCRIPT_DATA.length && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[ni].time[0], true); learn.player.playVideo(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.error = null; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id);
            const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다. 학습자 답변을 분석하고 JSON으로만 답하세요. 순수 JSON만 반환하세요.\n[질문]: ${item.questionKor}\n[학습자 답변]: ${st.text}\n[포맷]: {"overallPraise":"","overallPraiseTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const data = await callGeminiWithBackoff(payload); let txt = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text; if (!txt) throw new Error('응답이 비어있습니다.'); txt = txt.replace(/^```json\n?/, '').replace(/\n?```$/, ''); st.feedback = JSON.parse(txt); }
            catch (err) { st.error = err.message; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 시작 ----------
        buildApp();
    })();
    </script>
</body>
