    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}

            // items = 범례 순서(2열 그리드) · chartOrder = 원형 차트에서 12시 방향부터 시계방향으로 그릴 순서(items 인덱스)
            items:[

                { label:"잘 모르겠어", count:47, pct:"2.0%", color:"rgb(243,174,89)" }
            ], chartOrder:[1,2,0,3] };
        const READING_DATA = [ { id:1, thumb:"https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/b2plus-no-x-zones.webp", title:"‘노키즈존’에 이은 ‘노남학생존’ 등장?<br>“차별이자 혐오야!” vs. “사장님 마음이야!”", subtitle:"뉴닉 · 2026. 9. 11.", source:"https://newneek.co/@pizzastation/article/45514", cardTitle:"‘노키즈존’에 이은 ‘노남학생존’", cardDesc:"특정 집단의 출입을 막는 ‘노○○존’, 차별일까요, 사장님의 자유일까요?", content:[
            { isHeading:true, text:"이슈 맛보기", trans:"A Taste of the Issue" },
            { text:"얼마 전에 인터넷을 시끌시끌하게 만든 소식 들었나요? 한 카페가 ‘중고등 남학생 무리 매장 이용 금지’ 안내문을 붙여 논란이 된 건데요. 욕설을 하거나 매장을 어지럽혀 다른 손님에게 불쾌감을 준다는 이유가 적혀 있었다고. 이를 두고 “오죽했으면 사장님이 출입을 막았겠어?”라는 반응과 “일부 학생의 문제를 이유로 남학생 전체를 막는 건 차별이야!”라는 반응이 동시에 나오고 있어요. 어린이의 출입을 막는 ‘노키즈존’을 시작으로 노시니어존·노타투존 등을 거쳐 ‘노남학생존’까지 생겨버린 것.", trans:"Did you hear the news that set the internet buzzing recently? A café caused a stir by putting up a notice banning 'groups of middle- and high-school boys' from the shop. The reason given was that they swear or make a mess, making other customers uncomfortable. Some people are reacting with 'The owner must have been really desperate to ban them,' while others say 'Blocking all boys because of a few students is discrimination!' Starting with the 'no-kids zone,' which keeps out children, and passing through no-senior zones and no-tattoo zones, we've now ended up with a 'no-schoolboys zone.'" },
            { text:"이런 특정 집단을 통째로 출입 금지하는 ‘노○○존’이 바람직하지 않다는 쪽은 특정 집단을 통째로 출입 금지하는 건 차별이자 지나친 결정이라고 말해요. 일부 사람의 문제 행동을 나이·성별 등 집단 전체의 특성으로 일반화하면 누구나 언젠가 배제의 대상이 될 수 있다는 거예요.", trans:"Those who think these 'no-○○ zones,' which ban an entire group, are undesirable say that banning a whole group is discrimination and goes too far. If you generalize a few people's bad behavior as a trait of a whole group, defined by age or gender, then anyone could one day become a target of exclusion." },
            { text:"반면 ‘노○○존’을 어느 정도 이해할 수 있다는 쪽에서는 매장 주인에게도 원하는 방식으로 가게를 운영할 자유와 선택권이 있다고 말해요. 실제로 특정 손님의 행동 때문에 다른 손님이 불편을 겪거나 안전·영업에 문제가 생긴다면 사장님이 이를 막을 방법도 필요하다는 것. 이런 ‘노○○존’에 대한 여러분의 생각은 어떤가요?", trans:"On the other hand, those who can understand 'no-○○ zones' to some degree say that shop owners also have the freedom and the right to choose how they run their business. If certain customers' behavior actually inconveniences other customers or causes safety or business problems, the owner needs a way to stop it. What do you think about these 'no-○○ zones'?" },
            { text:"9월 7일부터 10일까지, 4일 동안 2200명이 넘는 사람들이 ‘노○○존’에 관한 생각을 남겨줬어요.", trans:"Over four days, from September 7 to 10, more than 2,200 people shared their thoughts on 'no-○○ zones.'" },
            { isChart:true },
            { isHeading:true, text:"노○○존, 언제 어떻게 생겼어?", trans:"No-○○ zones: when and how did they start?" },
            { text:"‘노○○존’은 특정 대상의 출입을 제한하는 공간을 뜻하는데요. 어디서부터 어떻게 등장한 건지 배경을 자세히 살펴보면:", trans:"A 'no-○○ zone' means a space that restricts entry for a particular group. Let's take a closer look at where and how they came about:" },
            { isBullet:true, text:"뜨거운 논란 ‘노키즈존’의 등장: ‘노○○존’은 어린이의 출입을 제한하는 ‘노키즈존’으로부터 본격적으로 시작됐어요. 공공장소에서 일부 부모가 아이의 행동을 제대로 통제하지 않는 사례가 알려지면서 2010년대 카페·식당을 중심으로 생겨났는데요. 한 식당에서 종업원과 아이가 부딪치면서 아이가 화상을 입은 사고에 대해 “영업장 주인에게 책임이 있으니 배상금을 지급해야 해!”라는 법원 판결이 나온 2014년쯤부터 본격적으로 퍼지기 시작한 것으로 보여요. 지난 2023년 기준 보건복지부가 파악한 노키즈존은 558곳에 달해요.", trans:"The arrival of the hotly debated 'no-kids zone': No-○○ zones really began with the 'no-kids zone,' which restricts children. They appeared in the 2010s, mainly in cafés and restaurants, as cases of some parents not properly controlling their children in public places became known. They seem to have spread in earnest from around 2014, when a court ruled that 'the business owner is responsible and must pay compensation' for an accident in which a child was burned after colliding with a server in a restaurant. As of 2023, the Ministry of Health and Welfare counted as many as 558 no-kids zones." },
            { isBullet:true, text:"노○○존, 어디까지 생기는 건데…?: 그 이후 특정 영업장을 둘러싸고 출입 제한의 대상과 이유는 점점 다양해졌어요. 고령자의 출입을 제한하는 ‘노시니어존’, 중년층을 대상으로 한 ‘노중년존’, 문신한 사람을 막는 ‘노타투존’처럼 특정 연령·집단을 제한하는가 하면, 매장에서 공부하는 손님을 제한하는 ‘노스터디존’, 유튜버를 막는 ‘노튜버존’도 등장했어요. 최근에는 욕설이나 매장을 어지럽히는 행동 등을 이유로 중·고등학교 남학생 무리의 이용을 막는 ‘노남학생존’까지 나타났다고.", trans:"No-○○ zones — how far will this go…?: Since then, the targets of and reasons for entry restrictions at particular businesses have grown more and more varied. Some restrict certain ages or groups, like the 'no-senior zone' for older people, the 'no-middle-age zone' aimed at middle-aged people, and the 'no-tattoo zone' that keeps out people with tattoos; others, like the 'no-study zone' that restricts customers who study in the shop and the 'no-YouTuber zone,' have appeared too. Most recently, a 'no-schoolboys zone' has even emerged, blocking groups of middle- and high-school boys on the grounds of swearing or making a mess." },
            { isHeading:true, text:"노○○존 둘러싸고 어떤 말이 나와?", trans:"What are people saying about no-○○ zones?" },
            { text:"이렇게 ‘노○○존’이 여러 형태로 퍼지면서 관련 문제에 대한 논쟁도 복잡해지고 있어요. 매장 운영에 어려움을 주는 손님을 제한할 수 있는 사장님의 권리와 자율성을 어디까지 인정할지, 반대로 일부의 문제 행동을 이유로 특정 집단 전체를 배제하는 것이 정당한지를 두고 의견이 계속 엇갈리는 거예요.", trans:"As no-○○ zones spread in many forms, the debate around them is getting more complicated. Opinions keep clashing over how far to recognize an owner's right and autonomy to restrict customers who make running the shop difficult — and, conversely, whether it is fair to exclude an entire group because of a few people's behavior." },
            { isBullet:true, text:"“사장님도 손님을 선택할 권리가 있어!”: 노○○존이 어느 정도 필요하다는 쪽에서는 업장의 주인에게도 매장을 원하는 방식으로 운영할 권리가 있다고 말해요. 특히 노키즈존의 경우 아이들의 부주의한 행동으로 안전사고가 발생하거나 다른 손님이 불편을 겪을 수 있는 만큼, 이를 예방하기 위한 선택이라는 것. 실제로 한 조사에서는 성인 1000명 중 73%가 사고 예방 등의 이유로 노키즈존을 허용할 수 있다고 답하기도 했는데요. 노스터디존·노유튜버존 같은 경우도 오랜 시간 자리를 차지하거나 다른 손님에게 불편을 줄 수 있는 행동을 제한하려는 사장님의 선택으로 볼 수 있다는 시각이 나와요.", trans:"'Owners have the right to choose their customers too!': Those who think no-○○ zones are needed to some degree say business owners also have the right to run their shop the way they want. With no-kids zones in particular, since children's careless behavior can cause safety accidents or inconvenience other customers, it's a choice made to prevent that. In one survey, 73% of 1,000 adults said they could accept no-kids zones for reasons such as accident prevention. Some also see no-study and no-YouTuber zones as an owner's choice to limit behavior that takes up seats for a long time or can bother other customers." },
            { isBullet:true, text:"“일부의 문제로 모두를 막는 건 차별이야!”: 특정 집단 전체의 출입을 막는 방식은 엄연한 차별이라는 지적도 많은데요. 노키즈존이 늘어나면 아이와 함께 갈 수 있는 공간이 줄어드는 동시에, 어린이 역시 자신이 환영받지 못한다는 경험을 하며 위축될 수 있다는 것. 특히 노시니어존·노중년존·노남학생존처럼 나이·성별 등을 기준으로 출입을 막는 사례가 등장하면서, 일부의 문제 행동을 집단 전체의 특성으로 일반화해 배제하는 건 지나치다는 지적도 나와요. 이런 배제가 자연스럽게 받아들여지면 또 다른 ‘노○○존’으로 이어질 수 있다는 우려도 있어요.", trans:"'Blocking everyone because of a few is discrimination!': Many point out that barring an entire group is plain discrimination. As no-kids zones increase, there are fewer places to go with children, and children themselves may shrink back after experiencing not being welcome. Especially now that places block entry based on age or gender — no-senior, no-middle-age and no-schoolboys zones — critics say it goes too far to generalize a few people's behavior as a trait of the whole group and exclude them. There are also worries that if this kind of exclusion becomes normal, it could lead to yet more 'no-○○ zones.'" },
            { isHeading:true, text:"의견 맛보기: “노○○존, 어떻게 생각해요?”", trans:"A Taste of Opinions: 'What do you think of no-○○ zones?'" },
            { isSubHeading:true, text:"바람직하지 않아 (8.5%, 198명)", trans:"It's not desirable (8.5%, 198 people)" },
            { text:"일부의 문제 행동 때문에 해당 집단 전체를 출입 금지하는 건 차별적이고 부당하다는 의견이 주를 이뤘어요.", trans:"Most said it is discriminatory and unfair to ban an entire group because of a few people's behavior." },
            { isBullet:true, text:"Tostool: 노○○존을 주장하고 이에 동조하는 행위의 본질은 혐오감정이라고 생각해. 그래서 노○○존을 만드는 건 바람직하지 않다고 봐. 이 문제를 법적으로 제재해야 한다고 생각하지는 않지만, 어느 정도 따가운 시선을 받는 건 당연하다고 생각해.", trans:"Tostool: I think that at its core, pushing for no-○○ zones and going along with them comes from feelings of hatred. So I don't think creating them is desirable. I don't think it should be punished by law, but it's only natural that people doing it get some disapproving looks." },
            { isBullet:true, text:"혜진: 사장님 입장에서는 충분히 그럴 수 있다고 생각해. 하지만 이렇게 일반화해서 특정 집단을 배제하면 결국 이 사회에서는 누구도 자유롭게 서비스를 누릴 수 없을 거야. 그래서 아예 다 묶어서 배제하기보다는 규제와 제도 같은 것들이 좀 더 발전했으면 좋겠어. 가게에 피해를 주었을 때 제대로 처벌 받을 수 있다는 인식이 생기면 사장님도 편하고, 나중에 재발을 방지하는 효과도 있을 것 같아.", trans:"Hyejin: From the owner's point of view, I totally get it. But if we generalize like this and exclude certain groups, in the end nobody in this society will be able to enjoy services freely. So instead of lumping everyone together and shutting them out, I wish rules and systems would develop more. If people came to understand that you can actually be punished for causing damage to a shop, it would be easier for owners and would also help prevent it from happening again." },
            { isBullet:true, text:"베타뮤: 이런 식의 노ㅇㅇ존을 허용하기 시작하면 사회 전체에 특정 집단을 배척하는 분위기가 퍼질 수 있어. \"그들은 배척받을 만해\"라고 생각하는 사람도 있겠지만, 그 기준을 누가 정할 수 있는 건지 한번 생각해봐. 해외여행 가서 동양인 출입 금지 식당을 보면 어떤 기분이 들까?", trans:"Betamu: If we start allowing no-○○ zones like this, a mood of shutting out certain groups could spread through the whole society. Some people may think \"they deserve to be shut out,\" but think about who gets to set that standard. How would you feel if you traveled abroad and saw a restaurant that bans Asians?" },
            { isSubHeading:true, text:"어느 정도 이해돼 (75.1%, 1,745명)", trans:"I understand it to some degree (75.1%, 1,745 people)" },
            { text:"자영업자가 반복적인 민폐나 영업 피해를 막기 위해 특정 손님을 제한할 권리가 있고, 그런 조치는 어느 정도 이해된다는 의견이 주를 이뤘어요.", trans:"Most said self-employed owners have the right to restrict certain customers to prevent repeated nuisance or business damage, and that such measures are understandable to some degree." },
            { isBullet:true, text:"뽀룽: 이번 일로 다른 남학생들이 차별을 겪는 건 사실이지만, 경고나 제재가 효과가 없으니 사장님이 특별한 조치를 취한 것 같아. 카페에서 욕설을 하거나 다른 사람에게 불쾌감을 주는 행동을 하는 사람들을 사장이 매번 쫓아낼 수는 없으니까. 물론 피해를 보는 무고한 남학생들도 있겠지만, 다른 손님들이 편하게 이용할 수 있는 기회가 될 수도 있어. 자신의 가게니까 노○○존을 만드는 건 개인의 자유라고 생각해.", trans:"Bboroong: It's true that other boys face discrimination because of this, but I think the owner took special measures because warnings and penalties didn't work. The owner can't kick out every person who swears or makes others uncomfortable in the café every single time. Of course some innocent boys will lose out, but it could also give other customers a chance to use the place comfortably. It's their own shop, so I think making a no-○○ zone is a personal freedom." },
            { isBullet:true, text:"익명: 어떤 사업이든 영업 대상을 정하는 건 자연스러운 일이야. 사장님에게도 영업 방식을 정할 자유가 있으니까. 게다가 안전 문제나 다른 손님과의 마찰 같은 운영상의 이유로 제한하는 거라면, 그건 정당한 영업 재량의 범위 내에 있다고 생각해.", trans:"Anonymous: In any business, deciding who your customers are is natural. Owners have the freedom to decide how they do business, too. And if the restriction is for operational reasons like safety or friction with other customers, I think that's within the range of legitimate business discretion." },
            { isBullet:true, text:"기라리: 한 번이든 여러 번이든 영업에 방해가 되고 감당하기 어려운 고객이라면 사장님이 물건이나 서비스를 판매하지 않기로 결정하는 건 자유라고 생각해. 소비자도 마음에 들지 않으면 재방문하지 않거나 불매하잖아. 사장님에게도 기본적인 선택의 자유가 보장되어야 더 나은 방향으로 발전하지 않을까?", trans:"Girari: Whether it's once or many times, if a customer gets in the way of business and is hard to handle, I think the owner is free to decide not to sell them goods or services. Consumers don't come back or boycott a place if they don't like it, right? Shouldn't owners also be guaranteed a basic freedom of choice so things can move in a better direction?" },
            { isSubHeading:true, text:"다른 방법이 필요해 (14.4%, 334명)", trans:"We need another way (14.4%, 334 people)" },
            { text:"일부 학생들의 문제 행동 때문에 특정 연령대나 성별 전체를 출입 금지하는 것은 차별적이고 부당하다는 의견이 주를 이뤘어요.", trans:"Most said it is discriminatory and unfair to ban an entire age group or gender because of a few students' behavior." },
            { isBullet:true, text:"연우: 한 가게의 불편함에 대해 소비자 입장에서 공감할 수 있지만, 사장님이 가게를 운영하는 방식에 대해 제재할 수는 없다고 생각해. 하지만 우리가 살아가는 이 사회가 그런 편하지 않은 부분들을 단순히 배제하면서 돌아갈 수 있을까? 과연 이런 방식이 지속 가능할까 하는 회의감이 들어.", trans:"Yeonwoo: As a consumer I can relate to a shop's frustration, and I don't think anyone can penalize how an owner runs their shop. But can the society we live in keep working by simply shutting out the parts that are uncomfortable? I'm doubtful this approach is really sustainable." },
            { isBullet:true, text:"햇살냥: 무조건 특정 성별이나 나이대 집단의 출입을 막는 건 아닌 것 같고, 대신 불쾌한 언행이 있을 경우 퇴장을 요청하는 식으로 행동에 초점을 맞춘 규정을 만들어야 한다고 생각해. 그렇게 해야 혐오가 줄어들 것 같아.", trans:"Haetsalnyang: Blindly barring a whole gender or age group doesn't seem right. Instead, I think there should be rules focused on behavior — for example, asking people to leave if they say or do something offensive. That's how hatred will decrease." },
            { isBullet:true, text:"유희: 문제가 되는 건 ‘중고등학교 남학생 무리’라는 존재가 아니라 일부 학생들의 잘못된 행동이라고 생각해. 그렇다면 ‘욕설·소란 등 다른 손님에게 피해를 주는 행동을 하지 말아주세요’처럼 행동을 기준으로 제한하는 게 더 적절하지 않을까? 잘못된 행동에는 제재가 필요하지만, 일부의 행동만으로 그 행동을 하지 않은 집단 전체를 제한하는 건 또 다른 문제라고 봐.", trans:"Yuhui: I think the problem isn't the existence of 'groups of middle- and high-school boys' but the wrong behavior of some students. Then wouldn't it be more appropriate to restrict based on behavior, like 'Please don't swear, make noise, or otherwise disturb other customers'? Wrong behavior needs consequences, but restricting a whole group, most of whom didn't do anything, because of a few is another problem." },
            { isHeading:true, text:"이런 것도 생각해보자", trans:"Let's also think about this" },
            { isBullet:true, text:"노키즈존, 노시니어존, 노남학생존처럼 점점 더 많은 배제가 생기는 사회가 과연 옳은 걸까? 이렇게 살면서 배제를 당한 사람들은 또 다른 이들에게도 배제를 가해도 된다는 인식을 가지게 될 거야. \"내가 당했으니 너도 당해라\"는 식일 수도 있고.", trans:"Is a society where more and more exclusion keeps appearing — no-kids zones, no-senior zones, no-schoolboys zones — really right? People who've been excluded this way will come to think it's okay to exclude others too. It could be a kind of 'I went through it, so you should too.'" },
            { isBullet:true, text:"피해자 입장이 되어보면 이해할 수밖에 없어. 나 역시도 아이들을 대상으로 한 업장을 하다 접었고 그 이후로 트라우마처럼 아이들만 보면 힘들어. 차별적인 처사인거 모르는 건 아닌데, 업주 입장에서는 어쩔수 없는 일이야.", trans:"If you put yourself in the victim's shoes, you can't help but understand. I also ran a business for children and ended up closing it, and ever since, just seeing kids is hard for me, almost like a trauma. It's not that I don't know it's discriminatory treatment, but from the owner's side, there's no other choice." },
            { isBullet:true, text:"아이들도 다 알 것 같아. 노키즈존을 보면 세상에서 어른들의 시선이 어떤지 깨닫게 되잖아. 그런 아이들은 또 다른 아이들을 그렇게 보게 될 거야.", trans:"I think kids know it all. When they see a no-kids zone, they realize how adults in the world see them. And those kids will end up seeing other kids the same way." },
            { isHeading:true, text:"음미해보기", trans:"Food for Thought" },
            { isSubHeading:true, text:"노○○존, 다른 나라에는 없는 현상이라고?", trans:"No-○○ zones: a phenomenon other countries don't have?" },
            { text:"해외에서도 어린이의 방문을 제한하는 ‘성인 전용(Adult-only)’ 공간이나 조용한 이용을 위한 ‘Quiet zone’ 등을 간혹 찾아볼 수 있다고 하는데요. 하지만 일부 휴양지나 비행기 내 공간 등이 대상이고, 한국처럼 ‘노키즈존’을 비롯해 노시니어존·노아줌마존·노외국인존 등 특정 집단의 출입을 공공연하게 막는 공간이 다양한 형태로 있는 건 찾아보기 드물다고. BBC·CNN 등 외신은 이런 한국의 ‘노○○존’ 현상을 조명하기도 했는데요. 서양의 경우 인종, 계층 등을 둘러싼 차별이 큰 사회적 갈등으로 번진 역사를 겪은 만큼 혐오나 차별적인 표현을 특히 경계하는 분위기가 있다고. 반면 한국의 ‘노○○존’ 확산은 개인의 권리와 자유는 빠르게 발전했지만 평등·포용과 같은 공공의 가치와 조화를 이루지 못한 사회상을 보여준다는 분석도 나와요.", trans:"Abroad, too, you can occasionally find 'adult-only' spaces that restrict children or 'quiet zones' for quiet use. But these apply only to some resorts or areas inside airplanes; it's rare to find, as in Korea, so many kinds of spaces that openly keep out specific groups — starting with no-kids zones, and including no-senior, no-ajumma and no-foreigner zones. Foreign media such as the BBC and CNN have shone a spotlight on Korea's no-○○ zone phenomenon. In the West, having gone through a history in which discrimination over race and class grew into major social conflict, there is a particular wariness toward hateful or discriminatory expressions. Some analysts, by contrast, say the spread of no-○○ zones in Korea reveals a society where individual rights and freedoms developed quickly but have not been brought into harmony with public values like equality and inclusion." },
            { isSubHeading:true, text:"노○○존, 생각해봐야 할 진짜 문제는…", trans:"No-○○ zones: the real problem to think about is…" },
            { text:"전문가들은 영업장과 손님 중 어느 한쪽의 권리만 앞세우기보다 ‘어떻게 함께 이용할 수 있을지’에 대해 고민해야 한다고 말해요. 어린이 안전사고가 걱정된다는 이유로 어린이 전체의 출입을 막는 식의 대응은 위험을 해결하는 게 아니라 회피하는 것이고, 같은 논리라면 노인이나 장애인 등 다른 집단도 얼마든지 배제할 수 있다는 거예요. 하나의 배제를 당연하게 받아들이기 시작하면 ‘깨진 유리창 이론’처럼 차별이 더 넓게 퍼져 언젠가는 누구든 그 대상이 될 수 있다는 걱정도 나오고요. 손님은 공공질서와 예절을 지키고, 영업주는 주의 사항을 충분히 안내하는 등 서로의 권리를 존중하려는 노력도 필요하다는 제안도 나와요.", trans:"Experts say that rather than putting only one side's rights first — the business's or the customers' — we should think hard about 'how we can all use these places together.' Barring all children because of worries about child safety accidents avoids the risk rather than solving it, and by the same logic, any other group — the elderly, people with disabilities — could be excluded. There are also concerns that once we start accepting one kind of exclusion as normal, discrimination will spread further, like in the 'broken windows theory,' until anyone could become its target. Some also suggest that both sides need to make an effort to respect each other's rights: customers keeping public order and manners, and business owners clearly informing people of the rules." }
        ] } ];
        const VOCAB_READING_DATA = [
            { term:"시끌시끌하다", mainDef:"어떤 곳이 시끌시끌하면, 여러 사람이 떠들어서 아주 시끄럽다는 뜻이에요.", contextDef:"많은 사람이 인터넷에서 이 이야기를 하며 크게 떠들었다는 뜻으로 쓰였어요.", variants:["시끌시끌하게"], subDefs:[], examples:[{kor:"점심시간이 되자 식당 안이 시끌시끌해졌어요.", eng:"When lunchtime came, the restaurant got really noisy."}], translations:{ en:{ term:"to be noisy, to be buzzing", mainDef:"if a place is buzzing, many people are talking at once and it is very loud.", contextDef:"Used here to say that lots of people were loudly talking about this story online." } } },
            { term:"남학생 무리", mainDef:"남학생 무리는 함께 몰려다니는 남자 학생 여러 명이에요.", contextDef:"카페 안내문에 적힌 말로, 중학생과 고등학생 남자아이들이 여럿이 같이 오는 경우를 가리켜요.", variants:["남학생 무리"], subDefs:[{subTerm:"• 무리", subDef:"여러 사람이나 동물이 한곳에 모여 있는 것이에요. 예) 새 무리, 학생 무리."}], examples:[{kor:"공원에서 자전거를 탄 남학생 무리가 지나갔어요.", eng:"A group of schoolboys on bikes went past in the park."}], translations:{ en:{ term:"a group of schoolboys", mainDef:"several male students who go around together.", contextDef:"The wording on the café's notice, meaning middle- and high-school boys coming in as a group.", subDefs:[{term:"무리", def:"a group of people or animals gathered in one place; e.g. a flock of birds, a group of students."}] } } },
            { term:"매장", mainDef:"매장은 물건이나 음식을 파는 가게예요.", hanja:"매(賣 팔다) + 장(場 마당)", contextDef:"논란이 된 카페 안의 공간을 가리켜요.", variants:["매장"], subDefs:[], examples:[{kor:"이 매장은 밤 10시까지 문을 열어요.", eng:"This store is open until 10 p.m."}], translations:{ en:{ term:"store, shop", mainDef:"a shop that sells goods or food.", contextDef:"Refers to the inside of the café at the center of the controversy." } } },
            { term:"안내문", mainDef:"안내문은 사람들에게 꼭 알아야 할 내용을 적어서 붙이거나 나눠 주는 글이에요.", hanja:"안(案 생각) + 내(內 안) + 문(文 글)", contextDef:"카페 문에 붙인, 남학생 여럿은 들어오지 말라는 종이를 가리켜요.", variants:["안내문"], subDefs:[], examples:[{kor:"엘리베이터에 점검 안내문이 붙어 있어요.", eng:"There's a maintenance notice posted in the elevator."}], translations:{ en:{ term:"notice, sign", mainDef:"a written message posted or handed out to tell people something they need to know.", contextDef:"The paper posted at the café saying groups of schoolboys may not come in." } } },
            { term:"논란이 되다", mainDef:"어떤 일이 논란이 되면, 그 일을 두고 사람들이 옳다, 그르다 하며 크게 다툰다는 뜻이에요.", contextDef:"카페의 안내문을 두고 인터넷에서 찬성과 반대가 크게 부딪쳤다는 뜻이에요.", variants:["논란이 된"], subDefs:[{subTerm:"• 논란(論難)", subDef:"논(論, 말하다) + 란(難, 어렵다). 사람들이 여러 의견을 내며 서로 다투는 것이에요."}], examples:[{kor:"그 배우의 말이 온라인에서 논란이 됐어요.", eng:"That actor's comment became controversial online."}], translations:{ en:{ term:"to become controversial, to cause a stir", mainDef:"if something causes a stir, people argue loudly over whether it is right or wrong.", contextDef:"People online argued strongly for and against the café's notice.", subDefs:[{term:"논란 (論難)", def:"논 (論, speak) + 란 (難, difficult): a dispute in which people put forward different opinions."}] } } },
            { term:"욕설", mainDef:"욕설은 남을 기분 나쁘게 하는 아주 나쁜 말이에요.", hanja:"욕(辱 욕되다) + 설(說 말씀)", contextDef:"남학생들이 카페에서 나쁜 말을 크게 했다는 뜻이에요.", variants:["욕설"], subDefs:[], examples:[{kor:"경기 중에 욕설을 한 선수가 경고를 받았어요.", eng:"The player who swore during the game got a warning."}], translations:{ en:{ term:"swearing, curse words", mainDef:"very rude words that insult or upset other people.", contextDef:"The boys used foul language loudly in the café." } } },
            { term:"어지럽히다", mainDef:"누군가가 어떤 곳을 어지럽히면, 물건을 여기저기 늘어놓아 지저분하게 만든다는 뜻이에요.", contextDef:"남학생들이 카페를 지저분하게 만들었다는 이유를 말해요.", variants:["어지럽혀","어지럽히는"], subDefs:[], examples:[{kor:"동생이 제 방을 또 어지럽혔어요.", eng:"My little brother messed up my room again."}], translations:{ en:{ term:"to mess up, to make a mess of", mainDef:"if you mess up a place, you leave things everywhere and make it untidy.", contextDef:"One of the reasons given: the boys left the café messy." } } },
            { term:"불쾌감", mainDef:"불쾌감은 기분이 좋지 않고 싫은 느낌이에요.", hanja:"불(不 아니다) + 쾌(快 기쁘다) + 감(感 느끼다)", contextDef:"다른 손님들이 남학생들의 행동 때문에 기분이 나빴다는 뜻이에요.", variants:["불쾌감"], subDefs:[], examples:[{kor:"큰 소리로 통화하면 옆 사람에게 불쾌감을 줄 수 있어요.", eng:"Talking loudly on the phone can make the people next to you uncomfortable."}], translations:{ en:{ term:"displeasure, discomfort", mainDef:"an unpleasant feeling of being bothered or annoyed.", contextDef:"Other customers felt uncomfortable because of the boys' behavior." } } },
            { term:"오죽했으면", mainDef:"'오죽했으면'은 얼마나 힘들고 어려웠으면 그렇게까지 했겠느냐는 뜻이에요.", contextDef:"사장님이 정말 참기 힘들어서 남학생들을 막았을 거라고 사장님 편을 드는 말이에요.", variants:["오죽했으면"], subDefs:[{subTerm:"• 오죽", subDef:"'얼마나'라는 뜻으로, 주로 '오죽하다', '오죽했으면'처럼 써요."},{subTerm:"• -았/었으면", subDef:"지난 일을 가정하며 '그 정도였기 때문에'라는 느낌을 줘요. 예) 오죽 배가 고팠으면, 오죽 아팠으면."}], examples:[{kor:"오죽 피곤했으면 앉자마자 잠이 들었겠어요.", eng:"He must have been so tired — he fell asleep the moment he sat down."}], translations:{ en:{ term:"it must have been really bad (for them to…)", mainDef:"an expression meaning 'how hard it must have been for someone to go that far.'", contextDef:"Said in the owner's defense: things must have been unbearable for the owner to ban the boys.", subDefs:[{term:"오죽", def:"'how (much)'; used mostly as 오죽하다 or 오죽했으면."},{term:"-았/었으면", def:"imagines a past situation with the feeling 'since it was that bad'; e.g. how hungry he must have been, how much it must have hurt."}] } } },
            { term:"출입", mainDef:"출입은 어떤 곳에 들어가고 나오는 일이에요.", hanja:"출(出 나가다) + 입(入 들어가다)", contextDef:"가게에 들어가는 것을 막는다는 뜻으로 여러 번 쓰였어요.", variants:["출입"], subDefs:[], examples:[{kor:"공사 중이라서 이 문으로는 출입할 수 없어요.", eng:"It's under construction, so you can't go in or out through this door."}], translations:{ en:{ term:"entry, access", mainDef:"going in and out of a place.", contextDef:"Used repeatedly for being stopped from going into a shop." } } },
            { term:"차별", mainDef:"차별은 이유 없이 어떤 사람을 다른 사람보다 나쁘게 대하는 것이에요.", hanja:"차(差 다르다) + 별(別 나누다)", contextDef:"몇몇 학생 때문에 남학생 모두를 막는 것은 옳지 않다는 비판에 쓰였어요.", variants:["차별"], subDefs:[], examples:[{kor:"나이 때문에 일자리를 얻지 못하는 것도 차별이에요.", eng:"Not getting a job because of your age is also discrimination."}], translations:{ en:{ term:"discrimination", mainDef:"treating some people worse than others for no fair reason.", contextDef:"Used in the criticism that blocking all boys because of a few students is wrong." } } },
            { term:"동시에", mainDef:"두 가지 일이 동시에 일어나면, 같은 때에 함께 일어난다는 뜻이에요.", hanja:"동(同 같다) + 시(時 때)", contextDef:"사장님을 이해하는 목소리와 비판하는 목소리가 함께 나왔다는 뜻이에요.", variants:["동시에"], subDefs:[], examples:[{kor:"두 사람이 동시에 손을 들었어요.", eng:"The two of them raised their hands at the same time."}], translations:{ en:{ term:"at the same time", mainDef:"if two things happen at the same time, they happen together.", contextDef:"Voices supporting and criticizing the owner came out together." } } },
            { term:"노키즈존", mainDef:"노키즈존은 아이를 데리고는 들어갈 수 없게 정해 놓은 식당이나 카페 같은 곳이에요.", contextDef:"'노○○존'이라는 말이 처음 시작된 곳으로 소개돼요.", variants:["노키즈존"], subDefs:[{subTerm:"• 노키즈존 ← no kids zone", subDef:"영어 'no kids zone'을 소리 나는 대로 한글로 적은 말이에요."}], examples:[{kor:"그 카페는 노키즈존이라서 조카를 데려갈 수 없었어요.", eng:"That café is a no-kids zone, so I couldn't bring my niece."}], translations:{ en:{ term:"no-kids zone", mainDef:"a restaurant, café or similar place that does not let customers bring children in.", contextDef:"Introduced as the place where 'no-○○ zones' first began.", subDefs:[{term:"노키즈존 ← no kids zone", def:"the English phrase 'no kids zone' written in Hangul the way it sounds."}] } } },
            { term:"노시니어존", mainDef:"노시니어존은 나이가 많은 손님은 들어올 수 없게 정해 놓은 가게예요.", contextDef:"노키즈존 다음으로 생긴 '노○○존'의 한 예로 나와요.", variants:["노시니어존"], subDefs:[{"subTerm":"• 노시니어존 ← no senior zone","subDef":"영어 'no senior zone'을 소리 나는 대로 한글로 적은 말이에요. 'senior'는 나이 든 사람을 뜻해요."}], examples:[{"kor":"노시니어존이라는 안내문을 보고 할아버지가 크게 서운해하셨어요.","eng":"Grandpa was really hurt when he saw the 'no-seniors' sign."}], translations:{"en":{"term":"no-senior zone","mainDef":"a shop that does not let older customers in.","contextDef":"Mentioned as one of the 'no-○○ zones' that followed no-kids zones.","subDefs":[{"term":"노시니어존 ← no senior zone","def":"the English 'no senior zone' written in Hangul; 'senior' means an older person."}]}} },
            { term:"노타투존", mainDef:"노타투존은 몸에 그림이나 글자를 새긴 손님은 들어올 수 없게 정해 놓은 가게예요.", contextDef:"문신한 사람을 막는 곳으로 소개돼요.", variants:["노타투존"], subDefs:[{"subTerm":"• 노타투존 ← no tattoo zone","subDef":"영어 'no tattoo zone'을 소리 나는 대로 적은 말이에요. 'tattoo'는 문신이에요."}], examples:[{"kor":"그 헬스장은 노타투존이라서 긴팔을 입고 가야 해요.","eng":"That gym is a no-tattoo zone, so you have to wear long sleeves."}], translations:{"en":{"term":"no-tattoo zone","mainDef":"a shop that does not let customers with tattoos in.","contextDef":"Introduced as a place that keeps out people with tattoos.","subDefs":[{"term":"노타투존 ← no tattoo zone","def":"the English 'no tattoo zone' written in Hangul."}]}} },
            { term:"노남학생존", mainDef:"노남학생존은 남자 중학생과 고등학생이 여럿이 함께 오는 것을 막는 가게예요.", contextDef:"이 글이 다루는 카페 안내문을 두고 사람들이 붙인 이름이에요.", variants:["노남학생존"], subDefs:[{"subTerm":"• 노(no) + 남학생 + 존(zone)","subDef":"영어 'no'와 'zone' 사이에 한국어 '남학생'을 넣어 만든 새로운 말이에요."}], examples:[{"kor":"'노남학생존'이라는 말이 뉴스에 나오자 학부모들이 화를 냈어요.","eng":"Parents got angry when the phrase 'no-schoolboys zone' appeared in the news."}], translations:{"en":{"term":"no-schoolboys zone","mainDef":"a shop that doesn't allow middle- and high-school boys to come in as a group.","contextDef":"The name people gave to the café notice this article is about.","subDefs":[{"term":"노(no) + 남학생 + 존(zone)","def":"a new word made by putting the Korean 남학생 (male student) between English 'no' and 'zone'."}]}} },
            { term:"생겨버린 것", mainDef:"'생겨버린 것'은 원하지 않았는데 결국 새로 생기고 말았다는 뜻이에요.", contextDef:"노키즈존에서 시작해 이제 '노남학생존'까지 생겼다는 것을 아쉬운 마음으로 말해요.", variants:["생겨버린 것"], subDefs:[{subTerm:"• -아/어 버리다", subDef:"어떤 일이 완전히 끝나서 되돌릴 수 없다는 느낌을 줘요. 아쉬움이 섞일 때가 많아요. 예) 다 먹어 버렸어요, 잊어버렸어요."},{subTerm:"• -ㄴ/은 것.", subDef:"뉴스나 뉴스레터에서 문장을 '것'으로 짧게 끝내는 말투예요. '생겨 버렸어요'와 같은 뜻이에요. 예) 결국 가게 문을 닫은 것. 모두가 놀란 것."}], examples:[{kor:"기다리던 버스가 그냥 가 버렸어요.", eng:"The bus I was waiting for just left without me."}], translations:{ en:{ term:"(it's) ended up appearing", mainDef:"means something has finally come into being, even though no one wanted it.", contextDef:"Said with some regret: starting from no-kids zones, things have gone as far as a 'no-schoolboys zone.'", subDefs:[{term:"-아/어 버리다", def:"shows that something is completely done and can't be undone, often with a feeling of regret; e.g. ate it all up, forgot."},{term:"-ㄴ/은 것.", def:"a news/newsletter style that ends a sentence with 것; means the same as 생겨 버렸어요. e.g. In the end, the shop closed. Everyone was surprised."}] } } },
            { term:"특정", mainDef:"특정은 여럿 가운데 하나를 콕 집어 정한 것이에요.", hanja:"특(特 특별하다) + 정(定 정하다)", contextDef:"나이, 성별처럼 콕 집은 한 무리의 사람들을 말할 때 쓰였어요.", variants:["특정"], subDefs:[], examples:[{kor:"이 할인은 특정 카드로 결제할 때만 돼요.", eng:"This discount only applies when you pay with a specific card."}], translations:{ en:{ term:"specific, particular", mainDef:"one thing picked out and decided on among many.", contextDef:"Used for a particular group singled out by age, gender and so on." } } },
            { term:"집단", mainDef:"집단은 어떤 공통점으로 묶인 여러 사람의 모임이에요.", hanja:"집(集 모으다) + 단(團 둥글다, 모임)", contextDef:"어린이, 노인, 남학생처럼 같은 특징을 가진 사람들을 한꺼번에 가리켜요.", variants:["집단"], subDefs:[], examples:[{kor:"이 설문은 20대 집단을 대상으로 했어요.", eng:"This survey targeted people in their twenties as a group."}], translations:{ en:{ term:"group", mainDef:"a number of people linked by something they have in common.", contextDef:"Refers all at once to people who share a trait, like children, seniors or schoolboys." } } },
            { term:"통째로", mainDef:"'통째로'는 나누지 않고 전부 한꺼번에라는 뜻이에요.", contextDef:"문제를 일으킨 몇 명이 아니라 그 무리 전체를 막는다는 뜻이에요.", variants:["통째로"], subDefs:[], examples:[{kor:"아이가 수박 한 조각을 통째로 입에 넣었어요.", eng:"The kid stuffed a whole slice of watermelon into his mouth."}], translations:{ en:{ term:"whole, entirely", mainDef:"all of it at once, without splitting it up.", contextDef:"Means blocking the entire group, not just the few who caused trouble." } } },
            { term:"바람직하다", mainDef:"어떤 일이 바람직하면, 그렇게 되는 것이 옳고 좋다는 뜻이에요.", contextDef:"'바람직하지 않다'는 노○○존이 옳은 방향이 아니라는 뜻으로 쓰였어요.", variants:["바람직하지"], subDefs:[], examples:[{kor:"잠을 충분히 자는 것이 건강에 바람직해요.", eng:"Getting enough sleep is good for your health."}], translations:{ en:{ term:"to be desirable", mainDef:"if something is desirable, it is right and good for it to happen.", contextDef:"'Not desirable' here means no-○○ zones are not the right direction." } } },
            { term:"지나치다", mainDef:"어떤 행동이 지나치면, 알맞은 선을 넘어 너무 심하다는 뜻이에요.", contextDef:"무리 전체를 막는 것은 너무 심한 결정이라는 뜻이에요.", variants:["지나친","지나치다는"], subDefs:[], examples:[{kor:"운동도 지나치면 몸에 안 좋아요.", eng:"Even exercise is bad for you if you overdo it."}], translations:{ en:{ term:"to go too far, to be excessive", mainDef:"if something goes too far, it crosses the right line and becomes too much.", contextDef:"Blocking a whole group is seen as too harsh a decision." } } },
            { term:"일반화하다", mainDef:"누군가가 어떤 일을 일반화하면, 몇 가지 예만 보고 모두가 다 그렇다고 생각한다는 뜻이에요.", hanja:"일(一 하나) + 반(般 가지) + 화(化 되다)", contextDef:"몇몇 학생의 잘못을 보고 남학생이면 다 그렇다고 여기는 것을 비판해요.", variants:["일반화하면","일반화해서","일반화해"], subDefs:[], examples:[{kor:"한 번 불친절했다고 그 나라 사람 모두를 일반화하면 안 돼요.", eng:"You shouldn't generalize about everyone from that country just because one person was rude."}], translations:{ en:{ term:"to generalize", mainDef:"if you generalize, you look at a few cases and assume everyone is the same.", contextDef:"Criticizes treating all boys as troublemakers because of what a few students did." } } },
            { term:"배제하다", mainDef:"누군가를 배제하면, 그 사람을 끼워 주지 않고 밖으로 밀어낸다는 뜻이에요.", hanja:"배(排 밀어내다) + 제(除 덜다)", contextDef:"어떤 사람들을 가게에서 받아 주지 않는 것을 가리키며, 글 전체에 여러 번 나와요.", variants:["배제하는","배제하면서","배제하면","배제하기보다는","배제"], subDefs:[], examples:[{kor:"회의에서 신입 사원의 의견이 배제됐어요.", eng:"The new employee's opinion was left out in the meeting."}], translations:{ en:{ term:"to exclude, to shut out", mainDef:"if you exclude someone, you don't let them in and push them out.", contextDef:"Refers to shops refusing to accept certain people; appears many times throughout the article." } } },
            { term:"대상", mainDef:"대상은 어떤 일이 향하는 사람이나 물건이에요.", hanja:"대(對 마주하다) + 상(象 모양)", contextDef:"'배제의 대상'은 밀려나는 쪽이 되는 사람을 뜻해요.", variants:["대상"], subDefs:[], examples:[{kor:"이 수업은 초등학생을 대상으로 해요.", eng:"This class is aimed at elementary school students."}], translations:{ en:{ term:"target, subject", mainDef:"the person or thing an action is aimed at.", contextDef:"'A target of exclusion' means someone who ends up being pushed out." } } },
            { term:"반면", mainDef:"'반면'은 앞의 내용과 반대되는 이야기를 꺼낼 때 쓰는 말이에요.", hanja:"반(反 되돌리다) + 면(面 쪽)", contextDef:"노○○존을 반대하는 쪽 다음에 이해하는 쪽의 생각을 소개할 때 쓰였어요.", variants:["반면"], subDefs:[], examples:[{kor:"형은 조용한 반면 동생은 활발해요.", eng:"The older brother is quiet, whereas the younger one is outgoing."}], translations:{ en:{ term:"on the other hand, whereas", mainDef:"a word used to bring up something opposite to what was just said.", contextDef:"Used to move from the side against no-○○ zones to the side that understands them." } } },
            { term:"운영하다", mainDef:"누군가가 가게나 모임을 운영하면, 그것이 잘 돌아가도록 책임지고 이끈다는 뜻이에요.", hanja:"운(運 옮기다) + 영(營 꾀하다)", contextDef:"사장님이 자기 가게를 원하는 방식으로 꾸려 갈 수 있다는 뜻으로 쓰였어요.", variants:["운영할","운영하는","운영"], subDefs:[], examples:[{kor:"부모님이 작은 빵집을 운영하세요.", eng:"My parents run a small bakery."}], translations:{ en:{ term:"to run, to operate", mainDef:"if you run a shop or group, you take charge and keep it going well.", contextDef:"Means the owner can run their own shop the way they want." } } },
            { term:"선택권", mainDef:"선택권은 여러 가지 중에서 스스로 고를 수 있는 자격이에요.", hanja:"선(選 가리다) + 택(擇 고르다) + 권(權 권세)", contextDef:"사장님이 어떤 손님을 받을지 고를 수 있다는 주장에 쓰였어요.", variants:["선택권"], subDefs:[], examples:[{kor:"학생들에게도 수업을 고를 선택권이 있어야 해요.", eng:"Students should also have the right to choose their classes."}], translations:{ en:{ term:"right to choose", mainDef:"the right to pick for yourself among several options.", contextDef:"Used in the argument that owners can choose which customers to serve." } } },
            { term:"불편을 겪다", mainDef:"누군가가 불편을 겪으면, 어떤 일 때문에 편하지 않고 힘든 일을 당한다는 뜻이에요.", contextDef:"몇몇 손님의 행동 때문에 다른 손님들이 괴로운 일을 당하는 것을 말해요.", variants:["불편을 겪거나"], subDefs:[{subTerm:"• 겪다", subDef:"힘들거나 새로운 일을 직접 당하거나 경험해요. 예) 어려움을 겪다, 차별을 겪다."}], examples:[{kor:"공사 때문에 주민들이 큰 불편을 겪고 있어요.", eng:"Residents are being seriously inconvenienced by the construction."}], translations:{ en:{ term:"to be inconvenienced", mainDef:"if you are inconvenienced, something makes things uncomfortable or hard for you.", contextDef:"Other customers suffer because of a few customers' behavior.", subDefs:[{term:"겪다", def:"to go through or experience something hard or new; e.g. face difficulties, face discrimination."}] } } },
            { term:"영업", mainDef:"영업은 돈을 벌려고 가게나 회사를 열어 장사하는 일이에요.", hanja:"영(營 꾀하다) + 업(業 일)", contextDef:"가게가 손님을 받고 장사하는 일 전체를 가리켜요.", variants:["영업"], subDefs:[], examples:[{kor:"이 식당은 월요일에 영업을 안 해요.", eng:"This restaurant is closed on Mondays."}], translations:{ en:{ term:"business (operation)", mainDef:"running a shop or company to make money.", contextDef:"Refers to the whole business of a shop serving customers." } } },
            { term:"제한하다", mainDef:"누군가가 어떤 일을 제한하면, 정해진 선을 넘지 못하게 막는다는 뜻이에요.", hanja:"제(制 억제하다) + 한(限 한계)", contextDef:"어떤 사람들이 가게에 들어오지 못하게 막는다는 뜻으로 여러 번 쓰였어요.", variants:["제한하려는","제한하는","제한할","제한"], subDefs:[], examples:[{kor:"이 놀이 기구는 키가 120cm 이하인 아이의 탑승을 제한해요.", eng:"This ride doesn't allow children under 120 cm to get on."}], translations:{ en:{ term:"to restrict, to limit", mainDef:"if you restrict something, you stop it from going past a set line.", contextDef:"Used many times for stopping certain people from entering a shop." } } },
            { term:"등장하다", mainDef:"어떤 것이 등장하면, 새로 나타나서 사람들 앞에 모습을 보인다는 뜻이에요.", hanja:"등(登 오르다) + 장(場 마당)", contextDef:"새로운 '노○○존'들이 생겨났다는 뜻이에요.", variants:["등장했어요","등장하면서","등장"], subDefs:[], examples:[{kor:"새로운 스마트폰이 다음 달에 등장할 거예요.", eng:"A new smartphone will come out next month."}], translations:{ en:{ term:"to appear, to emerge", mainDef:"if something appears, it newly shows up in front of people.", contextDef:"New kinds of 'no-○○ zones' came into being." } } },
            { term:"본격적", mainDef:"어떤 일이 본격적으로 시작되면, 준비 단계를 지나 제대로 크게 시작된다는 뜻이에요.", hanja:"본(本 근본) + 격(格 격식) + 적(的 ~의)", contextDef:"노○○존이 노키즈존에서부터 크게 늘기 시작했다는 뜻이에요.", variants:["본격적으로"], subDefs:[], examples:[{kor:"다음 주부터 본격적으로 장마가 시작돼요.", eng:"The rainy season will start in earnest next week."}], translations:{ en:{ term:"in earnest, full-scale", mainDef:"if something starts in earnest, it moves past the early stage and really gets going.", contextDef:"No-○○ zones really took off starting with no-kids zones." } } },
            { term:"공공장소", mainDef:"공공장소는 여러 사람이 함께 쓰는, 누구에게나 열려 있는 곳이에요.", hanja:"공(公 여럿의) + 공(共 함께) + 장(場 마당) + 소(所 곳)", contextDef:"식당이나 카페처럼 많은 사람이 함께 있는 곳을 가리켜요.", variants:["공공장소"], subDefs:[], examples:[{kor:"공공장소에서는 담배를 피우면 안 돼요.", eng:"You can't smoke in public places."}], translations:{ en:{ term:"public place", mainDef:"a place many people share and that is open to anyone.", contextDef:"Places like restaurants and cafés where many people are together." } } },
            { term:"통제하다", mainDef:"누군가가 무엇을 통제하면, 마음대로 움직이지 못하게 잡아서 다스린다는 뜻이에요.", hanja:"통(統 거느리다) + 제(制 억제하다)", contextDef:"부모가 아이의 행동을 제대로 말리지 않았다는 뜻이에요.", variants:["통제하지"], subDefs:[], examples:[{kor:"경찰이 사고 현장 주변의 도로를 통제했어요.", eng:"The police closed off the roads around the accident scene."}], translations:{ en:{ term:"to control", mainDef:"if you control something, you keep it in check so it can't move freely.", contextDef:"Some parents didn't properly keep their children's behavior in check." } } },
            { term:"사례", mainDef:"사례는 실제로 있었던 일 하나하나예요.", hanja:"사(事 일) + 례(例 보기)", contextDef:"부모가 아이를 말리지 않은 일들이 알려진 것을 가리켜요.", variants:["사례"], subDefs:[], examples:[{kor:"비슷한 사례가 다른 학교에서도 있었어요.", eng:"There was a similar case at another school too."}], translations:{ en:{ term:"case, example", mainDef:"a single thing that really happened.", contextDef:"Refers to reported incidents of parents not stopping their children." } } },
            { term:"부딪치다", mainDef:"두 사람이나 물건이 부딪치면, 서로 세게 닿는다는 뜻이에요.", contextDef:"식당에서 일하는 사람과 아이가 서로 몸이 세게 닿은 사고를 말해요.", variants:["부딪치면서"], subDefs:[], examples:[{kor:"휴대폰을 보며 걷다가 사람과 부딪쳤어요.", eng:"I bumped into someone while walking and looking at my phone."}], translations:{ en:{ term:"to bump into, to collide", mainDef:"if two people or things collide, they hit each other hard.", contextDef:"Describes the accident where a server and a child crashed into each other." } } },
            { term:"화상을 입다", mainDef:"누군가가 화상을 입으면, 뜨거운 것이나 불 때문에 피부를 다친다는 뜻이에요.", contextDef:"부딪친 사고로 아이가 뜨거운 음식에 데어 다쳤다는 뜻이에요.", variants:["화상을 입은"], subDefs:[{subTerm:"• 화상(火傷)", subDef:"화(火, 불) + 상(傷, 다치다). 불이나 뜨거운 것에 데어서 생긴 상처예요."}], examples:[{kor:"뜨거운 물에 손을 데어서 화상을 입었어요.", eng:"I burned my hand with hot water."}], translations:{ en:{ term:"to get burned", mainDef:"if you get burned, your skin is hurt by fire or something hot.", contextDef:"The child was hurt by hot food in the collision.", subDefs:[{term:"화상 (火傷)", def:"화 (火, fire) + 상 (傷, injury): a wound from fire or something hot."}] } } },
            { term:"영업장", mainDef:"영업장은 장사를 하는 가게나 공간이에요. 줄여서 '업장'이라고도 해요.", hanja:"영(營 꾀하다) + 업(業 일) + 장(場 마당)", contextDef:"식당, 카페처럼 손님을 받아 장사하는 곳을 가리켜요.", variants:["영업장","업장"], subDefs:[], examples:[{kor:"모든 영업장은 소방 점검을 받아야 해요.", eng:"All business premises must pass a fire inspection."}], translations:{ en:{ term:"place of business", mainDef:"a shop or space where business is done; also shortened to 업장.", contextDef:"Refers to places like restaurants and cafés that serve customers." } } },
            { term:"배상금", mainDef:"배상금은 남에게 끼친 손해를 갚으려고 내는 돈이에요.", hanja:"배(賠 물어 주다) + 상(償 갚다) + 금(金 돈)", contextDef:"법원이 식당 주인에게 다친 아이 쪽에 돈을 주라고 한 것을 말해요.", variants:["배상금"], subDefs:[], examples:[{kor:"회사는 피해자들에게 배상금을 주기로 했어요.", eng:"The company agreed to pay compensation to the victims."}], translations:{ en:{ term:"compensation, damages", mainDef:"money paid to make up for harm you caused someone.", contextDef:"The court told the restaurant owner to pay the injured child's side." } } },
            { term:"지급하다", mainDef:"누군가가 돈을 지급하면, 주기로 한 돈을 내준다는 뜻이에요.", hanja:"지(支 치르다) + 급(給 주다)", contextDef:"식당 주인이 돈을 내야 한다는 판결 내용이에요.", variants:["지급해야"], subDefs:[], examples:[{kor:"월급은 매달 25일에 지급돼요.", eng:"Salaries are paid on the 25th of every month."}], translations:{ en:{ term:"to pay (out)", mainDef:"if you pay out money, you hand over money you're supposed to give.", contextDef:"The ruling said the restaurant owner had to pay." } } },
            { term:"판결", mainDef:"판결은 법원이 재판에서 누가 옳고 그른지를 정하는 일이에요.", hanja:"판(判 판단하다) + 결(決 정하다)", contextDef:"2014년 법원의 결정이 노키즈존이 퍼진 계기로 소개돼요.", variants:["판결"], subDefs:[], examples:[{kor:"법원의 판결이 나오기까지 1년이 걸렸어요.", eng:"It took a year for the court to hand down its ruling."}], translations:{ en:{ term:"(court) ruling, verdict", mainDef:"a court's decision in a trial about who is right or wrong.", contextDef:"A 2014 court decision is presented as a trigger for the spread of no-kids zones." } } },
            { term:"퍼지다", mainDef:"어떤 것이 퍼지면, 처음 생긴 곳에서 점점 넓은 곳으로 번져 나간다는 뜻이에요.", contextDef:"노키즈존이나 차별하는 분위기가 여러 곳으로 늘어나는 것을 말해요.", variants:["퍼지기","퍼지면서","퍼질","퍼져"], subDefs:[], examples:[{kor:"그 소문이 학교 전체에 금방 퍼졌어요.", eng:"The rumor quickly spread through the whole school."}], translations:{ en:{ term:"to spread", mainDef:"if something spreads, it moves out from where it started into wider areas.", contextDef:"Describes no-kids zones or a discriminatory mood growing in more places." } } },
            { term:"보건복지부", mainDef:"보건복지부는 국민의 건강과 생활을 돌보는 일을 맡은 한국 정부 기관이에요.", hanja:"보(保 지키다) + 건(健 튼튼하다) + 복(福 복) + 지(祉 복) + 부(部 나라 기관)", contextDef:"노키즈존이 몇 곳인지 조사한 정부 기관으로 나와요.", variants:["보건복지부"], subDefs:[], examples:[{kor:"보건복지부가 새로운 육아 지원 정책을 발표했어요.", eng:"The Ministry of Health and Welfare announced a new childcare support policy."}], translations:{ en:{ term:"Ministry of Health and Welfare", mainDef:"the Korean government ministry in charge of people's health and welfare.", contextDef:"The ministry that counted how many no-kids zones there were." } } },
            { term:"파악하다", mainDef:"누군가가 어떤 일을 파악하면, 그 내용이나 형편을 확실하게 알아낸다는 뜻이에요.", hanja:"파(把 잡다) + 악(握 쥐다)", contextDef:"정부가 조사해서 알아낸 노키즈존의 수를 말해요.", variants:["파악한"], subDefs:[], examples:[{kor:"먼저 문제가 무엇인지 정확히 파악해야 해요.", eng:"First we need to figure out exactly what the problem is."}], translations:{ en:{ term:"to figure out, to grasp", mainDef:"if you figure something out, you find out clearly what it is or how it stands.", contextDef:"The number of no-kids zones the government found through its survey." } } },
            { term:"달하다", mainDef:"어떤 수가 얼마에 달하면, 그 정도까지 이른다는 뜻이에요. 많다는 느낌을 줘요.", hanja:"달(達 이르다)", contextDef:"노키즈존이 558곳이나 된다는 것을 강조해요.", variants:["달해요"], subDefs:[], examples:[{kor:"그날 모인 사람이 만 명에 달했어요.", eng:"The crowd that day reached as many as ten thousand people."}], translations:{ en:{ term:"to reach, to amount to", mainDef:"if a number reaches a certain amount, it goes as high as that; suggests the number is large.", contextDef:"Stresses that there were as many as 558 no-kids zones." } } },
            { term:"둘러싸다", mainDef:"어떤 문제를 둘러싸고 말이 오가면, 그 문제를 가운데 놓고 사람들이 이야기하거나 다툰다는 뜻이에요.", contextDef:"영업장이나 노○○존을 가운데 두고 여러 의견과 일이 생긴다는 뜻으로 쓰였어요.", variants:["둘러싸고","둘러싼"], subDefs:[], examples:[{kor:"새 공항 건설을 둘러싸고 주민들의 의견이 나뉘었어요.", eng:"Residents were divided over the construction of the new airport."}], translations:{ en:{ term:"to surround, to center on", mainDef:"if people talk surrounding an issue, they discuss or argue with that issue at the center.", contextDef:"Used for opinions and events that revolve around businesses or no-○○ zones." } } },
            { term:"다양해지다", mainDef:"어떤 것이 다양해지면, 종류가 점점 여러 가지로 많아진다는 뜻이에요.", hanja:"다(多 많다) + 양(樣 모양)", contextDef:"막는 사람의 종류와 막는 이유가 점점 많아졌다는 뜻이에요.", variants:["다양해졌어요"], subDefs:[], examples:[{kor:"요즘 편의점 도시락 메뉴가 많이 다양해졌어요.", eng:"Convenience store lunch box options have become much more varied these days."}], translations:{ en:{ term:"to become diverse", mainDef:"if something becomes diverse, the kinds of it grow in number.", contextDef:"The kinds of people restricted, and the reasons, kept multiplying." } } },
            { term:"고령자", mainDef:"고령자는 나이가 많은 사람이에요.", hanja:"고(高 높다) + 령(齡 나이) + 자(者 사람)", contextDef:"'노시니어존'에서 막는 사람들이에요.", variants:["고령자"], subDefs:[], examples:[{kor:"이 버스는 고령자에게 요금을 할인해 줘요.", eng:"This bus gives a fare discount to older people."}], translations:{ en:{ term:"elderly person, senior", mainDef:"a person of advanced age.", contextDef:"The people kept out by a 'no-senior zone.'" } } },
            { term:"중년층", mainDef:"중년층은 보통 40~50대 나이의 사람들이에요.", hanja:"중(中 가운데) + 년(年 나이) + 층(層 층)", contextDef:"'노중년존'에서 막는 사람들이에요.", variants:["중년층"], subDefs:[], examples:[{kor:"요즘 등산을 즐기는 중년층이 많아요.", eng:"These days many middle-aged people enjoy hiking."}], translations:{ en:{ term:"middle-aged people", mainDef:"people usually in their forties and fifties.", contextDef:"The people kept out by a 'no-middle-age zone.'" } } },
            { term:"노중년존", mainDef:"노중년존은 40~50대 손님은 들어올 수 없게 정해 놓은 가게예요.", contextDef:"나이를 기준으로 사람을 막는 또 다른 예로 나와요.", variants:["노중년존"], subDefs:[{"subTerm":"• 노(no) + 중년 + 존(zone)","subDef":"'중년(中年)'은 젊지도 늙지도 않은 40~50대 나이예요."}], examples:[{"kor":"젊은 사람만 받는 노중년존 술집이 논란이 됐어요.","eng":"A bar that only served young people and banned middle-aged customers caused a stir."}], translations:{"en":{"term":"no-middle-age zone","mainDef":"a shop that doesn't let customers in their forties and fifties in.","contextDef":"Another example of keeping people out based on age.","subDefs":[{"term":"노(no) + 중년 + 존(zone)","def":"중년 (中年) means middle age, roughly the forties and fifties."}]}} },
            { term:"문신하다", mainDef:"누군가가 문신하면, 바늘로 피부에 그림이나 글자를 새긴다는 뜻이에요.", hanja:"문(文 무늬) + 신(身 몸)", contextDef:"'노타투존'에서 막는 사람들을 설명해요.", variants:["문신한"], subDefs:[], examples:[{kor:"형은 팔에 작은 별을 문신했어요.", eng:"My brother got a small star tattooed on his arm."}], translations:{ en:{ term:"to get a tattoo", mainDef:"if you get a tattoo, a picture or letters are put into your skin with a needle.", contextDef:"Describes the people kept out by a 'no-tattoo zone.'" } } },
            { term:"제한하는가 하면", mainDef:"'-는가 하면'은 한 가지 예를 들고 나서 그와 다른 예도 있다고 이어 말할 때 써요.", contextDef:"나이나 무리로 막는 곳도 있고, 공부하는 손님이나 유튜버를 막는 곳도 있다는 뜻이에요.", variants:["제한하는가 하면"], subDefs:[{subTerm:"• -는가 하면", subDef:"'어떤 것은 이렇고, 또 어떤 것은 저렇다'처럼 여러 경우를 나란히 보여 줘요. 예) 웃는 사람이 있는가 하면 우는 사람도 있어요."}], examples:[{kor:"비가 오는 곳이 있는가 하면 눈이 오는 곳도 있어요.", eng:"Some places are getting rain, while others are getting snow."}], translations:{ en:{ term:"(some) restrict…, while (others)…", mainDef:"-는가 하면 is used to give one example and then add a different one.", contextDef:"Some places restrict by age or group, while others block customers who study or YouTubers.", subDefs:[{term:"-는가 하면", def:"sets different cases side by side: 'some are like this, others like that'; e.g. some people laugh while others cry."}] } } },
            { term:"노스터디존", mainDef:"노스터디존은 가게 안에서 오래 앉아 공부하는 것을 막는 카페예요.", contextDef:"자리를 오래 쓰는 손님을 막으려는 사장님의 선택으로 소개돼요.", variants:["노스터디존"], subDefs:[{"subTerm":"• 노스터디존 ← no study zone","subDef":"영어 'no study zone'을 소리 나는 대로 적은 말이에요."}], examples:[{"kor":"시험 기간인데 동네 카페가 다 노스터디존이라 도서관에 갔어요.","eng":"It's exam season, but every café in the neighborhood bans studying, so I went to the library."}], translations:{"en":{"term":"no-study zone","mainDef":"a café that doesn't allow customers to sit and study for a long time.","contextDef":"Presented as an owner's choice to limit customers who take up seats for hours.","subDefs":[{"term":"노스터디존 ← no study zone","def":"the English 'no study zone' written in Hangul."}]}} },
            { term:"노튜버존", mainDef:"노튜버존은 유튜브 영상을 찍는 사람이 가게 안에서 촬영하지 못하게 막는 곳이에요.", contextDef:"'노유튜버존'이라고도 써요. 다른 손님을 불편하게 할 수 있어서 생긴 곳으로 나와요.", variants:["노유튜버존","노튜버존"], subDefs:[{"subTerm":"• 노(no) + (유)튜버 + 존(zone)","subDef":"'유튜버'는 유튜브에 영상을 올리는 사람이에요. 줄여서 '튜버'라고도 해요."}], examples:[{"kor":"그 식당은 노튜버존이라서 입구에 촬영 금지 표시가 붙어 있어요.","eng":"That restaurant is a no-YouTuber zone, so there's a no-filming sign at the entrance."}], translations:{"en":{"term":"no-YouTuber zone","mainDef":"a place that doesn't let people film YouTube videos inside.","contextDef":"Also written 노유튜버존; mentioned as a response to filming that bothers other customers.","subDefs":[{"term":"노(no) + (유)튜버 + 존(zone)","def":"유튜버 is someone who posts videos on YouTube, shortened to 튜버."}]}} },
            { term:"논쟁", mainDef:"논쟁은 생각이 다른 사람들이 서로 자기가 옳다고 말하며 다투는 일이에요.", hanja:"논(論 말하다) + 쟁(爭 다투다)", contextDef:"노○○존이 옳은지 그른지를 두고 벌어지는 다툼이에요.", variants:["논쟁"], subDefs:[], examples:[{kor:"두 후보 사이에 뜨거운 논쟁이 벌어졌어요.", eng:"A heated debate broke out between the two candidates."}], translations:{ en:{ term:"debate, dispute", mainDef:"an argument in which people who think differently each insist they are right.", contextDef:"The argument over whether no-○○ zones are right or wrong." } } },
            { term:"복잡해지다", mainDef:"어떤 일이 복잡해지면, 여러 가지가 얽혀서 알기 어렵게 된다는 뜻이에요.", hanja:"복(複 겹치다) + 잡(雜 섞이다)", contextDef:"노○○존의 종류가 늘면서 생각해야 할 점도 많아졌다는 뜻이에요.", variants:["복잡해지고"], subDefs:[], examples:[{kor:"사람이 많아질수록 일이 더 복잡해져요.", eng:"The more people get involved, the more complicated things get."}], translations:{ en:{ term:"to get complicated", mainDef:"if something gets complicated, many things get tangled together and it becomes hard to follow.", contextDef:"As the types of no-○○ zones grew, there were more points to consider." } } }
,
            { term:"권리", mainDef:"권리는 어떤 일을 마땅히 하거나 요구할 수 있는 자격이에요.", hanja:"권(權 권세) + 리(利 이롭다)", contextDef:"사장님이 손님을 고를 수 있는지, 손님이 가게를 쓸 수 있는지를 두고 쓰였어요.", variants:["권리"], subDefs:[], examples:[{kor:"모든 사람은 교육을 받을 권리가 있어요.", eng:"Everyone has the right to an education."}], translations:{ en:{ term:"right", mainDef:"what a person can rightly do or ask for.", contextDef:"Used about whether owners can pick customers and whether customers can use shops." } } },
            { term:"자율성", mainDef:"자율성은 남의 간섭 없이 스스로 정하고 해 나갈 수 있는 힘이에요.", hanja:"자(自 스스로) + 율(律 법) + 성(性 성질)", contextDef:"사장님이 가게 일을 스스로 정할 수 있는 자유를 말해요.", variants:["자율성"], subDefs:[], examples:[{kor:"이 회사는 직원들의 자율성을 존중해요.", eng:"This company respects its employees' autonomy."}], translations:{ en:{ term:"autonomy", mainDef:"the ability to decide and act for yourself without others interfering.", contextDef:"The owner's freedom to make decisions about their own shop." } } },
            { term:"인정하다", mainDef:"누군가가 어떤 것을 인정하면, 그것이 옳거나 사실이라고 받아들인다는 뜻이에요.", hanja:"인(認 알다) + 정(定 정하다)", contextDef:"사장님의 권리를 어디까지 받아들여야 하느냐는 뜻이에요.", variants:["인정할지"], subDefs:[], examples:[{kor:"그는 자기 실수를 솔직하게 인정했어요.", eng:"He openly admitted his mistake."}], translations:{ en:{ term:"to recognize, to acknowledge", mainDef:"if you recognize something, you accept that it is right or true.", contextDef:"How far should the owner's rights be accepted?" } } },
            { term:"정당하다", mainDef:"어떤 일이 정당하면, 이치에 맞고 옳다는 뜻이에요.", hanja:"정(正 바르다) + 당(當 마땅하다)", contextDef:"무리 전체를 막는 것이 옳은지, 사장님의 결정이 옳은 범위 안인지를 따질 때 쓰였어요.", variants:["정당한지","정당한"], subDefs:[], examples:[{kor:"열심히 일했으니 정당한 대가를 받아야 해요.", eng:"You worked hard, so you should get fair pay."}], translations:{ en:{ term:"to be fair, to be legitimate", mainDef:"if something is legitimate, it makes sense and is right.", contextDef:"Used when asking whether blocking a whole group is right, or whether the owner's decision is within fair limits." } } },
            { term:"의견이 엇갈리다", mainDef:"의견이 엇갈리면, 사람들의 생각이 서로 달라서 하나로 모이지 않는다는 뜻이에요.", contextDef:"노○○존을 두고 찬성과 반대가 계속 갈린다는 뜻이에요.", variants:["엇갈리는"], subDefs:[{subTerm:"• 엇갈리다", subDef:"서로 어긋나서 같은 방향으로 가지 않아요. 예) 길이 엇갈리다, 의견이 엇갈리다."}], examples:[{kor:"영화에 대한 평가가 크게 엇갈려요.", eng:"Opinions on the film are sharply divided."}], translations:{ en:{ term:"opinions to be divided", mainDef:"if opinions are divided, people think differently and don't come together.", contextDef:"People keep splitting for and against no-○○ zones.", subDefs:[{term:"엇갈리다", def:"to cross and go in different directions; e.g. paths cross, opinions diverge."}] } } },
            { term:"부주의하다", mainDef:"누군가가 부주의하면, 조심하지 않고 함부로 행동한다는 뜻이에요.", hanja:"부(不 아니다) + 주(注 쏟다) + 의(意 뜻)", contextDef:"아이들이 조심하지 않고 뛰거나 만져서 생기는 일을 말해요.", variants:["부주의한"], subDefs:[], examples:[{kor:"부주의한 운전이 사고를 불러요.", eng:"Careless driving causes accidents."}], translations:{ en:{ term:"to be careless", mainDef:"if someone is careless, they act without paying attention.", contextDef:"Refers to children running around or touching things without care." } } },
            { term:"안전사고", mainDef:"안전사고는 조심하지 않아서 사람이 다치는 뜻밖의 일이에요.", hanja:"안(安 편안하다) + 전(全 온전하다) + 사(事 일) + 고(故 까닭)", contextDef:"가게 안에서 아이가 다치는 일을 걱정하는 말이에요.", variants:["안전사고"], subDefs:[], examples:[{kor:"놀이터에서 안전사고가 나지 않게 조심하세요.", eng:"Be careful so no one gets hurt at the playground."}], translations:{ en:{ term:"safety accident", mainDef:"an unexpected incident in which someone gets hurt because of a lack of care.", contextDef:"The worry that a child might get hurt inside the shop." } } },
            { term:"발생하다", mainDef:"어떤 일이 발생하면, 새로 일어나거나 생긴다는 뜻이에요.", hanja:"발(發 일어나다) + 생(生 생기다)", contextDef:"아이의 행동 때문에 사고가 생길 수 있다는 뜻이에요.", variants:["발생하거나"], subDefs:[], examples:[{kor:"어젯밤 시내에서 큰불이 발생했어요.", eng:"A big fire broke out downtown last night."}], translations:{ en:{ term:"to occur, to happen", mainDef:"if something occurs, it newly happens or comes about.", contextDef:"Accidents can happen because of children's behavior." } } },
            { term:"겪을 수 있는 만큼", mainDef:"'-는 만큼'은 앞의 내용이 뒤의 판단이나 행동의 이유가 될 때 써요.", contextDef:"다른 손님이 불편할 수 있기 때문에 노키즈존은 그것을 막으려는 선택이라는 뜻이에요.", variants:["겪을 수 있는 만큼"], subDefs:[{subTerm:"• -는 만큼", subDef:"'~니까 그에 맞게'라는 뜻으로 이유를 말해요. 예) 비싼 만큼 품질이 좋아요. 중요한 일인 만큼 신중해야 해요."}], examples:[{kor:"날씨가 추운 만큼 옷을 따뜻하게 입으세요.", eng:"Since it's cold, dress warmly."}], translations:{ en:{ term:"since (they) may experience…", mainDef:"-는 만큼 is used when what comes before is the reason for the judgment or action that follows.", contextDef:"Because other customers may be inconvenienced, no-kids zones are a choice to prevent that.", subDefs:[{term:"-는 만큼", def:"'since…, accordingly'; gives a reason. e.g. It's expensive, so the quality is good. Since it's important, we must be careful."}] } } },
            { term:"예방하다", mainDef:"누군가가 무엇을 예방하면, 나쁜 일이 생기기 전에 미리 막는다는 뜻이에요.", hanja:"예(豫 미리) + 방(防 막다)", contextDef:"사고가 나기 전에 미리 막으려고 노키즈존을 만든다는 뜻이에요.", variants:["예방하기","예방"], subDefs:[], examples:[{kor:"손을 자주 씻으면 감기를 예방할 수 있어요.", eng:"Washing your hands often can help prevent colds."}], translations:{ en:{ term:"to prevent", mainDef:"if you prevent something, you stop a bad thing before it happens.", contextDef:"No-kids zones are made to stop accidents before they happen." } } },
            { term:"허용하다", mainDef:"누군가가 어떤 일을 허용하면, 그 일을 해도 된다고 받아 준다는 뜻이에요.", hanja:"허(許 허락하다) + 용(容 받아들이다)", contextDef:"노키즈존이 있어도 괜찮다고 받아들이는 것을 말해요.", variants:["허용할","허용하기"], subDefs:[], examples:[{kor:"이 건물은 반려동물 출입을 허용해요.", eng:"This building allows pets."}], translations:{ en:{ term:"to allow, to permit", mainDef:"if you allow something, you accept that it may be done.", contextDef:"Accepting that no-kids zones are okay to have." } } },
            { term:"자리를 차지하다", mainDef:"누군가가 자리를 차지하면, 그 자리에 앉아서 다른 사람이 쓰지 못하게 된다는 뜻이에요.", contextDef:"공부하는 손님이 오랫동안 카페 자리에 앉아 있는 것을 말해요.", variants:["자리를 차지하거나"], subDefs:[{subTerm:"• 차지하다", subDef:"어떤 공간이나 물건을 자기 것으로 가지고 있어요. 예) 가방이 자리를 차지하다, 1등을 차지하다."}], examples:[{kor:"큰 소파가 거실을 거의 다 차지해요.", eng:"The big sofa takes up almost the whole living room."}], translations:{ en:{ term:"to take up a seat", mainDef:"if you take up a seat, you sit there so others can't use it.", contextDef:"Refers to customers who study and stay in café seats for a long time.", subDefs:[{term:"차지하다", def:"to occupy a space or hold something as your own; e.g. a bag takes up a seat, win first place."}] } } },
            { term:"시각", mainDef:"시각은 어떤 일을 바라보고 생각하는 방법이에요.", hanja:"시(視 보다) + 각(角 뿔, 모서리)", contextDef:"노스터디존 같은 것도 사장님의 선택으로 볼 수 있다는 생각을 가리켜요.", variants:["시각"], subDefs:[], examples:[{kor:"그 문제를 다른 시각에서 보면 답이 보일 거예요.", eng:"If you look at the problem from a different angle, you'll see the answer."}], translations:{ en:{ term:"perspective, point of view", mainDef:"a way of looking at and thinking about something.", contextDef:"The view that no-study zones and the like can be seen as the owner's choice." } } },
            { term:"엄연하다", mainDef:"어떤 사실이 엄연하면, 누구도 아니라고 할 수 없을 만큼 뚜렷하다는 뜻이에요.", hanja:"엄(儼 의젓하다) + 연(然 그러하다)", contextDef:"무리 전체를 막는 것은 누가 봐도 분명한 차별이라는 뜻이에요.", variants:["엄연한"], subDefs:[], examples:[{kor:"허락 없이 남의 사진을 쓰는 건 엄연한 잘못이에요.", eng:"Using someone else's photo without permission is clearly wrong."}], translations:{ en:{ term:"to be undeniable, plain", mainDef:"if a fact is undeniable, it is so clear that no one can say otherwise.", contextDef:"Blocking a whole group is plainly discrimination." } } },
            { term:"지적", mainDef:"지적은 잘못되거나 문제가 되는 점을 콕 집어 말하는 것이에요.", hanja:"지(指 가리키다) + 적(摘 따다)", contextDef:"노○○존의 문제점을 짚어 말하는 목소리들을 가리켜요.", variants:["지적"], subDefs:[], examples:[{kor:"선생님의 지적을 듣고 보고서를 고쳤어요.", eng:"I revised my report after hearing my teacher's comments."}], translations:{ en:{ term:"criticism, pointing out", mainDef:"picking out and naming what is wrong or problematic.", contextDef:"Refers to voices pointing out the problems with no-○○ zones." } } },
            { term:"환영받다", mainDef:"누군가가 환영받으면, 다른 사람들이 반갑게 맞아 준다는 뜻이에요.", hanja:"환(歡 기뻐하다) + 영(迎 맞이하다)", contextDef:"아이들이 자기를 반기지 않는 곳이 있다는 것을 느끼게 된다는 뜻이에요.", variants:["환영받지"], subDefs:[], examples:[{kor:"새로 온 친구가 반 친구들에게 환영받았어요.", eng:"The new student was welcomed by the class."}], translations:{ en:{ term:"to be welcomed", mainDef:"if you are welcomed, others greet you gladly.", contextDef:"Children come to feel that some places don't want them." } } },
            { term:"위축되다", mainDef:"누군가가 위축되면, 겁이 나거나 기가 죽어서 자신 있게 행동하지 못한다는 뜻이에요.", hanja:"위(萎 시들다) + 축(縮 줄어들다)", contextDef:"아이들이 반갑지 않은 손님 취급을 받으며 마음이 작아질 수 있다는 걱정이에요.", variants:["위축될"], subDefs:[], examples:[{kor:"발표 때 실수한 뒤로 그는 많이 위축됐어요.", eng:"After making a mistake in his presentation, he lost a lot of confidence."}], translations:{ en:{ term:"to shrink back, to be discouraged", mainDef:"if you shrink back, you lose confidence out of fear and can't act boldly.", contextDef:"The worry that children may lose confidence after being treated as unwanted." } } },
            { term:"받아들이다", mainDef:"누군가가 어떤 것을 받아들이면, 그것을 옳거나 당연하다고 여기고 따른다는 뜻이에요.", contextDef:"배제를 당연한 일로 여기게 되는 것을 걱정하는 말이에요.", variants:["받아들여지면","받아들이기"], subDefs:[], examples:[{kor:"그는 친구의 충고를 기꺼이 받아들였어요.", eng:"He gladly took his friend's advice."}], translations:{ en:{ term:"to accept", mainDef:"if you accept something, you treat it as right or natural and go along with it.", contextDef:"The worry that exclusion will come to be seen as normal." } } },
            { term:"우려", mainDef:"우려는 앞으로 나쁜 일이 생길까 봐 걱정하는 마음이에요.", hanja:"우(憂 근심하다) + 려(慮 생각하다)", contextDef:"노○○존이 계속 늘어날 수 있다는 걱정이에요.", variants:["우려"], subDefs:[], examples:[{kor:"물가가 계속 오를 거라는 우려가 커요.", eng:"There are growing concerns that prices will keep rising."}], translations:{ en:{ term:"concern, worry", mainDef:"a worried feeling that something bad might happen.", contextDef:"The worry that no-○○ zones might keep multiplying." } } },
            { term:"부당하다", mainDef:"어떤 일이 부당하면, 이치에 맞지 않고 옳지 않다는 뜻이에요.", hanja:"부(不 아니다) + 당(當 마땅하다)", contextDef:"아무 잘못이 없는 사람까지 막는 것이 옳지 않다는 뜻이에요.", variants:["부당하다는"], subDefs:[], examples:[{kor:"이유 없이 해고하는 건 부당해요.", eng:"Firing someone for no reason is unfair."}], translations:{ en:{ term:"to be unfair, unjust", mainDef:"if something is unjust, it doesn't make sense and isn't right.", contextDef:"It's wrong to block even people who did nothing wrong." } } },
            { term:"주를 이루다", mainDef:"어떤 것이 주를 이루면, 전체 가운데 가장 많거나 가장 중심이 된다는 뜻이에요.", contextDef:"각 의견 쪽에서 가장 많이 나온 생각을 정리할 때 쓰였어요.", variants:["주를 이뤘어요"], subDefs:[{subTerm:"• 주(主)", subDef:"가장 중심이 되는 것이에요. 예) 주된 이유, 주로."}], examples:[{kor:"이번 행사에는 20대 참가자가 주를 이뤘어요.", eng:"Most of the participants at this event were in their twenties."}], translations:{ en:{ term:"to make up the majority", mainDef:"if something makes up the majority, it is the largest or central part of the whole.", contextDef:"Used to summarize the most common opinion in each group.", subDefs:[{term:"주 (主)", def:"the main or central thing; e.g. main reason, mainly."}] } } },
            { term:"동조하다", mainDef:"누군가가 어떤 생각에 동조하면, 그 생각에 같은 편이 되어 따른다는 뜻이에요.", hanja:"동(同 같다) + 조(調 고르다)", contextDef:"노○○존을 만들자는 말에 맞장구치고 따르는 것을 가리켜요.", variants:["동조하는"], subDefs:[], examples:[{kor:"친구들이 거짓말에 동조하는 걸 보고 실망했어요.", eng:"I was disappointed to see my friends go along with the lie."}], translations:{ en:{ term:"to go along with, to side with", mainDef:"if you go along with an idea, you join its side and follow it.", contextDef:"Refers to agreeing with and following calls for no-○○ zones." } } },
            { term:"본질", mainDef:"본질은 어떤 것의 겉이 아닌 가장 깊은 속, 그것을 그것이게 하는 성질이에요.", hanja:"본(本 근본) + 질(質 바탕)", contextDef:"노○○존 뒤에 숨은 진짜 마음은 미워하는 감정이라는 주장이에요.", variants:["본질"], subDefs:[], examples:[{kor:"문제의 본질을 봐야 제대로 해결할 수 있어요.", eng:"You have to see the core of the problem to really solve it."}], translations:{ en:{ term:"essence, core", mainDef:"not the surface but the deepest part of something, what makes it what it is.", contextDef:"The claim that the real feeling behind no-○○ zones is hatred." } } },
            { term:"혐오", mainDef:"혐오는 어떤 사람이나 무리를 몹시 싫어하고 미워하는 마음이에요.", hanja:"혐(嫌 싫어하다) + 오(惡 미워하다)", contextDef:"특정한 사람들을 싫어하는 마음이 노○○존을 만든다는 비판에 쓰였어요.", variants:["혐오"], subDefs:[], examples:[{kor:"인터넷에서 혐오 표현이 늘고 있어요.", eng:"Hate speech is increasing online."}], translations:{ en:{ term:"hatred, hate", mainDef:"strong dislike and hatred toward a person or group.", contextDef:"Used in the criticism that dislike of certain people creates no-○○ zones." } } },
            { term:"제재하다", mainDef:"누군가를 제재하면, 규칙을 어긴 일에 벌을 주거나 하지 못하게 막는다는 뜻이에요.", hanja:"제(制 억제하다) + 재(裁 마르다)", contextDef:"법으로 벌을 주거나 잘못된 행동에 대가를 치르게 하는 것을 말해요.", variants:["제재해야","제재할","제재"], subDefs:[], examples:[{kor:"리그는 규칙을 어긴 팀을 제재했어요.", eng:"The league penalized the team that broke the rules."}], translations:{ en:{ term:"to sanction, to penalize", mainDef:"if you sanction someone, you punish or stop them for breaking rules.", contextDef:"Punishing by law, or making wrong behavior have consequences." } } },
            { term:"따가운 시선", mainDef:"따가운 시선은 잘못했다고 여기며 날카롭게 바라보는 눈길이에요.", contextDef:"노○○존을 만든 가게가 사람들에게 좋지 않은 눈총을 받는 것은 당연하다는 뜻이에요.", variants:["따가운 시선"], subDefs:[{subTerm:"• 따갑다", subDef:"원래 찌르는 듯 아프다는 뜻인데, 눈길이나 말에 쓰면 '날카롭고 불편하다'는 느낌이 돼요."}], examples:[{kor:"새치기를 하자 주변 사람들의 따가운 시선이 느껴졌어요.", eng:"When I cut in line, I could feel the disapproving stares around me."}], translations:{ en:{ term:"disapproving looks", mainDef:"sharp, critical stares from people who think you did something wrong.", contextDef:"It's natural for shops that create no-○○ zones to get disapproving looks.", subDefs:[{term:"따갑다", def:"literally stinging; used for looks or words, it means sharp and uncomfortable."}] } } },
            { term:"누리다", mainDef:"누군가가 어떤 것을 누리면, 좋은 것을 마음껏 즐기거나 가진다는 뜻이에요.", contextDef:"누구나 가게와 서비스를 자유롭게 쓸 수 있어야 한다는 뜻이에요.", variants:["누릴"], subDefs:[], examples:[{kor:"휴가 동안 여유를 마음껏 누렸어요.", eng:"I really enjoyed some free time during my vacation."}], translations:{ en:{ term:"to enjoy (a benefit)", mainDef:"if you enjoy something, you freely have or make use of something good.", contextDef:"Everyone should be able to use shops and services freely." } } },
            { term:"다 묶어서", mainDef:"'다 묶어서'는 서로 다른 사람들을 하나로 모아 똑같이 여긴다는 뜻이에요.", contextDef:"잘못한 사람과 아닌 사람을 나누지 않고 한꺼번에 막는 것을 말해요.", variants:["다 묶어서"], subDefs:[{subTerm:"• 묶다", subDef:"끈으로 한데 매는 것인데, 여러 사람이나 것을 한 무리로 보는 뜻으로도 써요."}], examples:[{kor:"우리 반 전체를 다 묶어서 벌을 주는 건 불공평해요.", eng:"Punishing our whole class all together isn't fair."}], translations:{ en:{ term:"lumping everyone together", mainDef:"putting different people into one bundle and treating them all the same.", contextDef:"Blocking everyone at once without separating those who did wrong from those who didn't.", subDefs:[{term:"묶다", def:"to tie together; also used for treating several people or things as one group."}] } } },
            { term:"규제", mainDef:"규제는 규칙을 정해 어떤 일을 하지 못하게 막는 것이에요.", hanja:"규(規 법) + 제(制 억제하다)", contextDef:"가게에 피해를 주는 행동을 막을 규칙을 가리켜요.", variants:["규제"], subDefs:[], examples:[{kor:"정부가 일회용 컵 규제를 강화했어요.", eng:"The government tightened regulations on disposable cups."}], translations:{ en:{ term:"regulation", mainDef:"setting rules to stop something from being done.", contextDef:"Refers to rules to stop behavior that harms shops." } } },
            { term:"제도", mainDef:"제도는 사회에서 정해 놓고 따르는 틀이나 방법이에요.", hanja:"제(制 짓다) + 도(度 법도)", contextDef:"손님의 잘못된 행동을 처리할 수 있는 사회의 틀을 말해요.", variants:["제도"], subDefs:[], examples:[{kor:"새로운 육아 휴직 제도가 생겼어요.", eng:"A new parental leave system was introduced."}], translations:{ en:{ term:"system, institution", mainDef:"a set framework or method that a society follows.", contextDef:"A social system for dealing with customers' bad behavior." } } },
            { term:"처벌", mainDef:"처벌은 잘못한 사람에게 벌을 주는 것이에요.", hanja:"처(處 처리하다) + 벌(罰 벌)", contextDef:"가게에 피해를 준 사람이 제대로 대가를 받아야 한다는 뜻이에요.", variants:["처벌"], subDefs:[], examples:[{kor:"음주 운전은 무거운 처벌을 받아요.", eng:"Drunk driving is heavily punished."}], translations:{ en:{ term:"punishment", mainDef:"giving a penalty to someone who did wrong.", contextDef:"People who harm a shop should face proper consequences." } } },
            { term:"인식", mainDef:"인식은 어떤 것에 대해 사람들이 알고 이해하는 생각이에요.", hanja:"인(認 알다) + 식(識 알다)", contextDef:"잘못하면 벌을 받는다는 생각이 사람들 사이에 퍼지는 것을 말해요.", variants:["인식"], subDefs:[], examples:[{kor:"환경에 대한 사람들의 인식이 많이 바뀌었어요.", eng:"People's awareness of the environment has changed a lot."}], translations:{ en:{ term:"awareness, perception", mainDef:"what people know and understand about something.", contextDef:"The idea, shared among people, that wrongdoing gets punished." } } },
            { term:"재발", mainDef:"재발은 한 번 있었던 나쁜 일이 다시 생기는 것이에요.", hanja:"재(再 다시) + 발(發 일어나다)", contextDef:"같은 피해가 다시 생기지 않게 한다는 뜻이에요.", variants:["재발"], subDefs:[], examples:[{kor:"회사는 사고 재발을 막기 위해 규칙을 바꿨어요.", eng:"The company changed its rules to keep the accident from happening again."}], translations:{ en:{ term:"recurrence", mainDef:"a bad thing that happened once happening again.", contextDef:"Keeping the same damage from happening again." } } },
            { term:"방지하다", mainDef:"누군가가 어떤 일을 방지하면, 그 일이 생기지 않게 막는다는 뜻이에요.", hanja:"방(防 막다) + 지(止 그치다)", contextDef:"처벌이 있으면 같은 일이 되풀이되는 것을 막을 수 있다는 뜻이에요.", variants:["방지하는"], subDefs:[], examples:[{kor:"미끄럼 방지 매트를 욕실에 깔았어요.", eng:"I put a non-slip mat in the bathroom."}], translations:{ en:{ term:"to prevent", mainDef:"if you prevent something, you stop it from happening.", contextDef:"Punishment could stop the same thing from happening again." } } },
            { term:"-는 식", mainDef:"'-는 식'은 어떤 일을 하는 방법이나 모양이 그렇다는 뜻이에요. '이런 식', '요청하는 식으로'처럼 써요.", contextDef:"행동을 기준으로 규칙을 만드는 방법, 앞의 말과 같은 태도, 어린이를 모두 막는 대응을 설명할 때 여러 번 쓰였어요.", variants:["이런 식의","요청하는 식으로","는 식일","막는 식의"], subDefs:[{"subTerm":"• -는 식으로 / -는 식의 / -는 식이다","subDef":"'그런 방법으로', '그런 방법의', '그런 모양이다'라는 뜻이에요. 예) 이런 식으로 하면 안 돼요. 대충 하는 식의 태도."}], examples:[{"kor":"그렇게 소리를 지르는 식으로는 문제를 풀 수 없어요.","eng":"You can't solve the problem by shouting like that."}], translations:{"en":{"term":"-는 식 (the way of doing…)","mainDef":"-는 식 describes the way or manner in which something is done; used as 이런 식 (this way), 요청하는 식으로 (by way of asking).","contextDef":"Used several times: for making behavior-based rules, for an attitude like the one quoted, and for a response that bars all children.","subDefs":[{"term":"-는 식으로 / -는 식의 / -는 식이다","def":"'in that way', 'of that kind', 'it's like that'; e.g. You shouldn't do it this way. A sloppy kind of attitude."}]}} },
            { term:"배척하다", mainDef:"누군가를 배척하면, 싫어해서 가까이 오지 못하게 밀어낸다는 뜻이에요.", hanja:"배(排 밀어내다) + 척(斥 물리치다)", contextDef:"어떤 무리를 사회에서 따돌리는 분위기를 걱정하는 말이에요.", variants:["배척하는"], subDefs:[], examples:[{kor:"새로운 생각을 무조건 배척하면 발전할 수 없어요.", eng:"If you reject new ideas out of hand, you can't make progress."}], translations:{ en:{ term:"to reject, to shun", mainDef:"if you shun someone, you dislike them and push them away.", contextDef:"The worry about a mood of shutting certain groups out of society." } } },
            { term:"배척받을 만해", mainDef:"'-ㄹ 만하다'는 그렇게 될 이유가 충분하다는 뜻이에요. '배척받을 만해'는 밀려나도 어쩔 수 없다는 말이에요.", contextDef:"어떤 사람들은 막혀도 싸다고 생각하는 쪽의 말을 옮긴 것이에요.", variants:["배척받을 만해"], subDefs:[{subTerm:"• -ㄹ/을 만하다", subDef:"그럴 이유나 가치가 충분하다는 뜻이에요. 예) 볼 만한 영화, 혼날 만해요."}], examples:[{kor:"그렇게 늦었으니 혼날 만해요.", eng:"He was that late, so he deserves to get scolded."}], translations:{ en:{ term:"(they) deserve to be shunned", mainDef:"-ㄹ 만하다 means there's enough reason for something; here: 'they deserve to be pushed out.'", contextDef:"Quotes the view that some people deserve to be blocked.", subDefs:[{term:"-ㄹ/을 만하다", def:"there's enough reason or value for it; e.g. a movie worth seeing, he deserves to be scolded."}] } } },
            { term:"자영업자", mainDef:"자영업자는 회사에 다니지 않고 자기 가게나 사업을 꾸리는 사람이에요.", hanja:"자(自 스스로) + 영(營 꾀하다) + 업(業 일) + 자(者 사람)", contextDef:"카페 사장님처럼 작은 가게를 하는 사람들을 가리켜요.", variants:["자영업자"], subDefs:[], examples:[{kor:"경기가 나빠서 자영업자들이 힘들어해요.", eng:"Small business owners are struggling because the economy is bad."}], translations:{ en:{ term:"self-employed person, small business owner", mainDef:"someone who runs their own shop or business instead of working for a company.", contextDef:"Refers to people running small shops, like the café owner." } } },
            { term:"민폐", mainDef:"민폐는 다른 사람에게 끼치는 괴로움이나 손해예요.", hanja:"민(民 백성) + 폐(弊 해지다)", contextDef:"손님이 가게나 다른 손님에게 계속 불편을 주는 것을 말해요.", variants:["민폐"], subDefs:[], examples:[{kor:"밤늦게 큰 소리로 음악을 트는 건 이웃에게 민폐예요.", eng:"Blasting music late at night is a nuisance to the neighbors."}], translations:{ en:{ term:"nuisance, bother", mainDef:"trouble or harm you cause other people.", contextDef:"Customers repeatedly bothering the shop or other customers." } } },
            { term:"조치를 취하다", mainDef:"누군가가 조치를 취하면, 어떤 문제를 해결하려고 알맞은 행동을 한다는 뜻이에요.", contextDef:"말로 해도 안 되니 사장님이 출입 금지라는 방법을 썼다는 뜻이에요.", variants:["조치를 취한"], subDefs:[{subTerm:"• 조치(措置)", subDef:"조(措, 두다) + 치(置, 두다). 문제를 해결하려고 하는 일이에요."}], examples:[{kor:"학교는 안전을 위해 바로 조치를 취했어요.", eng:"The school took action right away for safety."}], translations:{ en:{ term:"to take measures", mainDef:"if you take measures, you act appropriately to solve a problem.", contextDef:"Since words didn't work, the owner resorted to a ban.", subDefs:[{term:"조치 (措置)", def:"조 (措, place) + 치 (置, put): steps taken to deal with a problem."}] } } },
            { term:"쫓아내다", mainDef:"누군가를 쫓아내면, 그 사람을 억지로 밖으로 나가게 한다는 뜻이에요.", contextDef:"문제를 일으키는 손님을 그때마다 내보내기는 힘들다는 뜻이에요.", variants:["쫓아낼"], subDefs:[], examples:[{kor:"집주인이 고양이를 마당에서 쫓아냈어요.", eng:"The homeowner chased the cat out of the yard."}], translations:{ en:{ term:"to kick out, to drive out", mainDef:"if you kick someone out, you force them to leave.", contextDef:"It's hard to throw out troublemaking customers every time." } } },
            { term:"무고하다", mainDef:"누군가가 무고하면, 아무 잘못이 없다는 뜻이에요.", hanja:"무(無 없다) + 고(辜 허물)", contextDef:"잘못하지 않았는데도 막히는 남학생들을 가리켜요.", variants:["무고한"], subDefs:[], examples:[{kor:"전쟁으로 무고한 사람들이 다쳤어요.", eng:"Innocent people were hurt in the war."}], translations:{ en:{ term:"to be innocent", mainDef:"if someone is innocent, they did nothing wrong.", contextDef:"Refers to boys who get blocked even though they did nothing wrong." } } },
            { term:"마찰", mainDef:"마찰은 사람들 사이에서 생각이나 이익이 부딪쳐 생기는 다툼이에요.", hanja:"마(摩 문지르다) + 찰(擦 비비다)", contextDef:"손님끼리 부딪쳐 생기는 다툼을 말해요.", variants:["마찰"], subDefs:[], examples:[{kor:"두 부서 사이에 작은 마찰이 있었어요.", eng:"There was some friction between the two departments."}], translations:{ en:{ term:"friction, conflict", mainDef:"a clash that happens when people's ideas or interests collide.", contextDef:"Refers to clashes between customers." } } },
            { term:"운영상", mainDef:"'운영상'은 가게나 모임을 꾸려 나가는 데 있어서라는 뜻이에요.", hanja:"운(運 옮기다) + 영(營 꾀하다) + 상(上 위, ~에 관한)", contextDef:"가게를 꾸려 가는 데 필요한 이유 때문이라는 뜻이에요.", variants:["운영상"], subDefs:[{subTerm:"• -상(上)", subDef:"명사 뒤에 붙어 '~에 관한 점에서'라는 뜻을 더해요. 예) 건강상, 교육상, 편의상."}], examples:[{kor:"운영상의 문제로 이번 주는 문을 닫습니다.", eng:"We are closed this week due to operational issues."}], translations:{ en:{ term:"operational, in terms of running (a business)", mainDef:"'as far as running a shop or group is concerned.'", contextDef:"For reasons needed to run the shop.", subDefs:[{term:"-상 (上)", def:"attached to a noun to mean 'in terms of'; e.g. for health reasons, educationally, for convenience."}] } } },
            { term:"재량", mainDef:"재량은 스스로 판단해서 알맞게 정할 수 있는 힘이에요.", hanja:"재(裁 결단하다) + 량(量 헤아리다)", contextDef:"사장님이 자기 판단으로 영업 방법을 정할 수 있다는 뜻이에요.", variants:["재량"], subDefs:[], examples:[{kor:"숙제 양은 선생님 재량에 맡겨요.", eng:"The amount of homework is left to the teacher's discretion."}], translations:{ en:{ term:"discretion", mainDef:"the power to decide what's appropriate by your own judgment.", contextDef:"The owner can decide how to do business by their own judgment." } } },
            { term:"범위", mainDef:"범위는 어떤 일이 미치는 넓이나 한계예요.", hanja:"범(範 법) + 위(圍 둘레)", contextDef:"사장님이 결정할 수 있는 선 안에 있다는 뜻이에요.", variants:["범위"], subDefs:[], examples:[{kor:"시험 범위가 너무 넓어요.", eng:"The material covered on the exam is too broad."}], translations:{ en:{ term:"range, scope", mainDef:"the extent or limits that something covers.", contextDef:"Within the line of what the owner is allowed to decide." } } },
            { term:"방해가 되다", mainDef:"어떤 것이 방해가 되면, 다른 일이 잘되지 못하게 막는다는 뜻이에요.", contextDef:"손님의 행동이 장사를 어렵게 만든다는 뜻이에요.", variants:["방해가 되고"], subDefs:[{subTerm:"• 방해(妨害)", subDef:"방(妨, 거리끼다) + 해(害, 해치다). 남의 일을 못 하게 막는 것이에요."}], examples:[{kor:"옆자리 소음이 공부에 방해가 돼요.", eng:"The noise from the next seat is getting in the way of my studying."}], translations:{ en:{ term:"to get in the way", mainDef:"if something gets in the way, it keeps something else from going well.", contextDef:"The customer's behavior makes it hard to run the business.", subDefs:[{term:"방해 (妨害)", def:"방 (妨, hinder) + 해 (害, harm): stopping someone from doing something."}] } } },
            { term:"감당하다", mainDef:"누군가가 어떤 일을 감당하면, 그 일을 맡아서 끝까지 해낸다는 뜻이에요.", hanja:"감(堪 견디다) + 당(當 맡다)", contextDef:"사장님이 견디기 힘든 손님을 말해요.", variants:["감당하기"], subDefs:[], examples:[{kor:"혼자서 이 일을 다 감당하기는 어려워요.", eng:"It's hard to handle all this work alone."}], translations:{ en:{ term:"to handle, to cope with", mainDef:"if you handle something, you take it on and see it through.", contextDef:"Refers to customers the owner finds hard to cope with." } } },
            { term:"재방문", mainDef:"재방문은 한 번 갔던 곳에 다시 찾아가는 것이에요.", hanja:"재(再 다시) + 방(訪 찾다) + 문(問 묻다)", contextDef:"손님도 마음에 안 드는 가게에는 다시 가지 않는다는 비교에 쓰였어요.", variants:["재방문"], subDefs:[], examples:[{"kor":"음식이 맛있어서 재방문할 생각이에요.","eng":"The food was great, so I'm planning to go back."}], translations:{"en":{"term":"return visit, going back","mainDef":"visiting a place again after going there once.","contextDef":"Used in the comparison that customers don't go back to shops they dislike."}} },
            { term:"불매하다", mainDef:"누군가가 불매하면, 어떤 가게나 회사의 물건을 일부러 사지 않는다는 뜻이에요.", hanja:"불(不 아니다) + 매(買 사다)", contextDef:"손님도 가게가 싫으면 안 사는 것처럼, 사장님도 고를 수 있다는 비교에 쓰였어요.", variants:["불매하잖아"], subDefs:[{subTerm:"• -잖아", subDef:"듣는 사람도 이미 아는 사실을 확인시킬 때 써요. 높임말은 '-잖아요'예요. 예) 어제 말했잖아. 너도 봤잖아."}], examples:[{kor:"많은 사람이 그 회사 제품을 불매하기 시작했어요.", eng:"Many people started boycotting that company's products."}], translations:{ en:{ term:"to boycott", mainDef:"if you boycott a shop or company, you deliberately refuse to buy its products.", contextDef:"Used in a comparison: just as customers stop buying from shops they dislike, owners can choose too.", subDefs:[{term:"-잖아", def:"reminds the listener of something they already know ('you know'); polite form -잖아요. e.g. I told you yesterday. You saw it too."}] } } },
            { term:"보장되다", mainDef:"어떤 것이 보장되면, 그것을 누릴 수 있도록 확실하게 지켜진다는 뜻이에요.", hanja:"보(保 지키다) + 장(障 막다)", contextDef:"사장님이 손님을 고를 자유도 지켜져야 한다는 뜻이에요.", variants:["보장되어야"], subDefs:[], examples:[{kor:"모든 노동자의 휴식 시간이 보장되어야 해요.", eng:"Every worker's break time should be guaranteed."}], translations:{ en:{ term:"to be guaranteed", mainDef:"if something is guaranteed, it is firmly protected so people can have it.", contextDef:"The owner's freedom to choose customers should also be protected." } } },
            { term:"연령대", mainDef:"연령대는 비슷한 나이의 사람들을 10대, 20대처럼 묶어 부르는 말이에요.", hanja:"연(年 해) + 령(齡 나이) + 대(帶 띠)", contextDef:"나이를 기준으로 한 무리 전체를 막는 것을 비판할 때 쓰였어요.", variants:["연령대"], subDefs:[], examples:[{"kor":"이 드라마는 모든 연령대가 즐겨 봐요.","eng":"People of all ages enjoy watching this drama."}], translations:{"en":{"term":"age group","mainDef":"a way of grouping people of similar age, like teens or people in their twenties.","contextDef":"Used in criticizing the blocking of an entire group based on age."}} },
