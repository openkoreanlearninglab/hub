            { term:"공감하다", mainDef:"누군가의 마음에 공감하면, 그 사람의 기분이나 생각을 나도 그렇다고 느낀다는 뜻이에요.", hanja:"공(共 함께) + 감(感 느끼다)", contextDef:"가게가 겪는 어려움을 손님 입장에서도 이해할 수 있다는 뜻이에요.", variants:["공감할"], subDefs:[], examples:[{kor:"친구의 고민을 듣고 많이 공감했어요.", eng:"I really related to my friend's worries."}], translations:{ en:{ term:"to empathize, to relate to", mainDef:"if you empathize with someone, you feel their feelings or thoughts as your own.", contextDef:"As a customer, you can still understand the shop's difficulties." } } },
            { term:"지속 가능하다", mainDef:"어떤 방식이 지속 가능하면, 오랫동안 문제없이 계속할 수 있다는 뜻이에요.", contextDef:"불편한 사람을 밀어내기만 하는 사회가 오래갈 수 있을지 의심하는 말이에요.", variants:["지속 가능할까"], subDefs:[{subTerm:"• 지속(持續)", subDef:"지(持, 가지다) + 속(續, 잇다). 어떤 상태가 오래 이어지는 것이에요."}], examples:[{kor:"지속 가능한 에너지를 개발해야 해요.", eng:"We need to develop sustainable energy."}], translations:{ en:{ term:"to be sustainable", mainDef:"if a way of doing things is sustainable, it can go on for a long time without problems.", contextDef:"Doubts whether a society that just pushes out uncomfortable people can last.", subDefs:[{term:"지속 (持續)", def:"지 (持, hold) + 속 (續, continue): a state lasting a long time."}] } } },
            { term:"회의감", mainDef:"회의감은 어떤 것이 맞는지 믿지 못하고 의심하는 마음이에요.", hanja:"회(懷 품다) + 의(疑 의심하다) + 감(感 느끼다)", contextDef:"이런 방식이 오래갈 수 있을지 믿기 어렵다는 마음이에요.", variants:["회의감"], subDefs:[], examples:[{kor:"같은 일만 반복하다 보니 회의감이 들었어요.", eng:"Doing the same thing over and over made me start to doubt it all."}], translations:{ en:{ term:"skepticism, doubt", mainDef:"a feeling of not believing something is right and doubting it.", contextDef:"The feeling that it's hard to believe this approach can last." } } },
            { term:"언행", mainDef:"언행은 사람이 하는 말과 행동이에요.", hanja:"언(言 말씀) + 행(行 다니다)", contextDef:"다른 손님을 기분 나쁘게 하는 말과 행동을 가리켜요.", variants:["언행"], subDefs:[], examples:[{kor:"공인은 언행을 조심해야 해요.", eng:"Public figures need to watch what they say and do."}], translations:{ en:{ term:"words and actions, conduct", mainDef:"what a person says and does.", contextDef:"Words and actions that make other customers uncomfortable." } } },
            { term:"퇴장", mainDef:"퇴장은 어떤 곳에서 밖으로 나가는 것이에요.", hanja:"퇴(退 물러나다) + 장(場 마당)", contextDef:"문제를 일으킨 손님에게 나가 달라고 하는 것을 말해요.", variants:["퇴장"], subDefs:[], examples:[{kor:"그 선수는 반칙으로 퇴장을 당했어요.", eng:"That player was sent off for a foul."}], translations:{ en:{ term:"leaving, being sent out", mainDef:"going out of a place.", contextDef:"Asking a customer who causes trouble to leave." } } },
            { term:"초점을 맞추다", mainDef:"누군가가 어떤 것에 초점을 맞추면, 그것을 가장 중요하게 보고 집중한다는 뜻이에요.", contextDef:"누구인지가 아니라 무엇을 했는지를 기준으로 삼자는 뜻이에요.", variants:["초점을 맞춘"], subDefs:[{subTerm:"• 초점(焦點)", subDef:"초(焦, 타다) + 점(點, 점). 사진기나 눈이 가장 또렷하게 보는 곳이에요. 여기서는 '가장 중요한 부분'이에요."}], examples:[{kor:"이번 회의는 예산 문제에 초점을 맞췄어요.", eng:"This meeting focused on the budget issue."}], translations:{ en:{ term:"to focus on", mainDef:"if you focus on something, you treat it as most important and concentrate on it.", contextDef:"Judge by what someone did, not by who they are.", subDefs:[{term:"초점 (焦點)", def:"초 (焦, burn) + 점 (點, point): the point a camera or eye sees most clearly; here, the most important part."}] } } },
            { term:"규정", mainDef:"규정은 모두가 지키도록 정해 놓은 규칙이에요.", hanja:"규(規 법) + 정(定 정하다)", contextDef:"행동을 기준으로 하는 가게의 규칙을 말해요.", variants:["규정"], subDefs:[], examples:[{kor:"회사 규정에 따라 휴가를 신청하세요.", eng:"Please apply for leave according to company rules."}], translations:{ en:{ term:"rule, regulation", mainDef:"a rule set for everyone to follow.", contextDef:"Shop rules based on behavior." } } },
            { term:"소란", mainDef:"소란은 시끄럽게 떠들어서 어수선한 것이에요.", hanja:"소(騷 떠들다) + 란(亂 어지럽다)", contextDef:"욕설과 함께 가게에서 하지 말아야 할 행동으로 나와요.", variants:["소란"], subDefs:[], examples:[{kor:"밤늦게 복도에서 소란을 피우면 안 돼요.", eng:"You shouldn't make a racket in the hallway late at night."}], translations:{ en:{ term:"disturbance, commotion", mainDef:"loud noise and fuss that creates disorder.", contextDef:"Listed with swearing as behavior not allowed in the shop." } } },
            { term:"적절하다", mainDef:"어떤 것이 적절하면, 상황에 꼭 알맞다는 뜻이에요.", hanja:"적(適 맞다) + 절(切 꼭)", contextDef:"무리를 막는 것보다 행동을 기준으로 하는 것이 더 알맞다는 뜻이에요.", variants:["적절하지"], subDefs:[], examples:[{kor:"면접에는 적절한 옷차림이 중요해요.", eng:"Appropriate clothing matters for a job interview."}], translations:{ en:{ term:"to be appropriate", mainDef:"if something is appropriate, it fits the situation just right.", contextDef:"Basing rules on behavior is more fitting than blocking a group." } } },
            { term:"배제를 가해도", mainDef:"'배제를 가하다'는 다른 사람을 밀어내는 일을 한다는 뜻이에요. '-아/어도 되다'는 해도 괜찮다는 뜻이에요.", contextDef:"밀려나 본 사람이 다른 사람을 밀어내도 괜찮다고 생각하게 된다는 걱정이에요.", variants:["배제를 가해도"], subDefs:[{subTerm:"• 가하다(加)", subDef:"어떤 힘이나 행동을 남에게 주다. 주로 나쁜 일에 써요. 예) 압력을 가하다, 폭력을 가하다."},{subTerm:"• -아/어도 되다", subDef:"그렇게 해도 괜찮다는 허락의 뜻이에요. 예) 들어가도 돼요?"}], examples:[{kor:"약한 사람에게 압력을 가하면 안 돼요.", eng:"You shouldn't put pressure on the weak."}], translations:{ en:{ term:"(it's okay) to exclude (others)", mainDef:"배제를 가하다 means to do the excluding; -아/어도 되다 means it's okay to do it.", contextDef:"The worry that people who've been excluded will think it's fine to exclude others.", subDefs:[{term:"가하다 (加)", def:"to inflict a force or action on someone, usually something bad; e.g. apply pressure, commit violence."},{term:"-아/어도 되다", def:"permission: it's okay to do it; e.g. May I come in?"}] } } },
            { term:"피해자 입장", mainDef:"피해자 입장은 손해를 입거나 다친 사람의 처지에서 바라보는 것이에요.", contextDef:"가게를 하다가 힘든 일을 겪은 사람의 눈으로 보면 사장님을 이해할 수 있다는 뜻이에요.", variants:["피해자 입장"], subDefs:[{"subTerm":"• 피해자(被害者)","subDef":"피(被, 입다) + 해(害, 해치다) + 자(者, 사람). 손해를 입거나 다친 사람이에요."},{"subTerm":"• 입장(立場)","subDef":"입(立, 서다) + 장(場, 마당). 어떤 사람이 놓인 처지나 그 처지에서 가지는 생각이에요."}], examples:[{"kor":"피해자 입장에서 생각해 보면 그 사과는 너무 짧았어요.","eng":"From the victim's point of view, that apology was far too short."}], translations:{"en":{"term":"the victim's position","mainDef":"seeing things from the situation of someone who was harmed or hurt.","contextDef":"From the point of view of someone who had a hard time running a shop, you can understand the owner.","subDefs":[{"term":"피해자 (被害者)","def":"피 (被, suffer) + 해 (害, harm) + 자 (者, person): a person who was harmed."},{"term":"입장 (立場)","def":"입 (立, stand) + 장 (場, place): the situation someone is in, or their view from it."}]}} },
            { term:"이해할 수밖에 없어", mainDef:"'-ㄹ 수밖에 없다'는 다른 방법이 없어서 그렇게 할 수밖에 없다는 뜻이에요.", contextDef:"피해를 본 사람 입장이 되면 사장님을 이해하지 않을 수 없다는 뜻이에요.", variants:["이해할 수밖에 없어"], subDefs:[{subTerm:"• -ㄹ/을 수밖에 없다", subDef:"그것 말고는 다른 길이 없다는 뜻이에요. 예) 버스가 없어서 걸을 수밖에 없었어요."}], examples:[{kor:"비가 너무 많이 와서 여행을 미룰 수밖에 없었어요.", eng:"It rained so hard that we had no choice but to put off the trip."}], translations:{ en:{ term:"(you) can't help but understand", mainDef:"-ㄹ 수밖에 없다 means there's no other option but to do it.", contextDef:"Once you're in the victim's position, you can't help understanding the owner.", subDefs:[{term:"-ㄹ/을 수밖에 없다", def:"there's no other way; e.g. There was no bus, so I had no choice but to walk."}] } } },
            { term:"접다", mainDef:"누군가가 가게를 접으면, 하던 장사를 그만두고 문을 닫는다는 뜻이에요.", contextDef:"아이들을 위한 가게를 하다가 그만뒀다는 뜻이에요.", variants:["접었고"], subDefs:[], examples:[{kor:"손님이 줄어서 삼촌은 식당을 접었어요.", eng:"Customers dropped off, so my uncle closed his restaurant."}], translations:{ en:{ term:"to close down (a business)", mainDef:"if you close down a shop, you stop the business and shut the doors.", contextDef:"The writer ran a business for children and then gave it up." } } },
            { term:"트라우마", mainDef:"트라우마는 아주 힘든 일을 겪은 뒤 오래 남는 마음의 상처예요.", contextDef:"가게를 하며 겪은 일 때문에 아이들만 봐도 힘들다는 뜻이에요.", variants:["트라우마"], subDefs:[{subTerm:"• 트라우마 ← trauma", subDef:"영어 'trauma'를 소리 나는 대로 적은 말이에요."}], examples:[{kor:"그 사고 이후로 물에 대한 트라우마가 생겼어요.", eng:"Ever since the accident, I've had a trauma about water."}], translations:{ en:{ term:"trauma", mainDef:"a lasting emotional wound after going through something very hard.", contextDef:"Because of what happened running the shop, even seeing children is hard.", subDefs:[{term:"트라우마 ← trauma", def:"the English word 'trauma' written in Hangul the way it sounds."}] } } },
            { term:"처사", mainDef:"처사는 어떤 일을 처리하는 방식이에요. 주로 나쁘다고 평가할 때 써요.", hanja:"처(處 처리하다) + 사(事 일)", contextDef:"아이를 막는 것이 차별하는 방식이라는 것을 안다는 뜻이에요.", variants:["처사"], subDefs:[], examples:[{kor:"설명도 없이 해고한 건 부당한 처사예요.", eng:"Firing someone without explanation is unfair treatment."}], translations:{ en:{ term:"treatment, handling (usually criticized)", mainDef:"the way something is dealt with; usually used when judging it negatively.", contextDef:"The writer knows that blocking children is discriminatory treatment." } } },
            { term:"업주", mainDef:"업주는 가게나 사업의 주인이에요. '영업주'라고도 해요.", hanja:"업(業 일) + 주(主 주인)", contextDef:"가게를 하는 사장님의 입장을 말해요.", variants:["영업주","업주"], subDefs:[], examples:[{kor:"그 건물의 업주들이 모여 회의를 했어요.", eng:"The business owners in that building met to hold a meeting."}], translations:{ en:{ term:"business owner", mainDef:"the owner of a shop or business; also called 영업주.", contextDef:"The point of view of the person running the shop." } } },
            { term:"깨닫다", mainDef:"누군가가 어떤 것을 깨달으면, 몰랐던 것을 알게 된다는 뜻이에요.", contextDef:"아이들이 어른들이 자신을 어떻게 보는지 알게 된다는 뜻이에요.", variants:["깨닫게"], subDefs:[], examples:[{kor:"집을 떠나고 나서야 부모님의 사랑을 깨달았어요.", eng:"It was only after I left home that I realized how much my parents loved me."}], translations:{ en:{ term:"to realize", mainDef:"if you realize something, you come to know what you didn't before.", contextDef:"Children realize how adults see them." } } },
            { term:"간혹", mainDef:"'간혹'은 아주 가끔이라는 뜻이에요.", hanja:"간(間 사이) + 혹(或 혹)", contextDef:"외국에도 비슷한 곳이 있기는 하지만 많지 않다는 뜻이에요.", variants:["간혹"], subDefs:[], examples:[{kor:"이 길은 간혹 차가 지나가요.", eng:"A car passes along this road only once in a while."}], translations:{ en:{ term:"occasionally, now and then", mainDef:"'very occasionally.'", contextDef:"Similar places exist abroad, but not many." } } },
            { term:"휴양지", mainDef:"휴양지는 쉬면서 몸과 마음을 편하게 하려고 가는 곳이에요.", hanja:"휴(休 쉬다) + 양(養 기르다) + 지(地 땅)", contextDef:"외국의 성인 전용 공간은 주로 이런 곳에 있다는 뜻이에요.", variants:["휴양지"], subDefs:[], examples:[{kor:"여름마다 바닷가 휴양지에 사람이 몰려요.", eng:"Beach resorts get crowded every summer."}], translations:{ en:{ term:"resort, vacation spot", mainDef:"a place you go to rest and relax.", contextDef:"Adult-only spaces abroad are mostly in places like these." } } },
            { term:"노아줌마존", mainDef:"노아줌마존은 나이 든 여자 손님은 들어올 수 없게 정해 놓은 가게예요.", contextDef:"한국에만 있는 여러 '노○○존'의 예로 나와요.", variants:["노아줌마존"], subDefs:[{"subTerm":"• 아줌마","subDef":"결혼한 중년 여성을 편하게 부르는 말이에요. 상황에 따라 낮잡아 부르는 느낌이 있어서 조심해서 써야 해요."}], examples:[{"kor":"'노아줌마존'이라는 말은 여성과 나이에 대한 차별이라는 비판을 받았어요.","eng":"The term 'no-ajumma zone' was criticized as discrimination based on gender and age."}], translations:{"en":{"term":"no-ajumma zone","mainDef":"a shop that doesn't let middle-aged women in.","contextDef":"Listed as one of the many 'no-○○ zones' found only in Korea.","subDefs":[{"term":"아줌마","def":"a casual word for a married, middle-aged woman; can sound belittling depending on the situation, so use it with care."}]}} },
            { term:"노외국인존", mainDef:"노외국인존은 다른 나라 사람은 들어올 수 없게 정해 놓은 가게예요.", contextDef:"한국의 '노○○존'이 얼마나 다양한지 보여 주는 예로 나와요.", variants:["노외국인존"], subDefs:[{"subTerm":"• 외국인(外國人)","subDef":"외(外, 바깥) + 국(國, 나라) + 인(人, 사람). 다른 나라 사람이에요."}], examples:[{"kor":"여행 중에 노외국인존 식당을 보고 무척 당황했어요.","eng":"I was really taken aback to see a restaurant that banned foreigners while I was traveling."}], translations:{"en":{"term":"no-foreigner zone","mainDef":"a shop that doesn't let people from other countries in.","contextDef":"An example showing how varied Korea's 'no-○○ zones' are.","subDefs":[{"term":"외국인 (外國人)","def":"외 (外, outside) + 국 (國, country) + 인 (人, person): a person from another country."}]}} },
            { term:"공공연하다", mainDef:"어떤 일이 공공연하면, 숨기지 않고 누구나 알 수 있게 드러나 있다는 뜻이에요.", hanja:"공(公 드러내다) + 공(公 드러내다) + 연(然 그러하다)", contextDef:"한국에서는 어떤 사람들을 막는다는 것을 숨기지 않고 밝힌다는 뜻이에요.", variants:["공공연하게"], subDefs:[], examples:[{kor:"그 회사의 문제는 이미 공공연한 비밀이에요.", eng:"That company's problems are already an open secret."}], translations:{ en:{ term:"to be open, public", mainDef:"if something is open, it isn't hidden and anyone can see it.", contextDef:"In Korea, places openly announce whom they keep out." } } },
            { term:"드물다", mainDef:"어떤 것이 드물면, 자주 있지 않고 아주 적다는 뜻이에요.", contextDef:"한국처럼 여러 종류가 있는 나라는 찾기 어렵다는 뜻이에요.", variants:["드물다고"], subDefs:[], examples:[{kor:"이렇게 친절한 가게는 드물어요.", eng:"Shops this friendly are rare."}], translations:{ en:{ term:"to be rare", mainDef:"if something is rare, it doesn't happen often and there is very little of it.", contextDef:"It's hard to find a country with as many kinds as Korea." } } },
            { term:"외신", mainDef:"외신은 다른 나라의 신문이나 방송이에요.", hanja:"외(外 바깥) + 신(信 소식)", contextDef:"BBC, CNN처럼 한국 밖의 방송을 가리켜요.", variants:["외신"], subDefs:[], examples:[{kor:"외신들도 이번 선거 결과를 크게 보도했어요.", eng:"Foreign media also covered the election results widely."}], translations:{ en:{ term:"foreign media", mainDef:"newspapers or broadcasters from other countries.", contextDef:"Media outside Korea, like the BBC and CNN." } } },
            { term:"조명하다", mainDef:"누군가가 어떤 일을 조명하면, 그 일에 관심을 모아 자세히 살펴본다는 뜻이에요.", hanja:"조(照 비추다) + 명(明 밝다)", contextDef:"외국 방송이 한국의 노○○존을 자세히 다뤘다는 뜻이에요.", variants:["조명하기도"], subDefs:[], examples:[{kor:"이 다큐멘터리는 청년들의 삶을 조명해요.", eng:"This documentary shines a light on young people's lives."}], translations:{ en:{ term:"to shine a spotlight on", mainDef:"if you shine a spotlight on something, you draw attention to it and look at it closely.", contextDef:"Foreign broadcasters covered Korea's no-○○ zones in detail." } } },
            { term:"인종", mainDef:"인종은 피부색이나 생김새 같은 몸의 특징에 따라 사람을 나눈 무리예요.", hanja:"인(人 사람) + 종(種 씨, 갈래)", contextDef:"서양에서 큰 사회 갈등으로 번진 차별의 원인으로 나와요.", variants:["인종"], subDefs:[], examples:[{"kor":"그 학교에는 여러 인종의 학생들이 함께 공부해요.","eng":"Students of many races study together at that school."}], translations:{"en":{"term":"race","mainDef":"a way of grouping people by physical features such as skin color or appearance.","contextDef":"Mentioned as a cause of discrimination that grew into major social conflict in the West."}} },
            { term:"계층", mainDef:"계층은 돈이나 지위에 따라 나뉜 사회의 층이에요.", hanja:"계(階 계단) + 층(層 층)", contextDef:"서양에서 인종과 함께 차별의 원인이 됐던 것으로 나와요.", variants:["계층"], subDefs:[], examples:[{kor:"이 정책은 모든 계층에 도움이 돼야 해요.", eng:"This policy should help every social class."}], translations:{ en:{ term:"(social) class", mainDef:"a layer of society divided by money or status.", contextDef:"Mentioned alongside race as a source of discrimination in the West." } } },
            { term:"갈등", mainDef:"갈등은 사람이나 무리 사이에서 생각이 달라 서로 부딪치는 것이에요.", hanja:"갈(葛 칡) + 등(藤 등나무)", contextDef:"서양에서 차별 때문에 생긴 큰 사회 문제를 말해요.", variants:["갈등"], subDefs:[], examples:[{kor:"세대 간 갈등을 줄이려면 대화가 필요해요.", eng:"We need dialogue to reduce conflict between generations."}], translations:{ en:{ term:"conflict", mainDef:"a clash between people or groups who think differently.", contextDef:"The major social problems caused by discrimination in the West." } } },
            { term:"번지다", mainDef:"어떤 일이 번지면, 작게 시작한 것이 점점 크고 넓게 퍼진다는 뜻이에요.", contextDef:"차별이 큰 사회 문제로 커졌다는 뜻이에요.", variants:["번진"], subDefs:[], examples:[{kor:"작은 말다툼이 큰 싸움으로 번졌어요.", eng:"A small argument turned into a big fight."}], translations:{ en:{ term:"to spread, to grow into", mainDef:"if something spreads, it starts small and grows bigger and wider.", contextDef:"Discrimination grew into a major social problem." } } },
            { term:"경계하다", mainDef:"누군가가 어떤 것을 경계하면, 그것이 나쁜 결과를 낳지 않도록 조심한다는 뜻이에요.", hanja:"경(警 경계하다) + 계(戒 조심하다)", contextDef:"서양에서는 차별하는 말을 특히 조심한다는 뜻이에요.", variants:["경계하는"], subDefs:[], examples:[{kor:"너무 쉬운 돈벌이 광고는 경계해야 해요.", eng:"You should be wary of ads promising easy money."}], translations:{ en:{ term:"to be wary of", mainDef:"if you are wary of something, you are careful so that it doesn't lead to something bad.", contextDef:"In the West, people are especially careful about discriminatory speech." } } },
            { term:"확산", mainDef:"확산은 어떤 것이 넓은 곳으로 퍼지는 것이에요.", hanja:"확(擴 넓히다) + 산(散 흩어지다)", contextDef:"한국에서 노○○존이 점점 늘어나는 것을 말해요.", variants:["확산"], subDefs:[], examples:[{kor:"감염병 확산을 막으려고 모두 마스크를 썼어요.", eng:"Everyone wore masks to stop the disease from spreading."}], translations:{ en:{ term:"spread, expansion", mainDef:"something spreading into a wider area.", contextDef:"The increase of no-○○ zones in Korea." } } },
            { term:"포용", mainDef:"포용은 다른 사람을 너그럽게 감싸고 받아 주는 것이에요.", hanja:"포(包 싸다) + 용(容 받아들이다)", contextDef:"평등과 함께 한국 사회가 더 키워야 할 가치로 나와요.", variants:["포용"], subDefs:[], examples:[{kor:"다양한 문화를 포용하는 도시가 되고 싶어요.", eng:"We want to be a city that embraces diverse cultures."}], translations:{ en:{ term:"inclusion, embrace", mainDef:"generously taking others in and accepting them.", contextDef:"Presented, with equality, as a value Korean society needs to grow." } } },
            { term:"공공의 가치", mainDef:"공공의 가치는 한 사람이 아니라 사회 모두를 위해 소중하게 지켜야 할 생각이에요.", contextDef:"평등과 포용처럼 함께 사는 데 필요한 가치를 말해요.", variants:["공공의 가치"], subDefs:[{"subTerm":"• 공공(公共)","subDef":"공(公, 여럿의) + 공(共, 함께). 사회의 모든 사람과 관계되는 것이에요."},{"subTerm":"• 가치(價値)","subDef":"가(價, 값) + 치(値, 값). 어떤 것이 지닌 쓸모나 중요함이에요."}], examples:[{"kor":"깨끗한 환경은 모두가 함께 지켜야 할 공공의 가치예요.","eng":"A clean environment is a public value we all need to protect together."}], translations:{"en":{"term":"public values","mainDef":"ideas worth protecting for the good of society as a whole, not just one person.","contextDef":"Values needed for living together, such as equality and inclusion.","subDefs":[{"term":"공공 (公共)","def":"공 (公, shared) + 공 (共, together): relating to everyone in society."},{"term":"가치 (價値)","def":"가 (價, price) + 치 (値, worth): the usefulness or importance something has."}]}} },
            { term:"조화를 이루다", mainDef:"여러 가지가 조화를 이루면, 서로 잘 어울려 균형이 맞는다는 뜻이에요.", contextDef:"개인의 자유와 함께 사는 가치가 서로 잘 맞지 못했다는 분석이에요.", variants:["조화를 이루지"], subDefs:[{subTerm:"• 조화(調和)", subDef:"조(調, 고르다) + 화(和, 어울리다). 서로 잘 어울리는 것이에요."}], examples:[{kor:"이 집은 오래된 가구와 새 가구가 조화를 이뤄요.", eng:"In this house, the old and new furniture go well together."}], translations:{ en:{ term:"to be in harmony", mainDef:"if several things are in harmony, they go well together and are balanced.", contextDef:"The analysis that individual freedom and shared values haven't come into balance.", subDefs:[{term:"조화 (調和)", def:"조 (調, tune) + 화 (和, harmonize): things going well together."}] } } },
            { term:"사회상", mainDef:"사회상은 한 나라 사람들이 살아가는 모습이나 분위기예요.", hanja:"사(社 모이다) + 회(會 모이다) + 상(相 모양)", contextDef:"노○○존이 늘어나는 것이 지금 한국 사회의 모습을 보여 준다는 뜻이에요.", variants:["사회상"], subDefs:[], examples:[{kor:"이 영화는 1980년대 사회상을 잘 담았어요.", eng:"This film captures the society of the 1980s well."}], translations:{ en:{ term:"picture of society", mainDef:"the look or atmosphere of a society.", contextDef:"The growth of no-○○ zones shows what Korean society is like now." } } },
            { term:"앞세우다", mainDef:"누군가가 어떤 것을 앞세우면, 그것을 가장 먼저 내세운다는 뜻이에요.", contextDef:"가게나 손님 한쪽의 권리만 먼저 내세우지 말자는 뜻이에요.", variants:["앞세우기보다"], subDefs:[], examples:[{kor:"자기 이익만 앞세우면 팀이 흔들려요.", eng:"If you only put your own interests first, the team falls apart."}], translations:{ en:{ term:"to put first", mainDef:"if you put something first, you push it forward before anything else.", contextDef:"Don't put only one side's rights — the shop's or the customer's — first." } } },
            { term:"회피하다", mainDef:"누군가가 어떤 일을 회피하면, 부딪치지 않으려고 피한다는 뜻이에요.", hanja:"회(回 돌다) + 피(避 피하다)", contextDef:"아이를 모두 막는 것은 문제를 풀지 않고 피하는 것이라는 비판이에요.", variants:["회피하는"], subDefs:[], examples:[{kor:"그는 어려운 질문에 대답을 회피했어요.", eng:"He dodged the difficult question."}], translations:{ en:{ term:"to avoid, to evade", mainDef:"if you avoid something, you get out of its way instead of facing it.", contextDef:"The criticism that barring all children dodges the problem instead of solving it." } } },
            { term:"장애인", mainDef:"장애인은 몸이나 마음의 어려움 때문에 생활에 도움이 필요한 사람이에요.", hanja:"장(障 막다) + 애(礙 거리끼다) + 인(人 사람)", contextDef:"같은 논리라면 밀려날 수 있는 또 다른 사람들의 예로 나와요.", variants:["장애인"], subDefs:[], examples:[{kor:"지하철역에 장애인을 위한 엘리베이터가 있어요.", eng:"There's an elevator for people with disabilities at the subway station."}], translations:{ en:{ term:"person with a disability", mainDef:"a person who needs support in daily life because of a physical or mental difficulty.", contextDef:"An example of another group that could be pushed out by the same logic." } } },
            { term:"깨진 유리창 이론", mainDef:"깨진 유리창 이론은 작은 잘못을 그냥 두면 더 큰 잘못으로 이어진다는 생각이에요.", contextDef:"배제 하나를 당연하게 여기면 차별이 점점 커진다는 걱정을 설명해요.", variants:["깨진 유리창 이론"], subDefs:[{subTerm:"• 이론(理論)", subDef:"이(理, 이치) + 론(論, 말하다). 어떤 일을 설명하려고 세운 생각의 틀이에요."}], examples:[{kor:"깨진 유리창 이론에 따르면 쓰레기가 쌓인 골목에 더 많은 쓰레기가 버려져요.", eng:"According to the broken windows theory, more trash gets dumped in alleys where trash has already piled up."}], translations:{ en:{ term:"broken windows theory", mainDef:"the idea that leaving small wrongs alone leads to bigger ones.", contextDef:"Explains the worry that accepting one exclusion lets discrimination grow.", subDefs:[{term:"이론 (理論)", def:"이 (理, reason) + 론 (論, speak): a framework of ideas built to explain something."}] } } },
            { term:"공공질서", mainDef:"공공질서는 여러 사람이 함께 지내려고 지켜야 할 약속이에요.", hanja:"공(公 여럿의) + 공(共 함께) + 질(秩 차례) + 서(序 차례)", contextDef:"손님이 가게에서 지켜야 할 기본 약속을 말해요.", variants:["공공질서"], subDefs:[], examples:[{kor:"줄을 서는 것은 기본적인 공공질서예요.", eng:"Standing in line is basic public order."}], translations:{ en:{ term:"public order", mainDef:"shared rules everyone keeps so people can live together.", contextDef:"The basic rules customers should follow in a shop." } } },
            { term:"예절", mainDef:"예절은 다른 사람을 대할 때 지켜야 할 바른 태도예요.", hanja:"예(禮 예도) + 절(節 마디)", contextDef:"손님이 가게에서 지켜야 할 매너를 가리켜요.", variants:["예절"], subDefs:[], examples:[{kor:"식사 예절은 나라마다 달라요.", eng:"Table manners differ from country to country."}], translations:{ en:{ term:"manners, etiquette", mainDef:"the proper way to behave toward others.", contextDef:"The manners customers should keep in a shop." } } },

  if (!e) return 'format';

  if (st === 400) return 'badRequest';

  const endCheck = mixed.list.length ? `\n\n[종결어미 확인 — 코드가 미리 찾은 것]\n이 글은 주로 ${ENDING_LABEL[mixed.dom]}로 끝나요. 다음 문장은 다른 종결어미로 끝나므로 반드시 corrections에 tag "문체"로 지적하고, corrected는 ${ENDING_LABEL[mixed.dom]}로 끝냅니다.\n${mixed.list.map(x => '- ' + x).join('\n')}\n이 문장 말고도 글 전체에서 다른 오류는 평소처럼 모두 찾습니다.` : '';
  return `[학습 자료 레벨]\n${ctx.level}\n\n[본문]\n${ctx.article || '없음'}\n\n[핵심 어휘]\n${vocab}\n\n[질문]\n${ctx.question}${ctx.questionEn ? `\n(질문의 영어 번역: ${ctx.questionEn})` : ''}\n\n[학습자 글]\n${ctx.learnerText}${endCheck}`;
}


const str = (v) => (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
const arr = (v) => (Array.isArray(v) ? v : []);
// 허용 강조(**단어**)만 <b>로, 나머지 마크다운 기호는 제거
const richText = (s) => esc(str(s).replace(/`/g, '').replace(/^#+\s*/gm, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*/g, '');
const numMark = (n) => (n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`);

/* =====================================================================
   5. 응답 정리 (어느 모델이든 같은 모양으로)
   ===================================================================== */
function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const q = P.request(aiState.model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}
async function aiLoadModels() {
  const P = AI_PROVIDERS[aiState.provider];
  aiState.loadingModels = true; aiState.modelsError = null; aiRepaintKeyFields();
  try {
    const q = P.listModels(aiState.apiKey);
    const list = P.readModels(await httpJSON(q.url, { headers: q.headers }));
    if (list.length) { aiState.models[aiState.provider] = list; if (!list.includes(aiState.model)) aiState.model = list[0]; }
  } catch (e) { aiState.modelsError = e.code ? e : AppError('format'); }
  finally { aiState.loadingModels = false; aiRepaintKeyFields(); }
}

function aiHandleClick(a) {
  const act = a.dataset.action;

  if (act === 'aifb-toggle-settings') { aiState.settingsOpen = !aiState.settingsOpen; aiRepaintKeyFields(); return true; }
  if (act === 'aifb-clear-key') { aiState.apiKey = ''; paint(); return true; }
  if (act === 'aifb-load-models') { if (!a.disabled) aiLoadModels(); return true; }
  const qEl = a.closest('.discuss-q'); if (!qEl) return true;
  const id = +qEl.dataset.did, st = discussState[id];
  if (act === 'aifb-toggle-write') { st.open = !aiIsOpen(st); rerenderDiscussItem(id); if (st.open) { const t = qs(`.discuss-q[data-did="${id}"] textarea`, viewRoot()); if (t) t.focus(); } }
  else if (act === 'aifb-copy') { if (st.feedback) aiCopy(st, DISCUSS_DATA.find(x => x.id === id), a); }
  else if (act === 'aifb-download') { if (st.feedback) aiDownload(st, DISCUSS_DATA.find(x => x.id === id)); }
  else if (act === 'aifb-toggle-en') { st.showEn = !(st.showEn === null ? effLang() === 'en' : st.showEn); rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-ask') { st.confirmClear = true; rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-no') { st.confirmClear = false; rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-yes') { Object.assign(st, { text: '', feedback: null, feedbackFor: '', error: null, confirmClear: false }); aiSaveStore(); rerenderDiscussItem(id); }
  return true;
}
function aiHandleInput(t) {

function markedTextHTML(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {
    if (s.start < pos) return;
    out += esc(text.slice(pos, s.start));
    const orig = esc(text.slice(s.start, s.end));
    if (s.color === 'r') {
      out += `<del class="m-del">${orig}</del> <span class="m-ins">${esc(s.corrected)}</span><span class="n r">${numMark(s.num)}</span>` + s.extra.map(x => `<span class="n o">${numMark(x)}</span>`).join('');
    } else {
      out += `<span class="m-sug">${orig}</span><span class="n o">${numMark(s.num)}</span>`;
    }
    pos = s.end;
  });
  out += esc(text.slice(pos));
  return out;
}

function cardHTML(it, mode, showEn) {
  const T = uiOf(mode);
  const isR = it.color === 'r';
  const to = isR ? it.corrected : it.suggested;
  const tagEn = FEEDBACK_CONFIG.TAG_LABEL_EN[it.tag] || it.tag;
  const tagHTML = mode === 'A' ? esc(tagEn) : mode === 'B' ? sw(it.tag, tagEn) : esc(it.tag);
  const word = !isR && it.word && it.word.term ? `<div class="word"><b>${L(mode, 'newWord')}</b> · ${esc(it.word.term)}${it.word.hanja ? `(${esc(it.word.hanja)})` : ''}${it.word.meaning ? `: ${esc(it.word.meaning)}` : ''}</div>` : '';
  return `<div class="card ${it.color}">
    <div class="card-h"><span class="n ${it.color}" style="vertical-align:baseline">${numMark(it.num)}</span><span class="chip ${it.color}">${tagHTML}</span><span class="kind">${isR ? L(mode, 'fix') : L(mode, 'sug')}</span></div>
    <div class="pair">${isR ? `<span class="m-del">${esc(it.original)}</span>` : `<span>${esc(it.original)}</span>`}<span class="arrow">→</span><span class="${isR ? 'to-r' : 'to-o'}">${esc(to)}</span></div>
    ${it.explanation ? `<p class="exp">${richText(it.explanation)}</p>` : ''}
    ${showEn && it.explanationEn ? `<p class="en">${richText(it.explanationEn)}</p>` : ''}
    ${it.example ? `<p class="ex">${L(mode, 'ex')} ${richText(it.example)}</p>` : ''}
    ${word}
  </div>`;
}

function askHTML(mode) {
  const C = FEEDBACK_CONFIG.CONTACT;
  const links = [];
  if (C.email) links.push(`<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`);
  if (C.url) links.push(`<a href="${esc(C.url)}" target="_blank" rel="noopener">${esc(C.urlLabel || C.url)}</a>`);
  return `<div class="ask">${L(mode, 'ask')}${links.length ? `<div style="margin-top:6px">${links.join(' · ')}</div>` : ''}</div>`;
}

function feedbackHTML(st, id) {
  const curMode = modeOf();
  if (st.loading) return `<div class="loading">${L(curMode, 'loading')}</div>`;
  const errBox = errHTML(curMode, 'feedbackFail', st.error);
  const fb = st.feedback; if (!fb) return errBox;
  const mode = fb.mode, T = uiOf(mode);
  const showEn = mode === 'B' && (st.showEn === null ? effLang() === 'en' : st.showEn);   // 영어 메뉴면 번역 펼침이 기본
  const en = (v) => (showEn && v ? `<p class="en">${richText(v)}</p>` : '');
  const src = st.feedbackFor;
  const { reds, oranges } = layoutFeedback(src, fb);
  const rel = fb.relevance;
  const relHTML = rel.status === 'on'
    ? `<div class="rel on"><p>✓ ${L(mode, 'relOn')}</p></div>`
    : `<div class="rel ${rel.status}"><span class="fb-label">${(rel.status === 'off' ? L(mode, 'relOff') : L(mode, 'relPartial'))}</span>${rel.comment ? `<p>${richText(rel.comment)}</p>` : ''}${en(rel.commentEn)}${rel.modelAnswer ? `<div class="model"><span class="fb-label">${L(mode, 'model')}</span>${richText(rel.modelAnswer)}${rel.modelAnswerEn && (mode === 'A' || showEn) ? `<p class="en">${richText(rel.modelAnswerEn)}</p>` : ''}</div>` : ''}</div>`;
  const none = !reds.length && !oranges.length;
  const body = none
    ? `<p class="status">${L(mode, 'none')}</p>`
    : `<div class="fb-sec"><span class="fb-label">${(isStale(st) ? L(mode, 'oldText') : L(mode, 'myText'))}</span><div class="text">${markedTextHTML(src, reds, oranges)}</div>
        <div class="legend"><span><span class="m-del">${L(mode, 'legendRed')}</span></span><span><span class="m-sug">${L(mode, 'legendOrange')}</span></span></div></div>
      <div class="fb-sec"><span class="fb-label">${L(mode, 'wrong')}</span>${reds.length ? reds.map(r => cardHTML(r, mode, showEn)).join('') : `<p class="status">${L(mode, 'noWrong')}</p>`}</div>
      ${oranges.length ? `<div class="fb-sec"><span class="fb-label">${L(mode, 'better')}</span>${oranges.map(o => cardHTML(o, mode, showEn)).join('')}</div>` : ''}`;
  const engBtn = mode === 'B' ? `<button type="button" class="slim eng${showEn ? ' on' : ''}" data-action="aifb-toggle-en" aria-pressed="${showEn}">ENG</button>` : '';
  return `${errBox}<div class="fb fb-${mode}"><div class="fb-top"><h3>${L(mode, 'title')}</h3><div class="fb-tools">${engBtn}${toolBtn('aifb-copy', ICON_COPY, '복사', 'Copy', mode)}${toolBtn('aifb-download', ICON_SAVE, '저장', 'Save', mode)}</div></div>
    ${isStale(st) ? `<div class="stale">${L(mode, 'stale')}</div>` : ''}
    ${relHTML}
    ${fb.praise ? `<div class="fb-sec"><span class="fb-label">${L(mode, 'praise')}</span><div class="praise">${richText(fb.praise)}${en(fb.praiseEn)}</div></div>` : ''}
    ${body}
    ${askHTML(mode)}
  </div>`;
}

const EXP = {

  serif: "'Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif", sans: "'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"

const expDel = (t) => `<span style="color:${EXP.red};text-decoration:line-through;">${esc(t)}</span>`;
const expIns = (t) => `<span style="color:${EXP.red};font-weight:700;">${esc(t)}</span>`;
const expSug = (t) => `<span style="text-decoration:underline;text-decoration-style:dotted;text-decoration-color:${EXP.orange};">${esc(t)}</span>`;
const expNum = (n, c) => `<sup style="color:${c === 'r' ? EXP.red : EXP.orange};font-weight:700;">${numMark(n)}</sup>`;
const expLabel = (t) => `<p style="margin:18px 0 6px;font-family:${EXP.sans};font-size:12px;font-weight:700;color:${EXP.muted};">${t}</p>`;
const expText = (s) => richText(s);   // **굵게**만 <b>로
function exportQuestion(d) { return [d.questionKor].concat((d.sub || []).map((q, i) => `${d.id}-${i + 1}. ${q}`)); }
function exportMarked(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {
    if (s.start < pos) return;
    out += esc(text.slice(pos, s.start));
    const orig = text.slice(s.start, s.end);
    out += s.color === 'r' ? `${expDel(orig)} ${expIns(s.corrected)}${expNum(s.num, 'r')}${s.extra.map(x => expNum(x, 'o')).join('')}` : `${expSug(orig)}${expNum(s.num, 'o')}`;
    pos = s.end;

  return out + esc(text.slice(pos));
}
// 내보낼 때 쓰는 고정 문구: A 영어, B 한국어(+영어), C 한국어
const expT = (mode, key) => mode === 'A' ? UI_TEXT.en[key] : UI_TEXT.ko[key];
const expTEn = (mode, key) => mode === 'B' ? UI_TEXT.en[key] : '';
function exportParts(st, d) {

            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        // ---------- 13. 시작 ----------
        aiLoadStore();
        buildApp();
    })();
    </script>
