            { id: 's44', speaker: '김규남 (20대)', kor: '어? 저 못 봤습니다.', time: [convertTimeToSeconds('00:02:14,000'), convertTimeToSeconds('00:02:16,720')], eng: "Huh? I didn't see you." },
            { id: 's45', speaker: '대학교 선배 (20대)', kor: '못 봤다고?', time: [convertTimeToSeconds('00:02:16,762'), convertTimeToSeconds('00:02:18,138')], eng: "You didn't see me?" },
            { id: 's46', speaker: '대학교 선배 (20대)', kor: '나랑 눈 마주쳤잖아.', time: [convertTimeToSeconds('00:02:19,000'), convertTimeToSeconds('00:02:20,440')], eng: "You made eye contact with me." },
            { id: 's47', speaker: '김규남 (20대)', kor: '어? 저, 진짜 진짜 못 봤습니다...!', time: [convertTimeToSeconds('00:02:20,460'), convertTimeToSeconds('00:02:22,726')], eng: "Huh? I really, truly didn't see you...!" },
            { id: 's48', speaker: '대학교 선배 (20대)', kor: '그럼 내가 거짓말하고 있다는 거네?', time: [convertTimeToSeconds('00:02:22,768'), convertTimeToSeconds('00:02:24,850')], eng: "So you're saying I'm lying?" },
            { id: 's49', speaker: '대학교 선배 (20대)', kor: '아니, 너는 못 봤는데 내가 봤다고 거짓말하고 있다는 거네?', time: [convertTimeToSeconds('00:02:25,100'), convertTimeToSeconds('00:02:28,600')], eng: "No, you didn't see me, but I'm lying that I did?" },
            { id: 's50', speaker: '김규남 (20대)', kor: '아니, 그게 아니라요...', time: [convertTimeToSeconds('00:02:29,000'), convertTimeToSeconds('00:02:30,275')], eng: "No, that's not it..." },
            { id: 's51', speaker: '대학교 선배 (20대)', kor: '그게 아니야? 그럼 일부러 그랬다는 거네?', time: [convertTimeToSeconds('00:02:30,300'), convertTimeToSeconds('00:02:33,200')], eng: "That's not it? Then you did it on purpose?" },
            { id: 's52', speaker: '대학교 선배 (20대)', kor: '나 지각해서 F 받으라고 일부러 그랬다는 거네?', time: [convertTimeToSeconds('00:02:33,362'), convertTimeToSeconds('00:02:36,000')], eng: "You did it on purpose so I'd be late and get an F?" },
            { id: 's53', speaker: '김규남 (20대)', kor: '아닙니다...', time: [convertTimeToSeconds('00:02:36,600'), convertTimeToSeconds('00:02:37,824')], eng: "No..." },
            { id: 's54', speaker: '대학교 선배 (20대)', kor: '아니야? 그럼 내가 틀렸다는 거네?', time: [convertTimeToSeconds('00:02:37,860'), convertTimeToSeconds('00:02:41,500')], eng: "No? Then you're saying I'm wrong?" },
            { id: 's55', speaker: '대학교 선배 (20대)', kor: '아, 말을 해봐!', time: [convertTimeToSeconds('00:02:41,900'), convertTimeToSeconds('00:02:43,246')], eng: "Ah, say something!" },
            { id: 's56', speaker: '김규남 (20대)', kor: '아...아닙니다.', time: [convertTimeToSeconds('00:02:43,400'), convertTimeToSeconds('00:02:45,300')], eng: "Ah... No." },
            { id: 's57', speaker: '대학교 선배 (20대)', kor: '야, 아, 왜 울어?', time: [convertTimeToSeconds('00:02:45,800'), convertTimeToSeconds('00:02:49,080')], eng: "Hey, ah, why are you crying?" },
            { id: 's58', speaker: '김규남 (20대)', kor: '저도 선배님 좋아하는데... 선배님이 싫어하게 될까봐... 죄송합니다 선배님!', time: [convertTimeToSeconds('00:02:49,300'), convertTimeToSeconds('00:03:02,400')], eng: "I like you too, sunbae-nim... I'm sorry, sunbae-nim, I was afraid you'd come to dislike me...!" },
            { id: 's59', speaker: '대학교 선배 (20대)', kor: '아, 울지마. 나 너 안 싫어해.울지마!', time: [convertTimeToSeconds('00:03:02,500'), convertTimeToSeconds('00:03:07,145')], eng: "Ah, don't cry. I don't dislike you. Don't cry!" },
            { id: 's60', speaker: '김규남 (20대)', kor: '죄송합니다...!', time: [convertTimeToSeconds('00:03:07,200'), convertTimeToSeconds('00:03:10,980')], eng: "I'm sorry...!" },
            { id: 's61', speaker: '대학교 선배 (20대)', kor: '아, 됐어. 가 봐.', time: [convertTimeToSeconds('00:03:11,000'), convertTimeToSeconds('00:03:12,984')], eng: "Ah, it's fine. Go." },
            { id: 's62', speaker: '김규남 (20대)', kor: '네!', time: [convertTimeToSeconds('00:03:13,026'), convertTimeToSeconds('00:03:15,360')], eng: "Yes!" },
            { id: 's63', speaker: '직장 상사 (30대)', kor: '내 말 듣고 있어?!', time: [convertTimeToSeconds('00:03:15,900'), convertTimeToSeconds('00:03:17,500')], eng: "Are you listening to me?!" },
            { id: 's64', speaker: '김규남 (30대)', kor: '네, 듣고 있습니다. 죄송합니다.', time: [convertTimeToSeconds('00:03:17,600'), convertTimeToSeconds('00:03:20,075')], eng: "Yes, I'm listening. I apologize." },
            { id: 's65', speaker: '직장 상사 (30대)', kor: '그래 누가! 누가 업무 지시를 그렇게... 하라고 했다고 그래?', time: [convertTimeToSeconds('00:03:20,075'), convertTimeToSeconds('00:03:23,700')], eng: "Yes, who! Who said to... give work instructions like that?" },
            { id: 's66', speaker: '직장 상사 (30대)', kor: '난 그렇게 말한 적이 없는데...!', time: [convertTimeToSeconds('00:03:23,700'), convertTimeToSeconds('00:03:25,163')], eng: "I never said that...!" },
            { id: 's67', speaker: '김규남 (30대)', kor: '네, 맞습니다.', time: [convertTimeToSeconds('00:03:25,247'), convertTimeToSeconds('00:03:26,000')], eng: "Yes, that's right." },
            { id: 's68', speaker: '직장 상사 (30대)', kor: '아니... 진짜로 어디 가서 그렇게 얘기하지 마요.', time: [convertTimeToSeconds('00:03:26,000'), convertTimeToSeconds('00:03:28,750')], eng: "No... seriously, don't go around saying that." },
            { id: 's69', speaker: '직장 상사 (30대)', kor: '내가 시켜서 그렇게 한 거라고.', time: [convertTimeToSeconds('00:03:28,750'), convertTimeToSeconds('00:03:30,460')], eng: "Say I made you do it." },
            { id: 's70', speaker: '김규남 (30대)', kor: '네, 진짜 죄송합니다.', time: [convertTimeToSeconds('00:03:30,460'), convertTimeToSeconds('00:03:32,212')], eng: "Yes, I'm truly sorry." },
            { id: 's71', speaker: '직장 상사 (30대)', kor: '누...누가 보면 내가 거짓말 하는 줄 알 거 아니야!', time: [convertTimeToSeconds('00:03:32,379'), convertTimeToSeconds('00:03:35,900')], eng: "Wh-whoever sees this will think I'm lying, you know!" },
            { id: 's72', speaker: '김규남 (30대)', kor: '네...', time: [convertTimeToSeconds('00:03:36,000'), convertTimeToSeconds('00:03:37,200')], eng: "Yes..." },
            { id: 's73', speaker: '직장 상사 (30대)', kor: '제대로 좀 해요.', time: [convertTimeToSeconds('00:03:37,400'), convertTimeToSeconds('00:03:39,000')], eng: "Do it properly." },
            { id: 's74', speaker: '김규남 (30대)', kor: '네, 진짜 죄송합니다. 병신아.', time: [convertTimeToSeconds('00:03:39,100'), convertTimeToSeconds('00:03:44,000')], eng: "Yes, I'm truly sorry. Idiot." },
            { id: 's75', speaker: '김규남 (30대)', kor: '네, 여보세요?', time: [convertTimeToSeconds('00:03:46,600'), convertTimeToSeconds('00:03:47,769')], eng: "Yes, hello?" },
            { id: 's76', speaker: '김규남 (20대)', kor: '어, 여보세요?', time: [convertTimeToSeconds('00:03:47,770'), convertTimeToSeconds('00:03:48,700')], eng: "Uh, hello?" },
            { id: 's77', speaker: '대학 친구2 (20대)', kor: '야, 김규남!', time: [convertTimeToSeconds('00:03:48,728'), convertTimeToSeconds('00:03:49,646')], eng: "Hey, Kim Gyunam!" },
            { id: 's78', speaker: '김규남 (20대)', kor: '어, 왜?', time: [convertTimeToSeconds('00:03:49,646'), convertTimeToSeconds('00:03:50,439')], eng: "Uh, why?" },
            { id: 's79', speaker: '대학 친구2 (20대)', kor: '야 야, 오늘 저녁에 술 한잔 할래?', time: [convertTimeToSeconds('00:03:50,480'), convertTimeToSeconds('00:03:52,566')], eng: "Hey, hey, wanna get a drink tonight?" },
            { id: 's80', speaker: '김규남 (20대)', kor: '어, 나 낮부터 약속 있는데?', time: [convertTimeToSeconds('00:03:52,600'), convertTimeToSeconds('00:03:54,300')], eng: "Uh, I have plans since earlier today?" },
            { id: 's81', speaker: '대학 친구2 (20대)', kor: '아, 그래?', time: [convertTimeToSeconds('00:03:54,317'), convertTimeToSeconds('00:03:55,110')], eng: "Oh, really?" },
            { id: 's82', speaker: '대학 친구2 (20대)', kor: '동아리 선배들이랑 우리 동기들이랑 해 가지고 한 20명 다 같이 모일 건데.', time: [convertTimeToSeconds('00:03:55,150'), convertTimeToSeconds('00:03:59,100')], eng: "Our club sunbaes and our classmates are all meeting, about 20 of us." },
            { id: 's83', speaker: '김규남 (20대)', kor: '20명? 몇 시부터인데?', time: [convertTimeToSeconds('00:03:59,300'), convertTimeToSeconds('00:04:01,575')], eng: "20 people? From what time?" },
            { id: 's84', speaker: '대학 친구2 (20대)', kor: '7시긴 한데, 너 안 되면 다음에 와!', time: [convertTimeToSeconds('00:04:01,616'), convertTimeToSeconds('00:04:03,535')], eng: "It's at 7, but if you can't make it, come next time!" },
            { id: 's85', speaker: '김규남 (20대)', kor: '아 나 갈래...!', time: [convertTimeToSeconds('00:04:03,994'), convertTimeToSeconds('00:04:06,700')], eng: "Ah, I want to go...!" },
            { id: 's86', speaker: '대학 친구2 (20대)', kor: '너 약속 있다며 올 수 있어 ?', time: [convertTimeToSeconds('00:04:06,900'), convertTimeToSeconds('00:04:08,457')], eng: "You said you had plans, can you still come?" },
            { id: 's87', speaker: '김규남 (20대)', kor: '어, 늦더라도 갈게.', time: [convertTimeToSeconds('00:04:08,490'), convertTimeToSeconds('00:04:09,833')], eng: "Uh, I'll go even if I'm late." },
            { id: 's88', speaker: '김규남 (20대)', kor: '나만 빠지는 거 싫어!', time: [convertTimeToSeconds('00:04:09,875'), convertTimeToSeconds('00:04:11,084')], eng: "I don't want to be the only one missing out!" },
            { id: 's89', speaker: '김규남 (30대)', kor: '나만 좀 빠지면 안 되냐...?', time: [convertTimeToSeconds('00:04:11,126'), convertTimeToSeconds('00:04:12,335')], eng: "Can't I be the only one to skip...?" },
            { id: 's90', speaker: '친구 (30대)', kor: '야, 네가 이날 된다고 그래서 그때로 잡은 거 아니야!', time: [convertTimeToSeconds('00:04:12,377'), convertTimeToSeconds('00:04:15,755')], eng: "Hey, you said this day worked, so we made plans for then, didn't we?!" },
            { id: 's91', speaker: '김규남 (30대)', kor: '아... 너네 다 올 거야?', time: [convertTimeToSeconds('00:04:15,797'), convertTimeToSeconds('00:04:18,216')], eng: "Ah... are all of you coming?" },
            { id: 's92', speaker: '친구 (30대)', kor: '어, 우리 다 갈 거야.', time: [convertTimeToSeconds('00:04:18,258'), convertTimeToSeconds('00:04:20,000')], eng: "Yeah, we're all going." },
            { id: 's93', speaker: '김규남 (30대)', kor: '그래? 그럼 오랜만에 셋이서 뭉치겠네...', time: [convertTimeToSeconds('00:04:20,635'), convertTimeToSeconds('00:04:23,805')], eng: "Really? Then the three of us will get together for the first time in a while..." },
            { id: 's94', speaker: '김규남 (30대)', kor: '알겠어 갈게.', time: [convertTimeToSeconds('00:04:23,847'), convertTimeToSeconds('00:04:25,515')], eng: "Okay, I'll go." },
            { id: 's95', speaker: '김규남 (30대)', kor: '아... 가야지, 셋이서 모인다는데.', time: [convertTimeToSeconds('00:04:27,600'), convertTimeToSeconds('00:04:31,900')], eng: "Ah... I have to go, they said the three of us are meeting up." },
            { id: 's96', speaker: '대학교 선배 (20대)', kor: '김규남.', time: [convertTimeToSeconds('00:04:35,100'), convertTimeToSeconds('00:04:36,067')], eng: "Kim Gyunam." },
            { id: 's97', speaker: '김규남 (20대)', kor: '안녕하십니까? 선배님...', time: [convertTimeToSeconds('00:04:38,000'), convertTimeToSeconds('00:04:40,447')], eng: "Hello? Sunbae-nim..." },
            { id: 's98', speaker: '대학교 선배 (20대)', kor: '뭔 선배야 오글거려.', time: [convertTimeToSeconds('00:04:40,739'), convertTimeToSeconds('00:04:42,574')], eng: "What's with 'sunbae'? It's cringey." },
            { id: 's99', speaker: '대학교 선배 (20대)', kor: '그냥 언니라고 해.', time: [convertTimeToSeconds('00:04:42,782'), convertTimeToSeconds('00:04:44,000')], eng: "Just call me unnie." },
            { id: 's100', speaker: '김규남 (20대)', kor: '네...!', time: [convertTimeToSeconds('00:04:44,950'), convertTimeToSeconds('00:04:45,827')], eng: "Yes...!" },
            { id: 's101', speaker: '대학교 선배 (20대)', kor: '솔직히 내가 아까 했던 말들 다 진심 아닌 거 알지?', time: [convertTimeToSeconds('00:04:45,869'), convertTimeToSeconds('00:04:48,622')], eng: "Honestly, you know all those things I said earlier weren't serious, right?" },
            { id: 's102', speaker: '김규남 (20대)', kor: '네, 알아요.', time: [convertTimeToSeconds('00:04:48,400'), convertTimeToSeconds('00:04:50,200')], eng: "Yes, I know." },
            { id: 's103', speaker: '대학교 선배 (20대)', kor: '진짜로 너 잘 되라고 해 준 말이야.', time: [convertTimeToSeconds('00:04:50,248'), convertTimeToSeconds('00:04:52,292')], eng: "I really said those things for your own good." },
            { id: 's104', speaker: '대학교 선배 (20대)', kor: '뭔 말인지 알지?', time: [convertTimeToSeconds('00:04:52,334'), convertTimeToSeconds('00:04:53,585')], eng: "You know what I mean, right?" },
            { id: 's105', speaker: '김규남 (20대)', kor: '네, 진짜 감사합니다.', time: [convertTimeToSeconds('00:04:53,627'), convertTimeToSeconds('00:04:55,000')], eng: "Yes, thank you very much." },
            { id: 's106', speaker: '대학교 선배 (20대)', kor: '나는 진짜로 그런 거 전혀 신경 안 쓰거든? 진짜 상관없고.', time: [convertTimeToSeconds('00:04:55,045'), convertTimeToSeconds('00:04:59,049')], eng: "I really don't care about things like that at all, you know? It truly doesn't matter to me." },
            { id: 's107', speaker: '대학교 선배 (20대)', kor: '근데 너가 나 말고 다른 선배한테 그러면, 너 얼마나 많이 혼났을 거야?', time: [convertTimeToSeconds('00:04:59,090'), convertTimeToSeconds('00:05:02,844')], eng: "But if you did that to another sunbae, not me, how much would you have been scolded?" },
            { id: 's108', speaker: '대학교 선배 (20대)', kor: '나 너 그거 생각해서 그런 거야.', time: [convertTimeToSeconds('00:05:02,886'), convertTimeToSeconds('00:05:04,042')], eng: "I said that thinking of you." },
            { id: 's109', speaker: '대학교 선배 (20대)', kor: '뭔 말인지 알지?', time: [convertTimeToSeconds('00:05:04,054'), convertTimeToSeconds('00:05:05,130')], eng: "You know what I mean, right?" },
            { id: 's110', speaker: '김규남 (20대)', kor: '네, 저 그런데 진짜 선배님이 말씀 안 해 주셨으면 진짜 몰랐을 거예요.', time: [convertTimeToSeconds('00:05:05,400'), convertTimeToSeconds('00:05:09,184')], eng: "Yes, but honestly, if you hadn't told me, I really wouldn't have known." },
            { id: 's111', speaker: '대학교 선배 (20대)', kor: '아, 진짜로 나 때는', time: [convertTimeToSeconds('00:05:09,800'), convertTimeToSeconds('00:05:11,770')], eng: "Ah, seriously, back in my day," },
            { id: 's112', speaker: '대학교 선배 (20대)', kor: '나 엘베 타면은 앞에 아무도 없어도', time: [convertTimeToSeconds('00:05:11,811'), convertTimeToSeconds('00:05:13,647')], eng: "when I rode the elevator, even if no one was in front," },
            { id: 's113', speaker: '대학교 선배 (20대)', kor: '열림 버튼 10초 동안 누르고 있었어, 누가 올까 봐.', time: [convertTimeToSeconds('00:05:13,647'), convertTimeToSeconds('00:05:16,220')], eng: "I'd press the open button for 10 seconds, just in case someone came." },
            { id: 's114', speaker: '대학교 선배 (20대)', kor: '뭔 말인지 알지?', time: [convertTimeToSeconds('00:05:16,233'), convertTimeToSeconds('00:05:17,150')], eng: "You know what I mean, right?" },
            { id: 's115', speaker: '김규남 (20대)', kor: '아, 그럼 저도 앞으로 그렇게 하겠습니다!', time: [convertTimeToSeconds('00:05:17,776'), convertTimeToSeconds('00:05:19,850')], eng: "Ah, then I'll do that from now on too!" },
            { id: 's116', speaker: '대학교 선배 (20대)', kor: '그렇게까지 하라는 건 아니고.', time: [convertTimeToSeconds('00:05:19,861'), convertTimeToSeconds('00:05:21,643')], eng: "I'm not saying you have to go that far." },
            { id: 's117', speaker: '대학교 선배 (20대)', kor: '그냥 기본만 하라고.', time: [convertTimeToSeconds('00:05:21,655'), convertTimeToSeconds('00:05:23,310')], eng: "Just do the basics." },
            { id: 's118', speaker: '대학교 선배 (20대)', kor: '뭔 말인지 알지?', time: [convertTimeToSeconds('00:05:23,365'), convertTimeToSeconds('00:05:24,145')], eng: "You know what I mean, right?" },
            { id: 's119', speaker: '김규남 (20대)', kor: '네, 감사합니다.', time: [convertTimeToSeconds('00:05:24,157'), convertTimeToSeconds('00:05:25,647')], eng: "Yes, thank you." },
            { id: 's120', speaker: '대학교 선배 (20대)', kor: '너 진짜 다른 선배였으면 큰일 났어.', time: [convertTimeToSeconds('00:05:25,659'), convertTimeToSeconds('00:05:28,100')], eng: "If it had been another sunbae, you'd have been in big trouble." },
            { id: 's121', speaker: '대학교 선배 (20대)', kor: '뭔 말인지 알지?', time: [convertTimeToSeconds('00:05:28,119'), convertTimeToSeconds('00:05:29,020')], eng: "You know what I mean, right?" },
            { id: 's122', speaker: '직장 상사 (30대)', kor: '내 말 뭔 말인지 알죠? 에?', time: [convertTimeToSeconds('00:05:29,037'), convertTimeToSeconds('00:05:30,872')], eng: "You know what I mean, right? Huh?" },
            { id: 's123', speaker: '직장 상사 (30대)', kor: '아, 뭐 아무리 그래 아무리 내가 뭐 실수로 그렇게 지시를 했다 하더라도', time: [convertTimeToSeconds('00:05:31,873'), convertTimeToSeconds('00:05:36,368')], eng: "Ah, no matter what, no matter if I accidentally gave instructions like that," },

        function toolbarHTML() {

            const speedMenu = learn.speedMenu ? `<div class="absolute top-full right-0 mt-2 bg-white border border-gray-200 shadow-xl p-1 z-50 w-20 animate-fade-in">${[0.5, 0.75, 1.0, 1.25, 1.5, 2.0].map(s => `<button type="button" data-rate="${s}" class="w-full text-center py-1.5 text-[10px] font-bold font-ui hover:bg-gray-50 ${learn.rate === s ? 'text-black' : 'text-gray-400'}">${s}x</button>`).join('')}</div>` : '';
            return `<div class="sticky top-0 z-40 h-16 flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200 shadow-sm pr-14 print:hidden"><div class="flex items-center gap-1 shrink-0">${modeBtns}</div><div class="flex items-center gap-4 flex-1 justify-end min-w-0"><div class="hidden sm:flex items-center gap-4 flex-1 max-w-xl justify-end"><div class="hidden md:flex flex-col flex-1 gap-1 w-full"><div class="relative group h-2 flex items-center"><div class="absolute inset-0 flex items-center"><div class="w-full h-[1px] bg-gray-200"></div><div id="seek-fill" class="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-black" style="width:0%"></div></div><input id="seek" type="range" min="0" max="100" value="0" class="absolute inset-0 w-full opacity-0 cursor-pointer"/></div><span id="time-text" class="text-[10px] font-mono text-gray-400 text-right leading-none">00:00 / 00:00</span></div><div class="hidden sm:flex items-center gap-3 shrink-0"><button type="button" data-action="rewind" class="text-gray-400 hover:text-black transition-colors">${svgIcon('rewind', 'w-4 h-4')}</button><button type="button" id="play-btn" data-action="play" class="w-6 h-6 border border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all">${svgIcon('playSolid', 'w-2.5 h-2.5 ml-0.5', { fill: 'currentColor' })}</button><button type="button" data-action="forward" class="text-gray-400 hover:text-black transition-colors">${svgIcon('forward', 'w-4 h-4')}</button></div></div><div class="h-4 w-px bg-gray-200 hidden sm:block"></div><div class="relative shrink-0 hidden sm:flex"><button type="button" data-action="speed-menu" class="flex items-center gap-1.5 text-xs font-bold font-ui uppercase tracking-wider text-gray-500 hover:text-black">${learn.rate.toFixed(1)}x</button>${speedMenu}</div><button type="button" data-action="autoscroll" class="hidden sm:flex items-center gap-2 text-[10px] font-bold font-ui uppercase tracking-widest transition-colors ${learn.autoScroll ? 'text-black' : 'text-gray-300 hover:text-gray-500'}"><span class="w-2 h-2 rounded-full ${learn.autoScroll ? 'bg-black' : 'border border-gray-300'}"></span><span class="hidden md:inline">Auto Scroll</span><span class="md:hidden">Scroll</span></button><button type="button" data-action="learn-vocab" class="hidden xl:flex items-center gap-2 px-3 py-1.5 border transition-all text-[10px] font-bold font-ui uppercase tracking-widest ${learn.showVocab ? 'bg-black text-white border-black' : 'bg-white border-gray-200 text-gray-500 hover:border-black hover:text-black'}">Vocabulary</button></div></div>`;
        }
        function sidebarVocabHTML(word, idx) {

        function afterVideoPaint() { createPlayer(); const seek = qs('#seek', viewRoot()); if (seek) seek.addEventListener('input', (e) => { const t = parseFloat(e.target.value); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; updateSeekUI(); }); }
        function createPlayer() {
            const make = () => { if (!(window.YT && window.YT.Player)) return; new window.YT.Player('youtube-player', { videoId: VIDEO_CONFIG.YOUTUBE_VIDEO_ID, width: '100%', height: '100%', playerVars: { autoplay: 0, controls: 1, rel: 0, disablekb: 1 }, events: { onReady: (e) => { learn.player = e.target; learn.duration = e.target.getDuration() || 0; const s = qs('#video-loading'); if (s) s.style.display = 'none'; if (learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); updateSeekUI(); }, onStateChange: (e) => { if (e.data === window.YT.PlayerState.PLAYING) { startTick(); learn.isPlaying = true; updatePlayBtn(); } else { stopTick(); if (e.data === window.YT.PlayerState.PAUSED || e.data === window.YT.PlayerState.ENDED) { learn.isPlaying = false; updatePlayBtn(); } } } } }); };
            if (window.YT && window.YT.Player) make();
            else { if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) { const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); } const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') try { prev(); } catch (_) {} if (app.activeTab === 'video') make(); }; const poll = setInterval(() => { if (window.YT && window.YT.Player) { clearInterval(poll); if (app.activeTab === 'video' && !learn.player) make(); } }, 150); setTimeout(() => clearInterval(poll), 10000); }
        }
        function startTick() { stopTick(); learn.intervalId = setInterval(() => { const p = learn.player; if (p && p.getCurrentTime) { learn.currentTime = p.getCurrentTime(); updateSeekUI(); const cl = VIDEO_SCRIPT_DATA.find(l => learn.currentTime >= l.time[0] && learn.currentTime < l.time[1]); if (cl && cl.id !== learn.activeLine) setActiveLine(cl.id); } }, 200); }
        function stopTick() { if (learn.intervalId) { clearInterval(learn.intervalId); learn.intervalId = null; } }
        function updateSeekUI() { const root = viewRoot(); if (!root) return; const fill = qs('#seek-fill', root), tt = qs('#time-text', root), seek = qs('#seek', root); const pct = learn.duration ? (learn.currentTime / learn.duration) * 100 : 0; if (fill) fill.style.width = pct + '%'; if (tt) tt.textContent = `${fmt(learn.currentTime)} / ${fmt(learn.duration)}`; if (seek) { seek.max = learn.duration || 100; seek.value = learn.currentTime; } }
        function updatePlayBtn() { const root = viewRoot(); if (!root) return; const b = qs('#play-btn', root); if (b) b.innerHTML = learn.isPlaying ? svgIcon('pause', 'w-2.5 h-2.5', { fill: 'currentColor' }) : svgIcon('playSolid', 'w-2.5 h-2.5 ml-0.5', { fill: 'currentColor' }); }
        function replaceLine(id) { const el = qs('#sl-' + id, viewRoot()); if (el) { const line = VIDEO_SCRIPT_DATA.find(l => l.id === id); if (line) el.outerHTML = lineHTML(line); } }
        function setActiveLine(id) { const old = learn.activeLine; learn.activeLine = id; if (old) replaceLine(old); replaceLine(id); if (learn.autoScroll) { const el = qs('#sl-' + id, viewRoot()); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
        function updatePanes() { const root = viewRoot(); if (!root) return; const vp = qs('#video-pane', root), sp = qs('#script-pane', root), vop = qs('#vocab-pane', root); if (vp) vp.className = videoPaneClass(); if (sp) sp.className = scriptPaneClass(); if (vop) vop.className = vocabPaneClass(); const sl = qs('#script-list', root); if (sl) sl.className = (learn.layout === 'script' ? 'w-full mx-auto p-4 sm:p-8 min-h-full bg-white shadow-sm my-8 max-w-4xl lg:max-w-5xl' : 'p-8 space-y-8'); }

        // ---------- VOCAB (b2: 펼치기형 예문) ----------

        // ---------- QUIZ (객관식) ----------
        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">Hint</button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {

        function feedbackSectionHTML(titleKor, titleEng, contentHTML, isCorrection) { return `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">${esc(titleKor)} <span class="font-eng-header font-medium text-[9px]">${esc(titleEng)}</span></h4><p class="${isCorrection ? 'text-[15px] md:text-base font-serif text-gray-900 leading-relaxed font-medium bg-white p-4 border border-gray-200 shadow-sm rounded-sm' : 'text-[13px] md:text-sm font-sans text-gray-700 leading-relaxed whitespace-pre-wrap'}">${contentHTML}</p></div>`; }
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, generating: false, feedback: null, error: '' });
            const vocab = item.vocab.map(v => `<p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>`).join('');
            let fb = '';
            if (st.error) fb = `<div class="mt-4 p-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-sm animate-fade-in">${esc(st.error)}</div>`;
            else if (st.feedback) {
                const fd = st.feedback;
                const details = (fd.detailed_corrections && fd.detailed_corrections.length) ? `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2">상세 설명 <span class="font-eng-header font-medium text-[9px]">EXPLANATION</span></h4><div class="space-y-3">${fd.detailed_corrections.map(d => `<div class="bg-white p-4 border border-gray-100 rounded-sm hover:border-gray-200 transition-colors">${(d.original || d.corrected) ? `<div class="flex flex-wrap items-center gap-3 mb-2.5 text-[15px] font-serif">${d.original ? `<span class="text-red-400 line-through decoration-red-300/60">${esc(d.original)}</span>` : ''}${(d.original && d.corrected) ? '<span class="text-gray-300">→</span>' : ''}${d.corrected ? `<span class="text-gray-900 font-bold tracking-wide">${esc(d.corrected)}</span>` : ''}</div>` : ''}<p class="text-[13px] md:text-sm font-sans text-gray-600 leading-relaxed">${renderFormatted(d.explanation)}</p></div>`).join('')}</div></div>` : '';
                fb = `<div class="mt-8 p-6 bg-gray-50 border border-gray-200 rounded-sm animate-fade-in relative"><div class="flex items-center gap-2 mb-6 pb-4 border-b border-gray-200">${svgIcon('sparkles', 'w-5 h-5 text-gray-900', { fill: 'currentColor' })}<span class="text-xs font-bold font-sans text-gray-900 uppercase tracking-widest">AI Teacher Feedback</span></div><div class="space-y-8">${feedbackSectionHTML('피드백', 'FEEDBACK', renderFormatted(fd.feedback))}${feedbackSectionHTML('모범 답안', 'CORRECTION', esc(fd.correction), true)}${details}</div><div class="mt-8 pt-4 border-t border-gray-200"><p class="text-[10px] text-gray-400 font-sans text-center">※ AI가 생성한 피드백이므로 간혹 부자연스럽거나 오류가 있을 수 있습니다.</p></div></div>`;
            }
            const disabled = (!st.text.trim() || st.generating);
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal whitespace-pre-line">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14"><div class="flex gap-2 mb-4">${transBtn('discuss-qtrans', st.showTrans)}${st.showTrans ? `<p class="text-sm font-sans text-gray-500 animate-fade-in whitespace-pre-line">${esc(item.questionEng)}</p>` : ''}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block tracking-widest">Key Vocabulary</span><div class="space-y-1">${vocab}</div></div><textarea data-action="discuss-text" placeholder="여기에 생각을 적어보세요..." class="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300">${esc(st.text)}</textarea><div class="flex justify-end"><button type="button" data-action="discuss-feedback" ${disabled ? 'disabled' : ''} class="px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${disabled ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}">${st.generating ? '<div class="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></div>Generating...' : 'Get AI Feedback'}</button></div>${fb}</div></div>`;
        }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">생각해 보기</h2><span class="block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Food For Thought</span></div><div class="bg-gray-50 border border-gray-200 py-4 px-5 mb-24 md:mb-32 rounded-none flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div class="flex gap-4 items-center"><div class="shrink-0 text-gray-400">${svgIcon('sparkles', 'w-5 h-5', { fill: 'currentColor' })}</div><div class="flex flex-col"><p class="text-xs font-bold font-sans text-gray-800 leading-tight">AI 피드백은 현재 Gemini 웹에서만 가능합니다.</p><p class="text-[10px] font-sans text-gray-400 mt-1">AI feedback is currently available only on Gemini web.</p></div></div><a href="https://gemini.google.com/share/8412caed543b" target="_blank" rel="noreferrer" class="group flex flex-col items-center justify-center bg-white py-1.5 px-3 shadow-sm hover:shadow transition-all shrink-0 no-underline rounded-none border border-gray-100"><div class="flex items-center gap-1"><span class="text-[11px] font-bold font-sans text-gray-700 group-hover:text-black">Gemini에서 열기</span>${svgIcon('externalLink', 'w-3 h-3 text-gray-400 group-hover:text-black')}</div><span class="text-[9px] font-sans text-gray-400 group-hover:text-gray-600 uppercase tracking-widest mt-0.5">Open in Gemini</span></a></div><div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;
        }
        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }

        // ---------- 이벤트 위임 ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            const tab = app.activeTab;
            if (tab === 'video') {
                const vspan = e.target.closest('[data-vocab-idx]'); if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) closeVocabPopup(); else showVocabPopup(w, r.left + r.width / 2, r.bottom, true); return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = VIDEO_SCRIPT_DATA.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'), sbBtn = e.target.closest('[data-action^="sb-trans-"]'); if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) { const act = a.dataset.action; if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } } else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); } else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); } else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); } }
                return;
            }
            if (tab === 'vocab') { const card = e.target.closest('[data-vidx]'); const exBtn = e.target.closest('[data-action="vocab-ex"]'); if (card && exBtn) { const i = +card.dataset.vidx; vocabExpand[i] = !vocabExpand[i]; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i); } return; }
            if (tab === 'quiz') {
                const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return; const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return; if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < VIDEO_SCRIPT_DATA.length && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[ni].time[0], true); learn.player.playVideo(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.generating) return; st.generating = true; st.error = ''; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id); const lvl = app.userLevel;
            const beginner = ['A1', 'A1+', 'A2', 'A2+', 'B1', 'B1+'].includes(lvl);
            const instr = beginner ? `The student's level is ${lvl}. Write 'feedback' in ENGLISH; 'correction' in natural Korean; 'detailed_corrections' explanations in ENGLISH, wrapping Korean words in **bold**.` : `학생 레벨은 ${lvl}. 모든 필드를 한국어로만 작성. explanation 안 한국어 강조는 **단어** 사용.`;
            const vocabCtx = item.vocab ? item.vocab.map(v => `- ${v.term}: ${v.def}`).join('\n') : '없음';
            const sys = `당신은 한국어 선생님입니다.\n${instr}\n맞춤법·띄어쓰기·문법 오류를 찾고, 'correction'은 해요체로. JSON만 응답(마크다운 금지): {"feedback":"","correction":"","detailed_corrections":[{"original":"","corrected":"","explanation":""}]}\n[핵심 어휘]\n${vocabCtx}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: `${sys}\n\n질문: "${item.questionKor}"\n학생 답변: "${st.text}"` }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const r = await callGeminiWithBackoff(payload); const txt = r.candidates && r.candidates[0] && r.candidates[0].content.parts[0].text; if (!txt) throw new Error('피드백을 생성하지 못했습니다.'); st.feedback = JSON.parse(txt.replace(/^```(json)?\n?/, '').replace(/\n?```$/, '').trim()); }
            catch (err) { st.error = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.'; }
            finally { st.generating = false; rerenderDiscussItem(id); }
        }

        buildApp();
    })();
    </script>
