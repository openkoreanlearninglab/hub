#print-root{display:none}

#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}

#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}

.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}

.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}

.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}

.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}

.pw-vocab-card .pw-core{float:right;font-size:7.5pt;font-weight:700;letter-spacing:.12em;line-height:16pt}

.pw-answers{font-size:10pt;line-height:2}

}

            ORANGE_TAGS: { A: ['더 좋은 표현'], B: ['더 좋은 표현', '일관성'], C: ['더 좋은 표현', '정확한 어휘', '고급 표현', '문어체', '번역투', '일관성', '논리 연결', '대체 표현', '다른 글쓰기 스타일', '의도에 따라 달라요'] },

            // 나중에 채우면 '선생님께 물어보세요' 안내 아래에 자동 표시
            CONTACT: { email: '', url: '', urlLabel: '' }

        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        // 동영상 목록 — 항목을 추가하면 Part 선택 버튼이 자동 표시됩니다 (1개면 버튼 없음)
        // REPLACE: title/subTitle/videoId를 실제 값으로. script는 각 동영상의 대본 배열

        //  - 재생제어·배속·시크바·시간동기(줄 하이라이트)는 유튜브만 지원. 인스타/embed는 정적 임베드
        // REPLACE: 동영상 스크립트 (아래 예시 2줄을 실제 스크립트로 교체)
        const VIDEOS = [{"title": "요즘 2030 퇴사자 수 2배로 늘었다는 공공기관", "subTitle": "스브스뉴스", "videoId": "xsApxJqMtPI", "cardTitle": "요즘 2030 퇴사자 수 2배로 늘었다는 공공기관", "cardDesc": "동영상을 보며 공공기관 지방 이전 이야기를 들어 보세요.", "script": [{"id": "v1", "speaker": "나레이션", "kor": "지긋지긋한 서울 공화국.", "time": [0.099, 2.885], "eng": "The dreaded 'Republic of Seoul.'"}, {"id": "v2", "speaker": "나레이션", "kor": "일자리 교육 문화 중요한 기회가 수도권에 몰려있는 현실을 비꼬는 말이죠.", "time": [3.0, 8.28], "eng": "It's a sarcastic name for the reality that jobs, education, culture, all the big opportunities are crammed into the capital area."}, {"id": "v3", "speaker": "나레이션", "kor": "이미 2019년 말부터 우리나라 인구의 절반 이상이 수도권에 살고 있고요.", "time": [8.315, 13.06], "eng": "Since the end of 2019, more than half of Korea's population has lived in the capital area."}, {"id": "v4", "speaker": "나레이션", "kor": "청년 일자리도 대기업 본사 매출 상위 기업도 수도권에 집중돼 있습니다.", "time": [13.09, 17.6], "eng": "Jobs for young people, big-company headquarters, top-earning firms: they're all concentrated there too."}, {"id": "v5", "speaker": "나레이션", "kor": "역대 정부마다 국토 균형 발전을 강조해왔지만 수도권 집중 현상은 좀처럼 꺾이지 않았는데요.", "time": [17.94, 24.33], "eng": "Every government has stressed balanced national development, but the pull toward the capital area has barely budged."}, {"id": "v6", "speaker": "나레이션", "kor": "그런데 지난 3일 정부가 2차 공공기관 지방 이전을 본격 추진하겠다고 발표해 화제입니다.", "time": [24.37, 31.23], "eng": "Then on the 3rd, the government announced it will push ahead in earnest with a second relocation of public institutions to the regions, and it's making headlines."}, {"id": "v7", "speaker": "한성숙 (국무총리)", "kor": "공공기관 지방 이전을 속도감 있게 추진하겠습니다.", "time": [31.268, 34.68], "eng": "We will move public institutions out to the regions, and we will do it fast."}, {"id": "v8", "speaker": "한성숙 (국무총리)", "kor": "수도권 공공기관 350여 개를 대상으로 올 4분기 중에 이전 계획을 발표하고 27년부터 이전에 착수하겠습니다.", "time": [34.71, 45.88], "eng": "Covering some 350 public institutions in the capital area, we'll announce the relocation plan in the fourth quarter and begin the moves from 2027."}, {"id": "v9", "speaker": "나레이션", "kor": "이번 2차 이전의 핵심은 수도권에 남아있는 공공기관 350여 곳을 검토해 오는 2027년부터 지방에 보내겠다는 건데요.", "time": [46.95, 55.005], "eng": "The core of this second round: review the roughly 350 public institutions still in the capital area and send them to the regions starting in 2027."}, {"id": "v10", "speaker": "나레이션", "kor": "김윤덕 국토교통부 장관이 강조한 5가지 원칙을 요약하자면,", "time": [55.13, 59.143], "eng": "To sum up the five principles stressed by Kim Yun-deok, Minister of Land, Infrastructure and Transport:"}, {"id": "v11", "speaker": "나레이션", "kor": "첫째, 수도권 잔류를 최소화한다.", "time": [59.25, 61.668], "eng": "One, keep as little as possible in the capital area."}, {"id": "v12", "speaker": "나레이션", "kor": "둘째, 기존 혁신도시를 중심으로 집적 배치한다.", "time": [61.79, 65.063], "eng": "Two, cluster the institutions around the existing innovation cities."}, {"id": "v13", "speaker": "나레이션", "kor": "셋째, 지역 대학·산업과의 연계를 확대한다.", "time": [65.14, 68.12], "eng": "Three, expand links with local universities and industries."}, {"id": "v14", "speaker": "나레이션", "kor": "넷째, 정주 인프라를 개선한다.", "time": [68.15, 70.546], "eng": "Four, improve the infrastructure for settling down."}, {"id": "v15", "speaker": "나레이션", "kor": "다섯째, 빠르게 이전한다.", "time": [70.61, 72.637], "eng": "Five, move quickly."}, {"id": "v16", "speaker": "나레이션", "kor": "정부는 이 원칙에 따라 2차 이전을 밀어붙이겠다고 발표했습니다.", "time": [72.74, 76.62], "eng": "The government said it will push the second relocation through according to these principles."}, {"id": "v17", "speaker": "나레이션", "kor": "현재 논의 중인 2차 이전 대상 기업은", "time": [76.71, 78.85], "eng": "The institutions now being discussed for the second round"}, {"id": "v18", "speaker": "나레이션", "kor": "한국산업은행, IBK기업은행, 농협중앙회 같은 국책은행,", "time": [78.89, 83.23], "eng": "include state-run banks like the Korea Development Bank, IBK Industrial Bank and the National Agricultural Cooperative Federation,"}, {"id": "v19", "speaker": "나레이션", "kor": "한국투자공사, 예금보험공사 같은 금융공공기관,", "time": [83.27, 86.9], "eng": "financial public institutions like the Korea Investment Corporation and the Korea Deposit Insurance Corporation,"}, {"id": "v20", "speaker": "나레이션", "kor": "국민체육진흥공단, 한국지역난방공사 등까지", "time": [86.91, 90.08], "eng": "and even the Korea Sports Promotion Foundation and Korea District Heating Corp.:"}, {"id": "v21", "speaker": "나레이션", "kor": "굵직한 공기업들이 거론되며 관심이 쏟아지고 있습니다.", "time": [90.1, 93.68], "eng": "major public companies are being named, and attention is pouring in."}, {"id": "v22", "speaker": "나레이션", "kor": "이렇게 공공기관을 지방으로 보내는 시도, 거슬러 올라가면 1960년대부터 시작됐는데요.", "time": [93.71, 99.658], "eng": "Attempts to send public institutions to the regions like this actually go back to the 1960s."}, {"id": "v23", "speaker": "나레이션", "kor": "1960년대부터 산업화 과정에서 기업과 일자리가 수도권에 집중되자 인구가 수도권으로 모이는 현상이 나타났죠.", "time": [99.748, 107.027], "eng": "From the 1960s, as companies and jobs piled into the capital area during industrialization, people started flocking there too."}, {"id": "v24", "speaker": "나레이션", "kor": "이에 1964년 박정희 정부는 대도시 인구 집중 방지책을 내놓았는데요.", "time": [107.203, 112.057], "eng": "So in 1964, the Park Chung-hee government came up with measures to stop population from concentrating in big cities."}, {"id": "v25", "speaker": "나레이션", "kor": "이때 나온 방안 중 하나가 공공기관을 지방으로 보내는 것이었습니다.", "time": [112.537, 116.69], "eng": "One of the ideas back then was sending public institutions to the regions."}, {"id": "v26", "speaker": "나레이션", "kor": "실제로 1974년 당시 산업기지개발공사가 서울에서 대전으로 본사를 옮기며 최초의 공공기관 지방 이전 사례를 남겼습니다.", "time": [116.72, 125.252], "eng": "In fact, in 1974 the Industrial Base Development Corporation moved its headquarters from Seoul to Daejeon, the first case of a public institution relocating to the regions."}, {"id": "v27", "speaker": "나레이션", "kor": "하지만 당시엔 몇몇 기관에 그쳤고요.", "time": [125.493, 127.804], "eng": "But back then it stopped at just a handful of institutions."}, {"id": "v28", "speaker": "나레이션", "kor": "대규모 이전이 본격화된 건 노무현 정부 때였습니다.", "time": [127.88, 131.233], "eng": "Large-scale relocation really took off under the Roh Moo-hyun government."}, {"id": "v29", "speaker": "나레이션", "kor": "왜, 한때 한전이나 한국토지주택공사 같은 대형 공공기관들을 지방으로 이전한다고 해서 난리였잖아요.", "time": [131.392, 137.909], "eng": "You remember, there was a huge fuss when big public institutions like KEPCO and the Korea Land and Housing Corporation were being moved to the regions."}, {"id": "v30", "speaker": "나레이션", "kor": "이게 바로 우리가 아는 1차 공공기관 이전인데요.", "time": [138.103, 141.215], "eng": "That's what we know as the first relocation of public institutions."}, {"id": "v31", "speaker": "나레이션", "kor": "2003년 첫 구상을 시작으로 부산, 나주, 원주, 진주 등 총 10개 혁신 도시를 세우고 공공기관을 옮기기 시작했습니다.", "time": [141.36, 149.265], "eng": "Starting with the first plan in 2003, the government built 10 innovation cities, including Busan, Naju, Wonju and Jinju, and began moving public institutions there."}, {"id": "v32", "speaker": "나레이션", "kor": "2012년부터 청사 입주가 본격화되면서 2019년까지 총 153개 공공기관, 총 5만 명이 넘는 인원이 지방으로 이동했죠.", "time": [149.4, 158.294], "eng": "As moving into the new office buildings picked up from 2012, a total of 153 public institutions and more than 50,000 people had moved to the regions by 2019."}, {"id": "v33", "speaker": "나레이션", "kor": "그럼 이 1차 이전 실제로 효과가 있었을까요?", "time": [158.458, 161.326], "eng": "So did this first relocation actually work?"}, {"id": "v34", "speaker": "나레이션", "kor": "우선 수도권의 공공기관과 인력이 실제로 지방으로 이전됐다는 점 자체가 의미가 있습니다.", "time": [161.4, 167.237], "eng": "First of all, the fact that institutions and staff really did leave the capital area means something in itself."}, {"id": "v35", "speaker": "나레이션", "kor": "기관들이 내는 지방세 덕분에 지방 재정도 크게 늘어났고요.", "time": [167.363, 171.28], "eng": "And thanks to the local taxes those institutions pay, regional finances grew a lot."}, {"id": "v36", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "지금 국토교통부가 발표한 거 보니까", "time": [171.316, 174.815], "eng": "Looking at what the Ministry of Land announced,"}, {"id": "v37", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "전입 인구가 23만 4천 명 정도,", "time": [174.95, 177.095], "eng": "about 234,000 people moved in,"}, {"id": "v38", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "이주 인구도 한 4만 8천 명 정도,", "time": [177.21, 179.159], "eng": "and about 48,000 people relocated,"}, {"id": "v39", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "이러다 보니까 지역 내 경제라든가 고용 측면에서 성과가 있었다 이렇게 볼 수가 있겠고", "time": [179.28, 184.783], "eng": "so you can say there were results in terms of the local economy and employment."}, {"id": "v40", "speaker": "나레이션", "kor": "전문가들은 대표적인 성공 사례로 전남 나주 혁신도시를 꼽습니다.", "time": [184.94, 189.301], "eng": "Experts point to the Naju innovation city in South Jeolla as the prime success story."}, {"id": "v41", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "가장 중요한 공공기관에 한국전력공사가 갔어요.", "time": [189.39, 192.41], "eng": "The most important public institution, KEPCO, went there."}, {"id": "v42", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 거기에 한전과 관련된 여러 가지 산하기관들, 그러면서 에너지 산업이 집적화되면서 한국에너지공대라든가 에너지밸리 이런 게 연결이 됐어요.", "time": [192.561, 203.319], "eng": "Along with it came the various KEPCO affiliates, and as the energy industry clustered there, things like the Korea Institute of Energy Technology and Energy Valley got connected."}, {"id": "v43", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "기관 이전을 넘어서 그 지역 내 산업 생태계가 형성됐고 혁신도시의 인구도 3만 9천 명 규모로 확산되는 이런 것들은 1차 이전에서 대표적인 성공 사례라고 볼 수가 있죠.", "time": [203.39, 215.425], "eng": "It went beyond moving an institution: an industrial ecosystem formed in the region, and the innovation city's population grew to about 39,000. You can call that the signature success of the first relocation."}, {"id": "v44", "speaker": "나레이션", "kor": "하지만 1차 이전에는 여러 문제도 남았습니다.", "time": [215.54, 218.357], "eng": "But the first relocation also left plenty of problems."}, {"id": "v45", "speaker": "나레이션", "kor": "특히 가장 큰 문제로 꼽히는 건 가족 동반 이주였는데요.", "time": [218.54, 222.093], "eng": "The biggest one, people say, was whether families moved along."}, {"id": "v46", "speaker": "댓글1", "kor": "지방 이전 공기업 다니는데 전부 주말 부부하거나 관뒀어 ... ㅠ", "time": [222.22, 224.955], "eng": "I work at a public company that moved to the regions, and everyone either lives apart from their spouse during the week or quit... ㅠ"}, {"id": "v47", "speaker": "댓글2", "kor": "지방으로 가족 다 같이 갈 수 없는 직원들은 어쩌라는...", "time": [225.04, 227.42], "eng": "So what are employees who can't take their whole family to the regions supposed to do..."}, {"id": "v48", "speaker": "댓글3", "kor": "사람들이 가나, 그냥 수도권에 계속 집 유지하고 월세 살거나 하겠지ㅠㅠㅠ.", "time": [227.45, 230.831], "eng": "Are people even going? They'll just keep their homes in the capital area and rent a place out there or something ㅠㅠㅠ."}, {"id": "v49", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "앞서 얘기했지만 정주 문제가 가장, 가족 동반 이주율이 71%밖에 안 되거든요.", "time": [230.964, 236.216], "eng": "Like I said earlier, settling down is the biggest problem: only 71% moved with their families."}, {"id": "v50", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 같이 갔는데도 만족도 점수 이런 거 보니까 69.4점이고", "time": [236.246, 240.521], "eng": "And even among those who did, the satisfaction score was 69.4,"}, {"id": "v51", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "가장 불만 요소가 그거예요. 의료, 교육, 문화 환경.", "time": [240.657, 243.54], "eng": "and the biggest complaints were medical care, education and culture."}, {"id": "v52", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "아무리 지역에 여건을 갖춘다고 해도 수도권 서울하고는 비교가 안 되겠죠.", "time": [243.735, 248.448], "eng": "No matter how well the regions get set up, they just can't compare with Seoul and the capital area."}, {"id": "v53", "speaker": "나레이션", "kor": "실제로 수도권행 셔틀버스를 운영한 기관이 60곳에 달했고", "time": [248.885, 252.395], "eng": "In fact, as many as 60 institutions ran shuttle buses to the capital area,"}, {"id": "v54", "speaker": "나레이션", "kor": "2010년부터 2025년까지 이를 위해 투입된 예산만 약 1,990억 원.", "time": [252.579, 257.761], "eng": "and from 2010 to 2025 the budget spent on that alone came to about 199 billion won."}, {"id": "v55", "speaker": "나레이션", "kor": "즉 직원들의 생활권까지 함께 지방으로 옮겨간 건 아니었던 겁니다.", "time": [257.888, 261.982], "eng": "In other words, employees' everyday lives didn't move to the regions with them."}, {"id": "v56", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 이전을 하면서 너무 오랫동안 정책이 왔다리 갔다리 했어요.", "time": [265.906, 269.97], "eng": "And during the relocation, the policy went back and forth for far too long."}, {"id": "v57", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "자료 보니까 총 2.6회가 변경이 됐더라고요.", "time": [270.15, 272.972], "eng": "The records show it was changed 2.6 times in total."}, {"id": "v58", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그러면서 한 30개월 이상 지연됐고", "time": [273.172, 275.241], "eng": "That delayed things by about 30 months or more,"}, {"id": "v59", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "여기에서 발생하는 시간에 대한 비용이나 행정에 대한 매몰 비용도 6,456억 원이 추가로 발생했는데...", "time": [275.271, 281.941], "eng": "and the cost of that time, plus the sunk administrative costs, added another 645.6 billion won..."}, {"id": "v60", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그래서 이번에 원칙에서도 속도감을 이야기한 거고요.", "time": [282.2, 285.843], "eng": "That's why speed is one of the principles this time."}, {"id": "v61", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "본사는 이전했는데 기능 전체는 수도권에 남아있는 그런 문제도 있었어요.", "time": [289.987, 295.636], "eng": "There was also the problem of headquarters moving while the actual functions stayed in the capital area."}, {"id": "v62", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "무려 47개 기관이 승인된 절차를 거쳐서 수도권에 잔류 인원이나 시설들을 그대로 유지를 했어요.", "time": [295.636, 303.053], "eng": "As many as 47 institutions went through approved procedures and kept staff or facilities in the capital area."}, {"id": "v63", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그러다 보니까 간판만 지방으로 옮긴 부분들,", "time": [303.107, 306.484], "eng": "So in some cases only the signboard moved to the regions."}, {"id": "v64", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그래서 2차에서는 의사결정권, 예산, 사업부서, 연구기능 뭐 이런 실질적인 것들이 지방으로 이전을 해야 실질적인 공공기관 이전이다 이렇게 이야기할 수가 있겠죠.", "time": [306.569, 319.323], "eng": "That's why, in the second round, the real substance, decision-making power, budgets, business units, research functions, has to move to the regions before you can call it a genuine relocation."}, {"id": "v65", "speaker": "나레이션", "kor": "그중에서도 특히 2030 청년층의 인력 유출과 업무 공백 문제가 심각했습니다.", "time": [323.312, 328.456], "eng": "Among these problems, the loss of young staff in their 20s and 30s and the gaps it left in the work were especially serious."}, {"id": "v66", "speaker": "나레이션", "kor": "국회 예산정책처가 1차 지방 이전 성과를 분석한 결과,", "time": [328.936, 332.283], "eng": "According to the National Assembly Budget Office's analysis of the first relocation,"}, {"id": "v67", "speaker": "나레이션", "kor": "한국토지주택공사, 국민건강보험공단을 비롯한 주요 10개 기관의 연평균 퇴사자 수는 지방으로 가기 전 68명에서 이전 후 133명으로 증가.", "time": [332.453, 342.06], "eng": "at 10 major institutions including the Korea Land and Housing Corporation and the National Health Insurance Service, average yearly resignations rose from 68 before the move to 133 after it."}, {"id": "v68", "speaker": "나레이션", "kor": "단순 비교하면 퇴사자 규모가 약 2배로 늘어난 셈이고요.", "time": [342.245, 345.753], "eng": "A simple comparison means resignations roughly doubled."}, {"id": "v69", "speaker": "나레이션", "kor": "34세 이하 청년 퇴사자는 연평균 28명에서 67명으로 약 2.4배 늘었고,", "time": [345.783, 351.572], "eng": "Resignations among young staff aged 34 and under went from 28 to 67 a year on average, about 2.4 times,"}, {"id": "v70", "speaker": "나레이션", "kor": "근속 9년 이하 직원의 퇴사자는 46명에서 102명으로 약 2.2배 증가했죠.", "time": [351.602, 357.61], "eng": "and among employees with 9 years' service or less, from 46 to 102, about 2.2 times."}, {"id": "v71", "speaker": "나레이션", "kor": "이렇게 입사 후 업무를 익히고 조직에 적응한 직원들이 빠져나가고", "time": [357.753, 361.404], "eng": "Staff who had learned the job and adjusted to the organization kept leaving,"}, {"id": "v72", "speaker": "나레이션", "kor": "그 자리를 신입 직원들이 반복해서 채우게 되는 악순환이 반복되면서", "time": [361.561, 365.51], "eng": "and new hires kept filling their places, a vicious cycle that repeated over and over,"}, {"id": "v73", "speaker": "나레이션", "kor": "조직의 숙련도와 업무 연속성이 떨어지게 돼 각 기관은 골머리를 앓아야 했습니다.", "time": [365.51, 370.304], "eng": "so the organizations lost skill and continuity, and every institution had a real headache on its hands."}, {"id": "v74", "speaker": "나레이션", "kor": "결국 2차 이전 소식이 들려오자 직원들의 반발이 만만치 않습니다.", "time": [370.844, 375.128], "eng": "So now that news of a second relocation has come out, staff pushback is fierce."}, {"id": "v75", "speaker": "댓글4", "kor": "공공기관들 여기저기 흩뿌려준다고 지역이 활기가 돌까?", "time": [375.268, 377.705], "eng": "Will scattering public institutions all over the place really bring life to the regions?"}, {"id": "v76", "speaker": "댓글4", "kor": "요즘 다 맞벌이인데 배우자 직장은 어쩌고?", "time": [377.82, 379.617], "eng": "Everyone's a two-income couple these days, so what about the spouse's job?"}, {"id": "v77", "speaker": "댓글5", "kor": "기약 없는 기러기를 해야 하는 건데 맞나 싶어ㅠ", "time": [379.775, 382.009], "eng": "It means living apart from your family with no end in sight. Is that right? ㅠ"}, {"id": "v78", "speaker": "댓글6", "kor": "말이 쉽지 당사자 돼 봐... 십분 이해해", "time": [382.039, 384.287], "eng": "Easier said than done. Put yourself in their shoes... I totally get it."}, {"id": "v79", "speaker": "나레이션", "kor": "여기에 지난 4일 산업은행, 기업은행 등이 속한 금융노조는 강제 이전에 반대하며 대규모 총파업 결의 대회를 열기도 했는데요.", "time": [384.317, 391.678], "eng": "On top of that, on the 4th, the financial workers' union, which includes the Korea Development Bank and IBK, held a large rally voting for a general strike against forced relocation."}, {"id": "v80", "speaker": "나레이션", "kor": "이번 2차 이전에서도 업무의 효율성이 떨어질 것이며 인력이탈 문제가 반복될 거라는 우려가 터져 나오고 있는 겁니다.", "time": [392.138, 398.502], "eng": "Concerns are erupting that this second round will also hurt efficiency and bring the same exodus of staff."}, {"id": "v81", "speaker": "나레이션", "kor": "하지만 전문가들은 지방 이전을 안 할 수는 없다고 말합니다.", "time": [399.283, 402.905], "eng": "Still, experts say relocation can't be skipped."}, {"id": "v82", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "수도권의 거의 80% 가까운 모든 경제를 비롯한 모든 분야가 집중돼 있잖아요.", "time": [403.025, 408.828], "eng": "Close to 80% of everything, starting with the economy, is concentrated in the capital area."}, {"id": "v83", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 지역은 더더욱 지금 소멸위기에 처해 있고, 국토에 대한 균형발전 차원에서 2차 지방 이전 반드시 필요하겠죠.", "time": [409.068, 417.972], "eng": "And the regions are facing extinction more than ever, so for balanced national development, a second relocation is absolutely necessary."}, {"id": "v84", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "노조의 반발?", "time": [418.252, 418.953], "eng": "Pushback from the unions?"}, {"id": "v85", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "분명히 있을 수 있습니다.", "time": [419.093, 420.213], "eng": "Sure, that can happen."}, {"id": "v86", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "또 좀 더 원했던 공공기관이 이전하지 못한 지역에 대한 불만이라든가.", "time": [420.393, 425.163], "eng": "Or complaints from regions that didn't get the institutions they wanted."}, {"id": "v87", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "근데 이거는 그런 셈법으로 접근하면 안 되고요.", "time": [425.193, 428.594], "eng": "But you shouldn't approach this with that kind of calculation."}, {"id": "v88", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "100년 대계를 바라보고 대한민국의 국가 균형 발전을 위한 대승적 선택을 해야 된다, 결정을 해야 된다 이렇게 봅니다.", "time": [428.624, 436.877], "eng": "I believe we need to look at the hundred-year plan and make a big-picture choice, a decision, for Korea's balanced national development."}, {"id": "v89", "speaker": "나레이션", "kor": "한편 2차 지방 이전을 앞두고 벌써부터 지역 간 경쟁이 치열합니다.", "time": [436.907, 441.599], "eng": "Meanwhile, ahead of the second relocation, competition between regions is already fierce."}, {"id": "v90", "speaker": "나레이션", "kor": "전주시~ 유치 전략 승부수!!", "time": [441.629, 443.162], "eng": "Jeonju City: an all-out bid to attract institutions!!"}, {"id": "v91", "speaker": "나레이션", "kor": "포항시~ 행정력 집중!!", "time": [443.192, 444.613], "eng": "Pohang City: focusing its administrative muscle!!"}, {"id": "v92", "speaker": "나레이션", "kor": "반드시 제주로 이전해야!!", "time": [444.643, 446.309], "eng": "Must move to Jeju!!"}, {"id": "v93", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "특히나 소멸지수가 높은 지역일수록 절박하죠.", "time": [446.339, 449.361], "eng": "The higher a region's extinction index, the more desperate it is."}, {"id": "v94", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "공공기관, 우리가 이제 뭐 앵커 기관이라고 하는 메인 기관들이 이전에 오면,", "time": [449.391, 454.965], "eng": "When public institutions, the main ones we call anchor institutions, move in,"}, {"id": "v95", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "맨땅에 아무것도 없었던 나주 같은 경우 하나에 4만 명의 도시가 형성이 됐잖아요.", "time": [455.376, 460.263], "eng": "like Naju, where there was nothing at all on bare land, a city of 40,000 formed around one of them."}, {"id": "v96", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 에너지 산업에 중추 역할을 했지 않습니까?", "time": [460.293, 463.361], "eng": "And it played a central role in the energy industry, didn't it?"}, {"id": "v97", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그런 정도로 확실히 지역 발전에 아주 큰 성과가 있고 효과가 있기 때문에 지역에서는 사활을 거는 거죠.", "time": [463.391, 471.074], "eng": "Because it clearly brings that big a payoff and that much effect to regional development, the regions are going all in."}, {"id": "v98", "speaker": "나레이션", "kor": "말도 많고 걱정도 많고 지역 간 경쟁까지 벌어지고 있는 2차 지방 이전.", "time": [471.216, 475.879], "eng": "Lots of talk, lots of worry, and even competition between regions: that's the second relocation."}, {"id": "v99", "speaker": "나레이션", "kor": "똑같은 문제가 반복되지 않으려면 무엇부터 달라져야 할까요?", "time": [476.34, 479.922], "eng": "What has to change first so the same problems don't happen again?"}, {"id": "v100", "speaker": "나레이션", "kor": "전문가들은 입을 모아 정주 여건의 중요성을 강조합니다.", "time": [482.831, 486.135], "eng": "Experts all agree on how important living conditions are."}, {"id": "v101", "speaker": "나레이션", "kor": "직원들이 금요일마다 서울로 탈출하지 않도록 교육과 의료는 물론 주거와 배우자 일자리까지 가족이 함께 살아갈 수 있는 환경이 먼저 마련돼야 한다는 겁니다.", "time": [486.655, 496.105], "eng": "The point is that, so staff don't escape to Seoul every Friday, an environment where families can live together, not just schools and hospitals but housing and even jobs for spouses, has to come first."}, {"id": "v102", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 초기에 이전했던 사람들은 \"정신병 걸릴 지경이다\", 왜냐면 초창기 때는 사옥 하나밖에 없었거든요.", "time": [496.207, 502.114], "eng": "And the people who moved early on said it was 'enough to drive you crazy,' because at first there was just the one office building."}, {"id": "v103", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "주변에 허허벌판이었어요.", "time": [502.142, 503.739], "eng": "All around it was empty land."}, {"id": "v104", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "가족 동반이라는 거는 가족들의 일자리까지도 지역에서 과연 챙겨줄 수 있냐,", "time": [503.817, 509.582], "eng": "Moving with your family means: can the region actually look after jobs for family members too,"}, {"id": "v105", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그리고 교육 과정에 있는 자녀들까지도 챙겨줄 수 있냐.", "time": [509.716, 513.2], "eng": "and can it look after children who are still in school?"}, {"id": "v106", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "제일 지금 경계해야 되는 게 A도에 몇 개, B도에 몇 개 하는 정치적 나눠먹기식 배치가 제일 문제 아니겠습니까?", "time": [516.461, 524.053], "eng": "What we need to watch out for most right now is a political carve-up, so many for Province A, so many for Province B. Isn't that the biggest problem?"}, {"id": "v107", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "이렇게 하다가는 집적과 집중에 의한 지역의 산업 생태계가 형성되지 못하는 1차 때의 부정적 결과를 초래하겠죠.", "time": [524.083, 534.065], "eng": "If we do that, we'll end up with the same negative result as the first round, where no regional industrial ecosystem formed through clustering and concentration."}, {"id": "v108", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "특히 이제 지역 청년들이 지역을 떠나지 않는 양질의 안정된 일자리 이런 것들이 병행이 돼야 된다.", "time": [537.089, 543.323], "eng": "In particular, stable, good-quality jobs that keep local young people from leaving have to go hand in hand."}, {"id": "v109", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "결국은 이번 같은 경우는 기관과 사람을 옮기는 정책이 아니라 일자리와 산업 그리고 대학과 정주 환경까지 함께 옮기는 정책이 돼야만이 성공할 수 있다.", "time": [543.353, 554.377], "eng": "In the end, this time it can't just be a policy that moves institutions and people; it can only succeed if it moves jobs, industry, universities and living conditions together."}, {"id": "v110", "speaker": "이희성 (단국대 공공경영대학원 교수)", "kor": "그럴 때 지역이 살아나고 국가 균형 발전이 이루어진다.", "time": [554.407, 558.573], "eng": "That's when the regions come back to life and balanced national development happens."}, {"id": "v111", "speaker": "나레이션", "kor": "정부의 계획대로라면 올해 안에 구체적인 계획이 발표되고 2차 이전을 시작할 날도 얼마 남지 않았는데요.", "time": [558.603, 565.596], "eng": "If the government sticks to its plan, a detailed plan will be announced within this year, and the day the second relocation begins isn't far off."}, {"id": "v112", "speaker": "나레이션", "kor": "여러분은 이번 2차 공공기관 이전 어떻게 생각하시나요?", "time": [565.626, 569.123], "eng": "What do you think about this second relocation of public institutions?"}]}, {"title": "서울에 있어야 할까, 세종으로 가야 할까?", "subTitle": "크랩", "videoId": "vB03-sp_Hzg", "cardTitle": "서울에 있어야 할까, 세종으로 가야 할까?", "cardDesc": "동영상을 보며 금융당국의 세종 이전 논쟁을 들어 보세요.", "script": [{"id": "w1", "speaker": "나레이션", "kor": "우리나라 행정수도 세종.", "time": [0.091, 1.805], "eng": "Sejong, Korea's administrative capital."}, {"id": "w2", "speaker": "나레이션", "kor": "2012년 공식 출범한 뒤 교육부와 행정안전부 등 주요 행정기관들이 하나둘 자리를 옮겨 지금의 모습을 갖추게 됐습니다.", "time": [1.835, 8.812], "eng": "Since it officially launched in 2012, major government bodies like the Ministry of Education and the Ministry of the Interior and Safety have moved there one by one, giving it the shape it has today."}, {"id": "w3", "speaker": "나레이션", "kor": "그리고 최근 정부가 2차 공공기관 이전을 다시 추진하면서 대규모 지방 이전 논의도 본격적으로 속도를 내고 있는데요.", "time": [8.842, 15.452], "eng": "And now that the government is pushing the second relocation of public institutions again, talk of a large-scale move to the regions is picking up speed in earnest."}, {"id": "w4", "speaker": "나레이션", "kor": "그런데 이 과정에서 유독 거센 반발이 터져 나온 곳이 있습니다.", "time": [15.482, 19.056], "eng": "But in this process, there's one place where the pushback has been especially fierce."}, {"id": "w5", "speaker": "나레이션", "kor": "바로 금융당국입니다.", "time": [19.086, 20.441], "eng": "The financial authorities."}, {"id": "w6", "speaker": "나레이션", "kor": "금융정책을 총괄하는 금융위원회와 은행, 증권사 등 금융회사를 감독하는 금융감독원 두 기관 모두 우리나라 금융시장의 핵심 기관인데요.", "time": [23.323, 31.335], "eng": "The Financial Services Commission, which oversees financial policy, and the Financial Supervisory Service, which supervises financial companies like banks and securities firms, are both core institutions of Korea's financial market."}, {"id": "w7", "speaker": "나레이션", "kor": "특히 금감원은 1차 세종 이전 때는 은행과 증권사 같은 주요 금융회사들이 수도권에 몰려 있다는 점을 고려해 수도권 잔류가 필요한 기관으로 분류됐었고", "time": [31.365, 40.077], "eng": "In particular, during the first move to Sejong, the FSS was classified as an institution that needed to stay in the capital area, since major financial companies like banks and securities firms are concentrated there,"}, {"id": "w8", "speaker": "나레이션", "kor": "이후 새롭게 만들어진 금융위가 서울에 자리 잡으면서 금융위와 금감원 모두 서울에 남아 있게 됐습니다.", "time": [40.107, 45.616], "eng": "and later, as the newly created FSC set up in Seoul, both the FSC and the FSS ended up staying in Seoul."}, {"id": "w9", "speaker": "나레이션", "kor": "그런데 20여 년이 지난 지금 두 기관도 세종으로 가야 하는 거 아니냐는 말이 나오면서 반발이 커지고 있습니다.", "time": [45.646, 51.622], "eng": "But now, some 20 years on, people are saying the two should move to Sejong too, and the pushback is growing."}, {"id": "w10", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "금융회사 본점의 91.6%, 현장검사 대상의 88.3%가 수도권에 집중되어 있어요.", "time": [51.652, 57.335], "eng": "91.6% of financial companies' head offices and 88.3% of on-site inspection targets are concentrated in the capital area."}, {"id": "w11", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "금감원이 세종으로 이전하면 정부 부처의 협업은 편리해지겠지만", "time": [57.365, 60.931], "eng": "If the FSS moves to Sejong, working with government ministries will get easier,"}, {"id": "w12", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "실제 감독 대상과 멀어져서 출장, 이동 시간 이게 늘어나면서 업무 효율이 떨어질 가능성이 있다는 겁니다.", "time": [60.961, 67.258], "eng": "but it will be farther from the companies it actually supervises, so business trips and travel time will increase and work efficiency may fall."}, {"id": "w13", "speaker": "나레이션", "kor": "실제로 금감원이 올해 실시했거나 실시할 금융회사 검사는 707회, 투입 연인원만 2만 8천여 명.", "time": [67.434, 73.333], "eng": "In fact, the FSS has carried out or will carry out 707 inspections of financial companies this year, with some 28,000 person-days of staff deployed."}, {"id": "w14", "speaker": "나레이션", "kor": "세종에서 서울까지 먼 거리를 오가야 하는 비효율을 무시할 수 없다는 주장입니다.", "time": [73.44, 77.714], "eng": "The argument is that you can't ignore the inefficiency of traveling the long distance between Sejong and Seoul."}, {"id": "w15", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "공공기관 69곳이 2010년부터 2025년까지 수도권행 셔틀버스에 사용한 비용도 1,990억 원이었다는 (거예요).", "time": [77.744, 85.369], "eng": "69 public institutions also spent 199 billion won on shuttle buses to the capital area from 2010 to 2025."}, {"id": "w16", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "출장이나 이동 시간으로 인한 업무 비효율 또 비용의 발생이 있냐라는 걸 이제 보여주는 거고요.", "time": [85.719, 91.461], "eng": "That shows whether travel and commuting time lead to inefficiency and costs."}, {"id": "w17", "speaker": "나레이션", "kor": "금융위도 마찬가지입니다.", "time": [91.491, 92.763], "eng": "The same goes for the FSC."}, {"id": "w18", "speaker": "나레이션", "kor": "금융위는 금융규제와 제도를 만드는 곳이라 관계기관들과 수시로 회의도 해야 하고 은행, 증권사 같은 금융회사들과 늘 의견도 주고받아야죠.", "time": [92.793, 100.758], "eng": "Because the FSC makes financial regulations and systems, it has to meet with related agencies all the time and keep exchanging views with financial companies like banks and securities firms."}, {"id": "w19", "speaker": "나레이션", "kor": "금융시장이 크게 흔들리거나 금융사고가 터졌을 때는 발 빠른 대처도 중요하다는 입장.", "time": [100.867, 105.427], "eng": "Its position is that when the financial market is badly shaken or a financial crisis breaks out, a quick response is essential."}, {"id": "w20", "speaker": "나레이션", "kor": "그런데 세종으로 이사 가면 이런 신속한 대응이 어려워질 거라는 우려가 나오는 겁니다.", "time": [105.539, 109.949], "eng": "But there are concerns that moving to Sejong will make that kind of fast response harder."}, {"id": "w21", "speaker": "나레이션", "kor": "인재 유출이 일어날 거라는 주장도 있습니다.", "time": [109.979, 112.249], "eng": "Some also argue there will be a brain drain."}, {"id": "w22", "speaker": "나레이션", "kor": "금감원의 경우 이미 지난 5년간 500명에 가까운 직원이 퇴사했고,", "time": [112.279, 116.111], "eng": "At the FSS, nearly 500 employees have already quit in the past five years,"}, {"id": "w23", "speaker": "나레이션", "kor": "올해는 퇴사 직원 2명 중 1명은 한창 일해야 할 20·30·40대로 나타나면서", "time": [116.144, 120.811], "eng": "and this year one in two who quit was in their 20s, 30s or 40s, the very prime of their working lives,"}, {"id": "w24", "speaker": "나레이션", "kor": "지방으로 이전까지 하면 인력 이탈이 더 급속도로 진행될 거란 우려가 나오고 있고요.", "time": [120.844, 125.162], "eng": "so there are worries that a move to the regions would speed up the loss of staff even more."}, {"id": "w25", "speaker": "나레이션", "kor": "노조 자체 조사에서도 이전해도 계속 근무하겠다고 답한 직원은 겨우 25%에 그친 것으로 나타났죠.", "time": [125.192, 131.101], "eng": "In the union's own survey, too, only 25% of employees said they'd keep working there if it moved."}, {"id": "w26", "speaker": "원구환 (교수 / 한남대 행정학과)", "kor": "금융권의 전문 인력이라고 한다면 변호사, 회계사 여러 가지 재무 관련된 이런 인력들이 있는데 (세종 이전을) 꺼려할 가능성이 있고", "time": [131.131, 138.942], "eng": "When it comes to specialists in finance, there are lawyers, accountants and all kinds of finance-related professionals, and they may be reluctant (to move to Sejong),"}, {"id": "w27", "speaker": "원구환 (교수 / 한남대 행정학과)", "kor": "그러면서 안정적인 업무를 추진하는 것이 한계가 있지 않을까 하는 생각도 있고요.", "time": [138.972, 144.648], "eng": "and so there's also the thought that it may be hard to carry out the work stably."}, {"id": "w28", "speaker": "최충의 (교수 / 강원대 행정학과)", "kor": "서울이나 수도권이 가지고 있는 우수한 인재들을 원활하게 확보하기는 굉장히 어려운 상황이거든요.", "time": [144.678, 151.088], "eng": "It's very difficult to smoothly secure the top talent that Seoul and the capital area have."}, {"id": "w29", "speaker": "최충의 (교수 / 강원대 행정학과)", "kor": "실제로 세종이라든지 혁신도시라든지 지역에서 새로 신규 채용을 하는 데 있어서", "time": [151.118, 157.427], "eng": "In fact, analyses show that in places like Sejong and the innovation cities, recruiting new hires locally"}, {"id": "w30", "speaker": "최충의 (교수 / 강원대 행정학과)", "kor": "예전보다는 많은 어려움을 겪고 있는 걸로 분석된 바가 있습니다.", "time": [157.457, 161.331], "eng": "has become much harder than before."}, {"id": "w31", "speaker": "나레이션", "kor": "금융당국의 지방 이전을 나쁘게만 볼 건 아니라는 의견도 있습니다.", "time": [161.361, 164.901], "eng": "Others say moving the financial authorities to the regions isn't all bad."}, {"id": "w32", "speaker": "나레이션", "kor": "세종에는 재경부와 공정위처럼 이미 경제정책을 담당하는 주요 부처들이 모여 있어서", "time": [164.931, 169.606], "eng": "Sejong already has major ministries in charge of economic policy, like the Ministry of Finance and Economy and the Fair Trade Commission,"}, {"id": "w33", "speaker": "나레이션", "kor": "금융위까지 합류하면 경제정책과 금융정책을 한곳에서 맞춰볼 수 있는 만큼 업무 효율이 나아질 거라는 주장입니다.", "time": [169.636, 176.179], "eng": "so if the FSC joins them, economic and financial policy can be coordinated in one place, and the argument is that efficiency would improve."}, {"id": "w34", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "금융정책은 거시경제, 재정, 부동산 정책과 분리해서 다루기 어렵거든요.", "time": [176.209, 181.317], "eng": "Financial policy is hard to handle separately from macroeconomic, fiscal and real estate policy."}, {"id": "w35", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "실제 올해 4월 가계부채 관련 회의에서도 금융위뿐만 아니라 재경부, 국토교통부, 행안부, 한국은행, 금융감독원 등이 다 참여했습니다.", "time": [181.347, 189.559], "eng": "In fact, at a meeting on household debt this April, not only the FSC but the Ministry of Finance and Economy, the Ministry of Land, the Ministry of the Interior, the Bank of Korea and the FSS all took part."}, {"id": "w36", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "그러니까 최근에는 이 필요성이 더 커지고 있는 거예요.", "time": [189.589, 191.695], "eng": "So that need has grown even bigger lately."}, {"id": "w37", "speaker": "나레이션", "kor": "현 정부는 대통령 집무실과 국회 기능까지 세종으로 옮겨 행정수도 기능을 완성하겠다는 구상을 갖고 있는데요.", "time": [191.725, 197.73], "eng": "The current government plans to move even the presidential office and National Assembly functions to Sejong to complete its role as administrative capital."}, {"id": "w38", "speaker": "이재명 (21대 대통령)", "kor": "임기 내에 세종 집무실 시대를 열고 마지막 국무회의도 세종 집무실에서 개최한다는 자세로...", "time": [197.931, 205.642], "eng": "With the attitude of opening the era of the Sejong presidential office within my term, and holding even the last cabinet meeting there..."}, {"id": "w39", "speaker": "나레이션", "kor": "그만큼 수도권에 몰린 기능을 나누고 지역에 힘을 실어주겠다는 의지가 강한 상황.", "time": [205.672, 210.047], "eng": "In other words, the government is strongly determined to spread out the functions crammed into the capital area and give more weight to the regions."}, {"id": "w40", "speaker": "나레이션", "kor": "여기에 서울에 남아 있는 금융당국까지 세종으로 옮기면 정부의 균형발전 기조에도 맞고 장기적으로는 세종의 경제 기능을 키우는 데도 도움이 될 수 있다는 겁니다.", "time": [210.077, 218.755], "eng": "So the idea is that moving the financial authorities still in Seoul to Sejong would fit the government's balanced-development stance and, in the long run, help build up Sejong's economic role."}, {"id": "w41", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "세종이 얻어야 될 장기적인 효과는 금융기관이 집적이 되면 핀테크, 데이터, 회계, 법률, 컨설팅 같은 기업들이 모일 수가 있는 거죠.", "time": [218.785, 226.697], "eng": "The long-term effect Sejong should get is that once financial institutions cluster there, companies in fintech, data, accounting, law and consulting can gather too."}, {"id": "w42", "speaker": "장인봉 (교수 / 신한대 행정학과)", "kor": "그렇게 된다면 세종은 행정도시에서 경제적인 자족성을 가진 지역발전, 균형발전의 중요한 거점으로 발전할 가능성이 생길 수 있다는 겁니다.", "time": [226.727, 234.255], "eng": "If that happens, Sejong could grow from an administrative city into a key hub of regional and balanced development with economic self-sufficiency."}, {"id": "w43", "speaker": "원구환 (교수 / 한남대 행정학과)", "kor": "금융기관들이 이전하게 되면 지역 산업이라든가 정부 정책이라든가 또 민간에 미치는 파급 효과가 상대적으로 더 클 것으로 예상됩니다.", "time": [234.285, 243.202], "eng": "If financial institutions move, the ripple effects on local industry, government policy and the private sector are expected to be relatively larger."}, {"id": "w44", "speaker": "나레이션", "kor": "정부의 2차 공공기관 이전 계획은 올해 안에 구체적인 윤곽이 나올 걸로 보이는데요.", "time": [243.376, 247.851], "eng": "The government's plan for the second relocation is expected to take concrete shape within this year."}, {"id": "w45", "speaker": "나레이션", "kor": "당초 지난 25일 국무회의에서 이전 방향을 좀 더 구체화할 거라는 예상이 많았지만", "time": [247.881, 252.722], "eng": "Many expected the relocation direction to be firmed up at the cabinet meeting on the 25th,"}, {"id": "w46", "speaker": "나레이션", "kor": "정부는 한 차례 논의를 미루고 조금 더 공론화 과정을 충분히 거치겠다는 입장을 밝혔는데요.", "time": [252.752, 257.694], "eng": "but the government put off the discussion once and said it would go through a fuller public deliberation process."}, {"id": "w47", "speaker": "나레이션", "kor": "무엇보다 전문가들은 이번 이전에서 금융당국이 실제로 이전하게 된다면 실무 효율성을 꼼꼼히 고려해야 한다고 입을 모읍니다.", "time": [257.724, 264.367], "eng": "Above all, experts agree that if the financial authorities do move this time, practical efficiency must be weighed carefully."}, {"id": "w48", "speaker": "나레이션", "kor": "또 금융당국의 세종 이전이 실제로 추진된다면", "time": [276.543, 279.113], "eng": "Also, if the move of the financial authorities to Sejong actually goes ahead,"}, {"id": "w49", "speaker": "나레이션", "kor": "기관만 내려보내고 끝낼 게 아니라", "time": [279.262, 281.139], "eng": "it shouldn't end with just sending the institutions down;"}, {"id": "w50", "speaker": "나레이션", "kor": "수도권 집중을 줄이고 지역을 키우겠다는 정부의 큰 목표에 맞게", "time": [281.281, 284.859], "eng": "in line with the government's big goal of reducing capital-area concentration and growing the regions,"}, {"id": "w51", "speaker": "나레이션", "kor": "세종도 제대로 성장할 수 있는 계획이 함께 필요하다는 의견도 있습니다.", "time": [284.992, 288.648], "eng": "some say a plan for Sejong itself to grow properly is needed as well."}, {"id": "w52", "speaker": "이민환 (교수 / 인하대 파이낸스경영학과)", "kor": "경제력 집중도를 살펴보면 공공기관 이전에도 불구하고 수도권의 경제력 집중도는 과거에 비해서 더 높아졌거든요.", "time": [288.755, 297.1], "eng": "If you look at the concentration of economic power, the capital area's share has actually gone up compared with the past despite the relocation of public institutions."}, {"id": "w53", "speaker": "이민환 (교수 / 인하대 파이낸스경영학과)", "kor": "공공기관 하나를 옮긴다고 이런 문제들은 다 해결되지 않고요.", "time": [297.23, 300.67], "eng": "Moving one public institution doesn't solve all these problems."}, {"id": "w54", "speaker": "이민환 (교수 / 인하대 파이낸스경영학과)", "kor": "금융기관이라든가 핀테크 산업, 금융 IT 기업, 대학 연구기관 이런 것들이 함께 모일 수 있는 정책적인 생태계를 만들어야 됩니다.", "time": [300.7, 310.446], "eng": "We need to build a policy ecosystem where financial institutions, the fintech industry, financial IT companies and university research institutes can come together."}, {"id": "w55", "speaker": "나레이션", "kor": "실제 이전까지는 넘어야 할 산도 적지 않습니다.", "time": [310.577, 313.383], "eng": "There are also quite a few hurdles to clear before any actual move."}, {"id": "w56", "speaker": "나레이션", "kor": "금융위와 달리 금감원은 주사무소를 서울에 두도록 법에 규정돼 있고", "time": [313.413, 317.22], "eng": "Unlike the FSC, the FSS is required by law to keep its main office in Seoul,"}, {"id": "w57", "speaker": "나레이션", "kor": "이전 후보로 함께 거론되는 산업은행과 기업은행, 수출입은행들도 각각 현행법에 본점을 서울에 두도록 명시돼 있어 실제 이전을 위해서는 법 개정이 필요합니다.", "time": [317.25, 326.093], "eng": "and the Korea Development Bank, IBK Industrial Bank and the Export-Import Bank, also named as candidates, each have current laws stating their head offices must be in Seoul, so an actual move would require amending the law."}, {"id": "w58", "speaker": "나레이션", "kor": "수도권에 몰린 기능을 나누고 지역을 함께 키우겠다는 정부의 구상.", "time": [326.193, 329.9], "eng": "The government's plan to spread out the functions crammed into the capital area and grow the regions together."}, {"id": "w59", "speaker": "나레이션", "kor": "과연 금융위와 금감원의 미래는 어떻게 될까요?", "time": [329.93, 332.569], "eng": "So what will happen to the FSC and the FSS?"}, {"id": "w60", "speaker": "나레이션", "kor": "또 세종시는 행정도시를 넘어 금융과 경제 기능까지 갖춘 새로운 중심도시로 자리 잡을 수 있게 될까요?", "time": [332.599, 338.375], "eng": "And can Sejong go beyond being an administrative city and become a new central city with financial and economic functions too?"}, {"id": "w61", "speaker": "나레이션", "kor": "여러분의 의견을 댓글로 남겨주세요.", "time": [338.405, 340.377], "eng": "Leave your thoughts in the comments."}]}];

        const QUIZ_LIST = [{"id": 1, "textParts": ["정부는 수도권에 남아 있는 공공기관을 지방으로 ", " 계획을 본격적으로 추진하고 있어요."], "answer": "이전할", "altAnswers": ["이전하는"], "hint": "장소나 주소를 다른 곳으로 옮기다.", "verbHint": "기본형 '이전하다'를 뒤의 '계획'을 꾸미는 형태(-ㄹ)로 바꾸세요.", "explanation": "맞아요! '이전하다'는 기관이나 회사의 자리를 다른 곳으로 옮길 때 쓰는 말이에요. 정부는 1차 때 옮기지 않은 공공기관을 2차로 지방에 옮기려고 해요.", "textParts_eng": ["The government is pushing ahead with a plan to ", " the public institutions still left in the capital area to the provinces."], "answer_eng": "relocate"}, {"id": 2, "textParts": ["이번에는 꼭 필요한 기관만 남기고 수도권 ", "을/를 최대한 줄이겠다고 밝혔어요."], "answer": "잔류", "hint": "떠나지 않고 원래 있던 곳에 남아 있음.", "explanation": "맞아요! '수도권 잔류'는 지방으로 가지 않고 수도권에 그대로 남는 것을 말해요. 1차 때는 승인을 받아 인원이나 시설을 수도권에 남긴 기관이 많았어요.", "textParts_eng": ["This time, they said they would keep only the essential institutions and cut down on ", " in the capital area as much as possible."], "answer_eng": "staying behind"}, {"id": 3, "textParts": ["관련 기관들을 한 혁신도시에 ", " 배치하면 그 지역에 산업 생태계가 만들어지기 쉬워요."], "answer": "집적", "hint": "여러 가지를 한곳에 모아서 쌓음.", "explanation": "맞아요! '집적 배치'는 관련된 기관을 한곳에 모아 두는 것이에요. 한전과 산하기관이 한 지역에 모이면서 에너지 산업이 커진 것이 좋은 예예요.", "textParts_eng": ["If related institutions are ", " in one innovation city, it becomes easier for an industrial ecosystem to form there."], "answer_eng": "clustered"}, {"id": 4, "textParts": ["큰 금융기관이 지방으로 옮기면 그 지역 산업과 민간 기업에까지 미치는 ", "이/가 클 거라는 기대도 있어요."], "answer": "파급 효과", "altAnswers": ["파급효과"], "hint": "한 가지 일이 물결처럼 퍼져 다른 곳에까지 미치는 영향.", "explanation": "맞아요! '파급 효과'는 어떤 일의 영향이 물결처럼 주변으로 퍼져 나가는 것을 말해요. 금융기관은 다른 기관보다 지역 산업과 정부 정책, 민간에 미치는 영향이 더 클 거라는 의견이 있어요.", "textParts_eng": ["There is also hope that if a big financial institution moves to the provinces, its ", " on local industry and private companies will be large."], "answer_eng": "ripple effect"}, {"id": 5, "textParts": ["금융 전문가들은 가족과 떨어져 지방에서 혼자 사는 것을 ", " 경우가 많아요."], "answer": "꺼리는", "altAnswers": ["꺼려하는"], "hint": "싫어서 피하려고 하다.", "verbHint": "기본형 '꺼리다'를 뒤의 '경우'를 꾸미는 형태(-는)로 바꾸세요.", "explanation": "맞아요! '꺼리다'는 어떤 일이 싫어서 하지 않으려고 할 때 써요. 금융 기관이 세종으로 가면 전문 인력이 지방 근무를 피할 수 있다는 걱정이 나와요.", "textParts_eng": ["Financial specialists often ", " living alone in the provinces, away from their families."], "answer_eng": "are reluctant about"}, {"id": 6, "textParts": ["지방으로 옮기고 몇 년 사이에 젊은 직원 가운데 ", "이/가 크게 늘어서 기관마다 일손이 부족해졌어요."], "answer": "퇴사자", "hint": "다니던 회사를 그만두고 나간 사람.", "explanation": "맞아요! '퇴사자'는 회사를 그만둔 사람이에요. 주요 공공기관은 지방으로 옮긴 뒤 연평균 퇴사자가 약 2배로 늘었고, 특히 34세 이하 청년 퇴사자가 많이 늘었어요.", "textParts_eng": ["Within a few years of moving to the provinces, the number of young ", " rose sharply, leaving every institution short-handed."], "answer_eng": "employees who quit"}, {"id": 7, "textParts": ["능력 있는 직원들이 계속 떠나는 인재 ", "이/가 반복되면 기관의 역량도 떨어져요."], "answer": "이탈", "hint": "속해 있던 곳에서 떨어져 나감.", "explanation": "맞아요! '인재 이탈'은 능력 있는 사람들이 조직을 떠나는 것이에요. 정주 여건이 좋아지지 않으면 이탈과 역량 저하라는 악순환이 계속될 수 있어요.", "textParts_eng": ["If the ", " of talented staff keeps happening, the institution's capabilities decline too."], "answer_eng": "departure"}, {"id": 8, "textParts": ["정부가 사람만 지방으로 ", " 생활 여건을 마련해 주지 않으면 직원들은 오래 머물지 않을 거예요."], "answer": "내려보내고", "hint": "위나 중앙에서 아래쪽이나 지방으로 보내다.", "verbHint": "기본형 '내려보내다'를 뒤의 말과 이어지는 형태(-고)로 바꾸세요.", "explanation": "맞아요! '내려보내다'는 중앙에서 지방으로 보낸다는 뜻이에요. 기관만 옮기고 끝낼 것이 아니라 가족이 함께 살 수 있는 환경을 만들어야 한다는 지적이 있어요.", "textParts_eng": ["If the government just ", " people to the provinces without providing decent living conditions, employees won't stay long."], "answer_eng": "sends down"}, {"id": 9, "textParts": ["젊은 사람이 떠나고 아이가 태어나지 않는 지역은 ", " 위기에 처해 있어요."], "answer": "소멸", "hint": "사라져서 없어짐.", "explanation": "맞아요! '소멸 위기에 처하다'는 지역이 사라질 수도 있을 만큼 상황이 나쁘다는 말이에요. 그래서 소멸 위험이 큰 지역일수록 공공기관 유치에 더 절박해요.", "textParts_eng": ["Regions where young people leave and no children are born are facing the threat of ", "."], "answer_eng": "extinction"}, {"id": 10, "textParts": ["기관을 옮길 때는 건물을 짓는 비용뿐 아니라 이사와 업무 준비에 드는 ", " 비용도 많이 들어요."], "answer": "행정", "hint": "나라나 기관이 법과 규칙에 따라 공적인 일을 처리하는 것.", "explanation": "맞아요! '행정 비용'은 정부나 기관이 일을 처리하는 데 드는 돈이에요. 기관을 옮기면 이사하고 업무를 다시 준비하는 데 행정 비용이 생겨요.", "textParts_eng": ["Moving an institution costs not only money for new buildings but also a lot of ", " costs for moving and getting work back up and running."], "answer_eng": "administrative"}];

        //   · ENG 토글은 상위+하위 질문 전체 뒤(어휘 상자 위) 우측에 놓이며 상·하위 번역을 함께 켠다.
        const DISCUSS_DATA = [{"id": 1, "questionKor": "여러분의 나라에서도 수도나 수도권에 일자리와 인구가 몰려 있어요? 그 때문에 다른 도시들이 스스로 발전할 힘을 잃거나 사람이 줄어 사라질 위기를 겪고 있어요?", "questionEng": "In your country, are jobs and people also crowded into the capital or the capital region? Because of that, are other cities losing the ability to develop on their own, or facing the risk of disappearing as people leave?", "vocab": [{"term": "쏠림", "termEng": "skew / lopsided concentration", "def": "한쪽으로 지나치게 모이는 거예요.", "defEng": "Things gathering too much on one side."}, {"term": "자립", "termEng": "self-reliance", "def": "남에게 기대지 않고 스스로 서는 거예요.", "defEng": "Standing on your own without relying on others."}, {"term": "소멸 위기", "termEng": "risk of extinction", "def": "아예 사라질지도 모르는 위험한 상황이에요.", "defEng": "A dangerous situation where something might disappear entirely."}]}, {"id": 2, "questionKor": "다니는 직장이 대도시에서 중소도시로 옮겨 간다면, 여러분은 따라가겠어요, 아니면 그만두겠어요?", "questionEng": "If your workplace moved from a big city to a small or mid-sized city, would you go with it or quit?", "sub": ["결정하기 전에 가장 먼저 따져 볼 조건은 무엇이에요?", "옮겨 가지 않고 회사를 그만두는 20대·30대의 선택은 합리적이라고 생각해요?"], "subEng": ["What condition would you weigh first before deciding?", "Do you think young people in their 20s and 30s who quit rather than move are making a rational choice?"], "vocab": [{"term": "중소도시", "termEng": "small or mid-sized city", "def": "크지도 작지도 않은 규모의 도시예요.", "defEng": "A city that is neither very large nor very small."}, {"term": "따지다", "termEng": "to weigh / to consider carefully", "def": "좋고 나쁜 점을 하나하나 살펴봐요.", "defEng": "To look at the pros and cons one by one."}, {"term": "합리적", "termEng": "rational / reasonable", "def": "이치에 맞고 타당해요.", "defEng": "Making sense and well-founded."}]}, {"id": 3, "questionKor": "공공기관이 지방으로 옮긴 뒤 청년 퇴사자가 크게 늘었어요. 이 숫자만으로 지방 이전이 퇴사의 원인이라고 말할 수 있을까요? 같은 시기에 퇴사를 늘린 다른 이유는 없었을까요?", "questionEng": "Young resignations rose sharply after public institutions moved to the regions. Can these numbers alone tell us relocation caused the resignations? Could anything else have pushed resignations up in the same period?", "vocab": [{"term": "인과 관계", "termEng": "causal relationship", "def": "한 일이 다른 일을 일으키는 관계예요.", "defEng": "A relationship where one thing causes another."}, {"term": "단정하다", "termEng": "to conclude flatly", "def": "딱 잘라서 결론을 내려요.", "defEng": "To draw a firm conclusion outright."}, {"term": "변수", "termEng": "variable / factor", "def": "결과를 바꿀 수 있는 다른 이유예요.", "defEng": "Another factor that could change the result."}]}, {"id": 4, "questionKor": "금융당국처럼 일의 특성상 관련 회사들 가까이에 있어야 하는 기관도 지방으로 옮겨야 할까요? 업무 효율과 균형 발전이 부딪힐 때 무엇을 기준으로 판단해야 할까요?", "questionEng": "Should institutions like the financial authorities, which by the nature of their work need to be close to the companies they deal with, also move to the regions? When work efficiency and balanced development clash, what should the decision be based on?", "vocab": [{"term": "특성", "termEng": "characteristic / nature", "def": "어떤 것만 가진 특별한 성질이에요.", "defEng": "A special quality that only that thing has."}, {"term": "예외", "termEng": "exception", "def": "보통의 규칙에서 벗어나는 경우예요.", "defEng": "A case that falls outside the usual rule."}, {"term": "업무 효율", "termEng": "work efficiency", "def": "들인 시간과 힘에 비해 일이 잘되는 정도예요.", "defEng": "How well work gets done for the time and effort put in."}]}, {"id": 5, "questionKor": "본사 간판만 지방으로 옮기고 중요한 일은 수도권에 남긴 기관도 있었어요. 지역이 실제로 살아나려면 기관과 함께 무엇까지 옮겨 가야 할까요?", "questionEng": "Some institutions moved only their head-office signboards while keeping the important work in the capital area. For a region to truly come alive, what else has to move along with the institution?", "vocab": [{"term": "간판", "termEng": "signboard / outward front", "def": "가게나 회사 이름을 써서 밖에 거는 판이에요. 겉모습을 빗대어 말하기도 해요.", "defEng": "A sign with a shop or company name; also used figuratively for outward appearance."}, {"term": "권한", "termEng": "authority / power", "def": "어떤 일을 할 수 있는 힘이나 자격이에요.", "defEng": "The power or right to do something."}, {"term": "기능", "termEng": "function / role", "def": "어떤 것이 맡아서 하는 일이에요.", "defEng": "The job or role something performs."}]}, {"id": 6, "questionKor": "기관을 보낼 때, 교통과 시설이 좋은 대도시나 거점도시에 모아 보내는 것과 사람이 줄어 사라질 위기에 놓인 지역에 골고루 나누어 보내는 것 가운데 무엇이 더 바람직할까요?", "questionEng": "When sending institutions out, which is better: grouping them in big cities or hub cities with good transport and facilities, or spreading them evenly to regions at risk of disappearing as people leave?", "vocab": [{"term": "효율", "termEng": "efficiency", "def": "들인 힘에 비해 얻는 결과가 좋은 정도예요.", "defEng": "How good the result is for the effort put in."}, {"term": "형평성", "termEng": "fairness / equity", "def": "어느 한쪽에 치우치지 않고 고른 성질이에요.", "defEng": "Being even and fair, not favoring one side."}, {"term": "위기에 놓이다", "termEng": "to be at risk", "def": "위험한 처지가 돼요.", "defEng": "To be put in a dangerous situation."}]}, {"id": 7, "questionKor": "1차 이전 때는 정책이 여러 번 바뀌면서 이전이 늦어지고 이미 쓴 돈이 '매몰 비용'이 됐어요. 이런 큰 정책은 빠르게 밀고 나가는 것과 시간이 걸려도 충분히 공론화하는 것 가운데 무엇이 더 중요할까요?", "questionEng": "In the first relocation, the policy changed several times, delaying the move and turning money already spent into a 'sunk cost.' For a big policy like this, which matters more: pushing ahead quickly, or taking the time to debate it fully in public?", "vocab": [{"term": "밀고 나가다", "termEng": "to push ahead", "def": "어려움이 있어도 멈추지 않고 계속해요.", "defEng": "To keep going without stopping despite difficulties."}, {"term": "공론화", "termEng": "public deliberation", "def": "많은 사람이 함께 이야기하도록 문제를 드러내는 거예요.", "defEng": "Bringing an issue out so many people can discuss it."}, {"term": "일관성", "termEng": "consistency", "def": "앞뒤가 바뀌지 않고 한결같은 성질이에요.", "defEng": "Staying the same from start to finish."}]}, {"id": 8, "questionKor": "국가 균형 발전이 꼭 필요하다고 생각해요? 수도권 집중이 그 자체로 문제는 아니라고 본다면, 다른 지역은 어떤 방식으로 함께 발전할 수 있을까요?", "questionEng": "Do you think balanced national development is truly necessary? If you think capital-area concentration isn't a problem in itself, how could other regions develop alongside it?", "vocab": [{"term": "균형 발전", "termEng": "balanced development", "def": "여러 지역이 고르게 함께 성장하는 거예요.", "defEng": "All regions growing evenly together."}, {"term": "그 자체", "termEng": "in itself", "def": "다른 것과 상관없이 그것만 놓고 보는 거예요.", "defEng": "Looking at something on its own, apart from anything else."}, {"term": "대안", "termEng": "alternative", "def": "어떤 방법 대신 쓸 수 있는 다른 방법이에요.", "defEng": "Another way that could be used instead."}]}, {"id": 9, "questionKor": "공공기관을 서울에서 지방으로 옮기는 것에 대해 여러분은 어떻게 생각해요? 찬성과 반대 쪽의 주장 가운데 어떤 근거에, 어떤 점에서 동의해요?", "questionEng": "What do you think about moving public institutions from Seoul to the regions? Among the arguments for and against, which evidence do you agree with, and in what respect?", "vocab": [{"term": "찬성하다", "termEng": "to be in favor of", "def": "어떤 의견이나 계획이 좋다고 생각해 따라요.", "defEng": "To agree with and support a plan or opinion."}, {"term": "근거", "termEng": "grounds / evidence", "def": "어떤 생각이나 주장의 바탕이 되는 이유예요.", "defEng": "The reason a view or claim is based on."}, {"term": "동의하다", "termEng": "to agree", "def": "다른 사람의 의견을 옳다고 받아들여요.", "defEng": "To accept someone's opinion as right."}]}, {"id": 10, "questionKor": "공공기관은 이익을 내려고 세운 사기업이 아니에요. 그렇다고 해서 정부가 국가 전체를 위한 정책이라는 이유로 직원들의 뜻과 상관없이 이전을 결정하는 것은 정당할까요?", "questionEng": "Public institutions aren't private companies set up to make a profit. Even so, is it justified for the government to decide on relocation regardless of employees' wishes, on the grounds that it serves the nation as a whole?", "sub": ["법적으로 문제가 없다면, 사회적·윤리적·도의적으로도 괜찮다고 볼 수 있을까요?", "국가 전체의 정책과 불편을 겪게 될 직원들 사이에서, 정부는 어떤 방식으로 결정을 내리는 것이 바람직할까요?"], "subEng": ["If it's legally fine, can it also be considered acceptable socially, ethically and morally?", "Between nationwide policy and the employees who will bear the inconvenience, how should the government go about making its decision?"], "vocab": [{"term": "사기업", "termEng": "private company", "def": "개인이나 민간이 돈을 벌려고 세운 회사예요.", "defEng": "A company set up by individuals or private groups to make money."}, {"term": "정당하다", "termEng": "to be justified", "def": "이치에 맞아 올바르고 떳떳해요.", "defEng": "Right, fair and reasonable."}, {"term": "도의적", "termEng": "moral (in terms of duty)", "def": "사람이 지켜야 할 바른 도리에 맞는 거예요.", "defEng": "In line with the moral duties people should keep."}]}];

function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const model = curModel(); if (!model) throw AppError('model');
  const q = P.request(model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}

  const vocab = (d.vocab || []).map(v => ({ term: v.term, def: v.def || v.defEng || '' }));
  try {

// ---------- 이벤트 처리 (기존 #app 위임 리스너 안에서 호출) ----------
function aiHandleClick(a) {
  const act = a.dataset.action;
  if (!act || act.indexOf('aifb-') !== 0) return false;
  if (act === 'aifb-toggle-settings') { aiState.settingsOpen = !aiState.settingsOpen; aiRepaintKeyFields(); return true; }
  if (act === 'aifb-clear-key') { aiState.apiKey = ''; paint(); return true; }
  const qEl = a.closest('.discuss-q'); if (!qEl) return true;
  const id = +qEl.dataset.did, st = discussState[id];
  if (act === 'aifb-toggle-write') { st.open = !aiIsOpen(st); rerenderDiscussItem(id); if (st.open) { const t = qs(`.discuss-q[data-did="${id}"] textarea`, viewRoot()); if (t) t.focus(); } }
  else if (act === 'aifb-copy') { if (st.feedback) aiCopy(st, DISCUSS_DATA.find(x => x.id === id), a); }
  else if (act === 'aifb-download') { if (st.feedback) aiDownload(st, DISCUSS_DATA.find(x => x.id === id)); }
  else if (act === 'aifb-toggle-en') { st.showEn = !(st.showEn === null ? effLang() === 'en' : st.showEn); rerenderDiscussItem(id); }

  else if (act === 'aifb-clear-no') { st.confirmClear = false; rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-yes') { Object.assign(st, { text: '', feedback: null, feedbackFor: '', error: null, confirmClear: false }); aiSaveStore(); rerenderDiscussItem(id); }
  return true;
}
function aiHandleInput(t) {

    aiState.apiKey = t.value.trim();
    document.querySelectorAll('[data-ai-field="apiKey"]').forEach(x => { if (x !== t) x.value = t.value; });
    return true;
  }
  if (t.matches('[data-ai-field="customModel"]')) {
    aiState.customModel = t.value;
    document.querySelectorAll('[data-ai-field="customModel"]').forEach(x => { if (x !== t) x.value = t.value; });
    return true;
  }
  if (app.activeTab === 'discuss' && t.matches('[data-action="discuss-text"]')) {
    const qEl = t.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
    const wasStale = isStale(st);
    st.text = t.value; st.confirmClear = false; aiSaveStore();
    const run = qs('[data-action="discuss-feedback"]', qEl);
    if (run) { const dis = st.loading || !st.text.trim(); run.disabled = dis; run.className = run.className.replace(/border-gray-200 text-gray-300 cursor-not-allowed|border-black bg-black text-white hover:bg-white hover:text-black/, dis ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'); }
    const clr = qs('[data-action="aifb-clear-ask"]', qEl); if (clr) clr.disabled = !st.text.trim() && !st.feedback;
    if (isStale(st) !== wasStale) { const w = qs('[data-aifb-fb]', qEl); if (w) w.innerHTML = feedbackHTML(st, id); }
    return true;
  }
  return false;
}
function aiHandleChange(t) {

  if (k === 'provider') { aiState.provider = t.value; aiState.model = modelList()[0]; aiState.other = false; aiState.customModel = ''; aiRepaintKeyFields(); }
  else if (k === 'model') {

  }
  else if (k === 'customModel') { aiState.customModel = t.value; aiRepaintKeyFields(); }

}

function markedTextHTML(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {
    if (s.start < pos) return;
    out += esc(text.slice(pos, s.start));
    const orig = esc(text.slice(s.start, s.end));
    if (s.color === 'r') {
      out += `<del class="m-del">${orig}</del> <span class="m-ins">${esc(s.corrected)}</span><span class="n r">${numMark(s.num)}</span>` + s.extra.map(x => `<span class="n o">${numMark(x)}</span>`).join('');
    } else {
      out += `<span class="m-sug">${orig}</span><span class="n o">${numMark(s.num)}</span>`;
    }
    pos = s.end;
  });
  out += esc(text.slice(pos));
  return out;
}

function cardHTML(it, mode, showEn) {
  const T = uiOf(mode);
  const isR = it.color === 'r';
  const to = isR ? it.corrected : it.suggested;
  const tagEn = FEEDBACK_CONFIG.TAG_LABEL_EN[it.tag] || it.tag;
  const tagHTML = mode === 'A' ? esc(tagEn) : mode === 'B' ? sw(it.tag, tagEn) : esc(it.tag);
  const word = !isR && it.word && it.word.term ? `<div class="word"><b>${L(mode, 'newWord')}</b> · ${esc(it.word.term)}${it.word.hanja ? `(${esc(it.word.hanja)})` : ''}${it.word.meaning ? `: ${esc(it.word.meaning)}` : ''}</div>` : '';
  return `<div class="card ${it.color}">
    <div class="card-h"><span class="n ${it.color}" style="vertical-align:baseline">${numMark(it.num)}</span><span class="chip ${it.color}">${tagHTML}</span><span class="kind">${isR ? L(mode, 'fix') : L(mode, 'sug')}</span></div>
    <div class="pair">${isR ? `<span class="m-del">${esc(it.original)}</span>` : `<span>${esc(it.original)}</span>`}<span class="arrow">→</span><span class="${isR ? 'to-r' : 'to-o'}">${esc(to)}</span></div>
    ${it.explanation ? `<p class="exp">${richText(it.explanation)}</p>` : ''}
    ${showEn && it.explanationEn ? `<p class="en">${richText(it.explanationEn)}</p>` : ''}
    ${it.example ? `<p class="ex">${L(mode, 'ex')} ${richText(it.example)}</p>` : ''}
    ${word}
  </div>`;
}

function askHTML(mode) {
  const C = FEEDBACK_CONFIG.CONTACT;
  const links = [];
  if (C.email) links.push(`<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`);
  if (C.url) links.push(`<a href="${esc(C.url)}" target="_blank" rel="noopener">${esc(C.urlLabel || C.url)}</a>`);
  return `<div class="ask">${L(mode, 'ask')}${links.length ? `<div style="margin-top:6px">${links.join(' · ')}</div>` : ''}</div>`;
}

function feedbackHTML(st, id) {
  const curMode = modeOf();
  if (st.loading) return `<div class="loading">${L(curMode, 'loading')}</div>`;
  const errBox = errHTML(curMode, 'feedbackFail', st.error);
  const fb = st.feedback; if (!fb) return errBox;
  const mode = fb.mode, T = uiOf(mode);
  const showEn = mode === 'B' && (st.showEn === null ? effLang() === 'en' : st.showEn);   // 영어 메뉴면 번역 펼침이 기본
  const en = (v) => (showEn && v ? `<p class="en">${richText(v)}</p>` : '');
  const src = st.feedbackFor;
  const { reds, oranges } = layoutFeedback(src, fb);
  const rel = fb.relevance;
  const relHTML = rel.status === 'on'
    ? `<div class="rel on"><p>✓ ${L(mode, 'relOn')}</p></div>`
    : `<div class="rel ${rel.status}"><span class="fb-label">${(rel.status === 'off' ? L(mode, 'relOff') : L(mode, 'relPartial'))}</span>${rel.comment ? `<p>${richText(rel.comment)}</p>` : ''}${en(rel.commentEn)}${rel.modelAnswer ? `<div class="model"><span class="fb-label">${L(mode, 'model')}</span>${richText(rel.modelAnswer)}${rel.modelAnswerEn && (mode === 'A' || showEn) ? `<p class="en">${richText(rel.modelAnswerEn)}</p>` : ''}</div>` : ''}</div>`;
  const none = !reds.length && !oranges.length;
  const body = none
    ? `<p class="status">${L(mode, 'none')}</p>`
    : `<div class="fb-sec"><span class="fb-label">${(isStale(st) ? L(mode, 'oldText') : L(mode, 'myText'))}</span><div class="text">${markedTextHTML(src, reds, oranges)}</div>
        <div class="legend"><span><span class="m-del">${L(mode, 'legendRed')}</span></span><span><span class="m-sug">${L(mode, 'legendOrange')}</span></span></div></div>
      <div class="fb-sec"><span class="fb-label">${L(mode, 'wrong')}</span>${reds.length ? reds.map(r => cardHTML(r, mode, showEn)).join('') : `<p class="status">${L(mode, 'noWrong')}</p>`}</div>
      ${oranges.length ? `<div class="fb-sec"><span class="fb-label">${L(mode, 'better')}</span>${oranges.map(o => cardHTML(o, mode, showEn)).join('')}</div>` : ''}`;
  const engBtn = mode === 'B' ? `<button type="button" class="slim eng${showEn ? ' on' : ''}" data-action="aifb-toggle-en" aria-pressed="${showEn}">ENG</button>` : '';
  return `${errBox}<div class="fb fb-${mode}"><div class="fb-top"><h3>${L(mode, 'title')}</h3><div class="fb-tools">${engBtn}${toolBtn('aifb-copy', ICON_COPY, '복사', 'Copy', mode)}${toolBtn('aifb-download', ICON_SAVE, '저장', 'Save', mode)}</div></div>
    ${isStale(st) ? `<div class="stale">${L(mode, 'stale')}</div>` : ''}
    ${relHTML}
    ${fb.praise ? `<div class="fb-sec"><span class="fb-label">${L(mode, 'praise')}</span><div class="praise">${richText(fb.praise)}${en(fb.praiseEn)}</div></div>` : ''}
    ${body}
    ${askHTML(mode)}
  </div>`;
}

// ---------- 내보내기: 복사(서식 + 글자만) · 저장(.html) ----------
// 붙여 넣는 곳(Google Docs·Word·메일)에는 이 페이지의 CSS가 없으므로, 서식은 모두 인라인 스타일로 넣는다.
const EXP = {

  serif: "'Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif", sans: "'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"
};
const expDel = (t) => `<span style="color:${EXP.red};text-decoration:line-through;">${esc(t)}</span>`;
const expIns = (t) => `<span style="color:${EXP.red};font-weight:700;">${esc(t)}</span>`;
const expSug = (t) => `<span style="text-decoration:underline;text-decoration-style:dotted;text-decoration-color:${EXP.orange};">${esc(t)}</span>`;
const expNum = (n, c) => `<sup style="color:${c === 'r' ? EXP.red : EXP.orange};font-weight:700;">${numMark(n)}</sup>`;
const expLabel = (t) => `<p style="margin:18px 0 6px;font-family:${EXP.sans};font-size:12px;font-weight:700;color:${EXP.muted};">${t}</p>`;
const expText = (s) => richText(s);   // **굵게**만 <b>로
function exportQuestion(d) { return [d.questionKor].concat((d.sub || []).map((q, i) => `${d.id}-${i + 1}. ${q}`)); }
function exportMarked(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {
    if (s.start < pos) return;

    pos = s.end;
  });
  return out + esc(text.slice(pos));
}
// 내보낼 때 쓰는 고정 문구: A 영어, B 한국어(+영어), C 한국어
const expT = (mode, key) => mode === 'A' ? UI_TEXT.en[key] : UI_TEXT.ko[key];
const expTEn = (mode, key) => mode === 'B' ? UI_TEXT.en[key] : '';
function exportParts(st, d) {

      <p style="margin:0 0 4px;font-family:${EXP.serif};font-size:15px;">${isR ? expDel(it.original) : esc(it.original)} <span style="color:${EXP.muted};">→</span> <b style="color:${isR ? EXP.red : EXP.orange};">${esc(to)}</b></p>

      ${!isR && it.word && it.word.term ? `<p style="margin:4px 0 0;font-family:${EXP.sans};font-size:13px;">${esc(expT(mode, 'newWord'))} · ${esc(it.word.term)}${it.word.hanja ? `(${esc(it.word.hanja)})` : ''}${it.word.meaning ? `: ${esc(it.word.meaning)}` : ''}</p>` : ''}

  const qLines = exportQuestion(d);
  const html = `<div style="font-family:${EXP.sans};font-size:14px;line-height:1.7;color:#111;">
    <p style="margin:0 0 4px;font-family:${EXP.sans};font-size:12px;color:${EXP.muted};">${esc(exportTitle())} · ${esc(L_DATE())}</p>
    <p style="margin:0 0 4px;font-family:${EXP.serif};font-size:18px;font-weight:700;">${String(d.id).padStart(2, '0')}. ${esc(qLines[0])}</p>
    ${qLines.slice(1).map(q => `<p style="margin:0;font-family:${EXP.serif};font-size:15px;">${esc(q)}</p>`).join('')}

        function dictBlanks(line) {

            vocabTermsFor(learn.videoIdx).forEach(({ term, idx }) => { let i = 0; while ((i = text.indexOf(term, i)) !== -1) { const end = i + term.length; if (!m.some(x => (i >= x.start && i < x.end) || (end > x.start && end <= x.end) || (i <= x.start && end >= x.end))) m.push({ start: i, end, idx }); i += 1; } });

        function dictLCS(a, b) {

ans text-gray-400 hover:text-gray-600 underline">동사변형 힌트</button>` : ''}${quiz.particleHint ? `<button type="button" data-q="hint-particle" class="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">조사 힌트</button>` : ''}</div>` : ''}${st.hintVerb && quiz.verbHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.verbHint)}</p>` : ''}${st.hintParticle && quiz.particleHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.particleHint)}</p>` : ''}</div>` : ''}${quiz.explanation && st.result === 'correct' ? `<p class="mt-4 text-sm font-sans text-green-700 font-medium">✓ Correct. ${esc(quiz.explanation)}</p>` : ''}${quiz.explanation && st.result === 'incorrect' ? '<p class="mt-4 text-sm font-sans text-red-600 font-medium">✕ Try again.</p>' : ''}</div>`;
