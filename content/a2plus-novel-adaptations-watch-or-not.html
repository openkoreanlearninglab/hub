/* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}

            { term: "기대했다가", mainDef: "\"I got my hopes up, and then…\" — you can hear the bad news coming.", variants: ["기대했다가"], subDefs: [{ subTerm: "• -았/었다가 (as in 기대했다가)", subDef: "one thing finishes and then turns the other way. 기대했다가 실망하다 = get excited, then be let down." }], examples: [{ kor: "창문을 열었다가 다시 닫았어요.", eng: "I opened the window and then closed it again." }] },
            { term: "실망하다", mainDef: "to be disappointed — to feel bad because something is worse than you thought — defined in the script.", variants: ["실망하다"], examples: [{ kor: "시험 점수를 보고 실망했어요.", eng: "I saw my test score and was disappointed." }] },
            { term: "실망한 적이 너무 많아요", mainDef: "\"I've been let down way too many times.\"", variants: ["실망한 적이 너무 많아요", "실망했대요"], subDefs: [{ subTerm: "• -(으)ㄴ 적이 있다", subDef: "\"I have ~ed before\" — the pattern for past experience. It always takes the past form -(으)ㄴ." }, { subTerm: "• 너무", subDef: "too much, way too — stronger than 아주, and usually a little negative." }], examples: [{ kor: "저는 한국에 간 적이 있어요.", eng: "I have been to Korea before." }] },
            { term: "생각보다 안 좋아서 기분이 나쁘다", mainDef: "\"it's worse than you thought, so you feel bad\" (the script's definition of 실망하다).", variants: ["생각보다 안 좋아서 기분이 나쁘다"], subDefs: [{ subTerm: "• 생각보다", subDef: "\"than you thought\" — compares what really happened with what you expected." }, { subTerm: "• -아서/어서 (as in 좋아서)", subDef: "\"because ~, so ...\" — the first part is the reason for the second." }, { subTerm: "• 기분이 나쁘다", subDef: "to feel bad, to be in a bad mood." }], examples: [{ kor: "이 가방은 생각보다 비싸요.", eng: "This bag is more expensive than I thought." }] },
            { term: "잘 만든 영화", mainDef: "a well-made movie.", variants: ["잘 만든 영화"], subDefs: [{ subTerm: "• 잘 만들다", subDef: "to make something well — used a lot for movies, shows and food." }, { subTerm: "• -ㄴ/은 (as in 만든)", subDef: "the past form that describes the next noun." }], examples: [{ kor: "이 드라마는 정말 잘 만들었어요.", eng: "This drama was really well made." }] },
            { term: "<반지의 여왕>", mainDef: "<Queen of the Rings> — the fantasy film series in this episode. It was made from a novel, and its last film won eleven Academy Awards.", variants: ["<반지의 여왕>"], examples: [{ kor: "<반지의 여왕>은 소설이 원작이에요.", eng: "<Queen of the Rings> came from a novel." }] },
            { term: "마지막 편", mainDef: "the last one in a series — the final film or episode.", variants: ["마지막 편"], subDefs: [{ subTerm: "• 마지막", subDef: "the last one; the end." }, { subTerm: "• 편", subDef: "the counting word for films and episodes (1편, 2편…)." }], examples: [{ kor: "그 영화 마지막 편을 아직 못 봤어요.", eng: "I haven't seen the last film of that series yet." }] },
            { term: "상을 열한 개나 받았어요", mainDef: "\"It won eleven awards — eleven!\" The speaker thinks the number is amazing.", variants: ["상을 열한 개나 받았어요"], subDefs: [{ subTerm: "• 상을 받다", subDef: "to win an award." }, { subTerm: "• 개", subDef: "the counting word for things (한 개, 두 개…)." }, { subTerm: "• -(이)나 (as in 열한 개나)", subDef: "\"as many as ~\" — shows the speaker finds the number surprisingly big. Different from the -(이)나 that means \"or.\"" }], examples: [{ kor: "어제 커피를 다섯 잔이나 마셨어요.", eng: "Yesterday I drank as many as five cups of coffee." }] },
            { term: "배우", mainDef: "actor, actress.", variants: ["배우"], examples: [{ kor: "제가 좋아하는 배우가 나와요.", eng: "The actor I like is in it." }] },
            { term: "책 속 사람들이랑", mainDef: "\"with the people inside the book\" — that is, with the characters.", variants: ["책 속 사람들이랑"], subDefs: [{ subTerm: "• 속", subDef: "the inside of something (책 속 = inside the book)." }, { subTerm: "• -들", subDef: "makes a noun plural (사람 → 사람들)." }, { subTerm: "• -(이)랑", subDef: "\"with ~ / and ~\" — the casual spoken form of -와/과." }], examples: [{ kor: "친구랑 같이 밥을 먹었어요.", eng: "I ate with my friend." }] },
            { term: "어울리다", mainDef: "to go well together, to suit each other — defined in the script.", variants: ["어울렸어요", "어울리다"], examples: [{ kor: "그 모자가 정말 잘 어울려요.", eng: "That hat really suits you." }] },
            { term: "두 개가 잘 맞다", mainDef: "\"the two things fit each other well\" (the script's definition of 어울리다).", variants: ["두 개가 잘 맞다"], subDefs: [{ subTerm: "• 두 개", subDef: "two things." }, { subTerm: "• 잘 맞다", subDef: "to fit well, to match." }], examples: [{ kor: "이 신발은 발에 잘 맞아요.", eng: "These shoes fit my feet well." }] },
            { term: "맞아요", mainDef: "\"That's right.\" — used to agree with what the other person just said.", variants: ["맞아요"], examples: [{ kor: "맞아요, 저도 그렇게 생각해요.", eng: "That's right, I think so too." }] },
            { term: "역할", mainDef: "role — the person an actor becomes in a movie — defined in the script.", variants: ["역할"], examples: [{ kor: "이번에는 의사 역할을 해요.", eng: "This time she plays the role of a doctor." }] },
            { term: "역할을 위해서", mainDef: "\"for the role\" — in order to play it well.", variants: ["역할을 위해서"], subDefs: [{ subTerm: "• -을/를 위해서", subDef: "\"for ~ / in order to ~\" — shows the goal of an action." }], examples: [{ kor: "가족을 위해서 열심히 일해요.", eng: "I work hard for my family." }] },
            { term: "아주 오래 준비했대요", mainDef: "\"I hear they prepared for a very long time.\"", variants: ["아주 오래 준비했대요"], subDefs: [{ subTerm: "• 오래", subDef: "for a long time." }, { subTerm: "• 준비하다", subDef: "to prepare, to get ready." }, { subTerm: "• -대요 (as in 준비했대요)", subDef: "\"I hear that ~ / they say ~\" — passes on something you heard. Short for -다고 해요." }], examples: [{ kor: "그 식당이 정말 맛있대요.", eng: "I hear that restaurant is really good." }] },
            { term: "영화에서 배우가 되는 사람", mainDef: "\"the person the actor becomes in the movie\" (the script's definition of 역할).", variants: ["영화에서 배우가 되는 사람"], subDefs: [{ subTerm: "• -에서 (as in 영화에서)", subDef: "\"in / at\" — marks the place where something happens." }, { subTerm: "• -이/가 되다 (as in 배우가 되는)", subDef: "to become ~." }], examples: [{ kor: "저는 도서관에서 공부해요.", eng: "I study at the library." }] },
            { term: "근데", mainDef: "\"but, by the way\" — the casual form of 그런데, often used to change the subject.", variants: ["근데"], examples: [{ kor: "근데 지금 몇 시예요?", eng: "By the way, what time is it now?" }] },
            { term: "<여왕의 게임>", mainDef: "<The Queen's Game> — the fantasy drama in this episode. Its novel wasn't finished, so the show wrote its own ending and fans were furious.", variants: ["<여왕의 게임>"], examples: [{ kor: "<여왕의 게임> 마지막 시즌 봤어요?", eng: "Did you watch the last season of <The Queen's Game>?" }] },
            { term: "어땠어요?", mainDef: "\"How was it?\" — the past form of 어때요?", variants: ["어땠어요"], subDefs: [{ subTerm: "• 어떻다", subDef: "to be how, to be what kind." }], examples: [{ kor: "어제 본 영화는 어땠어요?", eng: "How was the movie you watched yesterday?" }] },
            { term: "이야기", mainDef: "story; talk.", variants: ["이야기"], examples: [{ kor: "이 책은 이야기가 슬퍼요.", eng: "This book has a sad story." }] },
            { term: "너무 빨리 끝나서", mainDef: "\"it ended so fast that…\" — the reason the ending felt wrong.", variants: ["너무 빨리 끝나서"], subDefs: [{ subTerm: "• 빨리", subDef: "fast, quickly." }, { subTerm: "• 끝나다", subDef: "to end, to be over." }, { subTerm: "• -아서/어서 (as in 끝나서)", subDef: "\"because ~, so ...\" — the first part causes the second." }], examples: [{ kor: "수업이 일찍 끝나서 집에 갔어요.", eng: "Class ended early, so I went home." }] },
            { term: "어색하다", mainDef: "to feel off, to look awkward — it doesn't fit, so it doesn't look right — defined in the script.", variants: ["어색했어요", "어색하다"], examples: [{ kor: "이 사진은 웃는 얼굴이 좀 어색해요.", eng: "The smile in this photo looks a bit awkward." }] },
            { term: "잘 안 어울려서 보기 안 좋다", mainDef: "\"it doesn't go together well, so it doesn't look good\" (the script's definition of 어색하다).", variants: ["잘 안 어울려서 보기 안 좋다"], subDefs: [{ subTerm: "• 안", subDef: "not — put it right before a verb or describing word." }, { subTerm: "• -기 (as in 보기)", subDef: "turns a verb into a noun-like form (보다 → 보기 = looking, watching)." }, { subTerm: "• 보기 안 좋다", subDef: "to not look good; to be unpleasant to watch." }], examples: [{ kor: "이 색은 저 색하고 잘 안 어울려요.", eng: "This color doesn't go well with that one." }] },
            { term: "마지막 시즌", mainDef: "the final season of a TV show.", variants: ["마지막 시즌"], subDefs: [{ subTerm: "• 시즌", subDef: "season — one set of episodes of a show." }], examples: [{ kor: "마지막 시즌이 제일 재미있었어요.", eng: "The final season was the most fun." }] },
            { term: "논란", mainDef: "controversy, backlash — a big fight because people think differently — defined in the script.", variants: ["논란"], examples: [{ kor: "그 뉴스 때문에 논란이 생겼어요.", eng: "That news caused a controversy." }] },
            { term: "논란이 정말 컸어요", mainDef: "\"The backlash was huge.\"", variants: ["논란이 정말 컸어요"], subDefs: [{ subTerm: "• 논란이 크다", subDef: "for a controversy to be big. Korean says the controversy \"is big,\" not that it \"is strong.\"" }], examples: [{ kor: "그 영화는 논란이 컸어요.", eng: "That movie caused a big controversy." }] },
            { term: "백만 명이 넘는", mainDef: "\"more than a million (people).\"", variants: ["백만 명이 넘는"], subDefs: [{ subTerm: "• 명", subDef: "the counting word for people (한 명, 두 명…)." }, { subTerm: "• -이/가 넘다", subDef: "to go over a number." }, { subTerm: "• -는 (as in 넘는)", subDef: "turns the verb into a form that describes the next noun (넘는 사람들 = \"people who go over\")." }], examples: [{ kor: "이 영상은 조회수가 백만이 넘어요.", eng: "This video has more than a million views." }] },
            { term: "\"다시 만들어 주세요\"라고 했대요", mainDef: "\"I hear they said, 'Please remake it.'\"", variants: ["\"다시 만들어 주세요\"라고 했대요"], subDefs: [{ subTerm: "• 다시", subDef: "again." }, { subTerm: "• -아/어 주세요 (as in 만들어 주세요)", subDef: "\"please do ~ for me\" — asks for something as a favor." }, { subTerm: "• -라고 하다 (as in 라고 했대요)", subDef: "to say \"~\" — quotes someone's exact words." }], examples: [{ kor: "친구가 \"내일 봐\"라고 했어요.", eng: "My friend said, \"See you tomorrow.\"" }] },
            { term: "사람들 생각이 달라서 크게 싸우는 것", mainDef: "\"people think differently, so they fight a lot\" (the script's definition of 논란).", variants: ["사람들 생각이 달라서 크게 싸우는 것"], subDefs: [{ subTerm: "• 다르다 (as in 달라서)", subDef: "to be different. 다르다 changes to 달라 before -서." }, { subTerm: "• 크게", subDef: "greatly, in a big way." }, { subTerm: "• 싸우다", subDef: "to fight, to argue." }, { subTerm: "• -는 것", subDef: "\"the act of ~ing\" — turns a verb into a noun-like chunk." }], examples: [{ kor: "제 생각은 친구 생각하고 달라요.", eng: "My opinion is different from my friend's." }] },
            { term: "아직 안 끝나서 그래요", mainDef: "\"It's because it isn't finished yet.\" — Joy explains the real cause.", variants: ["아직 안 끝나서 그래요"], subDefs: [{ subTerm: "• 아직", subDef: "still, not yet — often used together with 안 or 못." }, { subTerm: "• -아서/어서 그래요", subDef: "\"it's because ~\" — answers a question about why something is the way it is." }], examples: [{ kor: "어제 늦게 자서 그래요.", eng: "It's because I went to bed late yesterday." }] },
            { term: "소설보다 먼저", mainDef: "\"before the novel did\" — earlier than the novel.", variants: ["소설보다 먼저"], subDefs: [{ subTerm: "• -보다", subDef: "\"than ~\" — used to compare two things." }, { subTerm: "• 먼저", subDef: "first, before the other one." }], examples: [{ kor: "오늘이 어제보다 더워요.", eng: "Today is hotter than yesterday." }] },
            { term: "만들었거든요", mainDef: "\"they made it, you see.\" -거든요 again — this time explaining a fact that surprised the listener.", variants: ["만들었거든요"], subDefs: [{ subTerm: "• -거든요 (as in 만들었거든요)", subDef: "\"you see, it's because ~.\" Here Joy uses it to explain why the show and the novel don't match." }], examples: [{ kor: "그 가게는 오늘 쉬어요. 일요일이거든요.", eng: "That shop is closed today. It's Sunday, you see." }] },
            { term: "그래서", mainDef: "so, that's why — connects a reason to its result.", variants: ["그래서"], examples: [{ kor: "배가 아팠어요. 그래서 병원에 갔어요.", eng: "My stomach hurt. So I went to the hospital." }] },
            { term: "설정", mainDef: "the setup of a story — the rules and facts inside it: who is who, how the world works — defined in the script.", variants: ["설정"], examples: [{ kor: "이 드라마는 설정이 재미있어요.", eng: "This drama has an interesting setup." }] },
            { term: "많이 달라졌어요", mainDef: "\"a lot of it changed.\"", variants: ["많이 달라졌어요"], subDefs: [{ subTerm: "• 많이", subDef: "a lot, much." }, { subTerm: "• 달라지다", subDef: "to change, to become different — it changes by itself, with nobody doing it." }, { subTerm: "• -아/어지다 (as in 달라지다)", subDef: "\"to become ~\" — a state turns into another one on its own (다르다 → 달라지다)." }], examples: [{ kor: "이사 후에 생활이 많이 달라졌어요.", eng: "My life changed a lot after moving." }] },
            { term: "이야기에 있는 규칙", mainDef: "\"the rules that are in the story\" (the script's definition of 설정).", variants: ["이야기에 있는 규칙"], subDefs: [{ subTerm: "• -에 있는", subDef: "\"that is in ~\" — describes where something is." }, { subTerm: "• 규칙", subDef: "a rule — something everyone has to follow." }], examples: [{ kor: "교실에 있는 규칙을 지켜요.", eng: "We follow the rules that are in the classroom." }] },
            { term: "작가", mainDef: "writer, author.", variants: ["작가"], examples: [{ kor: "이 소설의 작가를 좋아해요.", eng: "I like the author of this novel." }] },
            { term: "똑같았어요", mainDef: "\"It was exactly the same.\"", variants: ["똑같았어요"], subDefs: [{ subTerm: "• 똑같다", subDef: "to be exactly the same. 같다 means \"the same\"; 똑- makes it \"exactly.\"" }], examples: [{ kor: "우리 가방이 똑같아요.", eng: "Our bags are exactly the same." }] },
            { term: "<반지의 여왕> 같은 영화 때문에", mainDef: "\"because of movies like <Queen of the Rings>.\"", variants: ["<반지의 여왕> 같은 영화 때문에"], subDefs: [{ subTerm: "• -같은", subDef: "\"like ~\" — used to give an example (사과 같은 과일 = fruits like apples)." }, { subTerm: "• -때문에", subDef: "\"because of ~\" — comes after a noun." }], examples: [{ kor: "눈 때문에 학교에 늦었어요.", eng: "I was late for school because of the snow." }] },
            { term: "계속", mainDef: "still, continuously — to keep doing something.", variants: ["계속"], examples: [{ kor: "비가 계속 와요.", eng: "It keeps raining." }] },
            { term: "그냥", mainDef: "just — \"nothing special, I'll simply do this.\"", variants: ["그냥"], examples: [{ kor: "저는 그냥 집에 있을래요.", eng: "I'll just stay home." }] },
            { term: "읽을래요", mainDef: "\"I'd rather read.\" Yuna picks the book over the movie.", variants: ["읽을래요"], subDefs: [{ subTerm: "• -(으)ㄹ래요 (as in 읽을래요)", subDef: "\"I'd rather ~ / I'm going to ~\" — a casual way to say what you want to do." }], examples: [{ kor: "저는 물을 마실래요.", eng: "I'd like to drink water." }] },
            { term: "그럼", mainDef: "then, in that case — short for 그러면.", variants: ["그럼"], examples: [{ kor: "피곤해요? 그럼 집에 가서 쉬세요.", eng: "Tired? Then go home and rest." }] },
            { term: "오늘 배운 단어", mainDef: "the words we learned today.", variants: ["오늘 배운 단어"], subDefs: [{ subTerm: "• 배우다 (as in 배운)", subDef: "to learn. 배운 단어 = \"the words that were learned.\"" }, { subTerm: "• 단어", subDef: "a word." }], examples: [{ kor: "어제 배운 단어를 다시 볼게요.", eng: "I'll look at the words I learned yesterday again." }] },
            { term: "정리해 볼까요?", mainDef: "\"Shall we go over them?\" The standard way this series wraps up its vocabulary.", variants: ["정리해 볼까요"], subDefs: [{ subTerm: "• 정리하다", subDef: "to sum up, to tidy up — here, to go over the words one more time." }, { subTerm: "• -(으)ㄹ까요? (as in 볼까요)", subDef: "\"shall we ~?\" — suggests doing something together." }], examples: [{ kor: "우리 같이 점심을 먹을까요?", eng: "Shall we have lunch together?" }] },
            { term: "<쥬라기 동물원>", mainDef: "<Jurassic Zoo> — the dinosaur movie in the joke at the end. Yuna thought it had no original book, but the novel came out three years before the film.", variants: ["<쥬라기 동물원>"], examples: [{ kor: "어제 <쥬라기 동물원>을 봤어요.", eng: "I watched <Jurassic Zoo> yesterday." }] },
            { term: "원작이 없는 영화라서", mainDef: "\"since it's a movie with no original book behind it…\"", variants: ["원작이 없는 영화라서"], subDefs: [{ subTerm: "• -는 (as in 없는)", subDef: "turns 없다 into a form that describes the next noun (원작이 없는 영화)." }, { subTerm: "• -(이)라서", subDef: "\"because it is ~\" — comes after a noun and gives the reason." }], examples: [{ kor: "주말이라서 사람이 많아요.", eng: "There are a lot of people because it's the weekend." }] },
            { term: "마음 편하게", mainDef: "with an easy mind, without worrying about anything.", variants: ["마음 편하게"], subDefs: [{ subTerm: "• 마음이 편하다", subDef: "to feel at ease inside; to have nothing on your mind." }, { subTerm: "• -게 (as in 편하게)", subDef: "turns a describing word into \"in a ~ way.\"" }], examples: [{ kor: "시험이 끝나서 마음 편하게 잤어요.", eng: "The test was over, so I slept with an easy mind." }] },
            { term: "삼 년", mainDef: "three years.", variants: ["삼 년"], subDefs: [{ subTerm: "• 년", subDef: "year — always used with the Sino-Korean numbers (일, 이, 삼…)." }], examples: [{ kor: "저는 한국어를 삼 년 배웠어요.", eng: "I've studied Korean for three years." }] },
            { term: "헐", mainDef: "\"Whoa / No way.\" A short sound people make when they're surprised. Very casual.", variants: ["헐"], examples: [{ kor: "헐, 진짜예요?", eng: "Whoa, is that for real?" }] },
            { term: "여기까지 할게요", mainDef: "\"That's a wrap for today.\" The standard way to close a show or a class.", variants: ["여기까지 할게요"], subDefs: [{ subTerm: "• 여기까지", subDef: "up to here, this far." }, { subTerm: "• -(으)ㄹ게요 (as in 할게요)", subDef: "\"I'll ~\" — tells the listener what you've decided to do." }], examples: [{ kor: "오늘 수업은 여기까지 할게요.", eng: "That's all for today's class." }] }

        function fcPreloadAround(){ const c=fcCur(); if(c&&c.back&&c.back.img)fcPreloadOne(c.back.img); fcPreloadIdx(fc.pos+1); fcPreloadIdx(fc.pos+2); fcPreloadIdx(fc.pos-1); }
        const FC_ICON = {
            prev:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="square" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>',
            next:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="square" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg>',
            spk:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5L6 9H2v6h4l5 4V5z"/><path stroke-linecap="round" stroke-width="1.8" d="M15.5 8.5a5 5 0 010 7"/></svg>',
            eye:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg>'
        };
        function fcMediaHTML(c){ if(c.media.type==='video'){ const a=c.media.sound?'controls playsinline preload="metadata"':'autoplay muted loop playsinline preload="metadata"'; return '<video class="fc-video" src="'+esc(c.media.src)+'" '+a+'></video>'; } return '<img src="'+esc(c.media.src)+'" alt="'+esc(c.vocab)+'">'; }
        function fcFrontHTML(c){ const total=fc.queue.length||FC_CARDS.length; const pct=((fc.pos+1)/total)*100;
            return '<div class="fc-row"><span class="fc-tag">그림<span class="lk-en"> · Picture</span></span><span class="fc-count">'+(fc.pos+1)+' / '+total+'</span></div>'
            + '<div class="fc-media">'+fcMediaHTML(c)+'</div>'
            + '<p class="fc-cue"><b>이 장면을 한국어 문장으로 말해 보세요.</b><span class="lk-en"><br>Say this scene as a Korean sentence.</span><br>말한 뒤에 카드를 뒤집으세요.<span class="lk-en"><br>Then flip the card.</span></p>'
            + '<div class="fc-prog"><i style="width:'+pct+'%"></i></div>'; }
        function fcBackHTML(c){ const img=(c.back&&c.back.img)?'<img class="fc-bimg" src="'+esc(c.back.img)+'" alt="'+esc(c.vocab)+'">':'';
            return '<div class="fc-row"><span class="fc-tag">정답<span class="lk-en"> · Answer</span></span><span class="fc-vocab">'+esc(c.vocab)+'</span></div>'
            + '<div class="fc-bbody">'+img+'<p class="fc-sentence">'+fcBold(c.ko,c.hl)+'</p><p class="fc-trans" id="fc-trans"></p>'
            + '<div class="fc-bactions"><button type="button" class="fc-bbtn" data-action="fc-audio" aria-label="문장 듣기">'+FC_ICON.spk+' 듣기<span class="lk-en"> · Listen</span></button>'
            + '<button type="button" class="fc-bbtn" data-action="fc-trans" aria-pressed="false">'+FC_ICON.eye+' 번역<span class="lk-en"> · Translation</span></button></div></div>'
            + '<div class="fc-foot">카드 밖 버튼으로 스스로 평가하세요<span class="lk-en"> · Rate yourself below</span></div>'; }
        function fcCardHTML(){ const c=fcCur(); if(!c)return''; return '<div class="fc-card" data-action="fc-flip"><div class="fc-inner'+(fc.flipped?' flip':'')+'" id="fc-inner">'
            + '<div class="fc-face fc-front" id="fc-front">'+fcFrontHTML(c)+'</div><div class="fc-face fc-back" id="fc-back">'+fcBackHTML(c)+'</div></div></div>'; }
        function fcStatsHTML(){ return '<div class="fc-bar"><div class="fc-stats"><span class="k">알아요<span class="lk-en"> · Got it</span> <b id="fc-sk">'+fcCount('known')+'</b></span><span class="u">모르겠어요<span class="lk-en"> · Not yet</span> <b id="fc-su">'+fcCount('unknown')+'</b></span></div>'
            + '<div class="fc-order" role="group"><button type="button" class="fc-obtn'+(fc.shuffled?'':' on')+'" data-action="fc-order" data-sh="0">순서대로<span class="lk-en"> · In order</span></button><button type="button" class="fc-obtn'+(fc.shuffled?' on':'')+'" data-action="fc-order" data-sh="1">섞기<span class="lk-en"> · Shuffle</span></button></div></div>'; }
        function fcSummaryHTML(){ const k=fcCount('known'),u=fcCount('unknown'); return '<div class="fc-sum"><h3>한 바퀴 끝!<span class="lk-en"> · Round complete</span></h3>'
            + '<p class="line">알아요 <b style="color:#047857">'+k+'</b> · 모르겠어요 <b style="color:#b91c1c">'+u+'</b> / 전체 '+FC_CARDS.length+'</p>'
            + '<div class="acts">'+(u?'<button type="button" class="fc-sbtn pri" data-action="fc-again-u">모르는 카드만 다시 ('+u+'장, 섞어서)</button>':'')+'<button type="button" class="fc-sbtn" data-action="fc-again-all">전체 다시 하기 (섞어서)</button></div></div>'; }
        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';
            return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcCardHTML()
            + '<div class="fc-judge"><button type="button" class="fc-jbtn k" data-action="fc-know">알아요<span class="lk-en"> · Got it</span></button><button type="button" class="fc-jbtn u" data-action="fc-dont">모르겠어요<span class="lk-en"> · Not yet</span></button></div>'
            + '<div class="fc-ctrls"><button type="button" class="fc-ibtn" data-action="fc-prev" aria-label="이전 카드">'+FC_ICON.prev+'</button><button type="button" class="fc-fbtn" data-action="fc-flip">뒤집기<span class="lk-en"> · Flip</span></button><button type="button" class="fc-ibtn" data-action="fc-next" aria-label="다음 카드">'+FC_ICON.next+'</button></div>'
            + '<p class="fc-hint"><span class="lk-ko-only"><kbd>Space</kbd> 뒤집기 · <kbd>&larr;</kbd><kbd>&rarr;</kbd> 이전/다음 · <kbd>1</kbd> 알아요 · <kbd>2</kbd> 모르겠어요 · <kbd>S</kbd> 순서/섞기</span><span class="lk-en"><kbd>Space</kbd> Flip · <kbd>&larr;</kbd><kbd>&rarr;</kbd> Prev/Next · <kbd>1</kbd> Got it · <kbd>2</kbd> Not yet · <kbd>S</kbd> Order/Shuffle</span></p>'
            + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }
        function fcApplyFlip(){ const root=viewRoot(); if(!root)return; const el=qs('#fc-inner',root); if(el)el.classList.toggle('flip',fc.flipped); const tr=qs('#fc-trans',root); if(tr)tr.textContent=fc.showTrans?fcCur().en:''; const tb=qs('#fc-back [data-action="fc-trans"]',root); if(tb)tb.classList.toggle('on',fc.showTrans); }
        function fcRefreshStats(){ const root=viewRoot(); if(!root)return; const k=qs('#fc-sk',root),u=qs('#fc-su',root); if(k)k.textContent=fcCount('known'); if(u)u.textContent=fcCount('unknown'); }
        function fcRefreshDeck(){ const d=qs('#fc-deck',viewRoot()); if(d)d.outerHTML=fcDeckHTML(); else paint(); fcPreloadAround(); }
        function fcSetFlip(v){ fc.flipped=v; fcApplyFlip(); if(v)fcPlay(fcCur().audio); else fcStop(); }
        function fcGo(fn){ fcStop(); fc.flipped=false; fc.showTrans=false; fn(); if(fc.done)fcRefreshDeck(); else fcSync(); }
        function fcMark(kind){ fc.status[fc.queue[fc.pos]]=kind; fcRefreshStats(); fcGo(function(){ if(fc.pos+1>=fc.queue.length)fc.done=true; else fc.pos+=1; }); }
        function fcSetOrder(sh){ if(sh===fc.shuffled)return; fc.shuffled=sh; const m=fc.queue.slice(); fc.queue=sh?shuffleArr(m):m.slice().sort(function(a,b){return a-b;}); fcStop(); fc.pos=0; fc.flipped=false; fc.showTrans=false; fcRefreshDeck(); }


        /* ===== 어휘 검색 (a계열: 영어 정의 내장 → 영어 일괄 표시 버튼 없음) ===== */
        const voc = { q:'' };
        function vocFiltered(){ const q=voc.q.toLowerCase().trim(); if(!q) return VOCAB_DATA.map(function(w,i){return {w:w,i:i};});
            return VOCAB_DATA.map(function(w,i){return {w:w,i:i};}).filter(function(o){ const w=o.w;
                return (w.term||'').toLowerCase().indexOf(q)>=0 || (w.mainDef||'').toLowerCase().indexOf(q)>=0
                    || (w.variants||[]).some(function(v){return v.toLowerCase().indexOf(q)>=0;})
                    || (w.subDefs||[]).some(function(sd){return (sd.subTerm||'').toLowerCase().indexOf(q)>=0 || (sd.subDef||'').toLowerCase().indexOf(q)>=0;}); }); }
        function vocGridHTML(){ const list=vocFiltered(); if(!list.length) return '<div class="text-center py-16 text-gray-400 font-serif">검색 결과가 없어요.<span class="lk-en block text-sm mt-1">No results.</span></div>';
            return `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">${list.map(function(o){return vocabItemHTML(o.w,o.i);}).join('')}</div>`; }
        function vocListHTML(){ const ph = secLang() ? '어휘·뜻 검색 / Search vocabulary...' : '어휘·뜻 검색...';
            return `<div class="fc-search print:hidden"><div class="fc-search-box"><input type="text" id="voc-search" value="${esc(voc.q)}" placeholder="${ph}" autocomplete="off"><button type="button" id="voc-clear" data-action="voc-clear" aria-label="지우기" style="${voc.q?'':'display:none'}">\u2715</button></div><span class="fc-search-count">${secLang()?'Results':'검색 결과'}: <strong id="voc-count">${vocFiltered().length}</strong> / ${VOCAB_DATA.length}</span></div><div id="voc-grid">${vocGridHTML()}</div>`; }
        function refreshVocGrid(){ const root=viewRoot(); if(!root)return; const g=qs('#voc-grid',root); if(g)g.innerHTML=vocGridHTML(); const c=qs('#voc-count',root); if(c)c.textContent=vocFiltered().length; const clr=qs('#voc-clear',root); if(clr)clr.style.display=voc.q?'':'none'; }

        function vocabHTML() {
            const hasFC = (typeof FC_CARDS !== 'undefined') && FC_CARDS.length > 0;
            const modeBar = hasFC ? `<div class="fc-modebar print:hidden"><button type="button" data-action="fc-mode" data-mode="list" class="fc-modebtn${fc.mode==='list'?' on':''}">어휘 카드<span class="lk-en"> · Vocab Cards</span></button><button type="button" data-action="fc-mode" data-mode="card" class="fc-modebtn${fc.mode==='card'?' on':''}">플래시 카드<span class="lk-en"> · Flash Cards</span></button></div>` : '';
            const body = (hasFC && fc.mode==='card')
                ? fcDeckHTML()
                : vocListHTML();
            return `<div class="w-full pt-16 px-6 max-w-[1000px] mx-auto pb-20 animate-fade-in"><div class="mb-12 md:mb-20 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">핵심 어휘</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Key Vocabulary</span><div class="w-[1px] h-8 bg-gray-200 mx-auto mt-8"></div></div>${modeBar}${body}</div>`;
        }

        // ---------- QUIZ (객관식) ----------
        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;
        }
        function rerenderQuizQ(qid) { const el = qs(`.quiz-q[data-qid="${qid}"]`, viewRoot()); if (el) el.outerHTML = quizItemHTML(QUIZ_LIST.find(q => String(q.id) === String(qid))); }
        function updateQuizScore() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; }

        // ---------- DISCUSS ----------
        function feedbackSectionHTML(titleKor, titleEng, contentHTML, isCorrection) { return `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">${esc(titleKor)} <span class="font-eng-header font-medium text-[9px]">${esc(titleEng)}</span></h4><p class="${isCorrection ? 'text-[15px] md:text-base font-serif text-gray-900 leading-relaxed font-medium bg-white p-4 border border-gray-200 shadow-sm rounded-sm' : 'text-[13px] md:text-sm font-sans text-gray-700 leading-relaxed whitespace-pre-wrap'}">${contentHTML}</p></div>`; }
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, generating: false, feedback: null, error: '' });
            const vocab = (item.vocab||[]).map(v => `<p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>`).join('');
            let fb = '';
            if (st.error) fb = `<div class="mt-4 p-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-sm animate-fade-in">${esc(st.error)}</div>`;
            else if (st.feedback) {
                const fd = st.feedback;
                const details = (fd.detailed_corrections && fd.detailed_corrections.length) ? `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2">상세 설명 <span class="lk-en font-eng-header font-medium text-[9px]">EXPLANATION</span></h4><div class="space-y-3">${fd.detailed_corrections.map(d => `<div class="bg-white p-4 border border-gray-100 rounded-sm hover:border-gray-200 transition-colors">${(d.original || d.corrected) ? `<div class="flex flex-wrap items-center gap-3 mb-2.5 text-[15px] font-serif">${d.original ? `<span class="text-red-400 line-through decoration-red-300/60">${esc(d.original)}</span>` : ''}${(d.original && d.corrected) ? '<span class="text-gray-300">→</span>' : ''}${d.corrected ? `<span class="text-gray-900 font-bold tracking-wide">${esc(d.corrected)}</span>` : ''}</div>` : ''}<p class="text-[13px] md:text-sm font-sans text-gray-600 leading-relaxed">${renderFormatted(d.explanation)}</p></div>`).join('')}</div></div>` : '';
                fb = `<div class="mt-8 p-6 bg-gray-50 border border-gray-200 rounded-sm animate-fade-in relative"><div class="flex items-center gap-2 mb-6 pb-4 border-b border-gray-200">${svgIcon('sparkles', 'w-5 h-5 text-gray-900', { fill: 'currentColor' })}<span class="text-xs font-bold font-sans text-gray-900 uppercase tracking-widest">${secLang() ? 'AI Teacher Feedback' : 'AI 선생님 피드백'}</span></div><div class="space-y-8">${feedbackSectionHTML('피드백', 'FEEDBACK', renderFormatted(fd.feedback))}${feedbackSectionHTML('모범 답안', 'CORRECTION', esc(fd.correction), true)}${details}</div><div class="mt-8 pt-4 border-t border-gray-200"><p class="text-[10px] text-gray-400 font-sans text-center">※ AI가 생성한 피드백이므로 간혹 부자연스럽거나 오류가 있을 수 있습니다.</p></div></div>`;

            if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return; if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } } else if (e.code === 'ArrowUp') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { if (p.isMuted && p.isMuted()) p.unMute(); p.setVolume(Math.min(100, Math.round(p.getVolume()) + 10)); } } else if (e.code === 'ArrowDown') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { p.setVolume(Math.max(0, Math.round(p.getVolume()) - 10)); } } else if (e.key === ',' || e.key === '.') { e.preventDefault(); const steps = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]; let idx = steps.indexOf(learn.rate); if (idx < 0) idx = 2; idx = Math.min(steps.length - 1, Math.max(0, idx + (e.key === ',' ? -1 : 1))); learn.rate = steps[idx]; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); if (typeof rebuildToolbar === 'function') rebuildToolbar(); } else if (e.key === 'm' || e.key === 'M') { const p = learn.player; if (p && p.isMuted) { if (p.isMuted()) p.unMute(); else p.mute(); } }
        });
        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용. 카드 없으면/터치면 비활성)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.generating) return; st.generating = true; st.error = ''; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id); const lvl = app.userLevel;
            const beginner = ['A1', 'A1+', 'A2', 'A2+', 'B1', 'B1+'].includes(lvl);
            const instr = beginner ? `The student's level is ${lvl}. Write 'feedback' in ENGLISH; 'correction' in natural Korean; 'detailed_corrections' explanations in ENGLISH, wrapping Korean words in **bold**.` : `학생 레벨은 ${lvl}. 모든 필드를 한국어로만 작성. explanation 안 한국어 강조는 **단어** 사용.`;
            const vocabCtx = item.vocab ? (item.vocab||[]).map(v => `- ${v.term}: ${v.def}`).join('\n') : '없음';
            const sys = `당신은 한국어 선생님입니다.\n${instr}\n맞춤법·띄어쓰기·문법 오류를 찾고, 'correction'은 해요체로. JSON만 응답(마크다운 금지): {"feedback":"","correction":"","detailed_corrections":[{"original":"","corrected":"","explanation":""}]}\n[핵심 어휘]\n${vocabCtx}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: `${sys}\n\n질문: "${item.questionKor}"\n학생 답변: "${st.text}"` }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const r = await callGeminiWithBackoff(payload); const txt = r.candidates && r.candidates[0] && r.candidates[0].content.parts[0].text; if (!txt) throw new Error('피드백을 생성하지 못했습니다.'); st.feedback = JSON.parse(txt.replace(/^```(json)?\n?/, '').replace(/\n?```$/, '').trim()); }
            catch (err) { st.error = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.'; }
            finally { st.generating = false; rerenderDiscussItem(id); }
        }

        buildApp();
    })();
    </script>
