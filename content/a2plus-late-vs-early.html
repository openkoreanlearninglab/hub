/* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}

#sl-app .jbtn{flex:1; min-height:52px; padding:.7rem .5rem; background:#fff; border:1px solid var(--g200); font-family:var(--eng); font-size:.85rem; font-weight:500;
         cursor:pointer; color:var(--g600); border-radius:2px; transition:all .2s;}
#sl-app .jbtn .kk{display:block; font-size:10px; color:var(--g400); margin-top:2px;}
#sl-app .jbtn.k:hover{border-color:var(--ok); color:var(--ok); background:#ecfdf5;}
#sl-app .jbtn.u:hover{border-color:var(--no); color:var(--no); background:#fef2f2;}
#sl-app .flipbar{display:flex; flex-direction:column; align-items:center; gap:.75rem; margin-top:1rem;}
#sl-app .sum{text-align:center; padding:2.5rem 1.25rem; border:1px solid var(--g100);}

#sl-app kbd{font-family:var(--mono); font-size:.65rem; background:var(--g50); border:1px solid var(--g200); border-radius:3px; padding:.05rem .3rem; color:var(--g500);}
@media (hover:none){#sl-app .hint{display:none;}}
@media (max-width:1024px){#sl-app .media-box{aspect-ratio:3/4; width:min(100%, calc(60vh * 3 / 4));}
#sl-app .media-box.thumb{width:min(70%, calc(34vh * 3 / 4));}

#sl-app .card{padding:1rem;}}
@media (max-width:520px){#sl-app .modes{grid-template-columns:1fr;}
#sl-app .sent .ko{font-size:1.2rem;}
#sl-app .boxes .bx .i{display:none;}}

#sl-app{ background:#fff; color:#1a1a1a; font-family:var(--sans); -webkit-font-smoothing:antialiased; max-width:40rem; margin:0 auto; text-align:left; }
#sl-app button{ font-family:inherit; }
@media print{ #sl-app{ display:none !important; } }

<body>
    <noscript><div style="max-width:720px;margin:24px auto;padding:16px;border:1px solid #ddd;border-radius:8px;font-family:sans-serif;font-size:14px;color:#374151">이 학습 자료를 보려면 자바스크립트를 켜 주세요.</div></noscript>
    <div id="app"></div>
    <script>
    /* ===== 플래시 카드 엔진 — a2plus-flashcards-late-vs-early.html과 같은 코드(DECK_ID 같음 → 학습 기록 공유) ===== */
'use strict';
window.OKLL_SL = (function () {

  /* =========================================================================
     콘텐츠 — 카드 데이터만 바꾸면 새 덱이 된다
     ========================================================================= */
  /* 템플릿 사용법: DECK_ID·BASE·CARDS와 위 <title>·<h1>·레벨 배지만 바꾸면 새 덱이 된다.
     DECK_ID는 덱마다 달라야 한다(학습 기록 저장 키). 미디어 폴더 구조: images / images-3x4 / videos / videos-9x16 / audio(m4a) */
  var DECK_ID = 'a2plus-late-vs-early';
  var BASE = 'https://github.com/openkoreanlearninglab/hub/raw/refs/heads/main/flashcards/a2plus-flashcards-late-vs-early/';
  var IMG = BASE+'images/', IMG3X4 = BASE+'images-3x4/', VID = BASE+'videos/', VID9X16 = BASE+'videos-9x16/', AUD = BASE+'audio/';
  /* sound:true = 앞면 동영상에 질문 음성이 있어 소리를 켜고 재생(반복 없음). back = 뒤집었을 때 보여 줄 정답 말풍선 이미지(16:9 img / 3:4 img3x4).
     cue = 앞면 안내 문장(없으면 기본 문장). */
  var CARDS = [
    { id:'01_late', verb:"지각하다", ko:"우디는 항상 지각해요.", hl:"지각해요", en:"Woody is always late.", media:{type:'image', src:IMG+'01_late.jpg', src3x4:IMG3X4+'01_late-3x4.jpg'}, audio:AUD+'01_late.m4a' },
    { id:'02_early', verb:"일찍 오다", ko:"저는 항상 약속에 일찍 와요.", hl:"일찍 와요", en:"I always arrive early for appointments.", media:{type:'image', src:IMG+'02_early.jpg', src3x4:IMG3X4+'02_early-3x4.jpg'}, audio:AUD+'02_early.m4a' },
    { id:'03_set_alarm', verb:"알람을 맞추다", ko:"밤에 오전 6시로 알람을 맞췄어요.", hl:"알람을 맞췄어요", en:"At night, I set my alarm for 6 a.m.", media:{type:'image', src:IMG+'03_set_alarm.jpg', src3x4:IMG3X4+'03_set_alarm-3x4.jpg'}, audio:AUD+'03_set_alarm.m4a' },
    { id:'04_alarm_silent', verb:"알람이 울리다", ko:"6시에 알람이 안 울렸어요.", hl:"알람이 안 울렸어요", en:"My alarm didn't go off at 6.", media:{type:'image', src:IMG+'04_alarm_silent.jpg', src3x4:IMG3X4+'04_alarm_silent-3x4.jpg'}, audio:AUD+'04_alarm_silent.m4a' },
    { id:'05_oversleep', verb:"늦잠을 자다", ko:"아침에 늦잠을 잤어요.", hl:"늦잠을 잤어요", en:"I overslept in the morning.", media:{type:'image', src:IMG+'05_oversleep.jpg', src3x4:IMG3X4+'05_oversleep-3x4.jpg'}, audio:AUD+'05_oversleep.m4a' },
    { id:'06_nap', verb:"낮잠을 자다", ko:"소파에서 낮잠을 잤어요.", hl:"낮잠을 잤어요", en:"I took a nap on the sofa.", media:{type:'image', src:IMG+'06_nap.jpg', src3x4:IMG3X4+'06_nap-3x4.jpg'}, audio:AUD+'06_nap.m4a' },
    { id:'07_excuse', verb:"핑계를 대다", ko:"우디는 항상 핑계를 대요.", hl:"핑계를 대요", en:"Woody always makes excuses.", media:{type:'image', src:IMG+'07_excuse.jpg', src3x4:IMG3X4+'07_excuse-3x4.jpg'}, audio:AUD+'07_excuse.m4a' },
    { id:'08_traffic', verb:"차가 막히다", ko:"차가 막혀서 늦었어요.", hl:"차가 막혀서", en:"I was late because of the traffic.", media:{type:'image', src:IMG+'08_traffic.jpg', src3x4:IMG3X4+'08_traffic-3x4.jpg'}, audio:AUD+'08_traffic.m4a' },
    { id:'09_phone_dead', verb:"휴대폰이 꺼지다", ko:"제 휴대폰이 꺼졌어요.", hl:"휴대폰이 꺼졌어요", en:"My phone died.", media:{type:'image', src:IMG+'09_phone_dead.jpg', src3x4:IMG3X4+'09_phone_dead-3x4.jpg'}, audio:AUD+'09_phone_dead.m4a' },
    { id:'10_on_my_way', verb:"가고 있어요", ko:"지금 가고 있어요!", hl:"가고 있어요", en:"I'm on my way now!", media:{type:'video', src:VID+'10_on_my_way.mp4', src9x16:VID9X16+'10_on_my_way-9x16.mp4', sound:true}, back:{img:IMG+'10_on_my_way_back.jpg', img3x4:IMG3X4+'10_on_my_way_back-3x4.jpg'}, cue:"Yuna asks where Woody is. <b>Answer for Woody — out loud.</b>", audio:AUD+'10_on_my_way.m4a' },
    { id:'11_almost_there', verb:"거의 다 왔어요", ko:"거의 다 왔어요!", hl:"거의 다 왔어요", en:"I'm almost there!", media:{type:'video', src:VID+'11_almost_there.mp4', src9x16:VID9X16+'11_almost_there-9x16.mp4', sound:true}, back:{img:IMG+'11_almost_there_back.jpg', img3x4:IMG3X4+'11_almost_there_back-3x4.jpg'}, cue:"Yuna asks where Woody is. <b>Answer for Woody — out loud.</b>", audio:AUD+'11_almost_there.m4a' },
    { id:'12_contact', verb:"연락하다", ko:"늦으면 꼭 연락해요.", hl:"연락해요", en:"If I'm late, I always let them know.", media:{type:'image', src:IMG+'12_contact.jpg', src3x4:IMG3X4+'12_contact-3x4.jpg'}, audio:AUD+'12_contact.m4a' },
    { id:'13_post_photo', verb:"사진을 올리다", ko:"SNS에 샤워하는 사진을 올려요.", hl:"사진을 올려요", en:"I post a photo of myself in the shower on social media.", media:{type:'image', src:IMG+'13_post_photo.jpg', src3x4:IMG3X4+'13_post_photo-3x4.jpg'}, audio:AUD+'13_post_photo.m4a' },
    { id:'14_not_my_fault', verb:"잘못", ko:"그건 제 잘못이 아니에요!", hl:"제 잘못이 아니에요", en:"That's not my fault!", media:{type:'video', src:VID+'14_not_my_fault.mp4', src9x16:VID9X16+'14_not_my_fault-9x16.mp4', sound:true}, back:{img:IMG+'14_not_my_fault_back.jpg', img3x4:IMG3X4+'14_not_my_fault_back-3x4.jpg'}, cue:"Yuna says he is late again. <b>Answer for Woody — out loud.</b>", audio:AUD+'14_not_my_fault.m4a' },
    { id:'15_walk_10min', verb:"걸어서 N분이에요", ko:"집에서 역까지 걸어서 10분이에요.", hl:"걸어서 10분이에요", en:"It's a 10-minute walk from my house to the station.", media:{type:'image', src:IMG+'15_walk_10min.jpg', src3x4:IMG3X4+'15_walk_10min-3x4.jpg'}, audio:AUD+'15_walk_10min.m4a' },
    { id:'16_reserve_ahead', verb:"미리", ko:"미리 식당을 예약해요.", hl:"미리", en:"I book the restaurant in advance.", media:{type:'image', src:IMG+'16_reserve_ahead.jpg', src3x4:IMG3X4+'16_reserve_ahead-3x4.jpg'}, audio:AUD+'16_reserve_ahead.m4a' },
    { id:'17_coffee_bill', verb:"커피값이 나오다", ko:"커피값이 많이 나왔어요.", hl:"커피값이 많이 나왔어요", en:"The coffee bill came to quite a lot.", media:{type:'image', src:IMG+'17_coffee_bill.jpg', src3x4:IMG3X4+'17_coffee_bill-3x4.jpg'}, audio:AUD+'17_coffee_bill.m4a' },
    { id:'18_on_time', verb:"시간을 지키다", ko:"저는 시간을 잘 지켜요.", hl:"시간을 잘 지켜요", en:"I'm good at being on time.", media:{type:'image', src:IMG+'18_on_time.jpg', src3x4:IMG3X4+'18_on_time-3x4.jpg'}, audio:AUD+'18_on_time.m4a' },
    { id:'19_precious', verb:"소중하다", ko:"시간은 소중해요.", hl:"소중해요", en:"Time is precious.", media:{type:'image', src:IMG+'19_precious.jpg', src3x4:IMG3X4+'19_precious-3x4.jpg'}, audio:AUD+'19_precious.m4a' },
    { id:'20_habit', verb:"습관", ko:"늦는 건 제 습관이에요.", hl:"습관", en:"Being late is my habit.", media:{type:'image', src:IMG+'20_habit.jpg', src3x4:IMG3X4+'20_habit-3x4.jpg'}, audio:AUD+'20_habit.m4a' }
  ];

  /* Leitner 상자 4개 — 다음 복습까지 날짜 수 */
  var INTERVALS = [1, 2, 4, 7];
  var BOX_NAMES = ['Daily', 'Every 2 days', 'Every 4 days', 'Weekly'];
  var REQUEUE_GAP = 3;       /* '다시 볼래요' → 몇 장 뒤에 다시 */
  var REQUEUE_MAX = 3;       /* 한 회차에서 같은 카드를 다시 넣는 최대 횟수 */
  var REC_MAX_MS = 7000;     /* 녹음 최대 길이 */
  /* 앞면 'I know this →' 건너뛰기
     'known'  = 한 번이라도 '소리가 같았어요'로 넘긴 카드(상자 2 이상)에만 보인다 — 처음 보는 카드는 꼭 뒤집어 소리를 듣게 한다 (A1 기본)
     'always' = 모든 카드 앞면에 보인다 (처음 보는 카드도 바로 넘길 수 있음)
     'off'    = 보이지 않는다 */
  var SKIP_MODE = 'always';
  var STORE_KEY = 'okll:fc:' + DECK_ID + ':v1';

  /* =========================================================================
     유틸
     ========================================================================= */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function boldTarget(ko, hl){
    var s = esc(ko); if(!hl) return s;
    var h = esc(hl), i = s.lastIndexOf(h);
    return i<0 ? s : s.slice(0,i)+'<span class="hl">'+h+'</span>'+s.slice(i+h.length);
  }
  function shuffle(a){ var n=a.slice(),i,j,t; for(i=n.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=n[i];n[i]=n[j];n[j]=t; } return n; }
  function pad(n){ return (n<10?'0':'')+n; }
  function dayStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function today(){ return dayStr(new Date()); }
  function addDays(n){ var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return dayStr(d); }
  function fmtDay(s){
    if(!s) return '';
    if(s<=today()) return 'today';
    if(s===addDays(1)) return 'tomorrow';
    var p=s.split('-'); var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1];
    return m+' '+(+p[2]);
  }
  function normKo(s){ return String(s||'').replace(/[\s.,!?·~"'“”‘’()\-]/g,''); }

  var ICON = {
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
    spk:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5L6 9H2v6h4l5 4V5z"/><path stroke-linecap="round" stroke-width="1.8" d="M15.5 8.5a5 5 0 010 7"/></svg>',
    slow:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="8.5" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M12 7.5V12l3 2"/></svg>',
    mic:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="9" y="3" width="6" height="11" rx="3" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>',
    check:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };

  /* =========================================================================
     저장 (localStorage — 못 쓰면 조용히 메모리만 사용)
     ========================================================================= */
  function loadStore(){
    try{ var raw = window.localStorage.getItem(STORE_KEY); if(raw){ var o = JSON.parse(raw); if(o && typeof o==='object') return o; } }catch(_){}
    return null;
  }
  function saveStore(){
    try{ window.localStorage.setItem(STORE_KEY, JSON.stringify({ v:1, settings:state.settings, prog:state.prog })); }catch(_){}
  }

  /* =========================================================================
     기능 지원 여부
     ========================================================================= */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var CAN_REC = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  var MOBILE_MQ = window.matchMedia('(max-width:1024px)');
  function isMobile(){ return MOBILE_MQ.matches; }

  /* =========================================================================
     상태 (진실의 원천)
     ========================================================================= */
  var DEFAULT_SETTINGS = { mode:'see', reveal:'tap', shuffle:true, asr:false, introSeen:false };
  var state = {
    view:'intro',            /* intro | home | card | done */
    settings:{}, prog:{ see:{}, hear:{} },
    introDontShow:false, homeMsg:'', homeMsgErr:false,
    sess:null
  };
  (function init(){
    var s = loadStore() || {};
    var st = s.settings || {}, k;
    for(k in DEFAULT_SETTINGS){ state.settings[k] = (k in st) ? st[k] : DEFAULT_SETTINGS[k]; }
    if(!SR) state.settings.asr = false;
    if(s.prog && typeof s.prog==='object'){ state.prog.see = s.prog.see||{}; state.prog.hear = s.prog.hear||{}; }
    state.view = state.settings.introSeen ? 'home' : 'intro';
  })();

  function rec(mode, id){ return state.prog[mode][id] || { b:0, due:null, n:0 }; }
  function isDue(mode, id){ var r = rec(mode,id); return !r.due || r.due <= today(); }
  function dueList(mode){ return CARDS.map(function(c,i){return i;}).filter(function(i){ return isDue(mode, CARDS[i].id); }); }
  function boxCounts(mode){
    var out = { fresh:0, b:[0,0,0,0] };
    CARDS.forEach(function(c){ var r = state.prog[mode][c.id]; if(!r || !r.n) out.fresh++; else out.b[r.b]++; });
    return out;
  }
  function nextDue(mode){
    var min=null; CARDS.forEach(function(c){ var r=state.prog[mode][c.id]; if(r && r.due && r.due>today() && (!min || r.due<min)) min=r.due; });
    return min;
  }

  /* =========================================================================
     오디오 (원어민 문장 음성 1개 + 녹음 재생 1개)
     ========================================================================= */
  var audioEl = new Audio(); audioEl.preload = 'auto';
  var playing = false;
  function playNative(rate, after){
    var c = curCard(); if(!c) return;
    try{
      if(audioEl.getAttribute('src') !== c.audio){ audioEl.setAttribute('src', c.audio); }
      audioEl.playbackRate = rate || 1;
      audioEl.currentTime = 0;
      audioEl.onended = function(){ playing=false; refreshPlayUI(); if(after) after(); else onNativeEnded(); };
      audioEl.onerror = function(){ playing=false; refreshPlayUI(); setStatus('Audio is not ready yet.', 'no'); };
      var p = audioEl.play(); playing = true; refreshPlayUI();
      if(p && p.catch){ p.catch(function(){ playing=false; refreshPlayUI(); }); }
    }catch(_){ playing=false; }
  }
  function stopNative(){ try{ audioEl.pause(); audioEl.onended=null; }catch(_){} playing=false;
    try{ var v = root && root.querySelector('video[data-sound]'); if(v) v.pause(); }catch(_){} }
  function onNativeEnded(){
    var s = state.sess; if(!s || !s.flipped) return;
    if(state.settings.reveal==='auto' && s.step<2){ s.step=2; s.autoShown=true; refreshSentence(); }
  }

  /* ---- 녹음해서 비교 (브라우저 안에서만, 저장·전송 없음) ---- */
  var recorder=null, recStream=null, recChunks=[], recTimer=null, recAudio=null, recUrl=null;
  function stopTracks(){ try{ if(recStream){ recStream.getTracks().forEach(function(t){t.stop();}); } }catch(_){} recStream=null; }
  function cleanupRec(){
    clearTimeout(recTimer); recTimer=null;
    try{ if(recorder && recorder.state!=='inactive') recorder.stop(); }catch(_){}
    recorder=null; stopTracks();
    try{ if(recAudio){ recAudio.pause(); } }catch(_){}
    if(recUrl){ try{ URL.revokeObjectURL(recUrl); }catch(_){} recUrl=null; }
    if(state.sess) state.sess.rec='idle';
  }
  function startRecording(){
    var s = state.sess; if(!s) return;
    stopNative();
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      recStream = stream; recChunks = [];
      try{ recorder = new MediaRecorder(stream); }catch(e){ stopTracks(); setStatus('Recording is not supported in this browser.', 'no'); return; }
      recorder.ondataavailable = function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = function(){
        stopTracks();
        if(!state.sess || state.sess.rec!=='recording'){ return; }
        var blob = new Blob(recChunks, { type: recorder && recorder.mimeType || 'audio/webm' });
        recorder = null;
        playComparison(blob);
      };
      recorder.start();
      s.rec='recording'; refreshTools(); setStatus('Recording… say the sentence, then press Stop.', '');
      recTimer = setTimeout(function(){ stopRecording(); }, REC_MAX_MS);
    }).catch(function(){
      setStatus('Microphone not available. Allow microphone access (works on the website, may be blocked when opened as a local file).', 'no');
    });
  }
  function stopRecording(){ clearTimeout(recTimer); recTimer=null; try{ if(recorder && recorder.state!=='inactive') recorder.stop(); }catch(_){ cleanupRec(); refreshTools(); } }
  function playComparison(blob){
    var s = state.sess; if(!s) return;
    s.rec='playing'; refreshTools(); setStatus('Native speaker → you', '');
    recUrl = URL.createObjectURL(blob);
    playNative(1, function(){
      if(!state.sess || state.sess.rec!=='playing') return;
      recAudio = recAudio || new Audio();
      recAudio.src = recUrl;
      recAudio.onended = function(){ cleanupRec(); refreshTools(); setStatus('Did they sound the same? Your recording has been deleted.', ''); };
      var p = recAudio.play(); if(p && p.catch){ p.catch(function(){ cleanupRec(); refreshTools(); }); }
    });
  }

  /* ---- 발음 확인 (선택, 기본 꺼짐 — Web Speech API) ---- */
  var recog = null;
  function startAsr(){
    var s = state.sess, c = curCard(); if(!s || !c || !SR) return;
    stopNative(); cleanupRec();
    try{ if(recog) recog.abort(); }catch(_){}
    recog = new SR();
    recog.lang = 'ko-KR'; recog.interimResults = false; recog.maxAlternatives = 5; recog.continuous = false;
    var got = false;
    recog.onresult = function(e){
      got = true;
      var alts = [], r = e.results && e.results[0], i;
      if(r){ for(i=0;i<r.length;i++){ alts.push(r[i].transcript); } }
      var full = normKo(c.ko), verb = normKo(c.hl), res = 'try';
      alts.forEach(function(a){ var n = normKo(a); if(n===full) res='match'; else if(res!=='match' && n.indexOf(verb)>=0) res='close'; });
      s.asr = res; refreshTools();
      if(res==='match') setStatus('Match — it was understood as the same sentence.', 'ok');
      else if(res==='close') setStatus('Close — the verb was right. Listen again and compare the rest.', 'ok');
      else setStatus('Not recognized as this sentence. Listen and try again.', 'no');
    };
    recog.onerror = function(e){
      got = true; s.asr='idle'; refreshTools();
      var m = (e && e.error==='not-allowed') ? 'Microphone permission was blocked.'
            : (e && e.error==='no-speech') ? 'No speech heard. Try again.'
            : (e && e.error==='network') ? 'Speech check needs an internet connection.'
            : 'Speech check is not available right now.';
      setStatus(m, 'no');
    };
    recog.onend = function(){ if(!got && state.sess){ state.sess.asr='idle'; refreshTools(); setStatus('No speech heard. Try again.', 'no'); } };
    try{ recog.start(); s.asr='listen'; refreshTools(); setStatus('Listening… say the sentence.', ''); }
    catch(_){ s.asr='idle'; setStatus('Speech check is not available right now.', 'no'); }
  }
  function stopAsr(){ try{ if(recog) recog.abort(); }catch(_){} recog=null; if(state.sess) state.sess.asr='idle'; }

  /* =========================================================================
     회차(세션)
     ========================================================================= */
  function startSession(list){
    var base = list.slice();
    var q = state.settings.shuffle ? shuffle(base) : base.sort(function(a,b){return a-b;});
    state.sess = { mode:state.settings.mode, queue:q, pos:0, flipped:false, step:0, autoShown:false,
                   graded:{}, same:{}, again:{}, requeued:{}, peeks:0, trans:false, transOpens:0, rec:'idle', asr:'idle', total:q.length };
    state.view = q.length ? 'card' : 'home';
    render();
    if(q.length) onCardShown();
  }
  function curCard(){ var s=state.sess; return s ? CARDS[s.queue[s.pos]] : null; }
  function resetCardUI(){ var s=state.sess; stopNative(); cleanupRec(); stopAsr(); s.flipped=false; s.step=0; s.autoShown=false; s.trans=false; }
  function onCardShown(){
    if(!state.sess) return;
    if(state.sess.mode==='hear'){ setTimeout(function(){ playNative(1); }, 250); }
    else { setTimeout(playSoundVideo, 150); }
  }

  function canSkip(){
    var s = state.sess, c = curCard(); if(!s || !c || s.flipped) return false;
    if(SKIP_MODE==='always') return true;
    if(SKIP_MODE==='known') return rec(s.mode, c.id).b >= 1;
    return false;
  }
  function skipCard(){ var s = state.sess; if(!canSkip()) return; s.skipped = (s.skipped||0) + 1; grade('same', true); }
  function grade(kind, skip){
    var s = state.sess, c = curCard(); if(!s || !c || (!s.flipped && !skip)) return;
    var mode = s.mode, r = rec(mode, c.id), idx = s.queue[s.pos];
    if(!s.graded[c.id]){
      r = { b:r.b, due:r.due, n:r.n||0 };
      r.b = kind==='same' ? Math.min(r.b+1, 3) : Math.max(r.b-1, 0);
      r.due = addDays(INTERVALS[r.b]); r.n += 1;
      state.prog[mode][c.id] = r; s.graded[c.id] = true; saveStore();
    }
    if(kind==='same'){ s.same[c.id]=true; delete s.again[c.id]; }
    else{
      s.again[c.id]=true;
      var times = s.requeued[c.id]||0;
      if(times < REQUEUE_MAX){ s.requeued[c.id]=times+1; s.queue.splice(Math.min(s.pos+1+REQUEUE_GAP, s.queue.length), 0, idx); }
    }
    resetCardUI();
    if(s.pos+1 >= s.queue.length){ state.view='done'; render(); return; }
    s.pos += 1; render(); onCardShown();
  }
  function flip(){
    var s = state.sess; if(!s || state.view!=='card') return;
    if(s.flipped) return;
    stopNative(); s.flipped = true; render(); playNative(1);
  }
  function showMeaning(){
    var s = state.sess, c = curCard(); if(!s || !s.flipped || s.step<2 || !c || !c.en || s.trans) return;
    s.trans = true; s.transOpens += 1; refreshSentence();
  }
  function tapSentence(){
    var s = state.sess; if(!s || !s.flipped || s.step>=2) return;
    if(s.step===0){ s.step=1; refreshSentence(); playNative(1); }
    else { s.step=2; s.peeks+=1; refreshSentence(); }
  }

  function mediaHTML(c, thumb, flipped){
    var m = c.media, mob = isMobile(), ph = 'Picture not available yet';

      var fit = (!mob && !c.back.img) ? ' class="contain"' : '';
      return '<div class="media-box'+(thumb?' thumb':'')+'" data-ph="'+esc(ph)+'"><img'+fit+' src="'+esc(bsrc)+'" alt="picture card"></div>';

  var root = null, rootHandlers = [];

  function goHome(){ if(state.sess){ resetCardUI(); } state.sess=null; state.view='home'; state.homeMsg=''; render(); }
  function exportProgress(){
    try{
      var data = JSON.stringify({ deck:DECK_ID, exported:new Date().toISOString(), settings:state.settings, prog:state.prog }, null, 2);
      var blob = new Blob([data], { type:'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = DECK_ID+'-progress-'+today()+'.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      state.homeMsg='Progress file downloaded.'; state.homeMsgErr=false;
    }catch(_){ state.homeMsg='Export failed in this browser.'; state.homeMsgErr=true; }
    render();
  }
  function importProgress(file){
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var o = JSON.parse(fr.result);
        if(!o || o.deck!==DECK_ID || !o.prog) throw new Error('bad');
        state.prog.see = o.prog.see||{}; state.prog.hear = o.prog.hear||{};
        saveStore(); state.homeMsg='Progress imported.'; state.homeMsgErr=false;
      }catch(_){ state.homeMsg='This file is not a progress file for this deck.'; state.homeMsgErr=true; }
      render();
    };
    fr.onerror = function(){ state.homeMsg='Could not read the file.'; state.homeMsgErr=true; render(); };
    fr.readAsText(file);
  }

    'intro-dontshow': function(){ state.introDontShow = !state.introDontShow; render(); },
    'intro-go': function(){ if(state.introDontShow){ state.settings.introSeen = true; saveStore(); } state.view='home'; render(); },
    'show-intro': function(){ state.introDontShow = !!state.settings.introSeen; state.view='intro'; render(); },
    mode: function(el){ state.settings.mode = el.dataset.v; saveStore(); render(); },
    'set-reveal': function(el){ state.settings.reveal = el.dataset.v; saveStore(); render(); },
    'set-shuffle': function(el){ state.settings.shuffle = el.dataset.v==='on'; saveStore(); render(); },
    'set-asr': function(el){ state.settings.asr = el.dataset.v==='on' && !!SR; saveStore(); render(); },
    export: exportProgress,
    import: function(){ var i = root.querySelector('#imp'); if(i){ i.value=''; i.click(); } },
    'start-due': function(){ var l = dueList(state.settings.mode); if(l.length) startSession(l); },
    'start-all': function(){ startSession(CARDS.map(function(c,i){return i;})); },
    'again-round': function(){

      var list = CARDS.map(function(c,i){return i;}).filter(function(i){ return ids.indexOf(CARDS[i].id)>=0; });

      startSession(list); state.sess.graded = graded;   /* 같은 날 같은 카드는 상자를 한 번만 옮긴다 */
    },
    home: goHome,
    flip: flip,
    replay: function(){ cleanupRec(); stopAsr(); playNative(1); },
    slow: function(){ cleanupRec(); stopAsr(); playNative(0.75); },
    sent: tapSentence,
    meaning: showMeaning,
    rec: function(){ stopAsr(); startRecording(); },
    'rec-stop': stopRecording,
    asr: function(){ if(state.sess && state.sess.asr==='listen'){ stopAsr(); refreshTools(); setStatus('',''); } else startAsr(); },
    same: function(){ grade('same'); },
    skip: skipCard,
    again: function(){ grade('again'); }

    var a = t.dataset.act;
    if(ACT[a]) ACT[a](t);
  });
  onRoot('change', function(e){
    if(e.target && e.target.id==='imp' && e.target.files && e.target.files[0]) importProgress(e.target.files[0]);

    }
  });

    if(!root || !root.isConnected) return;
    var ae = document.activeElement;
    if(ae && (['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0 || ae.isContentEditable)) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(state.view!=='card' || !state.sess) return;

    else if(k==='t' || k==='T'){ if(s.flipped) tapSentence(); }
    else if(k==='e' || k==='E'){ showMeaning(); }
    else if(k==='m' || k==='M'){ if(s.flipped && CAN_REC){ if(s.rec==='recording') stopRecording(); else if(s.rec==='idle') ACT.rec(); } }
    else if(k==='1'){ if(s.flipped) grade('same'); else skipCard(); }
    else if(k==='2'){ if(s.flipped) grade('again'); }
  });

  function onBreakpoint(){ if(!root || !root.isConnected) return; if(state.view==='card'){ render(); if(state.sess && !state.sess.flipped && state.sess.mode==='see') playSoundVideo(); } }
  if(MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change', onBreakpoint);
  else if(MOBILE_MQ.addListener) MOBILE_MQ.addListener(onBreakpoint);

  /* 수업자료 안에서: 어휘 탭이 다시 그려질 때마다 새 컨테이너에 붙인다 */
  function mount(el){
    if(!el) return;
    if(root === el) return;
    unmount();
    root = el;
    rootHandlers.forEach(function(h){ el.addEventListener(h[0], h[1], h[2]); });
    render();
    if(state.view==='card' && state.sess && !state.sess.flipped && state.sess.mode==='see') playSoundVideo();
  }
  function unmount(){
    try{ stopNative(); cleanupRec(); stopAsr(); }catch(_){}
    if(root){ rootHandlers.forEach(function(h){ root.removeEventListener(h[0], h[1], h[2]); }); }
    root = null;
  }
  return { mount: mount, unmount: unmount };
})();

const str = (v) => (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
const arr = (v) => (Array.isArray(v) ? v : []);
// 허용 강조(**단어**)만 <b>로, 나머지 마크다운 기호는 제거
const richText = (s) => esc(str(s).replace(/`/g, '').replace(/^#+\s*/gm, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*/g, '');
const numMark = (n) => (n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`);

/* =====================================================================
   5. 응답 정리 (어느 모델이든 같은 모양으로)
   ===================================================================== */
function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

const aiState = { provider: 'gemini', apiKey: '', model: AI_PROVIDERS.gemini.models[0], other: false, customModel: '', settingsOpen: false };

const AI_STORE_KEY = 'okll:discuss:v1:' + location.pathname;
function aiLoadStore() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(AI_STORE_KEY) || 'null'); } catch (e) { data = null; }
  DISCUSS_DATA.forEach(d => {
    const st = discussState[d.id] || (discussState[d.id] = newDiscussSt());
    const s = data && data[d.id]; if (!s || typeof s !== 'object') return;
    st.text = typeof s.text === 'string' ? s.text : '';
    if (s.feedback) {
      try { st.feedback = normalizeFeedback(s.feedback, s.feedback.mode, s.feedbackFor); st.feedbackFor = typeof s.feedbackFor === 'string' ? s.feedbackFor : ''; }
      catch (e) { st.feedback = null; st.feedbackFor = ''; }
    }
  });
}
let aiSaveTimer = null;
function aiSaveStore() {
  clearTimeout(aiSaveTimer);
  aiSaveTimer = setTimeout(() => {
    const data = {};
    Object.keys(discussState).forEach(id => {
      const st = discussState[id];
      if (st.text || st.feedback) data[id] = { text: st.text, feedback: st.feedback, feedbackFor: st.feedbackFor, savedAt: Date.now() };
    });
    try { if (Object.keys(data).length) localStorage.setItem(AI_STORE_KEY, JSON.stringify(data)); else localStorage.removeItem(AI_STORE_KEY); }
    catch (e) { /* 저장 불가(시크릿 모드 등): 메모리로만 동작 */ }
  }, 300);
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const model = curModel(); if (!model) throw AppError('model');
  const q = P.request(model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}
// 본문: 읽기 자료(READING_DATA)와 영상 대본(VIDEOS[].script) 중 있는 것을 모두 씀
const articleText = () => [
  typeof READING_DATA !== 'undefined' ? READING_DATA.map(r => (r.content || []).map(p => p.text || '').filter(Boolean).join('\n')).join('\n\n') : '',
  typeof VIDEOS !== 'undefined' ? VIDEOS.map(v => (v.script || []).map(l => l.kor || '').filter(Boolean).join('\n')).join('\n\n') : ''
].filter(Boolean).join('\n\n');

// ---------- 생각해 보기: AI 첨삭 ----------
async function runDiscussFeedback(id) {
  const st = discussState[id]; const d = DISCUSS_DATA.find(x => x.id === id);
  if (!st || !d || st.loading || !st.text.trim()) return;
  if (!aiState.apiKey) { st.keyPanel = true; rerenderDiscussItem(id); return; }
  st.keyPanel = false; st.loading = true; st.error = null; rerenderDiscussItem(id);
  const level = app.userLevel, text = st.text;
  const question = [d.questionKor].concat((d.sub || []).map((q, i) => `${d.id}-${i + 1}. ${q}`)).join('\n');
  const questionEn = modeOf(level) === 'C' ? '' : [d.questionEng].concat(d.subEn || []).filter(Boolean).join('\n');
  const vocab = (d.vocab || []).map(v => ({ term: v.term, def: v.def || v.defEng || '' }));
  try {
    st.feedback = await callAIJSON(buildSystemPrompt(level), buildUserMessage({ level, article: articleText(), vocab, question, questionEn, learnerText: text }), (o) => normalizeFeedback(o, modeOf(level), text, articleText() + '\n' + vocab.map(v => v.term).join('\n')));
    st.feedbackFor = text; aiSaveStore();
  } catch (e) { st.error = e.code ? e : AppError('format'); }
  finally { st.loading = false; rerenderDiscussItem(id); }
}

function markedTextHTML(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {

        function fcBackHTML(c){ const img=(c.back&&c.back.img)?'<img class="fc-bimg" src="'+esc(c.back.img)+'" alt="'+esc(c.vocab)+'">':'';
            return '<div class="fc-row"><span class="fc-tag">정답<span class="lk-en"> · Answer</span></span><span class="fc-vocab">'+esc(c.vocab)+'</span></div>'

            + '<div class="fc-bactions"><button type="button" class="fc-bbtn" data-action="fc-audio" aria-label="문장 듣기">'+FC_ICON.spk+' 듣기<span class="lk-en"> · Listen</span></button>'

        function fcCardHTML(){ const c=fcCur(); if(!c)return''; return '<div class="fc-card" data-action="fc-flip"><div class="fc-inner'+(fc.flipped?' flip':'')+'" id="fc-inner">'
            + '<div class="fc-face fc-front" id="fc-front">'+fcFrontHTML(c)+'</div><div class="fc-face fc-back" id="fc-back">'+fcBackHTML(c)+'</div></div></div>'; }
        function fcStatsHTML(){ return '<div class="fc-bar"><div class="fc-stats"><span class="k">알아요<span class="lk-en"> · Got it</span> <b id="fc-sk">'+fcCount('known')+'</b></span><span class="u">모르겠어요<span class="lk-en"> · Not yet</span> <b id="fc-su">'+fcCount('unknown')+'</b></span></div>'
            + '<div class="fc-order" role="group"><button type="button" class="fc-obtn'+(fc.shuffled?'':' on')+'" data-action="fc-order" data-sh="0">순서대로<span class="lk-en"> · In order</span></button><button type="button" class="fc-obtn'+(fc.shuffled?' on':'')+'" data-action="fc-order" data-sh="1">섞기<span class="lk-en"> · Shuffle</span></button></div></div>'; }
        function fcSummaryHTML(){ const k=fcCount('known'),u=fcCount('unknown'); return '<div class="fc-sum"><h3>한 바퀴 끝!<span class="lk-en"> · Round complete</span></h3>'

            + '<div class="acts">'+(u?'<button type="button" class="fc-sbtn pri" data-action="fc-again-u">모르는 카드만 다시 ('+u+'장, 섞어서)</button>':'')+'<button type="button" class="fc-sbtn" data-action="fc-again-all">전체 다시 하기 (섞어서)</button></div></div>'; }
        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';
            return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcCardHTML()
            + '<div class="fc-judge"><button type="button" class="fc-jbtn k" data-action="fc-know">알아요<span class="lk-en"> · Got it</span></button><button type="button" class="fc-jbtn u" data-action="fc-dont">모르겠어요<span class="lk-en"> · Not yet</span></button></div>'

            + '<p class="fc-hint"><span class="lk-ko-only"><kbd>Space</kbd> 뒤집기 · <kbd>&larr;</kbd><kbd>&rarr;</kbd> 이전/다음 · <kbd>1</kbd> 알아요 · <kbd>2</kbd> 모르겠어요 · <kbd>S</kbd> 순서/섞기</span><span class="lk-en"><kbd>Space</kbd> Flip · <kbd>&larr;</kbd><kbd>&rarr;</kbd> Prev/Next · <kbd>1</kbd> Got it · <kbd>2</kbd> Not yet · <kbd>S</kbd> Order/Shuffle</span></p>'
            + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }
        function fcApplyFlip(){ const root=viewRoot(); if(!root)return; const el=qs('#fc-inner',root); if(el)el.classList.toggle('flip',fc.flipped); const tr=qs('#fc-trans',root); if(tr)tr.textContent=fc.showTrans?fcCur().en:''; const tb=qs('#fc-back [data-action="fc-trans"]',root); if(tb)tb.classList.toggle('on',fc.showTrans); }
        function fcRefreshStats(){ const root=viewRoot(); if(!root)return; const k=qs('#fc-sk',root),u=qs('#fc-su',root); if(k)k.textContent=fcCount('known'); if(u)u.textContent=fcCount('unknown'); }
        function fcRefreshDeck(){ const d=qs('#fc-deck',viewRoot()); if(d)d.outerHTML=fcDeckHTML(); else paint(); fcPreloadAround(); }
        function fcSetFlip(v){ fc.flipped=v; fcApplyFlip(); if(v)fcPlay(fcCur().audio); else fcStop(); }
        function fcGo(fn){ fcStop(); fc.flipped=false; fc.showTrans=false; fn(); if(fc.done)fcRefreshDeck(); else fcSync(); }
        function fcMark(kind){ fc.status[fc.queue[fc.pos]]=kind; fcRefreshStats(); fcGo(function(){ if(fc.pos+1>=fc.queue.length)fc.done=true; else fc.pos+=1; }); }
        function fcSetOrder(sh){ if(sh===fc.shuffled)return; fc.shuffled=sh; const m=fc.queue.slice(); fc.queue=sh?shuffleArr(m):m.slice().sort(function(a,b){return a-b;}); fcStop(); fc.pos=0; fc.flipped=false; fc.showTrans=false; fcRefreshDeck(); }


        /* ===== 어휘 검색 (a계열: 영어 정의 내장 → 영어 일괄 표시 버튼 없음) ===== */
        const voc = { q:'' };
        function vocFiltered(){ const q=voc.q.toLowerCase().trim(); const base=VOCAB_DATA.map(function(w,i){return {w:w,i:i};}).filter(function(o){ return !vocCore.only || o.w.core; }); if(!q) return base;
            return base.filter(function(o){ const w=o.w;
                return (w.term||'').toLowerCase().indexOf(q)>=0 || (w.mainDef||'').toLowerCase().indexOf(q)>=0
                    || (w.variants||[]).some(function(v){return v.toLowerCase().indexOf(q)>=0;})
                    || (w.subDefs||[]).some(function(sd){return (sd.subTerm||'').toLowerCase().indexOf(q)>=0 || (sd.subDef||'').toLowerCase().indexOf(q)>=0;}); }); }
        function vocGridHTML(){ const list=vocFiltered(); if(!list.length) return '<div class="text-center py-16 text-gray-400 font-serif">검색 결과가 없어요.<span class="lk-en block text-sm mt-1">No results.</span></div>';
            return `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">${list.map(function(o){return vocabItemHTML(o.w,o.i);}).join('')}</div>`; }
        function vocListHTML(){ const ph = secLang() ? '어휘·뜻 검색 / Search vocabulary...' : '어휘·뜻 검색...';
            return `<div class="fc-search print:hidden">${HAS_CORE() ? `<div class="core-seg flex border border-gray-200 bg-white" role="group" aria-label="${uiT(`보기 범위`, `View`)}"><button type="button" data-action="vocab-core-all" aria-pressed="${!vocCore.only}" title="${uiT(`모든 어휘·표현을 봅니다`, `Show all vocab and expressions`)}">${uiT(`전체`, `All`)}</button><button type="button" data-action="vocab-core-only" aria-pressed="${vocCore.only}" title="${uiT(`이 자료에서 꼭 알아야 할 어휘만 봅니다`, `Show only the must-know words for this material`)}">${uiT(`핵심`, `Key`)}</button></div>` : ''}<div class="fc-search-box"><input type="text" id="voc-search" value="${esc(voc.q)}" placeholder="${ph}" autocomplete="off"><button type="button" id="voc-clear" data-action="voc-clear" aria-label="지우기" style="${voc.q?'':'display:none'}">\u2715</button></div><span class="fc-search-count">${vocCore.only ? uiT('핵심', 'Key') : (secLang()?'Results':'검색 결과')}: <strong id="voc-count">${vocFiltered().length}</strong> / ${VOCAB_DATA.length}</span></div><div id="voc-grid">${vocGridHTML()}</div>`; }
        function refreshVocGrid(){ const root=viewRoot(); if(!root)return; const g=qs('#voc-grid',root); if(g)g.innerHTML=vocGridHTML(); const c=qs('#voc-count',root); if(c)c.textContent=vocFiltered().length; const clr=qs('#voc-clear',root); if(clr)clr.style.display=voc.q?'':'none'; }

                : vocListHTML();
            return `<div class="w-full pt-16 px-6 max-w-[1000px] mx-auto pb-20 animate-fade-in"><div class="mb-12 md:mb-20 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">어휘·표현</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Vocab &amp; Expressions</span><div class="w-[1px] h-8 bg-gray-200 mx-auto mt-8"></div></div>${modeBar}${body}</div>`;

        // ---------- QUIZ (객관식) ----------
        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);

            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            const hasVideos = (typeof VIDEOS !== 'undefined' && VIDEOS.length && VIDEOS[0].script && VIDEOS[0].script.length);
            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);

            if (pwVocabData().length) s.push(['vocab', '어휘·표현']);

            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;

        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return; if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } } else if (e.code === 'ArrowUp') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { if (p.isMuted && p.isMuted()) p.unMute(); p.setVolume(Math.min(100, Math.round(p.getVolume()) + 10)); } } else if (e.code === 'ArrowDown') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { p.setVolume(Math.max(0, Math.round(p.getVolume()) - 10)); } } else if (e.key === ',' || e.key === '.') { e.preventDefault(); const steps = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]; let idx = steps.indexOf(learn.rate); if (idx < 0) idx = 2; idx = Math.min(steps.length - 1, Math.max(0, idx + (e.key === ',' ? -1 : 1))); learn.rate = steps[idx]; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); if (typeof rebuildToolbar === 'function') rebuildToolbar(); } else if (e.key === 's' || e.key === 'S') { const order = ['listen', 'words', 'full']; setCap(order[(order.indexOf(learn.cap) + 1) % 3]); }
            else if (e.key === 'm' || e.key === 'M') { const p = learn.player; if (p && p.isMuted) { if (p.isMuted()) p.unMute(); else p.mute(); } }
        });
        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용. 카드 없으면/터치면 비활성)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done || !FC_CARDS.length) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });


        vocCore.only = HAS_CORE() && loadCore();
        aiLoadStore();
        buildApp();
    })();
    </script>
