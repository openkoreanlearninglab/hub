    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

    <script>
    (function () {

        /* 폰트 CSS 비차단 적용: head에서 media=print로 받아 둔 스타일을 여기서 활성화 */

        /* =====================================================================
           </> TEMPLATE — VIDEO · 빈칸형(fill-in-blank quiz)  (배포용 아님)
           순수 바닐라 JS 동영상 학습자료 베이스 (b2plus 계열).
           교체: curVideo().videoId, curVideo().script, VOCAB_DATA,
                 ANSWER_CHOICES, QUIZ_LIST(빈칸형), DISCUSS_DATA, userLevel,
                 홈 [대괄호] 문구, Gemini share id(REPLACE_SHARE_ID).
           ===================================================================== */

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };

        // 동영상 목록 — 항목을 추가하면 Part 선택 버튼이 자동 표시됩니다 (1개면 버튼 없음)
        // REPLACE: title/subTitle/videoId를 실제 값으로. script는 각 동영상의 대본 배열
        // provider: 'youtube'(기본값, 생략 가능) | 'instagram' | 'embed'(범용 임베드)
        //  - 인스타그램: igReel(릴 shortcode, instagram.com/reel/<igReel>/)과 thumb(홈 썸네일 URL, 지정 권장)를 설정. script[].time은 [0,0]으로
        //  - 범용 embed: embedUrl(임베드 전용 URL 전체, 예: https://player.vimeo.com/video/123)을 설정. 세로 영상이면 aspect:'9/16'. thumb 지정 권장, script[].time은 [0,0]
        //  - 재생제어·배속·시크바·시간동기(줄 하이라이트)는 유튜브만 지원. 인스타/embed는 정적 임베드
        //  - thumb(선택): 모든 provider에서 홈 썸네일을 명시 지정 가능. 미지정 시 유튜브는 img.youtube.com 자동, 인스타는 그라데이션 폴백
        // 예: { title:'Part 1', subTitle:'', provider:'instagram', igReel:'DQ4UIBHEqwE', thumb:'https://raw.githubusercontent.com/.../thumbnails/xxx.jpeg', script:[...] }
        const VIDEOS = [
            { title: 'Part 1', subTitle: '', videoId: 'FO4CT9YcJ70', script: [
                { id: "s1", speaker: "소탐대실", kor: "왜 우리는 멀쩡한 소파를 놔두고 굳이 바닥에 앉는 걸까요?", time: [0.0, 4.34], eng: "Why do we go out of our way to sit on the floor when there's a perfectly good sofa right there?" },
                { id: "s2", speaker: "소탐대실", kor: "우리가 소파를 아예 안 쓰는 건 아닙니다.", time: [6.2, 8.72], eng: "It's not that we don't use the sofa at all." },
                { id: "s3", speaker: "소탐대실", kor: "잘 쓰다가도 바닥에 내려갈 때가 있는 거죠.", time: [8.75, 11.55], eng: "We use it just fine — and then, at some point, down we go to the floor." },
                { id: "s4", speaker: "소탐대실", kor: "주로 언제 그러는지 곰곰이 생각해 봤는데,", time: [11.58, 13.96], eng: "We thought hard about when exactly that happens," },
                { id: "s5", speaker: "소탐대실", kor: "이 소파 테이블을 사용할 때 그런 것 같더라고요.", time: [13.99, 16.65], eng: "and it seems to be when we're using the coffee table." },
                { id: "s6", speaker: "소탐대실", kor: "예를 들어 테이블 위에 밥을 차려놓고 먹을 때,", time: [16.69, 19.27], eng: "Say you've laid out a meal on the table and you sit down to eat." },
                { id: "s7", speaker: "소탐대실", kor: "소파에 앉으면 높이가 안 맞으니까", time: [19.3, 21.41], eng: "Sit on the sofa and the heights don't line up," },
                { id: "s8", speaker: "소탐대실", kor: "자연스레 바닥에 앉게 되는 겁니다.", time: [21.45, 23.37], eng: "so you naturally end up on the floor." },
                { id: "s9", speaker: "소탐대실", kor: "소파를 앉으라고 만들어놨더니, 등받이로 쓰고 있는 우리.", time: [23.4, 26.82], eng: "Sofas were built to sit on — and here we are, using them as backrests." },
                { id: "s10", speaker: "소탐대실", kor: "가구 회사에서는 이걸 보고 무슨 생각을 할까요?", time: [26.85, 29.86], eng: "What must the furniture companies make of this?" },
                { id: "s11", speaker: "박지혜 팀장", kor: "이제 소파에 앉아서 사용하는 테이블 높이는 330부터 350까지는 실은 좌탁으로 사용하셔도 크게 문제없는 정도의 높이로 보고 있어요.", time: [29.9, 39.81], eng: "These days we see table heights of 330 to 350 as a range that honestly works fine as a floor table too." },
                { id: "s12", speaker: "박지혜 팀장", kor: "그래서 입식과 좌식을 겸용할 수 있는 상품으로 저희는 개발을 하고 있습니다.", time: [39.84, 44.84], eng: "So we're developing products that work both ways — chair-style and floor-style." },
                { id: "s13", speaker: "소탐대실", kor: "가구 회사는 이 현실을 덤덤하게 받아들이고 있었습니다.", time: [44.87, 48.25], eng: "The furniture company was taking this reality entirely in stride." },
                { id: "s14", speaker: "소탐대실", kor: "오히려 바닥과 소파 두 곳에서 모두 편하게 쓸 수 있도록", time: [48.29, 51.8], eng: "If anything, they were designing so you'd be comfortable both on the floor and on the sofa," },
                { id: "s15", speaker: "소탐대실", kor: "소파 테이블 높이를 맞춰서 판매하고 있었죠.", time: [51.83, 54.12], eng: "matching the coffee table height and selling it that way." },
                { id: "s16", speaker: "소탐대실", kor: "근데 테이블 때문에 바닥에 앉는 거라면", time: [54.16, 57.11], eng: "But if the table is what sends us to the floor," },
                { id: "s17", speaker: "소탐대실", kor: "그냥 테이블 높이를 확 올려버리면 안 될까요?", time: [57.14, 60.17], eng: "why not just crank the table height way up?" },
                { id: "s18", speaker: "소탐대실", kor: "그럼 테이블을 쓰려고 바닥에 내려가는 일도 없을 테니까요.", time: [60.2, 63.56], eng: "Then nobody would have to get down on the floor to use it." },
                { id: "s19", speaker: "소탐대실", kor: "실제로 이렇게 소파 앞에 높은 테이블을 배치하는 경우도 있습니다.", time: [63.6, 67.65], eng: "And in fact, some people do put a tall table in front of the sofa." },
                { id: "s20", speaker: "소탐대실", kor: "그런데 이 배치에는 치명적인 단점이 있죠.", time: [67.69, 70.53], eng: "But that arrangement has one fatal drawback." },
                { id: "s21", speaker: "소탐대실", kor: "소파에 누웠을 때 TV가 보이지 않는다는 겁니다.", time: [70.56, 74.08], eng: "You can't see the TV when you're lying on the sofa." },
                { id: "s22", speaker: "박지혜 팀장", kor: "한국은 실은 소비자들이 해외와 달리", time: [74.12, 76.8], eng: "In Korea, unlike overseas, consumers" },
                { id: "s23", speaker: "박지혜 팀장", kor: "소파를 앉는 의자 형태로 쓰시는 게 아니라", time: [76.83, 80.23], eng: "don't really use the sofa as a chair to sit in." },
                { id: "s24", speaker: "박지혜 팀장", kor: "누워서 많이 사용을 하세요.", time: [80.27, 82.09], eng: "They spend a lot of time lying on it." },
                { id: "s25", speaker: "박지혜 팀장", kor: "식사 하시고 누워서 티비를 볼 때 뭐 휴식하실 수도 있고.", time: [82.12, 86.13], eng: "After a meal, lying down to watch TV, or just resting." },
                { id: "s26", speaker: "소탐대실", kor: "그래서 낮은 테이블을 두는 게 여러모로 나을 수 있는 겁니다.", time: [86.16, 89.5], eng: "So keeping the table low turns out to be the better call in a lot of ways —" },
                { id: "s27", speaker: "소탐대실", kor: "중간중간 바닥에 앉더라도 말이죠.", time: [89.54, 91.4], eng: "even if it means going down to the floor now and then." },
                { id: "s28", speaker: "소탐대실", kor: "그런데 여기서 또 하나의 의문점이 듭니다.", time: [91.43, 93.95], eng: "But that raises another question." },
                { id: "s29", speaker: "소탐대실", kor: "왜 우리는 굳이 소파 테이블에서 무언가를 하려는 걸까요?", time: [93.98, 97.65], eng: "Why do we insist on doing things at the coffee table?" },

            { term: "실은", mainDef: "겉으로 보이는 것과 다른 속사정을 꺼낼 때 앞에 붙이는 말.", variants: ["실은"], subDefs: [{ subTerm: "• 실은 ← 사실(事實)은", subDef: "사(事, 일) + 실(實, 참). '사실은'에서 앞 글자가 떨어져 나간 형태예요. 뜻은 같지만 말할 때 더 자주 써요." }], examples: [{ kor: "괜찮다고 했지만 실은 많이 서운했어요.", eng: "I said it was fine, but truthfully I was pretty hurt." }], translations: { en: { term: "actually / the truth is", mainDef: "A lead-in used when revealing what lies behind appearances.", subDefs: [{ term: "실은 ← 사실 (事實) 은", def: "사 (事, matter) + 실 (實, true). A clipped form of 사실은 — same meaning, more common in speech." }] } } },
            { term: "좌탁", mainDef: "바닥에 앉은 채로 쓸 수 있게 만든, 다리가 낮은 가구.", variants: ["좌탁"], subDefs: [{ subTerm: "• 좌탁(座卓)", subDef: "좌(座, 앉다) + 탁(卓, 탁자). 글자 그대로 '앉아서 쓰는 탁자'예요." }], examples: [{ kor: "거실에 좌탁을 놓고 바닥에서 밥을 먹어요.", eng: "We put a low table in the living room and eat on the floor." }], translations: { en: { term: "low floor table", mainDef: "A low-legged piece of furniture designed for use while seated on the floor.", subDefs: [{ term: "좌탁 (座卓)", def: "좌 (座, to sit) + 탁 (卓, table) — literally 'a table for sitting.'" }] } } },
            { term: "입식", mainDef: "의자, 침대, 식탁을 놓고 서거나 걸터앉아서 생활하는 방식.", variants: ["입식"], subDefs: [{ subTerm: "• 입식(立式)", subDef: "입(立, 서다) + 식(式, 방식). 서서 움직이는 것을 기본으로 삼는 생활 방식이에요." }], examples: [{ kor: "요즘 지어지는 집은 대부분 입식 구조예요.", eng: "Most homes built these days have a chair-based layout." }], translations: { en: { term: "chair-style living", mainDef: "A way of living built around chairs, beds and dining tables — standing or perching rather than sitting on the floor.", subDefs: [{ term: "입식 (立式)", def: "입 (立, to stand) + 식 (式, style)." }] } } },
            { term: "좌식", mainDef: "바닥에 앉아서 생활하는 방식.", variants: ["좌식"], subDefs: [{ subTerm: "• 좌식(坐式)", subDef: "좌(坐, 앉다) + 식(式, 방식). '입식(立式)'과 짝을 이루는 말이에요." }], examples: [{ kor: "할머니 댁은 아직 좌식이라 방석을 깔고 앉아요.", eng: "Grandma's house is still floor-style, so we sit on cushions." }], translations: { en: { term: "floor-style living", mainDef: "A way of living seated on the floor.", subDefs: [{ term: "좌식 (坐式)", def: "좌 (坐, to sit) + 식 (式, style). The counterpart of 입식 (立式)." }] } } },
            { term: "겸용하다", mainDef: "하나를 두 가지 목적으로 함께 쓰다.", variants: ["겸용할", "겸용하다"], subDefs: [{ subTerm: "• 겸용(兼用)", subDef: "겸(兼, 아우르다) + 용(用, 쓰다). 두 가지 쓰임을 하나에 아울러 담는다는 뜻이에요." }], examples: [{ kor: "이 소파는 침대로도 겸용할 수 있어요.", eng: "This sofa can double as a bed." }], translations: { en: { term: "to serve two purposes / to double as", mainDef: "To use one thing for two different purposes.", subDefs: [{ term: "겸용 (兼用)", def: "겸 (兼, to combine) + 용 (用, to use)." }] } } },
            { term: "덤덤하게 받아들이다", mainDef: "놀라거나 불만을 드러내지 않고 조용히 그대로 인정하다.", variants: ["덤덤하게 받아들이고", "덤덤하게 받아들이다"], subDefs: [{ subTerm: "• 덤덤하다", subDef: "감정을 겉으로 드러내지 않고 차분한 상태를 말하는 순우리말이에요." }], examples: [{ kor: "그는 나쁜 소식을 덤덤하게 받아들였어요.", eng: "He took the bad news in stride." }], translations: { en: { term: "to take something in stride", mainDef: "To accept something quietly, without surprise or complaint.", subDefs: [{ term: "덤덤하다", def: "A native Korean word for being emotionally flat or unruffled." }] } } },
            { term: "높이를 맞추다", mainDef: "두 물건의 높낮이를 서로 어울리게 조절하다.", variants: ["높이를 맞춰서", "높이를 맞추다"], examples: [{ kor: "책장 높이를 맞춰서 나란히 놓았어요.", eng: "I matched the shelf heights and lined them up." }], translations: { en: { term: "to match the height", mainDef: "To adjust two things so their heights line up." } } },
            { term: "확 올려버리다", mainDef: "망설이지 않고 단번에 아주 높이 올리다.", variants: ["확 올려버리면", "확 올려버리다"], subDefs: [{ subTerm: "• 확", subDef: "갑자기, 단번에, 크고 세게 움직이는 모양을 나타내는 말이에요. 예) 확 바뀌다, 확 던지다." }, { subTerm: "• -아/어 버리다", subDef: "어떤 일을 끝까지 마쳤다는 뜻을 더해요. 후련함이나 아쉬움 같은 감정이 함께 담겨요. 예) 다 먹었어요 → 다 먹어 버렸어요." }], examples: [{ kor: "고민하지 말고 그냥 확 정해 버리세요.", eng: "Stop agonizing and just decide already." }], translations: { en: { term: "to just crank it way up", mainDef: "To raise something very high in one decisive go, without hesitating.", subDefs: [{ term: "확", def: "An adverb for a sudden, sweeping motion. e.g. 확 바뀌다 (change drastically)." }, { term: "-아/어 버리다", def: "Adds the sense that an action was carried through to the end, often with relief or regret. e.g. 다 먹었어요 → 다 먹어 버렸어요." }] } } },
            { term: "없을 테니까요", mainDef: "그런 일이 생기지 않을 것이 분명하다는 뜻이에요. 앞에서 말한 제안이 왜 좋은지 근거를 댈 때 써요.", variants: ["없을 테니까요"], subDefs: [{ subTerm: "• -ㄹ/을 테니까", subDef: "말하는 사람이 꽤 확신하는 짐작을 근거로 내놓을 때 쓰는 문법이에요. '-을 것이다 + -니까'가 합쳐진 형태로 보면 돼요. 예) 곧 도착할 테니까 조금만 기다리세요, 배고플 테니까 먼저 드세요." }], examples: [{ kor: "지금 가면 자리가 있을 테니까 서둘러요.", eng: "There should still be seats if we go now, so let's hurry." }], translations: { en: { term: "since there won't be any", mainDef: "States that something surely won't happen, offered as the reason the preceding suggestion makes sense.", subDefs: [{ term: "-ㄹ/을 테니까", def: "Presents a confident guess as grounds for what follows — roughly -을 것이다 plus -니까. e.g. 곧 도착할 테니까 조금만 기다리세요." }] } } },
            { term: "배치하다", mainDef: "물건이나 사람을 알맞은 자리에 나누어 놓다.", variants: ["배치하는", "배치하다"], subDefs: [{ subTerm: "• 배치(配置)", subDef: "배(配, 나누다) + 치(置, 두다). 자리를 나누어 둔다는 뜻이에요." }], examples: [{ kor: "책상을 창가에 배치했어요.", eng: "I placed the desk by the window." }], translations: { en: { term: "to place / arrange", mainDef: "To put things or people in their proper positions.", subDefs: [{ term: "배치 (配置)", def: "배 (配, to distribute) + 치 (置, to place)." }] } } },
            { term: "배치", mainDef: "물건이나 사람을 나누어 놓은 자리의 모양.", variants: ["배치"], examples: [{ kor: "가구 배치만 바꿔도 방이 넓어 보여요.", eng: "Just changing the furniture layout makes the room look bigger." }], translations: { en: { term: "layout / arrangement", mainDef: "The resulting pattern of how things or people are positioned." } } },
            { term: "치명적이다", mainDef: "그것 하나 때문에 전체를 못 쓰게 될 만큼 문제가 아주 심각하다.", variants: ["치명적인", "치명적이다"], subDefs: [{ subTerm: "• 치명적(致命的)", subDef: "치(致, 이르다) + 명(命, 목숨). 원래 '목숨이 위험할 만큼'이라는 뜻인데, 지금은 '아주 심각한'이라는 뜻으로 훨씬 자주 써요." }], examples: [{ kor: "가격은 싸지만 배터리가 약한 게 치명적이에요.", eng: "It's cheap, but the weak battery is a dealbreaker." }], translations: { en: { term: "to be fatal / crippling", mainDef: "For a flaw to be so serious that it ruins the whole thing.", subDefs: [{ term: "치명적 (致命的)", def: "치 (致, to reach) + 명 (命, life) — originally 'life-threatening,' now usually just 'devastating.'" }] } } },
            { term: "여러모로", mainDef: "여러 가지 면에서.", variants: ["여러모로"], examples: [{ kor: "이 방법이 여러모로 편해요.", eng: "This method is easier in a lot of ways." }], translations: { en: { term: "in many respects", mainDef: "From several different angles or points of view." } } },
            { term: "바닥에 앉더라도", mainDef: "바닥에 앉는 일이 생겨도 상관없이.", variants: ["바닥에 앉더라도"], subDefs: [{ subTerm: "• -더라도", subDef: "앞의 일을 인정하면서도 뒤의 결론은 바뀌지 않는다는 뜻을 만들어요. '-아도/어도'보다 가정하는 느낌이 강해요. 예) 비가 오더라도 갈 거예요, 힘들더라도 참으세요." }], examples: [{ kor: "시간이 없더라도 아침은 꼭 드세요.", eng: "Even if you're short on time, be sure to eat breakfast." }], translations: { en: { term: "even if (you) sit on the floor", mainDef: "Granting that it happens, the conclusion still stands.", subDefs: [{ term: "-더라도", def: "'Even if / even supposing.' More hypothetical in feel than -아도/어도. e.g. 비가 오더라도 갈 거예요." }] } } },
            { term: "의문점이 들다", mainDef: "궁금하거나 이상하다고 느끼는 부분이 생기다.", variants: ["의문점이 듭니다", "의문점이 들다"], subDefs: [{ subTerm: "• 의문점(疑問點)", subDef: "의(疑, 의심하다) + 문(問, 묻다) + 점(點, 점). 의심스러워서 묻고 싶은 부분이에요." }], examples: [{ kor: "설명을 듣고도 의문점이 남았어요.", eng: "Even after the explanation, I still had questions." }], translations: { en: { term: "for a question to arise", mainDef: "For something puzzling or doubtful to come to mind.", subDefs: [{ term: "의문점 (疑問點)", def: "의 (疑, to doubt) + 문 (問, to ask) + 점 (點, point)." }] } } },
            { term: "변천사", mainDef: "시간이 지나면서 어떻게 바뀌어 왔는지의 역사.", variants: ["변천사"], subDefs: [{ subTerm: "• 변천사(變遷史)", subDef: "변(變, 바뀌다) + 천(遷, 옮기다) + 사(史, 역사)." }], examples: [{ kor: "한국 아파트의 변천사를 다룬 다큐멘터리를 봤어요.", eng: "I watched a documentary on how Korean apartments have changed over time." }], translations: { en: { term: "history of changes / evolution", mainDef: "The record of how something has shifted over time.", subDefs: [{ term: "변천사 (變遷史)", def: "변 (變, to change) + 천 (遷, to shift) + 사 (史, history)." }] } } },
            { term: "-에 진심이다", mainDef: "어떤 것을 아주 좋아해서 대충 하지 않고 깊이 파고든다는 뜻의 요즘 말이에요.", variants: ["TV에 진심인지"], subDefs: [{ subTerm: "• 진심(眞心) — 신조어 용법", subDef: "진(眞, 참) + 심(心, 마음). 원래는 '거짓 없는 마음'이라는 명사인데, 요즘 '~에 진심이다' 꼴로 쓰면 '그 일을 정말 좋아하고 열심히 한다'는 뜻이 돼요." }], examples: [{ kor: "우리 아빠는 등산에 진심이에요.", eng: "My dad is dead serious about hiking." }], translations: { en: { term: "to be seriously into (something)", mainDef: "Recent slang: to be genuinely devoted to something rather than casual about it.", subDefs: [{ term: "진심 (眞心) — slang usage", def: "진 (眞, true) + 심 (心, heart). The noun means 'sincerity,' but ~에 진심이다 now means 'all in on it.'" }] } } },
            { term: "연구하다", mainDef: "어떤 것을 깊이 조사하고 따져서 새로운 사실을 밝히다.", variants: ["연구한", "연구하다"], subDefs: [{ subTerm: "• 연구(硏究)", subDef: "연(硏, 갈다) + 구(究, 파고들다). 두 글자 모두 '깊이 파고든다'는 뜻이에요." }], examples: [{ kor: "그 교수는 30년째 곤충을 연구하고 있어요.", eng: "That professor has been studying insects for thirty years." }], translations: { en: { term: "to research / study", mainDef: "To investigate something deeply and bring new facts to light.", subDefs: [{ term: "연구 (硏究)", def: "연 (硏, to grind) + 구 (究, to dig into) — both characters mean probing deeply." }] } } },
            { term: "논문", mainDef: "어떤 주제를 연구한 결과를 근거와 함께 정리해 쓴 글.", variants: ["논문"], subDefs: [{ subTerm: "• 논문(論文)", subDef: "논(論, 따지다) + 문(文, 글). 따져서 밝힌 내용을 담은 글이라는 뜻이에요." }], examples: [{ kor: "졸업하려면 논문을 써야 해요.", eng: "You have to write a thesis to graduate." }], translations: { en: { term: "academic paper / thesis", mainDef: "A written piece laying out research findings together with their evidence.", subDefs: [{ term: "논문 (論文)", def: "논 (論, to argue) + 문 (文, writing)." }] } } },
            { term: "디귿(ㄷ)자형", mainDef: "위에서 봤을 때 한글 자음 'ㄷ' 모양을 이루는 형태. 소파 세 개가 서로 마주 보게 놓인 배치예요.", variants: ["디귿(ㄷ)자형"], subDefs: [{ subTerm: "• -자형(字型)", subDef: "자(字, 글자) + 형(型, 모양). 글자 모양을 닮았다는 뜻을 만들어요. 한국어는 이렇게 한글 자음이나 한자의 생김새를 빌려 형태를 나타내요. 예) 십(十)자형, 티(T)자형." }], examples: [{ kor: "이 아파트는 방이 디귿자형으로 배치돼 있어요.", eng: "In this apartment the rooms are laid out in a U shape." }], translations: { en: { term: "ㄷ-shaped (U-shaped) layout", mainDef: "A layout resembling the Korean letter ㄷ seen from above — three sofas facing inward.", subDefs: [{ term: "-자형 (字型)", def: "자 (字, letter) + 형 (型, shape) — 'shaped like the letter X.' Korean borrows the shapes of Hangul or Chinese characters where English uses U-, L-, T-shaped." }] } } },
            { term: "병렬식", mainDef: "여러 개를 나란히 줄지어 늘어놓는 방식.", variants: ["병렬식으로", "병렬식"], subDefs: [{ subTerm: "• 병렬(竝列)", subDef: "병(竝, 나란히) + 렬(列, 줄)." }], examples: [{ kor: "책상을 병렬식으로 놓으니까 공간이 넓어 보여요.", eng: "Lining the desks up side by side makes the room look bigger." }], translations: { en: { term: "parallel arrangement", mainDef: "Setting several things side by side in a row.", subDefs: [{ term: "병렬 (竝列)", def: "병 (竝, side by side) + 렬 (列, row)." }] } } },
            { term: "구조상", mainDef: "구조를 놓고 볼 때.", variants: ["구조상"], subDefs: [{ subTerm: "• -상(上)", subDef: "상(上, 위). 명사 뒤에 붙어 '그 측면에서 보면'이라는 뜻을 만들어요. 예) 사실상, 관계상, 규정상, 성격상." }], examples: [{ kor: "규정상 여기서는 사진을 찍을 수 없어요.", eng: "Under the rules, you can't take photos here." }], translations: { en: { term: "structurally / given the layout", mainDef: "Judging from the standpoint of structure.", subDefs: [{ term: "-상 (上)", def: "상 (上, upon). Attaches to nouns to mean 'in terms of.' e.g. 사실상 (in effect), 규정상 (under the rules)." }] } } },
            { term: "손님 접대", mainDef: "찾아온 손님을 맞이하고 정성껏 대하는 일.", variants: ["손님 접대"], subDefs: [{ subTerm: "• 접대(接待)", subDef: "접(接, 맞이하다) + 대(待, 대하다)." }], examples: [{ kor: "명절에는 손님 접대로 하루가 다 가요.", eng: "On holidays the whole day goes to entertaining guests." }], translations: { en: { term: "receiving/entertaining guests", mainDef: "Welcoming visitors and looking after them attentively.", subDefs: [{ term: "접대 (接待)", def: "접 (接, to receive) + 대 (待, to treat)." }] } } },
            { term: "이뤄지다", mainDef: "어떤 일이 실제로 일어나다. '이루어지다'의 줄임말이에요.", variants: ["이뤄졌을", "이뤄지다"], examples: [{ kor: "회의는 온라인으로 이뤄졌어요.", eng: "The meeting took place online." }], translations: { en: { term: "to take place / be carried out", mainDef: "For something to actually happen. A contracted form of 이루어지다." } } },
            { term: "것으로 보이죠", mainDef: "'아마 그럴 것 같다'를 격식 있게 말하는 표현이에요. 뉴스나 보고서에서 근거를 바탕으로 조심스럽게 짐작할 때 써요.", variants: ["것으로 보이죠"], subDefs: [{ subTerm: "• -ㄹ/을 것으로 보이다", subDef: "말하는 사람의 짐작을 객관적인 관찰처럼 표현하는 문어체예요. '-을 것 같다'의 격식 있는 버전이라고 생각하면 돼요. 예) 비가 올 것으로 보입니다, 수출이 늘어날 것으로 보입니다." }], examples: [{ kor: "물가는 당분간 오를 것으로 보입니다.", eng: "Prices are expected to keep rising for the time being." }], translations: { en: { term: "appears to have been / is expected to", mainDef: "A formal way to hedge a guess grounded in evidence — standard in news and reports.", subDefs: [{ term: "-ㄹ/을 것으로 보이다", def: "The written-register counterpart of -을 것 같다. e.g. 비가 올 것으로 보입니다." }] } } },
            { term: "보급률", mainDef: "어떤 물건이 사람들에게 얼마나 널리 퍼져 있는지를 나타내는 비율.", variants: ["보급률"], subDefs: [{ subTerm: "• 보급(普及)", subDef: "보(普, 널리) + 급(及, 미치다). 널리 퍼뜨려 많은 사람이 쓰게 하는 거예요." }, { subTerm: "• -률/율(率)", subDef: "율(率, 비율). 명사 뒤에 붙어 비율을 나타내요. 예) 합격률, 출산율, 실업률." }], examples: [{ kor: "스마트폰 보급률이 90%를 넘었어요.", eng: "Smartphone penetration has passed 90%." }], translations: { en: { term: "penetration rate / rate of adoption", mainDef: "The percentage showing how widely something has spread among people.", subDefs: [{ term: "보급 (普及)", def: "보 (普, widely) + 급 (及, to reach) — to spread into general use." }, { term: "-률/율 (率)", def: "율 (率, rate). Forms a rate when attached to a noun. e.g. 합격률 (pass rate)." }] } } },
            { term: "기역(ㄱ)자형", mainDef: "위에서 봤을 때 한글 자음 'ㄱ' 모양으로 꺾인 형태. 소파 두 개가 직각으로 만나는 배치예요.", variants: ["기역(ㄱ)자형"], examples: [{ kor: "우리 집 주방은 기역자형이에요.", eng: "Our kitchen is L-shaped." }], translations: { en: { term: "ㄱ-shaped (L-shaped) layout", mainDef: "A layout bent like the Korean letter ㄱ — two sofas meeting at a right angle." } } },
            { term: "일자형", mainDef: "한 줄로 곧게 늘어놓은 형태.", variants: ["일자형"], subDefs: [{ subTerm: "• 일자(一字)", subDef: "일(一, 하나) + 자(字, 글자). 한자 '一'이 가로로 곧은 선이라서, 곧게 뻗은 모양을 뜻하게 됐어요." }], examples: [{ kor: "좁은 부엌은 보통 일자형으로 만들어요.", eng: "Narrow kitchens are usually built in a single line." }], translations: { en: { term: "straight-line layout", mainDef: "A layout set out in one straight row.", subDefs: [{ term: "일자 (一字)", def: "일 (一, one) + 자 (字, character). The character 一 is a single horizontal stroke, hence 'straight.'" }] } } },
            { term: "절반 이상을 차지하다", mainDef: "전체의 반이 넘는 비율을 이루다.", variants: ["절반 이상을 차지하게", "절반 이상을 차지하다"], subDefs: [{ subTerm: "• 차지하다", subDef: "어떤 자리나 비율을 갖다. 순우리말이에요. 예) 1위를 차지하다, 30%를 차지하다." }], examples: [{ kor: "20대가 전체 회원의 절반 이상을 차지해요.", eng: "People in their twenties make up more than half the members." }], translations: { en: { term: "to account for more than half", mainDef: "To make up over 50% of the total.", subDefs: [{ term: "차지하다", def: "A native Korean verb: to occupy or account for. e.g. 1위를 차지하다 (take first place)." }] } } },
            { term: "마주 보다", mainDef: "서로 얼굴이나 앞면을 향하고 있다.", variants: ["마주 보는", "마주 보다"], examples: [{ kor: "우리는 마주 보고 앉아서 이야기했어요.", eng: "We sat facing each other and talked." }], translations: { en: { term: "to face each other", mainDef: "To be turned toward one another." } } },
            { term: "국룰", mainDef: "'국민 룰'을 줄인 요즘 말이에요. 법으로 정해진 건 아니지만 다들 당연하게 지키는 방식을 뜻해요.", variants: ["국룰"], subDefs: [{ subTerm: "• 국룰 = 국민(國民) + 룰(rule)", subDef: "국(國, 나라) + 민(民, 백성) + 영어 rule. 젊은 사람들이 인터넷에서 많이 쓰는 줄임말이에요." }], examples: [{ kor: "치킨에는 콜라가 국룰이죠.", eng: "Chicken with cola — that's just how it's done." }], translations: { en: { term: "the unwritten national rule / just how everyone does it", mainDef: "Internet slang shortening 국민 룰 ('the people's rule') — an unofficial norm everyone follows as a matter of course.", subDefs: [{ term: "국룰 = 국민 (國民) + rule", def: "국 (國, nation) + 민 (民, people) + English 'rule.' Popular online slang among younger Koreans." }] } } },
            { term: "맞은편", mainDef: "마주 보고 있는 반대쪽.", variants: ["맞은편"], examples: [{ kor: "은행은 우체국 맞은편에 있어요.", eng: "The bank is across from the post office." }], translations: { en: { term: "the opposite side", mainDef: "The side directly across from where you are." } } },
            { term: "내려가기에 충분한", mainDef: "내려갈 만한 이유가 되기에 모자람이 없는.", variants: ["내려가기에 충분한"], subDefs: [{ subTerm: "• -기에", subDef: "'그렇게 하는 데에는', '그렇게 할 만한 이유로는'이라는 뜻을 만드는 문어체 문법이에요. '-기에 충분하다', '-기에 좋다', '-기에 이르다' 꼴로 자주 써요. 예) 혼자 살기에 좋은 집, 놀라기에 충분한 소식." }], examples: [{ kor: "그 정도면 사람들을 설득하기에 충분해요.", eng: "That much is enough to win people over." }], translations: { en: { term: "enough to send (you) down", mainDef: "Sufficient as a reason to go down.", subDefs: [{ term: "-기에", def: "A written-register pattern meaning 'for the purpose of / as grounds for doing.' Common in -기에 충분하다, -기에 좋다. e.g. 혼자 살기에 좋은 집." }] } } },
            { term: "주거", mainDef: "사람이 집에서 살아가는 일, 또는 사는 곳.", variants: ["주거문화", "주거 생활", "주거"], subDefs: [{ subTerm: "• 주거(住居)", subDef: "주(住, 살다) + 거(居, 머물다). 두 글자 모두 '산다'는 뜻이라, 합치면 '사는 일, 사는 곳'이 돼요." }], examples: [{ kor: "1인 가구가 늘면서 주거 형태도 바뀌고 있어요.", eng: "As single-person households grow, housing forms are changing too." }], translations: { en: { term: "dwelling / housing", mainDef: "The act of living in a home, or the place where one lives.", subDefs: [{ term: "주거 (住居)", def: "주 (住, to live) + 거 (居, to dwell). Both characters mean 'to reside.'" }] } } },
            { term: "영위하다", mainDef: "어떤 생활이나 활동을 계속 이어 나가다. 글이나 격식 있는 말에서 주로 써요.", variants: ["영위해 왔습니다", "영위하다"], subDefs: [{ subTerm: "• 영위(營爲)", subDef: "영(營, 꾸리다) + 위(爲, 하다). 삶을 꾸려 나간다는 뜻으로, 주로 '생활을 영위하다' 꼴로 써요." }], examples: [{ kor: "그는 은퇴 후 조용한 생활을 영위하고 있어요.", eng: "Since retiring, he's been leading a quiet life." }], translations: { en: { term: "to lead / carry on (a way of life)", mainDef: "To sustain a way of living or an activity over time. Formal, mostly written.", subDefs: [{ term: "영위 (營爲)", def: "영 (營, to run/manage) + 위 (爲, to do). Almost always in 생활을 영위하다." }] } } },
            { term: "한옥", mainDef: "한국의 전통 방식으로 지은 집.", variants: ["한옥"], subDefs: [{ subTerm: "• 한옥(韓屋)", subDef: "한(韓, 한국) + 옥(屋, 집). 서양식 집을 뜻하는 '양옥(洋屋)'과 짝을 이루는 말이에요." }], examples: [{ kor: "전주에서 한옥에 하룻밤 묵었어요.", eng: "I spent a night in a hanok in Jeonju." }], translations: { en: { term: "hanok (traditional Korean house)", mainDef: "A house built in the traditional Korean style.", subDefs: [{ term: "한옥 (韓屋)", def: "한 (韓, Korea) + 옥 (屋, house). Its counterpart is 양옥 (洋屋), a Western-style house." }] } } },
            { term: "최소화하다", mainDef: "가장 적은 수준으로 줄이다.", variants: ["최소화하고", "최소화하다"], subDefs: [{ subTerm: "• 최소화(最小化)", subDef: "최(最, 가장) + 소(小, 작다) + 화(化, 되다). 반대말은 '최대화(最大化)'예요." }], examples: [{ kor: "짐을 최소화해서 배낭 하나만 들고 갔어요.", eng: "I kept my luggage to a minimum and took just one backpack." }], translations: { en: { term: "to minimize", mainDef: "To cut something down to the smallest possible amount.", subDefs: [{ term: "최소화 (最小化)", def: "최 (最, most) + 소 (小, small) + 화 (化, -ize). Opposite: 최대화 (to maximize)." }] } } },
            { term: "면적", mainDef: "넓이. 바닥이나 땅이 차지하는 크기예요.", variants: ["면적"], subDefs: [{ subTerm: "• 면적(面積)", subDef: "면(面, 표면) + 적(積, 쌓다/넓이). 표면의 크기라는 뜻이에요." }], examples: [{ kor: "이 집은 면적은 좁지만 구조가 좋아요.", eng: "This place is small in area but well laid out." }], translations: { en: { term: "floor area", mainDef: "The size of a surface or piece of ground.", subDefs: [{ term: "면적 (面積)", def: "면 (面, surface) + 적 (積, area)." }] } } },
            { term: "용도", mainDef: "무엇에 쓰이는지, 그 쓰임.", variants: ["용도"], subDefs: [{ subTerm: "• 용도(用途)", subDef: "용(用, 쓰다) + 도(途, 길). 쓰이는 길, 즉 쓰임새라는 뜻이에요." }], examples: [{ kor: "이 방은 용도가 정해져 있지 않아요.", eng: "This room doesn't have a set purpose." }], translations: { en: { term: "use / purpose", mainDef: "What something is used for.", subDefs: [{ term: "용도 (用途)", def: "용 (用, to use) + 도 (途, way) — the way something gets used." }] } } },
            { term: "응접실", mainDef: "손님을 맞아 이야기를 나누는 방. 요즘은 잘 안 쓰고 '거실'이라고 해요.", variants: ["응접실"], subDefs: [{ subTerm: "• 응접실(應接室)", subDef: "응(應, 응하다) + 접(接, 맞이하다) + 실(室, 방). 예전 집에서 많이 쓰던 말이에요." }], examples: [{ kor: "옛날 집에는 응접실이 따로 있었어요.", eng: "Old houses used to have a separate parlor." }], translations: { en: { term: "parlor / drawing room", mainDef: "A room for receiving guests. A dated word — modern Korean says 거실.", subDefs: [{ term: "응접실 (應接室)", def: "응 (應, to respond) + 접 (接, to receive) + 실 (室, room)." }] } } },
            { term: "다용도", mainDef: "쓰임새가 여러 가지인 것.", variants: ["다용도"], subDefs: [{ subTerm: "• 다용도(多用途)", subDef: "다(多, 많다) + 용도(用途, 쓰임). 쓰임새가 많다는 뜻이에요. 예) 다용도실, 다용도 칼." }], examples: [{ kor: "이 상자는 다용도로 쓸 수 있어요.", eng: "This box can be used for all sorts of things." }], translations: { en: { term: "multipurpose", mainDef: "Having many different uses.", subDefs: [{ term: "다용도 (多用途)", def: "다 (多, many) + 용도 (用途, use). e.g. 다용도실 (utility room)." }] } } },
            { term: "생활 양식", mainDef: "사람들이 살아가는 방식.", variants: ["생활 양식"], subDefs: [{ subTerm: "• 양식(樣式)", subDef: "양(樣, 모양) + 식(式, 방식). 정해진 모양이나 방식이라는 뜻이에요. 예) 건축 양식, 사고 양식." }], examples: [{ kor: "도시와 시골은 생활 양식이 많이 달라요.", eng: "City and country life follow very different patterns." }], translations: { en: { term: "lifestyle / way of living", mainDef: "The pattern by which people live.", subDefs: [{ term: "양식 (樣式)", def: "양 (樣, form) + 식 (式, style). e.g. 건축 양식 (architectural style)." }] } } },
            { term: "관습이 되다", mainDef: "오랫동안 되풀이되어 사회에 굳어진 습관으로 자리 잡다.", variants: ["관습이 되어서", "관습이 되다"], subDefs: [{ subTerm: "• 관습(慣習)", subDef: "관(慣, 익숙하다) + 습(習, 익히다). 두 글자 모두 '익숙해지다'는 뜻이라, 합치면 '사회에 굳어진 습관'이 돼요." }], examples: [{ kor: "설날에 세배하는 것은 오래된 관습이에요.", eng: "Bowing to elders on New Year's is a long-standing custom." }], translations: { en: { term: "to become a custom", mainDef: "For a repeated practice to settle into a social custom.", subDefs: [{ term: "관습 (慣習)", def: "관 (慣, to be accustomed) + 습 (習, to practice)." }] } } },
            { term: "놓고서도", mainDef: "그것을 두고 있으면서도. 앞의 일을 다 해 놓고 그와 어울리지 않는 행동을 한다는 뜻이에요.", variants: ["놓고서도"], subDefs: [{ subTerm: "• -고서도", subDef: "앞의 행동을 마쳤음을 강조하면서, 뒤에 그와 맞지 않는 일이 온다는 뜻을 만들어요. '-고도'보다 앞 동작이 끝났다는 느낌이 강해요. 예) 알고서도 모른 척했어요, 먹고서도 배고프대요." }], examples: [{ kor: "약속을 하고서도 안 나타났어요.", eng: "He made the promise and still didn't show up." }], translations: { en: { term: "even after putting (one) there", mainDef: "'Having done X and yet…' — a completed action followed by something inconsistent with it.", subDefs: [{ term: "-고서도", def: "'Even after having done X.' Stresses completion more than plain -고도. e.g. 알고서도 모른 척했어요." }] } } },
            { term: "행태", mainDef: "겉으로 드러나는 행동의 모습. 학술적인 글에서 사람들의 행동 양상을 가리킬 때 써요.", variants: ["행태"], subDefs: [{ subTerm: "• 행태(行態)", subDef: "행(行, 행하다) + 태(態, 모습). 일상 대화에서는 나쁜 행동을 비판할 때도 쓰지만, 여기서는 학술 용어로 중립적인 뜻이에요." }], examples: [{ kor: "소비 행태가 세대마다 달라요.", eng: "Consumption patterns differ from generation to generation." }], translations: { en: { term: "behavior pattern", mainDef: "The observable shape of how people act. Academic register here; in casual speech it often turns critical.", subDefs: [{ term: "행태 (行態)", def: "행 (行, to act) + 태 (態, form). Neutral in academic use, often pejorative in everyday speech." }] } } },
            { term: "한정되다", mainDef: "일정한 범위나 양으로 제한되다.", variants: ["한정된", "한정되다"], subDefs: [{ subTerm: "• 한정(限定)", subDef: "한(限, 한계) + 정(定, 정하다). 예) 한정판, 기간 한정." }], examples: [{ kor: "예산이 한정되어 있어서 다 살 수는 없어요.", eng: "The budget is limited, so we can't buy everything." }], translations: { en: { term: "to be limited / finite", mainDef: "To be restricted to a set range or amount.", subDefs: [{ term: "한정 (限定)", def: "한 (限, limit) + 정 (定, to set). e.g. 한정판 (limited edition)." }] } } },
            { term: "유리하다", mainDef: "다른 것보다 조건이 좋아서 이익이 되다. 반대말은 '불리하다'예요.", variants: ["유리합니다", "유리하다"], subDefs: [{ subTerm: "• 유리(有利)", subDef: "유(有, 있다) + 리(利, 이롭다). '이로움이 있다'는 뜻이에요." }], examples: [{ kor: "일찍 신청하는 게 유리해요.", eng: "Applying early works in your favor." }], translations: { en: { term: "to be advantageous", mainDef: "To be in a better position or have the edge. Opposite: 불리하다.", subDefs: [{ term: "유리 (有利)", def: "유 (有, to have) + 리 (利, benefit)." }] } } },
            { term: "그때그때", mainDef: "그 상황이 생길 때마다 바로바로.", variants: ["그때그때"], examples: [{ kor: "메모를 그때그때 해 두면 잊어버리지 않아요.", eng: "If you jot things down as they come up, you won't forget." }], translations: { en: { term: "as the occasion arises / on the fly", mainDef: "Each time a situation comes up, right then and there." } } },
            { term: "수월하다", mainDef: "힘들지 않고 쉽다. 순우리말이에요.", variants: ["수월합니다", "수월하다"], examples: [{ kor: "설명서를 보니까 조립이 수월했어요.", eng: "With the manual, assembly went smoothly." }], translations: { en: { term: "to be easy / go smoothly", mainDef: "To take little effort. A native Korean word." } } },
            { term: "상을 펴다", mainDef: "접어 두었던 낮은 밥상의 다리를 세워 자리에 놓다. 한국의 좌식 생활에서 나온 표현이에요.", variants: ["상을 펴면", "상을 펴다"], subDefs: [{ subTerm: "• 상(床)", subDef: "상(床, 평상). 바닥에 놓고 쓰는 낮은 밥상이에요. 다리를 접었다 세웠다 할 수 있어서 '펴다', '치우다'와 짝을 이뤄요." }], examples: [{ kor: "손님이 오셔서 큰 상을 폈어요.", eng: "Guests came, so we set out the big low table." }], translations: { en: { term: "to set up the low table", mainDef: "To unfold a folding floor table's legs and put it in place. Straight out of Korean floor-sitting life.", subDefs: [{ term: "상 (床)", def: "상 (床, low table). Its legs fold, hence the pairing with 펴다 (unfold) and 치우다 (clear away)." }] } } },

        /* ===== Flash Card 모듈 (어휘 탭) — 20개 큐레이션 카드 + 미디어 ===== */

        const FC_IMG = FC_BASE+'images/', FC_VID = FC_BASE+'videos/', FC_AUD = FC_BASE+'audio/';
        const FC_CARDS = [
            /* ▣ 여기에 카드를 채우면 어휘 탭에 '플래시 카드' 토글이 자동으로 나타납니다.

               필드: vocab(어휘), ko(한국어문장), hl(강조부분), en(영어),

        function fcStop(){ try{ if(fcAudio)fcAudio.pause(); }catch(_){} }
        function fcBold(ko,hl){ let s=esc(ko); if(!hl)return s; const h=esc(hl),i=s.indexOf(h); if(i<0)return s; return s.slice(0,i)+'<strong class="hl">'+h+'</strong>'+s.slice(i+h.length); }
        function fcStart(list){ const base=(list&&list.length?list:FC_CARDS.map(function(_,i){return i;})).slice(); fc.queue=fc.shuffled?shuffleArr(base):base; fc.pos=0; fc.flipped=false; fc.showTrans=false; fc.done=false; fc.status={}; }
        function fcCur(){ return FC_CARDS[fc.queue[fc.pos]]; }

        function fcUnknown(){ return Object.keys(fc.status).filter(function(x){return fc.status[x]==='unknown';}).map(Number); }
        /* 이미지 프리로드: 다음·이전 카드 이미지를 미리 받아 전환 시 검정 화면 제거 */
        const fcPre = {};

        function fcPreloadIdx(qp){ if(qp<0||qp>=fc.queue.length)return; const c=FC_CARDS[fc.queue[qp]]; if(!c)return; if(c.media&&c.media.type==='image')fcPreloadOne(c.media.src); if(c.back&&c.back.img)fcPreloadOne(c.back.img); }

        const FC_ICON = {

        function fcMediaHTML(c){ if(c.media.type==='video'){ const a=c.media.sound?'controls playsinline preload="metadata"':'autoplay muted loop playsinline preload="metadata"'; return '<video class="fc-video" src="'+esc(c.media.src)+'" '+a+'></video>'; } return '<img src="'+esc(c.media.src)+'" alt="'+esc(c.vocab)+'">'; }
        function fcFrontHTML(c){ const total=fc.queue.length||FC_CARDS.length; const pct=((fc.pos+1)/total)*100;

        function fcCardHTML(){ const c=fcCur(); if(!c)return''; return '<div class="fc-card" data-action="fc-flip"><div class="fc-inner'+(fc.flipped?' flip':'')+'" id="fc-inner">'
            + '<div class="fc-face fc-front" id="fc-front">'+fcFrontHTML(c)+'</div><div class="fc-face fc-back" id="fc-back">'+fcBackHTML(c)+'</div></div></div>'; }
        function fcStatsHTML(){ return '<div class="fc-bar"><div class="fc-stats"><span class="k">알아요<span class="lk-en"> · Got it</span> <b id="fc-sk">'+fcCount('known')+'</b></span><span class="u">모르겠어요<span class="lk-en"> · Not yet</span> <b id="fc-su">'+fcCount('unknown')+'</b></span></div>'
            + '<div class="fc-order" role="group"><button type="button" class="fc-obtn'+(fc.shuffled?'':' on')+'" data-action="fc-order" data-sh="0">순서대로<span class="lk-en"> · In order</span></button><button type="button" class="fc-obtn'+(fc.shuffled?' on':'')+'" data-action="fc-order" data-sh="1">섞기<span class="lk-en"> · Shuffle</span></button></div></div>'; }
        function fcSummaryHTML(){ const k=fcCount('known'),u=fcCount('unknown'); return '<div class="fc-sum"><h3>한 바퀴 끝!<span class="lk-en"> · Round complete</span></h3>'

        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';
            return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcCardHTML()

        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }

        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 이벤트 위임 (#app 1회) ----------
        appEl.addEventListener('click', (e) => {
            const vdo = e.target.closest('[data-video-open]'); if (vdo) { const vi = +vdo.dataset.videoOpen; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; } setTab('video'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const tab = app.activeTab;

            if (tab === 'video') {
                const vsel = e.target.closest('[data-video-idx]');
                if (vsel) { const vi = +vsel.dataset.videoIdx; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; paint(); } return; }
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const pt = e.target.closest('[data-pane-toggle]'); if (pt) { const vi = +pt.dataset.paneVideo; let vOn = learn.layout !== 'script', sOn = learn.layout !== 'video'; if (pt.dataset.paneToggle === 'video') vOn = !vOn; else sOn = !sOn; if (!vOn && !sOn) { vOn = true; sOn = true; } const nl = (vOn && sOn) ? 'split' : (vOn ? 'video' : 'script'); if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; learn.layout = nl; paint(); return; } learn.layout = nl; const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = curVideo().script.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans = learn.sbTrans || {}; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }
                    else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); }
                    else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); }
                }
                return;
            }
            if (tab === 'vocab') {
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;
                    const fa = e.target.closest('[data-action^="fc-"]');
                    if (fa) { const act = fa.dataset.action;
                        if (act === 'fc-flip') fcSetFlip(!fc.flipped);
                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });
                        else if (act === 'fc-order') fcSetOrder(fa.dataset.sh==='1');
                        else if (act === 'fc-audio') fcPlay(fcCur().audio);
                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }
                        else if (act === 'fc-again-u') { fc.shuffled=true; fcStart(fcUnknown()); fcRefreshDeck(); }
                        else if (act === 'fc-again-all') { fc.shuffled=true; fcStart(null); fcRefreshDeck(); }
                    }
                    return;
                }
                const a = e.target.closest('[data-action]'); if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, !cur); }
                return;
            }
            if (tab === 'quiz') {
                const tb = e.target.closest('[data-action="q-trans"]'); if (tb) { const qEl = tb.closest('.quiz-q'); const qid = +qEl.dataset.qid; const st = quizState.q[qid]; st.trans = !st.trans; rerenderQuizQ(qid); return; }
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const ok = st.input.trim() === (quiz.answer||quiz.correct_word); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = (quiz.answer||quiz.correct_word); st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });
        appEl.addEventListener('input', (e) => {
            if (e.target.id === 'seek') { const t = parseFloat(e.target.value); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; updateSeekUI(); return; }
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        // video: 어휘 호버 팝업
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        // keyboard (video)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } } else if (e.code === 'ArrowUp') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { if (p.isMuted && p.isMuted()) p.unMute(); p.setVolume(Math.min(100, Math.round(p.getVolume()) + 10)); } } else if (e.code === 'ArrowDown') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { p.setVolume(Math.max(0, Math.round(p.getVolume()) - 10)); } } else if (e.key === ',' || e.key === '.') { e.preventDefault(); const steps = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]; let idx = steps.indexOf(learn.rate); if (idx < 0) idx = 2; idx = Math.min(steps.length - 1, Math.max(0, idx + (e.key === ',' ? -1 : 1))); learn.rate = steps[idx]; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); if (typeof rebuildToolbar === 'function') rebuildToolbar(); } else if (e.key === 'm' || e.key === 'M') { const p = learn.player; if (p && p.isMuted) { if (p.isMuted()) p.unMute(); else p.mute(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.error = null; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id);
            const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다. 학습자 답변을 분석하고 JSON으로만 답하세요. 순수 JSON만 반환하세요.\n[질문]: ${item.questionKor}\n[학습자 답변]: ${st.text}\n[포맷]: {"overallPraise":"","overallPraiseTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const data = await callGeminiWithBackoff(payload); let txt = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text; if (!txt) throw new Error('응답이 비어있습니다.'); txt = txt.replace(/^```json\n?/, '').replace(/\n?```$/, ''); st.feedback = JSON.parse(txt); }
            catch (err) { st.error = err.message; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 시작 ----------
        buildApp();
    })();
    </script>
