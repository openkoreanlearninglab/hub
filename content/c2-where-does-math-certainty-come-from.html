- 단, 고칠 대상(original)은 학습자가 쓴 그대로 인용하고, 고친 표현(corrected, suggested)은 레벨을 고려하지 않고 가장 자연스러운 표현으로 씁니다.
- '주어, 서술어, 조사, 조건절, 안긴문장' 같은 기본 문법 용어는 써도 되지만, '연어'처럼 어려운 언어학 용어는 쓰지 말고 "'옷'과 '쓰다'는 함께 쓰지 않아요"처럼 풀어서 설명합니다.
- 규칙만 말하지 말고, 이 문장에서 왜 문제인지를 함께 설명합니다. example은 [예문 쓰는 법]을 따릅니다.
- '피동', '의존명사', '관형형' 같은 문법 용어를 쓰면 바로 뒤에 쉬운 말로 풀어 줍니다. 예: "피동(주어가 남의 힘에 의해 움직이는 동사의 형태)". 단, 설명 안에서 이미 그 뜻을 풀어 말했으면 괄호 풀이를 또 붙이지 않습니다. 같은 말을 되풀이하지 않습니다.
- 학습자가 일부러 그렇게 썼을 수도 있는 경우에는 단정하지 말고 "~을 말하고 싶었다면 ~가 더 자연스러워요"처럼 씁니다.
- 오타처럼 이유가 분명한 경우에는 explanation을 빈 문자열로 둡니다.

[corrections — 고쳐야 하는 부분 (빨간색)]
빨간색에는 두 종류가 있습니다. (1) 문법적으로 틀린 것, (2) 문법은 맞지만 이 문맥에서는 틀린 것(어색한 표현). 둘 다 corrections에 씁니다.
(1) 문법적 오류
- 맞춤법, 오타, 띄어쓰기, 조사, 활용(예: 힘든다 → 힘들다, 창조적은 → 창조적인), 문법 형태가 섞인 경우(예: -는지 아닌지와 -나를 함께 씀)
- 주어와 서술어가 맞지 않는 문장. 특히 능동/피동이 맞지 않는 경우(예: 사람들이 누군가를 살인자라고 불리다 → 부르다)
- 종결어미가 섞인 경우
(2) 문맥상 어색한 표현 — 선생님 첨삭에서 가장 많이 나오는 순서대로 꼼꼼히 확인합니다.
- 은/는과 이/가: 문단의 주제인지, 조건절·안긴문장 안의 주어인지, 대조인지에 따라 맞는지 확인합니다. (tag: 조사)
- 단어 선택: 뜻이 비슷하지만 이 문맥에 맞지 않는 단어. 예: 동기를 악화하다 → 약화하다, 일시성 → 한시성, 교육 방식을 검수하다 → 검토하다, 해를 보다 → 해를 입다 (tag: 단어 선택)
- 함께 쓰지 않는 단어 조합. 예: 명암을 하다 → 명암을 표현하다, 어떤 일반 물건 → 평범한 물건 (tag: 단어 조합)
- 시제와 상: 가정하는 상황인데 과거형을 쓴 경우, 일반적인 사실인데 '-은'을 쓴 경우(만족한 → 만족하는) 등 (tag: 시제)
- '-는 것이다'를 묘사·서술 문장에 쓴 경우. '-는 것이다'는 본질이나 정의를 규정할 때 씁니다. 묘사는 '-ㄴ다'로 끝냅니다. (tag: 문맥상 어색한 표현)
- 접속어와 연결어미의 논리: 따라서(결과)를 이유가 필요한 자리에 쓴 경우, 약한 대조 '그런데'를 강한 역접 자리에 쓴 경우, '-고'(나열)와 '-며/-아서'(긴밀한 관계·인과)를 잘못 고른 경우, '때'(특정 순간)와 '-면'(일반 조건) (tag: 연결 표현)
- 영어를 직역한 서술어. 예: 질문이 생기지 못한다 → 질문을 떠올릴 겨를이 없다 (tag: 문맥상 어색한 표현)
- 불필요한 반복이나 중복. 예: 녹화하기 가능한 → 녹화 가능한 (tag: 불필요한 반복)
- 능동과 피동: 예: 그런 시설이 지방에 잘 갖추면 → 갖춰지면 (tag: 주어·서술어 호응). [조사 '-은/는'이 붙은 말과 능동·피동 확인]을 따릅니다.
- 'A가 아니고 B이다'처럼 앞을 부정하고 뒤를 바로잡는 문장은 '-아니라'를 씁니다. 예: 문제는 돈이 아니고 시간이다 → 돈이 아니라 (tag: 연결 표현)
- 과거와 현재, 이것과 저것을 대조할 때 대조하는 말에 '-은/는'이 빠진 경우. 예: 처음 시작했을 때 어려웠지만 지금은 쉽다 → 시작했을 때는 (tag: 조사)
- 꼭 필요한 말이 빠진 경우: 글에서 생략하면 안 되는 주어·조사, 가리키는 대상이 분명해야 하는 지시어('이' 배), 무엇의 김이 빠지는지 같은 대상 (tag: 빠진 말)
tag는 다음 중 하나: ${FEEDBACK_CONFIG.RED_TAGS.join(', ')}

[suggestions — 틀리지 않았지만 더 좋은 대안 (주황색)]
선생님이 '더 좋은 표현'을 제안하는 기준입니다. 이 기준에 해당할 때만 제안합니다.
- 문체 일관성 (tag: 문어체): 글의 어조에 비해 지나치게 구어적인 표현을 문어체로 바꿉니다. 예: 인생의 의미가 뭐냐는 → 삶의 의미는 무엇인가라는, 권태를 이기다 → 극복하다, 우리가 알든 모르든 상관없이 → 우리의 인식과 무관하게, 글에서 생략한 조사 살리기. "근데, 되게, 막, 진짜", "거/건/게" 같은 줄인 형태도 해당합니다. 종결어미(-다/-요/-니다) 자체는 대상이 아닙니다. 구어체를 문어체로 바꾸는 제안에만 이 태그를 씁니다.
- 더 정확한 어휘 (tag: 정확한 어휘): 틀리지는 않았지만 뜻이 더 정확하게 맞는 단어. 예: 기준을 쓰다 → 기준을 적용하다, 공상과 현실의 사이 → 관계, 오랫동안 → 오래전부터(과거부터 지금까지 이어짐), 잘 알고 있다 → 인지하고 있다
- 고급 표현 (tag: 고급 표현): 같은 뜻을 더 간결하고 글에 맞는 어휘(주로 한자어)나 압축된 구조로 바꿀 수 있을 때. 예: 그림 그리기 → 회화(繪畵), 한쪽이 다른 쪽 없이 생존할 수 없는 관계 → 불가분의 관계, 육체 노동으로 → 노동집약적 산업으로
  · 레벨(${level})보다 반 단계~한 단계 높은 수준이어야 합니다. 말을 늘이거나 조사·어미만 바꾼 것은 고급 표현이 아닙니다.
  · 가능하면 [핵심 어휘]나 [본문]에 나온 어휘를 씁니다. explanation에 "본문에서 나온 표현"이라고 쓰는 것은 그 표현이 실제로 [본문]이나 [핵심 어휘]에 있을 때만입니다.
- 번역투 (tag: 번역투): 영어 구조를 옮긴 듯한 문장. 예: ~ 중에 하나는 ~이다(One of ~ is) → ~ 중에는 ~이 있다, 모양을 가지고 있다 → 모양이다, '-의'가 여러 번 이어지는 구조, 불필요한 피동 → 능동
- 문장 구조와 일관성 (tag: 일관성): 첫 번째는 / 두 번째 이유는처럼 나열 형식이 다른 경우, 너무 긴 안긴문장의 주어를 바꾸면 쉽게 읽히는 경우
- 논리 연결 (tag: 논리 연결): 두 사실의 관계를 더 분명하게 보여 주는 표현. 예: 두 사건을 따로 나열(상류층이 늘었고 신흥 부자가 생겼다) → 인과로 연결(신흥 부자들이 생겨나면서 상류층이 확대되었다), 의미가 모호하고 약한 주장(관련이 있다) → 정확한 강도의 주장(영향을 미쳤을 가능성이 있다)
- 대체 표현 (tag: 대체 표현): 원래 표현도 좋지만 함께 알아 두면 좋은 다른 표현. suggested에 "A / B"처럼 1~2개를 씁니다.
- 다른 글쓰기 스타일 (tag: 다른 글쓰기 스타일): 문장은 문법적으로 알맞고 자연스럽지만, 다른 전개 방식이 글의 설득력을 높이는 경우. 예: '따라서'로 바로 주장하는 대신 '특히'로 이유나 사례를 먼저 제시하기
- 의도에 따라 달라요 (tag: 의도에 따라 달라요): 학습자가 무슨 뜻으로 썼는지에 따라 맞는 표현이 다른 경우. explanation에 "~라는 뜻이면 원래 표현이 맞고, ~라는 뜻이면 ~가 더 자연스러워요"처럼 두 해석을 모두 씁니다.
[주황색 설명 방식]
- explanation은 원래 표현이 틀리지 않았다는 점을 먼저 인정합니다(예: "틀린 표현은 아니지만"). 그다음 두 표현의 뜻이나 느낌이 어떻게 다른지, 이 문맥에서는 왜 제안한 표현이 더 맞는지 씁니다.
- 학습자가 일부러 그렇게 썼을 수도 있으면 "특별한 이유가 있어서 그렇게 썼을 수 있지만"처럼 단정하지 않습니다.
- 쉬운 표현을 모두 고치지 않습니다. 제안할 만한 곳이 없으면 suggestions는 빈 배열입니다.
- 제안에 새 어휘를 썼으면 word에 그 어휘(term), 한자어이면 한자(hanja), 쉬운 뜻(meaning)을 씁니다. 없으면 모두 빈 문자열입니다.
- 가장 도움이 되는 순서로 최대 ${FEEDBACK_CONFIG.MAX_SUGGESTIONS.C}개까지만 씁니다.
tag는 다음 중 하나: ${FEEDBACK_CONFIG.ORANGE_TAGS.C.join(', ')}`

function buildSystemPrompt(level) {
  const mode = modeOf(level);
  return `당신은 외국인 학습자의 한국어 글쓰기를 첨삭하는 한국어 선생님입니다.
학습자는 ${level} 수준의 학습 자료를 읽고, 주어진 질문에 대해 글을 썼습니다.

${MODE_RULES[mode](level)}

${COMMON_RULES(mode, level)}

[예시] (출력 형식을 보여 주는 예시예요. 내용을 따라 하지 마세요.)
${FEW_SHOT[mode]}

[출력]
아래 JSON 하나만 출력합니다. 모든 필드를 빠짐없이 쓰고, 해당 없는 필드는 빈 문자열로 둡니다. 마크다운, 코드 블록, 다른 설명은 쓰지 않습니다. 강조가 필요하면 **단어**만 씁니다.
${SCHEMA_LINE}`;
}

function buildUserMessage(ctx) {
  const vocab = (ctx.vocab || []).map(v => `- ${v.term}: ${v.def}`).join('\n') || '없음';
  const mixed = mixedEndingSentences(ctx.learnerText);
  const endCheck = mixed.list.length ? `\n\n[종결어미 확인 — 코드가 미리 찾은 것]\n이 글은 주로 ${ENDING_LABEL[mixed.dom]}로 끝나요. 다음 문장은 다른 종결어미로 끝나므로 반드시 corrections에 tag "문체"로 지적하고, corrected는 ${ENDING_LABEL[mixed.dom]}로 끝냅니다.\n${mixed.list.map(x => '- ' + x).join('\n')}\n이 문장 말고도 글 전체에서 다른 오류는 평소처럼 모두 찾습니다.` : '';
  return `[학습 자료 레벨]\n${ctx.level}\n\n[본문]\n${ctx.article || '없음'}\n\n[핵심 어휘]\n${vocab}\n\n[질문]\n${ctx.question}${ctx.questionEn ? `\n(질문의 영어 번역: ${ctx.questionEn})` : ''}\n\n[학습자 글]\n${ctx.learnerText}${endCheck}`;
}


const str = (v) => (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
const arr = (v) => (Array.isArray(v) ? v : []);
// 허용 강조(**단어**)만 <b>로, 나머지 마크다운 기호는 제거
const richText = (s) => esc(str(s).replace(/`/g, '').replace(/^#+\s*/gm, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*/g, '');
const numMark = (n) => (n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`);

/* =====================================================================
   5. 응답 정리 (어느 모델이든 같은 모양으로)
   ===================================================================== */
function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const model = curModel(); if (!model) throw AppError('model');
  const q = P.request(model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}

function aiHandleClick(a) {
  const act = a.dataset.action;
  if (!act || act.indexOf('aifb-') !== 0) return false;
  if (act === 'aifb-toggle-settings') { aiState.settingsOpen = !aiState.settingsOpen; aiRepaintKeyFields(); return true; }
  if (act === 'aifb-clear-key') { aiState.apiKey = ''; paint(); return true; }
  const qEl = a.closest('.discuss-q'); if (!qEl) return true;
  const id = +qEl.dataset.did, st = discussState[id];
  if (act === 'aifb-toggle-write') { st.open = !aiIsOpen(st); rerenderDiscussItem(id); if (st.open) { const t = qs(`.discuss-q[data-did="${id}"] textarea`, viewRoot()); if (t) t.focus(); } }
  else if (act === 'aifb-copy') { if (st.feedback) aiCopy(st, DISCUSS_DATA.find(x => x.id === id), a); }
  else if (act === 'aifb-download') { if (st.feedback) aiDownload(st, DISCUSS_DATA.find(x => x.id === id)); }
  else if (act === 'aifb-toggle-en') { st.showEn = !(st.showEn === null ? effLang() === 'en' : st.showEn); rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-ask') { st.confirmClear = true; rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-no') { st.confirmClear = false; rerenderDiscussItem(id); }
  else if (act === 'aifb-clear-yes') { Object.assign(st, { text: '', feedback: null, feedbackFor: '', error: null, confirmClear: false }); aiSaveStore(); rerenderDiscussItem(id); }
  return true;
}
function aiHandleInput(t) {
  if (t.matches('[data-ai-field="apiKey"]')) {
    aiState.apiKey = t.value.trim();
    document.querySelectorAll('[data-ai-field="apiKey"]').forEach(x => { if (x !== t) x.value = t.value; });
    return true;
  }
  if (t.matches('[data-ai-field="customModel"]')) {
    aiState.customModel = t.value;
    document.querySelectorAll('[data-ai-field="customModel"]').forEach(x => { if (x !== t) x.value = t.value; });
    return true;
  }
  if (app.activeTab === 'discuss' && t.matches('[data-action="discuss-text"]')) {
    const qEl = t.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
    const wasStale = isStale(st);
    st.text = t.value; st.confirmClear = false; aiSaveStore();
    const run = qs('[data-action="discuss-feedback"]', qEl);
    if (run) { const dis = st.loading || !st.text.trim(); run.disabled = dis; run.className = run.className.replace(/border-gray-200 text-gray-300 cursor-not-allowed|border-black bg-black text-white hover:bg-white hover:text-black/, dis ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'); }
    const clr = qs('[data-action="aifb-clear-ask"]', qEl); if (clr) clr.disabled = !st.text.trim() && !st.feedback;
    if (isStale(st) !== wasStale) { const w = qs('[data-aifb-fb]', qEl); if (w) w.innerHTML = feedbackHTML(st, id); }
    return true;
  }
  return false;
}
function aiHandleChange(t) {

function markedTextHTML(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {
    if (s.start < pos) return;
    out += esc(text.slice(pos, s.start));
    const orig = esc(text.slice(s.start, s.end));
    if (s.color === 'r') {
      out += `<del class="m-del">${orig}</del> <span class="m-ins">${esc(s.corrected)}</span><span class="n r">${numMark(s.num)}</span>` + s.extra.map(x => `<span class="n o">${numMark(x)}</span>`).join('');
    } else {
      out += `<span class="m-sug">${orig}</span><span class="n o">${numMark(s.num)}</span>`;
    }
    pos = s.end;
  });
  out += esc(text.slice(pos));
  return out;
}

function cardHTML(it, mode, showEn) {
  const T = uiOf(mode);
  const isR = it.color === 'r';
  const to = isR ? it.corrected : it.suggested;
  const tagEn = FEEDBACK_CONFIG.TAG_LABEL_EN[it.tag] || it.tag;
  const tagHTML = mode === 'A' ? esc(tagEn) : mode === 'B' ? sw(it.tag, tagEn) : esc(it.tag);
  const word = !isR && it.word && it.word.term ? `<div class="word"><b>${L(mode, 'newWord')}</b> · ${esc(it.word.term)}${it.word.hanja ? `(${esc(it.word.hanja)})` : ''}${it.word.meaning ? `: ${esc(it.word.meaning)}` : ''}</div>` : '';
  return `<div class="card ${it.color}">
    <div class="card-h"><span class="n ${it.color}" style="vertical-align:baseline">${numMark(it.num)}</span><span class="chip ${it.color}">${tagHTML}</span><span class="kind">${isR ? L(mode, 'fix') : L(mode, 'sug')}</span></div>
    <div class="pair">${isR ? `<span class="m-del">${esc(it.original)}</span>` : `<span>${esc(it.original)}</span>`}<span class="arrow">→</span><span class="${isR ? 'to-r' : 'to-o'}">${esc(to)}</span></div>
    ${it.explanation ? `<p class="exp">${richText(it.explanation)}</p>` : ''}
    ${showEn && it.explanationEn ? `<p class="en">${richText(it.explanationEn)}</p>` : ''}
    ${it.example ? `<p class="ex">${L(mode, 'ex')} ${richText(it.example)}</p>` : ''}
    ${word}
  </div>`;
}

function askHTML(mode) {
  const C = FEEDBACK_CONFIG.CONTACT;
  const links = [];
  if (C.email) links.push(`<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`);
  if (C.url) links.push(`<a href="${esc(C.url)}" target="_blank" rel="noopener">${esc(C.urlLabel || C.url)}</a>`);
  return `<div class="ask">${L(mode, 'ask')}${links.length ? `<div style="margin-top:6px">${links.join(' · ')}</div>` : ''}</div>`;
}

function feedbackHTML(st, id) {
  const curMode = modeOf();
  if (st.loading) return `<div class="loading">${L(curMode, 'loading')}</div>`;
  const errBox = errHTML(curMode, 'feedbackFail', st.error);
  const fb = st.feedback; if (!fb) return errBox;
  const mode = fb.mode, T = uiOf(mode);
  const showEn = mode === 'B' && (st.showEn === null ? effLang() === 'en' : st.showEn);   // 영어 메뉴면 번역 펼침이 기본
  const en = (v) => (showEn && v ? `<p class="en">${richText(v)}</p>` : '');
  const src = st.feedbackFor;
  const { reds, oranges } = layoutFeedback(src, fb);
  const rel = fb.relevance;
  const relHTML = rel.status === 'on'
    ? `<div class="rel on"><p>✓ ${L(mode, 'relOn')}</p></div>`
    : `<div class="rel ${rel.status}"><span class="fb-label">${(rel.status === 'off' ? L(mode, 'relOff') : L(mode, 'relPartial'))}</span>${rel.comment ? `<p>${richText(rel.comment)}</p>` : ''}${en(rel.commentEn)}${rel.modelAnswer ? `<div class="model"><span class="fb-label">${L(mode, 'model')}</span>${richText(rel.modelAnswer)}${rel.modelAnswerEn && (mode === 'A' || showEn) ? `<p class="en">${richText(rel.modelAnswerEn)}</p>` : ''}</div>` : ''}</div>`;
  const none = !reds.length && !oranges.length;
  const body = none
    ? `<p class="status">${L(mode, 'none')}</p>`
    : `<div class="fb-sec"><span class="fb-label">${(isStale(st) ? L(mode, 'oldText') : L(mode, 'myText'))}</span><div class="text">${markedTextHTML(src, reds, oranges)}</div>
        <div class="legend"><span><span class="m-del">${L(mode, 'legendRed')}</span></span><span><span class="m-sug">${L(mode, 'legendOrange')}</span></span></div></div>
      <div class="fb-sec"><span class="fb-label">${L(mode, 'wrong')}</span>${reds.length ? reds.map(r => cardHTML(r, mode, showEn)).join('') : `<p class="status">${L(mode, 'noWrong')}</p>`}</div>
      ${oranges.length ? `<div class="fb-sec"><span class="fb-label">${L(mode, 'better')}</span>${oranges.map(o => cardHTML(o, mode, showEn)).join('')}</div>` : ''}`;
  const engBtn = mode === 'B' ? `<button type="button" class="slim eng${showEn ? ' on' : ''}" data-action="aifb-toggle-en" aria-pressed="${showEn}">ENG</button>` : '';
  return `${errBox}<div class="fb fb-${mode}"><div class="fb-top"><h3>${L(mode, 'title')}</h3><div class="fb-tools">${engBtn}${toolBtn('aifb-copy', ICON_COPY, '복사', 'Copy', mode)}${toolBtn('aifb-download', ICON_SAVE, '저장', 'Save', mode)}</div></div>
    ${isStale(st) ? `<div class="stale">${L(mode, 'stale')}</div>` : ''}
    ${relHTML}
    ${fb.praise ? `<div class="fb-sec"><span class="fb-label">${L(mode, 'praise')}</span><div class="praise">${richText(fb.praise)}${en(fb.praiseEn)}</div></div>` : ''}
    ${body}
    ${askHTML(mode)}
  </div>`;
}

        // 한 문장만 재생: 문장 끝에서 멈춤 (50ms 간격 확인, 탐색이 끝나기 전 옛 시각은 무시)
        function clearSeg() { learn.stopAt = null; if (learn.segTimer) { clearInterval(learn.segTimer); learn.segTimer = null; } }
        function playLineOnly(line) {
            const p = learn.player; if (!p || !line) return;
            clearSeg(); cancelEndCard();
            const start = line.time[0], end = line.time[1]; let started = false;
            learn.stopAt = end; p.seekTo(start, true); p.playVideo();
            learn.segTimer = setInterval(() => {
                const pl = learn.player; if (!pl || !pl.getCurrentTime || learn.stopAt == null) { clearSeg(); return; }
                const t = pl.getCurrentTime();
                if (!started) { if (t >= start - 0.3 && t < end) started = true; return; }
                if (t > end + 1 || t < start - 0.5) { clearSeg(); return; }   // 사용자가 다른 곳으로 옮김
                if (t >= end - 0.08) { pl.pauseVideo(); clearSeg(); }
            }, 50);
        }

        // ---------- 7. 어휘 팝업 ----------
        let popupEl = null;

        // ---------- 8. READING ----------
        function currentReading() { return READING_DATA.find(r => r.id === reading.activeId); }
        function buildVocabRanges(text) {
            const allTerms = VOCAB_READING_DATA.flatMap(v => { const terms = [v.term]; if (v.variants) terms.push(...v.variants); return terms.map(term => ({ term, vocab: v })); }).sort((a, b) => b.term.length - a.term.length);
            const ranges = [];
            allTerms.forEach(({ term, vocab }) => { let i = 0; while ((i = text.indexOf(term, i)) !== -1) { const end = i + term.length; const overlaps = ranges.some(m => (i >= m.start && i < m.end) || (end > m.start && end <= m.end)); if (!overlaps) ranges.push({ start: i, end, term, vocab }); i = end; } });
            return ranges;
        }
        function renderTextSegments(text, blockIndex, isHeading) {
            if (!text) return '';
            const blockId = `${reading.activeId}-${blockIndex}`;
            const blockHi = reading.highlights[blockId] || [];
            const vocabRanges = buildVocabRanges(text);
            const points = new Set([0, text.length]);
            blockHi.forEach(h => { points.add(h.start); points.add(h.end); });
            vocabRanges.forEach(v => { points.add(v.start); points.add(v.end); });
            const sorted = Array.from(points).sort((a, b) => a - b);
            let out = '';
            for (let i = 0; i < sorted.length - 1; i++) {
                const s = sorted[i], e = sorted[i + 1], mid = (s + e) / 2;
                let hiColor = null;
                for (let j = blockHi.length - 1; j >= 0; j--) { const h = blockHi[j]; if (h.start <= mid && h.end >= mid) { hiColor = h.color; break; } }
                const av = vocabRanges.find(v => v.start <= mid && v.end >= mid);
                let cls = 'transition-colors duration-200 decoration-clone ';
                if (hiColor === 'yellow') cls += 'bg-yellow-200 '; else if (hiColor === 'red') cls += 'bg-red-200 '; else if (hiColor === 'green') cls += 'bg-green-200 ';
                let attrs = '';
                if (av) { cls += `cursor-pointer ${isHeading ? 'font-extrabold' : 'font-semibold'} text-gray-900 hover:text-black hover:bg-gray-100 rounded px-0.5 `; attrs = ` data-vocab-idx="${VOCAB_READING_DATA.indexOf(av.vocab)}"`; }
                else if (!hiColor) cls += 'text-gray-800 ';

        // ---------- 읽기 자료 낭독 오디오 (reading-a-audio에서 가져옴) ----------
        // 사용법: 오디오를 붙일 읽기 자료(READING_DATA 항목)에 audio:{ src:'<파일 URL>', label:'본문 낭독' } 을 넣는다(label은 생략 가능, 기본 '오디오').
        //   · 파일은 Google AI Studio TTS로 만들어 GitHub(hub/assets/audio/)에 올린다.

        //   · 재생(▶)·2초 앞뒤로·속도 0.75~1.25(0.01 단위)·내려받기. 재생 위치·속도는 탭을 옮겼다 돌아와도 유지(자동 재생은 안 함).
        //   · 인쇄(학습지)에는 나오지 않는다. 저작권이 있는 남의 음원은 올리지 않는다.

        const audioLabel = (r) => (r && r.audio && r.audio.label) || r.audioLabel || '오디오';
        const AUDIO_CFG = { rate: { min: 0.75, max: 1.25, step: 0.01, def: 1 }, skip: 2 };
        const audioState = { rid: null, rate: AUDIO_CFG.rate.def, time: 0, playing: false, seeking: false, dragging: null, bound: false };
        let audioEl = null;

        function fmtTime(s) {
            if (!isFinite(s) || s < 0) return '--:--';
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
            const mm = h ? String(m).padStart(2, '0') : String(m);

        }
        // 배속: AUDIO_CFG.rate 의 min~max 를 step 단위로 오르내린다. 버튼(− +)과 슬라이더 바 둘 다로 조절.
        function audioSnapRate(v) {
            const c = AUDIO_CFG.rate;

        function audioRateFromEvent(e) {
            const bar = qs('#lk-ap-rbar', viewRoot()); if (!bar) return;

        function audioRefreshProgress() {

        function audioToggle() {

  /* =========================================================================

  function introHTML(){

      + '<h3>Mode 2 · Listen → Picture</h3>'

      + '<p><b>Sounded the same</b> — the card is done for today and comes back later and later (daily → every 2 days → every 4 days → weekly). '

        : SKIP_MODE==='always' ? '<p><b>I know this →</b> — already sure? Skip the card from the front without flipping. It counts as “Sounded the same”.</p>' : '')
      + '<h3>Record &amp; compare</h3>'

        + '<button type="button" class="btn pri" data-act="intro-go">Start</button>'

  }

  function homeHTML(){
    var st = state.settings, m = st.mode, due = dueList(m).length, bc = boxCounts(m), nd = nextDue(m);
    var modeBtn = function(v, t, d){ return '<button type="button" class="mode'+(m===v?' on':'')+'" data-act="mode" data-v="'+v+'"><div class="t">'+t+'</div><div class="d">'+d+'</div></button>'; };
    var boxes = '<div class="bx"><div class="n">'+bc.fresh+'</div><div class="k">New</div><div class="i">not seen yet</div></div>'

    var todayLine = due

      + '</div>'
      + '<div class="settings">'
        + '<div class="lab">Settings</div>'
        + '<div class="set"><span class="nm">Show the sentence</span>'+seg('set-reveal', st.reveal, [['tap','When I tap'],['auto','After the audio']])
          + '<span class="ds">“When I tap” keeps the text blurred: tap once to hear again, twice to see it. “After the audio” is easier for your first rounds.</span></div>'

          + '<button type="button" class="btn" data-act="export">Export</button>'

          + '</div><span class="ds">Progress is saved only in this browser. Export a file to move it to another device or browser.</span>'
          + (state.homeMsg ? '<span class="msg'+(state.homeMsgErr?' err':'')+'">'+esc(state.homeMsg)+'</span>' : '') + '</div>'
        + '<div><button type="button" class="lnk" data-act="show-intro">How it works</button></div>'
      + '</div>'
      + '</section>';
  }

  function mediaHTML(c, thumb, flipped){
    var m = c.media, mob = isMobile(), ph = 'Picture not available yet';
    if(flipped && c.back){
      var bsrc = mob ? (c.back.img3x4 || c.back.img) : (c.back.img || c.back.img3x4);
      var fit = (!mob && !c.back.img) ? ' class="contain"' : '';
      return '<div class="media-box'+(thumb?' thumb':'')+'" data-ph="'+esc(ph)+'"><img'+fit+' src="'+esc(bsrc)+'" alt="picture card"></div>';
    }
    if(m.type==='video'){
      var src = (mob && m.src9x16) ? m.src9x16 : m.src;
      var attrs = m.sound ? ' controls playsinline preload="auto" data-sound="1"' : ' autoplay muted loop playsinline preload="metadata"';
      return '<div class="media-box'+(thumb?' thumb':'')+'" data-ph="'+esc(ph)+'"><video src="'+esc(src)+'"'+attrs+'></video></div>';
    }
    var isrc = (mob && m.src3x4) ? m.src3x4 : m.src;
    return '<div class="media-box'+(thumb?' thumb':'')+'" data-ph="'+esc(ph)+'"><img src="'+esc(isrc)+'" alt="picture card"></div>';
  }
  /* 소리가 있는 동영상: 화면에 그린 뒤 소리를 켜고 재생. 브라우저가 막으면 재생 버튼(controls)으로 학습자가 직접 재생 */
  function playSoundVideo(){
    var v = root.querySelector('video[data-sound]'); if(!v) return;
    try{ v.muted = false; var p = v.play(); if(p && p.catch) p.catch(function(){}); }catch(_){}
  }

  function sentenceInner(){
    var s = state.sess, c = curCard();
    var tip = s.step===0 ? 'Tap to hear it again' : (s.step===1 ? 'Tap again to see the text' : '');
    var mean = '';
    if(s.step>=2 && c.en){
      mean = s.trans ? '<span class="en" lang="en">'+esc(c.en)+'</span>'
                     : '<button type="button" class="mean" data-act="meaning">Meaning</button>';
    }
    return '<p class="ko" lang="ko">'+boldTarget(c.ko, c.hl)+'</p>'+(tip?'<span class="tip">'+tip+'</span>':'')+mean;
  }
  function toolsInner(){
    var s = state.sess, out = '';
    out += '<button type="button" class="tool'+(playing?' on':'')+'" data-act="replay">'+ICON.spk+' Listen</button>';
    out += '<button type="button" class="tool" data-act="slow">'+ICON.slow+' 0.75×</button>';
    if(CAN_REC){
      out += s.rec==='recording'
        ? '<button type="button" class="tool on" data-act="rec-stop">'+ICON.stop+' Stop</button>'
        : '<button type="button" class="tool'+(s.rec==='playing'?' on':'')+'" data-act="rec"'+(s.rec==='playing'?' disabled':'')+'>'+ICON.mic+' Record &amp; compare</button>';
    }
    if(SR && state.settings.asr){
      out += '<button type="button" class="tool'+(s.asr==='listen'?' on':'')+'" data-act="asr">'+ICON.check+' '+(s.asr==='listen'?'Listening…':'Check my speech')+'</button>';
    }
    return out;
  }

  function cardHTML(){
    var s = state.sess, c = curCard(), see = s.mode==='see';
    var pct = Math.round(((s.pos+1)/s.queue.length)*100);
    var top = '<div class="topbar"><span class="lab">'+(see?'See → Say':'Listen → Picture')+'</span>'
      + '<span class="count">'+(s.pos+1)+' / '+s.queue.length+'</span>'
      + '<button type="button" class="lnk" data-act="home">Exit</button></div>'
      + '<div class="prog"><i style="width:'+pct+'%"></i></div>';
    var body;
    if(!s.flipped){
      if(see){
        body = '<div class="card fade">'+mediaHTML(c,false,false)
          + '<p class="cue">'+(c.cue || 'Describe the picture in Korean — <b>out loud</b>.')+'<span class="s">Then flip the card and compare with your ears.</span></p></div>'
          + flipBar();
      }else{
        body = '<div class="card fade"><div class="listen">'
          + '<button type="button" class="bigplay'+(playing?' on':'')+'" data-act="replay" aria-label="Play">'+ICON.play+'</button>'
          + '<div class="row"><button type="button" class="tool" data-act="slow">'+ICON.slow+' 0.75×</button></div>'
          + '<p class="cue">Listen and picture the scene.<span class="s">Say it back if you can, then flip.</span></p></div></div>'
          + flipBar();
      }
    }else{
      body = '<div class="card fade">' + mediaHTML(c, see, true)
        + '<div class="sent'+(s.step<2?' hid':' shown')+'" id="sent" data-act="sent" role="button" tabindex="0" aria-label="Sentence">'+sentenceInner()+'</div>'
        + '<div class="tools" id="tools">'+toolsInner()+'</div>'
        + '<div class="status" id="status"></div></div>'
        + '<div class="judge">'
          + '<button type="button" class="jbtn k" data-act="same">Sounded the same</button>'
          + '<button type="button" class="jbtn u" data-act="again">Again</button>'
        + '</div>';
    }
    return top + body + '<p class="hint"><kbd>Space</kbd> flip · <kbd>R</kbd> listen again · <kbd>T</kbd> reveal text · <kbd>E</kbd> meaning · <kbd>M</kbd> record · <kbd>1</kbd> same'+(SKIP_MODE!=='off'?' (on the front: I know this)':'')+' · <kbd>2</kbd> again</p>';
  }

  function flipBar(){
    return '<div class="flipbar"><button type="button" class="btn pri" data-act="flip">Flip</button>'
      + (canSkip() ? '<button type="button" class="lnk skip" data-act="skip">I know this →</button>' : '')
      + '</div>';
  }
  function doneHTML(){
    var s = state.sess;
    var same = Object.keys(s.same).length, again = Object.keys(s.again).length, skipped = s.skipped||0;
    var nd = nextDue(s.mode);
    var peek = s.peeks===0
      ? 'You never opened the text. Your ears did all the work.'
      : 'You opened the text <b>'+s.peeks+'</b> time'+(s.peeks>1?'s':'')+'. Fewer is better — it means your ears are catching more.';
    if(s.transOpens) peek += '<br>You checked the English meaning <b>'+s.transOpens+'</b> time'+(s.transOpens>1?'s':'')+'.';
    return '<section class="sum fade"><h2>Round complete</h2>'
      + '<div class="nums"><div><b>'+same+'</b>Sounded the same'+(skipped?'<br><span style="font-size:.7rem">('+skipped+' skipped as known)</span>':'')+'</div><div><b>'+again+'</b>Again</div></div>'
      + '<p class="peek">'+peek+(nd?'<br>Next review: <b>'+fmtDay(nd)+'</b>':'')+'</p>'
      + '<div class="acts">'
        + (again?'<button type="button" class="btn pri" data-act="again-round">Practice the “Again” cards ('+again+')</button>':'')
        + '<button type="button" class="btn" data-act="home">Back to start</button>'
      + '</div></section>';
  }

  /* =========================================================================
     렌더 (전체 + 부분)
     ========================================================================= */
  var root = document.createElement('div'); root.className = 'slfc-app';   /* 한 번 만들어 계속 쓴다 — 바깥 화면이 다시 그려져도 mount()로 다시 붙인다 */
  function shown(){ return !!(root.isConnected && active()); }
  function render(){
    var v = state.view, h = '';
    if(v==='intro') h = introHTML();
    else if(v==='home') h = homeHTML();
    else if(v==='card') h = cardHTML();
    else if(v==='done') h = doneHTML();
    root.innerHTML = h;
  }
  function refreshSentence(){
    var el = root.querySelector('#sent'); if(!el || !state.sess) return;
    var s = state.sess;
    el.className = 'sent'+(s.step<2?' hid':' shown');
    el.innerHTML = sentenceInner();
  }
  function refreshTools(){ var el = root.querySelector('#tools'); if(el && state.sess) el.innerHTML = toolsInner(); }
  function refreshPlayUI(){
    var b = root.querySelector('.bigplay'); if(b) b.classList.toggle('on', playing);
    refreshTools();
  }
  function setStatus(msg, kind){ var el = root.querySelector('#status'); if(!el) return; el.textContent = msg||''; el.className = 'status'+(kind?' '+kind:''); }

  /* 이미지·동영상이 아직 없을 때(404) 빈칸 대신 안내 표시 — 오류 이벤트는 버블링하지 않아 캡처로 받는다 */
  root.addEventListener('error', function(e){
    var t = e.target; if(!t || (t.tagName!=='IMG' && t.tagName!=='VIDEO')) return;
    var box = t.closest('.media-box'); if(box) box.classList.add('missing');
  }, true);

  /* =========================================================================
     액션 — #app에 이벤트 위임 1회
     ========================================================================= */
  function goHome(){ if(state.sess){ resetCardUI(); } state.sess=null; state.view='home'; state.homeMsg=''; render(); }
  function exportProgress(){
    try{
      var data = JSON.stringify({ deck:DECK_ID, exported:new Date().toISOString(), settings:state.settings, prog:state.prog }, null, 2);
      var blob = new Blob([data], { type:'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = DECK_ID+'-progress-'+today()+'.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      state.homeMsg='Progress file downloaded.'; state.homeMsgErr=false;
    }catch(_){ state.homeMsg='Export failed in this browser.'; state.homeMsgErr=true; }
    render();
  }
  function importProgress(file){
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var o = JSON.parse(fr.result);
        if(!o || o.deck!==DECK_ID || !o.prog) throw new Error('bad');
        state.prog.see = o.prog.see||{}; state.prog.hear = o.prog.hear||{};
        saveStore(); state.homeMsg='Progress imported.'; state.homeMsgErr=false;
      }catch(_){ state.homeMsg='This file is not a progress file for this deck.'; state.homeMsgErr=true; }
      render();
    };
    fr.onerror = function(){ state.homeMsg='Could not read the file.'; state.homeMsgErr=true; render(); };
    fr.readAsText(file);
  }

  var ACT = {
    'intro-dontshow': function(){ state.introDontShow = !state.introDontShow; render(); },
    'intro-go': function(){ if(state.introDontShow){ state.settings.introSeen = true; saveStore(); } state.view='home'; render(); },
    'show-intro': function(){ state.introDontShow = !!state.settings.introSeen; state.view='intro'; render(); },
    mode: function(el){ state.settings.mode = el.dataset.v; saveStore(); render(); },
    'set-reveal': function(el){ state.settings.reveal = el.dataset.v; saveStore(); render(); },
    'set-shuffle': function(el){ state.settings.shuffle = el.dataset.v==='on'; saveStore(); render(); },
    'set-asr': function(el){ state.settings.asr = el.dataset.v==='on' && !!SR; saveStore(); render(); },
    export: exportProgress,
    import: function(){ var i = root.querySelector('#imp'); if(i){ i.value=''; i.click(); } },
    'start-due': function(){ var l = dueList(state.settings.mode); if(l.length) startSession(l); },
    'start-all': function(){ startSession(CARDS.map(function(c,i){return i;})); },
    'again-round': function(){
      var s = state.sess; var ids = Object.keys(s.again);
      var list = CARDS.map(function(c,i){return i;}).filter(function(i){ return ids.indexOf(CARDS[i].id)>=0; });
      var graded = s.graded;
      startSession(list); state.sess.graded = graded;   /* 같은 날 같은 카드는 상자를 한 번만 옮긴다 */
    },
    home: goHome,
    flip: flip,
    replay: function(){ cleanupRec(); stopAsr(); playNative(1); },
    slow: function(){ cleanupRec(); stopAsr(); playNative(0.75); },
    sent: tapSentence,
    meaning: showMeaning,
    rec: function(){ stopAsr(); startRecording(); },
    'rec-stop': stopRecording,
    asr: function(){ if(state.sess && state.sess.asr==='listen'){ stopAsr(); refreshTools(); setStatus('',''); } else startAsr(); },
    same: function(){ grade('same'); },
    skip: skipCard,
    again: function(){ grade('again'); }
  };

  root.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t || !root.contains(t) || t.disabled) return;
    var a = t.dataset.act;
    if(ACT[a]) ACT[a](t);
  });
  root.addEventListener('change', function(e){
    if(e.target && e.target.id==='imp' && e.target.files && e.target.files[0]) importProgress(e.target.files[0]);
  });
  root.addEventListener('keydown', function(e){
    var t = e.target;
    if((e.key==='Enter' || e.key===' ') && t && t.getAttribute && (t.getAttribute('role')==='checkbox' || t.id==='sent')){
      e.preventDefault(); e.stopPropagation(); var a = t.dataset.act; if(ACT[a]) ACT[a](t);
    }
  });

  window.addEventListener('keydown', function(e){
    var ae = document.activeElement;
    if(ae && (['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName)>=0 || ae.isContentEditable)) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(!shown() || state.view!=='card' || !state.sess) return;
    var s = state.sess, k = e.key;
    if(k===' ' || k==='Enter'){ if(ae && ae.tagName==='BUTTON') return; e.preventDefault(); if(!s.flipped) flip(); }
    else if(k==='r' || k==='R'){ ACT.replay(); }
    else if(k==='t' || k==='T'){ if(s.flipped) tapSentence(); }
    else if(k==='e' || k==='E'){ showMeaning(); }
    else if(k==='m' || k==='M'){ if(s.flipped && CAN_REC){ if(s.rec==='recording') stopRecording(); else if(s.rec==='idle') ACT.rec(); } }
    else if(k==='1'){ if(s.flipped) grade('same'); else skipCard(); }
    else if(k==='2'){ if(s.flipped) grade('again'); }
  });

  function onBreakpoint(){ if(shown() && state.view==='card'){ render(); if(state.sess && !state.sess.flipped && state.sess.mode==='see') playSoundVideo(); } }
  if(MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change', onBreakpoint);
  else if(MOBILE_MQ.addListener) MOBILE_MQ.addListener(onBreakpoint);

  return {
    count: CARDS.length,
    mount: function(el){ if(!el) return; if(root.parentNode !== el) el.appendChild(root); render(); if(state.view==='card' && state.sess && !state.sess.flipped && state.sess.mode==='see') playSoundVideo(); },
    stop: function(){ try{ stopNative(); cleanupRec(); stopAsr(); if(state.sess){ refreshTools(); } }catch(_){} }
  };
}

"text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">동사변형 힌트</button>` : ''}${quiz.particleHint ? `<button type="button" data-q="hint-particle" class="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">조사 힌트</button>` : ''}</div>` : ''}${st.hintVerb && quiz.verbHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.verbHint)}</p>` : ''}${st.hintParticle && quiz.particleHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.particleHint)}</p>` : ''}</div>` : ''}${quiz.explanation && st.result === 'correct' ? `<p class="mt-4 text-sm font-sans text-green-700 font-medium">✓ Correct. ${esc(quiz.explanation)}</p>` : ''}${quiz.explanation && st.result === 'incorrect' ? '<p class="mt-4 text-sm font-sans text-red-600 font-medium">✕ Try again.</p>' : ''}</div>`;

        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }

                const vsel = e.target.closest('[data-video-idx]');
                if (vsel) { const vi = +vsel.dataset.videoIdx; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; learn.cap = loadCap(); learn.capPrev = null; if (learn.layout === 'script' && !dictation.on) capScriptFull(); learn.revealed = {}; learn.tries = {}; clearSeg(); paint(); } return; }
                if (e.target.closest('.dict-in')) { e.stopPropagation(); return; }   // [받아쓰기]
                const mdb = e.target.closest('[data-md]'); if (mdb) { modeSwitch(mdb.dataset.md); return; }
                const dsc = e.target.closest('[data-dict-scope]'); if (dsc) { dictation.scope = dsc.dataset.dictScope; dictation.ans = {}; dictation.res = {}; dictation.shown = {}; dictation.wrong = {}; dictRefresh(); return; }
                if (e.target.closest('[data-dict-reset]')) { dictation.ans = {}; dictation.res = {}; dictation.shown = {}; dictation.wrong = {}; dictRefresh(); return; }
                const dck = e.target.closest('[data-dict-check]'); if (dck) { e.stopPropagation(); dictCheck(dck.dataset.dictCheck); return; }
                const dsh = e.target.closest('[data-dict-show]'); if (dsh) { e.stopPropagation(); dictation.shown[dsh.dataset.dictShow] = true; replaceLine(dsh.dataset.dictShow); refreshScriptHead(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = curVideo().script.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) { clearSeg(); learn.player.pauseVideo(); } } else playLineOnly(line); return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const capBtn = e.target.closest('[data-cap]'); if (capBtn) { setCap(capBtn.dataset.cap); return; }
                const capAct = e.target.closest('[data-cap-action]'); if (capAct) { learn.revealed = {}; learn.tries = {}; setCap(learn.cap); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { const lid = seekLine.dataset.lineId;
                    if (dictation.on && isYT()) { playLineOnly(curVideo().script.find(l => l.id === lid)); return; }   // [받아쓰기]
                    if (lid && learn.cap !== 'full' && !learn.revealed[lid]) {
                        if (learn.tries[lid]) { learn.revealed[lid] = true; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); refreshScriptHead(); return; }
                        learn.tries[lid] = 1; replaceLine(lid); playLineOnly(curVideo().script.find(l => l.id === lid)); return;
                    } if (learn.player) { clearSeg(); learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]'); const sbHanjaBtn = e.target.closest('[data-action^="sb-hanja-"]');
                if (sb && sbHanjaBtn) { const i = +sb.dataset.sbIdx; learn.sbHanja = learn.sbHanja || {}; learn.sbHanja[i] = !learn.sbHanja[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_VIDEO[i], i); return; }
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans = learn.sbTrans || {}; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_VIDEO[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind') seekBy(-1.5);
                    else if (act === 'forward') seekBy(1.5);
                    else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }
                    else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); }
                    else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); }
                }
                return;
            }
            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx],[data-vocab-term]');
                if (vspan) { e.stopPropagation(); const w = vspan.dataset.vocabTerm ? VOCAB_READING_DATA.find(v => v.term === vspan.dataset.vocabTerm) : VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; if (!w) return; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]'); const sbHanjaBtn = e.target.closest('[data-action="sb-hanja"]');
                if (sb && sbHanjaBtn) { const i = +sb.dataset.sbIdx; const showingH = sb.dataset.hanja === '1'; sb.dataset.hanja = showingH ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], sb.dataset.trans === '1', 'sb-trans', !showingH, 'sb-hanja'); return; }
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans', sb.dataset.hanja === '1', 'sb-hanja'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'audio-toggle') { audioToggle(); return; }
                    if (act === 'audio-skip') { audioSkip(parseFloat(a.dataset.sec)); return; }
                    if (act === 'audio-rate-step') { audioStepRate(a.dataset.delta); return; }
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const i = +a.dataset.idx; reading.trans[i] = !reading.trans[i]; rerenderReadingBlocks(); }
                    return;
                }
            } else if (tab === 'vocab') {
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== vocabView.mode) { vocabView.mode = m; if (slfcApp && m !== 'card') slfcApp.stop(); paint(); } return; }
                if (vocabView.mode === 'card') return;   // 플래시 카드 화면의 클릭은 카드 엔진이 직접 받는다
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-core-all' || a.dataset.action === 'vocab-core-only') { vocabState.coreOnly = a.dataset.action === 'vocab-core-only'; saveCore(vocabState.coreOnly); vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_ALL[i], i, !cur); }
                else if (a.dataset.action === 'vocab-hanja-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const curH = vocabState.itemHanja[i] !== undefined ? vocabState.itemHanja[i] : true; vocabState.itemHanja[i] = !curH; const showT = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; card.outerHTML = vocabItemHTML(VOCAB_ALL[i], i, showT); }
                return;
            } else if (tab === 'quiz') {
                if (QUIZ_LISTEN) { // 듣기 퀴즈
                    const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.q = {}; paint(); return; }
                    const ab = e.target.closest('[data-audio]'); if (ab) { try { if (quizState._audio) quizState._audio.pause(); quizState._audio = new Audio(ab.dataset.audio); quizState._audio.play().catch(function(){}); } catch (_) {} return; }
                    const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = LISTEN_QUIZ.find(q => String(q.id) === String(qid)); const st = quizState.q[qid] || (quizState.q[qid] = { selectedKey: null, solved: false, showHint: false, showTrans: false });
                    const opt = e.target.closest('[data-optkey]'); if (opt) { if (st.solved) return; st.selectedKey = opt.dataset.optkey; if (st.selectedKey === quiz.correctKey) st.solved = true; rerenderQuizQ(qid); updateQuizScore_L(); return; }
                    const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                    const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                    return;
                }
                if (!QUIZ_C) { // a·b 유형: 4지선다
                    const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                    const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                    const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                    const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                    const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                    return;
                }
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => q.id === qid); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const t = st.input.trim(); const ok = [quiz.answer].concat(quiz.altAnswers || [], quiz.altAnswer ? [quiz.altAnswer] : []).indexOf(t) !== -1; st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = quiz.answer; st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'hint-verb') { st.hintVerb = !st.hintVerb; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'hint-particle') { st.hintParticle = !st.hintParticle; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'trans') { st.trans = !st.trans; rerenderQuizQ(qid); }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        appEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && e.target.matches && e.target.matches('.dict-in')) { e.preventDefault(); dictation.ans[e.target.dataset.dict] = e.target.value; dictCheck(e.target.dataset.dict.split('|')[0]); } });   // [받아쓰기]
        appEl.addEventListener('input', (e) => {
            if (e.target.matches && e.target.matches('.dict-in')) { dictation.ans[e.target.dataset.dict] = e.target.value; return; }   // [받아쓰기]
            if (aiHandleInput(e.target)) return;
            if (e.target.id === 'seek') { const t = toReal(parseFloat(e.target.value)); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; updateSeekUI(); return; }
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
        });

        appEl.addEventListener('change', (e) => { aiHandleChange(e.target); });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            if (!aiState.apiKey) { reading.dictResult = null; reading.dictError = null; paint(); return; }
            reading.dictLoading = true; reading.dictResult = null; reading.dictError = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm); }
            catch (err) { reading.dictError = err && err.code ? err : AppError('format'); }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }


        // ---------- 13. 시작 ----------
        aiLoadStore();
        buildApp();
    })();
    </script>
</body>
