/* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}


    .lk-lang{ position:relative; display:inline-flex; align-items:center; }
.lk-lang-btn{ font-family:inherit; font-size:14px; font-weight:500; color:#6b7280; background:transparent; border:0; border-radius:0; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:color .15s; white-space:nowrap; }
.lk-lang-btn:hover{ color:#111; }

            { id: 's11', speaker: '유나', kor: '그러면 그 연구소에서 그 조상, 조상이 어디서 왔는지 알려줘요.', time: [36.0, 42.0], eng: "Then the lab tells you where your ancestors came from." },
            { id: 's12', speaker: '민호', kor: '조상이요?', time: [42.0, 44.0], eng: "Ancestors?" },
            { id: 's13', speaker: '유나', kor: '네, ‘조상’ 아주 옛날 할아버지 할아버지, 네 그런 옛날 가족들이요.', time: [44.0, 50.0], eng: "Yes, 'ancestors,' very old grandfathers, grandfathers, yes, family from long ago." },
            { id: 's14', speaker: '민호', kor: '와 재밌겠다. 내 조상이 어디서 왔는지 아는 거예요?', time: [50.0, 55.0], eng: "Wow, that sounds fun. I can find out where my ancestors came from?" },
            { id: 's15', speaker: '유나', kor: '네, 재밌죠. 근데 이게 조심해야 할 것도 있어요.', time: [55.0, 59.0], eng: "Yes, it's fun. But there are things to be careful about." },
            { id: 's16', speaker: '유나', kor: '100% 다 맞는 건 아니에요.', time: [59.0, 62.0], eng: "It's not 100% correct." },
            { id: 's17', speaker: '민호', kor: '아 정말요? 왜 100%는 아니에요?', time: [62.0, 66.0], eng: "Ah, really? Why isn't it 100%?" },
            { id: 's18', speaker: '유나', kor: '그게 확률로만 알려주거든요.', time: [66.0, 69.5], eng: "That's because it only tells you in probabilities." },
            { id: 's19', speaker: '유나', kor: '’확률’이라는 게 ‘아마도’ 그런 뜻이에요.', time: [69.5, 74.0], eng: "'Probability' means something like 'maybe'." },
            { id: 's20', speaker: '민호', kor: '아마도.', time: [74.0, 75.5], eng: "Maybe." },
            { id: 's21', speaker: '유나', kor: '네, “아마도 당신 조상은 여기 사람일 거예요” 이렇게요.', time: [75.5, 80.0], eng: "Yes, like, \"Maybe your ancestors were from here.\"" },
            { id: 's22', speaker: '유나', kor: '확실한 건 아니구요.', time: [80.0, 82.0], eng: "It's not certain." },
            { id: 's23', speaker: '민호', kor: '그럼 그냥 추측 같은 거네요.', time: [82.0, 85.0], eng: "Then it's just like a guess." },
            { id: 's24', speaker: '유나', kor: '맞아요. 그리고 더 중요한 게, 있잖아요, 모든 사람 DNA는 99.9% 똑같아요.', time: [85.0, 92.0], eng: "That's right. And more importantly, you know, everyone's DNA is 99.9% the same." },
            { id: 's25', speaker: '민호', kor: '99.9%요 진짜요?', time: [92.0, 94.5], eng: "99.9%? Really?" },
            { id: 's26', speaker: '민호', kor: '와, 그럼 우리 다 정말 비슷한 거네요.', time: [94.5, 98.0], eng: "Wow, then we are all really similar." },
            { id: 's27', speaker: '유나', kor: '네 맞아요. 정말 조금만 달라요.', time: [98.0, 101.5], eng: "Yes, that's right. It's only a very little bit different." },
            { id: 's28', speaker: '유나', kor: '그래서 그 인종이란 말도요.', time: [101.5, 104.0], eng: "That's why the word 'race'..." },
            { id: 's29', speaker: '민호', kor: '‘인종’이요?', time: [104.0, 106.0], eng: "'Race'?" },
            { id: 's30', speaker: '유나', kor: '네, 뭐 흑인, 백인, 아시아인 이렇게 나누는 거요.', time: [106.0, 110.0], eng: "Yes, like dividing people into Black, White, Asian." },
            { id: 's31', speaker: '유나', kor: '그게 사실 과학적으로는 음… 아주 정확한 건 아니에요.', time: [110.0, 115.0], eng: "Scientifically, that's... um... not very accurate." },
            { id: 's32', speaker: '민호', kor: '아 그래요?', time: [115.0, 116.5], eng: "Oh, is that so?" },
            { id: 's33', speaker: '유나', kor: '네, 그냥 옛날 사람들이 뭐랄까… 겉모습만 보고 막 나눈 거예요.', time: [116.5, 122.0], eng: "Yes, people in the past just... how should I say... divided people based only on their appearance." },
            { id: 's34', speaker: '유나', kor: 'DNA는 거의 같은데 말이죠.', time: [122.0, 125.0], eng: "Even though their DNA is almost the same." },
            { id: 's35', speaker: '민호', kor: '혹시, 한국 연예인 중에서도 이 검사한 사람 있어요?', time: [125.0, 129.5], eng: "By any chance, are there any Korean celebrities who have done this test?" },
            { id: 's36', speaker: '유나', kor: '네, 네, 있어요. 그 유튜버 조민 씨 알아요?', time: [129.5, 134.0], eng: "Yes, yes, there are. Do you know the YouTuber Jo Min?" },
            { id: 's37', speaker: '민호', kor: '아, 네 들어봤어요.', time: [134.0, 136.0], eng: "Ah, yes, I've heard of him." },
            { id: 's38', speaker: '유나', kor: '그분 할아버지가 약간 인도 사람처럼 보이셨대요.', time: [136.0, 140.0], eng: "His grandfather apparently looked a bit like an Indian person." },
            { id: 's39', speaker: '유나', kor: '그래서 “혹시 나도” 하고 검사를 해봤는데', time: [140.0, 144.0], eng: "So he thought, \"Maybe me too?\" and got tested." },
            { id: 's40', speaker: '민호', kor: '결과가 어떻게 나왔어요?', time: [144.0, 146.5], eng: "How did the results come out?" },
            { id: 's41', speaker: '유나', kor: '100% 한국 사람이었어요.', time: [146.5, 149.0], eng: "He was 100% Korean." },
            { id: 's42', speaker: '유나', kor: '그러니까 겉모습이랑 DNA는 다를 수 있는 거죠.', time: [149.0, 153.0], eng: "So, appearance and DNA can be different." },
            { id: 's43', speaker: '민호', kor: '와 신기하다. 또 다른 사람도 있어요?', time: [153.0, 156.5], eng: "Wow, that's fascinating. Are there any other people?" },
            { id: 's44', speaker: '유나', kor: '가수 솔라 씨는 아프리카 DNA가 0.05% 나왔대요.', time: [156.5, 161.0], eng: "Singer Solar apparently had 0.05% African DNA." },
            { id: 's45', speaker: '민호', kor: '0.05%요? 엄청 조금이네요.', time: [161.0, 164.0], eng: "0.05%? That's a tiny amount." },
            { id: 's46', speaker: '유나', kor: '네, 정말 조금이죠.', time: [164.0, 166.0], eng: "Yes, it's very little." },
            { id: 's47', speaker: '유나', kor: '그래서 아프리카 가 보고 싶다고 했는데, 사실 0.05% 가지고 “나는 아프리카 사람” 이렇게 말하기는 좀 어렵죠.', time: [166.0, 175.0], eng: "She said she wanted to visit Africa, but with 0.05%, it's a bit difficult to say, \"I am an African person.\"" },
            { id: 's48', speaker: '민호', kor: '그렇겠네요. 아 배우 이동욱 씨도 하지 않았어요?', time: [175.0, 179.0], eng: "I see. Ah, didn't actor Lee Dong-wook do it too?" },
            { id: 's49', speaker: '유나', kor: '맞아요. 이동욱 씨는 시베리아 사람 DNA 나왔다고 했어요.', time: [179.0, 184.0], eng: "That's right. Lee Dong-wook said he got Siberian DNA results." },
            { id: 's50', speaker: '유나', kor: '그것도 신기하죠.', time: [184.0, 186.0], eng: "That's fascinating too." },
            { id: 's51', speaker: '민호', kor: '네, 코미디언 박미선 씨는요?', time: [186.0, 189.0], eng: "Yes, and what about comedian Park Mi-sun?" },
            { id: 's52', speaker: '유나', kor: '네, 박미선 씨도 검사하고 나서 “순수한 한국 사람은 아닌 것 같다”고 말했어요.', time: [189.0, 195.0], eng: "Yes, after Park Mi-sun got tested, she said, \"I don't think I'm a 'pure' Korean person.\"" },
            { id: 's53', speaker: '민호', kor: '‘순수한’이요? 그게 무슨 뜻이죠?', time: [195.0, 198.0], eng: "'Pure'? What does that mean?" },
            { id: 's54', speaker: '유나', kor: '‘순수한’은 ‘다른 게 안 섞였다’는 뜻이에요.', time: [198.0, 202.0], eng: "'Pure' means 'not mixed with anything else.'" },
            { id: 's55', speaker: '유나', kor: '근데 있잖아요. 순수한 사람은 없어요.', time: [202.0, 205.0], eng: "But you know what? There's no such thing as a pure person." },
            { id: 's56', speaker: '민호', kor: '아, 정말요?', time: [205.0, 206.5], eng: "Oh, really?" },
            { id: 's57', speaker: '유나', kor: '우리 조상들 쭉 따라가면, 다 여기저기서 왔어요.', time: [206.5, 210.5], eng: "If you trace our ancestors way back, they all came from various places." },
            { id: 's58', speaker: '유나', kor: '우리 DNA는 다 섞여 있어요.', time: [210.5, 213.0], eng: "Our DNA is all mixed." },
            { id: 's59', speaker: '유나', kor: '그게 당연한 거예요.', time: [213.0, 215.0], eng: "That's natural." },
            { id: 's60', speaker: '민호', kor: '그렇구나. 근데 이 검사 뭐 안 좋은 점도 있어요?', time: [215.0, 219.0], eng: "I see. But are there any downsides to this test?" },
            { id: 's61', speaker: '유나', kor: '음… 생각해 볼 점들이 좀 있죠.', time: [219.0, 222.0], eng: "Hmm... there are a few points to consider." },
            { id: 's62', speaker: '유나', kor: '첫째는 사람들이 “DNA가 모든 걸 결정해요” 이렇게 생각할 수 있어요.', time: [222.0, 227.0], eng: "First, people might think, \"DNA decides everything.\"" },
            { id: 's63', speaker: '민호', kor: '결정해요?', time: [227.0, 228.5], eng: "Decides?" },
            { id: 's64', speaker: '유나', kor: '네, 뭐 내 성격이나 능력 같은 거요', time: [228.5, 231.5], eng: "Yes, things like my personality or abilities." },
            { id: 's65', speaker: '유나', kor: '“DNA가 다 결정해요” 이건 아니거든요.', time: [231.5, 235.0], eng: "It's not true that \"DNA decides everything.\"" },
            { id: 's66', speaker: '민호', kor: '아~ 또 있어요?', time: [235.0, 237.0], eng: "Ah~ Are there more?" },
            { id: 's67', speaker: '유나', kor: '둘째는 개인정보 문제요.', time: [237.0, 240.0], eng: "Second is the issue of personal information." },
            { id: 's68', speaker: '유나', kor: '개인정보는 나만 아는 비밀 정보잖아요.', time: [240.0, 244.0], eng: "Personal information is secret information that only I should know." },
            { id: 's69', speaker: '민호', kor: '그렇죠.', time: [244.0, 245.5], eng: "That's right." },
            { id: 's70', speaker: '유나', kor: '근데 이 DNA 정보가 나쁜 사람들한테 갈 수도 있어요.', time: [245.5, 249.5], eng: "But this DNA information could get into the hands of bad people." },
            { id: 's71', speaker: '유나', kor: '실제로 23andMe라는 회사에서 정보가 막 도둑맞기도 했어요.', time: [249.5, 255.0], eng: "Actually, a company called 23andMe had information stolen." },
            { id: 's72', speaker: '민호', kor: '헐 진짜요? 그건 좀 무서운데요.', time: [255.0, 258.0], eng: "Whoa, really? That's a bit scary." },
            { id: 's73', speaker: '유나', kor: '네, 그리고 셋째는 이게 인종차별로 이어질 수도 있다는 거예요.', time: [258.0, 263.0], eng: "Yes, and third, it could lead to racial discrimination." },
            { id: 's74', speaker: '민호', kor: '인종차별이요?', time: [263.0, 265.0], eng: "Racial discrimination?" },
            { id: 's75', speaker: '유나', kor: '네 DNA 결과 보고, “아, 저 인종은 어떻고, 이 인종은 어떻고” 이렇게 사람들을 나누고 나쁘게 생각하는 거예요.', time: [265.0, 273.0], eng: "Yes, looking at DNA results and thinking, \"Ah, that race is like this, and this race is like that,\" dividing people and thinking negatively." },
            { id: 's76', speaker: '유나', kor: '이건 정말 안 좋은 거죠.', time: [273.0, 275.5], eng: "This is really not good." },
            { id: 's77', speaker: '민호', kor: '그럼 이 DNA 검사 결과를 어떻게 받아들여야 할까요?', time: [275.5, 279.5], eng: "Then how should we interpret these DNA test results?" },
            { id: 's78', speaker: '유나', kor: '그냥 재미로 보는 건 괜찮아요.', time: [279.5, 282.0], eng: "It's fine to see it just for fun." },
            { id: 's79', speaker: '유나', kor: '근데 꼭 기억해야 할 게 있어요.', time: [282.0, 284.5], eng: "But there's something you must remember." },
            { id: 's80', speaker: '유나', kor: '나의 ‘정체성’ 있잖아요.', time: [284.5, 287.0], eng: "You know, my 'identity'." },
            { id: 's81', speaker: '민호', kor: '‘정체성’이요?', time: [287.0, 288.5], eng: "'Identity'?" },
            { id: 's82', speaker: '유나', kor: '‘나는 누군가’ 하는 거예요.', time: [288.5, 291.5], eng: "It's the question of 'Who am I?'." },
            { id: 's83', speaker: '유나', kor: '그 답은 DNA에만 있는 게 아니에요.', time: [291.5, 294.0], eng: "The answer isn't only in DNA." },
            { id: 's84', speaker: '민호', kor: '아, DNA가 다가 아니군요.', time: [294.0, 296.5], eng: "Ah, so DNA isn't everything." },
            { id: 's85', speaker: '유나', kor: '그럼요. 내가 어떤 문화를 좋아하고, 어떤 말을 쓰고, 또 어떤 경험을 했는지 이런 게 훨씬 중요해요.', time: [296.5, 303.0], eng: "Of course. What culture I like, what language I use, and what experiences I've had—these things are much more important." },
            { id: 's86', speaker: '민호', kor: '아하.', time: [303.0, 304.0], eng: "Aha." },
            { id: 's87', speaker: '유나', kor: '내가 어떤 사람이고 싶은지, 뭘 좋아하고 어떻게 사는지, 이게 바로 나의 정체성을 만드는 거예요.', time: [304.0, 310.0], eng: "Who I want to be, what I like, and how I live—this is what creates my identity." },
            { id: 's88', speaker: '민호', kor: '네, 맞는 말이네요.', time: [310.0, 312.0], eng: "Yes, that makes sense." },
            { id: 's89', speaker: '유나', kor: '그리고 우리는 모두 DNA가 99.9% 같다는 거 이것도 기억하면 좋구요.', time: [312.0, 316.5], eng: "And it's also good to remember that we are all 99.9% the same." },
            { id: 's90', speaker: '유나', kor: '결과가 어떻든 사람은 다 소중해요.', time: [316.5, 319.0], eng: "Whatever the results, everyone is precious." },
            { id: 's91', speaker: '민호', kor: '오늘 이야기 정말 잘 들었어요. 고마워요.', time: [319.0, 322.0], eng: "I really enjoyed today's talk. Thank you." },
            { id: 's92', speaker: '유나', kor: '네, DNA 검사 재미있지만 너무 막 믿지는 마세요.', time: [322.0, 326.0], eng: "Yes, DNA tests are fun, but don't just believe them blindly." },
            { id: 's93', speaker: '유나', kor: '오늘 좀 어려운 단어 있었죠.', time: [326.0, 328.5], eng: "There were some difficult words today, right?" },
            { id: 's94', speaker: '유나', kor: 'DNA, 조상, 확률, 인종, 순수한, 결정해요, 개인정보, 인종차별, 정체성.', time: [328.5, 338.0], eng: "DNA, ancestors, probability, race, pure, decides, personal information, racial discrimination, identity." },
            { id: 's95', speaker: '유나', kor: '한번 다시 생각해 보세요.', time: [338.0, 340.5], eng: "Please think about them again." },
            { id: 's96', speaker: '민호', kor: '네, 알겠어요. <오늘 이 주제로 이야기해 봐요> 여기까지예요.', time: [340.5, 344.0], eng: "Yes, I will. This has been <Let's Talk About This Topic>." },
            { id: 's97', speaker: '민호', kor: '다음 시간에도 흥미로운 주제로 다시 찾아올게요.', time: [344.0, 347.0], eng: "We'll be back next time with another interesting topic." },
            { id: 's98', speaker: '민호', kor: '안녕히 계세요.', time: [347.0, 349.0], eng: "Goodbye." },
            { id: 's99', speaker: '유나', kor: '안녕히 계세요. 다음 시간에 또 만나요?', time: [349.0, 352.0], eng: "Goodbye. See you again next time." }
        ];

        const QUIZ_LIST = [
            { id: 1, questionKor: "빈칸에 알맞은 말을 고르세요.", questionEng: "Choose the correct word for the blank.", sentence_pre: "DNA는 우리 몸 안에 있는 ", sentence_post: "예요.", correct_word: "정보", translation: "DNA is the information inside our bodies.", hint: "information", options: [{ text: "성격", isCorrect: false, feedback: "다시 시도해 보세요." }, { text: "정체성", isCorrect: false, feedback: "다시 시도해 보세요." }, { text: "능력", isCorrect: false, feedback: "다시 시도해 보세요." }, { text: "정보", isCorrect: true, feedback: "The dialogue begins by defining DNA as the information contained within our bodies." }] },

            return `<div class="sticky top-0 z-40 h-16 flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200 shadow-sm pr-14 print:hidden"><div class="flex items-center gap-1 shrink-0">${modeBtns}</div><div class="flex items-center gap-4 flex-1 justify-end min-w-0"><div class="hidden sm:flex items-center gap-4 flex-1 max-w-xl justify-end"><div class="hidden md:flex flex-col flex-1 gap-1 w-full"><div class="relative group h-2 flex items-center"><div class="absolute inset-0 flex items-center"><div class="w-full h-[1px] bg-gray-200"></div><div id="seek-fill" class="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-black" style="width:0%"></div></div><input id="seek" type="range" min="0" max="100" value="0" class="absolute inset-0 w-full opacity-0 cursor-pointer"/></div><span id="time-text" class="text-[10px] font-mono text-gray-400 text-right leading-none">00:00 / 00:00</span></div><div class="hidden sm:flex items-center gap-3 shrink-0"><button type="button" data-action="rewind" class="text-gray-400 hover:text-black transition-colors">${svgIcon('rewind', 'w-4 h-4')}</button><button type="button" id="play-btn" data-action="play" class="w-6 h-6 border border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all">${svgIcon('playSolid', 'w-2.5 h-2.5 ml-0.5', { fill: 'currentColor' })}</button><button type="button" data-action="forward" class="text-gray-400 hover:text-black transition-colors">${svgIcon('forward', 'w-4 h-4')}</button></div></div><div class="h-4 w-px bg-gray-200 hidden sm:block"></div><div class="relative shrink-0 hidden sm:flex"><button type="button" data-action="speed-menu" class="flex items-center gap-1.5 text-xs font-bold font-ui uppercase tracking-wider text-gray-500 hover:text-black">${learn.rate.toFixed(1)}x</button>${speedMenu}</div><button type="button" data-action="autoscroll" class="hidden sm:flex items-center gap-2 text-[10px] font-bold font-ui uppercase tracking-widest transition-colors ${learn.autoScroll ? 'text-black' : 'text-gray-300 hover:text-gray-500'}"><span class="w-2 h-2 rounded-full ${learn.autoScroll ? 'bg-black' : 'border border-gray-300'}"></span><span class="hidden md:inline">${secLang() ? 'Auto Scroll' : '자동 스크롤'}</span><span class="md:hidden">${secLang() ? 'Scroll' : '스크롤'}</span></button><button type="button" data-action="learn-vocab" class="hidden xl:flex items-center gap-2 px-3 py-1.5 border transition-all text-[10px] font-bold font-ui uppercase tracking-widest ${learn.showVocab ? 'bg-black text-white border-black' : 'bg-white border-gray-200 text-gray-500 hover:border-black hover:text-black'}">${secLang() ? 'Vocabulary' : '어휘'}</button></div></div>`;

        function afterVideoPaint() { createPlayer(); const seek = qs('#seek', viewRoot()); if (seek) seek.addEventListener('input', (e) => { const t = parseFloat(e.target.value); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; updateSeekUI(); }); }
        function createPlayer() {
            let made = false; const make = () => { if (made || !(window.YT && window.YT.Player)) return; made = true; new window.YT.Player('youtube-player', { videoId: VIDEO_CONFIG.YOUTUBE_VIDEO_ID, width: '100%', height: '100%', playerVars: { autoplay: 0, controls: 1, rel: 0, disablekb: 1 }, events: { onReady: (e) => { learn.player = e.target; learn.duration = e.target.getDuration() || 0; const s = qs('#video-loading'); if (s) s.style.display = 'none'; if (learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); updateSeekUI(); }, onStateChange: (e) => { if (e.data === window.YT.PlayerState.PLAYING) { startTick(); learn.isPlaying = true; updatePlayBtn(); } else { stopTick(); if (e.data === window.YT.PlayerState.PAUSED || e.data === window.YT.PlayerState.ENDED) { learn.isPlaying = false; updatePlayBtn(); } } } } }); };
            if (window.YT && window.YT.Player) make();
            else { if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) { const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); } const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') try { prev(); } catch (_) {} if (app.activeTab === 'video') make(); }; const poll = setInterval(() => { if (window.YT && window.YT.Player) { clearInterval(poll); if (app.activeTab === 'video' && !learn.player) make(); } }, 150); setTimeout(() => clearInterval(poll), 10000); }
        }
        function startTick() { stopTick(); learn.intervalId = setInterval(() => { const p = learn.player; if (p && p.getCurrentTime) { learn.currentTime = p.getCurrentTime(); updateSeekUI(); const cl = VIDEO_SCRIPT_DATA.find(l => learn.currentTime >= l.time[0] && learn.currentTime < l.time[1]); if (cl && cl.id !== learn.activeLine) setActiveLine(cl.id); } }, 200); }
        function stopTick() { if (learn.intervalId) { clearInterval(learn.intervalId); learn.intervalId = null; } }
        function updateSeekUI() { const root = viewRoot(); if (!root) return; const fill = qs('#seek-fill', root), tt = qs('#time-text', root), seek = qs('#seek', root); const pct = learn.duration ? (learn.currentTime / learn.duration) * 100 : 0; if (fill) fill.style.width = pct + '%'; if (tt) tt.textContent = `${fmt(learn.currentTime)} / ${fmt(learn.duration)}`; if (seek) { seek.max = learn.duration || 100; seek.value = learn.currentTime; } }

        function updatePanes() { const root = viewRoot(); if (!root) return; const vp = qs('#video-pane', root), sp = qs('#script-pane', root), vop = qs('#vocab-pane', root); if (vp) vp.className = videoPaneClass(); if (sp) sp.className = scriptPaneClass(); if (vop) vop.className = vocabPaneClass(); const sl = qs('#script-list', root); if (sl) sl.className = (learn.layout === 'script' ? 'w-full mx-auto p-4 sm:p-8 min-h-full bg-white shadow-sm my-8 max-w-4xl lg:max-w-5xl' : 'p-8 space-y-8'); }

        // ---------- VOCAB (b2: 펼치기형 예문) ----------

        // ---------- QUIZ (객관식) ----------
        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 힌트<span class="lk-en"> · Hint</span>: ${esc(quiz.hint)}</div>` : ''}</div>`;

        function quizHTML() {

        function feedbackSectionHTML(titleKor, titleEng, contentHTML, isCorrection) { return `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">${esc(titleKor)} <span class="font-eng-header font-medium text-[9px]">${esc(titleEng)}</span></h4><p class="${isCorrection ? 'text-[15px] md:text-base font-serif text-gray-900 leading-relaxed font-medium bg-white p-4 border border-gray-200 shadow-sm rounded-sm' : 'text-[13px] md:text-sm font-sans text-gray-700 leading-relaxed whitespace-pre-wrap'}">${contentHTML}</p></div>`; }
        function discussItemHTML(item) {

            const vocab = (item.vocab||[]).map(v => `<p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>`).join('');

                fb = `<div class="mt-8 p-6 bg-gray-50 border border-gray-200 rounded-sm animate-fade-in relative"><div class="flex items-center gap-2 mb-6 pb-4 border-b border-gray-200">${svgIcon('sparkles', 'w-5 h-5 text-gray-900', { fill: 'currentColor' })}<span class="text-xs font-bold font-sans text-gray-900 uppercase tracking-widest">${secLang() ? 'AI Teacher Feedback' : 'AI 선생님 피드백'}</span></div><div class="space-y-8">${feedbackSectionHTML('피드백', 'FEEDBACK', renderFormatted(fd.feedback))}${feedbackSectionHTML('모범 답안', 'CORRECTION', esc(fd.correction), true)}${details}</div><div class="mt-8 pt-4 border-t border-gray-200"><p class="text-[10px] text-gray-400 font-sans text-center">※ AI가 생성한 피드백이므로 간혹 부자연스럽거나 오류가 있을 수 있습니다.</p></div></div>`;
            }
            const disabled = (!st.text.trim() || st.generating);
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal whitespace-pre-line">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14"><div class="flex gap-2 mb-4">${transBtn('discuss-qtrans', st.showTrans)}${st.showTrans ? `<p class="text-sm font-sans text-gray-500 animate-fade-in whitespace-pre-line">${esc(item.questionEng)}</p>` : ''}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block tracking-widest">${secLang() ? 'Key Vocabulary' : '핵심 어휘'}</span><div class="space-y-1">${vocab}</div></div><textarea data-action="discuss-text" placeholder="${secLang() ? '여기에 생각을 적어보세요... / Write your thoughts here...' : '여기에 생각을 적어보세요...'}" class="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300">${esc(st.text)}</textarea><div class="flex justify-end"><button type="button" data-action="discuss-feedback" ${disabled ? 'disabled' : ''} class="px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${disabled ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}">${st.generating ? '<div class="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></div>생성 중<span class="lk-en"> · Generating...</span>' : 'AI 피드백 받기<span class="lk-en"> · Get AI Feedback</span>'}</button></div>${fb}</div></div>`;
        }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">생각해 보기</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Food For Thought</span></div><div class="bg-gray-50 border border-gray-200 py-4 px-5 mb-24 md:mb-32 rounded-none flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div class="flex gap-4 items-center"><div class="shrink-0 text-gray-400">${svgIcon('sparkles', 'w-5 h-5', { fill: 'currentColor' })}</div><div class="flex flex-col"><p class="text-xs font-bold font-sans text-gray-800 leading-tight">AI 피드백은 현재 Gemini 웹에서만 가능합니다.</p><p class="lk-en text-[10px] font-sans text-gray-400 mt-1">AI feedback is currently available only on Gemini web.</p></div></div><a href="https://gemini.google.com/share/af64b51f8680" target="_blank" rel="noreferrer" class="group flex flex-col items-center justify-center bg-white py-1.5 px-3 shadow-sm hover:shadow transition-all shrink-0 no-underline rounded-none border border-gray-100"><div class="flex items-center gap-1"><span class="text-[11px] font-bold font-sans text-gray-700 group-hover:text-black">Gemini에서 열기</span>${svgIcon('externalLink', 'w-3 h-3 text-gray-400 group-hover:text-black')}</div><span class="lk-en text-[9px] font-sans text-gray-400 group-hover:text-gray-600 uppercase tracking-widest mt-0.5">Open in Gemini</span></a></div><div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;
        }
        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }


        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);
            if (out.length) return out;
            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            const hasVideos = (typeof VIDEOS !== 'undefined' && VIDEOS.length && VIDEOS[0].script && VIDEOS[0].script.length);
            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);
            if (typeof READING_DATA !== 'undefined' && Array.isArray(READING_DATA) && READING_DATA.length) s.push(['reading', '읽기 자료']);
            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);
            if (typeof QUIZ_LIST !== 'undefined' && Array.isArray(QUIZ_LIST) && QUIZ_LIST.length) s.push(['quiz', '내용 확인 퀴즈']);
            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;
        }
        function pwScriptHTML() {
            const vids = (typeof VIDEOS !== 'undefined' && VIDEOS.length) ? VIDEOS : [{ title: '', script: (typeof VIDEO_SCRIPT_DATA !== 'undefined' ? VIDEO_SCRIPT_DATA : []) }];
            return vids.map(v => `${(vids.length > 1 && v.title) ? `<div class="pw-part-title">${esc(v.title)}${v.subTitle ? ' · ' + esc(v.subTitle) : ''}</div>` : ''}${(v.script || []).map(l => `<div class="pw-line"><div class="pw-kor"><span class="pw-spk">${esc(l.speaker || '')}</span>${esc(l.kor || '')}</div>${l.eng ? `<div class="pw-eng">${esc(l.eng)}</div>` : ''}</div>`).join('')}`).join('');
        }
        function pwReadingHTML() {
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')}</div>${r.subtitle ? `<div class="pw-read-sub">${esc(r.subtitle)}</div>` : ''}${(r.content || []).filter(p => !p.isChart).map(p => p.isHeading ? `<div class="pw-read-h">${esc(p.text || '')}</div>` : `<div class="pw-read-p">${esc(p.text || '')}</div>`).join('')}`).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });

        // ---------- 이벤트 위임 ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const _sl = e.target.closest('[data-setlang]');
            if (_sl) { app.lang = _sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            const _wasLangOpen = app.langOpen; app.langOpen = false;
            if (_wasLangOpen && !e.target.closest('[data-tab],[data-action],[data-line-play],[data-line-seek],[data-vocab-idx],[data-layout]')) { buildApp(); return; }
            const tab = app.activeTab;
            if (tab === 'video') {
                const vspan = e.target.closest('[data-vocab-idx]'); if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) closeVocabPopup(); else showVocabPopup(w, r.left + r.width / 2, r.bottom, true); return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = VIDEO_SCRIPT_DATA.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'), sbBtn = e.target.closest('[data-action^="sb-trans-"]'); if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) { const act = a.dataset.action; if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } } else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); } else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); } else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); } }
                return;
            }
            if (tab === 'vocab') { const card = e.target.closest('[data-vidx]'); const exBtn = e.target.closest('[data-action="vocab-ex"]'); if (card && exBtn) { const i = +card.dataset.vidx; vocabExpand[i] = !vocabExpand[i]; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i); } return; }
            if (tab === 'quiz') {
                const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return; const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return; if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = VIDEO_SCRIPT_DATA.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < VIDEO_SCRIPT_DATA.length && learn.player) { learn.player.seekTo(VIDEO_SCRIPT_DATA[ni].time[0], true); learn.player.playVideo(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.generating) return; st.generating = true; st.error = ''; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id); const lvl = app.userLevel;
            const beginner = ['A1', 'A1+', 'A2', 'A2+', 'B1', 'B1+'].includes(lvl);
            const instr = beginner ? `The student's level is ${lvl}. Write 'feedback' in ENGLISH; 'correction' in natural Korean; 'detailed_corrections' explanations in ENGLISH, wrapping Korean words in **bold**.` : `학생 레벨은 ${lvl}. 모든 필드를 한국어로만 작성. explanation 안 한국어 강조는 **단어** 사용.`;
            const vocabCtx = item.vocab ? (item.vocab||[]).map(v => `- ${v.term}: ${v.def}`).join('\n') : '없음';
            const sys = `당신은 한국어 선생님입니다.\n${instr}\n맞춤법·띄어쓰기·문법 오류를 찾고, 'correction'은 해요체로. JSON만 응답(마크다운 금지): {"feedback":"","correction":"","detailed_corrections":[{"original":"","corrected":"","explanation":""}]}\n[핵심 어휘]\n${vocabCtx}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: `${sys}\n\n질문: "${item.questionKor}"\n학생 답변: "${st.text}"` }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const r = await callGeminiWithBackoff(payload); const txt = r.candidates && r.candidates[0] && r.candidates[0].content.parts[0].text; if (!txt) throw new Error('피드백을 생성하지 못했습니다.'); st.feedback = JSON.parse(txt.replace(/^```(json)?\n?/, '').replace(/\n?```$/, '').trim()); }
            catch (err) { st.error = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.'; }
            finally { st.generating = false; rerenderDiscussItem(id); }
        }

        buildApp();
    })();
    </script>
