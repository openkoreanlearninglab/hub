            { id: 's1', speaker: '줍스', kor: '오늘 주식을 팔았는데 왜 돈은 내일이 아니라 모레 들어올까요?', time: [2.100, 6.300], eng: "I sold my stocks today, so why does the money come in the day after tomorrow instead of tomorrow?" },
            { id: 's2', speaker: '줍스', kor: '이 단순한 질문이 청와대 간담회 한가운데를 뚫고 들어왔어요.', time: [6.300, 11.400], eng: "This simple question took center stage at the Blue House town hall meeting." },
            { id: 's3', speaker: '줍스', kor: '대통령이 직접 왜 그러냐고 물어봤거든요.', time: [11.400, 14.300], eng: "Because the President himself asked why that was the case." },
            { id: 's4', speaker: '줍스', kor: '2026년 3월 18일 청와대에서 자본시장 정상화 간담회가 열렸어요.', time: [14.300, 20.300], eng: "On March 18th, 2026, the Blue House hosted a briefing on normalizing the capital market." },
            { id: 's5', speaker: '줍스', kor: '결제 주기 단축, 주가 조작 근절, 코스닥 1·2부 리그 분리까지 굵직한 정책들이 한꺼번에 쏟아진 날이에요.', time: [20.300, 29.100], eng: "It was a day when major policies poured out all at once—from shortening the settlement cycle and eradicating stock manipulation, to splitting the KOSDAQ into two separate leagues." },
            { id: 's6', speaker: '줍스', kor: '오늘은 이 정책들이 실제 투자자에게 어떤 의미인지 같이 뜯어볼게요.', time: [29.100, 34.200], eng: "Today, let's break down what these policies actually mean for real investors." },
            { id: 's7', speaker: '줍스', kor: '이재명 대통령은 이렇게 말했어요.', time: [34.200, 36.800], eng: "President Lee Jae-myung put it this way:" },
            { id: 's8', speaker: '줍스', kor: '똑같은 주식, 똑같은 회사인데 한국에 상장됐다는 이유로 수십 년간 할인이 됐다고요.', time: [36.800, 43.300], eng: "Even though it's the exact same stock and the exact same company, it's been trading at a discount for decades simply because it's listed in Korea." },
            { id: 's9', speaker: '줍스', kor: '이게 바로 코리아 디스카운트예요.', time: [43.300, 45.800], eng: "This is exactly what we call the 'Korea Discount'." },
            { id: 's10', speaker: '줍스', kor: '같은 물건인데 한국 딱지가 붙으면 더 싸게 팔리는 현상이죠.', time: [45.800, 51.000], eng: "It's the phenomenon where the exact same item is sold cheaper just because it has a 'Korea' label on it." },
            { id: 's11', speaker: '줍스', kor: '코리아 디스카운트 원인은 크게 네 가지예요.', time: [51.000, 53.600], eng: "There are four main causes behind the Korea Discount." },
            { id: 's12', speaker: '줍스', kor: '지배구조 문제, 시장의 불투명성과 불공정성, 정책의 예측 불가능성, 마지막으로 지정학적 리스크예요.', time: [53.600, 62.300], eng: "Corporate governance issues, market opacity and unfairness, policy unpredictability, and finally, geopolitical risks." },
            { id: 's13', speaker: '줍스', kor: '이 네 가지가 합쳐지면 외국 투자자 입장에서는 “그냥 다른 나라 사고 말지”가 돼요.', time: [62.300, 68.100], eng: "When you combine these four, foreign investors basically think, 'I'd rather just buy stocks in another country.'" },
            { id: 's14', speaker: '줍스', kor: '그중에서도 가장 황당한 사례가 PBR 0.3에서 0.4짜리 기업들이에요.', time: [68.100, 74.100], eng: "Among these, the most absurd examples are companies with a PBR (Price-to-Book Ratio) of 0.3 to 0.4." },
            { id: 's15', speaker: '줍스', kor: 'PBR, 주가순자산비율, 쉽게 말해 지금 당장 회사를 청산하면 투자금 대비 얼마를 돌려받냐는 지표예요.', time: [74.100, 83.000], eng: "PBR, simply put, is an indicator of how much of your investment you'd get back if the company were to be liquidated right now." },
            { id: 's16', speaker: '줍스', kor: '0.3이면 지금 주가로 사서 그냥 문 닫아도 두 배 넘게 남는다는 얘기예요.', time: [83.000, 88.700], eng: "A PBR of 0.3 means that if you buy at the current stock price and the company just shuts down, you'd still more than double your money." },
            { id: 's17', speaker: '줍스', kor: '이게 정상적인 시장이에요?', time: [88.700, 90.800], eng: "Does this look like a normal market to you?" },
            { id: 's18', speaker: '줍스', kor: '이 대통령은 썩은 물건과 제대로 된 물건이 섞여 있으면 그 가게는 가기 싫게 된다고 했어요.', time: [90.800, 97.800], eng: "President Lee mentioned that if rotten goods are mixed with good ones, people won't want to visit that store." },
            { id: 's19', speaker: '줍스', kor: '부실 기업과 우량 기업이 한 시장에 뒤섞여 있으면 시장 전체가 할인받는 거예요.', time: [97.800, 103.200], eng: "When failing companies are jumbled together with blue-chip companies in one market, the entire market gets discounted." },
            { id: 's20', speaker: '줍스', kor: '결국 우량 기업 주주들이 피해를 보는 구조예요.', time: [103.200, 106.400], eng: "Ultimately, it's a structure where the shareholders of good companies end up taking the hit." },
            { id: 's21', speaker: '줍스', kor: '그러면 여기서 드는 의문이 하나 있죠.', time: [106.400, 109.000], eng: "So, that brings up an obvious question." },
            { id: 's22', speaker: '줍스', kor: '수십 년 된 이 문제를 왜 지금 이렇게 강하게 밀어붙이는 걸까요?', time: [109.000, 114.000], eng: "Why are they pushing so hard right now to fix a problem that's been around for decades?" },
            { id: 's23', speaker: '줍스', kor: '사실 코스피가 최근 6000을 넘나들며 역사적 고점 부근까지 왔어요.', time: [114.000, 119.100], eng: "Actually, the KOSPI has recently been flirting with the 6,000 mark, nearing its all-time highs." },
            { id: 's24', speaker: '줍스', kor: '지금 이 구조를 바꿀 골든타임이라는 판단이에요.', time: [119.100, 122.500], eng: "The government has determined that right now is the golden hour to change this structure." },
            { id: 's25', speaker: '줍스', kor: '자, 이제 첫 번째 핵심 정책으로 가볼게요.', time: [122.500, 126.270], eng: "Alright, let's move on to the first core policy." },
            { id: 's26', speaker: '줍스', kor: '‘결제 주기 단축’이에요.', time: [126.300, 127.980], eng: "It's 'shortening the settlement cycle'." },
            { id: 's27', speaker: '줍스', kor: '지금 한국은 T+2 시스템이에요.', time: [128.020, 130.600], eng: "Currently, Korea runs on a T+2 system." },
            { id: 's28', speaker: '줍스', kor: 'T는 거래일. 그러니까 오늘 팔면 2영업일 뒤에 돈이 들어와요.', time: [130.600, 135.400], eng: "'T' stands for trade date. So, if you sell today, the money comes in two business days later." },
            { id: 's29', speaker: '줍스', kor: '실제로는 거래한 날 포함해서 3일째 날에 받는 거예요.', time: [135.400, 139.900], eng: "In reality, counting the day of the trade, you receive it on the third day." },
            { id: 's30', speaker: '줍스', kor: '전산화 이전에는 T+5, 즉 5일을 기다려야 했어요.', time: [139.900, 144.100], eng: "Before digitalization, it was T+5, meaning you had to wait five days." },
            { id: 's31', speaker: '줍스', kor: '실물 주권을 우편으로 주고받던 시절 얘기예요.', time: [144.100, 147.840], eng: "That's back when physical stock certificates were exchanged by mail." },
            { id: 's32', speaker: '줍스', kor: '이후 전산화되면서 줄어들었고,', time: [147.870, 150.090], eng: "The time was reduced as things became computerized," },
            { id: 's33', speaker: '줍스', kor: '주식 거래가 성사되면,', time: [150.120, 151.610], eng: "but even now, once a stock trade is executed," },
            { id: 's34', speaker: '줍스', kor: '지금도 증권사, 거래소, 예탁결제원이 순서대로 개입해 확인하는 과정이 필요해요.', time: [151.640, 157.620], eng: "it still requires a step-by-step verification process involving the brokerage, the exchange, and the depository." },
            { id: 's35', speaker: '줍스', kor: '이 과정에 시간이 걸리는 거예요.', time: [157.640, 159.890], eng: "This whole process is what takes time." },
            { id: 's36', speaker: '줍스', kor: '그런데 세상이 달라졌어요.', time: [159.900, 161.890], eng: "However, the world has changed." },
            { id: 's37', speaker: '줍스', kor: '미국은 2024년 T+2에서 T+1로 바꿨고,', time: [161.930, 166.380], eng: "The U.S. switched from T+2 to T+1 in 2024," },
            { id: 's38', speaker: '줍스', kor: '캐나다·인도도 이미 T+1이에요.', time: [166.420, 168.800], eng: "and Canada and India are already on T+1." },
            { id: 's39', speaker: '줍스', kor: '유럽도 내년 10월부터 T+1 도입을 추진해요.', time: [168.800, 172.500], eng: "Europe is also pushing to adopt T+1 starting next October." },
            { id: 's40', speaker: '줍스', kor: '글로벌 스탠다드가 T+1로 이동하고 있는 거예요.', time: [172.500, 176.000], eng: "The global standard is shifting toward T+1." },
            { id: 's41', speaker: '줍스', kor: '한국만 T+2에 머물러 있으면 뒤처지는 거죠.', time: [176.000, 179.700], eng: "If only Korea stays stuck at T+2, we'll fall behind." },
            { id: 's42', speaker: '줍스', kor: 'T+1이 되면 투자자에게 뭐가 좋을까요?', time: [179.700, 182.600], eng: "So, what's in it for investors if we move to T+1?" },
            { id: 's43', speaker: '줍스', kor: '팔고 나서 다음 날 바로 다른 주식을 살 수 있어요.', time: [182.600, 186.000], eng: "After selling, you can buy another stock the very next day." },
            { id: 's44', speaker: '줍스', kor: '자금이 더 빠르게 돌아요.', time: [186.000, 187.800], eng: "Your money circulates much faster." },
            { id: 's45', speaker: '줍스', kor: '결제 불이행 리스크도 줄고 증거금 부담도 낮아져요.', time: [187.800, 191.700], eng: "The risk of settlement failure decreases, and the margin burden is lowered." },
            { id: 's46', speaker: '줍스', kor: '투자 사이클이 빨라지는 거예요.', time: [191.700, 193.900], eng: "The entire investment cycle speeds up." },
            { id: 's47', speaker: '줍스', kor: '물론 신중론도 있어요.', time: [193.900, 195.500], eng: "Of course, there are also cautious voices." },
            { id: 's48', speaker: '줍스', kor: '외국인 투자자 입장에서는 불편해질 수 있거든요.', time: [195.500, 199.000], eng: "From a foreign investor's perspective, it could become inconvenient." },
            { id: 's49', speaker: '줍스', kor: '한국 주식을 사려면 원화로 환전해야 하는데,', time: [199.100, 202.100], eng: "To buy Korean stocks, they need to exchange their money into Korean Won," },
            { id: 's50', speaker: '줍스', kor: '결제 시간이 줄면 그 환전 과정을 훨씬 빠르게 처리해야 해요.', time: [202.140, 206.800], eng: "and a shorter settlement time means that currency exchange process has to be handled much faster." },
            { id: 's51', speaker: '줍스', kor: '해외 결제 부서의 업무 부담이 늘어날 수 있다는 얘기예요.', time: [206.800, 210.000], eng: "This could increase the workload for overseas settlement departments." },
            { id: 's52', speaker: '줍스', kor: '하지만 금융당국은 아시아 주요국들도 함께 T+1을 추진하고 있어서', time: [210.000, 215.100], eng: "However, financial authorities believe that because major Asian countries are pushing for T+1 together," },
            { id: 's53', speaker: '줍스', kor: '외국인 투자자의 혼선은 최소화될 거라고 봐요.', time: [215.100, 218.100], eng: "the confusion for foreign investors will be minimized." },
            { id: 's54', speaker: '줍스', kor: '거래소와 예탁결제원은 작년부터 이미 워킹그룹을 만들어 실무 논의를 해 왔어요.', time: [218.100, 223.900], eng: "The stock exchange and depository have already been running a working group for practical discussions since last year." },
            { id: 's55', speaker: '줍스', kor: '대통령 발언이 속도를 낸 거예요.', time: [223.900, 226.300], eng: "The President's remarks just hit the gas pedal." },
            { id: 's56', speaker: '줍스', kor: '두 번째 핵심 주가 조작 완전 퇴출이에요.', time: [226.300, 229.700], eng: "The second core policy is the complete eradication of stock manipulation." },
            { id: 's57', speaker: '줍스', kor: '이 대통령은 \'주가 조작 = 패가망신\'이라는 원칙을 재확인했어요.', time: [229.700, 235.000], eng: "President Lee reaffirmed the principle that 'stock manipulation equals utter ruin'." },
            { id: 's58', speaker: '줍스', kor: '원금 전액 몰수에 신고자한테는 총액 제한 없이 30% 포상을 줘요.', time: [235.000, 241.000], eng: "The principal investment is fully confiscated, and whistleblowers are given a 30% reward with no upper limit." },
            { id: 's59', speaker: '줍스', kor: '직접 가담했어도 신고하면, 포상하고 처벌을 감면해 줘요.', time: [241.000, 244.900], eng: "Even if you were directly involved, if you blow the whistle, you get the reward and a reduced sentence." },
            { id: 's60', speaker: '줍스', kor: '이게 왜 중요하냐고요?', time: [244.900, 246.700], eng: "Why is this so important?" },
            { id: 's61', speaker: '줍스', kor: '주가 조작이 횡행하면 시장 가격 자체가 신뢰받지 못해요.', time: [246.700, 250.700], eng: "When stock manipulation runs rampant, market prices themselves lose credibility." },
            { id: 's62', speaker: '줍스', kor: '외국 투자자들이 한국 주식을 꺼리는 이유 중 하나가 "저 주가가 진짜인지 가짜인지 모르겠다”는 불신이에요.', time: [250.700, 258.100], eng: "One of the reasons foreign investors shy away from Korean stocks is the distrust that 'we can't tell if that stock price is real or fake.'" },
            { id: 's63', speaker: '줍스', kor: '조작이 없어지면 가격 신호 자체가 살아나는 거예요.', time: [258.100, 261.500], eng: "If manipulation disappears, the price signals themselves will come back to life." },
            { id: 's64', speaker: '줍스', kor: '세 번째, 코스닥 대수술이에요.', time: [261.500, 264.100], eng: "Third is the major overhaul of the KOSDAQ." },
            { id: 's65', speaker: '줍스', kor: '금융위원회가 코스닥을 1부와 2부 리그로 분리하는 승강제를 도입해요.', time: [264.100, 269.000], eng: "The Financial Services Commission is introducing a promotion and relegation system, splitting KOSDAQ into a first and second league." },
            { id: 's66', speaker: '줍스', kor: '시총 상위 80-170개 기업은 프리미엄 영역, 나머지는 스탠다드 영역으로 분류하고,', time: [269.000, 275.470], eng: "The top 80 to 170 companies by market cap will be classified in a 'Premium' tier, the rest in a 'Standard' tier," },
            { id: 's67', speaker: '줍스', kor: '상장 폐지 우려 기업은 관리군으로 따로 빼요.', time: [275.500, 278.200], eng: "and companies at risk of delisting will be separated into an 'under-management' group." },
            { id: 's68', speaker: '줍스', kor: '프리미엄 영역 기업들에게는 영문 공시 같은 엄격한 요건이 적용돼요.', time: [278.200, 283.100], eng: "Strict requirements, such as mandatory English disclosures, will be applied to companies in the Premium tier." },
            { id: 's69', speaker: '줍스', kor: '최상위 기업 중심 신규 지수도 만들고 ETF도 출시해요.', time: [283.100, 287.800], eng: "They'll also create a new index focused on top-tier companies and launch associated ETFs." },
            { id: 's70', speaker: '줍스', kor: '투자자 입장에서는 이 기업은 "코스닥 1부야"라는 명확한 기준이 생기는 거예요.', time: [287.800, 292.900], eng: "From an investor's perspective, this creates a clear standard: 'This company is in the KOSDAQ 1st league.'" },
            { id: 's71', speaker: '줍스', kor: '옥석 가리기가 훨씬 쉬워져요.', time: [292.900, 295.200], eng: "Sorting the wheat from the chaff becomes much easier." },
            { id: 's72', speaker: '줍스', kor: '중복 상장도 원칙적으로 금지돼요.', time: [295.200, 298.370], eng: "Double-listing will also be banned in principle." },
            { id: 's73', speaker: '줍스', kor: '상장된 회사가 알짜 사업 부문을 떼어내서 따로 상장하는 행위를 막겠다는 거예요.', time: [298.400, 303.500], eng: "The goal is to stop listed companies from carving out their most profitable divisions and listing them separately." },
            { id: 's74', speaker: '줍스', kor: '내가 투자한 회사의 핵심 자산이 별도 법인으로 쪼개지면,', time: [303.500, 307.400], eng: "Because if the core asset of a company I invested in gets split off into a separate entity," },
            { id: 's75', speaker: '줍스', kor: '내가 가진 주식의 가치는 자연스럽게 희석되거든요.', time: [307.430, 310.850], eng: "the value of my shares naturally gets diluted." },
            { id: 's76', speaker: '줍스', kor: '이걸 막겠다는 얘기예요.', time: [310.500, 312.200], eng: "This is what they're trying to prevent." },
            { id: 's77', speaker: '줍스', kor: '저 PBR 기업 명단 공개도 나왔어요.', time: [312.200, 315.000], eng: "They also announced a name-and-shame list for low-PBR companies." },
            { id: 's78', speaker: '줍스', kor: '같은 업종 안에서 2분기 연속 하위 20%면 이름이 공개돼요.', time: [315.000, 319.900], eng: "If a company is in the bottom 20% of its industry for two consecutive quarters, its name will be made public." },
            { id: 's79', speaker: '줍스', kor: '일종의 불명예 공시예요.', time: [319.900, 322.200], eng: "It's basically a public shaming." },
            { id: 's80', speaker: '줍스', kor: '창피를 줘서라도 자발적 개선을 유도하겠다는 거예요.', time: [322.200, 325.400], eng: "The idea is to induce voluntary improvement, even if it means embarrassing them into it." },
            { id: 's81', speaker: '줍스', kor: '여기서 잠깐 이상한 점 못 느끼셨나요?', time: [325.400, 328.500], eng: "Wait a second, did you notice something odd here?" },
            { id: 's82', speaker: '줍스', kor: '저 PBR이 무조건 나쁜 건 아니에요.', time: [328.500, 331.400], eng: "A low PBR isn't automatically a bad thing." },
            { id: 's83', speaker: '줍스', kor: '자본시장연구원 전문가도 지적했듯이', time: [331.400, 334.490], eng: "As experts from the Korea Capital Market Institute pointed out," },

        // ---------- 6. 어휘 카드 공용 ----------
        function readingVocabContentHTML(word, showTrans, toggleAction) {

        // ---------- 7. 어휘 팝업 ----------

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------

        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {

        function pwOpenModal() {

            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');

        function pwRun(sel, withAns, silent) {

            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);

        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;

        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }

            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }

            if (tab === 'video') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_VIDEO[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }

                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = VIDEO_SCRIPT_DATA.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans = learn.sbTrans || {}; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_VIDEO[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } }
                    else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }

            if (!reading.dictTerm.trim()) return;
            reading.dictLoading = true; reading.dictResult = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm, currentReading().content); }
            catch (err) { reading.dictResult = { term: reading.dictTerm, definition: '검색 중 오류가 발생했습니다. (API 키 없음/요청 오류)', example: '' }; }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
