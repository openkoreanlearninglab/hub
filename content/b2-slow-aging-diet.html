/* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}


    .lk-lang{ position:relative; display:inline-flex; align-items:center; }
.lk-lang-btn{ font-family:inherit; font-size:14px; font-weight:500; color:#6b7280; background:transparent; border:0; border-radius:0; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:color .15s; white-space:nowrap; }
.lk-lang-btn:hover{ color:#111; }

        // 예: { title:'Part 1', subTitle:'', provider:'instagram', igReel:'DQ4UIBHEqwE', thumb:'https://raw.githubusercontent.com/.../thumbnails/xxx.jpeg', script:[...] }
        const VIDEOS = [
            { title: 'Part 1', subTitle: '', videoId: 'LYzS__lGpvs', script: [
            { id: "s1", speaker: "루나 PD", kor: "교수님은 어떻게 맛있는 음식에 대한 어떤 욕구가 없으세요?", time: [0.000, 4.060], eng: "Professor, how is it that you have no craving at all for delicious food?" },
            { id: "s2", speaker: "정희원 교수", kor: "있습니다.", time: [4.090, 4.930], eng: "I do." },
            { id: "s3", speaker: "루나 PD", kor: "먹을 게 없을 것 같은데요.", time: [4.970, 5.890], eng: "It seems like there'd be nothing left to eat." },
            { id: "s4", speaker: "정희원 교수", kor: "먹을 게 많습니다.", time: [5.930, 7.190], eng: "There's plenty to eat." },

            { id: "s21", speaker: "루나 PD", kor: "아니, 어떻게 제가 한 것들만 어떻게…", time: [80.580, 82.730], eng: "Wait, how is it exactly the things I did…" },
            { id: "s22", speaker: "루나 PD", kor: "먹어볼 게 너무 많은데, 뭐부터 먹어 보지?", time: [82.760, 85.050], eng: "There's so much to try — what should I eat first?" },
            { id: "s23", speaker: "루나 PD", kor: "아니, 영상 안 보신 거 맞죠?", time: [85.080, 86.780], eng: "Hold on, you really didn't watch the video, right?" },
            { id: "s24", speaker: "정희원 교수", kor: "영상은 안 봤지만, 사람들이 갈수록 더 자극적인 것들에 굉장히 눈길을 많이 준단 말이에요.", time: [86.810, 92.300], eng: "I haven't seen the video, but people are paying more and more attention to increasingly intense things." },
            { id: "s25", speaker: "정희원 교수", kor: "어떻게 보면 식품이나 식사에서, 또는 생활습관에서 도파민을 쫓아가는 그런 삶이 사실은 노화를 빠르게 만드는 삶이다.", time: [92.330, 99.520], eng: "In a sense, a life that chases dopamine through food, meals, or daily habits is actually a life that speeds up aging." },
            { id: "s26", speaker: "정희원 교수", kor: "뭐 이런 이야기를 하는 거죠.", time: [99.550, 100.690], eng: "That's the kind of thing I talk about." },
            { id: "s27", speaker: "루나 PD", kor: "자… 여기에 온 가장 큰 이유도 주변에서 워낙 제 걱정을 많이 하셔가지고…", time: [100.720, 106.650], eng: "So… the biggest reason I came here is that people around me worry about me so much…" },
            { id: "s28", speaker: "정희원 교수", kor: "아이고, 네…", time: [106.690, 108.350], eng: "Oh dear, I see…" },
            { id: "s29", speaker: "루나 PD", kor: "마침 제가 한 2주 전에 건강검진을 다녀왔어요.", time: [108.380, 112.350], eng: "As it happens, I had a medical checkup about two weeks ago." },
            { id: "s30", speaker: "정희원 교수", kor: "일단 줘 보시겠어요?", time: [112.380, 113.330], eng: "Could you hand it over first?" },
            { id: "s31", speaker: "루나 PD", kor: "무서워요.", time: [113.360, 115.700], eng: "I'm scared." },
            { id: "s32", speaker: "정희원 교수", kor: "어이구.", time: [115.740, 116.390], eng: "Oh my." },
            { id: "s33", speaker: "루나 PD", kor: "표정이 굉장히 심각해지셨는데.", time: [121.620, 124.260], eng: "Your face just got really serious." },
            { id: "s34", speaker: "정희원 교수", kor: "공복 인슐린이 17.1이네요.", time: [124.290, 126.780], eng: "Your fasting insulin is 17.1." },
            { id: "s35", speaker: "루나 PD", kor: "안 좋은 거예요?", time: [126.810, 127.800], eng: "Is that bad?" },
            { id: "s36", speaker: "정희원 교수", kor: "잠시만요. 굉장히 높은 건데요.", time: [127.830, 129.900], eng: "One moment. That is extremely high." },
            { id: "s37", speaker: "루나 PD", kor: "어떡해?, 갑자기 땀이 나는데.", time: [129.930, 133.170], eng: "Oh no — I'm suddenly breaking into a sweat." },
            { id: "s38", speaker: "정희원 교수", kor: "아이고, 그래. 호마 IR이 3.7이네.", time: [133.210, 136.840], eng: "Oh dear. Your HOMA-IR is 3.7." },
            { id: "s39", speaker: "정희원 교수", kor: "호마 IR이라는 게 인슐린 저항성을 보는 건데,", time: [136.880, 139.940], eng: "HOMA-IR is a measure of insulin resistance," },
            { id: "s40", speaker: "정희원 교수", kor: "인슐린 저항성이 상당히 심하네요.", time: [139.980, 143.450], eng: "and your insulin resistance is quite severe." },
            { id: "s41", speaker: "정희원 교수", kor: "근데 지금 보면 아직까지는 연배가 젊으셔서 무료 구독 기간에 있기 때문에…", time: [143.480, 147.940], eng: "But looking at this, you're still young, so you're in the free subscription period…" },
            { id: "s42", speaker: "루나 PD", kor: "아, 네. 아직 만으로는 20대예요.", time: [147.970, 150.650], eng: "Ah, yes. I'm still in my twenties by international age." },
            { id: "s43", speaker: "루나 PD", kor: "그 무료 구독 기간이 언제쯤 끝날지 알 수 있나요?", time: [150.680, 154.290], eng: "Is there a way to know roughly when that free subscription period ends?" },
            { id: "s44", speaker: "정희원 교수", kor: "이제 끝났습니다.", time: [154.320, 155.160], eng: "It has already ended." },
            { id: "s45", speaker: "루나 PD", kor: "네? 이제 끝이에요, 저?", time: [155.190, 157.740], eng: "What? It's over for me already?" },
            { id: "s46", speaker: "정희원 교수", kor: "큰일 났네.", time: [160.630, 161.480], eng: "This is trouble." },
            { id: "s47", speaker: "루나 PD", kor: "큰일 났네요.", time: [161.510, 162.530], eng: "This is trouble." },
            { id: "s48", speaker: "루나 PD", kor: "어떡해? 우리 프로그램 폐지해야 되는 거 아니야?", time: [162.560, 165.390], eng: "What do we do? Don't we have to cancel our show?" },
            { id: "s49", speaker: "정희원 교수", kor: "아이고, 그 뒤에 보니까 망빙 사진이 있어요.", time: [165.420, 168.400], eng: "Oh dear — and behind that, I see a photo of mango shaved ice." },
            { id: "s50", speaker: "루나 PD", kor: "어머, 어떡해.", time: [168.430, 169.950], eng: "Oh no, what do I do." },
            { id: "s51", speaker: "정희원 교수", kor: "전면적인 대사 건강 개선 프로젝트가 필요한 상황이고…", time: [169.990, 173.950], eng: "You're in a situation that calls for a comprehensive metabolic health improvement project…" },
            { id: "s52", speaker: "루나 PD", kor: "교수님, 웃지 않고 얘기하시니까 더 지금 심각하신 거죠?", time: [173.990, 177.320], eng: "Professor, you're saying it without smiling, which means it's serious, right?" },
            { id: "s53", speaker: "정희원 교수", kor: "네. 제가 젊은 사람부터 관리를 해야 된다는 이유가,", time: [177.350, 181.200], eng: "Yes. The reason I say management should start with young people is that" },
            { id: "s54", speaker: "정희원 교수", kor: "젊었을 때의 내가 먹고 마시고 즐기고 그리고 운동하는 것들, 생활습관, 스트레스, 이런 것들 다 가늘고 길게 뽑으면", time: [181.240, 189.630], eng: "if you stretch out everything from your younger years — what you eat, drink, enjoy, how you exercise, your habits, your stress — thin and long," },
            { id: "s55", speaker: "정희원 교수", kor: "노인의 몸이 되는 시점을 뒤로 미룰 수가 있어요.", time: [189.660, 194.110], eng: "you can push back the point at which your body becomes an old body." },
            { id: "s56", speaker: "정희원 교수", kor: "가속노화 식사를 하게 되면 혈당 스파이크가 생겨요.", time: [194.140, 197.650], eng: "If you eat a fast-aging diet, you get blood sugar spikes." },
            { id: "s57", speaker: "루나 PD", kor: "혈당 스파이크, 많이 들어봤어요.", time: [197.680, 199.290], eng: "Blood sugar spikes — I've heard that a lot." },
            { id: "s58", speaker: "정희원 교수", kor: "혈당이 매우 빨리 오르게 되면 무슨 일이 벌어지느냐,", time: [199.320, 202.530], eng: "What happens when blood sugar rises very quickly is this:" },
            { id: "s59", speaker: "정희원 교수", kor: "에너지가 대부분 인슐린에 의해서 지방으로 들어갑니다.", time: [202.560, 206.670], eng: "most of the energy gets pushed into fat by insulin." },
            { id: "s60", speaker: "정희원 교수", kor: "더 최악은, 여기서 혈당이 빠르게 올랐다가", time: [206.690, 209.780], eng: "Even worse, after blood sugar shoots up here," },
            { id: "s61", speaker: "정희원 교수", kor: "인슐린 분비에 의해서 혈당이 항상 베이스라인보다 더 떨어지면,", time: [209.810, 213.760], eng: "insulin secretion always drops it below the baseline —" },
            { id: "s62", speaker: "정희원 교수", kor: "이때가 이제 오후 3시입니다.", time: [213.800, 215.170], eng: "and that moment is around three in the afternoon." },
            { id: "s63", speaker: "정희원 교수", kor: "그때는 굉장히 배가 고파요.", time: [215.200, 217.110], eng: "At that point you get extremely hungry." },
            { id: "s64", speaker: "정희원 교수", kor: "그때 코티솔이 또 나와요.", time: [217.140, 218.830], eng: "And then cortisol comes out." },
            { id: "s65", speaker: "정희원 교수", kor: "무슨 얘기냐면 스트레스 호르몬이 나와요.", time: [218.860, 220.440], eng: "Meaning the stress hormone gets released." },
            { id: "s66", speaker: "정희원 교수", kor: "결국에 우리가 스트레스를 풀기 위해서 가속노화 음식을 먹는데,", time: [220.470, 224.730], eng: "In the end we eat fast-aging food to relieve stress," },
            { id: "s67", speaker: "정희원 교수", kor: "그 음식은 사실은 스트레스 호르몬인 코티솔의 레벨을 더 증가시켜요.", time: [224.760, 229.070], eng: "but that food actually raises the level of cortisol, the stress hormone, even further." },
            { id: "s68", speaker: "루나 PD", kor: "사실 맛있는 거 먹으면은", time: [229.100, 230.900], eng: "People often say that when you eat something tasty," },
            { id: "s69", speaker: "루나 PD", kor: "“기분이 좋아진다”, “스트레스가 풀린다”, 이런 얘기 많이 하잖아요.", time: [230.940, 234.400], eng: "\"your mood lifts\" or \"your stress melts away\" — you hear that a lot, right?" },
            { id: "s70", speaker: "정희원 교수", kor: "실제로는 몸에는 풀리지가 않는 거예요.", time: [234.440, 236.620], eng: "In reality, the body doesn't get any relief at all." },
            { id: "s71", speaker: "정희원 교수", kor: "그럼 반대로 저속 노화 식사는 뭐냐?", time: [236.650, 238.630], eng: "So then, what is a slow-aging meal?" },
            { id: "s72", speaker: "정희원 교수", kor: "붉은 고기 대신에 콩 단백질, 식물성 단백질을 많이 먹는 게 좋고,", time: [238.660, 241.900], eng: "Instead of red meat it's better to eat plenty of bean protein and plant-based protein," },
            { id: "s73", speaker: "정희원 교수", kor: "채소 위주의 식사를 하고,", time: [241.930, 243.280], eng: "to build meals mainly around vegetables," },
            { id: "s74", speaker: "정희원 교수", kor: "단순당과 정제 곡물은 줄여야 돼요.", time: [243.320, 245.460], eng: "and to cut down on simple sugars and refined grains." },
            { id: "s75", speaker: "정희원 교수", kor: "그래서 잡곡밥을 먹거나 먹는 양을 줄이는 과식을 하지 않는 게 도움이 되죠.", time: [245.500, 250.090], eng: "So eating multigrain rice, or cutting portions so you don't overeat, helps." },
            { id: "s76", speaker: "루나 PD", kor: "먹을 게 없을 것 같은데요…", time: [250.120, 251.380], eng: "It sounds like there'd be nothing left to eat…" },
            { id: "s77", speaker: "정희원 교수", kor: "먹을 게 많습니다.", time: [251.410, 252.360], eng: "There's plenty to eat." },
            { id: "s78", speaker: "정희원 교수", kor: "저희 병원 식단을 보시면,", time: [252.390, 254.270], eng: "If you look at our hospital meals," },
            { id: "s79", speaker: "정희원 교수", kor: "제가 이거는 집에서 가져온 저속 노화 밥인데,", time: [254.310, 256.620], eng: "this is slow-aging rice I brought from home," },
            { id: "s80", speaker: "정희원 교수", kor: "이건 떡볶이였어요.", time: [256.650, 258.140], eng: "and this used to be tteokbokki." },
            { id: "s81", speaker: "루나 PD", kor: "그런데, 떡은 어디 갔어요?", time: [258.180, 259.940], eng: "But where did the rice cakes go?" },
            { id: "s82", speaker: "정희원 교수", kor: "떡은 제가 안 받았죠.", time: [259.970, 261.090], eng: "I simply didn't take the rice cakes." },
            { id: "s83", speaker: "정희원 교수", kor: "제가 어떻게 한 거냐면,", time: [261.120, 262.680], eng: "What I did was this:" },
            { id: "s84", speaker: "정희원 교수", kor: "가속노화로 나온 메뉴를 저속노화로 바꿔본 겁니다.", time: [262.710, 266.720], eng: "I took a fast-aging menu and turned it into a slow-aging one." },
            { id: "s85", speaker: "정희원 교수", kor: "떡볶이 안 받고,", time: [266.750, 267.830], eng: "No tteokbokki," },
            { id: "s86", speaker: "정희원 교수", kor: "그다음에 이제 우동사리 없고,", time: [268.100, 269.850], eng: "and then no udon noodles either," },
            { id: "s87", speaker: "정희원 교수", kor: "또 인제 국물만 있고.", time: [269.880, 271.360], eng: "just the broth." },
            { id: "s88", speaker: "루나 PD", kor: "교수님은 어떻게 맛있는 음식에 대한 어떤 욕구가 없으세요?", time: [271.400, 275.410], eng: "Professor, how is it that you have no craving for delicious food?" },
            { id: "s89", speaker: "정희원 교수", kor: "있습니다.", time: [275.450, 276.270], eng: "I do." },
            { id: "s90", speaker: "루나 PD", kor: "그러면 그런 생각이 들 때 어떻게 해요?", time: [276.300, 278.070], eng: "Then what do you do when that urge hits?" },
            { id: "s91", speaker: "정희원 교수", kor: "그래서 사실은 굉장히 맛있게 건강하게 먹을 수 있는 방법도 있어요.", time: [278.110, 281.640], eng: "Actually, there are ways to eat both very deliciously and healthily." },
            { id: "s92", speaker: "정희원 교수", kor: "발사믹이나 올리브오일 이런 드레싱으로 샐러드 드시면 사실 배는 꽤 불러요.", time: [281.670, 286.840], eng: "If you eat salad with dressings like balsamic or olive oil, you actually do get quite full." },
            { id: "s93", speaker: "루나 PD", kor: "근데 일단 맛있는 게 샐러드라고 생각하시는 그게 저랑 약간 다른 것 같은데.", time: [286.880, 293.510], eng: "But the fact that you think salad is what counts as delicious — that already seems a bit different from me." },
            { id: "s94", speaker: "정희원 교수", kor: "입맛은 바뀌어요.", time: [293.540, 294.700], eng: "Your palate changes." },
            { id: "s95", speaker: "정희원 교수", kor: "저속 노화 식사를 하게 되면,", time: [294.730, 296.780], eng: "When you eat a slow-aging diet," },
            { id: "s96", speaker: "정희원 교수", kor: "혈당 변동성이 줄고,", time: [296.810, 298.150], eng: "blood sugar variability drops," },
            { id: "s97", speaker: "정희원 교수", kor: "수면의 질이 좋아지고,", time: [298.180, 299.740], eng: "sleep quality improves," },
            { id: "s98", speaker: "정희원 교수", kor: "스트레스 호르몬이 줄면,", time: [299.780, 301.350], eng: "and as stress hormones fall," },
            { id: "s99", speaker: "정희원 교수", kor: "내가 좋아하는 음식의 성향이 바뀝니다.", time: [301.390, 303.960], eng: "the kind of food you like starts to change." },
            { id: "s100", speaker: "정희원 교수", kor: "더 슴슴한 음식을 먹을 수 있는 사람이 돼요.", time: [304.000, 306.660], eng: "You become someone who can enjoy blander food." },
            { id: "s101", speaker: "정희원 교수", kor: "그러면 선순환이 됩니다.", time: [306.690, 309.080], eng: "And that becomes a virtuous cycle." },
            { id: "s102", speaker: "루나 PD 나레이션", kor: "가속노화를 예방하기 위해 가장 중요한 식단.", time: [309.110, 312.540], eng: "Diet — the single most important thing for preventing fast aging." },
            { id: "s103", speaker: "루나 PD 나레이션", kor: "정희원 교수님을 만나고 온 뒤,", time: [312.580, 314.240], eng: "After meeting Professor Jung," },
            { id: "s104", speaker: "루나 PD 나레이션", kor: "저도 한번 밥을 잡곡밥으로 바꿔보기로 했습니다.", time: [314.270, 317.740], eng: "I decided to switch my own rice to multigrain rice." },
            { id: "s105", speaker: "잡곡밥 식단 첼린지 시작!", kor: "다양한 잡곡 넣어서 섞어주고,", time: [319.710, 321.600], eng: "Add various grains and mix them in," },
            { id: "s106", speaker: "잡곡밥 식단 첼린지 시작!", kor: "물에 한 시간 정도 불린 다음,", time: [321.640, 324.030], eng: "soak them in water for about an hour," },
            { id: "s107", speaker: "잡곡밥 식단 첼린지 시작!", kor: "취사 시작!", time: [324.060, 325.390], eng: "and start cooking!" },
            { id: "s108", speaker: "잡곡밥 식단 첼린지 시작!", kor: "처음 만들어 보는 잡곡밥", time: [325.420, 327.570], eng: "My first time making multigrain rice." },
            { id: "s109", speaker: "잡곡밥 식단 첼린지 시작!", kor: "이게… 맞나…?", time: [327.610, 329.780], eng: "Is this… right…?" },
            { id: "s110", speaker: "루나 PD", kor: "완전히… 완전히 망해버렸는데…? (밥통은 죄가 없음)", time: [329.810, 332.920], eng: "It's completely… completely ruined…? (The rice cooker is innocent.)" },
            { id: "s111", speaker: "루나 PD", kor: "지훈아, 이모가 한 밥 한번 먹어볼래?", time: [332.950, 334.570], eng: "Jihun, do you want to try the rice your aunt made?" },

            { term: "-단 말이에요", mainDef: "'I'm telling you ~' — drives a point home, often when you feel the listener isn't getting it. A contraction of -다는 말이에요.", variants: ["준단 말이에요", "-단 말이에요"], examples: [{ kor: "제가 벌써 세 번이나 말했단 말이에요.", eng: "I'm telling you, I've already said it three times." }] },
            { term: "식품", mainDef: "a food product — something made and sold for people to eat.", variants: ["식품"], examples: [{ kor: "가공식품보다 신선한 재료가 몸에 좋아요.", eng: "Fresh ingredients are better for you than processed food products." }] },
            { term: "생활습관", mainDef: "lifestyle habits — the settled daily patterns of how you eat, sleep and move.", variants: ["생활습관"], examples: [{ kor: "병은 생활습관에서 시작되는 경우가 많아요.", eng: "Illness often starts with lifestyle habits." }] },
            { term: "도파민", mainDef: "dopamine — the brain chemical that creates feelings of pleasure and reward.", variants: ["도파민"], examples: [{ kor: "짧은 영상은 도파민을 빠르게 자극해요.", eng: "Short videos stimulate dopamine quickly." }] },
            { term: "쫓아가다", mainDef: "to chase after — to follow something that is ahead of you. Here: constantly chasing pleasure.", variants: ["쫓아가는", "쫓아가다"], examples: [{ kor: "유행만 쫓아가다 보면 자기 취향을 잃어요.", eng: "If you only chase trends, you lose your own taste." }] },
            { term: "어떻게 보면", mainDef: "'in a sense, looked at one way' — a hedge used to introduce an opinion carefully.", variants: ["어떻게 보면"], examples: [{ kor: "어떻게 보면 실패도 좋은 경험이에요.", eng: "In a sense, failure is a good experience too." }] },
            { term: "뭐", mainDef: "as a filler: 'well…, you know'. Literally 'what', but in speech it often carries no meaning and just softens the sentence.", variants: ["뭐 이런"], examples: [{ kor: "뭐, 그럴 수도 있죠.", eng: "Well, I suppose that could happen." }] },
            { term: "자…", mainDef: "'so…, right…' — a spoken opener used to change topic or get to the point. Carries no meaning.", variants: ["자…"], examples: [{ kor: "자, 그럼 시작해 볼까요?", eng: "Right then, shall we get started?" }] },
            { term: "워낙", mainDef: "so much, to such a degree — or 'by nature, from the start'.", variants: ["워낙"], examples: [{ kor: "그 식당은 워낙 유명해서 늘 줄이 길어요.", eng: "That restaurant is so famous that the line is always long." }] },
            { term: "-아/어 가지고", mainDef: "a very colloquial replacement for -아서/어서 (because ~, and then ~). Same meaning, much more casual — rare in writing.", subDefs: [{ subTerm: "하셔가지고", subDef: "= 하셔서 (because they did ~)." }, { subTerm: "불려가지고", subDef: "= 불려서 (having soaked it, and then ~)." }], variants: ["하셔가지고", "불려가지고", "-아/어 가지고"], examples: [{ kor: "늦잠을 자 가지고 지각했어요.", eng: "I overslept, so I was late." }] },
            { term: "아이고", mainDef: "an interjection of surprise, dismay or weariness — 'oh dear, oh my'. 어이구 is the same word.", variants: ["아이고", "어이구"], examples: [{ kor: "아이고, 이걸 어쩌면 좋아요.", eng: "Oh dear, what on earth do we do about this." }] },
            { term: "마침", mainDef: "as it happens, just at the right time — used when the timing lines up by coincidence.", variants: ["마침"], examples: [{ kor: "마침 저도 그 얘기를 하려던 참이었어요.", eng: "As it happens, I was just about to bring that up too." }] },
            { term: "건강검진", mainDef: "a medical checkup — testing your body in advance to find out whether anything is wrong.", variants: ["건강검진"], examples: [{ kor: "1년에 한 번은 건강검진을 받는 게 좋아요.", eng: "It's good to get a medical checkup once a year." }] },
            { term: "공복", mainDef: "an empty stomach, the fasting state — not having eaten for a while.", variants: ["공복"], examples: [{ kor: "이 약은 공복에 드셔야 해요.", eng: "You should take this medicine on an empty stomach." }] },
            { term: "인슐린", mainDef: "insulin — the hormone from the pancreas that moves sugar out of the blood into cells, lowering blood sugar.", variants: ["인슐린"], examples: [{ kor: "밥을 먹으면 인슐린이 나와요.", eng: "Insulin is released when you eat." }] },
            { term: "호마 IR", mainDef: "HOMA-IR — a number calculated from fasting glucose and fasting insulin that shows how severe insulin resistance is. Above about 2.5 is considered high.", variants: ["호마 IR"], examples: [{ kor: "호마 IR 수치가 높게 나와서 걱정이에요.", eng: "My HOMA-IR came out high, so I'm worried." }] },
            { term: "인슐린 저항성", mainDef: "insulin resistance — a state where the body responds poorly to insulin, so blood sugar doesn't come down properly.", variants: ["인슐린 저항성"], examples: [{ kor: "인슐린 저항성이 높으면 당뇨병 위험도 커져요.", eng: "High insulin resistance also raises the risk of diabetes." }] },
            { term: "상당히", mainDef: "considerably, quite — noticeably more than you'd expect.", variants: ["상당히"], examples: [{ kor: "생각보다 상당히 어려운 문제였어요.", eng: "It was a considerably harder problem than I expected." }] },
            { term: "연배", mainDef: "age, age group — being of a similar age or generation.", variants: ["연배"], examples: [{ kor: "저희는 연배가 비슷해서 말이 잘 통해요.", eng: "We're around the same age, so we get along easily." }] },
            { term: "무료 구독 기간", mainDef: "a free subscription period — the time you can use a service without paying. Here it is a metaphor for the years when you're still young enough that health problems haven't surfaced.", variants: ["무료 구독 기간"], examples: [{ kor: "무료 구독 기간이 끝나면 요금이 청구돼요.", eng: "Once the free subscription period ends, you get charged." }] },
            { term: "만으로", mainDef: "by international age — age counted by years actually completed since birth. Korea long used a separate 'counting age' starting at one at birth, so the two could differ.", variants: ["만으로는", "만으로"], examples: [{ kor: "저는 만으로 스물아홉이에요.", eng: "I'm twenty-nine by international age." }] },
            { term: "큰일 나다", mainDef: "to be in big trouble — for a serious problem to arise.", variants: ["큰일 났네요", "큰일 났네", "큰일 나다"], examples: [{ kor: "이거 잃어버리면 큰일 나요.", eng: "If you lose this, we're in big trouble." }] },
            { term: "폐지하다", mainDef: "to abolish, to cancel — to do away with a system or a programme.", variants: ["폐지해야", "폐지하다"], examples: [{ kor: "시청률이 낮아서 그 프로그램은 폐지됐어요.", eng: "The show was cancelled because of low ratings." }] },
            { term: "망빙", mainDef: "short for 망고빙수 (mango shaved ice). Clipping two words to their first syllables like this is extremely common in Korean.", variants: ["망빙"], examples: [{ kor: "여름엔 역시 망빙이죠.", eng: "Summer really calls for mango bingsu." }] },
            { term: "전면적", mainDef: "comprehensive, across-the-board — covering every part, not just one.", variants: ["전면적인", "전면적"], examples: [{ kor: "회사는 전면적인 조직 개편을 발표했어요.", eng: "The company announced a comprehensive restructuring." }] },
            { term: "대사", mainDef: "metabolism — how the body turns food into energy and clears out what is used up.", variants: ["대사"], examples: [{ kor: "나이가 들면 기초 대사량이 줄어들어요.", eng: "As you get older, your basal metabolic rate drops." }] },
            { term: "개선", mainDef: "improvement — fixing what is lacking or wrong so it gets better.", variants: ["개선"], examples: [{ kor: "생활습관 개선만으로도 혈압이 내려갔어요.", eng: "Just improving my lifestyle brought my blood pressure down." }] },
            { term: "가늘고 길게 뽑다", mainDef: "'to draw it out thin and long' — to lower the intensity so something lasts longer. Here: easing off the excesses of youth so aging unfolds slowly.", variants: ["가늘고 길게 뽑으면", "가늘고 길게 뽑다"], examples: [{ kor: "직장 생활은 가늘고 길게 가는 게 최고예요.", eng: "With a career, thin and long is the way to go." }] },
            { term: "시점", mainDef: "a point in time — the exact moment at which something happens.", variants: ["시점"], examples: [{ kor: "지금은 결정을 내릴 시점이 아니에요.", eng: "Now isn't the point at which we should make a decision." }] },
            { term: "뒤로 미루다", mainDef: "to push back, to postpone — to move a set time to a later point.", variants: ["뒤로 미룰", "뒤로 미루다"], examples: [{ kor: "회의를 다음 주로 뒤로 미뤘어요.", eng: "We pushed the meeting back to next week." }] },
            { term: "-게 되다", mainDef: "'to end up ~ing, to come to ~' — a change of state, often not by your own choice.", subDefs: [{ subTerm: "-게 되면", subDef: "'if/when you end up ~ing'. 식사를 하게 되면 = when you eat this way." }], variants: ["하게 되면", "오르게 되면", "-게 되다"], examples: [{ kor: "한국에 살게 되면서 김치를 좋아하게 됐어요.", eng: "After I ended up living in Korea, I came to like kimchi." }] },
            { term: "혈당", mainDef: "blood sugar — the amount of sugar in your blood.", variants: ["혈당"], examples: [{ kor: "빈속에 단 음료를 마시면 혈당이 확 올라가요.", eng: "Drinking something sweet on an empty stomach sends your blood sugar right up." }] },
            { term: "혈당 스파이크", mainDef: "a blood sugar spike — a sudden sharp rise in blood sugar after eating.", variants: ["혈당 스파이크"], examples: [{ kor: "빈속에 단 음료를 마시면 혈당 스파이크가 와요.", eng: "Drinking something sweet on an empty stomach causes a blood sugar spike." }] },
            { term: "-느냐", mainDef: "a rhetorical self-question: the speaker asks 'so what happens?' and immediately answers it. Common in lectures.", variants: ["벌어지느냐", "-느냐"], examples: [{ kor: "그럼 왜 이런 일이 생기느냐, 이유는 간단합니다.", eng: "So why does this happen? The reason is simple." }] },
            { term: "-에 의해서", mainDef: "'by ~, due to ~' — marks the agent or cause. More formal/written than -때문에.", variants: ["인슐린에 의해서", "-에 의해서"], examples: [{ kor: "이 다리는 100년 전에 지어졌어요.", eng: "This bridge was built a hundred years ago." }] },
            { term: "지방", mainDef: "fat — the fatty substance stored in the body.", variants: ["지방"], examples: [{ kor: "남은 에너지는 지방으로 저장돼요.", eng: "Leftover energy gets stored as fat." }] },
            { term: "최악", mainDef: "the worst — the worst possible case.", variants: ["최악"], examples: [{ kor: "최악의 경우도 미리 생각해 둬야 해요.", eng: "You should think through the worst case in advance too." }] },
            { term: "분비", mainDef: "secretion — the release of a substance produced inside the body.", variants: ["분비"], examples: [{ kor: "밤에 빛을 보면 멜라토닌 분비가 줄어요.", eng: "Seeing light at night reduces melatonin secretion." }] },
            { term: "베이스라인", mainDef: "baseline — the normal reference level. Here: your blood sugar before eating.", variants: ["베이스라인"], examples: [{ kor: "운동 후에는 심박수가 베이스라인으로 돌아와요.", eng: "After exercise, your heart rate returns to baseline." }] },
            { term: "코티솔", mainDef: "cortisol — the hormone released under stress. Kept high for long, it promotes weight gain and disrupts sleep.", variants: ["코티솔"], examples: [{ kor: "잠이 부족하면 코티솔이 올라가요.", eng: "Lack of sleep raises cortisol." }] },
            { term: "스트레스 호르몬", mainDef: "stress hormone — a general term for the hormones released under stress; cortisol is the main one.", variants: ["스트레스 호르몬"], examples: [{ kor: "산책만 해도 스트레스 호르몬이 줄어요.", eng: "Even just a walk lowers your stress hormones." }] },
            { term: "-냐면", mainDef: "'as for what I mean / as for what I did ~' — the speaker echoes a question and then explains. Colloquial.", variants: ["무슨 얘기냐면", "어떻게 한 거냐면", "-냐면"], examples: [{ kor: "왜 그러냐면, 시간이 없었거든요.", eng: "As for why — I didn't have any time." }] },
            { term: "결국에", mainDef: "in the end, after all — a colloquial form of 결국.", variants: ["결국에"], examples: [{ kor: "결국에 다시 처음으로 돌아왔어요.", eng: "In the end we came right back to the start." }] },
            { term: "스트레스를 풀다", mainDef: "to relieve stress — 풀다 carries the image of untying something knotted.", variants: ["스트레스를 풀기", "스트레스가 풀린다", "스트레스를 풀다"], examples: [{ kor: "저는 노래방에서 스트레스를 풀어요.", eng: "I relieve stress at karaoke." }] },
            { term: "-기 위해서", mainDef: "'in order to ~' — states a purpose. Attaches to a verb stem: 풀기 위해서 = in order to relieve.", variants: ["풀기 위해서", "예방하기 위해", "-기 위해서"], examples: [{ kor: "건강해지기 위해서 매일 걸어요.", eng: "I walk every day in order to get healthier." }] },
            { term: "붉은 고기", mainDef: "red meat — beef, pork and other red-coloured meat.", variants: ["붉은 고기"], examples: [{ kor: "붉은 고기를 줄이고 생선을 늘렸어요.", eng: "I cut back on red meat and ate more fish." }] },
            { term: "식물성 단백질", mainDef: "plant-based protein — protein from plants such as beans or tofu.", variants: ["식물성 단백질"], examples: [{ kor: "두부는 대표적인 식물성 단백질이에요.", eng: "Tofu is a classic plant-based protein." }] },
            { term: "위주", mainDef: "centred on ~, mainly ~ — treating something as the focus.", variants: ["위주"], examples: [{ kor: "저는 요즘 채소 위주로 먹고 있어요.", eng: "These days I eat mainly vegetables." }] },
            { term: "단순당", mainDef: "simple sugar — sugar in a simple form that the body absorbs very fast.", variants: ["단순당"], examples: [{ kor: "탄산음료에는 단순당이 많이 들어 있어요.", eng: "Soft drinks contain a lot of simple sugar." }] },
            { term: "정제 곡물", mainDef: "refined grain — grain whose husk and germ have been stripped away to make it soft (white rice, white flour).", variants: ["정제 곡물"], examples: [{ kor: "흰 밀가루는 대표적인 정제 곡물이에요.", eng: "White flour is a typical refined grain." }] },
            { term: "-아/어야 되다", mainDef: "'have to ~, must ~' — obligation. 줄여야 돼요 = you have to cut down.", variants: ["줄여야 돼요", "해야 된다는", "-아/어야 되다"], examples: [{ kor: "내일까지 이 일을 끝내야 돼요.", eng: "I have to finish this work by tomorrow." }] },
            { term: "잡곡밥", mainDef: "multigrain rice — rice cooked with other grains such as barley and beans mixed in.", variants: ["잡곡밥", "잡곡"], examples: [{ kor: "흰밥 대신 잡곡밥으로 바꿔 봤어요.", eng: "I switched from white rice to multigrain rice." }] },
            { term: "과식", mainDef: "overeating — eating too much even after you're already full.", variants: ["과식"], examples: [{ kor: "명절만 되면 꼭 과식을 하게 돼요.", eng: "Every holiday I always end up overeating." }] },
            { term: "우동사리", mainDef: "udon noodles added into a broth dish. 사리 means a coiled bundle of noodles.", variants: ["우동사리"], examples: [{ kor: "찌개에 우동사리를 넣어 먹으면 든든해요.", eng: "Adding udon noodles to the stew makes it filling." }] },
            { term: "인제", mainDef: "how 이제 (now) is commonly pronounced in speech. Here it carries almost no time meaning — it just fills a gap, like English 'uh'. In writing the correct form is 이제.", variants: ["인제"], examples: [{ kor: "그래서 인제 제가 그때 이렇게 말했거든요.", eng: "So, uh, that's when I said this." }] },
            { term: "입맛", mainDef: "palate, taste — your personal preference in how food tastes.", variants: ["입맛"], examples: [{ kor: "외국에 오래 살면 입맛도 조금씩 변해요.", eng: "If you live abroad for a long time, your palate gradually changes too." }] },
            { term: "바뀌다", mainDef: "to change (by itself) — intransitive. Careful: 바꾸다 = to change something (transitive).", subDefs: [{ subTerm: "입맛이 바뀌어요", subDef: "My palate changes (on its own)." }, { subTerm: "입맛을 바꿔요", subDef: "I change my palate (deliberately)." }], variants: ["바뀌어요", "바뀝니다", "바뀔", "바뀌다"], examples: [{ kor: "약속 시간이 갑자기 바뀌었어요.", eng: "The meeting time suddenly changed." }] },
            { term: "변동성", mainDef: "variability — the tendency of a value to keep rising and falling.", variants: ["혈당 변동성", "변동성"], examples: [{ kor: "혈당 변동성이 크면 쉽게 피곤해져요.", eng: "If your blood sugar swings a lot, you get tired easily." }] },
            { term: "수면의 질", mainDef: "sleep quality — not how long you slept, but how deeply and restfully.", variants: ["수면의 질"], examples: [{ kor: "커피를 끊었더니 수면의 질이 좋아졌어요.", eng: "After quitting coffee, my sleep quality improved." }] },
            { term: "성향", mainDef: "a tendency, a leaning — the direction your character or taste inclines toward.", variants: ["성향"], examples: [{ kor: "사람마다 소비 성향이 달라요.", eng: "Everyone has different spending tendencies." }] },
            { term: "슴슴하다", mainDef: "to be bland, mild — not salty or intense, light and plain in flavour.", variants: ["슴슴한", "슴슴하다"], examples: [{ kor: "평양냉면은 슴슴한 맛이 매력이에요.", eng: "The charm of Pyongyang naengmyeon is its mild flavour." }] },
            { term: "선순환", mainDef: "a virtuous cycle — a good result becoming the cause of another good result. The opposite is 악순환 (vicious cycle).", variants: ["선순환"], examples: [{ kor: "잘 자면 잘 먹게 되는 선순환이 생겨요.", eng: "Sleeping well creates a virtuous cycle where you also eat well." }] },
            { term: "예방하다", mainDef: "to prevent — to stop something bad before it happens.", variants: ["예방하기", "예방하다"], examples: [{ kor: "손만 잘 씻어도 감기를 예방할 수 있어요.", eng: "Just washing your hands well can prevent colds." }] },
            { term: "-기로 하다", mainDef: "'to decide to ~' — announces a decision you have made.", subDefs: [{ subTerm: "바꿔보기로 했습니다", subDef: "I decided to try changing it." }], variants: ["바꿔보기로 했습니다", "-기로 하다"], examples: [{ kor: "내년부터 담배를 끊기로 했어요.", eng: "I've decided to quit smoking from next year." }] },
            { term: "취사", mainDef: "cooking rice — the word on the 'cook' button of a Korean rice cooker.", variants: ["취사"], examples: [{ kor: "쌀을 씻고 취사 버튼을 누르세요.", eng: "Rinse the rice and press the cook button." }] },
            { term: "망하다", mainDef: "to fail, to be ruined. Originally about a country or business collapsing, but in casual speech used lightly for small things — a failed dish, a bad exam.", variants: ["망해버렸는데", "망했다", "망한", "망하다"], examples: [{ kor: "시험 완전히 망했어요.", eng: "I totally bombed the exam." }] },
            { term: "-아/어 버리다", mainDef: "'to have completely done ~' — marks that an action is finished, often with regret or relief.", subDefs: [{ subTerm: "망해 버렸어요", subDef: "It's completely ruined (and there's no going back)." }], variants: ["망해버렸는데", "-아/어 버리다"], examples: [{ kor: "케이크를 다 먹어 버렸어요.", eng: "I've gone and eaten the whole cake." }] },
            { term: "밥통", mainDef: "a rice cooker. Careful: used of a person it becomes an insult meaning 'idiot'.", variants: ["밥통"], examples: [{ kor: "밥통에 밥이 아직 따뜻하게 남아 있어요.", eng: "There's still warm rice left in the rice cooker." }] },
            { term: "죄가 없다", mainDef: "'is innocent, did nothing wrong'. Attaching it to an object — '밥통은 죄가 없음' — is a joke meaning the fault is the person's, not the thing's.", variants: ["죄가 없음", "죄가 없다"], examples: [{ kor: "칼은 죄가 없어요. 요리사가 문제죠.", eng: "The knife is innocent — it's the cook that's the problem." }] },
            { term: "이모", mainDef: "aunt — your mother's sister, as a niece or nephew calls her. A father's sister is 고모.", variants: ["이모가", "이모의", "이모"], examples: [{ kor: "이모가 용돈을 주셨어요.", eng: "My aunt gave me some pocket money." }] },

        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';

            + '<div class="fc-ctrls"><button type="button" class="fc-ibtn" data-action="fc-prev" aria-label="이전 카드">'+FC_ICON.prev+'</button><button type="button" class="fc-fbtn" data-action="fc-flip">뒤집기<span class="lk-en"> · Flip</span></button><button type="button" class="fc-ibtn" data-action="fc-next" aria-label="다음 카드">'+FC_ICON.next+'</button></div>'
            + '<p class="fc-hint"><span class="lk-ko-only"><kbd>Space</kbd> 뒤집기 · <kbd>&larr;</kbd><kbd>&rarr;</kbd> 이전/다음 · <kbd>1</kbd> 알아요 · <kbd>2</kbd> 모르겠어요 · <kbd>S</kbd> 순서/섞기</span><span class="lk-en"><kbd>Space</kbd> Flip · <kbd>&larr;</kbd><kbd>&rarr;</kbd> Prev/Next · <kbd>1</kbd> Got it · <kbd>2</kbd> Not yet · <kbd>S</kbd> Order/Shuffle</span></p>'
            + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }
        function fcApplyFlip(){ const root=viewRoot(); if(!root)return; const el=qs('#fc-inner',root); if(el)el.classList.toggle('flip',fc.flipped); const tr=qs('#fc-trans',root); if(tr)tr.textContent=fc.showTrans?fcCur().en:''; const tb=qs('#fc-back [data-action="fc-trans"]',root); if(tb)tb.classList.toggle('on',fc.showTrans); }
        function fcRefreshStats(){ const root=viewRoot(); if(!root)return; const k=qs('#fc-sk',root),u=qs('#fc-su',root); if(k)k.textContent=fcCount('known'); if(u)u.textContent=fcCount('unknown'); }
        function fcRefreshDeck(){ const d=qs('#fc-deck',viewRoot()); if(d)d.outerHTML=fcDeckHTML(); else paint(); fcPreloadAround(); }
        function fcSetFlip(v){ fc.flipped=v; fcApplyFlip(); if(v)fcPlay(fcCur().audio); else fcStop(); }
        function fcGo(fn){ fcStop(); fc.flipped=false; fc.showTrans=false; fn(); if(fc.done)fcRefreshDeck(); else fcSync(); }
        function fcMark(kind){ fc.status[fc.queue[fc.pos]]=kind; fcRefreshStats(); fcGo(function(){ if(fc.pos+1>=fc.queue.length)fc.done=true; else fc.pos+=1; }); }
        function fcSetOrder(sh){ if(sh===fc.shuffled)return; fc.shuffled=sh; const m=fc.queue.slice(); fc.queue=sh?shuffleArr(m):m.slice().sort(function(a,b){return a-b;}); fcStop(); fc.pos=0; fc.flipped=false; fc.showTrans=false; fcRefreshDeck(); }


        /* ===== 어휘 검색 (a계열: 영어 정의 내장 → 영어 일괄 표시 버튼 없음) ===== */
        const voc = { q:'' };
        function vocFiltered(){ const q=voc.q.toLowerCase().trim(); if(!q) return VOCAB_DATA.map(function(w,i){return {w:w,i:i};});
            return VOCAB_DATA.map(function(w,i){return {w:w,i:i};}).filter(function(o){ const w=o.w;
                return (w.term||'').toLowerCase().indexOf(q)>=0 || (w.mainDef||'').toLowerCase().indexOf(q)>=0
                    || (w.variants||[]).some(function(v){return v.toLowerCase().indexOf(q)>=0;})
                    || (w.subDefs||[]).some(function(sd){return (sd.subTerm||'').toLowerCase().indexOf(q)>=0 || (sd.subDef||'').toLowerCase().indexOf(q)>=0;}); }); }
        function vocGridHTML(){ const list=vocFiltered(); if(!list.length) return '<div class="text-center py-16 text-gray-400 font-serif">검색 결과가 없어요.<span class="lk-en block text-sm mt-1">No results.</span></div>';

        function vocListHTML(){ const ph = secLang() ? '어휘·뜻 검색 / Search vocabulary...' : '어휘·뜻 검색...';
            return `<div class="fc-search print:hidden"><div class="fc-search-box"><input type="text" id="voc-search" value="${esc(voc.q)}" placeholder="${ph}" autocomplete="off"><button type="button" id="voc-clear" data-action="voc-clear" aria-label="지우기" style="${voc.q?'':'display:none'}">\u2715</button></div><span class="fc-search-count">${secLang()?'Results':'검색 결과'}: <strong id="voc-count">${vocFiltered().length}</strong> / ${VOCAB_DATA.length}</span></div><div id="voc-grid">${vocGridHTML()}</div>`; }
        function refreshVocGrid(){ const root=viewRoot(); if(!root)return; const g=qs('#voc-grid',root); if(g)g.innerHTML=vocGridHTML(); const c=qs('#voc-count',root); if(c)c.textContent=vocFiltered().length; const clr=qs('#voc-clear',root); if(clr)clr.style.display=voc.q?'':'none'; }

        function vocabHTML() {

            const body = (hasFC && fc.mode==='card')

        // ---------- QUIZ (객관식) ----------
        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;

        function updateQuizScore() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; }

        // ---------- DISCUSS ----------
        function feedbackSectionHTML(titleKor, titleEng, contentHTML, isCorrection) { return `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">${esc(titleKor)} <span class="font-eng-header font-medium text-[9px]">${esc(titleEng)}</span></h4><p class="${isCorrection ? 'text-[15px] md:text-base font-serif text-gray-900 leading-relaxed font-medium bg-white p-4 border border-gray-200 shadow-sm rounded-sm' : 'text-[13px] md:text-sm font-sans text-gray-700 leading-relaxed whitespace-pre-wrap'}">${contentHTML}</p></div>`; }
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, generating: false, feedback: null, error: '' });
            const vocab = (item.vocab||[]).map(v => `<p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>`).join('');
            let fb = '';
            if (st.error) fb = `<div class="mt-4 p-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-sm animate-fade-in">${esc(st.error)}</div>`;
            else if (st.feedback) {
                const fd = st.feedback;
                const details = (fd.detailed_corrections && fd.detailed_corrections.length) ? `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2">상세 설명 <span class="lk-en font-eng-header font-medium text-[9px]">EXPLANATION</span></h4><div class="space-y-3">${fd.detailed_corrections.map(d => `<div class="bg-white p-4 border border-gray-100 rounded-sm hover:border-gray-200 transition-colors">${(d.original || d.corrected) ? `<div class="flex flex-wrap items-center gap-3 mb-2.5 text-[15px] font-serif">${d.original ? `<span class="text-red-400 line-through decoration-red-300/60">${esc(d.original)}</span>` : ''}${(d.original && d.corrected) ? '<span class="text-gray-300">→</span>' : ''}${d.corrected ? `<span class="text-gray-900 font-bold tracking-wide">${esc(d.corrected)}</span>` : ''}</div>` : ''}<p class="text-[13px] md:text-sm font-sans text-gray-600 leading-relaxed">${renderFormatted(d.explanation)}</p></div>`).join('')}</div></div>` : '';
                fb = `<div class="mt-8 p-6 bg-gray-50 border border-gray-200 rounded-sm animate-fade-in relative"><div class="flex items-center gap-2 mb-6 pb-4 border-b border-gray-200">${svgIcon('sparkles', 'w-5 h-5 text-gray-900', { fill: 'currentColor' })}<span class="text-xs font-bold font-sans text-gray-900 uppercase tracking-widest">${secLang() ? 'AI Teacher Feedback' : 'AI 선생님 피드백'}</span></div><div class="space-y-8">${feedbackSectionHTML('피드백', 'FEEDBACK', renderFormatted(fd.feedback))}${feedbackSectionHTML('모범 답안', 'CORRECTION', esc(fd.correction), true)}${details}</div><div class="mt-8 pt-4 border-t border-gray-200"><p class="text-[10px] text-gray-400 font-sans text-center">※ AI가 생성한 피드백이므로 간혹 부자연스럽거나 오류가 있을 수 있습니다.</p></div></div>`;
            }
            const disabled = (!st.text.trim() || st.generating);
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal whitespace-pre-line">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14">${st.showTrans ? `<p class="text-sm font-sans text-gray-500 mb-5 animate-fade-in whitespace-pre-line">${esc(item.questionEng)}</p>` : ''}${(item.sub||[]).length ? `<ul class="mb-4 space-y-2.5 list-none pl-0">${item.sub.map((sq, si) => `<li class="dq-sub flex gap-2 font-serif"><span class="dq-num shrink-0 font-sans">${item.id}-${si + 1}</span><span>${esc(sq)}${st.showTrans && item.subEng && item.subEng[si] ? `<span class="dq-eng block font-sans text-gray-400 mt-1 animate-fade-in">${esc(item.subEng[si])}</span>` : ''}</span></li>`).join('')}</ul>` : ''}<div class="flex justify-end mb-5">${transBtn('discuss-qtrans', st.showTrans)}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block tracking-widest">${secLang() ? 'Key Vocabulary' : '핵심 어휘'}</span><div class="space-y-1">${vocab}</div></div><textarea data-action="discuss-text" placeholder="${secLang() ? '여기에 생각을 적어보세요... / Write your thoughts here...' : '여기에 생각을 적어보세요...'}" class="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300">${esc(st.text)}</textarea><div class="flex justify-end"><button type="button" data-action="discuss-feedback" ${disabled ? 'disabled' : ''} class="px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${disabled ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}">${st.generating ? '<div class="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></div>생성 중<span class="lk-en"> · Generating...</span>' : 'AI 피드백 받기<span class="lk-en"> · Get AI Feedback</span>'}</button></div>${fb}</div></div>`;
        }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">생각해 보기</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Food For Thought</span></div><div class="bg-gray-50 border border-gray-200 py-4 px-5 mb-24 md:mb-32 rounded-none flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div class="flex gap-4 items-center"><div class="shrink-0 text-gray-400">${svgIcon('sparkles', 'w-5 h-5', { fill: 'currentColor' })}</div><div class="flex flex-col"><p class="text-xs font-bold font-sans text-gray-800 leading-tight">AI 피드백은 현재 Gemini 웹에서만 가능합니다.</p><p class="lk-en text-[10px] font-sans text-gray-400 mt-1">AI feedback is currently available only on Gemini web.</p></div></div><a href="https://gemini.google.com" target="_blank" rel="noreferrer" class="group flex flex-col items-center justify-center bg-white py-1.5 px-3 shadow-sm hover:shadow transition-all shrink-0 no-underline rounded-none border border-gray-100"><div class="flex items-center gap-1"><span class="text-[11px] font-bold font-sans text-gray-700 group-hover:text-black">Gemini에서 열기</span>${svgIcon('externalLink', 'w-3 h-3 text-gray-400 group-hover:text-black')}</div><span class="lk-en text-[9px] font-sans text-gray-400 group-hover:text-gray-600 uppercase tracking-widest mt-0.5">Open in Gemini</span></a></div><div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;

        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);
            if (out.length) return out;
            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            const hasVideos = (typeof VIDEOS !== 'undefined' && VIDEOS.length && VIDEOS[0].script && VIDEOS[0].script.length);
            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);
            if (typeof READING_DATA !== 'undefined' && Array.isArray(READING_DATA) && READING_DATA.length) s.push(['reading', '읽기 자료']);
            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);
            if (typeof QUIZ_LIST !== 'undefined' && Array.isArray(QUIZ_LIST) && QUIZ_LIST.length) s.push(['quiz', '내용 확인 퀴즈']);
            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;
        }
        function pwScriptHTML() {
            const vids = (typeof VIDEOS !== 'undefined' && VIDEOS.length) ? VIDEOS : [{ title: '', script: (typeof VIDEO_SCRIPT_DATA !== 'undefined' ? VIDEO_SCRIPT_DATA : []) }];
            return vids.map(v => `${(vids.length > 1 && v.title) ? `<div class="pw-part-title">${esc(v.title)}${v.subTitle ? ' · ' + esc(v.subTitle) : ''}</div>` : ''}${(v.script || []).map(l => `<div class="pw-line"><div class="pw-kor"><span class="pw-spk">${esc(l.speaker || '')}</span>${esc(l.kor || '')}</div>${l.eng ? `<div class="pw-eng">${esc(l.eng)}</div>` : ''}</div>`).join('')}`).join('');
        }
        function pwReadingHTML() {
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')}</div>${r.subtitle ? `<div class="pw-read-sub">${esc(r.subtitle)}</div>` : ''}${(r.content || []).filter(p => !p.isChart).map(p => p.isHeading ? `<div class="pw-read-h">${esc(p.text || '')}</div>` : `<div class="pw-read-p">${esc(p.text || '')}</div>`).join('')}`).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 이벤트 위임 ----------
        appEl.addEventListener('click', (e) => {
            const vdo = e.target.closest('[data-video-open]'); if (vdo) { const vi = +vdo.dataset.videoOpen; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; } setTab('video'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const _sl = e.target.closest('[data-setlang]');
            if (_sl) { app.lang = _sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            const _wasLangOpen = app.langOpen; app.langOpen = false;
            if (_wasLangOpen && !e.target.closest('[data-tab],[data-action],[data-line-play],[data-line-seek],[data-vocab-idx],[data-layout]')) { buildApp(); return; }
            const tab = app.activeTab;
            if (tab === 'video') {
                const vsel = e.target.closest('[data-video-idx]');
                if (vsel) { const vi = +vsel.dataset.videoIdx; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; paint(); } return; }
                const vspan = e.target.closest('[data-vocab-idx]'); if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) closeVocabPopup(); else showVocabPopup(w, r.left + r.width / 2, r.bottom, true); return; }
                const pt = e.target.closest('[data-pane-toggle]'); if (pt) { const vi = +pt.dataset.paneVideo; let vOn = learn.layout !== 'script', sOn = learn.layout !== 'video'; if (pt.dataset.paneToggle === 'video') vOn = !vOn; else sOn = !sOn; if (!vOn && !sOn) { vOn = true; sOn = true; } const nl = (vOn && sOn) ? 'split' : (vOn ? 'video' : 'script'); if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; learn.layout = nl; paint(); return; } learn.layout = nl; const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = curVideo().script.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'), sbBtn = e.target.closest('[data-action^="sb-trans-"]'); if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) { const act = a.dataset.action; if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } } else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); } else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); } else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); } }
                return;
            }
            if (tab === 'vocab') {
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;  // 동영상 컨트롤 조작 시 뒤집지 않음
                    const fa = e.target.closest('[data-action^="fc-"]');
                    if (fa) {
                        const act = fa.dataset.action;
                        if (act === 'fc-flip') fcSetFlip(!fc.flipped);
                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });
                        else if (act === 'fc-order') fcSetOrder(fa.dataset.sh==='1');
                        else if (act === 'fc-audio') fcPlay(fcCur().audio);
                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }
                        else if (act === 'fc-again-u') { fc.shuffled=true; fcStart(fcUnknown()); fcRefreshDeck(); }
                        else if (act === 'fc-again-all') { fc.shuffled=true; fcStart(null); fcRefreshDeck(); }
                    }
                    return;
                }
                if (e.target.closest('[data-action="voc-clear"]')) { voc.q=''; const si=qs('#voc-search',viewRoot()); if(si)si.value=''; refreshVocGrid(); return; }
                const card = e.target.closest('[data-vidx]'); const exBtn = e.target.closest('[data-action="vocab-ex"]'); if (card && exBtn) { const i = +card.dataset.vidx; vocabExpand[i] = !vocabExpand[i]; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i); } return;
            }
            if (tab === 'quiz') {
                const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return; const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            if (e.target.id === 'seek') { const t = parseFloat(e.target.value); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; updateSeekUI(); return; }
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'voc-search') { voc.q = e.target.value; refreshVocGrid(); return; }
            if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return; if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } } else if (e.code === 'ArrowUp') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { if (p.isMuted && p.isMuted()) p.unMute(); p.setVolume(Math.min(100, Math.round(p.getVolume()) + 10)); } } else if (e.code === 'ArrowDown') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { p.setVolume(Math.max(0, Math.round(p.getVolume()) - 10)); } } else if (e.key === ',' || e.key === '.') { e.preventDefault(); const steps = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]; let idx = steps.indexOf(learn.rate); if (idx < 0) idx = 2; idx = Math.min(steps.length - 1, Math.max(0, idx + (e.key === ',' ? -1 : 1))); learn.rate = steps[idx]; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); if (typeof rebuildToolbar === 'function') rebuildToolbar(); } else if (e.key === 'm' || e.key === 'M') { const p = learn.player; if (p && p.isMuted) { if (p.isMuted()) p.unMute(); else p.mute(); } }
        });
        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용. 카드 없으면/터치면 비활성)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.generating) return; st.generating = true; st.error = ''; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id); const lvl = app.userLevel;
            const beginner = ['A1', 'A1+', 'A2', 'A2+', 'B1', 'B1+'].includes(lvl);
            const instr = beginner ? `The student's level is ${lvl}. Write 'feedback' in ENGLISH; 'correction' in natural Korean; 'detailed_corrections' explanations in ENGLISH, wrapping Korean words in **bold**.` : `학생 레벨은 ${lvl}. 모든 필드를 한국어로만 작성. explanation 안 한국어 강조는 **단어** 사용.`;
            const vocabCtx = item.vocab ? (item.vocab||[]).map(v => `- ${v.term}: ${v.def}`).join('\n') : '없음';
            const sys = `당신은 한국어 선생님입니다.\n${instr}\n맞춤법·띄어쓰기·문법 오류를 찾고, 'correction'은 해요체로. JSON만 응답(마크다운 금지): {"feedback":"","correction":"","detailed_corrections":[{"original":"","corrected":"","explanation":""}]}\n[핵심 어휘]\n${vocabCtx}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: `${sys}\n\n질문: "${item.questionKor}"\n학생 답변: "${st.text}"` }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const r = await callGeminiWithBackoff(payload); const txt = r.candidates && r.candidates[0] && r.candidates[0].content.parts[0].text; if (!txt) throw new Error('피드백을 생성하지 못했습니다.'); st.feedback = JSON.parse(txt.replace(/^```(json)?\n?/, '').replace(/\n?```$/, '').trim()); }
            catch (err) { st.error = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.'; }
            finally { st.generating = false; rerenderDiscussItem(id); }
        }

        buildApp();
    })();
    </script>
