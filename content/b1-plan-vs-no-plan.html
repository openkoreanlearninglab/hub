            {"id": 1, "questionKor": "우디는 어디로 여행을 가요?", "questionEng": "Where is Woody going on his trip?", "sentence_pre": "우디는 아직 몰라요. ", "correct_word": "어디 갈지", "sentence_post": " 공항에서 정할 거예요.", "translation_pre": "He doesn't know yet. He'll decide ", "translation_answer": "where to go", "translation_post": " at the airport.", "hint": "Where to go (-ㄹ/을지 + 정하다).", "options": [{"text": "어디 갈지", "isCorrect": true, "feedback": "Correct! -ㄹ/을지 turns \"where to go\" into one chunk, the thing he'll decide (정하다) at the airport."}, {"text": "어디 가서", "isCorrect": false, "feedback": "Not quite. -아서/어서 means \"go somewhere and then…,\" but Woody hasn't gone anywhere yet. What he'll decide at the airport is where to go."}, {"text": "어디 가면", "isCorrect": false, "feedback": "Not quite. -(으)면 means \"if.\" \"If he goes somewhere, he'll decide at the airport\" doesn't make sense."}, {"text": "어디 가려고", "isCorrect": false, "feedback": "Not quite. -(으)려고 shows a purpose (\"in order to go somewhere\"). He isn't deciding in order to go; he's deciding where to go."}]},

            {"id": 3, "questionKor": "우디는 여행 가서 언제 먹고 언제 자요?", "questionEng": "On a trip, when does Woody eat and when does he sleep?", "sentence_pre": "우디는 배고플 때 먹고 졸릴 때 자요. 여행에서는 뭐든지 ", "correct_word": "마음 가는 대로", "sentence_post": " 해요.", "translation_pre": "Woody eats when he's hungry and sleeps when he's sleepy. On a trip, he does everything ", "translation_answer": "just as he feels like it", "translation_post": ".", "hint": "Doing what you want, when you want.", "options": [{"text": "마음 가는 대로", "isCorrect": true, "feedback": "Correct! 마음 가는 대로 = what you want to do, when you want to do it. No rules on Woody's trips."}, {"text": "계획대로", "isCorrect": false, "feedback": "Not quite. 계획대로 means \"as planned.\" Woody has no plan to follow!"}, {"text": "일정표대로", "isCorrect": false, "feedback": "Not quite. 일정표대로 means \"by the schedule.\" That's Yuna's way, not Woody's."}, {"text": "미리", "isCorrect": false, "feedback": "Nope. 미리 means \"in advance.\" Woody does things in the moment, not beforehand."}]},
            {"id": 4, "questionKor": "유나는 언제 여행을 준비해요?", "questionEng": "When does Yuna prepare for a trip?", "sentence_pre": "유나는 여행을 ", "correct_word": "떠나기 전에 미리", "sentence_post": " 다 정해 둬요.", "translation_pre": "Yuna decides everything ", "translation_answer": "in advance, before she leaves", "translation_post": ".", "hint": "Before leaving, in advance.", "options": [{"text": "떠나기 전에 미리", "isCorrect": true, "feedback": "Correct! -기 전에 = before ~ing, and 미리 = in advance. With -아/어 두다, she decides everything and has it ready."}, {"text": "떠난 후에 거기에서", "isCorrect": false, "feedback": "Not quite. -(으)ㄴ 후에 means \"after.\" Deciding after you arrive is Woody's style!"}, {"text": "떠나는 날 즉흥적으로", "isCorrect": false, "feedback": "Not quite. 즉흥적으로 means \"on the spur of the moment.\" Yuna is the opposite."}, {"text": "떠나고 나서 나중에", "isCorrect": false, "feedback": "Not quite. -고 나서 means \"after doing,\" and 나중에 means \"later.\" Yuna doesn't leave things for later."}]},
            {"id": 5, "questionKor": "유나는 여행 가기 전에 무엇을 만들어요?", "questionEng": "What does Yuna make before a trip?", "sentence_pre": "유나는 ", "correct_word": "일정표", "sentence_post": "를 만들어요. 몇 시에 무엇을 할지 \"1시 5분, 화장실\"까지 다 적어 둬요.", "translation_pre": "Yuna makes a ", "translation_answer": "schedule", "translation_post": ". She writes down what to do at what time, even \"1:05, restroom.\"", "hint": "A paper with what to do at what time.", "options": [{"text": "일정표", "isCorrect": true, "feedback": "Correct! An 일정표 is a paper with what you'll do at what time. Yuna's even has a restroom break."}, {"text": "일기", "isCorrect": false, "feedback": "Nope. 일기 is a diary. You write it after things happen, not before."}, {"text": "지도", "isCorrect": false, "feedback": "Nope. 지도 is a map. A map doesn't say \"1:05, restroom.\""}, {"text": "메뉴판", "isCorrect": false, "feedback": "Nope. 메뉴판 is a restaurant menu. Yuna's paper is a schedule."}]},

="err-fix"><span class="err-fix-t">${"A"===t?"Try this":"C"===t?"이렇게 해 보세요":"이렇게 해 보세요 · Try this"}</span><ul>${f}</ul></div>`:""}${a.detail?`<details class="err-d"><summary>${"C"===t?"자세히":"A"===t?"Details":"자세히 · Details"}</summary><pre>${n(a.detail)}</pre></details>`:""}</div>`}const C={A:t=>`[설명 언어 — A 모드]\n- 학습자는 초급(${t})이라 한국어 설명을 이해하지 못합니다. explanation, praise, comment는 모두 쉬운 일상 영어로 씁니다. original, corrected, suggested, example, modelAnswer는 한국어입니다.\n- modelAnswer를 쓸 때는 modelAnswerEn에 자연스러운 영어 번역을 씁니다. explanationEn, praiseEn, commentEn은 빈 문자열입니다.\n- 문법 용어를 쓰지 않습니다. 금지: particle, marker(단독 용어로), subject, object, topic, conjugation, conjugate, stem, honorific, connective, ending(문법 용어로), irregular, collocation, modifier, adnominal, nominalizer, tense, clause, predicate.\n- 대신 한국어 형태를 그대로 부르고, 그 형태가 하는 일을 일상 영어로 풀어서 설명합니다. 예: "이/가 points at who does the action. 을/를 points at the thing the action happens to."\n- 설명은 1~2문장으로 짧게 씁니다. example은 [예문 쓰는 법]을 따릅니다. 형태가 늘 틀린 경우(조사·활용)에는 "(O)"/"(X)" 짝이 가장 알기 쉽습니다.\n\n[corrections — 틀린 부분 (빨간색)]\n특히 다음을 찾아 고칩니다.\n- 이/가, 은/는, 을/를, 에/에서, 도, 만 같은 조사를 잘못 쓴 경우 (tag: 조사)\n- 동사·형용사 모양을 잘못 바꾼 경우. 예: 맵어요 → 매워요, 듣어요 → 들어요 (tag: 활용)\n- 함께 쓰지 않는 단어 조합. 예: 옷을 쓰다 → 옷을 입다 (tag: 단어 조합)\n- 기본 문법 오류, 시제, 어순 (tag: 문법)\n- 맞춤법·오타, 빠진 말, 종결어미 섞임\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.RED_TAGS.join(", ")}\n\n[suggestions — 더 좋은 표현 (주황색)]\n- 문법은 맞지만 한국 사람이 그렇게 말하지 않는 경우에만, 최대 ${FEEDBACK_CONFIG.MAX_SUGGESTIONS.A}개 제안합니다. 더 어려운 표현으로 바꾸는 제안은 하지 않습니다.\n- tag: 더 좋은 표현. word는 모두 빈 문자열입니다.`,B:t=>`[설명 언어 — B 모드]\n- 모든 설명(explanation, praise, comment)은 한국어 해요체로 쓰고, 문장 끝은 반드시 "-요"로 끝냅니다.\n- 설명 문장의 어휘·문법은 ${FEEDBACK_CONFIG.EXPLAIN_LEVEL[t]||"B1"} 수준으로 씁니다(최고 B1, 최저 A2+). 짧은 문장으로 씁니다.\n- 각 한국어 설명의 자연스러운 영어 번역을 explanationEn, praiseEn, commentEn에 씁니다. modelAnswer가 있으면 modelAnswerEn에 영어 번역을 씁니다. 영어 번역에도 어려운 문법 용어를 쓰지 않습니다.\n- 고칠 대상(original)은 학습자가 쓴 그대로 인용합니다.\n- '주어, 서술어, 조사' 같은 기본 문법 용어는 써도 되지만, 어려운 언어학 용어는 쓰지 않고 풀어서 설명합니다.\n- 규칙만 말하지 말고, 이 문장에서 왜 문제인지를 함께 설명합니다. example은 [예문 쓰는 법]을 따릅니다.\n- '피동', '의존명사', '관형형' 같은 문법 용어를 쓰면 바로 뒤에 쉬운 말로 풀어 줍니다. 예: "피동(주어가 남의 힘에 의해 움직이는 동사의 형태)". 단, 설명 안에서 이미 그 뜻을 풀어 말했으면 괄호 풀이를 또 붙이지 않습니다. 같은 말을 되풀이하지 않습니다.\n\n[corrections — 틀린 부분 (빨간색) — B 모드의 중심]\n이 레벨 학습자는 문장 오류가 많습니다. 문장을 바르게 완성하는 데 집중해서 다음을 모두 찾아 고칩니다.\n- 조사 오류. 특히 은/는과 이/가: '-면', '-ㄹ 때' 같은 조건 부분의 주어는 '-이/가', 두 가지를 대조할 때는 '-은/는' (예: 날씨가 좋으면 저는 산책을 해요)\n- 동사·형용사 활용 오류\n- 시제: 지난 일은 과거형, 늘 그런 일이나 일반적인 사실은 현재형\n- 연결어미: 이유·순서는 '-아서/-어서', 나열은 '-고', 대조는 '-지만', 배경은 '-는데'. 'A가 아니고 B예요'처럼 앞을 부정하고 바로잡을 때는 '-아니라'\n- 능동과 피동: [조사 '-은/는'이 붙은 말과 능동·피동 확인]을 따릅니다.\n- 주어와 서술어가 맞지 않는 문장, 어순, 꼭 필요한 말(주어·조사)이 빠진 경우\n- 함께 쓰지 않는 단어 조합, 문맥상 어색한 표현, 맞춤법·오타, 종결어미 섞임\n- 뜻이 비슷한 단어 중 더 정확한 것을 고르는 미묘한 차이는 지적하지 않습니다. 뜻이 잘못 전달될 때만 고칩니다.\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.RED_TAGS.join(", ")}\n\n[suggestions — 더 좋은 표현 (주황색)]\n- 문법은 맞지만 어색한 문장이 있을 때만, 최대 ${FEEDBACK_CONFIG.MAX_SUGGESTIONS.B}개 제안합니다. 더 어려운 표현으로 바꾸는 제안은 하지 않습니다.\n- 학습자가 구어체로 써도 지적하지 않습니다. 대안 문장은 한국 사람이 실제로 말하는 자연스러운 구어체로 제시합니다. 종결어미는 학습자가 고른 것(반말/해요체 등)에 맞춥니다.\n- tag: 더 좋은 표현, 일관성. word는 모두 빈 문자열입니다.`,C:t=>`[설명 언어 — C 모드]\n- 모든 설명(explanation, praise, comment)은 한국어 해요체로 쓰고, 문장 끝은 반드시 "-요"로 끝냅니다. 영어는 쓰지 않습니다. explanationEn, praiseEn, commentEn, modelAnswerEn은 빈 문자열입니다.\n- 설명 문장의 어휘·문법·문장 구조는 ${FEEDBACK_CONFIG.EXPLAIN_LEVEL[t]||"B2"} 이하 수준으로 쉽고 짧게 씁니다.\n- 단, 고칠 대상(original)은 학습자가 쓴 그대로 인용하고, 고친 표현(corrected, suggested)은 레벨을 고려하지 않고 가장 자연스러운 표현으로 씁니다.\n- '주어, 서술어, 조사, 조건절, 안긴문장' 같은 기본 문법 용어는 써도 되지만, '연어'처럼 어려운 언어학 용어는 쓰지 말고 "'옷'과 '쓰다'는 함께 쓰지 않아요"처럼 풀어서 설명합니다.\n- 규칙만 말하지 말고, 이 문장에서 왜 문제인지를 함께 설명합니다. example은 [예문 쓰는 법]을 따릅니다.\n- '피동', '의존명사', '관형형' 같은 문법 용어를 쓰면 바로 뒤에 쉬운 말로 풀어 줍니다. 예: "피동(주어가 남의 힘에 의해 움직이는 동사의 형태)". 단, 설명 안에서 이미 그 뜻을 풀어 말했으면 괄호 풀이를 또 붙이지 않습니다. 같은 말을 되풀이하지 않습니다.\n- 학습자가 일부러 그렇게 썼을 수도 있는 경우에는 단정하지 말고 "~을 말하고 싶었다면 ~가 더 자연스러워요"처럼 씁니다.\n- 오타처럼 이유가 분명한 경우에는 explanation을 빈 문자열로 둡니다.\n\n[corrections — 고쳐야 하는 부분 (빨간색)]\n빨간색에는 두 종류가 있습니다. (1) 문법적으로 틀린 것, (2) 문법은 맞지만 이 문맥에서는 틀린 것(어색한 표현). 둘 다 corrections에 씁니다.\n(1) 문법적 오류\n- 맞춤법, 오타, 띄어쓰기, 조사, 활용(예: 힘든다 → 힘들다, 창조적은 → 창조적인), 문법 형태가 섞인 경우(예: -는지 아닌지와 -나를 함께 씀)\n- 주어와 서술어가 맞지 않는 문장. 특히 능동/피동이 맞지 않는 경우(예: 사람들이 누군가를 살인자라고 불리다 → 부르다)\n- 종결어미가 섞인 경우\n(2) 문맥상 어색한 표현 — 선생님 첨삭에서 가장 많이 나오는 순서대로 꼼꼼히 확인합니다.\n- 은/는과 이/가: 문단의 주제인지, 조건절·안긴문장 안의 주어인지, 대조인지에 따라 맞는지 확인합니다. (tag: 조사)\n- 단어 선택: 뜻이 비슷하지만 이 문맥에 맞지 않는 단어. 예: 동기를 악화하다 → 약화하다, 일시성 → 한시성, 교육 방식을 검수하다 → 검토하다, 해를 보다 → 해를 입다 (tag: 단어 선택)\n- 함께 쓰지 않는 단어 조합. 예: 명암을 하다 → 명암을 표현하다, 어떤 일반 물건 → 평범한 물건 (tag: 단어 조합)\n- 시제와 상: 가정하는 상황인데 과거형을 쓴 경우, 일반적인 사실인데 '-은'을 쓴 경우(만족한 → 만족하는) 등 (tag: 시제)\n- '-는 것이다'를 묘사·서술 문장에 쓴 경우. '-는 것이다'는 본질이나 정의를 규정할 때 씁니다. 묘사는 '-ㄴ다'로 끝냅니다. (tag: 문맥상 어색한 표현)\n- 접속어와 연결어미의 논리: 따라서(결과)를 이유가 필요한 자리에 쓴 경우, 약한 대조 '그런데'를 강한 역접 자리에 쓴 경우, '-고'(나열)와 '-며/-아서'(긴밀한 관계·인과)를 잘못 고른 경우, '때'(특정 순간)와 '-면'(일반 조건) (tag: 연결 표현)\n- 영어를 직역한 서술어. 예: 질문이 생기지 못한다 → 질문을 떠올릴 겨를이 없다 (tag: 문맥상 어색한 표현)\n- 불필요한 반복이나 중복. 예: 녹화하기 가능한 → 녹화 가능한 (tag: 불필요한 반복)\n- 능동과 피동: 예: 그런 시설이 지방에 잘 갖추면 → 갖춰지면 (tag: 주어·서술어 호응). [조사 '-은/는'이 붙은 말과 능동·피동 확인]을 따릅니다.\n- 'A가 아니고 B이다'처럼 앞을 부정하고 뒤를 바로잡는 문장은 '-아니라'를 씁니다. 예: 문제는 돈이 아니고 시간이다 → 돈이 아니라 (tag: 연결 표현)\n- 과거와 현재, 이것과 저것을 대조할 때 대조하는 말에 '-은/는'이 빠진 경우. 예: 처음 시작했을 때 어려웠지만 지금은 쉽다 → 시작했을 때는 (tag: 조사)\n- 꼭 필요한 말이 빠진 경우: 글에서 생략하면 안 되는 주어·조사, 가리키는 대상이 분명해야 하는 지시어('이' 배), 무엇의 김이 빠지는지 같은 대상 (tag: 빠진 말)\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.RED_TAGS.join(", ")}\n\n[suggestions — 틀리지 않았지만 더 좋은 대안 (주황색)]\n선생님이 '더 좋은 표현'을 제안하는 기준입니다. 이 기준에 해당할 때만 제안합니다.\n- 문체 일관성 (tag: 문어체): 글의 어조에 비해 지나치게 구어적인 표현을 문어체로 바꿉니다. 예: 인생의 의미가 뭐냐는 → 삶의 의미는 무엇인가라는, 권태를 이기다 → 극복하다, 우리가 알든 모르든 상관없이 → 우리의 인식과 무관하게, 글에서 생략한 조사 살리기. "근데, 되게, 막, 진짜", "거/건/게" 같은 줄인 형태도 해당합니다. 종결어미(-다/-요/-니다) 자체는 대상이 아닙니다. 구어체를 문어체로 바꾸는 제안에만 이 태그를 씁니다.\n- 더 정확한 어휘 (tag: 정확한 어휘): 틀리지는 않았지만 뜻이 더 정확하게 맞는 단어. 예: 기준을 쓰다 → 기준을 적용하다, 공상과 현실의 사이 → 관계, 오랫동안 → 오래전부터(과거부터 지금까지 이어짐), 잘 알고 있다 → 인지하고 있다\n- 고급 표현 (tag: 고급 표현): 같은 뜻을 더 간결하고 글에 맞는 어휘(주로 한자어)나 압축된 구조로 바꿀 수 있을 때. 예: 그림 그리기 → 회화(繪畵), 한쪽이 다른 쪽 없이 생존할 수 없는 관계 → 불가분의 관계, 육체 노동으로 → 노동집약적 산업으로\n  · 레벨(${t})보다 반 단계~한 단계 높은 수준이어야 합니다. 말을 늘이거나 조사·어미만 바꾼 것은 고급 표현이 아닙니다.\n  · 가능하면 [핵심 어휘]나 [본문]에 나온 어휘를 씁니다. explanation에 "본문에서 나온 표현"이라고 쓰는 것은 그 표현이 실제로 [본문]이나 [핵심 어휘]에 있을 때만입니다.\n- 번역투 (tag: 번역투): 영어 구조를 옮긴 듯한 문장. 예: ~ 중에 하나는 ~이다(One of ~ is) → ~ 중에는 ~이 있다, 모양을 가지고 있다 → 모양이다, '-의'가 여러 번 이어지는 구조, 불필요한 피동 → 능동\n- 문장 구조와 일관성 (tag: 일관성): 첫 번째는 / 두 번째 이유는처럼 나열 형식이 다른 경우, 너무 긴 안긴문장의 주어를 바꾸면 쉽게 읽히는 경우\n- 논리 연결 (tag: 논리 연결): 두 사실의 관계를 더 분명하게 보여 주는 표현. 예: 두 사건을 따로 나열(상류층이 늘었고 신흥 부자가 생겼다) → 인과로 연결(신흥 부자들이 생겨나면서 상류층이 확대되었다), 의미가 모호하고 약한 주장(관련이 있다) → 정확한 강도의 주장(영향을 미쳤을 가능성이 있다)\n- 대체 표현 (tag: 대체 표현): 원래 표현도 좋지만 함께 알아 두면 좋은 다른 표현. suggested에 "A / B"처럼 1~2개를 씁니다.\n- 다른 글쓰기 스타일 (tag: 다른 글쓰기 스타일): 문장은 문법적으로 알맞고 자연스럽지만, 다른 전개 방식이 글의 설득력을 높이는 경우. 예: '따라서'로 바로 주장하는 대신 '특히'로 이유나 사례를 먼저 제시하기\n- 의도에 따라 달라요 (tag: 의도에 따라 달라요): 학습자가 무슨 뜻으로 썼는지에 따라 맞는 표현이 다른 경우. explanation에 "~라는 뜻이면 원래 표현이 맞고, ~라는 뜻이면 ~가 더 자연스러워요"처럼 두 해석을 모두 씁니다.\n[주황색 설명 방식]\n- explanation은 원래 표현이 틀리지 않았다는 점을 먼저 인정합니다(예: "틀린 표현은 아니지만"). 그다음 두 표현의 뜻이나 느낌이 어떻게 다른지, 이 문맥에서는 왜 제안한 표현이 더 맞는지 씁니다.\n- 학습자가 일부러 그렇게 썼을 수도 있으면 "특별한 이유가 있어서 그렇게 썼을 수 있지만"처럼 단정하지 않습니다.\n- 쉬운 표현을 모두 고치지 않습니다. 제안할 만한 곳이 없으면 suggestions는 빈 배열입니다.\n- 제안에 새 어휘를 썼으면 word에 그 어휘(term), 한자어이면 한자(hanja), 쉬운 뜻(meaning)을 씁니다. 없으면 모두 빈 문자열입니다.\n- 가장 도움이 되는 순서로 최대 ${FEEDBACK_CONFIG.MAX_SUGGESTIONS.C}개까지만 씁니다.\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.ORANGE_TAGS.C.join(", ")}`},L={A:'질문: 어제 뭐 먹었어요?\n학습자 글: 저는 어제 밥이 먹었어요. 한국 음식은 맵어요.\n출력: {"relevance":{"status":"on","comment":"","commentEn":"","modelAnswer":"","modelAnswerEn":""},"praise":"You clearly said what you ate and how it tasted.","praiseEn":"","corrections":[{"original":"밥이 먹었어요","corrected":"밥을 먹었어요","tag":"조사","explanation":"Use 을/를 here, not 이/가. 이/가 points at who does the action, but 밥 is the thing being eaten.","explanationEn":"","example":"저는 빵을 먹어요. (O) / 저는 빵이 먹어요. (X)"},{"original":"맵어요","corrected":"매워요","tag":"활용","explanation":"맵다 changes to 매워요, not 맵어요. When a word ends in ㅂ, the ㅂ turns into 우 bef
