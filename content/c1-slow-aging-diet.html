    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            { title: 'Part 1', subTitle: '', videoId: 'LYzS__lGpvs', script: [
            { id: "s1", speaker: "루나 PD", kor: "교수님은 어떻게 맛있는 음식에 대한 어떤 욕구가 없으세요?", time: [0.000, 4.060], eng: "Professor, how is it that you have no craving at all for delicious food?" },

            { id: "s3", speaker: "루나 PD", kor: "먹을 게 없을 것 같은데요.", time: [4.970, 5.890], eng: "It seems like there'd be nothing left to eat." },

            { id: "s27", speaker: "루나 PD", kor: "자… 여기에 온 가장 큰 이유도 주변에서 워낙 제 걱정을 많이 하셔가지고…", time: [100.720, 106.650], eng: "So… the biggest reason I came here is that people around me worry about me so much…" },
            { id: "s28", speaker: "정희원 교수", kor: "아이고, 네…", time: [106.690, 108.350], eng: "Oh dear, I see…" },
            { id: "s29", speaker: "루나 PD", kor: "마침 제가 한 2주 전에 건강검진을 다녀왔어요.", time: [108.380, 112.350], eng: "As it happens, I had a medical checkup about two weeks ago." },
            { id: "s30", speaker: "정희원 교수", kor: "일단 줘 보시겠어요?", time: [112.380, 113.330], eng: "Could you hand it over first?" },
            { id: "s31", speaker: "루나 PD", kor: "무서워요.", time: [113.360, 115.700], eng: "I'm scared." },
            { id: "s32", speaker: "정희원 교수", kor: "어이구.", time: [115.740, 116.390], eng: "Oh my." },
            { id: "s33", speaker: "루나 PD", kor: "표정이 굉장히 심각해지셨는데.", time: [121.620, 124.260], eng: "Your face just got really serious." },
            { id: "s34", speaker: "정희원 교수", kor: "공복 인슐린이 17.1이네요.", time: [124.290, 126.780], eng: "Your fasting insulin is 17.1." },
            { id: "s35", speaker: "루나 PD", kor: "안 좋은 거예요?", time: [126.810, 127.800], eng: "Is that bad?" },
            { id: "s36", speaker: "정희원 교수", kor: "잠시만요. 굉장히 높은 건데요.", time: [127.830, 129.900], eng: "One moment. That is extremely high." },
            { id: "s37", speaker: "루나 PD", kor: "어떡해?, 갑자기 땀이 나는데.", time: [129.930, 133.170], eng: "Oh no — I'm suddenly breaking into a sweat." },
            { id: "s38", speaker: "정희원 교수", kor: "아이고, 그래. 호마 IR이 3.7이네.", time: [133.210, 136.840], eng: "Oh dear. Your HOMA-IR is 3.7." },
            { id: "s39", speaker: "정희원 교수", kor: "호마 IR이라는 게 인슐린 저항성을 보는 건데,", time: [136.880, 139.940], eng: "HOMA-IR is a measure of insulin resistance," },
            { id: "s40", speaker: "정희원 교수", kor: "인슐린 저항성이 상당히 심하네요.", time: [139.980, 143.450], eng: "and your insulin resistance is quite severe." },
            { id: "s41", speaker: "정희원 교수", kor: "근데 지금 보면 아직까지는 연배가 젊으셔서 무료 구독 기간에 있기 때문에…", time: [143.480, 147.940], eng: "But looking at this, you're still young, so you're in the free subscription period…" },
            { id: "s42", speaker: "루나 PD", kor: "아, 네. 아직 만으로는 20대예요.", time: [147.970, 150.650], eng: "Ah, yes. I'm still in my twenties by international age." },
            { id: "s43", speaker: "루나 PD", kor: "그 무료 구독 기간이 언제쯤 끝날지 알 수 있나요?", time: [150.680, 154.290], eng: "Is there a way to know roughly when that free subscription period ends?" },
            { id: "s44", speaker: "정희원 교수", kor: "이제 끝났습니다.", time: [154.320, 155.160], eng: "It has already ended." },
            { id: "s45", speaker: "루나 PD", kor: "네? 이제 끝이에요, 저?", time: [155.190, 157.740], eng: "What? It's over for me already?" },
            { id: "s46", speaker: "정희원 교수", kor: "큰일 났네.", time: [160.630, 161.480], eng: "This is trouble." },
            { id: "s47", speaker: "루나 PD", kor: "큰일 났네요.", time: [161.510, 162.530], eng: "This is trouble." },
            { id: "s48", speaker: "루나 PD", kor: "어떡해? 우리 프로그램 폐지해야 되는 거 아니야?", time: [162.560, 165.390], eng: "What do we do? Don't we have to cancel our show?" },
            { id: "s49", speaker: "정희원 교수", kor: "아이고, 그 뒤에 보니까 망빙 사진이 있어요.", time: [165.420, 168.400], eng: "Oh dear — and behind that, I see a photo of mango shaved ice." },
            { id: "s50", speaker: "루나 PD", kor: "어머, 어떡해.", time: [168.430, 169.950], eng: "Oh no, what do I do." },
            { id: "s51", speaker: "정희원 교수", kor: "전면적인 대사 건강 개선 프로젝트가 필요한 상황이고…", time: [169.990, 173.950], eng: "You're in a situation that calls for a comprehensive metabolic health improvement project…" },
            { id: "s52", speaker: "루나 PD", kor: "교수님, 웃지 않고 얘기하시니까 더 지금 심각하신 거죠?", time: [173.990, 177.320], eng: "Professor, you're saying it without smiling, which means it's serious, right?" },
            { id: "s53", speaker: "정희원 교수", kor: "네. 제가 젊은 사람부터 관리를 해야 된다는 이유가,", time: [177.350, 181.200], eng: "Yes. The reason I say management should start with young people is that" },
            { id: "s54", speaker: "정희원 교수", kor: "젊었을 때의 내가 먹고 마시고 즐기고 그리고 운동하는 것들, 생활습관, 스트레스, 이런 것들 다 가늘고 길게 뽑으면", time: [181.240, 189.630], eng: "if you stretch out everything from your younger years — what you eat, drink, enjoy, how you exercise, your habits, your stress — thin and long," },
            { id: "s55", speaker: "정희원 교수", kor: "노인의 몸이 되는 시점을 뒤로 미룰 수가 있어요.", time: [189.660, 194.110], eng: "you can push back the point at which your body becomes an old body." },
            { id: "s56", speaker: "정희원 교수", kor: "가속노화 식사를 하게 되면 혈당 스파이크가 생겨요.", time: [194.140, 197.650], eng: "If you eat a fast-aging diet, you get blood sugar spikes." },
            { id: "s57", speaker: "루나 PD", kor: "혈당 스파이크, 많이 들어봤어요.", time: [197.680, 199.290], eng: "Blood sugar spikes — I've heard that a lot." },
            { id: "s58", speaker: "정희원 교수", kor: "혈당이 매우 빨리 오르게 되면 무슨 일이 벌어지느냐,", time: [199.320, 202.530], eng: "What happens when blood sugar rises very quickly is this:" },
            { id: "s59", speaker: "정희원 교수", kor: "에너지가 대부분 인슐린에 의해서 지방으로 들어갑니다.", time: [202.560, 206.670], eng: "most of the energy gets pushed into fat by insulin." },
            { id: "s60", speaker: "정희원 교수", kor: "더 최악은, 여기서 혈당이 빠르게 올랐다가", time: [206.690, 209.780], eng: "Even worse, after blood sugar shoots up here," },
            { id: "s61", speaker: "정희원 교수", kor: "인슐린 분비에 의해서 혈당이 항상 베이스라인보다 더 떨어지면,", time: [209.810, 213.760], eng: "insulin secretion always drops it below the baseline —" },
            { id: "s62", speaker: "정희원 교수", kor: "이때가 이제 오후 3시입니다.", time: [213.800, 215.170], eng: "and that moment is around three in the afternoon." },
            { id: "s63", speaker: "정희원 교수", kor: "그때는 굉장히 배가 고파요.", time: [215.200, 217.110], eng: "At that point you get extremely hungry." },
            { id: "s64", speaker: "정희원 교수", kor: "그때 코티솔이 또 나와요.", time: [217.140, 218.830], eng: "And then cortisol comes out." },
            { id: "s65", speaker: "정희원 교수", kor: "무슨 얘기냐면 스트레스 호르몬이 나와요.", time: [218.860, 220.440], eng: "Meaning the stress hormone gets released." },
            { id: "s66", speaker: "정희원 교수", kor: "결국에 우리가 스트레스를 풀기 위해서 가속노화 음식을 먹는데,", time: [220.470, 224.730], eng: "In the end we eat fast-aging food to relieve stress," },
            { id: "s67", speaker: "정희원 교수", kor: "그 음식은 사실은 스트레스 호르몬인 코티솔의 레벨을 더 증가시켜요.", time: [224.760, 229.070], eng: "but that food actually raises the level of cortisol, the stress hormone, even further." },
            { id: "s68", speaker: "루나 PD", kor: "사실 맛있는 거 먹으면은", time: [229.100, 230.900], eng: "People often say that when you eat something tasty," },
            { id: "s69", speaker: "루나 PD", kor: "“기분이 좋아진다”, “스트레스가 풀린다”, 이런 얘기 많이 하잖아요.", time: [230.940, 234.400], eng: "\"your mood lifts\" or \"your stress melts away\" — you hear that a lot, right?" },
            { id: "s70", speaker: "정희원 교수", kor: "실제로는 몸에는 풀리지가 않는 거예요.", time: [234.440, 236.620], eng: "In reality, the body doesn't get any relief at all." },
            { id: "s71", speaker: "정희원 교수", kor: "그럼 반대로 저속 노화 식사는 뭐냐?", time: [236.650, 238.630], eng: "So then, what is a slow-aging meal?" },
            { id: "s72", speaker: "정희원 교수", kor: "붉은 고기 대신에 콩 단백질, 식물성 단백질을 많이 먹는 게 좋고,", time: [238.660, 241.900], eng: "Instead of red meat it's better to eat plenty of bean protein and plant-based protein," },
            { id: "s73", speaker: "정희원 교수", kor: "채소 위주의 식사를 하고,", time: [241.930, 243.280], eng: "to build meals mainly around vegetables," },
            { id: "s74", speaker: "정희원 교수", kor: "단순당과 정제 곡물은 줄여야 돼요.", time: [243.320, 245.460], eng: "and to cut down on simple sugars and refined grains." },
            { id: "s75", speaker: "정희원 교수", kor: "그래서 잡곡밥을 먹거나 먹는 양을 줄이는 과식을 하지 않는 게 도움이 되죠.", time: [245.500, 250.090], eng: "So eating multigrain rice, or cutting portions so you don't overeat, helps." },
            { id: "s76", speaker: "루나 PD", kor: "먹을 게 없을 것 같은데요…", time: [250.120, 251.380], eng: "It sounds like there'd be nothing left to eat…" },
            { id: "s77", speaker: "정희원 교수", kor: "먹을 게 많습니다.", time: [251.410, 252.360], eng: "There's plenty to eat." },
            { id: "s78", speaker: "정희원 교수", kor: "저희 병원 식단을 보시면,", time: [252.390, 254.270], eng: "If you look at our hospital meals," },
            { id: "s79", speaker: "정희원 교수", kor: "제가 이거는 집에서 가져온 저속 노화 밥인데,", time: [254.310, 256.620], eng: "this is slow-aging rice I brought from home," },
            { id: "s80", speaker: "정희원 교수", kor: "이건 떡볶이였어요.", time: [256.650, 258.140], eng: "and this used to be tteokbokki." },
            { id: "s81", speaker: "루나 PD", kor: "그런데, 떡은 어디 갔어요?", time: [258.180, 259.940], eng: "But where did the rice cakes go?" },
            { id: "s82", speaker: "정희원 교수", kor: "떡은 제가 안 받았죠.", time: [259.970, 261.090], eng: "I simply didn't take the rice cakes." },
            { id: "s83", speaker: "정희원 교수", kor: "제가 어떻게 한 거냐면,", time: [261.120, 262.680], eng: "What I did was this:" },
            { id: "s84", speaker: "정희원 교수", kor: "가속노화로 나온 메뉴를 저속노화로 바꿔본 겁니다.", time: [262.710, 266.720], eng: "I took a fast-aging menu and turned it into a slow-aging one." },
            { id: "s85", speaker: "정희원 교수", kor: "떡볶이 안 받고,", time: [266.750, 267.830], eng: "No tteokbokki," },
            { id: "s86", speaker: "정희원 교수", kor: "그다음에 이제 우동사리 없고,", time: [268.100, 269.850], eng: "and then no udon noodles either," },
            { id: "s87", speaker: "정희원 교수", kor: "또 인제 국물만 있고.", time: [269.880, 271.360], eng: "just the broth." },
            { id: "s88", speaker: "루나 PD", kor: "교수님은 어떻게 맛있는 음식에 대한 어떤 욕구가 없으세요?", time: [271.400, 275.410], eng: "Professor, how is it that you have no craving for delicious food?" },
            { id: "s89", speaker: "정희원 교수", kor: "있습니다.", time: [275.450, 276.270], eng: "I do." },
            { id: "s90", speaker: "루나 PD", kor: "그러면 그런 생각이 들 때 어떻게 해요?", time: [276.300, 278.070], eng: "Then what do you do when that urge hits?" },
            { id: "s91", speaker: "정희원 교수", kor: "그래서 사실은 굉장히 맛있게 건강하게 먹을 수 있는 방법도 있어요.", time: [278.110, 281.640], eng: "Actually, there are ways to eat both very deliciously and healthily." },
            { id: "s92", speaker: "정희원 교수", kor: "발사믹이나 올리브오일 이런 드레싱으로 샐러드 드시면 사실 배는 꽤 불러요.", time: [281.670, 286.840], eng: "If you eat salad with dressings like balsamic or olive oil, you actually do get quite full." },
            { id: "s93", speaker: "루나 PD", kor: "근데 일단 맛있는 게 샐러드라고 생각하시는 그게 저랑 약간 다른 것 같은데.", time: [286.880, 293.510], eng: "But the fact that you think salad is what counts as delicious — that already seems a bit different from me." },
            { id: "s94", speaker: "정희원 교수", kor: "입맛은 바뀌어요.", time: [293.540, 294.700], eng: "Your palate changes." },
            { id: "s95", speaker: "정희원 교수", kor: "저속 노화 식사를 하게 되면,", time: [294.730, 296.780], eng: "When you eat a slow-aging diet," },
            { id: "s96", speaker: "정희원 교수", kor: "혈당 변동성이 줄고,", time: [296.810, 298.150], eng: "blood sugar variability drops," },
            { id: "s97", speaker: "정희원 교수", kor: "수면의 질이 좋아지고,", time: [298.180, 299.740], eng: "sleep quality improves," },
            { id: "s98", speaker: "정희원 교수", kor: "스트레스 호르몬이 줄면,", time: [299.780, 301.350], eng: "and as stress hormones fall," },
            { id: "s99", speaker: "정희원 교수", kor: "내가 좋아하는 음식의 성향이 바뀝니다.", time: [301.390, 303.960], eng: "the kind of food you like starts to change." },
            { id: "s100", speaker: "정희원 교수", kor: "더 슴슴한 음식을 먹을 수 있는 사람이 돼요.", time: [304.000, 306.660], eng: "You become someone who can enjoy blander food." },
            { id: "s101", speaker: "정희원 교수", kor: "그러면 선순환이 됩니다.", time: [306.690, 309.080], eng: "And that becomes a virtuous cycle." },
            { id: "s102", speaker: "루나 PD 나레이션", kor: "가속노화를 예방하기 위해 가장 중요한 식단.", time: [309.110, 312.540], eng: "Diet — the single most important thing for preventing fast aging." },
            { id: "s103", speaker: "루나 PD 나레이션", kor: "정희원 교수님을 만나고 온 뒤,", time: [312.580, 314.240], eng: "After meeting Professor Jung," },
            { id: "s104", speaker: "루나 PD 나레이션", kor: "저도 한번 밥을 잡곡밥으로 바꿔보기로 했습니다.", time: [314.270, 317.740], eng: "I decided to switch my own rice to multigrain rice." },
            { id: "s105", speaker: "잡곡밥 식단 첼린지 시작!", kor: "다양한 잡곡 넣어서 섞어주고,", time: [319.710, 321.600], eng: "Add various grains and mix them in," },
            { id: "s106", speaker: "잡곡밥 식단 첼린지 시작!", kor: "물에 한 시간 정도 불린 다음,", time: [321.640, 324.030], eng: "soak them in water for about an hour," },
            { id: "s107", speaker: "잡곡밥 식단 첼린지 시작!", kor: "취사 시작!", time: [324.060, 325.390], eng: "and start cooking!" },
            { id: "s108", speaker: "잡곡밥 식단 첼린지 시작!", kor: "처음 만들어 보는 잡곡밥", time: [325.420, 327.570], eng: "My first time making multigrain rice." },
            { id: "s109", speaker: "잡곡밥 식단 첼린지 시작!", kor: "이게… 맞나…?", time: [327.610, 329.780], eng: "Is this… right…?" },
            { id: "s110", speaker: "루나 PD", kor: "완전히… 완전히 망해버렸는데…? (밥통은 죄가 없음)", time: [329.810, 332.920], eng: "It's completely… completely ruined…? (The rice cooker is innocent.)" },
            { id: "s111", speaker: "루나 PD", kor: "지훈아, 이모가 한 밥 한번 먹어볼래?", time: [332.950, 334.570], eng: "Jihun, do you want to try the rice your aunt made?" },
            { id: "s112", speaker: "조카", kor: "우와, 진짜 망했다.", time: [334.610, 337.280], eng: "Wow, this is really ruined." },
            { id: "s113", speaker: "조카", kor: "이모의 망한 밥을 유튜브에 올리자.", time: [337.310, 342.300], eng: "Let's put auntie's failed rice on YouTube." },
            { id: "s114", speaker: "루나 PD", kor: "그런데 이 잡곡밥, 맛있게 만들어 먹기가 쉽지 않더라고요.", time: [342.330, 346.710], eng: "But making this multigrain rice taste good turned out to be no easy task." },
            { id: "s115", speaker: "루나 PD", kor: "다양한 잡곡을 넣어서 그냥 밥을 하면 될 줄 알았는데,", time: [346.740, 349.850], eng: "I thought I could just throw in various grains and cook," },
            { id: "s116", speaker: "루나 PD", kor: "불리는 과정도 너무 번거롭고", time: [349.890, 351.900], eng: "but the soaking process was such a hassle," },
            { id: "s117", speaker: "루나 PD", kor: "식감이나 맛이 잘 안 잡혀서", time: [351.940, 353.840], eng: "and the texture and flavor never came together," },
            { id: "s118", speaker: "루나 PD", kor: "꽤나 고생을 했습니다.", time: [353.870, 355.420], eng: "so I struggled quite a bit." },
            { id: "s119", speaker: "루나 PD", kor: "어떤 건 너무 물렁하고 어떤 건 너무 딱딱하다.", time: [355.460, 358.070], eng: "Some bits are too mushy and some are too hard." },

            { term: "노년내과", mainDef: "노년(老年 늙은 나이) + 내과(內科 몸속의 병을 약으로 치료하는 진료과) -> 나이 든 사람의 건강과 노화를 함께 진료하는 과", translations: { en: { term: "geriatrics", mainDef: "nonyeon (老年, old age) + naegwa (內科, internal medicine) — the department that treats the health and aging of older patients." } }, variants: ["노년내과"], examples: [{ kor: "할머니가 노년내과에서 진료를 받으셨어요.", eng: "My grandmother was seen in the geriatrics department." }] },
            { term: "어르신", mainDef: "나이 많은 어른을 아주 높여 부르는 말", translations: { en: { term: "an elder (honorific)", mainDef: "a highly respectful way of referring to an older person." } }, variants: ["어르신들", "어르신"], examples: [{ kor: "지하철에서 어르신께 자리를 양보했어요.", eng: "I gave up my seat to an elderly person on the subway." }] },
            { term: "마라탕후루", mainDef: "마라탕 + 탕후루를 붙여 만든 신조어. 2023~2024년 한국 젊은 층에서 크게 유행한 '맵고 짠 마라탕 → 달콤한 탕후루' 조합을 한 단어로 부르는 말", translations: { en: { term: "malatang-tanghulu", mainDef: "a coinage fusing malatang (spicy Chinese hot pot) and tanghulu (candied fruit skewers) — the hugely popular 2023–24 combo of eating something fiery and salty, then something sugary." } }, variants: ["마라탕후루"], examples: [{ kor: "요즘 애들은 마라탕후루를 세트처럼 먹어요.", eng: "Kids these days eat malatang and tanghulu together like a set meal." }] },
            { term: "백화점 지하 1층", mainDef: "한국 백화점은 지하 1층에 식품관과 디저트 매장을 모아 두는 것이 관행이다. 그래서 '지하 1층'은 곧 '먹을거리 층'을 뜻한다", translations: { en: { term: "the department store's B1 floor", mainDef: "Korean department stores conventionally put the food hall and dessert shops on the first basement level, so 'B1' effectively means 'the food floor'." } }, variants: ["백화점 지하 1층", "지하 1층"], examples: [{ kor: "선물 사려면 백화점 지하 1층으로 가세요.", eng: "If you're buying a gift, go to the department store's B1 floor." }] },
            { term: "디저트 천국", mainDef: "천(天 하늘) + 국(國 나라) -> 디저트 가게가 아주 많아서 고르기 힘들 정도인 곳을 과장해 이르는 말. 'N 천국' 형태로 널리 쓴다", translations: { en: { term: "dessert heaven", mainDef: "cheon (天, sky) + guk (國, country) — an exaggerated way of saying a place has so many dessert shops you can hardly choose. The pattern 'N cheonguk' is widely used." } }, variants: ["디저트 천국"], examples: [{ kor: "이 골목은 완전 빵 천국이에요.", eng: "This alley is absolute bread heaven." }] },
            { term: "갈수록", mainDef: "시간이 지날수록 점점 더", translations: { en: { term: "increasingly / more and more over time", mainDef: "progressively more as time passes." } }, variants: ["갈수록"], examples: [{ kor: "물가가 갈수록 오르네요.", eng: "Prices keep going up more and more." }] },
            { term: "눈길을 주다", mainDef: "어떤 대상에 관심을 가지고 바라보다", translations: { en: { term: "to pay attention to / to look toward", mainDef: "to look at something with interest." } }, variants: ["눈길을 많이 준단", "눈길을 주다"], examples: [{ kor: "사람들이 새로 나온 제품에 눈길을 주기 시작했어요.", eng: "People have started paying attention to the new product." }] },
            { term: "-단 말이에요", mainDef: "'-다는 말이에요'의 구어 축약형. 자기 말을 강조하거나 상대가 몰라주는 것 같을 때 '내 말은 이거예요' 하고 못박는 표현", translations: { en: { term: "-dan mariyeyo (I'm telling you...)", mainDef: "a colloquial contraction of '-daneun mariyeyo'. It drives a point home — 'what I'm saying is…' — often when you feel the listener isn't getting it." } }, variants: ["준단 말이에요"], examples: [{ kor: "제가 벌써 세 번이나 말했단 말이에요.", eng: "I'm telling you, I've already said it three times." }] },
            { term: "식품", mainDef: "식(食 먹다) + 품(品 물건) -> 사람이 먹을 수 있게 만들어 파는 것", translations: { en: { term: "food product", mainDef: "sik (食, to eat) + pum (品, an item) — something produced and sold for people to eat." } }, variants: ["식품"], examples: [{ kor: "가공식품보다 신선한 재료가 몸에 좋아요.", eng: "Fresh ingredients are better for you than processed food products." }] },
            { term: "생활습관", mainDef: "생활(生活 사는 것) + 습(習 익히다) + 관(慣 버릇) -> 먹고 자고 움직이는 일상의 굳어진 방식", translations: { en: { term: "lifestyle habits", mainDef: "saenghwal (生活, living) + seup (習, to practice) + gwan (慣, habit) — the settled daily patterns of how you eat, sleep, and move." } }, variants: ["생활습관"], examples: [{ kor: "병은 생활습관에서 시작되는 경우가 많아요.", eng: "Illness often starts with lifestyle habits." }] },
            { term: "도파민", mainDef: "기분을 좋게 하고 즐거움과 보상을 느끼게 하는 뇌 속 물질", translations: { en: { term: "dopamine", mainDef: "a substance in the brain that lifts your mood and creates feelings of pleasure and reward." } }, variants: ["도파민"], examples: [{ kor: "짧은 영상은 도파민을 빠르게 자극해요.", eng: "Short videos stimulate dopamine quickly." }] },
            { term: "쫓아가다", mainDef: "앞선 것을 뒤에서 따라가다. 여기서는 즐거움만 계속 좇는다는 뜻", translations: { en: { term: "to chase after", mainDef: "to follow after something that is ahead of you. Here it means constantly chasing pleasure." } }, variants: ["쫓아가는", "쫓아가다"], examples: [{ kor: "유행만 쫓아가다 보면 자기 취향을 잃어요.", eng: "If you only chase trends, you lose your own taste." }] },
            { term: "어떻게 보면", mainDef: "보는 관점에 따라서는. 조심스럽게 의견을 꺼낼 때 쓰는 말머리", translations: { en: { term: "in a sense / looked at one way", mainDef: "depending on how you see it — a hedge used to introduce an opinion carefully." } }, variants: ["어떻게 보면"], examples: [{ kor: "어떻게 보면 실패도 좋은 경험이에요.", eng: "In a sense, failure is a good experience too." }] },
            { term: "뭐", mainDef: "(구어 필러) 원래는 '무엇'이지만, 말을 부드럽게 시작하거나 얼버무릴 때 뜻 없이 넣는 말. '음…', '뭐랄까' 정도의 느낌", translations: { en: { term: "well… (filler)", mainDef: "literally 'what', but in speech it is often a meaningless filler that softens the start of a sentence — closer to English 'well…' or 'you know'." } }, variants: ["뭐 이런"], examples: [{ kor: "뭐, 그럴 수도 있죠.", eng: "Well, I suppose that could happen." }] },
            { term: "자…", mainDef: "(구어 말머리) 화제를 바꾸거나 본론을 꺼낼 때 앞에 붙이는 말. 뜻은 없고 '자, 이제 시작합니다' 하는 신호", translations: { en: { term: "so… / right… (discourse opener)", mainDef: "a spoken opener used to change topic or get to the point. It carries no meaning — it signals 'here we go'." } }, variants: ["자…"], examples: [{ kor: "자, 그럼 시작해 볼까요?", eng: "Right then, shall we get started?" }] },
            { term: "워낙", mainDef: "정도가 아주 심하게. 또는 본디부터", translations: { en: { term: "so much / by nature", mainDef: "to a very great degree, or from the beginning." } }, variants: ["워낙"], examples: [{ kor: "그 식당은 워낙 유명해서 늘 줄이 길어요.", eng: "That restaurant is so famous that the line is always long." }] },
            { term: "-아/어 가지고", mainDef: "(구어) '-아서/어서'를 대신해 이유나 순서를 이을 때 쓰는 말. 뜻은 같지만 훨씬 편하고 수다스러운 느낌이라 글에서는 잘 쓰지 않는다", translations: { en: { term: "-a/eo gajigo (colloquial '-aseo/eoseo')", mainDef: "a spoken substitute for '-aseo/eoseo' when linking a reason or sequence. The meaning is the same but the tone is far more casual and chatty, so it rarely appears in writing." } }, variants: ["하셔가지고", "불려가지고"], examples: [{ kor: "늦잠을 자 가지고 지각했어요.", eng: "I overslept, so I was late." }] },
            { term: "아이고", mainDef: "놀람·안타까움·한숨을 나타내는 감탄사. '어이구'는 같은 말의 다른 발음", translations: { en: { term: "oh dear / oh my", mainDef: "an interjection expressing surprise, dismay, or a sigh. 'Eoigu' is a variant pronunciation of the same word." } }, variants: ["아이고", "어이구"], examples: [{ kor: "아이고, 이걸 어쩌면 좋아요.", eng: "Oh dear, what on earth do we do about this." }] },
            { term: "마침", mainDef: "때가 딱 알맞게. 우연히 시기가 잘 맞았을 때 쓴다", translations: { en: { term: "as it happens / just in time", mainDef: "used when the timing happens to line up perfectly." } }, variants: ["마침"], examples: [{ kor: "마침 저도 그 얘기를 하려던 참이었어요.", eng: "As it happens, I was just about to bring that up too." }] },
            { term: "건강검진", mainDef: "건강(健康 튼튼함) + 검(檢 검사하다) + 진(診 진찰하다) -> 병이 있는지 알아보려고 몸 상태를 미리 검사하는 것", translations: { en: { term: "medical checkup", mainDef: "geongang (健康, health) + geom (檢, to examine) + jin (診, to diagnose) — checking your body in advance to find out whether there is any illness." } }, variants: ["건강검진"], examples: [{ kor: "1년에 한 번은 건강검진을 받는 게 좋아요.", eng: "It's good to get a medical checkup once a year." }] },
            { term: "공복", mainDef: "공(空 비다) + 복(腹 배) -> 음식을 먹지 않아 배가 비어 있는 상태", translations: { en: { term: "empty stomach / fasting state", mainDef: "gong (空, empty) + bok (腹, belly) — the state of not having eaten, with an empty stomach." } }, variants: ["공복"], examples: [{ kor: "이 약은 공복에 드셔야 해요.", eng: "You should take this medicine on an empty stomach." }] },
            { term: "인슐린", mainDef: "췌장에서 나오는 호르몬. 핏속의 당을 세포로 보내 혈당을 낮추는 역할을 한다", translations: { en: { term: "insulin", mainDef: "a hormone released by the pancreas that moves sugar from the blood into cells, lowering blood sugar." } }, variants: ["인슐린"], examples: [{ kor: "밥을 먹으면 인슐린이 나와요.", eng: "Insulin is released when you eat." }] },
            { term: "호마 IR", mainDef: "HOMA-IR. 공복 혈당과 공복 인슐린 수치를 계산해 인슐린 저항성이 얼마나 심한지 보는 지표. 보통 2.5 이상이면 높다고 본다", translations: { en: { term: "HOMA-IR", mainDef: "an index calculated from fasting glucose and fasting insulin that shows how severe insulin resistance is. A value above roughly 2.5 is generally considered high." } }, variants: ["호마 IR"], examples: [{ kor: "호마 IR 수치가 높게 나와서 걱정이에요.", eng: "My HOMA-IR came out high, so I'm worried." }] },
            { term: "인슐린 저항성", mainDef: "저(抵 막다) + 항(抗 맞서다) + 성(性 성질) -> 인슐린이 나와도 몸이 잘 반응하지 않아 혈당이 제대로 내려가지 않는 상태", translations: { en: { term: "insulin resistance", mainDef: "jeo (抵, to resist) + hang (抗, to oppose) + seong (性, a property) — a state in which the body responds poorly to insulin, so blood sugar does not come down properly." } }, variants: ["인슐린 저항성"], examples: [{ kor: "인슐린 저항성이 높으면 당뇨병 위험도 커져요.", eng: "High insulin resistance also raises the risk of diabetes." }] },
            { term: "상당히", mainDef: "상(相 서로) + 당(當 마땅하다) -> 생각한 정도를 넘어설 만큼 꽤", translations: { en: { term: "considerably / quite", mainDef: "sang (相, mutual) + dang (當, to correspond) — to a degree noticeably beyond what you'd expect." } }, variants: ["상당히"], examples: [{ kor: "생각보다 상당히 어려운 문제였어요.", eng: "It was a considerably harder problem than I expected." }] },
            { term: "연배", mainDef: "연(年 해·나이) + 배(輩 무리) -> 서로 비슷한 또래의 나이", translations: { en: { term: "age / age group", mainDef: "yeon (年, year, age) + bae (輩, a group) — a similar age or generation." } }, variants: ["연배"], examples: [{ kor: "저희는 연배가 비슷해서 말이 잘 통해요.", eng: "We're around the same age, so we get along easily." }] },
            { term: "무료 구독 기간", mainDef: "돈을 내지 않고 서비스를 쓸 수 있는 기간. 여기서는 아직 건강 문제가 겉으로 드러나지 않는 젊은 시기를 빗댄 표현", translations: { en: { term: "free subscription period", mainDef: "the stretch of time you can use a service without paying. Here it is a metaphor for the years when you are still young enough that health problems have not yet surfaced." } }, variants: ["무료 구독 기간"], examples: [{ kor: "무료 구독 기간이 끝나면 요금이 청구돼요.", eng: "Once the free subscription period ends, you get charged." }] },
            { term: "만으로", mainDef: "만(滿 가득 차다) -> 태어난 날부터 실제로 지난 햇수로 센 나이. 한국에서는 예전에 태어나자마자 한 살로 치는 '세는나이'를 함께 써서 두 살까지 차이가 났다", translations: { en: { term: "by international age", mainDef: "man (滿, full) — age counted by years actually completed since birth. Korea long used a separate 'counting age' that starts at one at birth, so the two could differ by up to two years." } }, variants: ["만으로는", "만으로"], examples: [{ kor: "저는 만으로 스물아홉이에요.", eng: "I'm twenty-nine by international age." }] },
            { term: "큰일 나다", mainDef: "감당하기 어려운 심각한 문제가 생기다", translations: { en: { term: "to be in big trouble", mainDef: "for a serious problem, hard to handle, to arise." } }, variants: ["큰일 났네요", "큰일 났네", "큰일 나다"], examples: [{ kor: "이거 잃어버리면 큰일 나요.", eng: "If you lose this, we're in big trouble." }] },
            { term: "폐지하다", mainDef: "폐(廢 그만두다) + 지(止 그치다) -> 제도나 프로그램을 없애다", translations: { en: { term: "to abolish / to cancel", mainDef: "pye (廢, to discard) + ji (止, to stop) — to do away with a system or a program." } }, variants: ["폐지해야", "폐지하다"], examples: [{ kor: "시청률이 낮아서 그 프로그램은 폐지됐어요.", eng: "The show was cancelled because of low ratings." }] },
            { term: "망빙", mainDef: "'망고빙수'를 줄인 말. 한국에서는 이렇게 두 단어의 앞 글자만 따서 줄이는 방식이 아주 흔하다", translations: { en: { term: "mangbing (mango bingsu)", mainDef: "short for 'mango bingsu' (mango shaved ice). Clipping two words to their first syllables like this is extremely common in Korean." } }, variants: ["망빙"], examples: [{ kor: "여름엔 역시 망빙이죠.", eng: "Summer really calls for mango bingsu." }] },
            { term: "전면적", mainDef: "전(全 모두) + 면(面 면) + 적(的 ~한 성질의) -> 한 부분이 아니라 모든 부분에 걸친", translations: { en: { term: "comprehensive / across-the-board", mainDef: "jeon (全, whole) + myeon (面, side) + jeok (的, -like) — covering every part rather than just one part." } }, variants: ["전면적인", "전면적"], examples: [{ kor: "회사는 전면적인 조직 개편을 발표했어요.", eng: "The company announced a comprehensive restructuring." }] },
            { term: "대사", mainDef: "대(代 바꾸다) + 사(謝 물러나다) -> 몸이 음식을 에너지로 바꾸고 낡은 것을 내보내는 과정", translations: { en: { term: "metabolism", mainDef: "dae (代, to replace) + sa (謝, to withdraw) — the process by which the body turns food into energy and clears out what is worn out." } }, variants: ["대사"], examples: [{ kor: "나이가 들면 기초 대사량이 줄어들어요.", eng: "As you get older, your basal metabolic rate drops." }] },
            { term: "개선", mainDef: "개(改 고치다) + 선(善 좋다) -> 부족하거나 잘못된 것을 고쳐 더 좋게 만드는 것", translations: { en: { term: "improvement", mainDef: "gae (改, to fix) + seon (善, good) — fixing what is lacking or wrong so that it becomes better." } }, variants: ["개선"], examples: [{ kor: "생활습관 개선만으로도 혈압이 내려갔어요.", eng: "Just improving my lifestyle brought my blood pressure down." }] },
            { term: "가늘고 길게 뽑다", mainDef: "실을 가늘게 뽑아 길게 늘이듯, 강도를 낮추는 대신 오래 이어 가다. 여기서는 젊을 때의 자극을 줄여 노화를 천천히 진행시킨다는 비유", translations: { en: { term: "to draw it out thin and long", mainDef: "like spinning thread thin so it stretches further — to lower the intensity so something lasts longer. Here it is a metaphor for easing off the excesses of youth so aging unfolds slowly." } }, variants: ["가늘고 길게 뽑으면", "가늘고 길게 뽑다"], examples: [{ kor: "직장 생활은 가늘고 길게 가는 게 최고예요.", eng: "With a career, thin and long is the way to go." }] },
            { term: "시점", mainDef: "시(時 때) + 점(點 점) -> 어떤 일이 일어나는 바로 그때", translations: { en: { term: "point in time", mainDef: "si (時, time) + jeom (點, a point) — the exact moment at which something happens." } }, variants: ["시점"], examples: [{ kor: "지금은 결정을 내릴 시점이 아니에요.", eng: "Now isn't the point at which we should make a decision." }] },
            { term: "뒤로 미루다", mainDef: "정해진 때를 더 나중으로 옮기다", translations: { en: { term: "to push back / postpone", mainDef: "to move a set time to a later point." } }, variants: ["뒤로 미룰", "뒤로 미루다"], examples: [{ kor: "회의를 다음 주로 뒤로 미뤘어요.", eng: "We pushed the meeting back to next week." }] },
            { term: "혈당 스파이크", mainDef: "혈(血 피) + 당(糖 설탕) -> 음식을 먹은 뒤 핏속 당 수치가 갑자기 확 치솟는 것", translations: { en: { term: "blood sugar spike", mainDef: "hyeol (血, blood) + dang (糖, sugar) — a sudden sharp rise in the sugar level in your blood after eating." } }, variants: ["혈당 스파이크", "혈당"], examples: [{ kor: "빈속에 단 음료를 마시면 혈당 스파이크가 와요.", eng: "Drinking something sweet on an empty stomach causes a blood sugar spike." }] },
            { term: "-느냐", mainDef: "'무슨 일이 벌어지느냐' 하고 스스로 묻고 곧바로 답하는 자문자답 형식. 강의나 설명에서 다음 내용에 집중시키려고 쓴다", translations: { en: { term: "-neunya (rhetorical self-question)", mainDef: "a device where the speaker poses a question — 'so what happens?' — and immediately answers it. Common in lectures and explanations to focus the listener on what comes next." } }, variants: ["벌어지느냐"], examples: [{ kor: "그럼 왜 이런 일이 생기느냐, 이유는 간단합니다.", eng: "So why does this happen? The reason is simple." }] },
            { term: "지방", mainDef: "지(脂 기름) + 방(肪 기름) -> 몸에 저장되는 기름 성분", translations: { en: { term: "fat (body fat)", mainDef: "ji (脂, fat) + bang (肪, fat) — the fatty substance stored in the body." } }, variants: ["지방"], examples: [{ kor: "남은 에너지는 지방으로 저장돼요.", eng: "Leftover energy gets stored as fat." }] },
            { term: "최악", mainDef: "최(最 가장) + 악(惡 나쁘다) -> 가능한 것 가운데 가장 나쁜 상태", translations: { en: { term: "the worst", mainDef: "choe (最, most) + ak (惡, bad) — the worst possible state." } }, variants: ["최악"], examples: [{ kor: "최악의 경우도 미리 생각해 둬야 해요.", eng: "You should think through the worst case in advance too." }] },
            { term: "분비", mainDef: "분(分 나누다) + 비(泌 스며 나오다) -> 몸속에서 만들어진 물질이 밖으로 나오는 것", translations: { en: { term: "secretion", mainDef: "bun (分, to divide) + bi (泌, to seep out) — the release of a substance produced inside the body." } }, variants: ["분비"], examples: [{ kor: "밤에 빛을 보면 멜라토닌 분비가 줄어요.", eng: "Seeing light at night reduces melatonin secretion." }] },
            { term: "베이스라인", mainDef: "기준이 되는 평상시 수치. 여기서는 밥을 먹기 전의 원래 혈당 수준", translations: { en: { term: "baseline", mainDef: "the normal reference level. Here, the blood sugar level you were at before eating." } }, variants: ["베이스라인"], examples: [{ kor: "운동 후에는 심박수가 베이스라인으로 돌아와요.", eng: "After exercise, your heart rate returns to baseline." }] },
            { term: "코티솔", mainDef: "스트레스를 받을 때 부신에서 나오는 호르몬. 몸을 긴장 상태로 만들고, 오래 높으면 살이 찌고 잠을 방해한다", translations: { en: { term: "cortisol", mainDef: "a hormone released by the adrenal glands under stress. It puts the body on alert; staying high for long promotes weight gain and disrupts sleep." } }, variants: ["코티솔"], examples: [{ kor: "잠이 부족하면 코티솔이 올라가요.", eng: "Lack of sleep raises cortisol." }] },
            { term: "-냐면", mainDef: "'무슨 얘기냐면', '어떻게 한 거냐면'처럼 앞말을 스스로 되묻고 바로 풀어 설명하는 구어 표현", translations: { en: { term: "-nyamyeon (as for what I mean…)", mainDef: "a colloquial device — 'as for what I'm saying…', 'as for what I did…' — where the speaker echoes a question and then explains." } }, variants: ["무슨 얘기냐면", "어떻게 한 거냐면"], examples: [{ kor: "왜 그러냐면, 시간이 없었거든요.", eng: "As for why — I didn't have any time." }] },
            { term: "스트레스 호르몬", mainDef: "스트레스를 받을 때 몸에서 나오는 호르몬을 통틀어 이르는 말. 대표적인 것이 코티솔이다", translations: { en: { term: "stress hormone", mainDef: "a general term for the hormones the body releases under stress; cortisol is the main one." } }, variants: ["스트레스 호르몬"], examples: [{ kor: "산책만 해도 스트레스 호르몬이 줄어요.", eng: "Even just a walk lowers your stress hormones." }] },
            { term: "결국에", mainDef: "결(結 맺다) + 국(局 판) -> 여러 일을 거친 끝에 마지막으로. '결국'의 구어형", translations: { en: { term: "in the end", mainDef: "gyeol (結, to conclude) + guk (局, a situation) — finally, after everything. A colloquial form of 'gyeolguk'." } }, variants: ["결국에"], examples: [{ kor: "결국에 다시 처음으로 돌아왔어요.", eng: "In the end we came right back to the start." }] },
            { term: "스트레스를 풀다", mainDef: "쌓인 스트레스를 없애 마음을 편하게 하다. '풀다'는 묶인 것을 푸는 이미지에서 왔다", translations: { en: { term: "to relieve stress", mainDef: "to clear away built-up stress and feel at ease. 'Pulda' carries the image of untying something knotted." } }, variants: ["스트레스를 풀기", "스트레스가 풀린다"], examples: [{ kor: "저는 노래방에서 스트레스를 풀어요.", eng: "I relieve stress at karaoke." }] },
            { term: "증가시키다", mainDef: "증(增 늘다) + 가(加 더하다) -> '증가하다'의 사동형. 무엇이 늘어나도록 만들다", translations: { en: { term: "to increase (something)", mainDef: "jeung (增, to grow) + ga (加, to add) — the causative of 'jeunggahada': to cause something to rise." } }, variants: ["증가시켜요", "증가시키다"], examples: [{ kor: "야식은 체중을 증가시켜요.", eng: "Late-night snacks increase your weight." }] },
            { term: "붉은 고기", mainDef: "소고기·돼지고기처럼 색이 붉은 고기. 의학에서는 '적색육(赤色肉)'이라고도 한다", translations: { en: { term: "red meat", mainDef: "meat that is red in color, such as beef and pork. In medical contexts it is also called 'jeoksaengyuk' (赤色肉)." } }, variants: ["붉은 고기"], examples: [{ kor: "붉은 고기를 줄이고 생선을 늘렸어요.", eng: "I cut back on red meat and ate more fish." }] },
            { term: "식물성 단백질", mainDef: "식물성(植物性 식물에서 나온) + 단백질(蛋白質 몸을 이루는 영양소) -> 콩이나 두부처럼 식물에서 얻는 단백질", translations: { en: { term: "plant-based protein", mainDef: "singmulseong (植物性, plant-derived) + danbaekjil (蛋白質, protein) — protein obtained from plants such as beans or tofu." } }, variants: ["식물성 단백질"], examples: [{ kor: "두부는 대표적인 식물성 단백질이에요.", eng: "Tofu is a classic plant-based protein." }] },
            { term: "위주", mainDef: "위(爲 삼다) + 주(主 주인) -> 어떤 것을 중심으로 삼는 것", translations: { en: { term: "centered on / mainly", mainDef: "wi (爲, to make into) + ju (主, the main thing) — treating something as the center or focus." } }, variants: ["위주"], examples: [{ kor: "저는 요즘 채소 위주로 먹고 있어요.", eng: "These days I eat mainly vegetables." }] },
            { term: "단순당", mainDef: "단순(單純 간단하다) + 당(糖 설탕) -> 몸에 아주 빨리 흡수되는 단순한 형태의 당", translations: { en: { term: "simple sugar", mainDef: "sunsun (單純, simple) + dang (糖, sugar) — sugar in a simple form that the body absorbs very quickly." } }, variants: ["단순당"], examples: [{ kor: "탄산음료에는 단순당이 많이 들어 있어요.", eng: "Soft drinks contain a lot of simple sugar." }] },
            { term: "정제 곡물", mainDef: "정(精 깨끗하게 하다) + 제(製 만들다) + 곡물(穀物 곡식) -> 껍질과 씨눈을 벗겨 내 부드럽게 만든 곡물", translations: { en: { term: "refined grain", mainDef: "jeong (精, to refine) + je (製, to produce) + gongmul (穀物, grain) — grain whose husk and germ have been stripped away to make it soft." } }, variants: ["정제 곡물"], examples: [{ kor: "흰 밀가루는 대표적인 정제 곡물이에요.", eng: "White flour is a typical refined grain." }] },
            { term: "잡곡밥", mainDef: "잡(雜 섞이다) + 곡(穀 곡식) -> 쌀에 보리, 콩 같은 여러 곡식을 섞어 지은 밥", translations: { en: { term: "multigrain rice", mainDef: "jap (雜, mixed) + gok (穀, grain) — rice cooked together with other grains such as barley and beans." } }, variants: ["잡곡밥", "잡곡"], examples: [{ kor: "흰밥 대신 잡곡밥으로 바꿔 봤어요.", eng: "I switched from white rice to multigrain rice." }] },
            { term: "과식", mainDef: "과(過 지나치다) + 식(食 먹다) -> 배가 부른데도 지나치게 많이 먹는 것", translations: { en: { term: "overeating", mainDef: "gwa (過, excessive) + sik (食, to eat) — eating too much even after you are already full." } }, variants: ["과식"], examples: [{ kor: "명절만 되면 꼭 과식을 하게 돼요.", eng: "Every holiday I always end up overeating." }] },
            { term: "우동사리", mainDef: "국물 요리에 넣어 먹는 우동 면. '사리'는 국수를 사려 놓은 덩어리를 뜻한다", translations: { en: { term: "udon noodles (added to a dish)", mainDef: "udon noodles added into a broth-based dish. 'Sari' means a coiled bundle of noodles." } }, variants: ["우동사리"], examples: [{ kor: "찌개에 우동사리를 넣어 먹으면 든든해요.", eng: "Adding udon noodles to the stew makes it filling." }] },
            { term: "인제", mainDef: "(구어) '이제'를 실제 말할 때 흔히 이렇게 발음한다. 여기서는 시간의 뜻이 거의 없고, 말과 말 사이를 메우는 필러로 쓰였다. ※ 글로 쓸 때의 바른 표기는 '이제'", translations: { en: { term: "inje (colloquial 'ije', now)", mainDef: "how 'ije' (now) is commonly pronounced in speech. Here it carries almost no time meaning — it just fills the gap between phrases. In writing, the correct form is 'ije'." } }, variants: ["인제"], examples: [{ kor: "그래서 인제 제가 그때 이렇게 말했거든요.", eng: "So, uh, that's when I said this." }] },
            { term: "입맛", mainDef: "음식을 먹을 때 느끼는 맛에 대한 취향", translations: { en: { term: "palate / taste", mainDef: "your personal preference in how food tastes." } }, variants: ["입맛"], examples: [{ kor: "외국에 오래 살면 입맛도 조금씩 변해요.", eng: "If you live abroad for a long time, your palate gradually changes too." }] },
            { term: "변동성", mainDef: "변(變 변하다) + 동(動 움직이다) + 성(性 성질) -> 값이 오르내리며 자주 변하는 성질", translations: { en: { term: "variability / volatility", mainDef: "byeon (變, to change) + dong (動, to move) + seong (性, a property) — the tendency of a value to keep rising and falling." } }, variants: ["혈당 변동성", "변동성"], examples: [{ kor: "혈당 변동성이 크면 쉽게 피곤해져요.", eng: "If your blood sugar swings a lot, you get tired easily." }] },
            { term: "수면의 질", mainDef: "수(睡 졸다) + 면(眠 자다) + 질(質 바탕) -> 얼마나 오래 잤는지가 아니라, 얼마나 깊고 편하게 잤는지의 정도", translations: { en: { term: "sleep quality", mainDef: "su (睡, to doze) + myeon (眠, to sleep) + jil (質, quality) — not how long you slept, but how deeply and restfully." } }, variants: ["수면의 질"], examples: [{ kor: "커피를 끊었더니 수면의 질이 좋아졌어요.", eng: "After quitting coffee, my sleep quality improved." }] },
            { term: "성향", mainDef: "성(性 성질) + 향(向 향하다) -> 어느 쪽으로 기우는 성질이나 취향", translations: { en: { term: "tendency / leaning", mainDef: "seong (性, nature) + hyang (向, to face) — the direction one's character or taste inclines toward." } }, variants: ["성향"], examples: [{ kor: "사람마다 소비 성향이 달라요.", eng: "Everyone has different spending tendencies." }] },
            { term: "슴슴하다", mainDef: "짜거나 자극적이지 않고 맛이 싱겁고 담백하다", translations: { en: { term: "bland / mild", mainDef: "not salty or intense — light and plain in flavor." } }, variants: ["슴슴한", "슴슴하다"], examples: [{ kor: "평양냉면은 슴슴한 맛이 매력이에요.", eng: "The charm of Pyongyang naengmyeon is its mild flavor." }] },
            { term: "선순환", mainDef: "선(善 좋다) + 순(循 돌다) + 환(環 고리) -> 좋은 결과가 다시 좋은 원인이 되어 계속 이어지는 것. 반대말은 '악순환'", translations: { en: { term: "virtuous cycle", mainDef: "seon (善, good) + sun (循, to circulate) + hwan (環, a ring) — when a good result becomes the cause of another good result, over and over. The opposite is 'aksunhwan' (vicious cycle)." } }, variants: ["선순환"], examples: [{ kor: "잘 자면 잘 먹게 되는 선순환이 생겨요.", eng: "Sleeping well creates a virtuous cycle where you also eat well." }] },
            { term: "예방하다", mainDef: "예(豫 미리) + 방(防 막다) -> 나쁜 일이 생기기 전에 미리 막다", translations: { en: { term: "to prevent", mainDef: "ye (豫, in advance) + bang (防, to block) — to stop something bad before it happens." } }, variants: ["예방하기", "예방하다"], examples: [{ kor: "손만 잘 씻어도 감기를 예방할 수 있어요.", eng: "Just washing your hands well can prevent colds." }] },
            { term: "불리다", mainDef: "곡식이나 콩을 물에 담가 부드럽게 만들다", translations: { en: { term: "to soak (grains)", mainDef: "to put grains or beans in water so they soften." } }, variants: ["불리는", "불려가지고", "불린", "불리다"], examples: [{ kor: "콩은 하룻밤 물에 불려야 잘 익어요.", eng: "Beans need to be soaked overnight to cook properly." }] },
            { term: "취사", mainDef: "취(炊 불을 때다) + 사(事 일) -> 밥을 짓는 일. 전기밥솥의 '취사' 버튼이 바로 이 말이다", translations: { en: { term: "cooking (rice)", mainDef: "chwi (炊, to cook over fire) + sa (事, work) — the act of cooking rice. It's the label on the 'cook' button of a Korean rice cooker." } }, variants: ["취사"], examples: [{ kor: "쌀을 씻고 취사 버튼을 누르세요.", eng: "Rinse the rice and press the cook button." }] },
            { term: "망하다", mainDef: "망(亡 망하다) -> 완전히 실패하다. 원래는 나라나 사업이 무너진다는 뜻인데, 요즘 구어에서는 요리·시험처럼 작은 일에도 가볍게 쓴다", translations: { en: { term: "to fail / be ruined", mainDef: "mang (亡, to perish) — originally about a country or business collapsing, but in casual speech it is now used lightly for small things like a failed dish or exam." } }, variants: ["망해버렸는데", "망했다", "망한", "망하다"], examples: [{ kor: "시험 완전히 망했어요.", eng: "I totally bombed the exam." }] },
            { term: "밥통", mainDef: "밥을 짓고 따뜻하게 보관하는 기계. ※ 사람에게 쓰면 '멍청이'라는 욕이 되므로 주의", translations: { en: { term: "rice cooker", mainDef: "a machine that cooks rice and keeps it warm. Careful: applied to a person it becomes an insult meaning 'idiot'." } }, variants: ["밥통"], examples: [{ kor: "밥통에 밥이 아직 따뜻하게 남아 있어요.", eng: "There's still warm rice left in the rice cooker." }] },
            { term: "죄가 없다", mainDef: "죄(罪 죄) -> 잘못이 없다. '밥통은 죄가 없음'처럼 사물에 붙여, 잘못은 사물이 아니라 사람에게 있다고 농담하는 표현", translations: { en: { term: "is innocent / did nothing wrong", mainDef: "joe (罪, sin) — to be blameless. Attaching it to an object, as in 'the rice cooker is innocent', is a joke meaning the fault lies with the person, not the thing." } }, variants: ["죄가 없음", "죄가 없다"], examples: [{ kor: "칼은 죄가 없어요. 요리사가 문제죠.", eng: "The knife is innocent — it's the cook that's the problem." }] },
            { term: "이모", mainDef: "이(姨 이모) + 모(母 어머니) -> 어머니의 여자 형제. 조카가 부르는 호칭이다. ※ 아버지의 여자 형제는 '고모'", translations: { en: { term: "aunt (mother's sister)", mainDef: "i (姨, maternal aunt) + mo (母, mother) — your mother's sister, as a niece or nephew addresses her. A father's sister is 'gomo' instead." } }, variants: ["이모가", "이모의", "이모"], examples: [{ kor: "이모가 용돈을 주셨어요.", eng: "My aunt gave me some pocket money." }] },
            { term: "번거롭다", mainDef: "일이 복잡하고 손이 많이 가서 귀찮다", translations: { en: { term: "troublesome / a hassle", mainDef: "annoying because it is complicated and takes a lot of effort." } }, variants: ["번거롭고", "번거롭게", "번거롭다"], examples: [{ kor: "매번 신청서를 쓰는 게 좀 번거로워요.", eng: "Filling out a form every time is a bit of a hassle." }] },
            { term: "식감", mainDef: "식(食 먹다) + 감(感 느끼다) -> 음식을 씹을 때 입안에서 느껴지는 느낌", translations: { en: { term: "texture (of food)", mainDef: "sik (食, to eat) + gam (感, to feel) — how food feels in your mouth as you chew it." } }, variants: ["식감"], examples: [{ kor: "이 빵은 겉은 바삭하고 속은 촉촉한 식감이에요.", eng: "This bread has a crisp outside and a moist inside." }] },
            { term: "맛이 잡히다", mainDef: "맛이 한쪽으로 치우치지 않고 알맞게 어우러지다", translations: { en: { term: "the flavor comes together", mainDef: "for a dish's flavor to settle into balance instead of leaning too far one way." } }, variants: ["맛이 잘 안 잡혀서", "맛이 잡히다"], examples: [{ kor: "국은 하루 지나야 맛이 잡혀요.", eng: "The soup's flavor only comes together after a day." }] },
            { term: "꽤나", mainDef: "'꽤'를 강조한 말 -> 생각보다 상당히", translations: { en: { term: "quite a bit", mainDef: "an emphatic form of 'kkwae' — considerably more than expected." } }, variants: ["꽤나"], examples: [{ kor: "생각보다 꽤나 오래 걸렸어요.", eng: "It took quite a bit longer than I thought." }] },
            { term: "고생을 하다", mainDef: "고(苦 괴롭다) + 생(生 살다) -> 어렵고 힘든 일을 겪다", translations: { en: { term: "to have a hard time", mainDef: "go (苦, suffering) + saeng (生, to live) — to go through something difficult and taxing." } }, variants: ["고생을 했습니다", "고생을 하다"], examples: [{ kor: "이사하느라 고생을 많이 했어요.", eng: "I had a really hard time moving house." }] },
            { term: "물렁하다", mainDef: "눌렀을 때 쉽게 들어갈 만큼 무르고 부드럽다", translations: { en: { term: "mushy / soft", mainDef: "so soft that it gives way easily when pressed." } }, variants: ["물렁하고", "물렁하다"], examples: [{ kor: "복숭아가 너무 물렁해서 손에서 뭉개졌어요.", eng: "The peach was so mushy it fell apart in my hand." }] },
            { term: "딱딱하다", mainDef: "굳고 단단해서 잘 눌리지 않다", translations: { en: { term: "hard / stiff", mainDef: "firm and solid, not easily pressed in." } }, variants: ["딱딱하다"], examples: [{ kor: "빵이 하루 지나니까 딱딱해졌어요.", eng: "The bread went hard after a day." }] },
            { term: "팩폭", mainDef: "'팩트 폭력'을 줄인 말. 듣기 불편한 사실을 그대로 말해 상대가 아무 말도 못 하게 하는 것", translations: { en: { term: "a brutal truth ('fact bomb')", mainDef: "short for 'fact violence' — stating an uncomfortable truth so bluntly that the other person has nothing to say back." } }, variants: ["팩폭"], examples: [{ kor: "친구의 팩폭에 할 말을 잃었어요.", eng: "My friend's brutal truth left me speechless." }] },
            { term: "정신 못 차리다", mainDef: "충격을 받거나 정신이 없어서 제대로 판단하고 반응하지 못하다", translations: { en: { term: "to be unable to get a grip", mainDef: "to be so shocked or flustered that you can't think or react properly." } }, variants: ["정신 못 차리는", "정신 못 차리다"], examples: [{ kor: "갑작스러운 소식에 정신을 못 차리겠어요.", eng: "The sudden news has left me unable to get a grip." }] },
            { term: "문득", mainDef: "어떤 생각이나 느낌이 갑자기 떠오르는 모양", translations: { en: { term: "suddenly (of a thought)", mainDef: "describing the way a thought or feeling comes to mind out of nowhere." } }, variants: ["문득"], examples: [{ kor: "길을 걷다가 문득 옛날 생각이 났어요.", eng: "While walking, I suddenly thought of the old days." }] },
            { term: "굳이", mainDef: "그럴 필요가 없는데도 일부러. 발음은 [구지]", translations: { en: { term: "needlessly / going out of one's way", mainDef: "deliberately, even though there's no need to. Pronounced [guji]." } }, variants: ["굳이"], examples: [{ kor: "굳이 거기까지 갈 필요는 없어요.", eng: "There's no need to go all the way there." }] },
            { term: "즉석밥", mainDef: "즉(卽 곧) + 석(席 자리) -> 데우기만 하면 바로 먹을 수 있게 만들어 파는 밥", translations: { en: { term: "instant rice", mainDef: "jeuk (卽, immediately) + seok (席, on the spot) — pre-cooked rice sold ready to eat after heating." } }, variants: ["즉석밥"], examples: [{ kor: "자취할 때는 즉석밥이 정말 편해요.", eng: "When you live alone, instant rice is really convenient." }] },
            { term: "흰쌀밥", mainDef: "껍질과 씨눈을 다 벗긴 흰쌀로만 지은 밥. 한국 식탁의 기본으로 여겨진다", translations: { en: { term: "white rice", mainDef: "rice cooked from fully polished white grains alone — treated as the default on a Korean table." } }, variants: ["흰쌀밥"], examples: [{ kor: "흰쌀밥에 김치만 있어도 맛있어요.", eng: "White rice with just kimchi is already delicious." }] },
            { term: "기본값", mainDef: "기(基 바탕) + 본(本 근본) -> 따로 정하지 않았을 때 자동으로 정해져 있는 값", translations: { en: { term: "default value", mainDef: "gi (基, base) + bon (本, root) — the value that is set automatically when you don't choose one yourself." } }, variants: ["기본값"], examples: [{ kor: "알림 설정은 기본값 그대로 두셔도 돼요.", eng: "You can leave the notification setting at its default." }] },
            { term: "비율", mainDef: "비(比 견주다) + 율(率 비율) -> 전체에서 어떤 부분이 차지하는 정도", translations: { en: { term: "ratio / proportion", mainDef: "bi (比, to compare) + yul (率, a rate) — how much of the whole a given part takes up." } }, variants: ["비율"], examples: [{ kor: "물과 쌀의 비율이 밥맛을 결정해요.", eng: "The ratio of water to rice decides how the rice tastes." }] },
            { term: "애매하다", mainDef: "애(曖 흐리다) + 매(昧 어둡다) -> 이쪽도 저쪽도 아니어서 분명하지 않다", translations: { en: { term: "ambiguous / neither here nor there", mainDef: "ae (曖, dim) + mae (昧, dark) — unclear because it falls between two options." } }, variants: ["애매했었는데", "애매하다"], examples: [{ kor: "맛이 애매해서 다시는 안 시킬 것 같아요.", eng: "The taste was neither here nor there, so I probably won't order it again." }] },
            { term: "똥손", mainDef: "손으로 하는 일을 잘 못하는 사람을 놀리듯 이르는 말. 반대말은 '금손'", translations: { en: { term: "clumsy hands", mainDef: "a teasing word for someone who is bad at things done by hand. The opposite is 'geumson' (golden hands)." } }, variants: ["똥손"], examples: [{ kor: "저는 똥손이라서 요리는 늘 실패해요.", eng: "I have clumsy hands, so my cooking always fails." }] },
            { term: "햇반", mainDef: "국내에서 가장 널리 알려진 즉석밥 브랜드 이름", translations: { en: { term: "Hetbahn (brand name)", mainDef: "the best-known instant rice brand in Korea." } }, variants: ["햇반"], examples: [{ kor: "바쁜 아침에는 햇반을 데워 먹어요.", eng: "On busy mornings I just heat up some Hetbahn." }] },
            { term: "-종", mainDef: "종(種 종류) -> 종류의 수를 세는 단위. '7종 = 일곱 가지'. 상품 구성을 말할 때 자주 쓴다", translations: { en: { term: "-jong (kinds, as a counter)", mainDef: "jong (種, kind) — a counter for varieties: '7-jong' means seven kinds. Common in describing product line-ups." } }, variants: ["7종을", "7종마다", "7종"], examples: [{ kor: "이 세트는 소스 5종이 들어 있어요.", eng: "This set includes five kinds of sauce." }] },
            { term: "황금 배합", mainDef: "황금(黃金 금) + 배(配 나누다) + 합(合 합하다) -> 가장 알맞은 비율로 섞은 것. 광고에서 자주 쓰는 과장 표현", translations: { en: { term: "golden ratio (of a blend)", mainDef: "hwanggeum (黃金, gold) + bae (配, to distribute) + hap (合, to combine) — a mixture blended in the most ideal proportions. A common advertising flourish." } }, variants: ["황금 배합"], examples: [{ kor: "이 커피는 원두 세 종류의 황금 배합이래요.", eng: "They say this coffee is a golden blend of three kinds of beans." }] },
            { term: "-별로", mainDef: "별(別 다르다) -> '~마다 따로따로'. '잡곡별로'는 잡곡 하나하나를 각각 나누어서라는 뜻. ※ 부정문에 쓰는 '별로(그다지)'와 다른 말", translations: { en: { term: "-byeollo (by each / per)", mainDef: "byeol (別, separate) — 'each one separately'. 'Japgok-byeollo' means grain by grain. Not to be confused with 'byeollo' meaning 'not particularly' in negative sentences." } }, variants: ["잡곡별로"], examples: [{ kor: "반별로 줄을 서 주세요.", eng: "Please line up by class." }] },
            { term: "고온", mainDef: "고(高 높다) + 온(溫 따뜻하다) -> 아주 높은 온도", translations: { en: { term: "high temperature", mainDef: "go (高, high) + on (溫, warm) — a very high temperature." } }, variants: ["고온"], examples: [{ kor: "이 재료는 고온에서 구워야 해요.", eng: "This ingredient has to be baked at a high temperature." }] },
            { term: "고압", mainDef: "고(高 높다) + 압(壓 누르다) -> 아주 높은 압력", translations: { en: { term: "high pressure", mainDef: "go (高, high) + ap (壓, to press) — a very high level of pressure." } }, variants: ["고압"], examples: [{ kor: "압력솥은 고압으로 음식을 빨리 익혀요.", eng: "A pressure cooker uses high pressure to cook food quickly." }] },
            { term: "밥을 짓다", mainDef: "쌀에 물을 붓고 익혀서 밥을 만들다. '짓다'는 'ㅅ' 불규칙 동사 (짓다 → 지어, 지으면)", translations: { en: { term: "to cook rice", mainDef: "to add water to rice and cook it into a meal. 'Jitda' is an irregular 'siot' verb: jitda → jieo, jieumyeon." } }, variants: ["지어내서", "밥을 짓는", "밥을 짓다"], examples: [{ kor: "할머니가 지으신 밥이 제일 맛있어요.", eng: "The rice my grandmother cooks is the tastiest." }] },
            { term: "서리태", mainDef: "껍질은 검고 속은 푸른빛이 도는 콩. '서리 내릴 때 거둔다'고 해서 붙은 이름", translations: { en: { term: "black soybean", mainDef: "a soybean with a black skin and a greenish inside. The name comes from its being harvested around the time of the first frost ('seori')." } }, variants: ["서리태"], examples: [{ kor: "서리태를 넣으면 밥이 더 고소해요.", eng: "Adding black soybeans makes the rice nuttier." }] },
            { term: "흑미", mainDef: "흑(黑 검다) + 미(米 쌀) -> 껍질이 검은 쌀", translations: { en: { term: "black rice", mainDef: "heuk (黑, black) + mi (米, rice) — rice with a black outer layer." } }, variants: ["흑미"], examples: [{ kor: "흑미를 조금만 넣어도 밥이 보라색이 돼요.", eng: "Even a little black rice turns the whole pot purple." }] },
            { term: "찰지다", mainDef: "밥이나 떡이 끈기가 있어 서로 잘 붙다. '차지다'와 둘 다 표준어", translations: { en: { term: "sticky / chewy (of rice)", mainDef: "for rice or rice cake to be glutinous enough that the grains cling together. Both 'chaljida' and 'chajida' are standard." } }, variants: ["찰져요", "찰진", "찰지다"], examples: [{ kor: "이 쌀은 찰져서 김밥 만들기에 좋아요.", eng: "This rice is sticky, so it's good for making gimbap." }] },
            { term: "식이섬유", mainDef: "식이(食餌 먹는 것) + 섬(纖 가늘다) + 유(維 실) -> 소화되지 않고 장을 지나가며 장 건강을 돕는 식물성 성분", translations: { en: { term: "dietary fiber", mainDef: "sigi (食餌, food intake) + seom (纖, fine) + yu (維, thread) — a plant component that passes through the gut undigested and supports gut health." } }, variants: ["식이섬유"], examples: [{ kor: "식이섬유가 많은 채소를 먹으면 소화에 좋아요.", eng: "Eating vegetables high in dietary fiber is good for digestion." }] },
            { term: "나물", mainDef: "먹을 수 있는 풀이나 나뭇잎을 데치거나 볶아 양념한 반찬", translations: { en: { term: "seasoned greens", mainDef: "a side dish of edible greens or leaves, blanched or stir-fried and seasoned." } }, variants: ["나물"], examples: [{ kor: "비빔밥에는 여러 가지 나물이 들어가요.", eng: "Bibimbap contains several kinds of seasoned greens." }] },
            { term: "풍부하다", mainDef: "풍(豐 넉넉하다) + 부(富 넉넉하다) -> 어떤 것이 아주 넉넉하게 많다", translations: { en: { term: "abundant / rich in", mainDef: "pung (豐, plentiful) + bu (富, abundant) — having a great deal of something." } }, variants: ["풍부한", "풍부하다"], examples: [{ kor: "이 과일은 비타민이 풍부해요.", eng: "This fruit is rich in vitamins." }] },
            { term: "꾸리다", mainDef: "살림이나 계획을 짜서 이끌어 나가다", translations: { en: { term: "to put together / to run", mainDef: "to organize and keep something going, such as a household or a plan." } }, variants: ["꾸려보려고", "꾸리다"], examples: [{ kor: "혼자서 살림을 꾸리는 게 쉽지 않아요.", eng: "Running a household on your own isn't easy." }] },
            { term: "후기", mainDef: "후(後 뒤) + 기(記 적다) -> 직접 해 보거나 써 본 뒤에 남기는 감상과 평가. 인터넷 쇼핑·맛집 문화에서 아주 자주 쓴다", translations: { en: { term: "a review / follow-up report", mainDef: "hu (後, after) + gi (記, to record) — impressions written up after actually trying something. Ubiquitous in Korean online shopping and restaurant culture." } }, variants: ["후기"], examples: [{ kor: "구매 후기를 꼼꼼히 읽고 골랐어요.", eng: "I read the buyer reviews carefully before choosing." }] },
            { term: "쇼츠", mainDef: "유튜브의 1분 이내 세로형 짧은 영상. 영어 Shorts에서 왔으며 한국에서는 '숏폼'과 함께 쓴다", translations: { en: { term: "Shorts", mainDef: "YouTube's vertical videos under a minute. From English 'Shorts'; in Korea it is used alongside 'syotpom' (short-form)." } }, variants: ["쇼츠"], examples: [{ kor: "요즘은 쇼츠만 계속 보게 돼요.", eng: "These days I just keep watching Shorts." }] },
            { term: "챌린지", mainDef: "어떤 목표를 정해 일정 기간 도전하고 그 과정을 SNS에 공유하는 것. 영어 challenge에서 왔지만 '공유'의 뜻이 더해졌다", translations: { en: { term: "a challenge (social media)", mainDef: "setting a goal, attempting it for a set period, and sharing the process on social media. From English 'challenge', with the sharing element added." } }, variants: ["챌린지"], examples: [{ kor: "한 달 물 2리터 챌린지를 시작했어요.", eng: "I've started a one-month two-liters-of-water challenge." }] },
            { term: "응원하다", mainDef: "응(應 응하다) + 원(援 돕다) -> 잘되기를 바라며 힘을 실어 주다", translations: { en: { term: "to cheer on / support", mainDef: "eung (應, to respond) + won (援, to aid) — to root for someone and give them encouragement." } }, variants: ["응원해 주세요", "응원하다"], examples: [{ kor: "멀리서나마 응원할게요.", eng: "I'll be cheering you on, even from afar." }] }
        ];

        const QUIZ_LIST = [
            { id: 1, textParts: ["요즘에는 젊은 사람들이 ", "를 늦추는 방법에 대해 관심을 가져요."], answer: "노화", hint: "비슷한 표현: 늙음. 노(老 늙다) + 화(化 되다)로 이루어진 한자어예요.", explanation: "'노화'는 나이가 들면서 몸의 기능이 점점 떨어지는 것을 뜻해요.", textParts_eng: ["These days young people are interested in ways to slow down ", "."], answer_eng: "aging" },
            { id: 2, textParts: ["왜냐하면 건강한 ", "을 유지하면 나이가 들어도 몸이 늙는 것을 늦출 수 있거든요."], answer: "식단", hint: "비슷한 표현: 식사 계획. 식(食 먹다) + 단(單 표)으로 이루어진 한자어예요.", explanation: "'식단'은 매일 먹는 음식의 종류와 양을 미리 계획해 정한 것이에요.", textParts_eng: ["That's because keeping a healthy ", " lets you slow down how quickly your body ages."], answer_eng: "diet" },
            { id: 3, textParts: ["", " 음식을 자주 먹으면 몸에 좋지 않아요."], answer: "자극적인", hint: "비슷한 표현: 맛이 아주 강한. 뒤에 오는 명사 '음식'을 꾸며 주는 형태로 바꿔야 해요.", verbHint: "'자극적' + 이다 → 관형형 어미 '-ㄴ'이 붙어 '자극적인'이 돼요.", explanation: "'자극적' + '이다' + 관형형 어미 '-ㄴ' → '자극적인'이 되어 뒤의 명사 '음식'을 꾸며요.", textParts_eng: ["Eating ", " food often isn't good for your body."], answer_eng: "intensely flavored" },

            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        // video: 어휘 호버 팝업
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        // keyboard (video)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } } else if (e.code === 'ArrowUp') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { if (p.isMuted && p.isMuted()) p.unMute(); p.setVolume(Math.min(100, Math.round(p.getVolume()) + 10)); } } else if (e.code === 'ArrowDown') { e.preventDefault(); const p = learn.player; if (p && p.getVolume) { p.setVolume(Math.max(0, Math.round(p.getVolume()) - 10)); } } else if (e.key === ',' || e.key === '.') { e.preventDefault(); const steps = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0]; let idx = steps.indexOf(learn.rate); if (idx < 0) idx = 2; idx = Math.min(steps.length - 1, Math.max(0, idx + (e.key === ',' ? -1 : 1))); learn.rate = steps[idx]; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); if (typeof rebuildToolbar === 'function') rebuildToolbar(); } else if (e.key === 'm' || e.key === 'M') { const p = learn.player; if (p && p.isMuted) { if (p.isMuted()) p.unMute(); else p.mute(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.error = null; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id);
            const prompt = `당신은 한국어 학습자를 돕는 'AI 한국어 도우미'입니다. 학습자 답변을 분석하고 JSON으로만 답하세요. 순수 JSON만 반환하세요.\n[질문]: ${item.questionKor}\n[학습자 답변]: ${st.text}\n[포맷]: {"overallPraise":"","overallPraiseTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const data = await callGeminiWithBackoff(payload); let txt = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text; if (!txt) throw new Error('응답이 비어있습니다.'); txt = txt.replace(/^```json\n?/, '').replace(/\n?```$/, ''); st.feedback = JSON.parse(txt); }
            catch (err) { st.error = err.message; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 시작 ----------
        buildApp();
    })();
    </script>
</body>
