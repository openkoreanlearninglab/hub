    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
/* 읽기 자료 소제목 (세로 막대 대신 가로선 + 라벨) */
.rd-h{font-size:1.375rem;font-weight:700;color:#111827;margin-top:3.5rem;margin-bottom:1.5rem;padding-top:1.25rem;border-top:1px solid #d1d5db;text-align:left!important}
#reading-blocks > div:first-child .rd-h{margin-top:0}
.rd-sh{display:inline-block;font-size:15px!important;font-weight:700;color:#1f2937;margin-top:1.75rem;margin-bottom:.5rem;padding:.25rem .9rem;border-radius:9999px;background:#f3f4f6;line-height:1.7!important}
.src-link{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#6b7280;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.src-link:hover{color:#111}
/* 유튜브 댓글 스타일 */
.yt-c{display:flex;gap:14px;margin-bottom:22px;font-family:'Noto Sans KR',sans-serif}
.yt-av{width:38px;height:38px;border-radius:50%;background:#e5e7eb;color:#9ca3af;flex:none;display:flex;align-items:center;justify-content:center}
.yt-b{flex:1;min-width:0}
.yt-n{font-size:13px;font-weight:600;color:#0f0f0f;margin-bottom:2px}
.yt-t{font-size:15px;line-height:1.65;color:#0f0f0f;word-break:keep-all}
.yt-trans{font-size:13px;color:#6b7280;background:#f9fafb;padding:10px 12px;border-radius:6px;margin-top:6px;line-height:1.55}
.yt-a{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:12px;color:#606060}
.yt-like{display:inline-flex;align-items:center;gap:6px}
.yt-eng{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;background:none;border:none;padding:0;cursor:pointer}
.yt-eng:hover{color:#111}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}

            RED_TAGS: ['맞춤법', '오타', '띄어쓰기', '조사', '활용', '문법', '시제', '주어·서술어 호응', '단어 조합', '단어 선택', '연결 표현', '불필요한 반복', '문맥상 어색한 표현', '문체', '빠진 말'],

            ORANGE_TAGS: { A: ['더 좋은 표현'], B: ['더 좋은 표현', '일관성'], C: ['더 좋은 표현', '정확한 어휘', '고급 표현', '문어체', '번역투', '일관성', '논리 연결', '대체 표현', '다른 글쓰기 스타일', '의도에 따라 달라요'] },
            RED_FALLBACK_TAG: '문법', ORANGE_FALLBACK_TAG: '더 좋은 표현',
            TAG_LABEL_EN: {
                '맞춤법': 'Spelling', '오타': 'Typo', '띄어쓰기': 'Spacing', '조사': 'Wrong 이/가 · 을/를 · 에 …', '활용': 'Word form',

        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["문화","사회"];
        const HOME_SERIES_BADGE = "";
        const SONG = {"videoId": "GxChUrrY4bc", "title": "꿈꾸던 어른이 되었나요?", "artist": "머무르 MEOMURU", "lyricsUrl": "https://www.melon.com/song/detail.htm?songId=602290711", "guide": "읽기 자료를 보기 전에 먼저 이 노래를 들으면서 어떤 느낌이 드는지 생각해 보세요.", "guideEng": "Before the readings, listen to this song first. Think about how it makes you feel.", "exprs": [["짓누르다", "무거운 것이 위에서 세게 누른다는 뜻이에요. 노래에서는 걱정과 고민이 마음을 무겁게 누른다는 뜻으로 쓰였어요.", "to press down hard; in the song, worries weigh heavily on the singer."], ["내려앉다", "위에서 아래로 조용히 내려와 자리를 잡는다는 뜻이에요. 노래에서는 고민이 하나씩 어깨 위에 쌓인다는 뜻으로 쓰였어요.", "to settle down from above; in the song, worries quietly pile up on the shoulders."], ["모나다", "물건에 모서리가 있어 둥글지 않거나, 말이나 행동이 부드럽지 못하다는 뜻이에요. 노래에서는 완벽하지 않은 자기 모습을 가리켜요.", "to be angular, or rough in words and manner; in the song, it describes an imperfect self."], ["하룰", "'하루를'을 줄인 말이에요. 노래 가사에서는 박자에 맞추려고 이렇게 줄여 쓰는 일이 많아요.", "a contraction of 하루를 (\"the day,\" object); lyrics often shorten words to fit the beat."], ["숨을 셔요", "'숨을 쉬어요'를 줄여서 부른 거예요. 표준어는 '쉬어요'예요.", "sung contraction of 숨을 쉬어요 (\"I breathe\"); the standard form is 쉬어요."]]};
        const READING_DATA = [{"id": 1, "title": "AI가 노래한<br>'꿈꾸던 어른이 되었나요?'가 던진 질문", "subtitle": "", "source": "https://www.mindlenews.com/news/articleView.html?idxno=22648", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c1-ai-song-who-made-it.webp", "cardTitle": "이 노래를 만든 사람은 누구일까요?", "cardDesc": "AI 노래가 던진 창작과 저작권의 질문", "content": [{"text": "얼마 전 노래 한 곡이 음원 차트에서 눈에 띄는 기록을 만들었다. '머무르'의 〈꿈꾸던 어른이 되었나요?〉다. 이 곡은 2026년 10월 2일 기준 멜론 톱100 최고 18위까지 올랐다. 그런데 이 노래가 특별한 이유는 단순히 차트에서 좋은 성적을 거두었다는 데 있지 않다. 보컬을 생성형 음악 AI인 수노(Suno)를 활용해 구현했다는 점 때문이다.", "trans": "Not long ago, a song set a striking record on the music charts: 〈Did You Become the Adult You Dreamed Of?〉 by MEOMURU. As of October 2, 2026, it climbed as high as No. 18 on the Melon Top 100. But what makes this song special isn't simply that it did well on the charts. It's that its vocals were created using Suno, a generative music AI."}, {"text": "'머무르'는 자신의 경험과 감정을 바탕으로 직접 가사를 쓰고 곡의 기획과 프로듀싱 디렉션을 맡았으며, 인공지능(AI)을 활용해 자신의 음악적 상상을 실제 음원으로 구현했다. ‘AI가 노래를 만들었다’고 말할 수도 있지만, 조금만 자세히 들여다보면 전혀 다른 질문이 생긴다. 과연 이 노래를 만든 사람은 누구인가.", "trans": "MEOMURU wrote the lyrics themselves, drawing on their own experiences and feelings, and took charge of the song's planning and production direction, using artificial intelligence (AI) to turn their musical imagination into an actual track. You could say \"AI made the song,\" but look a little closer and a very different question comes up: who, really, made this song?"}, {"text": "아마 많은 사람은 가장 먼저 “AI가 만들었으니 AI 음악”이라고 생각할 것이다. 그러나 나는 오히려 그 순간부터 질문을 다시 시작해야 한다고 생각한다. 누가 무엇을 결정했는가. 누가 자신의 이야기를 담았는가. 누가 어떤 결과물을 선택했는가. 누가 그것을 하나의 작품으로 세상에 내놓았는가. 이것은 단순히 AI 음악의 저작권을 둘러싼 기술적 논쟁이 아니다. 앞으로 ‘창작자’라는 사람이 누구인지, 그리고 인간의 창작이 무엇을 의미하는지를 다시 묻는 문제다.", "trans": "Many people probably think first, \"AI made it, so it's AI music.\" I think that's exactly the moment to start asking again. Who decided what? Who put their own story into it? Who chose which result? Who released it into the world as a work? This isn't just a technical debate about AI music copyright. It's a question that asks again who a \"creator\" is, and what human creation means."}, {"text": "우리는 오랫동안 창작자를 특정한 방식으로 생각해 왔다. 작곡가는 오선지에 음표를 적고, 화가는 붓을 들고, 작가는 문장을 직접 쓰며, 가수는 자신의 목소리로 노래한다고 생각했다. 창작자의 가치는 결과물을 직접 생산하는 행위와 강하게 연결되어 있었다. 하지만 기술은 언제나 이 경계를 바꾸어 왔다. 사진기가 등장했을 때 사진이 예술인가를 두고 논쟁이 있었고, 전자음악과 신시사이저가 등장했을 때 기계가 만들어내는 소리가 음악이 될 수 있는지를 두고 논란이 있었다. 생성형 AI는 이보다 한 단계 더 나아갔다. 이제 기술은 단순히 인간의 손을 보조하는 것을 넘어 아이디어를 실제 결과물로 변환하는 과정까지 돕고 있다.", "trans": "For a long time we've thought of creators in a particular way. We pictured composers writing notes on staff paper, painters holding a brush, writers writing their own sentences, and singers singing with their own voices. A creator's value was tightly linked to the act of producing the result directly. But technology has always shifted that line. When the camera appeared, people argued over whether photography was art; when electronic music and synthesizers appeared, there was controversy over whether sounds made by machines could be music. Generative AI goes one step further. Technology now does more than assist the human hand; it helps with the whole process of turning ideas into actual results."}, {"text": "그렇다면 이제 우리는 ‘인간이 직접 만들었는가’만을 물어서는 안 된다. 더 중요한 질문은 ‘인간이 창작 과정에서 무엇을 결정하고 무엇을 표현했는가’다. '머무르' 사례가 의미 있는 이유도 바로 여기에 있다. 인간은 자신의 경험과 감정을 가사로 표현하고, 어떤 음악을 만들 것인지 기획하고, AI가 만들어낸 결과물 가운데 무엇을 선택할 것인지 결정한다. AI는 인간의 상상을 소리로 구현하는 도구가 된다. 이것은 인간과 AI 중 누가 창작자인지를 가르는 문제가 아니라 인간과 AI가 어떤 방식으로 협업하는지를 보여주는 사례다.", "trans": "So we can no longer ask only, \"Did a human make it directly?\" The more important question is, \"What did the human decide and express during the creative process?\" That's exactly why the MEOMURU case matters. A person expresses their experiences and feelings in lyrics, plans what kind of music to make, and decides which of the AI's results to choose. The AI becomes a tool that turns human imagination into sound. This isn't about deciding whether the human or the AI is the creator; it's a case that shows how humans and AI work together."}, {"text": "결국 음악을 듣는 사람에게 중요한 것은 그 음악이 어떤 알고리즘에서 나왔는가만이 아니다. 그 음악이 어떤 이야기를 하고 있는지, 어떤 감정을 전달하는지, 그리고 나에게 어떤 의미를 주는지가 더 중요하다. AI라는 도구를 사용했다는 사실만으로 작품의 문화적 가치가 사라지는 것은 아니다.", "trans": "In the end, what matters to listeners isn't only which algorithm a piece of music came from. What matters more is what story it tells, what feelings it carries, and what it means to me. The mere fact that a tool called AI was used doesn't erase a work's cultural value."}, {"text": "바로 이 지점에서 법의 문제가 등장한다. 현행 저작권 체계에서 중요한 출발점은 인간의 창작적 기여다. 생성형 AI가 결과물을 만들어냈다는 이유만으로 그 결과물 전체에 인간의 저작권이 자동으로 발생하는 것은 아니다. 반대로 AI를 창작 도구로 사용했다는 이유만으로 인간의 창작적 기여가 모두 사라지는 것도 아니다. 한국저작권위원회 역시 생성형 AI 활용 저작물의 저작권 등록 문제를 별도로 다루면서 인간의 창작적 기여를 중심으로 관련 기준과 실무를 설명하고 있다.", "trans": "This is exactly where the legal question comes in. Under the current copyright system, the key starting point is human creative contribution. Just because generative AI produced a result doesn't mean a human automatically owns copyright over all of it. Conversely, just because AI was used as a creative tool doesn't mean every human creative contribution disappears. The Korea Copyright Commission also deals separately with registering works made with generative AI, explaining its standards and practice with human creative contribution at the center."}, {"text": "이것은 앞으로 매우 중요한 원칙이 될 것이다. AI를 사용했는가, 사용하지 않았는가라는 이분법으로는 복잡한 창작 과정을 설명할 수 없기 때문이다. 사람이 직접 가사를 쓰고, 음악의 구조와 분위기를 설계하고, AI가 생성한 여러 결과물 가운데 하나를 선택하고, 다시 수정하고, 편집했다면 인간의 창작적 선택은 분명 존재한다. 반대로 아무런 창작적 개입 없이 AI가 생성한 결과물을 그대로 이용했다면 이야기는 달라질 수 있다.", "trans": "This will become a very important principle, because the either-or of \"Was AI used or not?\" can't explain a complex creative process. If a person wrote the lyrics, designed the music's structure and mood, chose one of several AI-generated results, then revised and edited it, human creative choice clearly exists. On the other hand, if someone simply used an AI-generated result as-is with no creative input, the story may be different."}, {"text": "따라서 앞으로 저작권 판단은 ‘AI 사용 여부’보다 ‘인간의 창작적 기여가 무엇이었는가’를 중심으로 더욱 정교해질 필요가 있다. 여기서 반드시 구분해야 할 또 하나의 문제가 있다. ‘AI를 이용해 새로운 창작물을 만드는 것’과 ‘AI가 기존 창작물을 학습하는 것’은 전혀 다른 문제라는 점이다.", "trans": "So copyright judgments need to become more precise, centering on \"What was the human creative contribution?\" rather than \"Was AI used?\" And there's one more issue we must keep separate: \"using AI to make a new work\" and \"AI learning from existing works\" are completely different problems."}, {"text": "한 창작자가 자신의 경험을 바탕으로 가사를 쓰고 '수노'를 이용해 음악을 만드는 것은 AI를 창작 도구로 사용하는 문제다. 반면 생성형 AI가 기존 음악산업에 존재하는 수많은 음원을 학습하는 과정에서 저작권이 있는 작품을 어떻게 이용했는지는 학습데이터와 권리자의 문제다. 전자는 AI를 사용하는 새로운 창작자의 권리를 어떻게 보호할 것인가의 문제이고, 후자는 기존 창작자의 작품이 AI 생태계에서 어떻게 이용되고 보상받을 것인가의 문제다.", "trans": "A creator writing lyrics from their own experience and making music with Suno is a matter of using AI as a creative tool. By contrast, how copyrighted works were used while generative AI learned from countless tracks in the existing music industry is a matter of training data and rights holders. The former is about how to protect the rights of new creators who use AI; the latter is about how existing creators' works are used, and compensated, in the AI ecosystem."}, {"text": "두 문제를 하나로 묶어 ‘AI 음악은 위험하다’고 결론 내리는 것은 적절하지 않다. 오히려 AI를 사용하는 창작자도 보호하고, AI 학습에 자신의 작품이 이용되는 기존 창작자의 권리도 보호하는 두 가지 정책 목표를 동시에 달성해야 한다. 이제는 ‘AI를 어떻게 합법적이고 지속 가능한 방식으로 창작 생태계 안에 편입시킬 것인가’라는 질문으로 논의의 중심이 이동해야 한다.", "trans": "Lumping the two together and concluding that \"AI music is dangerous\" isn't appropriate. Instead, we need to reach two policy goals at once: protecting creators who use AI, and protecting the rights of existing creators whose works are used to train AI. Now the center of the discussion needs to shift to this question: \"How can we bring AI into the creative ecosystem in a lawful and sustainable way?\""}, {"text": "다시 처음의 노래로 돌아가자. 〈꿈꾸던 어른이 되었나요?〉라는 제목은 묘하게 지금의 AI 시대와 닮아 있다. 우리는 기술이 발전하면 인간의 창작이 더 자유로워질 것이라고 생각했다. 그런데 막상 생성형 AI가 등장하자 우리는 먼저 두려워했다. 내 일자리는 어떻게 되는가. 내 창작물은 어떻게 되는가. AI가 만든 것은 진짜 예술인가. 누가 창작자인가. 하지만 우리가 정말 꿈꾸던 어른이 되어야 한다면, 이제 기술을 두려워하는 데서 멈추지 말고 그 기술을 어떤 세상에 사용할 것인지 선택해야 한다.", "trans": "Let's go back to the song from the beginning. The title 〈Did You Become the Adult You Dreamed Of?〉 strangely resembles today's AI era. We thought that as technology advanced, human creativity would become freer. But when generative AI actually arrived, our first reaction was fear. What will happen to my job? What will happen to my work? Is something AI-made real art? Who is the creator? But if we really want to become the adults we dreamed of, we need to stop at fear no longer, and choose what kind of world we'll use this technology for."}]}, {"id": 2, "title": "스포티파이 \"AI로 찍어낸 쓰레기 음원 퇴출\"…<br>5천만 곡 삭제", "subtitle": "", "source": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008808152", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c1-ai-song-who-made-it.webp", "cardTitle": "스포티파이는 왜 AI 음원을 뺐을까요?", "cardDesc": "추천 목록에서 사라진 5천만 곡", "content": [{"text": "스트리밍 음원 업체 스포티파이는 인공지능(AI)으로 찍어내는 저질 음악 때문에 인간이 만든 곡이 밀려나는 것을 막겠다고 현지시간 21일 선언했다.", "trans": "Music streaming company Spotify declared on the 21st (local time) that it will stop human-made songs from being pushed aside by low-quality music churned out with artificial intelligence (AI)."}, {"text": "이에 따라 스포티파이는 올해 들어 AI가 만든 것으로 추정되는 음악 5천만 곡 이상을 추천 목록에서 퇴출시켰다.", "trans": "Accordingly, Spotify has removed more than 50 million tracks believed to be AI-made from its recommendation lists this year."}, {"text": "미국 NBC 방송 등에 따르면 스포티파이는 이날 발표한 성명에서 AI로 생성한 음악을 \"쓰레기이자 싸구려\"(slop and spam)라고 지목하고 \"이는 우리 목록에 더는 있을 자격이 없다\"고 밝혔다.", "trans": "According to NBC and other outlets, in a statement released that day Spotify singled out AI-generated music as \"slop and spam\" and said, \"It no longer deserves a place on our lists.\""}, {"text": "스포티파이는 특히 이러한 문제를 해결하기 위해 사용자들의 도움을 구했다고 설명했다.", "trans": "Spotify explained that it especially sought users' help to solve this problem."}, {"text": "최근 6개월에 걸쳐 청취자들이 반복적으로 건너뛰거나 무시하는 곡들을 대상으로 양상을 분석했다는 것이다.", "trans": "Over the past six months, it analyzed patterns in songs that listeners repeatedly skipped or ignored."}, {"text": "이러한 문제의 곡들은 인위적으로 생성된 저질 음원과 동일한 양상을 나타냈다고 한다.", "trans": "These problem songs reportedly showed the same patterns as artificially generated low-quality tracks."}, {"text": "다만 스포티파이는 AI 탐지 도구에 한계가 있다는 점을 시인했으며, 의심스러운 음원을 적발하는 게 갈수록 어려워진다고 말했다.", "trans": "However, Spotify admitted that its AI detection tools have limits, and said that catching suspicious tracks is getting harder and harder."}, {"text": "AI 음원이 문제가 되는 것은 인간 창작자가 받는 수익을 줄어들게 만들 수 있기 때문이다.", "trans": "AI tracks are a problem because they can shrink the income human creators receive."}, {"text": "스포티파이에서는 전체 스트리밍 횟수에서 각 창작자의 음악이 차지하는 비중 등에 따라 수익 배분이 이뤄진다.", "trans": "On Spotify, revenue is shared based on factors such as each creator's share of total streams."}, {"text": "AI 생성 음악이 늘어나 전체 재생 횟수가 커지면 인간 창작자에게 돌아가는 수익 비중이 줄어든다.", "trans": "As AI-generated music grows and total plays rise, the share of revenue going to human creators falls."}, {"text": "다른 한편에서는 AI와 공존을 모색하는 창작자도 있다.", "trans": "Meanwhile, some creators are looking for ways to coexist with AI."}, {"text": "스포티파이는 올해 초 'AI 표시'를 추가하는 기능을 도입했다.", "trans": "Early this year, Spotify introduced a feature for adding an 'AI label.'"}, {"text": "이는 창작자가 노래 일부에 AI를 활용했다고 공개할 수 있는 기능이다.", "trans": "It lets creators disclose that they used AI for part of a song."}, {"text": "또한 AI가 만든 것으로 추정되는 음원을 올린 대상에는 'AI 페르소나' 표시를 달고 있으며, 이는 추천 목록에서 제외되도록 했다.", "trans": "It also attaches an 'AI Persona' label to accounts that upload tracks believed to be AI-made, and has excluded these from recommendation lists."}]}, {"id": 3, "title": "대중들의 반응과 전문가들의 의견", "subtitle": "AI 음악, 어떻게 볼 것인가", "source": "https://www.youtube.com/watch?v=GxChUrrY4bc", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c1-ai-song-who-made-it.webp", "cardTitle": "듣는 사람들과 전문가들은 어떻게 생각할까요?", "cardDesc": "AI 음악에 대한 댓글과 여러 의견", "content": [{"isHeading": true, "text": "듣는 사람들의 반응 — 유튜브 댓글", "trans": "How listeners reacted — YouTube comments"}, {"isSubHeading": true, "text": "AI가 만들었지만 괜찮다", "trans": "AI made it, but that's okay"}, {"isComment": true, "likes": 1500, "text": "… Ai로 만들어진 노래라니 놀랐고 너무 큰 감동을 받았어요! 제 짧다면 짧은 길다면 긴 인생을 돌아보게 되네요.", "trans": "… I was surprised it was a song made with AI, and it moved me so much! It makes me look back on my life — short in some ways, long in others."}, {"isComment": true, "likes": 117, "text": "이 노래를 ai라고 비판하는 사람들도 많겠지만 나는 오히려 너무 좋았다. 어차피 내 곁에는 사람이 없거든. ai라도 내 심금을 울렸으면 그걸로 된거다. 나는 이렇게 사람들에 치이지않고 ai노래로 힘들었던 한주 위로 받으며 잘래 😂", "trans": "Lots of people will criticize this song for being AI, but honestly I loved it. There's no one by my side anyway. Even if it's AI, if it touched my heart, that's enough. I'm going to sleep comforted by an AI song after a rough week, without getting worn out by people 😂"}, {"isComment": true, "likes": 63, "text": "노래가 좋은거에 1차중격 / 그게 ai 라는게 2차 충격 / 가사가 좋아서 3차 충격 / 충격 도가니 그차제", "trans": "First shock: the song is good / second shock: it's AI / third shock: the lyrics are great / a total melting pot of shock"}, {"isComment": true, "likes": 60, "text": "Ai가 사람도 위로해주네", "trans": "So AI can comfort people too"}, {"isComment": true, "likes": 51, "text": "ai 노래여도 사람 마음을 울렸으면 명곡이다", "trans": "Even if it's an AI song, if it moved people's hearts, it's a masterpiece"}, {"isComment": true, "likes": 35, "text": "… 이노래 듣고 어? 내얘기인가 놀랬는데 다시한번 ai여서 놀랬고 그냥 이노래로 위로받는 저에 대해 놀랬어요 …", "trans": "… When I heard this song I was surprised — is this about me? Then I was surprised again that it was AI, and I was surprised at myself for being comforted by it …"}, {"isComment": true, "likes": 31, "text": "AI면 뭐 어떠냐 노래만 좋으면 됐지", "trans": "So what if it's AI? As long as the song is good"}, {"isComment": true, "likes": 23, "text": "이정도 퀄리티의 노래면 ai여도 인정한다", "trans": "With a song of this quality, I'll accept it even if it's AI"}, {"isComment": true, "likes": 20, "text": "AI 창작물에 대한 거부감이나 반항적인 마음이 와장창 깨져버렸다.. 너무 좋네요", "trans": "My resistance and pushback against AI-made works came crashing down.. it's so good"}, {"isComment": true, "likes": 7, "text": "ai라도 정말 눈물 나는 노래 였어요.감사합니다", "trans": "Even if it's AI, it was a song that truly brought me to tears. Thank you"}, {"isSubHeading": true, "text": "AI가 만들어서 괜찮지 않다", "trans": "AI made it, so it's not okay"}, {"isComment": true, "likes": 776, "text": "이게 ai가 만든 노래라니 / 꿈꾸던 미래가 이런 건 아니었는데", "trans": "This is a song made by AI? / This isn't the future I dreamed of"}, {"isComment": true, "likes": 88, "text": "이노래가 AI라는 사실을 알게된 후로 왜이리 노래에 몰입이 안되는거 같지... 알지말걸 ㅠㅠㅠ", "trans": "Ever since I found out this song is AI, why can't I get into it anymore... I wish I didn't know ㅠㅠㅠ"}, {"isComment": true, "likes": 58, "text": "Ai가 이런노래까지 만들수있다니 무섭다 이제는,,,,", "trans": "AI can make a song like this? That's scary now,,,,"}, {"isComment": true, "likes": 35, "text": "이렇게 좋은데 ai라니,, 슬프네요", "trans": "It's this good and it's AI,, that's sad"}, {"isComment": true, "likes": 26, "text": "하 진짜 좋으면서도 싫다... 처음 듣자마자 좋아요 눌렀다가, Ai라고 하길래 알고리즘 안뜨게 하려고 취소했는데, 어느새 와서 찾아서 듣고 있음... 이제 음악도 Ai가 다 먹겠다...", "trans": "Ugh, I really love it and hate it at the same time... I hit like as soon as I first heard it, then canceled it when I heard it was AI so the algorithm wouldn't show it to me, and before I knew it I came back looking for it... AI is going to take over music too..."}, {"isComment": true, "likes": 11, "text": "ai라니까 팍 식네...", "trans": "Hearing it's AI totally kills it for me..."}, {"isComment": true, "likes": 11, "text": "이런노래를 ai로 만들고 꿈꾸던 어른이 되었나요? 하는게 호러다...", "trans": "Making a song like this with AI and then asking \"Did you become the adult you dreamed of?\" — that's horror..."}, {"isComment": true, "likes": 9, "text": "ai라니 토나온다…………", "trans": "It's AI? That makes me sick…………"}, {"isComment": true, "likes": 9, "text": "큰일났다. AI로 인해 음악시장도 곧 전멸하겠구나. 이젠 사람이 아닌 기계한테 위로를 받아야하는 시대인건가", "trans": "We're in trouble. The music market will soon be wiped out because of AI. Is this an era where we have to be comforted by machines, not people?"}, {"isComment": true, "likes": 3, "text": "Ai 노래 들으면 아무리 좋아도 소름이 돋는 이유가 뭘까여 불쾌한 골짜기 같은 걸까요…", "trans": "Why do I get chills when I hear an AI song, no matter how good it is? Is it something like the uncanny valley…"}, {"isHeading": true, "text": "전문가들의 의견", "trans": "What the experts say"}, {"isSubHeading": true, "text": "받아들여야 할 흐름이다", "trans": "A trend we have to accept"}, {"text": "임희윤 대중음악평론가는 \"이제는 AI 보컬의 노래도 청취자에게 감동을 줄 수 있는 새로운 시대가 열렸다\"며 \"앞으로 기존 기획사와 가수는 인간만이 가질 수 있는 고유의 스토리텔링을 갖춰야 할 것\"이라고 말했다.", "trans": "Pop music critic Lim Hee-yun said, \"A new era has opened in which songs with AI vocals can move listeners too,\" adding, \"From now on, existing agencies and singers will need storytelling that only humans can have.\"", "link": {"label": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261002142400005"}}, {"text": "한 가요 제작자는 \"AI로 목소리를 생성하고 노래를 만들어내는 문턱이 정말 많이 낮아졌고, 비용도 놀라울 정도로 저렴하다. 또 매니지먼트 측면에서 AI 가수는 리스크가 없다\"면서 \"지금은 거부감을 갖는 사람들이 있지만 점점 대중도 AI 가수에 적응해갈 것\"이라고 내다봤다.", "trans": "A K-pop producer said, \"The barrier to generating voices and making songs with AI has dropped a lot, and it's surprisingly cheap. And from a management point of view, an AI singer carries no risk,\" predicting, \"Some people feel uneasy about it now, but the public will gradually get used to AI singers.\"", "link": {"label": "일간스포츠", "url": "https://isplus.com/article/view/isp202610020003"}}, {"isSubHeading": true, "text": "걱정스럽다", "trans": "This is worrying"}, {"text": "정민재 대중음악평론가는 이 곡에 대해 \"굉장히 클리셰적이고 뻔한 노래다. … 사람들이 좋아할 만한 요소를 조합해 스케치했다고 본다\"고 평했다. 그러면서 \"바람직하거나 아름다운 상황으로 보지 않지만\", AI 음원이 차트에 들어오는 현상은 막을 수 없을 것이라며 \"AI 차트를 별도로 신설하는 등의 논의가 되어야 할 것\"이라고 말했다.", "trans": "Pop music critic Jung Min-jae described the song as \"an extremely clichéd, predictable song. … I think it was sketched by combining elements people are likely to like.\" He added that although he does \"not see it as a desirable or beautiful situation,\" AI tracks entering the charts can't be stopped, and said, \"There should be discussions such as creating a separate AI chart.\"", "link": {"label": "일간스포츠", "url": "https://isplus.com/article/view/isp202610020003"}}, {"text": "K팝 분야에서 활동하는 한 작곡가는 \"AI 활용이 공식화될 경우 인간 예술에 대한 존중이 흐려지고, 손쉽게 대량생산된 ‘AI 슬롭(Slop·찌꺼기)’이 범람할까 두렵다\"고 말했다.", "trans": "A composer working in K-pop said, \"If using AI becomes official, I'm afraid respect for human art will fade and easily mass-produced 'AI slop' will flood the market.\"", "link": {"label": "동아일보", "url": "https://www.donga.com/news/Culture/article/all/20260821/134516017/2"}}, {"isSubHeading": true, "text": "인정하되 기준이 필요하다", "trans": "Accept it, but set standards"}, {"text": "경력 10년이 넘는 한 작곡가는 \"이미 현업에서 AI가 활발하게 쓰이는 만큼 사실상 받아들이지 않을 방법은 없다\"며 \"음원 유통 단계에서 AI 활용 여부를 명확히 표시하고, 인간이 맡은 역할과 기여도를 세밀하게 구분할 필요가 있다\"고 했다.", "trans": "A composer with more than ten years of experience said, \"Since AI is already widely used in the industry, there is practically no way not to accept it,\" adding, \"At the distribution stage, we need to clearly label whether AI was used, and carefully separate the roles and contributions of humans.\"", "link": {"label": "동아일보", "url": "https://www.donga.com/news/Culture/article/all/20260821/134516017/2"}}, {"text": "머무르의 곡을 만든 팀 글로리웨이브는 \"AI의 기술적 한계가 있는 만큼 AI 음악이 음악제작 과정을 완전히 대체할 수 있다고 보기는 어렵다\"면서도 \"이제는 음악을 만드는 기술보다 어떤 음악을 만들지가 더 중요해진 것 같다\"고 했다.", "trans": "Gloriwave, the team behind MEOMURU's song, said, \"Since AI has technical limits, it's hard to say AI music can completely replace the music-making process,\" but added, \"Now, what kind of music to make seems to matter more than the skill of making music.\"", "link": {"label": "경향신문", "url": "https://www.khan.co.kr/article/202610160900001"}}]}];
        const VOCAB_READING_DATA = [{"term": "음원", "mainDef": "음원은 노래나 음악을 파일로 만들어 듣거나 사고팔 수 있게 한 것이에요.", "hanja": "음(音 소리) + 원(源 근원)", "variants": ["음원"], "examples": [{"kor": "새 음원이 나오자마자 바로 들어 봤어요.", "eng": "I listened to the new track as soon as it came out."}], "translations": {"en": {"term": "music track / audio file", "mainDef": "A song or piece of music made into a file that people can play, buy, or sell."}}}, {"term": "기준", "mainDef": "기준은 무엇을 따지거나 비교할 때 바탕으로 삼는 점이에요.", "hanja": "기(基 터) + 준(準 법도)", "contextDef": "'날짜 + 기준'은 그 날짜에 확인한 내용이라는 뜻이에요.", "variants": ["기준"], "examples": [{"kor": "이 가격은 오늘 오전 기준이에요.", "eng": "This price is as of this morning."}], "translations": {"en": {"term": "standard / as of", "mainDef": "A point used as a base when you judge or compare something.", "contextDef": "\"Date + 기준\" means the information was checked as of that date."}}}, {"term": "성적을 거두다", "mainDef": "누군가가 좋은 성적을 거두면, 어떤 일에서 좋은 결과를 얻는다는 뜻이에요.", "subDefs": [{"subTerm": "• 성적", "subDef": "성(成 이루다) + 적(績 공적). 시험이나 경기, 일에서 얻은 결과예요."}, {"subTerm": "• 거두다", "subDef": "좋은 결과나 이익을 얻는다는 뜻으로 써요."}], "variants": ["성적을 거두었다는"], "examples": [{"kor": "우리 팀은 이번 대회에서 좋은 성적을 거두었어요.", "eng": "Our team got good results in this competition."}], "translations": {"en": {"term": "to achieve results", "mainDef": "If you achieve good results, you get a good outcome in a competition, test, or business.", "subDefs": [{"subTerm": "성적 (成績)", "subDef": "성 (成, achieve) + 적 (績, achievement). The result you get on a test, in a game, or at work."}, {"subTerm": "거두다", "subDef": "Used to mean to gain a good result or profit."}]}}}, {"term": "생성형", "mainDef": "생성형은 사람이 요청하면 새로운 글, 그림, 소리 등을 스스로 만들어 내는 종류라는 뜻이에요.", "hanja": "생(生 나다) + 성(成 이루다) + 형(型 틀)", "variants": ["생성형"], "examples": [{"kor": "요즘은 생성형 AI로 그림을 그리는 사람이 많아요.", "eng": "These days many people draw pictures with generative AI."}], "translations": {"en": {"term": "generative", "mainDef": "A kind of technology that makes new text, images, or s to a work by their own thinking and choices.", "subDefs": [{"subTerm": "기여 (寄與)", "subDef": "기 (寄, send) + 여 (與, give). Adding your effort so something goes well."}]}}}, {"term": "발생하다", "mainDef": "무언가가 발생하면, 어떤 일이나 상태가 새로 생긴다는 뜻이에요.", "hanja": "발(發 피다) + 생(生 나다)", "contextDef": "저작권이라는 권리가 법적으로 생긴다는 뜻으로 쓰였어요.", "variants": ["발생하는"], "examples": [{"kor": "어젯밤 시내에서 큰 사고가 발생했어요.", "eng": "A big accident happened downtown last night."}], "translations": {"en": {"term": "to occur / arise", "mainDef": "If something arises, a new event or state comes into being.", "contextDef": "Used to mean that copyright legally comes into being."}}}, {"term": "저작물", "mainDef": "저작물은 사람이 생각이나 느낌을 담아 만든 글, 음악, 그림 같은 작품이에요.", "hanja": "저(著 짓다) + 작(作 짓다) + 물(物 물건)", "variants": ["저작물"], "examples": [{"kor": "도서관에 있는 책도 모두 저작물이에요.", "eng": "All the books in the library are copyrighted works too."}], "translations": {"en": {"term": "copyrighted work", "mainDef": "A work such as writing, music, or art that a person made to express their ideas or feelings."}}}, {"term": "실무", "mainDef": "실무는 실제로 하는 일, 또는 그 일을 하는 구체적인 방법이에요.", "hanja": "실(實 열매) + 무(務 힘쓰다)", "variants": ["실무"], "examples": [{"kor": "신입 사원은 한 달 동안 실무를 배워요.", "eng": "New employees learn the actual work for a month."}], "translations": {"en": {"term": "practice / actual work", "mainDef": "The real work that is done, or the concrete way of doing it."}}}, {"term": "이분법", "mainDef": "이분법은 모든 것을 둘로만 나누어 생각하는 방법이에요.", "hanja": "이(二 둘) + 분(分 나누다) + 법(法 방법)", "variants": ["이분법"], "examples": [{"kor": "사람을 좋은 사람과 나쁜 사람으로 나누는 이분법은 위험해요.", "eng": "Splitting people into only good and bad is a dangerous either-or way of thinking."}], "translations": {"en": {"term": "dichotomy / either-or thinking", "mainDef": "A way of thinking that divides everything into just two parts."}}}, {"term": "설계하다", "mainDef": "누군가가 무언가를 설계하면, 그것을 만들기 전에 모양이나 짜임을 미리 정한다는 뜻이에요.", "hanja": "설(設 베풀다) + 계(計 꾀하다)", "variants": ["설계하고"], "examples": [{"kor": "아버지가 이 집을 r": "학생들의 창작물을 학교 복도에 걸었어요.", "eng": "The students' creations were hung in the school hallway."}], "translations": {"en": {"term": "creative work", "mainDef": "A new work, such as writing, music, or art, that a person made."}}}, {"term": "학습하다", "mainDef": "누군가가 무언가를 학습하면, 배워서 익힌다는 뜻이에요.", "hanja": "학(學 배우다) + 습(習 익히다)", "contextDef": "AI가 많은 자료를 보고 그 특징을 익힌다는 뜻으로 쓰였어요.", "variants": ["학습하는"], "examples": [{"kor": "이 AI는 수많은 사진을 학습했어요.", "eng": "This AI learned from countless photos."}], "translations": {"en": {"term": "to learn / be trained on", "mainDef": "If someone learns something, they study it until they know it.", "contextDef": "Used for AI taking in a lot of data and picking up its patterns."}}}, {"term": "학습데이터", "mainDef": "학습데이터는 AI가 배우도록 넣어 주는 많은 자료예요.", "variants": ["학습데이터"], "examples": [{"kor": "좋은 학습데이터가 있어야 AI가 정확해져요.", "eng": "AI becomes accurate only with good training data."}], "translations": {"en": {"term": "training data", "mainDef": "The large amount of material given to an AI so it can learn."}}}, {"term": "권리자", "mainDef": "권리자는 법이 인정해 주어서 어떤 것을 쓰거나 지킬 수 있는 사람이에요.", "hanja": "권(權 권리) + 리(利 이롭다) + 자(者 사람)", "variants": ["권리자"], "examples": [{"kor": "이 노래를 쓰려면 권리자에게 허락을 받아야 해요.", "eng": "You need permission from the rights holder to use this song."}], "translations": {"en": {"term": "rights holder", "mainDef": "A person who has the rights to something."}}}, {"term": "전자", "mainDef": "전자는 앞에서 말한 두 가지 가운데 앞의 것이에요.", "hanja": "전(前 앞) + 자(者 것)", "variants": ["전자는"], "examples": [{"kor": "커피와 차 중에서 저는 전자를 더 좋아해요.", "eng": "Between coffee and tea, I prefer the former."}], "translations": {"en": {"term": "the former", "mainDef": "The first of two things just mentioned."}}}, {"term": "후자", "mainDef": "후자는 앞에서 말한 두 가지 가운데 뒤의 것이에요.", "hanja": "후(後 뒤) + 자(者 것)", "variants": ["후자는"], "examples": [{"kor": "산과 바다 중에서 이번에는 후자로 가기로 했어요.", "eng": "Between the mountains and the sea, we decided on the latter this time."}], "translations": {"en": {"term": "the latter", "mainDef": "The second of two things just mentioned."}}}, {"term": "생태계", "mainDef": "생태계는 원래 생물들이 서로 영향을 주고받으며 사는 자연 전체예요.", "hanja": "생(生 나다) + 태(態 모습) + 계(系 잇다)", "contextDef": "창작자, 회사, 듣는 사람들이 서로 영향을 주고받는 음악 시장 전체를 자연에 빗대어 말했어요.", "variants": ["생태계"], "examples": [{"kor": "쓰레기 때문에 바다 생태계가 망가지고 있어요.", "eng": "The ocean ecosystem is being damaged by trash."}], "translations": {"en": {"term": "ecosystem", "mainDef": "Originally, the whole natural world where living things affect one another.", "contextDef": "Used figuratively for the whole music market, where creators, companies, and listeners all affect one another."}}}, {"term": "보상받다", "mainDef": "누군가가 보상받으면, 한 일이나 입은 손해에 대해 돈이나 대가를 받는다는 뜻이에요.", "hanja": "보(報 갚다) + 상(償 갚다)", "variants": ["보상받을"], "examples": [{"kor": "일을 더 했으니까 그만큼 보상받아야 해요.", "eng": "I worked more, so I should be paid for it."}], "translations": {"en": {"term": "to be compensated", "mainDef": "If you are compensated, you receive money or something in return for your work or loss."}}}, {"term": "합법적", "mainDef": "합법적은 법에 맞는다는 뜻이에요.", "hanja": "합(合 합하다) + 법(法 법) + 적(的 ~의)", "variants": ["합법적이고"], "examples": [{"kor": "이 가게는 합법적으로 영업하고 있어요.", "eng": "This store is operating legally."}], "translations": {"en": {"term": "lawful / legal", "mainDef": "In line with the law."}}}, {"term": "지속 가능하다", "mainDef": "무언가가 지속 가능하면, 오랫동안 계속 이어 갈 수 있다는 뜻이에요.", "hanja": "지(持 가지다) + 속(續 잇다)", "variants": ["지속 가능한"], "examples": [{"kor": "지속 가능한 생활을 위해 일회용품을 줄이고 있어요.", "eng": "I'm cutting down on disposables for a sustainable lifestyle."}], "translations": {"en": {"term": "to be sustainable", "mainDef": "If something is sustainable, it can keep going for a long time."}}}, {"term": "편입시키다", "mainDef": "누군가가 무언가를 편입시키면, 그것을 어떤 무리나 틀 안에 넣어 그 일부가 되게 한다는 뜻이에요.", "hanja": "편(編 엮다) + 입(入 들다)", "variants": ["편입시킬"], "examples": [{"kor": "학교는 이 수업을 정식 과목으로 편입시켰어요.", "eng": "The school made this class part of the official curriculum."}], "translations": {"en": {"term": "to incorporate / bring into", "mainDef": "If you incorporate something, you bring it into a group or system so it becomes part of it."}}}, {"term": "묘하게", "mainDef": "묘하게는 딱 말하기는 어렵지만 이상하고 신기하게라는 뜻이에요.", "hanja": "묘(妙 신기하다)", "variants": ["묘하게"], "examples": [{"kor": "그 사람 얼굴이 묘하게 낯익었어요.", "eng": "That person's face looked strangely familiar."}], "translations": {"en": {"term": "strangely / curiously", "mainDef": "In a way that feels odd or interesting but is hard to explain."}}}, {"term": "찍어내다", "mainDef": "누군가가 무언가를 찍어내면, 틀에 넣은 것처럼 같은 것을 많이 빠르게 만들어 낸다는 뜻이에요.", "contextDef": "정성 없이 대충 많이 만든다는 부정적인 느낌으로 쓰였어요.", "variants": ["찍어내는"], "examples": [{"kor": "이 공장은 하루에 빵을 만 개씩 찍어내요.", "eng": "This factory churns out ten thousand loaves of bread a day."}], "translations": {"en": {"term": "to churn out / mass-produce", "mainDef": "If you churn something out, you make many copies of the same thing quickly, as if pressing them from a mold.", "contextDef": "Used with a negative feel: making lots of things carelessly."}}}, {"term": "저질", "mainDef": "저질은 솜씨가 나쁘게 만들어져서 값어치가 낮은 것이에요.", "hanja": "저(低 낮다) + 질(質 바탕)", "variants": ["저질"], "examples": [{"kor": "싸다고 샀는데 저질이라서 금방 망가졌어요.", "eng": "I bought it because it was cheap, but it was low quality and broke quickly."}], "translations": {"en": {"term": "low quality / trashy", "mainDef": "Something of poor, low quality."}}}, {"term": "밀려나다", "mainDef": "누군가가 밀려나면, 다른 것 때문에 원래 있던 자리를 빼앗기고 바깥으로 나가게 된다는 뜻이에요.", "variants": ["밀려나는"], "examples": [{"kor": "새 선수가 들어오면서 그는 주전 자리에서 밀려났어요.", "eng": "When a new player joined, he was pushed out of his starting spot."}], "translations": {"en": {"term": "to be pushed out / pushed aside", "mainDef": "If you are pushed aside, something else takes your place and you lose it."}}}, {"term": "선언하다", "mainDef": "누군가가 무언가를 선언하면, 자기 뜻이나 결정을 여러 사람 앞에서 공식적으로 밝힌다는 뜻이에요.", "hanja": "선(宣 베풀다) + 언(言 말씀)", "variants": ["선언했다"], "examples": [{"kor": "그는 기자회견에서 은퇴를 선언했어요.", "eng": "He announced his retirement at a press conference."}], "translations": {"en": {"term": "to declare", "mainDef": "If you declare something, you officially announce your decision in front of people."}}}, {"term": "추정되다", "mainDef": "무언가가 추정되면, 확실하지는 않지만 그럴 것이라고 짐작된다는 뜻이에요.", "hanja": "추(推 밀다) + 정(定 정하다)", "variants": ["추정되는"], "examples": [{"kor": "이 그림은 300년 전에 그려진 것으로 추정돼요.", "eng": "This painting is believed to have been made 300 years ago."}], "translations": {"en": {"term": "to be estimated / believed", "mainDef": "If something is believed to be so, people guess it is true without being sure."}}}, {"term": "퇴출시키다", "mainDef": "누군가가 무언가를 퇴출시키면, 있던 자리에서 내보내 더는 있지 못하게 한다는 뜻이에요.", "hanja": "퇴(退 물러나다) + 출(出 나가다)", "variants": ["퇴출시켰다"], "examples": [{"kor": "그 리그는 규칙을 어긴 팀을 퇴출시켰어요.", "eng": "The league kicked out the team that broke the rules."}], "translations": {"en": {"term": "to remove / kick out", "mainDef": "If you remove something, you force it out of its place so it can't stay."}}}, {"term": "성명", "mainDef": "성명은 단체나 사람이 어떤 일에 대한 생각을 공식적으로 밝힌 글이나 말이에요.", "hanja": "성(聲 소리) + 명(明 밝다)", "variants": ["성명"], "examples": [{"kor": "회사는 사고에 대해 사과하는 성명을 냈어요.", "eng": "The company issued a statement apologizing for the accident."}], "translations": {"en": {"term": "statement", "mainDef": "An official announcement of a group's or person's position on something."}}}, {"term": "-이자", "mainDef": "'A이자 B'는 A이면서 동시에 B라는 뜻이에요.", "variants": ["쓰레기이자"], "examples": [{"kor": "그는 가수이자 배우예요.", "eng": "He is a singer and also an actor."}], "translations": {"en": {"term": "both A and B / A as well as B", "mainDef": "\"A이자 B\" means something is A and B at the same time."}}}, {"term": "지목하다", "mainDef": "누군가가 무언가를 지목하면, 여럿 가운데 그것을 콕 집어서 가리킨다는 뜻이에요.", "hanja": "지(指 가리키다) + 목(目 눈)", "variants": ["지목하고"], "examples": [{"kor": "선생님이 저를 지목해서 발표를 시켰어요.", "eng": "The teacher picked me out and had me present."}], "translations": {"en": {"term": "to single out / point to", "mainDef": "If you single something out, you  a way, you search around for one."}}}, {"term": "페르소나", "mainDef": "페르소나는 사람이 다른 사람들 앞에서 보여 주는 겉모습이나 역할이에요.", "contextDef": "'AI 페르소나'는 실제 사람이 아니라 AI로 만든 가짜 가수라는 표시예요.", "variants": ["페르소나"], "examples": [{"kor": "무대 위의 페르소나와 실제 성격은 달라요.", "eng": "His stage persona and his real personality are different."}], "translations": {"en": {"term": "persona", "mainDef": "The image or role a person shows to others.", "contextDef": "\"AI Persona\" is a label showing the artist is not a real person but an AI-made one."}}}, {"term": "심금을 울리다", "mainDef": "무언가가 심금을 울리면, 사람의 마음을 깊이 움직인다는 뜻이에요.", "subDefs": [{"subTerm": "• 심금", "subDef": "심(心 마음) + 금(琴 거문고). 마음을 악기 줄에 빗댄 말로, 작은 일에도 떨리는 마음이에요."}], "variants": ["심금을 울렸으면"], "examples": [{"kor": "그 편지는 읽는 사람의 심금을 울렸어요.", "eng": "That letter touched the hearts of everyone who read it."}], "translations": {"en": {"term": "to touch someone's heart", "mainDef": "If something touches your heart, it moves you deeply.", "subDefs": [{"subTerm": "심금 (心琴)", "subDef": "심 (心, heart) + 금 (琴, a stringed instrument). The heart pictured as an instrument string that vibrates easily."}]}}}, {"term": "치이다", "mainDef": "누군가가 사람이나 일에 치이면, 그것 때문에 몹시 시달린다는 뜻이에요.", "variants": ["치이지않고"], "examples": [{"kor": "하루 종일 일에 치여서 너무 피곤해요.", "eng": "I've been swamped with work all day, so I'm exhausted."}], "translations": {"en": {"term": "to be worn down (by people or work)", "mainDef": "If you are worn down by people or work, they wear you out."}}}, {"term": "명곡", "mainDef": "명곡은 오랫동안 사랑받는 아주 좋은 노래나 음악이에요.", "hanja": "명(名 이름) + 곡(曲 가락)", "variants": ["명곡"], "examples": [{"kor": "이 노래는 시간이 지나도 명곡이에요.", "eng": "This song is a classic no matter how much time passes."}], "translations": {"en": {"term": "masterpiece / great song", "mainDef": "A very good song or piece of music that people love for a long time."}}}, {"term": "거부감", "mainDef": "거부감은 어떤 것을 받아들이고 싶지 않은 불편한 느낌이에요.", "hanja": "거(拒 막다) + 부(否 아니다) + 감(感 느끼다)", "variants": ["거부감"], "examples": [{"kor": "처음에는 날것  people's jobs."}], "translations": {"en": {"term": "to replace", "mainDef": "If something replaces another thing, it is used in its place."}}}];
        const ANSWER_CHOICES = ["협업하다", "모색하다", "구현하다", "문턱", "정교하다", "심금을 울리다", "거부감", "시인하다", "저작권", "이분법", "범람하다", "퇴출시키다", "대체하다", "지목하다"];
        const QUIZ_LIST = [{"id": 1, "textParts": ["작곡가 이용석과 최성혁은 2013년쯤 한 작곡가 사무실에서 만나 팀을 이룬 뒤, 10년 넘게 함께 ", " 왔어요."], "answer": "협업해", "hint": "여러 사람이 힘을 합해 함께 일하다.", "verbHint": "기본형 '협업하다'를 뒤의 '오다'와 이어 주는 '-아/어' 형태로 바꾸세요.", "altAnswers": ["협업하여"], "explanation": "맞아요! 두 작곡가가 팀 '글로리웨이브'로 10년 넘게 함께 곡을 만들어 왔다는 뜻이에요. '협업하여'도 정답이에요.", "textParts_eng": ["Composers Lee Yong-seok and Choi Sung-hyuk met at a composer's office around 2013, formed a team, and have ", " together for more than ten years."], "answer_eng": "collaborated"}, {"id": 2, "textParts": ["가수와 소속사가 원하는 방향에 맞춰 곡을 쓰던 두 사람은, 처음부터 끝까지 직접 방향을 정해 자유롭게 음악을 만들 길을 ", " 끝에 '머무르' 프로젝트를 시작했어요."], "answer": "모색한", "hint": "일이나 문제를 풀 방법을 이리저리 찾다.", "verbHint": "기본형 '모색하다'를 뒤의 '끝'을 꾸며 주는 과거 관형형(-ㄴ/은)으로 바꾸세요.", "explanation": "정답! 남이 원하는 대로가 아니라 자기들이 정한 방향으로 음악을 만들 방법을 오래 찾다가 '머무르'를 시작했다는 뜻이에요.", "textParts_eng": ["The two, who had been writing songs to fit what singers and agencies wanted, started the MEOMURU project after ", " a way to make music freely, deciding the direction themselves from start to finish."], "answer_eng": "searching for"}, {"id": 3, "textParts": ["예전에는 머릿속 아이디어를 실제 음악으로 ", " 위해 편곡, 연주자 섭외, 가이드 보컬 녹음 같은 여러 단계를 거쳐야 했어요."], "answer": "구현하기", "hint": "머릿속에 있던 생각을 실제로 보이거나 들리게 만들다.", "verbHint": "기본형 '구현하다'를 뒤의 '위해'와 이어지도록 명사형(-기)으로 바꾸세요.", "explanation": "딩동댕! AI가 없을 때는 아이디어를 들을 수 있는 소리로 만들기까지 시간과 돈이 많이 들었다는 뜻이에요.", "textParts_eng": ["In the past, to ", " an idea in your head as actual music, you had to go through many steps, such as arranging, hiring session players, and recording guide vocals."], "answer_eng": "bring to life"}, {"id": 4, "textParts": ["이제는 AI로 여러 장르와 편곡을 빠르고 싸게 시험해 볼 수 있어서, 곡을 완성된 모습에 가깝게 미리 들어 보는 ", "이/가 크게 낮아졌어요."], "answer": "문턱", "hint": "어떤 일을 시작하기 어렵게 만드는 조건.", "explanation": "훌륭해요! 예전에는 시간과 돈이 많이 들던 일을 이제 누구나 쉽게 해 볼 수 있게 되었다는 뜻이에요.", "textParts_eng": ["Now that various genres and arrangements can be tested quickly and cheaply with AI, the ", " to previewing a song close to its finished form has dropped sharply."], "answer_eng": "barrier"}, {"id": 5, "textParts": ["하지만 AI는 마음에 안 드는 부분만 골라 ", " 고치기가 어려워서, 두 사람은 결과물을 기존 제작 프로그램으로 옮겨 직접 손보기도 해요."], "answer": "정교하게", "hint": "아주 꼼꼼하고 자세하다.", "verbHint": "기본형 '정교하다'를 뒤의 동사 '고치다'를 꾸미는 부사형(-게)으로 바꾸세요.", "explanation": "잘하셨어요! 한 구간만 다시 만들면 마음에 들었던 부분까지 바뀔 수 있어서, 사람이 직접 꼼꼼하게 고치는 과정이 필요하다는 뜻이에요.", "textParts_eng": ["But because it's hard to fix only the parts you don't like ", " with AI, the two sometimes move the results into conventional production software and touch them up themselves."], "answer_eng": "precisely"}, {"id": 6, "textParts": ["어릴 때 꿈꾸던 어른의 모습과 지금의 모습 사이에서 고민하는 평범한 사회초년생과 직장인의 이야기를 담은 가사가 많은 청취자의 ", "."], "answer": "심금을 울렸어요", "hint": "사람의 마음을 깊이 움직이다.", "verbHint": "기본형 '심금을 울리다'를 문장을 끝맺는 과거형(-았/었어요)으로 바꾸세요.", "explanation": "퍼펙트! 특별한 누군가가 아니라 누구나 한 번쯤 해 봤을 고민을 담은 가사라서, 많은 사람이 자기 이야기처럼 들었어요.", "textParts_eng": ["The lyrics, which tell the story of ordinary young workers caught between the adults they dreamed of becoming as children and who they are now, ", " of many listeners."], "answer_eng": "touched the hearts"}, {"id": 7, "textParts": ["AI 음악인 줄 몰랐다며 실망한 청취자들에 대해, 글로리웨이브는 자신들도 처음 AI 기술을 접했을 때 큰 충격과 ", "을/를 느꼈기 때문에 그 마음을 이해한다고 했어요."], "answer": "거부감", "hint": "어떤 것을 받아들이고 싶지 않은 불편한 느낌.", "explanation": "그렇죠! AI를 만든 사람들도 처음에는 AI를 쉽게 받아들이지 못했기 때문에, 실망한 청취자들의 마음을 이해한다는 뜻이에요.", "textParts_eng": ["About listeners who were disappointed to learn it was AI music, GLORYWAVE said they understand, because they also felt great shock and ", " when they first came across AI technology."], "answer_eng": "aversion"}, {"id": 8, "textParts": ["두 사람은 오랫동안 쌓아 온 노력이 부정당하는 것 같아서 한동안 곡을 쓰지 못할 만큼 고민했다고 솔직하게 ", "."], "answer": "시인했어요", "hint": "어떤 사실이 맞다고 인정하다.", "verbHint": "기본형 '시인하다'를 문장을 끝맺는 과거형(-았/었어요)으로 바꾸세요.", "explanation": "정확해요! 말하기 쉽지 않은 자신들의 약한 모습을 숨기지 않고 사실이라고 인정했다는 뜻이에요.", "textParts_eng": ["The two candidly ", " that they agonized so much, feeling as if their years of effort were being denied, that they couldn't write songs for a while."], "answer_eng": "admitted"}, {"id": 9, "textParts": ["처음부터 AI 활용 사실을 밝힌 이 곡은 한국음악저작권협회에 등록되지 않아서, 만든 사람들은 작사·작곡에 대한 ", "료 대신 음원 유통 수익만 받고 있어요."], "answer": "저작권", "hint": "글, 음악, 그림 같은 작품을 만든 사람이 그 작품에 대해 갖는 권리.", "explanation": "맞아요! 현재 제도에서는 AI가 만든 부분에 저작권이 인정되지 않기 때문에, 이 곡을 만든 사람들은 저작권료를 받지 못한다는 뜻이에요.", "textParts_eng": ["Because this song, which disclosed its use of AI from the start, isn't registered with the Korea Music Copyright Association, its makers receive only distribution revenue instead of ", " royalties for the lyrics and music."], "answer_eng": "copyright"}, {"id": 10, "textParts": ["글로리웨이브는 AI를 썼는지 안 썼는지만 따지는 ", "(으)로 음악을 판단하기보다, 사람이 어느 부분에 창작적으로 기여했는지 나누어 인정할 기준이 필요하다고 말해요."], "answer": "이분법", "hint": "모든 것을 둘로만 나누어 생각하는 방법.", "explanation": "딩동댕! 'AI 음악이다/아니다' 둘로만 나누지 말고, 사람이 실제로 한 일을 하나하나 따져 봐야 한다는 뜻이에요.", "textParts_eng": ["GLORYWAVE says that rather than judging music by a ", " that only asks whether AI was used or not, we need standards that recognize which parts a person creatively contributed to."], "answer_eng": "dichotomy"}];
        const DISCUSS_DATA = [{"id": 1, "questionKor": "이 노래를 처음 들었을 때 어떤 느낌이 들었어요? 여러분이 감동받던 노래와 비슷했어요?", "questionEng": "How did you feel when you first heard this song? Was it similar to the songs that used to move you?", "vocab": [{"term": "감동받다", "termEng": "to be moved / touched", "def": "무언가를 보거나 듣고 마음이 크게 움직이는 거예요.", "defEng": "For your heart to be deeply stirred by something you see or hear."}, {"term": "-던", "termEng": "that used to (do)", "def": "예전에 자주 그랬던 일을 떠올리며 뒤의 말을 꾸밀 때 써요.", "defEng": "Used to describe a noun with something that often happened in the past."}]}, {"id": 2, "questionKor": "노래가 사람의 마음을 울렸다면, 그 노래를 사람이 만들었는지 AI가 만들었는지는 중요하지 않다는 생각에 동의해요?", "questionEng": "If a song touched people's hearts, do you agree that it doesn't matter whether a person or AI made it?", "vocab": [{"term": "마음을 울리다", "termEng": "to touch someone's heart", "def": "사람의 마음을 깊이 움직이는 거예요.", "defEng": "To move someone deeply."}, {"term": "-았/었는지 -았/었는지", "termEng": "whether ... or ...", "def": "두 가지 가운데 어느 쪽인지를 말할 때 써요.", "defEng": "Used to talk about which of two possibilities is true."}]}, {"id": 3, "questionKor": "AI가 부른 노래를 듣고 눈물을 흘리거나 위로를 받았다는 사람들도 있지만, 반대로 AI라는 사실을 알자마자 마음이 식고 몰입이 깨졌다는 사람들도 있어요. 노래 자체가 좋더라도 듣는 사람에 따라 이렇게 거부감이 들거나 소름이 돋는 이유는 무엇일까요?", "questionEng": "Some people say they cried or were comforted after hearing a song sung by AI, while others say their feelings cooled and they could no longer get into the song as soon as they learned it was AI. Even if the song itself is good, why do some listeners feel this kind of aversion or get chills?", "vocab": [{"term": "위로를 받다", "termEng": "to be comforted", "def": "힘들 때 무언가 덕분에 마음이 편해지는 거예요.", "defEng": "For your heart to feel better thanks to something when things are hard."}, {"term": "몰입이 깨지다", "termEng": "to lose one's immersion", "def": "깊이 빠져 있던 마음이 갑자기 끊기는 거예요.", "defEng": "For your deep focus on something to suddenly break."}, {"term": "거부감이 들다", "termEng": "to feel an aversion", "def": "어떤 것을 받아들이고 싶지 않은 불편한 느낌이 생기는 거예요.", "defEng": "To get an uncomfortable feeling of not wanting to accept something."}, {"term": "소름이 돋다", "termEng": "to get chills", "def": "무섭거나 놀라서 살갗이 오돌토돌해지는 거예요.", "defEng": "For your skin to prickle from fear or surprise."}]}, {"id": 4, "questionKor": "사람이 직접 가사를 쓰고 곡의 분위기까지 모두 기획했지만, 실제 목소리와 연주는 AI 프로그램으로 구현했다면 이 노래를 만든 '창작자'는 누구라고 봐야 할까요?", "questionEng": "If a person wrote the lyrics and planned everything down to the song's mood, but the actual voice and instruments were produced with an AI program, who should we consider the \"creator\" of this song?", "sub": ["과거의 사진기나 신시사이저처럼 오늘날의 생성형 AI도 '창작 도구'로 볼 수 있을까요? 아니면 인간의 역할을 대신하는, 전혀 다른 차원의 기술로 봐야 할까요?"], "subEng": ["Like the cameras and synthesizers of the past, can today's generative AI be seen as a \"creative tool\"? Or should it be seen as a technology on an entirely different level, one that replaces the human role?"], "vocab": [{"term": "구현하다", "termEng": "to bring to life / realize", "def": "머릿속에 있던 생각을 실제로 보이거나 들리게 만드는 거예요.", "defEng": "To turn an idea in your head into something you can actually see or hear."}, {"term": "창작자", "termEng": "creator", "def": "새로운 작품을 만드는 사람이에요.", "defEng": "A person who makes new works."}, {"term": "창작 도구", "termEng": "creative tool", "def": "작품을 만들 때 쓰는 수단이에요.", "defEng": "Something you use as a means to make a work."}, {"term": "차원", "termEng": "level / dimension", "def": "어떤 것을 생각하거나 볼 때의 수준이나 범위예요.", "defEng": "The level or scope at which you think about or see something."}]}, {"id": 5, "questionKor": "스포티파이는 AI로 대량생산된 저질 음악 때문에 추천 알고리즘이 오염되고 청취자와 음악가들이 피해를 입는다는 이유로, AI가 만든 것으로 추정되는 음원 5천만 곡 이상을 추천 목록에서 퇴출시켰어요. 이러한 조치에 찬성해요?", "questionEng": "Spotify removed more than 50 million tracks it believed were made by AI from its recommendation lists, on the grounds that mass-produced, low-quality AI music pollutes its recommendation algorithm and harms listeners and musicians. Do you support this measure?", "sub": ["AI로 인해 창작의 문턱이 낮아지면 질 낮은 'AI 슬롭'이 범람할 거라 const str = (v) => (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
const arr = (v) => (Array.isArray(v) ? v : []);
// 허용 강조(**단어**)만 <b>로, 나머지 마크다운 기호는 제거
const richText = (s) => esc(str(s).replace(/`/g, '').replace(/^#+\s*/gm, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*/g, '');
const numMark = (n) => (n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`);

/* =====================================================================
   5. 응답 정리 (어느 모델이든 같은 모양으로)
   ===================================================================== */
function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

const aiState = { provider: 'gemini', apiKey: '', model: AI_PROVIDERS.gemini.models[0], other: false, customModel: '', settingsOpen: false };

const AI_STORE_KEY = 'okll:discuss:v1:' + location.pathname;
function aiLoadStore() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(AI_STORE_KEY) || 'null'); } catch (e) { data = null; }
  DISCUSS_DATA.forEach(d => {
    const st = discussState[d.id] || (discussState[d.id] = newDiscussSt());
    const s = data && data[d.id]; if (!s || typeof s !== 'object') return;
    st.text = typeof s.text === 'string' ? s.text : '';
    if (s.feedback) {
      try { st.feedback = normalizeFeedback(s.feedback, s.feedback.mode, s.feedbackFor); st.feedbackFor = typeof s.feedbackFor === 'string' ? s.feedbackFor : ''; }
      catch (e) { st.feedback = null; st.feedbackFor = ''; }
    }
  });
}
let aiSaveTimer = null;
function aiSaveStore() {
  clearTimeout(aiSaveTimer);
  aiSaveTimer = setTimeout(() => {
    const data = {};
    Object.keys(discussState).forEach(id => {
      const st = discussState[id];
      if (st.text || st.feedback) data[id] = { text: st.text, feedback: st.feedback, feedbackFor: st.feedbackFor, savedAt: Date.now() };
    });
    try { if (Object.keys(data).length) localStorage.setItem(AI_STORE_KEY, JSON.stringify(data)); else localStorage.removeItem(AI_STORE_KEY); }
    catch (e) { /* 저장 불가(시크릿 모드 등): 메모리로만 동작 */ }
  }, 300);
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const model = curModel(); if (!model) throw AppError('model');
  const q = P.request(model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}
// 본문: 읽기 자료(READING_DATA)와 영상 대본(VIDEOS[].script) 중 있는 것을 모두 씀
const articleText = () => [
  typeof READING_DATA !== 'undefined' ? READING_DATA.map(r => (r.content || []).map(p => p.text || '').filter(Boolean).join('\n')).join('\n\n') : '',
  typeof VIDEOS !== 'undefined' ? VIDEOS.map(v => (v.script || []).map(l => l.kor || '').filter(Boolean).join('\n')).join('\n\n') : ''
].filter(Boolean).join('\n\n');

// ---------- 생각해 보기: AI 첨삭 ----------
async function runDiscussFeedback(id) {
  const st = discussState[id]; const d = DISCUSS_DATA.find(x => x.id === id);
  if (!st || !d || st.loading || !st.text.trim()) return;
  if (!aiState.apiKey) { st.keyPanel = true; rerenderDiscussItem(id); return; }
  st.keyPanel = false; st.loading = true; st.error = null; rerenderDiscussItem(id);
  const level = app.userLevel, text = st.text;
  const question = [d.questionKor].concat((d.sub || []).map((q, i) => `${d.id}-${i + 1}. ${q}`)).join('\n');
  const questionEn = modeOf(level) === 'C' ? '' : [d.questionEng].concat(d.subEn || []).filter(Boolean).join('\n');
  const vocab = (d.vocab || []).map(v => ({ term: v.term, def: v.def || v.defEng || '' }));
  try {
    st.feedback = await callAIJSON(buildSystemPrompt(level), buildUserMessage({ level, article: articleText(), vocab, question, questionEn, learnerText: text }), (o) => normalizeFeedback(o, modeOf(level), text, articleText() + '\n' + vocab.map(v => v.term).join('\n')));
    st.feedbackFor = text; aiSaveStore();
  } catch (e) { st.error = e.code ? e : AppError('format'); }
  finally { st.loading = false; rerenderDiscussItem(id); }
}

function markedTextHTML(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {

        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';

            + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }
        function fcApplyFlip(){ const root=viewRoot(); if(!root)return; const el=qs('#fc-inner',root); if(el)el.classList.toggle('flip',fc.flipped); const tr=qs('#fc-trans',root); if(tr)tr.textContent=fc.showTrans?fcCur().en:''; const tb=qs('#fc-back [data-action="fc-trans"]',root); if(tb)tb.classList.toggle('on',fc.showTrans); }
        function fcRefreshStats(){ const root=viewRoot(); if(!root)return; const k=qs('#fc-sk',root),u=qs('#fc-su',root); if(k)k.textContent=fcCount('known'); if(u)u.textContent=fcCount('unknown'); }

        function fcSetOrder(sh){ if(sh===fc.shuffled)return; fc.shuffled=sh; const m=fc.queue.slice(); fc.queue=sh?shuffleArr(m):m.slice().sort(function(a,b){return a-b;}); fcStop(); fc.pos=0; fc.flipped=false; fc.showTrans=false; fcRefreshDeck(); }

            const header = `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-16 flex flex-col items-center text-center"><h2 class="text-[32px] md:text-[36px] font-bold text-[#1a1a1a] leading-tight font-serif mb-3 tracking-tight">어휘·표현</h2><p class="text-[16px] text-[#444444] font-serif leading-relaxed mt-2 max-w-2xl">학습 자료에 나온 어휘와 표현을 쉬운 한국어로 학습해 보세요.</p><div class="w-[1px] h-6 bg-gray-200 mt-8"></div></div>`;

="text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Reading</span></div><div id="vocab-grid">${vocabGridHTML()}</div></div></div>`;

        // ---------- 10. QUIZ ----------
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function shuffleChoices() { const a = quizState.shuffled.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } quizState.shuffled = a; }
        function quizSentenceHTML(quiz) {

ans text-gray-400 hover:text-gray-600 underline">동사변형 힌트</button>` : ''}${quiz.particleHint ? `<button type="button" data-q="hint-particle" class="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">조사 힌트</button>` : ''}</div>` : ''}${st.hintVerb && quiz.verbHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.verbHint)}</p>` : ''}${st.hintParticle && quiz.particleHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.particleHint)}</p>` : ''}</div>` : ''}${quiz.explanation && st.result === 'correct' ? `<p class="mt-4 text-sm font-sans text-green-700 font-medium">✓ Correct. ${esc(quiz.explanation)}</p>` : ''}${quiz.explanation && st.result === 'incorrect' ? '<p class="mt-4 text-sm font-sans text-red-600 font-medium">✕ Try again.</p>' : ''}</div>`;
        }
        function quizChoicesHTML() { return quizState.shuffled.map(c => `<span class="text-xs font-serif text-gray-600 bg-white border border-gray-200 px-2 py-1 select-all">${esc(c)}</span>`).join(''); }
        function quizHTML() {
            return `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 flex flex-col md:flex-row gap-12 animate-fade-in"><div class="w-full md:w-64 shrink-0"><div class="sticky top-24"><div class="md:sticky md:top-24"><h2 class="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2">내용 확인 퀴즈</h2><p class="text-sm font-sans text-gray-500 mb-6">학습 자료에 대한 이해도를 확인해 보세요.</p><div class="border-t border-gray-200 pt-4 mb-8"><span class="text-xs font-bold font-sans text-black uppercase block mb-2">정답률</span><span class="text-4xl font-serif font-bold text-gray-900" id="quiz-score">${quizScore()}%</span></div><div class="bg-gray-50 p-4 border border-gray-100"><h4 class="text-xs font-bold font-sans text-gray-500 uppercase mb-3 border-b border-gray-200 pb-2">정답 목록</h4><div class="flex flex-wrap gap-2" id="quiz-choices">${quizChoicesHTML()}</div></div></div></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizSentenceHTML).join('')}</div></div>`;

        // ---------- 11. DISCUSS ----------
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = newDiscussSt());
            const vocab = item.vocab.map(v => `<div><p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>${st.showTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-1 animate-fade-in"><span class="font-bold mr-2">${esc(v.termEng)}</span>${esc(v.defEng)}</p>` : ''}</div>`).join('');

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;

        })();
        function pwHeaderHTML() {

            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';

        function pwQuizHTML() {
            const pairs = [];
