#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}

#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-read-fig{margin:8px 0 12px;text-align:center;break-inside:avoid}.pw-read-fig img{max-width:70%;height:auto;border:1px solid #e5e7eb;border-radius:6px}.pw-read-fig div{font-size:9pt;color:#6b7280;margin-top:4px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

        /* ===== AI 첨삭 설정 — 모드는 자료 레벨(app.userLevel)로 정함 =====

            ORANGE_TAGS: { A: ['더 좋은 표현'], B: ['더 좋은 표현', '일관성'], C: ['더 좋은 표현', '정확한 어휘', '고급 표현', '문어체', '번역투', '일관성', '논리 연결', '대체 표현', '다른 글쓰기 스타일', '의도에 따라 달라요'] },

                '맞춤법': 'Spelling', '오타': 'Typo', '띄어쓰기': 'Spacing', '조사': 'Wrong 이/가 · 을/를 · 에 …', '활용': 'Word form',
                '문법': 'Grammar', '주어·서술어 호응': "Parts don't match", '단어 조합': "Words that don't go together", '문맥상 어색한 표현': "Doesn't fit here",

        const HOME_TAGS = ["음식", "문화"];
        const HOME_SERIES_BADGE = "";
        const READING_DATA = [{"id": 1, "title": "9월 6일 수요일 · 이상한 뉴스", "titleEng": "Wednesday, September 6 · A Strange Headline", "subtitle": "상빈 일기 1/5", "source": "#", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-frozen-gimbap-diary.webp", "cardTitle": "9월 6일 수요일 · 이상한 뉴스", "cardDesc": "미국에서 김밥이 유행이라고요?", "cardDescEng": "Gimbap is trending in America?", "audio": true, "audioLabel": "일기 낭독", "audioSrc": "https://openkoreanlearninglab.github.io/hub/assets/audio/frozen-gimbap-diary/a2plus-01-0906.m4a", "content": [{"text": "오늘 아침 이상한 뉴스 헤드라인을 봤어요. 그 뉴스에 따르면, 미국에서 김밥이 유행이라고 해요. 김밥은 특별한 음식이 아니에요. 김밥은 바쁠 때 간단히 먹는 음식이에요. 그래서 이해할 수 없었어요.", "trans": "This morning I saw a strange news headline. According to the article, gimbap is trending in America. Gimbap isn't anything special. It's what you grab when you're busy. So I couldn't make sense of it.", "sp": [[0, 4.6, 8.26], [24, 8.06, 13.41], [54, 13.5, 16.93], [72, 16.76, 20.81], [95, 20.78, 23.24]]}, {"text": "물론, 예전보다 K-pop이나 드라마 같은 한국 문화의 인기가 많아졌어요. 그래도 김밥보다 더 맛있고 더 보기 좋은 한국 음식이 많아요. 어쨌든 궁금해서 그 뉴스에 대해 좀 더 읽고 싶었어요.", "trans": "Of course, Korean culture like K-pop and dramas has become much more popular than before. Even so, there are lots of Korean dishes that taste better and look nicer than gimbap. Anyway, I was curious, so I wanted to read a bit more of the article.", "sp": [[0, 23.14, 29.33], [42, 29.16, 34.74], [77, 34.6, 39.13]]}, {"text": "그런데 뉴스를 읽다가 진짜 이상한 내용을 발견했어요. 바로 \"냉동 김밥\"이에요.", "trans": "But while I was reading, I found something really strange: \"frozen gimbap.\"", "sp": [[0, 39.22, 44.37], [30, 44.17, 46.97]]}, {"text": "지금까지 냉동 만두, 냉동 피자, 냉동 볶음밥 등을 먹어 본 적이 있어요. 하지만 냉동 김밥은 먹어 본 적이 없어요. 한국에서는 집 앞 편의점에 가면, 24시간 내내 신선한 김밥을 먹을 수 있어요. 물론 별로 맛있지는 않아요. 좀 더 맛있는 김밥을 먹고 싶으면 가까운 아무 식당에 가면 돼요. 도대체 미국에서는 왜 냉동 김밥이 유행일까요?", "trans": "I've eaten frozen dumplings, frozen pizza, frozen fried rice and so on. But I've never had frozen gimbap. In Korea, you can get fresh gimbap 24 hours a day at the convenience store right by your home. It's not that tasty, of course. If you want better gimbap, you just go to any restaurant nearby. So why on earth is frozen gimbap a trend in America?", "sp": [[0, 46.86, 53.6], [42, 53.55, 57.47], [66, 57.42, 64.06], [111, 63.98, 66.6], [127, 66.53, 71.89], [164, 71.92, 76.27]]}], "spCount": 16}, {"id": 2, "title": "9월 7일 목요일 · 호기심은 고양이를 죽인다", "titleEng": "Thursday, September 7 · Curiosity Kills the Cat", "subtitle": "상빈 일기 2/5", "source": "#", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-frozen-gimbap-diary.webp", "cardTitle": "9월 7일 목요일 · 호기심은 고양이를 죽인다", "cardDesc": "궁금해서 냉동 김밥을 주문했어요.", "cardDescEng": "Out of curiosity, I ordered frozen gimbap.", "audio": true, "audioLabel": "일기 낭독", "audioSrc": "https://openkoreanlearninglab.github.io/hub/assets/audio/frozen-gimbap-diary/a2plus-02-0907.m4a", "content": [{"text": "뭔가 이상한 것을 발견했을 때 사람들의 반응은 크게 두 가지예요.", "trans": "When people find something strange, they react in one of two ways.", "sp": [[0, 5.52, 12.23]]}, {"isBullet": true, "text": "첫 번째, 무서워서 피한다.", "trans": "One: get scared and stay away.", "sp": [[0, 12.33, 15.79]]}, {"isBullet": true, "text": "두 번째, 궁금해서 가까이 간다.", "trans": "Two: get curious and go closer.", "sp": [[0, 15.8, 19.9]]}, {"text": "공포 영화를 보면, 보통 두 번째 유형의 사람은 빨리 죽어요. \"호기심은 고양이를 죽인다\"라는 말도 있어요. 저는 고양이 같은 사람이에요.", "trans": "In horror movies, the second type of person usually dies first. There's even a saying: \"Curiosity kills the cat.\" And I'm a cat kind of person.", "sp": [[0, 19.97, 25.56], [35, 25.49, 29.79], [61, 29.78, 32.88]]}, {"text": "그래서 인터넷으로 그 냉동 김밥을 주문했어요. 3개에 12,000원이에요. 사실 하나만 사려고 했는데, 3개 사면 10% 할인을 해서 3개 샀어요. 그러니까 원래 가격은 1개에 5,000원이에요.", "trans": "So I ordered that frozen gimbap online. It was 12,000 won for three. Actually, I was only going to buy one, but buying three got a 10% discount, so I bought three. That means the original price is 5,000 won each.", "sp": [[0, 33.02, 37.02], [26, 36.82, 40.04], [42, 39.94, 46.51], [83, 46.59, 50.76]]}, {"text": "제 생각에는 비싸요. 보통 한국에서 김밥은 2,500~3,000원이에요. 그래도 맛있으면 괜찮아요. 그런데 과연 맛있을까요?", "trans": "I think that's expensive. In Korea, gimbap is usually 2,500 to 3,000 won. Still, if it's tasty, that's fine. But will it really be tasty?", "sp": [[0, 50.74, 53.36], [12, 53.41, 58.25], [41, 58.4, 61.06], [56, 61.22, 64.15]]}], "spCount": 14}, {"id": 3, "title": "9월 8일 금요일 · 전자레인지", "titleEng": "Friday, September 8 · The Microwave", "subtitle": "상빈 일기 3/5", "source": "#", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-frozen-gimbap-diary.webp", "cardTitle": "9월 8일 금요일 · 전자레인지", "cardDesc": "전자레인지로 데워 먹어 봤어요.", "cardDescEng": "I tried heating it in the microwave.", "audio": true, "audioLabel": "일기 낭독", "audioSrc": "https://openkoreanlearninglab.github.io/hub/assets/audio/frozen-gimbap-diary/a2plus-03-0908.m4a", "content": [{"text": "한국에서 택배는 빨라요. 어제 아침에 냉동 김밥을 주문했는데, 어제 밤에 받았어요. 그래서 저는 거의 아침을 먹지 않지만, 오늘은 아침을 먹을 거예요. 당연히 메뉴는 냉동 김밥이에요.", "trans": "Deliveries are fast in Korea. I ordered the frozen gimbap yesterday morning, and it arrived last night. So even though I hardly ever eat breakfast, today I'm going to. The menu, of course, is frozen gimbap.", "sp": [[0, 4.85, 7.43], [14, 7.43, 12.93], [47, 13.2, 18.97], [85, 19.01, 22.0]]}, {"text": "포장지에 이렇게 쓰여 있어요.", "trans": "Here's what the package says.", "sp": [[0, 22.23, 24.8]]}, {"isBullet": true, "text": "조리방법 [전자레인지] 냉동상태의 김밥을 절취선까지 개봉 후 하단의 설명과 같이 데워주세요.", "trans": "Cooking instructions [microwave]: Open the frozen gimbap up to the dotted line, then heat it as described below.", "sp": [[0, 25.14, 35.3]]}, {"isBullet": true, "text": "700W 약 3분 · 1000W 약 2분 10초", "trans": "700W: about 3 minutes · 1000W: about 2 minutes 10 seconds", "sp": [[0, 35.55, 41.03]]}, {"text": "새로운 음식을 먹을 때, 꼭 시키는 대로 해야 해요. 그렇지 않으면 망해요. 그래서 저는 냉동 김밥 한 팩을 전자레인지에 넣고 2분 10초 동안 데웠어요.", "trans": "When you try a new food, you have to do exactly what it tells you. Otherwise, it's ruined. So I put one pack of frozen gimbap in the microwave and heated it for 2 minutes 10 seconds.", "sp": [[0, 41.46, 45.62], [30, 45.5, 47.62], [43, 47.77, 54.38]]}, {"text": "삐빅! 삐빅! 삐빅! 2분 10초가 지났어요. 이제 먹으면 돼요. 젓가락으로 한 조각 집어서 먹었어요.", "trans": "Beep! Beep! Beep! Two minutes and ten seconds were up. Time to eat. I picked up a piece with my chopsticks and ate it.", "sp": [[0, 54.56, 55.35], [4, 55.25, 55.91], [8, 55.84, 56.96], [12, 56.79, 59.01], [26, 59.03, 60.84], [37, 60.97, 64.19]]}, {"text": "옛날 속담을 믿어야 해요. 호기심은 고양이를 죽여요. 냉동 김밥을 먹은 고양이는 죽었어요. 냉동 김밥 맛없어요. 그런데 아직 두 팩 남았어요. 그러니까 두 번 더 죽어야 해요.", "trans": "You should trust old sayings. Curiosity kills the cat. The cat who ate the frozen gimbap died. Frozen gimbap tastes bad. But there are still two packs left. Which means I have to die two more times.", "sp": [[0, 64.38, 66.77], [15, 66.81, 69.51], [30, 69.68, 74.17], [51, 74.42, 77.03], [63, 77.16, 79.71], [80, 79.64, 84.48]]}], "spCount": 22}, {"id": 4, "title": "9월 9일 토요일 · 오븐", "titleEng": "Saturday, September 9 · The Oven", "subtitle": "상빈 일기 4/5", "source": "#", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-frozen-gimbap-diary.webp", "cardTitle": "9월 9일 토요일 · 오븐", "cardDesc": "이번에는 오븐으로 데워 봤어요.", "cardDescEng": "This time I heated it in the oven.", "audio": true, "audioLabel": "일기 낭독", "audioSrc": "https://openkoreanlearninglab.github.io/hub/assets/audio/frozen-gimbap-diary/a2plus-04-0909.m4a", "content": [{"text": "왜 맛이 없었을까요? 맛에 대해서 이야기를 하려면 기준을 만들어야 해요. 핵심은 수분이에요. 수분이 너무 적으면 밥이 건조해져서 딱딱해요. 반대로 수분이 너무 많으면 김이 눅눅해져요. 둘 다 맛있는 김밥은 아니에요.", "trans": "Why was it so bad? To talk about taste, we need a standard. The key is moisture. With too little moisture, the rice dries out and gets hard. On the other hand, with too much moisture, the seaweed gets soggy. Neither one makes good gimbap.", "sp": [[0, 3.01, 6.13], [12, 6.34, 11.15], [41, 11.12, 13.54], [52, 13.34, 18.64], [78, 18.79, 23.46], [103, 23.3, 26.33]]}, {"text": "이제 분석을 해 봐요. 냉동 김밥의 경우, 전자레인지로 데웠을 때, 고기와 야채에서 수분이 나와서 김이 눅눅해졌어요. 그럼 수분을 없애기 위해서 어떻게 해야 할까요?", "trans": "Now let's analyze it. With the frozen gimbap, when I heated it in the microwave, moisture came out of the meat and vegetables, and the seaweed went soggy. So what should I do to get rid of the moisture?", "sp": [[0, 26.22, 29.26], [13, 29.29, 38.08], [66, 38.16, 41.93]]}, {"text": "저는 오븐을 이용하기로 했어요. 오븐은 음식을 데우면서 수분을 없애 줘요. 그래서 전자레인지와 다르게 겉바속촉한 김밥을 먹을 수 있을 거라고 생각했어요. 200도에서 10분 동안 냉동 김밥을 데웠어요.", "trans": "I decided to use the oven. An oven heats food while drying it out. So I thought that, unlike with the microwave, I'd get gimbap that was crispy outside and soft inside. I heated the frozen gimbap at 200 degrees for 10 minutes.", "sp": [[0, 41.8, 44.84], [18, 44.64, 49.05], [42, 48.85, 55.91], [86, 55.71, 60.96]]}, {"text": "삐빅! 10분이 지났어요. 오븐에서 김밥이 있는 접시를 꺼냈어요. 겉으로 볼 때 괜찮았어요. 젓가락으로 한 조각 집어서 먹었어요.", "trans": "Beep! Ten minutes were up. I took the plate of gimbap out of the oven. From the outside it looked fine. I picked up a piece with my chopsticks and ate it.", "sp": [[0, 61.02, 62.39], [4, 62.28, 63.97], [15, 63.77, 68.33], [37, 68.19, 70.91], [52, 70.71, 75.06]]}, {"text": "호기심은 고양이를 죽여요. 고양이 또 죽었어요. 이번에는 너무 딱딱했어요. 너무 오래 데웠나 봐요. 남은 냉동 김밥 한 팩은 어떻게 먹어야 할까요?", "trans": "Curiosity kills the cat. The cat died again. This time it was way too hard. I guess I heated it too long. So how should I eat the last pack of frozen gimbap?", "sp": [[0, 74.86, 77.84], [15, 77.88, 81.4], [27, 81.9, 84.84], [42, 84.64, 86.9], [56, 87.15, 91.48]]}], "spCount": 23}, {"id": 5, "title": "9월 10일 일요일 · 튀김", "titleEng": "Sunday, September 10 · Deep-Frying", "subtitle": "상빈 일기 5/5", "source": "#", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-frozen-gimbap-diary.webp", "cardTitle": "9월 10일 일요일 · 튀김", "cardDesc": "마지막 한 팩은 튀겨 먹었어요.", "cardDescEng": "I deep-fried the last pack.", "audio": true, "audioLabel": "일기 낭독", "audioSrc": "https://openkoreanlearninglab.github.io/hub/assets/audio/frozen-gimbap-diary/a2plus-05-0910.m4a", "content": [{"text": "\"신발도 튀기면 맛있다.\" 어떤 셰프가 말했어요. 그래서 오늘은 김밥을 튀기기로 했어요.", "trans": "\"Even a shoe tastes good if you deep-fry it,\" a chef once said. So today I decided to fry the gimbap.", "sp": [[0, 3.54, 6.58], [15, 6.5, 8.85], [28, 8.76, 13.09]]}, {"text": "먼저, 프라이팬에 김밥 한 조각이 잠길 만큼 기름을 넣어 주세요.", "trans": "First, pour enough oil into a frying pan to cover a piece of gimbap.", "sp": [[0, 13.23, 19.99]]}, {"text": "그다음에 튀김가루와 물을 섞어서 튀김옷을 만들어야 해요. 그렇지 않으면, 냉동 김밥이 팝콘처럼 폭발할 수도 있어요. (튀김가루와 물의 비율은 1:1이에요.)", "trans": "Next, mix frying mix with water to make a batter. Otherwise, the frozen gimbap might pop like popcorn. (Use frying mix and water at a 1:1 ratio.)", "sp": [[0, 19.91, 26.5], [32, 26.45, 32.45], [65, 32.52, 36.87]]}, {"text": "튀김옷을 다 만들었으면, 김밥에 튀김옷을 묻혀서 프라이팬에 넣어 주세요.", "trans": "Once the batter is ready, coat the gimbap in it and put it in the pan.", "sp": [[0, 36.93, 43.55]]}, {"text": "색깔이 노란색으로 바뀌면, 김밥을 프라이팬에서 꺼내서 접시에 담아 주세요.", "trans": "When it turns golden yellow, take the gimbap out of the pan and put it on a plate.", "sp": [[0, 43.55, 50.79]]}, {"text": "보통 한국 사람들은 튀김을 간장에 찍어 먹어요. 하지만 저는 마요네즈에 찍어 먹어요. 파프리카 가루도 조금 넣어요.", "trans": "Koreans usually dip fried food in soy sauce. But I dip mine in mayonnaise. I add a little paprika powder, too.", "sp": [[0, 50.88, 55.56], [27, 55.65, 58.84], [48, 58.74, 61.57]]}, {"text": "\"호기심은 고양이를 죽여요.\" 이번에도 죽었을까요? 다행히 살았어요. 이번에는 성공했어요. 셰프를 믿어야 해요. 튀기면 맛있어요. 어떤 음식이 맛없으면 튀기세요.", "trans": "\"Curiosity kills the cat.\" Did it die this time too? Luckily, it survived. This time it worked. Trust the chef. Fried things taste good. If a food tastes bad, fry it.", "sp": [[0, 61.53, 64.81], [17, 64.88, 67.25], [29, 67.28, 69.19], [39, 69.06, 71.17], [51, 70.97, 73.57], [63, 73.37, 75.8], [73, 75.76, 79.1]]}], "spCount": 19}];
        const VOCAB_READING_DATA = [{"term": "이상한 뉴스 헤드라인", "mainDef": "\"A strange news headline.\"", "variants": ["이상한 뉴스 헤드라인"], "subDefs": [{"subTerm": "이상하다", "subDef": "to be strange, weird."}, {"subTerm": "-ㄴ/은 as in 이상한", "subDef": "lets a describing word describe the noun after it: 이상한 뉴스 = strange news."}, {"subTerm": "헤드라인", "subDef": "a headline, from English."}], "examples": [{"kor": "어젯밤에 이상한 꿈을 꿨어요.", "eng": "I had a strange dream last night."}], "rid": 1}, {"term": "그 뉴스에 따르면", "mainDef": "\"According to that news report.\"", "variants": ["그 뉴스에 따르면"], "subDefs": [{"subTerm": "-에 따르면", "subDef": "\"according to ~\". It names where the information came from, and the sentence usually ends with -다고 해요 or -대요."}], "examples": [{"kor": "일기 예보에 따르면 내일 비가 온다고 해요.", "eng": "According to the weather forecast, it's going to rain tomorrow."}], "rid": 1}, {"term": "김밥", "mainDef": "Gimbap ⸺ rice and fillings rolled up in dried seaweed (김) and cut into slices. In Korea it's cheap, everyday food you eat on the go.", "variants": ["김밥"], "subDefs": [], "examples": [{"kor": "소풍 갈 때 김밥을 싸 가요.", "eng": "We pack gimbap when we go on a picnic."}], "rid": 1}, {"term": "유행이라고 해요", "mainDef": "\"They say it's a trend.\"", "variants": ["유행이라고 해요"], "subDefs": [{"subTerm": "-라고/이라고 하다", "subDef": "passes on something you heard or read: \"they say it's ~\". After a noun ending in a consonant use -이라고, after a vowel -라고."}], "examples": [{"kor": "요즘 이 노래가 인기라고 해요.", "eng": "They say this song is popular these days."}], "rid": 1}, {"term": "유행", "mainDef": "A trend, a fad ⸺ something lots of people do, eat or buy for a while. As a verb: 유행하다 (to be in fashion, to catch on).", "variants": ["유행"], "subDefs": [], "examples": [{"kor": "요즘 짧은 머리가 유행이에요.", "eng": "Short hair is in fashion these days."}], "rid": 1}, {"term": "특별한 음식", "mainDef": "\"Special food.\"", "variants": ["특별한 음식"], "subDefs": [{"subTerm": "특별하다", "subDef": "to be special, out of the ordinary."}], "examples": [{ "About the news.\"", "variants": ["뉴스에 대해"], "subDefs": [{"subTerm": "-에 대해(서)", "subDef": "\"about ~, on ~\". The topic you read, talk or think about."}], "examples": [{"kor": "한국 역사에 대해 공부해요.", "eng": "I study Korean history."}], "rid": 1}, {"term": "좀 더 읽고 싶었어요", "mainDef": "\"I wanted to read a bit more.\"", "variants": ["좀 더 읽고 싶었어요"], "subDefs": [{"subTerm": "좀 더", "subDef": "a little more."}, {"subTerm": "-고 싶다 as in 읽고 싶었어요", "subDef": "\"to want to ~\". Here it is in the past: 싶었어요."}], "examples": [{"kor": "좀 더 자고 싶었어요.", "eng": "I wanted to sleep a little longer."}], "rid": 1}, {"term": "읽다가", "mainDef": "\"While reading, (I suddenly…)\"", "variants": ["읽다가"], "subDefs": [{"subTerm": "-다가", "subDef": "you are in the middle of one action when something else happens, or you switch to something else."}], "examples": [{"kor": "TV를 보다가 잠이 들었어요.", "eng": "I fell asleep while watching TV."}], "rid": 1}, {"term": "이상한 내용", "mainDef": "\"Something strange (in it).\"", "variants": ["이상한 내용"], "subDefs": [{"subTerm": "내용", "subDef": "content ⸺ what a book, article or message says."}], "examples": [{"kor": "편지의 내용이 궁금해요.", "eng": "I'm curious about what the letter says."}], "rid": 1}, {"term": "발견하다", "mainDef": "To discover, to come across something you didn't expect.", "variants": ["발견했어요"], "subDefs": [], "examples": [{"kor": "가방에서 옛날 사진을 발견했어요.", "eng": "I found an old photo in my bag."}], "rid": 1}, {"term": "냉동 김밥", "mainDef": "\"Frozen gimbap.\"", "variants": ["냉동 김밥"], "subDefs": [{"subTerm": "냉동", "subDef": "frozen ⸺ food kept in the freezer. Its opposite is 냉장 (chilled)."}], "examples": [{"kor": "마트에서 냉동 김밥을 팔아요.", "eng": "The supermarket sells frozen gimbap."}], "rid": 1}, {"term": "냉동 만두, 냉동 피자, 냉동 볶음밥 등", "mainDef": "\"Frozen dumplings, frozen pizza, frozen fried rice, and so on.\"", "variants": ["냉동 만두, 냉동 피자, 냉동 볶음밥 등"], "subDefs": [{"subTerm": "만두", "subDef": "dumplings."}, {"subTerm": "볶음밥", "subDef": "fried rice ⸺ 볶다 (to stir-fry) + 밥 (rice)."}, {"subTerm": "등", "subDef": "\"and so on, etc.\" It comes at the end of a list."}], "examples": [{"kor": "사과, 배, 포도 등을 샀어요.", "eng": "I bought apples, pears, grapes and so on."}], "rid": 1}, {"term": "먹어 본 적이 있어요", "mainDef": "\"I have eaten (it) before.\"", "variants": ["먹어 본 적이 있어요"], "subDefs": [{"subTerm": "-아/어 보다 as in 먹어 보다", "subDef": "\"to try ~\": to do something to see what it's like."}, {"subTerm": "-ㄴ/은 적이 있다", "subDef": "\"have done ~ before\": it talks about experience."}], "examples": [{"kor": "저는 한국에 가 본 적이 있어요.", "eng": "I've been to Korea before."}], "rid": 1}, {"term": "먹어 본 적이 없어요", "mainDef": "\"I have never eaten (it).\"", "variants": ["먹어 본 적이 없어요"], "subDefs": [{"subTerm": "-ㄴ/은 적이 없다", "subDef": "\"have never ~\". The opposite of -ㄴ/은 적이 있다."}], "examples": [{"kor": "저는 비행기를 타 본 적이 없어요.", "eng": "I've never been on a plane."}], "rid": 1}, {"term": "집 앞 편의점", "mainDef": "\"The convenience store right by my place.\"", "variants": ["집 앞 편의점"], "subDefs": [{"subTerm": "집 앞", "subDef": "in front of one's home ⸺ in Korean it simply means \"really close to home\"."}, {"subTerm": "편의점", "subDef": "a convenience store, open late or 24 hours."}], "examples": [{"kor": "집 앞 편의점에서 우유를 샀어요.", "eng": "I bought milk at the convenience store near my place."}], "rid": 1}, {"term": "24시간 내내", "mainDef": "\"All 24 hours, around the clock.\"", "variants": ["24시간 내내"], "subDefs": [{"subTerm": "내내", "subDef": "\"the whole time, all through\". It comes after a length of time: 하루 내내, 여름 내내."}], "examples": [{"kor": "주말 내내 집에 있었어요.", "eng": "I stayed home all weekend."}], "rid": 1}, {"term": "신선한 김밥", "mainDef": "\"Fresh gimbap.\"", "variants": ["신선한 김밥"], "subDefs": [{"subTerm": "신선하다", "subDef": "to be fresh ⸺ for food, just made or just picked."}], "examples": [{"kor": "아침에 신선한 빵을 샀어요.", "eng": "I bought fresh bread in the morning."}], "rid": 1}, {"term": "먹을 수 있어요", "mainDef": "\"You can eat (it).\"", "variants": ["먹을 수 있어요"], "subDefs": [{"subTerm": "-ㄹ/을 수 있다", "subDef": "\"can ~\": it is possible."}], "examples": [{"kor": "여기에서 사진을 찍을 수 있어요.", "eng": "You can take photos here."}], "rid": 1}, {"term": "별로 맛있지는 않아요", "mainDef": "\"It isn't all that tasty.\"", "variants": ["별로 맛있지는 않아요"], "subDefs": [{"subTerm": "별로", "subDef": "\"not very, not really\". It always goes with a negative: 별로 안 좋아요."}, {"subTerm": "-지는 않다", "subDef": "\"isn't ~\" ⸺ the 는 makes it softer and limits it: not bad, just not that good."}], "examples": [{"kor": "그 영화는 별로 재미있지는 않아요.", "eng": "That movie isn't all that fun."}], "rid": 1}, {"term": "먹고 싶으면", "mainDef": "\"If you want to eat.\"", "variants": ["먹고 싶으면"], "subDefs": [{"subTerm": "-면/으면 as in 싶으면", "subDef": "\"if ~\". It sets a condition."}], "examples": [{"kor": "쉬고 싶으면 쉬세요.", "eng": "If you want to rest, go ahead and rest."}], "rid": 1}, {"term": "가까운 아무 식당", "mainDef": "\"Any restaurant nearby.\"", "variants": ["가까운 아무 식당"], "subDefs": [{"subTerm": "-ㄴ/은 as in 가까운", "subDef": "가깝다 → 가까운. ㅂ irregular: the ㅂ at the end of the stem turns into 우."}, {"subTerm": "아무", "subDef": "\"any (at all)\": 아무 N = any N, it doesn't matter which."}, {"subTerm": "식당", "subDef": "a restaurant."}], "examples": [{"kor": "아무 카페에 들어가요.", "eng": "Let's just go into any café."}], "rid": 1}, {"term": "가면 돼요", "mainDef": "\"You just have to go.\" ⸺ it says this is all you need to do; nothing harder is required.", "variants": ["가면 돼요"], "subDefs": [{"subTerm": "-면/으면 되다", "subDef": "\"you just need to ~\". That one thing is enough."}], "examples": [{"kor": "이 버스를 타면 돼요.", "eng": "You just need to take this bus."}], "rid": 1}, {"term": "도대체", "mainDef": "On earth, in the world ⸺ it adds frustration or strong surprise to a question: 도대체 왜?", "variants": ["도대체"], "subDefs": [], "examples": [{"kor": "도대체 지갑을 어디에 뒀어요?", "eng": "Where on earth did you put your wallet?"}], "rid": 1}, {"term": "유행일까요", "mainDef": "\"I wonder why it's a trend.\" ⸺ the writer isn't asking the reader; he is wondering aloud.", "variants": ["유행일까요"], "subDefs": [{"subTerm": "-ㄹ/을까요?", "subDef": "wondering aloud: \"I wonder ~?\" It can also make a suggestion: 갈까요? (Shall we go?)"}], "examples": [{"kor": "내일 날씨가 좋을까요?", "eng": "I wonder if the weather will be nice tomorrow."}], "rid": 1}, {"term": "뭔가", "mainDef": "Something ⸺ short for 무엇인가.", "variants": ["뭔가"], "subDefs": [], "examples": [{"kor": "뭔가 이상해요.", "eng": "Something's off."}], "rid": 2}, {"term": "이상한 것", "mainDef": "\"Something strange.\"", "variants": ["이상한 것"], "subDefs": [{"subTerm": "-ㄴ/은 것", "subDef": "\"a ~ thing\": 이상한 것 = a strange thing."}], "examples": [{"kor": "맛있는 것을 먹고 싶어요.", "eng": "I want to eat something tasty."}], "rid": 2}, {"term": "발견했을 때", "mainDef": "\"When (people) find (it).\"", "variants": ["발견했을 때"], "subDefs": [{"subTerm": "-았/었을 때", "subDef": "\"when ~\" for an action that has already happened at that moment."}], "examples": [{"kor": "집에 도착했을 때 비가 왔어요.", "eng": "It was raining when I got home."}], "rid": 2}, {"term": "사람들의 반응", "mainDef": "\"People's reactions.\"", "variants": ["사람들의 반응"], "subDefs": [{"subTerm": "반응", "subDef": "a reaction, a response."}], "examples": [{"kor": "제 농담에 친구들의 반응이 좋았어요.", "eng": "My friends liked my joke."}], "rid": 2}, {"term": "크게 두 가지", "mainDef": "\"Broadly, two kinds.\"", "variants": ["크게 두 가지"], "subDefs": [{"subTerm": "크게", "subDef": "big, a lot ⸺ before a number of types it means \"broadly, roughly speaking\"."}, {"subTerm": "가지", "subDef": "kind, type ⸺ used for counting kinds: 한 가지, 두 가지."}], "examples": [{"kor": "방법은 크게 두 가지예요.", "eng": "Broadly, there are two ways."}], "rid": 2}, {"term": "무서워서 피한다", "mainDef": "\"(They) get scared and avoid it.\"", "variants": ["무서워서 피한다"], "subDefs": [{"subTerm": "-아서/어서 as in 무서워서", "subDef": "무섭다 → 무서워서. ㅂ irregular: ㅂ turns into 우, then -어서 is added."}, {"subTerm": "피하다", "subDef": "to avoid, to keep away from."}, {"subTerm": "-ㄴ다 as in 피한다", "subDef": "the plain written style (한다체). It is used in lists, notes and headlines, not when talking to someone."}], "examples": [{"kor": "저는 매운 음식을 피해요.", "eng": "I avoid spicy food."}], "rid": 2}, {"term": "가까이 간다", "mainDef": "\"(They) go closer.\"", "variants": ["가까이 간다"], "subDefs": [{"subTerm": "가까이", "subDef": "near, close (how something moves or is placed)."}, {"subTerm": "-ㄴ다 as in 간다", "subDef": "the plain written style, the same as 피한다 in the line above."}], "examples": [{"kor": "강아지가 저한테 가까이 왔어요.", "eng": "The puppy came close to me."}], "rid": 2}, {"term": "공포 영화를 보면", "mainDef": "\"If you watch horror movies, (you'll see…)\"", "variants": ["공포 영화를 보면"], "subDefs": [{"subTerm": "공포", "subDef": "fear, horror."}, {"subTerm": "-면/으면 as in 보면", "subDef": "\"if, when\" ⸺ here: whenever you look at it, this is what you notice."}], "examples": [{"kor": "공포 영화를 보면 잠을 못 자요.", "eng": "When I watch horror movies, I can't sleep."}], "rid": 2}, {"term": "두 번째 유형의 사람", "mainDef": "\"The second type of person.\"", "variants": ["두 번째 유형의 사람"], "subDefs": [{"subTerm": "번째", "subDef": "\"-th\": 첫 번째 (first), 두 번째 (second)."}, {"subTerm": "유형", "subDef": "a type, a kind (a bit more formal than 가지)."}], "examples": [{"kor": "저는 아침형 유형의 사람이에요.", "eng": "I'm a morning type of person."}], "rid": 2}, {"term": "죽다", "mainDef": "To die ⸺ in this diary it's a running joke: \"the cat dies\" means \"the experiment failed\".", "variants": ["죽어요", "죽었어요", "죽었을까요"], "subDefs": [], "examples": [{"kor": "화분의 꽃이 죽었어요.", "eng": "The flower in the pot died."}], "rid": 2}, {"term": "호기심은 고양이를 죽인다", "mainDef": "\"Curiosity kills the cat\" ⸺ a saying borrowed from English: being too curious gets you into trouble.", "variants": ["호기심은 고양이를 죽인다", "호기심은 고양이를 죽여요"], "subDefs": [{"subTerm": "호기심", "subDef": "curiosity."}, {"subTerm": "죽이다", "subDef": "to kill ⸺ 죽다 (to die) made into 'cause to die'."}], "examples": [{"kor": "아이들은 호기심이 많아요.", "eng": "Children are very curious."}], "rid": 2}, {"term": "라는 말도 있어요", "mainDef": "\"There's even a saying (that goes) ~.\"", "variants": ["라는 말도 있어요"], " e we'll go together."}], "rid": 3}, {"term": "포장지", "mainDef": "The packaging, the wrapper.", "variants": ["포장지"], "subDefs": [{"subTerm": "포장", "subDef": "wrapping, packing."}, {"subTerm": "지", "subDef": "paper (only inside words: 휴지, 포장지)."}], "examples": [{"kor": "포장지를 열었어요.", "eng": "I opened the wrapper."}], "rid": 3}, {"term": "쓰여 있어요", "mainDef": "\"It says…, it's written (there).\"", "variants": ["쓰여 있어요"], "subDefs": [{"subTerm": "쓰이다", "subDef": "to be written ⸺ 쓰다 (to write) made passive."}, {"subTerm": "-아/어 있다", "subDef": "a state that stays after something happened: 쓰여 있다 = is (still) written there."}], "examples": [{"kor": "문에 '금연'이라고 쓰여 있어요.", "eng": "The door says 'No smoking'."}], "rid": 3}, {"term": "조리방법", "mainDef": "Cooking instructions ⸺ written on packaging, not used in conversation.", "variants": ["조리방법"], "subDefs": [{"subTerm": "조리", "subDef": "cooking (a formal word)."}, {"subTerm": "방법", "subDef": "a way, a method."}], "examples": [{"kor": "조리방법을 잘 읽으세요.", "eng": "Read the cooking instructions carefully."}], "rid": 3}, {"term": "전자레인지", "mainDef": "A microwave (oven).", "variants": ["전자레인지"], "subDefs": [], "examples": [{"kor": "우유를 전자레인지에 데웠어요.", "eng": "I warmed the milk in the microwave."}], "rid": 3}, {"term": "냉동상태의 김밥", "mainDef": "\"Gimbap in its frozen state.\" ⸺ packaging Korean is short and formal; in conversation you'd say 얼어 있는 김밥.", "variants": ["냉동상태의 김밥"], "subDefs": [{"subTerm": "상태", "subDef": "a state, a condition."}], "examples": [{"kor": "핸드폰 상태가 좋아요.", "eng": "The phone is in good condition."}], "rid": 3}, {"term": "절취선까지 개봉 후", "mainDef": "\"After opening (it) up to the tear line.\"", "variants": ["절취선까지 개봉 후"], "subDefs": [{"subTerm": "절취선", "subDef": "the dotted line where you tear a package."}, {"subTerm": "-까지", "subDef": "\"up to, as far as\"."}, {"subTerm": "개봉", "subDef": "opening a package (formal) ⸺ for a movie it means its release."}, {"subTerm": "후", "subDef": "\"after\": N 후 = after N."}], "examples": [{         const ANSWER_CHOICES = [];
        const QUIZ_LIST = [{"id": 1, "questionKor": "상빈은 왜 김밥이 유행이라는 뉴스를 이해할 수 없었어요?", "questionEng": "Why couldn't Sangbin make sense of the news that gimbap was a trend?", "sentence_pre": "한국에서 김밥은 바쁠 때 ", "sentence_post": " 먹는 음식이라서 특별하지 않아요.", "correct_word": "간단히", "translation_pre": "In Korea, gimbap is something you eat ", "translation_answer": "quickly", "translation_post": " when you're busy, so it's nothing special.", "hint": "Adverb. Quickly and without much effort.", "options": [{"text": "간단히", "isCorrect": true, "feedback": "Correct! 간단히 먹다 = to have a quick, simple meal. That's exactly why the headline surprised him — gimbap is everyday grab-and-go food, not a star dish."}, {"text": "천천히", "isCorrect": false, "feedback": "Nope! 천천히 means 'slowly'. Nobody takes their time over gimbap when they're rushing around."}, {"text": "특별히", "isCorrect": false, "feedback": "Not quite! 특별히 means 'specially'. The whole point is that gimbap is NOT special in Korea."}, {"text": "비싸게", "isCorrect": false, "feedback": "Wrong angle! 비싸게 means 'expensively'. Ordinary gimbap costs only 2,500–3,000 won."}]}, {"id": 2, "questionKor": "상빈은 냉동 김밥을 먹어 본 경험이 있었어요?", "questionEng": "Had Sangbin ever tried frozen gimbap before?", "sentence_pre": "상빈은 냉동 만두는 먹어 봤지만, 냉동 김밥은 ", "sentence_post": " 적이 없었어요.", "correct_word": "먹어 본", "translation_pre": "Sangbin had tried frozen dumplings, but he had never ", "translation_answer": "eaten", "translation_post": " frozen gimbap.", "hint": "먹어 보다 + a modifier ending. 적 is a noun, so which ending fits something that already happened?", "options": [{"text": "먹어 본", "isCorrect": true, "feedback": "Correct! -ㄴ/은 적이 있다/없다 always takes the PAST modifier -ㄴ/은, because it talks about experience — things that already happened."}, {"text": "먹어 보는", "isCorrect": false, "feedback": "Not quite! -는 is the present modifier. With 적, Korean always uses the past form: 먹어 본 적."}, {"text": "먹어 볼", "isCorrect": false, "feedback": "Nope! -ㄹ/을 is the future modifi   if (st === 401 || (st === 400 && /api[ _]?key|api_key_invalid|authentication|invalid x-api-key/.test(d))) return 'key';
  if (st === 403) return 'perm';
  if (st === 404) return 'model';

  if ([500, 502, 503, 504, 529].includes(st)) return 'busy';

const str = (v) => (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();

/* =====================================================================
   5. 응답 정리 (어느 모델이든 같은 모양으로)
   ===================================================================== */
function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const q = P.request(aiState.model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}
async function aiLoadModels() {
  const P = AI_PROVIDERS[aiState.provider];
  aiState.loadingModels = true; aiState.modelsError = null; aiRepaintKeyFields();
  try {
    const q = P.listModels(aiState.apiKey);
    const list = P.readModels(await httpJSON(q.url, { headers: q.headers }));
    if (list.length) { aiState.models[aiState.provider] = list; if (!list.includes(aiState.model)) aiState.model = list[0]; }
  } catch (e) { aiState.modelsError = e.code ? e : AppError('format'); }
  finally { aiState.loadingModels = false; aiRepaintKeyFields(); }
}
const articleText = () => READING_DATA.map(r => (r.content || []).map(p => p.text || '').filter(Boolean).join('\n')).join('\n\n');

async function runDiscussFeedback(id) {
  const st = discussState[id]; const d = DISCUSS_DATA.find(x => x.id === id);
  if (!st || !d || st.loading || !st.text.trim()) return;
  if (!aiState.apiKey) { st.keyPanel = true; rerenderDiscussItem(id); return; }

  const level = app.userLevel, text = st.text;
  const question = [d.questionKor].concat((d.sub || []).map((q, i) => `${d.id}-${i + 1}. ${q}`)).join('\n');
  const questionEn = modeOf(level) === 'C' ? '' : [d.questionEng].concat(d.subEn || []).filter(Boolean).join('\n');
  const vocab = (d.vocab || []).map(v => ({ term: v.term, def: v.def || v.defEng || '' }));
  try {
    st.feedback = await callAIJSON(buildSystemPrompt(level), buildUserMessage({ level, article: articleText(), vocab, question, questionEn, learnerText: text }), (o) => normalizeFeedback(o, modeOf(level), text, articleText() + '\n' + vocab.map(v => v.term).join('\n')));

        }
        // ---------- 8a. 낭독 오디오 · playbar (자체 호스팅) ----------
        // 사용법
        //   1) 오디오 파일을 hub/assets/audio/ 에 올린다.  예) hub/assets/audio/a2plus-michelin-stars.m4a
        //   2) AUDIO_CFG.src 에 그 파일 URL을 적는다. 기존 자료와 같은 절대 URL 권장:
        //      'https://openkoreanlearninglab.github.io/hub/assets/audio/<파일명>'  (content/ 안이라면 '../assets/audio/<파일명>' 도 동작)
        //   3) 오디오를 붙일 읽기 자료의 READING_DATA 항목에 audio:true, audioLabel:"..." 를 넣는다.
        // 규칙
        //   · audio:true 인 읽기 자료에만 플레이어가 렌더된다(읽기 1↔2 전환 시 자동 마운트).
        //   · 라벨은 코드에 하드코딩하지 말고 READING_DATA[].audioLabel 로 넣는다(기본값 '오디오').
        //   · 재생 위치·배속은 탭을 옮겼다 돌아와도 유지된다(자동 재생은 하지 않는다).
        //   · playbar는 직접 그린다(브라우저 기본 컨트롤 미사용) — 크롬·사파리·모바일에서 모양이 같다.
        //   · 배속은 AUDIO_CFG.rate 로 정한다(min·max·step·def). 기본 0.75~1.25, 0.01 단위, 시작값 1.00.
        //     − / + 버튼과 슬라이더 바 둘 다로 조절하며, 두 조작 모두 step 단위로 스냅된다. 건너뛰기 폭은 AUDIO_CFG.skip(초).
        //   · 안내문·버튼 라벨의 영문은 <span class="lk-en">…</span> 으로 넣는다(상단바 언어 설정이 한국어만이면 자동으로 숨는다).
        //   · 저작권이 있는 남의 음원은 자체 호스팅하지 않는다. 직접 만든 낭독·팟캐스트에만 쓴다.
        // 이 자료는 일기마다 오디오가 따로 있다 → READING_DATA[].audioSrc 가 우선, 없으면 AUDIO_CFG.src.
        //   재생 위치는 일기(읽기 자료)별로 따로 기억하고, 배속은 모든 일기에 같이 적용된다.
        const AUDIO_CFG = { src: '', rate: { min: 0.75, max: 1.25, step: 0.01, def: 1 }, skip: 2 };
        const audioState = { rate: AUDIO_CFG.rate.def, times: {}, cur: null, playing: false, seeking: false, dragging: null, bound: false };
        let audioEl = null;

        function fmtTime(s) {
            if (!isFinite(s) || s < 0) return '--:--';
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
            const mm = h ? String(m).padStart(2, '0') : String(m);
            return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
        }
        // 배속: AUDIO_CFG.rate 의 min~max 를 step 단위로 오르내린다. 버튼(− +)과 슬라이더 바 둘 다로 조절.
        function audioSnapRate(v) {
            const c = AUDIO_CFG.rate;
            const n = Math.round((v - c.min) / c.step);
            const steps = Math.round((c.max - c.min) / c.step);
            return c.min + Math.min(steps, Math.max(0, n)) * c.step;
        }
        function audioRateCtrlHTML() {
            const c = AUDIO_CFG.rate, r = audioState.rate;
            const atMin = r <= c.min + 0.001, atMax = r >= c.max - 0.001;
            const pct = ((r - c.min) / (c.max - c.min)) * 100;
            return '<button type="button" data-action="audio-rate-step" data-delta="-' + c.step + '" class="lk-ap-step" aria-label="배속 낮추기"' + (atMin ? ' disabled' : '') + '>&#8722;</button>'
                + '<span id="lk-ap-rval" class="lk-ap-val" role="status" aria-live="polite">' + r.toFixed(2) + '×</span>'
                + '<button type="button" data-action="audio-rate-step" data-delta="' + c.step + '" class="lk-ap-step" aria-label="배속 높이기"' + (atMax ? ' disabled' : '') + '>+</button>'
                + '<span id="lk-ap-rbar" class="lk-ap-rbar" role="slider" tabindex="0" aria-label="재생 속도"'
                +   ' aria-valuemin="' + c.min + '" aria-valuemax="' + c.max + '" aria-valuenow="' + r.toFixed(2) + '" aria-valuetext="' + r.toFixed(2) + '×">'
                +   '<span class="lk-ap-rtrack"><span id="lk-ap-rfill" class="lk-ap-rfill" style="width:' + pct + '%"></span>'
                +   '<span id="lk-ap-rknob" class="lk-ap-rknob" style="left:' + pct + '%"></span></span>'
                +   '<span class="lk-ap-rends"><span>' + c.min.toFixed(2) + '</span><span>' + c.max.toFixed(2) + '</span></span>'
                + '</span>';
        }
        function audioRefreshRates() {
            const w = qs('#lk-ap-rate', viewRoot()); if (w) w.innerHTML = audioRateCtrlHTML();
        }
        function audioSetRate(rate) {
            const v = parseFloat(rate); if (!isFinite(v)) return;
            const r = audioSnapRate(v);
            audioState.rate = r;
            if (audioEl) { try { audioEl.playbackRate = r; } catch (_) {} }
            audioRefreshRates();
        }
        function audioStepRate(delta) {
            const d = parseFloat(delta); if (!isFinite(d)) return;
            audioSetRate(audioState.rate + d);
        }
        function audioRateFromEvent(e) {
            const bar = qs('#lk-ap-rbar', viewRoot()); if (!bar) return;
            const c = AUDIO_CFG.rate;
            const box = bar.getBoundingClientRect();
            const x = (e.clientX != null ? e.clientX : 0) - box.left;
            const ratio = Math.min(1, Math.max(0, x / (box.width || 1)));
            audioSetRate(c.min + ratio * (c.max - c.min));
        }
        function audioRefreshPlayBtn() {
            const b = qs('#lk-ap-play', viewRoot()); if (!b) return;
            b.innerHTML = svgIcon(audioState.playing ? 'pause' : 'play', '', { fill: 'currentColor' });
            b.setAttribute('aria-label', audioState.playing ? '일시정지' : '재생');
        }
        function audioRefreshProgress() {
            if (!audioEl) return;
            const root = viewRoot(); if (!root) return;
            const dur = audioEl.duration, cur = audioEl.currentTime;
            const pct = (isFinite(dur) && dur > 0) ? Math.min(100, Math.max(0, (cur / dur) * 100)) : 0;
            const fill = qs('#lk-ap-fill', root); if (fill) fill.style.width = pct + '%';
            const knob = qs('#lk-ap-knob', root); if (knob) knob.style.left = pct + '%';
            const c = qs('#lk-ap-cur', root); if (c) c.textContent = fmtTime(cur);
            const d = qs('#lk-ap-dur', root); if (d) d.textContent = fmtTime(dur);
            const bar = qs('#lk-ap-bar', root);
            if (bar && isFinite(dur) && dur > 0) {
                bar.setAttribute('aria-valuemax', Math.floor(dur));
                bar.setAttribute('aria-valuenow', Math.floor(cur));
                bar.setAttribute('aria-valuetext', fmtTime(cur) + ' / ' + fmtTime(dur));
            }
            try {
                const buf = qs('#lk-ap-buf', root);
                if (buf && audioEl.buffered.length && isFinite(dur) && dur > 0) {
                    buf.style.width = Math.min(100, (audioEl.buffered.end(audioEl.buffered.length - 1) / dur) * 100) + '%';
                }
            } catch (_) {}
        }
        // ---- 문장 듣기: ▶ 를 누르면 그 문장만 재생하고 멈춘다 (READING_DATA[].content[].sp = [[글자 위치, 시작초, 끝초], …]) ----
        const sentPlay = { key: null, end: null, raf: 0 };
        function sentStop() {
            sentPlay.key = null; sentPlay.end = null;
            if (sentPlay.raf) { cancelAnimationFrame(sentPlay.raf); sentPlay.raf = 0; }
            qsa('.lk-sp.on', viewRoot()).forEach(b => b.classList.remove('on'));
        }
        function sentWatch() {
            sentPlay.raf = 0;
            if (sentPlay.end == null || !audioEl) return;
            if (audioEl.currentTime >= sentPlay.end) { audioEl.pause(); sentStop(); return; }
            sentPlay.raf = requestAnimationFrame(sentWatch);
        }
        function playSentence(btn) {
            if (!audioEl) return;
            const key = btn.dataset.key, s = parseFloat(btn.dataset.s), e = parseFloat(btn.dataset.e);
            if (sentPlay.key === key && !audioEl.paused) { audioEl.pause(); sentStop(); return; }   // 같은 ▶ 다시 누르면 멈춤
            sentStop();
            sentPlay.key = key; btn.classList.add('on');
            const el = audioEl;
            const go = function () {
                if (el !== audioEl || sentPlay.key !== key) return;
                try { el.currentTime = s; } catch (_) {}
                sentPlay.end = e;
                const p = el.play(); if (p && p.catch) p.catch(function () { sentStop(); });
                if (!sentPlay.raf) sentPlay.raf = requestAnimationFrame(sentWatch);
            };
            if (el.readyState >= 1) go(); else { el.addEventListener('loadedmetadata', go, { once: true }); try { el.load(); } catch (_) {} }
        }
        function audioToggle() {
            if (!audioEl) return;
            sentStop();
            if (audioEl.paused) { const p = audioEl.play(); if (p && p.catch) p.catch(function () {}); }
            else audioEl.pause();
        }
        function audioSkip(sec) {
            if (!audioEl || !isFinite(audioEl.duration)) return;
            sentStop();
            audioEl.currentTime = Math.min(audioEl.duration, Math.max(0, audioEl.currentTime + sec));
            audioRefreshProgress();
        }
        function audioSeekToEvent(e) {
            const bar = qs('#lk-ap-bar', viewRoot());
            if (!bar || !audioEl || !isFinite(audioEl.duration) || audioEl.duration <= 0) return;
            const r = bar.getBoundingClientRect();
            const x = (e.clientX != null ? e.clientX : 0) - r.left;
            const ratio = Math.min(1, Math.max(0, x / (r.width || 1)));
            audioEl.currentTime = ratio * audioEl.duration;
            audioState.times[audioState.cur] = audioEl.currentTime;
            audioRefreshProgress();
        }
        function audioBindDrag() {
            if (audioState.bound) return;
            audioState.bound = true;
            const move = function (e) {
                if (!audioState.dragging) return;
                e.preventDefault();
                if (audioState.dragging === 'seek') audioSeekToEvent(e); else audioRateFromEvent(e);
            };
            const up = function () {
                if (!audioState.dragging) return;
                audioState.dragging = null;
                audioState.seeking = false;
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                document.removeEventListener('pointercancel', up);
            };
            document.addEventListener('pointerdown', function (e) {
                if (!e.target.closest) return;
                const seekBar = e.target.closest('#lk-ap-bar');
                const rateBar = e.target.closest('#lk-ap-rbar');
                if (!seekBar && !rateBar) return;
                if (seekBar && !audioEl) return;
                if (seekBar) sentStop();
                audioState.dragging = seekBar ? 'seek' : 'rate';
                audioState.seeking = !!seekBar;
                if (seekBar) audioSeekToEvent(e); else audioRateFromEvent(e);
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', up);
                document.addEventListener('pointercancel', up);
            });
        }
        function audioPlayerHTML(src) {
            const skip = AUDIO_CFG.skip;
            return '<div class="lk-ap">'

        function mountAudio() {
            const cr = currentReading();

                '<div class="mb-2 flex items-center gap-2 text-xs font-bold font-sans uppercase tracking-widest text-gray-400">'

                + audioPlayerHTML(src)

                + '<p class="lk-ap-fb lk-en">If it won\'t play, <a href="' + src + '" target="_blank" rel="noreferrer">open the audio file directly</a> · if that still doesn\'t work, try another browser (Chrome).</p>';

            const el = qs('#lk-ap-el', mount);
            audioEl = el;
            if (!el) return;
            const id = cr.id;
            audioState.cur = id;
            audioState.playing = false;
            audioBindDrag();
            try { el.playbackRate = audioState.rate; } catch (_) {}
            // 일기를 바꾸면 이전 <audio>는 DOM에서 빠진다 — 그 뒤에 오는 이벤트는 무시(현재 일기의 위치를 덮어쓰지 않도록)
            const live = function () { return el === audioEl; };
            const restore = function () {
                const t = audioState.times[id] || 0;
                if (live() && t > 0 && isFinite(el.duration)) { try { el.currentTime = Math.min(t, el.duration); } catch (_) {} }
                if (live()) audioRefreshProgress();
            };
            if (el.readyState >= 1) restore();
            else el.addEventListener('loadedmetadata', restore, { once: true });
            el.addEventListener('timeupdate', function () { if (!live()) return; if (sentPlay.end != null && el.currentTime >= sentPlay.end) { el.pause(); sentStop(); } if (!audioState.seeking) audioState.times[id] = el.currentTime; audioRefreshProgress(); });
            el.addEventListener('progress', function () { if (live()) audioRefreshProgress(); });
            el.addEventListener('durationchange', function () { if (live()) audioRefreshProgress(); });
            el.addEventListener('play', function () { if (!live()) return; audioState.playing = true; audioRefreshPlayBtn(); });
            el.addEventListener('pause', function () { if (!live()) return; audioState.playing = false; audioRefreshPlayBtn(); });
            el.addEventListener('ended', function () { if (!live()) return; sentStop(); audioState.playing = false; audioState.times[id] = 0; audioRefreshPlayBtn(); });
            el.addEventListener('ratechange', function () {
                if (!live() || Math.abs(el.playbackRate - audioState.rate) < 0.001) return;
                audioState.rate = el.playbackRate; audioRefreshRates();
            });
            const bar = qs('#lk-ap-bar', mount);
            if (bar) bar.addEventListener('keydown', function (e) {
                const k = e.key;
                if (k === 'ArrowRight') { e.preventDefault(); audioSkip(5); }
                else if (k === 'ArrowLeft') { e.preventDefault(); audioSkip(-5); }
                else if (k === ' ' || k === 'Enter') { e.preventDefault(); audioToggle(); }
            });
            mount.addEventListener('keydown', function (e) {
                if (!e.target.closest || !e.target.closest('#lk-ap-rbar')) return;

                if (k === 'ArrowRight' || k === 'ArrowUp') { e.preventDefault(); audioStepRate(st); qs('#lk-ap-rbar', viewRoot()).focus(); }

                else if (k === 'Home') { e.preventDefault(); audioSetRate(AUDIO_CFG.rate.min); qs('#lk-ap-rbar', viewRoot()).focus(); }
                else if (k === 'End') { e.preventDefault(); audioSetRate(AUDIO_CFG.rate.max); qs('#lk-ap-rbar', viewRoot()).focus(); }
            });
            audioRefreshPlayBtn();
            audioRefreshProgress();
        }

        /* ===== Flash Card 모듈 (어휘 탭) — 20개 큐레이션 카드 + 미디어 ===== */

        function vocabHTML() {
