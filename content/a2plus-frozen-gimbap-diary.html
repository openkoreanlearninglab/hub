            const header = `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-16 flex flex-col items-center text-center"><h2 class="text-[32px] md:text-[36px] font-bold text-[#1a1a1a] leading-tight font-serif mb-3 tracking-tight">핵심 어휘</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Key Vocabulary</span><div class="w-[1px] h-6 bg-gray-200 mt-8"></div></div>`;
            const listRest = `<div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100"><div class="relative w-full sm:max-w-xs"><input type="text" id="vocab-search" value="${esc(vocabState.query)}" placeholder="${secLang() ? '단어, 뜻, 영어 검색... / Search words...' : '단어, 뜻, 영어 검색...'}" class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 transition-all" />${vocabState.query ? '<button type="button" data-action="vocab-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs font-bold">✕</button>' : ''}</div><div class="flex items-center gap-4 w-full sm:w-auto justify-end"><span class="text-xs text-gray-500 font-sans">검색 결과: <strong id="vocab-count">${vocabFiltered().length}</strong>개 / 전체 ${VOCAB_READING_DATA.length}개</span><button type="button" data-action="vocab-global" class="px-4 py-2 text-xs font-semibold rounded-lg border transition-all ${vocabState.globalTrans ? 'bg-gray-900 text-white border-gray-900 hover:bg-black' : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'}">${vocabState.globalTrans ? '영어 일괄 숨기기<span class="lk-en"> · Hide English</span>' : '영어 일괄 표시<span class="lk-en"> · Show English</span>'}</button></div></div>${vocabChipsHTML()}<div class="mb-16"><div class="flex items-center gap-3 mb-8"><h3 class="text-xl font-bold font-serif text-black">읽기 자료 어휘</h3><div class="h-px flex-1 bg-gray-200"></div><span class="lk-en text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Reading</span></div><div id="vocab-grid">${vocabGridHTML()}</div></div>${grammarSectionHTML()}</div>`;
            const body = (hasFC && fc.mode==='card') ? fcDeckHTML() : listRest;
            return `${header}${modeBar}${body}`;
        }
        function vocabChipsHTML() {
            if (READING_DATA.length < 2) return '';
            const md = t => { const m = /(\d+)월\s*(\d+)일/.exec(t || ''); return m ? m[1] + '/' + m[2] : ''; };
            const chip = (rid, main, sub, n) => `<button type="button" data-vrid="${rid == null ? 'all' : rid}" class="lk-vchip${vocabState.rid === rid ? ' on' : ''}" aria-pressed="${vocabState.rid === rid}"><span class="lk-vchip-main">${main}</span>${sub ? `<span class="lk-vchip-sub">${sub}</span>` : ''}<span class="lk-vchip-n">${n}</span></button>`;
            return `<div class="lk-vchips" role="group" aria-label="일기별 보기">${chip(null, '전체<span class="lk-en"> · All</span>', '', VOCAB_READING_DATA.length)}${READING_DATA.map(r => chip(r.id, String(r.id), md(r.title), VOCAB_READING_DATA.filter(w => (w.rid || 1) === r.id).length)).join('')}</div>`;
        }
        function setVocabRid(rid) {
            vocabState.rid = rid; vocabState.itemTrans = {};
            const w = qs('.lk-vchips', viewRoot()); if (w) w.outerHTML = vocabChipsHTML();
            refreshVocabGrid();
        }
        function refreshVocabGrid() { const g = qs('#vocab-grid', viewRoot()); if (g) g.innerHTML = vocabGridHTML(); const c = qs('#vocab-count', viewRoot()); if (c) c.textContent = vocabFiltered().length; }

        // ---------- 10. QUIZ ----------

        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;
        }
        function rerenderQuizQ(qid) { const el = qs(`.quiz-q[data-qid="${qid}"]`, viewRoot()); if (el) el.outerHTML = quizItemHTML(QUIZ_LIST.find(q => String(q.id) === String(qid))); }
        function updateQuizScore() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; }

        // ---------- 11. DISCUSS ----------
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = newDiscussSt());
            const vocab = item.vocab.map(v => `<div><p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>${st.showTrans && v.defEng ? `<p class="text-[13px] font-sans text-gray-500 mt-1 animate-fade-in"><span class="font-bold mr-2">${esc(v.termEng || '')}</span>${esc(v.defEng)}</p>` : ''}</div>`).join('');
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal" style="white-space:pre-line">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14"><div class="flex gap-2 mb-4">${transBtn('discuss-qtrans', st.showTrans)}${st.showTrans ? `<p class="text-sm font-sans text-gray-500 animate-fade-in" style="white-space:pre-line">${esc(item.questionEng)}</p>` : ''}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-3 block">핵심 어휘${st.showTrans ? ' <span class="lk-en font-normal normal-case ml-1">(Key Vocabulary)</span>' : ''}</span><div class="space-y-4">${vocab}</div></div>${aiWriteHTML(item, st)}</div></div>`;
        }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-6 pb-6 text-center"><h2 class="text-[32px] md:text-[36px] font-serif font-bold text-[#1a1a1a] mb-2">생각해 보기</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Food For Thought</span></div>${aiTopHTML()}<div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;
        }
        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);
            if (out.length) return out;
            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            const hasVideos = (typeof VIDEOS !== 'undefined' && VIDEOS.length && VIDEOS[0].script && VIDEOS[0].script.length);
            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);
            if (typeof READING_DATA !== 'undefined' && Array.isArray(READING_DATA) && READING_DATA.length) s.push(['reading', '읽기 자료']);
            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);
            if (typeof GRAMMAR_DATA !== 'undefined' && Array.isArray(GRAMMAR_DATA) && GRAMMAR_DATA.length) s.push(['grammar', '핵심 문법']);
            if (typeof QUIZ_LIST !== 'undefined' && Array.isArray(QUIZ_LIST) && QUIZ_LIST.length) s.push(['quiz', '내용 확인 퀴즈']);
            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;
        }
        function pwScriptHTML() {
            const vids = (typeof VIDEOS !== 'undefined' && VIDEOS.length) ? VIDEOS : [{ title: '', script: (typeof VIDEO_SCRIPT_DATA !== 'undefined' ? VIDEO_SCRIPT_DATA : []) }];
            return vids.map(v => `${(vids.length > 1 && v.title) ? `<div class="pw-part-title">${esc(v.title)}${v.subTitle ? ' · ' + esc(v.subTitle) : ''}</div>` : ''}${(v.script || []).map(l => `<div class="pw-line"><div class="pw-kor"><span class="pw-spk">${esc(l.speaker || '')}</span>${esc(l.kor || '')}</div>${l.eng ? `<div class="pw-eng">${esc(l.eng)}</div>` : ''}</div>`).join('')}`).join('');
        }
        function pwReadingHTML() {
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')}</div>${r.subtitle ? `<div class="pw-read-sub">${esc(r.subtitle)}</div>` : ''}${(r.content || []).filter(p => !p.isChart).map(p => p.isLink ? `<div class='pw-read-p'>${esc(p.text)}: ${esc(p.url)}</div>` : p.isImage ? `<div class="pw-read-fig"><img src="${esc(p.src)}" alt="${esc(p.alt || '')}"><div>${esc(p.caption || '')}</div></div>` : p.isHeading ? `<div class="pw-read-h">${esc(p.text || '')}</div>` : `<div class="pw-read-p">${esc(p.text || '')}</div>`).join('')}`).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            const groups = (READING_DATA.length > 1) ? READING_DATA.map(r => ({ title: '읽기 자료 ' + r.id + ' · ' + r.title, ws: words.filter(w => (w.rid || 1) === r.id) })).filter(g => g.ws.length) : [{ title: '', ws: words }];
            groups.forEach(g => { for (let i = 0; i < g.ws.length; i += 4) pages.push({ title: i === 0 ? g.title : '', ws: g.ws.slice(i, i + 4) }); });
            return pages.map(pg => `<div class="pw-vocab-page">${pg.title ? `<div class="pw-part-title">${esc(pg.title)}</div>` : ''}<div class="pw-vocab-grid">${pg.ws.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, grammar: pwGrammarHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        // 이미지(data-fallback="hide")를 불러오지 못하면 그 자리를 숨긴다 — error는 버블링되지 않으므로 캡처 단계에서 1회 등록
        appEl.addEventListener('error', (e) => { const t = e.target; if (!t || t.tagName !== 'IMG' || t.dataset.fallback !== 'hide') return; const f = t.closest('.lk-fig'); (f || t).classList.add('is-broken'); }, true);
        appEl.addEventListener('click', (e) => {
            const rdo = e.target.closest('[data-reading-open]'); if (rdo) { if (audioEl) { try { audioEl.pause(); } catch (_) {} } reading.activeId = +rdo.dataset.readingOpen; setTab('reading'); try { window.scrollTo(0, 0); } catch (_) {} return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            const a = e.target.closest('[data-action]');
            if (a && aiHandleClick(a)) return;
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const _sl = e.target.closest('[data-setlang]');
            if (_sl) { app.lang = _sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            const _wasLangOpen = app.langOpen; app.langOpen = false;
            if (_wasLangOpen && !e.target.closest('[data-tab],[data-action],[data-vocab-idx],[data-did]')) { buildApp(); return; }
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { if (+rd.dataset.reading !== reading.activeId) switchReading(+rd.dataset.reading); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const k = reading.activeId + '-' + a.dataset.idx; reading.trans[k] = !reading.trans[k]; rerenderReadingBlocks(); }
                    else if (act === 'audio-toggle') { audioToggle(); }
                    else if (act === 'audio-skip') { audioSkip(parseFloat(a.dataset.sec)); }
                    else if (act === 'audio-rate-step') { audioStepRate(a.dataset.delta); }
                    else if (act === 'next-reading') { switchReading(+a.dataset.next); }
                    else if (act === 'sent-play') { playSentence(a); }
                    else if (act === 'vocab-for') { if (audioEl) { try { audioEl.pause(); } catch (_) {} } sentStop(); vocabState.rid = +a.dataset.rid; vocabState.query = ''; vocabState.itemTrans = {}; fc.mode = 'list'; setTab('vocab'); }
                    return;
                }
            } else if (tab === 'vocab') {
                const vrc = e.target.closest('[data-vrid]');
                if (vrc) { const v = vrc.dataset.vrid; setVocabRid(v === 'all' ? null : +v); return; }
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;
                    const fa = e.target.closest('[data-action^="fc-"]');
                    if (fa) { const act = fa.dataset.action;
                        if (act === 'fc-flip') fcSetFlip(!fc.flipped);
                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });
                        else if (act === 'fc-order') fcSetOrder(fa.dataset.sh==='1');
                        else if (act === 'fc-audio') fcPlay(fcCur().audio);
                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }
                        else if (act === 'fc-again-u') { fc.shuffled=true; fcStart(fcUnknown()); fcRefreshDeck(); }
                        else if (act === 'fc-again-all') { fc.shuffled=true; fcStart(null); fcRefreshDeck(); }
                    }
                    return;
                }
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            } else if (tab === 'quiz') {
                const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });
        appEl.addEventListener('input', (e) => {
            if (aiHandleInput(e.target)) return;
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
        });

        appEl.addEventListener('change', (e) => { aiHandleChange(e.target); });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            if (!aiState.apiKey) { reading.dictResult = null; reading.dictError = null; paint(); return; }
            reading.dictLoading = true; reading.dictResult = null; reading.dictError = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm); }
            catch (err) { reading.dictError = err && err.code ? err : AppError('format'); }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }


        // ---------- 13. 시작 ----------
        aiLoadStore();
        buildApp();
    })();
    </script>
</body>
