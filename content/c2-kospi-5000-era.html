                { term: '형평', mainDef: '형(衡 저울대) + 평(平 평평할) -> 어느 한쪽으로 억울하게 기울어지지 않고 저울처럼 모든 사람에게 고르고 공평함', translations: { en: { term: 'equity / fairness', mainDef: 'being even and fair to everyone like a scale without unfairly leaning to one side.' } }, examples: [{ kor: "사탕을 아이들에게 똑같이 두 개씩 나누어 주어야 형평에 맞아요.", eng: "You must distribute the candies equally, two to each child, for it to be fair (meet equity)." }], variants: ['형평'] },
                { term: '고용', mainDef: '고(雇 품팔) + 용(傭 품팔) -> 돈을 주고 사람을 구해서 일을 시키는 것 (새로운 일자리)', translations: { en: { term: 'employment', mainDef: 'hiring a person for money and putting them to work (a new job).' } }, examples: [{ kor: "큰 공장이 들어서면 동네 청년들의 고용이 늘어나 실업자가 줄어들 거예요.", eng: "If a large factory is built, employment of local youths will increase, reducing the unemployed." }], variants: ['고용'] },
                { term: '세수', mainDef: '세(稅 세금) + 수(收 거둘) -> 나라가 국민이나 기업으로부터 세금 명목으로 거둬들인 돈 전체의 수입', translations: { en: { term: 'tax revenue', mainDef: 'the total income of money collected by the country from citizens or companies in the name of taxes.' } }, examples: [{ kor: "담배 판매가 줄어들면서 담배에 붙는 세금 수입인 세수가 크게 줄었어요.", eng: "As cigarette sales decreased, the tax revenue attached to cigarettes significantly decreased." }], variants: ['세수'] },
                { term: '낙수효과', mainDef: '낙(落 떨어질) + 수(水 물) -> 커다란 컵에 물이 넘쳐서 아래에 있는 작은 컵들로 흘러내리는 것처럼, 부자나 대기업이 돈을 많이 벌면 결국 그 돈이 흘러넘쳐 서민이나 가난한 사람들도 잘살게 된다는 경제학의 생각', translations: { en: { term: 'trickle-down effect', mainDef: 'an economic idea that just as water overflows a large cup and flows down into smaller cups below, if the rich or large corporations make a lot of money, that money will eventually overflow and make ordinary or poor people live well too.' } }, examples: [{ kor: "부자들의 세금을 깎아주며 낙수효과를 기대했지만, 부자들은 돈을 혼자만 꽁꽁 숨겨두었어요.", eng: "They expected a trickle-down effect by cutting taxes for the rich, but the rich kept the money tightly hidden to themselves." }], variants: ['낙수효과'] },
                { term: '우대받다', mainDef: '우(優 넉넉할) + 대(待 대할) -> 다른 사람보다 더욱 특별히 아낌을 받고 대접이나 혜택을 넉넉하게 받다', translations: { en: { term: 'to receive preferential treatment', mainDef: 'to be cherished more specially than others and receive generous treatment or benefits.' } }, examples: [{ kor: "나라를 위해 싸운 참전 용사들은 버스나 기차를 탈 때 요금을 깎아주는 우대를 받습니다.", eng: "Veterans who fought for the country receive preferential treatment of discounted fares when taking buses or trains." }], variants: ['우대받다', '우대받는'] },
                { term: '훼손하다', mainDef: '훼(毁 헐) + 손(損 덜) -> 가치 있고 소중한 물건이나 명예를 함부로 부수거나 더럽혀서 망가뜨리다', translations: { en: { term: 'to damage / to undermine', mainDef: 'to carelessly break or dirty a valuable object or honor, ruining it.' } }, examples: [{ kor: "산에 쓰레기를 버려서 아름다운 자연의 모습을 훼손하면 안 됩니다.", eng: "You shouldn't damage the beautiful nature by throwing trash in the mountains." }], variants: ['훼손하다', '훼손하는'] },
                { term: '근로소득', mainDef: '직장에 나가서 매일 아침부터 저녁까지 몸이나 머리를 써서 힘들게 일(근로)한 대가로 받는 깨끗한 돈(소득)', subDefs: [{ subTerm: '• 근로', subDef: '근(勤 부지런할) + 로(勞 일할) -> 부지런히 일함' }], translations: { en: { term: 'earned income / labor income', mainDef: 'clean money (income) received in return for working hard (labor) using body or brain from morning to evening at a workplace.', subDefs: [{ term: 'labor', def: 'working diligently.' }] } }, examples: [{ kor: "아버지는 매일 공장에서 땀 흘려 번 근로소득으로 우리 4남매를 키우셨어요.", eng: "My father raised us four siblings with the earned income he made by sweating at the factory every day." }], variants: ['근로소득', '근로'] },
                { term: '이전소득', mainDef: '이(移 옮길) + 전(轉 구를) -> 자기가 직접 일해서 번 돈이 아니라, 나라에서 주는 불우이웃 돕기 지원금이나 부모님께 받는 용돈처럼 남에게서 거저 넘어온 소득', translations: { en: { term: 'transfer income', mainDef: 'income transferred for free from others, like government aid for the needy or allowance from parents, not money earned by working directly.' } }, examples: [{ kor: "혼자 사시는 할머니는 나라에서 매달 보내주는 연금이라는 이전소득으로 생활하십니다.", eng: "The grandmother living alone lives on transfer income called a pension sent by the country every month." }], variants: ['이전소득'] },
                { term: '상위 자산계층', mainDef: '나라 전체 사람들을 돈의 양으로 줄 세웠을 때 맨 꼭대기(상위)에 있는 아주 부자들 무리', subDefs: [{ subTerm: '• 상위', subDef: '상(上 위) + 위(位 자리) -> 등수나 자리가 아주 높음' }, { subTerm: '• 자산', subDef: '가지고 있는 재산' }], translations: { en: { term: 'upper asset class / upper wealth bracket', mainDef: 'the group of very rich people at the very top (upper) when ranking all people in the country by the amount of money.', subDefs: [{ term: 'upper rank', def: 'rank or position being very high.' }, { term: 'asset', def: 'possessed property.' }] } }, examples: [{ kor: "저 으리으리한 성 같은 집들은 0.1%의 상위 자산계층 사람들만이 살 수 있어요.", eng: "Only the 0.1% upper asset class people can buy those magnificent castle-like houses." }], variants: ['상위 자산계층'] },
                { term: '증폭시키다', mainDef: '증(增 더할) + 폭(幅 폭) -> 원래 있던 소리, 감정, 또는 문제의 크기나 넓이를 라디오 스피커처럼 훨씬 더 크고 빵빵하게 만들다', translations: { en: { term: 'to amplify', mainDef: 'to make the size or width of an original sound, emotion, or problem much larger and louder like a radio speaker.' } }, examples: [{ kor: "그의 사소한 거짓말 하나가 친구들 사이의 오해를 산처럼 크게 증폭시켰습니다.", eng: "His one minor lie amplified the misunderstanding among friends as big as a mountain." }], variants: ['증폭시키다', '증폭시키고'] },
                { term: '차익', mainDef: '차(差 다를) + 익(益 더할) -> 물건을 살 때 냈던 돈보다 나중에 팔 때 받은 돈이 더 많아서 그 중간에 남긴 달콤한 이익 (예: 천 원에 사서 이천 원에 팔면 차익은 천 원)', translations: { en: { term: 'margin / capital gain', mainDef: 'the sweet profit left in the middle because the money received when selling later is more than the money paid when buying (e.g., buy for 1,000 won, sell for 2,000 won, margin is 1,000 won).' } }, examples: [{ kor: "오래된 장난감을 인터넷에 비싸게 팔아서 5만 원의 쏠쏠한 차익을 남겼어요.", eng: "I sold an old toy expensively on the internet and made a decent margin of 50,000 won." }], variants: ['차익'] },
                { term: '특혜', mainDef: '특(特 특별할) + 혜(惠 은혜) -> 여러 사람 중에서 혼자만 정해진 규칙을 무시하고 불공평하게 쏙 빼서 챙겨주는 특별하고 얄미운 혜택', translations: { en: { term: 'special favor / privilege', mainDef: 'a special and unfair benefit given to only one person among many, ignoring established rules.' } }, examples: [{ kor: "시장님 아들이라고 해서 시험도 안 보고 시청 공무원이 된 것은 명백한 특혜입니다.", eng: "Becoming a city hall official without taking an exam just because he is the mayor's son is an obvious special favor." }], variants: ['특혜'] },
                { term: '고착화되다', mainDef: '고(固 굳을) + 착(着 붙을) + 화(化 될) -> 아주 찐득한 풀로 딱 붙인 것처럼 잘못된 상황이나 나쁜 제도가 돌처럼 딱딱하게 굳어져서 더 이상 고칠 수 없게 되다', translations: { en: { term: 'to become entrenched / fixated', mainDef: 'for a wrong situation or bad system to harden like stone and become unfixable, as if glued tightly with sticky glue.' } }, examples: [{ kor: "가난한 집 아이들은 학원에 못 가서 성적이 계속 떨어지는 슬픈 현상이 사회에 고착화되고 있어요.", eng: "The sad phenomenon of children from poor families continuously getting lower grades because they can't go to cram schools is becoming entrenched in society." }], variants: ['고착화되다', '고착화되고'] },
                { term: '대출을 받다', mainDef: '대(貸 빌릴) + 출(出 낼) -> 은행에 나중에 이자를 얹어서 꼭 갚겠다고 약속하고 당장 필요한 큰돈을 빌려 오다', translations: { en: { term: 'to take out a loan', mainDef: 'to borrow a large sum of money needed right away from a bank with the promise to surely pay it back later with interest added.' } }, examples: [{ kor: "우리 가족이 살 따뜻한 집을 사기 위해 은행에서 1억 원의 대출을 받았습니다.", eng: "I took out a loan of 100 million won from the bank to buy a warm house for my family to live in." }], variants: ['대출을 받다', '대출을 받아'] },
                { term: '탐욕', mainDef: '탐(貪 탐할) + 욕(欲 욕심) -> 이미 충분히 많이 가졌는데도 만족하지 못하고 끝도 없이 더 많은 것을 가지려고 아등바등하는 무서운 욕심', translations: { en: { term: 'greed', mainDef: 'a terrifying desire to endlessly struggle to have more, completely unsatisfied even when already having enough.' } }, examples: [{ kor: "돈에 대한 놀부의 멈출 줄 모르는 탐욕이 결국 그의 모든 재산을 빼앗아갔습니다.", eng: "Nolbu's unstoppable greed for money eventually took away all his wealth." }], variants: ['탐욕'] },
                { term: '교훈', mainDef: '교(敎 가르칠) + 훈(訓 가르칠) -> 과거의 아픈 실수나 옛날이야기를 통해 앞으로 어떻게 살아야 할지 머리와 가슴으로 깨닫게 되는 소중한 가르침', translations: { en: { term: 'lesson / moral', mainDef: 'a precious teaching realized through the mind and heart about how to live in the future, learned from past painful mistakes or old stories.' } }, examples: [{ kor: "토끼와 거북이 이야기는 꾸준히 성실하게 노력해야 한다는 아주 중요한 교훈을 우리에게 줍니다.", eng: "The story of the tortoise and the hare gives us a very important lesson that we must make consistent and sincere efforts." }], variants: ['교훈'] },
                { term: '폭락', mainDef: '폭(暴 사나울) + 락(落 떨어질) -> 절벽에서 돌이 떨어지듯 주식이나 물건의 가격이 갑자기 엄청나게 무서운 기세로 뚝 떨어지는 현상', translations: { en: { term: 'plunge / crash', mainDef: 'a phenomenon where prices of stocks or goods suddenly drop with a terrifying force, like rocks falling from a cliff.' } }, examples: [{ kor: "회사의 나쁜 소문이 퍼지자 하루 만에 주식 가격이 절반으로 무섭게 폭락했습니다.", eng: "As bad rumors about the company spread, the stock price crashed terrifyingly to half in just one day." }], variants: ['폭락', '폭락 사례'] },
                { term: '급등하다', mainDef: '급(急 급할) + 등(騰 오를) -> 엘리베이터가 무섭게 올라가듯 가격이나 숫자가 예상할 틈도 없이 짧은 시간 안에 아주 높이 솟아오르다', translations: { en: { term: 'to skyrocket / to surge', mainDef: 'for prices or numbers to soar very high in a short time without a chance to expect it, like a scary fast elevator.' } }, examples: [{ kor: "가뭄으로 배추가 다 죽어버려서 시장의 배추 가격이 어제보다 3배나 급등했어요.", eng: "Because all the cabbages died from the drought, the price of cabbage in the market skyrocketed three times more than yesterday." }], variants: ['급등하다', '급등했고', '급등을'] },
                { term: '사회 전반', mainDef: '특정 동네나 사람만이 아니라, 우리가 살고 있는 나라와 세상(사회) 전체의 모든 구석구석(전반)', subDefs: [{ subTerm: '• 전반', subDef: '전(全 온전할) + 반(般 가지) -> 빠진 곳 없이 널리 퍼진 전체' }], translations: { en: { term: 'the whole society / across society', mainDef: 'not just a specific neighborhood or people, but every corner (overall) of the entire country and world (society) we live in.', subDefs: [{ term: 'overall / whole', def: 'the widespread whole without any missing parts.' }] } }, examples: [{ kor: "스마트폰의 발명은 젊은이들뿐만 아니라 우리 사회 전반의 생활 모습을 완전히 바꾸어 놓았습니다.", eng: "The invention of the smartphone completely changed the lifestyle across our whole society, not just for the youth." }], variants: ['사회 전반', '전반'] },
                { term: '노동의 실종', mainDef: '땀 흘려 일하는 것(노동)이 바보 같은 짓이 되어버리고, 모두가 일하기를 포기하여 흔적 없이 사라져 버린(실종) 끔찍한 사회 모습', subDefs: [{ subTerm: '• 실종', subDef: '실(失 잃을) + 종(踪 자취) -> 어디 있는지 모르게 자취를 감춤' }], translations: { en: { term: 'disappearance of labor', mainDef: 'a terrible societal state where working hard and sweating (labor) becomes foolish, and everyone gives up working and disappears without a trace (disappearance).', subDefs: [{ term: 'disappearance', def: 'hiding traces so it is unknown where it is.' }] } }, examples: [{ kor: "주식과 코인으로 다들 돈을 쉽게 벌려고 하면서 공장에서 일할 사람이 없는 노동의 실종이 걱정됩니다.", eng: "I'm worried about the disappearance of labor, where there is no one to work in factories because everyone is trying to make money easily with stocks and coins." }], variants: ['노동의 실종'] },
                { term: '방치하다', mainDef: '방(放 놓을) + 치(置 둘) -> 망가지거나 위험한 것을 보고도 관심 없이 버려두거나 알아서 하도록 내버려 두다', translations: { en: { term: 'to neglect / to leave alone', mainDef: 'to leave something broken or dangerous without interest or let it be on its own even after seeing it.' } }, examples: [{ kor: "부서진 놀이터 그네를 고치지 않고 한 달째 그대로 방치해서 아이들이 놀다가 다칠까 무서워요.", eng: "I'm afraid children might get hurt playing because the broken playground swing has been neglected as it is for a month without being fixed." }], variants: ['방치하다', '방치하면'] },
                { term: '되새기다', mainDef: '과거의 중요한 말이나 잊지 말아야 할 아픈 기억을 마음속으로 몇 번이고 다시 생각하고 꾹꾹 눌러 담다', translations: { en: { term: 'to reflect on / to ruminate over', mainDef: 'to think over and press deeply into one\'s mind past important words or painful memories not to be forgotten, over and over again.' } }, examples: [{ kor: "할머니가 돌아가시기 전에 저에게 해주신 따뜻한 말씀을 눈을 감고 매일 밤 되새깁니다.", eng: "I close my eyes and ruminate over the warm words my grandmother gave me before she passed away every night." }], variants: ['되새기다', '되새겨야'] },
                { term: '재정 리스크', mainDef: '나라가 세금을 걷고 돈을 쓰는 살림살이(재정)에서 빚이 너무 많아져 나라 경제 전체가 망할 수도 있는 아주 큰 위험(리스크)', subDefs: [{ subTerm: '• 재정', subDef: '국가나 단체가 돈을 모으고 쓰는 일' }], translations: { en: { term: 'fiscal risk / financial risk', mainDef: 'a very big danger (risk) where the entire country\'s economy could collapse because debts become too large in the country\'s management of collecting taxes and spending money (finance).', subDefs: [{ term: 'finance / public finance', def: 'the act of a state or organization collecting and spending money.' }] } }, examples: [{ kor: "정부가 무리하게 다리와 건물을 짓다가 빚더미에 앉아 엄청난 재정 리스크에 빠지고 말았습니다.", eng: "The government forcefully built bridges and buildings, ending up in a mountain of debt and falling into a massive fiscal risk." }], variants: ['재정 리스크'] },
                { term: '가계금융복지조사', mainDef: '일반 가정(가계)의 은행 예금과 빚(금융)이 얼마인지, 그리고 삶의 수준(복지)이 어떤지 나라에서 매년 꼼꼼하게 물어보고 통계를 내는 조사', subDefs: [{ subTerm: '• 가계', subDef: '가(家 집) + 계(計 셈할) -> 한 집안의 경제 활동이나 살림살이' }], translations: { en: { term: 'Survey of Household Finances and Living Conditions', mainDef: 'a survey in which the country meticulously asks and compiles statistics every year about how much bank deposits and debts (finances) ordinary families (households) have and what their living standards (living conditions/welfare) are like.', subDefs: [{ term: 'household', def: 'the economic activity or living of a household.' }] } }, examples: [{ kor: "올해 통계청이 발표한 가계금융복지조사 결과를 보니 우리 동네 사람들의 빚이 작년보다 10%나 늘어났대요.", eng: "Looking at the results of the Survey of Household Finances and Living Conditions released by Statistics Korea this year, people in our neighborhood's debt increased by 10% compared to last year." }], variants: ['가계금융복지조사'] },
                { term: '순자산', mainDef: '내가 지금 가지고 있는 전체 재산(자산)에서 은행 빚이나 친구에게 빌린 돈을 100% 모조리 뺐을 때 진짜 내 손에 순수하게 남는 알짜배기 돈', subDefs: [{ subTerm: '• 순-', subDef: '다른 것이 전혀 섞이지 않고 그것만으로 된' }, { subTerm: '• 자산', subDef: '돈이나 집 같은 재산' }], translations: { en: { term: 'net worth / net assets', mainDef: 'the pure, essential money left truly in my hands when bank debts or money borrowed from friends are 100% totally subtracted from my total current property (assets).', subDefs: [{ term: 'net- / pure-', def: 'made only of that without anything else mixed.' }, { term: 'asset', def: 'property like money or house.' }] } }, examples: [{ kor: "통장에 1억 원이 있지만 대출 빚이 7천만 원이라 저의 진짜 순자산은 3천만 원뿐입니다.", eng: "I have 100 million won in my bank account, but my loan debt is 70 million won, so my real net worth is only 30 million won." }], variants: ['순자산'] },
                { term: '지니계수', mainDef: '어느 나라에서 부자와 가난한 사람의 돈 차이(불평등)가 얼마나 끔찍하게 심한지 0부터 1까지의 알기 쉬운 소수로 보여주는 성적표 같은 숫자 (1에 가까울수록 아주 나쁜 상태임)', translations: { en: { term: 'Gini coefficient', mainDef: 'a number like a report card showing in easy decimals from 0 to 1 how terribly severe the money difference (inequality) between the rich and poor is in a country (closer to 1 means a very bad state).' } }, examples: [{ kor: "남아메리카의 어떤 나라들은 소수의 부자들이 돈을 다 가져가서 지니계수가 0.5를 넘어갈 정도로 사회가 불안합니다.", eng: "In some countries in South America, a few rich people take all the money, making the society so unstable that the Gini coefficient exceeds 0.5." }], variants: ['지니계수'] },
                { term: '사상 최고치', mainDef: '대한민국의 역사(사상)가 시작된 이래 어떤 기록이나 숫자가 한 번도 본 적 없을 만큼 가장 높이 올라간 1등 기록(최고치)', subDefs: [{ subTerm: '• 사상', subDef: '사(史 역사) + 상(上 위) -> 역사가 시작된 이래' }, { subTerm: '• -치', subDef: '치(値 값) -> 셈하여 나온 값이나 수' }], translations: { en: { term: 'all-time high / highest level in history', mainDef: 'the highest 1st place record (highest value) where a record or number has gone up higher than ever seen since the history (in history) of the Republic of Korea began.', subDefs: [{ term: 'historically / all-time', def: 'since history began.' }, { term: '-value', def: 'a value or number obtained by calculating.' }] } }, examples: [{ kor: "올여름 에어컨 사용이 너무 많아져서 어제 하루 동안 나라 전체에서 쓴 전력량이 사상 최고치를 찍었어요.", eng: "Because air conditioner use increased so much this summer, the amount of electricity used by the whole country yesterday hit an all-time high." }], variants: ['사상 최고치', '사상'] },
                { term: '부동산 자금', mainDef: '빌딩을 짓거나 아파트를 사고파는 것처럼 움직이지 않는 큰 재산(부동산) 시장에서 굴러가며 쓰이는 엄청나게 큰돈(자금)', subDefs: [{ subTerm: '• 부동산', subDef: '부(不 아닐) + 동(動 움직일) + 산(産 재산) -> 땅이나 건물처럼 움직여서 옮길 수 없는 재산' }], translations: { en: { term: 'real estate funds', mainDef: 'a tremendously large amount of money (funds) rolling and used in the market of immovable large property (real estate) like building buildings or buying and selling apartments.', subDefs: [{ term: 'real estate', def: 'property that cannot be moved and relocated, like land or buildings.' }] } }, examples: [{ kor: "부자들이 아파트를 사기 위해 은행에서 빼낸 막대한 부동산 자금이 서울 강남으로 전부 몰려들고 있습니다.", eng: "Massive real estate funds taken out of banks by the rich to buy apartments are all flocking to Gangnam, Seoul." }], variants: ['부동산 자금', '부동산'] },
                { term: '유도하다', mainDef: '유(誘 달래다/꾈) + 도(導 이끌) -> 사람이나 돈의 흐름을 내가 짠 계획이나 좋은 목적지가 있는 방향으로 살살 꾀어서 이끌고 가다', translations: { en: { term: 'to induce / to guide', mainDef: 'to gently coax and lead the flow of people or money in the direction of one\'s plan or a good destination.' } }, examples: [{ kor: "경찰관 아저씨는 친절하게 웃으며 길 잃은 어린아이를 따뜻한 파출소 안으로 안전하게 유도했습니다.", eng: "The police officer smiled kindly and safely guided the lost child into the warm police substation." }], variants: ['유도하다', '유도하겠다”고'] },

            { id: 4, questionKor: "주가 지수 상승이 투자와 고용을 통해 실물 경제로 이어지지 않고, 기업 내부 유보나 주주 환원에 머무는 구조가 고착화됐다는 주장에 동의해요? 그렇다면 그 이유는 무엇일까요?", questionEng: "Do you agree with the argument that the rise in stock market indices is failing to flow into the real economy through investment and employment, and is instead becoming entrenched in a structure where it remains as corporate internal reserves or shareholder returns? If so, what do you think is the reason?", vocab: [{ term: "주가 지수", def: "주식 시장 전체 가격의 오르내리는 흐름이나 상태를 알아보기 쉽게 숫자로 나타낸 것." }, { term: "실물 경제", def: "주식이나 금융처럼 숫자로 거래되는 것이 아니라 눈에 보이는 재화나 서비스를 직접 사고파는 실제 활동." }, { term: "내부 유보", def: "회사가 벌어들인 돈을 밖으로 배분하지 않고 회사 금고에 저축하여 미루어 두는 것." }, { term: "주주 환원", def: "회사가 벌어들인 이익을 회사의 주인인 주주들에게 배당금 등 혜택으로 되돌려주는 것." }, { term: "고착화되다", def: "어떤 불균형 상태가 딱딱하게 굳어져서 더 이상 나아지지 않고 변하지 않게 되다." }] },
            { id: 5, questionKor: "증시가 실물 경제의 ‘선행 지표’이지 ‘생활 지표’가 아니라면, 코스피와 같은 주가 지수는 누구를 위한 것일까요? 또는 누구를 위한 것이어야 할까요?", questionEng: "If the stock market is a 'leading indicator' of the real economy rather than a 'lifestyle indicator', who are stock market indices like KOSPI actually for? Or rather, who should they be for?", vocab: [{ term: "선행 지표", def: "실물 경제나 생활이 변하기 전에 시간상으로 앞서 경제의 앞으로 변화 방향을 알려주는 수치." }, { term: "생활 지표", def: "일반 사람들의 일상생활이나 삶의 질이 지금 구체적으로 어느 정도인지를 피부로 와닿게 생생하게 보여주는 기준 수치." }] },
            { id: 6, questionKor: "자본시장 활성화가 필요한 이유는 무엇일까요? 그리고 그 역할을 정부가 맡아야 한다고 생각해요?", questionEng: "What is the reason why vitalization of the capital market is necessary? And do you think the government should take on that role?", vocab: [{ term: "자본시장 활성화", def: "자본이 거래되는 시장에 참여와 수요가 늘어나고 막혀있던 돈이 잘 돌아 전반적으로 활발해지는 현상." }] },
            { id: 7, questionKor: "한 전문가는 ‘감세나 규제 철폐가 소액주주도, 대주주도, 고용도 다 살리는 최선의 방안'이라고 주장해요. 반면, 다른 전문가는 '기업에 세금을 깎아주면 투자와 고용이 늘어난다는 낙수효과가 근거 없는 주장’이라고 비판해요. 여러분은 어느 쪽의 논리가 더 설득력 있다고 생각해요?", questionEng: "One expert argues that 'tax cuts and deregulation are the best solution to save minority shareholders, major shareholders, and employment alike.' Meanwhile, another expert criticizes this, stating that 'the trickle-down effect—the idea that reducing corporate taxes increases investment and jobs—is a baseless claim.' Which side's logic do you find more convincing?", vocab: [{ term: "감세", def: "나라에서 거두는 세금을 정책적으로 일정 부분 줄여주거나 금액 자체를 깎아주는 것." }, { term: "규제 철폐", def: "기업이나 개인이 자유롭게 일하도록 묶여있던 여러 낡은 법이나 막힌 규칙을 완전히 없애는 일." }, { term: "소액주주", def: "큰돈이 아니라 적은 돈의 주식을 조금만 가지고 있는 평범한 회사 주주." }, { term: "대주주", def: "투자 회사나 거부 등 회사의 주식을 가장 많이 가지고 있어 회사 중요 결정에 힘이 매우 강력한 진짜 주인급 주주." }, { term: "낙수효과", def: "위에서 물방울이 아래로 떨어지듯, 큰 기업이나 부자가 먼저 막대한 돈을 번 뒤 넘쳐서 나오는 혜택이 모여 결국 서민들에게 골고루 돌아간다는 이론." }] },
            { id: 8, questionKor: "자본 소득에 과세를 하면 투자 심리가 위축되서 자본시장이 하락한다는 주장에 동의해요? 아니면 투자 결정은 세금보다는 미래 수익 전망에 의해 더 크게 좌우되기 때문에 기업 가치가 유지된다면 세금에 상관없이 사람들이 투자할 거라고 생각해요?", questionEng: "Do you agree with the argument that taxing capital income will shrink investment sentiment and cause the capital market to fall? Or do you think that because investment decisions are dictated more by future profit prospects than taxes, people will continue to invest regardless of taxes as long as corporate value is maintained?", vocab: [{ term: "과세", def: "국가가 정해진 법에 의해 소득이 생긴 국민이나 법인에게 세금을 내도록 부과하는 것." }, { term: "투자 심리가 위축되다", def: "경제의 알 수 없는 미래나 불확실성에 잃을까 두려워, 선뜻 돈을 굴리고 투자하려는 마음(심리)이 줄어들고 오그라드는 현상." }, { term: "미래 수익 전망", def: "지금부터 시간이 더 멀리 흐르고 난 후 과연 얼마를 이익으로 거둬들일 수 있을지 다각도로 깊게 내다보는 눈이나 예측." }, { term: "좌우하다", def: "자기 마음대로 주도해서 이쪽 저쪽으로 이끌고 가거나 사업 등의 큰 결과에 아주 독보적이고 강력한 영향을 주어 판가름 지어버리다." }] },
            { id: 9, questionKor: "자본 소득에 대한 감세가 노동으로 돈을 벌려고 하는 동기를 감소시켜 '노동의 가치’를 훼손한다는 주장에 동의해요? 아니면, 노동의 가치는 자본 소득에 대한 감세와 상관없이 임금이 상승하고 노동 조건이 개선되는 한 유지된다고 생각해요?", questionEng: "Do you agree with the argument that tax cuts on capital income reduce the motivation to earn money through labor, thereby undermining the 'value of labor'? Or do you believe that the value of labor is maintained as long as wages rise and working conditions improve, regardless of tax cuts on capital income?", vocab: [{ term: "노동의 가치", def: "직접 땀 흘려 육체적, 정신적으로 치열하게 일하는 것의 소중함과 거기서 만들어내는 빛나는 중요성과 정당한 대우 그 자체." }, { term: "훼손하다", def: "가치가 훌륭한 권위나 명예, 혹은 완전한 사물의 상태가 누군가의 험집 내기로 인해 크게 망가뜨려져 흠이 나는 것." }, { term: "자본 소득", def: "본인이 노동을 구태여 하지 않음에도 오로지 굴리는 재산이나, 예금 은행, 건물 등(자본)이 이자나 월세를 창출해 내 수중으로 안기는 일종의 재물 수입." }, { term: "노동 조건이 개선되다", def: "일하는 사람과 사장 간 계약된 임금, 휴게 시간, 비위생적인 공장 등 부족한 여러 물리적 환경(노동 조건)이 더 좋게 고쳐지는 현상." }] },
            { id: 10, questionKor: "자본시장 활성화를 위해서 ‘감세 및 규제 철폐’가 필요하다는 입장과 ‘과세를 통해 부의 재분배’가 필요하다는 입장이 대립하고 있어요. 이 두 관점이 양립할 수 있는 지점이 있다고 생각해요? 또는 제3의 방법이 있다고 생각해요?", questionEng: "There is a clash between the position that 'tax cuts and deregulation' are necessary to vitalize the capital market, and the position that 'redistribution of wealth through taxation' is necessary. Do you think there is a middle ground where these two perspectives can coexist? Or do you think there is a third way?", vocab: [{ term: "부의 재분배", def: "재물이 집중된 부자들에게 조세 정책으로 세금을 더 걷어 살기 팍팍한 사람들에게 나누어 전체적으로 한 쪽으로 무겁게 쏠린 돈이나 재산(부)을 사회 곳곳에 공평하게 돌려주는 시스템." }, { term: "양립하다", def: "너무 달라서 충돌하고 대립할 게 뻔해 보이는 두 개의 시각이나 주장이, 타협하거나 흡수되지 않은 채 서로 마주보며 팽팽히 동시에 버티고 서 있는 모습." }, { term: "제 3의 방법", def: "이리저리 싸우며 서로의 제 몫만 다투는 기존의 진부한 A 방식 또는 B 방식 말고, 다른 곳에서 상상력을 발휘해 전혀 다르고 참신한 각도에서 문제를 꿰뚫고 갈등을 풀기 위해 가져온 새로운 해결책." }] }
        ];

        const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
        const qs  = (sel, root) => (root || document).querySelector(sel);
        const qsa = (sel, root) => Array.from((root || document).querySelectorAll(sel));
        const viewRoot = () => document.getElementById('view-root');

        // ---------- 1. 아이콘 ----------
        const ICON = {
            home:'<rect x="3" y="3" width="18" height="18" rx="0" ry="0"/><path d="M3 9h18"/><path d="M9 21V9"/>',
            learn:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
            vocab:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
            quiz:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
            discuss:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
            openbook:'<path d="M2 6 C2 3 8 2 12 6 C16 2 22 3 22 6 V20 C22 17 16 16 12 20 C8 16 2 17 2 20 Z"/><path d="M12 6 V20"/>',
            arrowRight:'<path d="M5 12h14M12 5l7 7-7 7"/>',
            menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
            externalLink:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
            sparkles:'<path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>',
            highlighter:'<path d="M9 11l-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
            eraser:'<path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/>',
            search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
            close:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
        };
        const svgIcon = (name, cls, opts) => {
            opts = opts || {};
            const fill = opts.fill || 'none';
            const stroke = opts.fill === 'currentColor' ? '' : 'stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"';
            const style = opts.style ? ` style="${opts.style}"` : '';
            return `<svg viewBox="0 0 24 24" fill="${fill}" ${stroke} class="${cls || ''}"${style}>${ICON[name]}</svg>`;
        };
        const NAV_ITEMS = [
            { id: 'home', label: '시작 페이지', icon: 'home' },
            { id: 'reading', label: '읽기 자료', icon: 'learn' },
            { id: 'vocab', label: '핵심 어휘', icon: 'vocab' },
            { id: 'quiz', label: '내용 확인 퀴즈', icon: 'quiz' },
            { id: 'discuss', label: '생각해 보기', icon: 'discuss' }
        ];

        // ---------- 2. 공용 헬퍼 ----------
        const getContainerOffset = (root, node, offset) => {
            let total = 0; const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) { if (walker.currentNode === node) return total + offset; total += walker.currentNode.length; }
            return total;
        };
        const getPopupLeftPos = (x, width) => {
            const pad = 20, ww = window.innerWidth; let left = x - width / 2;
            if (left < pad) return pad;
            if (left + width > ww - pad) return ww - width - pad;
            return left;
        };
        const callGeminiWithBackoff = async (payload) => {
            const apiKey = ''; const apiUrl = `${CONFIG.GEMINI_API_URL}?key=${apiKey}`; const delays = CONFIG.API_RETRY_DELAYS;
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const r = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!r.ok) {
                        const t = await r.text();
                        if (r.status === 400 || r.status === 401 || r.status === 403) throw new Error(`API 인증/요청 오류(HTTP ${r.status}): ${t}`);
                        if (r.status === 429 || r.status >= 500) throw new Error(`Server error: ${r.status} - ${t}`);
                        throw new Error(`API error: ${r.statusText} - ${t}`);
                    }
                    return await r.json();
                } catch (e) {
                    if (i === delays.length || e.message.includes('API 인증/요청 오류')) throw e;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };
        const getAIDictionaryData = async (term, contextData) => {
            const articleText = contextData.map(p => p.text).filter(Boolean).join('\n');
            const systemPrompt = `당신은 친절한 한국어 선생님입니다. '본문 맥락'을 참고하여 '검색어'를 '-요' 체로 간결히 설명해주세요.\n\n본문 맥락:\n---${articleText}\n---`;
            const payload = { contents: [{ parts: [{ text: `검색어: "${term}"` }] }], systemInstruction: { parts: [{ text: systemPrompt }] }, generationConfig: { responseMimeType: 'application/json' } };
            const result = await callGeminiWithBackoff(payload);
            return JSON.parse(result.candidates[0].content.parts[0].text);
        };
        const transBtn = (action, isShowing, extra) =>
            `<button type="button" data-action="${action}" class="inline-flex items-center gap-1 text-[8px] font-bold font-sans uppercase tracking-widest text-gray-500 opacity-40 hover:opacity-100 transition-opacity cursor-pointer border-none p-0 bg-transparent ${extra || ''}">${svgIcon('externalLink', 'w-2.5 h-2.5')}${isShowing ? 'Hide Eng' : 'Eng'}</button>`;
        const levelBadgeHTML = (code) => {
            const d = LEVEL_DEFINITIONS[code] || { title: 'Unknown' };
            return `<div class="flex items-center gap-2 border border-black px-2 py-0.5 rounded-none"><span class="text-xs font-bold font-sans text-black print:text-[12px]">${esc(code)}</span><div class="w-px h-3 bg-gray-300"></div><span class="text-xs text-gray-500 font-sans print:text-[12px]">${esc(d.title)}</span></div>`;
        };

        // ---------- 3. 전역 상태 ----------
        const app = { activeTab: 'home', userLevel: 'C2', showVocab: false, headerExpanded: true };

        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }

        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------

            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            const a = e.target.closest('[data-action]');
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const i = +a.dataset.idx; reading.trans[i] = !reading.trans[i]; rerenderReadingBlocks(); }
                    return;
                }
            } else if (tab === 'vocab') {
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            } else if (tab === 'quiz') {
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => q.id === qid); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const t = st.input.trim(); const ok = t === quiz.answer || (quiz.altAnswer && t === quiz.altAnswer); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = quiz.answer; st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'trans') { st.trans = !st.trans; rerenderQuizQ(qid); }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) {
                const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id];
                const wasDisabled = !st.text.trim(); st.text = e.target.value;
                if (wasDisabled !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } }
            }
        });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            reading.dictLoading = true; reading.dictResult = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm, currentReading().content); }
            catch (err) { reading.dictResult = { term: reading.dictTerm, definition: '검색 중 오류가 발생했습니다. (API 키 없음/요청 오류)', example: '' }; }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
