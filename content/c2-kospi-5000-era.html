                { term: '미취업', mainDef: '미(未 아닐) + 취(就 나아갈) + 업(業 일) -> 학교를 졸업하고 일할 준비가 되었는데도 아직 돈을 버는 직장을 구하지 못해 취직이 안 된 답답한 상태', subDefs: [{ subTerm: '• 미-', subDef: '미(未 아닐) -> 아직 어떤 일이나 상태에 다다르지 못했다는 뜻을 앞에 더해주는 말' }], translations: { en: { term: 'unemployment / non-employment', mainDef: 'a frustrating state of not being able to find a money-making job and not being employed even though one has graduated from school and is ready to work.', subDefs: [{ term: 'un- / non-', def: 'a prefix meaning not yet having reached a certain event or state.' }] } }, examples: [{ kor: "오랫동안 미취업 상태로 지내면서 매일 도서관에서 이력서만 쓰는 청년들의 마음은 아주 무겁습니다.", eng: "The hearts of young people who have stayed in an unemployed state for a long time and only write resumes at the library every day are very heavy." }], variants: ['미취업', '미취업자'] },
                { term: '이익을 침해하다', mainDef: '다른 사람이나 다른 회사가 정당하게 가져가야 할 이익이나 소중한 권리를 억지로 빼앗거나 해롭게 건드려 피해를 주다', subDefs: [{ subTerm: '• 침해하다', subDef: '침(侵 침노할) + 해(害 해할) -> 남의 땅이나 권리를 허락 없이 침범하여 손해를 끼치다' }], translations: { en: { term: 'to infringe on interests', mainDef: 'to forcefully take away or harmfully touch the interests or precious rights that another person or company rightfully deserves to have, causing damage.', subDefs: [{ term: 'to infringe / violate', def: 'to invade another\'s land or rights without permission and cause loss.' }] } }, examples: [{ kor: "큰 마트가 동네 구석구석에 생기면 작은 동네 슈퍼마켓들의 이익을 침해할 수 있어서 제한이 필요합니다.", eng: "If large marts appear in every corner of the neighborhood, they can infringe on the interests of small neighborhood supermarkets, so restrictions are needed." }], variants: ['이익을 침해하다', '이익을 침해하는'] },
                { term: '이자 비용', mainDef: '은행이나 남에게 돈을 빌려 쓴 대가로, 원래 갚아야 할 원금 외에 약속한 비율만큼 추가로 더 내야 하는 웃돈', translations: { en: { term: 'interest expense', mainDef: 'the premium money that must be paid additionally by an agreed percentage in addition to the principal to be repaid, in return for borrowing money from a bank or others.' } }, examples: [{ kor: "사업이 힘들어져서 매달 은행에 내야 하는 이자 비용조차 감당하기 벅찬 상황입니다.", eng: "Business has become difficult, so it is a situation where even affording the interest expense that must be paid to the bank every month is overwhelming." }], variants: ['이자 비용'] },
                { term: '재정적자', mainDef: '나라의 전체 살림살이(재정)에서, 세금으로 들어온 수입보다 나라가 다리를 놓거나 복지에 쓴 지출이 훨씬 더 많아서 나라 통장에 생긴 커다란 구멍이나 빚(적자)', subDefs: [{ subTerm: '• 재정', subDef: '재(財 재물) + 정(政 정사) -> 국가나 큰 단체가 살림을 꾸려 나가는 돈의 수입과 지출 상태' }, { subTerm: '• 적자', subDef: '적(赤 붉을) + 자(字 글자) -> 지출이 수입보다 많아서 손해를 본 것 (옛날에 손해 본 금액을 붉은색 잉크로 장부에 적은 데서 유래)' }], translations: { en: { term: 'fiscal deficit / budget deficit', mainDef: 'a large hole or debt (deficit) in the country\'s bank account resulting from the country\'s expenditure on building bridges or welfare being much greater than the income from taxes in the country\'s overall economy (finance).', subDefs: [{ term: 'finance', def: 'the state of income and expenditure of money with which a country or large organization manages its living.' }, { term: 'deficit', def: 'suffering a loss because expenditure is greater than income (originates from writing loss amounts in red ink in ledgers in the past).' }] } }, examples: [{ kor: "올해 코로나를 극복하느라 돈을 너무 많이 써서 국가의 재정적자가 심각한 수준에 이르렀습니다.", eng: "Because we spent too much money overcoming COVID-1e this year, the national fiscal deficit has reached a serious level." }], variants: ['재정적자'] },
                { term: '최소화하다', mainDef: '최(最 가장) + 소(小 적을) + 화(化 될) -> 사고 피해나 낭비되는 돈 같은 나쁜 것을 할 수 있는 한 가장 작고 적게 줄여서 만들다', translations: { en: { term: 'to minimize', mainDef: 'to reduce bad things like accident damage or wasted money to the smallest and least amount possible.' } }, examples: [{ kor: "지진이 났을 때 책상 밑으로 숨으면 머리를 다치는 피해를 최소화할 수 있습니다.", eng: "If you hide under a desk during an earthquake, you can minimize the damage of hitting your head." }], variants: ['최소화하다', '최소화해'] },
                { term: '국채 발행', mainDef: '나라에 돈이 부족할 때 국민들이나 외국 사람들에게 돈을 빌리기 위해서 "언제까지 이자를 쳐서 갚겠습니다"라고 적은 정부 이름의 증서(국채)를 새로 찍어 내어(발행) 파는 일', subDefs: [{ subTerm: '• 국채', subDef: '국(國 나라) + 채(債 빚) -> 나라가 국민이나 외국에 빚을 지고 발행하는 채권' }, { subTerm: '• 발행', subDef: '발(發 필) + 행(行 다닐) -> 책, 돈, 주식, 채권 등을 찍어 내어 세상에 널리 펴냄' }], translations: { en: { term: 'issuance of government bonds', mainDef: 'the act of newly printing (issuing) and selling certificates in the government\'s name (government bonds) written "We will repay with interest by when" to borrow money from citizens or foreigners when the country is short of money.', subDefs: [{ term: 'government bond', def: 'a bond issued by a country in debt to its citizens or foreign countries.' }, { term: 'issuance', def: 'printing and widely distributing books, money, stocks, bonds, etc. to the world.' }] } }, examples: [{ kor: "정부는 도로를 건설할 돈을 모으기 위해 대규모 국채 발행을 결정했습니다.", eng: "The government decided on a large-scale issuance of government bonds to collect money to build roads." }], variants: ['국채 발행'] },
                { term: '자본시장 이자율', mainDef: '돈이 남는 사람과 돈이 필요한 사람이 만나 주식과 채권 등을 거래하는 거대한 자본시장에서, 돈을 빌리는 대가로 내야 하는 이자의 비율', subDefs: [{ subTerm: '• 이자율', subDef: '이(利 이로울) + 자(子 아들) + 율(率 비율) -> 빌려 쓴 원금에 대하여 내는 이자의 비율' }], translations: { en: { term: 'capital market interest rate', mainDef: 'the percentage of interest that must be paid in return for borrowing money in the huge capital market where people with surplus money and people needing money meet to trade stocks and bonds.', subDefs: [{ term: 'interest rate', def: 'the percentage of interest paid on the borrowed principal.' }] } }, examples: [{ kor: "자본시장 이자율이 훌쩍 뛰면서 대출을 받아 집을 산 서민들의 한숨이 깊어졌어요.", eng: "As the capital market interest rate jumped, the sighs of ordinary people who bought houses with loans deepened." }], variants: ['자본시장 이자율'] },
                { term: '법인세', mainDef: '개인이 아닌 주식회사처럼 법적으로 사람과 같은 권리를 인정받은 단체(법인)가 1년 동안 장사를 해서 벌어들인 이익금에 대해 국가에 내야 하는 세금', subDefs: [{ subTerm: '• 법인', subDef: '법(法 법) + 인(人 사람) -> 자연인(사람)은 아니지만 법에 의하여 사람처럼 권리를 가질 수 있는 자격을 부여받은 단체' }, { subTerm: '• -세', subDef: '세(稅 세금) -> 국가를 유지하기 위해 국민이나 기업이 의무적으로 내는 돈' }], translations: { en: { term: 'corporate tax', mainDef: 'a tax that an organization recognized legally with rights like a person (corporation), such as a joint-stock company, not an individual, must pay to the state on the profits earned from doing business for a year.', subDefs: [{ term: 'corporation / legal entity', def: 'an organization granted the qualification to have rights like a person by law, although not a natural person.' }, { term: '-tax', def: 'money that citizens or companies are obligated to pay to maintain the state.' }] } }, examples: [{ kor: "올해는 반도체 수출이 잘 돼서 삼성 같은 큰 회사가 나라에 내는 법인세가 아주 많이 늘어났습니다.", eng: "This year, semiconductor exports were good, so the corporate tax paid to the country by big companies like Samsung increased a lot." }], variants: ['법인세'] },
                { term: '재원', mainDef: '재(財 재물) + 원(源 근원) -> 나라 살림을 하거나 어떤 큰 사업을 추진하는 데 바탕이 되고 필요한 돈의 원천', translations: { en: { term: 'source of revenue / financial resources', mainDef: 'the source of money that becomes the foundation and is necessary for managing national affairs or pursuing a big business.' } }, examples: [{ kor: "아이들에게 무상 급식을 제공하려면 정부가 세금을 거둬 튼튼한 재원을 먼저 마련해야 합니다.", eng: "To provide free school meals to children, the government must first collect taxes to prepare strong financial resources." }], variants: ['재원'] },
                { term: '후안무치한 일', mainDef: '자기 잘못을 뻔히 알면서도 뉘우치지 않고 오히려 뻔뻔스럽고 부끄러움을 모르는 염치없는 행동', subDefs: [{ subTerm: '• 후안무치하다', subDef: '후(厚 두터울) + 안(顔 얼굴) + 무(無 없을) + 치(恥 부끄러울) -> 얼굴 가죽이 두꺼워 부끄러움이 없다' }], translations: { en: { term: 'shameless act', mainDef: 'a shameless behavior without knowing embarrassment and rather being brazen despite clearly knowing one\'s own fault.', subDefs: [{ term: 'to be shameless / brazen', def: 'the skin of the face is thick, so there is no shame.' }] } }, examples: [{ kor: "도둑질을 하고도 자기는 모르는 일이라며 화를 내는 것은 정말 후안무치한 일입니다.", eng: "Getting angry saying he doesn't know anything after stealing is a truly shameless act." }], variants: ['후안무치한 일'] },
                { term: '배당소득세 경감', mainDef: '주식에 투자해서 회사로부터 받은 배당금(배당소득)에 대해 정부에 내야 하는 세금(소득세)의 무거운 짐을 가볍게 줄여주는 것', subDefs: [{ subTerm: '• 배당', subDef: '회사의 이익을 주주에게 나누어 줌' }, { subTerm: '• 소득세', subDef: '소(所 바) + 득(得 얻을) + 세(稅 세금) -> 돈을 벌어들인 만큼 나라에 내는 세금' }, { subTerm: '• 경감', subDef: '경(輕 가벼울) + 감(減 덜) -> 부담이나 고통을 가볍게 덜어 줌' }], translations: { en: { term: 'reduction of dividend income tax', mainDef: 'lightening the heavy burden of the tax (income tax) that must be paid to the government on the dividends (dividend income) received from a company by investing in stocks.', subDefs: [{ term: 'dividend', def: 'distributing company profits to shareholders.' }, { term: 'income tax', def: 'tax paid to the country based on money earned.' }, { term: 'reduction / mitigation', def: 'lightening the burden or pain.' }] } }, examples: [{ kor: "정부가 주식 투자를 장려하기 위해 배당소득세 경감 대책을 발표하여 개미 투자자들이 기뻐하고 있습니다.", eng: "The government announced measures for the reduction of dividend income tax to encourage stock investment, making retail investors happy." }], variants: ['배당소득세 경감'] },
                { term: '조삼모사', mainDef: '조(朝 아침) + 삼(三 셋) + 모(暮 저녁) + 사(四 넷) -> 원숭이에게 도토리를 아침에 3개, 저녁에 4개 주겠다고 하니 화를 내다가 아침에 4개, 저녁에 3개 주겠다고 하니 기뻐했다는 옛날이야기에서 나온 말로, 당장 눈앞의 얕은 속임수로 남을 놀리거나 속이는 어리석은 짓을 뜻함', translations: { en: { term: 'deception by a trick / playing fast and loose', mainDef: 'derived from an old tale where monkeys were angry when told they\'d get 3 acorns in the morning and 4 in the evening, but happy when told 4 in the morning and 3 in the evening; meaning foolishly teasing or deceiving someone with immediate shallow tricks.' } }, examples: [{ kor: "상품 가격을 내린 척하면서 배송비를 똑같이 올려받는 것은 소비자를 우롱하는 조삼모사 상술입니다.", eng: "Pretending to lower the product price while raising the shipping fee by the exact same amount is a deception by a trick that mocks consumers." }], variants: ['조삼모사'] },
                { term: '규제 개혁', mainDef: '기업이 자유롭게 사업하지 못하게 막고 있는 낡은 법이나 쓸데없는 간섭(규제)을 더 좋고 자유로운 방향으로 완전히 뜯어고치는 일', subDefs: [{ subTerm: '• 규제', subDef: '규(規 법) + 제(制 절제할) -> 규칙이나 법으로 한계를 정하여 마음대로 하지 못하게 막음' }, { subTerm: '• 개혁', subDef: '개(改 고칠) + 혁(革 가죽) -> 나쁜 제도나 기구를 합법적으로 새롭게 고침' }], translations: { en: { term: 'regulatory reform', mainDef: 'the act of completely overhauling old laws or useless interference (regulations) that stop companies from doing business freely into a better and freer direction.', subDefs: [{ term: 'regulation', def: 'setting a limit with rules or laws to prevent acting freely.' }, { term: 'reform', def: 'legally newly fixing a bad system or organization.' }] } }, examples: [{ kor: "드론 배달 사업이 시작되려면 하늘을 나는 드론에 대한 오래된 법을 바꾸는 규제 개혁이 꼭 필요합니다.", eng: "For the drone delivery business to start, regulatory reform to change old laws about flying drones is absolutely necessary." }], variants: ['규제 개혁', '규제 개혁.'] },
                { term: '돈 한 푼 안 들다', mainDef: '무언가를 하는 데 있어서 내 주머니에서 돈이 아주 조금도 나가지 않고 공짜로 해결할 수 있다', subDefs: [{ subTerm: '• 푼', subDef: '예전에 쓰던 돈이나 물건을 세는 아주 작은 단위 (동전 한 개 정도의 가치)' }], translations: { en: { term: 'not to cost a single penny', mainDef: 'being able to solve something for free without any money going out of one\'s pocket to do something.', subDefs: [{ term: 'pun (penny)', def: 'a very small unit for counting money or goods used in the past (worth about one coin).' }] } }, examples: [{ kor: "이 앱은 공짜라서 외국어를 배우는 데 돈 한 푼 안 들어서 학생들에게 인기가 많아요.", eng: "This app is free, so it doesn't cost a single penny to learn a foreign language, making it popular among students." }], variants: ['돈 한 푼 안 드는', '돈 한 푼 안 들다'] },
                { term: '배후', mainDef: '배(背 등) + 후(後 뒤) -> 겉으로 드러나지 않은 뒷면이나, 어떤 범죄나 사건의 뒤에서 사람들을 몰래 조종하며 진짜 나쁜 짓을 꾸민 사람', translations: { en: { term: 'mastermind / behind the scenes', mainDef: 'the back side not exposed on the outside, or the person who secretly manipulated people behind a crime or incident and plotted the real bad deed.' } }, examples: [{ kor: "단순한 좀도둑인 줄 알았는데, 경찰 수사 결과 조직폭력배가 그 사건의 배후에 숨어 있었습니다.", eng: "I thought it was a simple petty thief, but police investigation revealed that a mobster was hiding behind the scenes of the incident." }], variants: ['배후', '배후에'] },
                { term: '기득권', mainDef: '기(旣 이미) + 득(得 얻을) + 권(權 권세) -> 어떤 개인이나 집단이 예전부터 이미 꽉 차지하고 있어서, 남에게 빼앗기기 싫어하는 당연한 권리나 이익', translations: { en: { term: 'vested interests / vested rights', mainDef: 'a natural right or interest that a certain individual or group has already firmly occupied from the past and hates to be taken away by others.' } }, examples: [{ kor: "의료 제도를 새롭게 고치려 할 때마다 낡은 기득권을 뺏기지 않으려는 사람들의 반대가 무척 심합니다.", eng: "Whenever trying to newly fix the medical system, the opposition from those who don't want to lose their old vested interests is very severe." }], variants: ['기득권'] },
                { term: '도사리다', mainDef: '뱀이나 호랑이 등이 위험하게 몸을 둥글게 감고 웅크려 있거나, 보이지 않는 어두운 곳에서 흉악한 마음이나 커다란 위험이 조용히 숨어 기다리고 있다', translations: { en: { term: 'to lurk / to coil up', mainDef: 'snakes or tigers dangerously coiling and crouching their bodies, or a wicked mind or great danger quietly hiding and waiting in an unseen dark place.' } }, examples: [{ kor: "깊고 캄캄한 숲속에는 어떤 위험이 도사리고 있을지 모르니 밤에는 절대 혼자 가지 마세요.", eng: "Never go alone at night because you don't know what danger might be lurking in the deep, dark forest." }], variants: ['도사리다', '도사리고'] },
                { term: '표를 의식하다', mainDef: '정치인이나 후보자가 선거를 앞두고 사람들의 투표(표)를 얻기 위해 그들의 눈치를 보며 인기 있는 말이나 행동만 하려고 신경 쓰다', subDefs: [{ subTerm: '• 표', subDef: '선거할 때 찬성이나 반대를 표시하는 투표용지' }, { subTerm: '• 의식하다', subDef: '의(意 뜻) + 식(識 알) -> 어떤 일이나 사람에 대해 특별히 생각하며 마음속으로 신경 쓰다' }], translations: { en: { term: 'to be conscious of votes', mainDef: 'politicians or candidates caring about and walking on eggshells to get people\'s votes before an election, trying to say or do only popular things.', subDefs: [{ term: 'vote / ticket', def: 'a ballot paper indicating approval or opposition in an election.' }, { term: 'to be conscious of', def: 'to specially think about and mentally care about a matter or person.' }] } }, examples: [{ kor: "국회의원이 나중에 있을 선거의 표를 의식해서 무리하게 동네에 지하철역을 짓겠다고 약속했어요.", eng: "Conscious of votes in the upcoming election, the assemblyman unreasonably promised to build a subway station in the neighborhood." }], variants: ['표를 의식하다', '표를 의식하는'] },
                { term: '정치권', mainDef: '정(政 정사) + 치(治 다스릴) + 권(圈 우리) -> 국회의원이나 정당처럼 나라의 법을 만들고 정치를 업으로 삼아 활동하는 사람들의 집단이나 그들이 일하는 세계', translations: { en: { term: 'political circles / political arena', mainDef: 'a group of people, like assemblymen or political parties, who make the country\'s laws and do politics as a profession, or the world they work in.' } }, examples: [{ kor: "최근 물가가 너무 많이 올라서 시민들이 고통받자 정치권에서 다급하게 대책 회의를 열었습니다.", eng: "As citizens suffered because prices rose too much recently, political circles urgently held a countermeasure meeting." }], variants: ['정치권'] },
                { term: '혁파하다', mainDef: '혁(革 가죽/고칠) + 파(罷 마칠) -> 불합리하고 낡은 법이나 나쁜 제도를 뿌리째 완전히 깨뜨려 없애고 올바른 방향으로 새롭게 뜯어고치다', translations: { en: { term: 'to abolish and reform / to dismantle', mainDef: 'to completely break down and eliminate irrational and old laws or bad systems from the root and newly revamp them in the right direction.' } }, examples: [{ kor: "새로 부임한 교장 선생님은 학교에 있던 쓸데없는 옛날 규칙들을 모두 혁파하여 학생들의 자유를 주셨습니다.", eng: "The newly appointed principal abolished all the useless old rules in the school and gave the students freedom." }], variants: ['혁파하다', '혁파하지'] },
                { term: '정치를 의식하다', mainDef: '옳고 그름을 따지기보다는 나라를 다스리는 일, 권력 싸움, 또는 선거에서의 자신의 인기(정치)를 마음속으로 크게 신경 쓰며 눈치를 보고 행동하다', subDefs: [{ subTerm: '• 의식하다', subDef: '어떤 일이나 사람에 대해 특별히 신경 쓰고 마음에 두다' }], translations: { en: { term: 'to be politically conscious', mainDef: 'rather than weighing right and wrong, heavily caring about and acting based on matters of governing the country, power struggles, or one\'s popularity in elections (politics) in mind.', subDefs: [{ term: 'to be conscious of', def: 'to specially care about and keep a matter or person in mind.' }] } }, examples: [{ kor: "시장은 너무 정치를 의식하다 보니, 올바른 판단을 내리지 못하고 계속 눈치만 보고 있어요.", eng: "Because the mayor is too politically conscious, he cannot make a correct judgment and keeps walking on eggshells." }], variants: ['정치를 의식하다', '정치를 의식하는'] },
                { term: '역대 대통령', mainDef: '과거부터 지금까지 대대로 나라를 다스리며 자리를 이어 온 옛날의 모든 대통령들', subDefs: [{ subTerm: '• 역대', subDef: '역(歷 지낼) + 대(代 대신) -> 대대로 이어져 내려온 지난 여러 시대' }], translations: { en: { term: 'past presidents', mainDef: 'all past presidents who have successively ruled the country and held the position from the past to the present.', subDefs: [{ term: 'successive generations', def: 'past multiple eras that have been handed down from generation to generation.' }] } }, examples: [{ kor: "미국의 역대 대통령들의 얼굴은 바위산에 아주 거대하게 조각되어 관광객들이 많이 찾습니다.", eng: "The faces of past US presidents are carved very hugely on a rocky mountain, attracting many tourists." }], variants: ['역대 대통령', '역대'] },
                { term: '통치를 하다', mainDef: '통(統 거느릴) + 치(治 다스릴) -> 왕이나 대통령 같은 국가의 최고 책임자가 권력을 가지고 나라와 백성을 보살피고 이끌어 가다', translations: { en: { term: 'to rule / to govern', mainDef: 'for the highest head of state, like a king or president, to hold power, care for, and lead the country and its people.' } }, examples: [{ kor: "세종대왕은 백성을 진심으로 사랑하는 어진 마음으로 조선을 통치한 훌륭한 왕이었습니다.", eng: "King Sejong was a great king who ruled Joseon with a benevolent heart that truly loved his people." }], variants: ['통치를 하다', '통치를 하는'] },
                { term: '여의도', mainDef: '대한민국의 국회의사당 건물이 있는 서울의 작은 섬 이름으로, 뉴스에서는 주로 국회의원들이 모여 있는 \'한국의 국회나 정치권\'을 은유적으로 부를 때 쓰는 말', translations: { en: { term: 'Yeouido (symbol for National Assembly/Politics)', mainDef: 'the name of a small island in Seoul where the Republic of Korea\'s National Assembly building is located; in news, often used metaphorically to call \'Korea\'s National Assembly or political circles\' where lawmakers gather.' } }, examples: [{ kor: "국민들의 삶이 힘든데도 여의도는 매일매일 국회의원들의 자기 당 이익 싸움으로 시끄럽습니다.", eng: "Even though the people's lives are hard, Yeouido is noisy every day with lawmakers fighting for their own party's interests." }], variants: ['여의도'] },
                { term: '척을 질 각오', mainDef: '상대방과 크게 싸워서 미워하고 원수(척)가 되어 영영 사이가 나빠지더라도 그 일을 하겠다고 단단히 결심하고 대비하는 굳은 마음', subDefs: [{ subTerm: '• 척을 지다', subDef: '척(慼 근심) -> 서로 미워하여 깊은 원한을 가지고 원수가 되다' }, { subTerm: '• 각오', subDef: '각(覺 깨달을) + 오(悟 깨달을) -> 앞으로 닥칠 힘들고 어려운 일에 대해 마음을 단단히 먹고 준비함' }], translations: { en: { term: 'resolve to make an enemy', mainDef: 'a firm mind resolved and prepared to do the task even if it means fighting greatly with the other party, hating them, and becoming an enemy (chuck) and having a permanently bad relationship.', subDefs: [{ term: 'to make an enemy', def: 'to hate each other, hold a deep grudge, and become enemies.' }, { term: 'resolution / readiness', def: 'firming up one\'s mind and preparing for upcoming hard and difficult things.' }] } }, examples: [{ kor: "형사는 조폭 두목과 척을 질 각오를 하고 목숨을 걸고 혼자서 조직의 비밀 아지트로 쳐들어갔습니다.", eng: "Resolved to make an enemy of the mob boss, the detective risked his life and raided the gang's secret hideout alone." }], variants: ['척을 질 각오'] },
                { term: '성과를 거두다', mainDef: '성(成 이룰) + 과(果 열매) -> 어떤 일을 열심히 계획하고 땀 흘려 노력해서 보람찬 좋은 결과나 칭찬받을 만한 실적을 드디어 만들어 내다', translations: { en: { term: 'to achieve results / to reap fruits', mainDef: 'to finally create rewarding good results or praiseworthy achievements by planning hard and sweating for a certain task.' } }, examples: [{ kor: "오랜 시간 포기하지 않고 밤낮으로 공부한 끝에 마침내 이번 시험에서 1등이라는 놀라운 성과를 거두었습니다.", eng: "After studying day and night without giving up for a long time, I finally achieved the amazing result of coming in first in this exam." }], variants: ['성과를 거두다', '성과를 거둘'] },
                { term: '대형 유통업체', mainDef: '이마트나 코스트코처럼 물건을 공장에서 아주 많이 싸게 떼어와서 커다란 매장에 쌓아두고 일반 사람들에게 대규모로 파는 거대한 회사', subDefs: [{ subTerm: '• 유통', subDef: '유(流 흐를) + 통(通 통할) -> 재화나 물건이 생산자에서 소비자에게로 막힘없이 흘러감' }, { subTerm: '• 업체', subDef: '업(業 일) + 체(體 몸) -> 이익을 목적으로 어떤 사업을 전문적으로 영위하는 기업이나 회사' }], translations: { en: { term: 'large distributor / retail giant', mainDef: 'a huge company like E-mart or Costco that buys a lot of goods cheaply from factories, stacks them in large stores, and sells them to the general public on a large scale.', subDefs: [{ term: 'distribution', def: 'goods or products flowing smoothly from producers to consumers.' }, { term: 'company/enterprise', def: 'a company or firm that professionally runs a business for profit.' }] } }, examples: [{ kor: "동네 골목에 대형 유통업체의 커다란 슈퍼가 생기면서, 작게 구멍가게를 하던 상인들이 장사가 안 되어 울상을 짓고 있습니다.", eng: "As a large distributor's big supermarket opened in the neighborhood alley, merchants running small mom-and-pop stores are crying because business is bad." }], variants: ['대형 유통업체'] },
                { term: '시총', mainDef: '‘시가총액’의 줄임말로, 주식 시장에 있는 어떤 회사의 전체 주식 개수와 현재 주식 가격을 곱해서 다 합친 돈 (회사가 얼마나 크고 가치 있는지를 나타내는 아주 중요한 잣대)', translations: { en: { term: 'market cap', mainDef: 'abbreviation for "market capitalization," the total money calculated by multiplying the total number of a company\'s shares in the stock market by the current stock price (a very important yardstick indicating how big and valuable the company is).' } }, examples: [{ kor: "아이폰을 만드는 애플은 전 세계에서 시총이 가장 큰 어마어마한 회사로 손꼽힙니다.", eng: "Apple, which makes the iPhone, is considered a massive company with the largest market cap in the whole world." }], variants: ['시총'] }
            ],
            3: [
                { term: '금융 과세', mainDef: '주식이나 예금 같은 금융 거래로 얻은 이익에 세금을 매기는 일', subDefs: [{ subTerm: '• 금융', subDef: '금(金 돈) + 융(融 통할) -> 돈을 빌려주고 빌리며 시장에서 도는 흐름' }, { subTerm: '• 과세', subDef: '과(課 매길) + 세(稅 세금) -> 세금을 내라고 정함' }], translations: { en: { term: 'financial taxation', mainDef: 'imposing taxes on profits gained from financial transactions like stocks or deposits.', subDefs: [{ term: 'finance', def: 'the flow of lending and borrowing money in the market.' }, { term: 'taxation', def: 'imposing a tax.' }] } }, examples: [{ kor: "이자를 많이 받으면 은행에서 금융 과세로 세금을 떼어갑니다.", eng: "If you receive a lot of interest, the bank deducts taxes through financial taxation." }], variants: ['금융 과세'] },
                { term: '후퇴', mainDef: '후(後 뒤) + 퇴(退 물러날) -> 뒤로 물러나거나 이전보다 나빠짐', translations: { en: { term: 'retreat / regression', mainDef: 'stepping back or becoming worse than before.' } }, examples: [{ kor: "비바람이 너무 거세서 우리 팀은 산을 오르지 못하고 후퇴했어요.", eng: "The wind and rain were so strong that our team couldn't climb the mountain and retreated." }], variants: ['후퇴'] },
                { term: '코 앞에 다가오다', mainDef: '시간이나 거리가 아주 가깝게 다가옴', translations: { en: { term: 'to approach right around the corner', mainDef: 'for time or distance to approach very closely.' } }, examples: [{ kor: "중요한 시험이 코앞에 다가와서 밤늦게까지 공부하고 있어요.", eng: "The important exam is right around the corner, so I am studying late into the night." }], variants: ['코 앞에 다가오다', '코 앞에 다가온'] },
                { term: '자본시장', mainDef: '자(資 바탕) + 본(本 뿌리) -> 기업이 사업을 하기 위해 필요한 큰돈을 주식이나 채권으로 사고파는 시장', translations: { en: { term: 'capital market', mainDef: 'a market where large sums of money needed for businesses are traded via stocks or bonds.' } }, examples: [{ kor: "많은 사람들이 돈을 벌기 위해 자본시장에서 주식을 사고팝니다.", eng: "Many people buy and sell stocks in the capital market to make money." }], variants: ['자본시장'] },
                { term: '전례 없는', mainDef: '예전에 비슷하게 일어났던 일(전례)이 없을 정도로 처음이거나 대단한', subDefs: [{ subTerm: '• 전례', subDef: '전(前 앞) + 례(例 본보기) -> 이전부터 있었던 사례나 규칙' }], translations: { en: { term: 'unprecedented', mainDef: 'being the first or so great that there is no similar past occurrence.', subDefs: [{ term: 'precedent', def: 'a case or rule that existed before.' }] } }, examples: [{ kor: "이번 태풍은 백 년 만에 찾아온 전례 없는 큰 피해를 남겼어요.", eng: "This typhoon left unprecedented immense damage, the likes of which haven't been seen in a hundred years." }], variants: ['전례 없는'] },
                { term: '역동성의 시대', mainDef: '힘차게 살아서 움직이는 활기(역동성)가 가득한 시간이나 시기', subDefs: [{ subTerm: '• 역동성', subDef: '역(力 힘) + 동(動 움직일) + 성(性 성질) -> 힘차게 움직이는 성질' }], translations: { en: { term: 'era of dynamism', mainDef: 'a time or period full of vigorous and lively movement.', subDefs: [{ term: 'dynamism', def: 'the quality of moving energetically.' }] } }, examples: [{ kor: "새로운 기술이 계속해서 나오는 지금은 역동성의 시대입니다.", eng: "Now, when new technologies constantly emerge, is an era of dynamism." }], variants: ['역동성의 시대', '역동성'] },
                { term: '코스피 지수', mainDef: '한국 주식 시장의 모든 주식 가격이 얼마나 변했는지 평균을 내어 보여주는 대표적인 숫자', subDefs: [{ subTerm: '• 지수', subDef: '지(指 가리킬) + 수(數 셈) -> 변화를 비교하기 쉽게 만든 수치' }], translations: { en: { term: 'KOSPI index', mainDef: 'a representative number showing the average change in all stock prices in the Korean stock market.', subDefs: [{ term: 'index', def: 'a figure made to easily compare changes.' }] } }, examples: [{ kor: "오늘 아침 코스피 지수가 어제보다 10포인트 올랐습니다.", eng: "This morning, the KOSPI index rose by 10 points compared to yesterday." }], variants: ['코스피 지수', '지수'] },
                { term: '연일', mainDef: '연(連 이을) + 일(日 날) -> 하루도 빠지지 않고 여러 날을 계속해서', translations: { en: { term: 'day after day', mainDef: 'continuously for many days without missing a single day.' } }, examples: [{ kor: "여름이 되면서 연일 무더운 날씨가 계속되고 있어요.", eng: "As summer sets in, the sweltering weather continues day after day." }], variants: ['연일'] },
                { term: '사상 최고치', mainDef: '사(史 역사) + 상(上 위) -> 역사가 시작된 이래 가장 높은 기록이나 숫자', subDefs: [{ subTerm: '• 사상', subDef: '지금까지 역사에 나타난 것 중에서' }, { subTerm: '• 최고치', subDef: '가장 높은 숫자나 값' }], translations: { en: { term: 'all-time high', mainDef: 'the highest record or number since the beginning of history.', subDefs: [{ term: 'in history', def: 'among everything that has appeared in history so far.' }, { term: 'highest value', def: 'the highest number or value.' }] } }, examples: [{ kor: "오늘 기온이 40도까지 올라가며 사상 최고치를 기록했습니다.", eng: "The temperature reached 40 degrees today, recording an all-time high." }], variants: ['사상 최고치'] },
                { term: '경신하다', mainDef: '경(更 고칠) + 신(新 새) -> 이전의 기록을 깨고 새로운 기록을 세우다', translations: { en: { term: 'to break a record / to update', mainDef: 'to break an old record and set a new one.' } }, examples: [{ kor: "올림픽 달리기 경기에서 세계 신기록을 경신했어요.", eng: "A new world record was broken in the Olympic running race." }], variants: ['경신하다', '경신하며'] },
                { term: '실현 불가능해 보이다', mainDef: '실제로 이루거나 해내는 것이 절대 안 될 것 같아 보이다', subDefs: [{ subTerm: '• 실현', subDef: '실(實 실제) + 현(現 나타날) -> 꿈이나 계획이 실제로 이루어짐' }], translations: { en: { term: 'to look impossible to realize', mainDef: 'to seem like it would be absolutely impossible to actually achieve or do.', subDefs: [{ term: 'realization', def: 'a dream or plan actually coming true.' }] } }, examples: [{ kor: "하늘을 나는 자동차는 예전에는 실현 불가능해 보였어요.", eng: "Flying cars used to look impossible to realize in the past." }], variants: ['실현 불가능해 보이다', '실현 불가능해 보였던'] },
                { term: '수치', mainDef: '수(數 셈) + 치(値 값) -> 계산하여 알아낸 구체적인 숫자', translations: { en: { term: 'numerical value / figure', mainDef: 'a specific number found through calculation.' } }, examples: [{ kor: "체중계에 올라가니 다이어트 전보다 낮은 수치가 나왔어요.", eng: "I stepped on the scale, and a lower numerical value came out than before the diet." }], variants: ['수치'] },
                { term: '투자자', mainDef: '투(投 던질) + 자(資 재물) + 자(者 사람) -> 나중에 이익을 얻으려고 기업이나 주식에 돈을 내는 사람', translations: { en: { term: 'investor', mainDef: 'a person who puts money into a company or stocks to make a profit later.' } }, examples: [{ kor: "새로운 기술을 개발하기 위해 많은 투자자들이 돈을 모아 주었어요.", eng: "To develop the new technology, many investors gathered their money." }], variants: ['투자자', '투자자들'] },
                { term: '예탁금', mainDef: '예(預 맡길) + 탁(託 맡길) + 금(金 돈) -> 주식을 사기 위해 증권 회사에 미리 맡겨둔 돈', translations: { en: { term: 'deposit / entrusted money', mainDef: 'money deposited in advance at a securities firm to buy stocks.' } }, examples: [{ kor: "내일 삼성 주식을 사려고 오늘 예탁금을 채워 넣었어요.", eng: "I filled up my deposit today to buy Samsung stock tomorrow." }], variants: ['예탁금'] },
                { term: '급증하다', mainDef: '급(急 급할) + 증(增 더할) -> 짧은 시간 안에 갑자기 아주 많이 늘어나다', translations: { en: { term: 'to increase rapidly / to surge', mainDef: 'to suddenly increase a lot in a short time.' } }, examples: [{ kor: "날씨가 더워지면서 아이스크림 판매량이 급증했어요.", eng: "As the weather got hotter, ice cream sales surged." }], variants: ['급증하다', '급증했고'] },
                { term: '그에 비례해(서)', mainDef: '앞의 것이 늘어나는 것과 똑같은 비율로 덩달아 같이 늘어남', subDefs: [{ subTerm: '• 비례하다', subDef: '비(比 견줄) + 례(例 법식) -> 하나가 커지거나 작아질 때 다른 하나도 그에 맞춰 변하다' }], translations: { en: { term: 'in proportion to that', mainDef: 'increasing at the exact same rate as the former increases.', subDefs: [{ term: 'to be proportional', def: 'for one thing to change accordingly as another grows or shrinks.' }] } }, examples: [{ kor: "공부하는 시간에 비례해서 시험 점수도 올라가요.", eng: "Test scores go up in proportion to the time spent studying." }], variants: ['그에 비례해', '비례해'] },
                { term: '신용융자 잔액', mainDef: '사람들이 주식을 사기 위해 증권사에서 돈을 빌린(신용융자) 뒤, 아직 갚지 않고 남아 있는 돈(잔액)', subDefs: [{ subTerm: '• 신용', subDef: '신(信 믿을) + 용(用 쓸) -> 돈을 갚을 수 있다는 믿음' }, { subTerm: '• 융자', subDef: '융(融 통할) + 자(資 재물) -> 자금을 빌려줌' }, { subTerm: '• 잔액', subDef: '잔(殘 남을) + 액(額 이마/액수) -> 쓰고 남은 돈' }], translations: { en: { term: 'margin loan balance', mainDef: 'the money left unpaid after people borrow money from a brokerage (margin loan) to buy stocks.', subDefs: [{ term: 'credit', def: 'the belief that one can repay money.' }, { term: 'loan/financing', def: 'lending funds.' }, { term: 'balance', def: 'money remaining after spending.' }] } }, examples: [{ kor: "통장을 확인해보니 용돈을 다 써서 잔액이 천 원밖에 안 남았어요.", eng: "I checked my bankbook, and since I spent all my allowance, my balance is only 1,000 won." }], variants: ['신용융자 잔액'] },
                { term: '역대 최고 수준', mainDef: '과거부터 지금까지의 모든 역사(역대)를 통틀어 가장 높거나 훌륭한 정도', subDefs: [{ subTerm: '• 역대', subDef: '역(歷 지낼) + 대(代 대신) -> 대대로 이어져 내려온 지나간 시대' }], translations: { en: { term: 'the highest level in history', mainDef: 'the highest or best degree across all history from the past to the present.', subDefs: [{ term: 'successive generations / all-time', def: 'past eras handed down from generation to generation.' }] } }, examples: [{ kor: "올해 우리 학교 축구팀의 실력은 역대 최고 수준입니다.", eng: "Our school's soccer team's skill this year is at the highest level in history." }], variants: ['역대 최고 수준', '역대'] },
                { term: 'GDP 대비 90.1%였던 주식시장 시가총액 비율', mainDef: '나라 전체가 1년 동안 번 돈(GDP)과 비교(대비)했을 때, 주식 시장에 있는 회사들의 전체 가치(시가총액)가 90.1% 정도를 차지했다는 의미', subDefs: [{ subTerm: '• 대비', subDef: '대(對 대할) + 비(比 견줄) -> 두 가지를 나란히 놓고 차이를 비교함' }, { subTerm: '• 시가총액', subDef: '주식 시장에 상장된 모든 주식의 가격을 합친 돈' }], translations: { en: { term: 'stock market capitalization ratio of 90.1% to GDP', mainDef: 'meaning that when compared to the country\'s total earnings in a year (GDP), the total value of companies in the stock market (market cap) accounted for about 90.1%.', subDefs: [{ term: 'compared to / against', def: 'placing two things side by side and comparing the difference.' }, { term: 'market capitalization', def: 'the sum of the prices of all stocks listed on the market.' }] } }, examples: [{ kor: "작년 대비 올해 우리 집 전기 요금이 많이 올랐어요.", eng: "Compared to last year, our house's electricity bill went up a lot this year." }], variants: ['GDP 대비 90.1%였던 주식시장 시가총액 비율', '대비', '시가총액'] },
                { term: '증시', mainDef: '증(證 증거) + 시(市 저자) -> 주식이나 채권이 사고팔리는 증권 시장의 줄임말', translations: { en: { term: 'stock market', mainDef: 'short for securities market where stocks or bonds are bought and sold.' } }, examples: [{ kor: "좋은 뉴스가 나오자 아침부터 증시가 오르기 시작했어요.", eng: "As good news came out, the stock market started to rise from the morning." }], variants: ['증시'] },
                { term: '시가총액', mainDef: '주식 시장에 있는 어떤 회사(또는 시장 전체)의 모든 주식 수를 현재 가격으로 곱해서 다 합친 돈의 양', subDefs: [{ subTerm: '• 시가', subDef: '시(市 저자) + 가(價 값) -> 현재 시장에서 사고팔리는 물건의 가격' }, { subTerm: '• 총액', subDef: '총(總 거느릴) + 액(額 액수) -> 모든 돈을 하나로 다 합친 금액' }], translations: { en: { term: 'market capitalization', mainDef: 'the total amount of money calculated by multiplying all the shares of a company (or the entire market) by the current price.', subDefs: [{ term: 'market price', def: 'the price of goods currently bought and sold in the market.' }, { term: 'total amount', def: 'the sum of all money put together.' }] } }, examples: [{ kor: "삼성전자는 한국에서 시가총액이 가장 큰 기업이에요.", eng: "Samsung Electronics is the company with the largest market capitalization in Korea." }], variants: ['시가총액'] },
                { term: '뜨겁게 달아오르다', mainDef: '어떤 일이나 분위기가 매우 활발해지고 사람들의 관심이 엄청나게 집중되다', subDefs: [{ subTerm: '• 달아오르다', subDef: '불에 달궈진 것처럼 아주 뜨거워지거나 열기가 가득 차다' }], translations: { en: { term: 'to heat up hotly', mainDef: 'for an event or atmosphere to become very active and people\'s attention to be hugely focused.', subDefs: [{ term: 'to become heated', def: 'to become very hot or full of heat as if heated by fire.' }] } }, examples: [{ kor: "축구 경기장에 들어서자 사람들의 응원 소리로 분위기가 뜨겁게 달아올랐어요.", eng: "As we entered the soccer stadium, the atmosphere heated up hotly with people's cheering." }], variants: ['뜨겁게 달아오르다', '뜨겁게 달아오른'] },
                { term: '대조적으로', mainDef: '대(對 대할) + 조(照 비출) -> 두 가지가 서로 정반대가 되어 차이가 아주 뚜렷하게 나게', translations: { en: { term: 'in contrast / contrastingly', mainDef: 'two things being the exact opposite, showing a very distinct difference.' } }, examples: [{ kor: "언니는 아주 활발한데 대조적으로 동생은 매우 조용해요.", eng: "The older sister is very active, but in contrast, the younger sister is very quiet." }], variants: ['대조적으로'] },
                { term: '서민', mainDef: '서(庶 여러) + 민(民 백성) -> 권력이나 큰 재산이 없는 평범하고 일반적인 사람들', translations: { en: { term: 'ordinary people / commoners', mainDef: 'ordinary and common people without power or large wealth.' } }, examples: [{ kor: "버스 요금이 오르면 서민들이 가장 큰 부담을 느낍니다.", eng: "When bus fares go up, ordinary people feel the greatest burden." }], variants: ['서민', '서민들'] },
                { term: '체감하다', mainDef: '체(體 몸) + 감(感 느낄) -> 눈으로 보는 게 아니라 자기 피부나 몸으로 직접 현상을 느끼다', translations: { en: { term: 'to feel firsthand / to sense', mainDef: 'to feel a phenomenon directly with one\'s own skin or body, not just by seeing it.' } }, examples: [{ kor: "겨울비가 내린 뒤라 추위를 더 강하게 체감하고 있어요.", eng: "Since it rained in winter, I am feeling the cold more strongly firsthand." }], variants: ['체감하다', '체감하는'] },
                { term: '민생의 온기', mainDef: '백성(민)의 생활(생)에 돈이 잘 돌고 살기가 편안해져서 느껴지는 따뜻한 기운(온기)', subDefs: [{ subTerm: '• 민생', subDef: '민(民 백성) + 생(生 살) -> 일반 국민들의 일상적인 생활' }], translations: { en: { term: 'warmth of people\'s livelihoods', mainDef: 'the warm feeling felt when money circulates well and life becomes comfortable for the people.', subDefs: [{ term: 'people\'s livelihoods', def: 'the daily lives of general citizens.' }] } }, examples: [{ kor: "시장에 사람들이 가득해서 오랜만에 민생의 온기가 느껴졌어요.", eng: "The market was full of people, so I felt the warmth of people's livelihoods for the first time in a while." }], variants: ['민생의 온기', '민생'] },
                { term: '차갑게 식다', mainDef: '활발하던 분위기나 열정이 사라지고 기운이 뚝 떨어지다', translations: { en: { term: 'to cool down coldly', mainDef: 'for a lively atmosphere or passion to disappear and energy to drop sharply.' } }, examples: [{ kor: "우리 팀이 지고 있어서 응원석의 열기가 차갑게 식었어요.", eng: "Because our team is losing, the heat in the cheering section cooled down coldly." }], variants: ['차갑게 식다', '차갑게 식고'] },
                { term: '주가지수', mainDef: '주식 시장 전체의 가격이 올랐는지 내렸는지 한눈에 보기 쉽게 숫자로 묶어놓은 것', subDefs: [{ subTerm: '• 주가', subDef: '주식의 가격' }, { subTerm: '• 지수', subDef: '변화를 알아보기 쉽게 만든 기준 수치' }], translations: { en: { term: 'stock price index', mainDef: 'numbers bundled together to easily see at a glance whether the overall stock market prices have gone up or down.', subDefs: [{ term: 'stock price', def: 'the price of a stock.' }, { term: 'index', def: 'a benchmark figure made to easily see changes.' }] } }, examples: [{ kor: "오늘 주가지수가 많이 올라서 아버지가 기분 좋아하십니다.", eng: "My father is in a good mood because the stock price index went up a lot today." }], variants: ['주가지수'] },
                { term: '상승', mainDef: '상(上 위) + 승(昇 오를) -> 가격이나 수치, 위치가 위로 올라감', translations: { en: { term: 'rise / increase', mainDef: 'prices, figures, or positions going up.' } }, examples: [{ kor: "아파트 가격의 상승 때문에 집을 사기가 더 힘들어졌어요.", eng: "Because of the rise in apartment prices, it has become harder to buy a house." }], variants: ['상승'] },
                { term: '노동의 가치 제고', mainDef: '사람들이 땀 흘려 일하는 것(노동)의 중요함과 가치를 높게 끌어올림', subDefs: [{ subTerm: '• 제고', subDef: '제(提 끌) + 고(高 높을) -> 수준이나 정도를 끌어올림' }], translations: { en: { term: 'enhancing the value of labor', mainDef: 'raising high the importance and value of people working hard and sweating (labor).', subDefs: [{ term: 'enhancement / improvement', def: 'pulling up a level or degree.' }] } }, examples: [{ kor: "힘들게 청소하는 분들의 월급을 올려주어 노동의 가치를 제고해야 합니다.", eng: "We should enhance the value of labor by raising the salaries of those who clean arduously." }], variants: ['노동의 가치 제고', '제고'] },
                { term: '실물경제', mainDef: '주식 같은 숫자가 아니라, 빵, 옷, 컴퓨터처럼 우리 눈에 보이고 실제로 쓰이는 물건을 만들고 파는 진짜 경제 활동', subDefs: [{ subTerm: '• 실물', subDef: '실(實 실제) + 물(物 물건) -> 눈에 보이고 실제로 있는 물건' }], translations: { en: { term: 'real economy', mainDef: 'the real economic activity of making and selling visible and actually used goods like bread, clothes, and computers, rather than numbers like stocks.', subDefs: [{ term: 'real object', def: 'a real object that can be seen and exists.' }] } }, examples: [{ kor: "사람들이 지갑을 닫아서 마트와 식당 같은 실물경제가 아주 어렵습니다.", eng: "Because people are keeping their wallets closed, the real economy, like marts and restaurants, is very difficult." }], variants: ['실물경제', '실물'] },
                { term: '선순환', mainDef: '선(善 착할) + 순(循 돌) + 환(環 고리) -> 좋은 일이 일어나면 그 결과가 또 다른 좋은 일을 계속 이어지게 만드는 긍정적인 고리', subDefs: [{ subTerm: '• 선-', subDef: '착하고 좋은 방향의' }, { subTerm: '• 순환', subDef: '돌고 돌아서 다시 제자리로 돌아옴' }], translations: { en: { term: 'virtuous cycle', mainDef: 'a positive loop where a good event happens, and its result continues to lead to another good event.', subDefs: [{ term: 'virtuous / good', def: 'in a good and kind direction.' }, { term: 'circulation', def: 'turning around and returning to its original place.' }] } }, examples: [{ kor: "내가 남을 돕고 그 사람이 또 다른 사람을 돕는 것은 아름다운 선순환이에요.", eng: "Me helping someone and that person helping another is a beautiful virtuous cycle." }], variants: ['선순환'] },
                { term: '자산', mainDef: '자(資 재물) + 산(産 낳을) -> 집, 땅, 통장의 돈, 주식처럼 개인이 가진 재산', translations: { en: { term: 'asset / property', mainDef: 'property owned by an individual, such as a house, land, money in a bank account, or stocks.' } }, examples: [{ kor: "그는 젊을 때부터 돈을 모아 지금은 아파트라는 큰 자산을 가지고 있어요.", eng: "He saved money since he was young and now has a big asset called an apartment." }], variants: ['자산'] },
                { term: '소득 격차를 심화시키다', mainDef: '돈을 많이 버는 사람과 적게 버는 사람 사이의 차이(격차)를 더욱 깊고 심하게 만들다', subDefs: [{ subTerm: '• 소득', subDef: '소(所 바) + 득(得 얻을) -> 일이나 사업을 해서 벌어들인 돈' }, { subTerm: '• 격차', subDef: '격(隔 사이 뜰) + 차(差 다를) -> 수준이나 정도가 벌어진 차이' }], translations: { en: { term: 'to deepen the income gap', mainDef: 'to make the difference (gap) between those who earn a lot and those who earn little even deeper and more severe.', subDefs: [{ term: 'income', def: 'money earned from work or business.' }, { term: 'gap / disparity', def: 'the difference that has widened in level or degree.' }] } }, examples: [{ kor: "부자들만 돈을 더 많이 버는 제도는 우리 사회의 소득 격차를 심화시킵니다.", eng: "A system where only the rich make more money deepens the income gap in our society." }], variants: ['소득 격차를 심화시키다', '소득 격차를 심화시키는'] },
                { term: '자본시장 활성화', mainDef: '주식과 채권이 거래되는 시장이 활기를 띠고 투자와 거래가 씽씽하게 잘 돌아가게 만드는 것', subDefs: [{ subTerm: '• 활성화', subDef: '활(活 살) + 성(性 성질) -> 어떤 기능이나 활동이 매우 활발해짐' }], translations: { en: { term: 'revitalization of the capital market', mainDef: 'making the market where stocks and bonds are traded vibrant and investments and transactions run smoothly.', subDefs: [{ term: 'revitalization', def: 'a function or activity becoming very active.' }] } }, examples: [{ kor: "정부는 경제를 살리기 위해 자본시장 활성화 계획을 발표했어요.", eng: "The government announced a plan for the revitalization of the capital market to save the economy." }], variants: ['자본시장 활성화'] },
                { term: '명분', mainDef: '명(名 이름) + 분(分 나눌) -> 어떤 행동이나 주장을 할 때 내세우는 겉으로 보기에 그럴듯하고 정당한 이유', translations: { en: { term: 'justification / pretext', mainDef: 'an apparently plausible and justified reason put forward when making an action or claim.' } }, examples: [{ kor: "학생들이 지각하지 말아야 한다는 것은 누구도 반대할 수 없는 명분입니다.", eng: "The fact that students shouldn't be late is a justification that no one can oppose." }], variants: ['명분', '명분 아래'] },
                { term: '감세정책', mainDef: '감(減 덜) + 세(稅 세금) -> 사람들이나 기업이 나라에 내는 세금을 깎아주거나 줄여주는 정책', subDefs: [{ subTerm: '• 감세', subDef: '세금을 줄여 줌' }], translations: { en: { term: 'tax cut policy', mainDef: 'a policy that cuts or reduces the taxes people or companies pay to the country.', subDefs: [{ term: 'tax cut', def: 'reducing taxes.' }] } }, examples: [{ kor: "새 시장님은 동네 가게들을 돕기 위해 세금을 깎아주는 감세정책을 시작했어요.", eng: "The new mayor started a tax cut policy that reduces taxes to help local shops." }], variants: ['감세정책'] },
                { term: '자본의 과실', mainDef: '주식 투자나 이자처럼 돈(자본)을 통해 얻게 된 달콤한 이익이나 결과물(과실)', subDefs: [{ subTerm: '• 과실', subDef: '과(果 열매) + 실(實 열매) -> 나무의 열매, 또는 노력이나 투자로 얻은 좋은 결과' }], translations: { en: { term: 'fruits of capital', mainDef: 'sweet profits or outcomes (fruits) gained through money (capital) like stock investments or interest.', subDefs: [{ term: 'fruit / outcome', def: 'fruit of a tree, or good results obtained through effort or investment.' }] } }, examples: [{ kor: "농부가 땀 흘려 일해 얻은 곡식처럼 투자자도 기다림 끝에 자본의 과실을 얻습니다.", eng: "Just as a farmer gets grain by sweating and working, an investor also gets the fruits of capital after waiting." }], variants: ['자본의 과실'] },
                { term: '환원되다', mainDef: '환(還 돌아올) + 원(元 으뜸/원래) -> 원래의 상태나 자리, 또는 이익을 내야 할 곳으로 다시 되돌려지다', translations: { en: { term: 'to be returned / restored', mainDef: 'to be returned to the original state, place, or where profits should be given.' } }, examples: [{ kor: "그 착한 회사는 번 돈의 일부를 장학금으로 만들어 사회에 환원하고 있어요.", eng: "That good company is returning part of the money it earned to society by creating scholarships." }], variants: ['환원되다', '환원되는', '환원하겠다고'] },
                { term: '길목을 차단하다', mainDef: '어떤 것이 지나가거나 들어오는 중요한 통로(길목)를 가로막아 못 지나가게 하다', subDefs: [{ subTerm: '• 길목', subDef: '큰길에서 좁은 길로 들어가는 어귀나 중요한 길' }, { subTerm: '• 차단하다', subDef: '차(遮 가릴) + 단(斷 끊을) -> 무언가가 지나가지 못하게 막아 끊음' }], translations: { en: { term: 'to block the pathway', mainDef: 'to block the important passage (pathway) where something passes or enters to prevent it from passing.', subDefs: [{ term: 'pathway / strategic point', def: 'the entrance from a main road to a narrow road, or an important road.' }, { term: 'to block / intercept', def: 'to stop and cut off something from passing.' }] } }, examples: [{ kor: "경찰이 도둑이 도망갈 길목을 차단해서 무사히 잡았습니다.", eng: "The police blocked the pathway where the thief would flee and caught him safely." }], variants: ['길목을 차단하다', '길목을 차단했다'] },
                { term: '과실을 나누다', mainDef: '열심히 일하거나 투자해서 얻은 이익(과실)을 여러 사람이 함께 공평하게 가지다', translations: { en: { term: 'to share the fruits', mainDef: 'for many people to fairly share the profits (fruits) obtained from working hard or investing.' } }, examples: [{ kor: "친구들과 힘을 합쳐 과제를 끝낸 후 그 좋은 점수라는 과실을 함께 나누었어요.", eng: "After finishing the assignment together with my friends, we shared the fruit of that good score." }], variants: ['과실을 나누다', '과실을 나눌'] },
                { term: '왜곡', mainDef: '왜(歪 비뚤어질) + 곡(曲 굽을) -> 사실과 다르게 일부러 비틀거나 잘못되게 만듦', translations: { en: { term: 'distortion', mainDef: 'intentionally twisting or making something wrong contrary to the facts.' } }, examples: [{ kor: "그 뉴스는 진실을 왜곡해서 사람들에게 가짜 정보를 믿게 했어요.", eng: "The news distorted the truth and made people believe fake information." }], variants: ['왜곡', '왜곡된'] },
                { term: '코리아 디스카운트', mainDef: 'Korea + Discount(할인) -> 한국의 기업들이 남북 분단 등 여러 이유 때문에 세계 시장에서 실제 가치보다 주식 가격을 더 싸게 평가받는 서글픈 현상', translations: { en: { term: 'Korea Discount', mainDef: 'a sad phenomenon where Korean companies\' stock prices are evaluated cheaper than their actual value in the global market due to various reasons like the division of South and North Korea.' } }, examples: [{ kor: "우리는 코리아 디스카운트를 극복하기 위해 기업들이 투명하게 장사해야 해요.", eng: "In order to overcome the Korea Discount, companies must do business transparently." }], variants: ['코리아 디스카운트', '코리아 디스카운트’'] },
                { term: '해소하다', mainDef: '해(解 풀) + 소(消 사라질) -> 어렵게 꼬인 문제나 쌓인 스트레스를 확 풀어서 없애 버리다', translations: { en: { term: 'to resolve / to relieve', mainDef: 'to completely untangle and eliminate difficultly twisted problems or accumulated stress.' } }, examples: [{ kor: "주말에 산책을 하면서 일주일 동안 쌓인 피로를 해소했어요.", eng: "I relieved the fatigue accumulated over the week by taking a walk on the weekend." }], variants: ['해소하다', '해소하고'] },
                { term: '조세', mainDef: '조(租 세금) + 세(稅 세금) -> 나라 살림을 위해 국민들이 벌어들인 돈 중 일부를 국가에 내는 세금', translations: { en: { term: 'tax / taxation', mainDef: 'the tax citizens pay to the state from a part of their earned money for the national administration.' } }, examples: [{ kor: "모든 국민은 정해진 규칙에 따라 조세를 낼 의무가 있습니다.", eng: "All citizens have a duty to pay taxes according to the set rules." }], variants: ['조세'] },
                { term: '부의 재분배', mainDef: '부(富 재산) + 재(再 다시) + 분배 -> 나라가 부자들에게 세금을 많이 걷어 가난한 사람들의 복지를 위해 쓰면서 재산을 다시 공평하게 나누는 일', subDefs: [{ subTerm: '• 재-', subDef: '다시, 두 번째로' }, { subTerm: '• 분배', subDef: '분(分 나눌) + 배(配 나눌) -> 몫에 따라 몫몫이 갈라 줌' }], translations: { en: { term: 'redistribution of wealth', mainDef: 'the state collecting a lot of taxes from the rich and using them for the welfare of the poor, thereby dividing property fairly again.', subDefs: [{ term: 're-', def: 'again, for the second time.' }, { term: 'distribution', def: 'dividing into shares and giving them out.' }] } }, examples: [{ kor: "의료 보험 제도는 부의 재분배를 돕는 좋은 방법 중 하나입니다.", eng: "The health insurance system is one of the good ways to help the redistribution of wealth." }], variants: ['부의 재분배'] },
                { term: '핵심 기제', mainDef: '가장 중요하게 중심이 되어 작동하는 방식이나 장치', subDefs: [{ subTerm: '• 기제', subDef: '기(機 틀) + 제(制 절제할) -> 어떤 일이 일어나는 원리나 장치' }], translations: { en: { term: 'core mechanism', mainDef: 'the most importantly central and operating method or device.', subDefs: [{ term: 'mechanism', def: 'the principle or device by which an event occurs.' }] } }, examples: [{ kor: "신뢰는 튼튼한 친구 관계를 유지하는 핵심 기제입니다.", eng: "Trust is a core mechanism that maintains a strong friendship." }], variants: ['핵심 기제', '핵심 기제다'] },
                { term: '기능을 마비시키다', mainDef: '기계나 조직이 원래 해야 할 일(기능)을 마비(신경이 굳어 마비됨)시켜 옴짝달싹 못 하게 고장 내다', subDefs: [{ subTerm: '• 마비', subDef: '마(痲 저릴) + 비(痺 저릴) -> 감각이나 기능이 멈춰 움직이지 못함' }], translations: { en: { term: 'to paralyze the function', mainDef: 'to paralyze the work a machine or organization is supposed to do (function), breaking it down so it cannot budge.', subDefs: [{ term: 'paralysis', def: 'senses or functions stopping and being unable to move.' }] } }, examples: [{ kor: "갑작스러운 정전이 병원의 모든 기계 기능을 마비시켰어요.", eng: "A sudden blackout paralyzed all machine functions in the hospital." }], variants: ['기능을 마비시키다', '기능을 마비시켰다'] },
                { term: '수익', mainDef: '수(收 거둘) + 익(益 더할) -> 일이나 투자를 해서 벌어들인 돈', translations: { en: { term: 'profit / revenue', mainDef: 'money earned by doing work or investing.' } }, examples: [{ kor: "알뜰하게 모은 돈을 투자해서 이번 달에 꽤 많은 수익이 생겼어요.", eng: "I invested the money I saved frugally and made quite a bit of profit this month." }], variants: ['수익'] },
                { term: '경로를 차단하다', mainDef: '지나가는 길이나 방법(경로)을 꽉 막아서(차단) 지나가지 못하게 하다', subDefs: [{ subTerm: '• 경로', subDef: '경(經 지날) + 로(路 길) -> 지나가는 길이나 과정' }, { subTerm: '• 차단하다', subDef: '가로막아서 끊음' }], translations: { en: { term: 'to block the route', mainDef: 'to block tightly (intercept) the passing road or method (route) so it cannot pass.', subDefs: [{ term: 'route / path', def: 'the passing road or process.' }, { term: 'to block', def: 'to cut off by blocking.' }] } }, examples: [{ kor: "해커가 침입하지 못하도록 경찰이 인터넷 경로를 차단했습니다.", eng: "The police blocked the internet route so hackers couldn't intrude." }], variants: ['경로를 차단하다', '경로를 차단한'] },
                { term: '여야 합의로 도입되다', mainDef: '여당과 야당이 서로 의견을 맞추어(합의) 새로운 제도를 끌어들여 오다(도입)', subDefs: [{ subTerm: '• 여야', subDef: '여(與 더불) + 야(野 들) -> 정부를 지지하는 여당과 반대하는 야당' }, { subTerm: '• 합의', subDef: '합(合 합할) + 의(意 뜻) -> 서로의 뜻이 일치함' }, { subTerm: '• 도입되다', subDef: '도(導 이끌) + 입(入 들일) -> 기술이나 제도가 새로 들어오게 되다' }], translations: { en: { term: 'to be introduced by bipartisan agreement', mainDef: 'the ruling and opposition parties matching their opinions (agreement) to bring in a new system (introduction).', subDefs: [{ term: 'ruling and opposition parties', def: 'the ruling party supporting the government and the opposition party opposing it.' }, { term: 'agreement', def: 'mutual intentions matching.' }, { term: 'to be introduced', def: 'for technology or a system to be newly brought in.' }] } }, examples: [{ kor: "아이들을 위한 새 무상급식 법이 여야 합의로 도입되어 모두가 좋아해요.", eng: "The new free school meal law for children was introduced by bipartisan agreement, so everyone likes it." }], variants: ['여야 합의로 도입되다', '여야 합의로 도입된'] },
                { term: '금융투자소득세', mainDef: '주식, 펀드 같은 금융 투자로 돈을 벌었을 때(소득) 그 이익에 대해 국가에 내는 세금 (줄여서 금투세)', subDefs: [{ subTerm: '• 금융', subDef: '돈의 융통' }, { subTerm: '• 소득세', subDef: '벌어들인 돈에 매기는 세금' }], translations: { en: { term: 'financial investment income tax', mainDef: 'the tax paid to the state on the profit (income) when making money through financial investments like stocks and funds.', subDefs: [{ term: 'finance', def: 'circulation of money.' }, { term: 'income tax', def: 'tax levied on earned money.' }] } }, examples: [{ kor: "내년부터 주식으로 큰돈을 벌면 금융투자소득세를 내야 할 수도 있어요.", eng: "Starting next year, if you make a lot of money from stocks, you might have to pay the financial investment income tax." }], variants: ['금융투자소득세', '금융투자소득세(이하 금투세)'] },
                { term: '손실', mainDef: '손(損 덜) + 실(失 잃을) -> 가지고 있던 돈이나 재산이 줄어들거나 잃어버려서 손해를 봄', translations: { en: { term: 'loss', mainDef: 'suffering a loss because possessed money or property decreases or is lost.' } }, examples: [{ kor: "주식 가격이 떨어져서 투자자들이 큰 손실을 입었습니다.", eng: "Stock prices dropped, so investors suffered a large loss." }], variants: ['손실', '손실에'] },
                { term: '과세하다', mainDef: '과(課 매길) + 세(稅 세금) -> 나라에서 국민이나 기업에게 세금을 내라고 매기다', translations: { en: { term: 'to tax / to levy a tax', mainDef: 'the country assessing citizens or companies to pay taxes.' } }, examples: [{ kor: "정부는 아주 비싼 집을 가진 사람들에게 더 많은 세금을 과세하기로 했어요.", eng: "The government decided to heavily tax people who own very expensive houses." }], variants: ['과세하다', '과세하고', '과세된다', '과세할'] },
                { term: '이월하다', mainDef: '이(移 옮길) + 월(越 넘을) -> 이번 달이나 올해에 다 처리하지 못한 돈이나 일을 다음 달, 다음 해로 넘기다', translations: { en: { term: 'to carry over', mainDef: 'to pass money or work not fully handled this month or year to the next month or year.' } }, examples: [{ kor: "핸드폰 데이터가 남으면 다음 달로 이월해서 쓸 수 있어요.", eng: "If cell phone data remains, you can carry it over to the next month and use it." }], variants: ['이월하다', '이월할'] },
                { term: '정치적 이해관계', mainDef: '정치인이나 정당들이 서로에게 이익(이)이 되는지 손해(해)가 되는지 따지며 얽혀있는 복잡한 관계', subDefs: [{ subTerm: '• 이해관계', subDef: '이(利 이로울) + 해(害 해할) -> 서로 이익과 손해가 걸려 있는 관계' }], translations: { en: { term: 'political interests', mainDef: 'the complex relationship tangled up as politicians or parties weigh whether it brings benefit (이) or loss (해) to each other.', subDefs: [{ term: 'interests', def: 'a relationship where mutual benefits and losses are at stake.' }] } }, examples: [{ kor: "그 다리 건설은 정치적 이해관계가 얽혀 있어서 시작하기가 참 복잡해요.", eng: "The construction of that bridge is very complicated to start because political interests are intertwined." }], variants: ['정치적 이해관계'] },
                { term: '여론', mainDef: '여(輿 여럿) + 론(論 논할) -> 어떤 사회 문제에 대해 일반 사람들이 공통적으로 가지고 있는 생각이나 의견', translations: { en: { term: 'public opinion', mainDef: 'the common thoughts or opinions general people hold regarding a certain social issue.' } }, examples: [{ kor: "학교 급식을 더 좋게 만들자는 여론이 아주 뜨겁습니다.", eng: "Public opinion to make school meals better is very heated." }], variants: ['여론', '여론 속'] },
                { term: '시행을 앞두다', mainDef: '어떤 법이나 규칙을 실제로 쓰기(시행) 바로 직전의 시간에 있다', subDefs: [{ subTerm: '• 시행', subDef: '시(施 베풀) + 행(行 다닐) -> 법이나 제도를 실제로 행함' }], translations: { en: { term: 'to be ahead of implementation', mainDef: 'to be in the time right before actually using (implementing) a law or rule.', subDefs: [{ term: 'implementation / enforcement', def: 'actually carrying out a law or system.' }] } }, examples: [{ kor: "오토바이 헬멧 의무화법이 다음 달 시행을 앞두고 있습니다.", eng: "The mandatory motorcycle helmet law is ahead of implementation next month." }], variants: ['시행을 앞두다', '시행을 앞두고'] },
                { term: '폐지되다', mainDef: '폐(廢 그만둘) + 지(止 그칠) -> 있던 법이나 제도, 기관이 아예 없어지다', translations: { en: { term: 'to be abolished / repealed', mainDef: 'for an existing law, system, or institution to completely disappear.' } }, examples: [{ kor: "밤늦게 돌아다니지 못하게 하던 통행금지 제도가 폐지되었어요.", eng: "The curfew system that prevented walking around late at night was abolished." }], variants: ['폐지되다', '폐지됐다', '폐지'] },
                { term: '하락', mainDef: '하(下 아래) + 락(落 떨어질) -> 가격이나 수치가 아래로 떨어지는 것', translations: { en: { term: 'fall / drop', mainDef: 'prices or figures dropping down.' } }, examples: [{ kor: "최근 기름 가격의 하락으로 운전자들이 기뻐하고 있어요.", eng: "Drivers are happy due to the recent fall in oil prices." }], variants: ['하락'] },
                { term: '유발하다', mainDef: '유(誘 달래다) + 발(發 일어날) -> 어떤 현상이나 사건이 일어나게 원인을 만들다', translations: { en: { term: 'to cause / induce', mainDef: 'to create the cause for a phenomenon or event to happen.' } }, examples: [{ kor: "과도한 스트레스는 여러 가지 병을 유발할 수 있어요.", eng: "Excessive stress can cause various diseases." }], variants: ['유발하다', '유발할'] },
                { term: '장악하다', mainDef: '장(掌 손바닥) + 악(握 쥘) -> 손바닥에 꽉 쥐듯 어떤 곳이나 사람들의 마음을 자기 마음대로 할 수 있게 꽉 잡다', translations: { en: { term: 'to dominate / take over', mainDef: 'to hold tightly like in one\'s palm, to be able to control a place or people\'s minds at will.' } }, examples: [{ kor: "그 회사가 스마트폰 시장의 80%를 장악했어요.", eng: "That company dominated 80% of the smartphone market." }], variants: ['장악하다', '장악했고'] },
                { term: '정치권', mainDef: '정치를 업으로 삼는 사람들이나 정당들이 모여 있는 세계나 집단', translations: { en: { term: 'political circles', mainDef: 'the world or group where people who make a living out of politics or political parties gather.' } }, examples: [{ kor: "정치권은 선거를 앞두고 시민들을 위한 대책을 많이 내놓았습니다.", eng: "Political circles put out many countermeasures for citizens ahead of the election." }], variants: ['정치권'] },
                { term: '표심', mainDef: '표(票 표) + 심(心 마음) -> 선거에서 누구에게 투표할지 결정하는 국민들의 마음', translations: { en: { term: 'voters\' minds/hearts', mainDef: 'the minds of citizens deciding who to vote for in an election.' } }, examples: [{ kor: "후보자들은 표심을 잡기 위해 열심히 동네를 돌며 인사를 해요.", eng: "Candidates go around the neighborhood greeting people hard to win the voters' minds." }], variants: ['표심', '표심 앞'] },
                { term: '원칙을 접다', mainDef: '원래 지키려고 단단히 마음먹었던 규칙이나 신념(원칙)을 포기하고 마음을 바꾸다', translations: { en: { term: 'to compromise one\'s principles', mainDef: 'to give up the rules or beliefs (principles) one firmly resolved to keep, and change one\'s mind.' } }, examples: [{ kor: "그는 돈의 유혹에 결국 정직하게 살겠다는 원칙을 접고 말았어요.", eng: "He eventually compromised his principle of living honestly to the temptation of money." }], variants: ['원칙을 접다', '원칙을 접었다'] },
                { term: '정작', mainDef: '막상 일이 닥쳐보니 기대나 예상과는 다르게 실제로 일어난 진짜 모습은', translations: { en: { term: 'actually / surprisingly', mainDef: 'when actually faced with the event, the real appearance that happened is different from expectations.' } }, examples: [{ kor: "수영을 배우고 싶어 수영장에 갔는데 정작 물에 들어가니 너무 무서웠어요.", eng: "I went to the pool wanting to learn how to swim, but actually getting into the water was too scary." }], variants: ['정작'] },
                { term: '반긴 이들', mainDef: '어떤 일이나 사람을 아주 기쁘고 반갑게 환영하며 맞이한 사람들', subDefs: [{ subTerm: '• 반기다', subDef: '반가워서 기쁘게 대하다' }], translations: { en: { term: 'those who welcomed', mainDef: 'people who welcomed an event or person very joyfully and gladly.', subDefs: [{ term: 'to welcome/greet gladly', def: 'to treat joyfully out of gladness.' }] } }, examples: [{ kor: "비가 오기를 오랫동안 반긴 이들은 농부들이었어요.", eng: "Those who had long welcomed the coming of rain were the farmers." }], variants: ['반긴 이들'] },
                { term: '비과세', mainDef: '비(非 아닐) + 과(課 매길) + 세(稅 세금) -> 나라에서 세금을 매기지 않고 면제해 주는 특별한 혜택', translations: { en: { term: 'tax exemption / non-taxable', mainDef: 'a special benefit where the country does not levy a tax and exempts it.' } }, examples: [{ kor: "이 은행 통장에 저축하면 이자에 세금이 안 붙는 비과세 혜택이 있어요.", eng: "If you save in this bank account, there is a tax exemption benefit where no tax is added to the interest." }], variants: ['비과세', '비과세 혜택', '비과세라'] },
                { term: '사모펀드', mainDef: '사(私 사사로울) + 모(募 모을) + 펀드 -> 법의 감시를 피해 몰래 큰돈을 모아 소수의 부자들끼리만 비밀스럽게 투자하는 거대한 돈 주머니', translations: { en: { term: 'private equity fund', mainDef: 'a giant pool of money gathered secretly to avoid legal scrutiny, invested privately only among a small number of wealthy people.' } }, examples: [{ kor: "그 회사는 아주 부자들만 가입할 수 있는 사모펀드에 팔렸습니다.", eng: "That company was sold to a private equity fund that only the very rich can join." }], variants: ['사모펀드'] },
                { term: '초고액', mainDef: '초(超 뛰어넘을) + 고(高 높을) + 액(額 액수) -> 보통 사람들이 생각하기 힘들 정도로 엄청나게 크고 많은 금액의 돈', translations: { en: { term: 'ultra-high net worth / astronomical amount', mainDef: 'an incredibly large and massive amount of money, hard for ordinary people to imagine.' } }, examples: [{ kor: "그 아파트는 초고액이라 평범한 월급으로는 평생 모아도 살 수 없어요.", eng: "That apartment is an astronomical amount, so you couldn't buy it even if you saved your whole life on a normal salary." }], variants: ['초고액'] },
                { term: '자산가', mainDef: '자(資 재물) + 산(産 낳을) + 가(家 사람) -> 집이나 건물, 주식처럼 가치 있는 재산을 아주 많이 가지고 있는 부자', translations: { en: { term: 'wealthy person / asset owner', mainDef: 'a rich person who owns a lot of valuable properties like houses, buildings, and stocks.' } }, examples: [{ kor: "어릴 때부터 돈을 모은 그는 이제 빌딩을 여러 채 가진 자산가가 되었습니다.", eng: "Having saved money since he was young, he has now become a wealthy person owning multiple buildings." }], variants: ['자산가', '자산가들이었다', '자산가에게', '자산가만'] },
                { term: '소득', mainDef: '소(所 바) + 득(得 얻을) -> 회사에서 일하거나 사업을 해서 자기 손에 들어오게 된 돈이나 이익', translations: { en: { term: 'income / earnings', mainDef: 'money or profit that comes into one\'s hands by working at a company or doing business.' } }, examples: [{ kor: "아르바이트를 두 개나 해서 이번 달 소득이 평소보다 많아요.", eng: "I worked two part-time jobs, so my income this month is higher than usual." }], variants: ['소득', '소득만'] },
                { term: '완화하다', mainDef: '완(緩 느릴) + 화(和 조화로울) -> 꽉 조여 있던 규칙이나 아픈 증상, 나쁜 상황을 전보다 부드럽고 가볍게 풀어 주다', translations: { en: { term: 'to alleviate / ease / relax', mainDef: 'to loosen tightly restricted rules, painful symptoms, or bad situations making them softer and lighter than before.' } }, examples: [{ kor: "약을 먹고 푹 쉰 덕분에 감기 증상이 많이 완화되었어요.", eng: "Thanks to taking medicine and getting good rest, my cold symptoms have been greatly alleviated." }], variants: ['완화하다', '완화할', '완화됐다'] },
                { term: '개편', mainDef: '개(改 고칠) + 편(編 엮을) -> 예전부터 있던 조직이나 제도를 새로운 시대나 필요에 맞게 완전히 뜯어고치고 새롭게 짜다', translations: { en: { term: 'reorganization / reform', mainDef: 'to completely tear down and newly organize an existing organization or system to fit a new era or need.' } }, examples: [{ kor: "봄을 맞이하여 텔레비전 방송국에서 뉴스 프로그램 시간표를 새롭게 개편했습니다.", eng: "Welcoming spring, the TV station newly reorganized the news program schedule." }], variants: ['개편'] },
                { term: '실종되다', mainDef: '실(失 잃을) + 종(踪 자취) -> 어떤 사람이나 물건, 혹은 중요한 계획이 흔적도 없이 완전히 사라져서 어디에 있는지 모르게 되다', translations: { en: { term: 'to go missing / to disappear', mainDef: 'for a person, object, or important plan to completely vanish without a trace, making it unknown where it is.' } }, examples: [{ kor: "경찰은 산에서 길을 잃고 실종된 등산객을 헬리콥터를 띄워 찾고 있습니다.", eng: "The police are searching for the hiker who got lost and went missing in the mountain by flying a helicopter." }], variants: ['실종되다', '실종되고'] },
                { term: '지배주주', mainDef: '지(支 가를) + 배(配 나눌) + 주주 -> 회사의 주식을 아주 많이 가져서 사장님을 바꾸거나 중요한 결정을 마음대로 할 수 있는 제일 센 주주', subDefs: [{ subTerm: '• 지배', subDef: '어떤 사람이나 조직을 자기 뜻대로 누르고 다스림' }, { subTerm: '• 주주', subDef: '회사의 주식을 가진 사람' }], translations: { en: { term: 'controlling shareholder', mainDef: 'the strongest shareholder who has so many company shares that they can change the boss or make important decisions at will.', subDefs: [{ term: 'domination / control', def: 'suppressing and ruling a person or organization as one wishes.' }, { term: 'shareholder', def: 'a person who has company stocks.' }] } }, examples: [{ kor: "그 회사는 아버지가 지배주주여서 마음대로 아들을 사장으로 앉혔습니다.", eng: "Because the father was the controlling shareholder of that company, he arbitrarily installed his son as the boss." }], variants: ['지배주주', '지배주주에게'] },
                { term: '배당소득 분리과세', mainDef: '회사가 주주에게 주는 이익금(배당)을 월급 같은 다른 소득과 섞지 않고 혼자만 떼어내서(분리) 세금을 매기는(과세) 제도 (부자들의 세금을 깎아주기 위해 씀)', subDefs: [{ subTerm: '• 배당', subDef: '회사가 번 돈을 주식 수에 따라 주주에게 나누어 줌' }, { subTerm: '• 과세', subDef: '국가가 국민에게 세금을 내라고 정함' }], translations: { en: { term: 'separate taxation on dividend income', mainDef: 'a system where the profit given by a company to shareholders (dividend) is separated from other income like salaries and taxed alone (used to reduce taxes for the rich).', subDefs: [{ term: 'dividend', def: 'a company dividing earned money to shareholders based on stock numbers.' }, { term: 'taxation', def: 'the state determining citizens to pay taxes.' }] } }, examples: [{ kor: "주식이 아주 많은 부자는 배당소득 분리과세 덕분에 세금을 조금만 내게 되었습니다.", eng: "A rich person with a lot of stocks ended up paying only a little tax thanks to the separate taxation on dividend income." }], variants: ['배당소득 분리과세'] },
                { term: '기형적', mainDef: '기(畸 일그러질) + 형(形 모양) + 적(的 과녁) -> 원래 있어야 할 올바른 모습이 찌그러지거나 잘못되어서 정상적이지 않고 이상하게 변해버린 모양', translations: { en: { term: 'deformed / abnormal', mainDef: 'a shape that has changed to be abnormal and strange because the correct shape it should originally have has been distorted or gone wrong.' } }, examples: [{ kor: "집값이 너무 비싸서 사람들이 집을 못 사는 기형적인 사회가 되어버렸어요.", eng: "House prices are so high that it has become an abnormal society where people cannot buy houses." }], variants: ['기형적', '기형적인'] },
                { term: '고착되다', mainDef: '고(固 굳을) + 착(着 붙을) -> 어떤 나쁜 생각이나 제도가 딱딱하게 굳어버리고 딱 붙어서 도무지 고쳐지거나 바뀌지 않다', translations: { en: { term: 'to become fixed / entrenched', mainDef: 'for a bad thought or system to harden stiffly and stick firmly, never getting fixed or changed.' } }, examples: [{ kor: "남자는 파란색, 여자는 분홍색이라는 옛날 생각이 아직도 사람들 마음에 고착되어 있어요.", eng: "The old thought that blue is for boys and pink is for girls is still entrenched in people's minds." }], variants: ['고착되다', '고착됐다'] },
                { term: '유효하다', mainDef: '유(有 있을) + 효(效 보람) -> 어떤 규칙, 티켓, 핑계 같은 것이 시간이 지나도 죽지 않고 여전히 쓸모가 있거나 효과가 남아 있다', translations: { en: { term: 'to be valid / effective', mainDef: 'for a rule, ticket, excuse, etc. to not die as time passes and still be useful or have an effect remaining.' } }, examples: [{ kor: "이 놀이공원 자유이용권은 내일까지만 유효하니까 꼭 내일 가야 해.", eng: "This amusement park free pass is only valid until tomorrow, so we absolutely must go tomorrow." }], variants: ['유효하다', '유효한가'] },
                { term: '당대표 시절', mainDef: '정치인이 하나의 큰 정치 모임(정당)을 이끄는 최고 우두머리(당대표) 자리를 맡고 있었던 옛날의 어느 시기(시절)', subDefs: [{ subTerm: '• 정당', subDef: '정(政 정사) + 당(黨 무리) -> 정치적인 뜻이 같은 사람들이 권력을 잡기 위해 모인 단체' }], translations: { en: { term: 'days as party leader', mainDef: 'a past period (days) when a politician held the position of the top boss (party leader) leading a large political group (political party).', subDefs: [{ term: 'political party', def: 'an organization of people with the same political intentions gathered to seize power.' }] } }, examples: [{ kor: "그 정치인은 당대표 시절에 가난한 사람들을 위한 법을 만들려고 노력했어요.", eng: "During his days as party leader, that politician tried to make laws for the poor." }], variants: ['당대표 시절'] },
                { term: '강행', mainDef: '강(强 굳셀) + 행(行 다닐) -> 반대하는 사람이 많거나 상황이 무척 힘든데도 억지를 부려 끝까지 일을 밀어붙여 실행함', translations: { en: { term: 'forcing / pushing through', mainDef: 'pushing through and executing a task to the end by being stubborn, even when many oppose or the situation is very hard.' } }, examples: [{ kor: "비가 엄청나게 오는데도 학교에서 소풍을 강행해서 학생들 불만이 컸어요.", eng: "Even though it was raining heavily, the school pushed through with the picnic, causing great dissatisfaction among students." }], variants: ['강행'] },
                { term: '타당성을 인정하다', mainDef: '어떤 주장이나 계획이 이치에 맞고(타당) 그렇게 하는 게 올바르다는 것을 고개를 끄덕여 옳다고 받아들이다(인정)', subDefs: [{ subTerm: '• 타당성', subDef: '타(妥 온당할) + 당(當 마땅할) + 성(性 성질) -> 사물의 이치에 맞고 올바른 성질' }], translations: { en: { term: 'to acknowledge validity', mainDef: 'to nod and accept as right (acknowledge) that a claim or plan makes sense (valid) and doing so is correct.', subDefs: [{ term: 'validity', def: 'the nature of being right and fitting the reason of things.' }] } }, examples: [{ kor: "선생님은 친구가 지각한 이유를 듣고 그 타당성을 인정해 주셨어요.", eng: "The teacher listened to the reason the friend was late and acknowledged its validity." }], variants: ['타당성을 인정하다', '타당성은 인정하면서도', '타당성'] },
                { term: '정치적 부담을 회피하다', mainDef: '자신의 결정 때문에 사람들에게 욕을 먹거나 선거에서 질까 봐 무서운 마음(정치적 부담)을 피해서 도망치다(회피)', subDefs: [{ subTerm: '• 회피하다', subDef: '회(廻 돌) + 피(避 피할) -> 만나거나 부딪치지 않으려고 빙 돌아서 몸을 피하거나 도망치다' }], translations: { en: { term: 'to evade political burden', mainDef: 'to run away from (evade) the fearful feeling (political burden) of being cursed by people or losing in an election because of one\'s decision.', subDefs: [{ term: 'to evade / dodge', def: 'to turn around and hide one\'s body or run away to avoid meeting or clashing.' }] } }, examples: [{ kor: "시장은 환경오염 문제를 해결해야 하지만 정치적 부담을 회피하려고 아무것도 안 하고 있어요.", eng: "The mayor needs to solve the environmental pollution problem, but he is doing nothing to evade the political burden." }], variants: ['정치적 부담을 회피하다', '정치적 부담을 회피한', '회피하다'] },
                { term: '의원', mainDef: '의(議 의논할) + 원(員 인원) -> 국민들을 대표해서 국회에서 법을 만들고 나라의 중요한 일을 의논하여 결정하도록 뽑힌 사람 (국회의원)', translations: { en: { term: 'assemblyman / lawmaker', mainDef: 'a person elected to represent citizens in the National Assembly, making laws and discussing and deciding important national affairs.' } }, examples: [{ kor: "우리 동네 국회의원 아저씨가 새로운 공원을 만들겠다는 약속을 지켰어요.", eng: "The lawmaker in our neighborhood kept his promise to build a new park." }], variants: ['의원', '의원들'] },
                { term: '세제', mainDef: '세(稅 세금) + 제(制 절제할/제도) -> 나라에서 국민이나 기업에게 세금을 거두기 위해 만들어 놓은 법이나 제도들의 체계', translations: { en: { term: 'tax system', mainDef: 'the system of laws or institutions set up by the country to collect taxes from citizens or companies.' } }, examples: [{ kor: "정부가 부자들의 세금을 깎아주도록 세제를 고쳐서 사람들의 비판을 받고 있어요.", eng: "The government is receiving criticism from people for revising the tax system to reduce taxes for the rich." }], variants: ['세제', '세제 개편'] },
                { term: '여건론', mainDef: '어떤 일을 지금 당장 하기는 힘들고, 나중에 주변 상황이나 조건(여건)이 훨씬 좋아지면 그때 가서 하자고 미루는 주장(-론)', subDefs: [{ subTerm: '• 여건', subDef: '여(與 더불) + 건(件 물건/조건) -> 이미 주어져 있거나 갖추어진 조건' }, { subTerm: '• -론', subDef: '론(論 논할) -> 어떤 일에 대한 의견이나 이론' }], translations: { en: { term: 'theory of conditions (wait for better conditions)', mainDef: 'the argument (-론) that it is hard to do something right now, so let\'s postpone it and do it later when the surrounding situation or conditions (여건) get much better.', subDefs: [{ term: 'given conditions', def: 'conditions already given or equipped.' }, { term: '-theory / argument', def: 'an opinion or theory about a matter.' }] } }, examples: [{ kor: "회사는 직원들 월급을 올려주기 싫어서 돈을 더 번 뒤에 해주자는 여건론만 계속 내세우고 있어요.", eng: "The company doesn't want to raise employees' salaries, so it keeps putting forward the theory of conditions, saying they'll do it after making more money." }], variants: ['여건론', '여견론', '여건론’'] },
                { term: '순매수', mainDef: '순(純 순수할) + 매(買 살) + 수(收 거둘) -> 주식 시장에서 일정 기간 동안 외국인이나 개인들이 판 주식보다 산 주식이 더 많아서 순수하게 남은 매수 금액', subDefs: [{ subTerm: '• 순-', subDef: '다른 것이 섞이지 않은 100% 진짜배기' }, { subTerm: '• 매수', subDef: '매(買 살) + 수(收 거둘) -> 물건이나 주식을 돈을 주고 사들임' }], translations: { en: { term: 'net buying / net purchase', mainDef: 'the purely remaining purchase amount in the stock market over a period when foreigners or individuals bought more stocks than they sold.', subDefs: [{ term: 'net- / pure-', def: '100% genuine without anything else mixed.' }, { term: 'buying / purchase', def: 'buying goods or stocks with money.' }] } }, examples: [{ kor: "오늘 외국인들이 한국 주식을 많이 샀다는 순매수 소식에 주가가 확 올랐습니다.", eng: "Stock prices jumped today on the news of net buying that foreigners bought a lot of Korean stocks." }], variants: ['순매수', '매수'] },
                { term: '개인 투자 열기', mainDef: '평범한 일반 사람들(개인)이 앞다투어 너도나도 주식을 사겠다고 뛰어드는 뜨거운 분위기나 열정', subDefs: [{ subTerm: '• 열기', subDef: '열(熱 뜨거울) + 기(氣 기운) -> 마음이 아주 달아오른 뜨거운 기운' }], translations: { en: { term: 'individual investment fever', mainDef: 'the hot atmosphere or passion where ordinary general people (individuals) scramble to jump in and buy stocks.', subDefs: [{ term: 'heat / fever', def: 'a hot energy where the mind is very heated up.' }] } }, examples: [{ kor: "최근 대학생들 사이에서도 주식을 공부하는 개인 투자 열기가 대단합니다.", eng: "Recently, the individual investment fever studying stocks is amazing even among college students." }], variants: ['개인 투자 열기', '열기'] },
                { term: '지표', mainDef: '지(指 가리킬) + 표(標 푯말) -> 어떤 방향이나 지금의 상태가 어떤지 한눈에 알아볼 수 있게 보여주는 기준 표시나 숫자', translations: { en: { term: 'indicator / index', mainDef: 'a reference mark or number that shows at a glance the direction or current status of something.' } }, examples: [{ kor: "실업률 숫자는 나라 경제가 건강한지를 알려주는 아주 중요한 지표입니다.", eng: "The unemployment rate number is a very important indicator telling if the country's economy is healthy." }], variants: ['지표'] },
                { term: '과열 신호를 보내다', mainDef: '기계나 시장이 펑 터질 것처럼 너무 지나치게 뜨거워졌으니 조심하라고 경고하는 삐뽀삐뽀 알람(신호)을 울리다', subDefs: [{ subTerm: '• 과열', subDef: '과(過 지날) + 열(熱 뜨거울) -> 온도가 정상보다 너무 지나치게 높이 올라감' }], translations: { en: { term: 'to send an overheating signal', mainDef: 'to sound a warning alarm (signal) to be careful because a machine or market has become excessively hot as if it will explode.', subDefs: [{ term: 'overheating', def: 'temperature rising too excessively above normal.' }] } }, examples: [{ kor: "집값이 한 달 만에 두 배로 뛰며 시장이 위험하다는 과열 신호를 보내고 있어요.", eng: "House prices doubled in a month, sending an overheating signal that the market is dangerous." }], variants: ['과열 신호를 보내다', '과열 신호를 보내고', '과열'] },
                { term: '금투세 재도입 논의', mainDef: '사라졌던 ‘금융투자소득세(주식 수익 세금)’ 제도를 다시 살려서(재도입) 쓸지 말지 사람들이 모여서 말로 따져가며 의논하는 것', subDefs: [{ subTerm: '• 재도입', subDef: '재(再 다시) + 도(導 이끌) + 입(入 들일) -> 없어지거나 쓰지 않던 것을 다시 가져와서 씀' }], translations: { en: { term: 'discussion on reintroducing the financial investment income tax', mainDef: 'people gathering to discuss and argue verbally whether to revive (reintroduce) and use the disappeared \'financial investment income tax (tax on stock profits)\' system.', subDefs: [{ term: 'reintroduction', def: 'bringing back and using something that disappeared or was not used.' }] } }, examples: [{ kor: "부자들의 세금을 깎아주면 안 된다며 금투세 재도입 논의가 다시 뉴스에 나오고 있습니다.", eng: "Saying we shouldn't cut taxes for the rich, the discussion on reintroducing the financial investment income tax is appearing in the news again." }], variants: ['금투세 재도입 논의', '금투세'] },
                { term: '논의 테이블에 오르다', mainDef: '어떤 문제가 드디어 사람들이 모여서 진지하게 의논하고 결정해야 할 공식적인 회의 안건(테이블)으로 올라오다', translations: { en: { term: 'to be brought to the discussion table', mainDef: 'for a problem to finally come up as an official meeting agenda (table) that people gather to seriously discuss and decide.' } }, examples: [{ kor: "학생들이 점심시간을 길게 해 달라는 요구가 드디어 선생님들 논의 테이블에 올랐습니다.", eng: "The students' request for a longer lunch break was finally brought to the teachers' discussion table." }], variants: ['논의 테이블에 오르다', '논의 테이블에 오르며'] },
                { term: '자산 보유자', mainDef: '집, 땅, 주식, 현금 같은 재산(자산)을 이미 많이 가지고 있어서 꽉 쥐고 있는(보유) 사람', translations: { en: { term: 'asset holder / property owner', mainDef: 'a person who already has a lot of and is tightly holding (holding) property (assets) like a house, land, stocks, and cash.' } }, examples: [{ kor: "집값이 오르면 집이 없는 사람들은 슬프지만 이미 집을 가진 자산 보유자들은 아주 기뻐합니다.", eng: "When house prices rise, people without houses are sad, but asset holders who already have houses are very happy." }], variants: ['자산 보유자', '자산 보유자에게'] },
                { term: '주식 양도세 대주주 기준', mainDef: '주식을 팔아서 번 돈에 세금(양도세)을 무조건 내야 하는 ‘진짜 큰 부자(대주주)’가 누구인지 가르는 기준선 (이 기준선이 높을수록 부자들이 세금을 안 냄)', translations: { en: { term: 'major shareholder standard for stock capital gains tax', mainDef: 'the dividing line defining who the "real big rich (major shareholder)" is that unconditionally must pay tax (capital gains tax) on money made from selling stocks (the higher this line, the more the rich avoid taxes).' } }, examples: [{ kor: "정부가 주식 양도세 대주주 기준을 50억 원으로 높여줘서 진짜 부자들만 세금을 안 내게 되었어요.", eng: "The government raised the major shareholder standard for stock capital gains tax to 5 billion won, so only the truly rich don't pay taxes." }], variants: ['주식 양도세 대주주 기준'] },
                { term: '상향되다', mainDef: '상(上 위) + 향(向 향할) -> 어떤 목표, 기준, 점수 등이 예전보다 더 위쪽이나 높은 쪽으로 올라가다', translations: { en: { term: 'to be raised / to be adjusted upward', mainDef: 'for a goal, standard, or score to go up higher or more upwards than before.' } }, examples: [{ kor: "우리 반의 평균 점수 목표가 80점에서 90점으로 크게 상향되었어요.", eng: "Our class's average score goal was significantly raised from 80 to 90 points." }], variants: ['상향되다', '상향된'] },
                { term: '시행령', mainDef: '시(施 베풀) + 행(行 다닐) + 령(令 명령) -> 국회에서 만든 커다란 법을 실제로 어떻게 쓸지 대통령이나 장관이 세세하게 정해 놓은 실천 명령', translations: { en: { term: 'enforcement decree', mainDef: 'a practical order detailed by the president or minister on how to actually use a major law made in the National Assembly.' } }, examples: [{ kor: "환경 보호법은 국회에서 통과되었고, 벌금을 어떻게 낼지는 내일 시행령으로 발표됩니다.", eng: "The environmental protection law passed in the National Assembly, and how fines will be paid will be announced tomorrow as an enforcement decree." }], variants: ['시행령'] },
                { term: '여론을 의식하다', mainDef: '일반 사람들의 공통적인 생각이나 눈치(여론)가 무서워서 자기가 하려던 일을 망설이거나 바꾸다', translations: { en: { term: 'to be conscious of public opinion', mainDef: 'to hesitate or change what one intended to do because of fear of the common thoughts or gaze (public opinion) of general people.' } }, examples: [{ kor: "정부는 전기 요금을 크게 올리고 싶었지만, 화가 난 국민들의 여론을 의식해서 조금만 올렸습니다.", eng: "The government wanted to raise electricity rates significantly, but raised them only a little, conscious of the angry public opinion." }], variants: ['여론을 의식하다', '여론을 의식해'] },
                { term: '양도차익 과세 대상', mainDef: '양(讓 사양할) + 도(渡 건널) + 차(差 다를) + 익(益 더할) -> 자기가 산 가격보다 더 비싸게 집이나 주식을 남에게 팔아서 남긴 돈(양도차익)에 대해 나라에서 세금을 매기기로 콕 찍어놓은 사람', translations: { en: { term: 'subject to capital gains tax', mainDef: 'a person pinpointed by the state to be taxed on the money left over (capital gains) from selling a house or stocks to someone else at a higher price than they bought it.' } }, examples: [{ kor: "그 할아버지는 땅을 팔아 10억 원을 벌었기 때문에 양도차익 과세 대상이 되어 세금을 많이 냈습니다.", eng: "That grandfather made 1 billion won selling land, so he became subject to capital gains tax and paid a lot in taxes." }], variants: ['양도차익 과세 대상'] },
                { term: '정부안', mainDef: '정(政 정사) + 부(府 관청) + 안(案 책상) -> 국회에서 국회의원들이 의논하기 전에 정부에서 “이렇게 법을 만들면 좋겠습니다” 하고 미리 짜서 낸 계획이나 서류', translations: { en: { term: 'government bill / government proposal', mainDef: 'a plan or document prepared and submitted in advance by the government saying "It would be good to make a law like this" before lawmakers discuss it in the National Assembly.' } }, examples: [{ kor: "내년도 나라 살림살이에 쓸 돈을 적은 정부안이 어제 국회에 도착했습니다.", eng: "The government proposal containing the money to be spent on next year's national economy arrived at the National Assembly yesterday." }], variants: ['정부안', '정부안보다'] },
                { term: '국회 심의 과정', mainDef: '국회의원들이 정부에서 가져온 계획이나 법안을 돋보기를 보듯 꼼꼼하게 따져보고(심의) 고칠 건 고치며 회의를 진행하는 순서나 시간(과정)', subDefs: [{ subTerm: '• 심의', subDef: '심(審 살필) + 의(議 의논할) -> 내용이 좋은지 나쁜지 깊이 살피고 토론함' }], translations: { en: { term: 'National Assembly deliberation process', mainDef: 'the sequence or time (process) where lawmakers meticulously scrutinize (deliberate) like looking through a magnifying glass at a plan or bill brought by the government and conduct meetings, fixing what needs to be fixed.', subDefs: [{ term: 'deliberation', def: 'deeply examining and discussing whether the content is good or bad.' }] } }, examples: [{ kor: "새로운 동물 보호법이 길고 복잡한 국회 심의 과정을 거쳐 드디어 진짜 법으로 통과되었어요.", eng: "The new animal protection law finally passed as a real law after going through a long and complex National Assembly deliberation process." }], variants: ['국회 심의 과정', '심의'] },
                { term: '세율', mainDef: '세(稅 세금) + 율(率 비율) -> 내가 번 돈이나 산 물건의 가격 중에서 세금을 몇 퍼센트(%)나 내야 하는지 정해놓은 비율', translations: { en: { term: 'tax rate', mainDef: 'the percentage (%) set for how much tax you have to pay out of the money you earned or the price of the goods you bought.' } }, examples: [{ kor: "돈을 엄청 많이 버는 사람들에게는 더 높은 40%의 세금이, 즉 높은 세율이 적용됩니다.", eng: "A higher tax of 40%, that is, a higher tax rate, is applied to people who make a ton of money." }], variants: ['세율'] },
                { term: '세부담', mainDef: '세(稅 세금) + 부(負 질) + 담(擔 멜) -> 나라에 세금을 내야 해서 등이나 어깨에 무거운 짐을 진 것처럼 사람들이 느끼는 돈의 무게와 심리적인 고통', translations: { en: { term: 'tax burden', mainDef: 'the weight of money and psychological pain people feel as if carrying a heavy load on their backs or shoulders because they have to pay taxes to the country.' } }, examples: [{ kor: "월급은 안 오르는데 세금만 늘어나서 서민들의 세부담이 아주 커졌습니다.", eng: "Salaries aren't going up but only taxes are increasing, so the tax burden on ordinary people has become very large." }], variants: ['세부담'] },
                { term: '조세 원칙', mainDef: '나라에서 국민에게 세금(조세)을 걷을 때 공평하게 걷기 위해 절대로 어겨서는 안 되는 가장 기본적이고 바른 규칙(원칙)', subDefs: [{ subTerm: '• 조세', subDef: '조(租 세금) + 세(稅 세금) -> 국가 살림을 위해 걷는 돈' }], translations: { en: { term: 'principle of taxation', mainDef: 'the most basic and correct rule (principle) that must never be broken to collect taxes fairly when the country collects taxes from citizens.', subDefs: [{ term: 'tax', def: 'money collected for running the country.' }] } }, examples: [{ kor: "돈이 많은 사람에게 더 많은 세금을 걷는 것은 가장 중요한 조세 원칙 중 하나입니다.", eng: "Collecting more taxes from people with a lot of money is one of the most important principles of taxation." }], variants: ['조세 원칙', '조세'] },
