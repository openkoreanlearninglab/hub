                    { text: "조세는 부의 재분배를 위한 핵심 기제다. 하지만 자본시장 활성화를 명분으로 한 반복적인 감세는 그 기능을 마비시켰다. 수익은 늘어났지만, 분배 경로는 차단된 셈이다. 이러한 왜곡을 바로잡기 위해 여야 합의로 도입된 것이 금융투자소득세(이하 금투세)였다. 금투세는 손실에도 세금을 내야 하는 기존 거래세 구조에서 벗어나, 실제  수익이 발생했을 때만 과세하고 손실은 이월할 수 있는 합리적인 과세 체계였다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "그러나 금투세는 정치적 이해관계와 왜곡된 여론 속에서 시행을 앞두고 끝내 폐지됐다. 금투세가 주가 하락을 유발할 것이라는 공포 마케팅이 시장을 장악했고, 정치권은 표심 앞에서 원칙을 접었다. 정작 금투세 폐지를 가장 반긴 이들은 일반 개인 투자자가 아니라, 비과세 혜택을 유지하고자 했던 거대 사모펀드와 초고액 자산가들이었다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "그 결과 “소득 있는 곳에 과세한다”는 조세의 기본 원칙이 무너졌고, 자산 불평등을 완화할 조세의 기능도 흐려졌다. 종합적인 자산 과세 개편 로드맵은 실종되고, 오히려 대다수 개인 투자자에게는 거래세를 유지하면서 지배주주에게는 배당소득 분리과세 혜택이 돌아가는 기형적인 구조가 고착됐다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "“지금은 아니다”라는 핑계는 유효한가?", trans: "", isHeading: true },
                    { text: "금투세 폐지 당시 정치권의 명분은 분명했다. 당시 이재명 대통령은 당대표 시절 “원칙적으로는 강행이 옳지만, 시장이 어렵고 투자자의 입장을 고려했다”며 폐지에 동의했다. 타당성은 인정하면서도 정치적 부담을 회피한 선택이었다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "일부 의원들은 코스피 지수가 3,000~4,000대에 도달하면 새로운 세제를 받아들일 수 있을 것이라는 ‘여건론’을 제시하기도 했다. 그러나 지금은 그 ‘여건’을 충분히 넘어선 상태다. 코스피는 5,000선을 향해 질주 중이며, 외국인 순매수, 시가총액 확대, 개인 투자 열기 등 모든 지표가 과열 신호를 보내고 있다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "그럼에도 불구하고 금투세 재도입 논의는 다시 살아나지 않았다. 오히려 감세 정책만이 논의 테이블에 오르며, 정책 방향은 여전히 자산 보유자에게 기울어 있다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "금융 과세 후퇴의 실체와 그 폐해", trans: "", isHeading: true },
                    { text: "2025년 세제 개편에서 정부는 주식 양도세 대주주 기준을 기존 10억 원으로 환원하겠다고 밝혔지만, 결국 윤석열 정부 당시 상향된 50억 원 기준을 유지했다. 정부 의지만으로도 시행령을 되돌릴 수 있었지만, 여론을 의식해 포기한 것이다. 그 결과 현재 양도차익 과세 대상은 전체 투자자의 0.004%에 불과한 초고액 자산가에만 해당된다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "배당소득 분리과세 역시 유리한 방향으로 완화됐다. 정부안보다  국회 심의 과정에서 더 낮은 세율이 적용되며, 가장 많은 배당을 받는 ‘회장님’들의 세부담은 오히려 줄었다. 조세 원칙과 형평을 무시한 이러한 감세 정책은, 과거 “기업에 세금을 깎아주면 투자와 고용이 늘어 세수가 증가한다”는 근거 없는 낙수효과 주장처럼 정치권을 지배하고 있다. 이는 매우 위험한 신호다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "노동보다 자본이 우대받는 사회", trans: "", isHeading: true },
                    { text: "자본시장에 대한 감세는 단순히 부자 감세를 넘어서, 우리 사회의 핵심 가치인 ‘노동’의 가치를 훼손하는 문제로 이어진다. 금융자산과 주식, 배당 수익은 극소수 자산가에게 집중되어 있고, 대부분의 가계는 여전히 근로소득과 이전소득에 의존하고 있다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "이러한 구조에서 자본이득에 대한 감세는 상위 자산계층의 소득만을 증폭시키고, 노동자들과의 격차를 더욱 확대시킨다. 임금은 투명하게 과세되지만, 수억 원의 주식 차익과 배당에는 ‘분리과세’와 ‘비과세’라는 특혜가 주어진다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "그 결과, 노동보다 자산에서 돈 버는 것이 더 유리한 사회가 제도적으로 고착화되고 있다. 청년들이 대출을 받아 주식시장에 뛰어드는 것도 탐욕이 아닌, 합리적 대응처럼 여겨지고 있다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "대만의 교훈, 통제되지 않는 자산 과열의 끝", trans: "", isHeading: true },
                    { text: "금투세 반대론자들은 1990년 대만의 주가 폭락 사례를 인용하지만, 그 진짜 교훈은 정반대다. 당시 대만은 주가지수가 2년 반 만에 10배 급등했고, 사회 전반이 ‘노동의 실종’ 상태에 빠져들었다. 이로 인해 대만 정부는 1989년 금투세 도입을 발표하며 통제 장치를 마련했다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "대만 사례가 말해주는 것은 “금투세를 도입하면 안 된다”가 아니라, “통제 장치 없이 자산 가격 급등을 방치하면 사회적 혼란이 발생한다”는 점이다. 한국도 이 교훈을 되새겨야 한다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "불평등 고착화와 재정 리스크", trans: "", isHeading: true },
                    { text: "‘2025년 가계금융복지조사’에 따르면 순자산 지니계수는 0.625로 사상 최고치를 기록했고, 상위 10%가 전체 순자산의 46.1%를 차지했다. 자산 격차가 빠르게 확대되고 있다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "코스피 5000, 누구를 위한 숫자인가", trans: "", isHeading: true },
                    { text: "정부는 “부동산 자금을 자본시장으로 유도하겠다”고 말하지만, 그 방식이 “세금을 덜 부과하겠다”는 것이라면 결국 자산 소득이 노동 소득보다 유리한 구조만 고착시킬 뿐이다.", trans: "" },
                    { text: "", trans: "", isBlank: true },
                    { text: "“코스피 5000 시대, 이제 국회와 정부는 답해야 한다. \n이 숫자가 소수 자산가만을 위한 불평등의 기록이 될 것인가, \n아니면 공정한 과세를 통해 모두 함께 성장하는 희망의 지표가 될 것인가.”", trans: "", isQuote: true },
                    { text: "", trans: "", isBlank: true },
                    { text: "지금 필요한 것은 감세가 아니다. 금융 과세 체계의 정상화다. 금투세 재도입, 대주주 기준 정상화, 배당소득 과세 원칙 회복 없이 ‘코스피 5000’은 그저 숫자일 뿐이다. 숫자만 키운 성장은, 그만큼의 그림자도 남긴다는 사실을 정치권은 명심해야 한다.", trans: "" }
                ]
            }
        ];

                { term: '◻︎◻︎을/를 둘러싼 논쟁', mainDef: '어떤 특정한 주제나 문제를 가운데 두고 여러 사람이 서로 다른 의견을 내며 다투는 일', subDefs: [{ subTerm: '• 논쟁', subDef: '논(論 논할) + 쟁(爭 다툴) -> 서로 다른 의견으로 말다툼을 함' }], translations: { en: { term: 'controversy surrounding [something]', mainDef: 'a dispute where many people express different opinions centering on a specific topic.', subDefs: [{ subTerm: 'debate / dispute', subDef: 'arguing with different opinions.' }] } }, examples: [{ kor: "새로운 세금 제도를 둘러싼 논쟁이 아주 뜨겁습니다.", eng: "The controversy surrounding the new tax system is very heated." }], variants: ['둘러싼 논쟁', '둘러싼 논쟁의'] },

                { term: '자산', mainDef: '자(資 재물) + 산(産 낳을) -> 개인이나 회사가 가지고 있는 돈, 집, 주식 등의 재산', translations: { en: { term: 'asset / property', mainDef: 'property such as money, houses, or stocks owned by an individual or company.' } }, examples: [{ kor: "그는 주식과 부동산 등 다양한 자산을 가지고 있어요.", eng: "He has various assets including stocks and real estate." }], variants: ['자산'] },
                { term: '냉소', mainDef: '냉(冷 찰) + 소(笑 웃음) -> 상대방을 쌀쌀맞은 태도로 비웃거나 무시하는 것', translations: { en: { term: 'cynicism / sneer', mainDef: 'mocking or ignoring the other person with a cold attitude.' } }, examples: [{ kor: "그의 엉뚱한 계획은 사람들의 냉소를 받았습니다.", eng: "His absurd plan met with people's cynicism." }], variants: ['냉소'] },
                { term: '체감도', mainDef: '체(體 몸) + 감(感 느낄) + 도(度 정도) -> 어떤 현상이나 변화를 몸이나 마음으로 직접 느끼는 정도', translations: { en: { term: 'perceived level / actual feeling', mainDef: 'the degree to which a phenomenon or change is directly felt by the body or mind.' } }, examples: [{ kor: "바람이 불어서 추위의 체감도가 크게 낮아졌어요.", eng: "Because of the wind, the perceived level of cold has dropped significantly." }], variants: ['체감도'] },
                { term: '증시', mainDef: '증(證 증거) + 시(市 저자) -> 주식이나 채권이 사고팔리는 시장 (증권 시장의 줄임말)', translations: { en: { term: 'stock market', mainDef: 'the market where stocks and bonds are bought and sold (short for securities market).' } }, examples: [{ kor: "오늘 아침 증시가 크게 흔들리며 하락 출발했어요.", eng: "This morning the stock market started lower, shaking significantly." }], variants: ['증시'] },
                { term: '실물', mainDef: '실(實 열매/실제) + 물(物 물건) -> 눈에 보이거나 만질 수 있는 진짜 물건, 또는 금융이 아닌 실제 경제', translations: { en: { term: 'real object / real economy', mainDef: 'a real object that can be seen or touched, or the actual economy as opposed to finance.' } }, examples: [{ kor: "온라인 사진보다 실물이 훨씬 예뻐요.", eng: "The real object is much prettier than the online photo." }], variants: ['실물'] },
                { term: '비판론자', mainDef: '비(批 칠) + 판(判 판단할) + 론(論 논할) + 자(者 사람) -> 어떤 정책이나 일의 잘못된 점을 짚어내고 반대하는 사람', translations: { en: { term: 'critic', mainDef: 'a person who points out the flaws of a policy or matter and opposes it.' } }, examples: [{ kor: "비판론자들은 그 계획이 너무 위험하다고 지적했어요.", eng: "Critics pointed out that the plan is too dangerous." }], variants: ['비판론자', '비판론자들'] },
                { term: '자산 보유 계층', mainDef: '집이나 돈, 주식 같은 재산을 넉넉하게 가지고 있는 사람들의 무리나 집단', subDefs: [{ subTerm: '• 자산', subDef: '가지고 있는 재산' }, { subTerm: '• 보유', subDef: '보(保 지킬) + 유(有 있을) -> 가지고 간직함' }], translations: { en: { term: 'asset-owning class', mainDef: 'a group of people who possess a sufficient amount of property like houses, money, or stocks.', subDefs: [{ subTerm: 'asset', subDef: 'owned property.' }, { subTerm: 'possession', subDef: 'keeping and holding.' }] } }, examples: [{ kor: "자산 보유 계층과 그렇지 않은 사람들의 차이가 커지고 있어요.", eng: "The gap between the asset-owning class and those who are not is widening." }], variants: ['자산 보유 계층'] },
                { term: '편중되다', mainDef: '편(偏 치우칠) + 중(重 무거울) -> 골고루 나뉘지 않고 한쪽으로만 너무 많이 쏠리거나 치우쳐 있다', translations: { en: { term: 'to be concentrated / biased', mainDef: 'to be overly leaned or tilted to one side without being evenly distributed.' } }, examples: [{ kor: "권력과 부가 소수의 사람들에게만 편중되어 있어요.", eng: "Power and wealth are concentrated only in a few people." }], variants: ['편중되다', '편중돼'] },
                { term: '임금', mainDef: '임(賃 품삭) + 금(金 쇠/돈) -> 회사에서 일을 한 대가로 노동자에게 주는 돈 (월급)', translations: { en: { term: 'wage / salary', mainDef: 'money given to workers in return for doing work at a company.' } }, examples: [{ kor: "물가는 오르는데 내 임금은 오르지 않아서 살기 힘들어요.", eng: "Prices are rising, but my wages aren't, so it's hard to make a living." }], variants: ['임금', '임금·고용·복지'] },
                { term: '물가', mainDef: '물(物 물건) + 가(價 값) -> 시장에서 파는 물건이나 서비스의 평균적인 가격', translations: { en: { term: 'prices (of commodities)', mainDef: 'the average price of goods or services sold in the market.' } }, examples: [{ kor: "최근 과일과 채소의 물가가 너무 많이 올랐어요.", eng: "Recently, the prices of fruits and vegetables have gone up too much." }], variants: ['물가'] },
                { term: '제자리에 머물다', mainDef: '앞으로 발전하거나 나아가지 못하고 원래 있던 상황이나 수준에 그대로 있다', subDefs: [{ subTerm: '• 제자리', subDef: '본래 있던 자리나 위치' }], translations: { en: { term: 'to remain at a standstill / stagnate', mainDef: 'to stay in the original situation or level without developing or moving forward.', subDefs: [{ subTerm: 'same place', subDef: 'the original place or position.' }] } }, examples: [{ kor: "10년 동안 내 월급은 오르지 않고 제자리에 머물고 있어요.", eng: "For 10 years, my salary hasn't increased and is remaining at a standstill." }], variants: ['제자리에 머물다', '제자리에 머문다는'] },
                { term: '증시 지수', mainDef: '주식 시장 전체의 가격 흐름이나 상태를 비교하기 쉽게 숫자로 나타낸 것', subDefs: [{ subTerm: '• 지수', subDef: '지(指 가리킬) + 수(數 셈) -> 변화를 알아보기 쉽게 만든 수치' }], translations: { en: { term: 'stock market index', mainDef: 'numbers representing the overall price flow or condition of the stock market for easy comparison.', subDefs: [{ subTerm: 'index', subDef: 'a figure made to easily see changes.' }] } }, examples: [{ kor: "어제보다 증시 지수가 하락하여 투자자들이 슬퍼합니다.", eng: "Investors are sad because the stock market index fell compared to yesterday." }], variants: ['증시 지수'] },
                { term: '지표', mainDef: '지(指 가리킬) + 표(標 푯말) -> 어떤 일의 상태나 방향을 알아볼 수 있는 기준이 되는 표시', translations: { en: { term: 'indicator / index', mainDef: 'a mark serving as a standard to understand the state or direction of a matter.' } }, examples: [{ kor: "실업률은 나라의 경제 상황을 보여주는 중요한 지표입니다.", eng: "The unemployment rate is an important indicator showing the country's economic situation." }], variants: ['지표'] },
                { term: '증시 호황기', mainDef: '주식 시장의 가격이 계속 오르고 거래가 매우 활발하여 상태가 아주 좋은 시기', subDefs: [{ subTerm: '• 호황기', subDef: '호(好 좋을) + 황(況 상황) + 기(期 때) -> 경제 활동이 아주 활발하고 좋은 시기' }], translations: { en: { term: 'stock market boom period', mainDef: 'a period when stock market prices continue to rise and trading is very active, resulting in a very good condition.', subDefs: [{ subTerm: 'boom period', subDef: 'a period when economic activity is very active and good.' }] } }, examples: [{ kor: "과거 증시 호황기에는 누구나 주식 투자로 돈을 벌 수 있었어요.", eng: "In past stock market boom periods, anyone could make money from stock investments." }], variants: ['증시 호황기', '증시 호황기에'] },
                { term: '체감 경기', mainDef: '신문이나 통계 숫자가 아니라, 일반 사람들이 일상생활에서 직접 피부로 느끼는 경제 상황', subDefs: [{ subTerm: '• 체감', subDef: '체(體 몸) + 감(感 느낄) -> 몸으로 직접 겪어 느낌' }, { subTerm: '• 경기', subDef: '경(景 볕) + 기(氣 기운) -> 경제 활동의 좋고 나쁜 상태' }], translations: { en: { term: 'perceived economic conditions', mainDef: 'the economic situation directly felt by ordinary people in their daily lives, not from newspapers or statistics.', subDefs: [{ subTerm: 'actual feeling', subDef: 'experiencing and feeling directly with the body.' }, { subTerm: 'economy', subDef: 'the good or bad state of economic activity.' }] } }, examples: [{ kor: "뉴스는 경제가 좋다고 하지만, 서민들의 체감 경기는 여전히 나빠요.", eng: "The news says the economy is good, but the perceived economic conditions of ordinary people are still bad." }], variants: ['체감 경기', '체감 경기와'] },
                { term: '괴리', mainDef: '괴(乖 어그러질) + 리(離 떠날) -> 두 가지가 서로 어긋나거나 동떨어져 있어서 차이가 큰 상태', translations: { en: { term: 'gap / discrepancy', mainDef: 'a state where two things are out of sync or far apart, showing a large difference.' } }, examples: [{ kor: "우리가 꿈꾸는 이상과 현실 사이에는 언제나 큰 괴리가 있어요.", eng: "There is always a big gap between the ideal we dream of and reality." }], variants: ['괴리'] },
                { term: '지수', mainDef: '지(指 가리킬) + 수(數 셈) -> 물가나 주가 등이 어떻게 변했는지 비교하기 쉽게 만든 숫자', translations: { en: { term: 'index / figure', mainDef: 'a number made to easily compare how prices or stock prices have changed.' } }, examples: [{ kor: "오늘 아침 발표된 경제 지수가 예상보다 훨씬 낮았어요.", eng: "The economic index announced this morning was much lower than expected." }], variants: ['지수'] },
                { term: '고용의 질', mainDef: '일자리가 얼마나 안정적인지, 임금이나 쉬는 시간 등 대우가 얼마나 좋은지를 나타내는 수준', subDefs: [{ subTerm: '• 고용', subDef: '고(雇 품팔) + 용(傭 품팔) -> 돈을 주고 사람에게 일을 시킴' }], translations: { en: { term: 'quality of employment', mainDef: 'the level indicating how stable a job is and how good the treatment like wages and break times are.', subDefs: [{ subTerm: 'employment', subDef: 'paying money to have someone work.' }] } }, examples: [{ kor: "단순히 일자리 수만 늘리지 말고 고용의 질을 높이는 것이 중요해요.", eng: "It is important to improve the quality of employment rather than just increasing the number of jobs." }], variants: ['고용의 질'] },
                { term: '개선되다', mainDef: '개(改 고칠) + 선(善 착할) -> 부족하거나 잘못된 점이 고쳐져서 상태가 더 좋아지다', translations: { en: { term: 'to be improved', mainDef: 'for lacking or wrong points to be fixed, making the state better.' } }, examples: [{ kor: "꾸준한 약 복용과 운동으로 환자의 건강이 많이 개선되었어요.", eng: "The patient's health has been greatly improved through consistent medication and exercise." }], variants: ['개선되다', '개선되지'] },
                { term: '실질임금 상승률', mainDef: '물가가 오른 것을 뺀 후, 실제로 물건을 살 수 있는 진짜 월급(실질임금)이 얼마나 올랐는지 나타내는 비율', subDefs: [{ subTerm: '• 실질', subDef: '실(實 열매) + 질(質 바탕) -> 겉모습이 아닌 실제의 성질이나 내용' }, { subTerm: '• 상승', subDef: '상(上 위) + 승(昇 오를) -> 위로 올라감' }], translations: { en: { term: 'real wage growth rate', mainDef: 'the rate showing how much the actual salary (real wage) that can buy things has increased after deducting inflation.', subDefs: [{ subTerm: 'substance/real', subDef: 'actual nature or content, not appearance.' }, { subTerm: 'rise', subDef: 'going up.' }] } }, examples: [{ kor: "물가가 너무 많이 올라서 실질임금 상승률은 오히려 마이너스입니다.", eng: "Prices have gone up too much, so the real wage growth rate is actually negative." }], variants: ['실질임금 상승률'] },
                { term: '인식을 강화하다', mainDef: '어떤 사물이나 상황에 대해 깨닫고 이해하는 마음(인식)을 더욱 강하고 단단하게 만들다', translations: { en: { term: 'to strengthen the perception', mainDef: 'to make the mind (perception) that realizes and understands a thing or situation stronger and firmer.' } }, examples: [{ kor: "이번 환경 보호 캠페인은 시민들의 인식을 강화하는 계기가 되었습니다.", eng: "This environmental protection campaign became an opportunity to strengthen citizens' perception." }], variants: ['인식을 강화하다', '인식을 강화했다'] },
                { term: '반론', mainDef: '반(反 돌이킬) + 론(論 논할) -> 상대방의 주장에 반대하며 내세우는 또 다른 의견이나 주장', translations: { en: { term: 'counterargument / objection', mainDef: "another opinion or claim put forward opposing the other party's claim." } }, examples: [{ kor: "그의 잘못된 주장에 대해 회의실에서 강한 반론을 제기했어요.", eng: "I raised a strong counterargument against his wrong claim in the meeting room." }], variants: ['반론'] },
                { term: '고용', mainDef: '고(雇 품팔) + 용(傭 품팔) -> 회사나 사장이 사람을 구해서 돈을 주고 일을 시킴', translations: { en: { term: 'employment', mainDef: 'a company or boss hiring a person and making them work for money.' } }, examples: [{ kor: "우리 마을에 새로운 공장이 생기면서 지역 주민들의 고용이 늘어났어요.", eng: "As a new factory was built in our village, the employment of local residents increased." }], variants: ['고용', '고용 확대'] },
                { term: '투자', mainDef: '투(投 던질) + 자(資 재물) -> 앞으로 이익을 얻기 위해 돈이나 시간, 정성을 쏟는 일', translations: { en: { term: 'investment', mainDef: 'pouring money, time, or devotion to gain profit in the future.' } }, examples: [{ kor: "미래를 위해 주식과 부동산에 돈을 투자했어요.", eng: "I invested money in stocks and real estate for the future." }], variants: ['투자', '투자·고용·임금'] },
                { term: '경로', mainDef: '경(經 지날) + 로(路 길) -> 어떤 곳으로 가는 길이나 일이 진행되는 방법과 과정', translations: { en: { term: 'path / route', mainDef: 'the way to go somewhere or the method and process by which work progresses.' } }, examples: [{ kor: "태풍이 우리나라로 올라오는 이동 경로를 뉴스로 확인해야 해요.", eng: "We must check the moving path of the typhoon coming up to our country through the news." }], variants: ['경로'] },
                { term: '거시경제', mainDef: '거(巨 클) + 시(視 볼) + 경제 -> 한 나라의 전체적인 물가, 실업률, 수출 등 크고 넓게 바라보는 경제 흐름', translations: { en: { term: 'macroeconomy', mainDef: "economic flow viewed broadly, such as a country's overall prices, unemployment rate, exports, etc." } }, examples: [{ kor: "한국은행은 국가의 전체적인 거시경제 지표를 분석합니다.", eng: "The Bank of Korea analyzes the country's overall macroeconomic indicators." }], variants: ['거시경제'] },
                { term: '자본 조달 비용', mainDef: '기업이 사업을 하기 위해 필요한 돈(자본)을 은행이나 시장에서 구해올 때 내야 하는 이자 등의 비용', subDefs: [{ subTerm: '• 조달', subDef: '조(調 고를) + 달(達 이를) -> 필요한 돈이나 물건을 구하여 대어 줌' }], translations: { en: { term: 'cost of capital', mainDef: 'costs like interest that a company must pay when obtaining necessary money (capital) from banks or the market for business.', subDefs: [{ subTerm: 'procurement/raising', subDef: 'obtaining and supplying necessary money or goods.' }] } }, examples: [{ kor: "은행의 대출 이자율이 오르면 기업의 자본 조달 비용도 따라서 커집니다.", eng: "If bank loan interest rates rise, the company's cost of capital also increases accordingly." }], variants: ['자본 조달 비용'] },
                { term: '투자 여력', mainDef: '기업이나 개인이 일상적인 지출을 빼고 새로운 곳에 돈을 투자할 수 있는 남은 힘이나 돈의 여유', subDefs: [{ subTerm: '• 여력', subDef: '여(餘 남을) + 력(力 힘) -> 어떤 일을 하고 아직 남아 있는 힘' }], translations: { en: { term: 'investment capacity', mainDef: 'the remaining strength or financial room a company or individual has to invest in new areas after regular expenses.', subDefs: [{ subTerm: 'spare capacity/reserve', subDef: 'strength remaining after doing something.' }] } }, examples: [{ kor: "지난해 장사가 잘 돼서 회사가 새로운 기술을 개발할 투자 여력이 생겼습니다.", eng: "Business was good last year, so the company has the investment capacity to develop new technology." }], variants: ['투자 여력'] },
                { term: '설비 투자', mainDef: '공장의 기계나 건물 등 물건을 생산하는 데 필요한 커다란 장비(설비)를 새로 사거나 짓는 데 돈을 쓰는 것', subDefs: [{ subTerm: '• 설비', subDef: '설(設 베풀) + 비(備 갖출) -> 필요한 시설이나 기계를 마련하여 갖춤' }], translations: { en: { term: 'capital investment / facility investment', mainDef: 'spending money to buy or build large equipment (facilities) like factory machines or buildings needed for production.', subDefs: [{ subTerm: 'equipment/facilities', subDef: 'preparing and equipping necessary facilities or machines.' }] } }, examples: [{ kor: "반도체 회사는 더 좋은 칩을 만들기 위해 공장에 큰 설비 투자를 진행했어요.", eng: "The semiconductor company proceeded with a large facility investment in the factory to make better chips." }], variants: ['설비 투자'] },
                { term: '실물 경제', mainDef: '주식이나 금융처럼 숫자로만 거래되는 시장이 아닌, 진짜 물건을 만들고 파는 실제의 경제 활동', subDefs: [{ subTerm: '• 실물', subDef: '실(實 실제) + 물(物 물건) -> 눈에 보이고 만질 수 있는 진짜 물건' }], translations: { en: { term: 'real economy', mainDef: 'actual economic activities of making and selling real goods, not markets traded only in numbers like stocks or finance.', subDefs: [{ subTerm: 'real object', subDef: 'a real thing that can be seen and touched.' }] } }, examples: [{ kor: "주식 시장은 뜨겁지만 공장이 문을 닫으면서 실물 경제는 무척 차갑습니다.", eng: "The stock market is hot, but the real economy is very cold as factories close." }], variants: ['실물 경제'] },
                { term: '선행 지표', mainDef: '진짜 경제나 상황이 변하기 전에 먼저 앞서서 앞으로의 변화 방향을 알려주는 기준 표시', subDefs: [{ subTerm: '• 선행', subDef: '선(先 먼저) + 행(行 갈) -> 남보다 앞서서 감' }, { subTerm: '• 지표', subDef: '어떤 현상을 알아보는 방향이나 기준' }], translations: { en: { term: 'leading indicator', mainDef: 'a standard mark that precedes and shows the direction of future changes before the real economy or situation changes.', subDefs: [{ subTerm: 'preceding', subDef: 'going ahead of others.' }, { subTerm: 'indicator', subDef: 'direction or standard to understand a phenomenon.' }] } }, examples: [{ kor: "주가 지수는 미래 경제 상황을 미리 예측할 수 있게 돕는 중요한 선행 지표입니다.", eng: "The stock price index is an important leading indicator that helps predict future economic conditions." }], variants: ['선행 지표'] },
                { term: '생활 지표', mainDef: '일반 사람들의 일상생활 수준이나 삶의 질이 지금 어떤지를 보여주는 기준 수치', subDefs: [{ subTerm: '• 지표', subDef: '어떤 사실을 평가하는 기준이 되는 표시' }], translations: { en: { term: 'lifestyle indicator / living standard index', mainDef: 'a benchmark figure showing the current level of daily life or quality of life of ordinary people.', subDefs: [{ subTerm: 'indicator', subDef: 'a mark serving as a standard to evaluate a fact.' }] } }, examples: [{ kor: "밥상 물가가 오르는 것은 서민들의 팍팍한 삶을 보여주는 슬픈 생활 지표예요.", eng: "Rising grocery prices are a sad lifestyle indicator showing the hard life of ordinary people." }], variants: ['생활 지표'] },
                { term: '내부 유보', mainDef: '회사가 번 이익을 바깥(주주나 투자자)으로 나누어 주지 않고 회사 금고(내부)에 저축해 미루어 두는 것', subDefs: [{ subTerm: '• 유보', subDef: '유(留 머무를) + 보(保 지킬) -> 일을 당장 처리하지 않고 나중으로 미루어 둠' }], translations: { en: { term: 'retained earnings / internal reserves', mainDef: 'saving and postponing the profits earned by a company in the company vault (internally) instead of distributing them outside.', subDefs: [{ subTerm: 'withhold/reserve', subDef: 'postponing a matter instead of handling it immediately.' }] } }, examples: [{ kor: "경제가 어려워질 것을 대비해 기업들이 투자 대신 내부 유보를 늘리고 있어요.", eng: "In preparation for economic difficulties, companies are increasing internal reserves instead of investing." }], variants: ['내부 유보', '내부 유보나'] },
                { term: '주주 환원', mainDef: '회사가 벌어들인 이익을 주식을 가진 사람들(주주)에게 배당금이나 주식 가치 상승으로 되돌려 주는 것', subDefs: [{ subTerm: '• 주주', subDef: '주(株 주식) + 주(主 주인) -> 주식을 가지고 있는 회사의 주인' }, { subTerm: '• 환원하다', subDef: '환(還 돌아올) + 원(元 으뜸) -> 원래의 상태나 주인에게 되돌려 줌' }], translations: { en: { term: 'shareholder return', mainDef: 'returning the profits earned by a company to shareholders through dividends or increased stock value.', subDefs: [{ subTerm: 'shareholder', subDef: 'owner of the company holding stocks.' }, { subTerm: 'to return/restore', subDef: 'returning to the original state or owner.' }] } }, examples: [{ kor: "그 회사는 번 돈의 많은 부분을 배당금으로 지급하여 적극적인 주주 환원을 실천했습니다.", eng: "That company practiced active shareholder return by paying out a large part of its earned money as dividends." }], variants: ['주주 환원'] },
                { term: '고착화되다', mainDef: '고(固 굳을) + 착(着 붙을) + 화(化 될) -> 어떤 나쁜 상황이나 상태가 딱딱하게 굳어져서 더 이상 변하지 않게 되다', translations: { en: { term: 'to become entrenched / fixated', mainDef: 'for a bad situation or state to become solidly fixed and no longer change.' } }, examples: [{ kor: "가난한 사람은 계속 가난한 사회 양극화 현상이 우리 사회에 고착화되고 있어 걱정입니다.", eng: "It's worrying that social polarization, where poor people stay poor, is becoming entrenched in our society." }], variants: ['고착화되다', '고착화됐다는'] },
                { term: '단정하다', mainDef: '단(斷 끊을) + 정(定 정할) -> 어떤 일에 대해 다른 가능성을 생각하지 않고 확실하게 "이렇다"고 딱 잘라서 결정하여 말하다', translations: { en: { term: 'to conclude / to assert', mainDef: 'to decisively determine and say "it is like this" without considering other possibilities.' } }, examples: [{ kor: "아직 확실한 증거가 없기 때문에 그 사람이 범인이라고 섣불리 단정할 수 없어요.", eng: "Since there is no clear evidence yet, we cannot hastily conclude that he is the culprit." }], variants: ['단정하다', '단정하기도'] },
                { term: '우세하다', mainDef: '우(優 넉넉할) + 세(勢 기세) -> 힘이나 세력, 상황 등이 상대방보다 더 크고 강하여 유리하다', translations: { en: { term: 'to be dominant / to have the upper hand', mainDef: 'power, force, or situation being greater and stronger than the opponent, thus advantageous.' } }, examples: [{ kor: "이번 반장 선거에서는 평소 인기가 많은 A 후보가 다른 후보들보다 훨씬 우세한 상황입니다.", eng: "In this class president election, candidate A, who is usually popular, has a much more dominant situation than the others." }], variants: ['우세하다'] },
                { term: '구조적 단절', mainDef: '경제나 사회의 시스템(구조) 자체가 문제여서 마땅히 이어져야 할 두 가지가 뚝 끊어져 있는 상태', subDefs: [{ subTerm: '• 단절', subDef: '단(斷 끊을) + 절(絶 끊을) -> 관계나 흐름이 끊어짐' }], translations: { en: { term: 'structural disconnection', mainDef: 'a state where two things that should be connected are completely broken off because the economic or social system itself is the problem.', subDefs: [{ subTerm: 'severance/disconnection', subDef: 'relationship or flow being cut off.' }] } }, examples: [{ kor: "기업이 돈을 벌어도 노동자의 월급이 오르지 않는 구조적 단절이 심각한 문제입니다.", eng: "The structural disconnection where workers' wages don't rise even when companies make money is a serious problem." }], variants: ['구조적 단절'] },
                { term: '비정규직 비중', mainDef: '전체 일하는 사람 중에서 정식 직원이 아닌 일시적인 계약으로 일하는 사람(비정규직)이 차지하는 비율', subDefs: [{ subTerm: '• 비정규직', subDef: '비(非 아닐) + 정(正 바를) + 규(規 법) + 직(職 직분) -> 계약 기간이 정해져 있어 고용이 불안정한 직원' }, { subTerm: '• 비중', subDef: '비(比 견줄) + 중(重 무거울) -> 전체에서 차지하는 중요도나 비율' }], translations: { en: { term: 'proportion of irregular workers', mainDef: 'the percentage of temporary contract workers (irregular workers) out of all workers.', subDefs: [{ subTerm: 'irregular worker', subDef: 'an employee with unstable employment due to a fixed contract period.' }, { subTerm: 'proportion/weight', subDef: 'importance or ratio occupied in the whole.' }] } }, examples: [{ kor: "요즘 청년들의 일자리는 안정적이지 못한 비정규직 비중이 너무 높아서 미래가 불안해요.", eng: "Nowadays, the proportion of irregular workers in youth jobs is too high, making their future unstable." }], variants: ['비정규직 비중'] },
                { term: '자영업', mainDef: '자(自 스스로) + 영(營 경영할) + 업(業 일) -> 회사에 다니지 않고 자기가 직접 가게나 회사를 차려서 하는 사업', translations: { en: { term: 'self-employment / own business', mainDef: 'business run by oneself by opening a shop or company instead of working for an employer.' } }, examples: [{ kor: "아버지는 회사를 그만두신 후에 치킨 가게를 차려 자영업을 시작하셨습니다.", eng: "After quitting his company, my father opened a chicken shop and started his own business." }], variants: ['자영업'] },
                { term: '취약 지점', mainDef: '어떤 조직, 시스템, 장소 등에서 방어가 가장 약해서 쉽게 무너지거나 상처받기 쉬운 곳', subDefs: [{ subTerm: '• 취약하다', subDef: '취(脆 연할) + 약(弱 약할) -> 무르고 약하여 위험에 잘 버티지 못하다' }], translations: { en: { term: 'weak point / vulnerability', mainDef: 'a place in an organization, system, or location that is the weakest and easily collapses or gets hurt.', subDefs: [{ subTerm: 'to be vulnerable', subDef: 'soft and weak, unable to withstand danger well.' }] } }, examples: [{ kor: "전문가들은 철저한 검사를 통해 우리 컴퓨터 보안 시스템의 가장 큰 취약 지점을 찾아냈어요.", eng: "Experts found the biggest weak point of our computer security system through thorough inspection." }], variants: ['취약 지점'] },
                { term: '비대칭 회복', mainDef: '경제가 좋아질 때, 대기업이나 부자들만 좋아지고 서민 경제는 여전히 나쁜 것처럼 한쪽으로만 쏠려서 회복되는 불균형한 현상', subDefs: [{ subTerm: '• 비대칭', subDef: '비(非 아닐) + 대(對 대답할) + 칭(稱 일컬을) -> 양쪽의 모양, 크기, 이익 등이 서로 같지 않음' }], translations: { en: { term: 'asymmetric recovery (K-shaped recovery)', mainDef: 'an unbalanced phenomenon where the economy recovers only leaning to one side, like only large corporations or the rich get better while the working-class economy remains bad.', subDefs: [{ subTerm: 'asymmetry', subDef: 'shapes, sizes, or profits of both sides not being equal.' }] } }, examples: [{ kor: "수출 대기업만 돈을 벌고 골목 식당들은 여전히 파리만 날리는 비대칭 회복이 나타나고 있어요.", eng: "An asymmetric recovery is appearing where only large export companies make money and alley restaurants are still empty." }], variants: ['비대칭 회복'] },
                { term: '개인 투자자', mainDef: '은행이나 큰 금융 회사가 아니라, 자기 개인의 돈으로 주식이나 부동산 시장에 참여하는 일반 사람 (개미 투자자)', translations: { en: { term: 'individual investor / retail investor', mainDef: 'an ordinary person participating in the stock or real estate market with their own money, not a bank or large financial company.' } }, examples: [{ kor: "스마트폰으로 쉽게 주식을 살 수 있게 되면서 20대 개인 투자자들이 크게 늘어났어요.", eng: "As it became easy to buy stocks with smartphones, individual investors in their 20s have increased significantly." }], variants: ['개인 투자자'] },
                { term: '비중이 커지다', mainDef: '전체 속에서 그것이 차지하는 양이나 중요성이 이전보다 더 많아지거나 강해지다', subDefs: [{ subTerm: '• 비중', subDef: '비(比 견줄) + 중(重 무거울) -> 전체 안에서 차지하는 중요도나 비율' }], translations: { en: { term: 'proportion grows / to increase in weight', mainDef: 'the amount or importance it occupies within the whole becomes more or stronger than before.', subDefs: [{ subTerm: 'proportion/weight', subDef: 'importance or ratio occupied within the whole.' }] } }, examples: [{ kor: "온라인 쇼핑의 비중이 커지면서 동네에 있던 오프라인 옷 가게들이 문을 닫고 있어요.", eng: "As the proportion of online shopping grows, offline clothing stores in the neighborhood are closing." }], variants: ['비중이 커지다', '비중이 커진'] },
                { term: '전유물', mainDef: '전(專 오로지) + 유(有 있을) + 물(物 물건) -> 오직 혼자서만 차지하여 가지는 물건이나 특권', translations: { en: { term: 'exclusive property / monopoly', mainDef: 'an object or privilege exclusively owned or occupied by someone alone.' } }, examples: [{ kor: "예전에는 해외여행이 부자들의 전유물처럼 여겨졌지만 지금은 누구나 갈 수 있어요.", eng: "In the past, overseas travel was considered the exclusive property of the rich, but now anyone can go." }], variants: ['전유물'] },
                { term: '가계 재무 구조 전반', mainDef: '일반 가정에서 돈을 벌고, 쓰고, 빚을 갚는 등 돈과 관련된 전체적인 살림살이 상태', subDefs: [{ subTerm: '• 가계', subDef: '가(家 집) + 계(計 셈할) -> 한 집안의 수입과 지출의 상태' }, { subTerm: '• 재무', subDef: '재(財 재물) + 무(務 힘쓸) -> 돈이나 재산과 관련된 일' }, { subTerm: '• 전반', subDef: '전(全 온전할) + 반(般 가지) -> 전체에 걸친 모든 것' }], translations: { en: { term: 'overall household financial structure', mainDef: 'the overall state of living related to money in an ordinary family, such as earning, spending, and paying off debts.', subDefs: [{ subTerm: 'household', subDef: 'state of income and expenditure of a household.' }, { subTerm: 'finance', subDef: 'work related to money or property.' }, { subTerm: 'overall', subDef: 'everything spanning the whole.' }] } }, examples: [{ kor: "은행 대출 이자가 너무 높아지면서 우리 집 가계 재무 구조 전반이 아주 나빠졌어요.", eng: "As bank loan interest rates got too high, our overall household financial structure became very bad." }], variants: ['가계 재무 구조 전반'] },
                { term: '금융', mainDef: '금(金 쇠/돈) + 융(融 녹을/통할) -> 돈을 빌려주고 빌리는 일이나 시장에서 돈이 돌아가는 흐름', translations: { en: { term: 'finance', mainDef: 'lending and borrowing money or the flow of money in the market.' } }, examples: [{ kor: "은행과 보험사는 사람들이 돈을 맡기고 빌릴 수 있는 대표적인 금융 기관입니다.", eng: "Banks and insurance companies are representative financial institutions where people can deposit and borrow money." }], variants: ['금융'] },
                { term: '차입', mainDef: '차(借 빌릴) + 입(入 들일) -> 부족한 돈을 메우기 위해 은행이나 다른 사람에게서 돈이나 물건을 빌려 옴', translations: { en: { term: 'borrowing', mainDef: 'borrowing money or goods from a bank or another person to make up for a shortage.' } }, examples: [{ kor: "그 청년은 식당 사업을 시작하기 위해 은행에서 큰돈을 차입했습니다.", eng: "The young man borrowed a large amount of money from the bank to start his restaurant business." }], variants: ['차입'] },
                { term: '동반하다', mainDef: '동(同 한꺼번에) + 반(伴 짝) -> 어떤 일이나 현상이 혼자 일어나지 않고 다른 일과 함께 짝을 이루어 나타나다', translations: { en: { term: 'to accompany / to entail', mainDef: 'for an event or phenomenon to not occur alone but appear together with another event.' } }, examples: [{ kor: "어젯밤에는 강한 바람을 동반한 폭우가 쏟아져서 나무가 쓰러졌어요.", eng: "Last night, heavy rain accompanied by strong winds poured down, knocking over trees." }], variants: ['동반하다', '동반한'] },
                { term: '증시 조정', mainDef: '주식 시장에서 가격이 비정상적으로 계속 오르다가 거품이 꺼지며 잠깐 떨어져서 가격의 균형을 맞추는 현상', subDefs: [{ subTerm: '• 증시', subDef: '주식이 거래되는 시장' }], translations: { en: { term: 'stock market correction', mainDef: 'a phenomenon in the stock market where prices briefly fall after rising abnormally, balancing the prices as the bubble bursts.', subDefs: [{ subTerm: 'stock market', subDef: 'market where stocks are traded.' }] } }, examples: [{ kor: "주가가 며칠 동안 미친 듯이 계속 오르더니 오늘은 증시 조정을 받아 가격이 조금 떨어졌어요.", eng: "The stock prices kept rising crazily for days, and today they took a stock market correction and fell a bit." }], variants: ['증시 조정'] },
                { term: '환산되다', mainDef: '환(換 바꿀) + 산(算 셈) -> 어떤 단위나 가치가 다른 종류의 단위나 가치로 바뀌어 계산되다', translations: { en: { term: 'to be converted (into)', mainDef: 'a unit or value being changed and calculated into a different kind of unit or value.' } }, examples: [{ kor: "미국 여행을 갈 때 100달러는 한국 돈으로 약 13만 원 정도로 환산됩니다.", eng: "When traveling to the US, 100 dollars is converted to about 130,000 Korean won." }], variants: ['환산되다'] },
                { term: '상승기', mainDef: '상(上 위) + 승(昇 오를) + 기(期 때) -> 가격, 온도, 수치 등이 위로 꾸준하게 계속 올라가는 시기', subDefs: [{ subTerm: '• -기', subDef: '기(期 기약할/때) -> 어떤 일의 일정한 시기나 기간' }], translations: { en: { term: 'period of rise / upturn', mainDef: 'a period when prices, temperatures, or figures steadily go up.', subDefs: [{ subTerm: 'period/phase', subDef: 'a certain period or duration of an event.' }] } }, examples: [{ kor: "부동산 시장의 상승기에는 많은 사람들이 아파트를 사려고 몰려듭니다.", eng: "During the upturn of the real estate market, many people flock to buy apartments." }], variants: ['상승기', '상승기일수록'] },
                { term: '자산 가격의 잔치', mainDef: '집이나 주식 같은 재산(자산)의 가격이 아주 크게 올라서 집주인이나 투자자들이 파티(잔치)를 하듯 좋아하는 현상', subDefs: [{ subTerm: '• 자산', subDef: '개인이나 회사가 가진 돈이나 재산' }], translations: { en: { term: 'feast of asset prices (asset price bubble)', mainDef: 'a phenomenon where prices of properties (assets) like houses or stocks rise hugely, making owners or investors rejoice as if having a party.', subDefs: [{ subTerm: 'asset', subDef: 'money or property owned by an individual or company.' }] } }, examples: [{ kor: "부동산 가격이 너무 많이 오르면서 돈 있는 투기꾼들만의 자산 가격의 잔치가 벌어졌어요.", eng: "As real estate prices rose too much, a feast of asset prices occurred only for wealthy speculators." }], variants: ['자산 가격의 잔치'] },
                { term: '선순환', mainDef: '선(善 착할) + 순(循 돌) + 환(環 고리) -> 좋은 원인이 좋은 결과를 낳고, 그 결과가 다시 좋은 원인이 되어 계속 발전하는 빙글빙글 도는 고리', subDefs: [{ subTerm: '• 선-', subDef: '착하고 좋은 방향의' }, { subTerm: '• 순환', subDef: '둥글게 돌고 돎' }], translations: { en: { term: 'virtuous cycle', mainDef: 'a cycle where a good cause yields a good result, which again becomes a good cause, continuing to develop in a loop.', subDefs: [{ subTerm: 'virtuous/good', subDef: 'in a good direction.' }, { subTerm: 'circulation', subDef: 'turning round and round.' }] } }, examples: [{ kor: "투자가 늘면 일자리가 생기고 사람들의 씀씀이가 커져 경제가 성장하는 선순환 구조가 필요해요.", eng: "We need a virtuous cycle structure where increased investment creates jobs and people's spending grows, leading to economic growth." }], variants: ['선순환'] },
                { term: '맞물리다', mainDef: '두 개 이상의 물건이나 상황이 톱니바퀴처럼 서로 어긋남 없이 딱 들어맞아 꽉 연결되다', translations: { en: { term: 'to mesh / to interconnect', mainDef: 'two or more objects or situations fitting together perfectly and connecting tightly like cogwheels.' } }, examples: [{ kor: "정부의 지원과 시민들의 노력이 잘 맞물려 마을의 환경이 아주 깨끗해졌어요.", eng: "The government's support and citizens' efforts meshed well, making the village environment very clean." }], variants: ['맞물리다', '맞물릴'] },
                { term: '이정표', mainDef: '이(里 마을) + 정(程 길/단위) + 표(標 푯말) -> 길의 방향과 거리를 알려주는 팻말, 혹은 역사적으로 앞으로 나아갈 방향을 알려주는 아주 중요한 사건이나 기준', translations: { en: { term: 'milestone / signpost', mainDef: 'a sign indicating direction and distance of a road, or a very important event or standard showing the direction to move forward historically.' } }, examples: [{ kor: "오늘 서명한 평화 조약은 두 나라 관계 발전의 새로운 이정표가 될 것입니다.", eng: "The peace treaty signed today will be a new milestone in the development of relations between the two countries." }], variants: ['이정표'] },
                { term: '급부상하다', mainDef: '급(急 급할) + 부(浮 뜰) + 상(上 위) -> 갑자기 물 위로 떠오르듯이, 어떤 사람이나 문제가 순식간에 사람들의 주목을 받는 아주 중요한 위치로 올라오다', subDefs: [{ subTerm: '• 급-', subDef: '갑자기 빠른' }, { subTerm: '• 부상하다', subDef: '물 위로 떠오르다' }], translations: { en: { term: 'to emerge rapidly / to rise suddenly', mainDef: "for a person or issue to instantly rise to a very important position receiving people's attention, like suddenly floating above water.", subDefs: [{ subTerm: 'sudden/rapid', subDef: 'suddenly fast.' }, { subTerm: 'to surface/emerge', subDef: 'to float above water.' }] } }, examples: [{ kor: "그 무명 배우는 드라마가 대성공을 거두면서 하루아침에 최고의 스타로 급부상했어요.", eng: "The unknown actor emerged rapidly as a top star overnight as the drama achieved great success." }], variants: ['급부상하다', '급부상하고'] }
            ],
            2: [
                { term: '코스피', mainDef: 'KOSPI (Korea Composite Stock Price Index) -> 한국 주식 시장의 전체적인 흐름을 보여주는 종합 주가 지수', translations: { en: { term: 'KOSPI', mainDef: 'Korea Composite Stock Price Index, an indicator of the overall Korean stock market.' } }, examples: [{ kor: "오늘 코스피 지수가 어제보다 크게 올랐어요.", eng: "The KOSPI index rose significantly today compared to yesterday." }], variants: ['코스피', '코스피 5000', '코스피 5000이라'] },
                { term: '저평가', mainDef: '저(低 낮을) + 평(評 평가할) + 가(價 값) -> 실제 가지고 있는 가치나 능력보다 더 낮게 평가를 받는 것', translations: { en: { term: 'undervaluation', mainDef: 'being evaluated lower than the actual value or ability.' } }, examples: [{ kor: "이 회사의 주식은 돈을 잘 버는데도 시장에서 저평가를 받고 있어요.", eng: "This company's stock is undervalued in the market even though it makes good money." }], variants: ['저평가', '저평가 원인'] },
                { term: '소액주주', mainDef: '회사의 주식을 조금만 가지고 있는 사람', subDefs: [{ subTerm: '• 소액', subDef: '소(小 작을) + 액(額 액수) -> 아주 적은 액수의 돈' }, { subTerm: '• 주주', subDef: '주(株 주식) + 주(主 주인) -> 주식을 사서 회사의 주인이 된 사람' }], translations: { en: { term: 'minority shareholder', mainDef: 'a person who holds a small amount of a company\'s stock.', subDefs: [{ term: 'small amount', def: 'a very small amount of money.' }, { term: 'shareholder', def: 'a person who bought stocks and became an owner of the company.' }] } }, examples: [{ kor: "큰 회사일수록 소액을 투자한 주주들의 의견도 중요하게 들어야 해요.", eng: "The larger the company, the more important it is to listen to the opinions of shareholders who invested small amounts." }], variants: ['소액주주'] },
                { term: '대주주', mainDef: '회사의 주식을 아주 많이 가지고 있어서 회사 결정에 힘이 센 사람', subDefs: [{ subTerm: '• 주주', subDef: '주식을 가지고 있는 사람' }], translations: { en: { term: 'major shareholder', mainDef: 'a person who has a lot of influence in company decisions because they hold a large amount of stock.', subDefs: [{ term: 'shareholder', def: 'a person holding stocks.' }] } }, examples: [{ kor: "회사의 방향을 바꿀 때는 대주주의 의견이 가장 큰 영향을 미쳐요.", eng: "When changing the company's direction, the major shareholder's opinion has the biggest impact." }], variants: ['대주주'] },
                { term: '배당 확대 독려', mainDef: '주주들에게 나누어 주는 이익(배당)을 더 늘리도록 적극적으로 권장하고 부추김', subDefs: [{ subTerm: '• 배당', subDef: '배(配 나눌) + 당(當 마땅) -> 회사가 번 이익을 주식의 수에 따라 나누어 줌' }, { subTerm: '• 독려', subDef: '독(督 감독할) + 려(勵 힘쓸) -> 일이 잘되도록 격려하고 칭찬하여 북돋아 줌' }], translations: { en: { term: 'encouraging increased dividends', mainDef: 'actively encouraging and urging to increase the profits (dividends) given to shareholders.', subDefs: [{ term: 'dividend', def: 'distributing the company\'s earned profits according to the number of shares.' }, { term: 'encouragement', def: 'encouraging and cheering to do well.' }] } }, examples: [{ kor: "정부는 기업들이 주주들에게 배당을 늘리도록 강하게 독려하고 있습니다.", eng: "The government is strongly encouraging companies to increase dividends for shareholders." }], variants: ['배당 확대 독려'] },
                { term: '이사의 주주에 대한 충실 의무', mainDef: '회사를 이끄는 이사가 주주들의 이익을 지키기 위해 최선을 다해야 하는 법적인 책임', subDefs: [{ subTerm: '• 이사', subDef: '회사의 중요한 일을 결정하고 책임을 지는 사람' }, { subTerm: '• 주주', subDef: '주식을 가진 사람' }, { subTerm: '• 충실', subDef: '충(忠 충성할) + 실(實 열매/참될) -> 정성스럽고 속이 꽉 차서 참됨' }], translations: { en: { term: 'director\'s duty of loyalty to shareholders', mainDef: 'the legal responsibility of a director leading the company to do their best to protect the shareholders\' interests.', subDefs: [{ term: 'director', def: 'a person who decides and takes responsibility for important company matters.' }, { term: 'shareholder', def: 'a person holding stocks.' }, { term: 'loyalty / faithfulness', def: 'being sincere and true with a full heart.' }] } }, examples: [{ kor: "이사는 개인의 욕심보다 회사의 이익을 먼저 생각하는 충실한 태도를 가져야 해요.", eng: "A director must have a faithful attitude of prioritizing the company's interests over personal greed." }], variants: ['이사의 주주에 대한 충실 의무'] },
                { term: '소액주주의 권한', mainDef: '주식을 적게 가진 사람들(소액주주)이 회사에 대해 행사할 수 있는 정당한 힘이나 권리', translations: { en: { term: 'rights of minority shareholders', mainDef: 'the legitimate power or rights that people with a small amount of stock can exercise regarding the company.' } }, examples: [{ kor: "요즘은 소액주주의 권한이 강해져서 회사 결정에 반대 목소리를 낼 수 있어요.", eng: "Nowadays, the rights of minority shareholders have become stronger, allowing them to voice opposition to company decisions." }], variants: ['소액주주의 권한', '소액주주의 권한 강화'] },
                { term: '자사주 소각 의무화', mainDef: '회사가 자기가 발행한 주식을 사서 불태워 없애는 것(소각)을 반드시 하도록 법으로 정함', subDefs: [{ subTerm: '• 자사주', subDef: '자(自 스스로) + 사(社 회사) + 주(株 주식) -> 자기 회사가 발행한 주식' }, { subTerm: '• 소각', subDef: '소(燒 불사를) + 각(却 물리칠) -> 불에 태워 없애 버림 (주식을 없애서 남은 주식의 가치를 높임)' }], translations: { en: { term: 'mandatory cancellation of treasury stock', mainDef: 'making it legally mandatory for a company to buy and destroy its own issued stocks.', subDefs: [{ term: 'treasury stock', def: 'stocks issued by one\'s own company.' }, { term: 'cancellation (by burning)', def: 'destroying by burning (eliminating stocks to increase the value of remaining ones).' }] } }, examples: [{ kor: "회사가 주식을 사서 소각하면 시장에 남은 주식의 가격이 올라갑니다.", eng: "If a company buys and cancels its stocks, the price of the remaining stocks in the market goes up." }], variants: ['자사주 소각 의무화'] },
                { term: '배당소득 분리과세', mainDef: '배당금으로 얻은 돈을 다른 수입과 합치지 않고 따로 떼어내서 세금을 매기는 제도', subDefs: [{ subTerm: '• 배당', subDef: '주식 투자로 얻는 이익금' }, { subTerm: '• 소득', subDef: '소(所 바) + 득(得 얻을) -> 일하여 벌어들인 돈' }, { subTerm: '• 분리', subDef: '분(分 나눌) + 리(離 떠날) -> 따로 나누어 떨어지게 함' }, { subTerm: '• 과세', subDef: '과(課 매길) + 세(稅 세금) -> 나라에서 세금을 내라고 정함' }], translations: { en: { term: 'separate taxation on dividend income', mainDef: 'a system of separating money earned from dividends from other income to tax it separately.', subDefs: [{ term: 'dividend', def: 'profit earned from stock investment.' }, { term: 'income', def: 'money earned by working.' }, { term: 'separation', def: 'dividing and setting apart.' }, { term: 'taxation', def: 'the government levying taxes.' }] } }, examples: [{ kor: "세금을 덜 내기 위해 내 소득을 분리해서 계산하는 제도를 알아봤어요.", eng: "I looked into the system of calculating my income separately to pay less in taxes." }], variants: ['배당소득 분리과세'] },
                { term: '밸류 업 정책', mainDef: '밸류 업(Value-up 가치를 높이다) + 정(政 정사) + 책(策 꾀) -> 한국 기업들의 가치를 높이기 위해 정부가 펴는 정책', translations: { en: { term: 'value-up policy', mainDef: 'a policy implemented by the government to increase the value of Korean companies.' } }, examples: [{ kor: "밸류 업 정책 덕분에 주식 시장에 사람들이 많이 몰렸어요.", eng: "Thanks to the value-up policy, many people flocked to the stock market." }], variants: ['밸류 업 정책'] },
                { term: '여세를 몰아(서)', mainDef: '기운이나 세력이 남은 것을 이용하여 계속 앞으로 나아가다', subDefs: [{ subTerm: '• 여세', subDef: '여(餘 남을) + 세(勢 기세) -> 어떤 일이 진행되고 남은 기운' }], translations: { en: { term: 'taking advantage of the momentum', mainDef: 'continuing to move forward using the remaining energy or influence.', subDefs: [{ term: 'remaining momentum', def: 'the energy left over from an event.' }] } }, examples: [{ kor: "우리 팀은 첫 경기에서 이긴 여세를 몰아 우승까지 차지했습니다.", eng: "Our team took advantage of the momentum from winning the first game and went on to win the championship." }], variants: ['여세를 몰아'] },
                { term: '부동산 투기', mainDef: '땅이나 집의 가격이 오를 것을 예상하고 큰 이익을 얻기 위해 과도하게 돈을 투자하는 일', subDefs: [{ subTerm: '• 부동산', subDef: '부(不 아닐) + 동(動 움직일) + 산(産 낳을) -> 땅이나 건물처럼 움직일 수 없는 재산' }, { subTerm: '• 투기', subDef: '투(投 던질) + 기(機 틀/기회) -> 기회를 타서 우연히 큰 이익을 얻으려고 돈을 쓰는 것' }], translations: { en: { term: 'real estate speculation', mainDef: 'investing money excessively in land or houses expecting the prices to rise to gain large profits.', subDefs: [{ term: 'real estate', def: 'immovable property like land or buildings.' }, { term: 'speculation', def: 'spending money hoping to gain large profits by chance.' }] } }, examples: [{ kor: "정부는 비정상적인 부동산 투기를 막기 위해 새로운 법을 만들었어요.", eng: "The government made a new law to stop abnormal real estate speculation." }], variants: ['부동산 투기'] },
                { term: '근절하다', mainDef: '근(根 뿌리) + 절(絶 끊을) -> 나쁜 일의 뿌리를 완전히 끊어서 없애 버리다', translations: { en: { term: 'to eradicate / to stamp out', mainDef: 'to completely cut off and eliminate the root of a bad thing.' } }, examples: [{ kor: "학교 폭력을 근절하기 위해 학생과 교사가 함께 노력해야 합니다.", eng: "Students and teachers must work together to eradicate school violence." }], variants: ['근절하다', '근절하여'] },
                { term: '수요억제책', mainDef: '물건을 사고자 하는 사람들의 마음이나 행동(수요)을 억누르는 방법이나 정책', subDefs: [{ subTerm: '• 수요', subDef: '수(需 구할) + 요(要 구할) -> 물건이나 서비스를 사고자 하는 마음' }, { subTerm: '• 억제', subDef: '억(抑 누를) + 제(制 절제할) -> 감정이나 행동을 억눌러서 막음' }, { subTerm: '• -책', subDef: '책(策 꾀) -> 어떤 일을 처리하기 위한 방법이나 계획' }], translations: { en: { term: 'demand suppression policy', mainDef: 'a method or policy to suppress people\'s desire or behavior to buy things.', subDefs: [{ term: 'demand', def: 'the desire to buy goods or services.' }, { term: 'suppression', def: 'suppressing and stopping emotions or actions.' }, { term: '-measure/policy', def: 'a method or plan to handle a matter.' }] } }, examples: [{ kor: "집값이 오르자 정부는 대출을 어렵게 하는 수요억제책을 썼어요.", eng: "As house prices rose, the government used a demand suppression policy making it harder to get loans." }], variants: ['수요억제책', '수요억제책만으로'] },
                { term: '교훈 삼다', mainDef: '실패나 실수를 바탕으로 앞으로의 행동에 도움이 될 만한 가르침(교훈)으로 받아들이다', translations: { en: { term: 'to learn a lesson (from)', mainDef: 'to take failure or mistakes as a teaching (lesson) that will be helpful for future actions.' } }, examples: [{ kor: "이번 시험의 실패를 교훈 삼아 다음에는 더 열심히 공부할 거예요.", eng: "I will learn a lesson from this test failure and study harder next time." }], variants: ['교훈 삼다', '교훈 삼아'] },
                { term: '임기 초', mainDef: '대통령이나 회장이 맡은 일을 하기로 정해진 기간(임기)의 처음 시작 부분', subDefs: [{ subTerm: '• 임기', subDef: '임(任 맡길) + 기(期 기약할) -> 직무를 맡아보는 일정한 기간' }], translations: { en: { term: 'early in the term', mainDef: 'the very beginning of the designated period for performing duties (term) as a president or chairman.', subDefs: [{ term: 'term of office', def: 'a set period of holding office.' }] } }, examples: [{ kor: "새로운 시장님은 임기 초부터 바쁘게 회의를 진행했어요.", eng: "The new mayor has been busy conducting meetings since early in his term." }], variants: ['임기 초', '임기 초부터'] },
                { term: '공급확대에 나서다', mainDef: '필요한 물건이나 주택 등을 더 많이 만들어서 주려고(공급확대) 적극적으로 행동을 시작하다', translations: { en: { term: 'to set out to expand supply', mainDef: 'to actively start taking actions to make and provide more necessary goods or housing.' } }, examples: [{ kor: "정부가 아파트 가격을 잡기 위해 공급확대에 나섰습니다.", eng: "The government set out to expand supply to control apartment prices." }], variants: ['공급확대에 나서다', '공급확대에 나선', '공급확대는'] },
                { term: '주가 급등', mainDef: '주식의 가격(주가)이 갑자기 아주 빠르게 높이 오름', subDefs: [{ subTerm: '• 주가', subDef: '주식 시장에서 거래되는 주식의 가격' }, { subTerm: '• 급등', subDef: '급(急 급할) + 등(騰 오를) -> 갑자기 빠른 속도로 뛰어오름' }], translations: { en: { term: 'surge in stock prices', mainDef: 'the price of a stock suddenly and very quickly rising high.', subDefs: [{ term: 'stock price', def: 'the price of a stock traded in the market.' }, { term: 'surge / skyrocket', def: 'jumping up suddenly at a fast speed.' }] } }, examples: [{ kor: "회사의 새로운 기술 발표 이후 주가가 급등했어요.", eng: "Following the company's new technology announcement, its stock price surged." }], variants: ['주가 급등'] },
                { term: '반도체', mainDef: '반(半 반) + 도(導 이끌) + 체(體 몸) -> 컴퓨터나 스마트폰에 들어가는 두뇌 역할을 하는 작고 중요한 부품', translations: { en: { term: 'semiconductor', mainDef: 'a small and important component that acts as a brain in computers or smartphones.' } }, examples: [{ kor: "한국은 세계에서 질 좋은 반도체를 가장 잘 만드는 나라 중 하나예요.", eng: "Korea is one of the best countries in the world at making high-quality semiconductors." }], variants: ['반도체', '반도체 수요'] },
                { term: '폭증하다', mainDef: '폭(暴 사나울) + 증(增 더할) -> 폭발하는 것처럼 갑자기 아주 사나운 기세로 엄청나게 늘어나다', translations: { en: { term: 'to skyrocket / to explode in number', mainDef: 'to increase tremendously and suddenly as if exploding.' } }, examples: [{ kor: "여름이 되자 에어컨을 사는 사람들이 폭증하고 있어요.", eng: "As summer arrives, the number of people buying air conditioners is skyrocketing." }], variants: ['폭증하다', '폭증하는'] },
                { term: '성장 동력', mainDef: '경제나 기업이 계속해서 커지고 발전할 수 있게 밀어주는 새로운 기술이나 힘', subDefs: [{ subTerm: '• 동력', subDef: '동(動 움직일) + 력(力 힘) -> 사물을 움직이게 하는 근본적인 힘' }], translations: { en: { term: 'growth engine', mainDef: 'a new technology or power that pushes the economy or a company to continue growing and developing.', subDefs: [{ term: 'motive power', def: 'the fundamental power that makes things move.' }] } }, examples: [{ kor: "전기자동차는 미래 산업을 이끌어갈 중요한 성장 동력입니다.", eng: "Electric vehicles are an important growth engine that will lead future industries." }], variants: ['성장 동력'] },
                { term: '선보이다', mainDef: '어떤 물건이나 사람, 새로운 기술 등을 세상 사람들에게 처음으로 보여주다', translations: { en: { term: 'to show / to present for the first time', mainDef: 'to show an object, person, or new technology to people in the world for the first time.' } }, examples: [{ kor: "그 회사는 어제 스마트폰의 새로운 기능을 세상에 선보였어요.", eng: "That company presented the new feature of its smartphone to the world yesterday." }], variants: ['선보이다', '선보인'] },
                { term: '핍박을 견디다', mainDef: '남이 나를 몹시 괴롭히고 억누르는 힘든 일(핍박)을 꾹 참고 이겨내다', subDefs: [{ subTerm: '• 핍박', subDef: '핍(逼 핍박할) + 박(迫 닥칠) -> 바싹 죌 정도로 몹시 괴롭게 굶' }], translations: { en: { term: 'to endure persecution', mainDef: 'to bear and overcome the hard work of someone tormenting and suppressing you severely.', subDefs: [{ term: 'persecution / oppression', def: 'harassing someone so much that it tightly constricts them.' }] } }, examples: [{ kor: "독립 운동가들은 감옥에서 온갖 핍박을 견디며 나라를 지켰습니다.", eng: "Independence activists protected the country while enduring all kinds of persecution in prison." }], variants: ['핍박을 견디다', '핍박을 견뎌내고'] },
                { term: '경쟁력', mainDef: '경(競 다툴) + 쟁(爭 다툴) + 력(力 힘) -> 다른 사람이나 기업과 싸워서 이길 수 있는 능력이나 힘', translations: { en: { term: 'competitiveness', mainDef: 'the ability or power to fight and win against other people or companies.' } }, examples: [{ kor: "영어를 잘하면 회사에 들어갈 때 경쟁력이 높아집니다.", eng: "Being good at English increases your competitiveness when joining a company." }], variants: ['경쟁력', '경쟁력 강화'] },
                { term: '조선', mainDef: '조(造 지을) + 선(船 배) -> 철을 이용해 아주 크고 튼튼한 배를 만드는 일이나 산업', translations: { en: { term: 'shipbuilding', mainDef: 'the work or industry of making very large and sturdy ships using iron.' } }, examples: [{ kor: "한국의 조선 산업은 세계에서 제일 배를 잘 만들기로 유명해요.", eng: "Korea's shipbuilding industry is famous for making the best ships in the world." }], variants: ['조선', '조선·방산·원전'] },
                { term: '방산', mainDef: '방(防 막을) + 산(産 낳을) -> 총, 탱크, 전투기처럼 나라를 지키는 데 필요한 무기를 만드는 방위 산업', translations: { en: { term: 'defense industry', mainDef: 'the defense industry that makes weapons needed to protect the country like guns, tanks, and fighter jets.' } }, examples: [{ kor: "최근 한국의 방산 기업들이 수출을 아주 많이 하고 있어요.", eng: "Recently, Korean defense industry companies have been exporting a lot." }], variants: ['방산', '조선·방산·원전'] },
                { term: '원전', mainDef: '원(原 근원) + 전(電 번개) -> 우라늄 같은 방사선 물질의 강한 힘을 이용해 전기를 만드는 원자력 발전소', translations: { en: { term: 'nuclear power plant', mainDef: 'a nuclear power plant that generates electricity using the strong power of radioactive materials like uranium.' } }, examples: [{ kor: "우리가 쓰는 전기의 많은 부분이 원전에서 만들어집니다.", eng: "Much of the electricity we use is generated in nuclear power plants." }], variants: ['원전', '조선·방산·원전'] },
                { term: '바이오·제약', mainDef: '생물학을 이용한 기술(바이오)과 병을 치료하는 약을 연구하고 만드는 산업(제약)', translations: { en: { term: 'biotech and pharmaceuticals', mainDef: 'technology using biology (biotech) and the industry of researching and making medicines to treat diseases (pharmaceuticals).' } }, examples: [{ kor: "미래에는 바이오·제약 기술이 사람들의 수명을 크게 늘려줄 거예요.", eng: "In the future, biotech and pharmaceutical technologies will greatly extend people's lifespans." }], variants: ['바이오·제약'] },
                { term: '이차전지', mainDef: '이(二 두) + 차(次 버금) + 전(電 번개) + 지(池 못) -> 한 번 쓰고 버리는 건전지가 아니라 전기 코드를 꽂아 다시 충전해서 여러 번 쓸 수 있는 배터리', translations: { en: { term: 'secondary battery / rechargeable battery', mainDef: 'a battery that can be recharged and used multiple times by plugging it into an electrical cord, rather than a disposable battery.' } }, examples: [{ kor: "전기자동차에는 크고 성능이 좋은 이차전지가 반드시 들어가야 해요.", eng: "Electric vehicles must have large, high-performance secondary batteries." }], variants: ['이차전지'] },
                { term: '부가가치', mainDef: '부(附 붙을) + 가(加 더할) + 가(價 값) + 치(値 값) -> 원래 있던 물건이나 일에 새로운 기술이나 디자인 등을 더해서 만들어낸 새롭고 더 비싼 가치나 이익', translations: { en: { term: 'value added', mainDef: 'a new and more expensive value or profit created by adding new technology or design to an original object or work.' } }, examples: [{ kor: "평범한 커피콩이라도 예쁜 포장과 브랜드를 더하면 부가가치가 높아져 비싸게 팔 수 있어요.", eng: "Even ordinary coffee beans can be sold at a higher price by adding nice packaging and a brand, increasing their added value." }], variants: ['부가가치'] },
                { term: '활성화', mainDef: '활(活 살) + 성(性 성품) + 화(化 될) -> 어떤 기능이나 활동이 침체되어 있다가 활기를 띠고 매우 활발해짐', translations: { en: { term: 'activation / revitalization', mainDef: 'a function or activity becoming very active and energetic after being stagnant.' } }, examples: [{ kor: "지역 경제를 살리기 위해 전통 시장 활성화 계획을 세웠어요.", eng: "To revive the local economy, we made a plan for the revitalization of traditional markets." }], variants: ['활성화', '활성화,'] },
                { term: '일자리 창출', mainDef: '사람들이 돈을 벌며 일할 수 있는 직업이나 자리(일자리)를 새롭게 만들어 냄(창출)', subDefs: [{ subTerm: '• 창출', subDef: '창(創 비롯할) + 출(出 날) -> 전에 없던 것을 처음으로 생각하여 지어냄' }], translations: { en: { term: 'job creation', mainDef: 'newly making jobs or positions (jobs) where people can work and earn money.', subDefs: [{ term: 'creation', def: 'inventing or making something that didn\'t exist before.' }] } }, examples: [{ kor: "새로운 공장이 들어서면 청년들을 위한 일자리 창출이 기대됩니다.", eng: "When a new factory is built, job creation for young people is expected." }], variants: ['일자리 창출'] },
                { term: '실물 경제', mainDef: '주식이나 금융처럼 숫자로만 거래되는 시장이 아닌, 쌀, 옷, 자동차처럼 눈에 보이는 진짜 물건이나 서비스를 직접 사고파는 실제의 경제 활동', subDefs: [{ subTerm: '• 실물', subDef: '실(實 실제) + 물(物 물건) -> 눈에 보이거나 만질 수 있는 진짜 물건' }], translations: { en: { term: 'real economy', mainDef: 'actual economic activities of directly buying and selling visible real goods or services like rice, clothes, or cars, not markets traded only in numbers like stocks or finance.', subDefs: [{ term: 'real object', def: 'a real object that can be seen or touched.' }] } }, examples: [{ kor: "주식 시장은 뜨겁지만 공장들이 문을 닫으면서 실물 경제는 무척 차갑습니다.", eng: "The stock market is hot, but the real economy is very cold as factories close." }], variants: ['실물 경제'] },
                { term: '선순환', mainDef: '선(善 착할) + 순(循 돌) + 환(環 고리) -> 좋은 원인이 좋은 결과를 낳고, 그 결과가 다시 더 좋은 원인이 되어 계속 빙글빙글 돌며 발전하는 현상', subDefs: [{ subTerm: '• 선-', subDef: '착하고 좋은 방향의' }, { subTerm: '• 순환', subDef: '순(循 돌) + 환(環 고리) -> 둥글게 돌고 돎' }], translations: { en: { term: 'virtuous cycle', mainDef: 'a phenomenon where a good cause yields a good result, which again becomes a better cause, continuing to develop in a loop.', subDefs: [{ term: 'virtuous / good', def: 'in a good and positive direction.' }, { term: 'circulation', def: 'turning round and round.' }] } }, examples: [{ kor: "투자가 늘면 일자리가 생기고 사람들의 씀씀이가 커져 다시 경제가 성장하는 선순환 구조가 필요해요.", eng: "We need a virtuous cycle structure where increased investment creates jobs and people's spending grows, leading again to economic growth." }], variants: ['선순환'] },
                { term: '동서학 개미', mainDef: '동(東 동쪽) + 서(西 서쪽) + 학(學 배울) + 개미 -> 한국(국내) 주식에 투자하는 일반 사람인 동학 개미와 미국(해외) 주식에 투자하는 서학 개미를 모두 합쳐서 친근하게 부르는 말', translations: { en: { term: 'domestic and overseas retail investors', mainDef: 'an affectionate term combining "Donghak ants" (ordinary people investing in Korean domestic stocks) and "Seohak ants" (those investing in US/overseas stocks).' } }, examples: [{ kor: "동서학 개미들이 힘을 모아 큰 회사의 주식을 대량으로 사들였습니다.", eng: "Domestic and overseas retail investors joined forces and bought a large amount of stock in a big company." }], variants: ['동·서학 개미들', '동서학 개미'] },
                { term: '영끌까지 해서 마련한 돈', mainDef: '자신이 할 수 있는 모든 능력과 방법을 다 동원해서 아주 힘들게 준비한 돈', subDefs: [{ subTerm: '• 영끌', subDef: '‘영혼까지 끌어모으다’의 줄임말로, 티끌만 한 돈이나 힘까지 전부 다 끌어다 씀을 의미 (유행어)' }, { subTerm: '• 마련하다', subDef: '어떤 물건이나 돈, 상황을 준비하여 갖추어 두다' }], translations: { en: { term: 'money scraped together from the bottom of the barrel', mainDef: 'money prepared very painstakingly by mobilizing all one\'s abilities and methods.', subDefs: [{ term: 'scraping everything together', def: 'abbreviation for "gathering even the soul," meaning using every tiny bit of money or power.' }, { term: 'to prepare / to raise (funds)', def: 'to prepare and set up objects, money, or situations.' }] } }, examples: [{ kor: "청년들은 내 집을 사기 위해 영끌까지 해서 마련한 돈을 부동산에 투자합니다.", eng: "Young people invest the money they scraped together from the bottom of the barrel into real estate to buy their own home." }], variants: ['영끌까지 해서 마련한 돈', '영끌까지 해서'] },
                { term: '금융 자산', mainDef: '부동산처럼 눈에 보이는 물건이 아니라, 예금, 주식, 채권처럼 종이나 숫자로 되어 있지만 돈으로 바꿀 수 있는 귀중한 재산', subDefs: [{ subTerm: '• 금융', subDef: '금(金 돈) + 융(融 통할) -> 돈을 빌려주고 빌리는 시장의 흐름' }, { subTerm: '• 자산', subDef: '자(資 재물) + 산(産 낳을) -> 개인이나 회사가 가진 돈과 재산' }], translations: { en: { term: 'financial asset', mainDef: 'valuable property that is not a visible object like real estate, but consists of paper or numbers like deposits, stocks, or bonds that can be converted into money.', subDefs: [{ term: 'finance', def: 'the flow of the market lending and borrowing money.' }, { term: 'asset', def: 'money and property owned by an individual or company.' }] } }, examples: [{ kor: "은행 예금과 주식은 대표적인 금융 자산 중 하나입니다.", eng: "Bank deposits and stocks are among the representative financial assets." }], variants: ['금융 자산'] },
                { term: '실물 투자', mainDef: '주식 같은 숫자에 돈을 쓰는 것이 아니라, 공장을 짓거나 기계를 사는 등 실제로 형태가 있는 물건이나 사업을 위해 직접 돈을 쓰는 일', subDefs: [{ subTerm: '• 실물', subDef: '눈에 보이고 만질 수 있는 진짜 물건' }], translations: { en: { term: 'real investment', mainDef: 'spending money directly on tangible objects or businesses, such as building a factory or buying machinery, rather than spending money on numbers like stocks.', subDefs: [{ term: 'real object', def: 'a real object that can be seen and touched.' }] } }, examples: [{ kor: "기업은 실물 투자를 늘려야 진짜 일자리가 많이 생겨나요.", eng: "Companies must increase real investments to create many genuine jobs." }], variants: ['실물 투자', '실물 투자에', '실물 투자 없'] },
                { term: '투자자', mainDef: '투(投 던질) + 자(資 재물) + 자(者 사람) -> 훗날 이익을 얻기 위해 주식이나 부동산에 돈, 시간, 정성을 쏟는 사람', translations: { en: { term: 'investor', mainDef: 'a person who pours money, time, or devotion into stocks or real estate to gain profit in the future.' } }, examples: [{ kor: "새로운 기술이 발표되자 투자자들이 이 회사의 주식을 앞다투어 샀습니다.", eng: "As new technology was announced, investors scrambled to buy this company's stock." }], variants: ['투자자', '투자자들'] },
                { term: '설비 투자', mainDef: '물건을 생산하는 데 필요한 기계 장비나 공장 건물(설비)을 새로 사거나 짓는 데 아주 큰돈을 쓰는 것', subDefs: [{ subTerm: '• 설비', subDef: '설(設 베풀) + 비(備 갖출) -> 일하는 데 필요한 시설이나 기계를 마련하여 갖춤' }], translations: { en: { term: 'facility investment / capital investment', mainDef: 'spending a very large amount of money to newly buy or build mechanical equipment or factory buildings (facilities) needed to produce goods.', subDefs: [{ term: 'equipment / facilities', def: 'preparing and equipping necessary facilities or machines for work.' }] } }, examples: [{ kor: "그 자동차 회사는 새로운 전기차를 만들기 위해 공장에 막대한 설비 투자를 했습니다.", eng: "The car company made a massive facility investment in the factory to make new electric vehicles." }], variants: ['설비 투자'] },
                { term: '수익을 창출하다', mainDef: '장사나 기업 활동 등을 통해 돈을 벌어서 새로운 이익을 만들어 내다', subDefs: [{ subTerm: '• 창출하다', subDef: '창(創 비롯할) + 출(出 날) -> 전에 없던 것을 처음으로 생각하여 만들어 내다' }], translations: { en: { term: 'to generate revenue / to create profit', mainDef: 'to make money and create new profits through business or corporate activities.', subDefs: [{ term: 'to create', def: 'to think of and make something that didn\'t exist before for the first time.' }] } }, examples: [{ kor: "이 식당은 독특한 메뉴 덕분에 매달 엄청난 수익을 창출하고 있어요.", eng: "This restaurant is generating enormous revenue every month thanks to its unique menu." }], variants: ['수익을 창출하다', '수익을 창출해 낼'] },
                { term: '대출을 해주다', mainDef: '대(貸 빌릴) + 출(出 낼) -> 은행 같은 기관이나 다른 사람이 이자를 받기로 약속하고 돈을 빌려주다', translations: { en: { term: 'to grant a loan', mainDef: 'an institution like a bank or another person lending money with the promise of receiving interest.' } }, examples: [{ kor: "은행에서 집을 살 수 있도록 저렴한 이자로 대출을 해주었습니다.", eng: "The bank granted a loan with low interest so that we could buy a house." }], variants: ['대출을 해주다', '대출을 해준'] },
                { term: '채권자', mainDef: '채(債 빚) + 권(權 권리) + 자(者 사람) -> 다른 사람이나 회사에게 돈을 빌려주어서, 나중에 그 돈을 돌려받을 정당한 권리가 있는 사람', translations: { en: { term: 'creditor', mainDef: 'a person who has lent money to another person or company and has a legitimate right to receive the money back later.' } }, examples: [{ kor: "회사가 망하게 되면 먼저 채권자들에게 남은 돈을 나누어 빚을 갚아야 합니다.", eng: "If a company goes bankrupt, it must first distribute the remaining money to the creditors to pay off debts." }], variants: ['채권자'] },
                { term: '자기 몫을 떼다', mainDef: '전체 이익이나 돈 중에서 자신이 노력한 만큼 마땅히 가져가야 할 부분(몫)을 먼저 챙겨서 가다', subDefs: [{ subTerm: '• 몫', subDef: '여럿이 나누어 가질 때 각 사람에게 돌아가는 정해진 부분' }], translations: { en: { term: 'to take one\'s share', mainDef: 'to first take the portion (share) of the total profit or money that one rightfully deserves for their effort.', subDefs: [{ term: 'share / portion', def: 'the designated part that goes to each person when shared among many.' }] } }, examples: [{ kor: "장사가 끝나자 동업자들은 각자 자기 몫을 떼어 집으로 돌아갔어요.", eng: "When the business was over, the partners each took their share and went home." }], variants: ['자기 몫을 떼다', '자기 몫을 떼어 간다'] },
                { term: '이익이 나다', mainDef: '이(利 이로울) + 익(益 더할) -> 장사나 투자를 통해 원금보다 이득을 얻거나 남는 돈이 생기다', translations: { en: { term: 'to make a profit', mainDef: 'to gain a benefit or have leftover money greater than the principal through business or investment.' } }, examples: [{ kor: "열심히 커피를 팔아서 이번 달에는 큰 이익이 났어요.", eng: "I sold coffee hard and made a big profit this month." }], variants: ['이익이 나다', '이익이 나면'] },
                { term: '세금을 떼다', mainDef: '개인이 번 돈이나 월급 중에서 나라에 꼭 내야 하는 돈(세금)을 회사가 미리 빼고 주거나 국가가 가져가다', translations: { en: { term: 'to deduct taxes', mainDef: 'for a company to pre-deduct or the state to take the money (taxes) that must be paid to the country from the money or salary an individual earns.' } }, examples: [{ kor: "내 월급에서 세금을 떼고 나니 통장에 들어온 돈이 얼마 안 되네요.", eng: "After deducting taxes from my salary, the money that came into my bank account isn't much." }], variants: ['세금을 떼다', '세금을 떼어 가고'] },
                { term: '주주', mainDef: '주(株 주식) + 주(主 주인) -> 주식회사의 주식을 돈을 주고 사서 그 회사의 주인이 된 사람', translations: { en: { term: 'shareholder / stockholder', mainDef: 'a person who has become an owner of the company by purchasing shares of a joint-stock company.' } }, examples: [{ kor: "회사의 중요한 결정은 주주들이 모여서 다수결로 정합니다.", eng: "Important company decisions are made by majority vote when shareholders gather." }], variants: ['주주', '주주에게'] },
                { term: '배당', mainDef: '배(配 나눌) + 당(當 마땅) -> 회사가 한 해 동안 돈을 벌었을 때 그 이익을 주주들에게 주식 수에 따라 골고루 나누어 주는 것', translations: { en: { term: 'dividend', mainDef: 'distributing the profit evenly to shareholders according to the number of shares when a company makes money over a year.' } }, examples: [{ kor: "우리 회사는 이익이 많이 나서 이번 겨울에 높은 배당을 줄 예정입니다.", eng: "Our company made a lot of profit, so we plan to give a high dividend this winter." }], variants: ['배당'] },
                { term: '이익을 향유하다', mainDef: '어떤 행동이나 투자로 얻은 좋은 결과나 돈(이익)을 자기 것으로 만들어 기쁘게 마음껏 누리다', subDefs: [{ subTerm: '• 향유하다', subDef: '향(享 누릴) + 유(有 있을) -> 자기가 가지고 있는 것을 마음껏 누리고 즐기다' }], translations: { en: { term: 'to enjoy profits', mainDef: 'to make good results or money (profits) obtained from actions or investments one\'s own and enjoy them joyfully and fully.', subDefs: [{ term: 'to enjoy / possess', def: 'to fully enjoy and take pleasure in what one possesses.' }] } }, examples: [{ kor: "성공적인 사업 덕분에 사장님은 아주 오랫동안 그 이익을 향유했습니다.", eng: "Thanks to the successful business, the boss enjoyed the profits for a very long time." }], variants: ['이익을 향유하다', '이익을 향유한다'] },
                { term: '좌우하다', mainDef: '좌(左 왼) + 우(右 오른) -> 이쪽 저쪽으로 마음대로 이끌어 가거나, 어떤 일의 결과에 아주 큰 영향을 주어 결정하다', translations: { en: { term: 'to influence / to dictate', mainDef: 'to lead this way and that way as one pleases, or to give a very big influence to determine the outcome of a matter.' } }, examples: [{ kor: "선수의 오늘의 기분이 경기 전체의 승패를 좌우할 만큼 중요합니다.", eng: "The player's mood today is important enough to dictate the victory or defeat of the entire game." }], variants: ['좌우하다', '좌우한다는'] },
                { term: '전 정부', mainDef: '전(前 앞) + 정(政 정사) + 부(府 관청) -> 현재 나라를 다스리는 대통령과 내각이 들어서기 바로 직전에 나라를 다스렸던 정부', translations: { en: { term: 'the previous administration', mainDef: 'the government that ruled the country right before the current president and cabinet took office.' } }, examples: [{ kor: "현 대통령은 전 정부가 만든 부동산 제도를 크게 고치기로 결정했습니다.", eng: "The current president decided to greatly revise the real estate system made by the previous administration." }], variants: ['전 정부'] },
                { term: '조치', mainDef: '조(措 둘) + 치(置 둘) -> 어떤 문제가 발생했을 때 그것을 해결하거나 더 나빠지지 않게 하려고 재빨리 취하는 행동이나 대책', translations: { en: { term: 'measure / action', mainDef: 'actions or countermeasures taken quickly to solve a problem or prevent it from getting worse when it occurs.' } }, examples: [{ kor: "코로나 바이러스가 퍼지자 나라는 마스크 착용을 의무화하는 조치를 내렸어요.", eng: "As the coronavirus spread, the country took measures to make wearing masks mandatory." }], variants: ['조치'] },
                { term: '악수 중의 악수', mainDef: '바둑이나 장기에서 매우 잘못 둔 수를 뜻하는 ‘악수’를 두 번 써서, 수많은 나쁜 결정이나 실수 중에서도 가장 최악이고 어리석은 선택임을 뜻함', subDefs: [{ subTerm: '• 악수', subDef: '악(惡 나쁠) + 수(手 손/수) -> 나쁜 결과로 이어지는 아주 잘못된 방법이나 서투른 행동' }], translations: { en: { term: 'the worst of the worst moves', mainDef: 'using the word \'aksu\' (meaning a very bad move in Go or Chess) twice, indicating it is the worst and most foolish choice among numerous bad decisions or mistakes.', subDefs: [{ term: 'bad move', def: 'a very wrong method or clumsy action leading to bad results.' }] } }, examples: [{ kor: "화가 난다고 손님에게 소리를 지른 것은 장사하는 사람으로서 악수 중의 악수입니다.", eng: "Yelling at a customer out of anger is the worst of the worst moves as a businessperson." }], variants: ['악수 중의 악수', '악수 중의 악수였다', '악수'] },
                { term: '인하 여력', mainDef: '인(引 끌) + 하(下 아래) -> 물건 가격, 세금, 전기 요금 등을 지금보다 더 아래로 내릴 수 있는 회사의 능력이나 경제적인 마음의 여유', subDefs: [{ subTerm: '• 인하', subDef: '가격, 비율 등을 원래보다 낮게 내림' }, { subTerm: '• 여력', subDef: '어떤 일을 하고 나서도 아직 남아 있는 힘이나 돈' }], translations: { en: { term: 'room for reduction', mainDef: 'the company\'s ability or economic leeway to lower prices, taxes, electricity rates, etc., further down from now.', subDefs: [{ term: 'reduction', def: 'lowering prices, rates, etc., from the original.' }, { term: 'reserve power', def: 'strength or money remaining even after doing something.' }] } }, examples: [{ kor: "기름값이 떨어져서 우리 회사는 과자 가격을 인하할 여력이 생겼습니다.", eng: "Since oil prices dropped, our company has the room to reduce snack prices." }], variants: ['인하 여력'] },
                { term: '물가 안정', mainDef: '물(物 물건) + 가(價 값) -> 사람들이 시장에서 사는 과일, 고기, 서비스 등의 가격(물가)이 너무 비싸게 뛰지 않고 평온한 상태를 잘 유지하는 것', subDefs: [{ subTerm: '• 물가', subDef: '시장에서 팔리는 여러 가지 물건들의 평균적인 가격' }], translations: { en: { term: 'price stability', mainDef: 'the prices of fruits, meat, services, etc. (prices) that people buy in the market not jumping too high and maintaining a calm state well.', subDefs: [{ term: 'prices', def: 'the average prices of various goods sold in the market.' }] } }, examples: [{ kor: "서민들이 마음 편히 밥을 먹으려면 무엇보다 물가 안정이 가장 급합니다.", eng: "For ordinary people to eat meals with peace of mind, price stability is the most urgent above all." }], variants: ['물가 안정'] },
                { term: '개방하다', mainDef: '개(開 열) + 방(放 놓을) -> 닫혀 있던 문이나 국경을 활짝 열어서 다른 나라의 물건이나 사람이 자유롭게 들어오고 나갈 수 있게 하다', translations: { en: { term: 'to open up / to liberalize', mainDef: 'to open wide closed doors or borders so that goods or people from other countries can freely enter and exit.' } }, examples: [{ kor: "외국에서 값싸고 맛있는 고기를 수입하기 위해 시장을 개방했어요.", eng: "We opened up the market to import cheap and delicious meat from foreign countries." }], variants: ['개방하다', '개방하면'] },
                { term: '노동 비용', mainDef: '노(勞 일할) + 동(動 움직일) + 비(費 쓸) + 용(用 쓸) -> 기업이나 사장이 일하는 사람(노동자)을 쓰기 위해 줘야 하는 월급, 보너스, 보험료 등 모든 돈의 합', translations: { en: { term: 'labor cost', mainDef: 'the sum of all money such as salaries, bonuses, and insurance premiums that a company or boss must pay to use working people (laborers).' } }, examples: [{ kor: "물가가 올라 직원들 월급을 올려주자 공장의 노동 비용이 크게 올랐습니다.", eng: "As prices rose and employees' salaries were increased, the factory's labor costs went up significantly." }], variants: ['노동 비용'] },
                { term: '최저임금', mainDef: '최(最 가장) + 저(低 낮을) -> 나라에서 법으로 정해서, 아르바이트를 하든 식당에서 일하든 사장이 직원에게 반드시 줘야 하는 가장 적은 돈의 기준', subDefs: [{ subTerm: '• 최저', subDef: '정도나 수준이 가장 낮음' }], translations: { en: { term: 'minimum wage', mainDef: 'the lowest standard of money that a boss must pay an employee, whether working part-time or in a restaurant, set by the law of the country.', subDefs: [{ term: 'lowest', def: 'the lowest degree or level.' }] } }, examples: [{ kor: "내년부터 최저임금이 시간당 만 원으로 올라서 아르바이트생들이 좋아합니다.", eng: "Part-timers are happy because the minimum wage will rise to ten thousand won per hour starting next year." }], variants: ['최저임금'] },
                { term: '급격한', mainDef: '급(急 급할) + 격(激 부딪칠) -> 상황의 변화가 예상할 수 없을 만큼 아주 빠르고 심한 모양', translations: { en: { term: 'rapid / drastic', mainDef: 'a shape where the change in situation is so fast and severe that it cannot be expected.' } }, examples: [{ kor: "산의 날씨는 급격한 변화가 많으니 항상 따뜻한 옷을 챙겨야 해요.", eng: "Mountain weather has many rapid changes, so you should always pack warm clothes." }], variants: ['급격한'] },
                { term: '인상', mainDef: '인(引 끌) + 상(上 위) -> 물건 가격이나 요금, 사람의 월급 등을 끌어올려서 예전보다 비싸고 많게 함', translations: { en: { term: 'increase / raise', mainDef: 'pulling up the price of goods, fees, or people\'s salaries to make them more expensive and more than before.' } }, examples: [{ kor: "버스 요금 인상 소식에 매일 버스를 타는 학생들의 불만이 커졌어요.", eng: "At the news of the bus fare increase, students who ride the bus every day became very dissatisfied." }], variants: ['인상'] },
                { term: '통상임금', mainDef: '통(通 통할) + 상(常 떳떳할) -> 야간 근무나 연장 근무 수당을 빼고, 노동자가 정해진 보통 시간 동안 일한 대가로 회사에서 매달 똑같이 정기적으로 받는 기본 월급', translations: { en: { term: 'ordinary wage', mainDef: 'the basic salary a worker receives equally and regularly every month from the company in return for working for a set normal time, excluding night shift or overtime pay.' } }, examples: [{ kor: "퇴직금을 계산할 때는 매달 받는 통상임금이 얼마인지가 아주 중요합니다.", eng: "When calculating severance pay, how much the monthly ordinary wage is is very important." }], variants: ['통상임금'] },
                { term: '정년 60세 의무화', mainDef: '회사에서 나이가 들어 그만둘 때(정년)를 법으로 정해서, 회사 마음대로 직원을 자르지 말고 무조건 60세까지는 일할 수 있게 보호해 주는 제도', subDefs: [{ subTerm: '• 정년', subDef: '정(停 머무를) + 년(年 해) -> 직장에서 일하다가 물러나도록 정해진 나이' }, { subTerm: '• 의무화', subDef: '의(義 옳을) + 무(務 힘쓸) + 화(化 될) -> 법으로 정해서 무조건 지켜야만 하는 일로 만듦' }], translations: { en: { term: 'mandatory retirement age of 60', mainDef: 'a system that legally sets the age to stop working (retirement age) so companies cannot fire employees at will and unconditionally protects them to work until 60.', subDefs: [{ term: 'retirement age', def: 'the designated age to step down from a workplace.' }, { term: 'making mandatory', def: 'making it something that must be followed by law.' }] } }, examples: [{ kor: "정년 60세 의무화 덕분에 우리 아버지는 60살 생일 전까지 마음 편히 회사를 다니실 수 있어요.", eng: "Thanks to the mandatory retirement age of 60, my father can comfortably work at the company until right before his 60th birthday." }], variants: ['정년 60세 의무화'] },
                { term: '주 52시간 근무제', mainDef: '주(週 일주일) -> 일주일에 기본으로 일하는 40시간과 야근 12시간을 합쳐서 어떤 일이 있어도 최대 52시간까지만 일하도록 나라에서 정한 규칙', subDefs: [{ subTerm: '• -제', subDef: '제(制 절제할) -> 나라나 사회가 법으로 정한 규칙이나 제도' }], translations: { en: { term: '52-hour workweek system', mainDef: 'a rule set by the country that a person can work up to a maximum of 52 hours no matter what, combining the basic 40 hours a week and 12 hours of overtime.', subDefs: [{ term: '-system', def: 'a rule or system set by the country or society by law.' }] } }, examples: [{ kor: "주 52시간 근무제가 생기면서 저녁에 퇴근하고 가족과 밥을 먹는 시간이 늘어났어요.", eng: "As the 52-hour workweek system was introduced, the time I get off work in the evening and eat with my family has increased." }], variants: ['주 52시간 근무제'] },
                { term: '노란봉투법', mainDef: '노동자들이 정당하게 파업을 했을 때, 회사가 복수하기 위해 노동자들에게 너무 큰 벌금(손해배상)을 청구하여 괴롭히는 것을 막아주는 법안 (과거 해고 노동자들을 돕기 위해 시민들이 노란 봉투에 돈을 모아 준 것에서 이름이 생김)', translations: { en: { term: 'Yellow Envelope Law', mainDef: 'a bill preventing companies from harassing workers by claiming excessively large fines (damages) in revenge when workers go on a legitimate strike (named after citizens collecting money in yellow envelopes to help fired workers in the past).' } }, examples: [{ kor: "노란봉투법은 억울하게 파업하다가 엄청난 빚을 지게 된 가난한 노동자들을 보호하기 위한 착한 법입니다.", eng: "The Yellow Envelope Law is a good law to protect poor workers who fell into huge debt while unfairly striking." }], variants: ['노란봉투법'] },
                { term: '중대재해처벌법', mainDef: '공사장이나 일터에서 사람이 죽거나 크게 다치는 아주 끔찍하고 심각한 사고(중대재해)가 났을 때, 안전을 미리 챙기지 않은 회사의 진짜 책임자(사장)를 감옥에 보내거나 강하게 벌주는(처벌) 법', subDefs: [{ subTerm: '• 중대', subDef: '중(重 무거울) + 대(大 클) -> 아주 무겁고 큼' }, { subTerm: '• 재해', subDef: '재(災 재앙) + 해(害 해할) -> 지진, 태풍이나 큰 사고로 인해 입는 엄청난 피해' }, { subTerm: '• 처벌', subDef: '처(處 곳/처리할) + 벌(罰 벌줄) -> 잘못한 사람에게 법에 따라 벌을 내림' }], translations: { en: { term: 'Severe Accident Punishment Act', mainDef: 'a law that strongly punishes or sends to prison the actual person in charge (boss) of a company who didn\'t ensure safety in advance when a very terrible and serious accident (severe accident) where a person dies or is badly injured occurs at a construction site or workplace.', subDefs: [{ term: 'severe/grave', def: 'very heavy and big.' }, { term: 'disaster/accident', def: 'tremendous damage suffered from earthquakes, typhoons, or big accidents.' }, { term: 'punishment', def: 'giving punishment according to the law to someone who did wrong.' }] } }, examples: [{ kor: "중대재해처벌법이 생긴 이후 건설 회사들은 노동자가 다치지 않도록 안전모와 안전줄 검사를 더욱 철저히 하고 있습니다.", eng: "Since the Severe Accident Punishment Act was enacted, construction companies are conducting safety helmet and safety line inspections more thoroughly so workers don't get hurt." }], variants: ['중대재해처벌법'] },
                { term: '임금 비용', mainDef: '회사가 직원들에게 다달이 주는 월급과 보너스 등을 모두 합쳐 회사가 사람을 쓰기 위해 지출하는 전체 돈', translations: { en: { term: 'wage cost', mainDef: 'the total money a company spends to employ people, combining all monthly salaries and bonuses given to employees.' } }, examples: [{ kor: "가게에 손님은 없는데 아르바이트생들의 임금 비용은 똑같이 나가서 사장님의 한숨이 깊어집니다.", eng: "There are no customers in the shop, but the part-timers' wage costs go out the same, so the boss sighs deeply." }], variants: ['임금 비용'] },
                { term: '임금 부담', mainDef: '회사가 직원들의 월급을 많이 올려주거나 새로운 사람을 뽑아야 할 때 돈이 너무 많이 들어서 느끼는 무겁고 힘든 마음', translations: { en: { term: 'wage burden', mainDef: 'the heavy and hard feeling a company experiences because it costs too much money when they have to raise employees\' salaries a lot or hire new people.' } }, examples: [{ kor: "작은 식당 사장님들은 최저임금이 오를 때마다 임금 부담을 가장 크게 느낀다고 말합니다.", eng: "Owners of small restaurants say they feel the wage burden the most whenever the minimum wage goes up." }], variants: ['임금 부담'] },
                { term: '포괄 임금제', mainDef: '포(包 안을) + 괄(括 묶을) -> 밤늦게까지 야근하거나 휴일에 일한 돈을 매번 일일이 계산하지 않고, 그냥 처음부터 기본 월급 안에 ‘이만큼 야근할 테니 돈을 다 포함해서 주겠다’고 퉁쳐서 정해놓는 월급 계산 방식', translations: { en: { term: 'comprehensive wage system', mainDef: 'a salary calculation method where money for working late at night or on holidays is not calculated one by one every time, but is just broadly set and included in the basic salary from the beginning, assuming \'you will work overtime this much so I will give you the money all included\'.' } }, examples: [{ kor: "포괄 임금제로 계약한 직원은 밤을 새워 야근을 해도 추가 수당을 받지 못해 억울할 수 있어요.", eng: "An employee who contracted under the comprehensive wage system might feel it's unfair as they don't receive extra pay even if they work overtime all night." }], variants: ['포괄 임금제', '포괄 임금제 폐지'] },
                { term: '정년 연장', mainDef: '회사에서 늙어서 그만두고 은퇴해야 하는 정해진 나이(정년)를 지금의 60세에서 65세처럼 더 길게 늘려주는 것', subDefs: [{ subTerm: '• 정년', subDef: '나이가 들어 직장에서 물러나도록 법이나 규칙으로 정해진 나이' }, { subTerm: '• 연장', subDef: '연(延 늘일) + 장(張 베풀) -> 정해진 시간이나 거리를 원래보다 더 길게 늘림' }], translations: { en: { term: 'extension of retirement age', mainDef: 'extending the set age to quit and retire from a company due to old age (retirement age) to be longer, like from the current 60 to 65.', subDefs: [{ term: 'retirement age', def: 'the age set by law or rule to step down from a workplace due to getting old.' }, { term: 'extension', def: 'lengthening a set time or distance more than original.' }] } }, examples: [{ kor: "사람들이 건강하게 오래 살게 되면서 일할 수 있는 나이도 길어져서 정년 연장을 요구하는 목소리가 커지고 있습니다.", eng: "As people live longer and healthier, the age at which they can work also lengthens, so voices demanding the extension of the retirement age are growing." }], variants: ['정년 연장'] },
                { term: '노동 개혁', mainDef: '일하는 방식이나 일자리와 관련된 나라의 낡고 나쁜 법률, 제도들을 뜯어고쳐서 노동자와 기업 모두에게 더 좋고 공평한 방향으로 새롭게 바꾸는 일', subDefs: [{ subTerm: '• 개혁', subDef: '개(改 고칠) + 혁(革 가죽) -> 불합리하고 나쁜 제도를 합법적인 방법으로 완전히 새롭게 뜯어고침' }], translations: { en: { term: 'labor reform', mainDef: 'the act of tearing down old and bad laws and systems related to working methods or jobs and newly changing them to a better and fairer direction for both workers and companies.', subDefs: [{ term: 'reform', def: 'completely revamping an irrational and bad system into a new one through legal methods.' }] } }, examples: [{ kor: "청년들이 일자리를 쉽게 구하고 부당한 대우를 받지 않으려면 제대로 된 노동 개혁이 먼저 이루어져야 합니다.", eng: "For young people to easily find jobs and not receive unfair treatment, proper labor reform must be achieved first." }], variants: ['노동 개혁'] },
