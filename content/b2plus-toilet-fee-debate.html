    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}


    .lk-lang{ position:relative; display:inline-flex; align-items:center; }
.lk-lang-btn{ font-family:inherit; font-size:14px; font-weight:500; color:#6b7280; background:transparent; border:0; border-radius:0; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:color .15s; white-space:nowrap; }
.lk-lang-btn:hover{ color:#111; }

    <script>
    (function () {
        'use strict';

        /* 폰트 CSS 비차단 적용: head에서 media=print로 받아 둔 스타일을 여기서 활성화 */
        var fontCss = document.getElementById('font-css');
        if (fontCss) fontCss.media = 'all';

        /* =====================================================================
           </> TEMPLATE — VIDEO · 객관식형(multiple-choice quiz)  (배포용 아님)
           순수 바닐라 JS 동영상 학습자료 베이스 (b2 계열).
           교체: curVideo().videoId, curVideo().script, VOCAB_DATA,
                 QUIZ_LIST(options 포함 객관식), DISCUSS_DATA(vocab에 defEng 포함), userLevel,
                 홈 [대괄호] 문구, Gemini share id(REPLACE_SHARE_ID).
           구조: 홈 제목/부제 = HOME_TITLE/HOME_SUBTITLE(kor+eng, lk-en 병기),
                 퀴즈 = questionEng lk-en 병기 · hint 한국어(+hintEng, ENG 토글 시 표시),
                 언어 원칙 = 한국어 설정: 한국어만 / 영어 설정: 병기 (예외: 브랜드·레벨 배지·ENG/HINT/Language 라벨·AI/Gemini 명칭),
                 핵심 어휘 탭 = 검색 + 영어 일괄/카드별 ENG 토글(vocabState),
                 생각해 보기 = 질문 ENG 토글이 어휘 defEng도 함께 표시.
           ===================================================================== */

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };

        // 동영상 목록 — 항목을 추가하면 Part 선택 버튼이 자동 표시됩니다 (1개면 버튼 없음)
        // REPLACE: title/subTitle/videoId를 실제 값으로. script는 각 동영상의 대본 배열
        const VIDEOS = [
            { title: 'Part 1', subTitle: '', videoId: "GAq69exyPAc", script: [
            {"id": "s1", "speaker": "크랩 KLAB", "kor": "요즘 가장 핫하다는 카페 신메뉴가 있습니다.", "time": [0.1, 2.63], "eng": "There's a new café menu item that's said to be the hottest thing these days."},
            {"id": "s2", "speaker": "크랩 KLAB", "kor": "음료도 디저트도 아닌 이 메뉴, 바로 화장실 이용료인데요.", "time": [2.64, 6.34], "eng": "It's not a drink or a dessert — it's a restroom usage fee."},
            {"id": "s3", "speaker": "크랩 KLAB", "kor": "아니, 이제 우리나라도 “화장실 이용에 돈 받는 시대가 온 건가?” 싶은데...", "time": [6.37, 10.56], "eng": "Wait — has Korea also entered the era of paying to use the restroom?"},
            {"id": "s4", "speaker": "크랩 KLAB", "kor": "그런데 이 ‘화장실 이용료’ 알고 보니 카페 손님이 아니라 외부 이용객에게만 돈을 받는 겁니다.", "time": [10.59, 16.15], "eng": "But it turns out this 'restroom fee' applies only to outside visitors, not café customers."},
            {"id": "s5", "speaker": "크랩 KLAB", "kor": "이런 소식이 알려지자 반응은 크게 둘로 나뉘었습니다.", "time": [16.18, 19.24], "eng": "Once the news got out, reactions split sharply into two camps."},
            {"id": "s6", "speaker": "댓글 1", "kor": "흠... 업주 입장도 이해됨.", "time": [19.3, 20.76], "eng": "Hmm... I get where the owner is coming from."},
            {"id": "s7", "speaker": "댓글 2", "kor": "주문도 없이 쓰는 사람이 있다는 게 신기하다.", "time": [20.79, 22.66], "eng": "I'm amazed people use it without ordering anything."},
            {"id": "s8", "speaker": "댓글 3", "kor": "저걸 시작으로 무료 화장실은 없어지겠네.", "time": [22.69, 24.22], "eng": "This is the beginning of the end for free restrooms."},
            {"id": "s9", "speaker": "댓글 4", "kor": "한국의 '정' 문화가 사라지는 것 같아서 안타까워.", "time": [24.27, 26.92], "eng": "It's sad — it feels like Korea's culture of jeong (warmhearted generosity) is disappearing."},
            {"id": "s10", "speaker": "크랩 KLAB", "kor": "논란의 시작은 최근 한 온라인 커뮤니티에 \"주문 없이 화장실만 이용, 1인 1회에 2천 원\"이라는 카페 메뉴가 올라오면서였습니다.", "time": [28.9, 35.93], "eng": "The controversy began when a café menu reading \"Restroom use only, no order — 2,000 won per person per visit\" was posted on an online community."},
            {"id": "s11", "speaker": "크랩 KLAB", "kor": "사실 지난해 12월엔 경기 의정부의 한 카페에서 화장실만 이용하고 나가려는 외부 이용객에게 음료를 주문하라고 요청했는데 거절당하자 업주가 경찰에 신고하는 일까지 벌어졌는데요.", "time": [35.94, 46.62], "eng": "In fact, last December at a café in Uijeongbu, Gyeonggi Province, the owner asked an outside visitor who was leaving after only using the restroom to order a drink — and when the visitor refused, the owner ended up reporting it to the police."},
            {"id": "s12", "speaker": "크랩 KLAB", "kor": "이러한 소식들이 전해지면서 카페 화장실 이용료를 둘러싼 논쟁이 불붙기 시작한 겁니다.", "time": [46.65, 51.48], "eng": "As these stories spread, the debate over café restroom fees caught fire."},
            {"id": "s13", "speaker": "크랩 KLAB", "kor": "그동안 우리나라에서 화장실은 무료 인프라로 여겨져 온 게 사실인데요.", "time": [51.51, 55.19], "eng": "It's true that in Korea, restrooms have long been regarded as free infrastructure."},
            {"id": "s14", "speaker": "크랩 KLAB", "kor": "최근엔 이렇게 주문은 하지 않고 화장실만 사용하는 외부 이용객들이 늘면서 피해를 호소하는 업주들이 많아지고 있습니다.", "time": [55.23, 60.58], "eng": "But recently, as more outside visitors use only the restroom without ordering, a growing number of owners are complaining of the toll it takes."},
            {"id": "s15", "speaker": "카페 점장", "kor": "아무래도 이제 아침이나 마감 때 화장실만 이용하고 나가시는 분들이 조금 있어서.", "time": [61.62, 68.1], "eng": "There are quite a few people who come in just to use the restroom in the morning or around closing time."},
            {"id": "s16", "speaker": "카페 점장", "kor": "금연 건물인데 그 화장실 안에서 담배를 핀다거나", "time": [68.13, 72.01], "eng": "It's a non-smoking building, but some people smoke inside the restroom,"},
            {"id": "s17", "speaker": "카페 점장", "kor": "담뱃불을 화장실 변기에 지져서 일부러 그렇게 한다던가,", "time": [72.05, 75.97], "eng": "or deliberately stub out their cigarettes on the toilet,"},
            {"id": "s18", "speaker": "카페 점장", "kor": "아니면은 문을 부수고 간다거나,", "time": [76.0, 78.39], "eng": "or break the door and leave,"},
            {"id": "s19", "speaker": "카페 점장", "kor": "화장실 변기, 좌변기 위에서 신발을 신고 올라가서", "time": [78.42, 83.23], "eng": "or climb on top of the toilet seat with their shoes on"},
            {"id": "s20", "speaker": "카페 점장", "kor": "볼일을 봐서 좌변기 위 커버가 고장이 난다던가.", "time": [83.26, 87.41], "eng": "and do their business up there, breaking the seat cover."},
            {"id": "s21", "speaker": "크랩 KLAB", "kor": "업주들은 이런 일이 결국 비용 문제로 이어진다고 호소합니다.", "time": [87.44, 90.77], "eng": "Owners complain that all of this ultimately turns into a cost problem."},
            {"id": "s22", "speaker": "크랩 KLAB", "kor": "화장실만 이용하는 사람들이 많아질수록 수도나 전기요금은 물론, 청소에 휴지 같은 소모품까지 화장실 관리에만 적지 않은 비용이 드는데, 이런 부담을 고스란히 업주들만 져야 한다는 겁니다.", "time": [90.8, 101.47], "eng": "The more people use only the restroom, the more it costs to maintain — water and electricity bills, plus cleaning and consumables like toilet paper — and owners say they have to shoulder that burden entirely on their own."},
            {"id": "s23", "speaker": "크랩 KLAB", "kor": "그래서 요즘엔 내부 화장실에도 도어락을 달고 손님들에게만 비밀번호를 알려줘 출입하게 하는 등 화장실 이용을 손님 전용으로 제한하는 곳도 많습니다.", "time": [101.5, 108.88], "eng": "That's why many places now put door locks even on indoor restrooms and give the passcode only to customers, restricting restroom use to customers only."},
            {"id": "s24", "speaker": "이용료 찬성 (남)", "kor": "사실 그 공간을 청결하게 유지하기 위한 누군가의 노동과 비용이 들어가잖아요.", "time": [109.91, 115.19], "eng": "The truth is, keeping that space clean takes someone's labor and money."},
            {"id": "s25", "speaker": "이용료 찬성 (남)", "kor": "그 서비스에 대한 정당한 가치를 지불하는 것이고.", "time": [115.22, 118.46], "eng": "Paying for that service is simply paying its fair value."},
            {"id": "s26", "speaker": "이용료 찬성 (남)", "kor": "반대로 비용을 냈기에 더 깨끗한 사용 환경을 요구할 권리도 생긴다고 생각해요.", "time": [118.5, 123.77], "eng": "And conversely, once you've paid, you also gain the right to demand a cleaner restroom."},
            {"id": "s27", "speaker": "이용료 찬성 (남)", "kor": "무단 이용으로 인한 갈등을 줄이는 가장 합리적인 방법이 아닐까 생각됩니다.", "time": [123.8, 128.5], "eng": "I think it's the most reasonable way to reduce conflicts over unauthorized use."},
            {"id": "s28", "speaker": "크랩 KLAB", "kor": "하지만 급할 때 화장실 정도는 무료로 이용하자는 암묵적인 룰이 깨졌다는 점에서 아쉬움을 느낀다는 의견도 많습니다.", "time": [128.53, 135.41], "eng": "But many feel disappointed that an unspoken rule — that a restroom, at least, should be free in an emergency — has been broken."},
            {"id": "s29", "speaker": "이용료 반대 (남)", "kor": "화장실은 누구나 필요할 때 부담 없이 이용할 수 있는 기본적인 공간이라고 생각합니다.", "time": [135.44, 140.45], "eng": "I think a restroom is a basic space that anyone should be able to use freely when they need it."},
            {"id": "s30", "speaker": "이용료 반대 (남)", "kor": "이런 기준이 한 번 생기면 나중에는 '공공화장실까지 유료화되는 흐름으로 할 수도 있지 않을까'하는 걱정도 들어서요.", "time": [140.48, 147.04], "eng": "Once a precedent like this is set, I worry it could eventually lead to even public restrooms becoming paid."},
            {"id": "s31", "speaker": "크랩 KLAB", "kor": "또, 화장실 이용에 어느 정도 돈을 내는 건 찬성하지만,", "time": [147.07, 150.16], "eng": "There are also plenty of people who agree with paying something for restroom use,"},
            {"id": "s32", "speaker": "크랩 KLAB", "kor": "'한 번 사용해 2000원'이라는 가격은 부담스럽다는 의견도 적지 않은데요.", "time": [150.19, 154.2], "eng": "but find the price of 2,000 won per use too steep."},
            {"id": "s33", "speaker": "이용료 찬성 (여)", "kor": "2천 원은 너무 부담이 돼요.", "time": [154.24, 156.8], "eng": "2,000 won is just too much."},
            {"id": "s34", "speaker": "이용료 찬성 (여)", "kor": "'가서 그 돈을 내고 화장실을 사용해야 될까'하는 생각도 드는데, 천 원 정도면 괜찮을 것 같아요.", "time": [156.84, 164.52], "eng": "It makes me wonder, 'Would I really go pay that just to use the restroom?' Around 1,000 won would feel okay."},
            {"id": "s35", "speaker": "크랩 KLAB", "kor": "그래서 전문가들은 이 논쟁을 단순히 요금보다는 사회 구조적인 문제로 봐야 한다고 말합니다.", "time": [164.55, 169.75], "eng": "That's why experts say this debate should be seen less as a matter of fees and more as a structural social issue."},
            {"id": "s36", "speaker": "이홍주 교수", "kor": "그동안은 카페 화장실이 사실상 공공재처럼 쓰여왔는데,", "time": [169.78, 173.28], "eng": "Until now, café restrooms have effectively been used like a public good,"},
            {"id": "s37", "speaker": "이홍주 교수", "kor": "이용자가 늘어나고 관리 부담이 커지다 보니까 그 비용을 가격에 반영하기 시작한 거라고 생각합니다.", "time": [173.31, 179.28], "eng": "but as users increased and the maintenance burden grew, owners began factoring that cost into their prices."},
            {"id": "s38", "speaker": "이홍주 교수", "kor": "그런데 소비자 입장에서는 “화장실은 원래 무료 아니야?”", "time": [179.32, 182.45], "eng": "From the consumer's point of view, though, the idea that 'restrooms are supposed to be free'"},
            {"id": "s39", "speaker": "이홍주 교수", "kor": "뭐 이런 인식이 워낙 강해서 거부감이 생길 수밖에 없다고 생각하고요.", "time": [182.48, 187.24], "eng": "is so deeply rooted that resistance is inevitable."},
            {"id": "s40", "speaker": "이홍주 교수", "kor": "단순히 돈의 문제가 아니라 공공성에 대한 기대, 그리고 시장의 논리가 부딪히는 상황으로 보는 게 타당하다고 생각합니다.", "time": [187.28, 194.4], "eng": "Rather than simply a question of money, it's more accurate to see this as a clash between expectations of public service and the logic of the market."},
            {"id": "s41", "speaker": "크랩 KLAB", "kor": "음... 그런데 이거 우리나라만 이런 건가 싶어서 해외 사례들을 좀 찾아보니까요.", "time": [194.43, 199.53], "eng": "Hmm... wondering if this is only a Korean thing, we looked into some cases overseas."},
            {"id": "s42", "speaker": "크랩 KLAB", "kor": "한국 여행객들이 가장 많이 당황하는 문화 중 하나 바로 유료 화장실입니다.", "time": [199.57, 203.59], "eng": "One of the culture shocks Korean travelers report most often is the paid restroom."},
            {"id": "s43", "speaker": "크랩 KLAB", "kor": "독일, 프랑스, 이탈리아 같은 유럽에서는 공중화장실을 이용하려면 대략 700원에서 많게는 3000원 정도를 내는 게 일반적이고요.", "time": [203.62, 211.23], "eng": "In European countries like Germany, France, and Italy, paying roughly 700 to as much as 3,000 won to use a public restroom is the norm,"},
            {"id": "s44", "speaker": "크랩 KLAB", "kor": "기차역이나 관광지에서도 동전을 넣고 들어가는 '개찰형 화장실'이 많습니다.", "time": [211.26, 215.56], "eng": "and turnstile restrooms, where you insert a coin to enter, are common at train stations and tourist spots."},

            {"term": "소모품", "mainDef": "소(消 사라지다) + 모(耗 닳다) + 품(品 물건) -> 쓰면 쓸수록 닳아 없어지는 물건", "translations": {"en": {"term": "consumables", "mainDef": "items that get used up or worn out as you use them."}}, "examples": [{"kor": "프린터 잉크 같은 소모품은 자주 사야 해요.", "eng": "You have to buy consumables like printer ink often."}], "variants": ["소모품"]},
            {"term": "고스란히", "mainDef": "(순우리말) 조금도 줄거나 빠지지 않고 원래 그대로 전부", "translations": {"en": {"term": "entirely / in full (with nothing left out)", "mainDef": "completely and intact, without anything being reduced or left out."}}, "examples": [{"kor": "태풍 피해를 농민들이 고스란히 떠안았어요.", "eng": "The farmers had to bear the typhoon damage entirely on their own."}], "variants": ["고스란히"]},
            {"term": "도어락을 달다", "mainDef": "도어락(door lock)을 문에 설치하다", "subDefs": [{"subTerm": "• 도어락", "subDef": "영어 door lock -> 비밀번호나 카드로 여는 전자식 잠금장치"}, {"subTerm": "• 달다", "subDef": "물건을 어디에 붙이거나 설치하다"}], "translations": {"en": {"term": "to install a door lock", "mainDef": "to put an electronic lock (opened with a passcode or card) on a door."}}, "examples": [{"kor": "현관에 새 도어락을 달았어요.", "eng": "We installed a new door lock on the front door."}], "variants": ["도어락을 달다", "도어락을 달고"]},
            {"term": "전용", "mainDef": "전(專 오로지) + 용(用 쓰다) -> 특정한 사람이나 목적만을 위해 쓰도록 정해 놓음", "translations": {"en": {"term": "exclusive use / -only", "mainDef": "designated to be used only by certain people or for a certain purpose."}}, "examples": [{"kor": "이 엘리베이터는 직원 전용이에요.", "eng": "This elevator is for staff only."}], "variants": ["전용", "손님 전용"]},
            {"term": "제한하다", "mainDef": "제(制 억제하다) + 한(限 한계) -> 일정한 범위를 정해 그것을 넘지 못하게 막다", "translations": {"en": {"term": "to restrict / limit", "mainDef": "to set a boundary and prevent things from going beyond it."}}, "examples": [{"kor": "공연장은 입장 인원을 제한하고 있어요.", "eng": "The venue limits the number of people allowed in."}], "variants": ["제한하다", "제한하는", "제한되는"]},
            {"term": "청결하게 유지하다", "mainDef": "깨끗한 상태가 계속되도록 관리하다", "subDefs": [{"subTerm": "• 청결하다", "subDef": "청(淸 맑다) + 결(潔 깨끗하다) -> 맑고 깨끗하다"}, {"subTerm": "• 유지하다", "subDef": "유(維 지키다) + 지(持 가지다) -> 어떤 상태를 그대로 이어 가다"}], "translations": {"en": {"term": "to keep (something) clean", "mainDef": "to manage something so that it stays clean."}}, "examples": [{"kor": "주방을 항상 청결하게 유지해야 해요.", "eng": "You should always keep the kitchen clean."}], "variants": ["청결하게 유지하다", "청결하게 유지하기"]},
            {"term": "노동", "mainDef": "노(勞 힘쓰다) + 동(動 움직이다) -> 몸이나 머리를 써서 일함", "translations": {"en": {"term": "labor / work", "mainDef": "working with one's body or mind."}}, "examples": [{"kor": "농사는 힘든 노동이 필요한 일이에요.", "eng": "Farming is work that requires hard labor."}], "variants": ["노동"]},
            {"term": "정당한 가치를 지불하다", "mainDef": "어떤 것의 값어치에 맞는 돈을 마땅하게 내다", "subDefs": [{"subTerm": "• 정당하다", "subDef": "정(正 바르다) + 당(當 마땅하다) -> 이치에 맞고 옳다"}, {"subTerm": "• 지불하다", "subDef": "지(支 치르다) + 불(拂 내다) -> 돈을 내다"}], "translations": {"en": {"term": "to pay fair value", "mainDef": "to rightfully pay an amount that matches something's worth."}}, "examples": [{"kor": "좋은 서비스에는 정당한 가치를 지불해야 해요.", "eng": "You should pay fair value for good service."}], "variants": ["정당한 가치를 지불하다", "정당한 가치를 지불하는"]},
            {"term": "무단 이용", "mainDef": "무(無 없다) + 단(斷 허락/결단) -> 허락을 받지 않고 마음대로 쓰는 것", "translations": {"en": {"term": "unauthorized use", "mainDef": "using something as one pleases without permission."}}, "examples": [{"kor": "남의 사진을 무단 이용하면 안 돼요.", "eng": "You shouldn't use other people's photos without permission."}], "variants": ["무단 이용"]},
            {"term": "갈등을 줄이다", "mainDef": "서로 부딪치는 다툼이나 마찰을 적게 만들다", "subDefs": [{"subTerm": "• 갈등", "subDef": "갈(葛 칡) + 등(藤 등나무) -> 칡과 등나무 덩굴이 얽히듯 서로의 입장이 얽혀 부딪치는 상태"}], "translations": {"en": {"term": "to reduce conflict", "mainDef": "to lessen disputes or friction between people."}}, "examples": [{"kor": "대화를 자주 하면 가족 사이의 갈등을 줄일 수 있어요.", "eng": "Talking often can reduce conflict within a family."}], "variants": ["갈등을 줄이다", "갈등을 줄이는"]},
            {"term": "합리적인 방법", "mainDef": "이치에 맞고 낭비가 없는 방법", "subDefs": [{"subTerm": "• 합리적", "subDef": "합(合 맞다) + 리(理 이치) -> 이치나 논리에 잘 맞는 것"}], "translations": {"en": {"term": "a reasonable method", "mainDef": "a way of doing things that makes sense and wastes nothing."}}, "examples": [{"kor": "문제를 해결하는 가장 합리적인 방법을 찾아봅시다.", "eng": "Let's find the most reasonable way to solve the problem."}], "variants": ["합리적인 방법"]},
            {"term": "급할 때", "mainDef": "몹시 서둘러야 하거나 참기 어려운 때. 이 동영상에서는 화장실이 아주 급한 상황을 말해요", "subDefs": [{"subTerm": "• 급하다", "subDef": "급(急 급하다) -> 서둘러야 할 만큼 여유가 없다"}, {"subTerm": "• -ㄹ/을 때", "subDef": "어떤 일이 일어나는 시간이나 상황을 나타내는 표현"}], "translations": {"en": {"term": "when it's urgent / in an emergency", "mainDef": "a moment when you must hurry or can hardly hold on; here, urgently needing a restroom."}}, "examples": [{"kor": "급할 때는 저에게 바로 전화하세요.", "eng": "When it's urgent, call me right away."}], "variants": ["급할 때"]},
            {"term": "암묵적인 룰", "mainDef": "말로 정하지는 않았지만 모두가 자연스럽게 지키는 규칙", "subDefs": [{"subTerm": "• 암묵적", "subDef": "암(暗 어둡다) + 묵(默 말이 없다) -> 겉으로 말하지 않고 조용히 이루어지는 것"}], "translations": {"en": {"term": "unspoken rule", "mainDef": "a rule that was never stated out loud but that everyone naturally follows."}}, "examples": [{"kor": "늦게 온 사람이 커피를 사는 게 우리 팀의 암묵적인 룰이에요.", "eng": "It's our team's unspoken rule that whoever comes late buys the coffee."}], "variants": ["암묵적인 룰"]},
            {"term": "공공화장실", "mainDef": "공공(公共 사회 모두의) + 화장실 -> 여러 사람이 함께 쓰도록 마련된 화장실. '공중화장실'과 거의 같은 뜻으로 쓰여요", "translations": {"en": {"term": "public restroom", "mainDef": "a restroom provided for everyone to use; used almost interchangeably with 공중화장실."}}, "examples": [{"kor": "지하철역 공공화장실은 무료로 쓸 수 있어요.", "eng": "Public restrooms in subway stations are free to use."}], "variants": ["공공화장실"]},
            {"term": "유료화", "mainDef": "유(有 있다) + 료(料 값) + 화(化 되다) -> 무료였던 것을 돈을 내야 쓰는 방식으로 바꿈", "translations": {"en": {"term": "switching to a paid model", "mainDef": "changing something that used to be free into something you must pay for."}}, "examples": [{"kor": "그 앱은 일부 기능을 유료화했어요.", "eng": "That app made some of its features paid."}], "variants": ["유료화", "유료화되는", "유료화하는"]},
            {"term": "부담스럽다", "mainDef": "부담(負擔 떠맡은 짐)스럽다 -> 감당하기에 무겁고 힘들게 느껴지다", "subDefs": [{"subTerm": "• 부담", "subDef": "부(負 지다) + 담(擔 메다) -> 떠맡아야 하는 짐이나 책임"}], "translations": {"en": {"term": "to feel burdensome", "mainDef": "to feel like too much to handle — financially or emotionally."}}, "examples": [{"kor": "선물이 너무 비싸서 받기가 부담스러워요.", "eng": "The gift is so expensive that accepting it feels like a burden."}], "variants": ["부담스럽다", "부담스럽다는"]},
            {"term": "부담이 되다", "mainDef": "돈, 일, 마음 등이 감당하기 힘든 짐이 되다", "subDefs": [{"subTerm": "• 부담", "subDef": "부(負 지다) + 담(擔 메다) -> 떠맡아야 하는 짐이나 책임"}], "translations": {"en": {"term": "to be a burden", "mainDef": "for money, work, or worry to become a weight that is hard to carry."}}, "examples": [{"kor": "매달 나가는 월세가 부담이 돼요.", "eng": "The monthly rent is a burden."}], "variants": ["부담이 되다", "부담이 돼요"]},
            {"term": "전문가", "mainDef": "전문(專門 한 분야만 깊이) + 가(家 사람) -> 한 분야를 깊이 연구해서 잘 아는 사람", "translations": {"en": {"term": "expert", "mainDef": "a person who knows a field deeply through study and experience."}}, "examples": [{"kor": "의사는 건강 전문가예요.", "eng": "Doctors are health experts."}], "variants": ["전문가", "전문가들"]},
            {"term": "사회 구조적인 문제", "mainDef": "개인의 잘못이 아니라 사회의 짜임새 자체에서 생기는 문제", "subDefs": [{"subTerm": "• 구조적", "subDef": "구(構 얽다) + 조(造 만들다) -> 개별 사건이 아니라 전체의 짜임새와 관련된 것"}], "translations": {"en": {"term": "a structural social problem", "mainDef": "a problem that comes from how society itself is organized, not from an individual's fault."}}, "examples": [{"kor": "낮은 출산율은 사회 구조적인 문제와 관련이 있어요.", "eng": "The low birth rate is tied to structural social problems."}], "variants": ["사회 구조적인 문제"]},
            {"term": "공공재", "mainDef": "공공(公共 사회 모두의) + 재(財 재물) -> 모든 사람이 함께 쓸 수 있도록 사회가 제공하는 것", "translations": {"en": {"term": "public good", "mainDef": "something society provides for everyone to use together, like parks or street lights."}}, "examples": [{"kor": "깨끗한 공기는 대표적인 공공재예요.", "eng": "Clean air is a classic example of a public good."}], "variants": ["공공재"]},
            {"term": "가격에 반영하다", "mainDef": "어떤 비용이나 사정을 값에 나타나게 하다, 곧 그만큼 값을 올리거나 조정하다", "subDefs": [{"subTerm": "• 반영하다", "subDef": "반(反 되돌리다) + 영(映 비추다) -> 어떤 사실이나 의견이 다른 것에 나타나게 하다"}], "translations": {"en": {"term": "to factor into the price", "mainDef": "to make a cost or circumstance show up in the price — that is, to raise or adjust the price accordingly."}}, "examples": [{"kor": "재료비가 오르면 식당은 그 비용을 가격에 반영해요.", "eng": "When ingredient costs rise, restaurants factor them into their prices."}], "variants": ["가격에 반영하다", "가격에 반영하기"]},
            {"term": "인식", "mainDef": "인(認 알다) + 식(識 알다) -> 어떤 것을 알고 이해하는 생각이나 태도", "translations": {"en": {"term": "perception / awareness", "mainDef": "the way people understand and think about something."}}, "examples": [{"kor": "환경 보호에 대한 인식이 높아지고 있어요.", "eng": "Awareness of environmental protection is growing."}], "variants": ["인식"]},
            {"term": "거부감이 생기다", "mainDef": "받아들이고 싶지 않은 싫은 느낌이 마음속에 일어나다", "subDefs": [{"subTerm": "• 거부감", "subDef": "거(拒 막다) + 부(否 아니다) + 감(感 느낌) -> 받아들이고 싶지 않아 밀어내고 싶은 느낌"}], "translations": {"en": {"term": "to start feeling resistance", "mainDef": "for a feeling of not wanting to accept something to arise in one's mind."}}, "examples": [{"kor": "광고가 너무 많으면 오히려 거부감이 생겨요.", "eng": "Too many ads actually create resistance."}], "variants": ["거부감이 생기다", "거부감이 생길"]},
            {"term": "공공성", "mainDef": "공공(公共) + 성(性 성질) -> 한 개인이 아니라 사회 모두에 관계되어 누구에게나 열려 있어야 하는 성질", "translations": {"en": {"term": "public nature / publicness", "mainDef": "the quality of concerning all of society and needing to be open to everyone, not just one person."}}, "examples": [{"kor": "의료 서비스는 공공성이 강한 분야예요.", "eng": "Medical services are a field with a strong public nature."}], "variants": ["공공성"]},
            {"term": "시장의 논리", "mainDef": "수요와 공급, 비용과 이익에 따라 움직이는 시장의 원리. 이 동영상에서는 '비용이 들면 그만큼 값을 받는다'는 사고방식을 가리켜요", "subDefs": [{"subTerm": "• 논리", "subDef": "논(論 논하다) + 리(理 이치) -> 생각이 이어지는 이치나 원리"}], "translations": {"en": {"term": "the logic of the market", "mainDef": "the principle that markets run on supply, demand, cost, and profit; here, the mindset that 'if it costs money, you charge for it.'"}}, "examples": [{"kor": "시장의 논리로만 보면 인기 없는 버스 노선은 없어져야 해요.", "eng": "By market logic alone, unpopular bus routes should be cut."}], "variants": ["시장의 논리"]},
            {"term": "부딪히다", "mainDef": "원래는 물체가 서로 세게 닿다 -> 이 동영상에서는 두 가지 생각이나 가치가 서로 맞서 충돌한다는 비유로 쓰였어요", "translations": {"en": {"term": "to collide; (figuratively) to clash", "mainDef": "literally for objects to hit each other; here a metaphor for two ideas or values clashing head-on."}}, "examples": [{"kor": "두 사람의 의견이 자꾸 부딪혀서 회의가 길어졌어요.", "eng": "The two kept clashing over their opinions, so the meeting ran long."}], "variants": ["부딪히다", "부딪히는"]},
            {"term": "타당하다", "mainDef": "타(妥 온당하다) + 당(當 마땅하다) -> 이치에 맞아 옳다고 할 만하다", "translations": {"en": {"term": "to be reasonable / valid", "mainDef": "to make sense logically and be considered right."}}, "examples": [{"kor": "그의 주장은 근거가 있어서 타당해요.", "eng": "His argument is valid because it's backed by evidence."}], "variants": ["타당하다", "타당하다고"]},
            {"term": "해외 사례", "mainDef": "다른 나라에서 실제로 있었던 비슷한 일의 예", "subDefs": [{"subTerm": "• 해외", "subDef": "해(海 바다) + 외(外 밖) -> 바다 밖, 곧 다른 나라"}, {"subTerm": "• 사례", "subDef": "사(事 일) + 례(例 본보기) -> 실제로 일어난 일의 예"}], "translations": {"en": {"term": "overseas cases / examples from abroad", "mainDef": "real examples of similar situations in other countries."}}, "examples": [{"kor": "새 제도를 만들기 전에 해외 사례를 조사했어요.", "eng": "They studied overseas cases before creating the new system."}], "variants": ["해외 사례", "해외 사례들"]},
            {"term": "유료 화장실", "mainDef": "유료(有料 돈을 냄) + 화장실 -> 돈을 내야 쓸 수 있는 화장실", "translations": {"en": {"term": "paid restroom", "mainDef": "a restroom you must pay to use."}}, "examples": [{"kor": "유럽 기차역에는 유료 화장실이 많아요.", "eng": "There are many paid restrooms in European train stations."}], "variants": ["유료 화장실"]},
            {"term": "공중화장실", "mainDef": "공중(公衆 일반 사람들) + 화장실 -> 길이나 역, 공원 등에 누구나 쓰도록 설치된 화장실. 법률에서 쓰는 공식 용어예요", "subDefs": [{"subTerm": "• 공중", "subDef": "공(公 공평하다) + 중(衆 무리) -> 사회의 일반 사람들"}], "translations": {"en": {"term": "public restroom (official term)", "mainDef": "a restroom installed on streets, in stations, or in parks for anyone to use; the official legal term in Korea."}}, "examples": [{"kor": "공원 공중화장실이 아주 깨끗했어요.", "eng": "The public restroom in the park was very clean."}], "variants": ["공중화장실"]},

            {"id": 5, "questionKor": "다음 빈칸에 알맞은 말을 고르세요.", "questionEng": "Choose the correct word for the blank.", "sentence_pre": "급할 때 화장실 정도는 무료로 쓰자는 ", "sentence_post": " 룰이 깨져서 아쉽다는 의견도 많아요.", "correct_word": "암묵적인", "translation": "Many are also disappointed that the unspoken rule — that a restroom, at least, should be free in an emergency — has been broken.", "hint": "'말로 정하지 않았지만 모두가 아는'이라는 뜻이에요. 반대말은 '명시적인'이에요.", "hintEng": "It means 'not stated in words but known to everyone.' Its opposite is 명시적인 (explicit).", "options": [{"text": "암묵적인", "isCorrect": true, "feedback": "정답! '암묵적'은 말로 정하지 않았지만 모두가 자연스럽게 알고 지키는 것을 뜻해요. '암묵적인 룰'은 사회의 보이지 않는 약속이에요."}, {"text": "명시적인", "isCorrect": false, "feedback": "'명시적'은 글이나 말로 분명하게 정해 놓았다는 뜻으로 '암묵적'의 반대말이에요. 화장실 무료 이용은 어디에도 적혀 있지 않은 약속이었죠."}, {"text": "강제적인", "isCorrect": false, "feedback": "'강제적'은 힘으로 억지로 시킨다는 뜻이에요. 자연스럽게 지켜져 온 약속과는 성격이 달라요."}, {"text": "일시적인", "isCorrect": false, "feedback": "'일시적'은 잠깐 동안만이라는 뜻이에요. 오랫동안 이어져 온 룰이라는 문맥과 맞지 않아요."}]},
            {"id": 6, "questionKor": "다음 빈칸에 알맞은 말을 고르세요.", "questionEng": "Choose the correct word for the blank.", "sentence_pre": "반대하는 사람은 이런 기준이 생기면 공공화장실까지 ", "sentence_post": " 흐름으로 갈 수 있다고 걱정했어요.", "correct_word": "유료화되는", "translation": "Opponents worry that once this precedent is set, it could lead to even public restrooms becoming paid.", "hint": "'무료였던 것이 돈을 받는 방식으로 바뀌다'라는 뜻의 동사를 뒤의 '흐름'을 꾸미는 '-는' 관형형으로 바꾸세요.", "hintEng": "Take the verb meaning 'for something free to become paid' and change it to the -는 modifier form to describe 흐름.", "options": [{"text": "유료화되는", "isCorrect": true, "feedback": "정답! '유료화되다(무료였던 것이 유료로 바뀌다)'가 뒤의 '흐름'을 수식하는 관형형 '유료화되는'으로 활용됐어요."}, {"text": "무료화되는", "isCorrect": false, "feedback": "'무료화'는 유료였던 것을 무료로 바꾼다는 뜻이에요. 반대하는 사람의 걱정과 정반대 방향이에요."}, {"text": "민영화되는", "isCorrect": false, "feedback": "'민영화'는 정부가 운영하던 것을 민간 기업에 넘긴다는 뜻이에요. 여기서 걱정하는 것은 운영 주체가 아니라 '돈을 받게 되는' 변화예요."}, {"text": "활성화되는", "isCorrect": false, "feedback": "'활성화'는 활발해진다는 뜻이에요. 요금이 생기는 변화와는 관련이 없어요."}]},
            {"id": 7, "questionKor": "다음 빈칸에 알맞은 말을 고르세요.", "questionEng": "Choose the correct word for the blank.", "sentence_pre": "'한 번 사용에 2000원'이라는 가격은 ", "sentence_post": " 의견도 적지 않았어요.", "correct_word": "부담스럽다는", "translation": "Quite a few people also said the price of 2,000 won per use felt too steep.", "hint": "'감당하기에 무겁게 느껴지다'라는 뜻이에요. 남의 말을 옮기며 뒤의 명사를 꾸미는 '-다는'을 붙이세요.", "hintEng": "It means 'to feel like too much to handle.' Attach the quoting modifier -다는 to describe 의견.", "options": [{"text": "부담스럽다는", "isCorrect": true, "feedback": "정답! '부담스럽다'에 남의 말을 옮기며 뒤의 명사를 수식하는 '-다는'이 붙어 '부담스럽다는 의견(= 부담스럽다고 하는 의견)'이 됐어요."}, {"text": "부담스러운", "isCorrect": false, "feedback": "'부담스러운 의견'이라고 하면 의견 자체가 부담스럽다는 뜻이 돼요. 여기서 부담스러운 것은 의견이 아니라 '가격'이므로 인용의 '-다는'이 필요해요."}, {"text": "부담스럽게", "isCorrect": false, "feedback": "'부담스럽게'는 부사형이라 뒤의 명사 '의견'을 수식할 수 없어요."}, {"text": "부담스러워서", "isCorrect": false, "feedback": "'부담스러워서'는 이유를 나타내는 연결어미예요. 명사 '의견' 앞에는 관형형이 와야 해요."}]},
            {"id": 8, "questionKor": "다음 빈칸에 알맞은 말을 고르세요.", "questionEng": "Choose the correct word for the blank.", "sentence_pre": "이홍주 교수는 그동안 카페 화장실이 사실상 ", "sentence_post": "처럼 쓰여왔다고 설명했어요.", "correct_word": "공공재", "translation": "Professor Lee explained that café restrooms have effectively been used like a public good.", "hint": "모두가 함께 쓰도록 사회가 제공하는 것을 가리키는 경제 용어예요.", "hintEng": "An economics term for something society provides for everyone to share.", "options": [{"text": "공공재", "isCorrect": true, "feedback": "정답! '공공재'는 모든 사람이 함께 쓸 수 있도록 제공되는 것을 뜻하는 경제 용어예요. 카페 화장실이 개인 소유인데도 모두의 것처럼 쓰여 왔다는 분석이에요."}, {"text": "사유재산", "isCorrect": false, "feedback": "'사유재산'은 개인이 소유한 재산이에요. 카페 화장실은 원래 사유재산인데 공공재'처럼' 쓰여 온 것이 문제의 핵심이에요."}, {"text": "소모품", "isCorrect": false, "feedback": "'소모품'은 쓰면 닳아 없어지는 물건이에요. 휴지는 소모품이지만, 화장실 전체를 가리키는 말로는 맞지 않아요."}, {"text": "기념품", "isCorrect": false, "feedback": "'기념품'은 기념으로 사거나 주는 물건이에요. 문맥과 전혀 관련이 없어요."}]},
            {"id": 9, "questionKor": "다음 빈칸에 알맞은 말을 고르세요.", "questionEng": "Choose the correct word for the blank.", "sentence_pre": "이용자가 늘고 관리 부담이 커지자 업주들이 그 비용을 ", "sentence_post": " 시작했어요.", "correct_word": "가격에 반영하기", "translation": "As users increased and the maintenance burden grew, owners began factoring that cost into their prices.", "hint": "'비용을 값에 나타나게 하다'라는 뜻이에요. '시작하다' 앞에 오도록 명사형 '-기'로 바꾸세요.", "hintEng": "It means 'to make a cost show up in the price.' Change it to the noun form -기 so it fits before 시작하다.", "options": [{"text": "가격에 반영하기", "isCorrect": true, "feedback": "정답! '-기 시작하다'는 동사에 명사형 어미 '-기'를 붙여 '~하는 것을 시작하다'를 나타내요. '반영하다 → 반영하기 시작했어요'로 활용됐어요."}, {"text": "가격에 반영해서", "isCorrect": false, "feedback": "'반영해서'는 이유나 순서를 잇는 연결어미라 뒤의 '시작했어요'와 자연스럽게 이어지지 않아요. '시작하다' 앞에는 '-기'가 와야 해요."}, {"text": "가격에 반영하고", "isCorrect": false, "feedback": "'반영하고'는 나열의 연결어미예요. '시작하다'와 결합하려면 명사형 '-기'가 필요해요."}, {"text": "가격에 반영하도록", "isCorrect": false, "feedback": "'-도록'은 목적이나 정도를 나타내는 어미라 '시작했어요'와 어울리지 않아요."}]},
            {"id": 10, "questionKor": "다음 빈칸에 알맞은 말을 고르세요.", "questionEng": "Choose the correct word for the blank.", "sentence_pre": "일부 관광지에서는 자영업자가 화장실을 ", "sentence_post": " 대신 지자체로부터 관리비를 지원받아요.", "correct_word": "개방하는", "translation": "In some tourist areas, small business owners open their restrooms to the public in exchange for maintenance subsidies from the local government.", "hint": "'누구나 쓸 수 있게 열어 두다'라는 뜻이에요. '대신' 앞에 오도록 '-는' 관형형으로 활용하세요.", "hintEng": "It means 'to open something up for anyone to use.' Use the -는 modifier form before 대신.", "options": [{"text": "개방하는", "isCorrect": true, "feedback": "정답! '개방하다(누구나 쓰게 열어 두다)'가 '-는 대신(~하는 것 대신에/~하는 대가로)'과 결합해 '개방하는 대신'이 됐어요."}, {"text": "개방한", "isCorrect": false, "feedback": "'개방한 대신'은 과거에 한 번 개방했다는 뜻이 돼요. 여기서는 지금도 계속 개방하는 일반적인 상황이므로 현재 관형형 '-는'이 자연스러워요."}, {"text": "개방할", "isCorrect": false, "feedback": "'개방할 대신'은 문법적으로 어색한 결합이에요. '대신' 앞에는 보통 '-는/-ㄴ' 관형형이 와요."}, {"text": "개방하던", "isCorrect": false, "feedback": "'개방하던'은 과거에 하다가 멈춘 일을 나타내요. 지금도 운영되고 있는 방식이므로 맞지 않아요."}]}
        ];
        const DISCUSS_DATA = [
            {"id": 1, "questionKor": "여러분은 카페나 식당에서 주문하지 않고 화장실만 이용해 본 적이 있어요? 그때 눈치가 보였어요, 아니면 당연하다고 생각했어요?", "questionEng": "Have you ever used the restroom at a café or restaurant without ordering anything? Did you feel self-conscious, or did it feel like a natural thing to do?", "vocab": [{"term": "눈치가 보이다", "def": "다른 사람이 어떻게 생각할지 신경이 쓰이다.", "defEng": "to feel self-conscious about what others think"}, {"term": "무단 이용", "def": "허락 없이 마음대로 쓰는 것.", "defEng": "unauthorized use"}, {"term": "당연하다", "def": "그렇게 하는 것이 마땅하고 자연스럽다.", "defEng": "to be natural / to be taken for granted"}]},
            {"id": 2, "questionKor": "여러분 나라에서는 카페나 공공장소의 화장실을 어떻게 이용해요? 유료 화장실이 있다면, 사람들은 그것을 자연스럽게 받아들여요?", "questionEng": "How do people use restrooms at cafés or public places in your country? If there are paid restrooms, do people accept them as normal?", "vocab": [{"term": "공공장소", "def": "여러 사람이 함께 이용하는 곳.", "defEng": "public place"}, {"term": "유료", "def": "돈을 내야 하는 것.", "defEng": "paid, requiring a fee"}, {"term": "관행", "def": "오래전부터 사회에서 자연스럽게 해 오던 방식.", "defEng": "customary practice"}]},
            {"id": 3, "questionKor": "왜 한국에서는 오랫동안 화장실이 '무료 인프라'로 여겨져 왔을까요? 그 이면에는 어떤 문화나 심리가 있다고 생각해요?", "questionEng": "Why do you think restrooms in Korea have long been regarded as 'free infrastructure'? What culture or mindset do you think lies behind it?", "vocab": [{"term": "여겨지다", "def": "그렇다고 생각되다.", "defEng": "to be regarded as"}, {"term": "이면", "def": "겉으로 드러나지 않는 안쪽 사정.", "defEng": "the hidden side, what lies behind"}, {"term": "인식", "def": "어떤 것을 알고 이해하는 생각.", "defEng": "perception, awareness"}]},
            {"id": 4, "questionKor": "동영상에서 업주들은 담배, 시설 파손, 청소 비용 등 여러 피해를 이야기했어요. 그중 어떤 근거가 가장 설득력 있다고 생각해요? 반대로 설득력이 약한 근거도 있을까요?", "questionEng": "In the video, owners cited various harms — smoking, property damage, cleaning costs. Which of these do you find most convincing? Is there one you find weak?", "vocab": [{"term": "설득력", "def": "다른 사람이 그 말을 믿고 따르게 하는 힘.", "defEng": "persuasiveness"}, {"term": "근거", "def": "주장을 뒷받침하는 이유나 사실.", "defEng": "grounds, supporting evidence"}, {"term": "파손", "def": "깨지거나 부서져서 못 쓰게 됨.", "defEng": "damage, breakage"}]},
            {"id": 5, "questionKor": "화장실, 물, 와이파이, 콘센트... 가게가 무료로 제공해야 하는 것과 돈을 받아도 되는 것을 여러분은 어떤 기준으로 구분해요?", "questionEng": "Restrooms, water, Wi-Fi, power outlets... By what standard do you decide which things a shop should provide for free and which it can charge for?", "vocab": [{"term": "제공하다", "def": "무엇을 내주거나 마련해 주다.", "defEng": "to provide"}, {"term": "기준", "def": "판단이나 구분의 바탕이 되는 표준.", "defEng": "standard, criterion"}, {"term": "구분하다", "def": "일정한 기준에 따라 나누다.", "defEng": "to distinguish, to divide"}]},
            {"id": 6, "questionKor": "화장실 이용료를 두고 한쪽에서는 '서비스에 대한 정당한 가치 지불'이라고 하고, 다른 쪽에서는 '기본적인 배려의 상실'이라고 해요. 여러분은 '가게를 운영하는 업주의 권리'와 '급한 사람이 화장실을 쓸 수 있어야 한다는 기본적인 필요' 중 어느 쪽이 더 우선되어야 한다고 생각해요?", "questionEng": "On restroom fees, one side calls it 'paying fair value for a service,' while the other calls it 'the loss of basic consideration for others.' Which do you think should take priority — 'the rights of the business owner' or 'the basic need for someone in an emergency to use a restroom'?", "vocab": [{"term": "정당한 가치를 지불하다", "def": "어떤 것의 값어치에 맞는 돈을 마땅하게 내다.", "defEng": "to pay fair value"}, {"term": "배려", "def": "다른 사람을 생각해서 마음을 써 주는 것.", "defEng": "consideration for others"}, {"term": "권리", "def": "어떤 일을 하거나 요구할 수 있는 자격.", "defEng": "right"}, {"term": "우선되다", "def": "다른 것보다 먼저 중요하게 다루어지다.", "defEng": "to take priority"}]},
            {"id": 7, "questionKor": "유럽에서는 '이용한 사람이 돈을 내야 한다'는 사용자 부담 원칙이 강하고, 화장실을 하나의 사업 아이템으로 보기도 해요. 그런데도 공중화장실이 부족해서 노상방뇨가 사회 문제가 되고, 범죄나 노숙자 점거에 대한 우려 때문에 화장실을 아예 만들지 않기도 한대요. 이런 유럽의 상황을 보면, 유료화는 화장실 문제의 해결책일까요, 아니면 또 다른 문제의 시작일까요?", "questionEng": "In Europe, the user-pays principle — whoever uses a facility should pay for it — is strong, and restrooms are even treated as a business item. Yet public restrooms are so scarce that public urination has become a social problem, and fears of crime or occupation by homeless people sometimes stop restrooms from being built at all. Looking at Europe, is charging fees a solution to the restroom problem, or the start of another one?", "vocab": [{"term": "노상방뇨", "def": "길이나 건물 밖에서 대소변을 보는 것.", "defEng": "urinating in the street / public urination"}, {"term": "사용자 부담 원칙", "def": "시설을 이용한 사람이 그 비용을 내야 한다는 원칙.", "defEng": "the user-pays principle"}, {"term": "점거하다", "def": "어떤 장소를 차지하고 비켜 주지 않다.", "defEng": "to occupy (a place)"}, {"term": "우려", "def": "잘못될까 봐 걱정하는 마음.", "defEng": "concern, worry"}]},

            return `<div class="w-full pt-16 px-6 max-w-[1000px] mx-auto pb-20 animate-fade-in"><div class="mb-12 md:mb-20 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">핵심 어휘</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Key Vocabulary</span><div class="w-[1px] h-8 bg-gray-200 mx-auto mt-8"></div></div><div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center bg-gray-50 p-4 rounded-none border border-gray-100"><div class="relative w-full sm:max-w-xs"><input type="text" id="vocab-search" value="${esc(vocabState.query)}" placeholder="${secLang() ? '단어, 뜻, 영어 검색... / Search words...' : '단어, 뜻, 영어 검색...'}" class="w-full px-4 py-2 text-sm border border-gray-300 rounded-none focus:outline-none focus:ring-2 focus:ring-gray-800 transition-all" />${vocabState.query ? '<button type="button" data-action="vocab-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs font-bold">✕</button>' : ''}</div><div class="flex items-center gap-4 w-full sm:w-auto justify-end"><span class="text-xs text-gray-500 font-sans">검색 결과: <strong id="vocab-count">${vocabFiltered().length}</strong>개 / 전체 ${VOCAB_DATA.length}개</span><button type="button" data-action="vocab-global" class="px-4 py-2 text-xs font-semibold rounded-none border transition-all ${vocabState.globalTrans ? 'bg-gray-900 text-white border-gray-900 hover:bg-black' : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'}">${vocabState.globalTrans ? '영어 일괄 숨기기<span class="lk-en"> · Hide English</span>' : '영어 일괄 표시<span class="lk-en"> · Show English</span>'}</button></div></div><div id="vocab-grid">${vocabGridHTML()}</div></div>`;
        }

        // ---------- QUIZ (객관식) ----------
        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 힌트<span class="lk-en"> · Hint</span>: ${esc(quiz.hint)}${st.showTrans && quiz.hintEng ? `<span class="block text-xs text-gray-400 mt-1 animate-fade-in">${esc(quiz.hintEng)}</span>` : ''}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;
        }
        function rerenderQuizQ(qid) { const el = qs(`.quiz-q[data-qid="${qid}"]`, viewRoot()); if (el) el.outerHTML = quizItemHTML(QUIZ_LIST.find(q => String(q.id) === String(qid))); }
        function updateQuizScore() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; }

        // ---------- DISCUSS ----------
        function feedbackSectionHTML(titleKor, titleEng, contentHTML, isCorrection) { return `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2">${esc(titleKor)} <span class="font-eng-header font-medium text-[9px]">${esc(titleEng)}</span></h4><p class="${isCorrection ? 'text-[15px] md:text-base font-serif text-gray-900 leading-relaxed font-medium bg-white p-4 border border-gray-200 shadow-sm rounded-sm' : 'text-[13px] md:text-sm font-sans text-gray-700 leading-relaxed whitespace-pre-wrap'}">${contentHTML}</p></div>`; }
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, generating: false, feedback: null, error: '' });
            const vocab = (item.vocab||[]).map(v => `<p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}${st.showTrans && v.defEng ? `<span class="block text-xs font-sans text-gray-400 mt-0.5 mb-1 animate-fade-in">${esc(v.defEng)}</span>` : ''}</p>`).join('');
            let fb = '';
            if (st.error) fb = `<div class="mt-4 p-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-sm animate-fade-in">${esc(st.error)}</div>`;
            else if (st.feedback) {
                const fd = st.feedback;
                const details = (fd.detailed_corrections && fd.detailed_corrections.length) ? `<div><h4 class="text-[10px] font-bold font-sans text-gray-400 uppercase tracking-widest mb-3 flex items-center gap-2">상세 설명 <span class="lk-en font-eng-header font-medium text-[9px]">EXPLANATION</span></h4><div class="space-y-3">${fd.detailed_corrections.map(d => `<div class="bg-white p-4 border border-gray-100 rounded-sm hover:border-gray-200 transition-colors">${(d.original || d.corrected) ? `<div class="flex flex-wrap items-center gap-3 mb-2.5 text-[15px] font-serif">${d.original ? `<span class="text-red-400 line-through decoration-red-300/60">${esc(d.original)}</span>` : ''}${(d.original && d.corrected) ? '<span class="text-gray-300">→</span>' : ''}${d.corrected ? `<span class="text-gray-900 font-bold tracking-wide">${esc(d.corrected)}</span>` : ''}</div>` : ''}<p class="text-[13px] md:text-sm font-sans text-gray-600 leading-relaxed">${renderFormatted(d.explanation)}</p></div>`).join('')}</div></div>` : '';
                fb = `<div class="mt-8 p-6 bg-gray-50 border border-gray-200 rounded-sm animate-fade-in relative"><div class="flex items-center gap-2 mb-6 pb-4 border-b border-gray-200">${svgIcon('sparkles', 'w-5 h-5 text-gray-900', { fill: 'currentColor' })}<span class="text-xs font-bold font-sans text-gray-900 uppercase tracking-widest">${secLang() ? 'AI Teacher Feedback' : 'AI 선생님 피드백'}</span></div><div class="space-y-8">${feedbackSectionHTML('피드백', 'FEEDBACK', renderFormatted(fd.feedback))}${feedbackSectionHTML('모범 답안', 'CORRECTION', esc(fd.correction), true)}${details}</div><div class="mt-8 pt-4 border-t border-gray-200"><p class="text-[10px] text-gray-400 font-sans text-center">※ AI가 생성한 피드백이므로 간혹 부자연스럽거나 오류가 있을 수 있습니다.</p></div></div>`;
            }
            const disabled = (!st.text.trim() || st.generating);
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal whitespace-pre-line">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14"><div class="flex gap-2 mb-4">${transBtn('discuss-qtrans', st.showTrans)}${st.showTrans ? `<p class="text-sm font-sans text-gray-500 animate-fade-in whitespace-pre-line">${esc(item.questionEng)}</p>` : ''}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-2 block tracking-widest">${secLang() ? 'Key Vocabulary' : '핵심 어휘'}</span><div class="space-y-1">${vocab}</div></div><textarea data-action="discuss-text" placeholder="${secLang() ? '여기에 생각을 적어보세요... / Write your thoughts here...' : '여기에 생각을 적어보세요...'}" class="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300">${esc(st.text)}</textarea><div class="flex justify-end"><button type="button" data-action="discuss-feedback" ${disabled ? 'disabled' : ''} class="px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${disabled ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}">${st.generating ? '<div class="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></div>생성 중...<span class="lk-en">&nbsp;· Generating...</span>' : 'AI 피드백 받기<span class="lk-en">&nbsp;· Get AI Feedback</span>'}</button></div>${fb}</div></div>`;
        }
        function discussHTML() {
            return `<div class="max-w-3xl mx-auto w-full px-6 py-12 animate-fade-in"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">생각해 보기</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Food For Thought</span></div><div class="bg-gray-50 border border-gray-200 py-4 px-5 mb-24 md:mb-32 rounded-none flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div class="flex gap-4 items-center"><div class="shrink-0 text-gray-400">${svgIcon('sparkles', 'w-5 h-5', { fill: 'currentColor' })}</div><div class="flex flex-col"><p class="text-xs font-bold font-sans text-gray-800 leading-tight">AI 피드백은 현재 Gemini 웹에서만 가능합니다.</p><p class="lk-en text-[10px] font-sans text-gray-400 mt-1">AI feedback is currently available only on Gemini web.</p></div></div><a href="https://gemini.google.com/share/REPLACE_SHARE_ID" target="_blank" rel="noreferrer" class="group flex flex-col items-center justify-center bg-white py-1.5 px-3 shadow-sm hover:shadow transition-all shrink-0 no-underline rounded-none border border-gray-100"><div class="flex items-center gap-1"><span class="text-[11px] font-bold font-sans text-gray-700 group-hover:text-black">Gemini에서 열기</span>${svgIcon('externalLink', 'w-3 h-3 text-gray-400 group-hover:text-black')}</div><span class="lk-en text-[9px] font-sans text-gray-400 group-hover:text-gray-600 uppercase tracking-widest mt-0.5">Open in Gemini</span></a></div><div id="discuss-list">${DISCUSS_DATA.map(discussItemHTML).join('')}</div></div>`;
        }
        function rerenderDiscussItem(id) { const el = qs(`.discuss-q[data-did="${id}"]`, viewRoot()); if (el) el.outerHTML = discussItemHTML(DISCUSS_DATA.find(d => d.id === id)); }

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);
            if (typeof VOCAB_READ !== 'undefined' && Array.isArray(VOCAB_READ)) out.push(...VOCAB_READ);
            if (out.length) return out;
            if (typeof VOCAB_READING_DATA !== 'undefined' && Array.isArray(VOCAB_READING_DATA)) return VOCAB_READING_DATA;
            return [];
        }
        const PW_SECTIONS = (() => {
            const s = [];
            const hasVideos = (typeof VIDEOS !== 'undefined' && VIDEOS.length && VIDEOS[0].script && VIDEOS[0].script.length);
            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);
            if (typeof READING_DATA !== 'undefined' && Array.isArray(READING_DATA) && READING_DATA.length) s.push(['reading', '읽기 자료']);
            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);
            if (typeof QUIZ_LIST !== 'undefined' && Array.isArray(QUIZ_LIST) && QUIZ_LIST.length) s.push(['quiz', '내용 확인 퀴즈']);
            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);
            return s;
        })();
        function pwHeaderHTML() {
            const title = (document.title || '').split('|')[0].trim();
            const lvl = (typeof app !== 'undefined' && app.userLevel) ? app.userLevel : '';
            return `<div class="pw-sec-header"><div class="pw-left">${lvl ? `<span class="pw-badge">${esc(lvl)}</span>` : ''}<span class="pw-title">${esc(title)}</span></div><span class="pw-brand">OpenKoreanLearningLab</span></div>`;
        }
        function pwScriptHTML() {
            const vids = (typeof VIDEOS !== 'undefined' && VIDEOS.length) ? VIDEOS : [{ title: '', script: (typeof VIDEO_SCRIPT_DATA !== 'undefined' ? VIDEO_SCRIPT_DATA : []) }];
            return vids.map(v => `${(vids.length > 1 && v.title) ? `<div class="pw-part-title">${esc(v.title)}${v.subTitle ? ' · ' + esc(v.subTitle) : ''}</div>` : ''}${(v.script || []).map(l => `<div class="pw-line"><div class="pw-kor"><span class="pw-spk">${esc(l.speaker || '')}</span>${esc(l.kor || '')}</div>${l.eng ? `<div class="pw-eng">${esc(l.eng)}</div>` : ''}</div>`).join('')}`).join('');
        }
        function pwReadingHTML() {
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')}</div>${r.subtitle ? `<div class="pw-read-sub">${esc(r.subtitle)}</div>` : ''}${(r.content || []).filter(p => !p.isChart).map(p => p.isHeading ? `<div class="pw-read-h">${esc(p.text || '')}</div>` : `<div class="pw-read-p">${esc(p.text || '')}</div>`).join('')}`).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 이벤트 위임 ----------
        appEl.addEventListener('click', (e) => {
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const _sl = e.target.closest('[data-setlang]');
            if (_sl) { app.lang = _sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            const _wasLangOpen = app.langOpen; app.langOpen = false;
            if (_wasLangOpen && !e.target.closest('[data-tab],[data-action],[data-line-play],[data-line-seek],[data-vocab-idx],[data-layout]')) { buildApp(); return; }
            const tab = app.activeTab;
            if (tab === 'video') {
                const vsel = e.target.closest('[data-video-idx]');
                if (vsel) { const vi = +vsel.dataset.videoIdx; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; paint(); } return; }
                const vspan = e.target.closest('[data-vocab-idx]'); if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) closeVocabPopup(); else showVocabPopup(w, r.left + r.width / 2, r.bottom, true); return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = curVideo().script.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'), sbBtn = e.target.closest('[data-action^="sb-trans-"]'); if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const a = e.target.closest('[data-action]'); if (a) { const act = a.dataset.action; if (act === 'rewind') { if (learn.player) { const n = Math.max(0, learn.currentTime - 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'forward') { if (learn.player) { const n = Math.min(learn.duration, learn.currentTime + 1.5); learn.player.seekTo(n, true); learn.currentTime = n; updateSeekUI(); } } else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } } else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); } else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); } else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); } }
                return;
            }
            if (tab === 'vocab') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                const card = a.closest('[data-vidx]');
                if (a.dataset.action === 'vocab-ex' && card) { const i = +card.dataset.vidx; vocabExpand[i] = !vocabExpand[i]; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, vocabTransOf(i)); }
                else if (a.dataset.action === 'vocab-toggle' && card) { const i = +card.dataset.vidx; const cur = vocabTransOf(i); vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, !cur); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                return;
            }
            if (tab === 'quiz') {
                const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return; const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; refreshVocabGrid(); return; }
            if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return; if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } }
        });

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.generating) return; st.generating = true; st.error = ''; st.feedback = null; rerenderDiscussItem(id);
            const item = DISCUSS_DATA.find(d => d.id === id); const lvl = app.userLevel;
            const beginner = ['A1', 'A1+', 'A2', 'A2+', 'B1', 'B1+'].includes(lvl);
            const instr = beginner ? `The student's level is ${lvl}. Write 'feedback' in ENGLISH; 'correction' in natural Korean; 'detailed_corrections' explanations in ENGLISH, wrapping Korean words in **bold**.` : `학생 레벨은 ${lvl}. 모든 필드를 한국어로만 작성. explanation 안 한국어 강조는 **단어** 사용.`;
            const vocabCtx = item.vocab ? (item.vocab||[]).map(v => `- ${v.term}: ${v.def}`).join('\n') : '없음';
            const sys = `당신은 한국어 선생님입니다.\n${instr}\n맞춤법·띄어쓰기·문법 오류를 찾고, 'correction'은 해요체로. JSON만 응답(마크다운 금지): {"feedback":"","correction":"","detailed_corrections":[{"original":"","corrected":"","explanation":""}]}\n[핵심 어휘]\n${vocabCtx}`;
            const payload = { contents: [{ role: 'user', parts: [{ text: `${sys}\n\n질문: "${item.questionKor}"\n학생 답변: "${st.text}"` }] }], generationConfig: { responseMimeType: 'application/json' } };
            try { const r = await callGeminiWithBackoff(payload); const txt = r.candidates && r.candidates[0] && r.candidates[0].content.parts[0].text; if (!txt) throw new Error('피드백을 생성하지 못했습니다.'); st.feedback = JSON.parse(txt.replace(/^```(json)?\n?/, '').replace(/\n?```$/, '').trim()); }
            catch (err) { st.error = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.'; }
            finally { st.generating = false; rerenderDiscussItem(id); }
        }

        buildApp();
    })();
    </script>
