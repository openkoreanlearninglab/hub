#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}

#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}

#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}

.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            height: 16px;
            width: 16px;
            border-radius: 50%;

            margin-top: -7px;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #e5e7eb;

        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["문화", "음식"];
        const HOME_SERIES_BADGE = "";
        const READING_DATA = [{"id": 1, "title": "미쉐린 별, 받으면 좋을까요?", "subtitle": "미쉐린 가이드 ⸺ 타이어 회사가 만든 맛집 리스트", "source": "https://www.chosun.com/national/weekend/2024/03/02/LI55TYNXPNGNLFA2BQCPV4R7NA/", "audio": true, "audioLabel": "본문 낭독", "content": [{"isHeading": true, "text": "미쉐린 가이드가 뭐예요?", "trans": "What Is the Michelin Guide?"}, {"text": "미쉐린은 프랑스 타이어 회사예요. 이 회사는 100년쯤 전에 작은 책을 만들었어요. 그 책에는 길, 주유소, 식당이 있었어요. 운전하는 사람들을 위한 책이었어요.", "trans": "Michelin is a French tyre company. About a hundred years ago the company made a small book. In it were roads, petrol stations and restaurants. It was a book for people who drive."}, {"text": "지금 이 책은 아주 유명한 맛집 책이에요. 이름은 '미쉐린 가이드'예요. 미쉐린 가이드는 좋은 식당에 별을 줘요. 별은 한 개, 두 개, 세 개예요. 별 세 개가 제일 좋아요. 2016년부터 서울 식당도 이 책에 나와요.", "trans": "Today that book is a very famous restaurant guide. Its name is the Michelin Guide. The guide gives stars to good restaurants. There are one, two and three stars. Three stars is the best. Since 2016, restaurants in Seoul have appeared in it too."}, {"isHeading": true, "text": "별을 받으면 손님이 많이 와요", "trans": "Stars Bring in Customers"}, {"text": "별을 받으면 손님이 아주 많이 와요. 그래서 요리사들은 모두 별을 받고 싶어 해요.", "trans": "When a restaurant gets a star, a great many customers come. So every chef wants one."}, {"text": "미국 덴버에 '브루토'라는 식당이 있어요. 이 식당은 별을 하나 받았어요. 전에는 하루에 예약이 스무 개나 서른 개였어요. 그런데 별을 받은 날에는 예약이 259개였어요.", "trans": "In Denver, in the United States, there is a restaurant called Bruto. It received one star. Before that, it had twenty or thirty reservations a day. But on the day it got the star, it had 259."}, {"text": "서울에도 비슷한 이야기가 있어요. '주옥'이라는 한식당이에요. 전에는 외국 손님이 거의 없었어요. 별을 받은 후에 외국 손님이 열 명 중에 세 명이 됐어요.", "trans": "There is a similar story in Seoul. A Korean restaurant called Jooock. Before, it had almost no foreign customers. After it got a star, three out of every ten customers were from abroad."}, {"text": "별은 식당에만 좋지 않아요. 호텔도 좋아요. 별이 있는 식당에 가고 싶은 외국 사람들은 그 호텔에서 자요. 그래서 호텔도 돈을 벌어요.", "trans": "Stars are not only good for the restaurant. They are good for the hotel too. People from abroad who want to eat at a starred restaurant sleep in that hotel. So the hotel earns money as well."}, {"isHeading": true, "text": "그런데 문을 닫는 식당도 있어요", "trans": "But Some Restaurants Close Down"}, {"text": "별을 받으면 항상 좋을까요? 아니에요. 별을 받고 문을 닫는 식당도 많아요.", "trans": "Is a star always a good thing? No. Many restaurants close down after getting one."}, {"text": "서울에 '가온'과 '모수'가 있었어요. 두 식당은 별을 세 개 받았어요. 한국에서 제일 좋은 식당이었어요. 그런데 두 식당 다 문을 닫았어요. 이유는 같아요. 돈을 벌지 못했어요.", "trans": "In Seoul there were Gaon and Mosu. Both had three stars. They were the best restaurants in Korea. But both closed down. The reason was the same. They could not make money."}, {"text": "왜 돈을 못 벌까요? 별을 계속 받고 싶어요. 그러면 돈을 많이 써야 해요. 비싼 재료를 사야 해요. 그릇도 의자도 좋은 것으로 사야 해요. 그리고 손님을 조금만 받아요. 한 사람 한 사람에게 잘해야 해요. 그래서 식당에 손님보다 일하는 사람이 더 많아요.", "trans": "Why can't they make money? They want to keep the star. Then they have to spend a lot. They have to buy expensive ingredients. The dishes and the chairs have to be good ones too. And they take only a few customers. They have to look after each person well. So there are more staff in the restaurant than customers."}, {"text": "유럽에도 같은 문제가 있어요. 별을 두 개나 세 개 받은 식당이 스물여섯 개 있어요. 그중에서 반 정도가 돈을 못 벌어요.", "trans": "Europe has the same problem. There are twenty-six restaurants with two or three stars. About half of them do not make money."}, {"isHeading": true, "text": "별을 받으면 힘들어요.", "trans": "Having a Star Is Hard"}, {"text": "별을 받은 요리사는 마음이 힘들어요. '별을 꼭 지켜야 해.' 이렇게 생각해요.", "trans": "Chefs with stars have a hard time. 'I must protect this star,' they think."}, {"text": "2003년에 프랑스에 베르나르 루아조라는 요리사가 있었어요. 사람들이 말했어요. \"루아조의 식당은 별이 세 개에서 두 개가 될 거예요.\" 루아조는 아주 걱정했어요. 그리고 스스로 세상을 떠났어요. 나흘 후에 새 책이 나왔어요. 그의 식당은 별이 세 개 그대로였어요.", "trans": "In 2003 there was a French chef called Bernard Loiseau. People were saying, 'Loiseau's restaurant will go from three stars to two.' Loiseau worried a great deal. And he took his own life. Four days later the new guide came out. His restaurant still had three stars."}, {"text": "그래서 어떤 요리사들은 별을 받고 싶지 않아 해요. 2018년에 프랑스 요리사 세바스티앵 브라는 별을 거부했어요. 그는 말했어요. \"이제 걱정하지 않고 새 요리를 만들 수 있어요. 마음이 편해요.\"", "trans": "So some chefs do not want a star. In 2018 the French chef Sébastien Bras refused his. He said, 'Now I can make new dishes without worrying. I feel at ease.'"}, {"text": "미쉐린 가이드는 이렇게 대답했어요. \"별은 우리 생각이에요. 다르게 생각해도 괜찮아요. 하지만 별은 물건이 아니에요. 그래서 돌려줄 수 없어요.\"", "trans": "The Michelin Guide answered like this: 'The star is our opinion. It is fine to think differently. But a star is not an object. So you cannot give it back.'"}]}];
        const VOCAB_READING_DATA = [{"term": "미쉐린 가이드", "mainDef": "The Michelin Guide — a book that picks good restaurants and gives them stars. 미쉐린 is how the French name Michelin is written in Korean, so it is hard to recognise at first.", "variants": ["미쉐린 가이드", "미쉐린"], "subDefs": [], "examples": [{"kor": "미쉐린 가이드에 우리 동네 식당이 나왔어요.", "eng": "A restaurant in my neighbourhood was in the Michelin Guide."}]}, {"term": "타이어", "mainDef": "The round rubber part of a car wheel.", "variants": ["타이어"], "subDefs": [], "examples": [{"kor": "아버지가 자동차 타이어를 바꿨어요.", "eng": "My father changed the car tyres."}]}, {"term": "회사", "mainDef": "A company; a place where people work.", "variants": ["회사"], "subDefs": [], "examples": [{"kor": "우리 언니는 작은 회사에 다녀요.", "eng": "My older sister works at a small company."}]}, {"term": "100년쯤 전에", "mainDef": "About a hundred years ago.", "variants": ["100년쯤 전에"], "subDefs": [{"subTerm": "-쯤", "subDef": "about, roughly. It goes right after a number: 세 시쯤, 만 원쯤, 100년쯤."}, {"subTerm": "전에", "subDef": "before, ago. After a length of time it means \"~ ago\": 이틀 전에 = two days ago."}], "examples": [{"kor": "이 집은 50년쯤 전에 지었어요.", "eng": "This house was built about fifty years ago."}]}, {"term": "주유소", "mainDef": "A petrol station.", "variants": ["주유소"], "subDefs": [], "examples": [{"kor": "주유소에서 기름을 넣고 커피도 샀어요.", "eng": "I got petrol at the station and bought a coffee too."}]}, {"term": "운전하는 사람들을 위한 책", "mainDef": "\"A book for people who drive.\"", "variants": ["운전하는 사람들을 위한 책"], "subDefs": [{"subTerm": "-는 as in 운전하는", "subDef": "put after a verb, it lets the verb describe the noun that comes next: 운전하는 사람 = a person who drives."}, {"subTerm": "-들", "subDef": "makes a person word plural: 사람들, 요리사들, 손님들."}, {"subTerm": "-을/를 위한", "subDef": "\"for ~\", showing who something is made for. 위한 comes before a noun; 위해서 comes before a verb."}], "examples": [{"kor": "이 책은 아이들을 위한 책이에요.", "eng": "This is a book for children."}]}, {"term": "운전하다", "mainDef": "To drive a car.", "variants": [], "subDefs": [], "examples": [{"kor": "저는 아직 운전할 수 없어요.", "eng": "I still can't drive."}]}, {"term": "유명한 맛집 책", "mainDef": "\"A famous restaurant guide.\"", "variants": ["유명한 맛집 책"], "subDefs": [{"subTerm": "-ㄴ/은 as in 유명한", "subDef": "put after a describing word, it lets that word describe the noun after it: 유명한 사람, 좋은 책, 비싼 옷."}], "examples": [{"kor": "여기는 유명한 커피 가게예요.", "eng": "This is a famous coffee shop."}]}, {"term": "유명하다", "mainDef": "To be famous, known by many people.", "variants": [], "subDefs": [], "examples": [{"kor": "그 가수는 한국에서 아주 유명해요.", "eng": "That singer is very famous in Korea."}]}, {"term": "맛집", "mainDef": "A place known for good food. 맛 (taste) + 집 (house). A casual everyday word — Koreans use it far more often than 좋은 식당.", "variants": ["맛집"], "subDefs": [], "examples": [{"kor": "친구가 학교 앞 맛집을 알려 줬어요.", "eng": "A friend told me about a good place to eat near school."}]}, {"term": "별을 주다", "mainDef": "To give a star ⸺ 주다 is \"to give\"; here the guide is the one deciding, so the restaurant 받다 (receives) and the guide 주다 (gives).", "variants": ["별을 줘요"], "subDefs": [], "examples": [{"kor": "선생님이 아이들에게 별을 줘요.", "eng": "The teacher gives the children stars."}]}, {"term": "세 개", "mainDef": "Three (things). 개 is the counting word for most objects, and it takes the Korean-style numbers: 한 개, 두 개, 세 개.", "variants": ["세 개", "한 개", "두 개"], "subDefs": [{"subTerm": "개", "subDef": "counter for things. 사과 세 개, 의자 네 개, 별 다섯 개."}], "examples": [{"kor": "빵을 두 개 샀어요.", "eng": "I bought two loaves of bread."}]}, {"term": "제일", "mainDef": "Most, best of all. It goes right before the describing word: 제일 좋아요, 제일 커요.", "variants": ["제일"], "subDefs": [], "examples": [{"kor": "저는 여름이 제일 좋아요.", "eng": "I like summer best."}]}, {"term": "2016년부터", "mainDef": "From 2016 (onwards).", "variants": ["2016년부터"], "subDefs": [{"subTerm": "-부터", "subDef": "\"from ~\", marking the point something starts. Its partner is -까지 (\"until\"): 아홉 시부터 여섯 시까지."}], "examples": [{"kor": "저는 작년부터 한국어를 배웠어요.", "eng": "I have been learning Korean since last year."}]}, {"term": "나오다", "mainDef": "To come out ⸺ with a book, a list or a newspaper it means \"to appear in it, to be listed there\".", "variants": ["나와요", "나왔어요"], "subDefs": [], "examples": [{"kor": "제 이름이 신문에 나왔어요.", "eng": "My name appeared in the newspaper."}]}, {"term": "별을 받다", "mainDef": "To be given a star by the Michelin Guide.", "variants": ["별을 받으면", "별을 받은"], "subDefs": [], "examples": [{"kor": "우리 식당도 별을 받고 싶어요.", "eng": "Our restaurant wants a star too."}]}, {"term": "손님", "mainDef": "A customer, or a guest at your home. Same word for both.", "variants": ["손님"], "subDefs": [], "examples": [{"kor": "오늘은 손님이 많이 왔어요.", "eng": "A lot of customers came today."}]}, {"term": "요리사", "mainDef": "A person whose job is cooking. 셰프 is also used, especially for restaurant chefs.", "variants": ["요리사"], "subDefs": [], "examples": [{"kor": "우리 이모는 호텔 요리사예요.", "eng": "My aunt is a hotel chef."}]}, {"term": "별을 받고 싶어 해요", "mainDef": "\"They want to get a star.\" ⸺ Korean makes you choose: for your own wish you say -고 싶다, but for someone else's wish you must say -고 싶어 하다.", "variants": ["별을 받고 싶어 해요"], "subDefs": [{"subTerm": "-고 싶어 하다", "subDef": "\"(someone else) wants to ~\". Use -고 싶다 for yourself: 저는 가고 싶어요 / 친구는 가고 싶어 해요."}], "examples": [{"kor": "동생은 강아지를 키우고 싶어 해요.", "eng": "My little brother wants to raise a puppy."}]}, {"term": "'브루토'라는 식당", "mainDef": "\"A restaurant called Bruto.\"", "variants": ["'브루토'라는 식당"], "subDefs": [{"subTerm": "-라는/이라는", "subDef": "\"called ~\", used to give a name to the noun that follows. After a vowel -라는, after a consonant -이라는: 주옥이라는 식당."}], "examples": [{"kor": "'김밥천국'이라는 가게에서 먹었어요.", "eng": "I ate at a shop called Gimbap Cheonguk."}]}, {"term": "전에", "mainDef": "Before, in the past.", "variants": ["전에는"], "subDefs": [], "examples": [{"kor": "전에는 매운 음식을 못 먹었어요.", "eng": "I couldn't eat spicy food before."}]}, {"term": "하루에", "mainDef": "A day, per day.", "variants": ["하루에"], "subDefs": [{"subTerm": "하루", "subDef": "one day. Korean counts days with its own words: 하루, 이틀, 사흘, 나흘."}, {"subTerm": "-에 as in 하루에", "subDef": "here -에 does not mean a place or a time point. After a length of time it means \"per ~\": 일주일에 한 번 = once a week."}], "examples": [{"kor": "저는 하루에 커피를 두 잔 마셔요.", "eng": "I drink two cups of coffee a day."}]}, {"term": "예약", "mainDef": "A booking — for a table, a room or a ticket.", "variants": ["예약"], "subDefs": [], "examples": [{"kor": "식당에 예약을 하고 갔어요.", "eng": "I booked a table before going."}]}, {"term": "스무 개나 서른 개", "mainDef": "\"Twenty or thirty.\"", "variants": ["스무 개나 서른 개"], "subDefs": [{"subTerm": "스무", "subDef": "twenty, in the Korean-style numbers. Before a counter 스물 becomes 스무: 스무 개, 스무 명, 스무 살."}, {"subTerm": "서른", "subDef": "thirty, in the Korean-style numbers."}, {"subTerm": "-나 as in 스무 개나", "subDef": "\"or\", putting two rough amounts side by side when you are not sure which: 하루나 이틀."}], "examples": [{"kor": "사람이 열 명이나 스무 명 와요.", "eng": "Ten or twenty people come."}]}, {"term": "그런데", "mainDef": "But, however — used to turn the story the other way.", "variants": ["그런데"], "subDefs": [], "examples": [{"kor": "표를 샀어요. 그런데 갈 수 없었어요.", "eng": "I bought a ticket. But I couldn't go."}]}, {"term": "별을 받은 날", "mainDef": "\"The day it got the star.\"", "variants": ["별을 받은 날"], "subDefs": [{"subTerm": "-ㄴ/은 as in 받은", "subDef": "put after a verb, it lets the verb describe the noun after it — but about the past: 받은 날 = the day (it) received."}, {"subTerm": "날", "subDef": "day. 날 is a day as an event; 하루 is a day as a length of time."}], "examples": [{"kor": "시험이 끝난 날에 친구를 만났어요.", "eng": "I met a friend on the day the exams finished."}]}, {"term": "비슷한 이야기", "mainDef": "\"A similar story.\"", "variants": ["비슷한 이야기"], "subDefs": [], "examples": [{"kor": "제 친구도 비슷한 이야기를 했어요.", "eng": "My friend told a similar story."}]}, {"term": "비슷하다", "mainDef": "To be similar — close, but not exactly the same. If they are exactly the same, use 같다.", "variants": [], "subDefs": [], "examples": [{"kor": "두 사람 목소리가 비슷해요.", "eng": "Their voices sound similar."}]}, {"term": "한식당", "mainDef": "A Korean restaurant.", "variants": ["한식당"], "subDefs": [{"subTerm": "한식", "subDef": "Korean food. 한 (Korea) + 식 (food). The same 식 is in 중식 (Chinese food) and 일식 (Japanese food)."}], "examples": [{"kor": "외국에서 한식당을 찾았어요.", "eng": "I looked for a Korean restaurant abroad."}]}, {"term": "외국 손님", "mainDef": "\"Customers from abroad.\"", "variants": ["외국 손님"], "subDefs": [], "examples": [{"kor": "우리 호텔에는 외국 손님이 많아요.", "eng": "Our hotel has many guests from abroad."}]}, {"term": "외국", "mainDef": "A foreign country, abroad. 외국 사람 = a foreigner; 외국어 = a foreign language.", "variants": ["외국 사람들"], "subDefs": [], "examples": [{"kor": "저는 외국에서 살고 싶어요.", "eng": "I want to live abroad."}]}, {"term": "거의 없다", "mainDef": "To be almost none, to be hardly any. 거의 on its own means \"almost\", but Koreans use 거의 없다 as one set phrase.", "variants": ["거의 없었어요"], "subDefs": [{"subTerm": "거의", "subDef": "almost, nearly: 거의 다 왔어요 = we are almost there."}], "examples": [{"kor": "주말에는 시간이 거의 없어요.", "eng": "I have hardly any time at weekends."}]}, {"term": "별을 받은 후에", "mainDef": "\"After it got the star.\"", "variants": ["별을 받은 후에"], "subDefs": [{"subTerm": "-ㄴ/은 후에", "subDef": "\"after ~ing\". The opposite is -기 전에: 먹기 전에 / 먹은 후에."}], "examples": [{"kor": "밥을 먹은 후에 약을 드세요.", "eng": "Please take the medicine after you eat."}]}, {"term": "열 명 중에 세 명", "mainDef": "\"Three out of ten people.\"", "variants": ["열 명 중에 세 명"], "subDefs": [{"subTerm": "명", "subDef": "counter for people: 한 명, 두 명, 세 명."}, {"subTerm": "-중에", "subDef": "\"among ~, out of ~\", used to pick some from a whole group."}], "examples": [{"kor": "학생 스무 명 중에 다섯 명이 왔어요.", "eng": "Five out of twenty students came."}]}, {"term": "식당에만", "mainDef": "\"Only for the restaurant.\"", "variants": ["식당에만"], "subDefs": [{"subTerm": "-만", "subDef": "only, just. It pushes out everything else: 물만 마셨어요 = I only drank water."}], "examples": [{"kor": "그 이야기는 저에게만 해 주세요.", "eng": "Please tell that story only to me."}]}, {"term": "좋지 않아요", "mainDef": "\"It is not good.\" ⸺ Korean has two ways to say no: the short 안 좋아요 and this longer -지 않다, which sounds a little more careful and is more common in writing.", "variants": ["좋지 않아요"], "subDefs": [{"subTerm": "-지 않다", "subDef": "the long negative. 안 + verb is the short one: 안 가요 = 가지 않아요."}], "examples": [{"kor": "오늘은 날씨가 좋지 않아요.", "eng": "The weather is not good today."}]}, {"term": "호텔도", "mainDef": "\"The hotel too.\"", "variants": ["호텔도"], "subDefs": [{"subTerm": "-도", "subDef": "also, too. It replaces 은/는 and 이/가, never sits next to them: 저는 → 저도."}], "examples": [{"kor": "저도 그 영화를 봤어요.", "eng": "I saw that film too."}]}, {"term": "별이 있는 식당", "mainDef": "\"A restaurant that has a star.\"", "variants": ["별이 있는 식당"], "subDefs": [{"subTerm": "-는 as in 있는", "subDef": "있다 and 없다 always take -는, never -ㄴ/은: 있는 사람, 없는 날."}], "examples": [{"kor": "창문이 있는 방을 주세요.", "eng": "Please give me a room that has a window."}]}, {"term": "가고 싶은 외국 사람들", "mainDef": "\"People from abroad who want to go.\"", "variants": ["가고 싶은 외국 사람들"], "subDefs": [{"subTerm": "-고 싶다", "subDef": "\"want to ~\", for your own wish or when asking someone about theirs."}, {"subTerm": "-ㄴ/은 as in 싶은", "subDef": "싶다 behaves like a describing word, so it takes -ㄴ/은 to describe the next noun: 가고 싶은 나라."}], "examples": [{"kor": "먹고 싶은 음식을 말해 주세요.", "eng": "Tell me the food you want to eat."}]}, {"term": "돈을 벌다", "mainDef": "To earn money ⸺ Korean uses 벌다 for earning, never 만들다. 돈을 만들다 would mean printing the notes yourself.", "variants": ["돈을 벌어요", "돈을 벌지"], "subDefs": [], "examples": [{"kor": "저는 주말에 일해서 돈을 벌어요.", "eng": "I earn money by working at weekends."}]}, {"term": "문을 닫는 식당", "mainDef": "\"Restaurants that close down.\"", "variants": ["문을 닫는 식당"], "subDefs": [], "examples": [{"kor": "문을 닫는 가게가 늘고 있어요.", "eng": "The number of shops closing down is growing."}]}, {"term": "문을 닫다", "mainDef": "For a shop or a business to shut for good ⸺ said of a real door it just means \"to shut the door\", but with a shop it means the business is over.", "variants": ["문을 닫았어요"], "subDefs": [], "examples": [{"kor": "그 카페는 지난달에 문을 닫았어요.", "eng": "That café closed down last month."}]}, {"term": "항상", "mainDef": "Always, every time.", "variants": ["항상"], "subDefs": [], "examples": [{"kor": "그 사람은 항상 웃어요.", "eng": "That person always smiles."}]}, {"term": "좋을까요?", "mainDef": "\"Would it be good?\" ⸺ here the writer is not really asking anyone. He asks so that the reader will think, and then answers himself on the next line.", "variants": ["좋을까요"], "subDefs": [{"subTerm": "-ㄹ/을까요?", "subDef": "\"shall we ~? / I wonder if ~\". It asks about something not decided yet."}], "examples": [{"kor": "이 색이 더 좋을까요?", "eng": "Would this colour be better?"}]}, {"term": "별을 받고", "mainDef": "\"Gets a star, and then …\"", "variants": ["별을 받고"], "subDefs": [{"subTerm": "-고 as in 받고", "subDef": "joins two actions in order: first this, then that. Do not confuse it with -고 싶다."}], "examples": [{"kor": "손을 씻고 밥을 먹어요.", "eng": "I wash my hands and then eat."}]}, {"term": "'가온'과 '모수'", "mainDef": "\"Gaon and Mosu\" — the names of two restaurants.", "variants": ["'가온'과 '모수'"], "subDefs": [{"subTerm": "-과/와", "subDef": "\"and\", joining two nouns. After a consonant -과, after a vowel -와: 빵과 우유 / 우유와 빵. In speech people say -하고 instead."}], "examples": [{"kor": "빵과 우유를 샀어요.", "eng": "I bought bread and milk."}]}, {"term": "두 식당", "mainDef": "\"The two restaurants.\" 두 is the Korean-style number two used before a counter or a noun: 두 개, 두 명, 두 식당.", "variants": ["두 식당"], "subDefs": [], "examples": [{"kor": "두 학생이 같이 왔어요.", "eng": "The two students came together."}]}, {"term": "한국에서 제일 좋은 식당", "mainDef": "\"The best restaurant in Korea.\"", "variants": ["한국에서 제일 좋은 식당"], "subDefs": [{"subTerm": "-에서 as in 한국에서", "subDef": "marks the group or place you are choosing from when you say \"the most ~\": 반에서 제일 커요."}], "examples": [{"kor": "여기가 동네에서 제일 싼 가게예요.", "eng": "This is the cheapest shop in the neighbourhood."}]}, {"term": "다", "mainDef": "All, both, every one ⸺ 다 also means \"finished\" (다 했어요 = it's all done), so read it from the sentence.", "variants": ["두 식당 다"], "subDefs": [], "examples": [{"kor": "친구들이 다 왔어요.", "eng": "All my friends came."}]}, {"term": "이유", "mainDef": "A reason, the why of something.", "variants": ["이유"], "subDefs": [], "examples": [{"kor": "늦은 이유를 말해 주세요.", "eng": "Please tell me why you were late."}]}, {"term": "같다", "mainDef": "To be the same. 비슷하다 is \"similar\"; 같다 is \"the same\".", "variants": ["같아요"], "subDefs": [], "examples": [{"kor": "제 가방이 언니 가방과 같아요.", "eng": "My bag is the same as my sister's."}]}, {"term": "돈을 벌지 못했어요", "mainDef": "\"They could not earn money.\" ⸺ -지 못하다 is not the same as -지 않다: 않다 means they did not, 못하다 means they wanted to but could not.", "variants": ["돈을 벌지 못했어요"], "subDefs": [{"subTerm": "-지 못하다", "subDef": "cannot, could not. The short form is 못 + verb: 못 갔어요 = 가지 못했어요."}], "examples": [{"kor": "표가 없어서 영화를 보지 못했어요.", "eng": "I couldn't see the film because there were no tickets."}]}, {"term": "못 벌까요?", "mainDef": "\"Why can't they earn?\"", "variants": ["못 벌까요"], "subDefs": [{"subTerm": "못", "subDef": "cannot. It goes right before the verb: 못 자요, 못 먹어요. With a 하다 verb it splits the word: 공부 못 해요."}], "examples": [{"kor": "왜 못 왔어요?", "eng": "Why couldn't you come?"}]}, {"term": "계속", "mainDef": "Continuously, keep on ⸺ with a verb it usually means \"keep doing it\", not \"nonstop right this second\".", "variants": ["계속"], "subDefs": [], "examples": [{"kor": "비가 계속 와요.", "eng": "It keeps raining."}]}, {"term": "그러면", "mainDef": "\"Then, if so\" — it picks up what was just said and shows what follows from it. In speech people shorten it to 그럼.", "variants": ["그러면"], "subDefs": [], "examples": [{"kor": "지금 출발해요. 그러면 늦지 않아요.", "eng": "Leave now. Then you won't be late."}]}, {"term": "쓰다", "mainDef": "To use ⸺ with 돈 or 시간 it means \"to spend\". 쓰다 also means \"to write\" and \"to wear (a hat)\", so read it from the sentence.", "variants": ["써야"], "subDefs": [], "examples": [{"kor": "책을 사는 데 돈을 많이 썼어요.", "eng": "I spent a lot of money on books."}]}, {"term": "비싼 재료", "mainDef": "\"Expensive ingredients.\"", "variants": ["비싼 재료"], "subDefs": [{"subTerm": "비싸다", "subDef": "to be expensive. The opposite is 싸다 (cheap) — the two look alike, so learners often mix them up."}], "examples": [{"kor": "비싼 옷은 안 샀어요.", "eng": "I didn't buy the expensive clothes."}]}, {"term": "재료", "mainDef": "The things you use to make something — food, or anything else you build.", "variants": ["재료"], "subDefs": [], "examples": [{"kor": "김밥 재료를 사러 갔어요.", "eng": "I went to buy ingredients for gimbap."}]}, {"term": "사야 해요", "mainDef": "\"They have to buy.\"", "variants": ["사야 해요"], "subDefs": [{"subTerm": "-아야/어야 하다", "subDef": "\"must ~, have to ~\". There is no other choice. 되다 can replace 하다 with the same meaning: 사야 돼요."}], "examples": [{"kor": "약을 먹어야 해요.", "eng": "I have to take my medicine."}]}, {"term": "그릇", "mainDef": "A bowl or a dish that you put food in.", "variants": ["그릇"], "subDefs": [], "examples": [{"kor": "그릇에 국을 담았어요.", "eng": "I served the soup in a bowl."}]}, {"term": "좋은 것으로", "mainDef": "\"With good ones.\" ⸺ 것 stands in for a noun you already said, so you do not have to repeat 그릇 and 의자.", "variants": ["좋은 것으로"], "subDefs": [{"subTerm": "것", "subDef": "thing, one. In speech it becomes 거: 좋은 거."}, {"subTerm": "-로/으로", "subDef": "here it marks what you choose or change into. After a vowel or ㄹ use -로, otherwise -으로."}], "examples": [{"kor": "작은 것으로 주세요.", "eng": "Please give me the small one."}]}, {"term": "손님을 받다", "mainDef": "To take customers ⸺ 받다 is \"to receive\"; with 손님 it means a shop lets that many people in.", "variants": ["손님을 조금만 받아요"], "subDefs": [], "examples": [{"kor": "이 식당은 밤에 손님을 안 받아요.", "eng": "This restaurant doesn't take customers at night."}]}, {"term": "조금만", "mainDef": "\"Only a few, just a little.\"", "variants": ["조금만"], "subDefs": [{"subTerm": "조금", "subDef": "a little, a few. In speech it is often shortened to 좀."}], "examples": [{"kor": "소금을 조금만 넣어 주세요.", "eng": "Please add just a little salt."}]}, {"term": "한 사람 한 사람에게", "mainDef": "\"To each and every person.\" Saying a counting word twice is how Korean makes \"one by one\": 하나하나, 한 개 한 개.", "variants": ["한 사람 한 사람에게"], "subDefs": [{"subTerm": "-에게", "subDef": "\"to (a person)\". In speech people say -한테 instead. For things you use -에: 친구에게 / 회사에."}], "examples": [{"kor": "선생님이 학생 한 사람 한 사람에게 물어봤어요.", "eng": "The teacher asked each student one by one."}]}, {"term": "잘하다", "mainDef": "To do something well ⸺ with a person as the object it means \"to treat someone well, to look after them\".", "variants": ["잘해야"], "subDefs": [], "examples": [{"kor": "부모님에게 잘해야 해요.", "eng": "You should be good to your parents."}]}, {"term": "손님보다", "mainDef": "\"Than the customers.\"", "variants": ["손님보다"], "subDefs": [{"subTerm": "-보다", "subDef": "\"than ~\", marking what you compare with. It goes on the thing you compare against, not the winner."}, {"subTerm": "더", "subDef": "more. It usually turns up in the second half: A보다 B가 더 좋아요."}], "examples": [{"kor": "오늘은 어제보다 더 추워요.", "eng": "Today is colder than yesterday."}]}, {"term": "일하는 사람", "mainDef": "\"The people working\" — here it means the staff.", "variants": ["일하는 사람"], "subDefs": [], "examples": [{"kor": "이 가게에는 일하는 사람이 두 명이에요.", "eng": "There are two people working in this shop."}]}, {"term": "유럽", "mainDef": "Europe.", "variants": ["유럽"], "subDefs": [], "examples": [{"kor": "저는 유럽에 한 번 가 봤어요.", "eng": "I have been to Europe once."}]}, {"term": "같은 문제", "mainDef": "\"The same problem.\"", "variants": ["같은 문제"], "subDefs": [], "examples": [{"kor": "저도 같은 문제가 있어요.", "eng": "I have the same problem too."}]}, {"term": "문제", "mainDef": "A problem, or a question on a test. Same word for both.", "variants": ["문제"], "subDefs": [], "examples": [{"kor": "이 문제는 너무 어려워요.", "eng": "This question is too hard."}]}, {"term": "그중에서", "mainDef": "\"Out of those, among them.\" It points back to the group you just named.", "variants": ["그중에서"], "subDefs": [], "examples": [{"kor": "책을 다섯 권 샀어요. 그중에서 두 권만 읽었어요.", "eng": "I bought five books. Out of those I only read two."}]}, {"term": "반 정도", "mainDef": "About half.", "variants": ["반 정도"], "subDefs": [{"subTerm": "반", "subDef": "half: 반 시간, 한 시 반."}, {"subTerm": "정도", "subDef": "about, roughly. It comes after the amount: 열 명 정도, 삼십 분 정도."}], "examples": [{"kor": "사과를 반 정도 먹었어요.", "eng": "I ate about half the apple."}]}, {"term": "힘들다", "mainDef": "To be hard, to be tough — about work, or about how you feel.", "variants": ["힘들어요"], "subDefs": [], "examples": [{"kor": "오늘 일이 너무 힘들었어요.", "eng": "Work was really hard today."}]}, {"term": "마음이 힘들다", "mainDef": "To have a hard time inside ⸺ 힘들다 on its own is usually about the body being tired; with 마음 it is about worry and stress, not muscles.", "variants": ["마음이 힘들어요"], "subDefs": [], "examples": [{"kor": "친구와 싸워서 마음이 힘들어요.", "eng": "I had a fight with my friend, so I feel low."}]}, {"term": "꼭", "mainDef": "Without fail, for sure. It makes a promise or an order stronger: 꼭 오세요 = do come, really.", "variants": ["꼭"], "subDefs": [], "examples": [{"kor": "내일 꼭 전화해 주세요.", "eng": "Please be sure to call me tomorrow."}]}, {"term": "지키다", "mainDef": "To protect something so you do not lose it ⸺ with 약속 or 시간 it means \"to keep\" a promise or be on time.", "variants": ["지켜야"], "subDefs": [], "examples": [{"kor": "약속은 꼭 지켜야 해요.", "eng": "You must keep your promises."}]}, {"term": "이렇게", "mainDef": "Like this, in this way. Its partners are 그렇게 (like that) and 저렇게 (like that over there).", "variants": ["이렇게"], "subDefs": [], "examples": [{"kor": "이렇게 접으면 돼요.", "eng": "You just fold it like this."}]}, {"term": "생각하다", "mainDef": "To think.", "variants": ["생각해요"], "subDefs": [], "examples": [{"kor": "저는 이 영화가 제일 좋다고 생각해요.", "eng": "I think this film is the best."}]}, {"term": "세 개에서", "mainDef": "\"From three.\" ⸺ you already met -에서 as \"in a place\"; after a number it means the point something changes from, and the next word takes -(으)로 or -이/가 되다.", "variants": ["세 개에서"], "subDefs": [], "examples": [{"kor": "값이 만 원에서 이만 원이 됐어요.", "eng": "The price went from ten thousand won to twenty thousand."}]}, {"term": "두 개가 될 거예요", "mainDef": "\"It will become two.\"", "variants": ["두 개가 될 거예요"], "subDefs": [{"subTerm": "-이/가 되다", "subDef": "\"to become ~\". The thing you turn into takes 이/가, not 을/를: 의사가 됐어요."}, {"subTerm": "-ㄹ/을 거예요", "subDef": "\"will ~\". It is a guess or a plan, not a promise."}], "examples": [{"kor": "내일은 날씨가 좋을 거예요.", "eng": "The weather will be good tomorrow."}]}, {"term": "걱정하다", "mainDef": "To worry, to feel uneasy that something bad may happen.", "variants": ["걱정했어요", "걱정하지"], "subDefs": [], "examples": [{"kor": "시험 때문에 걱정했어요.", "eng": "I was worried about the exam."}]}, {"term": "스스로", "mainDef": "By oneself, of one's own will ⸺ not the same as 혼자. 혼자 just means nobody else was there; 스스로 means nobody told you to.", "variants": ["스스로"], "subDefs": [], "examples": [{"kor": "아이가 스스로 옷을 입었어요.", "eng": "The child got dressed by himself."}]}, {"term": "세상을 떠나다", "mainDef": "To pass away. Koreans use this gentle phrase instead of 죽다, which sounds too blunt about a person.", "variants": ["세상을 떠났어요"], "subDefs": [], "examples": [{"kor": "할머니는 작년에 세상을 떠나셨어요.", "eng": "My grandmother passed away last year."}]}, {"term": "나흘 후에", "mainDef": "\"Four days later.\"", "variants": ["나흘 후에"], "subDefs": [], "examples": [{"kor": "이틀 후에 다시 오세요.", "eng": "Please come again in two days."}]}, {"term": "나흘", "mainDef": "Four days. Korean counts short stretches of days with its own words: 하루, 이틀, 사흘, 나흘.", "variants": [], "subDefs": [], "examples": [{"kor": "나흘 동안 비가 왔어요.", "eng": "It rained for four days."}]}, {"term": "새 책", "mainDef": "\"The new book.\" ⸺ 새 is not 새로운 in shape: 새 never changes and must sit right in front of a noun (새 책, 새 옷), while 새로운 is the describing-word form.", "variants": ["새 책", "새 요리"], "subDefs": [], "examples": [{"kor": "새 신발을 샀어요.", "eng": "I bought new shoes."}]}, {"term": "그의 식당", "mainDef": "\"His restaurant.\"", "variants": ["그의 식당"], "subDefs": [{"subTerm": "-의", "subDef": "\"of, 's\", joining an owner to the thing owned. In speech it is usually dropped: 제 친구 (not 저의 친구)."}, {"subTerm": "그", "subDef": "he. 그 is written Korean; in speech people say the person's name or 그 사람."}], "examples": [{"kor": "그의 이름을 잊어버렸어요.", "eng": "I forgot his name."}]}, {"term": "그대로", "mainDef": "Just as it was, with nothing changed.", "variants": ["그대로"], "subDefs": [], "examples": [{"kor": "책을 읽고 그대로 두었어요.", "eng": "I read the book and left it just as it was."}]}, {"term": "어떤 요리사들", "mainDef": "\"Some chefs.\" ⸺ 어떤 usually means \"which, what kind of\" in a question, but in a statement like this it means \"some, certain\".", "variants": ["어떤 요리사들"], "subDefs": [], "examples": [{"kor": "어떤 사람들은 아침을 안 먹어요.", "eng": "Some people don't eat breakfast."}]}, {"term": "별을 받고 싶지 않아 해요", "mainDef": "\"They do not want to get a star.\" ⸺ to say someone else does NOT want something, the 않다 goes on 싶다, not on the main verb: 받고 싶지 않아 하다, never 안 받고 싶어 하다.", "variants": ["별을 받고 싶지 않아 해요"], "subDefs": [{"subTerm": "-고 싶지 않아 하다", "subDef": "the negative of -고 싶어 하다. For yourself you say -고 싶지 않다: 저는 가고 싶지 않아요."}], "examples": [{"kor": "동생은 학교에 가고 싶지 않아 해요.", "eng": "My little brother doesn't want to go to school."}]}, {"term": "거부하다", "mainDef": "To say no to something that is offered to you.", "variants": ["거부했어요"], "subDefs": [], "examples": [{"kor": "그 배우는 상을 거부했어요.", "eng": "That actor turned down the award."}]}, {"term": "이제", "mainDef": "Now, from now on ⸺ not the same as 지금. 지금 is simply \"at this moment\"; 이제 means things have changed and this is how it is from here.", "variants": ["이제"], "subDefs": [], "examples": [{"kor": "이제 담배를 안 피워요.", "eng": "I don't smoke any more."}]}, {"term": "걱정하지 않고", "mainDef": "\"Without worrying.\"", "variants": ["걱정하지 않고"], "subDefs": [{"subTerm": "-지 않고", "subDef": "\"without ~ing\". -지 않다 makes it negative and -고 joins it to the next action."}], "examples": [{"kor": "돈을 내지 않고 들어갔어요.", "eng": "I went in without paying."}]}, {"term": "요리", "mainDef": "A dish, or cooking. 요리를 하다 = to cook; 새 요리 = a new dish.", "variants": ["요리"], "subDefs": [], "examples": [{"kor": "오늘은 제가 요리를 할게요.", "eng": "I'll do the cooking today."}]}, {"term": "만들 수 있어요", "mainDef": "\"I can make (them).\"", "variants": ["만들 수 있어요"], "subDefs": [{"subTerm": "-ㄹ/을 수 있다", "subDef": "\"can ~\", about what is possible. The negative is -ㄹ/을 수 없다."}], "examples": [{"kor": "저는 김치를 만들 수 있어요.", "eng": "I can make kimchi."}]}, {"term": "마음이 편하다", "mainDef": "To feel at ease ⸺ 편하다 on its own is about a comfortable chair or an easy journey; with 마음 it is about having nothing on your mind.", "variants": ["마음이 편해요"], "subDefs": [], "examples": [{"kor": "숙제를 끝내니까 마음이 편해요.", "eng": "Now that the homework is done, I feel at ease."}]}, {"term": "대답하다", "mainDef": "To answer, to reply to what someone said.", "variants": ["대답했어요"], "subDefs": [], "examples": [{"kor": "선생님 질문에 대답했어요.", "eng": "I answered the teacher's question."}]}, {"term": "우리 생각", "mainDef": "\"Our opinion.\" ⸺ 생각 is \"a thought\"; here the guide means \"this is only our view\", so English says opinion, not thought.", "variants": ["우리 생각"], "subDefs": [{"subTerm": "우리", "subDef": "we, our. Koreans say 우리 where English says \"my\" for things shared with others: 우리 집, 우리 학교."}], "examples": [{"kor": "그건 제 생각이에요.", "eng": "That's just my opinion."}]}, {"term": "다르게", "mainDef": "Differently.", "variants": ["다르게"], "subDefs": [{"subTerm": "-게", "subDef": "turns a describing word into a \"how\" word: 크다 → 크게, 쉽다 → 쉽게, 다르다 → 다르게."}], "examples": [{"kor": "저는 다르게 생각해요.", "eng": "I think differently."}]}, {"term": "생각해도 괜찮아요", "mainDef": "\"It's fine to think (that way).\"", "variants": ["생각해도 괜찮아요"], "subDefs": [{"subTerm": "-아도/어도 괜찮다", "subDef": "\"it's fine even if ~, you may ~\". It gives permission. 되다 can replace 괜찮다: 앉아도 돼요."}], "examples": [{"kor": "여기 앉아도 괜찮아요?", "eng": "Is it all right if I sit here?"}]}, {"term": "물건이 아니에요", "mainDef": "\"It is not an object.\"", "variants": ["물건이 아니에요"], "subDefs": [{"subTerm": "-이/가 아니다", "subDef": "\"is not ~\". This is the negative of 이다, so the noun takes 이/가, not 을/를."}], "examples": [{"kor": "이건 제 가방이 아니에요.", "eng": "This is not my bag."}]}, {"term": "물건", "mainDef": "A thing, an object you can hold.", "variants": ["물건"], "subDefs": [], "examples": [{"kor": "가방에서 물건을 다 꺼냈어요.", "eng": "I took everything out of the bag."}]}, {"term": "돌려줄 수 없어요", "mainDef": "\"You cannot give it back.\"", "variants": ["돌려줄 수 없어요"], "subDefs": [{"subTerm": "-ㄹ/을 수 없다", "subDef": "\"cannot ~\". The opposite of -ㄹ/을 수 있다. It is about what is impossible, while 못 is more about you being unable."}], "examples": [{"kor": "지금은 갈 수 없어요.", "eng": "I can't go right now."}]}, {"term": "돌려주다", "mainDef": "To give something back to the person it belongs to.", "variants": [], "subDefs": [], "examples": [{"kor": "빌린 우산을 돌려줬어요.", "eng": "I gave back the umbrella I borrowed."}]}];

        function rerenderReadingBlocks() { const w = qs('#reading-blocks', viewRoot()); if (w) { w.innerHTML = readingBlocksHTML(); mountChart(); } }
        // ---------- 8a. 낭독 오디오 · playbar (자체 호스팅) ----------
        // 사용법
        //   1) 오디오 파일을 hub/assets/audio/ 에 올린다.  예) hub/assets/audio/a2plus-michelin-stars.m4a
        //   2) AUDIO_CFG.src 에 그 파일 URL을 적는다. 기존 자료와 같은 절대 URL 권장:
        //      'https://openkoreanlearninglab.github.io/hub/assets/audio/<파일명>'  (content/ 안이라면 '../assets/audio/<파일명>' 도 동작)
        //   3) 오디오를 붙일 읽기 자료의 READING_DATA 항목에 audio:true, audioLabel:"..." 를 넣는다.
        // 규칙
        //   · audio:true 인 읽기 자료에만 플레이어가 렌더된다(읽기 1↔2 전환 시 자동 마운트).
        //   · 라벨은 코드에 하드코딩하지 말고 READING_DATA[].audioLabel 로 넣는다(기본값 '오디오').

        //   · playbar는 직접 그린다(브라우저 기본 컨트롤 미사용) — 크롬·사파리·모바일에서 모양이 같다.
        //   · 배속은 초급 학습자용이라 1.00배를 넘지 않는다(AUDIO_CFG.rates). 건너뛰기 폭은 AUDIO_CFG.skip(초).
        //   · 안내문·버튼 라벨의 영문은 <span class="lk-en">…</span> 으로 넣는다(상단바 언어 설정이 한국어만이면 자동으로 숨는다).
        //   · 저작권이 있는 남의 음원은 자체 호스팅하지 않는다. 직접 만든 낭독·팟캐스트에만 쓴다.
        const AUDIO_CFG = { src: 'https://openkoreanlearninglab.github.io/hub/assets/audio/a2plus-michelin-stars.m4a', rates: [0.75, 0.8, 0.85, 0.9, 0.95, 1], skip: 2 };
        const audioState = { rate: 1, time: 0, playing: false, seeking: false, bound: false };

        function fmtTime(s) {
            if (!isFinite(s) || s < 0) return '--:--';
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
            const mm = h ? String(m).padStart(2, '0') : String(m);
            return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
        }
        function audioRateBtnsHTML() {
            return AUDIO_CFG.rates.map(function (r) {
                const on = Math.abs(audioState.rate - r) < 0.001 ? ' on' : '';
                return '<button type="button" data-action="audio-rate" data-rate="' + r + '" class="lk-ap-btn' + on + '">' + r.toFixed(2) + '×</button>';
            }).join('');
        }
        function audioRefreshRates() {
            const w = qs('#lk-ap-rates', viewRoot()); if (w) w.innerHTML = audioRateBtnsHTML();
        }
        function audioSetRate(rate) {
            const r = parseFloat(rate); if (!r) return;
            audioState.rate = r;
            if (audioEl) { try { audioEl.playbackRate = r; } catch (_) {} }
            audioRefreshRates();
        }
        function audioRefreshPlayBtn() {
            const b = qs('#lk-ap-play', viewRoot()); if (!b) return;
            b.innerHTML = svgIcon(audioState.playing ? 'pause' : 'play', '', { fill: 'currentColor' });
            b.setAttribute('aria-label', audioState.playing ? '일시정지' : '재생');
        }
        function audioRefreshProgress() {
            if (!audioEl) return;
            const root = viewRoot(); if (!root) return;
            const dur = audioEl.duration, cur = audioEl.currentTime;
            const pct = (isFinite(dur) && dur > 0) ? Math.min(100, Math.max(0, (cur / dur) * 100)) : 0;
            const fill = qs('#lk-ap-fill', root); if (fill) fill.style.width = pct + '%';
            const knob = qs('#lk-ap-knob', root); if (knob) knob.style.left = pct + '%';
            const c = qs('#lk-ap-cur', root); if (c) c.textContent = fmtTime(cur);
            const d = qs('#lk-ap-dur', root); if (d) d.textContent = fmtTime(dur);
            const bar = qs('#lk-ap-bar', root);
            if (bar && isFinite(dur) && dur > 0) {
                bar.setAttribute('aria-valuemax', Math.floor(dur));
                bar.setAttribute('aria-valuenow', Math.floor(cur));
                bar.setAttribute('aria-valuetext', fmtTime(cur) + ' / ' + fmtTime(dur));
            }
            try {
                const buf = qs('#lk-ap-buf', root);
                if (buf && audioEl.buffered.length && isFinite(dur) && dur > 0) {
                    buf.style.width = Math.min(100, (audioEl.buffered.end(audioEl.buffered.length - 1) / dur) * 100) + '%';
                }
            } catch (_) {}
        }
        function audioToggle() {
            if (!audioEl) return;
            if (audioEl.paused) { const p = audioEl.play(); if (p && p.catch) p.catch(function () {}); }
            else audioEl.pause();
        }
        function audioSkip(sec) {
            if (!audioEl || !isFinite(audioEl.duration)) return;
            audioEl.currentTime = Math.min(audioEl.duration, Math.max(0, audioEl.currentTime + sec));
            audioRefreshProgress();
        }
        function audioSeekToEvent(e) {
            const bar = qs('#lk-ap-bar', viewRoot());
            if (!bar || !audioEl || !isFinite(audioEl.duration) || audioEl.duration <= 0) return;
            const r = bar.getBoundingClientRect();
            const x = (e.clientX != null ? e.clientX : 0) - r.left;
            const ratio = Math.min(1, Math.max(0, x / (r.width || 1)));
            audioEl.currentTime = ratio * audioEl.duration;
            audioState.time = audioEl.currentTime;
            audioRefreshProgress();
        }
        function audioBindDrag() {
            if (audioState.bound) return;
            audioState.bound = true;
            const move = function (e) { if (audioState.seeking) { e.preventDefault(); audioSeekToEvent(e); } };
            const up = function () {
                if (!audioState.seeking) return;
                audioState.seeking = false;
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                document.removeEventListener('pointercancel', up);
            };
            document.addEventListener('pointerdown', function (e) {
                const bar = e.target.closest ? e.target.closest('#lk-ap-bar') : null;
                if (!bar || !audioEl) return;
                audioState.seeking = true;
                audioSeekToEvent(e);
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerup', up);
                document.addEventListener('pointercancel', up);
            });
        }
        function audioPlayerHTML(src) {
            const skip = AUDIO_CFG.skip;
            return '<div class="lk-ap">'

                +   '<div class="lk-ap-mid">'
                +     '<div id="lk-ap-bar" class="lk-ap-bar" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">'
                +       '<div class="lk-ap-track"><div id="lk-ap-buf" class="lk-ap-buf"></div><div id="lk-ap-fill" class="lk-ap-fill"></div><div id="lk-ap-knob" class="lk-ap-knob"></div></div>'

        function mountAudio() {
            const cr = currentReading();

            audioEl = qs('#lk-ap-el', mount);
            if (!audioEl) return;
            audioBindDrag();
            try { audioEl.playbackRate = audioState.rate; } catch (_) {}
            const restore = function () {
                if (audioState.time > 0 && isFinite(audioEl.duration)) {

        // ---------- 9. VOCAB ----------

        /* ===== Flash Card 모듈 (어휘 탭) — 20개 큐레이션 카드 + 미디어 ===== */

        const FC_IMG = FC_BASE+'images/', FC_VID = FC_BASE+'videos/', FC_AUD = FC_BASE+'audio/';
        const FC_CARDS = [
            /* ▣ 여기에 카드를 채우면 어휘 탭에 '플래시 카드' 토글이 자동으로 나타납니다.
                  비워 두면(=지금) 토글이 안 뜨고, 어휘 탭은 원본과 100% 동일합니다.

        function fcPlay(src){ try{ if(!fcAudio)fcAudio=new Audio(); if(fcAudio.src!==src)fcAudio.src=src; fcAudio.currentTime=0; const p=fcAudio.play(); if(p&&p.catch)p.catch(function(){}); }catch(_){} }
        function fcStop(){ try{ if(fcAudio)fcAudio.pause(); }catch(_){} }
        function fcBold(ko,hl){ let s=esc(ko); if(!hl)return s; const h=esc(hl),i=s.indexOf(h); if(i<0)return s; return s.slice(0,i)+'<strong class="hl">'+h+'</strong>'+s.slice(i+h.length); }
        function fcStart(list){ const base=(list&&list.length?list:FC_CARDS.map(function(_,i){return i;})).slice(); fc.queue=fc.shuffled?shuffleArr(base):base; fc.pos=0; fc.flipped=false; fc.showTrans=false; fc.done=false; fc.status={}; }
        function fcCur(){ return FC_CARDS[fc.queue[fc.pos]]; }
        function fcCount(k){ return Object.keys(fc.status).filter(function(x){return fc.status[x]===k;}).length; }
        function fcUnknown(){ return Object.keys(fc.status).filter(function(x){return fc.status[x]==='unknown';}).map(Number); }
        /* 이미지 프리로드: 다음·이전 카드 이미지를 미리 받아 전환 시 검정 화면 제거 */

        const FC_ICON = {

        function fcMediaHTML(c){ if(c.media.type==='video'){ const a=c.media.sound?'controls playsinline preload="metadata"':'autoplay muted loop playsinline preload="metadata"'; return '<video class="fc-video" src="'+esc(c.media.src)+'" '+a+'></video>'; } return '<img src="'+esc(c.media.src)+'" alt="'+esc(c.vocab)+'">'; }

        function fcCardHTML(){ const c=fcCur(); if(!c)return''; return '<div class="fc-card" data-action="fc-flip"><div class="fc-inner'+(fc.flipped?' flip':'')+'" id="fc-inner">'
            + '<div class="fc-face fc-front" id="fc-front">'+fcFrontHTML(c)+'</div><div class="fc-face fc-back" id="fc-back">'+fcBackHTML(c)+'</div></div></div>'; }
        function fcStatsHTML(){ return '<div class="fc-bar"><div class="fc-stats"><span class="k">알아요<span class="lk-en"> · Got it</span> <b id="fc-sk">'+fcCount('known')+'</b></span><span class="u">모르겠어요<span class="lk-en"> · Not yet</span> <b id="fc-su">'+fcCount('unknown')+'</b></span></div>'
            + '<div class="fc-order" role="group"><button type="button" class="fc-obtn'+(fc.shuffled?'':' on')+'" data-action="fc-order" data-sh="0">순서대로<span class="lk-en"> · In order</span></button><button type="button" class="fc-obtn'+(fc.shuffled?' on':'')+'" data-action="fc-order" data-sh="1">섞기<span class="lk-en"> · Shuffle</span></button></div></div>'; }
        function fcSummaryHTML(){ const k=fcCount('known'),u=fcCount('unknown'); return '<div class="fc-sum"><h3>한 바퀴 끝!<span class="lk-en"> · Round complete</span></h3>'
            + '<p class="line">알아요 <b style="color:#047857">'+k+'</b> · 모르겠어요 <b style="color:#b91c1c">'+u+'</b> / 전체 '+FC_CARDS.length+'</p>'
            + '<div class="acts">'+(u?'<button type="button" class="fc-sbtn pri" data-action="fc-again-u">모르는 카드만 다시 ('+u+'장, 섞어서)</button>':'')+'<button type="button" class="fc-sbtn" data-action="fc-again-all">전체 다시 하기 (섞어서)</button></div></div>'; }
        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';
            return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcCardHTML()
            + '<div class="fc-judge"><button type="button" class="fc-jbtn k" data-action="fc-know">알아요<span class="lk-en"> · Got it</span></button><button type="button" class="fc-jbtn u" data-action="fc-dont">모르겠어요<span class="lk-en"> · Not yet</span></button></div>'
            + '<div class="fc-ctrls"><button type="button" class="fc-ibtn" data-action="fc-prev" aria-label="이전 카드">'+FC_ICON.prev+'</button><button type="button" class="fc-fbtn" data-action="fc-flip">뒤집기<span class="lk-en"> · Flip</span></button><button type="button" class="fc-ibtn" data-action="fc-next" aria-label="다음 카드">'+FC_ICON.next+'</button></div>'
            + '<p class="fc-hint"><span class="lk-ko-only"><kbd>Space</kbd> 뒤집기 · <kbd>&larr;</kbd><kbd>&rarr;</kbd> 이전/다음 · <kbd>1</kbd> 알아요 · <kbd>2</kbd> 모르겠어요 · <kbd>S</kbd> 순서/섞기</span><span class="lk-en"><kbd>Space</kbd> Flip · <kbd>&larr;</kbd><kbd>&rarr;</kbd> Prev/Next · <kbd>1</kbd> Got it · <kbd>2</kbd> Not yet · <kbd>S</kbd> Order/Shuffle</span></p>'
            + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }
        function fcApplyFlip(){ const root=viewRoot(); if(!root)return; const el=qs('#fc-inner',root); if(el)el.classList.toggle('flip',fc.flipped); const tr=qs('#fc-trans',root); if(tr)tr.textContent=fc.showTrans?fcCur().en:''; const tb=qs('#fc-back [data-action="fc-trans"]',root); if(tb)tb.classList.toggle('on',fc.showTrans); }
        function fcRefreshStats(){ const root=viewRoot(); if(!root)return; const k=qs('#fc-sk',root),u=qs('#fc-su',root); if(k)k.textContent=fcCount('known'); if(u)u.textContent=fcCount('unknown'); }
        function fcRefreshDeck(){ const d=qs('#fc-deck',viewRoot()); if(d)d.outerHTML=fcDeckHTML(); else paint(); fcPreloadAround(); }
        function fcSetFlip(v){ fc.flipped=v; fcApplyFlip(); if(v)fcPlay(fcCur().audio); else fcStop(); }
        function fcGo(fn){ fcStop(); fc.flipped=false; fc.showTrans=false; fn(); if(fc.done)fcRefreshDeck(); else fcSync(); }
        function fcMark(kind){ fc.status[fc.queue[fc.pos]]=kind; fcRefreshStats(); fcGo(function(){ if(fc.pos+1>=fc.queue.length)fc.done=true; else fc.pos+=1; }); }
        function fcSetOrder(sh){ if(sh===fc.shuffled)return; fc.shuffled=sh; const m=fc.queue.slice(); fc.queue=sh?shuffleArr(m):m.slice().sort(function(a,b){return a-b;}); fcStop(); fc.pos=0; fc.flipped=false; fc.showTrans=false; fcRefreshDeck(); }


        // ---------- 9-b. 핵심 문법 (어휘 탭 하단 섹션) ----------
        function grammarSectionHTML() {
            if (typeof GRAMMAR_DATA === 'undefined' || !Array.isArray(GRAMMAR_DATA) || !GRAMMAR_DATA.length) return '';
            const cards = GRAMMAR_DATA.map((g) => {
                const ex = g.example ? `<div class="bg-gray-50 p-5 mt-auto border-l-2 border-transparent group-hover:border-gray-300 transition-all"><p class="text-[15px] text-[#1a1a1a] font-serif leading-snug">${esc(g.example)}</p>${g.exampleEng ? `<p class="lk-en text-[13px] text-gray-500 font-sans mt-2 pt-2 border-t border-gray-200">${esc(g.exampleEng)}</p>` : ''}</div>` : '';
                return `<div class="border border-gray-200 hover:border-gray-300 transition-colors p-6 flex flex-col group bg-white h-full"><h3 class="text-[22px] font-bold font-serif text-[#1a1a1a] mb-4 group-hover:text-black transition-colors">${esc(g.pattern)}</h3><div class="mb-6 flex-1"><p class="text-[17px] text-[#444] font-serif leading-relaxed">${esc(g.explanation)}</p>${g.explanationEng ? `<p class="lk-en text-sm text-gray-500 font-sans mt-2 leading-relaxed">${esc(g.explanationEng)}</p>` : ''}</div>${ex}</div>`;
            }).join('');
            return `<div class="mb-16"><div class="flex items-center gap-3 mb-8"><h3 class="text-xl font-bold font-serif text-black">핵심 문법</h3><div class="h-px flex-1 bg-gray-200"></div><span class="lk-en text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Key Grammar</span></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div></div>`;
        }
        function pwGrammarHTML() {
            if (typeof GRAMMAR_DATA === 'undefined' || !GRAMMAR_DATA.length) return '';
            const pages = [];
            for (let i = 0; i < GRAMMAR_DATA.length; i += 4) pages.push(GRAMMAR_DATA.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(g => `<div class="pw-vocab-card"><div class="pw-term">${esc(g.pattern || '')}</div><div class="pw-def">${esc(g.explanation || '')}</div>${g.example ? `<div class="pw-def">${esc(g.example)}</div>` : ''}</div>`).join('')}</div></div>`).join('');
        }
        function vocabHTML() {
            const hasFC = (typeof FC_CARDS !== "undefined") && FC_CARDS.length > 0;
            const modeBar = hasFC ? `<div class="fc-modebar print:hidden"><button type="button" data-action="fc-mode" data-mode="list" class="fc-modebtn${fc.mode==='list'?' on':''}">어휘 카드<span class="lk-en"> · Vocab Cards</span></button><button type="button" data-action="fc-mode" data-mode="card" class="fc-modebtn${fc.mode==='card'?' on':''}">플래시 카드<span class="lk-en"> · Flash Cards</span></button></div>` : '';
            const header = `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-16 flex flex-col items-center text-center"><h2 class="text-[32px] md:text-[36px] font-bold text-[#1a1a1a] leading-tight font-serif mb-3 tracking-tight">핵심 어휘</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Key Vocabulary</span><div class="w-[1px] h-6 bg-gray-200 mt-8"></div></div>`;
            const listRest = `<div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100"><div class="relative w-full sm:max-w-xs"><input type="text" id="vocab-search" value="${esc(vocabState.query)}" placeholder="${secLang() ? '단어, 뜻, 영어 검색... / Search words...' : '단어, 뜻, 영어 검색...'}" class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 transition-all" />${vocabState.query ? '<button type="button" data-action="vocab-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs font-bold">✕</button>' : ''}</div><div class="flex items-center gap-4 w-full sm:w-auto justify-end"><span class="text-xs text-gray-500 font-sans">검색 결과: <strong id="vocab-count">${vocabFiltered().length}</strong>개 / 전체 ${VOCAB_READING_DATA.length}개</span><button type="button" data-action="vocab-global" class="px-4 py-2 text-xs font-semibold rounded-lg border transition-all ${vocabState.globalTrans ? 'bg-gray-900 text-white border-gray-900 hover:bg-black' : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'}">${vocabState.globalTrans ? '영어 일괄 숨기기<span class="lk-en"> · Hide English</span>' : '영어 일괄 표시<span class="lk-en"> · Show English</span>'}</button></div></div><div class="mb-16"><div class="flex items-center gap-3 mb-8"><h3 class="text-xl font-bold font-serif text-black">읽기 자료 어휘</h3><div class="h-px flex-1 bg-gray-200"></div><span class="lk-en text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Reading</span></div><div id="vocab-grid">${vocabGridHTML()}</div></div>${grammarSectionHTML()}</div>`;
            const body = (hasFC && fc.mode==='card') ? fcDeckHTML() : listRest;
            return `${header}${modeBar}${body}`;
        }
        function refreshVocabGrid() { const g = qs('#vocab-grid', viewRoot()); if (g) g.innerHTML = vocabGridHTML(); const c = qs('#vocab-count', viewRoot()); if (c) c.textContent = vocabFiltered().length; }

        // ---------- 10. QUIZ ----------

        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;
        }
        function rerenderQuizQ(qid) { const el = qs(`.quiz-q[data-qid="${qid}"]`, viewRoot()); if (el) el.outerHTML = quizItemHTML(QUIZ_LIST.find(q => String(q.id) === String(qid))); }
        function updateQuizScore() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; }

        // ---------- 11. DISCUSS ----------
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, feedback: null, loading: false, fbTrans: false });
            const vocab = item.vocab.map(v => `<div><p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>${st.showTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-1 animate-fade-in"><span class="font-bold mr-2">${esc(v.termEng)}</span>${esc(v.defEng)}</p>` : ''}</div>`).join('');
            let fb = '';
            if (st.feedback) {
                const corr = (st.feedback.corrections || []).map(c => `<div class="border border-gray-100 p-5 bg-white"><div class="flex items-start gap-4 mb-3"><span class="shrink-0 text-[11px] font-bold px-2 py-0.5 bg-gray-100 text-gray-400 mt-0.5">수정 전</span><p class="text-[15px] font-serif text-gray-400 line-through leading-relaxed">${esc(c.original)}</p></div><div class="flex items-start gap-4 mb-5"><span class="shrink-0 text-[11px] font-bold px-2 py-0.5 bg-blue-50 text-blue-600 mt-0.5">수정 후</span><p class="text-[15px] font-serif text-gray-900 font-bold leading-relaxed">${esc(c.corrected)}</p></div><div class="pt-4 border-t border-gray-100 border-dashed"><span class="font-bold text-gray-400 text-[11px] mr-2 font-sans">💡 설명</span><span class="text-[14px] font-serif text-gray-700 leading-relaxed">${esc(c.explanation)}</span>${st.fbTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-2 ml-6 animate-fade-in">${esc(c.explanationTrans)}</p>` : ''}</div></div>`).join('');
                fb = `<div class="mt-8 border border-gray-100 rounded-sm p-6 bg-white animate-fade-in shadow-sm"><h4 class="text-lg font-bold font-serif flex items-center gap-2 mb-6 text-gray-900">${svgIcon('sparkles', 'w-5 h-5 text-gray-700', { fill: 'currentColor' })} AI 한국어 도우미</h4><div class="bg-gray-50 px-5 py-4 mb-8 border-l-[3px] border-gray-800"><span class="text-xs font-bold text-gray-500 mb-2 block font-sans">총평 및 잘한 점</span><p class="text-[15px] font-serif text-gray-800 leading-relaxed">${esc(st.feedback.overallComment)}</p>${st.fbTrans && st.feedback.overallCommentTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-2 pt-2 border-t border-gray-200 animate-fade-in">${esc(st.feedback.overallCommentTrans)}</p>` : ''}</div>${corr ? `<h5 class="text-xs font-bold text-gray-500 mb-4 font-sans">문장별 교정 및 설명</h5><div class="space-y-6">${corr}</div>` : ''}<div class="flex justify-end mt-4">${transBtn('discuss-fbtrans', st.fbTrans)}</div></div>`;
            }
            const disabled = (!st.text.trim() || st.loading);
            return `<div class="discuss-q mb-16 group" data-did="${item.id}"><div class="flex items-center gap-4 mb-6"><span class="text-4xl font-serif font-bold text-gray-200 transition-colors duration-300 group-hover:text-gray-900">${String(item.id).padStart(2, '0')}</span><h3 class="text-xl font-serif font-bold text-gray-900 leading-normal" style="white-space:pre-line">${esc(item.questionKor)}</h3></div><div class="pl-0 md:pl-14"><div class="flex gap-2 mb-4">${transBtn('discuss-qtrans', st.showTrans)}${st.showTrans ? `<p class="text-sm font-sans text-gray-500 animate-fade-in" style="white-space:pre-line">${esc(item.questionEng)}</p>` : ''}</div><div class="bg-gray-50 p-5 mb-6 border-l-2 border-black"><span class="text-xs font-bold font-sans text-gray-400 uppercase mb-3 block">핵심 어휘${st.showTrans ? ' <span class="lk-en font-normal normal-case ml-1">(Key Vocabulary)</span>' : ''}</span><div class="space-y-4">${vocab}</div></div><textarea data-action="discuss-text" placeholder="${secLang() ? '여기에 생각을 적어보세요... / Write your thoughts here...' : '여기에 생각을 적어보세요...'}" class="w-full p-4 border border-gray-300 font-serif text-base text-gray-900 focus:border-black focus:ring-0 outline-none min-h-[150px] bg-white resize-y mb-3 transition-colors placeholder:text-gray-300">${esc(st.text)}</textarea><div class="flex justify-end"><button type="button" data-action="discuss-feedback" ${disabled ? 'disabled' : ''} class="px-6 py-2 text-xs font-bold font-sans uppercase tracking-widest border transition-colors flex items-center gap-2 ${disabled ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-black bg-black text-white hover:bg-white hover:text-black'}">${st.loading ? '<div class="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></div>' : ''}AI 피드백 받기<span class="lk-en"> · Get AI Feedback</span></button></div>${fb}</div></div>`;

            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;

            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);

            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
