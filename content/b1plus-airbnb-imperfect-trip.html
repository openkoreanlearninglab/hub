            {"id": "s26", "speaker": "연희", "kor": "너 요즘 날씨 잘 안 맞는 거 알지?", "time": [17.783, 19.281], "eng": "You know the forecast is hardly ever right these days, right?"},
            {"id": "s27", "speaker": "지혜", "kor": "응.", "time": [19.311, 19.931], "eng": "Okay."},
            {"id": "s28", "speaker": "연희", "kor": "나 날씨 요정이야.", "time": [19.961, 21.371], "eng": "I'm a weather fairy."},
            {"id": "s29", "speaker": "지혜", "kor": "그래? 너만 믿는다.", "time": [21.401, 23.005], "eng": "Really? I'm counting on you."},
            {"id": "s30", "speaker": "지혜", "kor": "뭐 하지 가서?", "time": [23.035, 24.494], "eng": "So what should we do when we get there?"},
            {"id": "s31", "speaker": "연희", "kor": "그거, 바다에서 불꽃놀이 하는 거.", "time": [24.524, 26.666], "eng": "You know, setting off fireworks at the beach."},
            {"id": "s32", "speaker": "지혜", "kor": "좋아.", "time": [26.696, 27.461], "eng": "Okay."},
            {"id": "s33", "speaker": "연희", "kor": "불꽃으로 글씨 써서 사진 찍는 거야.", "time": [27.491, 29.708], "eng": "We write words with sparklers and take pictures."},
            {"id": "s34", "speaker": "지혜", "kor": "좋아, 좋아.", "time": [29.738, 30.767], "eng": "Nice, nice."},
            {"id": "s35", "speaker": "연희", "kor": "그리고...", "time": [30.797, 31.672], "eng": "And..."},
            {"id": "s36", "speaker": "지혜", "kor": "응. 아, 맞다! 나 이거 샀다?", "time": [31.702, 34.592], "eng": "Yeah. Oh, right! Guess what I bought?"},
            {"id": "s37", "speaker": "연희", "kor": "오, 귀여워!", "time": [34.622, 35.547], "eng": "Ooh, cute!"},
            {"id": "s38", "speaker": "지혜", "kor": "나 이거 이렇게 꾸밀 수 있는 거 때문에 Z 플립5 산 거임.", "time": [35.577, 39.066], "eng": "I bought the Z Flip5 just because you can decorate it like this."},
            {"id": "s39", "speaker": "지혜", "kor": "이거 이렇게 하면 여기도 바뀐다?", "time": [39.099, 41.635], "eng": "And if you do this, this part changes too. See?"},
            {"id": "s40", "speaker": "연희", "kor": "와, 귀엽다.", "time": [41.668, 42.861], "eng": "Wow, so cute."},
            {"id": "s41", "speaker": "지혜", "kor": "너무 귀엽지?", "time": [42.891, 44.478], "eng": "Isn't it adorable?"},
            {"id": "s42", "speaker": "연희", "kor": "짜자잔! 나도 있지롱.", "time": [44.508, 46.767], "eng": "Ta-da! I've got one too."},
            {"id": "s43", "speaker": "연희", "kor": "아, 나 핸드폰 두고 왔다.", "time": [46.797, 48.208], "eng": "Oh, I left my phone behind."},
            {"id": "s44", "speaker": "지혜", "kor": "아, 진짜?", "time": [48.238, 49.117], "eng": "Oh, really?"},
            {"id": "s45", "speaker": "연희", "kor": "아, 여기 있다 여기 있다.", "time": [49.147, 50.819], "eng": "Oh, here it is, here it is."},
            {"id": "s46", "speaker": "지혜", "kor": "다행 다행.", "time": [50.849, 52.022], "eng": "Phew, good."},
            {"id": "s47", "speaker": "화면", "kor": "무계획 여행", "time": [52.052, 52.59], "eng": "A Trip with No Plan"},
            {"id": "s48", "speaker": "지혜", "kor": "야야, 미안해. 진짜 미안해.", "time": [53.369, 55.15], "eng": "Hey, I'm sorry. I'm really sorry."},
            {"id": "s49", "speaker": "연희", "kor": "야, 나 방금 너 몇 분에 도착하는지 지하철 시간 체크해 봄.", "time": [55.18, 58.487], "eng": "Hey, I just checked the subway times to see what time you'd get here."},
            {"id": "s50", "speaker": "연희", "kor": "나 완전 J 같지?", "time": [58.517, 59.657], "eng": "Don't I seem like a total J?"},
            {"id": "s51", "speaker": "지혜", "kor": "너 왜 그래, 무섭게?", "time": [59.687, 60.699], "eng": "What's wrong with you? You're scaring me."},
            {"id": "s52", "speaker": "지혜", "kor": "야, 근데 우리 표 없다고?", "time": [60.729, 62.783], "eng": "Hey, wait, so we don't have tickets?"},
            {"id": "s53", "speaker": "연희", "kor": "고속버스 없어서 일반으로 했어.", "time": [62.813, 64.759], "eng": "There were no express buses, so I got a regular one."},
            {"id": "s54", "speaker": "지혜", "kor": "응.", "time": [64.789, 65.104], "eng": "Okay."},
            {"id": "s55", "speaker": "연희", "kor": "이거 엄청 많이 멈추는데, 괜찮아?", "time": [65.134, 66.882], "eng": "This one makes a ton of stops. Is that okay?"},
            {"id": "s56", "speaker": "지혜", "kor": "괜찮아.", "time": [66.912, 67.642], "eng": "It's fine."},
            {"id": "s57", "speaker": "지혜", "kor": "버스를 미리 예매할 걸 그랬나?", "time": [67.672, 69.122], "eng": "Should we have booked the bus in advance?"},
            {"id": "s58", "speaker": "연희", "kor": "아니, 뭐 도착만 하면 되지.", "time": [69.152, 70.532], "eng": "Nah, as long as we get there."},
            {"id": "s59", "speaker": "지혜", "kor": "응, 맞아.", "time": [70.562, 71.018], "eng": "Yeah, right."},
            {"id": "s60", "speaker": "연희", "kor": "이거 한 1시간 더 걸린다던데?", "time": [71.048, 72.751], "eng": "I heard this takes about an hour longer."},
            {"id": "s61", "speaker": "지혜", "kor": "근데 뭐, 나는 버스 타는 거 좋아해 가지고.", "time": [72.781, 74.656], "eng": "Well, I like riding buses anyway."},
            {"id": "s62", "speaker": "연희", "kor": "나도.", "time": [74.686, 75.156], "eng": "Me too."},
            {"id": "s63", "speaker": "연희", "kor": "아, 보조배터리 있어?", "time": [75.186, 76.797], "eng": "Oh, do you have a power bank?"},
            {"id": "s64", "speaker": "지혜", "kor": "아, 챙길걸...", "time": [76.827, 78.213], "eng": "Ah, I should've brought one..."},
            {"id": "s65", "speaker": "연희", "kor": "아니, 나 어제 쇼츠 보다가 충전 못 하고 잠들어 가지고", "time": [78.243, 80.979], "eng": "Ugh, I was watching Shorts last night and fell asleep without charging,"},
            {"id": "s66", "speaker": "연희", "kor": "배터리 30%야.", "time": [81.009, 81.899], "eng": "so my battery's at 30%."},
            {"id": "s67", "speaker": "지혜", "kor": "어, 진짜?", "time": [81.929, 82.532], "eng": "Oh, really?"},
            {"id": "s68", "speaker": "지혜", "kor": "나 괜춘. 나 55퍼.", "time": [82.562, 83.929], "eng": "I'm good. I'm at 55."},
            {"id": "s69", "speaker": "연희", "kor": "근데 이거 배터리 꽤 오래가긴 하더라고.", "time": [83.959, 85.973], "eng": "But this battery does last pretty long."},
            {"id": "s70", "speaker": "지혜", "kor": "어, 맞아. 이거 빨간색인 상태에서도 되게 길게 가더라고.", "time": [86.003, 89.059], "eng": "Yeah, right. Even when it's in the red, it keeps going for ages."},
            {"id": "s71", "speaker": "연희", "kor": "충분하겠지?", "time": [89.089, 90.018], "eng": "Think it'll be enough?"},
            {"id": "s72", "speaker": "연희", "kor": "우리 오늘 사진 많이 찍어야 되는데.", "time": [90.048, 91.34], "eng": "We have to take a lot of pictures today."},
            {"id": "s73", "speaker": "지혜", "kor": "같이 찍자.", "time": [91.37, 91.898], "eng": "Let's take them together."},
            {"id": "s74", "speaker": "연희", "kor": "아니, 왜 시간이 다 됐는데 버스가 안 오는 거야?", "time": [91.928, 95.532], "eng": "Wait, why isn't the bus here? It's already time."},
            {"id": "s75", "speaker": "지혜", "kor": "야, 저거 아니야?", "time": [95.562, 96.933], "eng": "Hey, isn't that it?"},
            {"id": "s76", "speaker": "연희", "kor": "응? 맞아. 맞아, 맞아, 맞아!", "time": [96.963, 98.718], "eng": "Huh? Yeah. Yeah, yeah, that's it!"},
            {"id": "s77", "speaker": "지혜", "kor": "맞다고?", "time": [98.748, 99.154], "eng": "It is?"},
            {"id": "s78", "speaker": "지혜", "kor": "야!", "time": [99.184, 99.666], "eng": "Hey!"},
            {"id": "s79", "speaker": "지혜 & 연희", "kor": "아저씨!", "time": [99.696, 101.51], "eng": "Wait! (to the bus driver)"},
            {"id": "s80", "speaker": "연희", "kor": "어? 여기도 휴무래.", "time": [101.54, 102.948], "eng": "Huh? This place is closed today too."},
            {"id": "s81", "speaker": "지혜", "kor": "어떡해?", "time": [102.978, 104.248], "eng": "What do we do?"},
            {"id": "s82", "speaker": "지혜", "kor": "전화해 보고 올걸.", "time": [104.278, 105.742], "eng": "We should've called before coming."},
            {"id": "s83", "speaker": "연희", "kor": "뭔가 이쪽으로 가면 더 맛있는 거 많이 나올 거 같지 않아?", "time": [105.772, 109.212], "eng": "Don't you feel like we'll find more good food if we go this way?"},
            {"id": "s84", "speaker": "지혜", "kor": "어, 좋은데?", "time": [109.242, 110.2], "eng": "Ooh, sounds good."},
            {"id": "s85", "speaker": "연희", "kor": "삘 좋은데?", "time": [110.23, 111.234], "eng": "I've got a good feeling about this."},
            {"id": "s86", "speaker": "지혜", "kor": "어, 원래 이렇게 찾다가 찐 맛집이 나오는 거야.", "time": [111.264, 115.043], "eng": "Yeah, this is how you stumble on a real hidden gem."},
            {"id": "s87", "speaker": "연희", "kor": "어? 막혔다.", "time": [115.073, 117.212], "eng": "Huh? It's a dead end."},
            {"id": "s88", "speaker": "연희", "kor": "아, 길 있는 줄 알았는데.", "time": [117.242, 120.253], "eng": "Ugh, I thought there was a road."},
            {"id": "s89", "speaker": "지혜", "kor": "돌아가자.", "time": [120.283, 121.148], "eng": "Let's go back."},
            {"id": "s90", "speaker": "연희", "kor": "그래.", "time": [121.178, 125.218], "eng": "Okay."},
            {"id": "s91", "speaker": "지혜", "kor": "이러는데 갑자기, 여기서 40년 동안 장사만 한 할머니 할아버지 부부가 운영하는 찐 맛집을 발견해 버리고.", "time": [125.251, 134.229], "eng": "And then suddenly we find a real hidden gem, run by an old couple who've done nothing but run this place for 40 years."},
            {"id": "s92", "speaker": "연희", "kor": "근데 그 할머니 할아버지, 알고 보니까", "time": [134.259, 136.434], "eng": "And it turns out that grandma and grandpa"},
            {"id": "s93", "speaker": "연희", "kor": "바삭바삭한 누룽지만 40년 동안 연구한 누룽지 장인인 거야.", "time": [136.464, 140.256], "eng": "are nurungji masters who've spent 40 years perfecting crispy nurungji."},
            {"id": "s94", "speaker": "지혜", "kor": "근데 할머니 할아버지여서 카카오맵 등록 안 해 놔 가지고,", "time": [140.286, 144.276], "eng": "But since they're older folks, they never put it on Kakao Map,"},
            {"id": "s95", "speaker": "지혜", "kor": "우리가 한 달 만에 가는 첫 손님이고.", "time": [144.306, 146.783], "eng": "so we're their first customers in a month."},
            {"id": "s96", "speaker": "연희", "kor": "\"학생들, 도대체 여기 어떻게 왔어?\" 막 이러고.", "time": [146.813, 149.941], "eng": "And they're like, \"Kids, how on earth did you find this place?\""},
            {"id": "s97", "speaker": "지혜", "kor": "40년 누룽밥으로 전설의 누룽지탕 만들어 주고.", "time": [149.971, 153.081], "eng": "And they make us the legendary nurungji soup with 40-year scorched rice."},
            {"id": "s98", "speaker": "연희", "kor": "그럼 이제 그 전설의 누룽지탕을 드셔 보시죠.", "time": [153.111, 155.816], "eng": "And now, please enjoy that legendary nurungji soup."},
            {"id": "s99", "speaker": "지혜", "kor": "그래, 바로 이거야!", "time": [155.846, 157.479], "eng": "Yes, this is it!"},
            {"id": "s100", "speaker": "지혜", "kor": "음?", "time": [157.509, 158.675], "eng": "Hm?"},
            {"id": "s101", "speaker": "연희", "kor": "빠바바 바바바바~", "time": [158.705, 162.828], "eng": "Ba-ba-ba, ba-ba-ba-ba~"},
            {"id": "s102", "speaker": "연희", "kor": "눈물 한 방울 또르르.", "time": [162.858, 165.859], "eng": "A single tear rolls down."},
            {"id": "s103", "speaker": "지혜", "kor": "뭔가 진짜 누룽지탕 있을 것 같은데?", "time": [165.889, 169.207], "eng": "I really feel like there's nurungji soup around here somewhere."},
            {"id": "s104", "speaker": "연희", "kor": "이 동네 삘이, 뭔가 누룽지 특산물 있을 것 같은 삘이야.", "time": [169.237, 172.199], "eng": "This neighborhood has a vibe, like nurungji is the local specialty."},
            {"id": "s105", "speaker": "지혜", "kor": "우리 버스라도 탈까?", "time": [172.229, 176.271], "eng": "Should we at least take a bus?"},
            {"id": "s106", "speaker": "연희", "kor": "아니, 진짜 여기는 아무것도 없다.", "time": [176.301, 178.64], "eng": "Seriously, there's nothing here."},
            {"id": "s107", "speaker": "지혜", "kor": "음... 아, 너무 더워.", "time": [178.673, 180.901], "eng": "Hmm... ugh, it's so hot."},
            {"id": "s108", "speaker": "연희", "kor": "와, 배차 간격이 45분이래.", "time": [180.934, 183.773], "eng": "Wow, the bus only comes every 45 minutes."},
            {"id": "s109", "speaker": "지혜", "kor": "응? 아, 시골이라 그런가 봐.", "time": [183.803, 186.154], "eng": "Huh? Oh, I guess because it's the countryside."},
            {"id": "s110", "speaker": "연희", "kor": "근데 여기 마을, 뭔가 짱구가 살 것 같지 않아?", "time": [186.184, 190.952], "eng": "But doesn't this village look like Shin-chan could live here?"},
            {"id": "s111", "speaker": "지혜", "kor": "떡잎마을?", "time": [190.982, 192.007], "eng": "Shin-chan's town?"},
            {"id": "s112", "speaker": "연희", "kor": "\"예쁜 누나다~\"", "time": [192.037, 193.705], "eng": "\"Pretty lady~!\""},
            {"id": "s113", "speaker": "지혜", "kor": "나 여행 브이로그 찍으려고 했는데 까먹었어.", "time": [193.735, 196.708], "eng": "I meant to film a travel vlog, but I forgot."},
            {"id": "s114", "speaker": "연희", "kor": "지금이라도 찍어.", "time": [196.738, 198.21], "eng": "Film it now, then."},
            {"id": "s115", "speaker": "지혜", "kor": "응.", "time": [198.24, 198.44], "eng": "Okay."},
            {"id": "s116", "speaker": "지혜", "kor": "야,", "time": [198.47, 200.801], "eng": "Hey,"},
            {"id": "s117", "speaker": "연희", "kor": "오, 뭔가 이거 셀카도 화질 진짜 좋다.", "time": [200.831, 205.362], "eng": "Oh, the selfie quality on this is really good."},
            {"id": "s118", "speaker": "지혜", "kor": "맞아, 좋아. 짱 좋아.", "time": [205.392, 206.685], "eng": "Right, it's great. Super great."},
            {"id": "s119", "speaker": "지혜", "kor": "안녕하세요, 저희는 지금 전설의 누룽지탕을 찾으러 가고 있습니다.", "time": [209.292, 216.457], "eng": "Hello! Right now we're on our way to find the legendary nurungji soup."},
            {"id": "s120", "speaker": "연희", "kor": "근데 여기 버스 오는 거 맞겠지?", "time": [216.487, 218.119], "eng": "But the bus does stop here, right?"},
            {"id": "s121", "speaker": "지혜", "kor": "좀 기다리면 오겠지, 뭐.", "time": [218.149, 219.988], "eng": "If we wait a bit, it'll come."},
            {"id": "s122", "speaker": "연희", "kor": "그래, 오겠지. 정류장인데.", "time": [220.018, 222.44], "eng": "Yeah, it'll come. It's a bus stop."},
            {"id": "s123", "speaker": "지혜", "kor": "아, 안녕하세요.", "time": [222.473, 229.953], "eng": "Oh, hello."},
            {"id": "s124", "speaker": "지혜 & 연희", "kor": "왔다, 왔다, 버스 왔다.", "time": [229.983, 232.369], "eng": "It's here, it's here, the bus is here!"},
            {"id": "s125", "speaker": "지혜", "kor": "진짜 배차 간격 진짜 에바였다.", "time": [234.443, 237.133], "eng": "Seriously, the wait between buses was way too much."},
            {"id": "s126", "speaker": "연희", "kor": "진짜 45분 만에 온 버스야.", "time": [237.163, 239.103], "eng": "That bus really took 45 minutes to come."},
            {"id": "s127", "speaker": "지혜", "kor": "온 게 어디야.", "time": [239.136, 240.879], "eng": "At least it came."},
            {"id": "s128", "speaker": "연희", "kor": "맞아. 재밌었다.", "time": [240.913, 242.216], "eng": "True. That was fun."},
            {"id": "s129", "speaker": "지혜", "kor": "아, 너 폰 안 꺼졌지?", "time": [242.249, 244.369], "eng": "Oh, your phone didn't die, right?"},
            {"id": "s130", "speaker": "연희", "kor": "오? 이거 배터리 진짜 오래간다.", "time": [244.402, 247.492], "eng": "Oh? This battery really lasts."},
            {"id": "s131", "speaker": "지혜", "kor": "우리 바다 갈 수 있겠지?", "time": [247.522, 250.637], "eng": "We'll make it to the sea, right?"},

example은 [예문 쓰는 법]을 따릅니다.\n- '피동', '의존명사', '관형형' 같은 문법 용어를 쓰면 바로 뒤에 쉬운 말로 풀어 줍니다. 예: "피동(주어가 남의 힘에 의해 움직이는 동사의 형태)". 단, 설명 안에서 이미 그 뜻을 풀어 말했으면 괄호 풀이를 또 붙이지 않습니다. 같은 말을 되풀이하지 않습니다.\n\n[corrections — 틀린 부분 (빨간색) — B 모드의 중심]\n이 레벨 학습자는 문장 오류가 많습니다. 문장을 바르게 완성하는 데 집중해서 다음을 모두 찾아 고칩니다.\n- 조사 오류. 특히 은/는과 이/가: '-면', '-ㄹ 때' 같은 조건 부분의 주어는 '-이/가', 두 가지를 대조할 때는 '-은/는' (예: 날씨가 좋으면 저는 산책을 해요)\n- 동사·형용사 활용 오류\n- 시제: 지난 일은 과거형, 늘 그런 일이나 일반적인 사실은 현재형\n- 연결어미: 이유·순서는 '-아서/-어서', 나열은 '-고', 대조는 '-지만', 배경은 '-는데'. 'A가 아니고 B예요'처럼 앞을 부정하고 바로잡을 때는 '-아니라'\n- 능동과 피동: [조사 '-은/는'이 붙은 말과 능동·피동 확인]을 따릅니다.\n- 주어와 서술어가 맞지 않는 문장, 어순, 꼭 필요한 말(주어·조사)이 빠진 경우\n- 함께 쓰지 않는 단어 조합, 문맥상 어색한 표현, 맞춤법·오타, 종결어미 섞임\n- 뜻이 비슷한 단어 중 더 정확한 것을 고르는 미묘한 차이는 지적하지 않습니다. 뜻이 잘못 전달될 때만 고칩니다.\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.RED_TAGS.join(", ")}\n\n[suggestions — 더 좋은 표현 (주황색)]\n- 문법은 맞지만 어색한 문장이 있을 때만, 최대 ${FEEDBACK_CONFIG.MAX_SUGGESTIONS.B}개 제안합니다. 더 어려운 표현으로 바꾸는 제안은 하지 않습니다.\n- 학습자가 구어체로 써도 지적하지 않습니다. 대안 문장은 한국 사람이 실제로 말하는 자연스러운 구어체로 제시합니다. 종결어미는 학습자가 고른 것(반말/해요체 등)에 맞춥니다.\n- tag: 더 좋은 표현, 일관성. word는 모두 빈 문자열입니다.`,C:t=>`[설명 언어 — C 모드]\n- 모든 설명(explanation, praise, comment)은 한국어 해요체로 쓰고, 문장 끝은 반드시 "-요"로 끝냅니다. 영어는 쓰지 않습니다. explanationEn, praiseEn, commentEn, modelAnswerEn은 빈 문자열입니다.\n- 설명 문장의 어휘·문법·문장 구조는 ${FEEDBACK_CONFIG.EXPLAIN_LEVEL[t]||"B2"} 이하 수준으로 쉽고 짧게 씁니다.\n- 단, 고칠 대상(original)은 학습자가 쓴 그대로 인용하고, 고친 표현(corrected, suggested)은 레벨을 고려하지 않고 가장 자연스러운 표현으로 씁니다.\n- '주어, 서술어, 조사, 조건절, 안긴문장' 같은 기본 문법 용어는 써도 되지만, '연어'처럼 어려운 언어학 용어는 쓰지 말고 "'옷'과 '쓰다'는 함께 쓰지 않아요"처럼 풀어서 설명합니다.\n- 규칙만 말하지 말고, 이 문장에서 왜 문제인지를 함께 설명합니다. example은 [예문 쓰는 법]을 따릅니다.\n- '피동', '의존명사', '관형형' 같은 문법 용어를 쓰면 바로 뒤에 쉬운 말로 풀어 줍니다. 예: "피동(주어가 남의 힘에 의해 움직이는 동사의 형태)". 단, 설명 안에서 이미 그 뜻을 풀어 말했으면 괄호 풀이를 또 붙이지 않습니다. 같은 말을 되풀이하지 않습니다.\n- 학습자가 일부러 그렇게 썼을 수도 있는 경우에는 단정하지 말고 "~을 말하고 싶었다면 ~가 더 자연스러워요"처럼 씁니다.\n- 오타처럼 이유가 분명한 경우에는 explanation을 빈 문자열로 둡니다.\n\n[corrections — 고쳐야 하는 부분 (빨간색)]\n빨간색에는 두 종류가 있습니다. (1) 문법적으로 틀린 것, (2) 문법은 맞지만 이 문맥에서는 틀린 것(어색한 표현). 둘 다 corrections에 씁니다.\n(1) 문법적 오류\n- 맞춤법, 오타, 띄어쓰기, 조사, 활용(예: 힘든다 → 힘들다, 창조적은 → 창조적인), 문법 형태가 섞인 경우(예: -는지 아닌지와 -나를 함께 씀)\n- 주어와 서술어가 맞지 않는 문장. 특히 능동/피동이 맞지 않는 경우(예: 사람들이 누군가를 살인자라고 불리다 → 부르다)\n- 종결어미가 섞인 경우\n(2) 문맥상 어색한 표현 — 선생님 첨삭에서 가장 많이 나오는 순서대로 꼼꼼히 확인합니다.\n- 은/는과 이/가: 문단의 주제인지, 조건절·안긴문장 안의 주어인지, 대조인지에 따라 맞는지 확인합니다. (tag: 조사)\n- 단어 선택: 뜻이 비슷하지만 이 문맥에 맞지 않는 단어. 예: 동기를 악화하다 → 약화하다, 일시성 → 한시성, 교육 방식을 검수하다 → 검토하다, 해를 보다 → 해를 입다 (tag: 단어 선택)\n- 함께 쓰지 않는 단어 조합. 예: 명암을 하다 → 명암을 표현하다, 어떤 일반 물건 → 평범한 물건 (tag: 단어 조합)\n- 시제와 상: 가정하는 상황인데 과거형을 쓴 경우, 일반적인 사실인데 '-은'을 쓴 경우(만족한 → 만족하는) 등 (tag: 시제)\n- '-는 것이다'를 묘사·서술 문장에 쓴 경우. '-는 것이다'는 본질이나 정의를 규정할 때 씁니다. 묘사는 '-ㄴ다'로 끝냅니다. (tag: 문맥상 어색한 표현)\n- 접속어와 연결어미의 논리: 따라서(결과)를 이유가 필요한 자리에 쓴 경우, 약한 대조 '그런데'를 강한 역접 자리에 쓴 경우, '-고'(나열)와 '-며/-아서'(긴밀한 관계·인과)를 잘못 고른 경우, '때'(특정 순간)와 '-면'(일반 조건) (tag: 연결 표현)\n- 영어를 직역한 서술어. 예: 질문이 생기지 못한다 → 질문을 떠올릴 겨를이 없다 (tag: 문맥상 어색한 표현)\n- 불필요한 반복이나 중복. 예: 녹화하기 가능한 → 녹화 가능한 (tag: 불필요한 반복)\n- 능동과 피동: 예: 그런 시설이 지방에 잘 갖추면 → 갖춰지면 (tag: 주어·서술어 호응). [조사 '-은/는'이 붙은 말과 능동·피동 확인]을 따릅니다.\n- 'A가 아니고 B이다'처럼 앞을 부정하고 뒤를 바로잡는 문장은 '-아니라'를 씁니다. 예: 문제는 돈이 아니고 시간이다 → 돈이 아니라 (tag: 연결 표현)\n- 과거와 현재, 이것과 저것을 대조할 때 대조하는 말에 '-은/는'이 빠진 경우. 예: 처음 시작했을 때 어려웠지만 지금은 쉽다 → 시작했을 때는 (tag: 조사)\n- 꼭 필요한 말이 빠진 경우: 글에서 생략하면 안 되는 주어·조사, 가리키는 대상이 분명해야 하는 지시어('이' 배), 무엇의 김이 빠지는지 같은 대상 (tag: 빠진 말)\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.RED_TAGS.join(", ")}\n\n[suggestions — 틀리지 않았지만 더 좋은 대안 (주황색)]\n선생님이 '더 좋은 표현'을 제안하는 기준입니다. 이 기준에 해당할 때만 제안합니다.\n- 문체 일관성 (tag: 문어체): 글의 어조에 비해 지나치게 구어적인 표현을 문어체로 바꿉니다. 예: 인생의 의미가 뭐냐는 → 삶의 의미는 무엇인가라는, 권태를 이기다 → 극복하다, 우리가 알든 모르든 상관없이 → 우리의 인식과 무관하게, 글에서 생략한 조사 살리기. "근데, 되게, 막, 진짜", "거/건/게" 같은 줄인 형태도 해당합니다. 종결어미(-다/-요/-니다) 자체는 대상이 아닙니다. 구어체를 문어체로 바꾸는 제안에만 이 태그를 씁니다.\n- 더 정확한 어휘 (tag: 정확한 어휘): 틀리지는 않았지만 뜻이 더 정확하게 맞는 단어. 예: 기준을 쓰다 → 기준을 적용하다, 공상과 현실의 사이 → 관계, 오랫동안 → 오래전부터(과거부터 지금까지 이어짐), 잘 알고 있다 → 인지하고 있다\n- 고급 표현 (tag: 고급 표현): 같은 뜻을 더 간결하고 글에 맞는 어휘(주로 한자어)나 압축된 구조로 바꿀 수 있을 때. 예: 그림 그리기 → 회화(繪畵), 한쪽이 다른 쪽 없이 생존할 수 없는 관계 → 불가분의 관계, 육체 노동으로 → 노동집약적 산업으로\n  · 레벨(${t})보다 반 단계~한 단계 높은 수준이어야 합니다. 말을 늘이거나 조사·어미만 바꾼 것은 고급 표현이 아닙니다.\n  · 가능하면 [핵심 어휘]나 [본문]에 나온 어휘를 씁니다. explanation에 "본문에서 나온 표현"이라고 쓰는 것은 그 표현이 실제로 [본문]이나 [핵심 어휘]에 있을 때만입니다.\n- 번역투 (tag: 번역투): 영어 구조를 옮긴 듯한 문장. 예: ~ 중에 하나는 ~이다(One of ~ is) → ~ 중에는 ~이 있다, 모양을 가지고 있다 → 모양이다, '-의'가 여러 번 이어지는 구조, 불필요한 피동 → 능동\n- 문장 구조와 일관성 (tag: 일관성): 첫 번째는 / 두 번째 이유는처럼 나열 형식이 다른 경우, 너무 긴 안긴문장의 주어를 바꾸면 쉽게 읽히는 경우\n- 논리 연결 (tag: 논리 연결): 두 사실의 관계를 더 분명하게 보여 주는 표현. 예: 두 사건을 따로 나열(상류층이 늘었고 신흥 부자가 생겼다) → 인과로 연결(신흥 부자들이 생겨나면서 상류층이 확대되었다), 의미가 모호하고 약한 주장(관련이 있다) → 정확한 강도의 주장(영향을 미쳤을 가능성이 있다)\n- 대체 표현 (tag: 대체 표현): 원래 표현도 좋지만 함께 알아 두면 좋은 다른 표현. suggested에 "A / B"처럼 1~2개를 씁니다.\n- 다른 글쓰기 스타일 (tag: 다른 글쓰기 스타일): 문장은 문법적으로 알맞고 자연스럽지만, 다른 전개 방식이 글의 설득력을 높이는 경우. 예: '따라서'로 바로 주장하는 대신 '특히'로 이유나 사례를 먼저 제시하기\n- 의도에 따라 달라요 (tag: 의도에 따라 달라요): 학습자가 무슨 뜻으로 썼는지에 따라 맞는 표현이 다른 경우. explanation에 "~라는 뜻이면 원래 표현이 맞고, ~라는 뜻이면 ~가 더 자연스러워요"처럼 두 해석을 모두 씁니다.\n[주황색 설명 방식]\n- explanation은 원래 표현이 틀리지 않았다는 점을 먼저 인정합니다(예: "틀린 표현은 아니지만"). 그다음 두 표현의 뜻이나 느낌이 어떻게 다른지, 이 문맥에서는 왜 제안한 표현이 더 맞는지 씁니다.\n- 학습자가 일부러 그렇게 썼을 수도 있으면 "특별한 이유가 있어서 그렇게 썼을 수 있지만"처럼 단정하지 않습니다.\n- 쉬운 표현을 모두 고치지 않습니다. 제안할 만한 곳이 없으면 suggestions는 빈 배열입니다.\n- 제안에 새 어휘를 썼으면 word에 그 어휘(term), 한자어이면 한자(hanja), 쉬운 뜻(meaning)을 씁니다. 없으면 모두 빈 문자열입니다.\n- 가장 도움이 되는 순서로 최대 ${FEEDBACK_CONFIG.MAX_SUGGESTIONS.C}개까지만 씁니다.\ntag는 다음 중 하나: ${FEEDBACK_CONFIG.ORANGE_TAGS.C.join(", ")}`},L={A:'질문: 어제 뭐 먹었어요?\n학습자 글: 저는 어제 밥이 먹었어요. 한국 음식은 맵어요.\n출력: {"relevance":{"status":"on","comment":"","commentEn":"","modelAnswer":"","modelAnswerEn":""},"praise":"You clearly said what you ate and how it tasted.","praiseEn":"","corrections":[{"original":"밥이 먹었어요","corrected":"밥을 먹었어요","tag":"조사","explanation":"Use 을/를 here, not 이/가. 이/가 points at who does the action, but 밥 is the thing being eaten.","explanationEn":"","example":"저는 빵을 먹어요. (O) / 저는 빵이 먹어요. (X)"},{"original":"맵어요","corrected":"매워요","tag":"활용","explanation":"맵다 changes to 매워요, not 맵어요. When a word ends in ㅂ, the ㅂ turns into 우 be
