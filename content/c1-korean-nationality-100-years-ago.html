f": "불(不, 아니다) + 가(可, 가능하다) + 역(逆, 거스르다).\n거꾸로 되돌릴 수 없다는 뜻이에요."}, {"subTerm": "• -성(性)", "subDef": "성(性, 성질).\n'~한 성질, ~한 상태'를 뜻하는 말이에요."}], "examples": [{"kor": "역사적 사건은 불가역성을 지닌다.", "eng": "Historical events have the property of irreversibility."}], "translations": {"en": {"term": "irreversibility", "mainDef": "The state of something that cannot be reversed/undone.", "subDefs": [{"term": "불가역(不可逆)", "def": "불 (不, not) + 가 (可, possible) + 역 (逆, reverse).\nIt means being unable to be reversed/undone."}, {"term": "-성(性)", "def": "성 (性, nature).\nA suffix meaning “the quality/nature of being ~.”"}]}}}, {"term": "오류를 범하다", "mainDef": "실수를 하거나 잘못을 저지르다.", "variants": ["오류를 범하다"], "subDefs": [{"subTerm": "• 범하다(犯)", "subDef": "범(犯, 저지르다).\n잘못이나 죄를 저지른다는 뜻이에요."}], "examples": [{"kor": "그는 계산에서 큰 오류를 범했다.", "eng": "He made a major error in his calculation."}], "translations": {"en": {"term": "make a mistake", "mainDef": "To make a mistake or commit a wrong.", "subDefs": [{"term": "범하다 (犯)", "def": "범 (犯, to commit).\nIt means to commit a mistake or wrongdoing."}]}}}, {"term": "법학전문대학원", "mainDef": "법을 전문적으로 공부하는 대학원.", "variants": ["법학전문대학원"], "subDefs": [{"subTerm": "• 법학(法學)", "subDef": "법(法, 법) + 학(學, 배우다).\n법을 연구하고 배우는 학문을 뜻해요."}], "examples": [{"kor": "그는 법학전문대학원을 졸업하고 변호사가 되었다.", "eng": "He graduated from law school and became a lawyer."}], "translations": {"en": {"term": "law school", "mainDef": "A graduate school for specialized legal study (law school).", "subDefs": [{"term": "법학(法學)", "def": "법 (法, law) + 학 (學, study).\nIt refers to the academic study of law."}]}}}, {"term": "법제하에", "mainDef": "법의 통제와 규칙에 따라.", "variants": ["법제하에"], "subDefs": [{"subTerm": "• 법제(法制)", "subDef": "법(法, 법) + 제(制, 정하다).\n법으로 정해진 제도를 뜻해요."}, {"subTerm": "• -하(下)", "subDef": "하(下, 아래).\n'~의 아래, ~의 영향 아래'라는 뜻을 더하는 말이에요."}], "examples": [{"kor": "모든 국민은 같은 법제하에 살아간다.", "eng": "All citizens live under the same legal system."}], "translations": {"en": {"term": "under the legal system", "mainDef": "Under the control and rules of the legal system.", "subDefs": [{"term": "법제(法制)", "def": "법 (法, law) + 제 (制, establish).\nIt refers to a system established by law."}, {"term": "-하(下)", "def": "하 (下, below).\nA suffix adding the meaning “under ~ / beneath ~.”"}]}}}, {"term": "법제상", "mainDef": "법에 따라 정해진 상태로.", "variants": ["법제상"], "subDefs": [{"subTerm": "• 법제(法制)", "subDef": "법(法, 법) + 제(制, 정하다).\n법으로 정해진 제도를 뜻해요."}, {"subTerm": "• -상(上)", "subDef": "상(上, 위).\n'~의 면에서, ~에 따라'라는 뜻을 더하는 말이에요."}], "examples": [{"kor": "법제상으로는 문제가 없다.", "eng": "Under the legal system, there is no problem."}], "translations": {"en": {"term": "according to the legal system", "mainDef": "As determined by the legal system.", "subDefs": [{"term": "법제(法制)", "def": "법 (法, law) + 제 (制, establish).\nIt refers to a system established by law."}, {"term": "-상(上)", "def": "상 (上, above).\nA suffix adding the meaning “in terms of ~ / according to ~.”"}]}}}, {"term": "논리상", "mainDef": "논리적으로 생각했을 때.", "variants": ["논리상"], "subDefs": [{"subTerm": "• 논리(論理)", "subDef": "논(論, 논의하다) + 리(理, 이치).\n생각이나 말이 이치에 맞게 이어지는 것을 뜻해요."}, {"subTerm": "• -상(上)", "subDef": "상(上, 위).\n'~의 면에서, ~에 따라'라는 뜻을 더하는 말이에요."}], "examples": [{"kor": "논리상으로는 그의 말이 맞다.", "eng": "Logically speaking, what he says is correct."}], "translations": {"en": {"term": "logically", "mainDef": "Logically / in terms of logic.", "subDefs": [{"term": "논리(論理)", "def": "논 (論, discuss) + 리 (理, principle).\nIt refers to thoughts or statements connecting logically."}, {"term": "-상(上)", "def": "상 (上, above).\nA suffix adding the meaning “in terms of ~ / according to ~.”"}]}}}, {"term": "법리", "mainDef": "법의 이치와 원칙.", "variants": ["법리"], "subDefs": [{"subTerm": "• 법리(法理)", "subDef": "법(法 법) + 리(理 이치/다스리다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "판사는 복잡한 법리를 설명했다.", "eng": "The judge explained the complex legal principles."}], "translations": {"en": {"term": "legal principle", "mainDef": "The principles and reasoning of law.", "subDefs": [{"term": "법리(法理)", "def": "법 (法, law) + 리 (理, principle/govern).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "정당성", "mainDef": "옳고 타당한 이유.", "variants": ["정당성"], "subDefs": [{"subTerm": "• 정당성(正當性)", "subDef": "정(正 바르다) + 당(當 마땅하다) + 성(性 성질).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그 정책은 정당성을 잃었다.", "eng": "The policy lost its legitimacy."}], "translations": {"en": {"term": "legitimacy", "mainDef": "A valid and legitimate reason (legitimacy).", "subDefs": [{"term": "정당성(正當性)", "def": "정 (正, correct) + 당 (當, proper) + 성 (性, nature).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "부정되다", "mainDef": "어떤 사실이 인정되지 않다.", "variants": ["부정되다"], "subDefs": [{"subTerm": "• 부정(否定)", "subDef": "부(否 아니다) + 정(定 정하다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "그의 주장은 법정에서 부정되었다.", "eng": "His claim was denied in court."}], "translations": {"en": {"term": "be denied", "mainDef": "For a fact to not be recognized/accepted (be denied).", "subDefs": [{"term": "부정(否定)", "def": "부 (否, not) + 정 (定, decide).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "규정하다", "mainDef": "규칙이나 방법을 정하다.", "variants": ["규정하다"], "subDefs": [{"subTerm": "• 규정(規定)", "subDef": "규(規 법/자) + 정(定 정하다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "법은 노동 시간을 규정하고 있다.", "eng": "The law stipulates working hours."}], "translations": {"en": {"term": "stipulate", "mainDef": "To set a rule or method.", "subDefs": [{"term": "규정(規定)", "def": "규 (規, rule) + 정 (定, decide).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "맥락", "mainDef": "어떤 일이 일어난 앞뒤의 상황.", "variants": ["맥락"], "subDefs": [{"subTerm": "• 맥락(脈絡)", "subDef": "맥(脈 줄기) + 락(絡 이어지다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "그 발언은 전체 맥락에서 이해해야 한다.", "eng": "That remark should be understood within its full context."}], "translations": {"en": {"term": "context", "mainDef": "The surrounding circumstances of an event (context).", "subDefs": [{"term": "맥락(脈絡)", "def": "맥 (脈, vein) + 락 (絡, connect).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "사실혼", "mainDef": "혼인 신고를 하지 않았지만 실제로 부부처럼 함께 사는 관계.", "variants": ["사실혼"], "subDefs": [{"subTerm": "• 사실혼(事實婚)", "subDef": "사(事 일) + 실(實 열매/실제) + 혼(婚 혼인하다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "두 사람은 혼인 신고 없이 사실혼 관계를 유지했다.", "eng": "The couple maintained a common-law marriage without officially registering it."}], "translations": {"en": {"term": "common-law marriage", "mainDef": "A relationship where a couple lives together like husband and wife without officially registering the marriage.", "subDefs": [{"term": "사실혼(事實婚)", "def": "사 (事, matter) + 실 (實, fruit/reality) + 혼 (婚, marry).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "당사자", "mainDef": "어떤 일과 직접 관계있는 사람.", "variants": ["당사자"], "subDefs": [{"subTerm": "• 당사자(當事者)", "subDef": "당(當 마땅하다) + 사(事 일) + 자(者 사람).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "계약의 당사자들은 조건에 합의했다.", "eng": "The parties to the contract agreed on the terms."}], "translations": {"en": {"term": "concerned party", "mainDef": "A person directly involved in a matter.", "subDefs": [{"term": "당사자(當事者)", "def": "당 (當, proper) + 사 (事, matter) + 자 (者, person).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "합의", "mainDef": "서로 의견이 같아지는 것.", "variants": ["합의"], "subDefs": [{"subTerm": "• 합의(合意)", "subDef": "합(合 합치다) + 의(意 뜻).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "노사는 임금 인상에 합의했다.", "eng": "Labor and management agreed on a wage increase."}], "translations": {"en": {"term": "agreement", "mainDef": "Mutual agreement between two sides.", "subDefs": [{"term": "합의(合意)", "def": "합 (合, combine) + 의 (意, meaning).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "혼인무효", "mainDef": "법적으로 정해진 요건을 갖추지 못해 처음부터 혼인이 이루어지지 않은 것으로 보는 것.", "variants": ["혼인무효"], "subDefs": [{"subTerm": "• 무효(無效)", "subDef": "무(無, 없다) + 효(效, 효험).\n효력이 없다는 뜻이에요."}], "examples": [{"kor": "법원은 그 결혼을 혼인무효로 판결했다.", "eng": "The court ruled the marriage null and void."}], "translations": {"en": {"term": "nullity of marriage", "mainDef": "Legally treating a marriage as if it never took place, because it did not meet the required conditions.", "subDefs": [{"term": "무효(無效)", "def": "무 (無, none) + 효 (效, effect).\nIt means having no legal effect."}]}}}, {"term": "정체성", "mainDef": "어떤 존재의 본질적인 특성.", "variants": ["정체성"], "subDefs": [{"subTerm": "• 정체성(正體性)", "subDef": "정(正 바르다) + 체(體 몸/형태) + 성(性 성질).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "청소년기는 정체성을 찾는 시기이다.", "eng": "Adolescence is a time for finding one's identity."}], "translations": {"en": {"term": "identity", "mainDef": "The essential characteristics that define who or what someone/something is.", "subDefs": [{"term": "정체성(正體性)", "def": "정 (正, correct) + 체 (體, body/form) + 성 (性, nature).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "촉발시키다", "mainDef": "어떤 일이 일어나게 하다.", "variants": ["촉발시키다"], "subDefs": [{"subTerm": "• 촉발(觸發)", "subDef": "촉(觸 닿다) + 발(發 피다/일어나다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "작은 사건이 큰 논쟁을 촉발시켰다.", "eng": "A small incident triggered a huge controversy."}], "translations": {"en": {"term": "trigger", "mainDef": "To cause something to happen (trigger).", "subDefs": [{"term": "촉발(觸發)", "def": "촉 (觸, touch) + 발 (發, arise).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "논쟁", "mainDef": "서로 다른 의견을 가지고 말로 싸움.", "variants": ["논쟁"], "subDefs": [{"subTerm": "• 논쟁(論爭)", "subDef": "논(論 논의하다) + 쟁(爭 다투다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "그 정책을 두고 뜨거운 논쟁이 벌어졌다.", "eng             + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }

        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function shuffleChoices() { const a = quizState.shuffled.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } quizState.shuffled = a; }
        function quizSentenceHTML(quiz) {

ans text-gray-400 hover:text-gray-600 underline">동사변형 힌트</button>` : ''}${quiz.particleHint ? `<button type="button" data-q="hint-particle" class="text-xs font-bold font-sans text-gray-400 hover:text-gray-600 underline">조사 힌트</button>` : ''}</div>` : ''}${st.hintVerb && quiz.verbHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.verbHint)}</p>` : ''}${st.hintParticle && quiz.particleHint ? `<p class="mt-2 italic">🔤 ${esc(quiz.particleHint)}</p>` : ''}</div>` : ''}${quiz.explanation && st.result === 'correct' ? `<p class="mt-4 text-sm font-sans text-green-700 font-medium">✓ Correct. ${esc(quiz.explanation)}</p>` : ''}${quiz.explanation && st.result === 'incorrect' ? '<p class="mt-4 text-sm font-sans text-red-600 font-medium">✕ Try again.</p>' : ''}</div>`;

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {
            if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) return VOCAB_DATA;
            const out = [];
            if (typeof VOCAB_VIDEO !== 'undefined' && Array.isArray(VOCAB_VIDEO)) out.push(...VOCAB_VIDEO);

            const s = [];

            if (hasVideos || (typeof VIDEO_SCRIPT_DATA !== 'undefined' && Array.isArray(VIDEO_SCRIPT_DATA) && VIDEO_SCRIPT_DATA.length)) s.push(['script', '동영상 스크립트']);

            if (pwVocabData().length) s.push(['vocab', '핵심 어휘']);

            if (typeof DISCUSS_DATA !== 'undefined' && Array.isArray(DISCUSS_DATA) && DISCUSS_DATA.length) s.push(['discuss', '생각해 보기']);

        }
        function pwScriptHTML() {
            const vids = (typeof VIDEOS !== 'undefined' && VIDEOS.length) ? VIDEOS : [{ title: '', script: (typeof VIDEO_SCRIPT_DATA !== 'undefined' ? VIDEO_SCRIPT_DATA : []) }];
            return vids.map(v => `${(vids.length > 1 && v.title) ? `<div class="pw-part-title">${esc(v.title)}${v.subTitle ? ' · ' + esc(v.subTitle) : ''}</div>` : ''}${(v.script || []).map(l => `<div class="pw-line"><div class="pw-kor"><span class="pw-spk">${esc(l.speaker || '')}</span>${esc(l.kor || '')}</div>${l.eng ? `<div class="pw-eng">${esc(l.eng)}</div>` : ''}</div>`).join('')}`).join('');
        }
        function pwReadingHTML() {
            return READING_DATA.map(r => `<div class="pw-read-title">${esc(r.title || '')}</div>${r.subtitle ? `<div class="pw-read-sub">${esc(r.subtitle)}</div>` : ''}${(r.content || []).filter(p => !p.isChart).map(p => {
                if (p.isHeading) return `<div class="pw-read-h">${esc(p.text || '')}</div>`;
                if (p.isFootnote) return `<div class="pw-read-fn"><span class="pw-fn-num">${esc(String(p.num || ''))}.</span><span>${esc(p.text || '')}</span></div>`;
                if (p.isReference) return `<div class="pw-read-ref">${esc(p.text || '')}</div>`;
                if (p.isQuote) return `<div class="pw-read-quote">${esc(p.text || '')}</div>`;
                return `<div class="pw-read-p">${esc(p.text || '')}</div>`;
            }).join('')}`).join('');
        }
        function pwVocabHTML() {
            const words = pwVocabData(), pages = [];
            for (let i = 0; i < words.length; i += 4) pages.push(words.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(w => `<div class="pw-vocab-card"><div class="pw-term">${esc(w.term || '')}</div><div class="pw-def">${esc(w.mainDef || w.def || '')}</div></div>`).join('')}</div></div>`).join('');
        }
        function pwQuizQHTML(q) {
            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const rdo = e.target.closest('[data-reading-open]'); if (rdo) { reading.activeId = +rdo.dataset.readingOpen; setTab('reading'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const a = e.target.closest('[data-action]');
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const i = +a.dataset.idx; reading.trans[i] = !reading.trans[i]; rerenderReadingBlocks(); }
                    else if (act === 'fn-popup') { e.stopPropagation(); const num = +a.dataset.fn; const r = a.getBoundingClientRect(); if (fnPopupEl && fnPopupEl.style.display === 'block' && fnPopupEl.dataset.num === String(num)) { closeFootnotePopup(); } else { showFootnotePopup(num, r.left + r.width / 2, r.bottom); } }
                    else if (act === 'fn-popup-close') { closeFootnotePopup(); }
                    return;
                }
            } else if (tab === 'vocab') {
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;
                    const fa = e.target.closest('[data-action^="fc-"]');
                    if (fa) { const act = fa.dataset.action;
                        if (act === 'fc-flip') fcSetFlip(!fc.flipped);
                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });
                        else if (act === 'fc-order') fcSetOrder(fa.dataset.sh==='1');
                        else if (act === 'fc-audio') fcPlay(fcCur().audio);
                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }
                        else if (act === 'fc-again-u') { fc.shuffled=true; fcStart(fcUnknown()); fcRefreshDeck(); }
                        else if (act === 'fc-again-all') { fc.shuffled=true; fcStart(null); fcRefreshDeck(); }
                    }
                    return;
                }
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            } else if (tab === 'quiz') {
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => q.id === qid); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const t = st.input.trim(); const ok = t === quiz.answer || (quiz.altAnswer && t === quiz.altAnswer); st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = quiz.answer; st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'hint-verb') { st.hintVerb = !st.hintVerb; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'hint-particle') { st.hintParticle = !st.hintParticle; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'trans') { st.trans = !st.trans; rerenderQuizQ(qid); }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) {
                const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id];
                const wasDisabled = !st.text.trim(); st.text = e.target.value;
                if (wasDisabled !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } }
            }
        });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            reading.dictLoading = true; reading.dictResult = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm, currentReading().content); }
            catch (err) { reading.dictResult = { term: reading.dictTerm, definition: '검색 중 오류가 발생했습니다. (API 키 없음/요청 오류)', example: '' }; }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
</body>
