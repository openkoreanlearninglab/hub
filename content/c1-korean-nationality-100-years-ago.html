    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}

        const HOME_SERIES_BADGE = "";
        const READING_DATA = [{"id": 1, "title": "100년 전에도 한국 국적을 가진 사람들이 있었을까?", "subtitle": "‘형식적 국적’ 논쟁으로 다시 보는 국적의 의미", "cardTitle": "100년 전에도<br>한국 국적을 가진 사람들이<br>있었을까?", "cardDesc": "김문수 발언이 촉발한 국적 논쟁으로 국가의 존립, 국제법적 승인, 소급 무효화를 살펴본다", "source": "https://drive.google.com/file/d/1rSw_Que7xFnAlbf0MqMSXZhRhK3WyuxI/view?usp=sharing", "author": "이상빈", "date": "2024년 10월 10일", "content": [{"text": "최근 한 정치인이 공개석상에서 일본 제국주의 시기 한반도에 살던 사람들의 국적은 일본이다라고 주장해서 큰 논란이 되었다.", "trans": "A recent controversy erupted when a politician publicly claimed that the nationality of people living on the Korean peninsula during the Japanese imperial period was Japanese."}, {"text": "8월 26일 국회 환경노동위원회 인사청문회에서 장관 후보자로 지명된 김문수 후보자는 과거 그의 발언을 지적하는 박홍배 더불어민주당 의원의 질의에 대해 다음과 같이 답했다.", "trans": "At a National Assembly confirmation hearing on August 26th, ministerial nominee Kim Moon-soo responded as follows to Rep. Park Hong-bae of the Democratic Party, who pressed him on remarks he'd made in the past."}, {"text": "박홍배: “김문수 장관 후보자께서는 1919년은 일제 식민지 시대였기 때문에 나라가 없었으며 따라서 ‘대한민국 건국은 1919년이 아니라 1948년 8월 15일이다’라고 주장하였는데, 그렇다면 일제 강점기에 살았던 우리 선조들의 국적은 일본입니까?”", "isQuote": true, "trans": "Park Hong-bae: “Nominee Kim Moon-soo, you've argued that since Korea had no state in 1919 under Japanese colonial rule, the Republic of Korea wasn't founded in 1919 but on August 15, 1948. If that's true, then what was the nationality of our ancestors who lived through Japanese colonial rule—Japanese?”"}, {"text": "김문수: “일제 시대에 한국이 국적이 있었습니까? 나라가 망했는데 무슨 국적이 있었습니까? 나라를 뺏겼으니 당연히 우리 선조의 국적은 일본입니다.”", "isQuote": true, "trans": "Kim Moon-soo: “Did Korea even have a nationality under Japanese rule? The country was gone—what nationality could there have been? Since our country was taken from us, our ancestors' nationality was naturally Japanese.”"}, {"text": "김문수 장관은 9월 4일 KBS라디오 “전격시사”에 출연해서도 비슷한 주장을 이어갔다. 그는 1936년 베를린 올림픽에서 일본 제국 국적으로 마라톤 경기 금매달을 수상한 손기정 선수를 예시로 들면서, 대한제국이 일본제국의 식민지가 되어 나라가 없어졌기 때문에 손기정 선수가 일장기를 달고 마라톤 경기에 출전한 것이라고 지적했다. 이어서 손기정 선수 본인이 일장기를 달고 싶어하지 않았겠지만 ‘나는 일본 국적이 아니라 대한민국이다’라고 해봐야 대한민국 국적으로는 올림픽 출전도 안 되고 아무것도 할 수가 없었던 상황이었다는 말을 덧붙였다.", "trans": "Minister Kim Moon-soo kept pressing the same argument when he appeared on KBS Radio's “Jeonggyeok Sisa” on September 4th. Citing Sohn Kee-chung, who won the marathon gold medal at the 1936 Berlin Olympics under the Japanese Empire's flag, he pointed out that Sohn competed under the Japanese flag because Korea had ceased to exist as a nation once it became a colony of the Japanese Empire. He added that even though Sohn surely didn't want to run under the Japanese flag, saying “I'm not Japanese, I'm Korean” would have gotten him nowhere—he couldn't have competed in the Olympics at all, let alone done anything else, under a Korean nationality that had no standing."}, {"text": "마지막으로, 일본이 대한제국을 식민지로 병합한 것은 무효화시킨 “1965년 한일기본조약”에 대해서 김문수 장관은 외교적으로 그 조약이 유효하더라도 역사적으로 “1910년 한일병합이 없었던 사실이 되는 건 아니다”라며 역사는 역사이기에 “손기정 선수가 일장기를 달고 뛰었듯이 일제 강점기 우리 선조들은 형식적으로 일본 국적이라고 봐야 한다”고 주장했다.", "trans": "Finally, on the “1965 Treaty on Basic Relations,” which nullified Japan's annexation of the Korean Empire, Minister Kim argued that even though the treaty is diplomatically valid, that doesn't erase the historical fact that the 1910 annexation happened—history is history—and so, “just as Sohn Kee-chung ran under the Japanese flag, our ancestors under colonial rule should formally be regarded as having held Japanese nationality.”"}, {"text": "식민지 피지배국의 사람들의 국적을 식민지 지배국과 동일시할 것인지 그렇지 않은지에 대한 문제는 한국에만 해당하는 것이 아니다. 다만, 이 글에서는 김문수가 제기한 논쟁의 핵심인 \"형식적 국적\"의 의미를 분석해 보고자 한다. 이를 위해 먼저 국적의 근간이 되는 국가의 존립 여부를 일제 강점기라는 특수한 역사적 맥락에서 살펴볼 것이다. 또한, 1965년 한일기본조약과 같은 후속 조약이 과거의 법적 지위와 효력을 어떻게 변화시킬 수 있는지, 그리고 이러한 변화가 소급적으로 적용될 수 있는지를 법리적 관점에서 검토해 볼 것이다. 이를 통해 일제 강점기 한반도 거주민의 국적 문제에 대한 보다 체계적이고 심도 있는 이해를 도모하고자 한다.", "trans": "Whether to equate the nationality of a colonized people with that of the colonizing power is not an issue unique to Korea. This piece, however, sets out to analyze the meaning of “formal nationality”—the crux of the controversy Kim Moon-soo ignited. To do that, it first examines, in the specific historical context of Japanese colonial rule, the question of statehood that nationality rests on. It then considers, from a legal standpoint, how a later treaty like the 1965 Treaty on Basic Relations can alter a past legal status and its effects, and whether such a change can apply retroactively. The aim is to build a more systematic and thorough understanding of the nationality question facing residents of the Korean peninsula during Japanese colonial rule."}, {"text": "국가의 존립 여부", "isHeading": true, "trans": "Whether the State Existed"}, {"text": "1897년, 한반도에서 이전까지 “조선”이라고 불리는 나라가 국제적인 지위를 높이고 자주권를 드러내기 위해서 국호를 대한제국으로 바꿨지만 1910년 일본제국에 의해 강제로 합병되어 역사속으로 사라졌다. 그 후에 1919년 3월 1일, 일본 제국이 통치하고 있는 한반도 전역에서 일본제국으로부터 독립하려는 운동이 동시에 나타났고, 이를 계기로 같은 해에 중국 상하이에서 대한민국 임시 정부가 설립되었다. 그리고 1945년 일본제국으로부터 주권을 넘겨 받아 제정된 현재 대한민국의 헌법은 “대한민국이 3·1 운동으로 건립된 대한민국 임시정부의 법통을 계승한다”고 규정하고 있다.", "trans": "In 1897, the country until then known as “Joseon” changed its name to the Korean Empire to raise its international standing and assert its sovereignty—but in 1910 it was forcibly annexed by the Japanese Empire and vanished into history. Then, on March 1, 1919, independence movements rose up simultaneously across the entire Korean peninsula under Japanese rule, and that same year the Provisional Government of the Republic of Korea was established in Shanghai, China. And when sovereignty passed back from the Japanese Empire in 1945, the constitution enacted for today's Republic of Korea states that “the Republic of Korea succeeds the legitimacy of the Provisional Government of the Republic of Korea, born of the March 1st Movement.”"}, {"text": "여기까지가 김문수를 포함해서 대부분의 사람들이 합리적으로 받아들일 수 있는 역사적 사실이다. 이를 바탕으로 “1910년부터 1945년 한반도에 살았던 사람들의 국적이 무엇인가”를 답하려면 몇 가지 개념들에 대한 해석이 필요하다. “국적”이라는 단어가 그 중 하나이다. 단순히 “자신이 속한 정치공동체를 나타내는 상징”이라고 정의할 수도 있지만, 구체적으로 살펴보면, 누가 누구에게 어떤 방식으로 무슨 특성을 부여하는지에 대해서 사람마다 각 공동체마다 그 대상들이 다르다. 특히, 민족(nation)의 국적(nationality)을 말하는 경우에는 한 사람이 어떻게 어떤 민족이 되는지를 정의해야하기 때문에 더욱 그렇다.", "trans": "Up to this point, these are historical facts that most people—Kim Moon-soo included—can reasonably accept. But answering “what was the nationality of people who lived on the Korean peninsula between 1910 and 1945” on this basis requires interpreting several concepts. “Nationality” is one of them. It can be loosely defined as “a symbol representing the political community one belongs to,” but in practice, who grants what kind of status to whom, and how, varies from person to person and community to community—especially when talking about the nationality of a nation in the ethnic sense, since that requires defining how a person comes to belong to a given people in the first place."}, {"text": "일제강점기 한반도 거주자의 국적에 대해 세종대학교 호사카 유지 정치학 교수는 “당시 일본인들도 ‘조선인은 2급 일본인’ 이렇게 말하고 있었다”며 “국적은 이름뿐이고 식민지 조선인들은 일본인이라기보다 일본인의 노예였다”고 주장한다. 그는 당시 일본 제국이 한국인에게 국민으로서의 기본적인 권리를 주지 않았다는 점을 근거로 든다. 호사카 유지에 따르면, 당시 한반도에는 의회라든가 자치 제도가 없었고, 일본에서는 한국인이 일본 의회에 일본의원이 나오면 하나의 세력이 되기 때문에 철저하게 국민의 기본적인 권리인 선거권과 피선거권을 막아놓은 반면, 당시의 한국인들에게 징병 또는 징용 등 국민으로서의 의무만 부과되었다는 점을 강조한다. 더 나아가 호사카 교수는 일본 제국이 본토에서 이미 사라진 고문 제도를 식민지에서는 유지했던 점을 들어 “일본 제국과 식민지 조선이 형법적으로도 같은 나라가 절대 아니었다”고도 주장한다.", "trans": "On the nationality of Korean peninsula residents during Japanese colonial rule, Hosaka Yuji, a political science professor at Sejong University, argues: “Even the Japanese themselves were saying at the time, ‘Koreans are second-class Japanese.’ Nationality was in name only—colonial Koreans were less Japanese nationals than slaves of the Japanese.” He bases this on the fact that the Japanese Empire didn't grant Koreans the basic rights of citizens. According to Hosaka, the Korean peninsula at the time had no parliament or system of self-government; in Japan proper, the empire thoroughly blocked Koreans from the basic citizen rights of voting and running for office, since Korean representatives in the Japanese Diet would have formed a political bloc—while at the same time, Koreans were saddled only with the obligations of citizenship, such as conscription and forced labor. Hosaka goes further, pointing to the fact that the Japanese Empire kept using torture in its colony even after abolishing it at home, arguing that “the Japanese Empire and colonial Joseon were never remotely the same country, even under criminal law.”"}, {"text": "이 모든 것을 차치하고, 김문수가 주장하는 방식대로 국적을 단순히 한국인을 대표하는 국가가 있었는지 없었는지 여부만으로 정의해 보자. 확실히 대한제국이 멸망한 1910년부터 임시정부가 수립된 1919년까지는 그 시절 동안의 일본 제국의 통치하에 한반도에 거주했던 사람들을 (논란의 여지가 있지만) 일본 국민 또는 신민이라고 부를 수도 있겠다. 그런데 1919년 대한민국 임시 정부가 수립된 이후에도 그 당시에 한반도에 살았던 사람들은 여전히 일본인일까?", "trans": "Setting all that aside, let's define nationality purely by Kim Moon-soo's own standard—simply by whether or not a state representing the Korean people existed. Between the Korean Empire's fall in 1910 and the Provisional Government's founding in 1919, it's arguably fair (if debatable) to call the people living on the Korean peninsula under Japanese imperial rule during that stretch Japanese nationals or subjects. But even after the Provisional Government of the Republic of Korea was established in 1919, were the people still living on the peninsula at that time still Japanese?"}, {"text": "국제법적 승인", "isHeading": true, "trans": "International Legal Recognition"}, {"text": "이 질문은 “국가란 무엇인가”라는 복잡한 질문을 내포하고 있다. 이 주제는 여전히 논쟁적이며 어느 확고한 답이 아직 (어쩌면 영원히) 정해지지 않고 있다. 여기에서는 김문수가 주장하듯이 “국제법적 승인”을 중심으로 임시 정부가 국가로서의 지위를 인정 받았는지를 논의해 볼 것이다.", "trans": "This question carries within it the much thornier question of “what is a state?”—a topic that remains contested, without any firm answer settled (perhaps ever). Here, the discussion centers on whether the Provisional Government was recognized as having statehood through, as Kim Moon-soo insists, “international legal recognition.”"}, {"text": "1918년 제 1차 세계 대전이 종식되면서 미국 대통령 우드르 윌슨이 제안한 민족 자결주의에 영향을 받아 1919년 독립운동가들이 상하이에서 대한민국 임시 정부를 설립했다. 하지만 한반도 밖에서 정부가 설립되었기 때문에 한국 영토를 실효적으로 지배할 수 없어서 국민들에게 직접 권리와 의무를 부여하지 못했다. 이 점만 놓고 보면 일본 제국 정부도 식민지 조선인들에게는 제국헌법에 보장된 일본 국민으로서의 권리를 부여하지 않았기 때문에 그들을 일본 국민이라고 칭하기 어렵다. 그렇다면 어떻게 제국헌법을 적용받지 않는 식민지 조선인 손기정 선수가 일본 국적으로 1936년 베를린 올림픽에 출전할 수 있었을까?", "trans": "With the end of World War I in 1918, and influenced by the principle of national self-determination proposed by U.S. President Woodrow Wilson, independence activists established the Provisional Government of the Republic of Korea in Shanghai in 1919. But because the government was formed outside the Korean peninsula, it couldn't effectively control Korean territory, and so couldn't directly grant its people rights or impose duties on them. By that same logic, the Japanese imperial government never granted colonial Koreans the rights of Japanese citizens guaranteed under its imperial constitution, either—so it's hard to call them Japanese citizens as well. So how, then, could Sohn Kee-chung—a colonial Korean not covered by the imperial constitution—compete at the 1936 Berlin Olympics under Japanese nationality?"}, {"text": "일본 제국은 이러한 모순을 합리화하려 국제법상 일본 영토 안에 헌법상의 외국이 존재한다고도 했다(石川健治、憲法のなかの「外国」、日本法の中の外国法-基本法の比較法的考察(早稲田大学比較法研究所 編)、2014). 이 주장에 따르면 식민지 조선인은 헌법상 일본인은 아니지만 국제법상 일본인이라는 설명이 된다.", "trans": "To rationalize this contradiction, the Japanese Empire even claimed, under international law, that a constitutional “foreign country” existed within Japanese territory (Ishikawa Kenji, “Foreign Countries within the Constitution,” Foreign Law within Japanese Law—A Comparative Legal Study, ed. Waseda University Institute of Comparative Law, 2014). Under this claim, colonial Koreans weren't Japanese under the constitution, but were Japanese under international law."}, {"text": "이와 같이 대한민국 임시 정부는 몇 개 국가(중국, 폴란드, 소련)를 제외하고 대외적으로 다른 국가들과 외교 관계를 맺거나 조약을 체결하지 않았기 때문에 국제사회 일반으로부터 공식적으로 정부 승인을 얻지 못하였다는 주장은 다소 설득력이 있어 보인다.", "trans": "Given all this, the claim that the Provisional Government of the Republic of Korea never won formal recognition from the international community at large—since it established diplomatic ties or signed treaties with only a handful of countries (China, Poland, the Soviet Union)—carries some weight."}, {"text": "그런데 임시 정부를 공식적으로 인정하지 않음이 곧 식민지 조선인의 국적이 일본인이 되는 것을 의미하지 않는다. 손기정 선수를 비롯한 몇몇 예외적인 경우를 제외하고 한반도를 떠나 타 지역, 특히 일본에서 살았던 식민지 조선인들은 법적으로든 실질적으로든 외국인 취급을 당했다. 최근 소설이자 드라마로 유명해진 <파친코>에서 나오듯이 일명 자이니치(在日:일본에 거주하고 있다)라고 불리는 재일교포들은 식민지 조선인들의 국적이 일본인이 아니었음을 잘 보여준다. 한국이 일본 제국으로부터 해방된 1945년부터 “1965년 한일기본조약” 체결되기 전까지 일본에 거주하고 있었던 자이니치들은 일본 정부로부터 한국국적 또는 일본국적 어느쪽으로든 인정 받지 못해 무국적자로 지내야 했다.", "trans": "But the fact that the Provisional Government wasn't formally recognized doesn't in itself mean colonial Koreans' nationality was Japanese. With the exception of a few cases like Sohn Kee-chung, colonial Koreans who left the peninsula to live elsewhere—especially in Japan—were treated as foreigners, both legally and in practice. The people known as Zainichi (在日: “residing in Japan”), recently made famous again by the novel and drama Pachinko, make clear that colonial Koreans' nationality was never Japanese. From Korea's liberation from the Japanese Empire in 1945 until the “1965 Treaty on Basic Relations” was signed, the Zainichi living in Japan were recognized by the Japanese government as neither Korean nor Japanese nationals, and had to live as stateless people."}, {"text": "“1910년 한일병합조약”의 무효화", "isHeading": true, "trans": "The Nullification of the “1910 Japan–Korea Annexation Treaty”"}, {"text": "자이니치의 존재를 차치하고 보면, 김문수의 주장은 표면적으로는 일리가 있어 보일 수 있다. 현시대에는 일본 제국주의 시대와 다르게 스스로 국적을 바꾸거나 선택하는 게 가능하더라도 국적은 처음에 자신의 의사와 상관없이 태어날 때 주어진다. 실제로 국가기록원에 따르면, 일본 제국은 합병일인 1910년 8월 29일 칙령 제318호 「한국의 국호를 개정하여 조선으로 하는 건」을 공포하여 대한제국 국호를 멸실하고 대한국인을 조선인으로 명명하였다. 만약 대한국인들이 일본인으로 칭해졌다고 가정해도 국적이(원하든 원하지 않았든)자신이 속한 정체공동체에 의해 부여된다는 점은 바뀌지 않는다. “형식적”이라는 표현은 그 내용보다는 국적을 부여하는 주체에 초점을 맞추고 있다. 형식적 국적은 보통 여권 같은 상징물이나 법률상의 신분을 통해 가시적으로 드러난다. 따라서 식민지 조선인들이 일본 제국 여권을 받았기 때문에 형식적으로 일본인이라는 김문수의 주장은 어느정도 논리적으로 타당한 것처럼 보인다.", "trans": "Setting the existence of the Zainichi aside, Kim Moon-soo's argument can seem to have a point on its surface. Unlike in the era of Japanese imperialism, people today can change or choose their own nationality—but nationality is still first assigned at birth, regardless of one's own will. Indeed, according to the National Archives of Korea, the Japanese Empire promulgated Imperial Ordinance No. 318, “On Revising Korea's Country Name to Joseon,” on August 29, 1910—the day of annexation—erasing the name “Korean Empire” and renaming Koreans “Joseon people.” Even granting that Koreans were then called Japanese, the fact remains that nationality—whether one wants it or not—is conferred by the political community one belongs to. The word “formal” puts the focus not on the content of nationality, but on who confers it. Formal nationality is usually made visible through symbols like a passport or one's legal status. So Kim Moon-soo's claim—that colonial Koreans were formally Japanese because they were issued Japanese imperial passports—does seem, to some extent, logically sound."}, {"text": "그러나 “외교적으로 1965년 한일기본조약이 유효하더라도 역사적으로 1910년 한일병합이 없었던 사실이 되는 건 아니므로 일제 강점기 우리 선조들은 형식적으로 일본 국적이다”라는 김문수의 주장은 몇 가지 중요한 논리적 오류를 내포하고 있다.", "trans": "But Kim Moon-soo's claim—that “even though the 1965 Treaty on Basic Relations is diplomatically valid, that doesn't erase the historical fact that the 1910 annexation happened, so our ancestors under colonial rule should formally be regarded as having held Japanese nationality”—contains several significant logical errors."}, {"text": "먼저, 김문수는 역사적 사실과 법적 효력을 혼동하고 있다. 1965년 체결된 한일기본조약이 한일병합조약(1910년)을 무효화했다는 것은 그 사건이 역사적으로 일어나지 않았다는 의미가 아니라, 그 조약의 법적 효력이 소급하여 무효화되었다는 뜻이다. 즉, 병합 자체는 역사적 사실이지만, 그로 인한 법적 결과는 무효가 된다는 것이다. 법적 효력의 소급 무효화는 그 결과물인 국적 부여까지 포함하는 것이기 때문에 \"형식적 국적\" 역시 법적으로 무효화된 것으로 봐야 한다.", "trans": "First, Kim Moon-soo conflates historical fact with legal effect. Saying the 1965 Treaty on Basic Relations nullified the 1910 annexation treaty doesn't mean the annexation never happened historically—it means the treaty's legal effect was retroactively voided. In other words, the annexation itself remains a historical fact, but its legal consequences are rendered null. Since the retroactive nullification of legal effect extends to its results—including the granting of nationality—“formal nationality” too must be regarded as legally nullified."}, {"text": "또한, 김문수의 주장은 역사적 사실의 불가역성을 근거로 법적 효력의 불가역성을 주장하는 오류를 범하고 있다. 역사적 사실은 바꿀 수 없지만, 그 사실에 대한 법적 해석과 효력은 변경될 수 있다. 1965년 한일기본조약은 바로 이러한 법적 해석의 변경을 공식화한 것이다. 이와 관련하여 연세대 법학전문대학원 이철우 교수는 “선조들이 일본 법제하에 살았고, 만약 일본 법제상 일본 국적이라고 보더라도 한일병합이 불법이라 무효였다면 논리상 일본 국적을 강제로 부여받은 것도 무효가 돼 더 이상 질문할 필요가 없다”며 법리를 명확히 설명하고 있다. 따라서 1965년 한일기본조약으로 일본 제국의 통치 결과의 국제법적 정당성이 부정되었는데도 불구하고 식민지 조선인이 일본인이라는 주장을 하면 앞서 자신이 말한 국적은 법률상의 기록이라는 주장을 스스로 부정하는 셈이다.", "trans": "Kim Moon-soo also commits the error of treating the irreversibility of legal effect as following from the irreversibility of historical fact. Historical facts can't be changed, but the legal interpretation and effect attached to those facts can be. The 1965 Treaty on Basic Relations is precisely a formalization of just such a change in legal interpretation. On this point, Yonsei University Law School professor Lee Cheol-woo clarifies the legal reasoning: “Our ancestors lived under the Japanese legal system, and even if we regard them as having held Japanese nationality under that system, if the annexation was illegal and therefore void, then logically the forced imposition of Japanese nationality is void too—there's nothing more to ask.” So even though the 1965 Treaty on Basic Relations denied the international legal legitimacy of the Japanese Empire's rule, insisting that colonial Koreans were nonetheless Japanese ends up contradicting Kim's own claim that nationality is a matter of legal record."}, {"text": "결론: 형식적 차원을 넘어서기", "isHeading": true, "trans": "Conclusion: Moving Beyond the Formal Dimension"}, {"text": "신분을 규정하는 문제는 단순히 '형식적'¹ 차원에서만 접근할 수 없다. 맥락에 따라 법률상 부부가 아니었어도 실제 부부 관계처럼 간주될 사실혼으로 인정되는 경우가 있고, 아무리 법률상 부부일지라도 당사자 간에 합의가 없을 경우 “혼인무효”가 되는 경우도 있다. 일제 강점기 한반도 거주민의 국적 문제도 마찬가지이다. 단순히 형식적 차원에서 접근할 수 없는 복잡한 문제다. 국적은 단순한 법적 지위를 넘어 개인의 정체성과 깊은 관련이 있기 때문이다. 따라서 이 문제는 법적 차원뿐만 아니라 역사적, 정치적, 사회적 맥락에서도 이해되어야 한다.", "trans": "The question of defining someone's status can't simply be approached on a “formal”¹ level alone. Depending on context, a couple who were never legally married can still be recognized as being in a common-law marriage, treated as though they were an actual married couple; and conversely, even a legally married couple can have their marriage declared “null and void” if there was no genuine agreement between the two parties. The question of nationality for residents of the Korean peninsula under Japanese colonial rule is no different—it's a complex problem that can't be approached on a purely formal level, because nationality is tied to personal identity in ways that go well beyond simple legal status. It must therefore be understood not only in legal terms, but also historically, politically, and socially."}, {"text": "김문수가 촉발시킨 국적 논쟁은 형식적 국적에만 초점을 맞추고 있어 문제의 본질을 간과하고 있지만, “한국인의 정체성이란 무엇인가”라는 근본적인 질문을 탐구하는 시발점이 된다. 형식적 국적 논쟁을 통해 일제 강점기의 한반도 거주민들이 일본인이 아님이 드러났다. 그러나 이것이 곧 그들이 한국인이라고 의미는 아니다. 그들이 무국적자일 수도 “조선인”으로 불릴 수도 있다. 정체성이란 그들이 과거를 어떻게 바라보고, 현재를 어떻게 이해하며, 미래를 어떻게 만들어 갈 것인가에 대한 답을 요구하기 때문에 이는 실질적² 국적의 개념을 고려해야 함을 시사한다.", "trans": "The nationality controversy that Kim Moon-soo set off focuses solely on formal nationality and so misses the heart of the matter—but it does become a starting point for exploring the more fundamental question of “what is Korean identity?” The debate over formal nationality reveals that Korean peninsula residents under Japanese colonial rule were not Japanese. But that doesn't mean they were Korean, either. They may have been stateless, or they may be properly called “Joseon people.” Because identity demands an answer to how people view their past, understand their present, and go on to shape their future, this suggests we also need to consider the concept of “substantive”² nationality."}, {"text": "미주", "isHeading": true, "trans": "Endnotes"}, {"text": "맥락을 고려하지 않고 형식적 차원에서 모든 문제를 바라보는 태도는 지적 게으름이거나 어떤 다른 의도를 함의하고 있다고 여길 수밖에 없다. 김문수의 주장은 대한민국 헌법이 명시한 임시정부의 법통 계승과 1965년 한일기본조약에서 명시한 식민지배의 무효화를 적극적으로 부정한다는 점에서 단순한 게으름을 넘어서는 듯한 인상을 준다. 이는 '식민지 근대화론'과 맥락을 같이하는 뉴라이트 역사관의 연장선상에 있다고 볼 수 있다. 이러한 관점은 일제 강점기를 단순히 승자와 패자의 구도로 해석하며, 식민 지배의 불법성과 부당성을 간과하는 위험을 내포하고 있다.", "isFootnote": true, "num": 1, "trans": "Approaching every issue on a purely formal level, without regard to context, can only be seen as either intellectual laziness or a sign of some other underlying agenda. Kim Moon-soo's claim goes beyond mere laziness in that it actively denies both the Republic of Korea Constitution's explicit succession of the Provisional Government's legitimacy and the nullification of colonial rule spelled out in the 1965 Treaty on Basic Relations. It can be seen as an extension of the New Right view of history, which runs along the same lines as the ‘colonial modernization theory.’ This view interprets the era of Japanese colonial rule simply as a matter of winners and losers, carrying the risk of glossing over the illegality and injustice of colonial rule itself."}, {"text": "단순히 법적으로 시민임을 인정받는 형식적 국적(또는 법적 국적)과는 달리, 실질적 국적은 시민이 법적 지위를 넘어 실제로 권리와 혜택을 누리고 사회에 적극적으로 참여할 수 있는 상태를 말한다. 즉, 단순히 신분증이나 여권을 소지하고 있는 것만으로는 충분하지 않으며, 시민으로서의 권리와 의무를 현실적으로 보장받고 실행할 수 있는 상태를 의미한다.", "isFootnote": true, "num": 2, "trans": "Unlike formal nationality (or legal nationality), which is simply being legally recognized as a citizen, substantive nationality refers to a state in which a citizen goes beyond mere legal status to actually enjoy rights and benefits and take an active part in society. In other words, merely holding an ID card or passport isn't enough—it means actually being guaranteed, and able to exercise, the rights and duties of citizenship in practice."}, {"text": "참고 문헌", "isHeading": true, "trans": "References"}, {"text": "뉴스1. (2024년 9월 5일). 김문수 “호적 떼봐라, 일제 때 우리 국적은 ‘日本’…역사는 역사”. https://www.news1.kr/society/labor/5531125", "isReference": true}, {"text": "오마이뉴스. (2024년 9월 5일). 김문수 “우리 선조의 국적은 일본”… 식민 지배가 합법?. https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003057827", "isReference": true}, {"text": "한겨레. (2024년 9월 5일). 김문수 보란 듯…주류 학계 “일제 때 선조들 국적은 대한민국”. https://www.hani.co.kr/arti/politics/politics_general/1158032.html", "isReference": true}, {"text": "한겨레. (2024년 9월 5일). “일제 때 일본 국적은 무슨…일본인 노예였는데” 호사카, 김문수 반박. https://www.hani.co.kr/arti/politics/politics_general/1157380.html", "isReference": true}, {"text": "한국일보. (2024년 9월 5일). 김문수가 쏘아 올린 국적 논란… 100년 전 우리는 일본인?. https://www.hankookilbo.com/News/Read/A2024090517510002587", "isReference": true}, {"text": "오시진. (2019). 3·1운동 시기 ‘독립’의 국제법적 의미. 한국독립운동사연구, 67, 75-100.", "isReference": true}, {"text": "이창기. (2021). 日帝의 한국 식민지배 基調 및 創氏制度와 그 後果. 동아법학, 11, 93-195.", "isReference": true}, {"text": "제성호. (2012). 상해 임시정부의 국제법적 지위. 중앙법학, 14(1), 1–32.", "isReference": true}, {"text": "Harris, Claire. (2017). “Postcolonial Citizenship and Identity in the Netherlands and France\". WWU Honors College Senior Projects. 50.", "isReference": true}, {"text": "McGuire, K. (2022). Jus Sanguinis, “Effective Nationality” and Exclusion: Analysing Citizenship Deprivation in the UK. Genealogy, 6(3), 62.", "isReference": true}, {"text": "Ryang, S. (2009). Between the Nations: Diaspora and Koreans in Japan. Diaspora without Homeland: Being Korean in Japan, 1-20.", "isReference": true}, {"text": "Sloane, R. D. (2009). Breaking the genuine link: The contemporary international legal regulation of nationality. Harv. Int'l LJ, 50, 1.", "isReference": true}, {"text": "Woodwell, D. (2007). Nationality, nation, and ethnicity. Nationalism in international relations: Norms, foreign policy, and enmity (pp. 13-24). New York: Palgrave Macmillan US.", "isReference": true}], "titleHtml": "100년 전에도 한국 국적을 가진<br>사람들이 있었을까?", "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/c1-korean-nationality-100-years-ago.webp"}];
        const VOCAB_READING_DATA = [{"term": "공개석상", "mainDef": "사람들이 많이 모인 공개적인 자리나 회의.", "variants": ["공개석상"], "subDefs": [{"subTerm": "• 석상(席上)", "subDef": "석(席, 자리) + 상(上, 위).\n여러 사람이 모인 자리라는 뜻이에요."}], "examples": [{"kor": "그 배우는 공개석상에서 처음으로 결혼 사실을 밝혔다.", "eng": "The actor revealed his marriage for the first time at a public event."}], "translations": {"en": {"term": "public occasion", "mainDef": "A public gathering or meeting where many people are present.", "subDefs": [{"term": "석상(席上)", "def": "석 (席, seat) + 상 (上, above).\nIt means a gathering where many people are present."}]}}}, {"term": "제국주의", "mainDef": "한 나라가 힘을 사용하여 다른 나라나 지역을 정복하고 지배하는 정책이나 사상.", "variants": ["제국주의"], "subDefs": [{"subTerm": "• 제국(帝國)", "subDef": "제(帝, 황제) + 국(國, 나라).\n황제가 다스리는 나라, 즉 힘센 큰 나라를 뜻해요."}, {"subTerm": "• 주의(主義)", "subDef": "주(主, 중심) + 의(義, 뜻).\n어떤 생각이나 원칙을 중심으로 삼는 사상을 뜻해요."}], "examples": [{"kor": "19세기 유럽 강대국들은 제국주의를 앞세워 아시아와 아프리카를 침략했다.", "eng": "In the 19th century, European powers invaded Asia and Africa in the name of imperialism."}], "translations": {"en": {"term": "imperialism", "mainDef": "A policy or ideology in which one country uses force to conquer and rule over other countries or regions.", "subDefs": [{"term": "제국(帝國)", "def": "제 (帝, emperor) + 국 (國, country).\nIt means a country ruled by an emperor — a powerful, large nation."}, {"term": "주의(主義)", "def": "주 (主, center) + 의 (義, meaning/principle).\nIt refers to an ideology centered on a certain idea or principle."}]}}}, {"term": "국회", "mainDef": "한 나라의 법을 만드는 기관.", "variants": ["국회"], "subDefs": [{"subTerm": "• 국회(國會)", "subDef": "국(國 나라) + 회(會 모이다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "국회는 다음 주에 새 법안을 표결에 부칠 예정이다.", "eng": "The National Assembly plans to vote on the new bill next week."}], "translations": {"en": {"term": "National Assembly", "mainDef": "A country's law-making body (parliament/national assembly).", "subDefs": [{"term": "국회(國會)", "def": "국 (國, country) + 회 (會, gather).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "환경노동위원회", "mainDef": "국회에서 환경과 노동에 관한 문제를 다루는 회의 또는 기관.", "variants": ["환경노동위원회"], "subDefs": [{"subTerm": "• 위원회(委員會)", "subDef": "위(委, 맡기다) + 원(員, 사람) + 회(會, 모이다).\n어떤 일을 맡아서 결정하는 사람들이 모인 모임이에요."}], "examples": [{"kor": "환경노동위원회는 산업재해 문제를 집중적으로 논의했다.", "eng": "The Environment and Labor Committee focused its discussion on industrial accidents."}], "translations": {"en": {"term": "Environment and Labor Committee", "mainDef": "A National Assembly committee that handles issues related to the environment and labor.", "subDefs": [{"term": "위원회(委員會)", "def": "위 (委, entrust) + 원 (員, member) + 회 (會, gather).\nA group of people entrusted with deciding on a certain matter."}]}}}, {"term": "인사청문회", "mainDef": "중요한 자리에 올라갈 사람을 검증하는 회의.", "variants": ["인사청문회"], "subDefs": [{"subTerm": "• 인사(人事)", "subDef": "인(人, 사람) + 사(事, 일).\n사람을 뽑거나 자리를 정하는 일을 뜻해요."}, {"subTerm": "• 청문회(聽聞會)", "subDef": "청(聽, 듣다) + 문(聞, 듣다) + 회(會, 모이다).\n어떤 문제에 대해 의견을 듣기 위해 모이는 공식적인 자리예요."}], "examples": [{"kor": "새 장관 후보자는 인사청문회에서 여러 질문을 받았다.", "eng": "The new ministerial nominee faced many questions at the confirmation hearing."}], "translations": {"en": {"term": "confirmation hearing", "mainDef": "A hearing held to verify the qualifications of a person nominated for an important post.", "subDefs": [{"term": "인사(人事)", "def": "인 (人, person) + 사 (事, matter).\nIt refers to matters of selecting people or assigning posts."}, {"term": "청문회(聽聞會)", "def": "청 (聽, hear) + 문 (聞, hear) + 회 (會, gather).\nA formal gathering held to hear opinions on a certain issue."}]}}}, {"term": "장관", "mainDef": "정부에서 각 부서의 최고 책임자.", "variants": ["장관"], "subDefs": [{"subTerm": "• 장관(長官)", "subDef": "장(長 길다/우두머리) + 관(官 벼슬).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "교육부 장관이 새로운 정책을 발표했다.", "eng": "The Minister of Education announced a new policy."}], "translations": {"en": {"term": "minister", "mainDef": "The head of a government department (minister).", "subDefs": [{"term": "장관(長官)", "def": "장 (長, long/chief) + 관 (官, 벼슬).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "후보자", "mainDef": "선거나 임명에서 뽑히기 위해 추천된 사람.", "variants": ["후보자"], "subDefs": [{"subTerm": "• 후보자(候補者)", "subDef": "후(候 기다리다) + 보(補 돕다) + 자(者 사람).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "이번 선거에는 세 명의 후보자가 출마했다.", "eng": "Three candidates are running in this election."}], "translations": {"en": {"term": "nominee, candidate", "mainDef": "A person nominated to be chosen in an election or an appointment.", "subDefs": [{"term": "후보자(候補者)", "def": "후 (候, wait) + 보 (補, help) + 자 (者, person).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "지명되다", "mainDef": "어떤 직책이나 역할을 맡을 사람으로 선택되다.", "variants": ["지명되다"], "subDefs": [{"subTerm": "• 지명(指名)", "subDef": "지(指 가리키다) + 명(名 이름).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "그는 대사로 지명되었다.", "eng": "He was appointed (nominated) as ambassador."}], "translations": {"en": {"term": "be nominated", "mainDef": "To be selected/appointed to fill a certain post or role.", "subDefs": [{"term": "지명(指名)", "def": "지 (指, point) + 명 (名, name).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "질의", "mainDef": "회의나 토론에서 어떤 문제에 대해 질문하는 것.", "variants": ["질의"], "subDefs": [{"subTerm": "• 질의(質疑)", "subDef": "질(質 바탕) + 의(疑 의심하다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "의원들은 예산안에 대해 날카로운 질의를 이어갔다.", "eng": "The lawmakers kept raising sharp questions about the budget bill."}], "translations": {"en": {"term": "question/inquiry", "mainDef": "Asking a question about an issue during a meeting or debate.", "subDefs": [{"term": "질의(質疑)", "def": "질 (質, substance) + 의 (疑, doubt).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "일제", "mainDef": "일본 제국을 줄여서 부르는 표현.", "variants": ["일제"], "subDefs": [{"subTerm": "• 제국(帝國)", "subDef": "제(帝, 황제) + 국(國, 나라).\n'일제'는 '일본제국'을 줄인 말로, 여기서 '제'가 '제국'을 가리켜요."}], "examples": [{"kor": "일제 강점기의 역사를 다룬 다큐멘터리가 방영되었다.", "eng": "A documentary covering the history of Japanese colonial rule aired."}], "translations": {"en": {"term": "Japanese Empire", "mainDef": "A shortened way of saying 'the Japanese Empire.'", "subDefs": [{"term": "제국(帝國)", "def": "제 (帝, emperor) + 국 (國, country).\n“일제” is short for “일본제국” (the Japanese Empire) — the “제” here stands for “제국,” empire."}]}}}, {"term": "강점기", "mainDef": "한 나라가 다른 나라를 힘으로 빼앗고 지배하던 시기.", "variants": ["강점기"], "subDefs": [{"subTerm": "• 강점(强占)", "subDef": "강(强, 강하다) + 점(占, 차지하다).\n힘으로 강제로 차지한다는 뜻이에요."}, {"subTerm": "• -기(期)", "subDef": "기(期, 때/기간).\n어떤 일이 계속되는 시기를 나타내는 말이에요."}], "examples": [{"kor": "할머니는 강점기 때 겪었던 어려움을 자주 말씀하셨다.", "eng": "My grandmother often talked about the hardships she experienced during the occupation."}], "translations": {"en": {"term": "occupation period", "mainDef": "A period when one country forcibly seized and ruled over another.", "subDefs": [{"term": "강점(强占)", "def": "강 (强, strong) + 점 (占, occupy).\nIt means to forcibly seize something by force."}, {"term": "-기(期)", "def": "기 (期, period).\nA suffix indicating the period during which something continues."}]}}}, {"term": "식민지", "mainDef": "다른 나라에 의해 지배를 받는 나라나 지역.", "variants": ["식민지"], "subDefs": [{"subTerm": "• 식민지(植民地)", "subDef": "식(植 심다) + 민(民 백성) + 지(地 땅).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "인도는 오랫동안 영국의 식민지였다.", "eng": "India was a British colony for a long time."}], "translations": {"en": {"term": "colony", "mainDef": "A country or region ruled by another country.", "subDefs": [{"term": "식민지(植民地)", "def": "식 (植, plant) + 민 (民, people) + 지 (地, land).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "선조", "mainDef": "이전 세대에 살았던 사람들.", "variants": ["선조"], "subDefs": [{"subTerm": "• 선조(先祖)", "subDef": "선(先 먼저) + 조(祖 조상).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "우리 선조들은 이 땅에서 오랫동안 농사를 지어왔다.", "eng": "Our ancestors farmed this land for a very long time."}], "translations": {"en": {"term": "ancestors", "mainDef": "People who lived in earlier generations (ancestors).", "subDefs": [{"term": "선조(先祖)", "def": "선 (先, first) + 조 (祖, ancestor).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "수상하다", "mainDef": "상을 받다.", "variants": ["수상하다"], "subDefs": [{"subTerm": "• 수상(受賞)", "subDef": "수(受 받다) + 상(賞 상 주다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그 소설가는 올해 큰 문학상을 수상했다.", "eng": "The novelist received a major literary award this year."}], "translations": {"en": {"term": "win an award", "mainDef": "To receive/win an award.", "subDefs": [{"term": "수상(受賞)", "def": "수 (受, receive) + 상 (賞, reward).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "일장기", "mainDef": "일본 또는 일본 제국의 국기.", "variants": ["일장기"], "subDefs": [{"subTerm": "• 일장기(日章旗)", "subDef": "일(日 해/날) + 장(章 글/문양) + 기(旗 깃발).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "경기장에는 여러 나라의 국기와 함께 일장기도 걸려 있었다.", "eng": "The Japanese flag was displayed alongside other countries' flags at the stadium."}], "translations": {"en": {"term": "Japanese flag", "mainDef": "Japan's national flag.", "subDefs": [{"term": "일장기(日章旗)", "def": "일 (日, sun/day) + 장 (章, writing/pattern) + 기 (旗, flag).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "병합하다", "mainDef": "한 나라가 다른 나라를 합치다.", "variants": ["병합하다"], "subDefs": [{"subTerm": "• 병합(倂合)", "subDef": "병(倂 합치다) + 합(合 합치다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "두 회사는 결국 하나로 병합되었다.", "eng": "The two companies were eventually merged into one."}], "translations": {"en": {"term": "annex", "mainDef": "For one country (or entity) to combine/absorb another.", "subDefs": [{"term": "병합(倂合)", "def": "병 (倂, combine) + 합 (合, combine).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "무효화시키다", "mainDef": "법적 효력이 없도록 만들다.", "variants": ["무효화시키다"], "subDefs": [{"subTerm": "• 무효화(無效化)", "subDef": "무(無 없다) + 효(效 효험/본받다) + 화(化 되다/바뀌다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "법원은 그 계약을 무효화시켰다.", "eng": "The court nullified the contract."}], "translations": {"en": {"term": "nullify", "mainDef": "To make something have no legal effect.", "subDefs": [{"term": "무효화(無效化)", "def": "무 (無, none) + 효 (效, effect) + 화 (化, become/change).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "조약", "mainDef": "나라와 나라 사이에 맺는 공식적인 약속이나 협정.", "variants": ["조약"], "subDefs": [{"subTerm": "• 조약(條約)", "subDef": "조(條 가지/조항) + 약(約 약속).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "두 나라는 평화 조약에 서명했다.", "eng": "The two countries signed a peace treaty."}], "translations": {"en": {"term": "treaty", "mainDef": "A formal agreement or pact made between countries.", "subDefs": [{"term": "조약(條約)", "def": "조 (條, branch/clause) + 약 (約, promise).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "유효하다", "mainDef": "법적으로나 공식적으로 효력이 있다.", "variants": ["유효하다"], "subDefs": [{"subTerm": "• 유효(有效)", "subDef": "유(有 있다) + 효(效 효험/본받다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "이 할인 쿠폰은 다음 달까지 유효하다.", "eng": "This discount coupon is valid until next month."}], "translations": {"en": {"term": "valid", "mainDef": "To be legally or officially in effect (valid).", "subDefs": [{"term": "유효(有效)", "def": "유 (有, exist) + 효 (效, effect).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "형식적", "mainDef": "겉으로 보이는 모습이나 형식만 갖춘 것.", "variants": ["형식적"], "subDefs": [{"subTerm": "• 형식(形式)", "subDef": "형(形, 모양) + 식(式, 형식).\n겉으로 드러나는 모양이나 격식을 뜻해요."}], "examples": [{"kor": "회의가 이미 결론이 난 상태라 토론은 형식적으로만 진행되었다.", "eng": "Since the conclusion was already decided, the discussion was held only as a formality."}], "translations": {"en": {"term": "formal", "mainDef": "Something that only has an outward form, without substance.", "subDefs": [{"term": "형식(形式)", "def": "형 (形, shape) + 식 (式, form).\nIt refers to the outward shape or formality of something."}]}}}, {"term": "피지배국", "mainDef": "다른 나라의 지배를 받는 나라.", "variants": ["피지배국"], "subDefs": [{"subTerm": "• 피-(被)", "subDef": "피(被, 당하다).\n'~을 당하다'라는 뜻을 더하는 접두사예요."}, {"subTerm": "• 지배국(支配國)", "subDef": "지(支, 가지다) + 배(配, 나누다) + 국(國, 나라).\n다른 나라를 다스리는 나라를 뜻해요."}], "examples": [{"kor": "피지배국의 국민들은 오랫동안 자유를 제한당했다.", "eng": "The people of the ruled country had their freedom restricted for a long time."}], "translations": {"en": {"term": "colonized country", "mainDef": "A country that is ruled by another country.", "subDefs": [{"term": "피-(被)", "def": "피 (被, to suffer/undergo).\nA prefix that adds the meaning “to have something done to oneself.”"}, {"term": "지배국(支配國)", "def": "지 (支, hold) + 배 (配, distribute) + 국 (國, country).\nIt refers to a country that rules over another country."}]}}}, {"term": "지배국", "mainDef": "다른 나라를 지배하는 나라.", "variants": ["지배국"], "subDefs": [{"subTerm": "• 지배(支配)", "subDef": "지(支, 가지다) + 배(配, 나누다).\n어떤 대상을 자기 뜻대로 다스린다는 뜻이에요."}, {"subTerm": "• -국(國)", "subDef": "국(國, 나라).\n'나라'를 뜻하는 말이에요."}], "examples": [{"kor": "지배국은 식민지의 자원을 마음대로 가져갔다.", "eng": "The ruling country took the colony's resources as it pleased."}], "translations": {"en": {"term": "ruling country", "mainDef": "A country that rules over another country.", "subDefs": [{"term": "지배(支配)", "def": "지 (支, hold) + 배 (配, distribute).\nIt means to rule or control something according to one’s own will."}, {"term": "-국(國)", "def": "국 (國, country).\nA suffix meaning “country.”"}]}}}, {"term": "동일시하다", "mainDef": "두 가지 것을 같다고 생각하다.", "variants": ["동일시하다"], "subDefs": [{"subTerm": "• 동일시(同一視)", "subDef": "동(同 같다) + 일(一 하나) + 시(視 보다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "사람들은 종종 성공을 행복과 동일시한다.", "eng": "People often equate success with happiness."}], "translations": {"en": {"term": "identify", "mainDef": "To regard two things as being the same.", "subDefs": [{"term": "동일시(同一視)", "def": "동 (同, same) + 일 (一, one) + 시 (視, see).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "근간", "mainDef": "어떤 것의 가장 중요한 기초.", "variants": ["근간"], "subDefs": [{"subTerm": "• 근간(根幹)", "subDef": "근(根 뿌리) + 간(幹 줄기/근본).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "신뢰는 좋은 인간관계의 근간이다.", "eng": "Trust is the foundation of good relationships."}], "translations": {"en": {"term": "foundation", "mainDef": "The most important basis or foundation of something.", "subDefs": [{"term": "근간(根幹)", "def": "근 (根, root) + 간 (幹, stem/root).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "존립", "mainDef": "어떤 것이 계속 있거나 유지되는 것.", "variants": ["존립"], "subDefs": [{"subTerm": "• 존립(存立)", "subDef": "존(存 있다) + 립(立 서다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "회사의 존립이 이번 계약에 달려 있다.", "eng": "The company's very existence depends on this contract."}], "translations": {"en": {"term": "existence", "mainDef": "The continued existence or survival of something.", "subDefs": [{"term": "존립(存立)", "def": "존 (存, exist) + 립 (立, stand).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "후속", "mainDef": "뒤에 이어서 오는 것.", "variants": ["후속"], "subDefs": [{"subTerm": "• 후속(後續)", "subDef": "후(後 뒤) + 속(續 잇다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "정부는 후속 대책을 발표하겠다고 했다.", "eng": "The government said it would announce follow-up measures."}], "translations": {"en": {"term": "subsequent", "mainDef": "Something that comes next, following after.", "subDefs": [{"term": "후속(後續)", "def": "후 (後, behind) + 속 (續, succeed).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "법적 지위", "mainDef": "법에서 인정하는 어떤 사람이나 단체의 사회적 위치.", "variants": ["법적 지위"], "subDefs": [{"subTerm": "• 법적(法的)", "subDef": "법(法, 법) + 적(的, ~의).\n법과 관련된다는 뜻이에요."}, {"subTerm": "• 지위(地位)", "subDef": "지(地, 땅) + 위(位, 자리).\n사회에서 차지하는 자리나 위치를 뜻해요."}], "examples": [{"kor": "이 조직은 아직 법적 지위를 인정받지 못했다.", "eng": "This organization has not yet been granted legal status."}], "translations": {"en": {"term": "legal status", "mainDef": "A person's or group's social standing as recognized by law.", "subDefs": [{"term": "법적(法的)", "def": "법 (法, law) + 적 (的, -related).\nIt means related to the law."}, {"term": "지위(地位)", "def": "지 (地, ground) + 위 (位, position).\nIt refers to the position or standing one holds in society."}]}}}, {"term": "효력", "mainDef": "규칙이 실제로 영향을 미치는 힘.", "variants": ["효력"], "subDefs": [{"subTerm": "• 효력(效力)", "subDef": "효(效 효험/본받다) + 력(力 힘).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "새 규정은 다음 달부터 효력이 발생한다.", "eng": "The new regulation will take effect starting next month."}], "translations": {"en": {"term": "effect", "mainDef": "The force by which a rule actually has an effect.", "subDefs": [{"term": "효력(效力)", "def": "효 (效, effect) + 력 (力, power).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "소급적", "mainDef": "과거의 일에까지 영향을 미치는.", "variants": ["소급적"], "subDefs": [{"subTerm": "• 소급(遡及)", "subDef": "소(遡, 거슬러 올라가다) + 급(及, 미치다).\n과거로 거슬러 올라가서 영향을 미친다는 뜻이에요."}], "examples": [{"kor": "이 법은 소급적으로 적용되지 않는다.", "eng": "This law is not applied retroactively."}], "translations": {"en": {"term": "retroactive", "mainDef": "Having an effect that reaches back into the past.", "subDefs": [{"term": "소급(遡及)", "def": "소 (遡, trace back) + 급 (及, reach).\nIt means to reach back into the past and have an effect there."}]}}}, {"term": "법리적 관점", "mainDef": "법의 원리에 따라 바라보는 시각.", "variants": ["법리적 관점"], "subDefs": [{"subTerm": "• 법리(法理)", "subDef": "법(法, 법) + 리(理, 이치).\n법의 원리나 이치를 뜻해요."}], "examples": [{"kor": "변호사는 법리적 관점에서 그 판결을 비판했다.", "eng": "The lawyer criticized the riants": ["국호"], "subDefs": [{"subTerm": "• 국호(國號)", "subDef": "국(國 나라) + 호(號 이름).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그 나라는 독립하면서 국호를 새로 정했다.", "eng": "The country adopted a new national name upon gaining independence."}], "translations": {"en": {"term": "country name", "mainDef": "A country's official name.", "subDefs": [{"term": "국호(國號)", "def": "국 (國, country) + 호 (號, name).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "합병되다", "mainDef": "한 나라가 다른 나라에 강제로 합쳐지다.", "variants": ["합병되다"], "subDefs": [{"subTerm": "• 합병(合倂)", "subDef": "합(合 합치다) + 병(倂 합치다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "작은 왕국은 이웃 나라에 합병되었다.", "eng": "The small kingdom was annexed by its neighboring country."}], "translations": {"en": {"term": "be annexed", "mainDef": "For one country to be forcibly merged into another.", "subDefs": [{"term": "합병(合倂)", "def": "합 (合, combine) + 병 (倂, combine).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "전역에서", "mainDef": "전체 지역에서.", "variants": ["전역에서"], "subDefs": [{"subTerm": "• 전역(全域)", "subDef": "전(全 온전하다) + 역(域 구역).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "전역에서 큰 비가 내릴 것으로 예상된다.", "eng": "Heavy rain is expected throughout the entire region."}], "translations": {"en": {"term": "throughout", "mainDef": "Throughout the whole area/region.", "subDefs": [{"term": "전역(全域)", "def": "전 (全, whole) + 역 (域, zone).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "독립하다", "mainDef": "다른 나라에서 벗어나 스스로 결정을 내리며 살아가다.", "variants": ["독립하다"], "subDefs": [{"subTerm": "• 독립(獨立)", "subDef": "독(獨 홀로) + 립(立 서다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "그 식민지는 오랜 투쟁 끝에 독립했다.", "eng": "The colony finally gained independence after a long struggle."}], "translations": {"en": {"term": "become independent", "mainDef": "To become free from another country and govern oneself." uarantees the basic rights of citizens."}], "translations": {"en": {"term": "constitution", "mainDef": "A country's most fundamental law.", "subDefs": [{"term": "헌법(憲法)", "def": "헌 (憲, law) + 법 (法, law).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "건립되다", "mainDef": "건물이나 단체 등이 세워지다.", "variants": ["건립되다"], "subDefs": [{"subTerm": "• 건립(建立)", "subDef": "건(建 세우다) + 립(立 서다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "시청 앞에 새 도서관이 건립되었다.", "eng": "A new library was established in front of city hall."}], "translations": {"en": {"term": "be established", "mainDef": "For a building or organization to be founded/erected.", "subDefs": [{"term": "건립(建立)", "def": "건 (建, establish) + 립 (立, stand).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "법통", "mainDef": "법적으로 인정되는 정통성.", "variants": ["법통"], "subDefs": [{"subTerm": "• 법통(法統)", "subDef": "법(法 법) + 통(統 거느리다/큰줄기).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "그 정부는 이전 정권의 법통을 이어받았다고 주장했다.", "eng": "The government claimed to inherit the legitimacy of the previous regime."}], "translations": {"en": {"term": "legitimacy", "mainDef": "Legally recognized legitimacy.", "subDefs": [{"term": "법통(法統)", "def": "법 (法, law) + 통 (統, lead/mainline).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "계승하다", "mainDef": "이전의 것을 이어받아 계속하다.", "variants": ["계승하다"], "subDefs": [{"subTerm": "• 계승(繼承)", "subDef": "계(繼 잇다) + 승(承 잇다/받들다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "그는 아버지의 사업을 계승했다.", "eng": "He took over and continued his father's business."}], "translations": {"en": {"term": "succeed", "mainDef": "To inherit and carry on something from before.", "subDefs": [{"term": "계승(繼承)", "def": "계 (繼, succeed) + 승 (承, succeed/uphold).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "정치공동체", "mainDef": "같은 정치적 목표를 위해 Def": "A person owned by someone else, whose freedom has been taken away.", "subDefs": [{"term": "노예(奴隸)", "def": "노 (奴, slave) + 예 (隸, be subordinate).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "의회", "mainDef": "법이나 규칙을 만드는 기관.", "variants": ["의회"], "subDefs": [{"subTerm": "• 의회(議會)", "subDef": "의(議 의논하다) + 회(會 모이다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "의회는 새 예산안을 통과시켰다.", "eng": "Parliament passed the new budget bill."}], "translations": {"en": {"term": "parliament", "mainDef": "A body that makes laws and rules (parliament/assembly).", "subDefs": [{"term": "의회(議會)", "def": "의 (議, discuss) + 회 (會, gather).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "자치 제도", "mainDef": "중앙정부로부터 벗어나서 지역이나 지방이 스스로 다스리는 시스템.", "variants": ["자치 제도"], "subDefs": [{"subTerm": "• 자치(自治)", "subDef": "자(自, 스스로) + 치(治, 다스리다).\n스스로 다스린다는 뜻이에요."}], "examples": [{"kor": "이 지역은 오랜 자치 제도의 전통을 갖고 있다.", "eng": "This region has a long tradition of self-governance."}], "translations": {"en": {"term": "self-governance system", "mainDef": "A system in which a region governs itself, independent of the central government.", "subDefs": [{"term": "자치(自治)", "def": "자 (自, self) + 치 (治, govern).\nIt means to govern oneself."}]}}}, {"term": "의원", "mainDef": "의회에서 법을 만드는 사람.", "variants": ["의원"], "subDefs": [{"subTerm": "• 의원(議員)", "subDef": "의(議 의논하다) + 원(員 사람/인원).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "그 의원은 새로운 법안을 발의했다.", "eng": "The lawmaker introduced a new bill."}], "translations": {"en": {"term": "member of parliament", "mainDef": "A member of parliament who makes laws.", "subDefs": [{"term": "의원(議員)", "def": "의 (議, discuss) + 원 (員, member).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "선거권", "mainDef": "선거에서 투표할 수 있는 권리.", "variants": ["선거권"], "subDefs": [{"subTerm": "• 선거(選擧)", "subDef": "선(選, 가리다) + 거(擧, 들다).\n여러 사람 중에서 대표를 뽑는 일을 뜻해요."}, {"subTerm": "• -권(權)", "subDef": "권(權, 권리).\n'권리'를 뜻하는 말이에요."}], "examples": [{"kor": "만 18세부터 선거권을 갖는다.", "eng": "People are granted the right to vote from age 18."}], "translations": {"en": {"term": "right to vote", "mainDef": "The right to vote in an election.", "subDefs": [{"term": "선거(選擧)", "def": "선 (選, select) + 거 (擧, raise).\nIt refers to choosing a representative from among many people."}, {"term": "-권(權)", "def": "권 (權, right).\nA suffix meaning “right.”"}]}}}, {"term": "피선거권", "mainDef": "선거에 후보로 나갈 수 있는 권리.", "variants": ["피선거권"], "subDefs": [{"subTerm": "• 피-(被)", "subDef": "피(被, 당하다).\n'~이/가 되다, ~을 당하다'라는 뜻을 더하는 접두사예요."}, {"subTerm": "• 선거권(選擧權)", "subDef": "선(選, 가리다) + 거(擧, 들다) + 권(權, 권리).\n선거에서 투표할 수 있는 권리를 뜻해요."}], "examples": [{"kor": "피선거권을 얻으려면 일정 나이 이상이어야 한다.", "eng": "One must be above a certain age to be eligible to run for office."}], "translations": {"en": {"term": "right to be elected", "mainDef": "The right to be a candidate in an election.", "subDefs": [{"term": "피-(被)", "def": "피 (被, to undergo).\nA prefix that adds the meaning “to become/undergo ~.”"}, {"term": "선거권(選擧權)", "def": "선 (選, select) + 거 (擧, raise) + 권 (權, right).\nIt refers to the right to vote in an election."}]}}}, {"term": "징병", "mainDef": "강제로 군대에 가는 것.", "variants": ["징병"], "subDefs": [{"subTerm": "• 징병(徵兵)", "subDef": "징(徵 부르다/거두다) + 병(兵 군사).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그 나라는 전쟁이 나자 징병을 시작했다.", "eng": "The country began conscription once the war broke out."}], "translations": {"en": {"term": "conscription", "mainDef": "Being forced to join the military.", "subDefs": [{"term": "징병(徵兵)", "def": "징 (徵, summon/collect) + 병 (兵, soldier).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "징용", "mainDef": "강제로 일을 시키는 것.", "variants": ["징용"], "subDefs": [{"subTerm": "• 징용(徵用)", "subDef": "징(徵 부르다/거두다) + 용(用 쓰다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "많은 조선인이 강제로 징용되어 탄광에서 일했다.", "eng": "Many Koreans were forcibly conscripted to labor in coal mines."}], "translations": {"en": {"term": "forced labor", "mainDef": "Forcing someone to labor.", "subDefs": [{"term": "징용(徵用)", "def": "징 (徵, summon/collect) + 용 (用, use).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "의무를 부과하다", "mainDef": "꼭 해야 할 일을 주다.", "variants": ["의무를 부과하다"], "subDefs": [{"subTerm": "• 부과(附課)", "subDef": "부(附, 붙다) + 과(課, 매기다).\n세금이나 책임 같은 것을 매겨서 지우다는 뜻이에요."}], "examples": [{"kor": "회사는 직원들에게 새로운 의무를 부과했다.", "eng": "The company imposed a new obligation on its employees."}], "translations": {"en": {"term": "impose obligations", "mainDef": "To give someone something they must do.", "subDefs": [{"term": "부과 (附課)", "def": "부 (附, attach) + 과 (課, assess).\nIt means to impose something like a tax or duty on someone."}]}}}, {"term": "본토", "mainDef": "나라의 중심이 되는 지역이나 땅.", "variants": ["본토"], "subDefs": [{"subTerm": "• 본토(本土)", "subDef": "본(本 근본) + 토(土 땅).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "그는 섬에서 태어나 본토로 유학을 떠났다.", "eng": "He was born on an island and went to the mainland to study."}], "translations": {"en": {"term": "mainland", "mainDef": "A country's central/main territory (mainland).", "subDefs": [{"term": "본토(本土)", "def": "본 (本, root) + 토 (土, land).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "고문 제도", "mainDef": "고통을 줘서 정보를 얻는 시스템.", "variants": ["고문 제도"], "subDefs": [{"subTerm": "• 고문(拷問)", "subDef": "고(拷, 치다) + 문(問, 묻다).\n때리거나 아프게 해서 억지로 정보를 얻어내는 것을 뜻해요."}], "examples": [{"kor": "그 정권은 반대자들에게 고문 제도를 이용했다.", "eng": "The regime used a system of torture against its opponents."}], "translations": {"en": {"term": "torture system", "mainDef": "A system of causing pain in order to extract information.", "subDefs": [{"term": "고문(拷問)", "def": "고 (拷, strike) + 문 (問, ask).\nIt means to forcibly extract information by beating or hurting someone."}]}}}, {"term": "형법적", "mainDef": "범죄와 관련된 법에 해당하는.", "variants": ["형법적"], "subDefs": [{"subTerm": "• 형법(刑法)", "subDef": "형(刑, 형벌) + 법(法, 법).\n범죄와 그에 대한 벌을 정한 법을 뜻해요."}], "examples": [{"kor": "이 사건은 형법적으로도 문제가 될 수 있다.", "eng": "This case could also be a problem under criminal law."}], "translations": {"en": {"term": "criminal law", "mainDef": "Relating to criminal law.", "subDefs": [{"term": "형법(刑法)", "def": "형 (刑, punishment) + 법 (法, law).\nIt refers to the law that defines crimes and their punishments."}]}}}, {"term": "차치하다", "mainDef": "어떤 문제를 당장 다루지 않고 미뤄두다.", "variants": ["차치하다"], "subDefs": [{"subTerm": "• 차치(措置)", "subDef": "차(措 두다/처리하다) + 치(置 두다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "비용 문제는 차치하고 우선 계획부터 세우자.", "eng": "Let's set aside the cost issue for now and make a plan first."}], "translations": {"en": {"term": "put aside", "mainDef": "To set an issue aside without dealing with it right away.", "subDefs": [{"term": "차치(措置)", "def": "차 (措, place/handle) + 치 (置, place).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "멸망하다", "mainDef": "나라나 단체가 없어지다.", "variants": ["멸망하다"], "subDefs": [{"subTerm": "• 멸망(滅亡)", "subDef": "멸(滅 없어지다) + 망(亡 망하다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "로마 제국은 결국 멸망했다.", "eng": "The Roman Empire eventually fell."}], "translations": {"en": {"term": "perish", "mainDef": "For a country or organization to collapse and disappear.", "subDefs": [{"term": "멸망(滅亡)", "def": "멸 (滅, disappear) + 망 (亡, perish).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "통치하에", "mainDef": "어떤 힘에 의해 다스려지는 상태에서.", "variants": ["통치하에"], "subDefs": [{"subTerm": "• 통치(統治)", "subDef": "통(統, 거느리다) + 치(治, 다스리다).\n나라나 사회를 다스린다는 뜻이에요."}, {"subTerm": "• -하(下)", "subDef": "하(下, 아래).\n'~의 아래, ~의 영향 아래'라는 뜻을 더하는 말이에요."}], "examples": [{"kor": "그 지역은 오랫동안 외세의 통치하에 있었다.", "eng": "The region was under foreign rule for a long time."}], "translations": {"en": {"term": "under the rule", "mainDef": "Under the rule of a certain power.", "subDefs": [{"term": "통치(統治)", "def": "통 (統, lead) + 치 (治, govern).\nIt means to govern a country or society."}, {"term": "-하(下)", "def": "하 (下, below).\nA suffix adding the meaning “under ~ / beneath ~.”"}]}}}, {"term": "신민", "mainDef": "왕이 다스리는 나라의 사람들.", "variants": ["신민"], "subDefs": [{"subTerm": "• 신민(臣民)", "subDef": "신(臣 신하) + 민(民 백성).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "왕은 신민들의 안전을 책임져야 했다.", "eng": "The king had to take responsibility for the safety of his subjects."}], "translations": {"en": {"term": "subject", "mainDef": "The people of a country ruled by a king (subjects).", "subDefs": [{"term": "신민(臣民)", "def": "신 (臣, subject) + 민 (民, people).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "수립되다", "mainDef": "새로운 제도나 조직이 만들어지다.", "variants": ["수립되다"], "subDefs": [{"subTerm": "• 수립(樹立)", "subDef": "수(樹 나무/세우다) + 립(立 서다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "새 정부가 수립된 지 1년이 지났다.", "eng": "A year has passed since the new government was established."}], "translations": {"en": {"term": "be established", "mainDef": "For a new system or organization to be founded.", "subDefs": [{"term": "수립(樹立)", "def": "수 (樹, tree/establish) + 립 (立, stand).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "국제법", "mainDef": "여러 나라가 따르는 규칙.", "variants": ["국제법"], "subDefs": [{"subTerm": "• 국제(國際)", "subDef": "국(國, 나라) + 제(際, 사이).\n여러 나라들 사이의 관계를 뜻해요."}], "examples": [{"kor": "국제법은 전쟁 중 민간인 보호를 규정하고 있다.", "eng": "International law stipulates the protection of civilians during war."}], "translations": {"en": {"term": "international law", "mainDef": "Rules that multiple countries follow (international law).", "subDefs": [{"term": "국제(國際)", "def": "국 (國, country) + 제 (際, between).\nIt refers to the relations between multiple countries."}]}}}, {"term": "승인", "mainDef": "어떤 것을 인정하고 받아들이는 것.", "variants": ["승인"], "subDefs": [{"subTerm": "• 승인(承認)", "subDef": "승(承 잇다/받들다) + 인(認 알다/인정하다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그 계획은 이사회의 승인을 받아야 한다.", "eng": "The plan must receive approval from the board."}], "translations": {"en": {"term": "recognition", "mainDef": "Recognizing and accepting something (approval/recognition).", "subDefs": [{"term": "승인(承認)", "def": "승 (承, succeed/uphold) + 인 (認, acknowledge).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "내포하다", "mainDef": "어떤 뜻을 속에 포함하고 있다.", "variants": ["내포하다"], "subDefs": [{"subTerm": "• 내포(內包)", "subDef": "내(內 안) + 포(包 싸다/포함하다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "그의 말은 여러 의미를 내포하고 있었다.", "eng": "His words implied several meanings."}], "translations": {"en": {"term": "imply", "mainDef": "To contain a certain meaning within.", "subDefs": [{"term": "내포(內包)", "def": "내 (內, inside) + 포 (包, wrap/include).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "확고한", "mainDef": "굳게 정해져 있어 흔들리지 않는.", "variants": ["확고한"], "subDefs": [{"subTerm": "• 확고(確固)", "subDef": "확(確 확실하다) + 고(固 굳다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "그녀는 확고한 신념을 가지고 있다.", "eng": "She holds firm convictions."}], "translations": {"en": {"term": "firm", "mainDef": "Firmly set and unshakable.", "subDefs": [{"term": "확고(確固)", "def": "확 (確, certain) + 고 (固, firm).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "종식되다", "mainDef": "사건이나 전쟁 등이 끝나다.", "variants": ["종식되다"], "subDefs": [{"subTerm": "• 종식(終息)", "subDef": "종(終 마치다) + 식(息 쉬다/그치다).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "오랜 전쟁이 마침내 종식되었다.", "eng": "The long war finally came to an end."}], "translations": {"en": {"term": "come to an end", "mainDef": "For an event or war to come to an end.", "subDefs": [{"term": "종식(終息)", "def": "종 (終, end) + 식 (息, rest/stop).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "민족 자결주의", "mainDef": "한 민족이 다른 나라의 간섭 없이 스스로 자기 운명을 결정할 권리가 있다는 사상.", "variants": ["민족 자결주의"], "subDefs": [{"subTerm": "• 자결주의(自決主義)", "subDef": "자(自, 스스로) + 결(決, 정하다) + 주의(主義, 원칙으로 삼는 사상).\n스스로 결정한다는 원칙을 중심 사상으로 삼는다는 뜻이에요."}], "examples": [{"kor": "제1차 세계대전 이후 민족 자결주의가 널리 퍼졌다.", "eng": "The principle of national self-determination spread widely after World War I."}], "translations": {"en": {"term": "principle of national self-determination", "mainDef": "The idea that a people has the right to decide its own fate without interference from other nations.", "subDefs": [{"term": "자결주의(自決主義)", "def": "자 (自, self) + 결 (決, decide) + 주의 (主義, guiding principle).\nIt means holding “deciding for oneself” as a guiding principle."}]}}}, {"term": "독립운동가", "mainDef": "자기의 나라가 다른 나라의 지배로부터 벗어나게 하기 위해 싸우는 사람.", "variants": ["독립운동가"], "subDefs": [{"subTerm": "• 독립(獨立)", "subDef": "독(獨, 홀로) + 립(立, 서다).\n다른 것에 기대지 않고 혼자 선다는 뜻이에요."}, {"subTerm": "• 운동가(運動家)", "subDef": "운(運, 움직이다) + 동(動, 움직이다) + 가(家, 전문가).\n어떤 목표를 위해 적극적으로 활동하는 사람을 뜻해요."}], "examples": [{"kor": "그는 평생을 독립운동가로 살았다.", "eng": "He lived his whole life as an independence activist."}], "translations": {"en": {"term": "independence activist", "mainDef": "A person who fights to free their country from another nation's rule.", "subDefs": [{"term": "독립(獨立)", "def": "독 (獨, alone) + 립 (立, stand).\nIt means to stand on one’s own, without relying on anything else."}, {"term": "운동가(運動家)", "def": "운 (運, move) + 동 (動, move) + 가 (家, expert/-ist).\nIt refers to a person who actively works toward a certain goal."}]}}}, {"term": "영토", "mainDef": "한 나라의 땅.", "variants": ["영토"], "subDefs": [{"subTerm": "• 영토(領土)", "subDef": "영(領 거느리다) + 토(土 땅).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "두 나라는 영토 문제로 오랫동안 갈등을 겪었다.", "eng": "The two countries have long been in conflict over territorial issues."}], "translations": {"en": {"term": "territory", "mainDef": "A country's territory/land.", "subDefs": [{"term": "영토(領土)", "def": "영 (領, lead) + 토 (土, land).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "실효적", "mainDef": "실제로 효과가 있는.", "variants": ["실효적"], "subDefs": [{"subTerm": "• 실효(實效)", "subDef": "실(實, 실제) + 효(效, 효험).\n실제로 나타나는 효과를 뜻해요."}], "examples": [{"kor": "정부는 실효적인 대책을 내놓아야 한다.", "eng": "The government must come up with effective measures."}], "translations": {"en": {"term": "effective", "mainDef": "Having a real, actual effect.", "subDefs": [{"term": "실효(實效)", "def": "실 (實, actual) + 효 (效, effect).\nIt refers to an effect that actually appears in reality."}]}}}, {"term": "지배하다", "mainDef": "어떤 대상을 자기 뜻대로 다스리다.", "variants": ["지배하다"], "subDefs": [{"subTerm": "• 지배(支配)", "subDef": "지(支 가지/지탱하다) + 배(配 짝/나누다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "한 회사가 그 시장을 완전히 지배하고 있다.", "eng": "One company completely dominates that market."}], "translations": {"en": {"term": "rule", "mainDef": "To rule or control something according to one's own will.", "subDefs": [{"term": "지배(支配)", "def": "지 (支, support) + 배 (配, pair/divide).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "부여하다", "mainDef": "권리나 역할을 주다.", "variants": ["부여하다"], "subDefs": [{"subTerm": "• 부여(附與)", "subDef": "부(附 붙다) + 여(與 주다/더불다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "법은 모든 국민에게 평등한 권리를 부여한다.", "eng": "The law grants equal rights to all citizens."}], "translations": {"en": {"term": "grant", "mainDef": "To grant a right or role.", "subDefs": [{"term": "부여(附與)", "def": "부 (附, attach) + 여 (與, give/together).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "칭하다", "mainDef": "무엇인가를 어떤 이름으로 부르다.", "variants": ["칭하다"], "subDefs": [{"subTerm": "• 칭(稱)", "subDef": "칭(稱 일컫다).\n이렇게 글자 뜻을 합치면 오늘날의 의미로 이어져요."}], "examples": [{"kor": "사람들은 그를 영웅이라 칭했다.", "eng": "People called him a hero."}], "translations": {"en": {"term": "call", "mainDef": "To call something by a certain name.", "subDefs": [{"term": "칭(稱)", "def": "칭 (稱, call).\nAdding up the characters' meanings this way leads to today's meaning."}]}}}, {"term": "출전하다", "mainDef": "대회나 전쟁 등에 나가다.", "variants": ["출전하다"], "subDefs": [{"subTerm": "• 출전(出戰)", "subDef": "출(出 나가다) + 전(戰 싸움).\n글자 뜻을 그대로 합치면 지금 쓰는 의미가 만들어져요."}], "examples": [{"kor": "그 선수는 올림픽에 출전했다.", "eng": "The athlete competed in the Olympics."}], "translations": {"en": {"term": "compete", "mainDef": "To take part in a competition or war.", "subDefs": [{"term": "출전(出戰)", "def": "출 (出, go out) + 전 (戰, 싸움).\nPutting the meanings of the characters together gives the word's current meaning."}]}}}, {"term": "모순", "mainDef": "두 주장이 서로 맞지 않는 상태.", "variants": ["모순"], "subDefs": [{"subTerm": "• 모순(矛盾)", "subDef": "모(矛 창) + 순(盾 방패).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그의 말에는 여러 모순이 있었다.", "eng": "There were several contradictions in what he said."}], "translations": {"en": {"term": "contradiction", "mainDef": "A state in which two claims don't match (contradiction).", "subDefs": [{"term": "모순(矛盾)", "def": "모 (矛, spear) + 순 (盾, shield).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "합리화하다", "mainDef": "논리적으로 설명하다.", "variants": ["합리화하다"], "subDefs": [{"subTerm": "• 합리화(合理化)", "subDef": "합(合 합치다) + 리(理 이치/다스리다) + 화(化 되다/바뀌다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "그는 자신의 실수를 합리화하려 애썼다.", "eng": "He tried hard to rationalize his mistake."}], "translations": {"en": {"term": "rationalize", "mainDef": "To explain something logically (often to justify it).", "subDefs": [{"term": "합리화(合理化)", "def": "합 (合, combine) + 리 (理, principle/govern) + 화 (化, become/change).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "헌법상", "mainDef": "헌법에 의해 인정된.", "variants": ["헌법상"], "subDefs": [{"subTerm": "• 헌법(憲法)", "subDef": "헌(憲, 법) + 법(法, 법).\n나라의 가장 기본이 되는 법을 뜻해요."}, {"subTerm": "• -상(上)", "subDef": "상(上, 위).\n'~의 면에서, ~에 따라'라는 뜻을 더하는 말이에요."}], "examples": [{"kor": "이것은 헌법상 보장된 권리이다.", "eng": "This is a right guaranteed under the constitution."}], "translations": {"en": {"term": "constitutional", "mainDef": "As recognized by the constitution.", "subDefs": [{"term": "헌법(憲法)", "def": "헌 (憲, law) + 법 (法, law).\nIt refers to the most fundamental law of a country."}, {"term": "-상(上)", "def": "상 (上, above).\nA suffix adding the meaning “in terms of ~ / according to ~.”"}]}}}, {"term": "대외적", "mainDef": "다른 나라와 관련된.", "variants": ["대외적"], "subDefs": [{"subTerm": "• 대외(對外)", "subDef": "대(對, 마주하다) + 외(外, 바깥).\n바깥, 즉 다른 나라나 단체를 상대한다는 뜻이에요."}], "examples": [{"kor": "정부는 대외적 이미지를 신경 쓴다.", "eng": "The government pays attention to its image abroad."}], "translations": {"en": {"term": "external", "mainDef": "Relating to other/outside countries.", "subDefs": [{"term": "대외(對外)", "def": "대 (對, face) + 외 (外, outside).\nIt means dealing with the outside — other countries or groups."}]}}}, {"term": "조약을 체결하다", "mainDef": "나라와 나라 사이에 약속을 맺다.", "variants": ["조약을 체결하다"], "subDefs": [{"subTerm": "• 체결(締結)", "subDef": "체(締, 맺다) + 결(結, 맺다).\n두 글자 모두 \"맺다\"는 뜻으로, 계약이나 조약을 공식적으로 맺는다는 의미예요."}], "examples": [{"kor": "양국은 자유무역협정을 체결했다.", "eng": "The two countries concluded a free trade agreement."}], "translations": {"en": {"term": "conclude a treaty", "mainDef": "For countries to formally make an agreement.", "subDefs": [{"term": "체결 (締結)", "def": "체 (締, to bind) + 결 (結, to bind).\nBoth characters mean \"to bind/tie,\" so together they mean to formally conclude a contract or treaty."}]}}}, {"term": "실질적으로", "mainDef": "실제로 또는 본질적으로.", "variants": ["실질적으로"], "subDefs": [{"subTerm": "• 실질(實質)", "subDef": "실(實, 실제) + 질(質, 바탕).\n겉모습이 아니라 실제 내용이나 본질을 뜻해요."}], "examples": [{"kor": "그 회사는 실질적으로 파산 상태이다.", "eng": "The company is substantively bankrupt."}], "translations": {"en": {"term": "substantively", "mainDef": "In actual/substantive terms.", "subDefs": [{"term": "실질(實質)", "def": "실 (實, actual) + 질 (質, substance).\nIt refers to the actual content or essence, not just appearance."}]}}}, {"term": "취급을 당하다", "mainDef": "어떤 방식으로 대우받다.", "variants": ["취급을 당하다"], "subDefs": [{"subTerm": "• 취급(取扱)", "subDef": "취(取, 가지다) + 급(扱, 다루다).\n어떤 대상을 특정 방식으로 다루거나 대한다는 뜻이에요."}], "examples": [{"kor": "그는 손님으로 정중하게 취급을 당했다.", "eng": "He was treated politely, as a guest."}], "translations": {"en": {"term": "be treated", "mainDef": "To be treated in a certain way.", "subDefs": [{"term": "취급 (取扱)", "def": "취 (取, to take) + 급 (扱, to handle).\nIt means to handle or treat something/someone in a certain way."}]}}}, {"term": "재일교포", "mainDef": "일본에 살고 있는 한국인.", "variants": ["재일교포"], "subDefs": [{"subTerm": "• 재일(在日)", "subDef": "재(在, 있다) + 일(日, 일본).\n일본에 있다, 즉 일본에 살고 있다는 뜻이에요."}, {"subTerm": "• 교포(僑胞)", "subDef": "교(僑, 타향에 살다) + 포(胞, 동포).\n다른 나라에 사는 같은 민족 사람을 뜻해요."}], "examples": [{"kor": "재일교포 사회는 오랜 역사를 갖고 있다.", "eng": "The community of Koreans living in Japan has a long history."}], "translations": {"en": {"term": "korean residents in japan", "mainDef": "A Korean living in Japan.", "subDefs": [{"term": "재일(在日)", "def": "재 (在, be present) + 일 (日, Japan).\nIt means “present in Japan” — i.e., living in Japan."}, {"term": "교포(僑胞)", "def": "교 (僑, live abroad) + 포 (胞, compatriot).\nIt refers to a person of the same people/ethnicity living in another country."}]}}}, {"term": "해방되다", "mainDef": "다른 나라의 지배에서 벗어나다.", "variants": ["해방되다"], "subDefs": [{"subTerm": "• 해방(解放)", "subDef": "해(解 풀다) + 방(放 놓다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그 나라는 1945년에 해방되었다.", "eng": "The country was liberated in 1945."}], "translations": {"en": {"term": "be liberated", "mainDef": "To be freed from another country's rule.", "subDefs": [{"term": "해방(解放)", "def": "해 (解, solve) + 방 (放, release).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "거주하다", "mainDef": "어떤 곳에 살다.", "variants": ["거주하다"], "subDefs": [{"subTerm": "• 거주(居住)", "subDef": "거(居 살다) + 주(住 살다).\n각 글자의 원래 뜻을 알면 단어의 의미가 더 잘 이해돼요."}], "examples": [{"kor": "그는 10년 넘게 서울에 거주하고 있다.", "eng": "He has resided in Seoul for over ten years."}], "translations": {"en": {"term": "reside", "mainDef": "To live/reside in a place.", "subDefs": [{"term": "거주(居住)", "def": "거 (居, live) + 주 (住, live).\nKnowing each character's original meaning makes the word easier to understand."}]}}}, {"term": "무국적자", "mainDef": "국적이 없는 사람.", "variants": ["무국적자"], "subDefs": [{"subTerm": "• 무국적(無國籍)", "subDef": "무(無, 없다) + 국(國, 나라) + 적(籍, 호적).\n국적, 즉 나라에 속해 있다는 기록이 없다는 뜻이에요."}, {"subTerm": "• -자(者)", "subDef": "자(者, 사람).\n'~하는 사람'을 뜻하는 말이에요."}], "examples": [{"kor": "전쟁으로 많은 사람이 무국적자가 되었다.", "eng": "Many people became stateless due to the war."}], "translations": {"en": {"term": "stateless person", "mainDef": "A person who has no nationality.", "subDefs": [{"term": "무국적(無國籍)", "def": "무 (無, none) + 국 (國, country) + 적 (籍, register).\nIt means having no nationality — no record of belonging to a country."}, {"term": "-자(者)", "def": "자 (者, person).\nA suffix meaning “a person who ~.”"}]}}}, {"term": "표면적으로", "mainDef": "겉으로 보기에.", "variants": ["표면적으로"], "subDefs": [{"subTerm": "• 표면(表面)", "subDef": "표(表, 겉) + 면(面, 방면).\n겉으로 드러나는 면을 뜻해요."}], "examples": [{"kor": "표면적으로 두 회사는 사이가 좋아 보였다.", "eng": "On the surface, the two companies seemed to be on good terms."}], "translations": {"en": {"term": "superficially", "mainDef": "On the surface / apparently.", "subDefs": [{"term": "표면(表面)", "def": "표 (表, surface) + 면 (面, side).\nIt refers to the outward, visible side of something."}]}}}, {"term": "일리가 있다", "mainDef": "어느 정도 맞는 점이 있다.", "variants": ["일리가 있다"], "subDefs": [{"subTerm": "• 일리(一理)", "subDef": "일(一 하나) + 리(理 이치/다스리다).\n두 글자의 뜻을 합치면 이 단어의 의미를 짐작할 수 있어요."}], "examples": [{"kor": "그의 말도 일리가 있다.", "eng": "What he says does have a point."}], "translations": {"en": {"term": "have a point", "mainDef": "To have some validity/a point.", "subDefs": [{"term": "일리(一理)", "def": "일 (一, one) + 리 (理, principle/govern).\nCombining the two characters' meanings helps you guess the word's meaning."}]}}}, {"term": "의사와 상관없이", "mainDef": "자기가 원하는 것과 관계없이.", "variants": ["의사와 상관없이"], "subDefs": [{"subTerm": "• 의사(意思)", "subDef": "의(意, 뜻) + 사(思, 생각).\n어떤 사람이 마음속으로 원하는 생각이나 뜻을 말해요."}], "examples": [{"kor": "아이는 부모의 의사와 상관없이 그 학교를 선택했다.", "eng": "The child chose that school regardless of their parents' wishes."}], "translations": {"en": {"term": "regardless of one's will", "mainDef": "Regardless of one's own will/wishes.", "subDefs": [{"term": "의사 (意思)", "def": "의 (意, meaning/will) + 사 (思, thought).\nIt refers to the intention or will someone has in their mind."}]}}}, {"term": "국가기록원", "mainDef": "나라의 중요한 기록을 보관하는 곳.", "variants": ["국가기록원"], "subDefs": [{"subTerm": "• 기록(記錄)", "subDef": "기(記, 기록하다) + 록(錄, 기록하다).\n나중에 볼 수 있도록 글이나 자료로 남기는 것을 뜻해요."}, {"subTerm": "• -원(院)", "subDef": "원(院, 관청).\n'기관, 관청'을 뜻하는 말이에요."}], "examples": [{"kor": "국가기록원에서 옛 문서를 확인할 수 있다.", "eng": "You can check old documents at the National Archives."}], "translations": {"en": {"term": "national archives of korea", "mainDef": "A country's official archive for important records.", "subDefs": [{"term": "기록(記錄)", "def": "기 (記, record) + 록 (錄, record).\nIt means to leave something in writing or data so it can be seen later."}, {"term": "-원(院)", "def": "원 (院, institution).\nA suffix meaning “institution” or “agency.”"}]}}}, {"term": "합병일", "mainDef": "한 나라가 다른 나라에 합쳐진 날.", "variants": ["합병일"], "subDefs": [{"subTerm": "• 합병(合倂)", "subDef": "합(合, 합치다) + 병(倂, 합치다).\n둘 이상을 하나로 합친다는 뜻이에요."}, {"subTerm": "• -일(日)", "subDef": "일(日, 날).\n'날, 날짜'를 뜻하는 말이에요."}], "examples": [{"kor": "그 나라는 합병일을 기념하지 않는다.", "eng": "That country does not commemorate the annexation date."}], "translations": {"en": {"term": "annexation day", "mainDef": "The date on which one country was annexed by another.", "subDefs": [{"term": "합병(合倂)", "
