#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}

#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}

#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}

.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            height: 16px;
            width: 16px;
            border-radius: 50%;

            margin-top: -7px;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #e5e7eb;

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };
        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["사회", "경제"];
        const HOME_SERIES_BADGE = "";
        const READING_DATA = [{"id": 1, "title": "반려동물보유세, 진짜 내요?", "subtitle": "2024년 9월에 나온 기사예요", "source": "https://www.fnnews.com/news/202409230912255300", "content": [{"isHeading": true, "text": "반려동물을 키워요?", "trans": "Do You Keep a Pet?"}, {"text": "요즘 강아지나 고양이를 키우는 사람이 많아요. 한국에는 반려동물을 키우는 사람이 1,500만 명쯤 있어요. 이렇게 사람이 많아지니까 정부는 '반려동물 보유세'를 생각하고 있어요. 보유세는 반려동물을 키우는 사람이 내는 세금이에요. 하지만 아직 정한 것은 아니에요. 정부는 어떻게 할지 알아보고 있어요.", "trans": "These days many people keep a dog or a cat. In Korea about 15 million people have a pet. Because the number is growing like this, the government is thinking about a 'pet ownership tax'. An ownership tax is a tax paid by people who keep a pet. But nothing has been decided yet. The government is still looking into what to do."}, {"isHeading": true, "text": "왜 세금이 필요해요?", "trans": "Why Is the Money Needed?"}, {"text": "반려동물이 많아지면서 돈이 많이 들어요. 먼저 길에 있는 강아지 배변을 치워야 해요. 배변은 동물이 몸 밖으로 내보내는 똥이나 오줌이에요. 그리고 사람들이 버린 동물도 돌봐야 해요.", "trans": "As the number of pets grows, it costs a lot of money. First, dog waste on the street has to be cleaned up. 'Waste' here means what an animal passes out of its body. And animals that people have abandoned have to be looked after too."}, {"text": "작년에 동물보호센터에 쓴 돈은 373억 원이에요. 그전 해보다 79억 원 더 많아요. 그래서 '반려동물을 키우는 사람이 이 돈을 같이 내면 어때요?'라고 말하는 사람이 있어요.", "trans": "Last year 37.3 billion won was spent on animal shelters — 7.9 billion won more than the year before. So some people say, 'How about pet owners sharing this cost?'"}, {"isChart": true}, {"isHeading": true, "text": "다른 나라는 어때요?", "trans": "What About Other Countries?"}, {"text": "다른 나라에는 벌써 반려동물 세금이 있어요. 독일에서는 강아지 한 마리에 1년에 26만 원쯤 내요. 이 돈으로 길에 있는 강아지 배변을 치워요. 네덜란드에서는 1년에 17만 원쯤 내요. 이 돈으로 '동물 경찰'을 만들었어요. 동물 경찰은 동물을 때리거나 버리는 사람을 찾아요. 미국은 지역마다 달라요. 미국에서는 동물을 때리는 사람에게 벌을 주는 데 이 돈을 써요.", "trans": "Other countries already have a pet tax. In Germany people pay about 260,000 won a year for one dog. The money is used to clean up dog waste on the street. In the Netherlands they pay about 170,000 won a year. With this money they created an 'animal police'. The animal police look for people who hit or abandon animals. In the United States it is different in each region. There the money is used to punish people who hit animals."}, {"text": "찬성하는 사람도 있고 반대하는 사람도 있어요. 찬성하는 사람은 \"세금이 있으면 사람들이 더 조심해서 동물을 키울 거예요\"라고 말해요. 반대하는 사람은 \"돈을 내야 하면 동물을 버리는 사람이 더 많아질 거예요\"라고 걱정해요.", "trans": "Some people are for it and some are against it. Those in favour say, 'If there is a tax, people will keep animals more carefully.' Those against it worry, 'If people have to pay, more of them will abandon their animals.'"}]}];
        const VOCAB_READING_DATA = [{"term": "반려동물", "mainDef": "An animal you live with like family — a dog, a cat and so on. Now preferred over 애완동물.", "variants": ["반려동물", "반려동물을", "반려동물이"], "subDefs": [], "examples": [{"kor": "저는 반려동물이 두 마리 있어요.", "eng": "I have two pets."}], "translations": {"en": {"term": "pet, companion animal"}}}, {"term": "키우다", "mainDef": "To look after an animal or a child and live together with them.", "variants": ["키우다", "키우는", "키울", "키워요"], "subDefs": [], "examples": [{"kor": "언니는 고양이를 세 마리 키워요.", "eng": "My sister keeps three cats."}], "translations": {"en": {"term": "to keep, to raise"}}}, {"term": "-쯤", "mainDef": "About / roughly. Attaches to a number or a time word when the figure is not exact.", "variants": ["쯤", "명쯤", "원쯤"], "subDefs": [], "examples": [{"kor": "한 시간쯤 기다렸어요.", "eng": "I waited about an hour."}], "translations": {"en": {"term": "about, approximately"}}}, {"term": "많아지다", "mainDef": "For the number of something to grow. 많다 (to be many) + -아지다 (to become).", "variants": ["많아지다", "많아지니까", "많아지면서", "많아질"], "subDefs": [], "examples": [{"kor": "봄이 되면서 공원에 사람이 많아졌어요.", "eng": "As spring came, more people appeared in the park."}], "translations": {"en": {"term": "to grow in number"}}}, {"term": "정부", "mainDef": "The body that runs a country and decides its policies.", "variants": ["정부", "정부는", "정부가"], "subDefs": [], "examples": [{"kor": "정부가 새 계획을 발표했어요.", "eng": "The government announced a new plan."}], "translations": {"en": {"term": "government"}}}, {"term": "세금", "mainDef": "Money paid to the state, which the state uses to run the country.", "variants": ["세금", "세금을", "세금이", "세금으로"], "subDefs": [], "examples": [{"kor": "물건을 살 때 세금을 내요.", "eng": "You pay tax when you buy something."}], "translations": {"en": {"term": "tax"}}}, {"term": "보유세", "mainDef": "A tax you pay simply for owning something. 보유 (owning) + 세 (tax). There are ownership taxes on houses and cars too.", "variants": ["보유세", "보유세'를", "보유세를", "보유세는"], "subDefs": [], "examples": [{"kor": "집이 있는 사람은 보유세를 내요.", "eng": "People who own a house pay an ownership tax."}], "translations": {"en": {"term": "ownership tax"}}}, {"term": "정하다", "mainDef": "To settle on one option among several.", "variants": ["정하다", "정한", "정할"], "subDefs": [], "examples": [{"kor": "만날 시간을 아직 정하지 않았어요.", "eng": "We haven't decided on a time to meet yet."}], "translations": {"en": {"term": "to decide"}}}, {"term": "알아보다", "mainDef": "To search and ask around about something you don't know yet.", "variants": ["알아보다", "알아보고"], "subDefs": [], "examples": [{"kor": "호텔 값을 알아보고 있어요.", "eng": "I'm looking into hotel prices."}], "translations": {"en": {"term": "to look into, to find out"}}}, {"term": "돈이 들다", "mainDef": "For something to cost money. Note that Korean uses 들다 ('to go in'), not 쓰다.", "variants": ["돈이 들다", "돈이 많이 들어요"], "subDefs": [], "examples": [{"kor": "이사할 때 돈이 많이 들었어요.", "eng": "Moving cost a lot of money."}], "translations": {"en": {"term": "to cost money"}}}, {"term": "배변", "mainDef": "What an animal passes out of its body. A formal word — the article defines it in the text.", "variants": ["배변", "배변을"], "subDefs": [], "examples": [{"kor": "산책할 때 강아지 배변을 치워요.", "eng": "I clean up after my dog when we walk."}], "translations": {"en": {"term": "animal waste, excrement"}}}, {"term": "치우다", "mainDef": "To take mess away and make a place clean.", "variants": ["치우다", "치워야", "치워요"], "subDefs": [], "examples": [{"kor": "방을 치우고 나갔어요.", "eng": "I tidied my room before going out."}], "translations": {"en": {"term": "to clean up, to clear away"}}}, {"term": "내보내다", "mainDef": "To send something out from inside. 나가다 (to go out) made causative.", "variants": ["내보내다", "내보내는"], "subDefs": [], "examples": [{"kor": "창문을 열어서 연기를 내보냈어요.", "eng": "I opened the window to let the smoke out."}], "translations": {"en": {"term": "to send out, to let out"}}}, {"term": "똥", "mainDef": "Solid waste from the body.", "variants": ["똥", "똥이나"], "subDefs": [], "examples": ck inline-flex items-center gap-1">Gemini에서 열기 ${svgIcon('externalLink', 'w-3 h-3')}</a></p>`}</div>` : '';

        /* ===== Flash Card 모듈 (어휘 탭) — 20개 큐레이션 카드 + 미디어 ===== */
        /* 미디어: GitHub raw에서 로드. 로컬 미디어 옆이면 FC_BASE=''로. */
        const FC_BASE = 'https://github.com/openkoreanlearninglab/hub/raw/refs/heads/main/flashcards/DECK-FOLDER/';
        const FC_IMG = FC_BASE+'images/', FC_VID = FC_BASE+'videos/', FC_AUD = FC_BASE+'audio/';
        const FC_CARDS = [
            /* ▣ 여기에 카드를 채우면 어휘 탭에 '플래시 카드' 토글이 자동으로 나타납니다.
                  비워 두면(=지금) 토글이 안 뜨고, 어휘 탭은 원본과 100% 동일합니다.
               필드: vocab(어휘), ko(한국어문장), hl(강조부분), en(영어), 
                     media:{type:'image'|'video', src, sound?}, back:{img}, audio  */

            // 예시) 이미지 앞면 + 음성  (개수 자유)
            // { vocab:'어휘1', ko:'문장이에요.', hl:'문장', en:'A sentence.', media:{type:'image',src:FC_IMG+'01.jpeg'}, audio:FC_AUD+'01.wav' },
        ];
        const fc = { mode:'list', queue:[], pos:0, flipped:false, showTrans:false, status:{}, done:false, shuffled:false };

        function fcPlay(src){ try{ if(!fcAudio)fcAudio=new Audio(); if(fcAudio.src!==src)fcAudio.src=src; fcAudio.currentTime=0; const p=fcAudio.play(); if(p&&p.catch)p.catch(function(){}); }catch(_){} }
        function fcStop(){ try{ if(fcAudio)fcAudio.pause(); }catch(_){} }
        function fcBold(ko,hl){ let s=esc(ko); if(!hl)return s; const h=esc(hl),i=s.indexOf(h); if(i<0)return s; return s.slice(0,i)+'<strong class="hl">'+h+'</strong>'+s.slice(i+h.length); }
        function fcStart(list){ const base=(list&&list.length?list:FC_CARDS.map(function(_,i){return i;})).slice(); fc.queue=fc.shuffled?shuffleArr(base):base; fc.pos=0; fc.flipped=false; fc.showTrans=false; fc.done=false; fc.status={}; }
        function fcCur(){ return FC_CARDS[fc.queue[fc.pos]]; }
        function fcCount(k){ return Object.keys(fc.status).filter(function(x){return fc.status[x]===k;}).length; }
        function fcUnknown(){ return Object.keys(fc.status).filter(function(x){return fc.status[x]==='unknown';}).map(Number); }
        /* 이미지 프리로드: 다음·이전 카드 이미지를 미리 받아 전환 시 검정 화면 제거 */
        const fcPre = {};
        function fcPreloadOne(url){ if(!url||fcPre[url])return; fcPre[url]=true; const im=new Image(); im.src=url; }
        function fcPreloadIdx(qp){ if(qp<0||qp>=fc.queue.length)return; const c=FC_CARDS[fc.queue[qp]]; if(!c)return; if(c.media&&c.media.type==='image')fcPreloadOne(c.media.src); if(c.back&&c.back.img)fcPreloadOne(c.back.img); }
        function fcPreloadAround(){ const c=fcCur(); if(c&&c.back&&c.back.img)fcPreloadOne(c.back.img); fcPreloadIdx(fc.pos+1); fcPreloadIdx(fc.pos+2); fcPreloadIdx(fc.pos-1); }
        const FC_ICON = {
            prev:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="square" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>',

            spk:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5L6 9H2v6h4l5 4V5z"/><path stroke-linecap="round" stroke-width="1.8" d="M15.5 8.5a5 5 0 010 7"/></svg>',
            eye:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg>'
        };
        function fcMediaHTML(c){ if(c.media.type==='video'){ const a=c.media.sound?'controls playsinline preload="metadata"':'autoplay muted loop playsinline preload="metadata"'; return '<video class="fc-video" src="'+esc(c.media.src)+'" '+a+'></video>'; } return '<img src="'+esc(c.media.src)+'" alt="'+esc(c.vocab)+'">'; }
        function fcFrontHTML(c){ const total=fc.queue.length||FC_CARDS.length; const pct=((fc.pos+1)/total)*100;

            + '<div class="fc-prog"><i style="width:'+pct+'%"></i></div>'; }
        function fcBackHTML(c){ const img=(c.back&&c.back.img)?'<img class="fc-bimg" src="'+esc(c.back.img)+'" alt="'+esc(c.vocab)+'">':'';
            return '<div class="fc-row"><span class="fc-tag">정답<span class="lk-en"> · Answer</span></span><span class="fc-vocab">'+esc(c.vocab)+'</span></div>'

            + '<div class="fc-bactions"><button type="button" class="fc-bbtn" data-action="fc-audio" aria-label="문장 듣기">'+FC_ICON.spk+' 듣기<span class="lk-en"> · Listen</span></button>'

        function fcCardHTML(){ const c=fcCur(); if(!c)return''; return '<div class="fc-card" data-action="fc-flip"><div class="fc-inner'+(fc.flipped?' flip':'')+'" id="fc-inner">'
            + '<div class="fc-face fc-front" id="fc-front">'+fcFrontHTML(c)+'</div><div class="fc-face fc-back" id="fc-back">'+fcBackHTML(c)+'</div></div></div>'; }
        function fcStatsHTML(){ return '<div class="fc-bar"><div class="fc-stats"><span class="k">알아요<span class="lk-en"> · Got it</span> <b id="fc-sk">'+fcCount('known')+'</b></span><span class="u">모르겠어요<span class="lk-en"> · Not yet</span> <b id="fc-su">'+fcCount('unknown')+'</b></span></div>'
            + '<div class="fc-order" role="group"><button type="button" class="fc-obtn'+(fc.shuffled?'':' on')+'" data-action="fc-order" data-sh="0">순서대로<span class="lk-en"> · In order</span></button><button type="button" class="fc-obtn'+(fc.shuffled?' on':'')+'" data-action="fc-order" data-sh="1">섞기<span class="lk-en"> · Shuffle</span></button></div></div>'; }
        function fcSummaryHTML(){ const k=fcCount('known'),u=fcCount('unknown'); return '<div class="fc-sum"><h3>한 바퀴 끝!<span class="lk-en"> · Round complete</span></h3>'
            + '<p class="line">알아요 <b style="color:#047857">'+k+'</b> · 모르겠어요 <b style="color:#b91c1c">'+u+'</b> / 전체 '+FC_CARDS.length+'</p>'
            + '<div class="acts">'+(u?'<button type="button" class="fc-sbtn pri" data-action="fc-again-u">모르는 카드만 다시 ('+u+'장, 섞어서)</button>':'')+'<button type="button" class="fc-sbtn" data-action="fc-again-all">전체 다시 하기 (섞어서)</button></div></div>'; }
        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';
            return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcCardHTML()
            + '<div class="fc-judge"><button type="button" class="fc-jbtn k" data-action="fc-know">알아요<span class="lk-en"> · Got it</span></button><button type="button" class="fc-jbtn u" data-action="fc-dont">모르겠어요<span class="lk-en"> · Not yet</span></button></div>'
            + '<div class="fc-ctrls"><button type="button" class="fc-ibtn" data-action="fc-prev" aria-label="이전 카드">'+FC_ICON.prev+'</button><button type="button" class="fc-fbtn" data-action="fc-flip">뒤집기<span class="lk-en"> · Flip</span></button><button type="button" class="fc-ibtn" data-action="fc-next" aria-label="다음 카드">'+FC_ICON.next+'</button></div>'

        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }

        // ---------- 9-b. 핵심 문법 (어휘 탭 하단 섹션) ----------
        function grammarSectionHTML() {

        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, grammar: pwGrammarHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML };
            let html = PW_SECTIONS.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const rdo = e.target.closest('[data-reading-open]'); if (rdo) { reading.activeId = +rdo.dataset.readingOpen; setTab('reading'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            const a = e.target.closest('[data-action]');
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const _sl = e.target.closest('[data-setlang]');
            if (_sl) { app.lang = _sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            const _wasLangOpen = app.langOpen; app.langOpen = false;
            if (_wasLangOpen && !e.target.closest('[data-tab],[data-action],[data-vocab-idx],[data-did]')) { buildApp(); return; }
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {
                    const act = a.dataset.action;
                    if (act === 'toggle-highlight') { reading.highlightMode = !reading.highlightMode; paint(); }
                    else if (act === 'toggle-dict') { reading.showDict = !reading.showDict; paint(); }
                    else if (act === 'dict-close') { reading.showDict = false; paint(); }
                    else if (act === 'toggle-vocab') { app.showVocab = !app.showVocab; paint(); }
                    else if (act === 'para-trans') { const i = +a.dataset.idx; reading.trans[i] = !reading.trans[i]; rerenderReadingBlocks(); }
                    return;
                }
            } else if (tab === 'vocab') {
                const modeBtn = e.target.closest('[data-action="fc-mode"]');
                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;
                    const fa = e.target.closest('[data-action^="fc-"]');
                    if (fa) { const act = fa.dataset.action;
                        if (act === 'fc-flip') fcSetFlip(!fc.flipped);
                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });
                        else if (act === 'fc-order') fcSetOrder(fa.dataset.sh==='1');
                        else if (act === 'fc-audio') fcPlay(fcCur().audio);
                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }
                        else if (act === 'fc-again-u') { fc.shuffled=true; fcStart(fcUnknown()); fcRefreshDeck(); }
                        else if (act === 'fc-again-all') { fc.shuffled=true; fcStart(null); fcRefreshDeck(); }
                    }
                    return;
                }
                if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_READING_DATA[i], i, !cur); }
                return;
            } else if (tab === 'quiz') {
                const retry = e.target.closest('[data-action="quiz-retry"]'); if (retry) { quizState.attempts = {}; quizState.q = {}; quizState.opts = {}; paint(); return; }
                const qEl = e.target.closest('.quiz-q'); if (!qEl) return; const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }
                const q = e.target.closest('[data-q]'); if (q) { if (q.dataset.q === 'hint') st.showHint = !st.showHint; rerenderQuizQ(qid); return; }
                const tr = e.target.closest('[data-action="q-trans"]'); if (tr) { st.showTrans = !st.showTrans; rerenderQuizQ(qid); return; }
                return;
            } else if (tab === 'discuss') {
                if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });

        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos + 1) % fc.queue.length; }); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGo(function(){ fc.pos = (fc.pos - 1 + fc.queue.length) % fc.queue.length; }); }
            else if (e.key === '1') { fcMark('known'); }
            else if (e.key === '2') { fcMark('unknown'); }
            else if (e.key === 's' || e.key === 'S') { fcSetOrder(!fc.shuffled); }
            else if ((e.key === 't' || e.key === 'T') && fc.flipped) { fc.showTrans = !fc.showTrans; fcApplyFlip(); }
        });
        appEl.addEventListener('input', (e) => {
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) {
                const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id];
                const wasDisabled = !st.text.trim(); st.text = e.target.value;
                if (wasDisabled !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } }
            }
        });

        appEl.addEventListener('submit', async (e) => {
            const form = e.target.closest('[data-action="dict-search"]'); if (!form) return;
            e.preventDefault();
            const inp = qs('#dict-input', viewRoot()); reading.dictTerm = inp ? inp.value : '';
            if (!reading.dictTerm.trim()) return;
            reading.dictLoading = true; reading.dictResult = null; paint();
            try { reading.dictResult = await getAIDictionaryData(reading.dictTerm, currentReading().content); }
            catch (err) { reading.dictResult = { term: reading.dictTerm, definition: '검색 중 오류가 발생했습니다. (API 키 없음/요청 오류)', example: '' }; }
            finally { reading.dictLoading = false; paint(); }
        });

        // reading: 어휘 호버 팝업 (bubbling 가능한 mouseover/mouseout)
        appEl.addEventListener('mouseover', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            const w = VOCAB_READING_DATA[+span.dataset.vocabIdx]; const r = span.getBoundingClientRect();
            showVocabPopup(w, r.left + r.width / 2, r.bottom, false);
        });
        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
</body>
