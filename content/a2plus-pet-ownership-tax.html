#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}

#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}

#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}

.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

            height: 16px;
            width: 16px;
            border-radius: 50%;

            margin-top: -7px;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #e5e7eb;

        /* ===== 데이터 (임시 플레이스홀더 — 실제 콘텐츠로 교체) ===== */
        const CONFIG = { GEMINI_API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent', API_RETRY_DELAYS: [1000, 2000, 4000] };
        const LEVEL_DEFINITIONS = { "A1":{title:"Novice",desc:""},"A1+":{title:"Pre-Beginner",desc:""},"A2":{title:"Beginner",desc:""},"A2+":{title:"Upper Beginner",desc:""},"B1":{title:"Pre-Intermediate",desc:""},"B1+":{title:"Lower Intermediate",desc:""},"B2":{title:"Intermediate",desc:""},"B2+":{title:"Upper Intermediate",desc:""},"C1":{title:"Advanced",desc:""},"C1+":{title:"Upper Advanced",desc:""},"C2":{title:"Proficient",desc:""} };
        const HOME_TAGS = ["사회", "문화"];
        const HOME_SERIES_BADGE = "";
        const READING_DATA = [{"id": 1, "thumb": "https://raw.githubusercontent.com/openkoreanlearninglab/hub/main/thumbnails/a2plus-pet-ownership-tax.webp", "title": "반려동물보유세, 진짜 내요?", "subtitle": "2024년 9월에 나온 기사예요", "source": "https://www.fnnews.com/news/202409230912255300", "content": [{"isHeading": true, "text": "반려동물을 키워요?", "trans": "Do You Keep a Pet?"}, {"text": "요즘 강아지나 고양이를 키우는 사람이 많아요. 한국에는 반려동물을 키우는 사람이 1,500만 명쯤 있어요. 이렇게 사람이 많아지니까 정부는 '반려동물 보유세'를 생각하고 있어요. 보유세는 반려동물을 키우는 사람이 내는 세금이에요. 하지만 아직 정한 것은 아니에요. 정부는 어떻게 할지 알아보고 있어요.", "trans": "These days many people keep a dog or a cat. In Korea about 15 million people have a pet. Because the number is growing like this, the government is thinking about a 'pet ownership tax'. An ownership tax is a tax paid by people who keep a pet. But nothing has been decided yet. The government is still looking into what to do."}, {"isHeading": true, "text": "왜 세금이 필요해요?", "trans": "Why Is the Money Needed?"}, {"text": "반려동물이 많아지면서 돈이 많이 들어요. 먼저 길에 있는 강아지 배변을 치워야 해요. 배변은 동물이 몸 밖으로 내보내는 똥이나 오줌이에요. 그리고 사람들이 버린 동물도 돌봐야 해요.", "trans": "As the number of pets grows, it costs a lot of money. First, dog waste on the street has to be cleaned up. 'Waste' here means what an animal passes out of its body. And animals that people have abandoned have to be looked after too."}, {"text": "작년에 동물보호센터에 쓴 돈은 373억 원이에요. 그전 해보다 79억 원 더 많아요. 그래서 '반려동물을 키우는 사람이 이 돈을 같이 내면 어때요?'라고 말하는 사람이 있어요.", "trans": "Last year 37.3 billion won was spent on animal shelters — 7.9 billion won more than the year before. So some people say, 'How about pet owners sharing this cost?'"}, {"isChart": true}, {"isHeading": true, "text": "다른 나라는 어때요?", "trans": "What About Other Countries?"}, {"text": "다른 나라에는 벌써 반려동물 세금이 있어요. 독일에서는 강아지 한 마리에 1년에 26만 원쯤 내요. 이 돈으로 길에 있는 강아지 배변을 치워요. 네덜란드에서는 1년에 17만 원쯤 내요. 이 돈으로 '동물 경찰'을 만들었어요. 동물 경찰은 동물을 때리거나 버리는 사람을 찾아요. 미국은 지역마다 달라요. 미국에서는 동물을 때리는 사람에게 벌을 주는 데 이 돈을 써요.", "trans": "Other countries already have a pet tax. In Germany people pay about 260,000 won a year for one dog. The money is used to clean up dog waste on the street. In the Netherlands they pay about 170,000 won a year. With this money they created an 'animal police'. The animal police look for people who hit or abandon animals. In the United States it is different in each region. There the money is used to punish people who hit animals."}, {"text": "찬성하는 사람도 있고 반대하는 사람도 있어요. 찬성하는 사람은 \"세금이 있으면 사람들이 더 조심해서 동물을 키울 거예요\"라고 말해요. 반대하는 사람은 \"돈을 내야 하면 동물을 버리는 사람이 더 많아질 거예요\"라고 걱정해요.", "trans": "Some people are for it and some are against it. Those in favour say, 'If there is a tax, people will keep animals more carefully.' Those against it worry, 'If people have to pay, more of them will abandon their animals.'"}]}];
        const VOCAB_READING_DATA = [{"term": "반려동물", "mainDef": "A pet ⸺ 애완동물 was the older word, but it means \"an animal you enjoy\". 반려 means \"a companion you live alongside\", so this is the word people use now.", "variants": ["반려동물"], "subDefs": [], "examples": [{"kor": "저는 반려동물이 두 마리 있어요.", "eng": "I have two pets."}]}, {"term": "키우다", "mainDef": "To raise, to bring up — a child, a plant, or an animal.", "variants": ["키워요", "키우는"], "subDefs": [], "examples": [{"kor": "저는 작은 고양이를 키워요.", "eng": "I keep a small cat."}]}, {"term": "강아지나 고양이", "mainDef": "\"A dog or a cat.\"", "variants": ["강아지나 고양이"], "subDefs": [{"subTerm": "강아지", "subDef": "a puppy — but Koreans use it for a grown dog too, the way English says \"doggy\"."}, {"subTerm": "-나", "subDef": "\"or\", putting two choices side by side."}, {"subTerm": "고양이", "subDef": "a cat."}], "examples": [{"kor": "커피나 차를 드세요.", "eng": "Have coffee or tea."}]}, {"term": "키우는 사람", "mainDef": "\"People who keep (a pet).\"", "variants": ["키우는 사람"], "subDefs": [{"subTerm": "-는 as in 키우는", "subDef": "put after a verb, it lets the verb describe the noun after it, about now: 키우는 사람 = a person who keeps one."}], "examples": [{"kor": "운동하는 사람이 많아요.", "eng": "There are a lot of people exercising."}]}, {"term": "1,500만 명쯤", "mainDef": "\"About 15 million people.\"", "variants": ["1,500만 명쯤"], "subDefs": [{"subTerm": "만", "subDef": "ten thousand. Korean counts in units of 만, so 1,500만 = 15,000,000."}, {"subTerm": "명", "subDef": "counter for people: 한 명, 두 명, 세 명."}, {"subTerm": "-쯤", "subDef": "about, roughly. It goes right after the number: 열 시쯤, 만 원쯤."}], "examples": [{"kor": "그 콘서트에 3만 명쯤 왔어요.", "eng": "About 30,000 people came to the concert."}]}, {"term": "이렇게", "mainDef": "Like this, in this way. Its partners are 그렇게 and 저렇게.", "variants": ["이렇게"], "subDefs": [], "examples": [{"kor": "이렇게 하면 쉬워요.", "eng": "If you do it like this, it's easy."}]}, {"term": "많아지니까", "mainDef": "\"Because the number is growing.\"", "variants": ["많아지니까"], "subDefs": [{"subTerm": "-니까", "subDef": "\"because, since\". It gives a reason both sides already accept, and it often leads into a suggestion or a decision."}], "examples": [{"kor": "비가 오니까 우산을 가져가세요.", "eng": "It's raining, so take an umbrella."}]}, {"term": "많아지다", "mainDef": "For the number of something to grow. 많다 (to be many) + -아/어지다 (to become).", "variants": [], "subDefs": [], "examples": [{"kor": "요즘 외국 손님이 많아졌어요.", "eng": "There are more customers from abroad these days."}]}, {"term": "정부", "mainDef": "The government — the body that runs a country and decides its policies.", "variants": ["정부"], "subDefs": [], "examples": [{"kor": "정부가 새 법을 만들었어요.", "eng": "The government made a new law."}]}, {"term": "보유세", "mainDef": "An ownership tax.", "variants": ["보유세"], "subDefs": [], "examples": [{"kor": "집을 사면 보유세를 내야 해요.", "eng": "If you buy a house, you have to pay an ownership tax."}]}, {"term": "생각하고 있어요", "mainDef": "\"It is thinking about it.\"", "variants": ["생각하고 있어요"], "subDefs": [{"subTerm": "-고 있다", "subDef": "\"is ~ing\". The action is going on right now."}], "examples": [{"kor": "지금 밥을 먹고 있어요.", "eng": "I'm eating right now."}]}, {"term": "반려동물을 키우는 사람이 내는 세금", "mainDef": "\"A tax paid by people who keep a pet\" (the text's own explanation of 보유세).", "variants": ["반려동물을 키우는 사람이 내는 세금"], "subDefs": [{"subTerm": "내다", "subDef": "to pay — money, a fee, a tax. Also \"to hand in\": 숙제를 내다."}, {"subTerm": "-는 as in 내는", "subDef": "lets the verb describe the noun after it: 내는 세금 = the tax (they) pay."}], "examples": [{"kor": "이건 차가 있는 사람이 내는 세금이에요.", "eng": "This is a tax paid by people who own a car."}]}, {"term": "세금", "mainDef": "A tax — money people pay to the government.", "variants": ["세금"], "subDefs": [], "examples": [{"kor": "월급에서 세금을 내요.", "eng": "Tax comes out of my salary."}]}, {"term": "하지만", "mainDef": "But, however.", "variants": ["하지만"], "subDefs": [], "examples": [{"kor": "비싸요. 하지만 아주 좋아요.", "eng": "It's expensive. But it's very good."}]}, {"term": "아직", "mainDef": "Still, not yet. With a negative it means \"not yet\": 아직 안 왔어요.", "variants": ["아직"], "subDefs": [], "examples": [{"kor": "숙제를 아직 안 했어요.", "eng": "I haven't done my homework yet."}]}, {"term": "정한 것은 아니에요", "mainDef": "\"It is not that it has been decided.\" ⸺ this is softer than 정하지 않았어요. It says the door is still open, which is exactly what a news article about a plan wants to say.", "variants": ["정한 것은 아니에요"], "subDefs": [{"subTerm": "정하다", "subDef": "to decide, to fix something: 날짜를 정하다."}, {"subTerm": "-ㄴ/은 것은 아니다", "subDef": "\"it is not that ~\". It denies one point without denying everything."}], "examples": [{"kor": "싫은 것은 아니에요. 조금 피곤해요.", "eng": "It's not that I dislike it. I'm just a little tired."}]}, {"term": "어떻게 할지", "mainDef": "\"What to do (about it).\"", "variants": ["어떻게 할지"], "subDefs": [{"subTerm": "어떻게", "subDef": "how, in what way."}, {"subTerm": "-ㄹ/을지", "subDef": "\"whether ~, what ~ will be\". It marks something still undecided, and is usually followed by 알다, 모르다 or 알아보다."}], "examples": [{"kor": "어디로 갈지 아직 몰라요.", "eng": "I still don't know where to go."}]}, {"term": "알아보고 있어요", "mainDef": "\"It is looking into it.\"", "variants": ["알아보고 있어요"], "subDefs": [{"subTerm": "알아보다", "subDef": "to look into something, to find out ⸺ 알다 is \"to know\"; adding -아/어 보다 makes it the act of going and checking."}], "examples": [{"kor": "값을 알아보고 있어요.", "eng": "I'm looking into the price."}]}, {"term": "필요하다", "mainDef": "To be needed.", "variants": ["필요해요"], "subDefs": [], "examples": [{"kor": "이 일에는 시간이 필요해요.", "eng": "This job needs time."}]}, {"term": "많아지면서", "mainDef": "\"As the number grows.\"", "variants": ["많아지면서"], "subDefs": [{"subTerm": "-면서/으면서", "subDef": "\"as ~, while ~\". Two things move along together."}], "examples": [{"kor": "나이가 들면서 생각이 바뀌었어요.", "eng": "As I got older, my thinking changed."}]}, {"term": "돈이 들다", "mainDef": "To cost money ⸺ 들다 on its own is \"to enter, to lift\"; with 돈 or 시간 it means that much gets used up.", "variants": ["돈이 많이 들어요"], "subDefs": [], "examples": [{"kor": "이사하는 데 돈이 많이 들었어요.", "eng": "Moving cost a lot of money."}]}, {"term": "먼저", "mainDef": "First, before the rest.", "variants": ["먼저"], "subDefs": [], "examples": [{"kor": "먼저 손을 씻으세요.", "eng": "Wash your hands first."}]}, {"term": "길에 있는 강아지 배변", "mainDef": "\"Dog waste on the street.\"", "variants": ["길에 있는 강아지 배변"], "subDefs": [{"subTerm": "길", "subDef": "a road, a street. Also \"the way\": 길을 잃었어요."}, {"subTerm": "-에 있는", "subDef": "\"that is in / on ~\". 있다 always takes -는, never -ㄴ/은."}], "examples": [{"kor": "책상 위에 있는 책을 주세요.", "eng": "Please pass me the book on the desk."}]}, {"term": "배변", "mainDef": "Animal waste. A stiff, official word — you meet it in news articles and public notices, not in conversation.", "variants": ["배변"], "subDefs": [], "examples": [{"kor": "공원에 배변 봉투가 있어요.", "eng": "There are waste bags in the park."}]}, {"term": "치워야 해요", "mainDef": "\"It has to be cleaned up.\"", "variants": ["치워야 해요"], "subDefs": [{"subTerm": "치우다", "subDef": "to clear away, to tidy up."}, {"subTerm": "-아야/어야 하다", "subDef": "\"must ~, have to ~\". There is no other choice. 되다 can replace 하다: 치워야 돼요."}], "examples": [{"kor": "방을 치워야 해요.", "eng": "I have to tidy my room."}]}, {"term": "몸 밖으로", "mainDef": "\"Out of the body.\"", "variants": ["몸 밖으로"], "subDefs": [{"subTerm": "몸", "subDef": "the body."}, {"subTerm": "밖", "subDef": "the outside. Its partner is 안 (inside)."}, {"subTerm": "-로/으로", "subDef": "marks the direction something goes. After a vowel or ㄹ use -로, otherwise -으로."}], "examples": [{"kor": "밖으로 나가서 이야기해요.", "eng": "Let's go outside and talk."}]}, {"term": "내보내는 똥이나 오줌", "mainDef": "\"The poo or wee it passes out.\"", "variants": ["내보내는 똥이나 오줌"], "subDefs": [{"subTerm": "내보내다", "subDef": "to send something out, to put it out."}, {"subTerm": "똥", "subDef": "poo. A plain everyday word, not a rude one."}, {"subTerm": "오줌", "subDef": "wee, urine."}], "examples": [{"kor": "고양이가 오줌을 쌌어요.", "eng": "The cat weed."}]}, {"term": "버린 동물", "mainDef": "\"Animals that people have abandoned.\"", "variants": ["버린 동물"], "subDefs": [{"subTerm": "-ㄴ/은 as in 버린", "subDef": "lets the verb describe the noun after it, about the past: 버린 동물 = the animal (they) abandoned."}], "examples": [{"kor": "어제 산 옷이에요.", "eng": "These are the clothes I bought yesterday."}]}, {"term": "버리다", "mainDef": "To throw something away ⸺ with an animal or a person it means to abandon them.", "variants": [], "subDefs": [], "examples": [{"kor": "쓰레기를 여기에 버리지 마세요.", "eng": "Please don't throw rubbish here."}]}, {"term": "돌봐야 해요", "mainDef": "\"They have to be looked after.\"", "variants": ["돌봐야 해요"], "subDefs": [{"subTerm": "돌보다", "subDef": "to look after, to take care of someone or something."}], "examples": [{"kor": "할머니를 돌봐야 해요.", "eng": "I have to look after my grandmother."}]}, {"term": "작년", "mainDef": "Last year. 올해 is this year, 내년 is next year.", "variants": ["작년"], "subDefs": [], "examples": [{"kor": "작년에 한국에 갔어요.", "eng": "I went to Korea last year."}]}, {"term": "동물보호센터", "mainDef": "An animal shelter — where abandoned animals are taken in and cared for.", "variants": ["동물보호센터"], "subDefs": [{"subTerm": "보호", "subDef": "protection. 보호하다 = to protect."}], "examples": [{"kor": "동물보호센터에서 강아지를 데려왔어요.", "eng": "I brought a puppy home from the shelter."}]}, {"term": "쓴 돈", "mainDef": "\"The money that was spent.\" ⸺ 쓰다 means \"to use\"; with 돈 or 시간 it means to spend it. (쓰다 also means \"to write\" and \"to wear a hat\".)", "variants": ["쓴 돈"], "subDefs": [], "examples": [{"kor": "이번 달에 쓴 돈이 너무 많아요.", "eng": "I spent far too much this month."}]}, {"term": "373억 원", "mainDef": "\"37.3 billion won.\"", "variants": ["373억 원", "79억 원"], "subDefs": [{"subTerm": "억", "subDef": "a hundred million. Korean money is counted in 만 (10,000) and 억 (100,000,000), so 373억 = 37,300,000,000."}, {"subTerm": "원", "subDef": "won, the Korean currency."}], "examples": [{"kor": "그 건물은 100억 원이에요.", "eng": "That building costs 10 billion won."}]}, {"term": "그전 해보다", "mainDef": "\"Than the year before.\"", "variants": ["그전 해보다"], "subDefs": [{"subTerm": "그전", "subDef": "before that, the previous one."}, {"subTerm": "해", "subDef": "year. 작년, 올해, 내년 all contain it."}, {"subTerm": "-보다", "subDef": "\"than ~\", marking what you compare with. The sentence usually has 더 in it too."}], "examples": [{"kor": "올해는 작년보다 더워요.", "eng": "This year is hotter than last year."}]}, {"term": "더", "mainDef": "More. It usually pairs with -보다: A보다 B가 더 좋아요.", "variants": ["더"], "subDefs": [], "examples": [{"kor": "조금 더 주세요.", "eng": "Please give me a little more."}]}, {"term": "같이 내면 어때요?", "mainDef": "\"How about sharing the cost?\"", "variants": ["같이 내면 어때요?"], "subDefs": [{"subTerm": "같이", "subDef": "together, with others."}, {"subTerm": "-면 어때요?/으면 어때요?", "subDef": "\"how about ~ing?\". A soft way to suggest something."}], "examples": [{"kor": "같이 점심을 먹으면 어때요?", "eng": "How about having lunch together?"}]}, {"term": "라고 말하는 사람", "mainDef": "\"People who say that.\"", "variants": ["라고 말하는 사람"], "subDefs": [{"subTerm": "-라고/이라고 말하다", "subDef": "\"to say that ~\". It comes right after the quoted words."}], "examples": [{"kor": "\"못 가요\"라고 말했어요.", "eng": "He said, 'I can't go.'"}]}, {"term": "다른 나라", "mainDef": "\"Other countries.\"", "variants": ["다른 나라"], "subDefs": [{"subTerm": "다르다", "subDef": "to be different ⸺ not 틀리다. 다르다 = different; 틀리다 = wrong."}, {"subTerm": "나라", "subDef": "a country."}], "examples": [{"kor": "다른 사람의 말도 들어 보세요.", "eng": "Listen to other people too."}]}, {"term": "벌써", "mainDef": "Already ⸺ 벌써 carries a little surprise that it happened so soon. 이미 is the plain, neutral \"already\".", "variants": ["벌써"], "subDefs": [], "examples": [{"kor": "벌써 다 먹었어요?", "eng": "You've eaten it all already?"}]}, {"term": "독일", "mainDef": "Germany. Country names in Korean often look nothing like the English, so they are worth learning as words.", "variants": ["독일"], "subDefs": [], "examples": [{"kor": "친구가 독일에서 일해요.", "eng": "My friend works in Germany."}]}, {"term": "한 마리", "mainDef": "\"One animal.\"", "variants": ["한 마리"], "subDefs": [{"subTerm": "마리", "subDef": "counter for animals — never for people or things: 강아지 한 마리, 새 세 마리."}], "examples": [{"kor": "고양이 두 마리를 키워요.", "eng": "I keep two cats."}]}, {"term": "1년에", "mainDef": "\"A year, per year.\"", "variants": ["1년에"], "subDefs": [{"subTerm": "-에 as in 1년에", "subDef": "after a length of time, -에 means \"per ~\", not a place or a time point."}], "examples": [{"kor": "일주일에 두 번 운동해요.", "eng": "I exercise twice a week."}]}, {"term": "이 돈으로", "mainDef": "\"With this money.\"", "variants": ["이 돈으로"], "subDefs": [{"subTerm": "-로/으로", "subDef": "here it marks the means — what you use to do something."}], "examples": [{"kor": "이 돈으로 책을 샀어요.", "eng": "I bought books with this money."}]}, {"term": "네덜란드", "mainDef": "The Netherlands.", "variants": ["네덜란드"], "subDefs": [], "examples": [{"kor": "네덜란드는 자전거의 나라예요.", "eng": "The Netherlands is a country of bicycles."}]}, {"term": "동물 경찰", "mainDef": "\"Animal police\" — officers whose job is protecting animals.", "variants": ["동물 경찰"], "subDefs": [{"subTerm": "경찰", "subDef": "the police, or a police officer."}], "examples": [{"kor": "경찰이 빨리 왔어요.", "eng": "The police came quickly."}]}, {"term": "때리거나 버리는 사람", "mainDef": "\"People who hit or abandon (animals).\"", "variants": ["때리거나 버리는 사람"], "subDefs": [{"subTerm": "때리다", "subDef": "to hit, to strike."}, {"subTerm": "-거나", "subDef": "\"or\", joining two verbs. For nouns you use -나 instead."}], "examples": [{"kor": "주말에는 책을 읽거나 영화를 봐요.", "eng": "At weekends I read or watch films."}]}, {"term": "찾다", "mainDef": "To look for something ⸺ also \"to find it\". Korean uses one word for both, so the sentence tells you which.", "variants": ["찾아요"], "subDefs": [], "examples": [{"kor": "열쇠를 찾고 있어요.", "eng": "I'm looking for my keys."}]}, {"term": "지역마다", "mainDef": "\"In each region.\"", "variants": ["지역마다"], "subDefs": [{"subTerm": "지역", "subDef": "a region, an area."}, {"subTerm": "-마다", "subDef": "\"every ~, each ~\": 날마다, 사람마다, 지역마다."}], "examples": [{"kor": "나라마다 인사가 달라요.", "eng": "Greetings are different in every country."}]}, {"term": "벌을 주다", "mainDef": "To punish someone ⸺ 주다 is \"to give\", so Korean says you \"give a punishment\". The opposite is 상을 주다 (to give a prize).", "variants": ["벌을 주는"], "subDefs": [], "examples": [{"kor": "선생님이 벌을 줬어요.", "eng": "The teacher punished them."}]}, {"term": "찬성하다", "mainDef": "To be in favour of something, to agree with a plan.", "variants": ["찬성하는"], "subDefs": [], "examples": [{"kor": "저는 그 생각에 찬성해요.", "eng": "I'm in favour of that idea."}]}, {"term": "반대하다", "mainDef": "To be against something.", "variants": ["반대하는"], "subDefs": [], "examples": [{"kor": "부모님이 반대하셨어요.", "eng": "My parents were against it."}]}, {"term": "조심해서", "mainDef": "\"Carefully, being careful.\"", "variants": ["조심해서"], "subDefs": [{"subTerm": "조심하다", "subDef": "to be careful, to watch out."}, {"subTerm": "-아서/어서", "subDef": "here it shows the manner — doing one thing and carrying it into the next."}], "examples": [{"kor": "조심해서 들어가세요.", "eng": "Get home safely."}]}, {"term": "많아질 거예요", "mainDef": "\"There will be more of them.\"", "variants": ["많아질 거예요"], "subDefs": [{"subTerm": "-ㄹ/을 거예요", "subDef": "\"will ~\". A guess about what is going to happen, not a promise."}], "examples": [{"kor": "내일은 더 추울 거예요.", "eng": "It will be colder tomorrow."}]}, {"term": "걱정하다", "mainDef": "To worry about something.", "variants": ["걱정해요"], "subDefs": [], "examples": [{"kor": "시험 때문에 걱정해요.", "eng": "I'm worried about the exam."}]}];

        // ---------- 8. READING ----------
        function currentReading() { return READING_DATA.find(r => r.id === reading.activeId); }
        function buildVocabRanges(text) {
            const allTerms = VOCAB_READING_DATA.flatMap(v => { const terms = [v.term]; if (v.variants) terms.push(...v.variants); return terms.map(term => ({ term, vocab: v })); }).sort((a, b) => b.term.length - a.term.length);
            const ranges = [];
            allTerms.forEach(({ term, vocab }) => { let i = 0; while ((i = text.indexOf(term, i)) !== -1) { const end = i + term.length; const overlaps = ranges.some(m => (i >= m.start && i < m.end) || (end > m.start && end <= m.end)); if (!overlaps) ranges.push({ start: i, end, term, vocab }); i = end; } });
            return ranges;
        }
        function renderTextSegments(text, blockIndex, isHeading) {
            if (!text) return '';
            const blockId = `${reading.activeId}-${blockIndex}`;
            const blockHi = reading.highlights[blockId] || [];
            const vocabRanges = buildVocabRanges(text);
            const points = new Set([0, text.length]);
            blockHi.forEach(h => { points.add(h.start); points.add(h.end); });
            vocabRanges.forEach(v => { points.add(v.start); points.add(v.end); });
            const sorted = Array.from(points).sort((a, b) => a - b);
            let out = '';
            for (let i = 0; i < sorted.length - 1; i++) {
                const s = sorted[i], e = sorted[i + 1], mid = (s + e) / 2;
                let hiColor = null;
                for (let j = blockHi.length - 1; j >= 0; j--) { const h = blockHi[j]; if (h.start <= mid && h.end >= mid) { hiColor = h.color; break; } }
                const av = vocabRanges.find(v => v.start <= mid && v.end >= mid);
                let cls = 'transition-colors duration-200 decoration-clone ';
                if (hiColor === 'yellow') cls += 'bg-yellow-200 '; else if (hiColor === 'red') cls += 'bg-red-200 '; else if (hiColor === 'green') cls += 'bg-green-200 ';

ck inline-flex items-center gap-1">Gemini에서 열기 ${svgIcon('externalLink', 'w-3 h-3')}</a></p>`}</div>` : '';

        }

        // ---------- 9. VOCAB ----------

        /* ===== Flash Card 모듈 (어휘 탭) — 20개 큐레이션 카드 + 미디어 ===== */
        /* 미디어: GitHub raw에서 로드. 로컬 미디어 옆이면 FC_BASE=''로. */
        const FC_BASE = 'https://github.com/openkoreanlearninglab/hub/raw/refs/heads/main/flashcards/DECK-FOLDER/';
        const FC_IMG = FC_BASE+'images/', FC_VID = FC_BASE+'videos/', FC_AUD = FC_BASE+'audio/';
        const FC_CARDS = [
            /* ▣ 여기에 카드를 채우면 어휘 탭에 '플래시 카드' 토글이 자동으로 나타납니다.
                  비워 두면(=지금) 토글이 안 뜨고, 어휘 탭은 원본과 100% 동일합니다.
               필드: vocab(어휘), ko(한국어문장), hl(강조부분), en(영어), 
                     media:{type:'image'|'video', src, sound?}, back:{img}, audio  */

            // 예시) 이미지 앞면 + 음성  (개수 자유)
            // { vocab:'어휘1', ko:'문장이에요.', hl:'문장', en:'A sentence.', media:{type:'image',src:FC_IMG+'01.jpeg'}, audio:FC_AUD+'01.wav' },

        function fcPlay(src){ try{ if(!fcAudio)fcAudio=new Audio(); if(fcAudio.src!==src)fcAudio.src=src; fcAudio.currentTime=0; const p=fcAudio.play(); if(p&&p.catch)p.catch(function(){}); }catch(_){} }
        function fcStop(){ try{ if(fcAudio)fcAudio.pause(); }catch(_){} }
        function fcBold(ko,hl){ let s=esc(ko); if(!hl)return s; const h=esc(hl),i=s.indexOf(h); if(i<0)return s; return s.slice(0,i)+'<strong class="hl">'+h+'</strong>'+s.slice(i+h.length); }
        function fcStart(list){ const base=(list&&list.length?list:FC_CARDS.map(function(_,i){return i;})).slice(); fc.queue=fc.shuffled?shuffleArr(base):base; fc.pos=0; fc.flipped=false; fc.showTrans=false; fc.done=false; fc.status={}; }
        function fcCur(){ return FC_CARDS[fc.queue[fc.pos]]; }
        function fcCount(k){ return Object.keys(fc.status).filter(function(x){return fc.status[x]===k;}).length; }
        function fcUnknown(){ return Object.keys(fc.status).filter(function(x){return fc.status[x]==='unknown';}).map(Number); }
        /* 이미지 프리로드: 다음·이전 카드 이미지를 미리 받아 전환 시 검정 화면 제거 */
        const fcPre = {};
        function fcPreloadOne(url){ if(!url||fcPre[url])return; fcPre[url]=true; const im=new Image(); im.src=url; }
        function fcPreloadIdx(qp){ if(qp<0||qp>=fc.queue.length)return; const c=FC_CARDS[fc.queue[qp]]; if(!c)return; if(c.media&&c.media.type==='image')fcPreloadOne(c.media.src); if(c.back&&c.back.img)fcPreloadOne(c.back.img); }
        function fcPreloadAround(){ const c=fcCur(); if(c&&c.back&&c.back.img)fcPreloadOne(c.back.img); fcPreloadIdx(fc.pos+1); fcPreloadIdx(fc.pos+2); fcPreloadIdx(fc.pos-1); }
        const FC_ICON = {

            spk:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5L6 9H2v6h4l5 4V5z"/><path stroke-linecap="round" stroke-width="1.8" d="M15.5 8.5a5 5 0 010 7"/></svg>',
            eye:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg>'
        };
        function fcMediaHTML(c){ if(c.media.type==='video'){ const a=c.media.sound?'controls playsinline preload="metadata"':'autoplay muted loop playsinline preload="metadata"'; return '<video class="fc-video" src="'+esc(c.media.src)+'" '+a+'></video>'; } return '<img src="'+esc(c.media.src)+'" alt="'+esc(c.vocab)+'">'; }
        function fcFrontHTML(c){ const total=fc.queue.length||FC_CARDS.length; const pct=((fc.pos+1)/total)*100;
            return '<div class="fc-row"><span class="fc-tag">그림<span class="lk-en"> · Picture</span></span><span class="fc-count">'+(fc.pos+1)+' / '+total+'</span></div>'
            + '<div class="fc-media">'+fcMediaHTML(c)+'</div>'
            + '<p class="fc-cue"><b>이 장면을 한국어 문장으로 말해 보세요.</b><span class="lk-en"><br>Say this scene as a Korean sentence.</span><br>말한 뒤에 카드를 뒤집으세요.<span class="lk-en"><br>Then flip the card.</span></p>'
            + '<div class="fc-prog"><i style="width:'+pct+'%"></i></div>'; }
        function fcBackHTML(c){ const img=(c.back&&c.back.img)?'<img class="fc-bimg" src="'+esc(c.back.img)+'" alt="'+esc(c.vocab)+'">':'';
            return '<div class="fc-row"><span class="fc-tag">정답<span class="lk-en"> · Answer</span></span><span class="fc-vocab">'+esc(c.vocab)+'</span></div>'
            + '<div class="fc-bbody">'+img+'<p class="fc-sentence">'+fcBold(c.ko,c.hl)+'</p><p class="fc-trans" id="fc-trans"></p>'
            + '<div class="fc-bactions"><button type="button" class="fc-bbtn" data-action="fc-audio" aria-label="문장 듣기">'+FC_ICON.spk+' 듣기<span class="lk-en"> · Listen</span></button>'
            + '<button type="button" class="fc-bbtn" data-action="fc-trans" aria-pressed="false">'+FC_ICON.eye+' 번역<span class="lk-en"> · Translation</span></button></div></div>'
            + '<div class="fc-foot">카드 밖 버튼으로 스스로 평가하세요<span class="lk-en"> · Rate yourself below</span></div>'; }
        function fcCardHTML(){ const c=fcCur(); if(!c)return''; return '<div class="fc-card" data-action="fc-flip"><div class="fc-inner'+(fc.flipped?' flip':'')+'" id="fc-inner">'
            + '<div class="fc-face fc-front" id="fc-front">'+fcFrontHTML(c)+'</div><div class="fc-face fc-back" id="fc-back">'+fcBackHTML(c)+'</div></div></div>'; }
        function fcStatsHTML(){ return '<div class="fc-bar"><div class="fc-stats"><span class="k">알아요<span class="lk-en"> · Got it</span> <b id="fc-sk">'+fcCount('known')+'</b></span><span class="u">모르겠어요<span class="lk-en"> · Not yet</span> <b id="fc-su">'+fcCount('unknown')+'</b></span></div>'
            + '<div class="fc-order" role="group"><button type="button" class="fc-obtn'+(fc.shuffled?'':' on')+'" data-action="fc-order" data-sh="0">순서대로<span class="lk-en"> · In order</span></button><button type="button" class="fc-obtn'+(fc.shuffled?' on':'')+'" data-action="fc-order" data-sh="1">섞기<span class="lk-en"> · Shuffle</span></button></div></div>'; }
        function fcSummaryHTML(){ const k=fcCount('known'),u=fcCount('unknown'); return '<div class="fc-sum"><h3>한 바퀴 끝!<span class="lk-en"> · Round complete</span></h3>'
            + '<p class="line">알아요 <b style="color:#047857">'+k+'</b> · 모르겠어요 <b style="color:#b91c1c">'+u+'</b> / 전체 '+FC_CARDS.length+'</p>'
            + '<div class="acts">'+(u?'<button type="button" class="fc-sbtn pri" data-action="fc-again-u">모르는 카드만 다시 ('+u+'장, 섞어서)</button>':'')+'<button type="button" class="fc-sbtn" data-action="fc-again-all">전체 다시 하기 (섞어서)</button></div></div>'; }
        function fcDeckHTML(){ if(!fc.queue.length)fcStart(null); if(fc.done)return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcSummaryHTML()+'</div>';
            return '<div class="fc-wrap" id="fc-deck">'+fcStatsHTML()+fcCardHTML()
            + '<div class="fc-judge"><button type="button" class="fc-jbtn k" data-action="fc-know">알아요<span class="lk-en"> · Got it</span></button><button type="button" class="fc-jbtn u" data-action="fc-dont">모르겠어요<span class="lk-en"> · Not yet</span></button></div>'
            + '<div class="fc-ctrls"><button type="button" class="fc-ibtn" data-action="fc-prev" aria-label="이전 카드">'+FC_ICON.prev+'</button><button type="button" class="fc-fbtn" data-action="fc-flip">뒤집기<span class="lk-en"> · Flip</span></button><button type="button" class="fc-ibtn" data-action="fc-next" aria-label="다음 카드">'+FC_ICON.next+'</button></div>'
            + '<p class="fc-hint"><span class="lk-ko-only"><kbd>Space</kbd> 뒤집기 · <kbd>&larr;</kbd><kbd>&rarr;</kbd> 이전/다음 · <kbd>1</kbd> 알아요 · <kbd>2</kbd> 모르겠어요 · <kbd>S</kbd> 순서/섞기</span><span class="lk-en"><kbd>Space</kbd> Flip · <kbd>&larr;</kbd><kbd>&rarr;</kbd> Prev/Next · <kbd>1</kbd> Got it · <kbd>2</kbd> Not yet · <kbd>S</kbd> Order/Shuffle</span></p>'
            + '</div>'; }
        function fcSync(){ const root=viewRoot(); if(!root)return; const c=fcCur(); if(!c)return; const f=qs('#fc-front',root),b=qs('#fc-back',root); if(f)f.innerHTML=fcFrontHTML(c); if(b)b.innerHTML=fcBackHTML(c); fcApplyFlip(); fcPreloadAround(); }
        function fcApplyFlip(){ const root=viewRoot(); if(!root)return; const el=qs('#fc-inner',root); if(el)el.classList.toggle('flip',fc.flipped); const tr=qs('#fc-trans',root); if(tr)tr.textContent=fc.showTrans?fcCur().en:''; const tb=qs('#fc-back [data-action="fc-trans"]',root); if(tb)tb.classList.toggle('on',fc.showTrans); }
        function fcRefreshStats(){ const root=viewRoot(); if(!root)return; const k=qs('#fc-sk',root),u=qs('#fc-su',root); if(k)k.textContent=fcCount('known'); if(u)u.textContent=fcCount('unknown'); }
        function fcRefreshDeck(){ const d=qs('#fc-deck',viewRoot()); if(d)d.outerHTML=fcDeckHTML(); else paint(); fcPreloadAround(); }
        function fcSetFlip(v){ fc.flipped=v; fcApplyFlip(); if(v)fcPlay(fcCur().audio); else fcStop(); }
        function fcGo(fn){ fcStop(); fc.flipped=false; fc.showTrans=false; fn(); if(fc.done)fcRefreshDeck(); else fcSync(); }
        function fcMark(kind){ fc.status[fc.queue[fc.pos]]=kind; fcRefreshStats(); fcGo(function(){ if(fc.pos+1>=fc.queue.length)fc.done=true; else fc.pos+=1; }); }
        function fcSetOrder(sh){ if(sh===fc.shuffled)return; fc.shuffled=sh; const m=fc.queue.slice(); fc.queue=sh?shuffleArr(m):m.slice().sort(function(a,b){return a-b;}); fcStop(); fc.pos=0; fc.flipped=false; fc.showTrans=false; fcRefreshDeck(); }


        // ---------- 9-b. 핵심 문법 (어휘 탭 하단 섹션) ----------
        function grammarSectionHTML() {
            if (typeof GRAMMAR_DATA === 'undefined' || !Array.isArray(GRAMMAR_DATA) || !GRAMMAR_DATA.length) return '';
            const cards = GRAMMAR_DATA.map((g) => {
                const ex = g.example ? `<div class="bg-gray-50 p-5 mt-auto border-l-2 border-transparent group-hover:border-gray-300 transition-all"><p class="text-[15px] text-[#1a1a1a] font-serif leading-snug">${esc(g.example)}</p>${g.exampleEng ? `<p class="lk-en text-[13px] text-gray-500 font-sans mt-2 pt-2 border-t border-gray-200">${esc(g.exampleEng)}</p>` : ''}</div>` : '';
                return `<div class="border border-gray-200 hover:border-gray-300 transition-colors p-6 flex flex-col group bg-white h-full"><h3 class="text-[22px] font-bold font-serif text-[#1a1a1a] mb-4 group-hover:text-black transition-colors">${esc(g.pattern)}</h3><div class="mb-6 flex-1"><p class="text-[17px] text-[#444] font-serif leading-relaxed">${esc(g.explanation)}</p>${g.explanationEng ? `<p class="lk-en text-sm text-gray-500 font-sans mt-2 leading-relaxed">${esc(g.explanationEng)}</p>` : ''}</div>${ex}</div>`;
            }).join('');
            return `<div class="mb-16"><div class="flex items-center gap-3 mb-8"><h3 class="text-xl font-bold font-serif text-black">핵심 문법</h3><div class="h-px flex-1 bg-gray-200"></div><span class="lk-en text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Key Grammar</span></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div></div>`;
        }
        function pwGrammarHTML() {
            if (typeof GRAMMAR_DATA === 'undefined' || !GRAMMAR_DATA.length) return '';
            const pages = [];
            for (let i = 0; i < GRAMMAR_DATA.length; i += 4) pages.push(GRAMMAR_DATA.slice(i, i + 4));
            return pages.map(pg => `<div class="pw-vocab-page"><div class="pw-vocab-grid">${pg.map(g => `<div class="pw-vocab-card"><div class="pw-term">${esc(g.pattern || '')}</div><div class="pw-def">${esc(g.explanation || '')}</div>${g.example ? `<div class="pw-def">${esc(g.example)}</div>` : ''}</div>`).join('')}</div></div>`).join('');
        }
        function vocabHTML() {
            const hasFC = (typeof FC_CARDS !== "undefined") && FC_CARDS.length > 0;
            const modeBar = hasFC ? `<div class="fc-modebar print:hidden"><button type="button" data-action="fc-mode" data-mode="list" class="fc-modebtn${fc.mode==='list'?' on':''}">어휘 카드<span class="lk-en"> · Vocab Cards</span></button><button type="button" data-action="fc-mode" data-mode="card" class="fc-modebtn${fc.mode==='card'?' on':''}">플래시 카드<span class="lk-en"> · Flash Cards</span></button></div>` : '';
            const header = `<div class="max-w-4xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in"><div class="mb-16 flex flex-col items-center text-center"><h2 class="text-[32px] md:text-[36px] font-bold text-[#1a1a1a] leading-tight font-serif mb-3 tracking-tight">핵심 어휘</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Key Vocabulary</span><div class="w-[1px] h-6 bg-gray-200 mt-8"></div></div>`;
            const listRest = `<div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100"><div class="relative w-full sm:max-w-xs"><input type="text" id="vocab-search" value="${esc(vocabState.query)}" placeholder="${secLang() ? '단어, 뜻, 영어 검색... / Search words...' : '단어, 뜻, 영어 검색...'}" class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800 transition-all" />${vocabState.query ? '<button type="button" data-action="vocab-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs font-bold">✕</button>' : ''}</div><div class="flex items-center gap-4 w-full sm:w-auto justify-end"><span class="text-xs text-gray-500 font-sans">검색 결과: <strong id="vocab-count">${vocabFiltered().length}</strong>개 / 전체 ${VOCAB_READING_DATA.length}개</span><button type="button" data-action="vocab-global" class="px-4 py-2 text-xs font-semibold rounded-lg border transition-all ${vocabState.globalTrans ? 'bg-gray-900 text-white border-gray-900 hover:bg-black' : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'}">${vocabState.globalTrans ? '영어 일괄 숨기기<span class="lk-en"> · Hide English</span>' : '영어 일괄 표시<span class="lk-en"> · Show English</span>'}</button></div></div><div class="mb-16"><div class="flex items-center gap-3 mb-8"><h3 class="text-xl font-bold font-serif text-black">읽기 자료 어휘</h3><div class="h-px flex-1 bg-gray-200"></div><span class="lk-en text-xs font-sans text-gray-400 font-bold uppercase tracking-widest">Reading</span></div><div id="vocab-grid">${vocabGridHTML()}</div></div>${grammarSectionHTML()}</div>`;
            const body = (hasFC && fc.mode==='card') ? fcDeckHTML() : listRest;
            return `${header}${modeBar}${body}`;
        }
        function refreshVocabGrid() { const g = qs('#vocab-grid', viewRoot()); if (g) g.innerHTML = vocabGridHTML(); const c = qs('#vocab-count', viewRoot()); if (c) c.textContent = vocabFiltered().length; }

        // ---------- 10. QUIZ ----------

        function ensureQuizOpts() { QUIZ_LIST.forEach(q => { if (!quizState.opts[q.id]) quizState.opts[q.id] = shuffleArr(q.options); if (!quizState.q[q.id]) quizState.q[q.id] = { selected: null, showHint: false, showTrans: false, solved: false, attempted: false }; }); }
        function quizScore() { const c = Object.values(quizState.attempts).filter(Boolean).length; return Math.round((c / QUIZ_LIST.length) * 100); }
        function quizItemHTML(quiz) {
            const opts = quizState.opts[quiz.id]; const st = quizState.q[quiz.id];
            const sel = st.selected != null ? opts[st.selected] : null;
            const blank = st.solved ? esc(quiz.correct_word) : (sel && !sel.isCorrect ? esc(sel.text) : '      ');
            const blankCls = st.solved ? 'text-green-600 border-green-500' : (sel && !sel.isCorrect ? 'text-red-500 border-red-400' : 'text-gray-400 border-gray-400 min-w-[80px]');
            const optBtns = opts.map((o, idx) => { let cls = 'bg-white border-gray-200 hover:border-gray-400 hover:shadow-sm text-gray-700'; if (st.solved && o.isCorrect) cls = 'bg-green-50 border-green-500 text-green-800'; else if (sel === o) cls = o.isCorrect ? 'bg-green-50 border-green-500 text-green-800' : 'bg-red-50 border-red-300 text-red-800'; const mark = (st.solved && o.isCorrect) ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">✓</span>' : (sel === o && !o.isCorrect ? '<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500">✕</span>' : ''); return `<button type="button" data-opt="${idx}" ${(st.solved && o.isCorrect) ? 'disabled' : ''} class="p-4 text-left border rounded-lg transition-all font-serif text-base relative ${cls}"><span class="font-bold mr-2 text-sm font-sans text-gray-400">${String.fromCharCode(65 + idx)}.</span>${esc(o.text)}${mark}</button>`; }).join('');
            const feedback = sel ? `<div class="p-4 rounded-lg text-sm mb-4 animate-fade-in ${sel.isCorrect ? 'bg-green-50 text-green-800 border border-green-100' : 'bg-red-50 text-red-800 border border-red-100'}"><p class="font-bold mb-1 font-sans">${sel.isCorrect ? '정답입니다! 🎉' : '다시 생각해보세요.'}</p><p class="font-serif leading-relaxed">${esc(sel.feedback)}</p></div>` : '';
            return `<div class="quiz-q mb-16 pb-8 border-b border-gray-100 last:border-0" data-qid="${quiz.id}"><div class="flex items-center gap-3 mb-4"><span class="text-xs font-bold font-sans text-black border border-black px-1.5 py-0.5">Q.${quiz.id}</span><div class="flex flex-col"><h3 class="text-lg font-bold font-serif text-gray-900 leading-snug">${esc(quiz.questionKor)}</h3><p class="lk-en text-xs font-sans text-gray-400">${esc(quiz.questionEng)}</p></div></div><div class="bg-gray-50 p-6 rounded-lg mb-6 border border-gray-200"><div class="text-xl font-serif text-gray-900 leading-loose text-left whitespace-pre-wrap"><span>${esc(quiz.sentence_pre)}</span><span class="inline-block border-b-2 px-2 mx-1 font-bold transition-colors ${blankCls}">${blank}</span><span>${esc(quiz.sentence_post)}</span></div>${st.showTrans ? `<div class="mt-6 pt-6 border-t border-gray-200 text-left animate-fade-in"><p class="text-xs font-sans text-gray-400 mb-1">Translation:</p><p class="text-sm font-serif text-gray-600 leading-relaxed">${quiz.translation ? esc(quiz.translation) : (esc(quiz.translation_pre) + '<strong>' + esc(quiz.translation_answer || quiz.correct_word) + '</strong>' + esc(quiz.translation_post))}</p></div>` : ''}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">${optBtns}</div>${feedback}<div class="flex items-center gap-4 text-xs font-bold font-sans"><button type="button" data-q="hint" class="text-gray-400 hover:text-journal-black uppercase tracking-widest transition-colors">힌트<span class="lk-en"> · Hint</span></button><div class="h-3 w-px bg-gray-300"></div>${transBtn('q-trans', st.showTrans)}</div>${st.showHint ? `<div class="mt-3 text-sm font-sans text-gray-500 italic animate-fade-in">💡 Hint: ${esc(quiz.hint)}</div>` : ''}</div>`;
        }
        function quizHTML() {
            ensureQuizOpts();
            return `<div class="max-w-3xl mx-auto w-full px-6 pt-40 pb-20 animate-fade-in flex flex-col gap-8"><div class="mb-12 md:mb-16 text-center"><h2 class="font-serif-kr text-3xl md:text-4xl text-gray-900 font-semibold leading-tight">내용 확인 퀴즈</h2><span class="lk-en block font-eng-header text-[11px] md:text-xs tracking-[0.2em] text-gray-400 uppercase mt-2">Comprehension Quiz</span><div class="w-12 h-px bg-gray-200 mx-auto mt-12 md:mt-16"></div></div><div class="flex-1" id="quiz-list">${QUIZ_LIST.map(quizItemHTML).join('')}</div><div class="mt-8 pt-12 border-t border-gray-100 flex flex-col items-center gap-10"><div class="flex flex-col items-center"><span class="text-[10px] font-bold font-eng-header text-gray-400 uppercase tracking-[0.2em] mb-2">정답률<span class="lk-en"> / Accuracy</span></span><span class="text-5xl font-serif-kr font-bold text-journal-black tracking-tight" id="quiz-score">${quizScore()}%</span></div><button type="button" data-action="quiz-retry" class="group flex items-center gap-3 px-6 py-3 bg-white border border-gray-200 hover:border-black hover:bg-gray-50 transition-all duration-300">${svgIcon('retry', 'w-4 h-4 text-gray-400 group-hover:text-black transition-colors')}<div class="flex flex-col items-start leading-none gap-1"><span class="text-xs font-bold font-sans-kr text-gray-900 group-hover:text-black">다시 풀기</span><span class="lk-en text-[9px] font-eng-header font-medium tracking-wider text-gray-400 group-hover:text-gray-600 uppercase">Retry</span></div></button></div></div>`;
        }
        function rerenderQuizQ(qid) { const el = qs(`.quiz-q[data-qid="${qid}"]`, viewRoot()); if (el) el.outerHTML = quizItemHTML(QUIZ_LIST.find(q => String(q.id) === String(qid))); }
        function updateQuizScore() { const sc = qs('#quiz-score', viewRoot()); if (sc) sc.textContent = quizScore() + '%'; }

        // ---------- 11. DISCUSS ----------
        function discussItemHTML(item) {
            const st = discussState[item.id] || (discussState[item.id] = { text: '', showTrans: false, feedback: null, loading: false, fbTrans: false });
            const vocab = item.vocab.map(v => `<div><p class="text-sm font-serif text-gray-700"><span class="font-bold text-black mr-2">${esc(v.term)}</span>${esc(v.def)}</p>${st.showTrans && v.defEng ? `<p class="text-[13px] font-sans text-gray-500 mt-1 animate-fade-in"><span class="font-bold mr-2">${esc(v.termEng || '')}</span>${esc(v.defEng)}</p>` : ''}</div>`).join('');
            let fb = '';
            if (st.feedback) {
                const corr = (st.feedback.corrections || []).map(c => `<div class="border border-gray-100 p-5 bg-white"><div class="flex items-start gap-4 mb-3"><span class="shrink-0 text-[11px] font-bold px-2 py-0.5 bg-gray-100 text-gray-400 mt-0.5">수정 전</span><p class="text-[15px] font-serif text-gray-400 line-through leading-relaxed">${esc(c.original)}</p></div><div class="flex items-start gap-4 mb-5"><span class="shrink-0 text-[11px] font-bold px-2 py-0.5 bg-blue-50 text-blue-600 mt-0.5">수정 후</span><p class="text-[15px] font-serif text-gray-900 font-bold leading-relaxed">${esc(c.corrected)}</p></div><div class="pt-4 border-t border-gray-100 border-dashed"><span class="font-bold text-gray-400 text-[11px] mr-2 font-sans">💡 설명</span><span class="text-[14px] font-serif text-gray-700 leading-relaxed">${esc(c.explanation)}</span>${st.fbTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-2 ml-6 animate-fade-in">${esc(c.explanationTrans)}</p>` : ''}</div></div>`).join('');
                fb = `<div class="mt-8 border border-gray-100 rounded-sm p-6 bg-white animate-fade-in shadow-sm"><h4 class="text-lg font-bold font-serif flex items-center gap-2 mb-6 text-gray-900">${svgIcon('sparkles', 'w-5 h-5 text-gray-700', { fill: 'currentColor' })} AI 한국어 도우미</h4><div class="bg-gray-50 px-5 py-4 mb-8 border-l-[3px] border-gray-800"><span class="text-xs font-bold text-gray-500 mb-2 block font-sans">총평 및 잘한 점</span><p class="text-[15px] font-serif text-gray-800 leading-relaxed">${esc(st.feedback.overallComment)}</p>${st.fbTrans && st.feedback.overallCommentTrans ? `<p class="text-[13px] font-sans text-gray-500 mt-2 pt-2 border-t border-gray-200 animate-fade-in">${esc(st.feedback.overallCommentTrans)}</p>` : ''}</div>${corr ? `<h5 class="text-xs font-bold text-gray-500 mb-4 font-sans">문장별 교정 및 설명</h5><div class="space-y-6">${corr}</div>` : ''}<div class="flex justify-end mt-4">${transBtn('discuss-fbtrans', st.fbTrans)}</div></div>`;

        // ---------- 학습지 인쇄 (섹션 선택·방식3) ----------
        function pwVocabData() {

        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }

        function pwRun(sel, withAns, silent) {

        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {

        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 12. 이벤트 위임 (안정적 #app 에 1회만) ----------
        appEl.addEventListener('click', (e) => {
            const rdo = e.target.closest('[data-reading-open]'); if (rdo) { reading.activeId = +rdo.dataset.readingOpen; setTab('reading'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            const hdr = e.target.closest('[data-action="toggle-header"]'); if (hdr) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            const a = e.target.closest('[data-action]');
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            const _sl = e.target.closest('[data-setlang]');
            if (_sl) { app.lang = _sl.getAttribute('data-setlang'); app.langOpen = false; buildApp(); return; }
            if (e.target.closest('[data-action="lang-toggle"]')) { app.langOpen = !app.langOpen; buildApp(); return; }
            const _wasLangOpen = app.langOpen; app.langOpen = false;
            if (_wasLangOpen && !e.target.closest('[data-tab],[data-action],[data-vocab-idx],[data-did]')) { buildApp(); return; }
            const tab = app.activeTab;

            if (tab === 'reading') {
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_READING_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.term === w.term) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const hc = e.target.closest('[data-hcolor]'); if (hc) { reading.color = hc.dataset.hcolor; paint(); return; }
                const rd = e.target.closest('[data-reading]'); if (rd) { reading.activeId = +rd.dataset.reading; paint(); return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action="sb-trans"]');
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; const showing = sb.dataset.trans === '1'; sb.dataset.trans = showing ? '' : '1'; sb.innerHTML = readingVocabContentHTML(VOCAB_READING_DATA[i], !showing, 'sb-trans'); return; }
                if (a) {

                if (modeBtn) { const m = modeBtn.dataset.mode; if (m !== fc.mode) { fc.mode = m; if (m === 'card') fcStart(null); fcStop(); paint(); if (m === 'card') fcPreloadAround(); } return; }
                if (fc.mode === 'card') {
                    if (e.target.closest('.fc-video')) return;

                        else if (act === 'fc-know') fcMark('known');
                        else if (act === 'fc-dont') fcMark('unknown');
                        else if (act === 'fc-prev') fcGo(function(){ fc.pos=(fc.pos-1+fc.queue.length)%fc.queue.length; });
                        else if (act === 'fc-next') fcGo(function(){ fc.pos=(fc.pos+1)%fc.queue.length; });

                        else if (act === 'fc-trans') { fc.showTrans=!fc.showTrans; fcApplyFlip(); }

                const opt = e.target.closest('[data-opt]'); if (opt) { const idx = +opt.dataset.opt; const o = quizState.opts[qid][idx]; if (st.solved && o.isCorrect) return; st.selected = idx; if (!st.attempted) { st.attempted = true; quizState.attempts[qid] = o.isCorrect; } if (o.isCorrect) st.solved = true; rerenderQuizQ(qid); updateQuizScore(); return; }

        // 어휘 탭 · 플래시 카드 모드 키보드 (PC용)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'vocab' || fc.mode !== 'card' || fc.done) return;
            const ae = document.activeElement;
            if (ae && (['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName) || ae.isContentEditable)) return;
            if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fcSetFlip(!fc.flipped); }

            else if (e.key === '2') { fcMark('unknown'); }

        appEl.addEventListener('mouseout', (e) => {
            if (app.activeTab !== 'reading') return;
            const span = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!span) return;
            if (popupEl && popupEl.dataset.fixed) return;
            if (e.relatedTarget && span.contains(e.relatedTarget)) return;
            closeVocabPopup();
        });
        // reading: 형광펜 선택
        appEl.addEventListener('mouseup', () => { if (app.activeTab === 'reading') handleTextMouseUp(); });

        function handleTextMouseUp() {
            if (!reading.highlightMode) return;
            const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
            let container = sel.anchorNode && sel.anchorNode.parentElement;
            while (container && !(container.dataset && container.dataset.blockIndex)) container = container.parentElement;
            if (!container) return;
            const blockId = `${reading.activeId}-${container.dataset.blockIndex}`;
            const range = sel.getRangeAt(0);
            const start = getContainerOffset(container, range.startContainer, range.startOffset);
            const end = getContainerOffset(container, range.endContainer, range.endOffset);
            const s = Math.min(start, end), e2 = Math.max(start, end); if (s === e2) return;
            const cur = reading.highlights[blockId] || [];
            if (reading.color === 'eraser') {
                const next = [];
                for (const h of cur) { const os = Math.max(h.start, s), oe = Math.min(h.end, e2); if (os < oe) { if (h.start < os) next.push({ start: h.start, end: os, color: h.color }); if (h.end > oe) next.push({ start: oe, end: h.end, color: h.color }); } else next.push(h); }
                reading.highlights[blockId] = next;
            } else { reading.highlights[blockId] = [...cur, { start: s, end: e2, color: reading.color }]; }
            sel.removeAllRanges();
            rerenderReadingBlocks();
        }

        async function runDiscussFeedback(id) {
            const st = discussState[id]; if (!st.text.trim() || st.loading) return;
            st.loading = true; st.feedback = null; rerenderDiscussItem(id);
            try {
                const prompt = `당신은 친절한 'AI 한국어 도우미'입니다. 학습자의 한국어 문장을 교정하고 설명하세요. 반드시 JSON으로만 응답하세요. 형식: {"overallComment":"","overallCommentTrans":"","corrections":[{"original":"","corrected":"","explanation":"","explanationTrans":""}]}`;
                const payload = { contents: [{ role: 'user', parts: [{ text: prompt + `\n\n질문: ${DISCUSS_DATA.find(d => d.id === id).questionKor}\n학습자 작성 문장: ${st.text}` }] }], generationConfig: { responseMimeType: 'application/json' } };
                const result = await callGeminiWithBackoff(payload);
                let jt = result.candidates[0].content.parts[0].text; jt = jt.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                st.feedback = JSON.parse(jt);
            } catch (err) { st.feedback = { overallComment: '피드백을 받아오는 중 오류가 발생했습니다. (API 키가 없거나 요청 형식 오류)', overallCommentTrans: err.message, corrections: [] }; }
            finally { st.loading = false; rerenderDiscussItem(id); }
        }

        // ---------- 13. 시작 ----------
        buildApp();
    })();
    </script>
