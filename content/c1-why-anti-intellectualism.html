        const DISCUSS_DATA = [{"id": 1, "questionKor": "'엘리트'라는 말을 들으면 어떤 사람이 먼저 떠올라요? 그 말이 칭찬으로 들려요, 아니면 비꼬는 말로 들려요?", "questionEng": "When you hear the word 'elite', what kind of person comes to mind first? Does it sound like praise, or like sarcasm?", "vocab": [{"term": "엘리트", "termEng": "elite", "def": "한 사회에서 뛰어난 능력이나 높은 자리를 가진 소수의 사람이에요.", "defEng": "A small group of people with outstanding ability or high status in a society."}, {"term": "떠오르다", "termEng": "to come to mind", "def": "어떤 생각이나 모습이 머릿속에 생각나요.", "defEng": "For a thought or image to pop into your head."}, {"term": "비꼬다", "termEng": "to be sarcastic", "def": "칭찬하는 척하면서 실제로는 놀리거나 깎아내려요.", "defEng": "To mock or belittle someone while pretending to praise them."}]}, {"id": 2, "questionKor": "여러분의 나라 말에도 원래 좋은 뜻이던 말이 점점 나쁜 뜻으로 바뀐 예가 있어요? 그 변화 뒤에는 사람들의 어떤 생각이 숨어 있을까요?", "questionEng": "In your language, is there a word that started out positive and gradually turned negative? What change in people's thinking might lie behind it?", "vocab": [{"term": "의미가 바뀌다", "termEng": "for a meaning to change", "def": "같은 말이 시간이 지나면서 다른 뜻으로 쓰이게 돼요.", "defEng": "For the same word to come to be used with a different meaning over time."}, {"term": "내포하다", "termEng": "to imply, to connote", "def": "어떤 뜻을 겉으로 말하지 않고 속에 품고 있어요.", "defEng": "To carry a meaning inside without stating it openly."}, {"term": "의식", "termEng": "attitudes, awareness", "def": "어떤 일이나 사람에 대해 가진 생각과 느낌이에요.", "defEng": "The thoughts and feelings people hold about something."}]}, {"id": 3, "questionKor": "누군가 내가 쓴 말이 틀렸다고 지적해서 기분이 나빴던 적이 있어요? 그 기분 나쁨을 지금 다시 짚어 보면, 무엇 때문이었던 것 같아요?", "questionEng": "Have you ever felt annoyed when someone pointed out that a word you used was wrong? Looking back at that feeling now, what do you think caused it?", "vocab": [{"term": "지적하다", "termEng": "to point out (a mistake)", "def": "잘못된 점을 꼭 집어서 말해요.", "defEng": "To name exactly what is wrong."}, {"term": "짚어 보다", "termEng": "to look into, to examine", "def": "어떤 일이 맞는지 // 오류 객체: { code, status, detail } — 문구는 그릴 때 모드에 맞춰 만듦
function AppError(code, status, detail) { const e = new Error(String(code)); e.code = code; e.status = status || 0; e.detail = detail || ''; return e; }
// HTTP 상태 + 서버 메시지로 오류 종류를 정함 (회사마다 같은 문제를 다른 번호로 보내기도 함)
function classifyError(e) {
  if (!e) return 'format';
  if (typeof e.code === 'string' && ERR_TEXT[e.code] && e.code !== 'http') return e.code;
  const st = e.status, d = (e.detail || '').toLowerCase();
  if (/credit balance|insufficient_quota|billing/.test(d)) return 'credit';
  if (st === 401 || (st === 400 && /api[ _]?key|api_key_invalid|authentication|invalid x-api-key/.test(d))) return 'key';
  if (st === 403) return 'perm';
  if (st === 404) return 'model';
  if (st === 400) return 'badRequest';
  if (st === 429) return 'limit';
  if ([500, 502, 503, 504, 529].includes(st)) return 'busy';
  return st ? 'http' : 'format';
}
function errText(code, lang, n) { const t = ERR_TEXT[code] || ERR_TEXT.http; return t[lang].replace('{n}', n || ''); }
function errHTML(mode, prefix, e) {
  if (!e) return '';
  const code = classifyError(e), t = ERR_TEXT[code];
  const P = AI_PROVIDERS[aiState.provider];
  const fill = (x) => x.replace('{n}', e.status || '').replace('{ai} 사이트', P.keySite).replace('{ai} 사이트', P.keySite).replace(/{ai}(?= and)/, P.keySite).replace('{ai}', P.label);
  const ko = fill(`${ERR_TEXT[prefix].ko} ${t.ko}`), en = fill(`${ERR_TEXT[prefix].en} ${t.en}`);
  const msg = mode === 'A' ? esc(en) : mode === 'C' ? esc(ko) : `${esc(ko)}<span class="aifb-block">${esc(en)}</span>`;
  const fixKo = (t.fixKo || []).map(fill), fixEn = (t.fixEn || []).map(fill);
  const items = fixKo.map((k, i) => `<li>${mode === 'A' ? esc(fixEn[i]) : mode === 'C' ? esc(k) : `${esc(k)}<span class="aifb-block">${esc(fixEn[i] || '')}</span>`}</li>`).join('');
  const label = mode === 'A' ? 'Try this' : mode === 'C' ? '이렇게 해 보세요' : '이렇게 해 보세요 · Try this';
  const fix = items ? `<div class="err-fix"><span class="err-fix-t">${label}</span><ul>${items}</ul></div>` : '';
  const detail = e.detail ? `<details class="err-d"><summary>${mode === 'C' ? '자세히' : mode === 'A' ? 'Details' : '자세히 · Details'}</summary><pre>${esc(e.detail)}</pre></details>` : '';
  return `<div class="err"><p class="err-m">${msg}</p>${fix}${detail}</div>`;
}

const str = (v) => (typeof v === 'string' ? v : (v == null ? '' : String(v))).trim();
const arr = (v) => (Array.isArray(v) ? v : []);
// 허용 강조(**단어**)만 <b>로, 나머지 마크다운 기호는 제거
const richText = (s) => esc(str(s).replace(/`/g, '').replace(/^#+\s*/gm, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*/g, '');
const numMark = (n) => (n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`);

/* =====================================================================
   5. 응답 정리 (어느 모델이든 같은 모양으로)
   ===================================================================== */
function extractJSON(text) {
  let t = str(text).replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a === -1 || b === -1) throw AppError('format');
  return JSON.parse(t.slice(a, b + 1));
}

// 문장 끝 종결어미 종류: 'nida' | 'yo' | 'da' | ''  (따옴표·괄호·문장부호는 무시)
function endingStyle(t) {
  const x = str(t).replace(/[\s"'”’」』)\].,!?…~]+$/u, '');
  if (/(니다|니까)$/.test(x)) return 'nida';
  if (/요$/.test(x)) return 'yo';
  if (/다$/.test(x)) return 'da';
  if (/(어|아|해|야|지|래|네|게)$/.test(x)) return 'ban';   // 반말 (-어/-아/-야 …)
  return '';
}
// 학습자 글에서 가장 많이 쓴 종결어미
function dominantEnding(text) {
  const count = { nida: 0, yo: 0, da: 0, ban: 0 };
  str(text).split(/(?<=[.!?])\s+|\n+/).forEach(sen => { const k = endingStyle(sen); if (k) count[k]++; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  return count[top] ? top : '';
}
// 가장 많이 쓴 종결어미와 다르게 끝난 문장 (AI에게 미리 알려 줌 — 모델이 놓치지 않도록)
const ENDING_LABEL = { da: "'-다'", yo: "'-요'", nida: "'-ㅂ니다/-습니다'", ban: "반말('-어/-아/-야')" };
function splitSentences(text) { return str(text).split(/(?<=[.!?])\s+|\n+/).map(x => x.trim()).filter(Boolean); }
function mixedEndingSentences(text) {
  const dom = dominantEnding(text);
  if (!dom) return { dom, list: [] };
  return { dom, list: splitSentences(text).filter(sen => { const k = endingStyle(sen); return k && k !== dom; }) };
}
// AI가 학습자의 종결어미를 바꾸는 제안을 하면 걸러 냄 (모델과 상관없이 코드가 보장)
function keepEndingStyle(items, key, dom, isStyleFix) {
  if (!dom) return items;
  return items.filter(it => {
    const before = endingStyle(it.original), after = endingStyle(it[key]);
    if (!before || !after) return true;          // 문장 끝이 아닌 부분 수정은 그대로
    if (isStyleFix(it)) return after === dom;    // 종결어미 섞임 수정은 많이 쓴 쪽으로만
    return after === before;                     // 그 밖의 제안은 원래 종결어미를 유지할 때만
  });
}
// ---- 추가 검사 (모델과 상관없이 코드가 보장) ----
const PARTICLES = ['', '은', '는', '이', '가', '을', '를', '에', '에서', '에게', '의', '도', '만', '로', '으로', '와', '과', '랑', '이랑', '하고', '께서'];
const eojeols = (t) => str(t).split(/\s+/).filter(Boolean);
// 조사 하나만 바꾼 주황 제안인가 (조사 문제는 빨강에서 이유와 함께 다룸)
function isParticleOnlyChange(a, b) {
  const x = eojeols(a.replace(/[.!?,]$/, '')), y = eojeols(b.replace(/[.!?,]$/, ''));
  if (x.length !== y.length) return false;
  const diff = x.map((w, i) => i).filter(i => x[i] !== y[i]);
  if (diff.length !== 1) return false;
  const p = x[diff[0]], q = y[diff[0]];
  let k = 0; while (k < p.length && k < q.length && p[k] === q[k]) k++;
  return k > 0 && PARTICLES.includes(p.slice(k)) && PARTICLES.includes(q.slice(k));
}
// 고친 말을 원래 자리에 넣었을 때 바로 앞뒤 말과 겹치면 겹친 부분을 뺌 (예: '근본적인 근본적인')
function trimOverlap(item, key, text, fixedText) {
  // 고친 부분에 대한 제안이면 original이 고친 글(fixedText)에 있음
  if (text.indexOf(item.original) < 0 && fixedText && fixedText.indexOf(item.original) >= 0) text = fixedText;
  const pos = text.indexOf(item.original);
  if (pos < 0) return item;
  let v = item[key];
  const before = eojeols(text.slice(0, pos)), after = eojeols(text.slice(pos + item.original.length));
  for (let n = 3; n >= 1; n--) {
    const head = eojeols(v).slice(0, n).join(' '), tail = before.slice(-n).join(' ');
    if (before.length >= n && head && head === tail && !item.original.startsWith(head)) { v = eojeols(v).slice(n).join(' '); break; }
  }
  for (let n = 3; n >= 1; n--) {
    const t = eojeols(v), end = t.slice(-n).join(' ').replace(/[.!?,]$/, ''), next = after.slice(0, n).join(' ').replace(/[.!?,]$/, '');
    if (after.length >= n && t.length > n && end && end === next && !item.original.replace(/[.!?,]$/, '').endsWith(end)) { v = t.slice(0, -n).join(' '); break; }
  }
  return v && v !== item.original ? { ...item, [key]: v } : null;
}
// "본문에 나온 ~"이라고 했는데 실제로 본문·핵심 어휘에 없으면 그 문장을 지움
function checkSourceClaim(item, refText) {
  let ex = item.explanation.replace(/\[본문\]/g, '본문').replace(/\[핵심 어휘\]/g, '핵심 어휘');
  if (!/본문|핵심 어휘/.test(ex) || !refText) return { ...item, explanation: ex };
  const quoted = (ex.match(/[‘'"“]([^’'"”]{1,20})[’'"”]/g) || []).map(q => q.slice(1, -1));
  const cands = [item.word && item.word.term, ...quoted, item.suggested].filter(Boolean)
    .map(t => str(t).replace(/\s+/g, '').replace(/(하다|되다|하는|되는|한다|된다|하기|되기|이다|다)$/, ''))
    .filter(t => t.length >= 2);
  const ref = refText.replace(/\s+/g, '');
  if (cands.some(t => ref.includes(t))) return { ...item, explanation: ex };
  const kept = ex.split(/(?<=[.!?])\s+/).filter(sen => !/본문|핵심 어휘/.test(sen)).join(' ');
  return { ...item, explanation: kept };
}

// 예문 검사: 고친 표현을 그대로 되풀이하거나, 지적한 표현을 (X) 없이 다시 쓴 예문은 지움
const NO_EXAMPLE_TAGS = ['맞춤법', '오타', '띄어쓰기', '문체'];
function cleanExample(item, key) {
  const ex = item.example; if (!ex) return item;
  const bare = (t) => str(t).replace(/[\s.!?,"'“”‘’]/g, '');
  const orig = bare(item.original);
  const drop = NO_EXAMPLE_TAGS.includes(item.tag)
    || bare(ex) === bare(item[key]) || bare(ex) === orig
    || (orig.length >= 2 && bare(ex).includes(orig) && !/\(X\)/.test(ex));
  return drop ? { ...item, example: '' } : item;
}
function normalizeFeedback(o, mode, learnerText, refText) {
  const C = FEEDBACK_CONFIG;
  if (!o || typeof o !== 'object' || !Array.isArray(o.corrections) || !Array.isArray(o.suggestions)) throw AppError('format');
  mode = ['A', 'B', 'C'].includes(o.mode) ? o.mode : (mode || 'C');
  const oTags = C.ORANGE_TAGS[mode];
  const rel = o.relevance && typeof o.relevance === 'object' ? o.relevance : {};
  const status = ['on', 'partial', 'off'].includes(rel.status) ? rel.status : 'on';
  const keepEn = (v) => (mode === 'B' ? str(v) : '');           // 설명 번역은 B 모드만
  const corrections = arr(o.corrections).map(c => ({
    original: str(c.original),
    corrected: str(c.corrected || c.correction || c.fixed),
    tag: C.RED_TAGS.includes(str(c.tag)) ? str(c.tag) : C.RED_FALLBACK_TAG,
    explanation: str(c.explanation),
    explanationEn: keepEn(c.explanationEn),
    example: str(c.example)
  })).filter(c => c.original && c.corrected && c.original !== c.corrected);
  const suggestions = arr(o.suggestions).map(s => {
    const w = s.word && typeof s.word === 'object' && mode === 'C' ? s.word : {};
    return {
      original: str(s.original),
      suggested: str(s.suggested || s.suggestion || s.corrected),
      tag: oTags.includes(str(s.tag)) ? str(s.tag) : C.ORANGE_FALLBACK_TAG,
      explanation: str(s.explanation),
      explanationEn: keepEn(s.explanationEn),
      example: str(s.example),
      word: { term: str(w.term), hanja: str(w.hanja), meaning: str(w.meaning) }
    };
  }).filter(s => s.original && s.suggested && s.original !== s.suggested);
  const text = str(learnerText);
  const correctionsOk = corrections.map(c => trimOverlap(c, 'corrected', text)).filter(Boolean).map(c => cleanExample(c, 'corrected'));
  const fixedText = correctionsOk.reduce((t, c) => t.replace(c.original, c.corrected), text);
  const suggestionsOk = suggestions
    .filter(s => eojeols(s.original).length <= (C.MAX_SUG_EOJEOL[mode] || 8))
    .filter(s => !isParticleOnlyChange(s.original, s.suggested))
    .map(s => trimOverlap(s, 'suggested', text, fixedText)).filter(Boolean)
    .map(s => checkSourceClaim(s, refText)).map(s => cleanExample(s, 'suggested'));
  const on = status === 'on';
  return {
    mode,
    relevance: {
      status,
      comment: on ? '' : str(rel.comment),
      commentEn: on ? '' : keepEn(rel.commentEn),
      modelAnswer: on ? '' : str(rel.modelAnswer),
      modelAnswerEn: on || mode === 'C' ? '' : str(rel.modelAnswerEn)   // 모범 답안 번역은 A·B 모드
    },
    praise: str(o.praise),
    praiseEn: keepEn(o.praiseEn),
    corrections: keepEndingStyle(correctionsOk, 'corrected', dominantEnding(learnerText), it => it.tag === '문체'),
    suggestions: keepEndingStyle(suggestionsOk, 'suggested', dominantEnding(learnerText), () => false).slice(0, C.MAX_SUGGESTIONS[mode])   // 걸러 낸 뒤 개수 제한
  };
}

/* =====================================================================
   6. 학습자 글에서 위치 찾기 + 번호 매기기
   ===================================================================== */
function aiOverlaps(a, b) { return a.start < b.end && b.start < a.end; }

function placeItems(text, items, taken) {
  // taken: 같은 색끼리 겹치지 않도록 이미 차지한 구간
  items.forEach(it => {
    it.start = -1; it.end = -1;
    let from = 0, idx;
    while ((idx = text.indexOf(it.original, from)) !== -1) {
      const span = { start: idx, end: idx + it.original.length };
      if (!taken.some(t => aiOverlaps(t, span))) { it.start = span.start; it.end = span.end; taken.push(span); break; }
      from = idx + 1;
    }
  });
  return items;
}

function layoutFeedback(text, fb) {
  const reds = placeItems(text, fb.corrections.map(c => ({ ...c, color: 'r' })), []);
  const oranges = placeItems(text, fb.suggestions.map(s => ({ ...s, color: 'o' })), []);
  const byPos = (a, b) => (a.start === -1 ? 1e9 : a.start) - (b.start === -1 ? 1e9 : b.start);
  reds.sort(byPos); oranges.sort(byPos);
  let n = 0;
  reds.forEach(r => { r.num = ++n; r.extra = []; });
  oranges.forEach(o => {
    o.num = ++n;
    if (o.start === -1) {
      // 빨강에서 고친 표현을 바탕으로 한 제안이면 그 빨강 표시에 번호를 붙임
      const host = reds.find(r => r.start !== -1 && r.corrected.indexOf(o.original) !== -1);
      if (host) host.extra.push(o.num);
      return;
    }
    const host = reds.find(r => r.start !== -1 && aiOverlaps(r, o));
    if (host) { host.extra.push(o.num); o.start = -1; }
  });
  return { reds, oranges };
}

// ---------- AI 호출 (회사·모델과 무관하게 같은 경로) ----------
async function httpJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); } catch (e) { throw AppError('network'); }
  if (!r.ok) { const t = await r.text().catch(() => ''); throw AppError('http', r.status, t.slice(0, 600)); }
  return r.json();
}
const RETRY_STATUSES = [429, 500, 502, 503, 504];
const RETRY_DELAYS = [2000, 5000];   // 서버가 바쁘면 최대 2번 더 자동 시도
async function callAI(sys, user) {
  const P = AI_PROVIDERS[aiState.provider];
  const model = curModel(); if (!model) throw AppError('model');
  const q = P.request(model, aiState.apiKey, sys, user);
  for (let i = 0; ; i++) {
    try { return P.readText(await httpJSON(q.url, { method: 'POST', headers: q.headers, body: JSON.stringify(q.body) })); }
    catch (e) {
      if (i >= RETRY_DELAYS.length || !RETRY_STATUSES.includes(e.status) || classifyError(e) === 'credit') throw e;
      await new Promise(res => setTimeout(res, RETRY_DELAYS[i]));
    }
  }
}
async function callAIJSON(sys, user, parse) {
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try { return parse(extractJSON(await callAI(sys, attempt === 0 ? user : user + '\n\n(반드시 지정한 JSON 형식 하나만 출력하세요.)'))); }
    catch (e) { lastErr = e; if (e.status) throw e; }
  }
  throw lastErr || AppError('format');
}
// 본문: 읽기 자료(READING_DATA)와 영상 대본(VIDEOS[].script) 중 있는 것을 모두 씀
const articleText = () => [
  typeof READING_DATA !== 'undefined' ? READING_DATA.map(r => (r.content || []).map(p => p.text || '').filter(Boolean).join('\n')).join('\n\n') : '',
  typeof VIDEOS !== 'undefined' ? VIDEOS.map(v => (v.script || []).map(l => l.kor || '').filter(Boolean).join('\n')).join('\n\n') : ''
].filter(Boolean).join('\n\n');

async function runDiscussFeedback(id) {
  const st = discussState[id]; const d = DISCUSS_DATA.find(x => x.id === id);
  if (!st || !d || st.loading || !st.text.trim()) return;
  if (!aiState.apiKey) { st.keyPanel = true; rerenderDiscussItem(id); return; }
  st.keyPanel = false; st.loading = true; st.error = null; rerenderDiscussItem(id);
  const level = app.userLevel, text = st.text;
  const question = [d.questionKor].concat((d.sub || []).map((q, i) => `${d.id}-${i + 1}. ${q}`)).join('\n');
  const questionEn = modeOf(level) === 'C' ? '' : [d.questionEng].concat(d.subEn || []).filter(Boolean).join('\n');
  const vocab = (d.vocab || []).map(v => ({ term: v.term, def: v.def || v.defEng || '' }));
  try {
    st.feedback = await callAIJSON(buildSystemPrompt(level), buildUserMessage({ level, article: articleText(), vocab, question, questionEn, learnerText: text }), (o) => normalizeFeedback(o, modeOf(level), text, articleText() + '\n' + vocab.map(v => v.term).join('\n')));
    st.feedbackFor = text; aiSaveStore();
  } catch (e) { st.error = e.code ? e : AppError('format'); }
  finally { st.loading = false; rerenderDiscussItem(id); }
}

function markedTextHTML(text, reds, oranges) {
  const spans = reds.filter(r => r.start !== -1).concat(oranges.filter(o => o.start !== -1)).sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach(s => {
    if (s.start < pos) return;
    out += esc(text.slice(pos, s.start));
    const orig = esc(text.slice(s.start, s.end));
    if (s.color === 'r') {
      out += `<del class="m-del">${orig}</del> <span class="m-ins">${esc(s.corrected)}</span><span class="n r">${numMark(s.num)}</span>` + s.extra.map(x => `<span class="n o">${numMark(x)}</span>`).join('');
    } else {
      out += `<span class="m-sug">${orig}</span><span class="n o">${numMark(s.num)}</span>`;
    }
    pos = s.end;
  });
  out += esc(text.slice(pos));
  return out;
}

                    const end = i + term.length;
                    const ov = matches.some(m => (i >= m.start && i < m.end) || (end > m.start && end <= m.end) || (i <= m.start && end >= m.end));
                    if (!ov) matches.push({ start: i, end, term, idx });
                    i += 1;
                }
            });
            matches.sort((a, b) => a.start - b.start);
            let out = '', last = 0;
            matches.forEach(mt => {
                if (mt.start > last) out += esc(text.substring(last, mt.start));
                out += `<span class="cursor-pointer border-b border-dotted border-gray-400 text-gray-800 hover:border-black hover:text-black transition-all duration-200 font-medium inline-block leading-tight" data-vocab-idx="${mt.idx}">${esc(mt.term)}</span>`;

            const hasSent = (q.sentence_pre != null && q.sentence_pre !== '') || (q.sentence_post != null && q.sentence_post !== '');
            const sent = hasSent ? `<div class="pw-sentence">${esc(q.sentence_pre || '')}<span class="pw-blank">&nbsp;</span>${esc(q.sentence_post || '')}</div>` : '';
            const opts = (q.options && q.options.length) ? `<div class="pw-options">${q.options.map((o, i) => `${['①', '②', '③', '④', '⑤'][i] || (i + 1) + ')'} ${esc(o.text)}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';
            return `<div class="pw-quiz-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(q.id))}.</span> ${esc(q.questionKor || q.question || '')}</div>${sent}${opts}</div>`;
        }
        function pwQuizHTML() {
            const pairs = [];
            for (let i = 0; i < QUIZ_LIST.length; i += 2) pairs.push(QUIZ_LIST.slice(i, i + 2));
            const useBank = (typeof ANSWER_CHOICES !== 'undefined' && Array.isArray(ANSWER_CHOICES) && ANSWER_CHOICES.length && !(QUIZ_LIST[0] && QUIZ_LIST[0].options && QUIZ_LIST[0].options.length));
            const bank = useBank ? `<div class="pw-options pw-bank"><b>정답 목록</b> · ${ANSWER_CHOICES.map(c => esc(c)).join(' · ')}</div>` : '';
            return pairs.map(pair => `<div class="pw-quiz-pair">${bank}${pair.map(pwQuizQHTML).join('')}</div>`).join('');
        }
        function pwAnswersHTML() {
            return `<div class="pw-answers"><b>정답</b><br>${QUIZ_LIST.map(q => `${esc(String(q.id))}. ${esc(q.correct_word || q.answer || (((q.options || []).find(o => o.isCorrect)) || {}).text || '')}`).join('<br>')}</div>`;
        }
        function pwDiscussHTML() {
            return DISCUSS_DATA.map(d => `<div class="pw-disc-q"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div>${d.questionEng ? `<div class="pw-eng">${esc(d.questionEng)}</div>` : ''}${(d.vocab && d.vocab.length) ? `<div class="pw-disc-vocab">${d.vocab.map(v => `<b>${esc(v.term)}</b> ${esc(v.def || '')}`).join(' · ')}</div>` : ''}<div class="pw-writelines"></div></div>`).join('');
        }
        // 생각해 보기: 이 브라우저에 저장된 내 글·AI 첨삭 (질문 순서대로)
        function pwAifbIds() {
            if (typeof discussState === 'undefined') return [];
            return DISCUSS_DATA.map(d => d.id).filter(id => { const st = discussState[id]; return st && (st.feedback || (st.text && st.text.trim())); });
        }
        function pwAifbHTML() {
            return pwAifbIds().map(id => {
                const st = discussState[id], d = DISCUSS_DATA.find(x => x.id === id);
                if (st.feedback && typeof exportParts === 'function') return `<div class="pw-aifb-item">${exportParts(st, d).html}</div>`;
                return `<div class="pw-aifb-item"><div class="pw-qtext"><span class="pw-qnum">${esc(String(d.id))}.</span> ${esc(d.questionKor || '')}</div><div class="pw-read-p" style="white-space:pre-wrap;margin-top:8px">${esc(st.text)}</div></div>`;
            }).join('');
        }
        let pwModalEl = null, pwRootEl = null;
        function pwEnsureEls() {
            if (!pwRootEl) { pwRootEl = document.createElement('div'); pwRootEl.id = 'print-root'; document.body.appendChild(pwRootEl); }
            if (pwModalEl) return;
            pwModalEl = document.createElement('div');
            pwModalEl.id = 'pw-modal';
            document.body.appendChild(pwModalEl);
            pwModalEl.addEventListener('click', (e) => {
                if (e.target.closest('[data-pw="cancel"]') || e.target.classList.contains('pw-backdrop')) { pwModalEl.classList.remove('open'); return; }
                if (e.target.closest('[data-pw="go"]')) {
                    const sel = Array.from(pwModalEl.querySelectorAll('input[data-pw-sec]:checked')).map(i => i.dataset.pwSec);
                    const ansEl = pwModalEl.querySelector('input[data-pw-ans]');
                    if (!sel.length) return;
                    pwRun(sel, !!(ansEl && ansEl.checked));
                }
            });
        }
        function pwOpenModal() {
            pwEnsureEls();
            const items = PW_SECTIONS.map(sec => `<label><input type="checkbox" data-pw-sec="${sec[0]}" checked> ${esc(sec[1])}</label>`).join('')
                + (pwAifbIds().length ? `<label><input type="checkbox" data-pw-sec="aifb"> 생각해 보기: 내가 쓴 글과 AI 첨삭 (${pwAifbIds().length}개)</label>` : '');
            const hasQuiz = PW_SECTIONS.some(sec => sec[0] === 'quiz');
            pwModalEl.innerHTML = `<div class="pw-backdrop"></div><div class="pw-box"><h3>인쇄할 섹션 선택</h3>${items}${hasQuiz ? `<div class="pw-divider"></div><label><input type="checkbox" data-pw-ans> 퀴즈 정답지 포함 (마지막 장)</label>` : ''}<div class="pw-actions"><button type="button" class="pw-cancel" data-pw="cancel">닫기</button><button type="button" class="pw-go" data-pw="go">인쇄하기</button></div></div>`;
            pwModalEl.classList.add('open');
        }
        function pwRun(sel, withAns, silent) {
            const build = { script: pwScriptHTML, reading: pwReadingHTML, vocab: pwVocabHTML, quiz: pwQuizHTML, discuss: pwDiscussHTML, aifb: pwAifbHTML };
            const secs = PW_SECTIONS.concat(pwAifbIds().length ? [['aifb', '생각해 보기: 내가 쓴 글과 AI 첨삭']] : []);
            let html = secs.filter(sec => sel.includes(sec[0])).map(sec => `<div class="pw-section">${pwHeaderHTML()}${build[sec[0]]()}</div>`).join('');
            if (withAns && sel.includes('quiz')) html += `<div class="pw-section">${pwHeaderHTML()}${pwAnswersHTML()}</div>`;
            pwRootEl.innerHTML = html;
            if (pwModalEl) pwModalEl.classList.remove('open');
            document.body.classList.add('pw-printing');
            if (!silent) {
                try { window.print(); } catch (e) {}
                setTimeout(() => { document.body.classList.remove('pw-printing'); }, 3000);
            }
        }
        /* 브라우저 인쇄(Ctrl+P/Cmd+P)에서도 학습지 레이아웃 사용: 현재 탭 섹션을 자동 조립 */
        window.addEventListener('beforeprint', () => {
            if (document.body.classList.contains('pw-printing')) return;
            const map = { video: 'script', reading: 'reading', vocab: 'vocab', quiz: 'quiz', discuss: 'discuss' };
            const sec = map[app.activeTab];
            if (!sec || !PW_SECTIONS.some(s => s[0] === sec)) return;
            pwEnsureEls();
            pwRun([sec], false, true);
        });
        window.addEventListener('afterprint', () => { document.body.classList.remove('pw-printing'); });


        // ---------- 이벤트 위임 (#app 1회) ----------
        appEl.addEventListener('click', (e) => {
            const vdo = e.target.closest('[data-video-open]'); if (vdo) { const vi = +vdo.dataset.videoOpen; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; } setTab('video'); return; }
            const tabBtn = e.target.closest('[data-tab]'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
            if (e.target.closest('[data-action="toggle-header"]')) { app.headerExpanded = !app.headerExpanded; buildApp(); return; }
            if (e.target.closest('[data-action="print-open"]')) { pwOpenModal(); return; }
            { const aiA = e.target.closest('[data-action]'); if (aiA && aiHandleClick(aiA)) return; }
            const tab = app.activeTab;

            if (tab === 'video') {
                const vsel = e.target.closest('[data-video-idx]');
                if (vsel) { const vi = +vsel.dataset.videoIdx; if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; paint(); } return; }
                const vspan = e.target.closest('[data-vocab-idx]');
                if (vspan) { e.stopPropagation(); const w = VOCAB_DATA[+vspan.dataset.vocabIdx]; const r = vspan.getBoundingClientRect(); if (popupEl && popupEl.dataset.fixed && popupEl.dataset.idx == String(VOCAB_DATA.indexOf(w))) { closeVocabPopup(); } else { showVocabPopup(w, r.left + r.width / 2, r.bottom, true); } return; }
                const pt = e.target.closest('[data-pane-toggle]'); if (pt) { const vi = +pt.dataset.paneVideo; let vOn = learn.layout !== 'script', sOn = learn.layout !== 'video'; if (pt.dataset.paneToggle === 'video') vOn = !vOn; else sOn = !sOn; if (!vOn && !sOn) { vOn = true; sOn = true; } const nl = (vOn && sOn) ? 'split' : (vOn ? 'video' : 'script'); if (vi !== learn.videoIdx) { stopTick(); learn.videoIdx = vi; learn.player = null; learn.isPlaying = false; learn.activeLine = null; learn.trans = {}; learn.currentTime = 0; learn.duration = 0; learn.speedMenu = false; learn.layout = nl; paint(); return; } learn.layout = nl; const sl2 = qs('#script-list', viewRoot()); if (sl2) sl2.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const lay = e.target.closest('[data-layout]'); if (lay) { learn.layout = lay.dataset.layout; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); updatePanes(); rebuildToolbar(); return; }
                const rate = e.target.closest('[data-rate]'); if (rate) { learn.rate = parseFloat(rate.dataset.rate); learn.speedMenu = false; if (learn.player && learn.player.setPlaybackRate) learn.player.setPlaybackRate(learn.rate); rebuildToolbar(); return; }
                const lp = e.target.closest('[data-line-play]'); if (lp) { e.stopPropagation(); const id = lp.dataset.linePlay; const line = curVideo().script.find(l => l.id === id); if (learn.activeLine === id && learn.isPlaying) { if (learn.player) learn.player.pauseVideo(); } else if (learn.player) { learn.player.seekTo(line.time[0], true); learn.player.playVideo(); } return; }
                const lt = e.target.closest('[data-action^="line-trans-"]'); if (lt) { e.stopPropagation(); const id = lt.dataset.action.replace('line-trans-', ''); learn.trans[id] = !learn.trans[id]; replaceLine(id); return; }
                const capBtn = e.target.closest('[data-cap]'); if (capBtn) { setCap(capBtn.dataset.cap); return; }
                const capAct = e.target.closest('[data-cap-action]'); if (capAct) { learn.revealed = {}; learn.tries = {}; setCap(learn.cap); return; }
                const seekLine = e.target.closest('[data-line-seek]'); if (seekLine) { const lid = seekLine.dataset.lineId;
                    if (lid && learn.cap !== 'full' && learn.layout !== 'script' && !learn.revealed[lid]) {
                        if (learn.tries[lid]) { learn.revealed[lid] = true; const sl = qs('#script-list', viewRoot()); if (sl) sl.innerHTML = scriptListHTML(); refreshScriptHead(); return; }
                        learn.tries[lid] = 1; replaceLine(lid);
                    } if (learn.player) { learn.player.seekTo(parseFloat(seekLine.dataset.lineSeek), true); learn.player.playVideo(); } return; }
                const sb = e.target.closest('[data-sb-idx]'); const sbBtn = e.target.closest('[data-action^="sb-trans-"]'); const sbHanjaBtn = e.target.closest('[data-action^="sb-hanja-"]');
                if (sb && sbHanjaBtn) { const i = +sb.dataset.sbIdx; learn.sbHanja = learn.sbHanja || {}; learn.sbHanja[i] = !learn.sbHanja[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                if (sb && sbBtn) { const i = +sb.dataset.sbIdx; learn.sbTrans = learn.sbTrans || {}; learn.sbTrans[i] = !learn.sbTrans[i]; sb.outerHTML = sidebarVocabHTML(VOCAB_DATA[i], i); return; }
                const vov = e.target.closest('#video-overlay');
                if (vov) {
                    if (!learn.player) return;
                    if (e.detail === 0 || !isCoarse()) { togglePlay(); return; }
                    const r = vov.getBoundingClientRect();
                    const left = (e.clientX - r.left) < r.width / 2;
                    const now = Date.now();
                    if (tap.t && (now - tap.t) < 300) { clearTimeout(tap.id); tap.t = 0; tap.id = null; kbSeek(left ? -5 : 5); return; }
                    tap.t = now; tap.id = setTimeout(() => { tap.t = 0; tap.id = null; togglePlay(); }, 280);
                    return;
                }
                const a = e.target.closest('[data-action]'); if (a) {
                    const act = a.dataset.action;
                    if (act === 'rewind') { kbSeek(-1.5); }
                    else if (act === 'forward') { kbSeek(1.5); }
                    else if (act === 'play') { if (learn.player) { if (learn.isPlaying) learn.player.pauseVideo(); else learn.player.playVideo(); } }
                    else if (act === 'speed-menu') { learn.speedMenu = !learn.speedMenu; rebuildToolbar(); }
                    else if (act === 'autoscroll') { learn.autoScroll = !learn.autoScroll; rebuildToolbar(); }
                    else if (act === 'learn-vocab') { learn.showVocab = !learn.showVocab; updatePanes(); rebuildToolbar(); }
                }
                return;
            }
            if (tab === 'vocab') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                if (a.dataset.action === 'vocab-clear') { vocabState.query = ''; paint(); }
                else if (a.dataset.action === 'vocab-core-all' || a.dataset.action === 'vocab-core-only') { vocabState.coreOnly = a.dataset.action === 'vocab-core-only'; saveCore(vocabState.coreOnly); vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-global') { vocabState.globalTrans = !vocabState.globalTrans; vocabState.itemTrans = {}; paint(); }
                else if (a.dataset.action === 'vocab-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const cur = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; vocabState.itemTrans[i] = !cur; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, !cur); }
                else if (a.dataset.action === 'vocab-hanja-toggle') { const card = a.closest('[data-vidx]'); const i = +card.dataset.vidx; const curH = vocabState.itemHanja[i] !== undefined ? vocabState.itemHanja[i] : true; vocabState.itemHanja[i] = !curH; const showT = vocabState.itemTrans[i] != null ? vocabState.itemTrans[i] : vocabState.globalTrans; card.outerHTML = vocabItemHTML(VOCAB_DATA[i], i, showT); }
                return;
            }
            if (tab === 'quiz') {
                const tb = e.target.closest('[data-action="q-trans"]'); if (tb) { const qEl = tb.closest('.quiz-q'); const qid = +qEl.dataset.qid; const st = quizState.q[qid]; st.trans = !st.trans; rerenderQuizQ(qid); return; }
                const btn = e.target.closest('[data-q]'); if (!btn) return;
                const qEl = btn.closest('.quiz-q'); const qid = +qEl.dataset.qid; const quiz = QUIZ_LIST.find(q => String(q.id) === String(qid)); const st = quizState.q[qid];
                const inp = qs('.quiz-input', qEl); if (inp) st.input = inp.value;
                if (btn.dataset.q === 'check') { const t = st.input.trim(); const ok = [quiz.answer||quiz.correct_word].concat(quiz.altAnswers || [], quiz.altAnswer ? [quiz.altAnswer] : []).indexOf(t) !== -1; st.result = ok ? 'correct' : 'incorrect'; st.hint = false; if (!quizState.attempts.hasOwnProperty(qid)) quizState.attempts[qid] = ok; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'show') { st.input = (quiz.answer||quiz.correct_word); st.result = null; st.hint = false; shuffleChoices(); rerenderQuizQ(qid); refreshQuizSidebar(); }
                else if (btn.dataset.q === 'hint') { st.hint = !st.hint; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'hint-verb') { st.hintVerb = !st.hintVerb; rerenderQuizQ(qid); }
                else if (btn.dataset.q === 'hint-particle') { st.hintParticle = !st.hintParticle; rerenderQuizQ(qid); }
                return;
            }
            if (tab === 'discuss') {
                const a = e.target.closest('[data-action]'); if (!a) return;
                const qEl = a.closest('.discuss-q'); const id = +qEl.dataset.did; const st = discussState[id];
                if (a.dataset.action === 'discuss-qtrans') { st.showTrans = !st.showTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-fbtrans') { st.fbTrans = !st.fbTrans; rerenderDiscussItem(id); }
                else if (a.dataset.action === 'discuss-feedback') { runDiscussFeedback(id); }
                return;
            }
        });
        appEl.addEventListener('change', (e) => { aiHandleChange(e.target); });

        appEl.addEventListener('input', (e) => {
            if (aiHandleInput(e.target)) return;
            if (e.target.id === 'seek') { const t = parseFloat(e.target.value) + clipBase(); if (learn.player && learn.player.seekTo) learn.player.seekTo(t, true); learn.currentTime = t; if (!learn.isPlaying) learn.pendingSeek = t; updateSeekUI(); return; }
            const tab = app.activeTab;
            if (tab === 'vocab' && e.target.id === 'vocab-search') { vocabState.query = e.target.value; vocabState.itemTrans = {}; refreshVocabGrid(); }
            else if (tab === 'quiz' && e.target.classList.contains('quiz-input')) { const qid = +e.target.closest('.quiz-q').dataset.qid; const st = quizState.q[qid]; st.input = e.target.value; st.result = null; }
            else if (tab === 'discuss' && e.target.matches('[data-action="discuss-text"]')) { const id = +e.target.closest('.discuss-q').dataset.did; const st = discussState[id]; const was = !st.text.trim(); st.text = e.target.value; if (was !== !st.text.trim()) { const pos = e.target.selectionStart; rerenderDiscussItem(id); const ta = qs(`.discuss-q[data-did="${id}"] [data-action="discuss-text"]`, viewRoot()); if (ta) { ta.focus(); try { ta.setSelectionRange(pos, pos); } catch (_) {} } } }
        });
        // video: 어휘 호버 팝업
        appEl.addEventListener('mouseover', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; const w = VOCAB_DATA[+sp.dataset.vocabIdx]; const r = sp.getBoundingClientRect(); showVocabPopup(w, r.left + r.width / 2, r.bottom, false); });
        appEl.addEventListener('mouseout', (e) => { if (app.activeTab !== 'video') return; const sp = e.target.closest && e.target.closest('[data-vocab-idx]'); if (!sp) return; if (popupEl && popupEl.dataset.fixed) return; if (e.relatedTarget && sp.contains(e.relatedTarget)) return; closeVocabPopup(); });
        // keyboard (video)
        window.addEventListener('keydown', (e) => {
            if (app.activeTab !== 'video') return;
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.code === 'Space') { e.preventDefault(); const p = learn.player; if (p && p.getPlayerState) { if (p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); } }
            else if (e.code === 'ArrowLeft') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); if (i > 0 && learn.player) { learn.player.seekTo(curVideo().script[i - 1].time[0], true); learn.player.playVideo(); } }
            else if (e.code === 'ArrowRight') { e.preventDefault(); const i = curVideo().script.findIndex(l => l.id === learn.activeLine); const ni = (i === -1) ? 0 : i + 1; if (ni < curVideo().script.length && learn.player) { learn.player.seekTo(curVideo().script[ni].time[0], true); learn.player.playVideo(); } }
        });


        // ---------- 시작 ----------
        aiLoadStore();
        buildApp();
    })();
    </script>
</body>
