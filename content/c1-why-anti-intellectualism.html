    /* ---------- 학습지 인쇄 (섹션 선택·방식3) ---------- */
#print-root{display:none}
#pw-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
#pw-modal.open{display:flex}
#pw-modal .pw-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#pw-modal .pw-box{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;width:320px;max-width:90vw;font-family:'Noto Sans KR',sans-serif}
#pw-modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
#pw-modal label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer}
#pw-modal .pw-divider{border-top:1px solid #f3f4f6;margin:10px 0}
#pw-modal .pw-actions{display:flex;gap:8px;margin-top:14px}
#pw-modal .pw-actions button{flex:1;padding:10px 0;font-size:13px;font-weight:700;border:1px solid #111;cursor:pointer}
#pw-modal .pw-go{background:#111;color:#fff}
#pw-modal .pw-cancel{background:#fff;color:#111}
@media print{
body.pw-printing #app{display:none!important}
body.pw-printing #pw-modal{display:none!important}
body.pw-printing #print-root{display:block}
#print-root{font-family:'Noto Sans KR',sans-serif;color:#111}
.pw-section{break-before:page}
.pw-section:first-child{break-before:auto}
.pw-sec-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
.pw-sec-header .pw-left{display:flex;align-items:baseline;gap:8px}
.pw-badge{font-size:9pt;font-weight:700;border:1px solid #111;padding:1px 8px}
.pw-title{font-size:11pt;font-weight:700}
.pw-brand{font-size:9pt;font-weight:700;letter-spacing:.02em}
.pw-line{margin-bottom:8px;break-inside:avoid}
.pw-line .pw-kor{font-size:10.5pt;line-height:1.55}
.pw-line .pw-spk{font-weight:700;margin-right:6px}
.pw-line .pw-eng{font-size:9pt;color:#6b7280;line-height:1.4}
.pw-part-title{font-size:10.5pt;font-weight:700;margin:12px 0 8px;border-left:3px solid #111;padding-left:8px}
.pw-read-title{font-size:13pt;font-weight:700;margin-bottom:4px}
.pw-read-sub{font-size:9.5pt;color:#6b7280;margin-bottom:12px}
.pw-read-h{font-size:11pt;font-weight:700;margin:12px 0 6px}
.pw-read-p{font-size:10.5pt;line-height:1.7;margin-bottom:8px}
.pw-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-vocab-card{border:1px solid #d1d5db;padding:12px;break-inside:avoid}
.pw-vocab-card .pw-term{font-size:12pt;font-weight:700;margin-bottom:6px}
.pw-vocab-card .pw-core{float:right;font-size:7.5pt;font-weight:700;letter-spacing:.12em;line-height:16pt}
.pw-vocab-card .pw-def{font-size:9.5pt;line-height:1.5}
.pw-vocab-page{break-after:page}
.pw-vocab-page:last-child{break-after:auto}
.pw-quiz-pair{break-after:page}
.pw-quiz-pair:last-child{break-after:auto}
.pw-quiz-q{margin-bottom:18px;break-inside:avoid}
.pw-qnum{font-weight:700}
.pw-quiz-q .pw-qtext{font-size:10.5pt;line-height:1.55;margin-bottom:6px}
.pw-quiz-q .pw-sentence{font-size:10.5pt;margin:8px 0}
.pw-blank{display:inline-block;min-width:70px;border-bottom:1px solid #111}
.pw-options{font-size:10pt;line-height:1.8}
.pw-bank{border:1px solid #111;padding:6px 10px;margin-bottom:12px;break-inside:avoid}
.pw-answers{font-size:10pt;line-height:2}
.pw-disc-q{margin-bottom:16px;break-inside:avoid}
.pw-disc-q .pw-qtext{font-size:10.5pt;line-height:1.55}
.pw-disc-q .pw-eng{font-size:9pt;color:#6b7280;margin:2px 0 6px}
.pw-disc-vocab{font-size:9pt;color:#374151;margin-bottom:6px}
.pw-aifb-item{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #e5e7eb}
.pw-aifb-item:last-child{border-bottom:none}
.pw-writelines{height:60px;border-bottom:1px dashed #9ca3af;margin-top:4px}
}

</style>

    <script>
    (function () {
        'use strict';

        /* 폰트 CSS 비차단 적용: head에서 media=print로 받아 둔 스타일을 여기서 활성화 */

        /* ===== AI 설정 (학습자가 자기 API Key로 사용 · 키는 저장하지 않음) =====
           모델 이름은 여기만 바꾸면 됨. 화면에는 추천 모델 3개(맨 앞이 기본) + '기타(직접 입력)'가 나옴. */
        const AI_PROVIDERS = {

                    url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                    body: { systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { responseMimeType: 'application/json' } }
                }),
                readText: (r) => ((r.candidates && r.candidates[0] && r.candidates[0].content && r.candidates[0].content.parts) || []).map(p => p.text || '').join(''),

                label: 'Anthropic Claude', keySite: 'Claude Console',

                    url: 'https://api.anthropic.com/v1/messages',

            },
            openai: {
                label: 'OpenAI', keySite: 'OpenAI Platform',
                keyHint: 'OpenAI Platform에서 발급 (선불 결제 필요)', keyHintEn: 'From OpenAI Platform (prepaid)',

                    url: 'https://api.openai.com/v1/chat/completions',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: { model, response_format: { type: 'json_object' }, messages: [{ role: 'system', content: sys }, { role: 'user', content: user }] }
                }),

            MAX_SUGGESTIONS: { A: 1, B: 2, C: 3 },
            MAX_SUG_EOJEOL: { A: 4, B: 6, C: 8 },   // 주황 제안 원문이 이보다 길면 버림 (문장 전체를 다시 쓰는 제안 방지)
            DICT_LANG: 'ko',   // AI 문맥 사전 설명 언어 — 템플릿 a(영어 뜻): 'en' · 템플릿 b·c(한국어 뜻): 'ko' · A 모드는 언제나 영어

        // 예: { title:'Part 1', subTitle:'', provider:'instagram', igReel:'DQ4UIBHEqwE', thumb:'https://raw.githubusercontent.com/.../thumbnails/xxx.jpeg', script:[...] }
        const VIDEOS = [{"title": "일상어와 전문 용어, 그리고 반지성주의", "subTitle": "정준희의 해시티비 · 해시라이브 104회", "videoId": "xVyVHlLgwxw", "clip": [7081, 7998], "script": [{"id": "s1", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "어... 제가 예전에 종종 얘기했는데, 엘리트, 사회 지도층...", "time": [7081.0, 7086.412], "eng": "Uh... I've said this now and then before: elites, the \"leading class\"..."}, {"id": "s2", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "사회 지도층이라는 표현은 실질적으로 이제는 많이 낡은 표현이고요.", "time": [7086.442, 7089.893], "eng": "The phrase \"leading class\" is honestly a pretty dated expression by now."}, {"id": "s3", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "지배층, 이런 표현을 썼을 때 그게 일반 사회과학이나 이런 데서는 좋은 의미, 나쁜 의미하고 상관이 없이", "time": [7089.923, 7097.995], "eng": "When you use a word like \"ruling class,\" in general social science and places like that it has nothing to do with good or bad."}, {"id": "s4", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그 사회의 자원을 독점하면서 권력을 행사하고 뭔가 지배력을 행사하는 데 유리한 위치에 있는 사람 또는 집단,", "time": [7098.025, 7107.219], "eng": "It just means the people or groups who monopolize a society's resources and sit in a favorable position to wield power and exercise control."}, {"id": "s5", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이거를 가리키는 말이다라고 누차 얘기했는데도", "time": [7107.249, 7110.178], "eng": "I've said that's all the word refers to, over and over, and still"}, {"id": "s6", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그 말만 쓰면 되게 기분 나빠하는 분들이 많아(요).", "time": [7110.211, 7112.601], "eng": "a lot of people get really offended the moment I use it."}, {"id": "s7", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "\"얘네들이 무슨 지배층이며\",", "time": [7112.631, 7114.76], "eng": "\"What makes those guys a ruling class?\""}, {"id": "s8", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "\"그거 말을 너무 당연하게 쓰면 안 된다.\"", "time": [7114.79, 7116.602], "eng": "\"You shouldn't throw that word around like it's a given.\""}, {"id": "s9", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "\"엘리트란 말 너무 그렇게 쓰면 안 돼\",", "time": [7116.632, 7118.346], "eng": "\"Don't use the word 'elite' like that,\""}, {"id": "s10", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "\"걔네가 무슨 엘리트냐?\",", "time": [7118.376, 7119.458], "eng": "\"How are they elites?\""}, {"id": "s11", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이런 얘기를 하는 분들이 참 많아요.", "time": [7119.488, 7121.784], "eng": "Lots of people say things like that."}, {"id": "s12", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "근데 이거 한두 번 설명해 봤자 이게 되는 문제가 아니기 때문에", "time": [7121.814, 7125.745], "eng": "But explaining it once or twice doesn't solve anything, so"}, {"id": "s13", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "저는 그분들한테 부탁하고 싶은 건 자신들이 일상으로 알고 있는 그 의미가 외려 잘못됐을 수 있다는 생각을 한 번은 조금 해 봤으면 좋겠어.", "time": [7125.775, 7135.192], "eng": "what I'd ask of those people is to at least once consider that the meaning they know from everyday use might actually be the wrong one."}, {"id": "s14", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "언어를 좀 더 제대로 정교하게 쓰려고 하는 직업에 있는 사람과 그러지 않은 사람들 중에 누가 더 언어를 의미에 맞게 쓰려고 노력할까.", "time": [7135.222, 7146.461], "eng": "Between people whose job is to use language more carefully and precisely and people whose job isn't, who's going to try harder to use words in line with what they mean?"}, {"id": "s15", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이것도 메타인지 일종이에요.", "time": [7146.491, 7148.261], "eng": "That's a kind of metacognition too."}, {"id": "s16", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "본질적으로 보면 오히려 \"그런 데(에) 엘리트라는 말을 쓰지 마세요\"라는 분들이 엘리트라는 개념을 너무 순진하게 받아들이고 계신 거예요.", "time": [7148.291, 7155.463], "eng": "If you get to the heart of it, the people who say \"Don't call them elites\" are actually taking the idea of an elite far too naively."}, {"id": "s17", "speaker": "이봉우 (언론 비평가)", "kor": "아, 그렇지.", "time": [7155.493, 7155.996], "eng": "Oh, exactly."}, {"id": "s18", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까요.", "time": [7156.026, 7156.409], "eng": "Right?"}, {"id": "s19", "speaker": "이봉우 (언론 비평가)", "kor": "엄청 훌륭한 사람, 이렇게 생각하는 거 아니야?", "time": [7156.439, 7158.504], "eng": "They think it means someone really admirable, don't they?"}, {"id": "s20", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "우리가 예전에 교복 엘리트 이렇게 해 가지고 엘리트라는 개념 자체가 너무 성스러운 것으로 잡혀 있다 보니까", "time": [7158.534, 7165.393], "eng": "Back in the day we had that \"school-uniform elite\" thing, so the idea of an elite got fixed as something almost sacred, and that's why"}, {"id": "s21", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"걔네들한테 엘리트라는 말 쓰지 마세요.\"", "time": [7165.423, 7166.879], "eng": "\"Don't call those people elites.\""}, {"id": "s22", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "근데 원래 그런 사람들을 뜻하는 말이 엘리트예요.", "time": [7166.909, 7169.477], "eng": "But that's exactly the kind of person the word \"elite\" was meant for in the first place."}, {"id": "s23", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "엘리트를 그렇게 쓰지 않으니 그렇죠.", "time": [7171.841, 7173.682], "eng": "That's because they don't use \"elite\" that way."}, {"id": "s24", "speaker": "이봉우 (언론 비평가)", "kor": "일상어라니까요, 그게.", "time": [7173.712, 7175.375], "eng": "It's everyday language, that's the thing."}, {"id": "s25", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "일상어가 맞다고 하는 확신을 어떻게 가지세요?", "time": [7175.405, 7179.399], "eng": "And how are you so sure the everyday meaning is the right one?"}, {"id": "s26", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러면 내가 쓰는 말과 남이 쓰는 말이 다르면 뭐에 의존할까요?", "time": [7179.429, 7183.584], "eng": "So if the word I use and the word someone else uses don't match, what do you rely on?"}, {"id": "s27", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "내 말이 옳으냐 네 말이 옳으냐로 싸울 거 아니에요.", "time": [7183.614, 7186.006], "eng": "You'd just end up fighting over whose word is right, wouldn't you?"}, {"id": "s28", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "사전을 펼쳐야지, 그러면.", "time": [7186.036, 7187.428], "eng": "Then you open a dictionary."}, {"id": "s29", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "사전이 왜 필요해?", "time": [7187.458, 7188.729], "eng": "Why do we need dictionaries?"}, {"id": "s30", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "명언이 있습니다.", "time": [7188.759, 7189.859], "eng": "There's a famous line."}, {"id": "s31", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "밖에서 비가 오냐 안 오냐로 싸우지 말고 창문을 열어 보라니까.", "time": [7189.889, 7194.255], "eng": "\"Don't argue about whether it's raining outside. Just open the window.\""}, {"id": "s32", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그럼 비가 오는지 안 오는지 알 수 있잖아요, 말싸움을 할 게 아니라.", "time": [7194.285, 7198.238], "eng": "Then you can tell whether it's raining or not, instead of having a war of words."}, {"id": "s33", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 이제 뭐가, 이런 걸 흔히 레퍼런스라고 부르는 거예요.", "time": [7198.268, 7201.444], "eng": "So, uh, this kind of thing is what we usually call a \"reference.\""}, {"id": "s34", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "레퍼런스를 영어로 써서 죄송합니다만, 그게 참고서라고 흔히 알고 있지만", "time": [7201.574, 7204.756], "eng": "Sorry for using the English word, but people usually think \"reference\" means a study guide,"}, {"id": "s35", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "근거가 되는 문헌 또는 자료, 증거, 이런 게 흔히 레퍼런스라고 부르는 건데", "time": [7204.786, 7211.218], "eng": "when it really means a source you base things on: documents, data, evidence. That's what we usually call a reference."}, {"id": "s36", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "레퍼런스가 필요한 이유가 있어요.", "time": [7211.248, 7213.112], "eng": "And there's a reason we need references."}, {"id": "s37", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그게 우리가 서로 다 의외로 알고 보면 각자 다 다른 생각을 하고 있고 되게 다른 의미로 말들을 써요.", "time": [7213.434, 7219.996], "eng": "It's that, surprisingly, we're all thinking different things and using words in really different senses."}, {"id": "s38", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 이거를 공통의 좌표점으로 고정하기 위한 인위적인 작업이에요.", "time": [7220.026, 7225.0], "eng": "So it's an artificial step to pin all that down to a shared point of reference."}, {"id": "s39", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러지 않으면 너무 막 날아다닐 테니까.", "time": [7225.03, 7227.522], "eng": "Otherwise everything would just fly all over the place."}, {"id": "s40", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그게 절대적인 권위를 갖는다는 게 아니라 사전도 업데이트가 되거든요.", "time": [7227.552, 7231.264], "eng": "That doesn't mean it carries absolute authority. Dictionaries get updated too."}, {"id": "s41", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "지배적으로 많은 사람들이 그 말을 그 의미로 쓴다면, 예를 들면 짜장면 같은 식으로, 표기법에 관련된 거지만,", "time": [7231.294, 7238.369], "eng": "If most people end up using a word with a certain meaning, like with jjajangmyeon, though that one's about spelling,"}, {"id": "s42", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러면 레퍼런스도 바뀌어. 왜냐하면 시대의 변화를 가져가야 되니까.", "time": [7238.399, 7243.313], "eng": "then the reference changes too, because it has to keep up with the times."}, {"id": "s43", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "하지만 그전까지는 각자가 주장하는 의미가 맞다라고 이야기할 근거는 결국 레퍼런스뿐이 없는 거라고.", "time": [7243.343, 7250.035], "eng": "But until then, the only ground anyone has for saying their meaning is right is the reference."}, {"id": "s44", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그걸 만들어 놓는 이유가 있는 거지.", "time": [7250.065, 7251.875], "eng": "That's why we bother making one."}, {"id": "s45", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "말이 나와서 말인데 생각해 보면 엘리트라는 말이 제가 쓸 때도 그렇고 남이 쓸 때도 그렇고 그렇게 긍정적인 표현으로 쓴 적이 별로 없거든요.", "time": [7251.905, 7257.585], "eng": "Now that you mention it, when I use the word \"elite,\" or when others do, it's hardly ever been a compliment."}, {"id": "s46", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "요즘은 그게 실제로 언어를 연구하는 사람들이 엘리트라는 말이 원래는 긍정 의미를 내포하고 있다가 일상화에서 점점 부정 의미를 내포하는 말로 바뀌고 있다.", "time": [7257.615, 7266.899], "eng": "These days, people who actually study language are saying that \"elite\" used to carry a positive meaning but, as it went into everyday use, has been shifting toward a negative one."}, {"id": "s47", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이거는 의미가 이렇게 바뀌었다는 게 중요한 게 아니라, 그래서 이 말이 지금 바뀐 말이 옳다는 말이 아니라", "time": [7266.929, 7273.336], "eng": "What matters here isn't that the meaning changed, and it isn't that the new meaning is the correct one."}, {"id": "s48", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "여기에 담겨 있는 사람들의 의식이나 이미지가 바뀐 게 되게 중요한 거예요.", "time": [7273.366, 7278.099], "eng": "What really matters is that the attitudes and images people attach to it have changed."}, {"id": "s49", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "사회 상류층이나 이른바 지배층이나 엘리트라고 불릴 수 있는, 사회적 자원을 독점하고 권한을 독점하고 있는 세력에 대한 존중이 경멸로 바뀌고 있다는 얘기라고요.", "time": [7278.129, 7287.484], "eng": "It's saying that respect for the upper class, the so-called ruling class, whatever you call the elites who hog society's resources and power, is turning into contempt."}, {"id": "s50", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그게 더 중요한 포인트라(고요).", "time": [7287.514, 7288.714], "eng": "That's the bigger point."}, {"id": "s51", "speaker": "이봉우 (언론 비평가)", "kor": "어느 정도 그러니까 현실 반영이네.", "time": [7288.744, 7290.245], "eng": "So in a way, it reflects reality."}, {"id": "s52", "speaker": "이봉우 (언론 비평가)", "kor": "사람들이 현실에서 느꼈더니 지도층에 있다고 보이는 사람들이 별로 그렇게 훌륭한 사람들이 아니야.", "time": [7290.275, 7297.07], "eng": "People looked at real life and saw that the ones who seem to be at the top aren't all that admirable."}, {"id": "s53", "speaker": "이봉우 (언론 비평가)", "kor": "그러니까 그 지배층이라든가 엘리트라는 말 자체가 부정적으로 다가오는 거죠.", "time": [7297.1, 7302.106], "eng": "So words like \"ruling class\" and \"elite\" themselves start to sound negative."}, {"id": "s54", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "대표적으로 서울대 내란과.", "time": [7302.136, 7303.809], "eng": "The textbook case: \"Seoul National University, Department of Insurrection.\""}, {"id": "s55", "speaker": "이봉우 (언론 비평가)", "kor": "그렇지, 그렇지. 그런 이미지가 있지.", "time": [7303.839, 7304.977], "eng": "Right, right. That's the image it has."}, {"id": "s56", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그게 요즘에 어디 좋은 말로 쓰입니까.", "time": [7305.007, 7306.656], "eng": "Where would that ever be used as a compliment these days?"}, {"id": "s57", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "근데 옛날에는 서울대 법학과 이러면, \"야 이 자식이 엘리트네\", \"사전적인 의미의 엘리트네\"라고 말을 했단 말이에요.", "time": [7306.686, 7313.656], "eng": "But back in the day, if someone was in SNU's law department, people would say, \"Wow, this guy's an elite,\" \"an elite by the dictionary definition.\""}, {"id": "s58", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "근데 이제 그게 조롱의 대상으로 바뀌고 있잖아요.", "time": [7313.686, 7316.158], "eng": "But now that's turning into something people mock."}, {"id": "s59", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"오, 서울대 내란과 출신이네\", 이렇게.", "time": [7316.191, 7318.724], "eng": "\"Oh, an alum of SNU's Department of Insurrection,\" like that."}, {"id": "s60", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 우리가 말을 할 때 정말 조심해야 되는 게, 내 말이 옳다고 생각하는 그 자기중심주의라는 게 굉장히 강하게 작동합니다.", "time": [7318.754, 7329.356], "eng": "So what we really need to be careful about when we talk is that self-centeredness, thinking my words are the right ones, kicks in really hard."}, {"id": "s61", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "누군가하고 커뮤니케이션이 안 되는 이유도 그거예요.", "time": [7329.386, 7331.737], "eng": "That's also why you can't communicate with someone."}, {"id": "s62", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "나는 옳은 말을 쓰고 있고 옳은 단어를 쓰고 있고 쟤만 틀린 단어를 쓰고 있어, 저 답답한 놈.", "time": [7331.767, 7336.981], "eng": "\"I'm saying the right thing, I'm using the right word, and that clueless guy is the only one getting it wrong.\""}, {"id": "s63", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이런 태도를 가지면 당연히 커뮤니케이션을 못 하죠.", "time": [7337.011, 7339.965], "eng": "If that's your attitude, of course you can't communicate."}, {"id": "s64", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이건 내가 잘못하고 있는 거예요. 저 사람도 잘못할 가능성이 높지만.", "time": [7339.995, 7343.53], "eng": "That's on me. Though the other person may very well be wrong too."}, {"id": "s65", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "우리가 해야 되는 것에 중요한 거는 내 말이 정말 말을 하나하나 생각하면서 그 말의 의미를 정확하게 레퍼런스에 근거해 가지고 이야기를 하는 태도를 가지고 있지 않은 경우들이 대부분이니", "time": [7343.56, 7356.433], "eng": "What matters for us is this: most of the time we don't actually have the habit of weighing each word and grounding what it means in a reference, so"}, {"id": "s66", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "만약 여기서 오해가 생긴 거나 말이 좀 틀린 것 같다라는 느낌이 들면 그건 나일 가능성이 굉장히 높다라고 먼저 생각을 해요.", "time": [7356.463, 7362.816], "eng": "if a misunderstanding comes up, or it feels like a word's being used wrong, I first assume it's quite likely me."}, {"id": "s67", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "이게 말씀이 나와서 말인데 최근에 진짜 재밌는 댓글 하나 봤어요.", "time": [7362.846, 7367.277], "eng": "Now that you mention it, I saw a really funny comment recently."}, {"id": "s68", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "제 걸작선에 달린 댓글인데,", "time": [7367.307, 7369.087], "eng": "It was on one of my \"masterpiece\" videos."}, {"id": "s69", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"아, 이 자식 이거 영화 전혀 모르네.\"", "time": [7369.117, 7372.259], "eng": "\"Ugh, this guy knows nothing about movies.\""}, {"id": "s70", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"이 자식은 계속 이 영화의 스토리가 문제라고 하는데 내가 봤을 땐 플롯이 문제야.\"", "time": [7372.289, 7377.261], "eng": "\"He keeps saying the movie's problem is the story, but if you ask me, it's the plot.\""}, {"id": "s71", "speaker": "이봉우 (언론 비평가)", "kor": "스토리가 플롯 아니에요?", "time": [7377.291, 7379.775], "eng": "Isn't story the same as plot?"}, {"id": "s72", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그렇진 않아.", "time": [7379.805, 7380.621], "eng": "Not quite."}, {"id": "s73", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그렇진 않아. 스토리에 중...", "time": [7380.651, 7383.024], "eng": "Not quite. Within the story..."}, {"id": "s74", "speaker": "이봉우 (언론 비평가)", "kor": "영화 잘 모르네, 인마.", "time": [7383.054, 7385.975], "eng": "You don't know movies, pal."}, {"id": "s75", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "플롯은 스토리가 좀 더 세부적인 과정이라고 봐야 돼.", "time": [7389.187, 7392.081], "eng": "You'd have to say the plot is the more detailed process of the story."}, {"id": "s76", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그리고 엄연히 말하면 조금은 다른데, 문제는 그분이 그 말 뜻을 모르고 썼다,", "time": [7392.111, 7396.41], "eng": "And strictly speaking they're a bit different, but the problem is that the commenter used the word without knowing what it means,"}, {"id": "s77", "speaker": "이봉우 (언론 비평가)", "kor": "아, 나처럼 생각하고 썼을 가능성이 있다.", "time": [7396.44, 7398.256], "eng": "Ah, they might've written it thinking the same way I do."}, {"id": "s78", "speaker": "이봉우 (언론 비평가)", "kor": "그렇지.", "time": [7398.286, 7398.725], "eng": "Right."}, {"id": "s79", "speaker": "이봉우 (언론 비평가)", "kor": "나처럼 잘 모르면서 그냥.", "time": [7398.755, 7400.393], "eng": "Not really knowing, just like me."}, {"id": "s80", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그러니까 나는 오히려 플롯이나 이런 전문적인 용어를 쓰지 않으려고 스토리라고 뭉쳐서 썼는데 거기 와 가지고", "time": [7400.423, 7407.616], "eng": "I actually lumped it all together as \"story\" so I wouldn't use technical terms like \"plot,\" and then they show up going,"}, {"id": "s81", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"이 무식한 놈이 플롯을 스토리라고 하네.\"", "time": [7407.646, 7410.243], "eng": "\"This ignorant guy calls the plot a story.\""}, {"id": "s82", "speaker": "이봉우 (언론 비평가)", "kor": "플롯은 구조래. 전혀 몰랐네.", "time": [7411.544, 7414.046], "eng": "So plot is structure. Had no idea."}, {"id": "s83", "speaker": "이봉우 (언론 비평가)", "kor": "그럼 이야기의 구조인가?", "time": [7416.6, 7418.002], "eng": "Then is it the structure of the story?"}, {"id": "s84", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "미안합니다. 제가 예를 잘못 들었어요.", "time": [7418.032, 7419.611], "eng": "Sorry, I picked a bad example."}, {"id": "s85", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "다른 얘기로 넘어가죠.", "time": [7419.641, 7421.185], "eng": "Let's move on."}, {"id": "s86", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이걸로 가면 얘기가 좀 길어져요.", "time": [7421.215, 7423.39], "eng": "If we go down this road, it'll take a while."}, {"id": "s87", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "내러티브하고 구분해야 돼.", "time": [7423.423, 7425.786], "eng": "You have to tell it apart from narrative."}, {"id": "s88", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "스토리하고, 스토리는 플롯하고 내러티브로 구별해.", "time": [7425.816, 7429.28], "eng": "Story and... you split it into story, plot and narrative."}, {"id": "s89", "speaker": "이봉우 (언론 비평가)", "kor": "어? 그러면 한 구성요소긴 하네, 스토리에.", "time": [7429.31, 7431.544], "eng": "Huh? So it is one of the parts of a story, then."}, {"id": "s90", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "근데 걔가 이 영화는 스토리가 아니라 플롯이 잘못된 거라고 하고... 예를 들었는데 그게 스토리야.", "time": [7431.574, 7436.086], "eng": "But that commenter said this movie's problem wasn't the story but the plot... and then the example they gave was the story."}, {"id": "s91", "speaker": "이봉우 (언론 비평가)", "kor": "아, 어려워.", "time": [7437.686, 7438.746], "eng": "Ah, this is hard."}, {"id": "s92", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "예를 잘못 들었어요.", "time": [7441.427, 7442.923], "eng": "I picked a bad example."}, {"id": "s93", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 요게 이제 일반인?", "time": [7442.953, 7444.023], "eng": "So this is like, ordinary people?"}, {"id": "s94", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "일상어적인 어떤 표현을 쓸 때 여기는 나름 전문가.", "time": [7444.053, 7449.409], "eng": "When they use everyday expressions, and here's someone who's sort of an expert."}, {"id": "s95", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "나 답답해 속이 터지는 거지. 그러면.", "time": [7449.439, 7451.362], "eng": "It drives me nuts, then."}, {"id": "s96", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "교수님 심정은 알겠네.", "time": [7451.392, 7452.651], "eng": "Now I get how the professor feels."}, {"id": "s97", "speaker": "이봉우 (언론 비평가)", "kor": "어 근데 그니까 이게, 아니, 그런 사람한테 엘리트라는 표현을 쓰면 안 되지, 이렇게 생각하는 사람보다 차라리 나처럼 아예 모르는 게 나아.", "time": [7452.681, 7459.159], "eng": "Uh, but see, it's like... honestly, better to know nothing at all like me than to be someone who thinks \"you can't call people like that elite.\""}, {"id": "s98", "speaker": "이봉우 (언론 비평가)", "kor": "그 뭐지, 그게?", "time": [7459.189, 7460.47], "eng": "What's it called?"}, {"id": "s99", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "이 자세가 훨씬 나아.", "time": [7460.5, 7462.184], "eng": "That attitude is way better."}, {"id": "s100", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"플롯, 플롯이라고 하셨는데 도대체 플롯이 뭔가요\", 이런 질문이 훨씬 양호해.", "time": [7462.214, 7466.576], "eng": "\"You said 'plot.' What exactly is a plot?\" A question like that is much better."}, {"id": "s101", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그니까 뭔가 이렇게 반응을 보일 때 왜 기분 나쁘게 저 말을 저렇게 하지, 라고 할 때 그 기분 나쁨을 자기가 짚어 보자는 얘기예요.", "time": [7466.61, 7476.216], "eng": "What I'm saying is, when you react and think, \"Why does he have to put it in such an annoying way?\", stop and examine that annoyance yourself."}, {"id": "s102", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "왜냐하면 내 기분 나쁨이 생각이 들면 나만 옳고 상대가 잘못할 가능성보다 내가 외려 잘못 알고 있었을 가능성이 높거든요, 현실적으로.", "time": [7476.246, 7486.479], "eng": "Because if you start feeling annoyed, realistically, it's more likely that you had it wrong than that you're right and the other person's wrong."}, {"id": "s103", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "왜냐면 전문가와 전문가가 아닌 사람들 사이에서 만약에 말이라는 문제로 부딪히게 되면", "time": [7486.509, 7491.722], "eng": "Because if experts and non-experts end up clashing over words,"}, {"id": "s104", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "당연히 전문가도 실수하고 언어적인 사용을 잘못하는 경우가 있죠.", "time": [7491.752, 7495.504], "eng": "of course experts slip up too and sometimes use language wrongly."}, {"id": "s105", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그 몇 건의 실수를 가지고 내가 다 잘난 것처럼 생각하는 것도 문제야, 여러 가지로.", "time": [7495.534, 7500.286], "eng": "But treating a handful of their mistakes as proof that you know better is a problem too, in a lot of ways."}, {"id": "s106", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "왜냐면 평상시에 내가 쓰는 말들은, 일상의 관점에서 보면 여러분들이 쓰시는 일상적인 말들은 정확한 언어의 관점에서 보면 진짜 엉텅... 엉터리...", "time": [7500.316, 7511.353], "eng": "Because the words I use day to day, the everyday words all of you use, are, from the standpoint of precise language, really eongteong... eongteori..."}, {"id": "s107", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "엉텅... 멍텅구리, 엉터리에 멍텅구리 섞이는, 엉텅구리라고 합쳐서 표현하신 것 같은데요.", "time": [7511.383, 7516.837], "eng": "Eongteong... meongteongguri. Looks like you mashed eongteori and meongteongguri into \"eongteongguri.\""}, {"id": "s108", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "근데 웃긴 게 뭐냐면, 아 그 법률 용어 그 어려운 것 좀 쓰지 말라고 이런단 말이에요.", "time": [7516.867, 7521.421], "eng": "But here's the funny thing: people say, \"Stop using those difficult legal terms.\""}, {"id": "s109", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 법률 용어를 일반인에게 커뮤니케이션할 때 그 커뮤니케이션이 일반적이지 못한 걸 지적할 수는 있으나, 또는 잘난 척하는 걸,", "time": [7521.451, 7529.907], "eng": "You can point out that a legal term isn't plain enough when it's used to communicate with the public, or that someone's showing off, but"}, {"id": "s110", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "법률을 다 일상으로 대체하라고 얘기하면 그건 말도 안 되는 소리입니다.", "time": [7529.937, 7534.743], "eng": "telling people to replace all of law with everyday language is nonsense."}, {"id": "s111", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "수학 못 알아먹겠다고 쉬운 말로 해 달라고 얘기하는 거하고 똑같은 거예요.", "time": [7534.773, 7538.345], "eng": "It's the same as saying, \"I can't follow the math, so say it in simple words.\""}, {"id": "s112", "speaker": "이봉우 (언론 비평가)", "kor": "그걸 담을 말이 없어, 일상어 중엔.", "time": [7538.375, 7540.567], "eng": "There are no words for it in everyday language."}, {"id": "s113", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "\"아니 공식을 그렇게 많이 적는 건 스노비즘 아닌가요?\" 이러면 할 말이 없는 거지.", "time": [7540.597, 7545.37], "eng": "\"Isn't writing down so many formulas just snobbery?\" Then what can you even say to that?"}, {"id": "s114", "speaker": "이봉우 (언론 비평가)", "kor": "\"근의 공식\"을 뭐 다른 말로 뭐라고 해야 돼? 그런 거잖아요.", "time": [7545.4, 7548.635], "eng": "\"The quadratic formula\" — what else are you supposed to call it? It's like that."}, {"id": "s115", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "아니 식이 복잡하면 길게 적을 수밖에 없어, 원래.", "time": [7548.665, 7552.074], "eng": "If the equation is complicated, you just have to write it out long. That's how it is."}, {"id": "s116", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "엉텅구리들.", "time": [7552.104, 7554.075], "eng": "Eongteonggurideul."}, {"id": "s117", "speaker": "이봉우 (언론 비평가)", "kor": "오늘 엉텅구리 엄청 신났네. 사람들.", "time": [7554.105, 7557.366], "eng": "Everybody's having a blast with \"eongteongguri\" today."}, {"id": "s118", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "뭐 이런 걸 \"창조적 진화\"라고 하죠.", "time": [7557.396, 7559.168], "eng": "This is what you'd call \"creative evolution.\""}, {"id": "s119", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "예, 언어도 진화합니다.", "time": [7559.198, 7561.14], "eng": "Yes, language evolves too."}, {"id": "s120", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그럼요.", "time": [7561.17, 7561.834], "eng": "Of course."}, {"id": "s121", "speaker": "이봉우 (언론 비평가)", "kor": "그러니까 아까 카펠라님인가, 되게 중요한, 어떻게 보면 되게 대표적인 사례를 들어 주신 게 윤석열도 엘리트다.", "time": [7561.864, 7568.519], "eng": "So earlier, I think it was Capella, gave a really important, really textbook example: Yoon Suk Yeol is an elite too."}, {"id": "s122", "speaker": "이봉우 (언론 비평가)", "kor": "근데 많은 사람들이 윤석열이 왜 엘리트야? 확 기분 나빠하는데", "time": [7568.549, 7572.563], "eng": "But lots of people get instantly offended: \"How is Yoon Suk Yeol an elite?\""}, {"id": "s123", "speaker": "이봉우 (언론 비평가)", "kor": "사실 윤석열은 서울대 나왔지, 대통령까지 해 먹었지, 검찰총장도 했어. 명백히 지도층이죠.", "time": [7572.593, 7578.329], "eng": "Actually, Yoon went to SNU, got to be president, and was prosecutor general too. He's clearly part of the leading class."}, {"id": "s124", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그렇게 얘기하면 하나하나에 대해서 다 화냅니다.", "time": [7578.359, 7581.732], "eng": "If you say that, people get angry at every single point."}, {"id": "s125", "speaker": "이봉우 (언론 비평가)", "kor": "아니야, 엘리트 아니야.", "time": [7581.762, 7583.098], "eng": "\"No, he's not an elite.\""}, {"id": "s126", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "서울대가 뭐, 학력이면 다야?", "time": [7583.128, 7584.766], "eng": "\"So he went to SNU — is a degree everything?\""}, {"id": "s127", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "검찰, 그럼 뭐 직위가 다야?", "time": [7584.796, 7586.633], "eng": "\"Prosecution — so is a title everything?\""}, {"id": "s128", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "뭐 대통령, 뭐 대통령 혼자 지가 잘났어? 민주주의 사회에서.", "time": [7586.663, 7589.796], "eng": "\"President — so he's special all by himself? In a democracy?\""}, {"id": "s129", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러면서 지도층? 걔가 뭘 날 지도해?", "time": [7589.826, 7592.222], "eng": "\"And 'leading class'? What's he ever led me on?\""}, {"id": "s130", "speaker": "이봉우 (언론 비평가)", "kor": "그러니까 근데 원래 개념상으로는 그게 맞다는 거지. 원래 그게 맞다는 거지.", "time": [7592.252, 7596.799], "eng": "But the point is, by definition that's exactly right. By definition that's right."}, {"id": "s131", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "물론 지도라는 말에는 과거에 그 앞에서 이끄는 자와 끌려가는 자라고 하는 민주주의적인 심화의 관점에서 보면 좀 더 초기 민주주의적인 그런 태도를 내포하는 거기 때문에 이제 더 이상은 안 쓰이는 게 맞아요.", "time": [7596.829, 7614.263], "eng": "Of course the word \"leading\" carries an old attitude of leaders out in front and followers being dragged along, which, from the view of a deepened democracy, belongs to an earlier stage of democracy, so it's right that it isn't used anymore."}, {"id": "s132", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "더 이상 지도하는 게 아니라 의사 결정의 권한을 갖고 있을 뿐인 거니까.", "time": [7614.293, 7618.567], "eng": "Because they don't lead anymore. They just hold decision-making power."}, {"id": "s133", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "옛날에는 충분히 그랬다고.", "time": [7618.597, 7619.986], "eng": "In the old days it really was like that."}, {"id": "s134", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "왜냐하면 대다수의 사람들이 문맹이고 문맹인 사람들이 지도자를 뽑지 않으면 그 집단은 굴러가지 않지. 당연히.", "time": [7620.016, 7628.774], "eng": "Because most people couldn't read, and if people who couldn't read didn't pick leaders, the group simply wouldn't function. Naturally."}, {"id": "s135", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "예전에 군대나 학력이나 이런 것들이 굉장히 큰 의미였던 건 실제로 그게 여러 가지 지적 자원들을 가지고 있을 수밖에 없었기 때문에 그래요.", "time": [7628.804, 7637.759], "eng": "The reason things like the military or education once meant so much is that those groups really did end up holding all sorts of intellectual resources."}, {"id": "s136", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그 시기에 맞는 어떤 의미라는 게 있고 시대가 바뀌면 의미도 바뀌어야 되고 용어도 바뀌는 건 맞아.", "time": [7637.789, 7643.543], "eng": "Every era has a meaning that fits it, and it's right that when the times change, meanings and terms change too."}, {"id": "s137", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "내가 직관적으로 느끼는 일상어적인 느낌을 절대시하는 그 태도는 제발 버리라는 말씀이에요.", "time": [7643.573, 7650.392], "eng": "What I'm saying is, please drop the attitude of treating the everyday feeling you get intuitively as absolute."}, {"id": "s138", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "내 말이 어느 부분에서는 내가 단어를 잘못 사용하고 있다는 걸 인정을 해야 새로운 단어를 받아들이고 배울 거 아니에요.", "time": [7650.422, 7658.38], "eng": "You have to admit that in some places you're using a word wrongly before you can take in new words and learn them."}, {"id": "s139", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "아니면 알고 있던 단어의 이면을 발견하든가. 그 말씀하신 겁니다.", "time": [7658.41, 7661.995], "eng": "Or discover the other side of a word you thought you knew. That's what he meant."}, {"id": "s140", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "사실 이게 쉽지는 않아요. 왜냐면 지는 거 같거든요.", "time": [7662.025, 7666.106], "eng": "Honestly, that's not easy. Because it feels like losing."}, {"id": "s141", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그렇죠, 예. 왜냐면 나도 다 말할 줄 알거든.", "time": [7666.136, 7669.316], "eng": "Right, yeah. Because I know how to talk too."}, {"id": "s142", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "제일 한심한 게 이런 식으로 하다가 이제 논리로 한번 막혀요.", "time": [7669.346, 7672.571], "eng": "The most pathetic thing is when someone does this and then gets stuck on the logic."}, {"id": "s143", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그러면 끝까지 인정을 안 해.", "time": [7672.601, 7674.468], "eng": "Then they never admit it."}, {"id": "s144", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그런데 다른 데 가면 내가 그 말 쓰고 있어.", "time": [7674.498, 7676.27], "eng": "But go somewhere else, and there they are using that same word."}, {"id": "s145", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그런 경우가 종종 보여요.", "time": [7676.3, 7678.377], "eng": "You see that pretty often."}, {"id": "s146", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "민주적, 시민적 당당함과 평등 의식이죠, 차이 내지 전문성 정도의 차이를 혼동하는 경향이 있어요, 상당히.", "time": [7678.407, 7688.322], "eng": "Democratic, civic confidence and a sense of equality, versus a difference — I mean a difference in expertise — people tend to mix those up, quite a lot."}, {"id": "s147", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그게 대표적으로 반지성주의가 만들어지는 이유입니다.", "time": [7688.352, 7691.727], "eng": "That's precisely why anti-intellectualism takes shape."}, {"id": "s148", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "반지성주의가 왜 만들어질까? 다 무식해서 만들어질까? 아니에요. 건방져서 만들어진 거예요.", "time": [7691.757, 7698.395], "eng": "Why does anti-intellectualism take shape? Because everyone's ignorant? No. It takes shape because people are arrogant."}, {"id": "s149", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "내가 알 수 있는 것과 모를 수 있는 걸 구별하는 능력이 지성이라고 본다면", "time": [7698.425, 7702.54], "eng": "If intellect is the ability to tell what you can know from what you might not know,"}, {"id": "s150", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "모르는 것도 다 평등하다라고 생각하는 거. 알고 모름에도 평등함이 작동한다.", "time": [7702.57, 7709.326], "eng": "then it's thinking that not knowing is equal too. That equality applies even to knowing and not knowing."}, {"id": "s151", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "모르는 사람이라고 해서 한 표가 주어지지 않는 게 아니고, 아는 사람이라고 해서 세 표가 주어지지 않는 거예요.", "time": [7709.356, 7715.311], "eng": "It's not that someone who doesn't know gets no vote, and it's not that someone who knows gets three votes."}, {"id": "s152", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그게 시민권적 평등이야.", "time": [7715.341, 7717.173], "eng": "That's civic equality."}, {"id": "s153", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "하지만 모름과 앎이라고 하는 건 다른 문제, 지식의 문제에서 다른 문제라고 하는 것들을 이해하지 못해.", "time": [7717.203, 7723.177], "eng": "But not knowing and knowing are a different matter, a different matter in terms of knowledge, and they fail to understand that."}, {"id": "s154", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이게 반지성주의의 출발점이에요.", "time": [7723.207, 7725.199], "eng": "That's where anti-intellectualism starts."}, {"id": "s155", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그래서 제가 종종 딴 데 강의 가서도 얘기하고 그러는데, 아이작 아시모프가 하는 얘기가 있는데", "time": [7725.229, 7730.142], "eng": "That's why I often bring this up when I lecture elsewhere: there's something Isaac Asimov said."}, {"id": "s156", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "자기네 나라, \"미국이란 나라의 정말 근본적인 문제 중에 하나는 나의 무지가 너의 지식과 동등하다고 착각하는 것이다.\"", "time": [7730.172, 7737.786], "eng": "About his own country: \"One of the truly fundamental problems of America is the false notion that my ignorance is just as good as your knowledge.\""}, {"id": "s157", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이게 반지성주의의 출발이다.", "time": [7737.816, 7739.567], "eng": "That's where anti-intellectualism begins."}, {"id": "s158", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "아, 그러고 보니까 제가 들었던 가장 기분 나쁜 말이, 물론 방송이고 콘셉트였는데, 가장 기분 나쁜 말이 그거였어요.", "time": [7739.597, 7745.823], "eng": "Ah, now that I think about it, the most hurtful thing I've ever heard — granted, it was a TV show and it was a bit — the most hurtful thing was this."}, {"id": "s159", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "어떤 여성 출연자가 저한테 \"그래 봐야, '거의없다님'이랑 저랑 똑같이 관객 아닌가요?\"", "time": [7745.853, 7750.875], "eng": "A woman on the show said to me, \"At the end of the day, aren't Mr. Geouieopda and I both just audience members?\""}, {"id": "s160", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "응.", "time": [7750.905, 7751.479], "eng": "Mm."}, {"id": "s161", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "우와, 정말 뭐 집어던질 뻔했습니다.", "time": [7751.509, 7755.821], "eng": "Wow, I almost threw something."}, {"id": "s162", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "아니, 극장 가서 표 내고 똑같이 영화를 보는 관객 1인 건 맞지.", "time": [7755.851, 7760.076], "eng": "I mean, sure, we're each one audience member who goes to the theater, buys a ticket and watches the same film."}, {"id": "s163", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그렇죠. 네.", "time": [7760.106, 7760.779], "eng": "Right. Yeah."}, {"id": "s164", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "하지만 그 영화를 보면서 내가 파낼 수 있는 것과 본인이 파낼 수 있는 게 다르잖아.", "time": [7760.809, 7763.762], "eng": "But what I can dig out of that film and what you can dig out are different."}, {"id": "s165", "speaker": "이봉우 (언론 비평가)", "kor": "그렇죠.", "time": [7763.792, 7764.39], "eng": "Right."}, {"id": "s166", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "근데 왜 그걸 똑같이 보냐고. 나도 모르지만 너도 모르잖아, 라는 태도잖아.", "time": [7764.42, 7768.905], "eng": "So why see it as the same? It's the attitude of \"I don't know, but you don't know either.\""}, {"id": "s167", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "내가 아는지 모르는지 지가 어떻게 알아.", "time": [7768.935, 7771.704], "eng": "How would she know whether I know or not?"}, {"id": "s168", "speaker": "이봉우 (언론 비평가)", "kor": "영화 평론가와 일반 관객도 똑같은 값을 내고 영화표를 사지만 평론가와 일반 관객은 다른 건데", "time": [7771.734, 7778.021], "eng": "Film critics and regular moviegoers pay the same price for a ticket, but a critic and a regular moviegoer are different,"}, {"id": "s169", "speaker": "이봉우 (언론 비평가)", "kor": "그렇지.", "time": [7778.051, 7778.621], "eng": "Right."}, {"id": "s170", "speaker": "이봉우 (언론 비평가)", "kor": "그거를 \"나도 너만큼 많이 알아\", 또는 \"너도 나만큼 모르잖아\"라고 등치시켜 버리려고.", "time": [7778.651, 7783.809], "eng": "and they try to equate it: \"I know as much as you do,\" or \"You don't know any more than I do.\""}, {"id": "s171", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "물론 의도가 아니었는데 제가 방송 시작하고 나서 들은 가장 기분 나쁜 말 중에 하나 있어요.", "time": [7783.839, 7788.111], "eng": "Of course she didn't mean it that way, but it's one of the most hurtful things I've heard since I started doing shows."}, {"id": "s172", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그건 못생겼다는 말보다 더 기분 나빴어요.", "time": [7788.141, 7791.393], "eng": "It hurt more than being called ugly."}, {"id": "s173", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "뭘 선택하고 싶어요?", "time": [7791.423, 7792.662], "eng": "Which would you pick?"}, {"id": "s174", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "예? 아, \"못생겼다\"와 \"너나 나나 똑같은 관객이잖아?\"", "time": [7792.692, 7798.546], "eng": "Huh? Ah, \"You're ugly\" versus \"You and I are just the same audience\"?"}, {"id": "s175", "speaker": "이봉우 (언론 비평가)", "kor": "야, 이거 어려움 별로 없을 게임이다.", "time": [7802.178, 7804.072], "eng": "Man, that's a no-brainer."}, {"id": "s176", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "차라리 못생긴 게 (낫죠).", "time": [7804.102, 7807.129], "eng": "I'd rather be ugly."}, {"id": "s177", "speaker": "이봉우 (언론 비평가)", "kor": "역시 포기할 수 없는 전문 분야.", "time": [7807.159, 7809.05], "eng": "Of course: the field of expertise he can never give up."}, {"id": "s178", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "자존심.", "time": [7809.08, 7810.05], "eng": "Pride."}, {"id": "s179", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "이거 빠져, 빠지면 나 뭐 먹고 살아.", "time": [7810.08, 7812.29], "eng": "Take that away and how am I supposed to make a living?"}, {"id": "s180", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "나 못생겼다는 데 일부분 인정할 수도 있겠죠.", "time": [7812.32, 7814.855], "eng": "\"I'm ugly\" — I could maybe admit that partly."}, {"id": "s181", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "아이, 못생기지 않았지.", "time": [7814.885, 7816.791], "eng": "Come on, you're not ugly."}, {"id": "s182", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "자신감이 또 바탕에 깔려 있는 거야.", "time": [7816.821, 7819.012], "eng": "There's confidence underneath that too."}, {"id": "s183", "speaker": "이봉우 (언론 비평가)", "kor": "아, 못생기지 않았다라는 자신감이 있구나.", "time": [7819.042, 7821.293], "eng": "Ah, so you're confident you're not ugly."}, {"id": "s184", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "우리 엄마는 내가 세상에서 제일 잘생겼다고 했어.", "time": [7821.323, 7823.416], "eng": "My mom said I was the best-looking guy in the world."}, {"id": "s185", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "장동건보다 잘생겼다고 했어.", "time": [7823.446, 7826.014], "eng": "She said I was better-looking than Jang Dong-gun."}, {"id": "s186", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "우리 엄마는 나한테 거짓말한 적 없어.", "time": [7826.044, 7828.264], "eng": "My mom has never lied to me."}, {"id": "s187", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그러니까 그건 사실이야.", "time": [7830.685, 7831.946], "eng": "So it's a fact."}, {"id": "s188", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "저는 현대 사회의 가장 심각한 병리 중에 하나가 반지성주의라고 생각해요.", "time": [7833.207, 7839.081], "eng": "I think anti-intellectualism is one of the most serious pathologies of modern society."}, {"id": "s189", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "반지성주의는 되게 심각한 문제를 내포하거든요.", "time": [7839.111, 7842.243], "eng": "Anti-intellectualism carries really serious problems."}, {"id": "s190", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 이게 우리가 좀 더 공통적으로 우리의 지적 능력을 높여 나가고 지식을 높임으로써 사회에 유익이 되게 만드는 방향을 완전히 바깥으로 뒤집는 거야.", "time": [7842.273, 7853.732], "eng": "It turns completely inside out the direction of raising our intellectual ability together and growing our knowledge so that it benefits society."}, {"id": "s191", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "더 이상 우리가 더 많이 알 필요도 없고 더 많이 알아낼 이유도 없고 지성을 위해 투자할 이유도 아무것도 없어져요.", "time": [7853.762, 7860.192], "eng": "There'd be no need to know more, no reason to find out more, no reason at all to invest in the intellect."}, {"id": "s192", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "맞아요.", "time": [7860.222, 7860.612], "eng": "Exactly."}, {"id": "s193", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "무식하고 당당하면 세상에서 제일 잘나지는데, 뭐.", "time": [7860.642, 7863.988], "eng": "If you're ignorant and brazen, you end up the greatest person in the world."}, {"id": "s194", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "무식할수록 잘나지는 기현상이 벌어져.", "time": [7864.018, 7866.27], "eng": "You get this bizarre situation where the more ignorant you are, the better you think you are."}, {"id": "s195", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그렇죠. 그게 사회 전반적으로 일어나는 효과라고 하는 건 지금 우리가 보는 극우 집단이에요.", "time": [7866.3, 7872.323], "eng": "Right. And when that happens across society as a whole, what you get is the far-right groups we're seeing now."}, {"id": "s196", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "전형적인 반지성주의 집단 아닙니까.", "time": [7872.353, 7874.901], "eng": "Aren't they textbook anti-intellectual groups?"}, {"id": "s197", "speaker": "이봉우 (언론 비평가)", "kor": "그러니까 우리가 일상 수준에서 반지성주의를 그냥 가볍게 넘기면 안 되는 게", "time": [7874.931, 7878.744], "eng": "So the reason we shouldn't brush off anti-intellectualism at the everyday level is"}, {"id": "s198", "speaker": "이봉우 (언론 비평가)", "kor": "왜냐면 친구들 중에서도 그런 사람이 있을 수 있잖아요.", "time": [7878.774, 7880.821], "eng": "that there can be people like that even among our friends."}, {"id": "s199", "speaker": "이봉우 (언론 비평가)", "kor": "막 모르면서 막 당당하고, 막 오히려 \"네가 뭘 얼마나 안다 그래?\", 그러면서 막.", "time": [7880.851, 7885.013], "eng": "Totally clueless but totally sure of themselves, and even turning it around on you: \"What makes you think you know so much?\""}, {"id": "s200", "speaker": "이봉우 (언론 비평가)", "kor": "근데 일상 수준에서 그런 거를 우리가 너무 가볍게 생각하면 안 되는 게", "time": [7885.043, 7888.73], "eng": "But the reason we shouldn't take that so lightly at the everyday level is"}, {"id": "s201", "speaker": "이봉우 (언론 비평가)", "kor": "지금 우리가 보고 있는 윤석열, 내란 세력이 사실은 그런 사람들이 어떻게 하다가 윤석열이라는 권력자를 타고 권력화가 돼 버렸거든.", "time": [7888.76, 7896.723], "eng": "that the Yoon Suk Yeol insurrection forces we're seeing now were really people like that who somehow rode on a man of power named Yoon Suk Yeol and turned into a power themselves."}, {"id": "s202", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그렇지.", "time": [7896.753, 7897.147], "eng": "Right."}, {"id": "s203", "speaker": "이봉우 (언론 비평가)", "kor": "이제는 자기들이 권력이 돼 버렸잖아요.", "time": [7897.177, 7898.941], "eng": "Now they've become a power themselves."}, {"id": "s204", "speaker": "이봉우 (언론 비평가)", "kor": "막, 가 가지고 물론 정당한 일이 아니지만, 다 막 마음에 안 든다고 다 깨부수고 다니고", "time": [7898.971, 7903.473], "eng": "They go out and, though of course it's not justified, smash up everything they don't like,"}, {"id": "s205", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "그러니까 윤석열을 본인하고 동일시해서 윤석열과 똑같은 방식을 쓰는 거야, 때려 부수는 방식.", "time": [7903.503, 7909.097], "eng": "So they identify with Yoon Suk Yeol and use the same methods he does: the smash-it-all approach."}, {"id": "s206", "speaker": "이봉우 (언론 비평가)", "kor": "무서운 일이야. 그러니까.", "time": [7909.127, 7910.966], "eng": "It's scary. Really."}, {"id": "s207", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "제가 이 얘기를 하게 된 게, 일상어하고 전문 용어, 의미가 제한되어 있는 용어와 의미가 그냥 제멋대로 늘어나는 일상어 사이의 차이를 얘기한 이유도 있고", "time": [7910.996, 7920.751], "eng": "Part of why I brought this up was to talk about the difference between everyday words and technical terms, between terms whose meaning is fixed and everyday words whose meaning just stretches any which way,"}, {"id": "s208", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그다음에 그게 이제 우리의 언어 습관 속에 스며들면서 은연중에 반지성주의적 태도를 가지게 되는 경우도 되게 많다.", "time": [7920.781, 7927.078], "eng": "and also that, as that seeps into our language habits, we very often pick up an anti-intellectual attitude without realizing it."}, {"id": "s209", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "반지성주의를 가져야 당당해지거든. 지성주의를 가지면 부끄러워져요.", "time": [7927.108, 7932.341], "eng": "You get to feel confident by being anti-intellectual. Being pro-intellect makes you feel ashamed."}, {"id": "s210", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "왜냐하면 모르는 게 더 많이 드러나니까.", "time": [7932.371, 7934.243], "eng": "Because it exposes how much more you don't know."}, {"id": "s211", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "내가 모른다는 걸 훨씬 더 많이 알게 되기 때문에 훨씬 많이 부끄러움을 선택하게 되는데", "time": [7934.273, 7938.486], "eng": "You realize far more of what you don't know, so you end up choosing far more shame, but"}, {"id": "s212", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "반지성주의는 모르는 게 전혀 부끄럽지 않기 때문에 대단히 당당해져.", "time": [7938.516, 7943.149], "eng": "with anti-intellectualism, not knowing isn't embarrassing at all, so you become incredibly self-assured."}, {"id": "s213", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러니까 당당함의 효과를 하기 위해서 반지성주의를 선택해요.", "time": [7943.179, 7946.382], "eng": "So people choose anti-intellectualism to get that feeling of confidence."}, {"id": "s214", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "이게 비극의 시작이야.", "time": [7946.412, 7948.599], "eng": "That's where the tragedy begins."}, {"id": "s215", "speaker": "백재욱 (영화 유튜버 '거의없다')", "kor": "배우는 것보다는 그게 손쉬우니까.", "time": [7948.629, 7949.926], "eng": "Because that's easier than learning."}, {"id": "s216", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "손쉽죠, 훨씬.", "time": [7949.956, 7950.704], "eng": "Way easier."}, {"id": "s217", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그래서 이 얘기를 하는 게, 제가 이런 얘기들을 많이 하잖아요.", "time": [7952.145, 7955.528], "eng": "So the reason I'm bringing this up is, I talk about this kind of thing a lot, right?"}, {"id": "s218", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "그러면 그러니까 대놓고는 얘기를 못 하고 저한테 뭐라고 의심을 품냐면,", "time": [7955.558, 7962.132], "eng": "And then, well, they can't say it openly, but you know what they suspect me of?"}, {"id": "s219", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "\"쟤 엘리트주의자\", \"사람을 등급으로 나누는 자\", 이런 식으로 바라보는 경향이에요.", "time": [7962.162, 7968.178], "eng": "They tend to see me as \"that elitist,\" \"someone who ranks people.\""}, {"id": "s220", "speaker": "이봉우 (언론 비평가)", "kor": "아니 반지성주의를 비판하는데 왜 그게 계급주의...", "time": [7968.208, 7971.302], "eng": "Wait, you criticize anti-intellectualism, so how does that make you a classist..."}, {"id": "s221", "speaker": "이봉우 (언론 비평가)", "kor": "결국은 뭐 \"지성이 잘났다는 거고, 너는 지성이고 나는 반지성이라는 얘기잖아.\"", "time": [7971.332, 7975.659], "eng": "\"In the end you're saying intellect is superior — that you're intellectual and I'm anti-intellectual.\""}, {"id": "s222", "speaker": "이봉우 (언론 비평가)", "kor": "아, 지성과 반지성주의를 나누는 거를 계급을 나누듯이 사람을 차별해서 온다는 그런 걸로 왜곡을 해서 받아들이는구나.", "time": [7975.689, 7982.013], "eng": "Ah, so they twist it and take it as discriminating against people, as if splitting intellect from anti-intellectualism were like dividing people into classes."}, {"id": "s223", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "반지성주의를 얘기하는 순간 지성과 반지성의 차이를 얘기해야 되고", "time": [7982.043, 7986.515], "eng": "The moment you talk about anti-intellectualism, you have to talk about the difference between intellect and anti-intellect,"}, {"id": "s224", "speaker": "정준희 (한양대 미디어학 교수)", "kor": "지성과 반지성의 차이는 결국 지성을 갖추거나 지식을 좀 더 많이 갖춘 자의 등급이 그렇지 못한 자의 등급보다 높다라고 하는 것을 내포하는 것처럼 느껴지거든요.", "time": [7986.545, 7997.39], "eng": "and that difference feels as though it implies that people with intellect, or with more knowledge, rank higher than those without."}]}];

all."}], "translations": {"en": {"term": "practically, in effect", "mainDef": "Looking at the real content, not the outward form or name.", "contextDef": "Says the phrase is still around in name, but in practice it has lost its force."}}}, {"term": "지배층", "mainDef": "지배층은 한 사회에서 다른 사람들을 다스리고 움직일 힘을 가진 무리예요.", "hanja": "지(支 버티다) + 배(配 나누다) + 층(層 층)", "contextDef": "사회과학에서는 칭찬도 욕도 아닌, 그냥 힘을 가진 집단을 부르는 말이라고 설명해요.", "variants": ["지배층"], "examples": [{"kor": "옛날에는 귀족이 지배층이었어요.", "eng": "In the old days, the nobility was the ruling class."}], "translations": {"en": {"term": "the ruling class", "mainDef": "The group in a society that has the power to govern and move other people.", "contextDef": "Explained as a neutral social-science term: neither praise nor insult, just the group with power."}}, "core": true}, {"term": "사회과학", "mainDef": "사회과학은 사회 속 사람들의 삶과 제도, 관계를 연구하는 학문이에요. 사회학, 경제학, 정치학 등이 있어요.", "hanja": "사(社 모이다) + 회(會 모이다) + 과(科 과목) + 학(學 배우다)", "contextDef": "'지배층'이라는 말을 감정 없이 쓰는 학문의 세계를 가리켜요.", "variants": ["사회과학"], "examples": [{"kor": "대학교에서 사회과학을 전공했어요.", "eng": "I majored in social sciences in college."}], "translations": {"en": {"term": "social science", "mainDef": "The academic fields that study people's lives, institutions and relationships in society, such as sociology, economics and political science.", "contextDef": "Refers to the academic world where '지배층' is used without any emotional charge."}}}, {"term": "자원을 독점하다", "mainDef": "누군가가 자원을 독점하면, 돈이나 땅, 정보 같은 귀한 것을 혼자 다 차지하고 남과 나누지 않는다는 뜻이에요.", "subDefs": [{"subTerm": "• 자원(資源)", "subDef": "자(資, 재물) + 원(源, 근원). 사람이 쓸 수 있는 돈, 물건, 사람, 정보 같은 것을 모두 말해요."}, {"subTerm": "• 독점(獨占)", "subDef": "독(獨, 홀로) + 점(占, 차지하다). 혼자서 다 차지하는 거예요."}], "contextDef": "지배층이 무엇인지 설명하는 첫 번째 조건이에요.", "variants": ["자원을 독점하면서"], "examples": [{"kor": "한 회사가 시장을 독점하면 값이 올라가기 쉬워요.", "eng": "When one company monopolizes the market, prices tend to rise."}], "translations": {"en": {"term": "to monopolize resources", "mainDef": "To take all the valuable things such as money, land or information for yourself and not share them.", "contextDef": "The first condition used to define the ruling class.", "subDefs": [{"subTerm": "자원 (資源)", "subDef": "resources: money, goods, people, information that can be used."}, {"subTerm": "독점 (獨占)", "subDef": "monopoly; taking everything for oneself."}]}}, "core": true}, {"term": "권력을 행사하다", "mainDef": "누군가가 권력을 행사하면, 가진 힘을 실제로 써서 다른 사람을 따르게 한다는 뜻이에요.", "subDefs": [{"subTerm": "• 권력(權力)", "subDef": "권(權, 힘) + 력(力, 힘). 남을 따르게 만드는 큰 힘이에요."}, {"subTerm": "• 행사(行使)", "subDef": "행(行, 하다) + 사(使, 부리다). 가진 힘이나 권리를 실제로 쓰는 거예요."}], "contextDef": "지배층을 설명하는 두 번째 조건이에요. 자원을 가진 사람이 그 힘을 실제로 쓴다는 거예요.", "variants": ["권력을 행사하고"], "examples": [{"kor": "왕은 마음대로 권력을 행사했어요.", "eng": "The king wielded power however he pleased."}], "translations": {"en": {"term": "to wield power", "mainDef": "To actually use the power you have to make others go along with you.", "contextDef": "The second condition in the definition of the ruling class: actually using the power that comes with resources.", "subDefs": [{"subTerm": "권력 (權力)", "subDef": "power, authority over others."}, {"subTerm": "행사 (行使)", "subDef": "exercising (a right or power)."}]}}, "core": true}, {"term": "지배력", "mainDef": "지배력은 다른 사람이나 어떤 곳을 마음대로 움직이고 다스릴 수 있는 힘이에요.", "hanja": "지(支 버티다) + 배(配 나누다) + 력(力 힘)", "contextDef": "지배층이 다른 사람들보다 앞서 힘을 쓸 수 있는 자리에 있다는 걸 말해요.", "variants": ["지배력"], "examples": [{"kor": "그 회사는 스마트폰 시장에서 지배력이 커요.", "eng": "That company has strong control over the smartphone market."}], "translations": {"en": {"term": "dominance, control", "mainDef": "The power to move and govern other people or an area as you wish.", "contextDef": "Describes the ruling class being in a position to use power ahead of others."}}}, {"term": "유리한 위치", "mainDef": "유리한 위치는 다른 사람보다 이기거나 이익을 얻기 쉬운 자리예요.", "subDefs": [{"subTerm": "• 유리하다(有利)", "subDef": "유(有, 있다) + 리(利, 이롭다). 이익이 있거나 조건이 좋다는 뜻이에요."}], "contextDef": "지배층은 힘을 쓰기 좋은 자리에 먼저 서 있는 사
