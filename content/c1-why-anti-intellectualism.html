한두 번 설명해서는 사람들의 생각이 바뀌지 않는다는 교수의 경험이에요.", "variants": ["설명해 봤자"], "examples": [{"kor": "지금 뛰어가 봤자 기차는 벌써 떠났을 거예요.", "eng": "Even if you run now, the train will already have left."}], "translations": {"en": {"term": "no matter how much you explain", "mainDef": "Even if you explain, it won't get the result you want.", "contextDef": "His experience that explaining once or twice doesn't change people's minds.", "subDefs": [{"subTerm": "-아/어 봤자", "subDef": "Even if you do it, it's no use."}]}}}, {"term": "외려", "mainDef": "외려는 '오히려'를 줄인 말로, 생각과 반대로라는 뜻이에요.", "contextDef": "자기가 일상에서 아는 뜻이 맞을 거라는 생각과 반대로, 그 뜻이 틀렸을 수도 있다는 말이에요.", "variants": ["외려"], "examples": [{"kor": "약을 먹었는데 외려 더 아파졌어요.", "eng": "I took the medicine, but I actually got sicker."}], "translations": {"en": {"term": "rather, on the contrary", "mainDef": "A shortened form of '오히려': contrary to what you'd expect.", "contextDef": "Suggests that, contrary to their assumption, their everyday meaning might be the wrong one."}}}, {"term": "정교하게", "mainDef": "무언가를 정교하게 하면, 아주 작은 부분까지 꼼꼼하고 정확하게 한다는 뜻이에요.", "hanja": "정(精 자세하다) + 교(巧 솜씨 있다)", "contextDef": "말의 뜻을 대충이 아니라 정확하게 가려 쓰려고 하는 직업의 태도를 말해요.", "variants": ["정교하게"], "examples": [{"kor": "이 시계는 아주 정교하게 만들어졌어요.", "eng": "This watch is made with great precision."}], "translations": {"en": {"term": "precisely, with fine detail", "mainDef": "Done carefully and accurately down to the smallest detail.", "contextDef": "Describes jobs that try to use words with exact, not rough, meanings."}}}, {"term": "메타인지", "mainDef": "메타인지는 내가 무엇을 알고 무엇을 모르는지를 스스로 아는 능력이에요.", "hanja": "메타(meta) + 인(認 알다) + 지(知 알다)", "contextDef": "누가 더 말을 정확하게 쓰려고 노력할지 생각해 보는 것 자체가 자기 앎을 돌아보는 일이라는 뜻이에요.", "variants": ["메타인지"], "examples": [{"kor": "공부를 잘하는 학생은 메타인지가 뛰어난 경우가 많아요.", "eng": "Good students often have strong metacognition."}], "translations": {"en": {"term": "metacognition", "mainDef": "The ability to know for yourself what you know and what you don't.", "contextDef": "Thinking about who tries harder to use words precisely is itself a way of reflecting on your own knowledge."}}, "core": true}, {"term": "순진하게 받아들이다", "mainDef": "누군가가 어떤 생각을 순진하게 받아들이면, 깊이 따져 보지 않고 겉으로 보이는 대로 믿는다는 뜻이에요.", "subDefs": [{"subTerm": "• 순진(純眞)", "subDef": "순(純, 깨끗하다) + 진(眞, 참). 마음이 깨끗하고 꾸밈이 없지만, 세상을 잘 모른다는 느낌도 있어요."}], "contextDef": "'엘리트'를 '훌륭한 사람'이라고만 생각하는 태도를 꼬집는 말이에요.", "variants": ["순진하게 받아들이고"], "examples": [{"kor": "광고를 순진하게 받아들이면 돈을 낭비하기 쉬워요.", "eng": "If you take ads at face value, it's easy to waste money."}], "translations": {"en": {"term": "to take (something) naively", "mainDef": "To believe something as it looks without thinking it through.", "contextDef": "Criticizes the assumption that 'elite' simply means 'an admirable person'.", "subDefs": [{"subTerm": "순진 (純眞)", "subDef": "innocent, naive."}]}}}, {"term": "교복 엘리트", "mainDef": "교복 엘리트는 예전에 학생들이 많이 입던 교복 브랜드 '엘리트(엘리트 학생복)'를 가리키는 말이에요.", "subDefs": [{"subTerm": "• 교복(校服)", "subDef": "교(校, 학교) + 복(服, 옷). 학생이 학교에 입고 가는 정해진 옷이에요."}], "contextDef": "교복 브랜드 이름으로 쓰일 만큼 '엘리트'가 좋은 뜻으로 익숙해졌다는 이야기예요. 그래서 사람들은 '엘리트'를 아주 훌륭한 사람이라는 뜻으로만 받아들이고, 이 말을 비판적으로 쓰면 불편해해요.", "variants": ["교복 엘리트"], "examples": [{"kor": "부모님 세대에는 '엘리트' 교복을 입고 학교에 다닌 사람이 많아요.", "eng": "Many people in my parents' generation went to school in 'Elite' uniforms."}], "translations": {"en": {"term": "'Elite' (a school-uniform brand)", "mainDef": "Refers to 'Elite' (엘리트 학생복), a school-uniform brand that many students used to wear.", "contextDef": "The word 'elite' became so familiar as a positive label that it was even a uniform brand name, so people take it to mean only 'an admirable person' and bristle when it is used critically.", "subDefs": [{"subTerm": "교복 (校服)", "subDef": "school uniform."}]}}}, {"term": "성스럽다", "mainDef": "매우 귀중해서 함부로 대할 수 없어요.", "hanja": "성(聖 거룩하다)", "contextDef": "'엘리트'라는 말이 너무 높고 귀한 것처럼 사람들 마음에 자리 잡았다는 뜻이에요.", "variants": ["성스러운"], "examples": [{"kor": "이곳은 많은 사람에게 성스러운 장소예요.", "eng": "This is a sacred place for many people."}], "translations": {"en": {"term": "sacred", "mainDef": "So precious that it must not be treated carelessly.", "contextDef": "'Elite' became something lofty and untouchable in people's minds."}}}, {"term": "일상어", "mainDef": "일상어는 특정한 분야가 아니라 보통 사람들이 매일의 생활에서 쓰는 말이에요.", "hanja": "일(日 날) + 상(常 늘) + 어(語 말)", "contextDef": "이 대담의 중심 개념이에요. 뜻이 넓고 느슨한 생활 속 말을, 뜻이 정해진 학문의 말과 비교해요.", "variants": ["일상어"], "examples": [{"kor": "일상어로는 '밥'이라고 하지만 글에서는 '식사'라고도 해요.", "eng": "In everyday speech we say '밥', but in writing we also say '식사'."}], "translations": {"en": {"term": "everyday language", "mainDef": "The words ordinary people use in daily life, as opposed to specialist language.", "contextDef": "A key concept of the talk: loose everyday words compared with words whose meaning is fixed in academic fields."}}, "core": true}, {"term": "명언", "mainDef": "명언은 많은 사람에게 오래 기억되는 지혜롭고 훌륭한 말이에요.", "hanja": "명(名 이름나다) + 언(言 말)", "contextDef": "비 이야기를 꺼내기 전에 '좋은 말이 있다'고 운을 띄운 거예요.", "variants": ["명언"], "examples": [{"kor": "'시작이 반이다'는 제가 좋아하는 명언이에요.", "eng": "'Well begun is half done' is one of my favorite sayings."}], "translations": {"en": {"term": "a famous saying", "mainDef": "A wise and memorable remark that many people remember for a long time.", "contextDef": "He introduces the rain saying as a famous quote."}}}, {"term": "레퍼런스", "mainDef": "레퍼런스는 어떤 주장이나 뜻이 맞다고 할 때 기대는 글, 자료, 증거예요.", "contextDef": "정준희 교수는 한국에서 흔히 '참고서'로 아는 이 말이 원래는 '근거가 되는 자료'라고 설명해요.", "variants": ["레퍼런스"], "examples": [{"kor": "보고서를 쓸 때는 레퍼런스를 꼭 밝혀야 해요.", "eng": "When writing a report, you must cite your references."}], "translations": {"en": {"term": "reference", "mainDef": "A text, data or evidence you rely on to back up a claim or a meaning.", "contextDef": "He explains that this word, often taken as 'study guide' in Korea, really means 'source material'."}}, "core": true}, {"term": "참고서", "mainDef": "참고서는 공부할 때 옆에 두고 필요한 정보를 찾아보며 도움을 받는 책이에요.", "hanja": "참(參 참여하다) + 고(考 생각하다) + 서(書 책)", "contextDef": "한국 사람들이 '레퍼런스'라는 영어를 들으면 흔히 '참고서'라는 한국어 단어를 떠올리는 뜻이에요.", "variants": ["참고서"], "examples": [{"kor": "시험 전에 수학 참고서를 한 권 샀어요.", "eng": "I bought a math study guide before the exam."}], "translations": {"en": {"term": "reference book", "mainDef": "A book that one can study and get relevant information from.", "contextDef": "When Koreans hear the English word 'reference', they usually think of the Korean word '참고서' (reference book)."}}}, {"term": "문헌", "mainDef": "문헌은 옛날 일이나 연구 내용을 알 수 있게 해 주는 책이나 글이에요.", "hanja": "문(文 글) + 헌(獻 바치다)", "contextDef": "레퍼런스가 될 수 있는 것 가운데 하나로 들었어요.", "variants": ["문헌"], "examples": [{"kor": "이 이야기는 옛 문헌에도 나와요.", "eng": "This story also appears in old records."}], "translations": {"en": {"term": "literature, written records", "mainDef": "Books or writings that let you learn about the past or about research.", "contextDef": "Listed as one kind of thing that can serve as a reference."}}}, {"term": "좌표점", "mainDef": "좌표점은 지도나 그래프에서 위치를 정확하게 나타내는 한 점이에요.", "hanja": "좌(座 자리) + 표(標 표시) + 점(點 점)", "contextDef": "모두가 기준으로 삼을 수 있는 '공통의 한 점', 곧 사람마다 다른 말뜻을 맞추는 기준을 비유한 말이에요.", "variants": ["좌표점"], "examples": [{"kor": "지도에서 이 좌표점이 우리 학교 위치예요.", "eng": "This point on the map is where our school is."}], "translations": {"en": {"term": "a coordinate point", "mainDef": "A point that marks an exact position on a map or graph.", "contextDef": "A metaphor for a shared reference point that lines up everyone's different meanings."}}, "core": true}, {"term": "인위적인 작업", "mainDef": "인위적인 작업은 저절로 생기지 않고 사람이 일부러 손을 대서 하는 일이에요.", "subDefs": [{"subTerm": "• 인위적(人爲的)", "subDef": "인(人, 사람) + 위(爲, 하다) + 적(的, ~의 성질). 자연 그대로가 아니라 사람의 힘으로 한 것이에요."}], "contextDef": "사전 같은 기준은 자연히 생긴 게 아니라 사람들이 뜻을 맞추려고 일부러 만든 장치라는 말이에요.", "variants": ["인위적인 작업"], "examples": [{"kor": "이 호수는 사람들이 땅을 파서 만든 인위적인 호수예요.", "eng": "This lake is artificial; people dug it out."}], "translations": {"en": {"term": "an artificial task, a deliberate human effort", "mainDef": "Work that doesn't happen on its own but that people do on purpose.", "contextDef": "References like dictionaries don't arise naturally; people deliberately build them to align meanings.", "subDefs": [{"subTerm": "인위적 (人爲的)", "subDef": "artificial, man-made."}]}}}, {"term": "날아다닐 테니까", "mainDef": "'-ㄹ/을 테니까'라고 하면, 앞으로 그렇게 될 거라고 짐작하고 그것을 이유로 든다는 뜻이에요.", "subDefs": [{"subTerm": "• -ㄹ/을 테니까", "subDef": "앞으로 그럴 거라는 짐작을 이유로 삼아요. 예) 내가 갈 테니까 기다려. 추울 테니까 옷을 따뜻하게 입어."}, {"subTerm": "• 날아다니다", "subDef": "이리저리 날아서 돌아다니다. 여기서는 말뜻이 정해지지 않고 떠다니는 모습을 비유해요."}], "contextDef": "기준이 없으면 말의 뜻이 정해지지 않고 여기저기로 흩어질 거라는 비유예요.", "variants": ["날아다닐 테니까"], "examples": [{"kor": "곧 비가 올 테니까 우산을 챙기세요.", "eng": "It's going to rain soon, so take an umbrella."}], "translations": {"en": {"term": "since (meanings) would fly all over", "mainDef": "Saying '-ㄹ/을 테니까' gives an expected future result as the reason.", "contextDef": "A metaphor: without a standard, meanings would scatter in all directions.", "subDefs": [{"subTerm": "-ㄹ/을 테니까", "subDef": "since (I expect) ... will happen"}, {"subTerm": "날아다니다", "subDef": "to fly around; here, meanings floating around unfixed."}]}}}, {"term": "절대적인 권위", "mainDef": "절대적인 권위는 누구도 따지거나 거스를 수 없는 아주 강한 힘과 믿음이에요.", "subDefs": [{"subTerm": "• 절대적(絶對的)", "subDef": "절(絶, 끊다) + 대(對, 맞서다) + 적(的). 견줄 것이 없고 어떤 조건에도 흔들리지 않는다는 뜻이에요."}, {"subTerm": "• 권위(權威)", "subDef": "권(權, 힘) + 위(威, 위엄). 남이 믿고 따르게 만드는 힘이에요."}], "contextDef": "사전이 늘 옳다는 뜻은 아니라고 선을 그은 말이에요. 사전도 시대에 따라 바뀌기 때문이에요.", "variants": ["절대적인 권위"], "examples": [{"kor": "옛날에는 왕의 말이 절대적인 권위를 가졌어요.", "eng": "In the old days, the king's word had absolute authority."}], "translations": {"en": {"term": "absolute authority", "mainDef": "Power and trust so strong that no one can question or go against it.", "contextDef": "He clarifies that dictionaries aren't always right; they change with the times.", "subDefs": [{"subTerm": "절대적 (絶對的)", "subDef": "absolute."}, {"subTerm": "권위 (權威)", "subDef": "authority, prestige."}]}}, "core": true}, {"term": "지배적으로", "mainDef": "지배적으로는 여럿 가운데 가장 크게, 대부분이라는 뜻이에요.", "hanja": "지(支 버티다) + 배(配 나누다) + 적(的 ~의 성질)", "contextDef": "아주 많은 사람이 어떤 말을 한 가지 뜻으로 쓰게 되면 사전도 따라 바뀐다는 말이에요.", "variants": ["지배적으로"], "examples": [{"kor": "우리 반에서는 여름 방학에 바다에 가자는 의견이 지배적이었어요.", "eng": "In our class, most people wanted to go to the beach for summer break."}], "translations": {"en": {"term": "predominantly", "mainDef": "To the greatest extent among many; for the most part.", "contextDef": "When most people come to use a word one way, the dictionary follows."}}}, {"term": "짜장면", "mainDef": "짜장면은 검은 춘장 소스를 국수에 비벼 먹는 한국식 중국 음식이에요.", "contextDef": "한때 바른 표기는 '자장면'뿐이었지만, 사람들이 대부분 '짜장면'이라고 써서 2011년에 둘 다 표준어가 되었어요. 사전이 바뀐 예로 들었어요.", "variants": ["짜장면"], "examples": [{"kor": "이사하는 날에는 짜장면을 시켜 먹어요.", "eng": "On moving day, we order jjajangmyeon."}], "translations": {"en": {"term": "jjajangmyeon (black-bean noodles)", "mainDef": "A Korean-Chinese dish of noodles mixed with black bean sauce.", "contextDef": "Once only '자장면' was the correct spelling, but since most people wrote '짜장면', both became standard in 2011 — an example of the dictionary changing."}}}, {"term": "표기법", "mainDef": "표기법은 말을 글자로 어떻게 적을지 정해 놓은 규칙이에요.", "hanja": "표(表 나타내다) + 기(記 적다) + 법(法 법)", "contextDef": "짜장면 예는 뜻이 아니라 글자로 적는 법에 관한 것이라고 덧붙인 부분이에요.", "variants": ["표기법"], "examples": [{"kor": "외국 이름은 표기법에 맞게 적어야 해요.", "eng": "Foreign names should be written according to the spelling rules."}], "translations": {"en": {"term": "spelling/orthography rules", "mainDef": "Rules that decide how spoken words are written down.", "contextDef": "He adds that the jjajangmyeon example is about spelling, not meaning."}}, "core": true}, {"term": "레퍼런스뿐이 없는", "mainDef": "'N뿐이 없다'는 말할 때 자주 쓰지만, 바른 표현은 'N밖에 없다'예요. 그것 하나만 있고 다른 것은 없다는 뜻이에요.", "subDefs": [{"subTerm": "• N밖에 없다 / N뿐이다", "subDef": "'밖에'는 뒤에 '없다, 안' 같은 부정어와 함께, '뿐'은 '-이다'와 함께 써요. 예) 너밖에 없어(○), 너뿐이야(○), 너뿐이 없어(구어)."}], "contextDef": "자기 뜻이 맞다고 말할 근거는 결국 레퍼런스 하나밖에 없다는 결론이에요.", "variants": ["레퍼런스뿐이 없는"], "examples": [{"kor": "지갑에 천 원밖에 없어요.", "eng": "I only have 1,000 won in my wallet."}], "translations": {"en": {"term": "nothing but references", "mainDef": "'N뿐이 없다' is common in speech, but the standard form is 'N밖에 없다': only that, nothing else.", "contextDef": "His conclusion: in the end, the only basis for claiming your meaning is right is a reference.", "subDefs": [{"subTerm": "N밖에 없다 / N뿐이다", "subDef": "'Only N': 밖에 goes with a negative, 뿐 goes with -이다; '뿐이 없다' is a spoken mix."}]}}}, {"term": "말이 나와서 말인데", "mainDef": "'말이 나와서 말인데'라고 하면, 지금 나온 이야기를 계기로 관련된 다른 이야기를 꺼낸다는 뜻이에요.", "contextDef": "백재욱 씨가 '엘리트' 이야기를 이어 받아 자기 경험을 꺼낼 때 썼어요. 높여서 '말씀이 나와서 말인데'라고도 했어요.", "variants": ["말이 나와서 말인데", "말씀이 나와서 말인데"], "examples": [{"kor": "말이 나와서 말인데, 우리 다음 주에 같이 밥 먹을래?", "eng": "Speaking of which, want to grab a meal together next week?"}], "translations": {"en": {"term": "now that you mention it, speaking of which", "mainDef": "Used to bring up a related topic prompted by what was just said.", "contextDef": "Baek uses it to pick up the 'elite' thread and share his own experience; the polite version is '말씀이 나와서 말인데'."}}}, {"term": "내포하다", "mainDef": "어떤 말이 어떤 뜻을 내포하면, 그 뜻이 겉으로 드러나지 않고 말 속에 숨어 들어 있다는 뜻이에요.", "hanja": "내(內 안) + 포(包 싸다)", "contextDef": "이 대담에서 다섯 번 나와요. '엘리트', '지도', '반지성주의' 같은 말 속에 숨은 평가나 태도를 짚을 때 써요.", "variants": ["내포하고", "내포하는", "내포하거든요", "내포하는 거기"], "examples": [{"kor": "그 웃음은 여러 가지 감정을 내포하고 있었어요.", "eng": "That smile held many emotions."}], "translations": {"en": {"term": "to imply, to connote", "mainDef": "For a word to carry a meaning hidden inside it rather than stated openly.", "contextDef": "Appears five times, pointing to judgments or attitudes hidden in words like 'elite', 'leading' and 'anti-intellectualism'."}}, "core": true}, {"term": "일상화", "mainDef": "일상화는 처음에는 특별하던 것이 보통의 매일 생활 속에 자리를 잡는 거예요.", "hanja": "일(日 날) + 상(常 늘) + 화(化 되다)", "contextDef": "'엘리트'라는 말이 학문이 아니라 생활 속에서 쓰이면서 뜻이 부정적으로 바뀌었다는 설명이에요.", "variants": ["일상화"], "examples": [{"kor": "스마트폰 결제가 이제 일상화되었어요.", "eng": "Paying by smartphone has now become part of everyday life."}], "translations": {"en": {"term": "becoming everyday, normalization", "mainDef": "When something once special settles into ordinary daily life.", "contextDef": "As 'elite' moved into everyday use, its meaning shifted toward the negative."}}, "core": true}, {"term": "의식", "mainDef": "의식은 어떤 일이나 사람에 대해 가진 생각, 느낌, 태도예요.", "hanja": "의(意 뜻) + 식(識 알다)", "contextDef": "말뜻이 바뀐 것보다, 그 속에 담긴 사람들의 생각과 느낌이 바뀐 것이 중요하다는 뜻이에요.", "variants": ["의식"], "examples": [{"kor": "환경에 대한 시민들의 의식이 높아졌어요.", "eng": "Citizens' awareness of the environment has grown."}], "translations": {"en": {"term": "awareness, consciousness, attitudes", "mainDef": "The thoughts, feelings and attitudes people hold toward something.", "contextDef": "What matters is the shift in people's attitudes inside the word, not the change in meaning itself."}}}, {"term": "상류층", "mainDef": "상류층은 한 사회에서 돈, 지위, 교육 수준이 가장 높은 쪽에 속하는 사람들이에요.", "hanja": "상(上 위) + 류(流 흐르다) + 층(層 층)", "contextDef": "'지배층, 엘리트'와 비슷한 무리를 가리키는 여러 이름 가운데 하나로 쓰였어요.", "variants": ["상류층"], "examples": [{"kor": "그 드라마는 상류층의 생활을 보여 줘요.", "eng": "That drama shows the lives of the upper class."}], "translations": {"en": {"term": "the upper class", "mainDef": "People at the top of society in wealth, status and education.", "contextDef": "One of several names for the same group as the 'ruling class' and 'elites'."}}, "core": true}, {"term": "권한", "mainDef": "권한은 어떤 사람이나 기관이 맡은 일을 할 수 있도록 정해 준 힘의 범위예요.", "hanja": "권(權 힘) + 한(限 한계)", "contextDef": "엘리트는 자원뿐 아니라 결정할 힘까지 혼자 쥐고 있는 무리라는 뜻이에요.", "variants": ["권한"], "examples": [{"kor": "이 문제는 제 권한 밖의 일이에요.", "eng": "This issue is outside my authority."}], "translations": {"en": {"term": "authority, powers", "mainDef": "The scope of power officially given to a person or body to do its job.", "contextDef": "Elites hold not just resources but the power to decide."}}, "core": true}, {"term": "세력", "mainDef": "세력은 어떤 일을 밀고 나갈 수 있는 힘을 가진 사람들의 무리예요.", "hanja": "세(勢 기세) + 력(力 힘)", "contextDef": "자원과 권한을 쥔 사람들을 하나의 힘 있는 무리로 부른 말이에요. 뒤에서는 '내란 세력'이라고도 써요.", "variants": ["세력"], "examples": [{"kor": "두 세력이 서로 힘을 겨루고 있어요.", "eng": "Two factions are competing for power."}], "translations": {"en": {"term": "a force, faction", "mainDef": "A group of people with the power to push things forward.", "contextDef": "Names the holders of resources and authority as a power bloc; later used in '내란 세력'."}}, "core": true}, {"term": "경멸", "mainDef": "경멸은 남을 깔보고 하찮게 여기는 마음이에요.", "hanja": "경(輕 가볍다) + 멸(蔑 업신여기다)", "contextDef": "힘 있는 사람들을 바라보는 사람들의 마음이 존중에서 경멸로 바뀌고 있다는 분석이에요. '엘리트'라는 말이 부정적으로 바뀐 까닭이 여기에 있다고 봐요.", "variants": ["경멸"], "examples": [{"kor": "거짓말을 한 정치인은 시민들의 경멸을 받았어요.", "eng": "The politician who lied earned the public's contempt."}], "translations": {"en": {"term": "contempt, scorn", "mainDef": "A feeling of looking down on someone as worthless.", "contextDef": "His analysis: the public's feeling toward the powerful is shifting from respect to contempt, which is why 'elite' has turned negative."}}, "core": true}, {"term": "포인트", "mainDef": "포인트는 이야기에서 가장 중요한 점이에요.", "contextDef": "말뜻의 변화보다 사람들 생각의 변화가 더 중요하다는 것을 강조했어요.", "variants": ["포인트"], "examples": [{"kor": "이 문제의 포인트는 시간이에요.", "eng": "The key point of this problem is time."}], "translations": {"en": {"term": "point, key point", "mainDef": "The most important point in what is being said.", "contextDef": "Stresses that the change in attitudes matters more than the change in meaning."}}}, {"term": "서울대 내란과", "mainDef": "'서울대 내란과'는 '서울대 법학과'를 비튼 말장난이에요. 2024년 12월 3일 비상계엄 사태에 서울대 법대 출신 인물이 많이 관련된 것을 비꼬아요.", "subDefs": [{"subTerm": "• 내란(內亂)", "subDef": "내(內, 안) + 란(亂, 어지럽다). 나라 안에서 정권을 무너뜨리려고 일으키는 폭동이에요."}, {"subTerm": "• 법학과(法學科)", "subDef": "법(法, 법) + 학(學, 배우다) + 과(科, 과목). 법을 공부하는 대학의 학과예요. '내란과'는 이 말을 바꾼 거예요."}], "contextDef": "한때 최고의 엘리트로 여겨지던 '서울대 법대'가 이제는 조롱거리가 되었다는 예로 들었어요.", "variants": ["서울대 내란과"], "examples": [{"kor": "내란(內亂)은 나라 안에서 정부를 무너뜨리려고 일으키는 큰 혼란이에요.", "eng": "An insurrection is a major uprising within a country aimed at overthrowing the government."}], "translations": {"en": {"term": "'SNU Department of Insurrection'", "mainDef": "A pun twisting 'SNU Department of Law', mocking how many figures tied to the December 3, 2024 martial-law crisis were SNU law graduates.", "contextDef": "His example of how 'SNU law', once the height of elite status, has become a punchline.", "subDefs": [{"subTerm": "내란 (內亂)", "subDef": "insurrection, rebellion."}, {"subTerm": "법학과 (法學科)", "subDef": "law department; '내란과' is a twist on it."}]}}}, {"term": "사전적인 의미", "mainDef": "사전적인 의미는 사전에 적혀 있는 그대로의 뜻이에요.", "subDefs": [{"subTerm": "• -적(的)", "subDef": "명사 뒤에 붙어 '그런 성질을 가진'이라는 뜻을 더해요. 예) 사전적, 역사적, 경제적."}], "contextDef": "예전에는 '서울대 법대'라고 하면 사전에 나온 뜻 그대로의 엘리트라고 칭찬했다는 거예요.", "variants": ["사전적인 의미"], "examples": [{"kor": "'선물'의 사전적인 의미는 '남에게 주는 물건'이에요.", "eng": "The dictionary meaning of '선물' is 'something you give to someone'."}], "translations": {"en": {"term": "the dictionary meaning", "mainDef": "The meaning exactly as written in the dictionary.", "contextDef": "In the past, an SNU law student was praised as an elite in the literal dictionary sense.", "subDefs": [{"subTerm": "-적 (的)", "subDef": "suffix meaning 'of that nature'."}]}}, "core": true}, {"term": "말을 했단 말이에요", "mainDef": "'-단 말이에요'라고 하면, 앞에서 한 말을 다시 힘주어 강조한다는 뜻이에요.", "subDefs": [{"subTerm": "• -ㄴ/는단 말이다", "subDef": "'-다고 하는 말이다'를 줄인 형태로, 자기 말을 강조하거나 따질 때 써요. 예) 배고프단 말이야. 다 했단 말이에요."}], "contextDef": "'옛날에는 정말 그렇게들 말했다'는 것을 듣는 사람에게 확실히 새기려는 말투예요.", "variants": ["말을 했단 말이에요"], "examples": [{"kor": "내가 어제 분명히 전화했단 말이에요.", "eng": "I'm telling you, I definitely called yesterday."}], "translations": {"en": {"term": "people really did say that, I'm telling you", "mainDef": "Saying '-단 말이에요' emphasizes again what one has just said.", "contextDef": "Drives home to the listener that people really used to talk that way.", "subDefs": [{"subTerm": "-ㄴ/는단 말이다", "subDef": "Emphatic 'I'm saying that...'."}]}}}, {"term": "조롱의 대상", "mainDef": "조롱의 대상은 사람들이 비웃고 놀리는 사람이나 것이에요.", "subDefs": [{"subTerm": "• 조롱(嘲弄)", "subDef": "조(嘲, 비웃다) + 롱(弄, 놀리다). 비웃으며 놀리는 거예요."}, {"subTerm": "• 대상(對象)", "subDef": "대(對, 마주하다) + 상(象, 모양). 어떤 행동이 향하는 사람이나 것이에요."}], "contextDef": "예전에 칭찬이던 '서울대 법대 출신'이 이제는 놀림거리가 되었다는 뜻이에요.", "variants": ["조롱의 대상"], "examples": [{"kor": "그의 이상한 머리 모양이 친구들 사이에서 조롱의 대상이 됐어요.", "eng": "His strange haircut became a joke among his friends."}], "translations": {"en": {"term": "a target of ridicule", "mainDef": "A person or thing that people laugh at and mock.", "contextDef": "Being an SNU law grad, once praise, has become something people mock.", "subDefs": [{"subTerm": "조롱 (嘲弄)", "subDef": "ridicule, mockery."}, {"subTerm": "대상 (對象)", "subDef": "object, target."}]}}, "core": true}, {"term": "자기중심주의", "mainDef": "자기중심주의는 무엇이든 자기 생각과 처지를 기준으로 보고 판단하는 태도예요.", "hanja": "자(自 스스로) + 기(己 몸) + 중(中 가운데) + 심(心 마음) + 주(主 주인) + 의(義 뜻)", "contextDef": "'내 말이 옳다'고 믿는 마음이 소통을 막는 가장 큰 원인이라는 뜻이에요.", "variants": ["자기중심주의"], "examples": [{"kor": "어린아이에게는 자기중심주의가 자연스러운 모습이에요.", "eng": "Self-centeredness is natural in young children."}], "translations": {"en": {"term": "egocentrism, self-centeredness", "mainDef": "An attitude of seeing and judging everything from your own point of view.", "contextDef": "Believing 'my words are right' is the biggest obstacle to communication."}}, "core": true}, {"term": "걸작선", "mainDef": "걸작선은 아주 훌륭한 작품만 골라 모은 것이에요.", "hanja": "걸(傑 뛰어나다) + 작(作 짓다) + 선(選 고르다)", "contextDef": "영화 유튜버 '거의없다'가 운영하는 영화 소개 영상 시리즈 이름이에요. 실제로는 망한 영화를 웃기게 소개하는 반어적인 이름이에요.", "variants": ["걸작선"], "examples": [{"kor": "이 책은 세계 명작 단편소설 걸작선이에요.", "eng": "This book is a collection of the world's finest short stories."}], "translations": {"en": {"term": "a collection of masterpieces", "mainDef": "A selection of only the finest works.", "contextDef": "The name of Geouieopda's film-review video series; ironically, it humorously covers flops."}}}, {"term": "스토리", "mainDef": "스토리는 사건이 일어난 순서대로 이어지는 이야기 그 자체예요.", "contextDef": "영화 이론에서는 스토리, 플롯, 내러티브를 나누어 쓰는데, 댓글 쓴 사람은 그 차이를 모른 채 썼다는 이야기예요.", "variants": ["스토리"], "examples": [{"kor": "이 영화는 스토리가 단순하지만 감동적이에요.", "eng": "This movie's story is simple but moving."}], "translations": {"en": {"term": "story", "mainDef": "The events themselves, in the order they happened.", "contextDef": "Film theory separates story, plot and narrative; the commenter used them without knowing the difference."}}}, {"term": "플롯", "mainDef": "플롯은 이야기의 사건들을 원인과 결과에 따라 어떤 순서와 짜임으로 보여 줄지 정한 것이에요.", "contextDef": "백재욱 씨는 '스토리의 세부 과정'이라고 했고, 이봉우 씨는 '구조'라고 했어요. 출연자들도 헷갈려하며 웃음을 만든 대목이에요.", "variants": ["플롯"], "examples": [{"kor": "이 소설은 플롯이 복잡해서 두 번 읽어야 이해돼요.", "eng": "This novel's plot is so complex that you need to read it twice."}], "translations": {"en": {"term": "plot", "mainDef": "How a story's events are arranged and connected by cause and effect.", "contextDef": "Baek calls it 'the detailed process of the story', Lee calls it 'structure': the hosts' own confusion becomes the joke."}}}, {"term": "인마", "mainDef": "인마는 '이놈아'가 줄어든 말로, 친한 사이에서 상대를 막 부르는 말이에요.", "contextDef": "이봉우 씨가 댓글 쓴 사람의 말투를 흉내 내며 장난스럽게 썼어요. 윗사람에게는 쓰면 안 돼요.", "variants": ["인마"], "examples": [{"kor": "야, 인마! 빨리 와!", "eng": "Hey, you! Hurry up!"}], "translations": {"en": {"term": "pal, buddy (rough)", "mainDef": "A rough contraction of '이놈아' used to call out to someone close.", "contextDef": "Lee imitates the commenter's tone playfully. Never use it with superiors."}}}, {"term": "세부적인 과정", "mainDef": "세부적인 과정은 큰 흐름 안에 있는 작고 자세한 단계들이에요.", "subDefs": [{"subTerm": "• 세부(細部)", "subDef": "세(細, 가늘다) + 부(部, 부분). 자세한 작은 부분이에요."}], "contextDef": "백재욱 씨가 '플롯'을 스토리 안의 자세한 흐름이라고 풀이한 부분이에요.", "variants": ["세부적인 과정"], "examples": [{"kor": "발표에서 실험의 세부적인 과정을 설명했어요.", "eng": "In the presentation, I explained the detailed steps of the experiment."}], "translations": {"en": {"term": "the detailed process", "mainDef": "The small, specific steps inside a larger flow.", "contextDef": "Baek's explanation of 'plot' as the detailed flow within a story.", "subDefs": [{"subTerm": "세부 (細部)", "subDef": "detail."}]}}}, {"term": "엄연히 말하면", "mainDef": "'엄밀히 말하면'은 아주 정확하게 따져서 말하면이라는 뜻이에요. 여기서는 '엄연히'라고 했지만 뜻으로 보면 '엄밀히'가 맞아요.", "subDefs": [{"subTerm": "• 엄밀(嚴密)", "subDef": "엄(嚴, 엄하다) + 밀(密, 빽빽하다). 빈틈없이 꼼꼼하다는 뜻이에요."}, {"subTerm": "• 엄연(儼然)", "subDef": "엄(儼, 의젓하다) + 연(然, 그러하다). 어떤 사실이 뚜렷해서 부정할 수 없다는 뜻이에요."}], "contextDef": "'엄연히'는 '누구도 부정할 수 없게 뚜렷이'라는 다른 말이에요. 말할 때 자주 섞여 쓰이는 예예요.", "variants": ["엄연히 말하면"], "examples": [{"kor": "엄밀히 말하면 토마토는 채소가 아니라 과일이에요.", "eng": "Strictly speaking, a tomato is a fruit, not a vegetable."}], "translations": {"en": {"term": "strictly speaking (said as '엄연히' instead of '엄밀히')", "mainDef": "'엄밀히 말하면' means 'to put it precisely'. He says '엄연히', but '엄밀히' is what fits.", "contextDef": "'엄연히' means 'undeniably', a different word; the two are often mixed up in speech.", "subDefs": [{"subTerm": "엄밀 (嚴密)", "subDef": "strict, precise."}, {"subTerm": "엄연 (儼然)", "subDef": "undeniable, plain."}]}}}, {"term": "전문 용어", "mainDef": "전문 용어는 어떤 분야에서 정해진 뜻으로만 쓰는 말이에요.", "subDefs": [{"subTerm": "• 전문(專門)", "subDef": "전(專, 오로지) + 문(門, 문). 한 가지 일만 깊이 하는 거예요."}, {"subTerm": "• 용어(用語)", "subDef": "용(用, 쓰다) + 어(語, 말). 어떤 분야에서 쓰는 말이에요."}], "contextDef": "이 대담의 핵심 개념이에요. 뜻이 넓게 퍼지는 일상어와 달리, 뜻의 범위가 정해진 말이에요.", "variants": ["전문적인 용어", "전문 용어"], "examples": [{"kor": "의사들은 대화할 때 전문 용어를 많이 써요.", "eng": "Doctors use a lot of technical terms when they talk."}], "translations": {"en": {"term": "technical term, jargon", "mainDef": "A word used with a fixed meaning in a particular field.", "contextDef": "A key concept here: unlike everyday words whose meanings sprawl, these have a fixed scope.", "subDefs": [{"subTerm": "전문 (專門)", "subDef": "specialty."}, {"subTerm": "용어 (用語)", "subDef": "term."}]}}, "core": true}, {"term": "용어", "mainDef": "용어는 어떤 분야에서 특별한 뜻으로 정해 쓰는 말이에요.", "hanja": "용(用 쓰다) + 어(語 말)", "contextDef": "시대가 바뀌면 말의 뜻과 그 말 자체도 바뀌어야 한다고 인정하는 부분이에요.", "variants": ["용어"], "examples": [{"kor": "이 책은 어려운 용어를 쉽게 풀어 설명해요.", "eng": "This book explains difficult terms in simple language."}], "translations": {"en": {"term": "term, terminology", "mainDef": "A word given a specific meaning in a particular field.", "contextDef": "He agrees that when times change, meanings and terms should change too."}}}, {"term": "내러티브", "mainDef": "내러티브는 이야기를 누가, 어떤 관점과 방식으로 들려주는지까지 포함한 서술이에요.", "contextDef": "정준희 교수가 영화 이론에서는 스토리, 플롯, 내러티브를 나눈다고 정리한 부분이에요.", "variants": ["내러티브"], "examples": [{"kor": "이 다큐멘터리는 강한 내러티브로 사람들을 끌어들여요.", "eng": "This documentary draws people in with a strong narrative."}], "translations": {"en": {"term": "narrative", "mainDef": "The telling of a story, including who tells it and from what point of view and in what way.", "contextDef": "Professor Jung notes that film theory separates story, plot and narrative."}}}, {"term": "구성요소", "mainDef": "구성요소는 하나의 전체를 이루는 여러 부분 가운데 하나예요.", "hanja": "구(構 얽다) + 성(成 이루다) + 요(要 중요하다) + 소(素 바탕)", "contextDef": "플롯이 스토리 안의 한 부분이라는 걸 이봉우 씨가 이해한 순간이에요.", "variants": ["구성요소"], "examples": [{"kor": "물의 구성요소는 수소와 산소예요.", "eng": "Water is made up of hydrogen and oxygen."}], "translations": {"en": {"term": "component, element", "mainDef": "One of the parts that make up a whole.", "contextDef": "The moment Lee grasps that plot is one part of a story."}}}, {"term": "속이 터지다", "mainDef": "누군가가 속이 터지면, 일이 뜻대로 되지 않아 답답하고 화가 몹시 난다는 뜻이에요.", "contextDef": "말을 정확히 아는 사람이 엉뚱하게 비판받을 때 느끼는 마음을 표현했어요.", "variants": ["속이 터지는"], "examples": [{"kor": "아무리 설명해도 못 알아들어서 속이 터질 것 같아요.", "eng": "No matter how I explain, he doesn't get it. It's driving me crazy."}], "translations": {"en": {"term": "to be fed up, to be exasperated", "mainDef": "To feel extremely frustrated and angry when things don't go your way.", "contextDef": "Describes how the person who knows the words feels when wrongly criticized."}}}, {"term": "양호하다", "mainDef": "어떤 것이 양호하면, 상태가 꽤 괜찮고 좋은 편이라는 뜻이에요.", "hanja": "양(良 좋다) + 호(好 좋다)", "contextDef": "아는 척하며 비판하는 것보다 모른다고 솔직히 묻는 태도가 훨씬 낫다는 말이에요.", "variants": ["양호해"], "examples": [{"kor": "검사 결과 건강 상태가 양호합니다.", "eng": "Your test results show you're in good health."}], "translations": {"en": {"term": "to be fine, in good condition", "mainDef": "In fairly good shape or condition.", "contextDef": "Honestly asking is far better than criticizing while pretending to know."}}}, {"term": "멍텅구리", "mainDef": "멍텅구리는 생각이나 판단을 제대로 못 하는 어리석은 사람을 놀리는 말이에요.", "contextDef": "교수가 '엉터리'와 '멍텅구리'를 섞어 '엉텅구리'라고 말했다고 백재욱 씨가 놀리는 부분이에요.", "variants": ["멍텅구리"], "examples": [{"kor": "그렇게 쉬운 것도 모르다니 나도 참 멍텅구리야.", "eng": "I didn't even know something that easy; what a dummy I am."}], "translations": {"en": {"term": "a dimwit, a dummy", "mainDef": "A teasing word for a foolish person who can't think things through.", "contextDef": "Baek teases that the professor blended '엉터리' and '멍텅구리' into '엉텅구리'."}}}, {"term": "엉텅구리", "mainDef": "엉텅구리는 '엉터리'와 '멍텅구리'가 섞여서 즉석에서 생긴 말이에요. 사전에는 없어요.", "contextDef": "교수의 말실수가 채팅창에서 유행어처럼 번지자 이를 '창조적 진화'라고 부르며 웃어요.", "variants": ["엉텅구리"], "examples": [{"kor": "오늘 채팅창에서는 '엉텅구리'라는 말이 유행했어요.", "eng": "Today 'eongteongguri' became the catchphrase in the chat."}], "translations": {"en": {"term": "'eongteongguri' (a blend coined on the spot)", "mainDef": "An improvised blend of '엉터리' (nonsense) and '멍텅구리' (dummy). Not in any dictionary.", "contextDef": "The slip spreads through the live chat like a catchphrase, and the hosts jokingly call it 'creative evolution'."}}}, {"term": "법률 용어", "mainDef": "법률 용어는 법을 만들거나 다룰 때 정해진 뜻으로 쓰는 말이에요.", "subDefs": [{"subTerm": "• 법률(法律)", "subDef": "법(法, 법) + 률(律, 규칙). 나라가 정해서 모두가 지켜야 하는 규칙이에요."}], "contextDef": "어렵다고 법률 용어를 모두 쉬운 말로 바꾸라는 요구는 말이 안 된다는 주장의 예로 들었어요.", "variants": ["법률 용어"], "examples": [{"kor": "계약서에는 낯선 법률 용어가 많아요.", "eng": "Contracts are full of unfamiliar legal terms."}], "translations": {"en": {"term": "legal terminology", "mainDef": "Words with fixed meanings used in making or handling the law.", "contextDef": "His example: demanding that all legal terms be turned into plain words is unreasonable.", "subDefs": [{"subTerm": "법률 (法律)", "subDef": "law(s)."}]}}}, {"term": "알아먹다", "mainDef": "누군가가 무엇을 알아먹으면, 그 내용을 듣고 이해한다는 뜻이에요. '알아듣다'를 조금 거칠게 말한 거예요.", "subDefs": [{"subTerm": "• -겠다고 하다", "subDef": "'-겠다'에 인용 '-고'가 붙어 남의 말이나 생각을 옮겨요. 예) 못 하겠다고 했어요. 가겠다고 해요."}], "contextDef": "수학을 못 알아듣겠으니 쉬운 말로 하라는 요구에 빗대어, 전문 용어를 없애라는 주장을 비판해요.", "variants": ["알아먹겠다고"], "examples": [{"kor": "말이 너무 빨라서 하나도 못 알아먹겠어.", "eng": "He talks so fast I can't understand a word."}], "translations": {"en": {"term": "to get it, to understand (casual)", "mainDef": "To hear something and understand it; a rough, casual form of '알아듣다'.", "contextDef": "Likens the 'get rid of jargon' demand to saying 'I can't follow math, so use easy words'.", "subDefs": [{"subTerm": "-겠다고 하다", "subDef": "quoting what someone says they will/can (not) do."}]}}}, {"term": "담을 말이 없어", "mainDef": "'그걸 담을 말이 없다'라고 하면, 그 내용을 정확히 나타낼 수 있는 단어가 없다는 뜻이에요.", "subDefs": [{"subTerm": "• 담다", "subDef": "그릇에 넣다. 생각이나 느낌을 말이나 글에 넣어 나타낸다는 뜻으로도 써요. 예) 마음을 담은 편지."}], "contextDef": "전문 개념을 표현할 단어가 일상어 안에는 없다는 이봉우 씨의 맞장구예요.", "variants": ["담을 말이 없어"], "examples": [{"kor": "그때의 기쁨은 어떤 말로도 담을 수 없어요.", "eng": "No words can capture the joy I felt then."}], "translations": {"en": {"term": "there are no words to hold it", "mainDef": "Saying '그걸 담을 말이 없다' means no word can express the idea precisely.", "contextDef": "Lee agrees: everyday language simply has no words for specialist concepts.", "subDefs": [{"subTerm": "담다", "subDef": "to put in; to convey (feelings) in words."}]}}}, {"term": "스노비즘", "mainDef": "스노비즘은 지식이나 지위가 남보다 높은 척하며 다른 사람을 깔보는 태도예요.", "contextDef": "공식을 쓰는 것을 잘난 척이라고 몰아세우는 사람의 말투를 흉내 낸 부분이에요.", "variants": ["스노비즘"], "examples": [{"kor": "비싼 와인 이름만 늘어놓는 건 스노비즘 같아요.", "eng": "Just reeling off the names of expensive wines feels like snobbery."}], "translations": {"en": {"term": "snobbery, snobbism", "mainDef": "An attitude of acting superior in knowledge or status and looking down on others.", "contextDef": "Imitates someone accusing a person who writes formulas of being a snob."}}, "core": true}, {"term": "근의 공식", "mainDef": "근의 공식은 이차방정식의 답을 구하는 수학의 식이에요.", "subDefs": [{"subTerm": "• 근(根)", "subDef": "근(根, 뿌리). 수학에서는 방정식을 참으로 만드는 값, 곧 답을 말해요."}], "contextDef": "중학교에서 배우는 이 공식처럼, 쉬운 말로 바꿀 수 없는 전문 용어가 있다는 예예요.", "variants": ["근의 공식"], "examples": [{"kor": "근의 공식만 외우면 이 문제는 쉽게 풀 수 있어요.", "eng": "If you just memorize the quadratic formula, this problem is easy."}], "translations": {"en": {"term": "the quadratic formula", "mainDef": "The math formula for solving quadratic equations.", "contextDef": "Like this middle-school formula, some technical terms simply can't be put in plain words.", "subDefs": [{"subTerm": "근 (根)", "subDef": "root (of an equation)."}]}}}, {"term": "창조적 진화", "mainDef": "창조적 진화는 새로운 것을 만들어 내며 발전해 나가는 것이에요. 원래는 철학자 베르그송의 책 제목이에요.", "subDefs": [{"subTerm": "• 창조(創造)", "subDef": "창(創, 처음 만들다) + 조(造, 짓다). 없던 것을 새로 만드는 거예요."}, {"subTerm": "• 진화(進化)", "subDef": "진(進, 나아가다) + 화(化, 되다). 생물이나 사물이 점점 발전해 가는 거예요."}], "contextDef": "'엉텅구리'라는 말실수가 새 말처럼 퍼진 것을 거창하게 불러 웃음을 주는 부분이에요.", "variants": ["창조적 진화"], "examples": [{"kor": "이 요리는 전통 음식의 창조적 진화라고 할 수 있어요.", "eng": "You could call this dish a creative evolution of traditional food."}], "translations": {"en": {"term": "creative evolution", "mainDef": "Developing by producing something new; originally the title of a book by the philosopher Bergson.", "contextDef": "A grand label for the slip '엉텅구리' spreading like a new word: a joke.", "subDefs": [{"subTerm": "창조 (創造)", "subDef": "creation."}, {"subTerm": "진화 (進化)", "subDef": "evolution."}]}}}, {"term": "해 먹다", "mainDef": "어떤 자리를 해 먹으면, 그 자리를 차지해 이익을 누린다는 뜻이에요. 남을 비꼬거나 낮춰 말할 때 써요.", "subDefs": [{"subTerm": "• -아/어 먹다", "subDef": "어떤 일을 해서 자기 이익을 챙긴다는 낮춘 말투를 만들어요. 예) 돈을 떼어 먹다, 자리를 해 먹다."}], "contextDef": "윤석열 전 대통령이 대통령 자리까지 차지했다는 것을 비꼬는 말투로 말했어요.", "variants": ["해 먹었지"], "examples": [{"kor": "그 사람은 사장 자리를 10년이나 해 먹었어요.", "eng": "That guy hogged the CEO position for a whole ten years."}], "translations": {"en": {"term": "to get (a position) and milk it (slang)", "mainDef": "To take a position and enjoy its benefits; used sarcastically or dismissively.", "contextDef": "Sarcastically notes that Yoon even got to be president.", "subDefs": [{"subTerm": "-아/어 먹다", "subDef": "a rough suffix implying doing something for selfish gain."}]}}}, {"term": "검찰총장", "mainDef": "검찰총장은 범죄를 조사하고 재판에 넘기는 나라 기관에서 가장 높은 사람이에요.", "hanja": "검(檢 검사하다) + 찰(察 살피다) + 총(總 모두) + 장(長 우두머리)", "contextDef": "윤석열 전 대통령이 대통령이 되기 전에 맡았던 자리예요.", "variants": ["검찰총장"], "examples": [{"kor": "검찰총장이 기자 회견을 열었어요.", "eng": "The prosecutor general held a press conference."}], "translations": {"en": {"term": "prosecutor general", "mainDef": "The head of the prosecution service, which investigates crimes and brings cases to court.", "contextDef": "The post Yoon held before becoming president."}}}, {"term": "명백히", "mainDef": "명백히는 의심할 여지가 없을 만큼 아주 뚜렷하게라는 뜻이에요.", "hanja": "명(明 밝다) + 백(白 희다)", "contextDef": "서울대, 대통령, 검찰총장이라는 조건을 보면 누가 봐도 지도층이라는 말이에요.", "variants": ["명백히"], "examples": [{"kor": "이건 명백히 제 잘못이에요.", "eng": "This is clearly my fault."}], "translations": {"en": {"term": "clearly, obviously", "mainDef": "So plainly that there's no room for doubt.", "contextDef": "Given SNU, the presidency and the prosecution, he's obviously in the leading class."}}}, {"term": "학력", "mainDef": "학력은 어느 학교를 어디까지 다녔는지에 대한 기록이에요.", "hanja": "학(學 배우다) + 력(歷 지나다)", "contextDef": "'서울대를 나왔다고 다 엘리트냐'며 반발하는 사람의 목소리를 흉내 냈어요.", "variants": ["학력"], "examples": [{"kor": "이 회사는 학력보다 실력을 봐요.", "eng": "This company values skill over academic background."}], "translations": {"en": {"term": "educational background", "mainDef": "A record of which schools you attended and how far you went.", "contextDef": "Imitates objectors: 'So he went to SNU — is a degree everything?'"}}, "core": true}, {"term": "직위", "mainDef": "직위는 회사나 기관에서 맡은 자리와 그 높낮이예요.", "hanja": "직(職 일) + 위(位 자리)", "contextDef": "'높은 자리에 있었다고 다 엘리트냐'는 반발을 흉내 낸 부분이에요.", "variants": ["직위"], "examples": [{"kor": "그는 직위가 높지만 늘 겸손해요.", "eng": "He holds a high position but is always humble."}], "translations": {"en": {"term": "position, rank", "mainDef": "The post you hold in a company or organization and how high it is.", "contextDef": "Imitates the objection: 'So is a title everything?'"}}, "core": true}, {"term": "지가 잘났어", "mainDef": "'지가 잘났어?'라고 하면, 그 사람이 혼자 뛰어난 척한다고 비꼬는 말이에요. '지'는 '자기'를 낮춰 말하는 사투리예요.", "subDefs": [{"subTerm": "• 잘나다", "subDef": "능력이나 모습이 남보다 뛰어나다. 반어로 '잘난 척'처럼 비꼬는 데 많이 써요."}], "contextDef": "민주주의 사회에서 대통령도 혼자 잘난 게 아니라며 반발하는 사람의 말투를 흉내 냈어요.", "variants": ["지가 잘났어"], "examples": [{"kor": "자기가 뭐 그렇게 잘났다고 남을 무시해요?", "eng": "Who does he think he is, looking down on others?"}], "translations": {"en": {"term": "he thinks he's so great? (dismissive)", "mainDef": "'지가 잘났어?' sneers that someone acts superior on his own. '지' is a rough dialect form of '자기'.", "contextDef": "Imitates objectors: 'In a democracy, the president isn't special all by himself.'", "subDefs": [{"subTerm": "잘나다", "subDef": "to be outstanding; often used sarcastically."}]}}}, {"term": "이끄는 자와 끌려가는 자", "mainDef": "이끄는 자와 끌려가는 자는 앞에서 방향을 정하는 사람과, 뜻과 상관없이 따라가야 하는 사람을 나누어 부르는 말이에요.", "subDefs": [{"subTerm": "• 이끌다", "subDef": "앞에서 방향을 잡아 데리고 가다. 예) 팀을 이끌다."}, {"subTerm": "• 끌려가다", "subDef": "자기 뜻과 다르게 억지로 따라가게 되다. 예) 경찰에 끌려가다."}, {"subTerm": "• 자(者)", "subDef": "'사람'을 뜻하는 말로, 동사 뒤에서 '-는 자'처럼 써요. 글말 느낌이 나요."}], "contextDef": "'지도'라는 말 속에 이런 위아래 관계가 숨어 있어서 요즘 민주주의에는 맞지 않는다는 설명이에요.", "variants": ["이끄는 자와 끌려가는 자"], "examples": [{"kor": "좋은 선배는 후배를 억지로 끌고 가지 않고 함께 걸어요.", "eng": "A good senior doesn't drag juniors along but walks with them."}], "translations": {"en": {"term": "leaders and those dragged along", "mainDef": "A split between people who set the direction and people who must follow regardless of their will.", "contextDef": "This hierarchy is built into the word '지도' (leading), which is why it no longer fits modern democracy.", "subDefs": [{"subTerm": "이끌다", "subDef": "to lead."}, {"subTerm": "끌려가다", "subDef": "to be dragged along (against one's will)."}, {"subTerm": "자 (者)", "subDef": "'person' (formal/written)."}]}}, "core": true}, {"term": "민주주의적인 심화", "mainDef": "민주주의적인 심화는 국민이 나라의 주인이 되는 정치가 더 깊어지고 성숙해지는 거예요.", "subDefs": [{"subTerm": "• 민주주의(民主主義)", "subDef": "민(民, 백성) + 주(主, 주인) + 주의(主義, 생각). 국민이 나라의 주인이 되는 정치 제도예요."}, {"subTerm": "• 심화(深化)", "subDef": "심(深, 깊다) + 화(化, 되다). 정도나 수준이 점점 깊어지는 거예요."}], "contextDef": "민주주의가 깊어진 오늘날의 눈으로 보면 '지도'라는 말은 예전 민주주의의 태도를 담고 있다는 뜻이에요.", "variants": ["민주주의적인 심화"], "examples": [{"kor": "시민 참여가 늘어나면서 민주주의가 더욱 깊어졌어요.", "eng": "As citizen participation grew, democracy deepened further."}], "translations": {"en": {"term": "the deepening of democracy", "mainDef": "Democracy growing deeper and more mature.", "contextDef": "From today's more mature democratic standpoint, '지도' reflects an older democratic attitude.", "subDefs": [{"subTerm": "민주주의 (民主主義)", "subDef": "democracy."}, {"subTerm": "심화 (深化)", "subDef": "deepening, intensification."}]}}}, {"term": "의사 결정", "mainDef": "의사 결정은 여러 선택지 가운데 무엇을 할지 정하는 일이에요.", "hanja": "의(意 뜻) + 사(思 생각) + 결(決 정하다) + 정(定 정하다)", "contextDef": "요즘 높은 자리의 사람은 사람들을 이끄는 게 아니라 결정할 권리를 맡고 있을 뿐이라는 뜻이에요.", "variants": ["의사 결정"], "examples": [{"kor": "팀장은 빠른 의사 결정을 해야 해요.", "eng": "A team leader has to make decisions quickly."}], "translations": {"en": {"term": "decision-making", "mainDef": "Choosing what to do among several options.", "contextDef": "People in high positions today don't lead; they merely hold the right to decide."}}, "core": true}, {"term": "문맹", "mainDef": "문맹은 글을 읽거나 쓸 줄 모르는 거예요. 그런 사람을 가리키기도 해요.", "hanja": "문(文 글) + 맹(盲 눈멀다)", "contextDef": "옛날에는 글을 모르는 사람이 많아서 지도자가 앞에서 이끌어야 집단이 돌아갔다는 설명이에요.", "variants": ["문맹"], "examples": [{"kor": "교육 덕분에 문맹인 사람이 크게 줄었어요.", "eng": "Thanks to education, the number of people who can't read has dropped sharply."}], "translations": {"en": {"term": "illiteracy", "mainDef": "Not being able to read or write; also used for such a person.", "contextDef": "In the past, with so many people unable to read, groups only worked if leaders led from the front."}}, "core": true}, {"term": "굴러가다", "mainDef": "어떤 조직이 굴러가면, 큰 문제 없이 제대로 움직이고 운영된다는 뜻이에요.", "contextDef": "지도자를 뽑지 않으면 옛날 집단은 제대로 돌아가지 않았다는 말이에요.", "variants": ["굴러가지 않지"], "examples": [{"kor": "사장님이 없어도 가게는 잘 굴러가요.", "eng": "The shop runs fine even without the owner."}], "translations": {"en": {"term": "to run, to function (of an organization)", "mainDef": "For an organization to operate properly without major problems.", "contextDef": "In the old days, a group wouldn't function without choosing a leader."}}}, {"term": "지적 자원", "mainDef": "지적 자원은 지식, 정보, 배운 사람처럼 생각하고 판단하는 데 쓰이는 귀한 것들이에요.", "subDefs": [{"subTerm": "• 지적(知的)", "subDef": "지(知, 알다) + 적(的). 지식이나 생각하는 능력과 관련된다는 뜻이에요. '잘못을 지적(指摘)하다'의 '지적'과는 한자가 달라요."}], "contextDef": "옛날에 군대나 학교 같은 곳이 중요했던 것은 지식과 정보가 그곳에 모여 있었기 때문이라는 분석이에요.", "variants": ["지적 자원"], "examples": [{"kor": "도서관은 마을의 중요한 지적 자원이에요.", "eng": "The library is an important intellectual resource for the town."}], "translations": {"en": {"term": "intellectual resources", "mainDef": "Valuable things used for thinking and judging, such as knowledge, information and educated people.", "contextDef": "The military and schools mattered because knowledge and information were concentrated there.", "subDefs": [{"subTerm": "지적 (知的)", "subDef": "intellectual (different hanja from 지적 指摘 'to point out')."}]}}}, {"term": "직관적으로", "mainDef": "직관적으로는 따져 보지 않고 바로 느낌으로 알아차려서라는 뜻이에요.", "hanja": "직(直 곧다) + 관(觀 보다) + 적(的 ~의 성질)", "contextDef": "따져 보지 않은 '느낌'을 기준으로 말의 뜻을 판단하는 태도를 비판해요.", "variants": ["직관적으로"], "examples": [{"kor": "이 앱은 직관적으로 만들어져서 설명서가 필요 없어요.", "eng": "This app is so intuitive you don't need a manual."}], "translations": {"en": {"term": "intuitively", "mainDef": "Grasping something right away by feeling, without reasoning it through.", "contextDef": "Criticizes judging word meanings by unexamined gut feeling."}}}, {"term": "절대시하다", "mainDef": "누군가가 무엇을 절대시하면, 그것만이 옳다고 여겨 의심하거나 바꾸려 하지 않는다는 뜻이에요.", "hanja": "절(絶 끊다) + 대(對 맞서다) + 시(視 보다)", "contextDef": "자기가 느끼는 일상어의 뜻만 옳다고 믿는 태도를 제발 버리라는 부탁이에요.", "variants": ["절대시하는"], "examples": [{"kor": "한 사람의 의견을 절대시하면 잘못된 결정을 하기 쉬워요.", "eng": "If you treat one person's opinion as gospel, it's easy to make the wrong call."}], "translations": {"en": {"term": "to treat as absolute", "mainDef": "To regard something as the only truth and never question or change it.", "contextDef": "He pleads with people to drop the habit of treating their gut sense of everyday words as the only truth."}}, "core": true}, {"term": "단어의 이면", "mainDef": "단어의 이면은 그 단어가 겉으로 보여 주는 뜻 뒤에 숨어 있는 다른 뜻이나 쓰임이에요.", "subDefs": [{"subTerm": "• 이면(裏面)", "subDef": "이(裏, 속) + 면(面, 면). 겉으로 잘 드러나지 않는 속의 모습이에요."}], "contextDef": "이미 안다고 생각한 단어에도 미처 몰랐던 다른 뜻이나 쓰임이 숨어 있다는 말이에요.", "variants": ["단어의 이면"], "examples": [{"kor": "화려한 성공의 이면에는 많은 노력이 있었어요.", "eng": "Behind the glamorous success lay a great deal of effort."}], "translations": {"en": {"term": "the hidden side of a word", "mainDef": "The other meanings or uses hiding behind a word's surface meaning.", "contextDef": "Even a word you think you know may hide meanings or uses you never noticed.", "subDefs": [{"subTerm": "이면 (裏面)", "subDef": "the reverse side, the hidden side."}]}}, "core": true}, {"term": "한심하다", "mainDef": "누군가가 한심하면, 하는 짓이 너무 모자라고 딱해서 기가 막힌다는 뜻이에요.", "hanja": "한(寒 차다) + 심(心 마음)", "contextDef": "논리에서 밀리고도 끝까지 인정하지 않는 사람의 태도를 비판해요.", "variants": ["한심한"], "examples": [{"kor": "시험 전날까지 게임만 한 내가 한심해요.", "eng": "I'm pathetic for gaming right up to the night before the exam."}], "translations": {"en": {"term": "pathetic, deplorable", "mainDef": "So foolish or sorry that it's shocking.", "contextDef": "Criticizes people who lose on logic but still refuse to admit it."}}}, {"term": "평등 의식", "mainDef": "평등 의식은 모든 사람이 똑같은 권리와 가치를 가진다고 여기는 생각이에요.", "subDefs": [{"subTerm": "• 평등(平等)", "subDef": "평(平, 고르다) + 등(等, 같다). 차별 없이 고르고 같은 거예요."}], "contextDef": "민주 시민의 평등 의식과, 지식의 차이를 혼동하는 것이 반지성주의의 뿌리라는 주장이에요.", "variants": ["평등 의식"], "examples": [{"kor": "어릴 때부터 평등 의식을 가르치는 게 중요해요.", "eng": "It's important to teach a sense of equality from an early age."}], "translations": {"en": {"term": "a sense of equality", "mainDef": "The belief that everyone has the same rights and worth.", "contextDef": "Confusing civic equality with differences in knowledge is, he argues, the root of anti-intellectualism.", "subDefs": [{"subTerm": "평등 (平等)", "subDef": "equality."}]}}, "core": true}, {"term": "전문성", "mainDef": "전문성은 어떤 분야를 깊이 알고 잘 다룰 수 있는 능력이에요.", "hanja": "전(專 오로지) + 문(門 문) + 성(性 성질)", "contextDef": "'사람으로서 평등한 것'과 '아는 정도가 다른 것'은 다른 문제라는 설명이에요.", "variants": ["전문성"], "examples": [{"kor": "이 일은 높은 전문성이 필요해요.", "eng": "This job requires a high level of expertise."}], "translations": {"en": {"term": "expertise", "mainDef": "The ability to know a field deeply and handle it well.", "contextDef": "Being equal as people is different from differing in how much you know."}}, "core": true}, {"term": "혼동하는 경향", "mainDef": "어떤 사람들이 두 가지를 혼동하는 경향이 있으면, 둘을 헷갈려 같은 것으로 보는 일이 자주 일어난다는 뜻이에요.", "subDefs": [{"subTerm": "• 혼동(混同)", "subDef": "혼(混, 섞다) + 동(同, 같다). 서로 다른 것을 구별하지 못하고 같은 것으로 아는 거예요."}, {"subTerm": "• 경향(傾向)", "subDef": "경(傾, 기울다) + 향(向, 향하다). 생각이나 행동이 한쪽으로 쏠리는 성질이에요."}], "contextDef": "시민으로서의 평등과 아는 정도의 차이를 사람들이 자주 섞어 생각한다는 진단이에요.", "variants": ["혼동하는 경향"], "examples": [{"kor": "사람들은 가격이 비싸면 품질도 좋다고 혼동하는 경향이 있어요.", "eng": "People tend to assume that expensive means good quality."}], "translations": {"en": {"term": "a tendency to confuse", "mainDef": "When people often mix up two things and treat them as the same.", "contextDef": "His diagnosis: people often blend civic equality with differences in knowledge.", "subDefs": [{"subTerm": "혼동 (混同)", "subDef": "confusion, mixing up."}, {"subTerm": "경향 (傾向)", "subDef": "tendency."}]}}, "core": true}, {"term": "반지성주의", "mainDef": "반지성주의는 지식과 전문가를 믿지 않고 깔보며, 배우고 생각하는 일을 가치 없게 여기는 태도예요.", "hanja": "반(反 반대하다) + 지(知 알다) + 성(性 성질) + 주(主 주인) + 의(義 뜻)", "contextDef": "이 대담 후반의 핵심어예요. 정준희 교수는 그 원인을 무지가 아니라 '건방짐'에서 찾아요.", "variants": ["반지성주의", "반지성"], "examples": [{"kor": "가짜 뉴스가 퍼지는 데에는 반지성주의도 한몫해요.", "eng": "Anti-intellectualism also plays a part in the spread of fake news."}], "translations": {"en": {"term": "anti-intellectualism", "mainDef": "An attitude that distrusts and scorns knowledge and expertise and sees learning and thinking as worthless.", "contextDef": "The key word of the second half; Professor Jung traces it not to ignorance but to arrogance."}}, "core": true}, {"term": "지성", "mainDef": "지성은 사물을 알고 생각하고 판단하는 능력이에요.", "hanja": "지(知 알다) + 성(性 성질)", "contextDef": "정준희 교수는 지성을 '내가 알 수 있는 것과 모를 수 있는 것을 가려내는 능력'이라고 정의해요.", "variants": ["지성"], "examples": [{"kor": "그는 따뜻한 마음과 높은 지성을 함께 가졌어요.", "eng": "He has both a warm heart and a sharp intellect."}], "translations": {"en": {"term": "intellect", "mainDef": "The ability to know, think and judge.", "contextDef": "He defines intellect as 'the ability to tell what you can know from what you might not know'."}}, "core": true}, {"term": "지성주의", "mainDef": "지성주의는 앎과 생각하는 힘을 중요하게 여기는 태도예요. 이 대담에서는 '반지성주의'의 반대말로 썼어요.", "hanja": "지(知 알다) + 성(性 성질) + 주(主 주인) + 의(義 뜻)", "contextDef": "지성을 가진 사람은 오히려 모르는 것이 많이 보여서 부끄러워진다는 역설을 말해요.", "variants": ["지성주의"], "examples": [{"kor": "지성주의는 끝없이 배우려는 태도에서 시작해요.", "eng": "Intellectualism starts with a desire to keep learning."}], "translations": {"en": {"term": "intellectualism", "mainDef": "An attitude that values knowledge and thinking; used here as the opposite of anti-intellectualism.", "contextDef": "The paradox: people with intellect feel ashamed because they see how much they don't know."}}, "core": true}, {"term": "건방지다", "mainDef": "누군가가 건방지면, 자기 처지에 맞지 않게 남을 얕보고 잘난 체한다는 뜻이에요.", "contextDef": "반지성주의는 몰라서가 아니라 '모르는데도 아는 사람과 같다'고 여기는 태도에서 생긴다는 핵심 주장이에요.", "variants": ["건방져서"], "examples": [{"kor": "선배한테 그렇게 말하는 건 건방져 보여요.", "eng": "Talking to a senior like that looks arrogant."}], "translations": {"en": {"term": "arrogant, cocky", "mainDef": "Looking down on others and acting superior beyond one's place.", "contextDef": "His core claim: anti-intellectualism comes not from not knowing, but from acting as if not knowing equals knowing."}}}, {"term": "한 표", "mainDef": "한 표는 선거에서 한 사람이 던질 수 있는 한 번의 선택이에요.", "contextDef": "아는 사람이든 모르는 사람이든 투표권은 똑같이 하나라는 것, 그것이 시민권적 평등이라는 설명이에요.", "variants": ["한 표"], "examples": [{"kor": "소중한 한 표를 꼭 행사하세요.", "eng": "Be sure to cast your precious vote."}], "translations": {"en": {"term": "one vote", "mainDef": "The single choice one person can cast in an election.", "contextDef": "Whether you know a lot or a little, you get exactly one vote: that is civic equality."}}, "core": true}, {"term": "시민권적 평등", "mainDef": "시민권적 평등은 한 나라에 속한 사람이라면 누구나 똑같은 권리를 가진다는 원칙이에요.", "subDefs": [{"subTerm": "• 시민권(市民權)", "subDef": "시(市, 저자) + 민(民, 백성) + 권(權, 권리). 시민으로서 가지는 권리예요."}], "contextDef": "투표에서 모두가 한 표씩 갖는 평등을 말해요. 지식의 차이와는 다른 문제라고 강조해요.", "variants": ["시민권적 평등"], "examples": [{"kor": "민주주의는 시민권적 평등 위에 서 있어요.", "eng": "Democracy rests on equal civic rights."}], "translations": {"en": {"term": "civic equality", "mainDef": "The principle that every citizen of a country holds the same rights.", "contextDef": "Equality in voting — one vote each — which he stresses is a different matter from differences in knowledge.", "subDefs": [{"subTerm": "시민권 (市民權)", "subDef": "civil rights, citizenship."}]}}, "core": true}, {"term": "모름과 앎", "mainDef": "모름과 앎은 '모르는 것'과 '아는 것'을 명사로 만들어 짝지은 말이에요.", "subDefs": [{"subTerm": "• -ㅁ/음 (명사형)", "subDef": "동사나 형용사를 명사로 만들어요. 글말 느낌이 강해요. 예) 알다 → 앎, 모르다 → 모름, 살다 → 삶."}], "contextDef": "투표권처럼 모두에게 같은 것이 아니라, 지식에서는 분명히 다른 문제라는 걸 강조해요.", "variants": ["모름과 앎"], "examples": [{"kor": "배움은 모름을 인정하는 데서 시작해요.", "eng": "Learning starts with admitting what you don't know."}], "translations": {"en": {"term": "not knowing and knowing", "mainDef": "'Not knowing' and 'knowing' paired as nouns.", "contextDef": "Stresses that, unlike voting rights, these are clearly not equal in matters of knowledge.", "subDefs": [{"subTerm": "-ㅁ/음", "subDef": "turns a verb into a noun (formal)."}]}}, "core": true}, {"term": "출발점", "mainDef": "출발점은 어떤 일이 처음 시작되는 곳이에요.", "hanja": "출(出 나가다) + 발(發 떠나다) + 점(點 점)", "contextDef": "'모름과 앎의 차이를 이해하지 못하는 것'이 반지성주의의 시작이라는 결론이에요.", "variants": ["출발점"], "examples": [{"kor": "가족의 사랑은 행복의 출발점이에요.", "eng": "A family's love is the starting point of happiness."}], "translations": {"en": {"term": "starting point", "mainDef": "The place where something first begins.", "contextDef": "Concludes that failing to grasp the gap between knowing and not knowing is where anti-intellectualism begins."}}}, {"term": "아이작 아시모프", "mainDef": "아이작 아시모프는 미국의 과학 소설 작가이자 과학 해설가예요.", "contextDef": "1980년에 미국의 반지성주의를 비판하는 유명한 글을 썼어요. 정준희 교수가 강의할 때 자주 인용하는 말이에요.", "variants": ["아이작 아시모프"], "examples": [{"kor": "아이작 아시모프는 로봇 소설로도 유명해요.", "eng": "Isaac Asimov is also famous for his robot stories."}], "translations": {"en": {"term": "Isaac Asimov", "mainDef": "An American science-fiction writer and popular-science author.", "contextDef": "Wrote a famous 1980 essay criticizing American anti-intellectualism, which Professor Jung often quotes in lectures."}}}, {"term": "무지", "mainDef": "무지는 아는 것이 없는 상태예요.", "hanja": "무(無 없다) + 지(知 알다)", "contextDef": "아시모프의 말 '나의 무지가 너의 지식과 동등하다'에서, 모르는 것을 아는 것과 같은 값으로 보는 착각을 가리켜요.", "variants": ["무지"], "examples": [{"kor": "자신의 무지를 인정하는 게 배움의 시작이에요.", "eng": "Admitting your ignorance is the beginning of learning."}], "translations": {"en": {"term": "ignorance", "mainDef": "The state of not knowing.", "contextDef": "In Asimov's line, the illusion that not knowing is worth the same as knowing."}}, "core": true}, {"term": "동등하다", "mainDef": "두 가지가 동등하면, 수준이나 값어치가 서로 같다는 뜻이에요.", "hanja": "동(同 같다) + 등(等 같다)", "contextDef": "모르는 사람의 의견과 아는 사람의 지식을 같은 무게로 보는 생각을 비판해요.", "variants": ["동등하다고"], "examples": [{"kor": "두 회사는 동등한 조건으로 계약했어요.", "eng": "The two companies signed a contract on equal terms."}], "translations": {"en": {"term": "to be equal, equivalent", "mainDef": "For two things to be the same in level or value.", "contextDef": "Criticizes treating an ignorant opinion and real knowledge as carrying the same weight."}}, "core": true}, {"term": "콘셉트", "mainDef": "콘셉트는 방송이나 작품에서 미리 정해 둔 주제나 캐릭터예요.", "contextDef": "그 출연자의 말은 방송에서 정한 역할에 따른 것이었다고 미리 밝혀 두는 말이에요.", "variants": ["콘셉트"], "examples": [{"kor": "이번 광고는 '여름 휴가'가 콘셉트예요.", "eng": "This ad's concept is 'summer vacation'."}], "translations": {"en": {"term": "concept (a planned theme or persona)", "mainDef": "A theme or character decided in advance for a show or work.", "contextDef": "He notes upfront that the guest's remark was part of a planned on-air role."}}}, {"term": "출연자", "mainDef": "출연자는 방송이나 공연에 나와서 말하거나 연기하는 사람이에요.", "hanja": "출(出 나가다) + 연(演 펴다) + 자(者 사람)", "contextDef": "예전에 함께 방송에 나왔던 한 여성이 백재욱 씨에게 기분 나쁜 말을 했던 일을 꺼내요.", "variants": ["출연자"], "examples": [{"kor": "이 프로그램은 출연자가 모두 일반인이에요.", "eng": "Everyone on this show is a regular person."}], "translations": {"en": {"term": "cast member, guest (on a show)", "mainDef": "A person who appears on a broadcast or performance.", "contextDef": "He recalls a woman on a show who made a remark that hurt him."}}}, {"term": "거의없다님", "mainDef": "'거의없다'는 백재욱 씨의 유튜브 채널 이름이자 별명이에요. '-님'은 상대를 높여 부를 때 붙여요.", "contextDef": "출연자가 '전문가인 당신이나 나나 똑같은 관객 아니냐'고 말했던 장면이에요.", "variants": ["거의없다님"], "examples": [{"kor": "구독자들은 그를 '거의없다님'이라고 불러요.", "eng": "Subscribers call him 'Mr. Geouieopda'."}], "translations": {"en": {"term": "'Mr. Geouieopda'", "mainDef": "'거의없다' is Baek Jae-wook's YouTube channel name and nickname; '-님' adds respect.", "contextDef": "The guest asking 'aren't you, the expert, and I both just audience members?'"}}}, {"term": "집어던질 뻔했습니다", "mainDef": "'-ㄹ/을 뻔하다'라고 하면, 거의 그렇게 될 상황이었지만 실제로는 그렇게 되지 않았다는 뜻이에요.", "subDefs": [{"subTerm": "• -ㄹ/을 뻔하다", "subDef": "거의 일어날 뻔했지만 일어나지 않은 일을 말해요. 예) 차에 치일 뻔했어요. 늦을 뻔했어요."}, {"subTerm": "• 집어던지다", "subDef": "손으로 집어서 세게 던지다."}], "contextDef": "그 말이 너무 기분 나빠서 손에 든 것을 던질 뻔했다고 과장해서 웃기게 말해요.", "variants": ["집어던질 뻔했습니다"], "examples": [{"kor": "길이 미끄러워서 넘어질 뻔했어요.", "eng": "The road was so slippery I almost fell."}], "translations": {"en": {"term": "I almost threw something", "mainDef": "'-ㄹ/을 뻔하다' means something nearly happened but didn't.", "contextDef": "A comic exaggeration of how much the remark annoyed him.", "subDefs": [{"subTerm": "-ㄹ/을 뻔하다", "subDef": "to almost (do/happen)."}, {"subTerm": "집어던지다", "subDef": "to grab and hurl."}]}}}, {"term": "파내다", "mainDef": "누군가가 무엇을 파내면, 묻혀 있거나 숨어 있는 것을 깊이 찾아서 꺼낸다는 뜻이에요.", "contextDef": "같은 영화를 봐도 영화 평론가가 찾아낼 수 있는 뜻과 의미가 훨씬 깊다는 비유예요.", "variants": ["파낼 수 있는"], "examples": [{"kor": "아이들이 모래 속에서 조개를 파냈어요.", "eng": "The kids dug clams out of the sand."}], "translations": {"en": {"term": "to dig out", "mainDef": "To find and pull out something buried or hidden.", "contextDef": "A metaphor: watching the same film, a critic can dig out far deeper meaning."}}}, {"term": "평론가", "mainDef": "평론가는 작품을 깊이 살펴 그 가치를 따져 글이나 말로 평가하는 사람이에요.", "hanja": "평(評 평하다) + 론(論 따지다) + 가(家 전문가)", "contextDef": "영화표 값은 똑같아도 평론가와 일반 관객은 같은 위치가 아니라는 말이에요.", "variants": ["평론가"], "examples": [{"kor": "그 영화는 평론가들에게 좋은 평가를 받았어요.", "eng": "That film got good reviews from critics."}], "translations": {"en": {"term": "critic", "mainDef": "Someone who studies works closely and judges their worth in writing or speech.", "contextDef": "Critics and regular viewers pay the same ticket price but aren't in the same position."}}}, {"term": "등치시키다", "mainDef": "누군가가 A와 B를 등치시키면, 서로 다른 두 가지를 같은 것으로 놓고 취급한다는 뜻이에요.", "hanja": "등(等 같다) + 치(値 값)", "subDefs": [{"subTerm": "• -아/어 버리다", "subDef": "어떤 일을 완전히 끝내 버리거나, 그 결과에 아쉬움이나 시원함이 있을 때 써요. 예) 다 먹어 버렸어요. 잊어버렸어요."}], "contextDef": "'나도 너만큼 안다', '너도 나만큼 모른다'며 지식의 차이를 없는 것처럼 만드는 태도를 비판해요.", "variants": ["등치시켜 버리려고"], "examples": [{"kor": "비싼 것과 좋은 것을 등치시키면 안 돼요.", "eng": "You shouldn't equate expensive with good."}], "translations": {"en": {"term": "to equate", "mainDef": "To treat two different things as the same.", "contextDef": "Criticizes erasing differences in knowledge: 'I know as much as you' / 'you know no more than me'.", "subDefs": [{"subTerm": "-아/어 버리다", "subDef": "completely / regrettably (done)."}]}}, "core": true}, {"term": "전문 분야", "mainDef": "전문 분야는 어떤 사람이 특히 깊이 알고 잘하는 영역이에요.", "subDefs": [{"subTerm": "• 분야(分野)", "subDef": "분(分, 나누다) + 야(野, 들). 여러 갈래로 나눈 영역 가운데 하나예요."}], "contextDef": "백재욱 씨에게 영화는 외모보다 더 지키고 싶은 자존심이라는 농담이에요.", "variants": ["전문 분야"], "examples": [{"kor": "제 전문 분야는 한국 근대사예요.", "eng": "My field of expertise is modern Korean history."}], "translations": {"en": {"term": "field of expertise", "mainDef": "The area a person knows especially deeply and does well.", "contextDef": "A joke: for Baek, film is a matter of pride he'd guard more than his looks.", "subDefs": [{"subTerm": "분야 (分野)", "subDef": "field, area."}]}}, "core": true}, {"term": "뭐 먹고 살아", "mainDef": "'뭐 먹고 살아'라고 하면, 그것이 없으면 생활할 방법이 없다는 뜻이에요.", "subDefs": [{"subTerm": "• 먹고살다", "subDef": "생활에 필요한 돈을 벌며 살아가다."}], "contextDef": "영화 전문성이 사라지면 영화 유튜버로 먹고살 수 없다는 농담이에요.", "variants": ["뭐 먹고 살아"], "examples": [{"kor": "회사를 그만두면 뭐 먹고 살아요?", "eng": "If I quit my job, how will I make a living?"}], "translations": {"en": {"term": "how would I make a living?", "mainDef": "Saying '뭐 먹고 살아' means there would be no way to earn a living without it.", "contextDef": "A joke: without his film expertise, he couldn't make a living as a film YouTuber.", "subDefs": [{"subTerm": "먹고살다", "subDef": "to make a living."}]}}}, {"term": "바탕에 깔려 있다", "mainDef": "어떤 생각이 바탕에 깔려 있으면, 겉으로 드러나지 않지만 그 말이나 행동 밑에 들어 있다는 뜻이에요.", "subDefs": [{"subTerm": "• 깔리다", "subDef": "바닥에 넓게 펴져 놓이다. 생각이나 감정이 밑에 자리 잡고 있다는 뜻으로도 써요."}], "contextDef": "'일부분 인정할 수도 있다'는 말 밑에 '사실은 잘생겼다'는 자신감이 숨어 있다고 놀려요.", "variants": ["바탕에 깔려 있는"], "examples": [{"kor": "그의 농담 바탕에는 따뜻한 마음이 깔려 있어요.", "eng": "Underneath his jokes lies a warm heart."}], "translations": {"en": {"term": "to underlie", "mainDef": "When a thought sits underneath words or actions without showing on the surface.", "contextDef": "They tease that under 'I might partly admit it' lies confidence that he's actually good-looking.", "subDefs": [{"subTerm": "깔리다", "subDef": "to be spread underneath; to underlie."}]}}}, {"term": "장동건", "mainDef": "장동건은 잘생긴 얼굴로 유명한 한국의 영화배우예요.", "contextDef": "'엄마가 장동건보다 잘생겼다고 했다'는 농담으로 대담을 웃음으로 마무리해요.", "variants": ["장동건"], "examples": [{"kor": "장동건은 1990년대부터 인기 배우였어요.", "eng": "Jang Dong-gun has been a popular actor since the 1990s."}], "translations": {"en": {"term": "Jang Dong-gun", "mainDef": "A Korean film actor famous for his good looks.", "contextDef": "Baek's punchline: 'My mom said I'm better-looking than Jang Dong-gun.'"}}}, {"term": "병리", "mainDef": "병리는 원래 병이 생기는 원인과 과정을 말하는데, 사회의 깊은 문제를 병에 빗대어 부를 때도 써요.", "hanja": "병(病 병) + 리(理 이치)", "contextDef": "반지성주의를 현대 사회가 앓는 가장 심각한 병 가운데 하나로 봐요.", "variants": ["병리"], "examples": [{"kor": "전문가들은 청년 고립을 사회 병리 현상으로 봐요.", "eng": "Experts see youth isolation as a social pathology."}], "translations": {"en": {"term": "pathology", "mainDef": "Originally the causes and course of a disease; also used for deep problems in society.", "contextDef": "He sees anti-intellectualism as one of modern society's most serious ills."}}}, {"term": "유익", "mainDef": "유익은 도움이 되고 이로운 것이에요.", "hanja": "유(有 있다) + 익(益 더하다)", "contextDef": "함께 지식을 쌓아 사회에 도움이 되게 하는 방향을 반지성주의가 거꾸로 뒤집는다는 말이에요.", "variants": ["유익"], "examples": [{"kor": "이 강의는 학생들에게 큰 유익을 줘요.", "eng": "This lecture is very beneficial to students."}], "translations": {"en": {"term": "benefit", "mainDef": "Something helpful and advantageous.", "contextDef": "Anti-intellectualism reverses the direction of building knowledge together for society's benefit."}}}, {"term": "기현상", "mainDef": "기현상은 보통과 달리 이상하고 놀라운 일이에요.", "hanja": "기(奇 이상하다) + 현(現 나타나다) + 상(象 모양)", "contextDef": "모를수록 더 잘난 사람이 되는 거꾸로 된 상황을 가리켜요.", "variants": ["기현상"], "examples": [{"kor": "한겨울에 꽃이 피는 기현상이 일어났어요.", "eng": "A strange thing happened: flowers bloomed in midwinter."}], "translations": {"en": {"term": "a strange phenomenon", "mainDef": "Something odd and surprising, unlike the usual.", "contextDef": "Refers to the upside-down world where the less you know, the better you think you are."}}}, {"term": "사회 전반적으로", "mainDef": "사회 전반적으로는 사회의 어느 한 부분이 아니라 거의 모든 곳에 걸쳐서라는 뜻이에요.", "subDefs": [{"subTerm": "• 전반적(全般的)", "subDef": "전(全, 모두) + 반(般, 가지) + 적(的). 어떤 일의 거의 모든 부분에 걸친다는 뜻이에요."}], "contextDef": "반지성주의가 개인을 넘어 사회 전체로 퍼졌을 때의 결과를 말해요.", "variants": ["사회 전반적으로"], "examples": [{"kor": "물가가 사회 전반적으로 올랐어요.", "eng": "Prices have gone up across society."}], "translations": {"en": {"term": "across society as a whole", "mainDef": "Throughout almost every part of society, not just one area.", "contextDef": "What happens when anti-intellectualism spreads beyond individuals to all of society.", "subDefs": [{"subTerm": "전반적 (全般的)", "subDef": "overall, general."}]}}}, {"term": "극우 집단", "mainDef": "극우 집단은 정치 생각이 아주 오른쪽 끝으로 치우친 사람들의 무리예요.", "subDefs": [{"subTerm": "• 극우(極右)", "subDef": "극(極, 끝) + 우(右, 오른쪽). 정치 생각이 오른쪽 끝에 있는 거예요."}], "contextDef": "정준희 교수는 지금 한국 사회의 극우 집단을 반지성주의가 사회 전체로 퍼진 결과로 봐요.", "variants": ["극우 집단"], "examples": [{"kor": "유럽 여러 나라에서 극우 정당이 힘을 얻고 있어요.", "eng": "Far-right parties are gaining ground in many European countries."}], "translations": {"en": {"term": "far-right groups", "mainDef": "Groups whose politics lean to the extreme right.", "contextDef": "He sees today's far-right groups in Korea as the result of anti-intellectualism spreading through society.", "subDefs": [{"subTerm": "극우 (極右)", "subDef": "far right."}]}}}, {"term": "전형적인", "mainDef": "어떤 것이 전형적이면, 그 무리의 특징을 가장 잘 보여 주는 본보기라는 뜻이에요.", "hanja": "전(典 법) + 형(型 틀) + 적(的 ~의 성질)", "contextDef": "극우 집단이 반지성주의의 특징을 고스란히 보여 준다는 말이에요.", "variants": ["전형적인"], "examples": [{"kor": "이 집은 전형적인 한옥이에요.", "eng": "This house is a typical hanok."}], "translations": {"en": {"term": "typical, textbook", "mainDef": "Being the best example of a group's characteristics.", "contextDef": "Far-right groups display all the hallmarks of anti-intellectualism."}}}, {"term": "내란 세력", "mainDef": "내란 세력은 나라 안에서 정부나 헌법 질서를 무너뜨리려 한 무리를 가리켜요.", "contextDef": "2024년 12월 비상계엄 사태와 관련된 사람들과 이를 따르는 무리를 말해요. 출연자들의 정치적 판단이 담긴 말이에요.", "variants": ["내란 세력"], "examples": [{"kor": "내란은 법으로 아주 무겁게 처벌하는 죄예요.", "eng": "Insurrection is a crime punished very severely by law."}], "translations": {"en": {"term": "insurrection forces", "mainDef": "A group that tried to overturn the government or constitutional order from within.", "contextDef": "Refers to those tied to the December 2024 martial-law crisis and their followers; the term reflects the hosts' political stance."}}}, {"term": "권력자", "mainDef": "권력자는 큰 힘을 가지고 남을 움직일 수 있는 사람이에요.", "hanja": "권(權 힘) + 력(力 힘) + 자(者 사람)", "contextDef": "반지성적인 사람들이 윤석열이라는 힘 있는 사람을 등에 업고 스스로 힘이 되었다는 설명이에요.", "variants": ["권력자"], "examples": [{"kor": "역사 속 권력자들은 비판을 싫어했어요.", "eng": "Powerful figures in history disliked criticism."}], "translations": {"en": {"term": "a person in power", "mainDef": "Someone with great power who can move others.", "contextDef": "Anti-intellectual people rode on a powerful figure and became a power themselves."}}, "core": true}, {"term": "권력화가 돼 버렸거든", "mainDef": "어떤 무리가 권력화되면, 처음에는 힘이 없던 무리가 사회를 움직이는 힘을 갖게 된다는 뜻이에요.", "subDefs": [{"subTerm": "• -화(化)", "subDef": "명사 뒤에 붙어 '그렇게 됨'이라는 뜻을 더해요. 예) 권력화, 일상화, 현대화."}, {"subTerm": "• -아/어 버리다", "subDef": "일이 완전히 끝나 버렸고, 그것이 아쉽다는 느낌을 줘요. 예) 다 팔려 버렸어요."}], "contextDef": "일상의 반지성주의가 결국 정치 권력이 되어 버렸다는 경고예요. '-어 버리다'에는 안타까움이 담겨 있어요.", "variants": ["권력화가 돼 버렸거든"], "examples": [{"kor": "작은 모임이 어느새 큰 조직이 돼 버렸어요.", "eng": "A small gathering turned into a huge organization before anyone knew it."}], "translations": {"en": {"term": "they've turned into a power", "mainDef": "When a group with no power comes to hold the power to move society.", "contextDef": "Warns that everyday anti-intellectualism has become political power; '-어 버리다' adds a note of regret.", "subDefs": [{"subTerm": "-화 (化)", "subDef": "-ization, becoming."}, {"subTerm": "-아/어 버리다", "subDef": "completely (and regrettably)."}]}}, "core": true}, {"term": "정당한 일", "mainDef": "정당한 일은 법이나 도리에 맞아 올바른 일이에요.", "subDefs": [{"subTerm": "• 정당(正當)", "subDef": "정(正, 바르다) + 당(當, 마땅하다). 이치에 맞아 올바르다는 뜻이에요."}], "contextDef": "마음에 안 든다고 부수고 다니는 행동은 옳지 않다고 분명히 해 두는 부분이에요.", "variants": ["정당한 일"], "examples": [{"kor": "정당한 일에는 정당한 대가를 받아야 해요.", "eng": "Honest work deserves fair pay."}], "translations": {"en": {"term": "a justified act", "mainDef": "Something right because it accords with the law or moral principles.", "contextDef": "Makes clear that smashing things because you dislike them is not acceptable.", "subDefs": [{"subTerm": "정당 (正當)", "subDef": "just, legitimate."}]}}}, {"term": "깨부수다", "mainDef": "누군가가 무엇을 깨부수면, 세게 쳐서 깨뜨리고 부순다는 뜻이에요.", "contextDef": "2025년 1월 서울서부지방법원 난입 사건처럼, 마음에 안 드는 것을 힘으로 부수는 행동을 가리키는 것으로 보여요.", "variants": ["깨부수고"], "examples": [{"kor": "화가 난 그는 컵을 바닥에 던져 깨부쉈어요.", "eng": "In anger, he threw the cup on the floor and smashed it."}], "translations": {"en": {"term": "to smash up", "mainDef": "To hit something hard and break it to pieces.", "contextDef": "Seems to refer to violent acts like the January 2025 storming of the Seoul Western District Court."}}}, {"term": "동일시하다", "mainDef": "누군가가 자기를 어떤 사람과 동일시하면, 그 사람과 자기를 같은 존재로 여긴다는 뜻이에요.", "hanja": "동(同 같다) + 일(一 하나) + 시(視 보다)", "contextDef": "지지자들이 윤석열과 자기를 하나로 여기며 그의 방식을 그대로 따라 한다는 분석이에요.", "variants": ["동일시해서"], "examples": [{"kor": "아이들은 좋아하는 영웅과 자기를 동일시하곤 해요.", "eng": "Children often identify with their favorite heroes."}], "translations": {"en": {"term": "to identify with", "mainDef": "To see yourself and another as the same being.", "contextDef": "Supporters identify with Yoon and copy his methods exactly."}}, "core": true}, {"term": "때려 부수는 방식", "mainDef": "때려 부수는 방식은 대화나 설득 대신 힘으로 모두 부숴 버리는 방법이에요.", "contextDef": "지지자들이 윤석열의 방식을 따라 무엇이든 힘으로 밀어붙인다는 비판이에요.", "variants": ["때려 부수는 방식"], "examples": [{"kor": "문제를 때려 부수는 방식으로 풀면 더 큰 문제가 생겨요.", "eng": "Solving problems by smashing everything creates bigger problems."}], "translations": {"en": {"term": "the smash-it-all approach", "mainDef": "Breaking everything by force instead of talking or persuading.", "contextDef": "Criticizes supporters for copying Yoon's style of forcing things through."}}}, {"term": "제멋대로 늘어나다", "mainDef": "어떤 것이 제멋대로 늘어나면, 정해진 규칙 없이 마음대로 커지거나 많아진다는 뜻이에요.", "subDefs": [{"subTerm": "• 제멋대로", "subDef": "남의 생각이나 규칙과 상관없이 자기 하고 싶은 대로."}], "contextDef": "일상어는 쓰는 사람마다 뜻을 덧붙여서 뜻의 범위가 끝없이 넓어진다는 설명이에요.", "variants": ["제멋대로 늘어나는"], "examples": [{"kor": "관리를 안 했더니 잡초가 제멋대로 자랐어요.", "eng": "I didn't take care of it, so the weeds grew wild."}], "translations": {"en": {"term": "to expand any which way", "mainDef": "To grow or multiply as it pleases, with no rules.", "contextDef": "Everyday words keep gaining meanings from each speaker, so their range spreads endlessly.", "subDefs": [{"subTerm": "제멋대로", "subDef": "as one pleases, willfully."}]}}}, {"term": "언어 습관", "mainDef": "어떤 사회에서 사람들이 오랫동안 굳어진 방식으로 특정한 표현을 반복적으로 사용하는 태도예요.", "subDefs": [{"subTerm": "• 습관(習慣)", "subDef": "습(習, 익히다) + 관(慣, 익숙하다). 여러 번 되풀이해서 몸에 밴 행동이에요."}], "contextDef": "말을 대충 쓰는 버릇이 반지성주의적인 태도로 이어질 수 있다는 경고예요.", "variants": ["언어 습관"], "examples": [{"kor": "아이들은 부모의 언어 습관을 그대로 배워요.", "eng": "Children pick up their parents' way of speaking."}], "translations": {"en": {"term": "language habits", "mainDef": "The way people in a society keep using certain expressions in patterns that have become fixed over a long time.", "contextDef": "Warns that careless word habits can lead to an anti-intellectual attitude.", "subDefs": [{"subTerm": "습관 (習慣)", "subDef": "habit."}]}}, "core": true}, {"term": "스며들다", "mainDef": "어떤 것이 스며들면, 물이 천에 배듯 조금씩 안으로 퍼져 들어간다는 뜻이에요.", "contextDef": "반지성주의가 우리도 모르는 사이에 말버릇 속으로 들어온다는 비유예요.", "variants": ["스며들면서"], "examples": [{"kor": "빗물이 벽에 스며들어서 얼룩이 생겼어요.", "eng": "Rainwater seeped into the wall and left a stain."}], "translations": {"en": {"term": "to seep in, to permeate", "mainDef": "To spread inward little by little, like water soaking into cloth.", "contextDef": "A metaphor for anti-intellectualism creeping into our speech habits unnoticed."}}}, {"term": "은연중에", "mainDef": "은연중에는 겉으로 드러나지 않게, 자기도 모르는 사이에라는 뜻이에요.", "hanja": "은(隱 숨다) + 연(然 그러하다) + 중(中 가운데)", "contextDef": "사람들이 자기도 모르게 반지성주의적인 태도를 갖게 된다는 말이에요.", "variants": ["은연중에"], "examples": [{"kor": "그의 말에는 은연중에 불만이 묻어 있었어요.", "eng": "His words quietly betrayed some dissatisfaction."}], "translations": {"en": {"term": "without realizing it, unconsciously", "mainDef": "Without showing outwardly; without even knowing it yourself.", "contextDef": "People adopt an anti-intellectual attitude without realizing it."}}}, {"term": "대놓고", "mainDef": "대놓고는 숨기거나 돌려 말하지 않고 남이 다 알 수 있게라는 뜻이에요.", "contextDef": "사람들이 겉으로는 말하지 못하지만 속으로 정준희 교수를 의심한다는 말이에요.", "variants": ["대놓고"], "examples": [{"kor": "친구가 대놓고 내 옷이 이상하다고 했어요.", "eng": "My friend told me straight out that my clothes looked weird."}], "translations": {"en": {"term": "openly, to one's face", "mainDef": "Openly, without hiding or beating around the bush.", "contextDef": "People can't say it openly, but they suspect him privately."}}}, {"term": "의심을 품다", "mainDef": "누군가가 의심을 품으면, 어떤 사람이나 일을 믿지 못하는 마음을 속에 가지고 있다는 뜻이에요.", "subDefs": [{"subTerm": "• -냐면 (구어)", "subDef": "'-냐 하면'을 줄인 말로, 질문을 던지고 바로 이어서 답할 때 써요. 예) 왜 늦었냐면, 길이 막혔어요."}, {"subTerm": "• 품다", "subDef": "가슴에 안다. 생각이나 감정을 마음속에 가지다."}], "contextDef": "반지성주의를 비판하는 교수를 '사람을 차별하는 엘리트주의자'로 의심한다는 말이에요.", "variants": ["의심을 품냐면"], "examples": [{"kor": "그의 말에 의심을 품는 사람이 많았어요.", "eng": "Many people had doubts about what he said."}], "translations": {"en": {"term": "to harbor suspicion", "mainDef": "To hold distrust of someone or something inside.", "contextDef": "People suspect the professor, a critic of anti-intellectualism, of being an elitist who looks down on others.", "subDefs": [{"subTerm": "-냐면 (spoken)", "subDef": "'If you ask why/what...' — sets up one's own answer."}, {"subTerm": "품다", "subDef": "to hold, to harbor (a feeling)."}]}}}, {"term": "엘리트주의자", "mainDef": "엘리트주의자는 뛰어난 소수가 사회를 이끌어야 하고 그들이 더 대접받아야 한다고 믿는 사람이에요.", "subDefs": [{"subTerm": "• -주의자(主義者)", "subDef": "어떤 생각이나 원칙을 굳게 믿고 따르는 사람이에요. 예) 평화주의자, 채식주의자."}], "contextDef": "반지성주의를 비판하는 교수를 사람들이 이렇게 오해한다는 말이에요.", "variants": ["엘리트주의자"], "examples": [{"kor": "그는 엘리트주의자라는 비판을 자주 받아요.", "eng": "He's often criticized as an elitist."}], "translations": {"en": {"term": "elitist", "mainDef": "Someone who believes an outstanding few should lead society and receive better treatment.", "contextDef": "How people misjudge the professor for criticizing anti-intellectualism.", "subDefs": [{"subTerm": "-주의자 (主義者)", "subDef": "-ist (a believer in an -ism)."}]}}, "core": true}, {"term": "사람을 등급으로 나누다", "mainDef": "누군가가 사람을 등급으로 나누면, 사람에게 높고 낮은 순서를 매겨 차이를 둔다는 뜻이에요.", "subDefs": [{"subTerm": "• 등급(等級)", "subDef": "등(等, 무리) + 급(級, 층). 높고 낮음에 따라 나눈 단계예요."}], "contextDef": "지성과 반지성을 구별하는 것을 사람에게 순위를 매기는 것으로 오해하는 사람들의 생각이에요.", "variants": ["사람을 등급으로 나누는"], "examples": [{"kor": "사람을 학교 성적으로만 등급을 나누면 안 돼요.", "eng": "You shouldn't rank people by school grades alone."}], "translations": {"en": {"term": "to rank people", "mainDef": "To put people into higher and lower tiers.", "contextDef": "How some misread distinguishing intellect from anti-intellect as ranking people.", "subDefs": [{"subTerm": "등급 (等級)", "subDef": "grade, rank."}]}}, "core": true}, {"term": "계급주의", "mainDef": "계급주의는 사람을 태어난 집안이나 사회적 위치에 따라 높고 낮게 나누고 다르게 대하는 생각이에요.", "subDefs": [{"subTerm": "• 계급(階級)", "subDef": "계(階, 층계) + 급(級, 층). 사회에서 신분이나 지위에 따라 나뉜 층이에요."}], "contextDef": "반지성주의를 비판하는 것과 사람을 차별하는 것은 다르다는 이봉우 씨의 반문이에요. 말을 끝맺지 못하고 흐렸어요.", "variants": ["계급주의"], "examples": [{"kor": "옛날 사회에는 계급주의가 강했어요.", "eng": "Old societies had strong class-based thinking."}], "translations": {"en": {"term": "classism", "mainDef": "The idea of dividing and discriminating against people by class or status.", "contextDef": "Lee objects that criticizing anti-intellectualism is not discrimination; he trails off mid-sentence.", "subDefs": [{"subTerm": "계급 (階級)", "subDef": "class, rank."}]}}, "core": true}, {"term": "왜곡을 해서 받아들이다", "mainDef": "누군가가 무엇을 왜곡해서 받아들이면, 원래의 뜻을 비틀어 사실과 다르게 이해한다는 뜻이에요.", "subDefs": [{"subTerm": "• 왜곡(歪曲)", "subDef": "왜(歪, 비뚤다) + 곡(曲, 굽다). 사실을 비틀어 다르게 만드는 거예요."}, {"subTerm": "• -는구나", "subDef": "새로 알게 된 사실에 놀라거나 깨달을 때 써요. 예) 비가 오는구나. 그래서 늦었구나."}], "contextDef": "'지성과 반지성을 나누는 것'을 '사람을 차별하는 것'으로 비틀어 이해한다는 걸 이봉우 씨가 깨닫는 말이에요.", "variants": ["왜곡을 해서 받아들이는구나"], "examples": [{"kor": "기사가 내 말을 왜곡해서 전했어요.", "eng": "The article twisted what I said."}], "translations": {"en": {"term": "to take in a distorted way", "mainDef": "To twist something's original meaning and understand it wrongly.", "contextDef": "Lee realizes people twist 'separating intellect from anti-intellect' into 'discriminating against people'.", "subDefs": [{"subTerm": "왜곡 (歪曲)", "subDef": "distortion."}, {"subTerm": "-는구나", "subDef": "'Oh, I see...' — expressing a realization."}]}}, "core": true}];

        const QUIZ_LIST = [{"id": "1", "textParts": ["사회과학에서 지배층은 좋다, 나쁘다는 평가와 상관없이, 사회의 자원을 ", " 권력을 행사하는 사람이나 집단을 가리켜요."], "answer": "독점하면서", "altAnswers": ["독점하며"], "hint": "귀한 것을 혼자 다 차지하고 남과 나누지 않다.", "verbHint": "기본형 '독점하다'를 뒤의 '권력을 행사하다'와 동시에 일어나는 일로 잇는 연결 형태로 바꾸세요.", "explanation": "맞아요! '독점하다'가 동시에 일어나는 일을 잇는 '-면서'와 만나 '독점하면서'가 됐어요. '독점하며'도 정답이에요. 정준희 교수는 '지배층'이 욕이 아니라, 자원을 쥐고 힘을 쓰는 위치를 가리키는 중립적인 말이라고 여러 번 강조해요.", "textParts_eng": ["In social science, regardless of any good-or-bad judgment, the ruling class means the people or groups who ", " a society's resources and wield power."], "answer_eng": "monopolize"}, {"id": "2", "textParts": ["백재욱 씨는 '그런 사람들한테 엘리트라는 말을 쓰지 말라'는 사람들이 오히려 엘리트라는 개념을 너무 ", " 받아들이고 있다고 말해요."], "answer": "순진하게", "hint": "세상일을 깊이 따져 보지 않고 보이는 대로 믿다.", "verbHint": "기본형 '순진하다'를 뒤의 동사 '받아들이다'를 꾸미는 부사 형태로 바꾸세요.", "explanation": "정확해요! '순진하다'가 동사를 꾸미는 '-게'와 만나 '순진하게'가 됐어요. '엘리트 = 훌륭한 사람'이라고만 믿는 것이야말로 그 말을 깊이 생각하지 않은 태도라는 역설적인 지적이에요.", "textParts_eng": ["Baek says that the people who insist 'don't call them elites' are actually taking the concept of an elite far too ", "."], "answer_eng": "naively"}, {"id": "3", "textParts": ["사람마다 말뜻이 다를 때, 사전 같은 레퍼런스는 모두가 기준으로 삼는 공통의 ", "이/가 돼요."], "answer": "좌표점", "hint": "지도나 그래프에서 위치를 정확하게 나타내는 한 점.", "explanation": "정답! '좌표점'이 그대로 들어가요. 각자 다른 뜻으로 쓰는 말을 한 기준에 맞춰 고정하자는 것이 정준희 교수의 비유예요. 비가 오는지 말로 다투지 말고 창문을 열어 보라는 명언과 같은 이야기예요.", "textParts_eng": ["When people's meanings differ, a reference like a dictionary becomes the shared ", " everyone uses as the standard."], "answer_eng": "coordinate point"}, {"id": "4", "textParts": ["언어를 연구하는 사람들에 따르면 '엘리트'라는 말은 원래 긍정적인 의미를 ", " 있었지만, 일상에서 쓰이면서 점점 부정적인 말로 바뀌고 있어요."], "answer": "내포하고", "hint": "어떤 뜻이나 성질을 겉으로 드러내지 않고 속에 품다.", "verbHint": "기본형 '내포하다'를 뒤의 '있다'와 이어져 상태가 계속되는 형태로 바꾸세요.", "explanation": "훌륭해요! '내포하다'가 '-고 있다'와 만나 '내포하고 있었지만'이 됐어요. 정준희 교수는 말뜻이 바뀐 것 자체보다, 그 말에 담긴 사람들의 생각이 바뀐 것이 더 중요하다고 봐요.", "textParts_eng": ["According to people who study language, 'elite' originally ", " a positive meaning, but it has been turning negative as it entered everyday use."], "answer_eng": "carried (implied)"}, {"id": "5", "textParts": ["사회적 자원과 권한을 쥔 사람들에 대한 존중이 ", "(으)로 바뀌고 있다는 것이 이 변화의 핵심이에요."], "answer": "경멸", "hint": "남을 깔보고 하찮게 여기는 마음.", "explanation": "딩동댕! '경멸'이 그대로 들어가요. '존중'의 반대편에 있는 감정이에요. '엘리트'가 나쁜 말이 된 것은 힘 있는 사람들이 실제로 실망스러웠기 때문이라는 이봉우 씨의 '현실 반영' 해석과 이어져요.", "textParts_eng": ["The heart of this change is that respect for those who hold society's resources and power is turning into ", "."], "answer_eng": "contempt"}, {"id": "6", "textParts": ["예전에는 칭찬이던 '서울대 법대 출신'이라는 말이, 이제는 '서울대 내란과'처럼 ", "의 대상이 되고 있어요."], "answer": "조롱", "hint": "남을 비웃으며 놀림.", "explanation": "그렇죠! '조롱'이 그대로 들어가요. '법학과'를 '내란과'로 비튼 말장난은, 한때 최고의 엘리트로 여겨지던 이름이 이제 비웃음거리가 되었다는 걸 보여 줘요.", "textParts_eng": ["'An SNU law graduate,' once a compliment, is now becoming an object of ", ", as in the pun 'SNU Department of Insurrection.'"], "answer_eng": "ridicule"}, {"id": "7", "textParts": ["정준희 교수는 민주 시민으로서의 평등과 아는 정도의 차이를 ", " 경향이 반지성주의를 만든다고 봐요."], "answer": "혼동하는", "hint": "서로 다른 것을 구별하지 못하고 같은 것으로 여기다.", "verbHint": "기본형 '혼동하다'를 뒤의 명사 '경향'을 꾸미는 형태로 바꾸세요.", "explanation": "퍼펙트! '혼동하다'가 명사 '경향'을 꾸미는 '-는'과 만나 '혼동하는'이 됐어요. 누구나 한 표를 갖는 '시민권적 평등'과, 지식의 문제인 '앎과 모름'은 다른 차원이라는 것이 이 대담의 핵심 주장이에요.", "textParts_eng": ["Professor Jung argues that the tendency to ", " civic equality with differences in how much people know is what creates anti-intellectualism."], "answer_eng": "confuse"}, {"id": "8", "textParts": ["아시모프는 '나의 ", "이/가 너의 지식과 동등하다'고 믿는 것을 미국 사회의 근본적인 문제라고 했어요."], "answer": "무지", "hint": "아는 것이 없는 상태.", "explanation": "정확해요! '무지'가 그대로 들어가요. 모르는 것도 아는 것과 같은 값을 가진다고 믿는 순간 배울 이유가 사라진다는 점에서, 정준희 교수는 이 생각을 반지성주의의 출발점으로 봐요.", "textParts_eng": ["Asimov said that believing 'my ", " is just as good as your knowledge' is a fundamental problem of American society."], "answer_eng": "ignorance"}, {"id": "9", "textParts": ["이봉우 씨와 백재욱 씨는 극우 지지자들이 윤석열을 자기 자신과 ", " 그와 똑같이 때려 부수는 방식을 쓴다고 비판해요."], "answer": "동일시해서", "altAnswers": ["동일시하여", "동일시해", "동일시하고"], "hint": "다른 사람을 자기와 같은 존재로 여기다.", "verbHint": "기본형 '동일시하다'를 뒤의 행동으로 이어지는 원인·순서를 나타내는 연결 형태로 바꾸세요.", "explanation": "잘하셨어요! '동일시하다'가 원인·순서를 나타내는 '-아/어서'와 만나 '동일시해서'가 됐어요. '동일시하여', '동일시해', '동일시하고'도 정답이에요. 일상의 반지성주의가 권력자를 등에 업고 정치적인 힘이 되었다는 경고예요.", "textParts_eng": ["Lee and Baek criticize far-right supporters who ", " Yoon Suk Yeol and copy his smash-it-all approach."], "answer_eng": "identify themselves with"}, {"id": "10", "textParts": ["반지성주의를 비판하는 말을, 사람을 등급으로 나누는 차별처럼 ", " 받아들이는 사람들도 있어요."], "answer": "왜곡해서", "altAnswers": ["왜곡하여", "왜곡해"], "hint": "사실을 비틀어 원래와 다르게 만들다.", "verbHint": "기본형 '왜곡하다'를 뒤의 동사 '받아들이다'의 방법을 나타내는 연결 형태로 바꾸세요.", "explanation": "정답! '왜곡하다'가 방법을 나타내는 '-아/어서'와 만나 '왜곡해서'가 됐어요. '왜곡하여', '왜곡해'도 정답이에요. 지성과 반지성을 나누는 것은 사람을 차별하는 일이 아닌데도 그렇게 비틀어 받아들인다는 것이 대담의 마지막 문제의식이에요.", "textParts_eng": ["Some people ", " criticism of anti-intellectualism and take it as discrimination that ranks people."], "answer_eng": "twist"}];
